<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fixed Income Concept Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#side{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--sheet);border-right:1px solid var(--line);overflow-y:auto;z-index:20;transform:translateX(-100%);transition:transform .18s;padding-bottom:40px}
body.side-open #side{transform:none}
#sideBack{display:none;position:fixed;inset:0;background:#0006;z-index:19}
.sd-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;position:sticky;top:0;background:var(--sheet)}
.sd-top button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:2px 9px;cursor:pointer;font:inherit}
.sd-hdr{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:8px 14px 6px;font:600 12px/1.3 inherit;color:var(--ink2);background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.sd-hdr:hover{background:var(--paper)}
.sd-caret{font-size:9px;transition:transform .15s}
.sd-hdr.collapsed .sd-caret{transform:rotate(-90deg)}
.sd-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-cnt{font-size:10px;padding:1px 6px;border-radius:9px;background:var(--paper)}
.sd-cnt.done{background:var(--ok-soft);color:var(--ok)}
.sd-grp.collapsed{display:none}
.sd-q{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 14px;font:12px/1.35 inherit;color:var(--ink2);background:none;border:0;border-left:3px solid transparent;cursor:pointer}
.sd-q:hover{background:var(--paper);color:var(--ink)}
.sd-q.active{border-left-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}
.sd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--line)}
.sd-dot.ok{background:var(--ok)}.sd-dot.bad{background:var(--bad)}
.sd-num{min-width:26px;color:var(--ink2);font-size:11px}
.sd-tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-empty{padding:14px;color:var(--ink2);font-size:13px}
@media (min-width:1000px){body.side-open{padding-left:250px}}
@media (max-width:999px){body.side-open #sideBack{display:block}}
</style>
</head>

<script id="quizdata" type="application/json">{"questions": [{"id": "CON-M1-01", "src": "개념", "module": 1, "tag": "Swap rate", "vig": null, "stem": "Discount factors are 0.97 (year 1), 0.94 (year 2), and 0.90 (year 3). The 3-year swap rate is closest to:", "opts": {"A": "3.33%", "B": "10.00%", "C": "3.56%"}, "ans": "C", "en": "L7: swap rate: fixed-rate leg of an interest rate swap\nL8: S_n = 1 − DF_n Σ DF_t\nL18: [Swap Rate 계산]\nL20: Swap Rate = (1 − 마지막 DF) ÷ 전체 DF 합\nL22: s_n = (1-DF_n)/(Σ_i=1^nDF_i)\nL24: ex. 3년 spot rate : s_3 = (1-DF_3)/(DF_1+DF_2+DF_3)\nL26: Fixed leg PV : s_3DF_1+s_3DF_2+s_3DF_3\nL27: Floating leg PV:  1-DF_3\nL28: Par swap =  s_3(DF_1+DF_2+DF_3)=1-DF_3 ", "enLabel": "오답노트 원문", "ko": "Swap rate (fixed leg) s_n = (1 − DF_n)/ΣDF = (1 − 0.90)/(0.97 + 0.94 + 0.90) = 0.10/2.81 = 3.56%. Par swap: s × ΣDF (fixed leg) = 1 − DF_n (floating leg).", "trap": "", "f": "", "why": {"A": "3.33% divides by 3 instead of the sum of discount factors (2.81).", "B": "10.00% is the numerator only (1 − DF₃)."}, "orig": "Fixed Income 오답노트 L7 · 근거 SCH R23"}, {"id": "CON-M1-02", "src": "개념", "module": 1, "tag": "Swap spread", "vig": null, "stem": "The swap spread is the swap rate minus the yield on:", "opts": {"A": "an off-the-run corporate bond", "B": "an on-the-run government bond of the same maturity", "C": "the overnight indexed swap rate"}, "ans": "B", "en": "L9: Swap spread = Swap rate − On-the-run Government bond YTM (동일 만기)", "enLabel": "오답노트 원문", "ko": "Swap spread = swap rate − on-the-run government bond YTM (same maturity). The swap rate can proxy a corporate yield.", "trap": "", "f": "", "why": {"A": "Swap spreads are measured over government yields.", "C": "MRR–OIS is a different spread."}, "orig": "Fixed Income 오답노트 L9 · 근거 ECO-M1-Q61"}, {"id": "CON-M1-03", "src": "개념", "module": 1, "tag": "Yield curve factors", "vig": null, "stem": "Ranked by how much of yield curve movement they explain, the three factors are:", "opts": {"A": "steepness > level > curvature", "B": "curvature > steepness > level", "C": "level > steepness > curvature"}, "ans": "C", "en": "L10: 금리 변동을 설명하는 정도: Level > Steepness > Curvatureㅔ\nL14: | Level | 전체 금리가 거의 같은 방향·같은 폭으로 이동 | ↕ parallel이동 |\nL15: | Steepness | 단기와 장기가 서로 다르게 움직임 → slope 변화 | ↗️ ↘️ 기울기 |\nL16: | Curvature | 중기만 단기·장기와 반대로 움직임 | ∪ / ∩ 모양 변화 |", "enLabel": "오답노트 원문", "ko": "Level: all rates move together (parallel). Steepness: short and long move differently (slope). Curvature: only the middle moves opposite to the ends.", "trap": "", "f": "", "why": {"A": "Level (parallel shifts) explains the most.", "B": "Curvature explains the least."}, "orig": "Fixed Income 오답노트 L10 · 근거 SCH R23"}, {"id": "CON-M1-04", "src": "개념", "module": 1, "tag": "Factor model yield change", "vig": null, "stem": "A 20-year bond has a level loading of 0.25 and a steepness loading of 0.10 (per one standard deviation). If the level factor rises by one standard deviation and the steepness factor by two standard deviations, the bond's yield changes by:", "opts": {"A": "+0.25%", "B": "+0.35%", "C": "+0.45%"}, "ans": "C", "en": "L74: Δyield = Σ (factor loading × factor 변화(SD 단위))\nL76: ex) two-standard-deviation increase in the steepness factor. → factor x 2  만큼 변화", "enLabel": "오답노트 원문", "ko": "Δyield = Σ(factor loading × factor change in SD units) = 0.25 × 1 + 0.10 × 2 = 0.45%.", "trap": "", "f": "", "why": {"B": "0.35% does not double the steepness loading for a two-standard-deviation move.", "A": "0.25% ignores the steepness factor."}, "orig": "Fixed Income 오답노트 L74 · 근거 ECO-M1-Q50"}, {"id": "CON-M1-05", "src": "개념", "module": 1, "tag": "Par rate and bootstrapping", "vig": null, "stem": "Bootstrapping derives zero-coupon (spot) rates from:", "opts": {"A": "par yields of coupon-paying government bonds, from earliest to latest maturity (forward substitution)", "B": "forward rates using a binomial tree", "C": "spot rates, from latest to earliest maturity (backward substitution)"}, "ans": "A", "en": "L30: Par rate = on-the-run 국채가 par에 거래될 때의 YTM\nL31: Bootstrapping\nL32: derive zero-coupon(spot) rate using par yield of coupon-paying government bond\nL33: Par yields 이용 → Zero-coupon rates계산\nL34: Earliest maturity → Latest maturity\nL35: Forward substitution\nL36: Bootstrapping: par rate로 spot rate 구하기", "enLabel": "오답노트 원문", "ko": "Par rate = YTM at which an on-the-run government bond trades at par. Bootstrapping: par yields → zero rates, earliest → latest, forward substitution.", "trap": "", "f": "", "why": {"C": "Bootstrapping works forward from the earliest maturity.", "B": "A binomial tree is not used for bootstrapping."}, "orig": "Fixed Income 오답노트 L30 · 근거 ECO-M1-Q30"}, {"id": "CON-M1-06", "src": "개념", "module": 1, "tag": "Bootstrapping calculation", "vig": null, "stem": "The 1-year par rate is 2.00% and the 2-year par rate is 3.00% (annual coupons). The 2-year spot rate is closest to:", "opts": {"A": "3.02%", "B": "2.50%", "C": "3.00%"}, "ans": "A", "en": "L37: Par bond 가격 = 1 = Σ_t=1^N-1 (c)/((1+z_t)^t) + (1+c)/((1+z_N)^N)\nL39: z_N = ( (1+c)/(1 - Σ_t=1^N-1 (c)/((1+z_t)^t)) )^1/N - 1\nL41: 5년 par bond = 100에 거래 / 1. 1~4년 쿠폰을 각자의 spot rate로 할인해서 합산 / 2. 100 − 합계 = (5년째 현금흐름 100+c의 PV)", "enLabel": "오답노트 원문", "ko": "1 = 0.03/1.02 + 1.03/(1 + z₂)² → 1.03/(1 − 0.02941) = 1.06121 → z₂ = 1.06121^(1/2) − 1 = 3.02%.", "trap": "", "f": "", "why": {"C": "3.00% is the par rate; the spot rate is slightly higher on an upward-sloping curve.", "B": "2.50% simply averages the two par rates."}, "orig": "Fixed Income 오답노트 L37 · 근거 SCH R23"}, {"id": "CON-M1-07", "src": "개념", "module": 1, "tag": "Riding the yield curve – return", "vig": null, "stem": "A 5-year zero is bought at a 4.0% yield and sold one year later as a 4-year zero at a 3.5% yield (curve unchanged). The 1-year return is closest to:", "opts": {"A": "4.00%", "B": "6.02%", "C": "3.50%"}, "ans": "B", "en": "L43: Riding the yield curve + swap spread로 수익률 구하기\nL44: zero-coupon 채권 가격 = (100)/((1+y)^n)\nL45: 연환산 수익률 = ((P_sell)/(P_buy))^1/n - 1", "enLabel": "오답노트 원문", "ko": "Price = 100/(1 + y)^n: buy 100/1.04⁵ = 82.19; sell 100/1.035⁴ = 87.14; return = 87.14/82.19 − 1 = 6.02%. Annualized return = (P_sell/P_buy)^(1/n) − 1.", "trap": "", "f": "", "why": {"A": "4.00% is the purchase yield; rolling down the curve adds return.", "C": "3.50% is the yield at sale."}, "orig": "Fixed Income 오답노트 L43 · 근거 ECO-M1-Q27"}, {"id": "CON-M1-08", "src": "개념", "module": 1, "tag": "Riding the yield curve – conditions", "vig": null, "stem": "Riding the yield curve beats a maturity-matching strategy when:", "opts": {"A": "rates are expected to rise sharply", "B": "the curve is inverted", "C": "the curve is upward sloping and its level and shape are expected to stay the same"}, "ans": "C", "en": "L50: 상승형 yield curve에서는 장기채를 매수해 시간이 지나 더 짧은 만기 구간으로 이동하는 riding the yield curve 전략이 유리하다. 상승폭이 클수록 roll-down 효과가 커짐. 현재 curve의 모양뿐 아니라 향후 level과 shape가 유지될 것이라는 전망이 중요\nL51: roll down → 예상보다 금리가 많이 오르면 채권 가격은 떨어진다.", "enLabel": "오답노트 원문", "ko": "Upward-sloping curve + expected stable level and shape → buy longer bonds and roll down; steeper slope → bigger roll-down. If rates rise more than expected, prices fall.", "trap": "", "f": "", "why": {"B": "Roll-down gains need an upward slope.", "A": "If rates rise more than expected, bond prices fall."}, "orig": "Fixed Income 오답노트 L50 · 근거 ECO-M1-Q26"}, {"id": "CON-M1-09", "src": "개념", "module": 1, "tag": "Yield curve moves", "vig": null, "stem": "A flight to quality and a tightening of monetary policy typically produce, respectively:", "opts": {"A": "bearish steepening; bullish steepening", "B": "bullish flattening; bearish flattening", "C": "bullish steepening; bearish flattening"}, "ans": "B", "en": "L46: flight to quality →  bullish flattening\nL47: 불안할수록 위험자산에서 안전자산으로 도피\nL48: 긴축적 통화정책 → bearish flattening", "enLabel": "오답노트 원문", "ko": "Flight to quality → investors buy safe long bonds → bullish flattening. Tight monetary policy → short rates rise → bearish flattening.", "trap": "", "f": "", "why": {"A": "A flight to quality lowers long yields, not raises them.", "C": "A flight to quality flattens rather than steepens the curve."}, "orig": "Fixed Income 오답노트 L46 · 근거 SCH R23"}, {"id": "CON-M1-10", "src": "개념", "module": 1, "tag": "Budget deficits and yields", "vig": null, "stem": "When government budget deficits fall, fiscal supply-side effects most likely lead to:", "opts": {"A": "higher bond yields", "B": "lower bond yields", "C": "a steeper yield curve"}, "ans": "B", "en": "L49: Budget deficit ↓ → Government borrowing ↓→ Bond supply ↓→ Bond price ↑→ Bond yield ↓", "enLabel": "오답노트 원문", "ko": "Deficit↓ → government borrowing↓ → bond supply↓ → price↑ → yield↓.", "trap": "", "f": "", "why": {"A": "Less borrowing reduces bond supply, raising prices.", "C": "The main effect is on the level of yields."}, "orig": "Fixed Income 오답노트 L49 · 근거 ECO-M1-Q39"}, {"id": "CON-M1-11", "src": "개념", "module": 1, "tag": "Spreads and their uses", "vig": null, "stem": "The TED spread is mainly used as:", "opts": {"A": "a tool to value individual credit bonds", "B": "a tool to value individual government bonds", "C": "an indicator of overall credit risk in the economy/financial system"}, "ans": "C", "en": "L55: | Z-spread | 개별 credit bond valuation → 개별 채권 |\nL56: | TED spread | 금융시장 전반의 credit risk indicator → 경제 전반 / (government bond valuation용이라고 하면 오답!) |\nL57: | MRR–OIS | Money market의 credit/liquidity risk → money market |", "enLabel": "오답노트 원문", "ko": "Z-spread → individual credit bond valuation. TED spread → economy-wide credit risk indicator. MRR–OIS → money market credit/liquidity risk.", "trap": "", "f": "", "why": {"B": "It is not used to value government bonds.", "A": "Individual credit bonds use the Z-spread."}, "orig": "Fixed Income 오답노트 L55 · 근거 ECO-M1-Q16"}, {"id": "CON-M1-12", "src": "개념", "module": 1, "tag": "YTM and expected return", "vig": null, "stem": "A bond's realized return equals its expected return (YTM) if:", "opts": {"A": "the yield curve remains flat during the holding period", "B": "the yield curve steepens", "C": "coupons are reinvested at spot rates"}, "ans": "A", "en": "L59: If the yield curve remains flat during the holding period, realized return = expected return.\nL60: Yield curve가 flat ⇒  모든 maturity의 금리가 동일하다", "enLabel": "오답노트 원문", "ko": "If the curve stays flat (all maturities same rate), realized return = expected return.", "trap": "", "f": "", "why": {"B": "A steepening curve changes reinvestment rates and prices.", "C": "Coupons must be reinvested at the YTM."}, "orig": "Fixed Income 오답노트 L59 · 근거 ECO-M1-Q68"}, {"id": "CON-M1-13", "src": "개념", "module": 1, "tag": "Rate volatility by maturity", "vig": null, "stem": "Typically, short-term interest rate volatility is:", "opts": {"A": "higher than long-term interest rate volatility", "B": "lower than long-term volatility", "C": "equal to long-term volatility"}, "ans": "A", "en": "L61: Short-term rate volatility > Long-term rate volatility", "enLabel": "오답노트 원문", "ko": "Short-term rate volatility > long-term rate volatility.", "trap": "", "f": "", "why": {"B": "Short rates react more to policy and news.", "C": "The term structure of volatility is usually downward sloping."}, "orig": "Fixed Income 오답노트 L61 · 근거 SCH R23"}, {"id": "CON-M1-14", "src": "개념", "module": 1, "tag": "Term structure theories", "vig": null, "stem": "Under the liquidity preference theory, forward rates are:", "opts": {"A": "equal to expected future spot rates", "B": "higher than expected future spot rates, because they include a liquidity premium", "C": "unrelated to expected future spot rates"}, "ans": "B", "en": "L62: Pure Expectations Theory → Risk-free asset에만 적용 / \nL66: | Pure Expectations | Risk-neutral + risk-free / 미래 short-term rates에 대한 기대 / →  risk-free assets에만 적용 | Forward = Expected spot |\nL67: | Liquidity Preference | Expected future rates + liquidity premium | Forward > Expected spot |\nL68: | Segmented Markets | 만기별 시장 분리.  각 수요·공급으로 금리 결정 | 특정 관계 가정 X |\nL69: | Preferred Habitat | 만기 선호 + 보상 시 이동 | Risk premium 존재 가능 |", "enLabel": "오답노트 원문", "ko": "Pure expectations: forward = expected spot (risk-free assets only). Liquidity preference: forward > expected spot. Segmented markets: separate supply/demand by maturity. Preferred habitat: preferred maturities, move if compensated.", "trap": "", "f": "", "why": {"A": "Equality is the pure expectations theory (risk-neutral, risk-free assets).", "C": "Segmented markets assume no specific relation."}, "orig": "Fixed Income 오답노트 L62 · 근거 ECO-M1-Q36"}, {"id": "CON-M1-15", "src": "개념", "module": 1, "tag": "Holding-period return when forwards are realized", "vig": null, "stem": "If the forward curve is realized exactly, the 1-year holding-period return on any bond equals:", "opts": {"A": "today's 1-year spot rate", "B": "the longest forward rate", "C": "the bond's YTM"}, "ans": "A", "en": "L71: Forward curve 실현 + Zero-coupon bond → HPR = spot rate\nL73: Forward curve가 정확하게 실현된다면, Zero-coupon bond의 1년 holding-period return = 오늘의 1년 spot rate\nL108: Forward curve가 정확하게 실현된다면 모든 채권의 1년 holding-period return = 오늘의 1년 spot rate\nL110: zero-coupon뿐 아니라 만기·쿠폰 무관하게 성립\nL111: forward rate는 시장이 이미 반영한 미래 금리이므로, 그대로 실현되면 어떤 채권을 사도 무위험 1년 수익률만 얻음", "enLabel": "오답노트 원문", "ko": "Forward curve realized → every bond (zero or coupon, any maturity) earns the 1-year spot rate over one year.", "trap": "", "f": "", "why": {"C": "YTM is not the 1-year return when forwards are realized.", "B": "Each bond earns only the risk-free 1-year rate."}, "orig": "Fixed Income 오답노트 L71 · 근거 SCH R23"}, {"id": "CON-M2-01", "src": "개념", "module": 2, "tag": "Types of arbitrage", "vig": null, "stem": "Selling a bond's strips for more than the whole bond costs illustrates which arbitrage principle?", "opts": {"A": "Dominance", "B": "Value additivity", "C": "Put–call parity"}, "ans": "B", "en": "L80: Arbitrage Opportunity\nL82: Dominance : 동일 성격 자산의 가격이 다를 때 (ex.  Two Risk-Free Assets 가격 비교)\nL83: Value Additivity Principle : 전체 ≠ 부분의 합(strip/reconstitution)", "enLabel": "오답노트 원문", "ko": "Dominance: same-risk assets priced differently. Value additivity: whole ≠ sum of parts (stripping/reconstitution).", "trap": "", "f": "", "why": {"A": "Dominance compares two assets with the same risk but different prices.", "C": "Put–call parity is an option relation."}, "orig": "Fixed Income 오답노트 L80 · 근거 SCH R24"}, {"id": "CON-M2-02", "src": "개념", "module": 2, "tag": "Purpose of tree calibration", "vig": null, "stem": "A binomial interest rate tree is calibrated so that:", "opts": {"A": "it identifies mispriced benchmark bonds", "B": "it values benchmark (option-free) bonds at their market prices, making it arbitrage-free", "C": "it values the bond being analyzed at its market price"}, "ans": "B", "en": "L84: Binomial tree calibration\nL86: binomial tree의 금리를 현재 spot curve와 일치하도록 맞춰 서benchmark bond의 가격이 spot-rate 방식의 가격과 일치하는지 확인 → arbitrage-free 인지 검증\nL87: Calibration된 interest rate tree → embedded option bond valuation 가능\nL88: Spot rate만 있으면→ embedded option에는 부적합 (option-free bond 가격 산정만 가능)\nL91: Calibrated tree: Σ PV(benchmark CF on tree) = benchmark market price\nL93: Calibration = 트리를 벤치마크의 시장 가격에 맞춰 놓는 것 → arbitrage-free tree가 됨.\nL94: 체중계를 쓰기 전에 1kg짜리 추(benchmark bond)를 올려서 1kg이 나오도록 영점을 맞추는 것. → tree = spot curve와 동일해짐\nL137: Calibration\nL139: log-normality, volatility assumption, benchmark bond의 observed market value와 일치하도록 하는 과정\nL141: being evaluated(평가 대상)bond 가격에 맞춰 calibration하면 mispricing 발견 불가", "enLabel": "오답노트 원문", "ko": "Calibration: tree rates match the current spot curve so benchmark bonds price at market → arbitrage-free tree that can value embedded options. Spot rates alone value only option-free bonds.", "trap": "", "f": "", "why": {"C": "Calibrating to the bond under study would hide any mispricing.", "A": "Benchmarks are assumed correctly priced."}, "orig": "Fixed Income 오답노트 L84 · 근거 ECO-M2-Q5"}, {"id": "CON-M2-03", "src": "개념", "module": 2, "tag": "Option-free bond: tree vs spot curve", "vig": null, "stem": "For an option-free bond, values from a properly calibrated binomial tree and from the spot curve are:", "opts": {"A": "lower with the tree", "B": "higher with the tree", "C": "the same"}, "ans": "C", "en": "L89: binomial tree is based on the spot rate curve and a no arbitrage condition →  any option-free bond should have the same value whether using the spot rate curve or the binomial tree\nL134: Option-free → spot curve ⭕ / properly calibrated binomial tree ⭕ → 둘의 가격 동일\nL146: → calibration만 제대로 되어 있으면 트리와 spot rate는 같은 값을 냄\nL155: V(tree) = V(spot rate) ⟺ calibration 완료\nL157: 트리와 spot rate가 다른 값을 낼 수 있는 조건은 단 하나 — calibration이 안 된 경우\nL158: Calibration이 되어 있다 = 트리가 benchmark bond을 Market Price로 평가한다  = 트리가 arbitrage-free다 = 트리와 spot curve가 같은 시장 정보를 담고 있다 → 같은 값\nL183: Option-free 채권이면 트리 값 = spot rate 값. 다르면 계산 실수이거나 calibration 문제.\nL199: \"option-free\" + \"arbitrage-free(또는 calibrated)\" → same pricing\nL201: option-free — 현금흐름이 확정 → 경로가 여럿이어도 결과가 같음\nL202: arbitrage-free binomial lattice — calibration이 되어 있다\nL203: using the zero-coupon yield curve and pricing using an arbitrage-free binomial lattice are arbitrage free → price 같음\nL204: 트리 값 = spot 값\nL206: 두 방법이 다른 값을 냈다면? → 모델이 고장난 것(calibration 문제)\nL207: volatility가 option-free 가치에 영향 X\nL208: \"트리와 spot이 언제 달라지나?\" → calibration이 안 됐을 때만\nL209: 트리 값이 spot보다 높나 낮나? → 같다(same)\nL211: ⇒ 두 방법 모두 arbitrage-free이기 때문.\nL213: 값이 다르면 싼 쪽에서 사고 비싼 쪽에서 팔아 무위험 이익 → 정의상 arbitrage-free가 아니게 됨 / = \"둘 다 arbitrage-free\"라는 전제가 이미 \"값이 같다\"를 함축\nL214: 축: 트리는 spot curve를 다르게 표현한 것. calibration이 트리를 spot curve에 묶어둠.\nL215: 답이 달라지는 경우는 이 조건이 깨질 때뿐: / option-free가 아님 → 옵션이 있으면 값이 다름 / arbitrage-free가 아님 → calibration 안 된 트리", "enLabel": "오답노트 원문", "ko": "Option-free + arbitrage-free (calibrated) → same price. If they differ, it is a calculation or calibration error. Volatility does not affect option-free value.", "trap": "", "f": "", "why": {"B": "Both are arbitrage-free, so they must agree.", "A": "They differ only if the tree is not calibrated."}, "orig": "Fixed Income 오답노트 L89 · 근거 SCH R24"}, {"id": "CON-M2-04", "src": "개념", "module": 2, "tag": "Rates used for an N-year bond", "vig": null, "stem": "Valuing a 3-year annual-pay bond on a binomial tree uses the one-year forward rates at:", "opts": {"A": "Today only", "B": "Year 1, Year 2, and Year 3", "C": "Today, Year 1, and Year 2"}, "ans": "C", "en": "L96: N년 채권은 Today부터 Year N−1 열까지의 금리를 사용 (3년 채권: Today, Year 1, Year 2 )", "enLabel": "오답노트 원문", "ko": "An N-year bond uses rates from Today through Year N − 1.", "trap": "", "f": "", "why": {"B": "The last cash flow at Year 3 is discounted using the Year 2 rate.", "A": "Later cash flows need later rates."}, "orig": "Fixed Income 오답노트 L96 · 근거 SCH R24"}, {"id": "CON-M2-05", "src": "개념", "module": 2, "tag": "Ho–Lee model", "vig": null, "stem": "Which term structure model can be calibrated to closely fit an observed yield curve?", "opts": {"A": "The Ho–Lee model", "B": "The Vasicek model", "C": "The Cox–Ingersoll–Ross model"}, "ans": "A", "en": "L97: Ho–Lee model →  arbitrage free ,\nL98: can be calibrated to closely match the observed term structure.", "enLabel": "오답노트 원문", "ko": "Ho–Lee is arbitrage-free and can be calibrated to the observed term structure.", "trap": "", "f": "", "why": {"B": "Vasicek is an equilibrium model.", "C": "Cox–Ingersoll–Ross is an equilibrium model."}, "orig": "Fixed Income 오답노트 L97 · 근거 ECO-M2-Q19"}, {"id": "CON-M2-06", "src": "개념", "module": 2, "tag": "Binomial tree vs Monte Carlo", "vig": null, "stem": "Which method is suited to path-dependent cash flows such as mortgage-backed securities?", "opts": {"A": "Spot-rate discounting", "B": "Binomial tree backward induction", "C": "Monte Carlo simulation"}, "ans": "C", "en": "L100: |  | Binomial Tree | Monte Carlo |\nL102: | Path | 모든 가능한 path | 많은 path를 random simulation |\nL103: | Calibration | O | O |\nL104: | Path-dependent CF | ❌ | ⭕ path-dependent cf에 유용 |\nL105: | Embedded option | ⭕ | ⭕ |\nL106: | 계산 방식 | Tree의 모든 path/node | Simulation 결과 /  |\nL112: Option-free 채권은 현금흐름이 확정 → spot rate 할인으로 충분, 트리 불필요. / Callable/putable은 현금흐름이 미래 금리에 의존 → 금리 시나리오를 전부 펼쳐놔야 함→이항 트리 필요\nL132: 평가방법 적용 대상\nL134: Option-free → spot curve ⭕ / properly calibrated binomial tree ⭕ → 둘의 가격 동일\nL135: Embedded option O → Tree or Monte Carlo만 (spot rate 불가) / 이유: 현금흐름이 interest rate dependent. spot 방식의 대전제는 \"현금흐름 확정\"\nL136: MBS → Monte Carlo만 / 이유: 현금흐름이 path dependent. 금리 6%→4%→6%→4%일 때 첫 4%에서 이미 refinancing한 사람이 많아 두 번째 4%의 prepayment가 더 적음. 트리는 path independent를 가정.\nL164: | Path | 노드에서 접어옴  / (경로 개별계산 ❌) | 모든 가능한 path | 많은 path를 random simulation |\nL166: | Calibration | ⭕ | ⭕ | ⭕ (drift adjustment 형태) |\nL167: | Path-dependent CF | ❌ | ❌ | ⭕ 여기에 유용 |\nL168: | Embedded option | ⭕ | ⭕ | ⭕ |", "enLabel": "오답노트 원문", "ko": "Option-free → spot curve or calibrated tree. Embedded options → tree or Monte Carlo. MBS (path-dependent prepayments) → Monte Carlo only.", "trap": "", "f": "", "why": {"B": "Trees assume path independence.", "A": "Spot-rate discounting needs fixed cash flows."}, "orig": "Fixed Income 오답노트 L100 · 근거 SCH R24"}, {"id": "CON-M2-07", "src": "개념", "module": 2, "tag": "Building the tree", "vig": null, "stem": "Building a binomial interest rate tree requires:", "opts": {"A": "a deterministic forecast of future rates", "B": "current interest rates (benchmark curve), a volatility assumption, and an interest rate model", "C": "the market price of the bond being valued"}, "ans": "B", "en": "L113: Tree 구성 3요소: Current interest rates(= 현재 벤치마크 커브) + Volatility 가정 + Interest rate model\nL115: forward rate on tree is consistent with the current benchmark curve\nL116: interest rate model의 factors → random/stochastic\nL118: \"predictable paths\", \"deterministic\", \"certain\" → 오답 / → 이유: 금리가 예측 가능하면 가지가 갈라질 이유가 없어 트리 자체가 불필요, 콜 행사 여부도 오늘 확정되어 embedded option 가치가 0이 됨. 불확실성이 옵션 가치의 원천\nL142: 의존 요소 3가지: volatility 가정 + interest rate model + benchmark bond의 관측 시장가치", "enLabel": "오답노트 원문", "ko": "Tree inputs: current benchmark curve + volatility + interest rate model; tree forward rates are consistent with the benchmark curve. Model factors are random (stochastic); 'predictable/deterministic' is wrong.", "trap": "", "f": "", "why": {"C": "Using the bond's own price would hide mispricing.", "A": "Rates are random; a certain path makes the tree pointless."}, "orig": "Fixed Income 오답노트 L113 · 근거 SCH R24"}, {"id": "CON-M2-08", "src": "개념", "module": 2, "tag": "Estimating volatility", "vig": null, "stem": "Interest rate volatility for a tree can be estimated using:", "opts": {"A": "the bond's coupon rate", "B": "the bond's credit rating", "C": "historical rate volatility or implied volatility from interest rate derivative prices"}, "ans": "C", "en": "L119: Volatility 추정 두 가지 방법 / ① historical interest rate volatility / ② implied volatility (interest rate derivatives의 market price 이용)\nL120: iterative(시행착오) 과정 — 가격이 안 맞으면 다른 forward rate 쌍을 골라 반복\nL122: if this doesn’t produce the correct price, another pair of forward rates is selected and the process is repeated", "enLabel": "오답노트 원문", "ko": "Volatility: (1) historical interest rate volatility or (2) implied volatility from interest rate derivatives. Calibration is iterative: if the price does not match, try another pair of forward rates.", "trap": "", "f": "", "why": {"A": "The coupon rate does not measure volatility.", "B": "Ratings do not measure rate volatility."}, "orig": "Fixed Income 오답노트 L119 · 근거 SCH R24"}, {"id": "CON-M2-09", "src": "개념", "module": 2, "tag": "Calibration rules", "vig": null, "stem": "In a calibrated lognormal tree, adjacent one-year forward rates in the same period are:", "opts": {"A": "equal", "B": "one standard deviation apart", "C": "two standard deviations apart (multiplied by e^(2σ))"}, "ans": "C", "en": "L143: 3원칙 / ① 트리로 계산한 benchmark bond 가치 = 그 채권의 market price / ② 같은 기간 인접 forward rate는 2 표준편차 차이 (승수 e^2σ) / ③ 각 기간 중간 forward rate ≈ 벤치마크 spot curve에서 유도된 implied forward rate\nL144: Framework 성질: lognormal random walk / (1) 금리 비음수 / (2) 고금리에서 고변동성 / (3) right-skewed → 트리가 implied forward curve 주위로 퍼지되 약간 더 높게 형성\nL159: binomial tree spreads out around the forward rate curve\nL185: correctly calibrated binomial interest rate tree most likely spreads out around the forward rate curve\nL187: 평균> implied forward rate (lognormal assumption 때문에)", "enLabel": "오답노트 원문", "ko": "Rules: (1) tree values benchmark bonds at market; (2) adjacent rates 2σ apart (e^(2σ)); (3) middle rate ≈ implied forward rate from the spot curve. Lognormal: rates non-negative, higher volatility at higher rates, right-skewed → tree spreads around the forward curve, slightly higher.", "trap": "", "f": "", "why": {"B": "The spacing is two standard deviations.", "A": "Rates differ to reflect volatility."}, "orig": "Fixed Income 오답노트 L143 · 근거 SCH R24"}, {"id": "CON-M2-10", "src": "개념", "module": 2, "tag": "Volatility and bond values", "vig": null, "stem": "If interest rate volatility in the tree increases, which value is unchanged?", "opts": {"A": "An option-free bond's value", "B": "A callable bond's value", "C": "A putable bond's value"}, "ans": "A", "en": "L127: |  | Volatility ↑ 시 |\nL129: | Option-free bond | 변화 없음 ❌ |\nL130: | Embedded-option bond | 변화 있음 ⭕ |\nL131: option-free는 변화 없는 이유: / Binomial tree는 volatility가 얼마든 현재 spot curve에 calibration되어 있음. / Volatility는 트리의 모양(퍼지는 정도)만 바꿀 뿐, calibration된 이상 option-free bond의 가치는 spot-rate valuation과 반드시 동일해야 함.(현금흐름이 확정이라 어느 경로를 타든 결과가 같고, 평균 내면 결국 같은 값)\nL147: 중요 비대칭: volatility 가정이 필요한 건 트리뿐.\nL149: spot↔forward 변환은 (1+S₂)²=(1+S₁)(1+f₁,₁)의 순수 산술이라 변동성이 개입할 여지 없음. → \"양쪽 volatility가 같으면\"이라는 조건문은 애초에 성립 불가.\nL150: Volatility ↑ → 트리가 넓어짐\nL152: 옵션 가치 ↑              ← 여기만 변함\nL153: option-free 가치: 불변   ← calibration이 흡수\nL154: 벤치마크 가치: 불변       ← 벤치마크는 option-free", "enLabel": "오답노트 원문", "ko": "Volatility↑ → tree widens → option values↑; option-free and benchmark values unchanged (calibration absorbs it). Volatility is needed only for the tree, not for spot↔forward conversion.", "trap": "", "f": "", "why": {"B": "Higher volatility raises the call option value, lowering the callable bond's value.", "C": "Higher volatility raises the put value, raising the putable bond's value."}, "orig": "Fixed Income 오답노트 L127 · 근거 SCH R24"}, {"id": "CON-M2-11", "src": "개념", "module": 2, "tag": "Pathwise valuation paths", "vig": null, "stem": "A binomial tree for a 4-year bond (annual periods) has how many unique interest rate paths?", "opts": {"A": "8", "B": "16", "C": "4"}, "ans": "A", "en": "L165: | Path 개수 | — | 2^(n−1)개 | 임의 (다수) |\nL170: Path 개수: n기간 → 2^(n−1)개. ex. 4년 만기 → 2³ = 8개\nL171: Backward induction과 pathwise는 답이 동일 — 계산 절차만 다름\nL173: Pathwise → 경로를 명시적으로 다 계산", "enLabel": "오답노트 원문", "ko": "Pathwise valuation uses all 2^(n−1) paths; backward induction and pathwise give the same answer.", "trap": "", "f": "", "why": {"B": "16 = 2⁴; the number of paths is 2^(n−1).", "C": "4 = 2²; the number of paths is 2³ for n = 4."}, "orig": "Fixed Income 오답노트 L165 · 근거 SCH R24"}, {"id": "CON-M2-12", "src": "개념", "module": 2, "tag": "Monte Carlo drift adjustment", "vig": null, "stem": "In Monte Carlo valuation, if the simulated value of benchmark bonds is above their market price, the model:", "opts": {"A": "adds a constant to the rates in a pathwise valuation", "B": "subtracts a constant from all simulated rates", "C": "adds a constant to all simulated rates (drift adjustment)"}, "ans": "C", "en": "L174: Monte Carlo → limited (fixed) number of interest rate paths out of all possible paths simulation 필요\nL176: binomial tree → all paths on the interest rate tree are considered.\nL177: interest rate path : probability distribution & volatility assumption에 따라 생성됨\nL178: Monte Carlo는 drift adjustment로 arbitrage-free달성(calibration)\nL180: 무작위 표본이라 평균이 벤치마크 가격과 맞는 건 우연 → 모든 금리에 상수를 더해벤치마크 가격과 일치하도록 calibration 필요\nL181: 시뮬레이션 값 > 시장가격 →  모든 path의 금리에서 상수를 뺌 (시뮬레이션 값이 낮으면 더함) / → 결과물이 drift adjusted model / → pathwise에는 이 조정이 없음. \"pathwise에 상수를 더한다\"고 쓰면 오답.\nL182: Monte Carlo는 mean reversion 개념에 근거해 금리에 상한·하한을 둘 수 있음", "enLabel": "오답노트 원문", "ko": "Monte Carlo samples a limited number of paths; calibrate by adding (subtracting) a constant to all rates when the value is too high (too low) → drift-adjusted model. Bounds on rates can reflect mean reversion. ※ Note line 181 says to subtract when the value is too high; Schweser and ECO say add.", "trap": "", "f": "", "why": {"B": "Subtracting would raise values further; a value that is too high needs higher rates. Note line 181 states the reverse.", "A": "Pathwise valuation has no drift adjustment."}, "orig": "Fixed Income 오답노트 L174 · 근거 SCH R24 / ECO-M2-Q28"}, {"id": "CON-M2-13", "src": "개념", "module": 2, "tag": "Sequence from benchmark prices to the tree", "vig": null, "stem": "Which sequence builds a binomial tree from market data?", "opts": {"A": "spot curve → benchmark prices → tree", "B": "benchmark prices → par curve → bootstrapping → spot curve → forward curve → tree", "C": "tree → forward curve → spot curve → par curve"}, "ans": "B", "en": "L160: 벤치마크 채권 가격 → par curve → bootstrapping → spot curve → forward curve → 트리\nL184: current market price는 트리를 calibration할 때 맞추는 목표. node 계산 시작점 X", "enLabel": "오답노트 원문", "ko": "Benchmark bond prices → par curve → bootstrap spot curve → forward curve → tree. The current market price is the calibration target, not where node calculations start.", "trap": "", "f": "", "why": {"C": "The tree is the final product, not the starting point.", "A": "The market price is the calibration target, not a node starting point."}, "orig": "Fixed Income 오답노트 L160 · 근거 SCH R24"}, {"id": "CON-M2-14", "src": "개념", "module": 2, "tag": "Arbitrage-free methods", "vig": null, "stem": "How does each method achieve arbitrage-free valuation?", "opts": {"A": "Spot discounting is inherently arbitrage-free; a binomial tree by calibration; Monte Carlo by drift adjustment", "B": "All three need drift adjustment", "C": "Only Monte Carlo can be arbitrage-free"}, "ans": "A", "en": "L216: Calibration= 트리가 벤치마크 채권을 시장가격대로 평가하도록 노드 금리를 맞추는 작업\nL217: Arbitrage-free = 그 결과로 얻어지는 성질\nL218: Arbitrage-free (성질) / ├─ Spot curve 할인 → 태생적으로 arbitrage-free / ├─ Binomial tree  → calibration을 통해 달성 / └─ Monte Carlo    → drift adjustment를 통해 달성", "enLabel": "오답노트 원문", "ko": "Arbitrage-free: spot curve (by construction), binomial tree (calibration), Monte Carlo (drift adjustment).", "trap": "", "f": "", "why": {"B": "Drift adjustment is specific to Monte Carlo.", "C": "Spot discounting and calibrated trees are arbitrage-free too."}, "orig": "Fixed Income 오답노트 L216 · 근거 SCH R24"}, {"id": "CON-M3-01", "src": "개념", "module": 3, "tag": "Embedded options – rate moves", "vig": null, "stem": "When rates fall, the bond whose price rises the least is the:", "opts": {"A": "option-free bond", "B": "callable bond", "C": "putable bond"}, "ans": "B", "en": "L188: 금리 하락 시 가장 적게 오르는 채권 → callable\nL189: 금리 상승 시 가장 적게 떨어지는 채권→ putable\nL193: | 금리 ↓ | ↑ | ↓ | 소폭 상승 | 온전히 상승 |\nL194: | 금리 ↑ | ↓ | ↑ | 온전히 하락 | 소폭 하락 |", "enLabel": "오답노트 원문", "ko": "Rates↓ → call value↑ → callable price rises less. Rates↑ → put value↑ → putable price falls less.", "trap": "", "f": "", "why": {"C": "Putable bonds rise fully when rates fall.", "A": "Option-free bonds rise fully."}, "orig": "Fixed Income 오답노트 L188 · 근거 SCH R25"}, {"id": "CON-M3-02", "src": "개념", "module": 3, "tag": "Backward induction for a callable bond", "vig": null, "stem": "When valuing a callable bond by backward induction, the value used at each node is:", "opts": {"A": "the higher of the computed value and the call price", "B": "the lower of the computed (continuation) value and the call price", "C": "the computed value, ignoring the call"}, "ans": "B", "en": "L123: Embedded option\nL125: 각 노드에서 값을 구한 뒤 exercise 판단\nL126: backward: 콜 행사 판단에 continuation value(미래 노드 값)가 필요", "enLabel": "오답노트 원문", "ko": "Compute each node's value from future nodes (continuation value), then apply the exercise decision: callable → min(value, call price); putable → max(value, put price).", "trap": "", "f": "", "why": {"A": "The issuer calls when the bond is worth more than the call price, capping the value.", "C": "The call must be checked at every node where it is exercisable."}, "orig": "Fixed Income 오답노트 L123 · 근거 SCH R25"}, {"id": "CON-M3-03", "src": "개념", "module": 3, "tag": "Volatility and curve shape effects", "vig": null, "stem": "If the yield curve flattens (from upward sloping), the values of the embedded call and put options:", "opts": {"A": "call value increases; put value decreases", "B": "call value decreases; put value increases", "C": "both increase"}, "ans": "A", "en": "L195: | 변동성 ↑ | ↑ | ↑ | 하락 | 상승 |\nL196: | flattening,invert | ↑ | ↓ | 하락 | 하락 |\nL197: | steefening | ↓ | ↑ | 상승 | 상승 |\nL282: Curve Twist\nL284: 단기↑ + 장기↓ = flattening\nL285: 단기↓ + 장기↑ = steepening\nL286: 1단계 — 가격 방향 : 채권 가격 자체는 장기 금리가 좌우\nL287: 2단계 — straight 대비: Flattening⇒콜 가치↑,풋 가치↓. 둘 다 straight보다 불리", "enLabel": "오답노트 원문", "ko": "Volatility↑ → call↑ and put↑ (callable price↓, putable price↑). Flattening/inversion → call↑, put↓. Steepening → call↓, put↑. Bond price direction itself is driven by long rates.", "trap": "", "f": "", "why": {"B": "The directions are reversed for flattening.", "C": "Flattening raises the call but lowers the put."}, "orig": "Fixed Income 오답노트 L195 · 근거 SCH R25"}, {"id": "CON-M3-04", "src": "개념", "module": 3, "tag": "OAS", "vig": null, "stem": "The option-adjusted spread (OAS) is the constant spread added to:", "opts": {"A": "only the final-period rate", "B": "every one-year forward rate (node) in the tree so the model value equals the market price", "C": "every spot rate, assuming zero volatility"}, "ans": "B", "en": "L223: OAS : constant spread added to each forward rate in a binomial tree\nL227: | Z-spread | 모든 만기의 spot rate | 변동성 0 가정, option-free 채권용 |\nL228: | OAS | 트리의 모든 forward rate(노드) | 변동성 반영, embedded option 채권용 |\nL245: OAS : tree의 모든 1year forward rate에 상수 spread를 더해 model value를 market value와 일치시키는 spread", "enLabel": "오답노트 원문", "ko": "Z-spread: added to spot rates, assumes zero volatility, option-free bonds. OAS: added to all forward rates in the tree, reflects volatility, bonds with embedded options.", "trap": "", "f": "", "why": {"C": "That is the Z-spread, used for option-free bonds.", "A": "OAS is added to all nodes."}, "orig": "Fixed Income 오답노트 L223 · 근거 SCH R25"}, {"id": "CON-M3-05", "src": "개념", "module": 3, "tag": "Volatility and OAS", "vig": null, "stem": "For a callable bond with a given market price, an increase in assumed interest rate volatility makes the OAS:", "opts": {"A": "increase", "B": "stay the same", "C": "decrease"}, "ans": "C", "en": "L222: interest rate volatility 증가 →  OAS for the callable bond 감소", "enLabel": "오답노트 원문", "ko": "Volatility↑ → callable model value↓ → OAS for the callable bond↓.", "trap": "", "f": "", "why": {"A": "Higher volatility raises the call value and lowers model value, so a smaller spread matches the price.", "B": "The model value changes with volatility, so OAS changes."}, "orig": "Fixed Income 오답노트 L222 · 근거 SCH R25"}, {"id": "CON-M3-06", "src": "개념", "module": 3, "tag": "Callable bond duration", "vig": null, "stem": "For a callable bond, effective duration when rates fall is:", "opts": {"A": "longer than when rates rise", "B": "the same as when rates rise", "C": "shorter than when rates rise"}, "ans": "C", "en": "L230: callable bond: 금리 하락 시 duration<금리 상승 시 duration\nL281: 옵션은 in the money일 때만 duration을 줄임. Out of the money면 무시", "enLabel": "오답노트 원문", "ko": "Callable: duration (rates↓) < duration (rates↑). An option shortens duration mainly when in the money.", "trap": "", "f": "", "why": {"A": "The call shortens expected life when rates fall.", "B": "The embedded call makes duration asymmetric."}, "orig": "Fixed Income 오답노트 L230 · 근거 SCH R25"}, {"id": "CON-M3-07", "src": "개념", "module": 3, "tag": "Interest rate call vs embedded call", "vig": null, "stem": "When interest rates rise, the value of an interest rate call option and the value of the call embedded in a callable bond, respectively:", "opts": {"A": "decrease; increase", "B": "increase; decrease", "C": "increase; increase"}, "ans": "B", "en": "L232: |  | Interest Rate Call | Callable Bond의 Call |\nL234: | Call의 underlying | Interest rate | Bond |\nL235: | 금리 ↑ | Call 가치 ↑ | Call 가치 ↓ |\nL236: | 금리 ↓ | Call 가치 ↓ | Call 가치 ↑ |\nL237: | 누가 보유? | 금리 상승을 걱정하는 투자자/차입자 | Bond issuer |\nL238: | 목적 | 금리 상승 hedge | 발행자의 조기상환 권리 |\nL239: Interest-rate option → 금리가 underlying → 금리 상승 → Call ↑\nL240: Callable bond → Bond가 underlying → 금리 상승 → Bond ↓ → Call ↓", "enLabel": "오답노트 원문", "ko": "Interest rate option: underlying = rate → rates↑ → call↑ (hedge for borrowers). Callable bond: underlying = bond → rates↑ → bond↓ → call↓ (held by the issuer).", "trap": "", "f": "", "why": {"A": "An interest rate call is on the rate itself, so it gains when rates rise.", "C": "The embedded call is on the bond, which falls when rates rise."}, "orig": "Fixed Income 오답노트 L232 · 근거 SCH R25"}, {"id": "CON-M3-08", "src": "개념", "module": 3, "tag": "Rating transition: probability or not", "vig": null, "stem": "An analyst is asked for the price change if a bond is downgraded from AAA to A (a single specified move). She should:", "opts": {"A": "use the probability-weighted average of all transitions", "B": "compute −duration × Δspread without multiplying by a transition probability", "C": "multiply by the AAA-to-A transition probability"}, "ans": "B", "en": "L241: “expected change considering probability”, “expected loss/change from possible downgrade”처럼 확률을 고려하라고 하면 transition probability를 곱하지만, AAA → A처럼 하나의 이동이 명시되면 확률 안곱함\nL345: AAA → A처럼 하나의 이동이 명시되면 확률 계산 X", "enLabel": "오답노트 원문", "ko": "Use transition probabilities only for 'expected change considering probability'; for a single specified move, do not multiply by probability.", "trap": "", "f": "", "why": {"C": "Probabilities are used only when asked for an expected change.", "A": "That answers a different question (expected change)."}, "orig": "Fixed Income 오답노트 L241 · 근거 SCH R26"}, {"id": "CON-M3-09", "src": "개념", "module": 3, "tag": "Floating-rate bond duration", "vig": null, "stem": "A 3-year floating-rate bond resets annually. Its effective duration is closest to:", "opts": {"A": "1", "B": "3", "C": "between 1 and 3"}, "ans": "A", "en": "L242: Floating-rate bond의 effective duration ≈ 다음 리셋까지의 시간 / 연 1회 리셋 → ≈ 1 / 반기 → ≈ 0.5 / 분기 → ≈ 0.25 (만기는 전혀 보지 않음)", "enLabel": "오답노트 원문", "ko": "Floater effective duration ≈ time to next reset (annual ≈ 1, semiannual ≈ 0.5, quarterly ≈ 0.25), regardless of maturity.", "trap": "", "f": "", "why": {"B": "Maturity does not drive floater duration.", "C": "Duration is about the time to next reset."}, "orig": "Fixed Income 오답노트 L242 · 근거 ECO-M3-Q20"}, {"id": "CON-M3-10", "src": "개념", "module": 3, "tag": "Capped floater and credit spreads", "vig": null, "stem": "When a capped floater's reference rate rises above the cap, its duration:", "opts": {"A": "lengthens, because the coupon stops adjusting and it behaves like a fixed-rate bond", "B": "is unaffected", "C": "shortens to zero"}, "ans": "A", "en": "L243: Cap/floor가 붙은 floater: cap에 걸리면 쿠폰이 더 못 따라 올라감 → 고정금리채처럼 행동 → duration 길어짐\nL244: Credit spread 변화: 쿠폰 spread는 고정인데 요구spread가 오르면 par 아래로 하락 / → interest rate risk 작아도 credit risk는 그대로 노출’", "enLabel": "오답노트 원문", "ko": "Binding cap → coupon fixed → acts like a fixed-rate bond → longer duration. If the required credit spread rises above the fixed quoted margin, a floater trades below par (credit risk remains).", "trap": "", "f": "", "why": {"C": "A binding cap fixes the coupon, adding rate sensitivity.", "B": "The cap changes the bond's behavior."}, "orig": "Fixed Income 오답노트 L243 · 근거 SCH R25"}, {"id": "CON-M3-11", "src": "개념", "module": 3, "tag": "Convexity of callable vs putable bonds", "vig": null, "stem": "When the call is near the money, a callable bond has:", "opts": {"A": "negative effective convexity, while a putable bond always has positive convexity", "B": "positive convexity, higher than a putable bond", "C": "the same convexity as a putable bond"}, "ans": "A", "en": "L246: Callable bond : call이 near the money일 때 negative effective convexity (-)\nL248: Putable은 항상 positive convexity (+)  / → callable의 convexity < putable", "enLabel": "오답노트 원문", "ko": "Callable near the money → negative convexity; putable → always positive; callable convexity < putable.", "trap": "", "f": "", "why": {"B": "Near the money, the call caps price gains.", "C": "Putable bonds have positive convexity; callables near the money do not."}, "orig": "Fixed Income 오답노트 L246 · 근거 SCH R25"}, {"id": "CON-M3-12", "src": "개념", "module": 3, "tag": "Market conversion premium per share", "vig": null, "stem": "A convertible bond has a par of $1,000 and a conversion price of $25, so the conversion ratio is 40. The bond trades at $1,300 and the share price is $28. The market conversion premium per share is:", "opts": {"A": "$3.00", "B": "$7.50", "C": "$4.50"}, "ans": "C", "en": "L249: Conversion Price\nL251: 1. Conversion ratio = Issue Prcie ÷ 최초 conversion price (여기만 액면 사용)\nL252: 2. Market conversion price = 시장가격 ÷ conversion ratio\nL253: 3. Premium per share = market conversion price − Share price\nL254: 4. Conversion price = 발행 시 주가 × (1 + conversion premium)\nL258: | Conversion price | 액면 ÷ conversion ratio | 발행 시 계약으로 확정, 안 변함 |\nL259: | Market conversion price | 시장가격 ÷ conversion ratio | 채권 시세에 따라 매일 변동 |\nL272: current conversion ratio = (Par value)/(current conversion price)   / ≠  Market conversion price = current value conversion ratio\nL274: ex. par value = 100, 현재 가격은 130, current conversion price = 25 인 cb bond\nL275: 현재 가격 130 / 현재 conversion ratio (100/25) = market conversion price = 32.5", "enLabel": "오답노트 원문", "ko": "Conversion ratio = par/conversion price = 40. Market conversion price = bond price/ratio = 1,300/40 = 32.50. Premium per share = 32.50 − 28 = 4.50. Conversion price at issue = share price × (1 + conversion premium).", "trap": "", "f": "", "why": {"B": "$7.50 compares the market conversion price with the conversion price, not the share price.", "A": "$3.00 compares the share price with the conversion price."}, "orig": "Fixed Income 오답노트 L249 · 근거 SCH R25"}, {"id": "CON-M3-13", "src": "개념", "module": 3, "tag": "Conversion price adjustments", "vig": null, "stem": "If a convertible issuer pays a dividend above the threshold dividend, the conversion price is:", "opts": {"A": "adjusted down (conversion ratio up) to protect bondholders", "B": "adjusted up (conversion ratio down)", "C": "never adjusted"}, "ans": "A", "en": "L261: 배당 > threshold → conversion price ↓  (하향 조정)\nL263: = conversion ratio ↑\nL264: 이유: 전환사채 보유자는 배당을 못 받는데 배당으로 주가만 하락 → 일방적 불리 → 보상\nL265: 한 방향으로만 작동: threshold 이하면 조정 없음, 배당을 줄여도 상향 조정은 없음 (보유자 보호용 조항)\nL266: change of control conversion price도 같은 성격 — 인수합병 시 평소보다 낮은 가격로 전환 가능하게 해 보유자를 보호.\nL288: 인수합병이 발생 시  투자자를 보호하는 장치\nL290: ① Change of control put option — par에 되팔 권리\nL292: ② Change of control conversion price — 더 낮은 가격 적용", "enLabel": "오답노트 원문", "ko": "Dividend above threshold → conversion price↓ (ratio↑) because holders lose value as the share price drops; one-way only. Change-of-control: put at par or a lower conversion price. Stock splits also adjust price down and ratio up.", "trap": "", "f": "", "why": {"B": "Adjustments only protect holders; they do not move against them.", "C": "Above-threshold dividends trigger an adjustment."}, "orig": "Fixed Income 오답노트 L261 · 근거 SCH R25 / ECO-M3-Q89"}, {"id": "CON-M3-14", "src": "개념", "module": 3, "tag": "Valuing convertibles", "vig": null, "stem": "A convertible bond's value at each node of an interest rate tree is:", "opts": {"A": "min(value of holding the bond, call price)", "B": "max(value of holding the bond, conversion value)", "C": "the conversion value only"}, "ans": "B", "en": "L267: convertible bond → 다른 bond와 마찬가지로 interest rate tree로 평가함\nL269: V = max(계속 보유 시 bond value, conversion value)\nL270: callable의 min(계산값, 콜가격)과 같은 구조. 옵션을 투자자가 가졌으니 max\nL271: credit spread도 convertible bond 가격에 영향 미침 (주가 < 전환가격일 때)\nL276: 전환사채가 callable보다 평가가 더 어려움\nL278: Callable : 금리 수준, 금리 변동성, credit spread 고려\nL279: Convertible:  주가, 주가 변동성까지 고려", "enLabel": "오답노트 원문", "ko": "Convertible: V = max(hold value, conversion value); credit spread matters when the share price is below the conversion price. Convertibles are harder to value than callables (also need share price and its volatility).", "trap": "", "f": "", "why": {"A": "The min with the call price applies to callable bonds; the investor owns the conversion option.", "C": "The straight-bond value also matters."}, "orig": "Fixed Income 오답노트 L267 · 근거 SCH R25"}, {"id": "CON-M3-15", "src": "개념", "module": 3, "tag": "Shape risk", "vig": null, "stem": "To measure a bond's sensitivity to steepening or flattening of the yield curve, use:", "opts": {"A": "key rate durations", "B": "modified duration only", "C": "effective duration only"}, "ans": "A", "en": "L280: bond’s sensitivity to changes in the shape of the yield curve(steepening or flattening) → key rate duration 사용", "enLabel": "오답노트 원문", "ko": "Shape changes (steepening/flattening) → key rate duration.", "trap": "", "f": "", "why": {"C": "Effective duration assumes parallel shifts.", "B": "Modified duration also assumes parallel shifts."}, "orig": "Fixed Income 오답노트 L280 · 근거 ECO-M3-Q75"}, {"id": "CON-M4-01", "src": "개념", "module": 4, "tag": "CVA calculation", "vig": null, "stem": "A 1-year zero-coupon bond with par 100 has a 2% default probability, 40% recovery, and the risk-free rate is 3%. Its credit valuation adjustment (CVA) is closest to:", "opts": {"A": "1.20", "B": "0.78", "C": "1.17"}, "ans": "C", "en": "L296: cva 계산 순서\nL298: ① Expected exposure  = 부도 시 잃을 수 있는 금액 (회수 고려 전) = 남은 현금흐름 / ↓ × (1 − recovery rate) / ② Loss given default = 실제 손실액 / ↓ × PD / ③ Expected loss      = 기대손실 / ↓ × 할인 / ④ PV of expected loss / ↓ 전 기간 합계 / ⑤ CVA\nL301: EL = Σ [현금흐름ₜ × 누적 PDₜ × LGD]\nL305: 1. FV of bond = VND − CVA (VND = 부도 위험 없다고 가정한 가치, CVA = 부도로 인한 기대손실의 PV)", "enLabel": "오답노트 원문", "ko": "Exposure 100 × LGD (1 − 0.40) = 60 × PD 2% = expected loss 1.20 → discount: 1.20/1.03 = 1.17 = CVA (sum over periods). Fair value = value without default − CVA.", "trap": "", "f": "", "why": {"A": "1.20 is the expected loss before discounting.", "B": "0.78 uses the recovery rate (40%) as the loss instead of 1 − recovery."}, "orig": "Fixed Income 오답노트 L296 · 근거 SCH R26"}, {"id": "CON-M4-02", "src": "개념", "module": 4, "tag": "Expected value at a node with default", "vig": null, "stem": "At a future date the exposure is 100, the probability of default is 2%, and the recovery rate is 40%. The expected value at that date is:", "opts": {"A": "98.0", "B": "99.2", "C": "98.8"}, "ans": "C", "en": "L300: E[FV] = Exposure × (1 − PD) + Exposure × RR × PD", "enLabel": "오답노트 원문", "ko": "E[value] = exposure × (1 − PD) + exposure × RR × PD = 98 + 0.8 = 98.8.", "trap": "", "f": "", "why": {"A": "98.0 assumes nothing is recovered on default.", "B": "99.2 uses the loss given default (60%) as the recovery."}, "orig": "Fixed Income 오답노트 L300 · 근거 SCH R26"}, {"id": "CON-M4-03", "src": "개념", "module": 4, "tag": "Credit terminology", "vig": null, "stem": "'Loss severity' in credit analysis means:", "opts": {"A": "the expected exposure before recovery", "B": "the probability of default", "C": "loss given default, equal to 1 − recovery rate"}, "ans": "C", "en": "L357: | \"회수 전 손실 가능 금액\" / \"남은 현금흐름\" | Expected exposure |\nL358: | \"loss severity\" / \"loss given default\" | Recovery rate의 뒷면 (1 − RR) |\nL359: | \"부도 확률\" / \"hazard rate\" / \"default intensity\" | Probability of default |", "enLabel": "오답노트 원문", "ko": "Expected exposure = amount at risk before recovery (remaining cash flows). Loss severity / LGD = 1 − recovery rate. Hazard rate / default intensity = probability of default.", "trap": "", "f": "", "why": {"B": "Hazard rate / default intensity is the probability of default.", "A": "The amount at risk before recovery is the expected exposure."}, "orig": "Fixed Income 오답노트 L357 · 근거 SCH R26"}, {"id": "CON-M4-04", "src": "개념", "module": 4, "tag": "Cumulative default probability", "vig": null, "stem": "A bond has a constant 2% hazard rate each year. The cumulative probability of default over 3 years is closest to:", "opts": {"A": "6.00%", "B": "5.88%", "C": "2.00%"}, "ans": "B", "en": "L299: Exposure(t) = 같은 열 노드들의 가중평균 + 그 시점에 받는 쿠폰\nL302: PSₜ = (1−h₁)(1−h₂)···(1−hₜ) → 누적 PDₜ = 1 − PSₜ", "enLabel": "오답노트 원문", "ko": "Probability of survival PS₃ = (1 − 0.02)³ = 0.9412 → cumulative PD = 1 − PS = 5.88%. Exposure at each date = probability-weighted node values + coupon at that date.", "trap": "", "f": "", "why": {"A": "6.00% adds the hazards; survival compounds multiplicatively.", "C": "2.00% is one year only."}, "orig": "Fixed Income 오답노트 L299 · 근거 SCH R26"}, {"id": "CON-M4-05", "src": "개념", "module": 4, "tag": "Credit spread from fair value", "vig": null, "stem": "The credit spread implied by CVA is found as:", "opts": {"A": "YTM using fair value (value without default − CVA) minus YTM of the default-free bond", "B": "CVA divided by par", "C": "YTM at market price minus the coupon rate"}, "ans": "A", "en": "L303: bond FV의 implied credit spread 계산법\nL305: 1. FV of bond = VND − CVA (VND = 부도 위험 없다고 가정한 가치, CVA = 부도로 인한 기대손실의 PV)\nL306: 2. FV로 YTM 계산 (현금흐름은 그대로, 가격만 FV)\nL307: 3. credit spread = FV의 YTM − VND의 YTM (VND = 같은 쿠폰·만기의 무위험 채권 가격)\nL316: Credit spread (같은 쿠폰의 무위험 채권 대비) = YTM(FV) − YTM(VND)\nL318: Credit spread 계산엔 FV(VND − CVA)를 사용. (Market value 사용 X)", "enLabel": "오답노트 원문", "ko": "Fair value = VND − CVA → compute YTM at fair value (same cash flows) → credit spread = YTM(FV) − YTM(VND).", "trap": "", "f": "", "why": {"C": "Use fair value from the CVA model, not market price.", "B": "CVA/par is not a yield spread."}, "orig": "Fixed Income 오답노트 L303 · 근거 SCH R26"}, {"id": "CON-M4-06", "src": "개념", "module": 4, "tag": "Actual vs risk-neutral default probability", "vig": null, "stem": "Compared with actual (historical) default probabilities, risk-neutral default probabilities are:", "opts": {"A": "lower, because they exclude a risk premium", "B": "the same", "C": "higher, because they include a risk premium and spread effects such as liquidity and taxes"}, "ans": "C", "en": "L308: Actual vs Risk-neutral PD\nL310: Actual = 과거 default 통계.  risk premium 없음\nL311: Risk-neutral = 시장가격에서 역산. risk premium포함 → 항상 더 큼\nL312: observed spread = credit risk + liquidity + tax considerations\nL314: 국채 대비 spread를 전부 credit risk으로 보면 과대평가\nL315: risk-neutral이 actual보다 큰 또 하나의 이유 (모든 요인이 부도확률로 뭉뚱그려짐)\nL322: | observed spread | 시장에서 보이는 가격 차이 | credit risk + liquidity + tax |\nL323: | Risk-neutral PD | 그 가격에서 역산한 확률 | 위 세 가지가 확률 형태로 환산된 것. risk premiun 포함 |\nL324: | Actual PD | historical default 통계 | credit risk만. 프리미엄 X |", "enLabel": "오답노트 원문", "ko": "Actual PD = historical statistics, no premium. Risk-neutral PD = backed out of prices, includes risk premium → larger. Observed spread = credit + liquidity + tax; treating it all as credit overstates credit risk.", "trap": "", "f": "", "why": {"A": "Risk-neutral probabilities include the risk premium.", "B": "They differ because of the risk premium and other spread factors."}, "orig": "Fixed Income 오답노트 L308 · 근거 ECO-M4-Q8"}, {"id": "CON-M4-07", "src": "개념", "module": 4, "tag": "Structural vs reduced-form models", "vig": null, "stem": "Which statement about reduced-form credit models is correct?", "opts": {"A": "Default is exogenous and can vary with company-specific and macro variables; public data suffice", "B": "Default occurs only when assets fall below a known barrier", "C": "They require the value of the company's assets and assume assets trade"}, "ans": "A", "en": "L326: Structural Form\nL328: 옵션·자산가치·주식 등  내부 정보 필요, 자산 거래 가정 →실무 적용 어려움\nL329: default barrier 측정 어려움\nL330: 자산 가치 모를 땐 market data로 추정\nL331: Reduced-form\nL333: leverage ratio, ROA, 거시경제변수 → 공개 데이터로 충분 →실무적 \nL334: default = 외생적(exogenous), 언제든 surprise\nL335: assets trade 가정 X\nL336: default intensity can vary with company-specific and macroeconomic variables", "enLabel": "오답노트 원문", "ko": "Structural: needs asset values, assumes assets trade, default barrier hard to measure → hard to apply. Reduced-form: uses leverage, ROA, macro data; default exogenous (a surprise); no asset-trading assumption; practical.", "trap": "", "f": "", "why": {"C": "That describes structural models.", "B": "That is the structural model's default barrier."}, "orig": "Fixed Income 오답노트 L326 · 근거 ECO-M4-Q7"}, {"id": "CON-M4-08", "src": "개념", "module": 4, "tag": "Expected return with rating transitions", "vig": null, "stem": "A bond yields 5% with modified duration 6. There is a 10% probability it is downgraded, which would widen its spread by 1.00%. The expected return adjusted for this transition is closest to:", "opts": {"A": "4.40%", "B": "−1.00%", "C": "4.90%"}, "ans": "A", "en": "L337: E[R] ≈ Coupon (or YTM) − ModDur × Δspread ( x P(전이) )\nL338: 기대 수익률 = YTM + P(전이) × [-D × Δspread]\nL340: P(전이) = 그 전이가 일어날 확률\nL341: −D×Δspread = 그 전이가 일어났을 때의 가격변화율\nL342: AA → B로 변할 시 Δspread = B spread - AA spread\nL343: 각 등급 - 기존 spread를 빼는 거 !!\nL344: expected change/return considering probability → 전이확률 계산\nL349: | 등급 변경 시 가격 변화율 | −(mod duration) × Δspread | % |\nL350: | 등급 변경 시 기대 수익률 조정 | 위 값들 × 전이확률 → 합산 | % (거의 음수) |", "enLabel": "오답노트 원문", "ko": "E[R] ≈ YTM + P(transition) × (−D × Δspread) = 5% + 0.10 × (−6 × 1%) = 4.40%. Δspread = new rating spread − current spread.", "trap": "", "f": "", "why": {"B": "−1.00% treats the downgrade as certain.", "C": "4.90% forgets to multiply the spread change by duration."}, "orig": "Fixed Income 오답노트 L337 · 근거 SCH R26"}, {"id": "CON-M4-09", "src": "개념", "module": 4, "tag": "Credit scores vs credit ratings", "vig": null, "stem": "Which statement is correct?", "opts": {"A": "Credit ratings cover corporate, sovereign, and ABS debt and use notching to reflect loss given default", "B": "Credit ratings ignore probability of default", "C": "Credit scores are mainly for corporate bonds and include notching"}, "ans": "A", "en": "L361: Credit score: 소비자·소기업 대상, probability of default 중심, negative 정보만 쓰거나 다양한 요인 mix\nL362: Credit Rating : 회사채·국채·ABS 대상, probability of default 중심. notching으로 LGD(청구권 순위)를 반영’\nL363: ordinal rating\nL365: PD 중심\nL366: issuer · specific bond issue에 적용\nL367: outlook 제시\nL368: notching\nL370: LGD차이를 반영\nL380: notching Issuer rating : senior unsecured debt 기준", "enLabel": "오답노트 원문", "ko": "Credit score: consumers/small businesses, PD-focused, negative info or a mix of factors. Credit rating: corporates, sovereigns, ABS; ordinal; issuer or issue; outlook; notching reflects LGD (seniority) relative to senior unsecured.", "trap": "", "f": "", "why": {"C": "Credit scores are for consumers and small businesses.", "B": "Ratings focus on default probability."}, "orig": "Fixed Income 오답노트 L361 · 근거 ECO-M4-Q33"}, {"id": "CON-M4-10", "src": "개념", "module": 4, "tag": "Securitized debt analysis approach", "vig": null, "stem": "For which structured finance asset type is a statistics-based approach most appropriate?", "opts": {"A": "Asset-backed commercial paper", "B": "Auto asset-backed securities", "C": "Commercial mortgage-backed securities"}, "ans": "A", "en": "L371: granular =  작은 단위의 자산이 많이 세분화돼있는거 (ex. 100원 1000개) → 자산이 많다\nL375: | Statistics-based  / (기존 대출장부의 통계 분석) | 단기 + granular +homogeneous | Asset-backed commercial paper |\nL376: | Portfolio-based | 중기 + granular +homogeneous | Auto ABS, consumer ABS / (Auto asset-bacekd security) |\nL377: | Loan-by-loan  / (개별 대출 분석) | Non-granular 또는 heterogeneous | CMBS |", "enLabel": "오답노트 원문", "ko": "Statistics-based: short-term, granular, homogeneous (ABCP). Portfolio-based: medium-term, granular, homogeneous (auto/consumer ABS). Loan-by-loan: non-granular or heterogeneous (CMBS). Granular = many small, transparent assets.", "trap": "", "f": "", "why": {"B": "Auto ABS (medium-term, granular, homogeneous) use a portfolio-based approach.", "C": "CMBS (non-granular or heterogeneous) use loan-by-loan analysis."}, "orig": "Fixed Income 오답노트 L371 · 근거 ECO-M4-Q66"}, {"id": "CON-M4-11", "src": "개념", "module": 4, "tag": "FICO score", "vig": null, "stem": "Which factor carries the highest weight in the FICO score?", "opts": {"A": "Type of credit used", "B": "Number of hard credit inquiries", "C": "Payment history"}, "ans": "C", "en": "L379: Payment history → highest weight in the FICO score", "enLabel": "오답노트 원문", "ko": "Payment history has the highest weight in the FICO score.", "trap": "", "f": "", "why": {"A": "Type of credit has a smaller weight.", "B": "Inquiries have a smaller weight."}, "orig": "Fixed Income 오답노트 L379 · 근거 ECO-M4-Q57"}, {"id": "CON-M4-12", "src": "개념", "module": 4, "tag": "Which curve for which job", "vig": null, "stem": "In a CVA calculation, exposures at future dates are based on __, and the final discounting to today uses __.", "opts": {"A": "spot rates; forward rates", "B": "forward rates; spot rates (discount factors)", "C": "par rates; forward rates"}, "ans": "B", "en": "L383: | 상황 | 쓰는 곡선 |\nL385: | Option-free 채권 valuation | Spot |\nL386: | 트리가 퍼지는 중심선 | Forward |\nL387: | 트리 노드의 금리 | Forward (1년치) |\nL388: | CVA의 Exposure 계산 | Forward (그 시점 기준) |\nL389: | CVA의 최종 할인 | Spot / DF (오늘 기준) |\nL430: arbitrage-free valuation of an option-free corporate bond is equal to the present value of bond's expected cash flows discounted using the spot curve", "enLabel": "오답노트 원문", "ko": "Option-free valuation → spot. Tree center and node rates → forward. CVA exposure → forward (as of that date). CVA final discounting → spot/DF.", "trap": "", "f": "", "why": {"A": "Exposure uses forward rates at that date; discounting to today uses spot rates.", "C": "Par rates are not used for these steps."}, "orig": "Fixed Income 오답노트 L383 · 근거 SCH R26"}, {"id": "CON-M4-13", "src": "개념", "module": 4, "tag": "Special purpose entities", "vig": null, "stem": "Transferring assets to a special purpose entity (SPE) in a securitization:", "opts": {"A": "keeps the assets' credit risk with the originator", "B": "isolates the assets' credit risk, lowering financing cost", "C": "raises financing cost because of added complexity"}, "ans": "B", "en": "L391: 자산을 SPE로 격리 → 신용위험 분리 → financing cost ↓", "enLabel": "오답노트 원문", "ko": "Assets moved to an SPE → credit risk separated from the originator → lower financing cost.", "trap": "", "f": "", "why": {"C": "Bankruptcy remoteness lowers funding cost.", "A": "The point is to separate the credit risk."}, "orig": "Fixed Income 오답노트 L391 · 근거 SCH R26"}, {"id": "CON-M5-01", "src": "개념", "module": 5, "tag": "Equity-versus-credit trade in M&A", "vig": null, "stem": "Company Delta plans to acquire Zega using heavy borrowing. A profitable equity-versus-credit trade is to:", "opts": {"A": "short Zega shares and sell protection on Delta", "B": "buy Zega (target) shares and buy protection on Delta (acquirer)", "C": "buy Delta shares and sell protection on Zega"}, "ans": "B", "en": "L395: M&A → Long target 기업 stock + Long acquirer credit protection\nL397: 피인수기업 주식 사고, 인수기업 cds 사는게 이득", "enLabel": "오답노트 원문", "ko": "M&A: long target stock + long protection on the acquirer (leverage↑ → spread widens).", "trap": "", "f": "", "why": {"A": "The target's price usually rises; the acquirer's credit weakens.", "C": "The acquirer's credit, not the target's, deteriorates."}, "orig": "Fixed Income 오답노트 L395 · 근거 ECO-M5-Q14"}, {"id": "CON-M5-02", "src": "개념", "module": 5, "tag": "CDS direction", "vig": null, "stem": "An investor expects a company's credit spread to narrow. She should:", "opts": {"A": "do nothing; CDS cannot profit from narrowing", "B": "buy protection (short CDS)", "C": "sell protection (be long CDS / long credit)"}, "ans": "C", "en": "L398: spread narrow → seller 이익 → protection 팔아야 함\nL400: widen  → buyer 이익  → protection 사야 함\nL402: 주식으로 자금 조달 → 부채 감소 → 신용 개선 → protection sell\nL403: 부채로 주식을 사들임 → 레버리지 급증 → 신용 악화→ protection buy\nL404: sell Protection = Long CDS\nL406: | 표현 | 같은 뜻 |\nL408: | Long CDS / long credit | protection sell (보험사 역할), 채권 보유와 동일 |\nL409: | Short CDS / short credit | protection buy (보험 가입자), 채권 공매도와 유사 |", "enLabel": "오답노트 원문", "ko": "Spread narrows → seller gains → sell protection; widens → buyer gains → buy protection. Equity-funded deleveraging → credit improves → sell protection; debt-funded buybacks → leverage up → buy protection. Sell protection = long CDS = long credit (like owning the bond).", "trap": "", "f": "", "why": {"B": "Buying protection profits from widening spreads.", "A": "Protection sellers gain when spreads narrow."}, "orig": "Fixed Income 오답노트 L398 · 근거 SCH R27"}, {"id": "CON-M5-03", "src": "개념", "module": 5, "tag": "Closing out a CDS", "vig": null, "stem": "A protection seller who closes out the position:", "opts": {"A": "enters an offsetting trade, becoming a protection buyer for the same reference entity", "B": "cancels the original contract with no new trade", "C": "doubles the position"}, "ans": "A", "en": "L381: Offsetting = 반대 포지션을 추가로 얹는 것\nL401: Close out the position : 청산. 반대를 잡는 것. seller → buyer가 됨", "enLabel": "오답노트 원문", "ko": "Close out / offsetting = take the opposite position (seller → buyer).", "trap": "", "f": "", "why": {"B": "Positions are closed by offsetting trades.", "C": "Closing out reduces, not increases, exposure."}, "orig": "Fixed Income 오답노트 L381 · 근거 SCH R27"}, {"id": "CON-M5-04", "src": "개념", "module": 5, "tag": "Types of CDS", "vig": null, "stem": "A single-name CDS typically references the borrower's:", "opts": {"A": "all debt regardless of seniority", "B": "subordinated debt only", "C": "senior unsecured obligation, covering debt ranked equivalently"}, "ans": "C", "en": "L411: single-name CDS :  특정 borrower의 senior unsecured obligation을 기준. 그와 동순위인 debt만 커버(ranked equivalently)\nL412: Tranche CDSs : covered only up to a specific level", "enLabel": "오답노트 원문", "ko": "Single-name CDS: reference = senior unsecured; covers equally ranked debt. Tranche CDS: covers losses only up to a specific level.", "trap": "", "f": "", "why": {"B": "The reference obligation is senior unsecured.", "A": "Coverage is limited to debt of equal rank."}, "orig": "Fixed Income 오답노트 L411 · 근거 ECO-M5-Q29"}, {"id": "CON-M5-05", "src": "개념", "module": 5, "tag": "CDS price from upfront", "vig": null, "stem": "A CDS has a credit spread of 3%, a standard coupon of 1%, and a duration of 4. The CDS price per 100 of notional is approximately:", "opts": {"A": "8", "B": "92", "C": "108"}, "ans": "B", "en": "L351: | CDS upfront premium | (CDS spread − CDS coupon) × CDS duration × 명목 | 금액 |\nL352: | CDS price (per 100) | 100 − upfront premium(%) | 가격 |\nL413: CDS price per 100=100−upfront premium(%)\nL414: Upfront ≈ (Credit Spread − Coupon) × Duration", "enLabel": "오답노트 원문", "ko": "Upfront premium ≈ (spread − coupon) × duration = 2% × 4 = 8%; price = 100 − 8 = 92.", "trap": "", "f": "", "why": {"C": "When the spread exceeds the coupon, the buyer pays upfront and the price is below 100.", "A": "8 is the upfront premium, not the price."}, "orig": "Fixed Income 오답노트 L351 · 근거 SCH R27"}, {"id": "CON-M5-06", "src": "개념", "module": 5, "tag": "CDS position gain", "vig": null, "stem": "A protection buyer on $10m notional (duration 4) sees the credit spread widen by 50 bps. The approximate gain is:", "opts": {"A": "+$50,000", "B": "+$200,000", "C": "−$200,000"}, "ans": "B", "en": "L353: | CDS 포지션의 손익 | Δspread × CDS duration × 명목 | 금액 |\nL446: Buyer = short credit: spread↑ → 이익\nL448: ΔCDS value(buyer) ≈ Δspread × Duration × Notional", "enLabel": "오답노트 원문", "ko": "ΔCDS value (buyer) ≈ Δspread × duration × notional = 0.005 × 4 × 10m = 200,000. Buyer = short credit: spread↑ → gain.", "trap": "", "f": "", "why": {"C": "The buyer is short credit and gains when spreads widen.", "A": "+$50,000 ignores the duration."}, "orig": "Fixed Income 오답노트 L353 · 근거 SCH R27"}, {"id": "CON-M5-07", "src": "개념", "module": 5, "tag": "Basis trade", "vig": null, "stem": "A bond yields 5.2% while MRR is 3.0%; the CDS spread on the same issuer is 1.8%. The basis trade is to:", "opts": {"A": "buy the bond and sell protection", "B": "buy the bond and buy protection (negative basis)", "C": "short the bond and sell protection"}, "ans": "B", "en": "L415: Basis=CDS spread−Bond spread\nL417: basis trade 계산 시, 채권 credit spread = 채권 수익률 − MRR\nL421: | 음수 (CDS < 채권) | CDS가 쌈 | 매수 | 매수 |\nL422: | 양수 (CDS > 채권) | CDS가 비쌈 | 공매도 | 매도 / = Long CDS |\nL424: → 채권과 protection은 항상 같은 방향. 둘 다 사거나 둘 다 팔거나. 그래야 신용위험이 상쇄됨.\nL426: Bond spread < CDS spread → Long CDS + Short bond (cds매도, 채권 공매도)", "enLabel": "오답노트 원문", "ko": "Bond spread = 5.2% − 3.0% = 2.2%; basis = CDS − bond spread = −0.4% (negative) → CDS cheap → buy bond + buy protection. Positive basis → short bond + sell protection (long CDS).", "trap": "", "f": "", "why": {"C": "Positive basis (CDS > bond spread) calls for shorting the bond and selling protection.", "A": "Bond and protection must move in the same direction to hedge credit risk."}, "orig": "Fixed Income 오답노트 L415 · 근거 SCH R27"}, {"id": "CON-M5-08", "src": "개념", "module": 5, "tag": "CDS mechanics", "vig": null, "stem": "Which statement about CDS is correct?", "opts": {"A": "The protection seller bears counterparty risk to the buyer only", "B": "The protection buyer pays a variable premium", "C": "The protection buyer pays a fixed periodic premium and bears counterparty risk to the seller"}, "ans": "C", "en": "L427: CDS : protection buyer assumes counterparty risk with respect to the protection seller.\nL428: Protection buyer → fixed periodic premium지급 (variable ❌)\nL429: settlement typically occurs 30 days after declaration of the credit event by the DC (Determinations Committee)", "enLabel": "오답노트 원문", "ko": "Buyer pays a fixed premium and assumes counterparty risk to the seller. Settlement typically occurs 30 days after the Determinations Committee declares the credit event.", "trap": "", "f": "", "why": {"B": "The premium is fixed.", "A": "The buyer relies on the seller's ability to pay."}, "orig": "Fixed Income 오답노트 L427 · 근거 ECO-M5-Q43"}, {"id": "CON-M5-09", "src": "개념", "module": 5, "tag": "CDS settlement", "vig": null, "stem": "A protection buyer holds $10m notional. After a credit event, the cheapest-to-deliver bond trades at 30 per 100. Under cash settlement, the buyer receives:", "opts": {"A": "$7m", "B": "$3m", "C": "$10m"}, "ans": "A", "en": "L439: CDS 결제\nL441: Physical = 채권 인도 + 액면(notional) 수령\nL442: Cash = (1 − recovery rate) × notional 수령 (채권은 보유)\nL443: Recovery rate는 cheapest-to-deliver(동순위 중 가장 싼 채권)의 par 대비 가격으로 추정\nL444: Physical 총액 = notional vs Cash 총액 = (1 − RR_CTD) × notional + 보유 채권의 시장가\nL445: 내가 가진 채권이 CTD보다 비싸면 → cash 결제 + 채권을 시장에서 매도", "enLabel": "오답노트 원문", "ko": "Cash settlement = (1 − recovery) × notional, recovery from the cheapest-to-deliver price = 0.70 × 10m = 7m (buyer keeps the bonds). Physical = deliver bonds, receive notional. If your bond is worth more than CTD, take cash and sell the bond.", "trap": "", "f": "", "why": {"C": "$10m is received only under physical settlement, in exchange for delivering bonds.", "B": "$3m is the recovery value, not the payout."}, "orig": "Fixed Income 오답노트 L439 · 근거 SCH R27"}], "vignettes": [], "modules": {"1": "Term Structure & Interest Rate Dynamics", "2": "Arbitrage-Free Valuation Framework", "3": "Bonds with Embedded Options", "4": "Credit Analysis Models", "5": "Credit Default Swaps"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "FixedIncomeConcept", KEY = "FixedIncomeConcept_quiz_state_v1", EXPKEY = "FixedIncomeConcept_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return "Module "+m+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();

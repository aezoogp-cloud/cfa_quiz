<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 5 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.jump{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.jump select,.jump input{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:inherit}
.jump select{flex:1;min-width:0;max-width:100%}
.jump input{width:72px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.btn.flag{padding:3px 10px;font-size:13px}
.btn.flag.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.pill.src-flag{background:var(--bad-soft);color:var(--bad)}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
/* 지문 왼쪽 · 문제/해설 오른쪽 (cmock처럼) */
body.wide .wrap{max-width:1440px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
.split .card{margin-top:0}
.vpane{position:sticky;top:104px;max-height:calc(100vh - 116px);overflow:auto;background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:12px;padding:12px 18px 16px;font-size:14.5px}
.vpane .vhead{font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:4px}
.vpane p{margin:.5em 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.vpane{position:static;max-height:42vh}}
</style>
</head>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock5", "title": "Mock 5"}, "questions": [{"id": "mock5-Q1", "src": "정답", "module": "FI", "tag": "credit migration 기대 total return", "vig": 0, "stem": "The expected 1-year total return for the Don Vallejo A-rated bond under Jackson’s credit migration scenario is closest to:", "opts": {"A": "–0.14%.", "B": "0.86%.", "C": "0.95%."}, "ans": "B", "en": "A. –0.14%. — Incorrect\nIncorrect because the YTM is not considered when calculating the total return of the bond. In this case, the expected 1-year total return of the bond is only equal to the expected price return from a change in the credit spread.\nThe expected credit spread change is the probability-weighted spread change, where the probabilities are retrieved from the transition matrix row with the label rating of \"A\".\nWe first compute the expected percentage price change using the modified duration of 4.5 for each rating migration.\nFrom A to AAA\t–4.5 × –0.5% = 2.25%\nFrom A to AA\t–4.5 × –0.3% = 1.35%\nFrom A to A\t–4.5 × 0% = 0%\nFrom A to BBB\t–4.5 × 0.4% = –1.8%\nFrom A to BB\t–4.5 × 0.6% = –2.7%\nFrom A to B\t–4.5 × 0.8% = –3.6%\nFrom A to CCC\t–4.5 × 1.5% = –6.75%\nThe expected price return is computed by multiplying each price change by the appropriate probability from the transition matrix in the row with the label rating of \"A\".\nExpected price return = 2.25% × 0.02 + 1.35% × 0.03 + 0% × 0.88 – 1.8% × 0.02 – 2.7% × 0.02 – 3.6% × 0.02 – 6.75% × 0.01\n= –0.144%, which is rounded to –0.14%.\nB. 0.86%. — Correct\nCorrect because the expected total return of the A-rated bond is the sum of the YTM and the expected percentage change in bond value. The YTM is 1%, while the expected return due to a credit spread change can be computed as (minus) the expected spread change (subject to migration) times the modified duration of the bond of 4.5. In turn, the expected spread change for an A-rated bond is the probability-weighted spread change, where the probabilities are retrieved from the transition matrix row with the label rating of \"A\".\nWe first compute the expected percentage price change using the modified duration of 4.5 for each rating migration.\nFrom A to AAA\t–4.5 × –0.5% = 2.25%\nFrom A to AA\t–4.5 × –0.3% = 1.35%\nFrom A to A\t–4.5 × 0% = 0%\nFrom A to BBB\t–4.5 × 0.4% = –1.8%\nFrom A to BB\t–4.5 × 0.6% = –2.7%\nFrom A to B\t–4.5 × 0.8% = –3.6%\nFrom A to CCC\t–4.5 × 1.5% = –6.75%\nThe expected price return is computed by multiplying each price change by the appropriate probability from the transition matrix in the row with the label rating of \"A\".\nExpected price return = 2.25% × 0.02 + 1.35% × 0.03 + 0% × 0.88 – 1.8% × 0.02 – 2.7% × 0.02 – 3.6% × 0.02 – 6.75% × 0.01 = –0.144%\nThe expected total return of the bond is therefore: –0.144% + 1% = 0.856%, which is rounded to 0.86%.\nC. 0.95%. — Incorrect\nIncorrect because the probabilities corresponding to the \"A\" column rather than the \"A\" row are retrieved from the transition matrix. Note that in this case the probabilities do not sum to 100% as the rows (but not the columns) need to sum to 1.\nWe first compute the expected percentage price change using the modified duration of 4.5 for each rating migration.\nFrom A to AAA\t–4.5 × –0.5% = 2.25%\nFrom A to AA\t–4.5 × –0.3% = 1.35%\nFrom A to A\t–4.5 × 0% = 0%\nFrom A to BBB\t–4.5 × 0.4% = –1.8%\nFrom A to BB\t–4.5 × 0.6% = –2.7%\nFrom A to B\t–4.5 × 0.8% = –3.6%\nFrom A to CCC\t–4.5 × 1.5% = –6.75%\nThe expected price return is computed by multiplying each price change by the probability from the transition matrix in the column with the label rating of \"A\".\nExpected price return = 2.25% × 0.03 + 1.35% × 0.04 + 0% × 0.88 – 1.8% × 0.03 – 2.7% × 0.03 – 3.6% × 0.01 – 6.75% × 0 = –0.0495%\nThe expected total return of the bond: –0.0495% + 1% = 0.9505%, which is rounded to 0.95%.", "ko": "A등급 행(row)의 확률을 쓴다: AAA 2%, AA 3%, A 88%, BBB 2%, BB 2%, B 2%, CCC 1%. 각 등급 변화의 가격 변화 = −modified duration 4.5 × spread 변화: AAA +2.25%, AA +1.35%, A 0, BBB −1.8%, BB −2.7%, B −3.6%, CCC −6.75%. 확률 가중 평균 = 2.25×0.02 + 1.35×0.03 − 1.8×0.02 − 2.7×0.02 − 3.6×0.02 − 6.75×0.01 = −0.144%. 기대 total return = YTM 1% + (−0.144%) = 0.856% ≈ 0.86%.", "trap": "YTM 1%를 빼먹으면 −0.14%, A행 대신 A열 확률을 쓰면 0.95%.", "f": "E[total return] ≈ YTM + Σ p_i × (−ModDur × Δspread_i)", "why": {"A": "YTM을 더하지 않고 spread 변화에 따른 가격 수익만 계산.", "C": "transition matrix의 A행이 아니라 A열 확률을 사용(열은 합이 100%가 아님)."}, "orig": "Mock 5 Session 1 Q1", "conf": false}, {"id": "mock5-Q2", "src": "정답", "module": "FI", "tag": "ABS credit analysis 방법", "vig": 0, "stem": "The most suitable approach for the credit analysis of the commercial ABS is:", "opts": {"A": "loan-by-loan.", "B": "portfolio-based.", "C": "statistics-based."}, "ans": "C", "en": "A. loan-by-loan. — Incorrect\nIncorrect because a loan-by-loan approach is not suitable when the portfolio is granular and homogeneous. Evaluating each loan on an individual basis is too time-consuming and therefore it is not suitable in this case. A loan-by-loan approach would be inefficient because of the large number of basically similar loans.\nB. portfolio-based. — Incorrect\nIncorrect because a portfolio-based approach is not suitable when the portfolio of loans is short-term, as the portfolio does not materially change in the short term. Short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans. A portfolio-based approach is instead more suitable when the portfolio of loans is medium-term/dynamic and therefore subject to change over time.\nC. statistics-based. — Correct\nCorrect because short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans. A statistics-based approach is most suitable when the portfolio of loans is short-term (and therefore fairly static), granular, and homogeneous, like in this case. Portfolio statistics are sufficient to appropriately analyze the credit of the loan pool.", "ko": "대출이 단기이고 granular·homogeneous한 pool이면 포트폴리오가 거의 바뀌지 않으므로 기존 대출 묶음의 통계로 분석하는 statistics-based approach가 맞다. loan-by-loan은 비슷한 소액 대출이 많을 때 비효율적, portfolio-based는 중기·dynamic하게 바뀌는 pool에 쓴다.", "trap": "granular·homogeneous + 단기 → statistics-based, 중기·dynamic → portfolio-based, 소수의 큰 대출 → loan-by-loan.", "f": "", "why": {"A": "비슷한 대출이 많은 granular pool에는 하나씩 보는 방법이 비효율적.", "B": "portfolio-based는 중기적으로 구성이 바뀌는 pool에 적합. 단기 pool은 거의 static."}, "orig": "Mock 5 Session 1 Q2", "conf": false}, {"id": "mock5-Q3", "src": "오답", "module": "FI", "tag": "CDS CTD 결제 총액", "vig": 0, "stem": "At settlement of the Electric Motors CDS, the total proceeds from Jackson’s Bond X and CDS positions are:", "opts": {"A": "$19 million.", "B": "$20 million.", "C": "$21 million."}, "ans": "C", "en": "A. $19 million. — Incorrect\nIncorrect because one may:\nconclude that the cheapest-to-deliver bond is Bond X, as Jackson buys protection using a CDS contract in order to protect from a credit event, and\nincorrectly use the recovery rate of Bond Y to value the position in Bond X.\nIn this case, upon default the value of the position is computed as follows:\nThe position on Bond X is valued $20 million × 35% = $7 million.\nThe payoff on the CDS contract is $20 million × 60% = $12 million.\nThe total proceeds from the combined position are therefore $7 million + $12 million = $19 million.\nB. $20 million. — Incorrect\nIncorrect because one may conclude that the cheapest-to-deliver bond is Bond X, as Jackson buys protection using a CDS contract in order to protect from a credit event.\nIn this case, upon default the value of the position is computed as follows:\nThe position on Bond X is valued $20 million × 40% = $8 million.\nThe payoff on the CDS contract is $20 million × 60% = $12 million.\nThe total proceeds from the combined position are therefore $8 million + $12 million = $20 million.\nC. $21 million. — Correct\nCorrect because Jackson holds a $20 million position in Bond X, and simultaneously has bought protection using a CDS contract referencing Electric Motors.\nUpon default, the value of the position is computed as follows:\nThe position on Bond X is valued $20 million × 40% = $8 million.\nThe payoff on the CDS contract is $20 million × 65% = $13 million.\nThe cheapest-to-deliver (CTD) contract is the one which shall be chosen to deliver. As Bond Y trades at 35% of face value while Bond X trades at 40% of face value, Bond Y is the CTD contract and therefore the recovery rate of the CDS contract is 65%.\nThe total proceeds from the combined position are therefore $8 million + $13 million = $21 million.", "ko": "CDS 결제는 cheapest-to-deliver(CTD) 채권 기준이다. Bond Y(35%)가 Bond X(40%)보다 싸므로 CTD는 Y이고 CDS payoff = $20m × (1 − 35%) = $13m. 보유한 Bond X 가치 = $20m × 40% = $8m. 합계 = $8m + $13m = $21m. 보유 채권보다 CTD가 더 싸서 오히려 액면보다 $1m 더 받는다.", "trap": "CDS payoff를 내가 가진 Bond X(40%) 기준으로 계산하면 $20m(B).", "f": "CDS payoff = Notional × (1 − CTD 가격 비율), 총액 = 보유 채권 가치 + CDS payoff", "why": {"A": "CTD를 X로 보면서 X의 가치를 Y 가격 35%로 평가하는 이중 오류: 7 + 12 = 19.", "B": "CTD를 Bond X로 보고 payoff를 60%로 계산: 8 + 12 = 20. 실제 CTD는 더 싼 Bond Y."}, "orig": "Mock 5 Session 1 Q3", "conf": true, "my": "B"}, {"id": "mock5-Q4", "src": "정답", "module": "FI", "tag": "CDS curve flattening 전략", "vig": 0, "stem": "Which of the following strategies should profit the most from the expected flattening of the Crispy Chips CDS curve?", "opts": {"A": "Strategy 1", "B": "Strategy 2", "C": "Strategy 3"}, "ans": "C", "en": "A. Strategy 1 — Incorrect\nIncorrect because, as the Crispy Chips CDS curve is expected to flatten, Jackson should sell protection using the 5-year contract in order to maximize the gains from a tightening of long-term CDS spreads. On the contrary, buying protection using the 1-year contract minimizes the losses from widening of short-term CDS spreads.\nStrategy 1 incorrectly suggests that selling protection is profitable when CDS spreads increase (rather than decrease), and conversely that buying protection is profitable when CDS spreads decrease (rather than increase).\nB. Strategy 2 — Incorrect\nIncorrect because, as the Crispy Chips CDS curve is expected to flatten, Jackson should sell protection using the 5-year contract in order to maximize the gains from a tightening of long-term CDS spreads. On the contrary, buying protection using the 3-year contract is not the best strategy—losses are minimized when Jackson buys protection using the 1-year contract rather than the 3-year contract.\nStrategy 2 is not the one which Jackson should implement, as Strategy 3 is more profitable.\nC. Strategy 3 — Correct\nCorrect because, as the Crispy Chips CDS curve is expected to flatten, Jackson should sell protection using the 5-year contract in order to maximize the gains from a tightening of long-term CDS spreads. On the contrary, buying protection using the 1-year contract minimizes the losses from widening of short-term CDS spreads.\nPut differently, protection at the short end is expected to become more expensive, so he should buy it now, while protection at the long end is becoming cheaper, so he should sell it now.\nStrategy 3 is the one which Jackson should implement as it yields the maximum profit, should Jackson's expected flattening of the CDS curve materialize.", "ko": "upward-sloping CDS curve가 flatten = 단기 spread는 상대적으로 오르고(넓어지고) 장기 spread는 내려간다(좁아진다). protection buyer는 spread가 오를 때 이익, seller는 spread가 내릴 때 이익. 따라서 단기(1년) protection을 사고 장기(5년) protection을 판다 → Strategy 3. 3년보다 1년이 가장 짧은 끝이라 flattening 효과를 가장 크게 받는다.", "trap": "buy protection = spread 상승에 베팅(short credit), sell protection = spread 하락에 베팅(long credit).", "f": "", "why": {"A": "방향이 반대: 1년을 팔고 5년을 사면 steepening에 베팅.", "B": "방향은 맞지만 3년을 사는 것보다 가장 짧은 1년을 사는 것이 flattening에서 더 이익."}, "orig": "Mock 5 Session 1 Q4", "conf": true}, {"id": "mock5-Q5", "src": "정답", "module": "FSA", "tag": "외화 거래 transaction gain", "vig": 1, "stem": "The foreign currency transaction gain (in UYU millions) on exported goods reported by Celeste in the most recent year is closest to:", "opts": {"A": "0.", "B": "6.9.", "C": "8.4."}, "ans": "C", "en": "A. 0. — Incorrect\nIncorrect because the answer considers that the foreign transaction gain must be deferred until collection. Therefore, the foreign transaction gain as of 31 December is\nUYU 0 million.\nB. 6.9. — Incorrect\nIncorrect because the calculation uses as the transaction exchange rate the average rate for the year instead of the exchange rate of 15 November:\nForeign transaction gain = USD 5 million (44.63 – 43.26) = UYU 6.85 million ~\nUYU 6.9 million.\nC. 8.4. — Correct\nCorrect because for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gain and losses are reported on the income statement.\nAs the export receivable is in USD and the USD appreciated against the UYP from 15 November (42.95 UYU/USD) to 31 December (44.63 UYU/USD), the receivable that remains outstanding as of 31 December generates a foreign transaction gain of:\nForeign transaction gain = USD 5 million (44.63 – 42.95) = UYU 8.4 million", "ko": "11/15에 USD 5m 외상 수출 → 매출채권을 그날 환율 42.95로 기록. 12/31까지 미회수이므로 기말 환율 44.63으로 재평가하고 차이를 income statement에 transaction gain으로 인식(IFRS·US GAAP 모두). 5m × (44.63 − 42.95) = UYU 8.4m. USD가 강해져서(UYU per USD 상승) USD 채권 보유자에게 이익.", "trap": "회수 때까지 미루지 않는다. 거래일 환율 자리에 연평균 환율(43.26)을 쓰면 6.9.", "f": "Transaction gain = 외화 금액 × (기말 환율 − 거래일 환율)", "why": {"A": "결제일이 다음 기간이어도 기말에 미실현 transaction gain을 인식해야 함.", "B": "거래일 환율 대신 연평균 환율 43.26 사용."}, "orig": "Mock 5 Session 1 Q5", "conf": false}, {"id": "mock5-Q6", "src": "정답", "module": "FSA", "tag": "current rate method gross profit", "vig": 1, "stem": "Salto’s contribution to Celeste’s consolidated gross profit (in UYU millions) in the most recent year is closest to:", "opts": {"A": "2,379.", "B": "2,409.", "C": "2,455."}, "ans": "A", "en": "A. 2,379. — Correct\nCorrect because Celeste uses the current rate method to translate Salto’s financial statements. Under such methods, revenues and expenses are translated at the exchange rate that existed when the transaction took place. For practical reasons, a rate that approximates the exchange rates at the dates of the transactions, such as an average exchange rate, may be used. Therefore, Salto’s translated gross profit (Salto’s contribution to Celeste’s consolidated gross profit) in the most recent year is:\nGross profit = Revenue (USD) × Average exchange rate – Cost of sales (USD) × Average exchange rate\nGross profit = USD 120 million × 43.26 – USD 65 million × 43.26 = UYU 2,379.3 million ~ UYU 2,379\nB. 2,409. — Incorrect\nIncorrect because it translates revenue and cost of sales using the temporal method, instead of the current rate method.\nGross profit = Revenue (USD) × Average exchange rate – Cost of sales (USD) × Average exchange rate for inventory purchases\nGross profit = USD 120 million × 43.26 – USD 65 million × 42.81 = UYU 2,408.55 million ~ UYU 2,409\nC. 2,455. — Incorrect\nIncorrect because it translates revenue and cost of sales using the end-of-year exchange rate as if those items were balance sheet items.\nGross profit = Revenue (USD) × End-of-year exchange rate – Cost of sales (USD) × End-of-year exchange rate\nGross profit = USD 120 million × 44.63 – USD 65 million × 44.63 = UYU 2,454.65 million ~ UYU 2,455", "ko": "current rate method에서는 수익·비용을 모두 거래 시점 환율(실무상 평균 환율 43.26)로 환산한다. gross profit = (120 − 65) × 43.26 = UYU 2,379.3m ≈ 2,379.", "trap": "COGS를 재고 매입 환율(historical)로 환산하는 것은 temporal method.", "f": "Current rate method: 손익계산서 항목 × 평균 환율", "why": {"B": "COGS를 재고 매입 평균 환율 42.81로 환산한 temporal method 방식.", "C": "손익 항목을 기말 환율 44.63으로 환산(재무상태표처럼 처리)."}, "orig": "Mock 5 Session 1 Q6", "conf": false}, {"id": "mock5-Q7", "src": "오답", "module": "FSA", "tag": "temporal vs current rate 자본 크기", "vig": 1, "stem": "If Monte's results had been translated using the current rate method, its total shareholders' equity would have been:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "C", "en": "A. lower. — Incorrect\nIncorrect because the method Celeste used to translate Monte’s financial statements (temporal method) resulted in total shareholders’ equity that was lower than it would have been under the current rate method.\nB. the same. — Incorrect\nIncorrect because the method Celeste used to translate Monte’s financial statements (temporal method) resulted in total shareholders’ equity that was lower than it would have been under the current rate method.\nC. higher. — Correct\nCorrect because Celeste uses the temporal method to translate Monte’s financial statements. Under this method, monetary assets and liabilities (in USD) are translated at the current exchange rate, non-monetary assets and liabilities measured at historical cost (in USD) are translated at historical exchange rates.\nMonte’s monetary assets and liabilities were translated using the end-of-year exchange rate (44.63 UYU/USD). Monte’s non-monetary assets (the only non-monetary assets are inventory and fixed assets, and all liabilities are monetary) were translated using the average exchange rate prevailing at time of purchase (42.15 UYU/USD). This last exchange rate is lower than the end-of-year exchange rate.\nIf Celeste had used the method used for Salto to translate Monte’s financial statements (the current rate method), all assets and liabilities (in USD) would have been translated (into UYU) at the current exchange rate at balance sheet date (44.63 UYU/USD).\nTherefore, the method Celeste used to translate Monte’s financial statements (temporal method) resulted in total shareholders’ equity that was lower than it would have been under the current rate method.", "ko": "Monte는 temporal method: monetary 자산·부채는 기말 환율 44.63, non-monetary 자산(재고·고정자산)은 historical 환율 42.15로 환산. 부채는 전부 monetary. current rate method라면 모든 자산·부채를 44.63으로 환산. 차이는 non-monetary 자산뿐이고 USD가 강해졌으므로(44.63 > 42.15) current rate method에서 자산이 더 크게 환산된다 → 자본도 더 크다. 즉 current rate method를 썼다면 자본이 higher.", "trap": "부채가 모두 monetary라 부채는 두 방법에서 같다. 비교는 non-monetary 자산 환산 환율만 보면 된다.", "f": "자본 = 자산 − 부채. 두 방법의 차이 = non-monetary 자산 × (기말 환율 − historical 환율)", "why": {"A": "반대 방향. 외화(USD) 강세 + non-monetary 자산 → current rate method가 자산·자본을 더 크게 만듦.", "B": "non-monetary 자산에 쓰는 환율이 달라(42.15 vs 44.63) 자본이 달라진다."}, "orig": "Mock 5 Session 1 Q7", "conf": true, "my": "A"}, {"id": "mock5-Q8", "src": "오답", "module": "FSA", "tag": "hyperinflation 자회사 환산 (IFRS)", "vig": 1, "stem": "Is Romano correct about the method that Celeste should use to translate the new subsidiary’s financial statements?", "opts": {"A": "Yes", "B": "No, because Celeste should use the temporal method", "C": "No, because Celeste should use the average exchange rate for the income statement"}, "ans": "A", "en": "A. Yes — Correct\nCorrect because when a foreign entity is located in a highly inflationary economy IFRS requires that the foreign entity’s financial statements first be restated for local inflation using the procedures outlined in IAS 29. Then, the inflation-restated foreign currency financial statements are translated into the parent’s presentation currency using the current exchange rate.\nTherefore, Romano is correct about the method that Celeste should use to translate the new subsidiary’s financial statements.\nB. No, because Celeste should use the temporal method — Incorrect\nIncorrect because Celeste should use the method indicated by Romano to translate the new subsidiary’s financial statements, and not the temporal method.\nC. No, because Celeste should use the average exchange rate for the income statement — Incorrect\nIncorrect because Celeste should use the method indicated by Romano to translate the new subsidiary’s financial statements. This method uses the current exchange rate as of year-end both for the balance sheet and the income statement.", "ko": "IFRS에서 highly inflationary economy의 자회사는 먼저 IAS 29로 현지 인플레이션 restatement를 하고, 그다음 재무상태표와 손익계산서 모두 기말 current exchange rate로 환산한다. Romano가 말한 방법이 정확히 이것이므로 Yes. (US GAAP은 hyperinflation이면 temporal method — IFRS와 다름.)", "trap": "temporal method는 US GAAP의 hyperinflation 처리. IFRS는 restate 후 기말 환율로 손익까지 모두 환산.", "f": "", "why": {"B": "temporal method는 US GAAP 규칙. IFRS는 inflation restatement 후 current rate.", "C": "IFRS hyperinflation 처리에서는 손익계산서도 평균 환율이 아니라 기말 환율로 환산."}, "orig": "Mock 5 Session 1 Q8", "conf": false, "my": "C"}, {"id": "mock5-Q9", "src": "정답", "module": "PM", "tag": "macro factor model 기대수익률", "vig": 2, "stem": "Based on the two-factor macroeconomic model, which ETF has the highest expected return?", "opts": {"A": "ETF 1", "B": "ETF 2", "C": "ETF 3"}, "ans": "B", "en": "A. ETF 1 — Incorrect\nIncorrect because ETF 1 has the lowest expected return of 7%. The intercept term represents the expected return of the asset, which reflects the effects of the predicted values of the macroeconomic variables on expected stock returns. The ETF with the highest expected return will be the one that has the highest intercept term. The expected returns on ETF 1, ETF 2 and ETF 3 are 7%, 9% and 8% respectively. Therefore, ETF 2 has the highest expected return and ETF 1 has the lowest expected return.\nB. ETF 2 — Correct\nCorrect because ETF 2 has the highest intercept term of 9%. Macroeconomic factor models analyze the return to an asset in three components, the asset's expected return, its unexpected return resulting from new information about the factors, and an error term. More specifically, the intercept term represents the expected return of the asset, which reflects the effects of the predicted values of the macroeconomic variables on expected stock returns. The ETF with the highest expected return will be the one that has the highest intercept term. The expected returns on ETF 1, ETF 2 and ETF 3 are 7%, 9% and 8% respectively. Therefore, ETF 2 has the highest expected return.\nC. ETF 3 — Incorrect\nIncorrect because ETF 3 has the second highest expected return of 8%.ETF 3 has the highest sensitivity to surprises in inflation and the lowest sensitivity to surprises in unemployment. However, these sensitivities are not relevant to expected return. Instead, the intercept term represents the expected return of the asset, which reflects the effects of the predicted values of the macroeconomic variables on expected stock returns. The ETF with the highest expected return will be the one that has the highest intercept term. The expected returns on ETF 1, ETF 2 and ETF 3 are 7%, 9% and 8% respectively. Therefore, ETF 2 has the highest expected return", "ko": "macroeconomic factor model에서 절편(intercept)이 기대수익률이고, factor 항은 surprise(예상 밖 변화)에 대한 반응이다. 절편: ETF 1 = 7%, ETF 2 = 9%, ETF 3 = 8% → ETF 2가 가장 높다.", "trap": "factor sensitivity(β)는 surprise에 대한 반응이라 기대수익률과 관계없다.", "f": "R_i = E(R_i) + b_i1 F1 + b_i2 F2 + ε_i", "why": {"A": "절편 7%로 가장 낮다.", "C": "inflation sensitivity가 가장 크지만 기대수익률은 절편 8%."}, "orig": "Mock 5 Session 1 Q9", "conf": false}, {"id": "mock5-Q10", "src": "정답", "module": "PM", "tag": "ETF 보유 비용 (holding period)", "vig": 2, "stem": "Excluding any compounding effects, the expected total holding period cost of investing in ETF 1 is closest to:", "opts": {"A": "0.33%.", "B": "0.35%.", "C": "0.41%."}, "ans": "B", "en": "A. 0.33%. — Incorrect\nIncorrect because this holding period cost assumes that annual management fee is constant and not a function of holding period.\n15-month holding period cost = trading costs (round-trip trading commission and bid-ask spread) and management fees (mistakenly not adjusted for holding period) = 0.05% + 0.20% + 0.08% = 0.33%.\nB. 0.35%. — Correct\nCorrect because expected total holding period cost can be estimated as the sum of trading costs (round-trip trading commission and bid-ask spread) and management fees (adjusted for holding period):\n15-month holding period cost = 0.05% + 0.20% + (15/12) × 0.08% = 0.35%.\nC. 0.41%. — Incorrect\nIncorrect because this holding period cost assumes that trading costs are also a function of the holding period.\n15-month holding period cost = [trading costs (round-trip trading commission and bid-ask spread) and management fees] × adjustment for holding period = (0.05% + 0.20% + 0.08%) × (15/12) = 0.4125% ≈ 0.41%.", "ko": "15개월 총 비용 = 왕복 trading commission 0.05% + bid-offer spread 0.20% + 연 management fee 0.08% × 15/12 = 0.05 + 0.20 + 0.10 = 0.35%. 거래 비용은 한 번만 들고 보수만 기간에 비례한다.", "trap": "trading cost는 기간 조정하지 않는다. 보수는 기간 비례.", "f": "Holding period cost = 왕복 commission + bid-ask spread + 연 보수 × (기간/12)", "why": {"A": "management fee를 15개월로 조정하지 않음.", "C": "trading cost까지 15/12배."}, "orig": "Mock 5 Session 1 Q10", "conf": false}, {"id": "mock5-Q11", "src": "정답", "module": "PM", "tag": "active return 분해 (factor tilt vs selection)", "vig": 2, "stem": "Which of the following had the largest contribution to the manager's active return?", "opts": {"A": "Tilt on Factor 1", "B": "Tilt on Factor 2", "C": "Security selection"}, "ans": "C", "en": "A. Tilt on Factor 1 — Incorrect\nIncorrect because the tilt on Factor 1 has the smallest contribution (i.e. 0.8% < 1%) to the manager's active return of 2.675%.\nFundamental factor models can be used to decompose active return of a manager into two parts: (1) active return component due to factor tilts and (2) active return component due to security selection. The first component can be calculated as the product of managerial factor tilts and factor returns. Given the information in the exhibit, contribution of factor tilts of each factor can be calculated as:\nContribution of Factor 1 tilt to active return = [(–1.00) – (–0.60)] × (– 2.00%) = 0.8%\nContribution of Factor 2 tilt to active return = (0.50 – 0.25) × 3.50% = 0.875%\nGiven that security selection is 1%, the active return of the manager's portfolio is 2.675% (= 0.8% + 0.875% + 1 %). Therefore, security selection has the largest contribution to the manager's active return.\nB. Tilt on Factor 2 — Incorrect\nIncorrect because tilt on Factor 2 has the second largest contribution (i.e. 0.875% < 1%) to the manager's active return of 2.675%.\nFundamental factor models can be used to decompose active return of a manager into two parts: (1) active return component due to factor tilts and (2) active return component due to security selection. The first component can be calculated as the product of managerial factor tilts and factor returns. Given the information in the exhibit, contribution of factor tilts of each factor can be calculated as:\nContribution of Factor 1 tilt to active return = [(–1.00) – (–0.60)] × (– 2.00%) = 0.8%\nContribution of Factor 2 tilt to active return = (0.50 – 0.25) × 3.50% = 0.875%\nGiven that security selection is 1%, the active return of the manager's portfolio is 2.675% (= 0.8% + 0.875% + 1 %). Therefore, security selection has the largest contribution to the manager's active return.\nC. Security selection — Correct\nCorrect because security selection of 1% represents the largest contribution to the manager's active return of 2.675%.\nFundamental factor models can be used to decompose active return of a manager into two parts: (1) active return component due to factor tilts and (2) active return component due to security selection. The first component can be calculated as the product of managerial factor tilts and factor returns. Given the information in the exhibit, contribution of factor tilts of each factor can be calculated as:\nContribution of Factor 1 tilt to active return = [(–1.00) – (–0.60)] × (– 2.00%) = 0.8%\nContribution of Factor 2 tilt to active return = (0.50 – 0.25) × 3.50% = 0.875%\nGiven that security selection is 1%, the active return of the manager's portfolio is 2.675% (= 0.8% + 0.875% + 1 %). Therefore, security selection has the largest contribution to the manager's active return.", "ko": "factor tilt 기여 = (포트폴리오 sensitivity − 벤치마크 sensitivity) × factor return. Factor 1: (−1.00 − (−0.60)) × (−2%) = +0.8%. Factor 2: (0.50 − 0.25) × 3.5% = +0.875%. security selection = 1%. 총 active return 2.675% 중 security selection 1%가 가장 크다.", "trap": "Factor 1은 sensitivity·return 둘 다 음수라 기여는 양수(+0.8%).", "f": "Factor tilt 기여 = (β_P − β_B) × factor return", "why": {"A": "0.8%로 가장 작다.", "B": "0.875%로 security selection 1%보다 작다."}, "orig": "Mock 5 Session 1 Q11", "conf": false}, {"id": "mock5-Q12", "src": "정답", "module": "PM", "tag": "APT arbitrage 전략", "vig": 2, "stem": "The arbitrage opportunity identified by Diamond can be best exploited with:", "opts": {"A": "Strategy 1.", "B": "Strategy 2.", "C": "Strategy 3."}, "ans": "B", "en": "A. Strategy 1. — Incorrect\nIncorrect because this strategy has a positive factor sensitivity and therefore is not an arbitrage opportunity.\nArbitrage opportunity can be defined as an opportunity to earn an expected positive net profit without risk and with no net investment of money. Therefore, one needs to identify which strategy satisfies this definition and choose the strategy with the highest expected return if multiple strategies provide an arbitrage opportunity.\nAll three strategies have zero net investment (i.e. long and short side of the trade sum to $2 million), implying that all strategies are valid arbitrage candidates. The next step requires calculating factor sensitivities for each strategy (to ensure that strategies have zero factor sensitivities). These can be calculated as a weighted average of portfolio factor sensitivities (weights are based on dollar amounts):\nStrategy 1 Factor sensitivity = 100% × 1.00 – 80% × 0.50 – 20% × 0.85 = 0.430\nwhere 100% = $2m / $2m, –80% = $1.6m / $2m and –20% = $0.4m / $2m\nStrategy 2 Factor sensitivity = 30% × 0.50 + 70% × 1.00 – 100% × 0.85 = 0\nwhere 30% = $0.6m / $2m, 70% = $1.4m / $2m and 100% = $2m / $2m\nStrategy 3 Factor sensitivity = 10% × 0.85 + 90% × 1.00 – 100% × 0.50 = 0.485\nwhere 10% = $0.2m / $2m, 90% = $1.8m / $2m and 100% = $2m / $2m\nOnly Strategy 2 has zero factor sensitivity and therefore Strategy 2 can be the only arbitrage opportunity. The other two strategies have positive factor sensitivities, thus any return they offer will be due to risk exposure but not due to arbitrage.\nB. Strategy 2. — Correct\nCorrect because this is the only arbitrage strategy with zero factor sensitivity and positive expected return.\nArbitrage opportunity can be defined as an opportunity to earn an expected positive net profit without risk and with no net investment of money. Therefore, one needs to identify which strategy satisfies this definition and choose the strategy with the highest expected return if multiple strategies provide an arbitrage opportunity.\nAll three strategies have zero net investment (i.e. long and short side of the trade sum to $2 million), implying that all strategies are valid arbitrage candidates. The next step requires calculating factor sensitivities for each strategy (to ensure that strategies have zero factor sensitivities). These can be calculated as a weighted average of portfolio factor sensitivities (weights are based on dollar amounts):\nStrategy 1 Factor sensitivity = 100% × 1.00 – 80% × 0.50 – 20% × 0.85 = 0.430\nwhere 100% = $2m / $2m, –80% = $1.6m / $2m and –20% = $0.4m / $2m\nStrategy 2 Factor sensitivity = 30% × 0.50 + 70% × 1.00 – 100% × 0.85 = 0\nwhere 30% = $0.6m / $2m, 70% = $1.4m / $2m and 100% = $2m / $2m\nStrategy 3 Factor sensitivity = 10% × 0.85 + 90% × 1.00 – 100% × 0.50 = 0.485\nwhere 10% = $0.2m / $2m, 90% = $1.8m / $2m and 100% = $2m / $2m\nOnly Strategy 2 has zero factor sensitivity and therefore Strategy 2 can be the only arbitrage opportunity. The other two strategies have positive factor sensitivities, thus any return they offer will be due to risk exposure but not due to arbitrage.\nC. Strategy 3. — Incorrect\nIncorrect because this strategy has a positive factor sensitivity and therefore is not an arbitrage opportunity.\nArbitrage opportunity can be defined as an opportunity to earn an expected positive net profit without risk and with no net investment of money. Therefore, one needs to identify which strategy satisfies this definition and choose the strategy with the highest expected return if multiple strategies provide an arbitrage opportunity.\nAll three strategies have zero net investment (i.e. long and short side of the trade sum to $2 million) implying that all strategies are valid arbitrage candidates. The next step requires calculating factor sensitivities for each strategy (to ensure that strategies have zero factor sensitivities). These can be calculated as a weighted average of portfolio factor sensitivities (weights are based on dollar amounts):\nStrategy 1 Factor sensitivity = 100% × 1.00 – 80% × 0.50 – 20% × 0.85 = 0.430\nwhere 100% = $2m / $2m, –80% = $1.6m / $2m and –20% = $0.4m / $2m\nStrategy 2 Factor sensitivity = 30% × 0.50 + 70% × 1.00 – 100% × 0.85 = 0\nwhere 30% = $0.6 m / $2m, 70% = $1.4 m / $2m and 100% = $2m / $2m\nStrategy 3 Factor sensitivity = 10% × 0.85 + 90% × 1.00 – 100% × 0.50 = 0.485\nwhere 10% = $0.2 m / $2m, 90% = $1.8m / $2m and 100% = $2m / $2m\nOnly Strategy 2 has zero factor sensitivity and therefore Strategy 2 can be the only arbitrage opportunity. The other two strategies have positive factor sensitivities thus any return they offer will be due to risk exposure but not due to arbitrage.", "ko": "arbitrage = 순투자 0, factor risk 0, 양의 기대수익. 세 전략 모두 long $2m·short $2m이라 순투자 0. factor sensitivity: Strategy 1 = 1.00 − 0.8×0.50 − 0.2×0.85 = 0.43, Strategy 2 = 0.3×0.50 + 0.7×1.00 − 0.85 = 0, Strategy 3 = 0.1×0.85 + 0.9×1.00 − 0.50 = 0.485. sensitivity 0은 Strategy 2뿐. 기대수익 = 0.3×7% + 0.7×11% − 9% = 0.8% > 0 → $2m × 0.8% = $16,000 무위험 이익.", "trap": "순투자 0만 보지 말고 factor sensitivity가 0인지 확인.", "f": "포트폴리오 β = Σ w_i β_i (달러 비중), arbitrage 조건: 순투자 0, β = 0, E(R) > 0", "why": {"A": "factor sensitivity 0.43 > 0이라 risk가 남아 arbitrage 아님.", "C": "factor sensitivity 0.485 > 0이라 arbitrage 아님."}, "orig": "Mock 5 Session 1 Q12", "conf": false}, {"id": "mock5-Q13", "src": "정답", "module": "ECO", "tag": "neoclassical steady-state 성장률", "vig": 3, "stem": "Based on the neoclassical model, the steady-state growth rate for Country A is closest to:", "opts": {"A": "3.8%.", "B": "4.7%.", "C": "5.6%."}, "ans": "B", "en": "A. 3.8%. — Incorrect\nIncorrect because it omits growth in the labor force from the steady-state growth rate calculation:\nΔY/Y = θ/(1 – α) + n = 2.1%/(0.552) + 0.9% = 3.8044 ≈ 3.8%\nB. 4.7%. — Correct\nCorrect because in order to calculate the steady-state growth rate under the neoclassical model, growth rate of total factor productivity is scaled by labor factor share and added to growth rate in the labor force\nΔY/Y = θ/(1 – α) + n = 2.1%/(0.552) + 0.9% = 4.7044 ≈ 4.7%\nwhere:\nΔY/Y = steady state growth rate\nθ = growth rate of total factor productivity = 2.1%\nα = elasticity of output with respect to capital\n1 – α = labor cost in total factor cost = labor share of output = 0.552\nn = growth rate in the labor force = 0.9%\nC. 5.6%. — Incorrect\nIncorrect because it misinterprets the elasticity of output due to labor productivity:\nα = elasticity of output with respect to labor (instead of capital)\n1 – α =1 – elasticity of output with respect to labor = 1 – 0.552 = 0.448\nΔY/Y = θ/(1 – α) + n = 2.1%/(0.448) + 0.9% = 0.0559 ≈ 5.6%", "ko": "neoclassical(Solow) 모델의 steady-state GDP 성장률 = TFP 성장률/labor share + 노동력 성장률. labor share(1 − α) = 55.2%. 2.1%/0.552 + 0.9% = 3.80% + 0.9% = 4.70%.", "trap": "1 − α가 labor share(0.552). α를 0.552로 착각하면 5.6%.", "f": "ΔY/Y = θ/(1 − α) + n", "why": {"A": "노동력 성장률 n(0.9%)을 더하지 않음 → 이는 1인당 성장률.", "C": "labor cost 비중을 α로 착각해 1 − α = 0.448 사용."}, "orig": "Mock 5 Session 1 Q13", "conf": false}, {"id": "mock5-Q14", "src": "정답", "module": "ECO", "tag": "labor productivity growth accounting", "vig": 3, "stem": "Based on the labor productivity growth accounting equation, the potential GDP growth rate of Country B is:", "opts": {"A": "2.0%.", "B": "2.8%.", "C": "4.3%."}, "ans": "B", "en": "A. 2.0%. — Incorrect\nIncorrect because it adds total factor productivity growth instead of the growth rate in labor productivity.\nGrowth rate in potential GDP = Growth rate in the labor force + Growth rate in labor productivity + Growth rate of total factor productivity = 0.5% + 2.3% + 1.5% = 2.0%\nB. 2.8%. — Correct\nCorrect because as per labor productivity growth accounting equation, growth rate in potential GDP is calculated as the sum of the growth rate in labor force and growth rate in labor productivity.\nGrowth rate in potential GDP = Growth rate in the labor force + Growth rate in labor productivity = 0.5% + 2.3% = 2.8%\nC. 4.3%. — Incorrect\nIncorrect because it adds growth rate of total factor productivity to the equation.\nGrowth rate in potential GDP = Growth rate in the labor force + Growth rate in labor productivity + growth rate of total factor productivity = 0.5% + 2.3% + 1.5% = 4.3%", "ko": "labor productivity growth accounting equation: 잠재 GDP 성장률 = 노동력 성장률 + 노동생산성 성장률 = 0.5% + 2.3% = 2.8%. TFP는 이미 노동생산성 안에 반영되어 있어 따로 더하지 않는다.", "trap": "TFP를 또 더하면 이중 계산.", "f": "Potential GDP growth = 노동력 성장률 + labor productivity 성장률", "why": {"A": "노동생산성 성장률 대신 TFP 성장률을 더함: 0.5% + 1.5% = 2.0%.", "C": "TFP 1.5%까지 더해 이중 계산."}, "orig": "Mock 5 Session 1 Q14", "conf": false}, {"id": "mock5-Q15", "src": "정답", "module": "ECO", "tag": "무역 개방과 성장 모델", "vig": 3, "stem": "Which of the following models would best support Podlasky's conclusion regarding the impact of removing Country A's trade barriers?", "opts": {"A": "Classical growth model", "B": "Neoclassical growth model", "C": "Endogenous growth model"}, "ans": "C", "en": "A. Classical growth model — Incorrect\nIncorrect because under the classical growth model no factor can lead to economic growth level rising permanently. Per capita economic growth under the classical model is only temporary because an exploding population with limited resources brings growth to an end.\nB. Neoclassical growth model — Incorrect\nIncorrect because although under the neoclassical model: opening up the economy to trade and financial flows can significantly affect the rate of growth in an economy; however, this does not permanently raise the rate of economic growth. In the Solow model, after the reallocation of world savings, there is no permanent increase in the rate of growth in an economy. In contrast to the neoclassical model, endogenous growth models predict that a more open trade policy will permanently raise the rate of economic growth.\nC. Endogenous growth model — Correct\nCorrect because open trade (removing trade barriers) fosters innovation and through selection, scale and backwardness effects, international trade will increase output. In contrast to the neoclassical model, endogenous growth models predict that a more open trade policy will permanently raise the rate of economic growth. Faster capital accumulation translates one for one into faster growth in output per capita.", "ko": "endogenous growth model은 개방 무역이 혁신·규모·선택 효과를 통해 성장률을 영구적으로 높인다고 본다. neoclassical 모델에서는 개방으로 성장이 일시적으로 빨라질 뿐 steady state 성장률은 그대로이고, classical 모델은 인구 증가로 1인당 성장이 결국 멈춘다.", "trap": "neoclassical: 개방 효과는 일시적(전환기), endogenous: 영구적.", "f": "", "why": {"A": "classical 모델에서는 1인당 성장이 인구 폭증으로 일시적일 뿐.", "B": "neoclassical에서는 자본 재배분 후 성장률이 영구적으로 오르지 않는다."}, "orig": "Mock 5 Session 1 Q15", "conf": false}, {"id": "mock5-Q16", "src": "정답", "module": "ECO", "tag": "output gap 변화의 시사점", "vig": 3, "stem": "Podlasky's revisions to the growth forecasts for Country B most likely imply:", "opts": {"A": "lower expected long-term equity returns and higher expected short-term inflation.", "B": "higher expected long-term equity returns and lower expected short-term inflation.", "C": "higher expected long-term equity returns and higher expected short-term inflation."}, "ans": "B", "en": "A. lower expected long-term equity returns and higher expected short-term inflation. — Incorrect\nIncorrect because the output gap is widening. A higher growth rate in potential GDP implies higher — not lower — long-term equity returns. Also, short-term GDP growth below(above) the potential GDP growth rate puts downward(upward) pressure on inflation, which puts corresponding pressure on nominal interest rates and bond prices.\nB. higher expected long-term equity returns and lower expected short-term inflation. — Correct\nCorrect because a higher estimated growth rate in potential GDP implies higher long-term equity returns. Also, a lower estimate of short-term GDP implies lower expected short-term inflation.\nC. higher expected long-term equity returns and higher expected short-term inflation. — Incorrect\nIncorrect because the output gap is widening. A higher estimated growth rate in potential GDP implies a higher and not lower long-term equity returns. Also, a lower estimate of short-term GDP growth implies lower and not higher expected short-term inflation.", "ko": "잠재 GDP 성장률을 0.2%p 올렸다 → 장기 equity 수익률 기대 상승. 단기 GDP 성장을 0.6%p 내렸다 → 실제 성장이 잠재 성장보다 더 낮아져(slack 확대) 단기 인플레이션 압력 하락. 따라서 장기 equity 수익률 ↑, 단기 인플레이션 ↓.", "trap": "장기 equity 전망은 잠재 성장, 단기 인플레이션은 단기 성장과 잠재 성장의 차이로 판단.", "f": "", "why": {"A": "잠재 성장률 상향은 장기 equity 수익률을 높이고, 단기 성장 하향은 인플레이션을 낮춘다. 둘 다 반대.", "C": "단기 GDP 성장 하향은 인플레이션을 높이는 것이 아니라 낮춘다."}, "orig": "Mock 5 Session 1 Q16", "conf": true}, {"id": "mock5-Q17", "src": "정답", "module": "DER", "tag": "delta hedge 주식 수", "vig": 4, "stem": "To delta hedge her call option position on Skyview, how many shares of Skyview should Wu buy?", "opts": {"A": "456", "B": "480", "C": "544"}, "ans": "C", "en": "A. 456 — Incorrect\nIncorrect because this number of shares is based on (1 – N(d1)) = 1 – 0.544 = 0.456. Since each call option contract is for 100 shares and Wu sells 10 contracts, we get 0.456 × 100 × 10 = 456 shares.\nB. 480 — Incorrect\nIncorrect because the number of shares is calculated based on N(d2) = 0.480 rather than N(d1) = 0.544. Since each call option contract is for 100 shares and Wu sells 10 contracts, we get 0.480 × 100 × 10 = 480 shares.\nC. 544 — Correct\nCorrect because, based on the BSM model, the correct number of shares to buy per option sold is equal to N(d1) = 0.544 since Skyview is a non-dividend-paying stock. Since each call option contract sold is for 100 shares and Wu sells 10 contracts, the correct number of shares to purchase for the delta hedge is 0.544 × 100 × 10 = 544 shares.", "ko": "무배당 주식 콜의 delta = N(d1) = 0.544. 콜 10계약 × 100주를 팔았으므로 delta hedge에 필요한 주식 매수량 = 0.544 × 1,000 = 544주.", "trap": "N(d2)는 delta가 아니다(만기 ITM 위험중립 확률).", "f": "Hedge 주식 수 = N(d1) × 계약 수 × 100", "why": {"A": "1 − N(d1) 사용(put delta의 크기).", "B": "N(d1) 대신 N(d2) 사용."}, "orig": "Mock 5 Session 1 Q17", "conf": false}, {"id": "mock5-Q18", "src": "오답", "module": "DER", "tag": "short call delta hedge의 gamma", "vig": 4, "stem": "The gamma of Wu's delta-hedged position would be:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "A", "en": "A. negative. — Correct\nCorrect because, for Wu's delta-hedged position, we are long the stock (which has zero gamma) and short the call (short call gamma is negative). The call has positive gamma and since we are short, the call position in our portfolio will have negative gamma, leaving us with an overall gamma that is negative (short call/long stock combined).\nB. zero. — Incorrect\nIncorrect because the delta-hedged position that includes a short call will have negative gamma even though the long stock position has zero gamma.\nC. positive. — Incorrect\nIncorrect because the delta-hedged position with a short call will have negative gamma. The call itself has positive gamma and since we are short, the call position in our portfolio will have negative gamma.", "ko": "position = short call + long stock. 주식의 gamma는 0, 콜의 gamma는 양수인데 short이므로 −. 합계 gamma는 음수. delta는 0으로 맞췄어도 gamma는 남는다(주가가 크게 움직이면 손해).", "trap": "delta-neutral ≠ gamma-neutral. 주식으로는 gamma를 없앨 수 없다.", "f": "Position gamma = 주식 gamma(0) + (−1) × call gamma", "why": {"B": "주식 gamma가 0이라 short call의 음의 gamma가 그대로 남는다.", "C": "long call이면 양수지만 Wu는 콜을 팔았다(short)."}, "orig": "Mock 5 Session 1 Q18", "conf": true, "my": "C"}, {"id": "mock5-Q19", "src": "정답", "module": "DER", "tag": "theta로 하루 뒤 옵션 가치", "vig": 4, "stem": "Holding all else constant, the value of the call on Skyview one day after Wu's sale will be closest to:", "opts": {"A": "$3.255.", "B": "$3.287.", "C": "$3.323."}, "ans": "B", "en": "A. $3.255. — Incorrect\nIncorrect because it incorrectly uses gamma = 0.05 in place of theta: Option value 1 day later = current option value minus gamma = $3.305 – $0.050 = $3.255.\nB. $3.287. — Correct\nCorrect because the calculation of how option value changes given the passage of time (1 day, assuming all else constant) is given by daily theta = –0.018. The initial option value is $3.305 and, after 1 day, the option value would be $3.305 – $0.018 = $3.287.\nC. $3.323. — Incorrect\nIncorrect because it adds the effect of theta rather than subtracting it: $3.305 + $0.018 = $3.323.", "ko": "다른 조건이 같으면 하루 지날 때 옵션 가치 변화 = daily theta = −0.018. 3.305 − 0.018 = $3.287.", "trap": "theta는 음수 → 더하면 가치가 줄어든다. gamma와 혼동 금지.", "f": "V(t+1일) ≈ V + theta(daily)", "why": {"A": "theta 대신 gamma 0.050을 뺐다.", "C": "theta를 더하는 방향으로 계산(3.305 + 0.018)."}, "orig": "Mock 5 Session 1 Q19", "conf": true}, {"id": "mock5-Q20", "src": "정답", "module": "DER", "tag": "2기간 binomial American put", "vig": 4, "stem": "Using the two-period binomial option pricing model, the value of the American put on Wilbo Corporation is closest to:", "opts": {"A": "$5.19.", "B": "$6.85.", "C": "$12.90."}, "ans": "B", "en": "A. $5.19. — Incorrect\nIncorrect because this is the European put price.\nCalculations based on this are as follows (risk-neutral probability = 0.625, which is given):\nEnding stock prices at T = 2 (given in Exhibit 2) and put prices (X = 98) are:\nu×u×S = 144 and Puu = 0\nu×d×S = 96 and Pud = 2\nd×d×S = 64 and Pdd = 34\nPut prices at T = 1 are the PV of the expected T = 2 put prices as follows:\nStock price = u×S = 120; Put value = [0.625(0) + 0.375(2)]/1.05 = 0.7143\nStock price = d×S = 80; Put value = [0.625(2) + 0.375(34)]/1.05 = 13.3333\nWorking backwards to T = 0, we have the European put value as the PV of the expected T = 1 values as follows:\nPut value = [0.625(0.7143) + 0.375(13.3333)]/1.05 = 5.19\nB. $6.85. — Correct\nCorrect because the put is correctly exercised when the stock price at T = 1 is equal to 80. Calculations based on this are as follows (risk-neutral probability = 0.625, which is given):\nEnding stock prices at T = 2 and put prices (X = 98) are:\nu×u×S = 144 and Puu = 0\nu×d×S = 96 and Pud = 2\nd×d×S = 64 and Pdd = 34\nPut prices at T = 1 are the PV of the expected T = 2 put prices as follows\n(will first show European values):\nStock price = u×S = 120; Put value = [0.625(0) + 0.375(2)]/1.05 = 0.7143\nStock price = d×S = 80; Put value = [0.625(2) + 0.375(34)]/1.05 = 13.3333\nAt T = 1, when the stock price is d×S = 80, the exercised value (X = 98) is 18, therefore it is optimal to exercise because 18 > 13.3333.\nWorking backwards to T = 0, we have the American put value as the PV of the expected T = 1 values as follows:\nPut value = [0.625(0.7143) + 0.375(18)]/1.05 = 6.85\nC. $12.90. — Incorrect\nIncorrect because, in the calculation of the expected payoff, the option values associated with the \"up\" stock prices are multiplied by 1 – p rather than p (and p for the associated down values). Calculations are as follows and p = 0.625.\nEnding stock prices at T = 2 and put prices (X = 98) are:\nu×u×S = 144 and Puu = 0\nu×d×S = 96 and Pud = 2\nd×d×S = 64 and Pdd = 34\nPut prices at T = 1 are the PV of the expected T = 2 put prices as follows\n(will first show European values):\nStock price = u×S = 120; Put value = [0.375(0) + 0.625(2)]/1.05 = 1.1905\nStock price = d×S = 80; Put value = [0.375(2) + 0.625(34)]/1.05 = 20.9524 (i.e., do not exercise since exercised value is 18)\nWorking backwards to T = 0, we have the American put value as the PV of the expected T = 1 values as follows:\nPut value = [0.375(1.1905) + 0.625(20.9524)]/1.05 = 12.90.", "ko": "T=2 put payoff(X=98): S++=144 → 0, S+−=96 → 2, S−−=64 → 34. T=1: S+=120에서 (0.625×0 + 0.375×2)/1.05 = 0.7143. S−=80에서 hold 가치 (0.625×2 + 0.375×34)/1.05 = 13.33, 즉시 exercise 가치 98 − 80 = 18 > 13.33 → 조기 행사, 18 사용. T=0: (0.625×0.7143 + 0.375×18)/1.05 = 6.85.", "trap": "American put은 각 노드에서 조기 행사 가치와 비교해야 한다. 안 하면 European 5.19.", "f": "노드 가치 = max[행사 가치, (π·V_up + (1−π)·V_down)/(1+r)]", "why": {"A": "T=1 하락 노드에서 조기 행사를 검토하지 않은 European put 가치.", "C": "up 노드에 1−π, down 노드에 π를 곱해 확률을 뒤바꿈."}, "orig": "Mock 5 Session 1 Q20", "conf": false}, {"id": "mock5-Q21", "src": "정답", "module": "FSA", "tag": "cash-flow-based accruals ratio", "vig": 5, "stem": "Apex's cash-flow-based accruals ratio for the year just ended is closest to:", "opts": {"A": "9%.", "B": "10%.", "C": "11%."}, "ans": "C", "en": "A. 9%. — Incorrect\nIncorrect because financing cash flow is included in the calculation as follows:\n= [NI1 − (CFO1 + CFI1+ CFF1] / [(NOA1 + NOA0) / 2]\n= [83 − [113 + (–58) + 5]] / [(280 + 229) / 2]\n= [83 − (60)] / [(509) / 2]\n= 23 / 254.5 ≈ 9%\nB. 10%. — Incorrect\nIncorrect because net operating assets of the year just ended is used instead of average net operating assets as follows:\n= [NI1 − (CFO1 + CFI1)] / NOA1\n= [83 − [113 + (–58)]] / 280\n= [83 − (55)] / 280\n= 28 / 280 = 10%\nC. 11%. — Correct\nCorrect because the cash flow accruals ratio for the year just ended is 11% as follows:\n= [NI1 − (CFO1 + CFI1)] / [(NOA1 + NOA0) / 2]\nwhere:\nNI = net income\nCFO = cash flow from operations\nCFI = cash flow from investing\nNOA = net operating assets\n= [83 − [113 + (–58)]] / [(280 + 229) / 2]\n= [83 − (55)] / [(509) / 2]\n= 28 / 254.5 ≈ 11%", "ko": "cash flow accruals ratio = [NI − (CFO + CFI)] / 평균 NOA = [83 − (113 − 58)] / [(280 + 229)/2] = 28 / 254.5 = 11%. CFF는 넣지 않는다.", "trap": "CFF는 제외, 분모는 기말이 아니라 평균 NOA.", "f": "Cash-flow accruals ratio = [NI − (CFO + CFI)] / 평균 NOA", "why": {"A": "CFF(+5)까지 포함해 23/254.5.", "B": "평균 대신 기말 NOA 280 사용."}, "orig": "Mock 5 Session 1 Q21", "conf": false}, {"id": "mock5-Q22", "src": "정답", "module": "FSA", "tag": "재고 비유동 재분류 → 비율 영향", "vig": 5, "stem": "As a result of Apex's reclassification of its inventory in the year that has just ended, which of the following ratios most likely increased?", "opts": {"A": "Current ratio", "B": "Inventory turnover", "C": "Days of inventory on hand"}, "ans": "B", "en": "A. Current ratio — Incorrect\nIncorrect because Apex's reclassifies its inventory, which is part of current assets, to other non-current assets therefore the current ratio will decrease because current assets will decrease and current liabilities will stay the same.\nB. Inventory turnover — Correct\nCorrect because the inventory turnover calculated using the reported inventory number will most likely increase because the amount of inventory relative to cost of goods sold will decrease.\nC. Days of inventory on hand — Incorrect\nIncorrect because the number of days of inventory on hand calculated using the reported inventory number will most likely decrease because the amount of inventory relative to cost of goods sold will decrease.", "ko": "1년 내 안 팔릴 재고를 other non-current assets로 옮기면 보고된 재고가 줄어든다. inventory turnover = COGS / 재고 → 분모 감소로 상승. days of inventory on hand는 하락. current ratio는 유동자산 감소로 하락.", "trap": "재고가 줄면 turnover ↑, DOH ↓, current ratio ↓.", "f": "Inventory turnover = COGS / 평균 재고, DOH = 365 / turnover", "why": {"A": "유동자산(재고)이 줄어 current ratio는 하락.", "C": "turnover가 오르므로 DOH는 하락."}, "orig": "Mock 5 Session 1 Q22", "conf": false}, {"id": "mock5-Q23", "src": "정답", "module": "FSA", "tag": "지배력 취득 회계 방법", "vig": 5, "stem": "Apex should account for its purchase of Beast using the:", "opts": {"A": "equity method.", "B": "acquisition method.", "C": "proportionate consolidation method."}, "ans": "B", "en": "A. equity method. — Incorrect\nIncorrect because if Apex is deemed to have control over Beast, it would use the acquisition method to account for Beast in its consolidated financial statements. The equity method is used for some joint ventures and when there is significant influence but not control. In this case, Apex has an 80% stake and has control over Beast.\nB. acquisition method. — Correct\nCorrect because if Apex is deemed to have control over Beast, it would use the acquisition method to account for Beast in its consolidated financial statements. In this case, Apex has an 80% stake and has control over Beast.\nC. proportionate consolidation method. — Incorrect\nIncorrect because if Apex is deemed to have control over Beast, it would use the acquisition method to account for Beast in its consolidated financial statements. Proportionate consolidation is used for joint ventures. In this case, Apex has an 80% stake and has control over Beast.", "ko": "80% 지분 + control → acquisition method로 연결(consolidation). equity method는 significant influence(지배력 없음)일 때, proportionate consolidation은 일부 joint venture 처리 방식이다.", "trap": "지분율이 아니라 control 여부가 기준.", "f": "", "why": {"A": "equity method는 significant influence일 때. 지배력이 있으면 연결.", "C": "proportionate consolidation은 joint venture용."}, "orig": "Mock 5 Session 1 Q23", "conf": false}, {"id": "mock5-Q24", "src": "정답", "module": "FSA", "tag": "US GAAP full goodwill", "vig": 5, "stem": "As a result of its purchase of Beast, Apex should recognize goodwill of:", "opts": {"A": "$4 million.", "B": "$5 million.", "C": "$6 million."}, "ans": "B", "en": "A. $4 million. — Incorrect\nIncorrect because Apex reports under US GAAP, and should report $5 million under the full goodwill method. This would be the amount reported under the partial goodwill method. Partial goodwill = Fair value of consideration – Share of fair value of identifiable net assets = $24 million – 80% × $ 25 million = $24 million – $20 million = $4 million.\nB. $5 million. — Correct\nCorrect because Apex reports under US GAAP, and should report $5 million under the full goodwill method. Full goodwill = Fair value of entity – Fair value of identifiable net assets = $30 million – $25 million = $5 million.\nC. $6 million. — Incorrect\nIncorrect because Apex reports under US GAAP, and should report $5 million under the full goodwill method. If acquisition cost was used instead of fair value of identifiable net assets then full goodwill would = $30 million – $24 million = $6 million.", "ko": "US GAAP은 full goodwill method만 허용. full goodwill = 피취득 회사 전체 fair value − 식별 가능 순자산 fair value = $30m − $25m = $5m. (IFRS에서 선택 가능한 partial goodwill = 24 − 0.8×25 = $4m.)", "trap": "US GAAP은 full만. partial(4m)은 IFRS 선택지.", "f": "Full goodwill = 전체 회사 FV − 식별 순자산 FV, Partial = 대가 − 지분율 × 식별 순자산 FV", "why": {"A": "IFRS에서만 가능한 partial goodwill 금액.", "C": "식별 순자산 FV 대신 취득 대가 24m를 차감."}, "orig": "Mock 5 Session 1 Q24", "conf": false}, {"id": "mock5-Q25", "src": "정답", "module": "EQ", "tag": "residual income 계산", "vig": 6, "stem": "The residual income for LuftComm is closest to:", "opts": {"A": "€122 million.", "B": "€200 million.", "C": "€275 million."}, "ans": "A", "en": "A. €122 million. — Correct\nCorrect because LuftComm’s residual income of €122 million can be calculated using net income and the equity charge (Residual Income = Net Income – Equity Charge) or using net operating profit after taxes and the total capital charge (NOPAT = EBIT × (1 – Tax rate)).\nOption 1:\nUsing Net Income and the Equity Charge (values in € millions):\nEBIT\t700\nLess: Interest Expense\t(180)\n= Pretax Income\t520\nLess: Income Taxes\t(78)\n= Net Income\t442\nEquity Charge = Book Value of Equity × Cost of Equity\nEquity Charge = (Book Value of Assets – Book Value of Debt) × Cost of Equity\nEquity Charge = (5,000 – 3,000) × 0.16 = 320\nResidual Income = Net Income – Equity Charge\nResidual Income = 442 – 320 = 122\nOption 2:\nUsing NOPAT and the Total Capital Charge (Values in € millions):\nNOPAT = EBIT × (1 – Tax Rate)\nNOPAT= 700 × (1 – 0.15) = 595\nDebt Charge = Book Value of Debt × Pretax Cost of Debt × (1 – Tax Rate)\nDebt Charge = 3,000 × 0.06 × (1 – 0.15) = 153\nEquity Charge = (Book Value of Assets – Book Value of Debt) × Cost of Equity\nEquity Charge = (5,000 – 3,000) × 0.16 = 320\nTotal Capital Charge = Debt Charge + Equity Charge\nTotal Capital Charge = 153 + 320 = 473\nResidual Income = NOPAT – Total Capital Charge\nResidual Income = 595 – 473 = 122\nB. €200 million. — Incorrect\nIncorrect because €200 million is mistakenly derived by using pretax earnings instead of net income in the residual income calculation (values in € millions):\nEBIT\t700\nLess: Interest Expense\t(180)\n= Pretax Income\t520\nLess: Income Taxes\t<OMITTED>\n= Net Income\t520\nEquity Charge = Book Value of Equity × Cost of Equity\nEquity Charge = (Book Value of Assets – Book Value of Debt) × Cost of Equity\nEquity Charge = (5,000 – 3,000) × 0.16 = 320\nIncorrect Residual Income = Incorrect Net Income – Equity Charge\nIncorrect Residual Income = 520 – 320 = 200\nC. €275 million. — Incorrect\nIncorrect because €275 million is mistakenly derived due to the deduction of the equity charge from NOPAT instead of Net Income. That is, it fails to consider the debt charge when using the NOPAT approach to computing Residual Income (values in € millions):\nNOPAT = EBIT × (1 – Tax Rate)\nNOPAT= 700 × (1 – 0.15) = 595\nEquity Charge = (Book Value of Assets – Book Value of Debt) × Cost of Equity\nEquity Charge = (5,000 – 3,000) × 0.16 = 320\nTotal Capital Charge = Debt Charge <OMITTED> + Equity Charge\nIncorrect Total Capital Charge = 0 + 320 = 320\nResidual Income = NOPAT – Total Capital Charge\nIncorrect Residual Income = 595 – 320 = 275", "ko": "이자 = 3,000 × 6% = 180. 세전이익 = 700 − 180 = 520, 세금 15% = 78, NI = 442. 자기자본 장부가 = 5,000 − 3,000 = 2,000, equity charge = 2,000 × 16% = 320. RI = 442 − 320 = €122m. (검산: NOPAT 595 − 부채 비용 3,000×6%×0.85 = 153 − equity charge 320 = 122.)", "trap": "NOPAT에서 equity charge만 빼면 부채 비용이 빠져 275.", "f": "RI = NI − B × r_e = NOPAT − (부채 after-tax 비용 + equity charge)", "why": {"B": "세전이익 520에서 equity charge를 뺌(세금 누락).", "C": "NOPAT에서 equity charge만 빼고 debt charge를 빠뜨림."}, "orig": "Mock 5 Session 1 Q25", "conf": false}, {"id": "mock5-Q26", "src": "오답", "module": "EQ", "tag": "single-stage RI 모델 implied growth", "vig": 6, "stem": "Based on the single-stage residual income model, the implied growth rate of earnings for LuftComm is closest to:", "opts": {"A": "6.1%.", "B": "9.2%.", "C": "12.8%."}, "ans": "B", "en": "A. 6.1%. — Incorrect\nIncorrect because 6.1% is the difference between ROE and the cost of equity. Incorrect implied growth rate = 22.1% – 16.0% = 6.1%\nB. 9.2%. — Correct\nCorrect because the implied growth rate of earnings from the single-stage residual income model is calculated by solving for g in the following equation:\nV0 = B0 + B0[(ROE – r)/ (r – g)]\nwhich gives the following:\ng = r – [((ROE – r) × B0)/ (V0 – B0)].\nBook value per share can be calculated using the given price-to-book ratio and market price per share as follows:\nBook value per share (B0) = Market price per share/Price-to-book ratio\nBook value per share (B0) = 44.65 / 1.90 = 23.50\nUsing the market price per share (44.65) as V0, the book value (23.50) as B0, the ROE (22.1%), and the cost of equity (16%) as r, the implied growth rate (g) can be solved as follows:\ng = r – [((ROE – r) × B0) / (V0 – B0)]\ng = 0.160 – [((0.221 – 0.160) × 23.50) / (44.65 – 23.50)] = 0.09222 ≈ 9.2%\nC. 12.8%. — Incorrect\nIncorrect because of the omission of the initial book value of equity (B0) as the first term in the single-stage residual income model.\nCorrect Formula: V0 = B0 + B0[(ROE – r)/ (r – g)]\nIncorrect Formula: V0 = [(ROE – r) / (r – g)] B0\nIncorrect g = r – [((ROE – r) × B0)/ V0]\nIncorrect g = 0.160 – [((0.221 – 0.160) × 23.50) / 44.65] = 0.1279 ≈ 12.8%", "ko": "B0 = 주가 / P/B = 44.65 / 1.90 = 23.50. single-stage RI: V0 = B0 + B0(ROE − r)/(r − g). g로 풀면 g = r − (ROE − r)×B0/(V0 − B0) = 0.16 − (0.061 × 23.50)/(44.65 − 23.50) = 0.16 − 1.4335/21.15 = 0.16 − 0.0678 = 9.2%.", "trap": "분모는 V0가 아니라 V0 − B0(장부가를 넘는 premium). V0를 쓰면 12.8%.", "f": "g = r − [(ROE − r) × B0] / (V0 − B0)", "why": {"A": "ROE − r(22.1% − 16%)를 성장률로 착각.", "C": "모델에서 첫 항 B0를 빠뜨려 분모에 V0 사용."}, "orig": "Mock 5 Session 1 Q26", "conf": false, "my": "C"}, {"id": "mock5-Q27", "src": "정답", "module": "EQ", "tag": "RI persistence factor 낮은 이유", "vig": 6, "stem": "Relative to the industry, the persistence factor used in the preliminary report on PrimaNet is most consistent with the firm having:", "opts": {"A": "lower levels of dividend payouts.", "B": "lower levels of accounting returns.", "C": "higher levels of accounting accruals."}, "ans": "C", "en": "A. lower levels of dividend payouts. — Incorrect\nIncorrect because PrimaNet’s persistence is lower than the industry average, which is inconsistent with low dividend payouts. Instead, low dividend payout is associated with higher residual income persistence.\nB. lower levels of accounting returns. — Incorrect\nIncorrect because PrimaNet’s persistence is lower than the industry average, which is inconsistent with low levels of accounting rates of return (ROE). Instead, high or extreme levels of accounting return (ROE) are associated with lower residual income persistence.\nC. higher levels of accounting accruals. — Correct\nCorrect because the persistence factor utilized in the preliminary report on PrimaNet is significantly lower than the industry average. High or extreme levels of accounting accruals is consistent with lower residual income persistence.", "ko": "persistence factor(ω)가 업계 평균보다 낮다 = residual income이 빨리 사라진다. 낮은 persistence와 관련된 특징: 극단적으로 높은 ROE, 높은 accounting accruals, 높은 배당성향, 과거 산업 수준 이상의 ROE 등. 따라서 accruals가 높은 것이 맞다.", "trap": "낮은 배당성향·높은 accruals 방향을 헷갈리지 않기: 낮은 배당성향 → persistence 높음, 높은 accruals → persistence 낮음.", "f": "", "why": {"A": "낮은 배당성향은 높은 persistence와 관련.", "B": "persistence가 낮은 것은 극단적으로 높은 ROE와 관련, 낮은 ROE가 아님."}, "orig": "Mock 5 Session 1 Q27", "conf": true}, {"id": "mock5-Q28", "src": "정답", "module": "EQ", "tag": "finite-horizon RI 모델 가치", "vig": 6, "stem": "Based on the finite-horizon multistage residual income model, PrimaNet's intrinsic value per share is closest to:", "opts": {"A": "€24.91.", "B": "€25.17.", "C": "€25.50."}, "ans": "A", "en": "A. €24.91. — Correct\nCorrect because the intrinsic value per share of €24.91 is calculated by adding the present value of residual income in Year 1, present value of income in Year 2, and the present value of the terminal value (premium of market value over book value) at the end of Year 2.\nWhere:\nV0 = Intrinsic value per share today\nB0 = Book value per share today = €18.50 in Exhibit 2\nThe middle term is the sum of the present values of residual income for each year of the forecast period = €2.25 for Year 1 and €2.00 for Year 2\nPT = market price at the end of the forecast period = €26.50\nBT = book value at the end of the forecast period = €23.75\nr = cost of equity = 12.8%\nV0 = 18.50 + 2.25 + 2.00 + [(26.50 - 23.75) / (1.128)^2] = €24.91\nB. €25.17. — Incorrect\nIncorrect because it mistakenly uses the WACC (6.5%) as the discount rate for the premium over book value at the end of Year 2 (Terminal Value of 2.75) instead of the cost of equity (12.80%).\nIncorrect V0 = 18.50 + 2.25 + 2.00 + [(26.50 - 23.75) / (1.065)^2] = €25.17\nC. €25.50. — Incorrect\nIncorrect because it fails to discount the present value of premium (market price less book value) at the end of Year 2 (terminal value of 2.75).\nIncorrect V0 = 18.50 + 2.25 + 2.00 + (26.50 - 23.75) = €25.50", "ko": "V0 = B0 + 각 해 RI의 PV + (P_T − B_T)/(1 + r)^T = 18.50 + 2.25 + 2.00 + (26.50 − 23.75)/1.128^2 = 22.75 + 2.75/1.2724 = 22.75 + 2.16 = €24.91. 할인율은 cost of equity 12.8%.", "trap": "RI 모델 할인율은 WACC가 아니라 cost of equity. 마지막 premium도 할인해야 한다.", "f": "V0 = B0 + Σ PV(RI_t) + (P_T − B_T)/(1 + r_e)^T", "why": {"B": "premium을 WACC 6.5%로 할인.", "C": "premium 2.75를 할인하지 않음."}, "orig": "Mock 5 Session 1 Q28", "conf": true}, {"id": "mock5-Q29", "src": "정답", "module": "PM", "tag": "경기 침체기 방어 섹터", "vig": 7, "stem": "Based on Franca's forecasts, which of the following sectors will most likely have the smallest decrease in profitability next year?", "opts": {"A": "Durable goods", "B": "Staple consumer goods", "C": "Discretionary consumer goods"}, "ans": "B", "en": "A. Durable goods — Incorrect\nIncorrect because the data in Exhibit 1 forecasts a contraction in the economy (negative real GDP growth) over the next year. Companies that produce durable goods would see earnings fall substantially in this type of economic environment. We can expect then that the profits of companies that produce durable as opposed to non-durable goods to be commensurately more volatile too.\nB. Staple consumer goods — Correct\nCorrect because the data in Exhibit 1 forecasts a contraction in the economy over the next year. Nominal GDP growth will decline from 5.00% to 4.50% and real GDP growth from 2.00% to –0.50%, and the unemployment rate will increase by 1.50 percentage points. Recessions are associated with declines in employment, incomes, output, and, subsequently, profitability. Cyclical sectors are represented by companies that produce discretionary consumer goods, whereas the non-cyclical index is represented by an index that includes companies that produce staple (or less discretionary) consumer goods. The demand for staples will remain fairly stable over the business cycle.\nC. Discretionary consumer goods — Incorrect\nIncorrect because the data in Exhibit 1 forecasts a contraction in the economy (negative real GDP growth) over the next year. Companies that produce discretionary consumer goods would see earnings fall substantially in this type of economic environment.", "ko": "명목 GDP 성장 5% → 4.5%, 인플레이션 3% → 5% → 실질 GDP 성장 2% → −0.5%로 침체, 실업률도 1.5%p 상승. 침체기에는 수요가 꾸준한 staple consumer goods(non-cyclical) 이익이 가장 덜 줄어든다. durable·discretionary는 cyclical이라 크게 감소.", "trap": "명목 GDP가 플러스여도 인플레이션을 빼면 실질은 마이너스.", "f": "실질 GDP 성장 ≈ 명목 성장 − 인플레이션", "why": {"A": "durable goods는 cyclical, 침체기 이익이 크게 감소.", "C": "discretionary consumer goods는 cyclical."}, "orig": "Mock 5 Session 1 Q29", "conf": false}, {"id": "mock5-Q30", "src": "정답", "module": "PM", "tag": "information ratio", "vig": 7, "stem": "The information ratio for Souza's portfolio over the past five years is closest to:", "opts": {"A": "0.27.", "B": "0.38.", "C": "0.80."}, "ans": "B", "en": "A. 0.27. — Incorrect\nIncorrect because in this calculation, the Sharpe ratio, (RP – RF)/σP, was calculated instead of the information ratio, (7.50% – 3.50%)/15.00% = 4.00%/15.00% = 0.27.\nB. 0.38. — Correct\nCorrect because the information ratio (IR) is calculated as:\nIR = (RP – RB)/σ(RP – RB) = RA/σA = (7.50% – 5.60%)/5.00% = 1.90%/5.00% = 0.38.\nIR compares a portfolio's active return relative to a benchmark with the volatility of the active return or active risk.\nC. 0.80. — Incorrect\nIncorrect because in this calculation, the risk-free rate was used rather than the benchmark return, (7.50% – 3.50%)/5.00% = 4.00%/5.00% = 0.80.", "ko": "IR = active return / active risk = (7.50% − 5.60%) / 5.00% = 1.90/5.00 = 0.38.", "trap": "Sharpe ratio(무위험 이자율, 총 변동성)와 혼동 금지.", "f": "IR = (R_P − R_B) / σ(R_P − R_B)", "why": {"A": "Sharpe ratio (7.5 − 3.5)/15 = 0.27.", "C": "벤치마크 대신 무위험 이자율을 차감 (7.5 − 3.5)/5."}, "orig": "Mock 5 Session 1 Q30", "conf": false}, {"id": "mock5-Q31", "src": "오답", "module": "PM", "tag": "optimal active weight 크기 결정", "vig": 7, "stem": "Which of the following would most likely result in Souza's desired change of optimal active weights?", "opts": {"A": "A decrease in both the information coefficient and the target active risk", "B": "An increase in the information coefficient and a decrease in the target active risk", "C": "A decrease in the information coefficient and an increase in the target active risk"}, "ans": "B", "en": "A. A decrease in both the information coefficient and the target active risk — Incorrect\nIncorrect because investors with higher IC, or ability to forecast returns, will add more value over time but only to the extent that those forecasts are exploited in the construction of the managed portfolio. So, a higher information coefficient results in smaller optimal active weights.\nB. An increase in the information coefficient and a decrease in the target active risk — Correct\nCorrect because investors with higher IC, or ability to forecast returns, will add more value over time but only to the extent that those forecasts are exploited in the construction of the managed portfolio. So, a higher information coefficient results in smaller optimal active weights. In addition, the desire for more active portfolio risk requires larger individual active weights. So, a lower target active risk results in smaller optimal active weights.\nC. A decrease in the information coefficient and an increase in the target active risk — Incorrect\nIncorrect because investors with higher IC, or ability to forecast returns, will add more value over time but only to the extent that those forecasts are exploited in the construction of the managed portfolio. So, a higher information coefficient results in smaller optimal active weights. In addition, the desire for more active portfolio risk requires larger individual active weights. So, a lower target active risk results in smaller active weights.", "ko": "optimal active weight ∝ (IC 기반 기대 active return) × (σ_A / (IC × √BR)) 형태로, target active risk에 비례하고 IC에는 반비례한다. 즉 active risk 목표가 낮을수록 weight가 작고, IC가 높을수록(같은 active risk를 내는 데 필요한 베팅이 작아) weight가 작다. 따라서 IC ↑ + target active risk ↓.", "

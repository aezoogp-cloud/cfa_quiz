le": "DER", "tag": "equity swap 가치 (receive equity)", "vig": 17, "stem": "The no-arbitrage value (in EUR) of Bueden's position in the equity swap is closest to:", "opts": {"A": "−19,200.", "B": "23,860.", "C": "33,262."}, "ans": "B", "en": "A. −19,200. — Incorrect\nIncorrect because the sum of the present value factors (0.99108 + 0.97371 + 0.95694 = 2.92173) is multiplied by the fixed income cash flows (1,000,000 x 2.3% = 23,000): 2.92173 x 23,000 = 67,200. This is subtracted from the equity return (1,000,000 x 104.8/100 – 1,000,000 = 48,000) to arrive at –19,200.\nB. 23,860. — Correct\nCorrect because to determine the value of the fixed leg, the present value factors are multiplied by the fixed income cash flows (1,000,000 x 2.3% = 23,000) as follows:\n0.99108 x 23,000 = 22,795\n0.97371 x 23,000 = 22,395\n0.95694 x 1,023,000 = 978,950\nand then 22,795 + 22,395 + 978,950 = 1,024,140.\nThe equity investment becomes 1,000,000 x 104.8 / 100 = 1,048,000.\nThe difference is 1,048,000 - 1,024,140 = 23,860.\nC. 33,262. — Incorrect\nIncorrect because the present value factors are used to determine the equilibrium interest rate (at initiation) by calculating (1 - last PV factor) / Sum of PV-factors. This yields 1 - 0.95694 / 2.92173 = 0.014738. The difference between the equity return of 0.048 and 0.014738 = 0.033262 which multiplied by 1,000,000 = 33,262.", "ko": "fixed leg는 initiation 때 고정한 2.3%로 계속 지급한다(현재 시장 rate 1.8%는 무관). fixed leg 가치 = 23,000 × 0.99108 + 23,000 × 0.97371 + 1,023,000 × 0.95694 = 22,795 + 22,395 + 978,950 = 1,024,140. equity leg 가치 = 1,000,000 × 104.8/100 = 1,048,000. receive-equity 가치 = 1,048,000 − 1,024,140 = EUR 23,860.", "trap": "fixed leg에 notional 원금(1,000,000)을 마지막에 포함해야 한다.", "f": "V(receive equity) = N × S_t/S_0 − N × [c × Σ PV + PV_last]", "why": {"A": "fixed leg를 쿠폰만의 PV(67,200)로 보고 equity 이익 48,000에서 뺌. 원금 PV 처리 누락.", "C": "현재 swap rate를 구해 equity 수익률과 비교하는 잘못된 방법."}, "orig": "Mock 5 Session 2 Q25", "conf": true}, {"id": "mock5-Q70", "src": "정답", "module": "DER", "tag": "currency swap 고정금리 (분기)", "vig": 17, "stem": "The interest rate on the AUD leg that results in a contract value of zero at swap initiation is closest to:", "opts": {"A": "0.44%.", "B": "1.29%.", "C": "2.06%."}, "ans": "C", "en": "A. 0.44%. — Incorrect\nIncorrect because PV (90) is used in the formula instead of PV(360). (1 - 0.9957) / 3.94889 = 0.0011. Annualizing this quarterly rate (0.0011 x 4) yields 0.44%.\nB. 1.29%. — Incorrect\nIncorrect because the average of the four PVs ((0.9957 + 0.9901 + 0.9835 + 0.9797) / 4 = 0.987223) is used in the formula instead of PV(360). (1 - 0.987223) / 3.94889 = 0.0032. Annualizing this quarterly rate (0.0032 x 4) yields 1.29%.\nC. 2.06%. — Correct\nCorrect because the formula for calculating the interest rate in a fixed-for-fixed swap is\n(1 - PV(360)) / ( Sum of PVs). (1 – 0.97965) / 3.94889 = 0.005153. Annualizing this quarterly rate (0.005153 x 4) yields 2.06%.", "ko": "fixed swap rate(분기) = (1 − 마지막 PV factor)/(PV factor 합) = (1 − 0.97965)/3.94889 = 0.005153. 분기 지급이므로 연율 = 0.005153 × 4 = 2.06%.", "trap": "분자에는 마지막(1년) PV factor를 쓰고, 연율화(× 4)를 잊지 않는다.", "f": "Swap rate(per period) = (1 − PV_n) / Σ PV_i, 연율 = × 지급 횟수", "why": {"A": "마지막 대신 첫 번째(0.25년) PV factor 사용.", "B": "PV factor 평균을 사용."}, "orig": "Mock 5 Session 2 Q26", "conf": true}, {"id": "mock5-Q71", "src": "정답", "module": "DER", "tag": "forward 저평가 → reverse carry arbitrage", "vig": 17, "stem": "Exploiting the arbitrage opportunity in Reyab shares involves:", "opts": {"A": "selling the forward contract and purchasing the underlying with borrowed funds.", "B": "selling the forward contract and investing the proceeds at the risk-free interest rate.", "C": "buying the forward contract, selling the underlying short, and investing the proceeds at the risk-free interest rate."}, "ans": "C", "en": "A. selling the forward contract and purchasing the underlying with borrowed funds. — Incorrect\nIncorrect because selling the forward contract and purchasing the underlying with borrowed funds would be the appropriate arbitrage strategy if the observed forward price was above the theoretical arbitrage-free forward price, which is not the case.\nB. selling the forward contract and investing the proceeds at the risk-free interest rate. — Incorrect\nIncorrect because selling the forward and investing the proceeds at the risk-free interest rate exposes the investor to price risk and is therefore not an arbitrage strategy.\nC. buying the forward contract, selling the underlying short, and investing the proceeds at the risk-free interest rate. — Correct\nCorrect because where the observed forward price (in this case EUR 63.25) is below the theoretical arbitrage-free forward price (in this case EUR 63.65), reverse carry arbitrage is the appropriate strategy to exploit the arbitrage opportunity. Reverse carry arbitrage involves the following steps: (1) Buy the forward contract, (2) Sell the underlying short, (3) Lend (invest) the short sale proceeds.", "ko": "시장 forward 63.25 < 이론가 63.65 → forward가 싸다. 싼 것(forward)을 사고 비싼 것(현물)을 판다: forward 매수, 주식 short, short 대금을 무위험 이자율로 투자 = reverse carry arbitrage. 만기에 63.65 가치를 63.25에 사서 short을 갚는다.", "trap": "F_market > F_theory이면 carry arbitrage(forward 매도, 차입해 현물 매수).", "f": "F_market < F_theory → reverse carry: long forward, short spot, lend", "why": {"A": "forward가 이론가보다 비쌀 때 쓰는 carry arbitrage.", "B": "현물 hedge가 없어 가격 위험에 노출되므로 arbitrage가 아니다."}, "orig": "Mock 5 Session 2 Q27", "conf": false}, {"id": "mock5-Q72", "src": "정답", "module": "DER", "tag": "기존 equity forward 가치", "vig": 17, "stem": "Six months after initiation, the value (in EUR) of the forward contract on Furblag shares is closest to:", "opts": {"A": "7.97.", "B": "8.49.", "C": "8.97."}, "ans": "B", "en": "A. 7.97. — Incorrect\nIncorrect because the difference between St and F0 is incorrectly used in the discount calculation.\n= (131 – 123) /1.016^0.25\n= 7.97\nB. 8.49. — Correct\nCorrect because the value of a forward contract is given as Vt = St - PV(F0), where St is the underlying price at Time t and PV(F0) is calculated based on the remaining 3 months (0.25 years).\n= 131 – 123/1.016^0.25\n= 8.49\nC. 8.97. — Incorrect\nIncorrect because six months (i.e. the time that has passed rather than the three months remaining) is incorrectly used for calculating PV(F0).\n= 131 – 123/1.016^0.5\n= 8.97", "ko": "배당은 이미 지급되어 남은 배당이 없다. long forward 가치 V_t = S_t − F0/(1 + r)^(T − t) = 131 − 123/1.016^0.25 = 131 − 122.51 = EUR 8.49. 남은 기간은 9 − 6 = 3개월(0.25년).", "trap": "할인 기간은 지난 6개월이 아니라 남은 3개월.", "f": "V_t = S_t − PV(남은 배당) − F0/(1 + r)^(T − t)", "why": {"A": "(S − F0) 전체를 할인함.", "C": "지난 기간 0.5년으로 F0를 할인."}, "orig": "Mock 5 Session 2 Q28", "conf": false}, {"id": "mock5-Q73", "src": "정답", "module": "EQ", "tag": "적자 자원 기업 — asset-based valuation", "vig": 18, "stem": "Which of the following valuation methods would be most appropriate to value Globac?", "opts": {"A": "Asset-based valuation", "B": "Discounted cash flow model", "C": "Relative valuation using P/E multiple"}, "ans": "A", "en": "A. Asset-based valuation — Correct\nCorrect because Globac has significant iron ore reserves. Asset-based valuation would be a better fit given the company is struggling financially and the value of the company will be derived from its assets (in this case iron ore reserves). Asset-based valuation values a company on the basis of the market value of the assets or resources it controls. Hence, the method is a reasonable approach.\nB. Discounted cash flow model — Incorrect\nIncorrect because earnings are negative and likely to remain negative due to which the discounted cash flow model cannot be applied.\nC. Relative valuation using P/E multiple — Incorrect\nIncorrect because earnings are negative and likely to remain negative. Hence, the company cannot be valued using P/E relative to its peers. A relative valuation model estimates an asset’s value relative to that of another asset. The idea underlying relative valuation is that similar assets should sell at similar prices.", "ko": "Globac은 이익과 영업현금흐름이 계속 음수일 전망이라 DCF와 P/E 비교가 어렵다. 가치는 대부분 철광석 매장량(자원)에서 나오므로 자산의 시장가치로 평가하는 asset-based valuation이 적절하다.", "trap": "자원 기업 + 적자 → asset-based.", "f": "", "why": {"B": "현금흐름이 계속 음수라 DCF 적용이 어렵다.", "C": "이익이 음수라 P/E가 의미 없다."}, "orig": "Mock 5 Session 2 Q29", "conf": false}, {"id": "mock5-Q74", "src": "정답", "module": "EQ", "tag": "FCFF 계산", "vig": 18, "stem": "Waltun's FCFF for the most recent year (in $ millions) is:", "opts": {"A": "335.", "B": "350.", "C": "360."}, "ans": "A", "en": "A. 335. — Correct\nCorrect because FCFF = NI + Dep + Int(1 – Tax rate) – FCInv – WCInv\nNet income = NI = 500\nDepreciation = Dep = 25\nInterest expense = Int = 50\nTax rate = 30%\nFixed capital investment = FCInv = 75\nWorking capital investment = WCInv = 150\nFCFF = 500 + 25 + 50 × (1 – 30%) – 75 – 150 = 335\nAlternate calculation:\nFCFF = CFO + Int(1 – Tax rate) – FCInv\nFCFF = 375 + 50 × (1 – 30%) – 75 = 335\nB. 350. — Incorrect\nIncorrect because the interest is not adjusted by the tax rate.\nIncorrect formula:\nFCFF = NI + Dep + Int – FCInv – WCInv\nFCFF = 500 + 25 + 50 – 75 – 150 = 350\nC. 360. — Incorrect\nIncorrect because depreciation is incorrectly added into the formula below:\nFCFF = CFO + Int(1 – Tax rate) – FCInv + Dep\nFCFF = 375 + 50 × (1 – 30%) – 75 + 25", "ko": "FCFF = NI + 감가상각 + 이자 × (1 − t) − FCInv − WCInv = 500 + 25 + 50 × 0.7 − 75 − 150 = 335. (검산: CFO 375 + 35 − 75 = 335. CFO에는 이미 감가상각과 WCInv가 반영되어 있다.)", "trap": "이자는 세후로 더한다. CFO에서 시작하면 감가상각을 또 더하지 않는다.", "f": "FCFF = NI + NCC + Int(1 − t) − FCInv − WCInv = CFO + Int(1 − t) − FCInv", "why": {"B": "이자를 세후 조정 없이 50 전부 더함.", "C": "CFO 방식에서 감가상각을 다시 더함."}, "orig": "Mock 5 Session 2 Q30", "conf": false}, {"id": "mock5-Q75", "src": "정답", "module": "EQ", "tag": "2-stage FCFE 가치", "vig": 18, "stem": "Based on Laver's assumptions, the intrinsic value (in $ millions) of Dentoc's common equity is closest to:", "opts": {"A": "14,807.", "B": "16,055.", "C": "19,300."}, "ans": "B", "en": "A. 14,807. — Incorrect\nIncorrect because the PV is wrongly calculated by discounting the terminal value over four years rather than three years.\n\tYear 0\tYear 1\tYear 2\tYear 3\tYear 4\nFCFE\t750\t750 × 1.12 = 840\t840 × 1.12 = 940.8\t940.8 × 1.12 = 1,053.696\t\nTV\t\t\t\t\t1,053.696 × (1 + 4%) / (10% – 4%) = 18,264.064\nSum\t\t840\t940.8\t1,053.696\t18,264.064\nPV\t\t840 / (1 + 10%)^1 = 763.636\t940.8 / (1 + 10%)^2 = 777.521\t1,053.696 / (1 + 10%)^3 = 791.657\t18,264.064 / (1 + 10%)^4 = 12,474.601\nSum of PV\t14,807.41 ≈ 14,807\t\t\t\t\nB. 16,055. — Correct\nCorrect because the equity value is the sum of PV of FCFEs and PV of Terminal Value (TV).\n\tYear 0\tYear 1\tYear 2\tYear 3\nFCFE\t750\t750 × 1.12 = 840\t840 × 1.12 = 940.8\t940.8 × 1.12 = 1,053.696\nTV\t\t\t\t1,053.696 × (1 + 4%) / (10% – 4%) = 18,264.064\nSum\t\t840\t940.8\t19,317.760\nPV\t\t840 / (1 + 10%)^1 = 763.636\t940.8 / (1 + 10%)^2 = 777.521\t19,317.760 / (1 + 10%)^3 = 14,513.719\nSum of PV\t16,054.876 ≈ 16,055\t\t\t\nC. 19,300. — Incorrect\nIncorrect because the WACC of 9% is used instead of the required rate of return on equity of 10%.\n\tYear 0\tYear 1\tYear 2\tYear 3\nFCFE\t750\t750 × 1.12 = 840\t840 × 1.12 = 940.8\t940.8 × 1.12 = 1,053.696\nTV\t\t\t\t1,053.696 × (1 + 4%) / (9% – 4%) = 21,916.877\nSum\t\t840\t940.8\t22,970.573\nPV\t\t840 / (1 + 9%)^1 = 770.642\t940.8 / (1 + 9%)^2 = 791.853\t22,970.573 / (1 + 9%)^3 = 17,737.497\nSum of PV\t19,299.992 ≈ 19,300\t\t\t", "ko": "FCFE: Y1 = 750 × 1.12 = 840, Y2 = 940.8, Y3 = 1,053.696. Y3 말 terminal value = 1,053.696 × 1.04/(0.10 − 0.04) = 18,264.06. PV(10%): 840/1.1 = 763.64, 940.8/1.1^2 = 777.52, (1,053.70 + 18,264.06)/1.1^3 = 14,513.72. 합계 = 16,055. FCFE는 cost of equity로 할인.", "trap": "terminal value는 3년 말 가치라 3년 할인. FCFE에는 WACC 대신 required return on equity.", "f": "V0 = Σ FCFE_t/(1 + r)^t + [FCFE_n(1 + g)/(r − g)]/(1 + r)^n", "why": {"A": "terminal value를 4년 할인.", "C": "FCFE를 WACC 9%로 할인."}, "orig": "Mock 5 Session 2 Q31", "conf": false}, {"id": "mock5-Q76", "src": "정답", "module": "EQ", "tag": "FCFE에 영향을 주는 결정", "vig": 18, "stem": "Which decision will most likely impact Laver's revised FCFE projections of Dentoc?", "opts": {"A": "Decision 1", "B": "Decision 2", "C": "Decision 3"}, "ans": "C", "en": "A. Decision 1 — Incorrect\nIncorrect because paying cash dividends on common stock does not affect FCFF or FCFE, which are the amounts of cash available to all investors or to common stockholders.\nB. Decision 2 — Incorrect\nIncorrect because share repurchases of common stock also do not affect FCFF or FCFE. Share repurchases are, in many respects, a substitute for cash dividends.\nC. Decision 3 — Correct\nCorrect because changing leverage (changing the amount of debt financing in the company’s capital structure), does have some effects on FCFE particularly. An increase in leverage will not affect FCFF (although it might affect the calculations used to arrive at FCFF). An increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense. Further, FCFE is calculated by adding net borrowings to FCFF and reducing the tax-adjusted interest payments.", "ko": "배당 지급과 자사주 매입은 FCFE를 '사용'하는 방법일 뿐 FCFE 자체를 바꾸지 않는다. 부채를 늘리면 발행 해에는 net borrowing만큼 FCFE가 늘고, 이후엔 세후 이자만큼 줄어든다 → Decision 3이 FCFE에 영향.", "trap": "배당·자사주 매입은 FCFE에 영향 없음. leverage 변화는 FCFE에 영향, FCFF에는 영향 없음.", "f": "FCFE = FCFF − Int(1 − t) + net borrowing", "why": {"A": "현금 배당은 FCFE의 분배 방식일 뿐 FCFE를 바꾸지 않는다.", "B": "자사주 매입도 배당의 대체 수단이라 FCFE에 영향 없다."}, "orig": "Mock 5 Session 2 Q32", "conf": false}, {"id": "mock5-Q77", "src": "정답", "module": "ETH", "tag": "해지 계좌 포함 성과 — III(D)", "vig": 19, "stem": "Does Brown violate the Standards when presenting her composite performance?", "opts": {"A": "No", "B": "Yes, with respect to the termination dates", "C": "Yes, with respect to the accounts included in the return calculation"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because the performance report of the large-cap composite does not include a disclosure of the date of termination for terminated accounts, which is a violation of Standard III(D) Performance Presentation.\nB. Yes, with respect to the termination dates — Correct\nCorrect because Standard III(D) Performance Presentation states that when communicating investment performance information, Members and Candidates must make reasonable efforts to ensure that it is fair, accurate, and complete.\" In the case of terminated accounts, members and candidates can also meet their obligations under Standard III(D) by including terminated accounts as part of performance history with a clear indication of when the accounts were terminated. Metulla's performance report for the large-cap equity composite includes terminated accounts in the composite's performance calculation. However, the report does not disclose when the accounts were terminated, which is required in order to have a fair, accurate, and complete performance report under the Standards.\nC. Yes, with respect to the accounts included in the return calculation — Incorrect\nIncorrect because the inclusion of terminated accounts in the calculation of the large-cap equity composite's return is in compliance with Standard III(D) Performance Presentation.", "ko": "Metulla 보고서는 해지된 계좌를 composite 수익률 계산에 포함했지만 언제 해지됐는지 표시하지 않았다. III(D) Performance Presentation은 해지 계좌를 성과 이력에 포함하되 해지 시점을 명확히 밝히도록 한다. 해지 계좌를 포함한 것 자체는 문제가 아니고, 해지 날짜를 밝히지 않은 것이 위반. GIPS 준수 주장이 없어도 III(D)는 적용된다.", "trap": "해지 계좌 '포함'은 OK, 해지 '시점 미표시'가 위반.", "f": "", "why": {"A": "해지 날짜를 공시하지 않아 fair·accurate·complete 요건을 어김.", "C": "해지 계좌를 수익률 계산에 포함하는 것은 III(D)에 맞다."}, "orig": "Mock 5 Session 2 Q33", "conf": true}, {"id": "mock5-Q78", "src": "오답", "module": "ETH", "tag": "IPO 배분 — fair dealing III(B)", "vig": 19, "stem": "To comply with the Standards, how many shares should Brown have allocated to Group 3?", "opts": {"A": "5,000", "B": "24,000", "C": "30,000"}, "ans": "B", "en": "A. 5,000 — Incorrect\nIncorrect because Group 3 is eligible to participate on a pro rata basis together with the other groups in the IPO allocation, and will receive more than 5,000 shares under Standard III(B) Fair Dealing as a result.\nThe number of shares allocated to Group 3 is calculated incorrectly as:\nTotal shares available – Shares for discretionary accounts = 100,000 – (25,000 + 70,000) = 100,000 – 95,000 = 5,000.\nB. 24,000 — Correct\nCorrect because Standard III(B) Fair Dealing states that Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Accordingly, all accounts that are fee paying, whether discretionary or nondiscretionary and whether owned by family members or other clients, must be included in the IPO allocation on a pro rata basis. Group 3 should receive an allocation calculated as follows:\nAllocation of IPO shares to Group 3:\n100,000 × [30,000/(25,000 + 70,000 + 30,000)] = 100,000 × 30,000/125,000 = 24,000 shares.\nC. 30,000 — Incorrect\nIncorrect because, under Standard III(B) Fair Dealing, all accounts in Exhibit 1 are eligible to participate in the IPO allocation, on a pro rata basis. Given that the number of subscribed shares (125,000) exceeds the number of total allotted shares (100,000), each of the three groups will receive less than 100% of the subscribed amount. In particular, Group 3 will receive less than the 30,000 shares subscribed.", "ko": "수수료를 내는 모든 계좌는 discretionary·nondiscretionary, 직원 가족 여부와 관계없이 pro rata로 배분해야 한다(직원이 가족 계좌에 beneficial interest가 없고 일반 수수료를 냄). 총 신청 125,000주, 배정 100,000주. Group 3 = 100,000 × 30,000/125,000 = 24,000주.", "trap": "nondiscretionary 계좌도 배분 대상. 가족 계좌도 일반 고객처럼 수수료를 내면 동등하게 취급.", "f": "배분 = 받은 주식 × (그룹 신청량 / 전체 신청량)", "why": {"A": "discretionary 계좌에 먼저 다 주고 남은 5,000주만 배정. nondiscretionary도 pro rata 대상.", "C": "신청량 125,000 > 배정 100,000이라 신청량 전부를 줄 수 없다."}, "orig": "Mock 5 Session 2 Q34", "conf": true, "my": "A"}, {"id": "mock5-Q79", "src": "정답", "module": "ETH", "tag": "directed brokerage와 soft dollar — III(A)", "vig": 19, "stem": "Brown violates the Standards in relation to Cliff's directed brokerage arrangement due to:", "opts": {"A": "the use of soft dollars only.", "B": "failure to obtain best execution only.", "C": "both the use of soft dollars and failure to obtain best execution."}, "ans": "A", "en": "A. the use of soft dollars only. — Correct\nCorrect because Brown violates Standard III(A) Loyalty, Prudence, and Care. From time to time, a client will direct a manager to use the client’s brokerage to purchase goods or services for the client. Because brokerage commission is an asset of the client and is used to benefit that client, not the manager, such a practice does not violate any duty of loyalty. However, a member or candidate is obligated to seek 'best price' and 'best execution' and be assured by the client that the goods or services purchased from the brokerage will benefit the account beneficiaries. To the extent that Brown is using the commission soft dollars received from Brinkman for the benefit of Metulla's institutional clients rather than Cliff as the client that generated such commissions, Brown is in violation of Standard III(A).\nB. failure to obtain best execution only. — Incorrect\nIncorrect because Brown had notified Cliff that Brinkman does not provide best execution. Under Standard III(A) Loyalty, Prudence, and Care, a member or candidate is obligated to seek 'best price' and 'best execution' and be assured that the good or services purchased from the brokerage will benefit the account beneficiaries. In case a client directs the manager to use the services of a particular broker that does not provide best execution, the member or candidate should disclose to the client that the client may not be getting best execution from the directed brokerage. Brown has fulfilled her disclosure obligation.\nC. both the use of soft dollars and failure to obtain best execution. — Incorrect\nIncorrect because Brown violates the Standards regarding only the use of soft dollars. She does not violate the Standards by failing to obtain the best execution. A member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client. In using Brinkman's commission to benefit Metulla's institutional clients rather than Cliff, Brown violates Standard III(A) Loyalty, Prudence, and Care.", "ko": "Cliff가 Brinkman을 지정했고, Brown은 best execution이 안 된다는 것을 서면으로 알렸으므로 best execution 부분은 의무를 다했다. 그러나 Cliff의 거래로 생긴 soft dollar(고객 자산)를 Cliff가 아니라 Metulla의 기관 고객을 위해 썼다 → III(A) Loyalty, Prudence, and Care 위반은 soft dollar 사용뿐.", "trap": "directed brokerage에서 best execution이 안 된다는 공시를 했으면 OK. 커미션은 그 고객의 자산이라 그 고객을 위해 써야 한다.", "f": "", "why": {"B": "고객 지정 브로커가 best execution을 못 한다는 것을 알렸으므로 위반 아님.", "C": "best execution은 공시로 의무를 다했다. 위반은 soft dollar 사용뿐."}, "orig": "Mock 5 Session 2 Q35", "conf": false}, {"id": "mock5-Q80", "src": "정답", "module": "ETH", "tag": "추가 보상 — IV(B) 서면 동의", "vig": 19, "stem": "With regard to Brown's additional compensation, the Standards require that she obtain Metulla's consent for:", "opts": {"A": "the gift only.", "B": "the consulting fee only.", "C": "both the gift and the consulting fee."}, "ans": "C", "en": "A. the gift only. — Incorrect\nIncorrect because both the gift (non-monetary) and the consulting fee (monetary) are types of compensation that require written consent from the employer. Brown did not receive written consent from Metulla and is therefore in violation of Standard IV(B) Additional Compensation Arrangements.\nB. the consulting fee only. — Incorrect\nIncorrect because both the gift (non-monetary) and the consulting fee (monetary) are types of compensation that require written consent from the employer. Brown did not receive written consent from Metulla and is therefore in violation of Standard IV(B) Additional Compensation Arrangements.\nC. both the gift and the consulting fee. — Correct\nCorrect because Standard IV(B) Additional Compensation Arrangements states that Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved. Compensation and benefits include direct compensation by the client and any indirect compensation or other benefit received from third parties. Written consent includes any form of communication that can be documented. Both the gift (non-monetary) and the consulting fee (monetary) are types of compensation that require written consent. Brown did not receive written consent from Metulla and is therefore in violation of Standard IV(B).", "ko": "Brown은 고객이 아닌 지인의 IPS를 작성하고 $1,000을 받았고(금전), Metulla 고객에게서 골프 클럽 1년 회원권을 받았다(비금전). 둘 다 고용주와 경쟁하거나 이해상충을 만들 수 있는 보상이라 IV(B) Additional Compensation Arrangements에 따라 Metulla의 서면 동의가 필요하다.", "trap": "비금전 선물도, 고객이 준 혜택도 모두 additional compensation.", "f": "", "why": {"A": "consulting fee도 고용주 업무와 경쟁하는 보상이라 동의 필요.", "B": "고객이 준 골프 회원권도 성과와 연결될 수 있는 보상이라 동의 필요."}, "orig": "Mock 5 Session 2 Q36", "conf": false}, {"id": "mock5-Q81", "src": "정답", "module": "ETH", "tag": "발행사 지원 항공권·선물 — I(B)", "vig": 20, "stem": "Does Darko violate the Standards regarding the Bloom conference?", "opts": {"A": "No", "B": "Yes, by accepting the travel arrangement only", "C": "Yes, by accepting the travel arrangement and the gift"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because Darko violates Standard I(B) Independence and Objectivity by accepting the travel arrangement. According to the guidance for Standard I(B), to avoid the appearance of compromising their independence and objectivity, best practice dictates that Members and Candidates always use commercial transportation at their expense or at the expense of their firm rather than accept paid travel arrangements from an outside company.\nB. Yes, by accepting the travel arrangement only — Correct\nCorrect because Standard I(B) Independence and Objectivity states, when attending meetings at an issuer’s headquarters (or covered company), members and candidates should pay for commercial transportation and hotel charges. No corporate issuer (or covered company) should reimburse members or candidates for air transportation. Additionally, according to the guidance for Standard I(B), to avoid the appearance of compromising their independence and objectivity, best practice dictates that Members and Candidates always use commercial transportation at their expense or at the expense of their firm rather than accept paid travel arrangements from an outside company.\nThe conference was hosted by Bloom, which is one of the companies covered by Darko. If Bloom pays for Darko's flights, it would appear that his independence and objectivity will be compromised as he covers the company and this may influence his investment analysis, recommendations, and actions while working on Bloom. Standard I(B) emphasizes the need for members and candidates to maintain their independence and objectivity and accepting the flights would likely create a conflict of interest and compromise Darko's independence and objectivity.\nC. Yes, by accepting the travel arrangement and the gift — Incorrect\nIncorrect because Darko violates Standard I(B) Independence and Objectivity by accepting the travel arrangement, but not by accepting the gift. As per practices under Standard I(B) Independence and Objectivity, members and candidates must limit the acceptance of gratuities and/or gifts to token items. A mug can be considered as a token (low value) item and that was given to all analysts who attended the conference. Accepting the mug should not impair Darko's objectivity. Standard I(B) states, modest gifts and entertainment are acceptable, but special care must be taken by members and candidates to resist subtle and not-so-subtle pressures to act in conflict with the interests of their clients.", "ko": "Darko는 자신이 커버하는 Bloom이 낸 항공권을 받았다 → I(B) Independence and Objectivity 위반(발행사 방문 시 항공·숙박은 본인이나 회사 비용). 모든 참석 애널리스트에게 준 회사 로고 머그컵은 token item이라 받아도 된다.", "trap": "token gift(머그컵)는 OK, 커버 기업이 내준 항공권은 위반.", "f": "", "why": {"A": "커버 기업이 지급한 항공권을 받아 독립성 훼손.", "C": "머그컵은 저가 token item이라 문제없다."}, "orig": "Mock 5 Session 2 Q37", "conf": true}, {"id": "mock5-Q82", "src": "정답", "module": "ETH", "tag": "부정적 시나리오 누락 — V(A)", "vig": 20, "stem": "Does Darko violate the Standards regarding his work on the Ncenter research report?", "opts": {"A": "No", "B": "Yes, regarding the third-party research provider", "C": "Yes, regarding his scenario choice in the report"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Darko violates Standard V(A) Diligence and Reasonable Basis by including only the positive growth scenario and omitting the negative growth scenario. He does not violate the Standards by using third-party research which was approved by TTN's research division.\nB. Yes, regarding the third-party research provider — Incorrect\nIncorrect because a member or candidate may rely on others in his or her firm to determine whether secondary or third-party research is sound and use the information in good faith unless the member or candidate has reason to question its validity or the processes and procedures used by those responsible for the research. Darko uses information from a third-party research provider which was approved by TTN's research division. He can rely on others at TTN to determine that the quality of the research meets the necessary standards and to approve the research provider without violating Standard V(A) Diligence and Reasonable Basis. There is no requirement that he has to perform his own due diligence on the third-party research in this scenario.\nC. Yes, regarding his scenario choice in the report — Correct\nCorrect because Darko violates Standard V(A) Diligence and Reasonable Basis by reporting only the positive growth scenario and omitting the negative growth scenario. Members and Candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action.\nAlso, the omission from the analysis of potentially negative outcomes or of levels of risk outside the norm may misrepresent the true economic value of an investment. The possible scenarios for analysis should include factors that are likely to have a substantial influence on the investment value and may include extremely positive and negative scenarios.", "ko": "Darko는 모델에 긍정·부정 성장 시나리오를 모두 만들었지만 보고서에는 긍정 시나리오만 넣었다 → 부정적 결과를 빠뜨려 투자 가치를 왜곡 → V(A) Diligence and Reasonable Basis 위반. 회사 research division이 승인한 third-party research는 의심할 이유가 없으면 그대로 믿고 써도 된다.", "trap": "회사가 승인한 외부 리서치는 직접 due diligence 의무 없음.", "f": "", "why": {"A": "부정적 시나리오를 빼서 V(A) 위반.", "B": "회사가 승인한 외부 리서치 제공자는 의심할 이유가 없으면 그대로 사용해도 된다."}, "orig": "Mock 5 Session 2 Q38", "conf": false}, {"id": "mock5-Q83", "src": "정답", "module": "ETH", "tag": "감독자 compliance 절차 — IV(C)", "vig": 20, "stem": "Which compliance initiative suggested by Darko is not consistent with the Standards?", "opts": {"A": "Initiative 1", "B": "Initiative 2", "C": "Initiative 3"}, "ans": "B", "en": "A. Initiative 1 — Incorrect\nIncorrect because, as per the guidance under Standard IV(C) Responsibilities of Supervisors, once a compliance program is in place, a supervisor should periodically update procedures to ensure that the measures are adequate under the law. The suggested initiative to periodically update procedures to ensure that the measures are adequate under the law is in line with the principles of Standard IV(C).\nB. Initiative 2 — Correct\nCorrect because, as per the guidance under Standard IV(C) Responsibilities of Supervisors, once a compliance program is in place, a supervisor should...continually educate personnel regarding the compliance procedures. Educating personnel regarding the compliance procedures only when they join is not an adequate procedure under the guidelines of Standard IV(C). Personnel should receive compliance procedures education continually.\nC. Initiative 3 — Incorrect\nIncorrect because, as per the guidance under Standard IV(C) Responsibilities of Supervisors, once a compliance program is in place, a supervisor should issue periodic reminders of the procedures to appropriate personnel. The suggested initiative to issue periodic reminders of the procedures to appropriate personnel is in line with the principles of Standard IV(C).", "ko": "IV(C) Responsibilities of Supervisors 가이드: compliance 절차를 주기적으로 업데이트하고(Initiative 1), 직원을 지속적으로 교육하고, 주기적으로 상기시켜야 한다(Initiative 3). 입사할 때만 교육하는 Initiative 2는 '지속적 교육'에 맞지 않는다.", "trap": "교육은 입사 시 한 번이 아니라 계속.", "f": "", "why": {"A": "절차를 주기적으로 업데이트하는 것은 IV(C) 가이드와 일치.", "C": "주기적 reminder는 IV(C) 가이드와 일치."}, "orig": "Mock 5 Session 2 Q39", "conf": false}, {"id": "mock5-Q84", "src": "정답", "module": "ETH", "tag": "고객 비밀유지 — III(E)", "vig": 20, "stem": "Do Garcia's actions regarding her client's suspected tax fraud violate the Standards?", "opts": {"A": "No", "B": "Yes, by sharing the information in the email", "C": "Yes, by sharing the information with the regulator"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because Garcia violates Standard III(E) Preservation of Confidentiality by sending information about a specific client's suspected tax fraud to all internal personnel of her company via email. The principles of Standard III(E) require that members and candidates preserve the confidentiality of information communicated to them by their clients, prospective clients, and former clients. Garcia's information concerns illegal activities by the client, so she should have an obligation to report the activities to the appropriate authorities or disclose the information to authorized fellow employees who are also working for the client but not to the whole company.\nB. Yes, by sharing the information in the email — Correct\nCorrect because the simplest, most conservative, and most effective way to comply with Standard III(E) is to avoid disclosing any information received from a client except to authorized fellow employees who are also working for the client.\nGarcia sends an email about suspected tax fraud by a client to the whole company, irrespective of whether employees are authorized to receive this information. This violates the principles of Standard III(E) Preservation of Confidentiality, which require that members and candidates preserve the confidentiality of information communicated to them by their clients, prospective clients, and former clients.\nC. Yes, by sharing the information with the regulator — Incorrect\nIncorrect because, as per the requirements of Standard III(E) Preservation of Confidentiality, if disclosure of the information is required by law or the information concerns illegal activities by the client, however, the member or candidate may have an obligation to report the activities to the appropriate authorities.\nGarcia becomes aware that one of her clients is suspected of tax fraud, which falls into the category of illegal activities. Also, the regulator contacts Garcia as part of their investigation into the suspected tax fraud of the client. Hence, Garcia has an obligation to report the activities to the regulator as per the requirements of the applicable law and based on her suspicion that the client broke the law.", "ko": "Garcia는 고객의 tax fraud 의심 내용을 회사 전체 이메일로 보냈다 → 그 고객 업무에 권한 있는 직원이 아닌 사람들에게까지 공개 → III(E) Preservation of Confidentiality 위반. 법에 따라 규제기관 요청에 정보를 준 것은 예외(불법 행위·법적 요구)에 해당해 위반 아님.", "trap": "불법 행위라도 공개 범위는 당국·권한 있는 동료로 제한.", "f": "", "why": {"A": "회사 전체 이메일 공유가 비밀유지 위반.", "C": "법이 요구하고 불법 행위와 관련된 정보라 규제기관 제공은 허용."}, "orig": "Mock 5 Session 2 Q40", "conf": false}, {"id": "mock5-Q85", "src": "정답", "module": "AI", "tag": "backwardation·basis·calendar spread", "vig": 21, "stem": "Based on the current price data of Fund 1's largest exposures, the most appropriate conclusion is that the:", "opts": {"A": "crude oil basis is zero.", "B": "cocoa market is in backwardation.", "C": "gold market calendar spread is positive."}, "ans": "B", "en": "A. crude oil basis is zero. — Incorrect\nIncorrect because the spot price in the crude oil market is higher than the futures prices, which indicates a positive basis. The difference between spot and futures prices is generally called the basis.\nThe basis between spot price and futures prices in the crude oil market is calculated as:\nBasis (spot to near term): Spot price – Near-term futures price = $75.02 – $74.25 = $0.77.\nBasis (spot to farther term): Spot price – Farther-term futures price = $75.02 – $74.25 = $0.77.\nThis response incorrectly assumes that the basis is the difference between the near-term and the farther-term futures prices = 74.25 – 74.25 = 0.\nB. cocoa market is in backwardation. — Correct\nCorrect because futures prices are lower than the spot price when the market is in backwardation. When the spot price exceeds the futures price, the situation is called backwardation.\nIn the cocoa market, prices decrease as we move from the spot price ($3,318) to the near-term futures contract price ($3,264) and the farther-term futures contract price ($3,233), which represents a market state of backwardation.\nC. gold market calendar spread is positive. — Incorrect\nIncorrect because the near-term futures price in the gold futures market is lower than the farther-term futures price, which indicates a negative calendar spread. The calendar spread is the difference between the near-term futures contract price and the longer-term futures contract price.\nThe calendar spread between the near-term and the farther-term futures prices in the gold market is calculated as:\nCalendar spread = Near-term futures price – Farther-term futures price = $1,929.3 – $1,935.6 = –$6.3.", "ko": "cocoa: 현물 3,318 > 3개월 3,264 > 6개월 3,233 → 선물 가격이 현물보다 낮음 = backwardation. crude oil basis = 현물 − 선물 = 75.02 − 74.25 = 0.77(0 아님). gold calendar spread = 근월물 − 원월물 = 1,929.3 − 1,935.6 = −6.3(음수).", "trap": "basis는 현물과 선물의 차이(선물끼리 차이 아님).", "f": "Basis = spot − futures, Calendar spread = 근월물 − 원월물", "why": {"A": "두 선물 가격이 같을 뿐 basis = 75.02 − 74.25 = 0.77.", "C": "근월물 < 원월물이라 calendar spread는 음수(contango)."}, "orig": "Mock 5 Session 2 Q41", "conf": false}, {"id": "mock5-Q86", "src": "정답", "module": "AI", "tag": "commodity futures total return", "vig": 21, "stem": "The 3-month total return of the past cocoa futures trade is closest to:", "opts": {"A": "0.2%.", "B": "1.7%.", "C": "5.5%."}, "ans": "B", "en": "A. 0.2%. — Incorrect\nIncorrect because the roll return is calculated as the closing price of the new 3-month futures contract (i.e., the farther-term contract) less the closing price of the initial 3-month futures contract (i.e., the near-term contract) in the numerator rather than vice versa, as follows:\n1) Price return (correct) = (Current price – Previous price) / Previous price = ($3,285 – $3,294)/$3,294 = –$9/$3,294 = –0.2732%\n2) Roll return (incorrect) = (Farther-term futures contract closing price – Near-term futures contract closing price) / Near-term futures contract closing price = ($3,260 – $3,285)/$3,285 = –$25/$3,285 = –0.7610%\n3) Collateral return (correct) = Collateral rate × Number of months in period / 12 = 5.0% × 3/12 = 1.2500%\n4) Total return (incorrect) = Price return (correct) + Roll return (incorrect) + Collateral return (correct) = –0.2732% – 0.7610% + 1.2500% = 0.2157% ≈ 0.2%\nB. 1.7%. — Correct\nCorrect because the total return on commodity futures is broken into three components—the price return (or spot yield), the roll return (or roll yield), and the collateral return (or collateral yield)—and is calculated as follows:\n1) Price return = (Current price – Previous price) / Previous price = ($3,285 – $3,294)/$3,294 = –$9/$3,294 = –0.2732%\n2) Roll return = (Near-term futures contract closing price – Farther-term futures contract closing price) / Near-term futures contract closing price = ($3,285 – $3,260)/$3,285 = $25/$3,285 = 0.7610%\n3) Collateral return = Collateral rate × Number of months in period / 12 = 5.0% × 3/12 = 1.2500%\n4) Total return = Price return + Roll return + Collateral return = –0.2732% + 0.7610% + 1.2500% = 1.7378% ≈ 1.7%\nC. 5.5%. — Incorrect\nIncorrect because the collateral return reflects the entire annualized rate rather than the rate adjusted for a 3-month period. Total return is calculated as follows:\nTotal return (incorrect) = Price return (correct) + Roll return (correct) + Collateral return (incorrect) = –0.2732% + 0.7610% + 5.0% = 5.4878% ≈ 5.5%", "ko": "price return = (3,285 − 3,294)/3,294 = −0.273%. roll return = (만기 근월물 3,285 − 새 원월물 3,260)/3,285 = +0.761%(backwardation이라 양수). collateral return = 5% × 3/12 = 1.25%. total = −0.273 + 0.761 + 1.25 = 1.74% ≈ 1.7%.", "trap": "roll return 부호(근월물 − 원월물)와 collateral 기간 조정(3/12).", "f": "Total = price return + roll return + collateral return, Roll = (F_near − F_far)/F_near", "why": {"A": "roll return을 (원월물 − 근월물)로 계산해 −0.761%.", "C": "collateral return을 연 5% 그대로 사용."}, "orig": "Mock 5 Session 2 Q42", "conf": false}, {"id": "mock5-Q87", "src": "정답", "module": "AI", "tag": "merger arbitrage 이익", "vig": 21, "stem": "If the merger between AC and TC closes successfully, Fund 2's merger arbitrage trade will result in a gain closest to:", "opts": {"A": "$7,000.", "B": "$20,000.", "C": "$90,000."}, "ans": "B", "en": "A. $7,000. — Incorrect\nIncorrect because it calculates the payoff as ($35/3 – $11) × 10,000 = $6,667 ≈ $7,000.\nB. $20,000. — Correct\nCorrect because, if the merger between AC and TC is successful, Fund 2 will realize a gain of $20,000, calculated as follows:\nCost to purchase 30,000 shares of TC = 30,000 × $11 = $330,000\nAC shares received upon conversion = 30,000/3 (conversion ratio) = 10,000\nProceeds from sale of AC shares = 10,000 × $35 = $350,000\nGain in case of M&A success = $350,000 – $330,000 = $20,000\nC. $90,000. — Incorrect\nIncorrect because the initial pre-merger prices are used to compute the payoff as follows:\nCost to purchase 30,000 shares of TC (incorrect) = 30,000 × $10 = $300,000\nAC shares received upon conversion = 30,000/3 (conversion ratio) = 10,000\nProceeds from sale of AC shares (incorrect) = 10,000 × $39 = $390,000\nGain in case of M&A success (incorrect) = $390,000 – $300,000 = $90,000", "ko": "TC 30,000주 매수 비용 = 30,000 × $11 = $330,000. 합병 성사 시 3:1로 AC 10,000주를 받아 short한 AC 10,000주($35 × 10,000 = $350,000)를 갚는다. 이익 = 350,000 − 330,000 = $20,000.", "trap": "발표 전 가격이 아니라 발표 후 실제 거래 가격(11, 35) 사용.", "f": "이익 = 받는 AC 주식 수 × AC short 가격 − TC 매수 비용", "why": {"A": "(35/3 − 11) × 10,000으로 TC 주식 수를 10,000으로 잘못 사용.", "C": "발표 전 가격(TC $10, AC $39) 사용."}, "orig": "Mock 5 Session 2 Q43", "conf": false}, {"id": "mock5-Q88", "src": "오답", "module": "AI", "tag": "fund of funds vs multi-strategy fund", "vig": 21, "stem": "Compared to Option 2, Option 1 most likely has:", "opts": {"A": "less leverage.", "B": "fewer layers of fees.", "C": "a shorter tactical reaction time."}, "ans": "A", "en": "A. less leverage. — Correct\nCorrect because multi-strategy funds tend to use significantly more leverage than most FoFs, which gravitate to modest leverage usage. Therefore, the fund of funds (Option 1) will most likely have less leverage than the multi-strategy fund (Option 2).\nB. fewer layers of fees. — Incorrect\nIncorrect because FoFs (Option 1) would typically include a double layer of fees the investor must pay, while in multi-strategy funds (Option 2) generally fee netting risk is handled at the strategy level and absorbed (or partially absorbed) by the general partner of the multi-strategy fund. In a FoF, in addition to management and incentive fees charged by the individual hedge funds in which the FoF invests, investors in a fund-of-funds [pay fees] on the performance of the total FoF portfolio.\nC. a shorter tactical reaction time. — Incorrect\nIncorrect because FoFs (Option 1) typically have a higher tactical reaction time than multi-manager funds (Option 2), given that the different strategies are executed in different underlying funds instead of within the same fund structure. FoFs offer a potentially more diverse strategy mix but with less transparency and slower tactical reaction time.", "ko": "multi-strategy fund는 FoF보다 leverage를 훨씬 많이 쓰는 경향이 있고, FoF는 적당한 leverage를 쓴다 → FoF는 leverage가 더 적다. FoF는 fee가 두 겹(하위 펀드 + FoF)이고, 전략이 여러 펀드에 흩어져 있어 tactical reaction이 느리다.", "trap": "FoF: leverage 적음, fee 두 겹, 반응 느림, 투명성 낮음. multi-strategy: leverage 큼, fee 한 겹(netting risk는 GP 부담), 반응 빠름.", "f": "", "why": {"B": "FoF는 하위 펀드 fee + FoF fee로 두 겹이라 fee 층이 더 많다.", "C": "FoF는 다른 펀드에 분산돼 있어 tactical reaction이 더 느리다."}, "orig": "Mock 5 Session 2 Q44", "conf": false, "my": "C"}], "vignettes": ["Mark Jackson is a credit portfolio manager. He is reviewing several positions in his portfolio.\nJackson holds an A-rated bond issued by Don Vallejo, a large US tequila producer. The bond has a YTM of 1.0% and a modified duration of 4.5. He computes its expected 1-year total return under a credit rating migration scenario based on the 1-year credit transition matrix in Exhibit 1 where, for example, the probability of an AAA-rated bond having an A rating at the end of the year is 3%. He also uses the expected credit spread change of an A-rated bond for each possible credit rating migration, as shown in Exhibit 2.\nExhibit 1\nFrom/To (Entries are in %)\tAAA\tAA\tA\tBBB\tBB\tB\tCCC\nAAA\t85\t4\t3\t2\t2\t2\t2\nAA\t5\t83\t4\t3\t3\t1\t1\nA\t2\t3\t88\t2\t2\t2\t1\nBBB\t1\t1\t3\t90\t3\t1\t1\nBB\t1\t1\t3\t4\t85\t4\t2\nB\t0\t0\t1\t2\t3\t87\t7\nCCC\t0\t0\t0\t2\t5\t11\t82\nExhibit 2\n\tAAA\tAA\tA\tBBB\tBB\tB\tCCC\nExpected change in credit spread (in bps)\t50\t30\t0\t40\t60\t80\t150\nNext, Jackson performs a credit analysis for a commercial ABS collateralized by short-term loans to small US retailers. He notes that the loan pool is granular and homogeneous. Jackson considers three approaches for the credit analysis of the ABS: loan-by-loan, portfolio-based, or statistics-based.\nJackson owns $20 million of face value of Bond X, a bond issued by Electric Motors, Incorporated. Jackson recently bought protection using a $20 million notional value CDS on Electric Motors. Two bonds can be delivered to settle the CDS upon a credit event: Bond X and Bond Y. Electric Motors declares bankruptcy, triggering a credit event on the CDS. Upon default, Bond X trades at 40% of its face value and Bond Y trades at 35% of its face value.\nJackson expects that the CDS curve of Crispy Chips, Inc., which is currently upward sloping, will flatten in the near term. Crispy Chips CDS contracts have 1-year, 3-year, and 5-year maturities. He considers using one of the following curve strategies to profit from his expectation. He assumes equal absolute notional values for each trade in each strategy.\nStrategy 1: Sell protection using the 1-year contract and buy protection using the 5-year contract.\nStrategy 2: Buy protection using the 3-year contract and sell protection using the 5-year contract.\nStrategy 3: Buy protection using the 1-year contract and sell protection using the 5-year contract.", "Serrana Romano is a financial analyst reviewing Celeste S.A., a Uruguayan corporation. Celeste reports under IFRS, its reporting currency is the Uruguayan Peso (UYU), and its financial year end is 31 December.\nRomano uses the following UYU/USD (number of UYU per 1 USD) exchange rate information for the most recent year.\nExhibit 1\nDate\tExchange Rate UYU/USD\n1 January\t41.88\n15 November\t42.95\n31 December\t44.63\nAverage for the year\t43.26\nOn 15 November of the most recent year, Celeste exported goods for USD 5 million to an unaffiliated US customer on credit. The total amount remained outstanding as of 31 December.\nSalto Corp. and Monte Corp. are two wholly owned subsidiaries of Celeste that are located in the US. There are no intercompany transactions. In both subsidiaries, the only non-monetary assets are inventory and fixed assets, and all liabilities are monetary.\nCeleste translates Salto’s financial statements using the current rate method. In the most recent year, Salto’s revenue was USD 120 million and cost of sales was USD 65 million. The average exchange rate for inventory purchases was 42.81 UYU/USD.\nCeleste uses the temporal method to translate Monte’s financial statements. Romano evaluates the effect on Celeste’s total shareholders’ equity if Monte’s financial statements had been translated using the same method as Salto. The average exchange rate for both inventory and fixed assets purchases was 42.15 UYU/USD.\nCeleste has recently acquired a new subsidiary that operates in a country with a highly inflationary economy. In compliance with IFRS, the subsidiary prepares financial statements restated for inflation in the local currency. At the end of the current reporting period, Celeste will prepare consolidated financial statements using the new subsidiary’s financial statements, and translate them using the exchange rate at the reporting period end.", "Mary Diamond, a portfolio manager, uses quantitative models for portfolio construction and attribution analysis.\nAs potential additions to her portfolio, Diamond identifies three ETFs (ETF 1, ETF 2, and ETF 3) that replicate US-based equity indexes. She believes that these ETFs are affected by two common macroeconomic factors: surprises in inflation, FINFL, and surprises in unemployment, FUNEMP. Diamond estimates the following two-factor macroeconomic model equations that describe the returns of each ETF (RETF 1, RETF 2 and RETF 3), where error terms are denoted by εETF 1, εETF 2 and εETF 3, respectively:\nRETF 1 = 0.07 + 1.4FINFL – 0.6FUNEMP + εETF 1\nRETF 2 = 0.09 + 0.6FINFL – 0.8FUNEMP + εETF 2\nRETF 3 = 0.08 + 1.5FINFL – 0.2FUNEMP + εETF 3\nDiamond next estimates the cost of ownership for ETF 1 over a 15-month holding period. She gathers the following information for her estimate:\nRound-trip trading commission is 0.05%\nBid-offer spread on purchase and sale is 0.20%\nAnnual management fee is 0.08%\nDiamond uses a fundamental factor model to decompose the active return of an external equity manager's portfolio. Exhibit 1 shows the information used in her analysis. Diamond calculates the manager's active return attributable to security selection to be 1%.\nExhibit 1\nFactor\tFactor Sensitivity (Manager's portfolio)\tFactor Sensitivity (Benchmark)\tFactor Return\nFactor 1\t–1.00\t–0.60\t–2.00%\nFactor 2\t0.50\t0.25\t3.50%\nFinally, Diamond identifies three well-diversified portfolios, shown in Exhibit 2. She believes that the expected returns of these portfolios are best modeled with a single-factor model consistent with arbitrage pricing theory.\nExhibit 2\nPortfolio\tExpected Return\tFactor Sensitivity\nX\t7%\t0.50\nY\t9%\t0.85\nZ\t11%\t1.00\nAfter reviewing the data in Exhibit 2, Diamond concludes that an arbitrage opportunity exists and considers the following three strategies:\nStrategy 1: Buy $2,000,000 of Z; sell short $1,600,000 of X and sell short $400,000 of Y\nStrategy 2: Buy $600,000 of X and buy $1,400,000 of Z; sell short $2,000,000 of Y\nStrategy 3: Buy $200,000 of Y and buy $1,800,000 of Z; sell short $2,000,000 of X", "Andrew Podlasky is an analyst at an investment management firm. He is reviewing growth prospects under different economic models for Country A and Country B.\nFirst, Podlasky reviews the macroeconomic data of Country A and Country B in Exhibit 1 to determine the current steady-state growth rates and potential GDP growth rates of both countries.\nExhibit 1\n\tCountry A\tCountry B\nGrowth rate in the labor force\t0.9%\t0.5%\nLabor cost in total factor cost\t55.2%\t56.4%\nGrowth rate in labor productivity\t3.5%\t2.3%\nGrowth rate of total factor productivity\t2.1%\t1.5%\nCountry A, which is currently operating at steady-state of growth, has announced its intentions to remove trade barriers on capital investments. As a result, Podlasky concludes that the country's economic growth rate per capita will increase permanently.\nFor Country B, Podlasky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 0.8 percentage points as a result of the following revisions:\nA 0.2% higher estimated real growth rate in potential GDP\nA 0.6% lower estimate of real growth in short-term GDP", "Julie Wu is a US-based hedge fund manager. To value the options in her fund, Wu uses both the Black–Scholes–Merton (BSM) and binomial option pricing models.\nWu sells 10 call option contracts on a non-dividend-paying stock, Skyview Corporation, at the value determined by the BSM model, and considers delta-hedging the position using Skyview shares. Each call option contract is for 100 shares. Wu collects the information in Exhibit 1 for a call option on Skyview.\nExhibit 1\nCurrent share price of Skyview\t$50\nExercise price of Skyview call option\t$50\nd1\t0.111\nd2\t–0.049\nN(d1)\t0.544\nN(d2)\t0.480\nGamma\t0.050\nTheta (daily)\t–0.018\nBSM call value\t$3.305\nWu next considers an American-style put option on Wilbo Corporation that matures in two years. She values it with a two-period binomial option pricing model and collects the relevant information in Exhibit 2. Wilbo does not pay dividends.\nExhibit 2\nCurrent share price of Wilbo\t$100\nExercise price of Wilbo put option\t$98\nRisk-free rate (compounded annually)\t5%\nRisk-neutral probability\t0.625\nUp factor (u)\t1.20\nDown factor (d)\t0.80\nStock prices in one year\tS^(+) = $120, S^(-) = $80\nStock prices in two years\tS^(++) = $144, S^(+-) = $96, S^(--) = $64", "Zachary Alison is analyzing the earnings and financial reporting quality of Apex, a consumer electronics manufacturer. The company reports its financial statements according to US GAAP.\nIn Exhibit 1, Alison compiles selected financial statement data for Apex for the year just ended. Alison then assesses the company's earnings quality by calculating the cash-flow-based accruals ratio.\nExhibit 1\n\tYear Just Ended ($ millions)\tPrior Year ($ millions)\nNet operating assets\t280\t229\nNet income\t83\t64\nOperating cash flow\t113\t77\nInvesting cash flow\t(58)\t(39)\nFinancing cash flow\t5\t0\nWhen reviewing the notes to Apex's most recent financial statements, Alison observes that some inventory is held in preparation for product launches. This inventory is not expected to be sold within one year and was reclassified as other non-current assets in the year just ended. This is the first year Apex has made such a reclassification. Alison determines how the reclassification affects its financial ratios.\nApex recently announced that it will purchase an 80% interest in Beast Electronics (Beast) for $24 million and will gain control over Beast. Beast's identifiable net assets have a fair value of $25 million and the fair value of the entire company is $30 million.", "Nicole Zern, an equity analyst, is reviewing preliminary research reports developed by her team for two wireless telecommunications companies: LuftComm and PrimaNet.\nLuftComm\nAfter reviewing the preliminary report for LuftComm, Zern decides to revise it slightly. She notes that interest expense is tax-deductible and collects the selected financial data for LuftComm shown in Exhibit 1.\nExhibit 1\nBook value of total assets at beginning of the year (millions)\t€5,000\nBook value of total debt at beginning of the year (millions)\t€3,000\nEBIT (millions)\t€700\nCorporate tax rate\t15.0%\nROE\t22.1%\nCost of equity\t16.0%\nPretax cost of debt\t6.0%\nMarket price per share\t€44.65\nP/B ratio\t1.90\nAssuming the clean surplus relation holds, Zern uses the data in Exhibit 1 to calculate residual income for the year and then estimates the implied growth rate of earnings for LuftComm based on the current market price.\nPrimaNet\nZern first notes that the team's preliminary report on PrimaNet uses a multistage residual income model with a persistence factor of 0.12, one-quarter of the industry average of 0.48.\nZern next assumes the clean surplus relation holds, and uses the data in Exhibit 2 to update the report based on a finite-horizon multistage residual income model.\nExhibit 2\nCurrent book value per share\t€18.50\nPresent value of residual income per share for Year 1\t€2.25\nPresent value of residual income per share for Year 2\t€2.00\nForecasted book value per share at end of Year 2\t€23.75\nForecasted market price per share at end of Year 2\t€26.50\nCost of equity\t12.8%\nWACC\t6.5%", "Carl Souza is a portfolio manager with Franca Advisors.\nDuring a client meeting, Souza presents current economic data and Franca's forecasts for next year, as shown in Exhibit 1. The client asks Souza to identify a sector that should experience the smallest decrease in profitability under Franca's forecast.\nExhibit 1\nEconomic Indicator\tCurrent\tForecast\nNominal GDP growth rate\t5.00%\t4.50%\nInflation rate\t3.00%\t5.00%\nUnemployment rate\t3.75%\t5.25%\nSouza tells prospective clients that based on his bottom-up security selection, he has delivered strong risk-adjusted returns relative to his benchmark. To illustrate his portfolio's performance, he provides data for the past five years shown in Exhibit 2. The average risk-free rate was 3.50% over this period.\nExhibit 2\n\tPortfolio\tBenchmark\nAverage annual return\t7.50%\t5.60%\nStandard deviation of returns\t15.00%\t12.00%\nActive risk\t5.00%\t---\nSouza uses the fundamental law of active management in portfolio construction. He is analyzing the information coefficient and target active risk to determine what actions would result in smaller optimal active weights for his portfolio.\nA prospective client has equity portfolio guidelines that restrict the maximum overweights and underweights on industry sectors. Souza evaluates the effect of these guidelines.", "Michael Eng manages institutional client portfolios of US Treasury securities. He expects that spot rates one year from now will be the same as they are today. Eng implements a strategy of rolling down the yield curve in one of the managed portfolios. Current information on rates is shown in Exhibit 1.\nExhibit 1\nSpot Rate\t1-year Implied Forward Rate\nr(1) = 0.75%\tf(0,1) = 0.75%\nr(2) = 1.20%\tf(1,1) = 1.65%\nr(3) = 1.45%\tf(2,1) = 1.95%\nr(4) = 1.65%\tf(3,1) = 2.25%\nEng is reviewing the portfolios of his two largest clients. Client 1 restricts Eng to buy only bonds with maturities of three years or less. Even though Eng expects the return of 5-year maturity bonds to be superior to that of 3-year maturity bonds, he continues to invest in 3-year maturities for Client 1's portfolio.\nClient 2's portfolio consists of 1-year, 3-year and 5-year zero-coupon bonds and has an effective duration of 3.20. Eng is concerned about the effect a twist in the yield curve would have on this portfolio. The portfolio's 1-year key rate duration is 0.25 and its 3-year key rate duration is 1.10.", "Alice Silva is a quantitative analyst focusing on the real estate sector.\nSilva studies the extent to which private construction spending is affected by public construction spending. She collects data (in $ millions) on total private (PRIV) and public (PUBL) construction spending for the last 363 months and log-transforms both time series.\nTo determine whether the two log-transformed time series are cointegrated, Silva tests the following null hypotheses:\nNull Hypothesis 1: ln(PRIVt) has a unit root.\nNull Hypothesis 2: ln(PUBLt) has a unit root.\nNull Hypothesis 3: The error term of the linear regression between ln(PRIVt) and ln(PUBLt) has a unit root.\nSilva forecasts future private construction spending. She estimates an autoregressive model of order 1 (AR(1)), where Δln(PRIVt) = ln(PRIVt) – ln(PRIVt–1). Silva uses the estimates of the AR(1) model in Exhibit 1 to determine the mean-reverting level of Δln(PRIVt).\nExhibit 1\n\tCoefficient\tStandard Error\tt-Statistic\nIntercept\t0.00259\t0.00073\t3.52\nln(PRIVt–1) – ln(PRIVt–2)\t0.38616\t0.39980\t0.97\nNext, Silva estimates an AR(1) model for public construction spending, where Δln(PUBLt) = ln(PUBLt) – ln(PUBLt–1). She calculates the residuals (ε) and squared residuals (ε^2) of the AR(1) model and estimates the following two linear regressions:\nResidual Regression 1: εt = a0 + a1 εt–1+ ut\nResidual Regression 2: εt^2 = a0 + a1 εt–1^2 + ut\nThe t-statistic for the slope coefficients (a1) is 0.70 for Residual Regression 1 and 2.94 for Residual Regression 2. The relevant critical value for these tests is 1.97.\nFinally, Silva develops a sentiment indicator for the real estate market. She obtains text data from real estate listings and classifies each listing as \"hot,\" \"medium,\" or \"cold\" based on how quickly the property sold. After preparing and wrangling the unstructured data, she performs feature selection. She wants to remove noise features and only select the tokens that tend to occur more often in a particular class of text.", "Michael Denton, CFA, founded WestLedge Financial, a registered investment advisory firm, five years ago. WestLedge is a small firm with just three employees. Denton is the firm's only investment professional, while the other two employees handle administrative tasks.\nIn a prior quarterly report to clients, Denton wrote that he had been researching artificial intelligence (AI) for over a year and believed it may improve WestLedge's existing investment process. Since distributing the client report, Denton has begun using AI to generate corporate earnings forecasts and screen securities for potential purchase in the firm's growth-oriented equity portfolios. He does not incorporate AI into the investment process for WestLedge's other equity strategies. Because AI is used only for growth-oriented portfolios, Denton does not disclose the use of AI in the firm's current quarterly client report.\nDenton is eager to expand WestLedge's business and actively encourages referrals from his professional and personal contacts. A friend of Denton's, Karri Lynch, has regularly referred clients to him over the past three years. Denton has offered to pay Lynch referral fees but she always declines, saying she is just trying to help a friend and will not accept compensation. Denton does not disclose to clients that he has offered to pay referral fees to Lynch. Each year, Denton and Lynch vacation together and Denton always pays for both of their plane tickets from his personal bank account. Denton does not disclose to clients the payments for Lynch's travel.\nDenton recently accepted an unpaid position on the investment committee of XLR Corporation's pension plan. XLR is a publicly traded biotechnology company that Denton has been recommending to clients. Denton was recommended for the committee position by Martin Hunter, the CEO of XLR, who is also a client of WestLedge. Denton does not disclose to clients his appointment or that Hunter is a client of WestLedge.\nHunter asks Denton for his opinion on Bio13, a biotechnology company that just went public. After performing appropriate due diligence, Denton recommends that Hunter buy shares of Bio13. Denton also informs Hunter that he plans to buy Bio13 shares in his own personal account but has determined that Bio13 is not suitable for any of his other clients. Hunter asks Denton to delay purchasing Bio13 shares in Hunter's account for 30 days, at which time his annual bonus will be deposited into the account. Denton immediately buys shares of Bio13 in his own account, and his purchase temporarily increases the price of the shares. Thirty days later, Denton purchases shares of Bio13 in Hunter's account.", "Yuvan Bisht, a fixed-income portfolio manager, is reviewing investments in his fund.\nBisht values a convertible bond issued one year ago by Doredum at a par value of $100. Each bond can be converted to 25 shares of Doredum common stock. The current share price is $3.80. A comparable option-free bond of the same maturity is valued at $105. Based on Doredum's strong operating performance, Bisht expects its share price will reach $8.00 in one year.\nNext, Bisht values a 3% default-free annual coupon bond with a 2-year maturity. The bond is putable at par ($100) at the end of Year 1. He estimates the binomial interest rate tree shown in Exhibit 1, assuming interest rate volatility of 15% and that branching from each node to a high state and to a low state occurs with equal probability.\n[IMAGE: CFA-IS-2022-11-FIIN-Aggarwal+2-Case.png]\nA binomial diagram with two column heads: Year zero and Year 1. Year zero: 2 point zero zero percent. Arrow up to Year 1: 4 point 6 4 percent. Arrow down to 3 point 4 4 percent.\nBisht considers a scenario in which the assumed level of interest rate volatility increases from 15% to 25%. He considers the impact of this scenario on the value of the putable bond.\nBisht analyzes the effects of an interest rate scenario in which there is a non-parallel shift in the yield curve, where the only change in the curve is a 30 bp increase in the 2-year benchmark. He considers the most appropriate measure to evaluate the putable bond's sensitivity to this scenario.", "David Albertson is an equity analyst at an investment bank. He is preparing updated research reports on two companies, Xita Incorporated and Garc Company.\nXita Incorporated\nIn Albertson's previous report on Xita, the stock had a forward P/E ratio of 14.9 and a trailing P/E ratio of 15.7. He considers a likely explanation for the difference in the P/E ratios.\nAlbertson indicates in his updated report that Xita's profits are cyclical. Using the data for the past four years in Exhibit 1, he computes Xita's normalized EPS based on the average ROE method. He determines that Year 1 through Year 4 (the most recent year) constitutes a full business cycle.\nExhibit 1\n\tYear 1\tYear 2\tYear 3\tYear 4\nEPS\t$3.19\t$2.21\t$0.37\t$2.56\nBook value per share\t$10.90\t$12.50\t$12.60\t$13.30\nGarc Company\nAlbertson next reviews Garc, which operates in a previously mature industry that now has high growth potential due to a recent technological innovation. Garc's debt-to-equity ratio is significantly higher than the average of its competitors. Garc spent heavily on advertising to create and maintain its brand, which is an important asset. The company is favored by many investors because its dividend payout ratio is the highest in its industry. Albertson considers several potential metrics to use in valuing Garc.\nDuring the past year, Garc's share price rose from $27.95 to $31.05 per share and the company paid an annual dividend of $1.24 per share. Over the same period, the market index rose from 550.40 to 602.21 and had an average dividend yield of 3.4%. Albertson computes Garc's relative strength compared to the index, which is a common technical indicator.", "Greta Edberg is an activist investor with Sintra Partners. Sintra recently acquired a 9.9% equity position in Alfa Corporation and is seeking two board seats.\nAlfa is a mature company that has maintained a constant dividend payout ratio and does not currently have a share repurchase program. In public comments, Edberg recommends a material increase in Alfa's dividend payout ratio and benchmarking the payout to Alfa's competitors.\nEdberg tells Alfa's management that Minskar, one of Alfa's competitors, has a 75% target payout ratio with an adjustment period of four years. Minskar's most recent annual dividend was $0.25 per share. Minskar's EPS is expected to be $1.30 in Year 1 and $1.10 in Year 2 of the adjustment period.\nAs an alternative to Alfa increasing dividends, Edberg proposes a one-time share repurchase using borrowed funds. Edberg's current EPS forecast for Alfa for the next year is $1.50. The company currently has 2,267,000 shares outstanding, its current share price is $30, and its after-tax cost of borrowing is 4.25%. Edberg calculates the revised EPS forecast for Alfa, assuming that 250,000 shares are repurchased immediately at the current share price.\nTaylor Greene, an analyst, oversees the integration of ESG factors into Sintra's investment analysis. Greene analyzes current policies and practices related to Alfa's board and recommends changes that would increase governance effectiveness. Alfa's board has 13 members, seven of whom are independent, and is chaired by the company's CEO. The board has audit, compensation, nomination, risk and compliance, and governance committees.", "Adriani Nicola is an analyst for an investment consulting firm. She is preparing an analysis of equity funds for an institutional client.\nNicola evaluates risk metrics for the Lagunas Fund. For her current analysis, Nicola calculates a 5% daily VaR using the parametric method. Lagunas has $175 million in assets under management and is expected to have an annual return of 8.80% with a standard deviation of 14.25%. She assumes 250 trading days in a year. In a standard normal distribution, a 5% VaR is 1.65 standard deviations below the expected value.\nNicola supplements her analysis with an annual 5% VaR using the historical simulation approach over a 10-year period. She observes higher volatility in recent years, which she expects to persist in the future. Nicola is concerned that VaR using the historical simulation approach may not adequately reflect the higher volatility and considers potential revisions to this approach.\nThe Lagunas Fund has a large position in ABC stock, whose price has been extremely volatile. The portfolio manager has proposed reducing the fund's position in ABC stock by 3%. Nicola considers a measure to capture how the VaR of the fund would change if the reduction was implemented.\nNicola evaluates three multifactor equity strategies that use a risk parity approach to portfolio construction. Each strategy's investment objective is to achieve market returns with potential for upside, while managing volatility and extreme downside risk. As part of her evaluation, Nicola backtests the three strategies using monthly returns from the past 20 years. She assesses the backtest results shown in Exhibit 1.\nExhibit 1\n\tMean Return\tMaximum Return\tMinimum Return\tStandard Deviation\tSkewness\tKurtosis\nStrategy A\t0.71%\t3.60%\t–2.40%\t1.46%\t0.15\t8.70\nStrategy B\t0.68%\t3.40%\t–2.30%\t1.39%\t–0.25\t6.50\nStrategy C\t0.70%\t3.50%\t–2.35%\t1.44%\t0.65\t4.20", "Joanne Bernard is a currency trader for a US-based hedge fund. She reviews interbank bid-offer quotes in Exhibit 1 (USD/EUR is the number of USD per 1 EUR; JPY/USD is the number of JPY per 1 USD). Bernard determines if an arbitrage profit is possible for the fund based on a dealer's bid/offer rate quote of 119.38/119.40 in JPY/EUR.\nExhibit 1\nCurrency Pair\tInterbank Bid\tInterbank Offer\nUSD/EUR\t1.1416\t1.1421\nJPY/USD\t104.62\t104.68\nThe hedge fund considers hedging a New Zealand dollar (NZD) 1,000,000 coupon payment it will receive in six months. Bernard calculates the 6-month forward USD/NZD (number of USD per 1 NZD) exchange rate implied by covered interest rate parity. Note that MRR is the market reference rate.\n6-month annualized MRR in the US is 0.50%\n6-month annualized MRR in New Zealand is 1.00%\nThe spot mid-market currency quote for USD/NZD is 0.6808\nBernard next considers a 1-year carry trade that involves borrowing the USD and investing in the Brazilian real (BRL). She computes the all-in return (measured in USD terms) of the carry trade using the following information:\nSpot mid-market quote for the BRL/USD is 5.1300\n1-year MRR in the US is 1.00%\n1-year MRR in Brazil is 9.75%\nThe BRL/USD exchange rate in one year is 5.2000\nFinally, Bernard is concerned about a currency crisis in emerging market Country B. She notes the following conditions about the country:\nCondition 1: A slight decline of foreign investment in its equity market\nCondition 2: Broad money growth and a decline in the ratio of M2 (a measure of money supply) to bank reserves\nCondition 3: A sizable decline in the ratio of foreign exchange (FX) reserve holdings to average daily FX turnover in their domestic currency", "Susan Traske is an analyst specializing in financial institutions. She is evaluating Sigmar, a large US-based commercial bank. Traske uses the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach in her evaluation of Sigmar. As part of this analysis, she examines Sigmar's liquidity ratios and notes that the bank's net stable funding ratio has increased steadily over the past three years. She then investigates which components of the ratio explain this trend.\nTraske reviews Sigmar's employee compensation policy and notes that a large restricted stock grant vested during the current year. The share price on the settlement date was greater than the share price on the grant date. Recognizing that Sigmar prepares its financial statements in accordance with US GAAP, Traske considers the effect of the vested grant on Sigmar's income tax expense for the current year.\nSigmar sponsors a defined benefit pension plan for employees. Sigmar's pension disclosure for the most recent year is shown in Exhibit 1 (amounts in $ millions):\nExhibit 1\nInterest cost\t2,875\nCurrent service cost\t535\nActual return on plan assets\t2,895\nExpected return on plan assets\t3,000\nTraske notes that there was no amortization of past service costs, no amortization of actuarial gains or losses, and no amortization of differences between actual and expected return on plan assets.\nFinally, Traske compares the overall efficiency of the underwriting operations of three property and casualty insurance companies based on the information in Exhibit 2.\nExhibit 2\n\tInsurer A\tInsurer B\tInsurer C\nLoss and loss adjustment ratio\t60.2%\t66.4%\t63.1%\nUnderwriting expense ratio\t42.3%\t30.8%\t32.5%", "Maximilian Bueden manages the equity exposure for a family office. All of the office's investment returns are measured in EUR, while equity holdings in foreign currencies are usually hedged to eliminate exchange rate risk. Six months ago, Bueden entered a 3-year receive-equity, pay-fixed, annual-reset equity swap with a notional amount of EUR 1,000,000. At initiation, the fixed rate was 2.3% and the equity index was trading at 100. Now the fixed rate has declined to 1.8% and the equity index is trading at 104.8. Bueden determines the no-arbitrage value of the equity swap based on the present value (PV) factors in Exhibit 1.\nExhibit 1\nMaturity (in Years)\tPV Factor for Equity Swap\n0.5\t0.99108\n1.5\t0.97371\n2.5\t0.95694\nOver the next year, Bueden expects regular cash inflows denominated in Australian dollar (AUD) from the family office's Australian equity portfolio. He hedges the currency exposure by entering into a fixed-for-fixed currency swap with a notional amount of AUD 16 million. The AUD/EUR spot exchange rate is 1.60 AUD per EUR and notional amounts are exchanged at initiation and at maturity. The interest rate on the EUR leg is 1.8%. Bueden calculates the interest rate on the AUD leg that results in a contract value of zero at initiation, based on the present value factors in Exhibit 2.\nExhibit 2\nMaturity (in Years)\tPV Factor for AUD Leg\n0.25\t0.99567\n0.50\t0.99012\n0.75\t0.98345\n1.00\t0.97965\nSum of PV factors:\t3.94889\nBueden next identifies an arbitrage opportunity in shares of Reyab, a publicly traded company. A forward contract on Reyab is trading in the market at EUR 63.25, while the theoretical arbitrage-free price is EUR 63.65.\nFinally, Bueden evaluates a 9-month forward contract on Furblag, another equity holding. He enters into the 9-month forward contract on Furblag at a price of EUR 123. Six months after initiation of the contract, the dividend has been paid and Furblag shares are trading at EUR 131. The annually compounded interest rate is 1.6%.", "Shawn Laver, a buy-side analyst, is evaluating three companies: Globac, Waltun, and Dentoc. Laver first values Globac, a natural resources company that has significant iron ore reserves. Due to its weak growth prospects, Globac has generated negative earnings and negative operating cash flows in recent years. This trend appears likely to continue for the foreseeable future.\nNext, Laver computes Waltun's FCFF using the most recent fiscal year data (in $ millions) provided in Exhibit 1. Waltun has a tax rate of 30% and its financial statements are prepared under US GAAP.\nExhibit 1\nNet income\t500\nDepreciation expense\t25\nInterest expense\t50\nInvestment in fixed capital\t75\nInvestment in working capital\t150\nCash flow from operations\t375\nLaver computes Dentoc's FCFE for the most recent year to be $750 million. He believes the company will have annual growth of 12% for each of the next three years, followed by a decline to the industry-average growth rate of 4%. Laver assumes a required rate of return on equity of 10% and a WACC of 9%. Using a two-stage model, Laver estimates the intrinsic value of Dentoc's common equity.\nSix months later, Laver revises his FCFE projections of Dentoc to incorporate the impact of several financial decisions approved by the company's board:\n• Decision 1: Dentoc will pay a cash dividend of $2 per share to its common shareholders.\n• Decision 2: Dentoc will buy back 1 million shares of its own common stock.\n• Decision 3: Dentoc will modify its capital structure by increasing its level of debt by 5%.", "Pamela Brown, CFA, is a financial planner at Metulla Investment Management, a private wealth management firm. Brown is preparing to meet with Jonathan Cliff, a prospective client, to review a sample of Metulla's strategies that are suitable for Cliff's risk tolerance and return objectives.\nDuring her meeting with Cliff, Brown presents the latest performance report for Metulla’s flagship large-cap equity composite. The report has been prepared by Brown's team. The composite return calculation includes the returns of terminated accounts. The report's disclosure regarding terminated accounts does not state the dates when the accounts were terminated. Metulla does not claim compliance with the GIPS standards.\nBrown provides Cliff with an overview of Metulla's IPO allocation policies. Brown demonstrates how she recently allocated the shares received from an IPO that was suitable for clients with a small-cap mandate. The IPO was oversubscribed and Metulla received 100,000 shares. In Exhibit 1, Brown provides the list of Metulla's accounts with a small-cap mandate, including some accounts of family members of Metulla's employees, as well as the number of shares subscribed by each group. All accounts pay fees according to Metulla's standard fee schedule. Employees do not have beneficial interest in family members' accounts.\nExhibit 1\n\tType of Account\tClients\tIPO Subscription (Number of Shares)\nGroup 1\tDiscretionary\tFamily members\t25,000\nGroup 2\tDiscretionary\tNon-family members\t70,000\nGroup 3\tNondiscretionary\tNon-family members\t30,000\nOne month later, Cliff hires Brown to manage his account. Cliff instructs that his trades should be directed to Brinkman Securities LLC. Brown notifies Cliff in writing that Brinkman does not provide best execution, but nonetheless executes trades for Cliff's account with Brinkman. Brinkman provides Brown with \"soft dollars\" for each of Cliff's trades. Brown uses the soft dollars to benefit Metulla's institutional clients.\nBrown recently prepared an IPS for a family friend who is not one of Metulla's clients. In exchange for preparing the IPS, Brown accepted a $1,000 consulting fee. Separately, Brown received a one-year gift membership to an exclusive golf club from one of Metulla's clients. For this additional compensation, Brown disclosed neither the consulting fee nor the gift membership to Metulla.", "Rodrick Darko, CFA, is a senior research analyst at TTN Capital, a large full-service brokerage and investment firm. Darko is invited to an analyst conference hosted by Bloom Data Centers, a company covered by Darko. Bloom arranges to pay for the commercial flights for all analysts attending the conference. Bloom also provides a company-branded mug as a gift to all analysts who attend the conference. Darko accepts the travel arrangement and the gift.\nDarko is building a model to support his analysis for a research report on Ncenter Corp. As a source for the model, Darko relies on a third-party research provider that was approved by TTN's research division. He does not perform his own due diligence on the research provider. Darko's analysis includes both positive and negative growth scenarios in the model, but Darko decides to include only the positive growth scenario in his report.\nDarko's supervisor is concerned about recent policy violations by employees in his department. During a compliance training meeting, Darko suggests three initiatives to improve compliance.\nInitiative 1: Periodically update compliance procedures to ensure that the measures are adequate under the law\nInitiative 2: Educate personnel regarding the compliance procedures only when they join the firm\nInitiative 3: Issue periodic reminders of the compliance procedures to appropriate personnel\nAnne Garcia, CFA, works in TTN's client services department. Garcia meets with a client and, during the meeting, she receives information that makes her suspect the client has committed tax fraud. Garcia sends a company-wide email det

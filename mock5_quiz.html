trap": "IC가 높으면 weight가 커질 것 같지만, Schweser·CFAI 기준 공식상 optimal active weight는 IC에 반비례.", "f": "Δw_i* = [σ_A / (IC·√BR)] × (α_i / σ_i²) 형태 — σ_A에 비례, IC에 반비례", "why": {"A": "IC가 낮아지면 optimal active weight는 오히려 커진다.", "C": "IC ↓, target active risk ↑ 모두 weight를 키우는 방향."}, "orig": "Mock 5 Session 1 Q31", "conf": true, "my": "C"}, {"id": "mock5-Q32", "src": "정답", "module": "PM", "tag": "포트폴리오 제약과 transfer coefficient", "vig": 7, "stem": "The most likely effect of the prospective client's equity portfolio guidelines is a reduction in:", "opts": {"A": "breadth.", "B": "the transfer coefficient.", "C": "the information coefficient."}, "ans": "B", "en": "A. breadth. — Incorrect\nIncorrect because breadth refers to the number of independent decisions. The guidelines restrict the weightings but not the number of decisions.\nB. the transfer coefficient. — Correct\nCorrect because the prospective client has imposed constraints on portfolio construction. The long-only and maximum over- or underweight constraints substantially reduce the transfer of active return forecasts into active weights.\nC. the information coefficient. — Incorrect\nIncorrect because the information coefficient is independent of client guidelines or constraints but rather relates to the investor's capability in forecasting. IC is the ex ante information coefficient that measures the assumed accuracy of the investor’s relative rankings.", "ko": "섹터 overweight·underweight 상한 같은 제약은 예측(alpha)이 active weight로 옮겨지는 정도를 줄인다 → transfer coefficient(TC) 하락. breadth는 독립적인 결정의 수, IC는 예측 능력이라 제약과 관계없다.", "trap": "constraints(long-only, 비중 한도) → TC 감소.", "f": "IR = TC × IC × √BR", "why": {"A": "breadth는 독립 결정의 수. 비중 제한은 결정 수를 줄이지 않는다.", "C": "IC는 예측 정확도. 고객 제약과 무관."}, "orig": "Mock 5 Session 1 Q32", "conf": false}, {"id": "mock5-Q33", "src": "정답", "module": "FI", "tag": "spot curve와 coupon bond YTM", "vig": 8, "stem": "The current yield to maturity (YTM) on a default-free, 1.2% annual-pay, three-year coupon bond is closest to:", "opts": {"A": "1.2%.", "B": "1.45%.", "C": "2.25%."}, "ans": "B", "en": "A. 1.2%. — Incorrect\nIncorrect because this is the coupon on the bond, not the YTM. It would be the correct answer if the bond was priced at par. Given the term structure in the exhibit, the bond is not priced at par.\nB. 1.45%. — Correct\nCorrect because the YTM on a three-year coupon bond will be closest to the three-year spot rate, regardless of coupon. The three-year spot rate is 1.45%.\nThe price of the bond is calculated as the present value of cash flows.\nPV = PMT/(1 + z1)^1 + PMT/(1 +z2)^2 + PMT + 100/(1 + z3)^3,\nWhere PMT = coupon and z = spot rate for each time period.\nPV = 1.2/1.0075+1.2/1.012^2+101.2/1.0145^3= 1.19107 + 1.17171 + 96.9224 = 99.2852.\nNext, solve for YTM: PV = –99.2852, FV=100, n=3, PMT=1.2 and solving for I/Y = YTM = 1.445% ≈ 1.45%.\nC. 2.25%. — Incorrect\nIncorrect because this is the one-year forward rate in three years, not the YTM for a three-year bond.", "ko": "3년 쿠폰채 가격 = 1.2/1.0075 + 1.2/1.012^2 + 101.2/1.0145^3 = 1.191 + 1.172 + 96.922 = 99.285. N=3, PMT=1.2, FV=100, PV=−99.285 → YTM ≈ 1.445% ≈ 1.45%. 쿠폰이 작아 대부분의 현금흐름이 3년차에 있으므로 YTM은 3년 spot rate에 가깝다.", "trap": "쿠폰 1.2%와 YTM은 par일 때만 같다.", "f": "Price = Σ CF_t/(1 + z_t)^t, 그 가격으로 YTM 풀기", "why": {"A": "쿠폰 이자율. 가격이 par가 아니라 YTM과 다르다.", "C": "f(3,1) 1년 forward rate."}, "orig": "Mock 5 Session 1 Q33", "conf": false}, {"id": "mock5-Q34", "src": "오답", "module": "FI", "tag": "spot curve 불변 시 rolldown 수익", "vig": 8, "stem": "Given Eng's expectation for spot rates, the first-year return on a 3-year zero-coupon bond is closest to:", "opts": {"A": "0.75%.", "B": "1.45%.", "C": "1.95%."}, "ans": "C", "en": "A. 0.75%. — Incorrect\nIncorrect because this is the 1-year spot rate. This rate would only have been achieved if the spot rates evolved as implied by the current forward curve. This is not the case under Eng's expectation of an unchanged spot curve.\nB. 1.45%. — Incorrect\nIncorrect because this is the 3-year spot rate. Eng would realize the one-year forward rate for year 3, not the geometric average of the forward rates over the three years.\nC. 1.95%. — Correct\nCorrect because under Eng's spot curve expectation the total return will be the one-year forward rate for year 3. We can see that if the spot rate curve is unchanged, then each bond rolls down the curve and earns the forward rate.\nThis can be shown mathematically by calculating the price of a 3-year zero coupon bond today. Price = 1/(1 + spot rate)^3 = 1/(1.0145^3) = 0.957732. With an unchanged yield curve, this bond will become a 2-year zero coupon bond in one year with a price = 1/(1 + spot rate)^2 = 1/(1.0120^2) = 0.976425. The first year return = 0.976425/0.957732 – 1 ≈ 1.95%, which equals f(2,1) from Exhibit 1.", "ko": "spot curve가 그대로면 3년 zero는 1년 뒤 2년 zero가 되어 2년 spot rate로 가격이 매겨진다. 가격 0 = 1/1.0145^3 = 0.957732, 1년 후 = 1/1.012^2 = 0.976425. 1년 수익 = 0.976425/0.957732 − 1 = 1.95% = f(2,1). curve가 변하지 않으면 각 채권은 해당 1년 forward rate를 번다.", "trap": "forward rate가 실현되면 모든 채권 수익은 1년 spot(0.75%), spot curve가 불변이면 forward rate. 두 가정을 헷갈리지 말 것.", "f": "spot curve 불변 → n년 zero의 1년 수익 = f(n−1, 1)", "why": {"A": "forward curve대로 spot rate가 변할 때의 수익(1년 spot). Eng의 가정은 spot curve 불변.", "B": "3년 spot rate(3년 평균 수익률)이지 첫해 수익이 아니다."}, "orig": "Mock 5 Session 1 Q34", "conf": true, "my": "A"}, {"id": "mock5-Q35", "src": "정답", "module": "FI", "tag": "segmented markets theory", "vig": 8, "stem": "Client 1's restriction regarding the securities Eng can purchase is most consistent with the assumptions underlying the:", "opts": {"A": "preferred habitat theory.", "B": "liquidity preference theory.", "C": "segmented markets theory."}, "ans": "C", "en": "A. preferred habitat theory. — Incorrect\nIncorrect because the preferred habitat theory postulates that if the expected additional returns to be gained become large enough, institutions will be willing to deviate from their preferred maturities or habitats. Eng is not able to do that due to his investor-imposed constraints.\nB. liquidity preference theory. — Incorrect\nIncorrect because the liquidity preference theory focuses on investor's risk aversion and the fact that they demand a liquidity premium for added interest rate risk. Eng would prefer to invest in longer-term maturities to capture this premium but cannot. Also, Client 1 does not direct Eng to purchase only three-year maturity bonds to capture a possible liquidity premium, but that Eng can purchase securities up to three years. This direction indicates the client does not have a preference to capture the liquidity premium if it exists. Liquidity preference theory asserts that liquidity premiums exist to compensate investors for the added interest rate risk they face when lending long term and that these premiums increase with maturity.\nC. segmented markets theory. — Correct\nCorrect because due to the direction from the Client, Eng continues to invest only in 3-year maturities even though he expects 5-year maturities to offer superior expected returns. The segmented markets theory assumes that market participants are either unwilling or unable to invest in anything other than securities of their preferred maturity. It follows that the yield of securities of a particular maturity is determined entirely by the supply and demand for funds of that particular maturity.", "ko": "고객 제한 때문에 5년물이 더 좋을 것으로 예상해도 3년 이하만 산다 = 다른 만기로 옮겨갈 수 없다 → segmented markets theory(각 만기 시장이 분리되어 그 만기의 수급으로만 금리 결정). preferred habitat theory는 기대 추가 수익이 충분히 크면 선호 만기를 벗어난다고 본다.", "trap": "수익이 커도 못 옮긴다 → segmented, 충분한 premium이면 옮긴다 → preferred habitat.", "f": "", "why": {"A": "preferred habitat은 충분한 추가 수익이 있으면 선호 만기를 벗어날 수 있다고 가정. Eng는 제약 때문에 못 옮긴다.", "B": "liquidity preference는 장기채에 liquidity premium을 요구한다는 이론. 고객 제약은 premium 포착과 무관."}, "orig": "Mock 5 Session 1 Q35", "conf": false}, {"id": "mock5-Q36", "src": "정답", "module": "FI", "tag": "key rate duration 합 = effective duration", "vig": 8, "stem": "The 5-year key rate duration for Client 2's portfolio is closest to:", "opts": {"A": "1.60.", "B": "1.85.", "C": "1.95."}, "ans": "B", "en": "A. 1.60. — Incorrect\nIncorrect because this is the value that would be obtained if 5-year key rate duration is calculated as the 3-year key rate duration plus the 1-year key rate duration plus the 1-year key rate duration to get five full years of key rate duration. This incorrect calculation is: 1.10 + 0.25 + 0.25 = 1.60.\nB. 1.85. — Correct\nCorrect because for Portfolio 2 the sum of the three portfolio key rate durations must equal the portfolio's effective duration. Effective duration = 1-year key rate duration + 3-year key rate duration + 5-year key rate duration = 3.20 = 0.25 + 1.10 + 5-year key rate duration. 5-year key rate duration = 3.20 – 0.25 – 1.10 = 1.85.\nKey rate duration measures the portfolio risk exposure to each key rate. If all the key rates move by the same amount, then the yield curve has made a parallel shift, and as a result, the proportional change in value has to be consistent with effective duration.\nC. 1.95. — Incorrect\nIncorrect because this is the value that would be obtained if the key rate duration curve is assumed to be linear calculated as the 3-year key rate duration plus the 3-year key rate duration less the 1-year key rate duration = 1.10 + (1.10 – 0.25) = 1.95.", "ko": "key rate duration들의 합은 effective duration과 같다. 3.20 = 0.25 + 1.10 + KRD5 → KRD5 = 1.85.", "trap": "선형 보간이나 1년 KRD를 반복해 더하는 식으로 구하지 않는다.", "f": "Σ KRD_k = effective duration", "why": {"A": "1.10 + 0.25 + 0.25로 임의 합산.", "C": "KRD가 선형으로 늘어난다고 가정해 1.10 + (1.10 − 0.25)."}, "orig": "Mock 5 Session 1 Q36", "conf": false}, {"id": "mock5-Q37", "src": "정답", "module": "QM", "tag": "cointegration 검정 조합", "vig": 9, "stem": "The time series ln(PRIVt) and ln(PUBLt) are cointegrated if the tests performed by Silva:", "opts": {"A": "reject only Null Hypothesis 3.", "B": "reject all three null hypotheses.", "C": "fail to reject all three null hypotheses."}, "ans": "A", "en": "A. reject only Null Hypothesis 3. — Correct\nCorrect because, to be cointegrated, two time series need to satisfy the following criteria:\nThey both have a unit root, i.e., Null Hypothesis 1 and 2 are not rejected (by a Dickey–Fuller test).\nThe residuals of the regression between the two time series do not have a unit root, i.e., Null Hypothesis 3 is rejected (by an Engle–Granger Dickey–Fuller test).\nWhen testing for cointegration, five scenarios are possible, and only one of them (Scenario 4) corresponds to cointegration:\nScenario 1: Neither time series has a unit root.\nScenario 2: Only the first time series has a unit root.\nScenario 3: Only the second time series has a unit root.\nScenario 4 (cointegration): Both time series have a unit root and the error term of a linear regression between the two time series does not have a unit root.\nScenario 5: Both time series have a unit root and the error term of a linear regression between the two time series also has a unit root.\nIf Silva fails to reject Null Hypothesis 1 and 2 and rejects Null Hypothesis 3, we are in Scenario 4 (cointegration): Both time series have a unit root (Null Hypothesis 1 and 2) and the error term of the regression does not have a unit root (Null Hypothesis 3).\nIf the (Engle–Granger) Dickey–Fuller test rejects the null hypothesis that the error term has a unit root, then we may assume that the error term in the regression is covariance stationary and that the two time series are cointegrated.\nB. reject all three null hypotheses. — Incorrect\nIncorrect because, if Null Hypothesis 1 and 2 are rejected, neither time series has a unit root, which means they cannot be cointegrated.\nWhen testing for cointegration, five scenarios are possible, and only one of them (Scenario 4) corresponds to cointegration:\nScenario 1: Neither time series has a unit root.\nScenario 2: Only the first time series has a unit root.\nScenario 3: Only the second time series has a unit root.\nScenario 4 (cointegration): Both time series have a unit root and the error term of a linear regression between the two time series does not have a unit root.\nScenario 5: Both time series have a unit root and the error term of a linear regression between the two time series also has a unit root.\nIf Silva rejects Null Hypothesis 1 and 2, we are in Scenario 1, which does not correspond to cointegration.\nC. fail to reject all three null hypotheses. — Incorrect\nIncorrect because, if Null Hypothesis 3 is not rejected (by an Engle–Granger Dickey–Fuller test), the residuals of the regression have a unit root and the two time series are not cointegrated. If the (Engle–Granger) Dickey–Fuller test fails to reject the null hypothesis that the error term has a unit root, then we conclude that the error term in the regression is not covariance stationary. Therefore, the two time series are not cointegrated.\nWhen testing for cointegration, five scenarios are possible, and only one of them (Scenario 4) corresponds to cointegration:\nScenario 1: Neither time series has a unit root.\nScenario 2: Only the first time series has a unit root.\nScenario 3: Only the second time series has a unit root.\nScenario 4 (cointegration): Both time series have a unit root and the error term of a linear regression between the two time series does not have a unit root.\nScenario 5: Both time series have a unit root and the error term of a linear regression between the two time series also has a unit root.\nIf Silva fails to reject all three null hypotheses, we are in Scenario 5, which does not correspond to cointegration: Both time series have a unit root (Null Hypothesis 1 and 2) and the error term of the regression also has a unit root (Null Hypothesis 3).", "ko": "cointegration 조건: 두 시계열 모두 unit root가 있고(H1·H2 기각 못 함), 둘의 회귀 잔차는 unit root가 없음(H3 기각, Engle–Granger DF 검정). 따라서 H3만 기각할 때 cointegrated.", "trap": "세 가설 모두 기각 못 하면 잔차에도 unit root → cointegration 아님.", "f": "", "why": {"B": "H1·H2를 기각하면 두 시계열 모두 stationary(unit root 없음) → cointegration 개념이 적용되지 않음.", "C": "H3를 기각하지 못하면 잔차에 unit root가 있어 cointegrated 아님."}, "orig": "Mock 5 Session 1 Q37", "conf": true}, {"id": "mock5-Q38", "src": "정답", "module": "QM", "tag": "AR(1) mean-reverting level", "vig": 9, "stem": "The mean-reverting level of Δln(PRIVt) is closest to:", "opts": {"A": "0.002.", "B": "0.004.", "C": "0.387."}, "ans": "B", "en": "A. 0.002. — Incorrect\nIncorrect because a \"+\" is used instead of a \"–\" at the denominator of the formula to obtain the mean-reverting level:\nb0/(1 + b1) = 0.00259/(1 + 0.38616) = 0.0019 ≈ 0.002\nB. 0.004. — Correct\nCorrect because the mean-reverting level of the dependent variable of an AR(1) model is obtained as follows:\nb0/(1 – b1) = 0.00259/(1 – 0.38616) = 0.0042 ≈ 0.004\nC. 0.387. — Incorrect\nIncorrect because, in the formula to calculate the mean-reverting level, b0 and b1 are swapped:\nb1/(1 – b0) = 0.38616/(1 – 0.00259) = 0.3872 ≈ 0.387", "ko": "AR(1)의 mean-reverting level = b0/(1 − b1) = 0.00259/(1 − 0.38616) = 0.00259/0.61384 = 0.0042 ≈ 0.004.", "trap": "분모는 1 − b1(빼기).", "f": "Mean-reverting level = b0 / (1 − b1)", "why": {"A": "분모에 1 + b1 사용.", "C": "b0와 b1을 바꿔 b1/(1 − b0)."}, "orig": "Mock 5 Session 1 Q38", "conf": false}, {"id": "mock5-Q39", "src": "정답", "module": "QM", "tag": "잔차 회귀로 ARCH·serial correlation 판별", "vig": 9, "stem": "Do the estimates of the residual regression parameters indicate that the AR(1) model on Δln(PUBLt) is misspecified?", "opts": {"A": "No", "B": "Yes, because there is evidence of significant serial correlation", "C": "Yes, because there is evidence of autoregressive conditional heteroskedasticity (ARCH)"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Residual Regression 2 indicates that the model exhibits autoregressive conditional heteroskedasticity (ARCH), hence it is not well specified.\nRobert E. Engle showed that we can test whether a time series is ARCH(1) by regressing the squared residuals from a previously estimated time-series model (AR, MA, or ARMA) on a constant and one lag of the squared residuals. We can estimate the linear regression equation: εt^2 = a0 + a1 εt–1^2 + ut, where ut is an error term. If the estimate of a1 is statistically significantly different from zero, we conclude that the time series is ARCH(1).\nHere, the relevant regression is Residual Regression 2 and the t-statistic for the a1 coefficient is 2.94, which is greater than the critical value of 1.97.\nB. Yes, because there is evidence of significant serial correlation — Incorrect\nIncorrect because there is no evidence of significant serial correlation based on Residual Regression 1. The slope coefficient of Residual Regression 1 is not statistically different from 0, which indicates that we cannot reject the null hypothesis that the residuals are not autocorrelated. An additional lag should be added to the AR model if the residuals were autocorrelated.\nTo decide which autoregressive model to use, take the following steps:\nEstimate an AR(1) model.\nTest to see whether the residuals from this model have significant serial correlation.\nIf you find no significant serial correlation in the residuals, you can use the AR(1) model to forecast.\nC. Yes, because there is evidence of autoregressive conditional heteroskedasticity (ARCH) — Correct\nCorrect because Residual Regression 2 indicates that the model exhibits autoregressive conditional heteroskedasticity (ARCH). Robert E. Engle showed that we can test whether a time series is ARCH(1) by regressing the squared residuals from a previously estimated time-series model (AR, MA, or ARMA) on a constant and one lag of the squared residuals. We can estimate the linear regression equation: εt^2 = a0 + a1 εt–1^2 + ut, where ut is an error term. If the estimate of a1 is statistically significantly different from zero, we conclude that the time series is ARCH(1).\nHere, the relevant regression is Residual Regression 2 and the t-statistic for the a1 coefficient is 2.94, which is greater than the critical value of 1.97.", "ko": "Residual Regression 1(잔차를 이전 잔차에 회귀) t = 0.70 < 1.97 → serial correlation 없음. Residual Regression 2(잔차 제곱을 이전 잔차 제곱에 회귀) t = 2.94 > 1.97 → ARCH(1) 존재. ARCH가 있으면 회귀 계수의 표준오차가 틀려 모델이 misspecified.", "trap": "잔차 → serial correlation, 잔차 '제곱' → ARCH.", "f": "ε_t² = a0 + a1 ε_{t−1}² + u_t, a1 유의 → ARCH(1)", "why": {"A": "잔차 제곱 회귀 a1이 유의(2.94 > 1.97)해 ARCH가 있다.", "B": "잔차 회귀 a1의 t = 0.70으로 유의하지 않아 serial correlation 증거 없음."}, "orig": "Mock 5 Session 1 Q39", "conf": true}, {"id": "mock5-Q40", "src": "정답", "module": "QM", "tag": "text feature selection — mutual information", "vig": 9, "stem": "To perform feature selection, Silva should select the tokens with the:", "opts": {"A": "lowest term frequency (TF).", "B": "highest mutual information (MI).", "C": "highest document frequency (DF)."}, "ans": "B", "en": "A. lowest term frequency (TF). — Incorrect\nIncorrect because tokens with the lowest term frequency (TF) are likely to be noise features, which Silva wants to remove. Frequency measures can be used for vocabulary pruning to remove noise features by filtering the tokens with very high and low TF values across all the texts. Noisy features are both the most frequent and most sparse (or rare) tokens in the dataset. Noisy features can be sparse terms that are present in only a few text cases. The rare tokens mislead the ML model into classifying texts containing the rare terms into a specific class, an example of model overfitting. Identifying and removing noise features is very critical for text classification applications.\nB. highest mutual information (MI). — Correct\nCorrect because Silva wants to remove noise features and select the tokens that tend to occur more often in a particular class of text, which are those with the highest mutual information (MI). Mutual information (MI) measures how much information is contributed by a token to a class of texts. The mutual information value will be equal to 0 if the token’s distribution in all text classes is the same. The MI value approaches 1 as the token in any one class tends to occur more often in only that particular class of text.\nC. highest document frequency (DF). — Incorrect\nIncorrect because tokens with the highest document frequency (DF) are likely to be noise features, which Silva wants to remove. Document frequency (DF) is a frequency measure that helps to discard the noise features that carry no specific information about the text class and are present across all texts. Noisy features are both the most frequent and most sparse (or rare) tokens in the dataset. Noisy features can be stop words that are typically present frequently in all the texts across the dataset. The frequent tokens strain the ML model to choose a decision boundary among the texts as the terms are present across all the texts, an example of model underfitting. Identifying and removing noise features is very critical for text classification applications.", "ko": "특정 class에서 더 자주 나오는 token을 고르려면 mutual information(MI)이 높은 token을 고른다. MI는 token이 모든 class에 똑같이 분포하면 0, 한 class에 집중되면 1에 가깝다. TF가 아주 낮은(희귀) token과 DF가 아주 높은(어디에나 있는) token은 noise feature라 제거 대상.", "trap": "noise = 너무 흔한 token(높은 DF/TF) + 너무 드문 token(낮은 TF).", "f": "", "why": {"A": "TF가 가장 낮은 희귀 token은 overfitting을 부르는 noise feature.", "C": "DF가 가장 높은 token은 모든 문서에 있어 class 정보가 없는 noise feature."}, "orig": "Mock 5 Session 1 Q40", "conf": true}, {"id": "mock5-Q41", "src": "정답", "module": "ETH", "tag": "투자 프로세스 변경 미공시 — V(B)", "vig": 10, "stem": "In his actions relating to the use of AI, does Denton comply with the Standards?", "opts": {"A": "Yes", "B": "No, he violates the Standard relating to fair dealing", "C": "No, he violates the Standard relating to communication with clients and prospective clients"}, "ans": "C", "en": "A. Yes — Incorrect\nIncorrect because Denton must keep clients and other interested parties informed on an ongoing basis about changes to the investment process, especially newly identified significant risks and limitations. He has failed to do this and is in violation of Standard V(B): Investment Analysis, Recommendations, and Actions – Communication with Clients and Prospective Clients.\nB. No, he violates the Standard relating to fair dealing — Incorrect\nIncorrect because Standard III(B): Duties to Clients – Fair Dealing states Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Denton's decision to incorporate AI for growth portfolios but not for other strategies is not a fair dealing violation. Denton is allowed to pursue different disciplines for different investment styles, changing the investment analysis process for growth-oriented portfolios while not making the same change for other equity strategies.\nC. No, he violates the Standard relating to communication with clients and prospective clients — Correct\nCorrect because Denton has an obligation to communicate this change in his investment process to his clients and prospective clients. Some clients might consider AI technology untested and not be comfortable with its associated risks.\nStandard V(B): Investment Analysis, Recommendations, and Actions – Communication with Clients and Prospective Clients states Members and Candidates must: 1. Disclose to clients and prospective clients the basic format and general principles of the investment processes they use to analyze investments, select securities, and construct portfolios and must promptly disclose any changes that might materially affect those processes. 2. Disclose to clients and prospective clients significant limitations and risks associated with the investment process.\nFrom the Guidance for Standard V(B): The member or candidate must keep clients and other interested parties informed on an ongoing basis about changes to the investment process, especially newly identified significant risks and limitations. Only by thoroughly understanding the nature of the investment product or service can a client determine whether changes to that product or service could materially affect his or her investment objectives.", "ko": "Denton은 growth 포트폴리오의 earnings forecast와 종목 screening에 AI를 쓰기 시작했는데, 이번 분기 고객 보고서에 이를 알리지 않았다. Standard V(B) Communication with Clients는 투자 프로세스의 중대한 변경과 그 위험·한계를 즉시 공시하도록 요구한다. 예전 보고서에 '연구 중'이라고 쓴 것으로는 부족하다. growth에만 AI를 쓰는 것 자체는 전략별로 다른 방법을 쓰는 것이라 fair dealing 위반이 아니다.", "trap": "전략마다 다른 프로세스를 쓰는 것은 III(B) 위반이 아니다. 문제는 변경을 알리지 않은 것.", "f": "", "why": {"A": "AI 도입이라는 프로세스 변경을 공시하지 않아 V(B) 위반.", "B": "투자 스타일마다 다른 방법을 쓰는 것은 fair dealing 위반이 아니다."}, "orig": "Mock 5 Session 1 Q41", "conf": false}, {"id": "mock5-Q42", "src": "정답", "module": "ETH", "tag": "referral fee — 비금전 보상 공시 VI(C)", "vig": 10, "stem": "With respect to the referrals from Lynch, does Denton comply with the Standards?", "opts": {"A": "Yes", "B": "No, because he did not disclose the payments for travel", "C": "No, because he did not disclose the offer of referral fees"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because under Standard VI(C): Conflicts of Interest – Referral Fees, Denton has an obligation to inform clients referred by Lynch of all forms of compensation provided to Lynch, including the plane tickets he purchases for her each year. Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services.\nB. No, because he did not disclose the payments for travel — Correct\nCorrect because under Standard VI(C): Conflicts of Interest – Referral Fees, Denton has an obligation to inform clients referred by Lynch of all forms of compensation provided to Lynch, including the plane tickets he purchases for her each year. Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services.\nC. No, because he did not disclose the offer of referral fees — Incorrect\nIncorrect because there is no requirement under the Standards to disclose to clients and prospective clients an offer of referral fees that was not accepted. However, if Lynch had accepted Denton's offer and payments were made, under the Standards this would need to be disclosed to clients and prospective clients.", "ko": "Lynch는 referral fee 제안을 거절했지만, Denton은 매년 함께 가는 여행에서 Lynch의 항공권을 개인 계좌로 대신 내준다. VI(C) Referral Fees는 소개와 관련해 지급한 모든 형태의 보상·혜택을 고객에게 공시하도록 요구하므로 항공권 대납을 공시해야 한다. 받아들여지지 않은 제안은 공시할 필요 없다.", "trap": "거절된 '제안'은 공시 대상 아님. 실제로 준 혜택(항공권)은 현금이 아니어도 공시 대상.", "f": "", "why": {"A": "소개자에게 준 항공권 혜택을 공시하지 않아 VI(C) 위반.", "C": "수락되지 않아 지급되지 않은 referral fee 제안은 공시 의무가 없다."}, "orig": "Mock 5 Session 1 Q42", "conf": true}, {"id": "mock5-Q43", "src": "정답", "module": "ETH", "tag": "investment committee 겸직 공시 VI(A)", "vig": 10, "stem": "With respect to the investment committee position, does Denton violate the Standards?", "opts": {"A": "No", "B": "Yes, by not disclosing that Hunter is a client", "C": "Yes, by not disclosing his appointment to the committee"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Denton's appointment to the investment committee of XLR Corporation's pension plan should be disclosed to his clients and prospective clients, as his new responsibilities could create conflicts of interest.\nB. Yes, by not disclosing that Hunter is a client — Incorrect\nIncorrect because the fact that Hunter is a client is confidential information that should not be disclosed to other clients and prospective clients. Standard III(E): Duties to Clients – Preservation of Confidentiality states Members and Candidates must keep information about current, former, and prospective clients confidential unless: 1. The information concerns illegal activities on the part of the client; 2. Disclosure is required by law; or 3. The client or prospective client permits disclosure of the information. None of these three exceptions apply in the case of Denton and Hunter.\nC. Yes, by not disclosing his appointment to the committee — Correct\nCorrect because Denton's appointment to the investment committee of XLR Corporation's pension plan should be disclosed to his clients and prospective clients, as his new responsibilities could create conflicts of interest.\nStandard VI(A): Conflicts of Interest – Disclosure of Conflicts states Members and Candidates must avoid or make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer.\nFrom the Guidance for Standard VI(A): Service as a director (investment committee member) poses three basic conflicts of interest. First, a conflict may exist between the duties owed to clients and the duties owed to shareholders of the company. Second, investment personnel who serve as directors (investment committee members) may receive the securities or options to purchase securities of the company as compensation for serving on the board, which could raise questions about trading actions that might increase the value of those securities. Third, board service creates the opportunity to receive material nonpublic information involving the company. Even though the information is confidential, the perception could be that information not available to the public is being communicated to a director’s firm—whether a broker, investment adviser, or other type of organization.", "ko": "Denton은 고객에게 추천해 온 XLR의 연금 투자위원회 자리를 (무보수로) 맡았는데 고객에게 알리지 않았다. 이사·위원회 활동은 고객 의무와의 충돌, 보상으로 받는 증권, MNPI 접근 가능성 등 이해상충이 생길 수 있으므로 VI(A) Disclosure of Conflicts에 따라 공시해야 한다. 반면 Hunter가 고객이라는 사실은 III(E) 비밀유지 대상이라 공시하면 안 된다.", "trap": "무보수 자리여도 이해상충 공시 대상. 고객 신원은 비밀.", "f": "", "why": {"A": "위원회 겸직은 객관성을 해칠 수 있는 이해상충이라 공시가 필요하다.", "B": "Hunter가 고객이라는 정보는 III(E)로 보호되는 비밀이라 공시하면 안 된다."}, "orig": "Mock 5 Session 1 Q43", "conf": false}, {"id": "mock5-Q44", "src": "정답", "module": "ETH", "tag": "고객이 연기한 매수 전 개인 매매 VI(B)", "vig": 10, "stem": "Did Denton comply with the Standards when purchasing Bio13 shares in his personal account?", "opts": {"A": "Yes", "B": "No, he violated the Standard relating to market manipulation", "C": "No, he violated the Standard relating to priority of transactions"}, "ans": "A", "en": "A. Yes — Correct\nCorrect because Denton did not violate Standard VI(B): Conflicts of Interest – Priority of Transactions, which states: Investment transactions for clients and employers must have priority over investment transactions in which a Member or Candidate is the beneficial owner. Denton did not trade ahead of (front-run) his client. Hunter had previously disclosed that he would not be purchasing Bio13 for 30 days and he was not disadvantaged by Denton's trade in any way – Denton's demand for liquidity for his personal trade was temporary, and Bio13's market price 30 days later will be influenced by subsequent developments in the biotech equity market and within Bio13.\nB. No, he violated the Standard relating to market manipulation — Incorrect\nIncorrect because Denton's trade is not a form of market manipulation. Even though it temporarily moves the price of Bio13, there was no intent to mislead market participants. The market impact caused by his trade is temporary and is not a determining factor in the price Hunter will pay 30 days later.\nC. No, he violated the Standard relating to priority of transactions — Incorrect\nIncorrect because Denton does not trade ahead of (front-run) his client. Hunter had previously disclosed that he would not be purchasing Bio13 for 30 days and he was not disadvantaged by Denton's trade in any way –the market impact caused by Denton's trade is temporary and is not a determining factor in the price Hunter will pay 30 days later.", "ko": "Denton은 Hunter에게 Bio13 매수를 권했지만, Hunter가 스스로 30일 뒤 보너스가 들어오면 사겠다고 연기를 요청했다. Denton은 바로 자기 계좌로 사서 일시적으로 주가가 올랐다. 고객 거래가 30일 뒤로 정해져 있었고 Denton의 매수 영향은 일시적이라 Hunter가 불이익을 받지 않으므로 front-running이 아니다 → VI(B) 위반 아님. 시장을 속이려는 의도도 없어 market manipulation도 아니다. Bio13은 다른 고객에게 부적합하므로 다른 고객보다 먼저 산 문제도 없다.", "trap": "고객이 스스로 매수를 미뤘고 불이익이 없으면 개인 매매가 먼저여도 priority 위반이 아니다.", "f": "", "why": {"B": "일시적 가격 영향만 있고 시장을 오도하려는 의도가 없어 manipulation 아님.", "C": "고객이 30일 뒤로 매수를 정했고 Denton의 매수가 그 가격에 영향을 주지 않아 front-running이 아니다."}, "orig": "Mock 5 Session 1 Q44", "conf": true}, {"id": "mock5-Q45", "src": "정답", "module": "FI", "tag": "convertible bond 최소 가치", "vig": 11, "stem": "The minimum value today of the Doredum convertible bond is:", "opts": {"A": "$95.", "B": "$100.", "C": "$105."}, "ans": "C", "en": "A. $95. — Incorrect\nIncorrect because this is the conversion value of the bond. The conversion value based on the current stock price is $3.80 × 25 = $95\nThe minimum value of a convertible bond is equal to the greater of (i) the conversion value (underlying share price conversion ratio) and (ii) the value of the underlying option-free bond. The value of the underlying option-free bond is $105.\nB. $100. — Incorrect\nIncorrect because this is the par value of the bond and not the minimum value of the convertible bond.\nC. $105. — Correct\nCorrect because the minimum value of a convertible bond is equal to greater of (i) the conversion value (underlying share price conversion ratio) and (ii) the value of the underlying option-free bond. Based on the information in the vignette, $105 is the value of the underlying option-free bond, which is greater than the conversion value of $3.80 × $25 = $95", "ko": "convertible bond의 최소 가치 = max(conversion value, straight bond 가치). conversion value = 25주 × $3.80 = $95, 같은 만기 option-free bond 가치 = $105 → 최소 가치 $105.", "trap": "par($100)나 conversion value만 보지 않는다.", "f": "Min value = max(conversion ratio × 주가, straight bond 가치)", "why": {"A": "conversion value $95. straight bond 가치 $105가 더 커서 최소 가치가 아니다.", "B": "par value일 뿐 최소 가치와 무관."}, "orig": "Mock 5 Session 2 Q1", "conf": true}, {"id": "mock5-Q46", "src": "정답", "module": "FI", "tag": "binomial tree putable bond 가치", "vig": 11, "stem": "Based on the binomial interest rate tree, the value of the putable bond is closest to:", "opts": {"A": "$98.04.", "B": "$100.00.", "C": "$100.98."}, "ans": "C", "en": "A. $98.04. — Incorrect\nIncorrect because the coupon of $3 is not added to the calculation:\n[((100 + 100) / 2)] / 1.020 = 98.04\nB. $100.00. — Incorrect\nIncorrect because this is also the par value of the bond.\nWhere: CF is the bond's cash flow in each period.\nYear 0\t\tYear 1\t\tYear 2\n\t\t\t\tCF = 103\n\t\tValue = 98.43\t\t\n\t\tt1,H = 4.64%\t\t\nValue = 100\t\t3\t\tCF = 103\n2.00%\t\t\t\n\t\tValue = 99.57\t\t\n\t\tt1,L = 3.44%\t\t\n\t\t\t\tCF = 103\nC. $100.98. — Correct\nCorrect because the value of the 2-yr putable bond equals the present value of future cash flows and where in any period if the price is lower than 100, the bond will be putable at 100.\nThe value at the end of period 1 at t1,H = 4.64% equals ((103 + 103) / 2) / (1.0464) = 98.43, where 103 is the total cash flow at maturity (Par = 100 and coupon = 3).\nAs this bond is putable at the end of year 1 at par, the value is set to 100.\nThe value at the end of period 1 at t1,L = 3.44% equals ((103 + 103) / 2) / (1.0344) = 99.57. As this bond is putable at the end of year 1 at par, the value is set to 100.\nThe value today equals:\n[((100+100) / 2) + 3] / 1.020 = 100.98, where 2.00% is the spot rate.", "ko": "Year 2 현금흐름 = 103(원금 100 + 쿠폰 3). Year 1 high 노드(4.64%): 103/1.0464 = 98.43 < 100 → put 행사, 100. low 노드(3.44%): 103/1.0344 = 99.57 < 100 → put 행사, 100. Year 0: [(100 + 100)/2 + 3]/1.02 = 103/1.02 = $100.98.", "trap": "Year 1 노드에서 받는 쿠폰 3을 더하는 것을 잊지 않는다.", "f": "노드 가치 = max(put price, [평균(다음 노드 가치 + 쿠폰)]/(1 + r))", "why": {"A": "Year 1 쿠폰 3을 더하지 않음: 100/1.02 = 98.04.", "B": "par value. put 행사로 노드 가치가 100이 되고 쿠폰까지 받으니 100보다 크다."}, "orig": "Mock 5 Session 2 Q2", "conf": false}, {"id": "mock5-Q47", "src": "정답", "module": "FI", "tag": "금리 변동성 ↑ → putable bond 가치", "vig": 11, "stem": "Under Bisht’s volatility scenario, the value of the putable bond would most likely:", "opts": {"A": "decrease.", "B": "not change.", "C": "increase."}, "ans": "C", "en": "A. decrease. — Incorrect\nIncorrect because under a scenario where interest rate volatility is assumed to be higher, the value of the putable bond increases. The value of the putable bond is the i) value of a similar straight bond plus the ii) value of the put option. Therefore, with higher interest rate volatility, the value of the put option increases, causing the overall value of the putable bond to increase and not decrease.\nB. not change. — Incorrect\nIncorrect because the value of any embedded option, regardless of the type of option, increases with interest rate volatility and hence impacts the value of the bond.\nC. increase. — Correct\nCorrect because under a scenario where interest rate volatility is assumed to be higher, the value of the putable bond increases. The value of the putable bond is the i) value of a similar straight bond plus the ii) value of the put option. Therefore, with higher interest rate volatility, the value of the put option increases, causing the overall value of the putable bond to increase.", "ko": "putable bond = straight bond + put option(투자자 보유). 금리 변동성이 커지면 모든 embedded option 가치가 오르므로 put 가치가 오르고 putable bond 가치도 오른다. (callable bond는 반대로 하락.)", "trap": "callable은 투자자가 option을 판 것(가치 하락), putable은 산 것(가치 상승).", "f": "V_putable = V_straight + V_put", "why": {"A": "callable bond라면 하락. putable은 투자자가 put을 보유하므로 상승.", "B": "embedded option 가치는 변동성에 따라 변한다."}, "orig": "Mock 5 Session 2 Q3", "conf": false}, {"id": "mock5-Q48", "src": "정답", "module": "FI", "tag": "non-parallel shift → key rate duration", "vig": 11, "stem": "Based on his interest rate scenario, which of the following types of duration would be most appropriate for Bisht to use in evaluating the putable bond?", "opts": {"A": "Key rate duration", "B": "Effective duration", "C": "One-sided duration"}, "ans": "A", "en": "A. Key rate duration — Correct\nCorrect because the key rate durations reflect the sensitivity of the bond’s price to change in specific maturities on the benchmark yield curve. Thus, key rate durations help identify the ‘shaping risk’ for bonds—that is, the bond’s sensitivity to changes with the shape of the yield curve (e.g., steepening and flattening). In this case, the interest rate scenario is for a non-parallel shift in the yield curve with only the 2-year benchmark rate changing.\nB. Effective duration — Incorrect\nIncorrect because the effective duration indicates the sensitivity of the bond’s price to a parallel shift of the benchmark yield curve - normally calculated by averaging the changes resulting from shifting the benchmark yield curve up and down by the same amount and not change in one-specific maturity. Effective duration is less appropriate for measuring sensitivity to non-parallel shifts as in this case.\nC. One-sided duration — Incorrect\nIncorrect because one-sided duration is the effective duration when interest rates go up or down and are better at capturing the interest rate sensitivity of a callable or putable bond than the normal effective durations, as the upside is capped in the callable bond and down-side is capped in the putable bond. However, since the measure is based on effective duration, it is still based on a parallel shift in the yield curve and not non-parallel shift as per the case here.", "ko": "2년 benchmark 금리만 30bp 오르는 non-parallel shift → 특정 만기 금리 변화에 대한 민감도를 재는 key rate duration이 적절하다(shaping risk). effective duration과 one-sided duration은 모두 parallel shift를 가정한다.", "trap": "one-sided duration은 putable·callable에 유용하지만 여전히 parallel shift 기준.", "f": "", "why": {"B": "effective duration은 benchmark curve의 parallel shift 민감도.", "C": "one-sided duration도 parallel shift 기준이라 특정 만기 변화를 못 잡는다."}, "orig": "Mock 5 Session 2 Q4", "conf": false}, {"id": "mock5-Q49", "src": "정답", "module": "EQ", "tag": "forward P/E < trailing P/E 의미", "vig": 12, "stem": "Which of the following would best explain the difference between the two Xita P/E ratios in Albertson's previous report?", "opts": {"A": "Rising earnings", "B": "Negative expected growth", "C": "An estimated stock value below the current market price"}, "ans": "A", "en": "A. Rising earnings — Correct\nCorrect because for companies with rising earnings, the forward P/E will be smaller than the trailing P/E because the denominator in the forward P/E calculation will be larger. In the previous report, Xita had a forward P/E ratio of 14.9 and a trailing P/E ratio of 15.7, which is consistent with rising earnings at the company.\nB. Negative expected growth — Incorrect\nIncorrect because with the numerator (current stock price) being the same in both ratios, any difference between the trailing and forward P/E ratios must arise from differences in earnings per share. Any expected increase in earnings, even if positive growth was slower than forecast, will result in a forward P/E less than the trailing P/E.\nIf the earnings growth forecast was negative, the forward P/E would be greater, not smaller (as in the vignette), as the forward P/E denominator would be smaller than the trailing P/E denominator.\nC. An estimated stock value below the current market price — Incorrect\nIncorrect because the numerator (current stock price) is the same in both the trailing and forward P/E ratios.", "ko": "두 P/E의 분자(현재 주가)는 같다. forward P/E 14.9 < trailing P/E 15.7 → 분모(내년 예상 EPS)가 지난 EPS보다 크다 → 이익이 늘어날 것으로 예상(rising earnings).", "trap": "분자가 같아 주가 고평가·저평가 여부는 두 P/E 차이를 설명하지 못한다.", "f": "Forward P/E = P / E(다음 12개월), Trailing P/E = P / E(지난 12개월)", "why": {"B": "음의 성장이면 forward EPS가 작아 forward P/E가 더 커야 한다.", "C": "두 비율의 분자가 같은 현재 주가라 차이를 설명하지 못한다."}, "orig": "Mock 5 Session 2 Q5", "conf": false}, {"id": "mock5-Q50", "src": "정답", "module": "EQ", "tag": "normalized EPS — average ROE 방법", "vig": 12, "stem": "Xita's normalized EPS based on the average ROE method is closest to:", "opts": {"A": "$2.08.", "B": "$2.13.", "C": "$2.30."}, "ans": "C", "en": "A. $2.08. — Incorrect\nIncorrect because this is computed as the average EPS for Years 1 to 4:\n(3.19 + 2.21 + 0.37 + 2.56)/4 = $2.08\nB. $2.13. — Incorrect\nIncorrect because this is the average ROE for Years 1 to 4 (17.28%) multiplied by the average BVPS for Years 1 to 4 ($12.325, calculated as [10.90 + 12.50 + 12.60 + 13.30 ]/4):\n0.1728 × 12.325 = $2.13\nC. $2.30. — Correct\nCorrect because in the method of average return on equity normalized EPS is calculated as the average return on equity (ROE) from the most recent full cycle, multiplied by current book value per share.\nEach year's ROE is computed by dividing EPS by BVPS, giving ROE values, by year, of:\nYear 1: 3.19/10.90 = 29.3%\nYear 2: 2.21/12.50 =17.7%\nYear 3: 0.37/12.60 = 2.9%\nYear 4: 2.56/13.30 =19.2%\nThe average ROE for Years 1 to 4 is (29.3 + 17.7 + 2.9 + 19.2)]/4 = 17.28%. Multiplying this by the current BVPS ($13.30 in Year 4) results in normalized EPS of $2.30.", "ko": "연도별 ROE = EPS/BVPS: 3.19/10.90 = 29.3%, 2.21/12.50 = 17.7%, 0.37/12.60 = 2.9%, 2.56/13.30 = 19.2%. 평균 ROE = 17.28%. normalized EPS = 평균 ROE × 현재(최근) BVPS 13.30 = $2.30.", "trap": "평균 BVPS가 아니라 현재 BVPS를 곱한다. 평균 EPS 방법(2.08)과 구분.", "f": "Normalized EPS = 한 사이클 평균 ROE × 현재 BVPS", "why": {"A": "average EPS 방법(4년 평균 EPS).", "B": "평균 ROE × 평균 BVPS 12.325. 현재 BVPS를 써야 한다."}, "orig": "Mock 5 Session 2 Q6", "conf": false}, {"id": "mock5-Q51", "src": "정답", "module": "EQ", "tag": "EV/Sales 적합한 상황", "vig": 12, "stem": "Which of the following is the most appropriate metric for Albertson to use in valuing Garc?", "opts": {"A": "Dividend yield", "B": "Price to book ratio", "C": "Enterprise value to sales ratio"}, "ans": "C", "en": "A. Dividend yield — Incorrect\nIncorrect as dividend yield is only one component of total return; not using all information related to expected return is suboptimal. With growth opportunities arising in the industry, capital gains are likely to be an important source of future returns.\nIn addition, the investment required to capitalize on the growth opportunities may adversely affect Garc's ability to pay dividends in the future – especially because Garc's dividend payout ratio is the highest in the industry, which is attractive to many of its current investors. A useful metric in assessing the safety of the dividend is the payout ratio: A high payout relative to other companies operating in the same industry may indicate a less secure dividend because the dividend is less well covered by earnings.\nB. Price to book ratio — Incorrect\nIncorrect as a material portion of Garc's value arises from the value of its brand, which as an internally generated intangible asset is not shown on the balance sheet (and thus not reflected in book value per share).\nAssets in addition to those recognized in financial statements may be critical operating factors. For example, in many service companies, human capital—the value of skills and knowledge possessed by the workforce—is more important than physical capital as an operating factor, but it is not reflected as an asset on the balance sheet.\nIn addition, accounting effects on book value may compromise how useful book value is as a measure of the shareholders’ investment in the company. In general, intangible assets that are generated internally (as opposed to being acquired) are not shown as assets on a company’s balance sheet. For example, companies account for advertising and marketing as expenses, so the value of internally generated brands, which are created and maintained by advertising and marketing activities, do not appear as assets on a company’s balance sheet under IFRS or US GAAP.\nC. Enterprise value to sales ratio — Correct\nCorrect because the numerator of the EV/Sales ratio is the firm's total value of debt and equity. EV/S is an alternative sales-based ratio that is particularly useful when comparing companies with diverse capital structures, which applies to Garc's industry. Sales is an appropriate denominator as sales growth is consistent and not as variable as earnings. In addition, sales are generally less subject to distortion or manipulation than are other fundamentals, such as EPS or book value.", "ko": "Garc는 부채비율이 경쟁사보다 크게 높고(capital structure가 다름), 광고로 만든 brand가 핵심 자산이며(내부 창출 무형자산 → 장부에 없음), 성장 기회가 생긴 산업이다. EV/Sales는 분자가 부채+자본이라 capital structure 차이를 비교 가능하게 하고, 매출은 이익보다 안정적이고 조작이 어렵다.", "trap": "내부 창출 brand는 book value에 없어 P/B가 부적합. 배당 수익률은 성장기 capital gain을 무시.", "f": "", "why": {"A": "dividend yield는 total return의 일부만 반영. 성장 투자로 높은 배당이 지속되기 어려울 수 있다.", "B": "광고로 만든 brand(내부 창출 무형자산)는 장부에 없어 book value가 가치를 반영 못 한다."}, "orig": "Mock 5 Session 2 Q7", "conf": true}, {"id": "mock5-Q52", "src": "오답", "module": "EQ", "tag": "relative strength 지표", "vig": 12, "stem": "Garc's relative strength compared to the market index over the past year is closest to:", "opts": {"A": "1.0153.", "B": "1.0168.", "C": "1.0241."}, "ans": "A", "en": "A. 1.0153. — Correct\nCorrect because the relative strength measure of Garc against the market index is 1.0154.\nThe value of Garc divided by the index at the beginning of the period is 27.95 / 550.40 = 0.050781; the relative strength on that day is thus 0.050781 / 0.050781 = 1.0000.\nAt the end of the time frame, the value of Garc divided by the index is 31.05 / 602.21 = 0.051560. Thus, over the time frame the relative strength measure for Garc is 0.051560 / 0.050781 = 1.0153.\nDividends are not incorporated into the relative strength calculation because relative strength is based strictly on price movement. Also, the valuation indicators we call momentum indicators relate either price or a fundamental, such as earnings, to the time series of their own past values.\nA simple relative-strength indicator of the second type (i.e., the stock’s performance relative to the performance of some group of stocks) is the stock’s performance divided by the performance of an equity index. If the value of this ratio increases, the stock price increases relative to the index and displays positive relative strength.\nB. 1.0168. — Incorrect\nIncorrect because this is 1 plus the Garc price return of 11.09% (31.05 / 27.95 – 1) minus the market index price return of 9.41% (602.21 / 550.40 – 1):\n1 + 11.09% – 9.41% = 1.0168\nC. 1.0241. — Incorrect\nIncorrect because this is the total return including dividends:\nGarc total return = Price return + Dividend return = 31.05/27.95 + 1.24/27.95 = 1.155277\nIndex total return: Price return + Dividend return = (602.21/550.40) + 3.4% = 1.094131 + 0.034 = 1.128131\nReturn ratio: 1.155277 / 1.128131 = 1.0241", "ko": "relative strength = (주가 / 지수) 비율의 변화. 기초: 27.95/550.40 = 0.050781, 기말: 31.05/602.21 = 0.051560. RS = 0.051560/0.050781 = 1.0153. 가격만 쓰고 배당은 넣지 않는다. 같은 값: (31.05/27.95) / (602.21/550.40) = 1.1109/1.0941 = 1.0153.", "trap": "배당 포함 total return 비율이나 수익률 차이(1 + 11.09% − 9.41%)가 아니라 가격 비율의 비율.", "f": "RS = (P_end/Index_end) / (P_begin/Index_begin)", "why": {"B": "수익률을 빼서 1 + 11.09% − 9.41%로 계산. 나눠야 한다.", "C": "배당까지 포함한 total return 비율. relative strength는 가격만 쓴다."}, "orig": "Mock 5 Session 2 Q8", "conf": true, "my": "C"}, {"id": "mock5-Q53", "src": "정답", "module": "CI", "tag": "배당 증가와 agency conflict", "vig": 13, "stem": "The implementation of Edberg's recommendation regarding Alfa's dividend payout ratio would most likely:", "opts": {"A": "reduce management's ability to invest in negative NPV projects.", "B": "increase the agency conflict between Alfa's managers and shareholders.", "C": "reduce the agency conflict between Alfa's bondholders and shareholders."}, "ans": "A", "en": "A. reduce management's ability to invest in negative NPV projects. — Correct\nCorrect because increasing the dividend payout ratio (i.e., paying out a higher percentage of earnings as dividends) would constrain Alfa management's access to capital, and thus their ability to overinvest by taking on negative NPV projects. One managerial incentive of particular concern is the potential private benefit managers may obtain from investment in negative net present value (NPV) projects. Such projects will generate negative economic returns; but because they may grow the size of the company (measured in sales or assets) and thus enlarge the manager’s span of control, the manager may have the incentive to invest in them. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.\nB. increase the agency conflict between Alfa's managers and shareholders. — Incorrect\nIncorrect because increasing the dividend payout ratio would reduce, rather than increase, the agency conflict between managers and shareholders. As a mature company, paying out more dividends would dissuade managers from overinvesting in negative NPV projects.\nC. reduce the agency conflict between Alfa's bondholders and shareholders. — Incorrect\nIncorrect because increasing the dividend payout ratio would increase, not reduce, the agency conflict between Alfa's bondholders and shareholders. Another concern when a company is financed by debt as well as equity is that paying dividends can exacerbate the agency conflict between shareholders and bondholders. When a company has debt outstanding, the payment of dividends reduces the cash cushion available to the company for the disbursement of fixed required payments to bondholders.", "ko": "배당성향을 높이면 경영진이 쓸 수 있는 free cash flow가 줄어 회사 규모를 키우려고 음의 NPV 프로젝트에 과잉 투자하는 것을 막는다 → 경영진–주주 agency conflict 감소. 반면 배당은 채권자에게 돌아갈 현금 쿠션을 줄여 주주–채권자 conflict는 커진다.", "trap": "배당 ↑: 경영진–주주 갈등 ↓, 주주–채권자 갈등 ↑.", "f": "", "why": {"B": "배당 증가는 경영진–주주 갈등을 줄인다(과잉 투자 억제).", "C": "배당 증가는 채권자 현금 쿠션을 줄여 주주–채권자 갈등을 키운다."}, "orig": "Mock 5 Session 2 Q9", "conf": false}, {"id": "mock5-Q54", "src": "오답", "module": "CI", "tag": "target payout adjustment model", "vig": 13, "stem": "Using a target payout adjustment model, the expected increase in Minskar's dividend per share in Year 2 of the adjustment period is closest to:", "opts": {"A": "$0.10.", "B": "$0.15.", "C": "$0.18."}, "ans": "A", "en": "A. $0.10. — Correct\nCorrect because the expected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor. The expected dividend increases for Minskar are as follows:\nIn Year 1: ($1.30 × 0.75 − $0.25) × 0.25 = $0.18125 (for a Year 1 dividend of $0.43125)\nIn Year 2: ($1.10 × 0.75 − $0.43125) × 0.25 = $0.0984375 ≈ $0.10\nB. $0.15. — Incorrect\nIncorrect because the calculation uses a 100% target payout ratio instead of 75%, as follows:\nIn Year 1: ($1.30 × 1.00 − $0.25) × 0.25 = $0.2625 (for a Year 1 dividend of $0.5125)\nIn Year 2: ($1.10 × 1.00 − $0.5125) × 0.25 = $0.146875 ≈ $0.15\nC. $0.18. — Incorrect\nIncorrect because this is the expected Year 1 increase, as follows:\nIn Year 1: ($1.30 × 0.75 − $0.25) × 0.25 = $0.18125 ≈ $0.18", "ko": "기대 배당 증가 = (기대 EPS × target payout − 직전 배당) × 조정 계수(1/4년 = 0.25). Year 1: (1.30 × 0.75 − 0.25) × 0.25 = 0.18125 → Year 1 배당 0.43125. Year 2: (1.10 × 0.75 − 0.43125) × 0.25 = (0.825 − 0.43125) × 0.25 = 0.0984 ≈ $0.10.", "trap": "Year 2 계산의 직전 배당은 원래 0.25가 아니라 Year 1 배당 0.43125.", "f": "ΔD = (EPS × target payout − D_prev) × (1/조정 기간)", "why": {"B": "target payout 75% 대신 100% 사용.", "C": "Year 1 증가분."}, "orig": "Mock 5 Session 2 Q10", "conf": true, "my": "B"}, {"id": "mock5-Q55", "src": "정답", "module": "CI", "tag": "차입 자사주 매입 후 EPS", "vig": 13, "stem": "If the proposed share repurchase is implemented immediately, Edberg's revised EPS forecast for Alfa for the next year would be closest to:", "opts": {"A": "$1.36.", "B": "$1.53.", "C": "$1.69."}, "ans": "B", "en": "A. $1.36. — Incorrect\nIncorrect because this calculation does not adjust for the new share count in the EPS calculation:\n($3,400,500 − $318,750) / 2,267,000 shares\n= $3,081,750 / 2,267,000 shares\n≈ $1.36\nB. $1.53. — Correct\nCorrect because EPS after the share repurchase is calculated as follows:\nEarnings = EPS x Number of shares = $1.50 x 2,267,000 = $3,400,500\nFunds needed to repurchase shares = $30 x 250,000 = $7,500,000\nCost of funds to repurchase shares = 4.25% x $7,500,000 = $318,750\nNumber of shares after repurchase = 2,267,000 − 250,000 = 2,017,000\nUsing the above information, we have:\nEPS after buyback = (Earnings − After-tax cost of funds) / Shares outstanding after buyback\n= [$3,400,500 − ($7,500,000 × 0.0425)] / 2,017,000 shares\n= ($3,400,500 − $318,750) / 2,017,000 shares\n= $3,081,750 / 2,017,000 shares\n≈ $1.53\nC. $1.69. — Incorrect\nIncorrect because this answer choice does not consider the cost of borrowing in the EPS calculation:\n($3,400,500 − $0) / 2,017,000 shares\n= $3,400,500 / 2,017,000 shares\n≈ $1.69", "ko": "이익 = 1.50 × 2,267,000 = $3,400,500. 매입 금액 = 250,000 × $30 = $7,500,000, after-tax 차입 비용 = 7.5m × 4.25% = $318,750. 매입 후 주식 수 = 2,017,000. EPS = (3,400,500 − 318,750)/2,017,000 = $1.53. (earnings yield 1.5/30 = 5% > after-tax 차입 비용 4.25%라 EPS 상승.)", "trap": "분자에서 이자를 빼고 분모에서 주식 수를 줄이는 것 둘 다 해야 한다.", "f": "EPS 후 = (이익 − after-tax 이자) / (주식 수 − 매입 주식 수)", "why": {"A": "이자는 뺐지만 주식 수를 줄이지 않음.", "C": "차입 이자 비용을 빼지 않음."}, "orig": "Mock 5 Session 2 Q11", "conf": false}, {"id": "mock5-Q56", "src": "정답", "module": "CI", "tag": "CEO duality — governance 우려", "vig": 13, "stem": "Which of the following characteristics of Alfa's board is most likely to pose the greatest potential governance concern?", "opts": {"A": "Roles of the CEO", "B": "Number and type of committees", "C": "Number of independent directors"}, "ans": "A", "en": "A. Roles of the CEO — Correct\nCorrect because Alfa's CEO also serves as board chair, which is not a characteristic of effective corporate governance.\nGenerally, when evaluating board structure, investors consider whether the organization and structure of the board provide sufficient oversight, representation, and accountability to shareholders. A related topic is 'CEO duality,' whereby the chief executive officer (CEO) also serves as chairperson of the board. CEO duality may raise concerns that the monitoring and oversight role of the board may be compromised relative to independent chairperson and CEO roles. When the chairperson is not independent or the role is combined, a company may appoint a lead independent director to help protect investor interests.\nB. Number and type of committees — Incorrect\nIncorrect because Alfa has a comprehensive set of board committees. The number of board committees and how the committees operate are relevant considerations in an investor’s analysis of governance. Committees vary by corporation and industry but generally include audit, governance, remuneration (or compensation), nomination, and risk and compliance committees.\nC. Number of independent directors — Incorrect\nIncorrect because 7 of the 13 directors (54%) on Alfa's board are independent. The independence of the directors is a relevant consideration for investors. The absence or presence of a minority of independent directors is a negative aspect of corporate governance. Without independent directors, the potential exists for management to act in a self-serving manner. Consequently, a lack of independent directors on a board may increase investors’ perception of the corporation’s risk.", "ko": "Alfa의 CEO가 이사회 의장을 겸직한다(CEO duality) → 이사회의 감독 기능이 약해질 수 있어 가장 큰 governance 우려. 위원회는 audit·compensation·nomination·risk·governance로 충분하고, 독립이사도 13명 중 7명(과반)이다.", "trap": "독립이사가 과반이면 문제 아님. 겸직은 lead independent director로 보완하기도 한다.", "f": "", "why": {"B": "필요한 위원회를 모두 갖추고 있다.", "C": "독립이사 7/13 = 54%로 과반."}, "orig": "Mock 5 Session 2 Q12", "conf": true}, {"id": "mock5-Q57", "src": "정답", "module": "PM", "tag": "parametric VaR (일간)", "vig": 14, "stem": "In Nicola's current analysis, the 5% daily parametric VaR for the Lagunas Fund is closest to:", "opts": {"A": "$1.52 million.", "B": "$2.54 million.", "C": "$2.66 million."}, "ans": "B", "en": "A. $1.52 million. — Incorrect\nIncorrect because this calculation uses a critical value of 1 instead of 1.65 (or, effectively omits the critical value).\nStep 1: Multiply the portfolio standard deviation by 1.00: 0.00901249 × 1.00 = 0.00901249\nStep 2: Subtract the answer obtained in Step 1 from the expected return: 0.000352 − 0.00901249 = −0.00866049\nStep 3: Because VaR is expressed as an absolute number (despite representing an expected loss), change the sign of the value obtained in Step 2 to 0.00866049\nStep 4: Multiply the result from Step 3 by the value of the portfolio: $175,000,000 × 0.00866049 = $1,515,586 ≈ $1.52 million.\nB. $2.54 million. — Correct\nCorrect because the 5% daily parametric VaR is calculated as follows:\nFirst, convert the portfolio annual return and standard deviation to daily figures: Portfolio return = 0.0880/250 = 0.000352\nPortfolio standard deviation = 0.1425/√(250) = 0.00901249\nThe following step-by-step procedure shows how VaR is derived:\nStep 1: Multiply the portfolio standard deviation by 1.65: 0.00901249 × 1.65 = 0.01487061\nStep 2: Subtract the answer obtained in Step 1 from the expected return: 0.000352 − 0.01487061 = −0.01451861\nStep 3: Because VaR is expressed as an absolute number (despite representing an expected loss), change the sign of the value obtained in Step 2 to 0.01451861\nStep 4: Multiply the result from Step 3 by the value of the portfolio: $175,000,000 × 0.01451861 = $2,540,757 ≈ $2.54 million.\nC. $2.66 million. — Incorrect\nIncorrect because the calculation adds, rather than subtracts, the product of the critical value and the standard deviation.\nStep 1: Multiply the portfolio standard deviation by 1.65: 0.00901249 × 1.65 = 0.01487061\nStep 2: (Incorrect) Add the answer obtained in Step 1 to the expected return: 0.000352 + 0.01487061 = 0.01522261\nStep 3: Because VaR is expressed as an absolute number (despite representing an expected loss), change the sign of the value obtained in Step 2 to 0.01522261\nStep 4: Multiply the result from Step 3 by the value of the portfolio: $175,000,000 × 0.01522261 = $2,663,957 ≈ $2.66 million.", "ko": "일간 기대수익 = 8.80%/250 = 0.000352, 일간 표준편차 = 14.25%/√250 = 0.009012. 5% VaR 수익률 = 0.000352 − 1.65 × 0.009012 = −0.014519. VaR = $175m × 0.014519 = $2.54m.", "trap": "z × σ를 기대수익에서 '빼야' 한다. 더하면 2.66m.", "f": "VaR = [E(R) − z × σ] × 포트폴리오 가치 (절댓값), 일간 σ = 연 σ/√250", "why": {"A": "z = 1.65 대신 1을 사용.", "C": "z × σ를 기대수익에 더함."}, "orig": "Mock 5 Session 2 Q13", "conf": false}, {"id": "mock5-Q58", "src": "정답", "module": "PM", "tag": "historical VaR 최근 변동성 반영", "vig": 14, "stem": "Given Nicola's volatility expectation, the most appropriate revision when supplementing her analysis with an annual 5% VAR would be to:", "opts": {"A": "use a wider confidence interval.", "B": "assume a normal distribution of returns.", "C": "increase the weight of more recent observations."}, "ans": "C", "en": "A. use a wider confidence interval. — Incorrect\nIncorrect because using a wider confidence interval would increase the confidence level (e.g., from 95% to 99%) and produce a larger VaR estimate, but would not directly incorporate Nicola's volatility view.\nB. assume a normal distribution of returns. — Incorrect\nIncorrect because, although the historical simulation approach is not constrained by an assumption of normality, assuming a normal distribution in this case would not incorporate Nicola's expectation of recent higher volatility persisting into the future.\nC. increase the weight of more recent observations. — Correct\nCorrect because both the parametric and historical simulation methods in their most basic forms have the limitation that, as with most samples, all observations are weighted equally. The historical simulation method can adjust for this problem, however, by using a weighting methodology that gives more weight to more recent observations and less weight to more distant observations.", "ko": "historical simulation은 기본적으로 모든 과거 관측치에 같은 비중을 준다. 최근의 높은 변동성이 계속될 것으로 보면 최근 관측치에 더 큰 비중을 주는 weighting을 쓰면 된다.", "trap": "신뢰수준을 바꾸거나 정규분포를 가정해도 변동성 전망은 반영되지 않는다.", "f": "", "why": {"A": "신뢰수준을 높이면 VaR는 커지지만 최근 변동성 전망을 직접 반영하지 않는다.", "B": "정규분포 가정은 최근 변동성 증가를 반영하지 못한다."}, "orig": "Mock 5 Session 2 Q14", "conf": false}, {"id": "mock5-Q59", "src": "정답", "module": "PM", "tag": "포지션 변경의 VaR 영향 — incremental VaR", "vig": 14, "stem": "Which of the following would best capture the effect on the Lagunas Fund's VaR of the proposed reduction in the ABC stock position?", "opts": {"A": "Relative VaR", "B": "Conditional VaR", "C": "Incremental VaR"}, "ans": "C", "en": "A. Relative VaR — Incorrect\nIncorrect because relative VaR is a measure of the degree to which the performance of a given investment portfolio might deviate from its benchmark. It does not capture how portfolio VaR will change if a position size is changed relative to the remaining positions.\nB. Conditional VaR — Incorrect\nIncorrect because conditional VaR is the average loss conditional on exceeding VaR cutoff. It does not capture how portfolio VaR will change if a position size is changed relative to the remaining positions.\nC. Incremental VaR — Correct\nCorrect because incremental VaR measures how the portfolio VaR will change if a position size is changed relative to the remaining positions suppose the portfolio manager is contemplating increasing the risk by increasing the investment in SPY to 90% of the portfolio. We recalculate the VaR under the proposed allocation, and the incremental VaR is the difference between the 'before' and 'after' VaR. The potential 3% change in the ABC stock position is exactly the type of change incremental VaR is intended to measure.", "ko": "ABC 비중을 3% 줄일 때 포트폴리오 VaR가 얼마나 변하는지 = 변경 전후 VaR 차이 = incremental VaR. relative VaR는 벤치마크 대비 이탈, conditional VaR(CVaR)는 VaR를 넘는 손실의 평균.", "trap": "marginal VaR는 아주 작은 변화의 민감도, incremental은 특정 크기 변경의 전후 차이.", "f": "Incremental VaR = VaR(변경 후) − VaR(변경 전)", "why": {"A": "relative VaR는 벤치마크 대비 성과 이탈 정도.", "B": "conditional VaR는 VaR를 초과할 때의 평균 손실."}, "orig": "Mock 5 Session 2 Q15", "conf": true}, {"id": "mock5-Q60", "src": "정답", "module": "PM", "tag": "backtest — skewness·kurtosis 판단", "vig": 14, "stem": "Based on the backtest results, the multifactor equity strategy that best achieves the investment objective is:", "opts": {"A": "Strategy A.", "B": "Strategy B.", "C": "Strategy C."}, "ans": "C", "en": "A. Strategy A. — Incorrect\nIncorrect because Strategy A has similar returns and volatility to those of Strategy C, but has a lower probability of positive returns (lower positive skewness) and is more fat-tailed (higher kurtosis, which can lead to extreme negative surprises).\nB. Strategy B. — Incorrect\nIncorrect because Strategy B has similar returns and volatility to those of Strategy C, but has a lower probability of positive returns (negative skewness) and is more fat-tailed (higher kurtosis, which can lead to extreme negative surprises).\nC. Strategy C. — Correct\nCorrect because the backtest results for Strategy C best meet the objective to achieve market returns with potential for upside, while managing volatility and extreme downside risk. Strategy C has similar returns and volatility to those of Strategy A and Strategy B, but has a higher probability of positive returns (higher positive skewness) and is less fat-tailed (lower kurtosis).", "ko": "목표: 시장 수익 + upside, 변동성·극단적 하락 위험 관리. 세 전략의 평균·표준편차는 비슷하다. Strategy C는 양의 skewness가 가장 크고(0.65, upside) kurtosis가 가장 낮다(4.20, fat tail 적음) → 목표에 가장 맞는다.", "trap": "평균·표준편차가 비슷하면 skewness는 클수록(양), kurtosis는 낮을수록 좋다.", "f": "", "why": {"A": "kurtosis 8.70으로 fat tail이 가장 크다.", "B": "skewness가 음수(−0.25)라 하락 꼬리가 길다."}, "orig": "Mock 5 Session 2 Q16", "conf": false}, {"id": "mock5-Q61", "src": "정답", "module": "ECO", "tag": "cross rate 삼각 arbitrage", "vig": 15, "stem": "Based on the dealer's JPY/EUR quote, is there an arbitrage opportunity for the hedge fund?", "opts": {"A": "No", "B": "Yes, by purchasing EUR in the interbank market and selling EUR to the dealer", "C": "Yes, by purchasing EUR from the dealer and selling EUR in the interbank market"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because there is an arbitrage opportunity by buying EUR from the dealer and selling in the interbank market.\nB. Yes, by purchasing EUR in the interbank market and selling EUR to the dealer — Incorrect\nIncorrect because the arbitrage opportunity is the opposite of this transaction, as explained in the response rationale for the correct answer. The fund should buy EUR from the dealer and sell it in the interbank market.\nC. Yes, by purchasing EUR from the dealer and selling EUR in the interbank market — Correct\nCorrect because the dealer's quote of JPY/EUR 119.38/119.40 leads to arbitrage as follows:\nIn the interbank market we have the following rates from Exhibit 1:\n\tBid\tOffer\n1. USD/EUR\t1.1416\t1.1421\n2. JPY/USD\t104.62\t104.68\n3. Implied JPY/EUR (1 × 2)\t119.4342\t119.5550\n4. DEALER (info in vignette)\t119.38\t119.40\nTherefore, the hedge fund can buy EUR from the dealer at JPY119.40 (row 4) and then effectively sell EUR in the interbank market for 119.43 (from row 3).", "ko": "interbank implied JPY/EUR = (USD/EUR) × (JPY/USD). bid = 1.1416 × 104.62 = 119.434, offer = 1.1421 × 104.68 = 119.555. dealer 호가 119.38/119.40. dealer에게서 EUR를 offer 119.40에 사고, interbank에서 implied bid 119.434에 팔면 EUR당 약 0.03 JPY 이익.", "trap": "싼 곳(dealer offer 119.40)에서 사고 비싼 곳(interbank bid 119.43)에서 판다.", "f": "Implied bid = bid × bid, Implied offer = offer × offer", "why": {"A": "dealer offer 119.40 < interbank implied bid 119.434이라 arbitrage가 있다.", "B": "방향이 반대. interbank에서 사려면 119.555, dealer bid는 119.38이라 손해."}, "orig": "Mock 5 Session 2 Q17", "conf": false}, {"id": "mock5-Q62", "src": "정답", "module": "ECO", "tag": "covered interest rate parity forward", "vig": 15, "stem": "Based on covered interest rate parity, the 6-month forward USD/NZD exchange rate is closest to:", "opts": {"A": "0.6774.", "B": "0.6791.", "C": "0.6825."}, "ans": "B", "en": "A. 0.6774. — Incorrect\nIncorrect because the annual interest rates are used rather than the correct 6-month interest rates as follows (where S0 is the spot exchange rate expressed as USD/NZD)\nF(USD/NZD) = S0 × (1+rUS)/(1+rNZD) = 0.6808 × (1.005)/(1+0.01) = 0.6774\nB. 0.6791. — Correct\nCorrect because the 6-month forward rate is calculated using the correct formula and interest rates for the covered interest rate parity forward rate (S0 is the current spot exchange rate which is equal to 0.6808).\nFf/d = Sf/d × [1 + if(actual/360)]/[1 + id(Actual/360)]\nF(USD/NZD) = S0 × (1+rUS/2)/(1+rNZD/2) = 0.6808 × (1 + 0.005/2)/(1+0.01/2) = 0.6791\nC. 0.6825. — Incorrect\nIncorrect because the ratio of interest rates is inverted as follows:\nF(USD/NZD) = S0 × (1+rNZD/2)/(1+rUS/2) = 0.6808 × (1 + 0.01/2)/(1+0.005/2) = 0.6825", "ko": "F(USD/NZD) = S × (1 + i_USD × 6/12)/(1 + i_NZD × 6/12) = 0.6808 × 1.0025/1.005 = 0.6791. price currency(USD) 금리가 분자, base currency(NZD) 금리가 분모. NZD 금리가 더 높아 NZD는 forward discount.", "trap": "연 금리를 6개월로 조정해야 하고, 분자·분모를 뒤집지 않는다.", "f": "F_{f/d} = S_{f/d} × (1 + i_f × t)/(1 + i_d × t)  (f = price currency)", "why": {"A": "연 금리를 그대로 사용(6개월 조정 안 함).", "C": "금리 비율을 뒤집음(NZD 금리를 분자로)."}, "orig": "Mock 5 Session 2 Q18", "conf": false}, {"id": "mock5-Q63", "src": "정답", "module": "ECO", "tag": "carry trade all-in 수익", "vig": 15, "stem": "The all-in return for the carry trade, measured in USD terms, is closest to:", "opts": {"A": "7.27%.", "B": "8.27%.", "C": "8.75%."}, "ans": "A", "en": "A. 7.27%. — Correct\nCorrect because it considers both the return from the BRL investment and then also deducts the cost of borrowing USD. We can see this as follows for borrowing a hypothetical USD1,000 as follows:\nBorrow $1,000 at 1% for 1 year, end of year value $1,010\nConvert to BRL at 5.130; this becomes BRL 5,130\nInvest BRL 5,130 at the Brazilian rate of 9.75% for 1 year.\nThe investment in (3) becomes BRL 5,130 × 1.0975 = BRL 5,630.175\nConvert at the t=1 year exchange rate of BRL 5.200 which gives USD 1,082.72596\nPay back the borrowing from (1): USD 1,010.00\nNet return in USD is the difference between (5) and (6) or USD 72.72596\nExpressed in percentage USD term the amount in (7) is 0.072725 or 7.27%\nB. 8.27%. — Incorrect\nIncorrect because it is the rate earned on the carry trade that does not include the cost of borrowing USD. This is seen as follows for borrowing a hypothetical USD1,000:\nBorrow $1,000 at 1% for 1 year, end of year value $1,010\nConvert to BRL at 5.130; this becomes BRL 5,130\nInvest BRL 5,130 at the Brazilian rate of 9.75% for 1 year.\nThe investment in (3) becomes BRL 5,130 × 1.0975 = BRL 5,630.175\nConvert at the t=1 year exchange rate of BRL 5.200 which gives USD 1,082.72596\nIncorrect net return, deduct $1,000 original cost USD 82.7256\nAs a percentage of original USD borrowed: 8.27%\nC. 8.75%. — Incorrect\nIncorrect because it is the interest rate differential between BRL and USD (i.e., 9.75% and 1.00%).", "ko": "USD 1,000 차입(1년 후 1,010 상환) → 5.13 BRL/USD로 BRL 5,130 → 9.75%로 BRL 5,630.175 → 1년 후 5.20으로 USD 1,082.73 → 1,010 상환 → 이익 72.73 = 7.27%. 근사: 9.75% − 1.00% − BRL 절하율(5.20/5.13 − 1 = 1.36%) ≈ 7.39%, 정확히는 7.27%.", "trap": "차입 비용(1%)을 빼고, BRL 절하로 인한 환손실도 반영.", "f": "All-in return = (1 + i_BRL) × S0/S1 − (1 + i_USD)", "why": {"B": "USD 차입 비용(이자 1%)을 빼지 않음.", "C": "단순 금리 차이 9.75% − 1.00%. 환율 변화 무시."}, "orig": "Mock 5 Session 2 Q19", "conf": false}, {"id": "mock5-Q64", "src": "정답", "module": "ECO", "tag": "통화 위기 경고 신호", "vig": 15, "stem": "Which of the following conditions would most likely be a warning sign of a currency crisis in Country B?", "opts": {"A": "Condition 1", "B": "Condition 2", "C": "Condition 3"}, "ans": "C", "en": "A. Condition 1 — Incorrect\nIncorrect because it is typically large inflows of foreign capital that precede a crisis. In the vignette it is stated that Country B has experienced a slight decline in the allocation by foreign investors.\nB. Condition 2 — Incorrect\nIncorrect because studies have shown that broad money growth and the ratio of M2 (a measure of money supply) to bank reserves tend to rise prior to a currency crisis. Bernard notes that these indicators have declined.\nC. Condition 3 — Correct\nCorrect because foreign exchange reserves tend to decline precipitously as a crisis approaches. In the vignette, Bernard notes that this is indeed the situation for Country B.", "ko": "통화 위기 전에는 외환 보유액이 급감한다 → Condition 3(외환 보유액/일평균 FX 거래량 비율의 큰 하락)이 경고 신호. 위기 전에는 외국 자본이 대규모로 유입되고, broad money 증가율과 M2/은행 지급준비금 비율이 상승한다.", "trap": "위기 전: 외국 자본 유입 ↑, M2/reserves ↑, 외환 보유액 ↓.", "f": "", "why": {"A": "위기 전에는 외국 자본이 크게 유입된다. 소폭 감소는 경고 신호가 아니다.", "B": "위기 전에는 M2/은행 reserves 비율이 상승한다. 하락은 경고 신호가 아니다."}, "orig": "Mock 5 Session 2 Q20", "conf": true}, {"id": "mock5-Q65", "src": "오답", "module": "FSA", "tag": "NSFR 상승 원인", "vig": 16, "stem": "An increase in which of the following would best explain the trend in Sigmar's net stable funding ratio?", "opts": {"A": "Loans to customers", "B": "Long-term debt liabilities", "C": "High-quality liquid assets"}, "ans": "B", "en": "A. Loans to customers — Incorrect\nIncorrect because an increase in loans to customers (a component of the bank's asset base) would be consistent with a decrease, not an increase, in the NSFR.\nB. Long-term debt liabilities — Correct\nCorrect because the Net Stable Funding Ratio (NSFR) is expressed as the minimum percentage of a bank’s required stable funding that must be sourced from available stable funding. For this ratio, required stable funding (the denominator) is a function of the composition and maturity of a bank’s asset base, whereas available stable funding (the numerator) is a function of the composition and maturity of a bank’s funding sources (i.e., capital and deposits and other liabilities). The NSFR has steadily increased over the past three years. Accordingly, an increase in long-term debt liabilities (a funding source) would be consistent with an increase in the NSFR.\nC. High-quality liquid assets — Incorrect\nIncorrect because highly liquid assets do not enter the calculation of the Net Stable Funding Ratio.", "ko": "NSFR = available stable funding(분자: 자본·예금·장기 부채 등 자금 조달원) / required stable funding(분모: 자산 구성과 만기). 장기 부채가 늘면 분자(안정적 자금)가 늘어 NSFR 상승. 고객 대출이 늘면 분모가 커져 NSFR 하락.", "trap": "HQLA는 LCR(liquidity coverage ratio)의 분자. NSFR와 혼동 금지.", "f": "NSFR = Available stable funding / Required stable funding", "why": {"A": "고객 대출(자산)이 늘면 required stable funding이 늘어 NSFR이 하락.", "C": "high-quality liquid assets는 LCR 구성 요소이고 이 문제의 NSFR 계산에는 들어가지 않는다."}, "orig": "Mock 5 Session 2 Q21", "conf": true, "my": "A"}, {"id": "mock5-Q66", "src": "정답", "module": "FSA", "tag": "US GAAP 주식보상 excess tax benefit", "vig": 16, "stem": "The difference in share price between the grant date and the settlement date for the large restricted stock grant will most likely:", "opts": {"A": "decrease income tax expense.", "B": "have no effect on income tax expense.", "C": "increase income tax expense."}, "ans": "A", "en": "A. decrease income tax expense. — Correct\nCorrect because a higher share price at settlement versus the grant date results in a higher tax deduction than the cumulative stock-based compensation expense. This is known as an excess tax benefit or tax windfall because taxable income and tax expense are reduced.\nB. have no effect on income tax expense. — Incorrect\nIncorrect because Sigmar follows US GAAP, so a difference in share price between the settlement date and the grant date will cause income tax expense to increase or decrease.\nC. increase income tax expense. — Incorrect\nIncorrect because a lower (not higher) share price at settlement versus at the grant date results in a lower tax deduction than the cumulative stock-based compensation expense.", "ko": "US GAAP에서 settlement일 주가 > grant일 주가 → 세법상 공제액(settlement 가치 기준)이 회계상 누적 보상비용(grant 가치 기준)보다 크다 → excess tax benefit(tax windfall)으로 income tax expense 감소.", "trap": "주가가 오르면 세금비용 ↓, 내리면 ↑ (US GAAP은 손익계산서에 반영).", "f": "", "why": {"B": "US GAAP에서는 차이가 income tax expense에 반영된다.", "C": "settlement 주가가 grant보다 낮을 때 세금비용이 늘어난다."}, "orig": "Mock 5 Session 2 Q22", "conf": false}, {"id": "mock5-Q67", "src": "정답", "module": "FSA", "tag": "US GAAP 연금 비용 (손익계산서)", "vig": 16, "stem": "The total pension expense (in $ millions) reported on Sigmar's income statement for the most recent year is:", "opts": {"A": "410.", "B": "515.", "C": "535."}, "ans": "A", "en": "A. 410. — Correct\nCorrect because there is no amortization of past service costs or actuarial gains and losses, hence the total pension expense (in $ millions) is computed as: Current service cost + Interest cost – Expected return on plan assets = 535 + 2,875 – 3,000 = 410.\nB. 515. — Incorrect\nIncorrect because this answer uses the actual (instead of expected) return on plan assets, hence the total pension expense (in $ millions) is incorrectly computed as: 535 + 2,875 – 2,895 = 515.\nC. 535. — Incorrect\nIncorrect because this answer is the current service cost, and it ignores the interest cost and expected return on plan assets. The current service cost would be recognized in operating expense, but would not be the only pension expense reported on Sigmar's income statement for the most recent year.", "ko": "US GAAP 손익계산서 연금 비용 = current service cost + interest cost − expected return on plan assets + 상각 항목(여기선 없음) = 535 + 2,875 − 3,000 = $410m. actual return이 아니라 expected return을 쓴다.", "trap": "US GAAP은 expected return, actual과의 차이는 OCI.", "f": "Pension expense (US GAAP) = service cost + interest cost − expected return ± 상각", "why": {"B": "expected 대신 actual return 2,895 사용.", "C": "service cost만 반영."}, "orig": "Mock 5 Session 2 Q23", "conf": true}, {"id": "mock5-Q68", "src": "오답", "module": "FSA", "tag": "보험사 combined ratio", "vig": 16, "stem": "Which insurer's underwriting operation is the most efficient overall?", "opts": {"A": "Insurer A", "B": "Insurer B", "C": "Insurer C"}, "ans": "C", "en": "A. Insurer A — Incorrect\nIncorrect because Insurer A has the highest combined ratio (60.2% + 42.3% = 102.5%) compared to Insurer B (66.4% + 30.8% = 97.2%) and Insurer C (63.1% + 32.5% = 95.6%), thus it does not have the most efficient underwriting operation overall.\nB. Insurer B — Incorrect\nIncorrect because Insurer B has a higher combined ratio (66.4% + 30.8% = 97.2%) than Insurer C (63.1% + 32.5% = 95.6%), thus it does not have the most efficient underwriting operation overall.\nC. Insurer C — Correct\nCorrect because Insurer C has the lowest combined ratio (63.1% + 32.5% = 95.6%) compared to Insurer A (60.2% + 42.3% = 102.5%) and Insurer B (66.4% + 30.8% = 97.2%). Combined ratio = Loss and loss adjustment expense ratio + Underwriting expense ratio. This ratio indicates the overall efficiency of an underwriting operation. A combined ratio of less than 100% is considered efficient.", "ko": "underwriting 효율 = combined ratio = loss & LAE ratio + underwriting expense ratio, 낮을수록 효율적. A = 60.2 + 42.3 = 102.5%, B = 66.4 + 30.8 = 97.2%, C = 63.1 + 32.5 = 95.6% → Insurer C가 가장 효율적.", "trap": "한 비율만 보지 말고 두 비율의 합을 비교. 100% 미만이면 underwriting 이익.", "f": "Combined ratio = Loss & LAE ratio + Underwriting expense ratio", "why": {"A": "loss ratio는 가장 낮지만 combined ratio 102.5%로 가장 높다.", "B": "expense ratio는 가장 낮지만 combined ratio 97.2% > C의 95.6%."}, "orig": "Mock 5 Session 2 Q24", "conf": false, "my": "B"}, {"id": "mock5-Q69", "src": "정답", "modu

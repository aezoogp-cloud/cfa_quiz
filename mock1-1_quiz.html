<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 1 Session 1 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
</style>
</head>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock1-1", "title": "Mock 1 Session 1"}, "questions": [{"id": "mock1-1-Q1", "src": "정답", "module": "ECO", "tag": "통화 선도 MTM: 반대매매 가격·할인", "vig": 0, "stem": "The mark-to-market value (in USD) of the USD/AUD forward position is closest to:", "opts": {"A": "1,436,982.", "B": "1,440,000.", "C": "1,446,961."}, "ans": "A", "en": "A. 1,436,982. — Correct\nCorrect because it is the solution to (USD 1,440,000)/[1 + (0.28%)(0.750)], the net cash inflow discounted by the 9-month US market reference rate (MRR).\nMarking Client A’s forward position to market involves calculating the payoff of the forward transaction that offsets the original (hedging) transaction, then netting its cashflow at settlement against the original forward contract’s cashflow to determine the net cashflow, which is then present-valued using the client’s domestic MRR.\nThe offsetting transaction involves buying AUD 50 million nine months forward as the original transaction involved selling AUD forward to hedge a long AUD exposure. Because AUD is the base currency in the USD/AUD quote, buying AUD forward means paying the offer for both the spot rate and the forward points. Thus, the all-in 9-month forward rate used in the offsetting trade is 0.7234 + 0.0008 = 0.7242. At settlement, the client will receive (AUD 50,000,000)(0.7530 USD/AUD) = USD 37,650,000 from the original contract. The client will pay (AUD 50,000,000)(0.7242 USD/AUD) = USD 36,210,000 in the offsetting transaction, resulting in a net cash inflow of USD 37,650,000 − USD 36,210,000 = USD 1,440,000. This is an inflow because the original transaction involved selling AUD forward and the AUD then depreciated against the USD. The mark-to-market value of the original position is USD 1,440,000 discounted at 1 plus the US MRR of 0.28% multiplied by 0.75 (= 270/360) based on nine months to settlement and the standard 360 day-count convention.\nIn summary, (USD 1,440,000)/[1 + (0.28%)(0.750)] = (USD 1,440,000)/(1.0021) = USD 1,436,982.\nB. 1,440,000. — Incorrect\nIncorrect because it is the undiscounted net cash inflow.\n50,000,000 × (0.753 – 0.7234) = 1,440,000\nC. 1,446,961. — Incorrect\nIncorrect because it is based on the bid quotes rather than the offer quotes in Exhibit 1. Using bids, the all-in forward price is 0.7233 + 0.0007 = 0.7240, the offsetting transaction using this incorrect rate is (AUD 50,000,000)(0.7240 USD/AUD) = USD 36,200,000, resulting in a net cash inflow of USD 37,650,000 − USD 36,200,000 = USD 1,450,000 which, in present value terms, is (USD 1,450,000)/[1 + (0.28%)(0.750)] = USD 1,446,961.", "ko": "AUD를 선도 매도했으므로 반대매매는 AUD 9개월 선도 매수다. AUD가 base 통화라 매수는 offer 쪽: 0.7234 + 0.0008 = 0.7242. 만기 순현금 = 50,000,000 × (0.7530 − 0.7242) = USD 1,440,000. 이를 US MRR 0.28% × 270/360로 할인하면 1,436,982.", "trap": "만기 현금흐름을 그대로 쓰면(할인 누락) B, bid를 쓰면 C.", "f": "MTM = (원래 선도가 − 반대매매 all-in 선도가) × 명목 / (1 + 국내 MRR × 잔존일/360)", "why": {"B": "만기 순현금흐름을 현재가치로 할인하지 않은 값입니다.", "C": "반대매매(AUD 매수)인데 bid 호가를 썼습니다. 매수는 offer."}, "orig": "Mock 1 Session 1 Q1", "conf": false}, {"id": "mock1-1-Q2", "src": "정답", "module": "ECO", "tag": "Mundell-Fleming: 자본이동성별 통화 영향", "vig": 0, "stem": "Based on the Mundell-Fleming model, which country is most likely to experience appreciation of its domestic currency in the short term?", "opts": {"A": "Country A", "B": "Country B", "C": "Country C"}, "ans": "C", "en": "A. Country A — Incorrect\nIncorrect because with floating exchange rates and high capital mobility, a domestic currency will appreciate given a restrictive domestic monetary policy and/or an expansionary fiscal policy. Similarly, a domestic currency will depreciate given an expansionary domestic monetary policy and/or a restrictive fiscal policy. In this explanatory table C↓ means the currency depreciates.\nCharacteristic\tCountry A\nCross-border capital mobility\tHigh\nMonetary policy\tExpansionary ⇒ C↓\nFiscal policy\tRestrictive ⇒ C↓\nNet effect:\t⇒C↓\nB. Country B — Incorrect\nIncorrect because with low capital mobility the effect of an expansionary monetary policy combined with a restrictive fiscal policy is indeterminate. With low capital mobility, an expansionary monetary policy increases spending and imports, increasing trade deficits, and is bearish for the exchange rate. A restrictive fiscal policy would tend to have the opposite effect on spending, trade deficit, and the exchange rate, so the overall effect is indeterminate.\nCharacteristic\tCountry B\nCross-border capital mobility\tLow\nMonetary policy\tExpansionary ⇒ C ↓\nFiscal policy\tRestrictive ⇒ C↑\nNet effect:\t⇒C effect indeterminate\nC. Country C — Correct\nCorrect because given low capital mobility, restrictive monetary and fiscal policies in a country lead to appreciation of the country's domestic currency. When capital mobility is low, the combination of restrictive monetary and fiscal policy will be bullish for a currency.\nCharacteristic\tCountry C\nCross-border capital mobility\tLow\nMonetary policy\tRestrictive ⇒ C↑\nFiscal policy\tRestrictive ⇒ C↑\nNet effect:\t⇒C↑", "ko": "자본이동성이 낮으면 무역수지 경로가 중요하다. 긴축 통화정책과 긴축 재정정책 모두 지출·수입을 줄여 경상수지를 개선하므로 통화 절상. Country C(낮은 이동성, 둘 다 긴축)가 정답.", "trap": "자본이동성이 높은지 낮은지에 따라 재정정책의 방향이 반대로 작동한다.", "f": "자본이동성 높음: 긴축 통화·확장 재정 → 절상 / 낮음: 긴축 통화·긴축 재정 → 절상", "why": {"A": "자본이동성이 높으면 확장 통화(↓)와 긴축 재정(↓) 모두 절하 요인입니다.", "B": "자본이동성이 낮을 때 확장 통화(↓)와 긴축 재정(↑)이 상충해 방향이 불확실합니다."}, "orig": "Mock 1 Session 1 Q2", "conf": false}, {"id": "mock1-1-Q3", "src": "정답", "module": "ECO", "tag": "캐리 트레이드 all-in 수익률", "vig": 0, "stem": "The expected all-in return of Kuspa's carry trade strategy (in AUD terms) is closest to:", "opts": {"A": "0.10%.", "B": "0.19%.", "C": "0.22%."}, "ans": "A", "en": "A. 0.10%. — Correct\nCorrect because it is the solution to [(AUD 1)(0.7235 USD/AUD)(1.0031)/0.7243 USD/AUD – AUD 1.0009 = 0.0010 or 0.10%.\nAt a spot rate of 0.7235 USD/AUD, 1 AUD (borrowed at 0.09%) buys USD 0.7235. The one-year future value of USD 0.7235, at the US MRR of 0.31%, is (USD 0.7235) × (1.0031) = USD 0.7257.\nThe reciprocal of Kuspa’s predicted value of 0.7243 USD/AUD = 1.3806 AUD/USD is used to convert USD 0.7257 back into AUD at the end of one year. The calculation is (USD 0.7257)(1.3806 AUD/USD) = AUD 1.0019.\nThe 1 AUD borrowed amounts to AUD 1.0009 at the end of the year and must be paid back. The all-in return therefore amounts to AUD 1.0019 – AUD 1.0009 = AUD 0.0010, or an all-return of 0.10%.\nNote: If full precision (no rounding to four decimal places in FX quotes) is used in calculations, the result is 0.11% but the choice 0.10% remains the correct answer.\nB. 0.19%. — Incorrect\nIncorrect because the 0.09% cost of borrowing AUD, the funding currency, needs to be subtracted from 0.19%.\nC. 0.22%. — Incorrect\nIncorrect because it is the MRR interest rate differential, 0.31% – 0.09% = 0.22%, and does not incorporate exchange rates into the computation of the all-in return.", "ko": "AUD 1을 0.09%로 빌려 USD 0.7235로 바꾸고 US MRR 0.31%로 운용: 0.7235 × 1.0031 = USD 0.7257. 1년 뒤 예상 환율 0.7243으로 되돌리면 AUD 1.0019. 갚을 돈 AUD 1.0009를 빼면 0.0010 = 0.10%.", "trap": "금리차(0.22%)만 보거나 조달 비용을 빼지 않으면 틀린다. 환율 변화까지 넣은 all-in 수익률이다.", "f": "수익 = 1 × S0 × (1 + i_투자) / S1 − (1 + i_조달)", "why": {"B": "조달 통화(AUD) 차입비용 0.09%를 빼지 않았습니다.", "C": "금리차(0.31% − 0.09%)일 뿐 환율 변화를 반영하지 않았습니다."}, "orig": "Mock 1 Session 1 Q3", "conf": true}, {"id": "mock1-1-Q4", "src": "정답", "module": "ECO", "tag": "신흥국 자본유입 위험: 자산가격·외채·외환보유고", "vig": 0, "stem": "Based on Kuspa's risk analysis, which emerging market country is least exposed to the potential negative effects of the foreign capital inflows?", "opts": {"A": "Country D", "B": "Country E", "C": "Country F"}, "ans": "B", "en": "A. Country D — Incorrect\nIncorrect because compared to Country E (1) Country D's higher asset price growth (20% 5-year compound growth rate versus 7% for Country E) means Country D is more likely to enter or be in an asset bubble related to foreign capital chasing high returns; and (2) Country D's level of external debt as a % of GDP is twice as large as Country E's, indicating a greater risk of the potential bad effects of running large current account deficits (e.g., deteriorating terms of trade may be associated with currency crises).\nB. Country E — Correct\nCorrect because (1) Country E's moderate asset price growth (7% compound growth vs. 20% for Country D and 19% for Country E) means Country E is less likely to be part of an asset price bubble related to foreign capital chasing high returns; (2) its level of external debt is half that of Country D and one-fifth that of Country F. External debt as % of GDP is related to current account deficits (If a country runs a large and persistent current account deficit over time, eventually it will experience an untenable rise in debt owed to foreign investors). This is relevant because:\nCurrent account deficits relate directly to the \"terms of trade\" (= exports/imports) currency crisis warning sign # 7. Country D and Country F are more likely to raise this alarm.\nExternal debt has been associated with currency crises (for example, Iceland's Currency Crisis of 2008); and (3) Foreign exchange reserves at 30% of average daily FX turnover of the domestic currency are slightly larger than for EM D and equal to that of Country F. For emerging markets, with smaller FX trading volume, intervention in FX markets can be an effective tool to influence exchange rates. A strong position means that currency intervention is an alternative tool to capital controls for managing the potential risks of foreign capital inflows. This tool is less available for Country D than for Country E and Country F.\nIn summary, Country E is superior to Country D on all three factors and superior to Country F on the first two factors and equal on factor 3.\nC. Country F — Incorrect\nIncorrect because its 19% compound asset price growth and 300% ratio of external debt to GDP are factors increasing the likelihood that Country F may impose capital controls compared to Country E, while its level of foreign exchange reserves (matching Country E's) gives Country F no preference over Country E.", "ko": "자본유입의 부작용(자산 거품, 외채 누적, 자본통제 가능성)이 가장 작은 나라를 고른다. Country E는 자산가격 상승률이 낮고(7%), 외채/GDP가 가장 낮으며(60%), 외환보유고도 가장 높은 수준(30%)이라 세 기준 모두 가장 안전하다.", "trap": "수익률이 높은 나라가 매력적이라고 착각하기 쉽지만, 여기서는 '부작용에 덜 노출된' 나라를 묻는다.", "f": "", "why": {"A": "자산가격 상승률 20%로 거품 위험이 크고 외채/GDP가 E의 두 배이며 외환보유고도 가장 적습니다.", "C": "자산가격 상승률 19%, 외채/GDP 300%로 위험이 크고 외환보유고는 E와 같아 우위가 없습니다."}, "orig": "Mock 1 Session 1 Q4", "conf": true}, {"id": "mock1-1-Q5", "src": "정답", "module": "EQ", "tag": "비상장사 이익 정상화 조정", "vig": 1, "stem": "The required adjustments to normalize Lytham's earnings will result in:", "opts": {"A": "a reduction in reported operating income.", "B": "no change in reported operating income.", "C": "an increase in reported operating income."}, "ans": "B", "en": "A. a reduction in reported operating income. — Incorrect\nIncorrect because there should be no change to Lytham's reported operating income after the adjustments.\nB. no change in reported operating income. — Correct\nCorrect because ongoing distortions requiring adjustment often result from revenues or expenses which may be considered related-party transactions.\nThe first item relates to a below-market CEO salary, and income should be adjusted by increasing selling, general, and administrative (SG&A) expenses by $400,000 (= $1,000,000 – $600,000) to reflect the expected salary expense under professional management at a market rate of compensation. This has the effect of decreasing operating income by $400,000 because it is an operating expense.\nThe second item related to the apartment available for the personal use of the CEO requires adjustments that reflect its sale should the company become public. SG&A expenses should be reduced by $200,000 for the operating expense, thus increasing operating income by the same amount. Annual depreciation expense should also be reduced by $200,000, given that the sold asset no longer incurs depreciation. The total impact for the apartment is an increase in operating income of $400,000.\nThe third item related to dividends paid to owners should have no effect on operating income because dividends paid are not a component of operating income.\nThe net impact to operating income is an increase of $400,000 for the CEO salary and a decrease of $400,000 for the apartment, resulting in no change to reported operating income after the adjustments.\nC. an increase in reported operating income. — Incorrect\nIncorrect because there should be no change to Lytham's reported operating income after the adjustments.", "ko": "(1) 시장보다 낮은 CEO 급여 → SG&A를 $400,000 늘림(영업이익 −400,000). (2) CEO 개인용 아파트는 상장 시 매각 가정 → 관련 SG&A $200,000와 감가상각 $200,000 제거(영업이익 +400,000). (3) 배당은 영업이익과 무관. 합계 영향 0.", "trap": "배당 지급을 비용으로 착각해 조정하면 안 된다. 각 조정의 부호를 따로 계산해 합친다.", "f": "", "why": {"A": "CEO 급여 조정(−)만 보고 아파트 관련 조정(+)을 빠뜨린 결론입니다.", "C": "아파트 조정(+)만 보고 CEO 급여 조정(−)을 빠뜨린 결론입니다."}, "orig": "Mock 1 Session 1 Q5", "conf": true}, {"id": "mock1-1-Q6", "src": "정답", "module": "EQ", "tag": "Expanded CAPM", "vig": 1, "stem": "The required return on equity for Lytham using the expanded CAPM is closest to:", "opts": {"A": "14.0%.", "B": "15.2%.", "C": "16.4%."}, "ans": "B", "en": "A. 14.0%. — Incorrect\nIncorrect because the calculation of the expanded CAPM omits beta:\nre = 6.0% + 4.0% + 3.0% + 1.0%\n= 14.0%\nB. 15.2%. — Correct\nCorrect because the calculation properly uses the expanded CAPM.\nre = rf + Beta × Equity risk premium + Small-cap risk premium + Company-specific risk premium\n= 6.0% + (1.30 × 4.0%) + 3.0% + 1.0%\n= 6.0% + 5.2% + 3.0% + 1.0%\n= 15.2%\nC. 16.4%. — Incorrect\nIncorrect because the calculation of the expanded CAPM applies beta to the small-cap risk premium and the company-specific risk premium, in addition to the equity risk premium:\nre = 6.0% + 1.30 × (4.0% + 3.0% + 1.0%)\n= 6.0% + 10.4%\n= 16.4%", "ko": "베타는 시장 ERP에만 곱한다. 6.0% + 1.30 × 4.0% + 3.0% + 1.0% = 15.2%.", "trap": "베타를 빼먹거나(A) 모든 프리미엄에 곱하면(C) 틀린다.", "f": "re = rf + β × ERP + 소형주 프리미엄 + 기업고유 프리미엄", "why": {"A": "ERP에 베타를 곱하지 않았습니다.", "C": "소형주·기업고유 프리미엄에도 베타를 곱했습니다."}, "orig": "Mock 1 Session 1 Q6", "conf": false}, {"id": "mock1-1-Q7", "src": "오답", "module": "EQ", "tag": "지배권 할인 → 지배권 프리미엄 변환 + DLOM", "vig": 1, "stem": "After applying the appropriate discounts or premiums, the value of Calcyte's equity (in $ millions) to the private buyout client should be closest to:", "opts": {"A": "8,898.", "B": "9,395.", "C": "11,744."}, "ans": "B", "en": "A. 8,898. — Incorrect\nIncorrect because the control premium is not adjusted when calculating the estimated equity value.\nValue of equity to the client after adjusting for control premium and DLOM\n= Equity value × (1 + Control premium) × (1 – DLOM)\n= $9,043 million × (1 + 0.23) × (1 – 0.20)\n≈ $8,898 million\nB. 9,395. — Correct\nCorrect because the market equity value needs to be adjusted to add a control premium. Also, since the valuation is being conducted from the perspective of a private buyer, a discount for lack of marketability is appropriate since the firm will not be publicly traded.\nThe discount for lack of marketability (DLOM) is given as 20%, but the discount for lack of control of 23% needs to be converted to a control premium. The conversion is:\nDiscount for lack of control = 1 – [1/(1 + Control premium)]\n1/(1 + Control premium) = 1 – Discount for lack of control\n(1 + Control premium) = 1/(1 – Discount for lack of control)\nControl premium = [1/(1 – Discount for lack of control)] – 1\nControl premium = [1/(1 – 0.23)] – 1\nControl premium ≈ 0.2987 or 29.87%\nValue of equity to the client after adjusting for control premium and DLOM\n= Equity value × (1 + Control premium) × (1 – DLOM)\n= $9,043 million × (1 + 0.2987) × (1 – 0.2000)\n≈ $9,395 million\nC. 11,744. — Incorrect\nIncorrect because the discount for lack of marketability is not applied when calculating the estimated equity value.\nValue of equity to the client after adjusting for control premium\n= Equity value × (1 + Control premium)\n= $9,043 million × (1 + 0.2987)\n≈ $11,744 million", "ko": "상장 시장가치(소수지분 기준)를 비상장 지배지분 매수자 관점으로 바꾸는 문제. DLOC 23%를 프리미엄으로 바꾸면 1/(1 − 0.23) − 1 = 29.87%. 매수 후 비상장이므로 DLOM 20%도 적용: 9,043 × 1.2987 × 0.80 ≈ 9,395.", "trap": "할인율 23%를 그대로 프리미엄으로 쓰면 A(8,898). DLOC와 control premium은 숫자가 다르다.", "f": "Control premium = 1 / (1 − DLOC) − 1 / 가치 = 시장가치 × (1 + CP) × (1 − DLOM)", "why": {"A": "할인율 23%를 프리미엄으로 그대로 썼습니다. 1/(1 − 0.23) − 1 = 29.87%로 바꿔야 합니다.", "C": "비상장이 되므로 적용해야 할 DLOM 20%를 빠뜨렸습니다."}, "orig": "Mock 1 Session 1 Q7", "conf": true}, {"id": "mock1-1-Q8", "src": "정답", "module": "EQ", "tag": "Guideline public company: 사업부 가중 EV/Sales", "vig": 1, "stem": "Using the guideline public company method, Ramabo's EV (in $ millions) is closest to:", "opts": {"A": "28.3.", "B": "31.3.", "C": "33.0."}, "ans": "A", "en": "A. 28.3. — Correct\nCorrect because Ramabo's EV using the guideline public company method is properly calculated as follows:\nEV = Revenue × Composite EV/Sales\nRevenue is given in the case as $10 million, but the composite EV/Sales multiple based on the revenue generated by each segment needs to be calculated first:\nComposite EV/Sales = (6/10) × 3.3 + (3/10) × 1.2 + (1/10) × 4.9\n= 1.98 + 0.36 + 0.49\n= 2.83\nEV = $10 million × 2.83\n= $28.3 million\nB. 31.3. — Incorrect\nIncorrect because Ramabo's EV is calculated using the guideline public company method and a simple average composite EV/Sales multiple as follows:\nEV = Revenue × Composite EV/Sales\nRevenue is given in the case as $10 million, and the composite EV/Sales multiple is calculated as:\nComposite EV/Sales = (3.3 + 1.2 + 4.9)/3\n= 9.4/3\n≈ 3.1333\nEV = $10 million × 3.1333\n≈ $31.3 million\nC. 33.0. — Incorrect\nIncorrect because Ramabo's EV is calculated using the guideline public company method and the EV/Sales multiple of the largest segment (Segment A) as follows:\nEV = Revenue × EV/Sales\n= $10 million × 3.3\n= $33.0 million", "ko": "사업부 매출 비중으로 가중평균: 0.6 × 3.3 + 0.3 × 1.2 + 0.1 × 4.9 = 2.83. EV = 10 × 2.83 = $28.3m.", "trap": "단순평균(B)이나 최대 사업부 배수(C)를 쓰지 않는다.", "f": "복합 배수 = Σ(사업부 매출 비중 × 사업부 배수)", "why": {"B": "세 배수를 단순평균했습니다. 매출 비중으로 가중해야 합니다.", "C": "가장 큰 사업부(A)의 배수만 썼습니다."}, "orig": "Mock 1 Session 1 Q8", "conf": false}, {"id": "mock1-1-Q9", "src": "오답", "module": "FSA", "tag": "지분법: 초과매입가 상각 반영 장부가", "vig": 2, "stem": "The estimated carrying value for RMRL's investment in Begonia at the end of the current year should be:", "opts": {"A": "$12,342,500.", "B": "$12,450,000.", "C": "$13,392,500."}, "ans": "A", "en": "A. $12,342,500. — Correct\nCorrect because RMRL has significant influence over Begonia and should account for Begonia as an investment in associate using the equity method. The excess purchase price must be allocated and then amortized periodically. The investor must directly record these adjustment effects by reducing the carrying amount of the investment on its balance sheet and by reducing the investee's profit recognized on its income statement. There are 12 months of amortization that must be recognized in the current year.\nThe annual amortization of excess purchase price attributable to plant and equipment = 0.5 × $2,150,000/10 = $1,075,000/10 = $107,500. Note that land is not amortized.\nThe estimated carrying value of the investment in Begonia at the end of the current year is:\n= Purchase price + RMRL's share of Begonia's net income –\nAnnual amortization of the excess purchase price of plant and equipment\n= $12,000,000 + (30% × $1,500,000) – $107,500\n= $12,342,500.\nB. $12,450,000. — Incorrect\nIncorrect because this calculation does not account for the annual amortization of the excess purchase price attributable to Begonia's plant and equipment:\n= $12,000,00 + (30% × $1,500,000)\n= $12,450,000\nC. $13,392,500. — Incorrect\nIncorrect because this calculation includes 100% of Begonia's net income instead of RMRL's 30% share of Begonia's net income:\n= $12,000,000 + $1,500,000 – $107,500\n= $13,392,500", "ko": "유의적 영향력 → 지분법. 초과매입가 중 설비 몫(지분 50% × $2,150,000 = $1,075,000)을 10년 상각: 연 $107,500 (토지는 상각 안 함). 장부가 = 12,000,000 + 30% × 1,500,000 − 107,500 = $12,342,500.", "trap": "투자회사 몫(30%)만 반영해야 한다. 피투자회사 순이익 100%를 더하면 C.", "f": "기말 장부가 = 취득가 + 지분율 × 순이익 − 배당 × 지분율 − 초과매입가 상각", "why": {"B": "초과매입가 중 설비 몫의 연간 상각액($107,500)을 빼지 않았습니다.", "C": "피투자회사 순이익 100%를 더했습니다. 지분율 30%만 반영해야 합니다."}, "orig": "Mock 1 Session 1 Q9", "conf": false}, {"id": "mock1-1-Q10", "src": "정답", "module": "FSA", "tag": "부분 vs 전부 영업권: 자본·BVPS", "vig": 2, "stem": "Compared to Method 2, RMRL's consolidated book value per share under Method 1 would be:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "A", "en": "A. lower. — Correct\nCorrect because the full goodwill method (Method 2) will result in higher stockholder's equity than the partial goodwill method (Method 1). Since the total number of shares outstanding is the same in either method, the book value per share is higher using the full goodwill method (Method 2).\nThe difference between the two methods is the carrying value of the non-controlling interest in stockholders' equity. This is higher under the full goodwill method (Method 2) than under the partial goodwill method (Method 1).\nB. the same. — Incorrect\nIncorrect because the carrying value of the non-controlling interest, and thus total equity and book value per share, is different between the partial goodwill method (Method 1) and the full goodwill method (Method 2).\nC. higher. — Incorrect\nIncorrect because the full goodwill method (Method 2) will result in higher stockholders' equity than the partial goodwill method (Method 1). Thus, the book value per share is higher, rather than lower, using the full goodwill method (Method 2).", "ko": "전부 영업권(Method 2)은 비지배지분을 공정가치로 측정해 영업권과 자본이 더 크다. 주식 수는 같으므로 부분 영업권(Method 1)의 BVPS가 더 낮다.", "trap": "두 방법의 차이는 비지배지분 장부가뿐이다. 순이익은 같아도 자본은 다르다.", "f": "", "why": {"B": "비지배지분 장부가가 달라 자본 총계와 BVPS도 다릅니다.", "C": "방향이 반대입니다. 전부 영업권 쪽 자본이 더 큽니다."}, "orig": "Mock 1 Session 1 Q10", "conf": false}, {"id": "mock1-1-Q11", "src": "정답", "module": "FSA", "tag": "발생액 비율 해석(절댓값)", "vig": 2, "stem": "With respect to RMRL's accruals ratios, Ahmad should conclude that", "opts": {"A": "both the balance-sheet-based accruals ratio and the cash-flow-based accruals ratio have improved.", "B": "the balance-sheet-based accruals ratio has deteriorated, but the cash-flow-based accruals ratio has improved.", "C": "the balance-sheet-based accruals ratio has improved, but the cash-flow-based accruals ratio has deteriorated."}, "ans": "B", "en": "A. both the balance-sheet-based accruals ratio and the cash-flow-based accruals ratio have improved. — Incorrect\nIncorrect because the absolute value of the balance-sheet-based accruals ratio increased, reflecting a deterioration in the ratio.\nB. the balance-sheet-based accruals ratio has deteriorated, but the cash-flow-based accruals ratio has improved. — Correct\nCorrect because the absolute value of the balance-sheet-based accruals ratio increased, whereas the absolute value of the cash-flow-based accruals ratio decreased. This means that the balance-sheet-based accruals ratio has deteriorated, and the cash-flow-based accruals ratio has improved. Both ratios are measures of financial reporting quality.\nC. the balance-sheet-based accruals ratio has improved, but the cash-flow-based accruals ratio has deteriorated. — Incorrect\nIncorrect because the absolute value of the balance-sheet-based accruals ratio increased, whereas the absolute value of the cash-flow-based accruals ratio decreased. Thus, the balance-sheet-based accruals ratio has deteriorated, while the cash-flow-based accruals ratio has improved.", "ko": "발생액 비율은 절댓값이 클수록 이익의 질이 나쁘다. 재무상태표 기준 비율의 절댓값은 커졌고(악화), 현금흐름 기준 비율의 절댓값은 작아졌다(개선).", "trap": "부호가 아니라 절댓값의 크기로 판단한다.", "f": "", "why": {"A": "재무상태표 기준 비율의 절댓값이 커졌으므로 악화입니다.", "C": "두 비율의 개선·악화 방향을 거꾸로 봤습니다."}, "orig": "Mock 1 Session 1 Q11", "conf": true}, {"id": "mock1-1-Q12", "src": "정답", "module": "FSA", "tag": "Beneish M-score·Altman Z-score 해석", "vig": 2, "stem": "Based on the trends in the Beneish M-scores and Altman Z-scores, Ahmad should conclude that:", "opts": {"A": "both the probability of earnings manipulation and the probability of bankruptcy have decreased.", "B": "the probability of earnings manipulation has decreased and the probability of bankruptcy has increased.", "C": "the probability of earnings manipulation has increased and the probability of bankruptcy has decreased."}, "ans": "B", "en": "A. both the probability of earnings manipulation and the probability of bankruptcy have decreased. — Incorrect\nIncorrect because, although both scores have decreased, the probability of bankruptcy has increased since the Z-score is now lower.\nB. the probability of earnings manipulation has decreased and the probability of bankruptcy has increased. — Correct\nCorrect because a lower Beneish M-score indicates a lower likelihood of earnings manipulation and the interpretation of the Z-score is that a higher Z-score is better. The Z-score has decreased in the most recent year compared to the prior year, accordingly the probability of bankruptcy has increased. As for the M-score, it has also decreased from the prior year to the most recent year, therefore the probability of earnings manipulation has decreased. Higher M-scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation.\nC. the probability of earnings manipulation has increased and the probability of bankruptcy has decreased. — Incorrect\nIncorrect because the probability of earnings manipulation has decreased since the M-score has become more negative. The Z-score has decreased, indicating that the probability of bankruptcy has increased.", "ko": "M-score는 낮을수록(더 음수일수록) 이익 조작 가능성이 낮다 → 조작 가능성 감소. Z-score는 높을수록 안전하다 → Z가 내려갔으므로 파산 가능성 증가.", "trap": "두 점수 모두 '내려갔다'고 같은 방향으로 해석하면 틀린다. M은 낮을수록 좋고 Z는 높을수록 좋다.", "f": "", "why": {"A": "Z-score가 낮아졌으므로 파산 가능성은 오히려 커졌습니다.", "C": "M-score가 더 음수가 되어 조작 가능성은 줄었고, Z-score 하락은 파산 가능성 증가입니다."}, "orig": "Mock 1 Session 1 Q12", "conf": false}, {"id": "mock1-1-Q13", "src": "정답", "module": "FI", "tag": "내재 선도이자율 f(1,2)", "vig": 3, "stem": "For Country 1, the forward rate for a 2-year zero-coupon bond issued in one year is closest to:", "opts": {"A": "6.5%.", "B": "10.6%.", "C": "14.3%."}, "ans": "B", "en": "A. 6.5%. — Incorrect\nIncorrect because it is the geometric average of z2 = 5% and z3 = 8% which are the zero rates for year 2 and year 3. That is (1.05)(1.08)^0.50 – 1 = 6.48% or 6.5%.\nB. 10.6%. — Correct\nCorrect because the 2-year forward rate (f1,2) is calculated as follows:\n(1 + z3)^3 = (1+ z1)^1(1 + f1,2)^2, where zi is the zero rate for maturity i.\n(1.08)^3 = (1.03)^1(1 + f1,2)^2\n(1 + f1,2)^2 = 1.2230\nf1,2 = (1.2230)^0.5 – 1 = 0.1059 or 10.6%.\nC. 14.3%. — Incorrect\nIncorrect because it is the 1-year forward rate beginning in year 2 as follows:\n(1 + z3)^3 = (1+ z2)^2(1 + f2,1)^1\n1.08^3 = 1.05^2(1 + f2,1)^1\n(1 + f2,1)^1 = 1.14259\nf2,1 = 0.14259 or 14.3%.", "ko": "1년 후 시작하는 2년짜리 선도금리: (1.08)^3 = (1.03)(1 + f)^2 → (1 + f)^2 = 1.2230 → f = 10.6%.", "trap": "z2와 z3의 기하평균(A)이나 2년 후 1년 선도(C)와 헷갈리지 않는다. 시작 시점과 기간을 먼저 확인.", "f": "(1 + z3)^3 = (1 + z1)(1 + f1,2)^2", "why": {"A": "z2·z3의 기하평균일 뿐 선도금리가 아닙니다.", "C": "2년 후 시작하는 1년 선도금리 f(2,1)입니다."}, "orig": "Mock 1 Session 1 Q13", "conf": true}, {"id": "mock1-1-Q14", "src": "오답", "module": "FI", "tag": "기간구조 이론: 선도금리 상향 편의 → 유동성 선호", "vig": 3, "stem": "Which of the following term structure theories of interest rates is most consistent with Smith's beliefs?", "opts": {"A": "Preferred habitat", "B": "Liquidity preference", "C": "Unbiased expectations"}, "ans": "B", "en": "A. Preferred habitat — Incorrect\nIncorrect because preferred habit is a theory where lenders/borrowers will deviate from their strong preferences for certain segments of the yield curve to earn additional returns (if large enough). In this theory it is expectations and institutional factors that influence the shape of the yield curve. In the vignette, Smith states that forward rates are upwardly biased predictors of future spot rates. This statement does not describe the preferred habitat model.\nB. Liquidity preference — Correct\nCorrect because Smith's belief is that forward rates are an upwardly biased predictor of future spot rates. With an upward sloping yield curve it would be liquidity premiums that could explain this shape.\nC. Unbiased expectations — Incorrect\nIncorrect because unbiased expectations implies that expected rates will rise with an upward sloping yield curve. Smith's belief is that forward rates are upwardly biased.", "ko": "Smith는 선도금리가 미래 현물금리의 '상향 편의(upwardly biased)' 예측치라고 본다. 선도금리에 유동성(기간) 프리미엄이 붙어 있다는 뜻이므로 유동성 선호 이론.", "trap": "'편의 없음'이면 순수 기대이론, '선호 구간 이탈'이면 선호서식지. 키워드로 구분한다.", "f": "", "why": {"A": "선호서식지는 투자자가 프리미엄을 받으면 선호 만기를 벗어난다는 이론으로, 상향 편의 자체를 설명하지 않습니다.", "C": "순수 기대이론은 선도금리가 미래 현물금리의 편의 없는 예측치라고 봅니다. Smith 생각과 반대."}, "orig": "Mock 1 Session 1 Q14", "conf": false}, {"id": "mock1-1-Q15", "src": "정답", "module": "FI", "tag": "Key rate duration으로 가격 변화", "vig": 3, "stem": "Based on Smith's expected change in Country 2's interest rates, the percentage change in the value of Client A's portfolio is closest to:", "opts": {"A": "–1.88%.", "B": "–1.69%.", "C": "–0.44%."}, "ans": "C", "en": "A. –1.88%. — Incorrect\nIncorrect because it uses the average of the change in yields times the overall effective duration as follows:\nAverage change in yields is: (1% + 0.75% – 0.25%)/3 = 0.50%.\n%ΔValue Portfolio = –Effective Duration × 0.50%, where effective duration is 3.75.\n%ΔValue Portfolio = –3.75 × 0.50% = –1.875%.\nB. –1.69%. — Incorrect\nIncorrect because it treats the last change (i.e., change in z10) as a positive value as follows:\n%ΔValue Portfolio = –0.50 × 1% – 0.75 × 0.75% – 2.50 × 0.25% = –1.6875%\n≈ –1.69%.\nC. –0.44%. — Correct\nCorrect because the percentage change is computed using the three key rate durations as follows (where zi is the zero yield maturity i). Key rates for 1, 3 and 10-years are:\n0.50, 0.75 and 2.50. The change in zero yields for 1, 3 and 10-years are:\n1%, 0.75%, and –0.25%.\n%ΔValue Portfolio = –KeyDur1× Δz1 – KeyDur3× Δz3 – KeyDur10× Δz10\n%ΔValue Portfolio = –0.50 × 1% – 0.75 × 0.75% – 2.50 × –0.25% = –0.4375%\n≈ –0.44%.", "ko": "−(0.50 × 1.00% + 0.75 × 0.75% + 2.50 × (−0.25%)) = −(0.50 + 0.5625 − 0.625)% = −0.4375% ≈ −0.44%.", "trap": "10년 금리 하락(−0.25%)의 부호를 놓치면 B. 평균 변화 × 전체 듀레이션(A)은 비평행 이동에 맞지 않는다.", "f": "%ΔP ≈ −Σ KeyDur_k × Δz_k", "why": {"A": "평균 금리 변화에 전체 듀레이션을 곱했습니다. 비평행 이동은 key rate별로 계산합니다.", "B": "10년 금리 변화(−0.25%)를 +로 처리했습니다."}, "orig": "Mock 1 Session 1 Q15", "conf": false}, {"id": "mock1-1-Q16", "src": "정답", "module": "FI", "tag": "스왑 스프레드 확대 → 경기 침체 신호", "vig": 3, "stem": "Country 2's government bond yields and swap rates best support a conclusion that the economy is experiencing:", "opts": {"A": "a recession.", "B": "no change.", "C": "an expansion."}, "ans": "A", "en": "A. a recession. — Correct\nCorrect because the swap spread (swap rate – government bond rate) gives us an idea of the credit and liquidity risk in Country 2. This spread typically has greater values during recessions and lower values during expansions. From Exhibit 3 we have the following showing that the spread is getting larger relative to its value 12 months ago:\n1 month ago: 8.28 – 7.48 = 0.80\n6 months ago: 8.86 – 8.51 = 0.35\n12 months ago: 8.84 – 8.55 = 0.29.\nB. no change. — Incorrect\nIncorrect because there is a trend in the swap spread that suggests a change in economic activity.\nC. an expansion. — Incorrect\nIncorrect because the swap spread (swap rate – government bond rate) gives us an idea of the credit and liquidity risk in Country 2 and this spread typically has greater values during recessions/contractions and lower values during expansions. From Exhibit 3 we have the following showing that the spread is getting larger relative to its value 12 months ago:\n1 month ago: 8.28 – 7.48 = 0.80\n6 months ago: 8.86 – 8.51 = 0.35\n12 months ago: 8.84 – 8.55 = 0.29.", "ko": "스왑 스프레드(스왑금리 − 국채금리)는 신용·유동성 위험을 나타내며 침체기에 커진다. 12개월 전 대비 스프레드가 커지고 있으므로 침체 쪽.", "trap": "금리 수준이 아니라 스프레드의 추세를 본다.", "f": "", "why": {"B": "스프레드가 뚜렷하게 커지는 추세가 있습니다.", "C": "확장기에는 스프레드가 줄어듭니다. 지금은 커지는 중."}, "orig": "Mock 1 Session 1 Q16", "conf": false}, {"id": "mock1-1-Q17", "src": "정답", "module": "PM", "tag": "VaR 해석: 최소 손실", "vig": 4, "stem": "Which of the following statements is correct regarding Ryan's current stock portfolio?", "opts": {"A": "There is a 5% chance of losing $10.6 million over one month", "B": "The maximum monthly loss will be $10.6 million with 5% probability", "C": "Monthly losses of at least $10.6 million are expected 5% of the time"}, "ans": "C", "en": "A. There is a 5% chance of losing $10.6 million over one month — Incorrect\nIncorrect because VaR does not give the likelihood of losing a specific amount. Instead, value at risk is the minimum loss that would be expected a certain percentage of the time over a certain period of time given the assumed market conditions. In this case, the monthly 5% VaR is $10.6 million, so $10.6 million would be the minimum expected loss over one month 5% of the time.\nB. The maximum monthly loss will be $10.6 million with 5% probability — Incorrect\nIncorrect because value at risk is the minimum loss that would be expected a certain percentage of the time over a certain period of time given the assumed market conditions. In this case, the monthly 5% VaR is $10.6 million, so $10.6 million would be the minimum, not maximum, expected loss over one month 5% of the time.\nC. Monthly losses of at least $10.6 million are expected 5% of the time — Correct\nCorrect because value at risk is the minimum loss that would be expected a certain percentage of the time over a certain period of time given the assumed market conditions. In this case, the monthly 5% VaR is $10.6 million, so a monthly loss of at least that amount would be expected to occur 5% of the time.", "ko": "5% 월간 VaR $10.6m = 한 달 동안 5%의 확률로 '최소' $10.6m 이상 손실이 난다는 뜻.", "trap": "VaR은 최대 손실이 아니라 꼬리 구간의 최소 손실이다.", "f": "", "why": {"A": "VaR은 특정 금액을 잃을 확률이 아니라, 그 이상 손실이 날 확률을 말합니다.", "B": "VaR은 최대 손실이 아니라 최소 손실입니다."}, "orig": "Mock 1 Session 1 Q17", "conf": false}, {"id": "mock1-1-Q18", "src": "정답", "module": "PM", "tag": "모수적 VaR 계산", "vig": 4, "stem": "Using the parametric method, the daily 5% VaR (in $ millions) for Ryan's current bond portfolio is closest to:", "opts": {"A": "2.09.", "B": "3.48.", "C": "3.54."}, "ans": "B", "en": "A. 2.09. — Incorrect\nIncorrect because the first step of the calculation of the daily 5% parametric VaR is missed as follows:\nStep 1: Subtract the daily standard deviation from the daily expected return: 0.000218 – 0.008246 = –0.008028\nStep 2: Take the absolute value of the result in Step 1: 0.008028\nStep 3: Multiply the result in Step 2 by the value of the portfolio: VaR = 0.008028 × $260,000,000 = $2,087,280 ≈ $2.09 million\nB. 3.48. — Correct\nCorrect because the daily 5% parametric VaR is calculated as follows:\nStep 1: Multiply the daily standard deviation by 1.65: 1.65 × 0.008246 = 0.0136059\nStep 2: Subtract the result in Step 1 from the daily expected return: 0.000218 – 0.0136059 = –0.0133879\nStep 3: Take the absolute value of the result in Step 2: 0.0133879\nStep 4: Multiply the result in Step 3 by the value of the portfolio: VaR = 0.0133879 × $260,000,000 = $3,480,854 ≈ $3.48 million\nC. 3.54. — Incorrect\nIncorrect because the VaR is mistakenly calculated by multiplying the value of the portfolio by 1.65 times the standard deviation of the portfolio.\nVaR = $260,000,000 × 1.65 × 0.008246 = $3,537,534 ≈ $3.54 million", "ko": "일간: 0.000218 − 1.65 × 0.008246 = −0.013388. 절댓값 × $260m = $3.48m.", "trap": "기대수익률을 빼는 단계(C)나 1.65를 곱하는 단계(A)를 빠뜨리지 않는다.", "f": "VaR = |E(R) − 1.65 × σ| × 포트폴리오 가치 (5%, 단측)", "why": {"A": "표준편차에 1.65를 곱하지 않았습니다.", "C": "기대수익률을 반영하지 않고 1.65σ만 썼습니다."}, "orig": "Mock 1 Session 1 Q18", "conf": false}, {"id": "mock1-1-Q19", "src": "오답", "module": "PM", "tag": "VaR 확장: Relative VaR(벤치마크 이탈)", "vig": 4, "stem": "Given his concern about the impact of adding bonds with embedded options to his current bond portfolio, which of the following extensions of VaR should Ryan use?", "opts": {"A": "Relative VaR", "B": "Conditional VaR", "C": "Incremental VaR"}, "ans": "A", "en": "A. Relative VaR — Correct\nCorrect because Ryan is concerned about the performance of his portfolio deviating from its benchmark if he adds bonds with embedded options and ex ante tracking error, also known as relative VaR, is a measure of the degree to which the performance of a given investment portfolio might deviate from its benchmark.\nB. Conditional VaR — Incorrect\nIncorrect because Ryan is concerned about the performance of his portfolio deviating from its benchmark if he adds bonds with embedded options, however, conditional VaR would not enable him to address this concern. Conditional VaR is the average loss conditional on exceeding the VaR cutoff, which answers the question 'How much can I expect to lose if VaR is exceeded?'\nC. Incremental VaR — Incorrect\nIncorrect because Ryan is concerned about the performance of his portfolio deviating from its benchmark if he adds bonds with embedded options, however, incremental VaR would not enable him to address this concern. Incremental VaR allows the user to know how the portfolio VaR will change if a position size is changed relative to the remaining positions.", "ko": "옵션부 채권을 넣으면 포트폴리오 성과가 벤치마크에서 벗어날까 걱정하는 것이므로, 벤치마크 대비 위험인 relative VaR(ex ante tracking error)을 쓴다.", "trap": "'포지션 추가 → incremental VaR'로 바로 연결하기 쉽다. 걱정의 대상이 벤치마크 이탈이면 relative VaR.", "f": "", "why": {"B": "Conditional VaR은 VaR을 넘을 때의 평균 손실로, 벤치마크 이탈을 재지 않습니다.", "C": "Incremental VaR은 포지션 크기를 바꿀 때 포트폴리오 VaR 변화로, 벤치마크 이탈을 재지 않습니다."}, "orig": "Mock 1 Session 1 Q19", "conf": false}, {"id": "mock1-1-Q20", "src": "정답", "module": "PM", "tag": "위험회피 투자자: 왜도·첨도·MDD", "vig": 4, "stem": "Which of the following strategies would provide the most attractive statistical properties for Ryan's risk-averse clients?", "opts": {"A": "Strategy X", "B": "Strategy Y", "C": "Strategy Z"}, "ans": "C", "en": "A. Strategy X — Incorrect\nIncorrect because Strategy X would be less attractive to risk-averse investors on the basis that, while it has the joint-lowest kurtosis (probability of extreme negative surprises), it has negative skewness (higher probability of negative returns) and a larger maximum drawdown (greater downside risk) than Strategy Z.\nB. Strategy Y — Incorrect\nIncorrect because Strategy Y would be less attractive to risk-averse investors on the basis that, while it has positive skewness (higher probability of positive returns), it also has higher kurtosis (higher probability of extreme negative surprises) and a larger maximum drawdown (greater downside risk) than Strategy Z.\nC. Strategy Z — Correct\nCorrect because the strategies have similar expected return and standard deviation, therefore Ryan's risk-averse clients would be most attracted to strategies with positive skewness (higher probability of positive returns), lower kurtosis (lower probability of extreme negative surprises), and smaller maximum drawdown (less downside risk). Strategy Z has the lowest downside risk, the joint-lowest kurtosis, and the joint-highest positive skewness, so it would be most attractive to risk-averse investors.", "ko": "평균·표준편차가 비슷하면 위험회피자는 양(+)의 왜도, 낮은 첨도, 작은 최대 낙폭(MDD)을 선호한다. 세 기준 모두 가장 유리한 Strategy Z.", "trap": "한 지표만 좋은 전략(X: 낮은 첨도, Y: 양의 왜도)에 끌리지 않는다.", "f": "", "why": {"A": "첨도는 낮지만 음(−)의 왜도이고 최대 낙폭이 Z보다 큽니다.", "B": "양의 왜도지만 첨도가 높고 최대 낙폭이 Z보다 큽니다."}, "orig": "Mock 1 Session 1 Q20", "conf": false}, {"id": "mock1-1-Q21", "src": "오답", "module": "FSA", "tag": "IFRS 연금: 영업비용 = 당기+과거 근무원가", "vig": 5, "stem": "For the most recent year, KTR's operating expense (in $ millions) related to Plan A was:", "opts": {"A": "8.", "B": "10.", "C": "12."}, "ans": "C", "en": "A. 8. — Incorrect\nIncorrect because this is the difference in the current and the past service cost.\nOperating expense on the income statement ($ million) = Current service cost – Past service cost = 10 – 2 = 8\nB. 10. — Incorrect\nIncorrect because this is only the current service cost with the past service cost omitted. Under IFRS, service cost has two sub-components: current and past service costs. Service costs are recognized as an operating expense on the income statement.\nThis would be the correct answer if KTR reported under US GAAP, as under US GAAP, past service costs are reported in OCI in the period in which the change giving rise to the cost occurs. In subsequent periods, past service costs are amortized to the income statement over the average service lives of the affected employees.\nC. 12. — Correct\nCorrect because under IFRS service cost has two sub-components: current and past and service costs are recognized as an operating expense on the income statement.\nOperating expense on the income statement ($ million) = Current service cost + Past service cost = 10 + 2 = 12", "ko": "IFRS에서는 과거근무원가도 즉시 손익(영업비용)으로 인식한다. 10 + 2 = $12m. (US GAAP이면 과거근무원가는 OCI 후 상각이라 10)", "trap": "US GAAP 처리(B)와 섞지 않는다. 과거근무원가는 더하는 것이지 빼는 게 아니다(A).", "f": "IFRS 손익의 service cost = current + past service cost", "why": {"A": "과거근무원가를 빼면 안 되고 더해야 합니다.", "B": "US GAAP 기준 답입니다. IFRS는 과거근무원가도 영업비용으로 인식합니다."}, "orig": "Mock 1 Session 1 Q21", "conf": false}, {"id": "mock1-1-Q22", "src": "오답", "module": "FSA", "tag": "RSU 희석주식: 자기주식법", "vig": 5, "stem": "Using the treasury stock method, KTR's number of diluted shares outstanding at the end of the most recent year (in millions) is closest to:", "opts": {"A": "2,730.", "B": "2,850.", "C": "2,970."}, "ans": "A", "en": "A. 2,730. — Correct\nCorrect because diluted shares outstanding using treasury stock method is calculated as shown below:\nBasic shares outstanding\t2,700 million\nPlus: Unvested RSUs\t150 million\nMinus: Assumed repurchases = Average unrecognized share-based compensation expense/ Average stock price\t$840 million/ $7 = 120 million\nDiluted shares outstanding\t2,730 million\nThe above calculation is based on:\nDiluted shares outstanding is computed using the treasury stock method, where unvested RSUs are added to basic shares outstanding, net of assumed repurchases which is based on the average unrecognized share-based compensation expense and average prevailing market price for the shares.\nBasic shares outstanding\nPlus: Shares issued from conversion or exercise of share-based awards\nMinus: (Assumed proceeds from conversion or exercise of the share-based awards / Average share price for the reporting period) = Diluted shares outstanding.\nand the treasury stock method adds a 'net' amount of potentially dilutive securities like unvested RSUs to basic shares outstanding.\nB. 2,850. — Incorrect\nIncorrect because assumed repurchases are ignored rather than being deducted\nBasic shares outstanding\t2,700 million\nPlus: Unvested RSUs\t150 million\nDiluted shares outstanding\t2,850 million\nC. 2,970. — Incorrect\nIncorrect because diluted shares outstanding is wrongly calculated by adding assumed repurchases rather than deducting\nBasic shares outstanding\t2,700 million\nPlus: Unvested RSUs\t150 million\nPlus: Assumed repurchases = Average unrecognized share based compensation expense/ Average stock price\t$840 million/ $7 = 120 million\nDiluted shares outstanding\t2,970 million", "ko": "2,700 + 150 − (840 / 7 = 120) = 2,730백만 주.", "trap": "가정 재매입 주식은 빼야 한다. 무시하면 B, 더하면 C.", "f": "희석주식 = 기본주식 + 미가득 RSU − (미인식 보상비용 평균 / 평균 주가)", "why": {"B": "가정 재매입 주식(120m)을 빼지 않았습니다.", "C": "가정 재매입 주식을 빼야 하는데 더했습니다."}, "orig": "Mock 1 Session 1 Q22", "conf": false}, {"id": "mock1-1-Q23", "src": "오답", "module": "FSA", "tag": "RSU 보상비용 인식: 가득기간 배분", "vig": 5, "stem": "In KTR's current year financial statements, which of the following would result from its new RSU grants under Plan B?", "opts": {"A": "$4 million increase in compensation expense", "B": "$4 million increase in cash flow from financing activities", "C": "$16 million increase in share-based compensation reserve"}, "ans": "A", "en": "A. $4 million increase in compensation expense — Correct\nCorrect because the annual share-based compensation expense can be calculated by taking the product of the RSUs granted and the grant-date share prices, further multiplied by the fraction of awards that vest each period.\nFor the current financial year:\nRSUs granted = 2 million\nGrant date share price = $8\nFraction of awards that vest each period = 2 million/ 4 years vesting period = 0.5 million\nAnnual share based compensation expense = 0.5 million × $8 = $4 million\nTherefore the impact of the RSUs granted during the current year will lead to an increase in income statement compensation expense by $4 million.\nB. $4 million increase in cash flow from financing activities — Incorrect\nIncorrect because there is no impact on the statement of cash flows because of the vesting of RSUs, which is a non-cash transaction.\nAs a non-cash transaction, share-based compensation does not impact cash flows.\nC. $16 million increase in share-based compensation reserve — Incorrect\nIncorrect because the share-based compensation reserve will increase by $4 million in the current financial year (first year of vesting) not $16 million (this is the cumulative increase in reserve over the 4 years of vesting).\nThe general approach is to measure the fair value of the share-based award at the grant date, recognize it as an expense over the vesting period with the offsetting entry to equity, and transfer the entries from one equity account to another at settlement.", "ko": "부여 RSU 2m × 부여일 주가 $8 = $16m을 4년 가득기간에 나눠 인식 → 올해 비용 $4m 증가. 보상 적립금(자본)도 $4m만 늘고, 현금 유출이 없어 현금흐름에는 영향 없다.", "trap": "$16m은 4년 누적 금액이다. 주식보상은 비현금 거래라 재무활동 현금흐름에 안 잡힌다.", "f": "", "why": {"B": "RSU 가득은 비현금 거래라 현금흐름표에 영향이 없습니다.", "C": "$16m은 4년 누적액입니다. 올해 적립금 증가는 $4m입니다."}, "orig": "Mock 1 Session 1 Q23", "conf": false}, {"id": "mock1-1-Q24", "src": "정답", "module": "FSA", "tag": "손해보험 비율: 사업비율 = 신계약 효율", "vig": 5, "stem": "Which P&C insurance company is the most efficient at obtaining new premiums?", "opts": {"A": "KTR", "B": "Peer Company 1", "C": "Peer Company 2"}, "ans": "B", "en": "A. KTR — Incorrect\nIncorrect because KTR has the highest and not the lowest underwriting expense ratio. KTR has the lowest loss and loss adjustment expense ratio, which indicates the efficiency of underwriting process, rather than the efficiency of obtaining new premium.\nLoss and loss adjustment expense ratio = (Loss expense + Loss adjustment expense)/Net premiums earned. This ratio indicates the degree of success an underwriter has achieved in estimating the risks insured. The lower the ratio, the greater the success.\nB. Peer Company 1 — Correct\nCorrect because Peer Company 1 has the lowest underwriting expense ratio.\nUnderwriting expense ratio = Underwriting expense/Net premiums written. This ratio measures the efficiency of money spent in obtaining new premiums. A lower ratio indicates higher success.\nC. Peer Company 2 — Incorrect\nIncorrect because Peer Company 2 does not have the lowest underwriting expense ratio. Peer Company 2 has the lowest combined ratio, which indicates the overall efficiency rather than the efficiency of obtaining new premium.\nCombined ratio = Loss and loss adjustment expense ratio + Underwriting expense ratio. This ratio indicates the overall efficiency of an underwriting operation. A combined ratio of less than 100 is considered efficient.", "ko": "신규 보험료를 얻는 효율 = underwriting expense ratio(사업비/순수입보험료). 이 비율이 가장 낮은 Peer Company 1.", "trap": "손해율(손해·손해조사비율)은 인수심사 효율, 합산비율은 전체 효율이다. 묻는 것이 '신규 보험료 획득'이면 사업비율.", "f": "", "why": {"A": "KTR은 손해율이 가장 낮을 뿐, 사업비율은 가장 높습니다.", "C": "Peer 2는 합산비율이 가장 낮을 뿐, 사업비율이 가장 낮지는 않습니다."}, "orig": "Mock 1 Session 1 Q24", "conf": false}, {"id": "mock1-1-Q25", "src": "정답", "module": "FI", "tag": "이항트리 보정: 모델가 > 시장가 → 금리 올림", "vig": 6, "stem": "When completing the next iteration of the calibration process for the binomial tree, Blythe should:", "opts": {"A": "decrease the 1-year forward rates at Year 2.", "B": "leave the 1-year forward rates at Year 2 unchanged.", "C": "increase the 1-year forward rates at Year 2."}, "ans": "C", "en": "A. decrease the 1-year forward rates at Year 2. — Incorrect\nIncorrect because the value of the bond using the current binomial tree is 100.1684, which is above the market price of 100. Therefore, the forward rates at Year 2 need to be increased, not decreased, to lower the value of the bond and properly calibrate the binomial tree to the market price.\nB. leave the 1-year forward rates at Year 2 unchanged. — Incorrect\nIncorrect because the value of the bond using the current binomial tree is 100.1684, which is above the market price of 100. Therefore, the forward rates at Year 2 need to be increased to lower the value of the bond and properly calibrate the binomial tree to the market price.\nC. increase the 1-year forward rates at Year 2. — Correct\nCorrect because the value of the bond using the current binomial tree is 100.1684, which is above the market price of 100. Therefore, the forward rates at Year 2 need to be adjusted upward to lower the value of the bond and properly calibrate the binomial tree to the market price.\nThe calculation is as follows:\nValue at Node 3-1 = 98.2408 = (3.5 + 100) / 1.053534\nValue at Node 3-2 = 99.1541 = (3.5 + 100) / 1.043830\nValue at Node 3-3 = 99.9146 = (3.5 + 100) / 1.035885\nValue at Node 2-1 = 98.3818 = [3.5 + (0.5 × 98.2408 + 0.5 × 99.1541)] / 1.038784\nValue at Node 2-2 = 99.8633 = [3.5 + (0.5 × 99.1541 + 0.5 × 99.9146)] / 1.031754\nValue at Node 1-1 = 100.1684 = [3.5 + (0.5 × 98.3818 + 0.5 × 99.8633)] / 1.024500", "ko": "현재 트리로 계산한 채권가치 100.1684가 시장가 100보다 높다. 가치를 낮추려면 할인율, 즉 Year 2 선도금리를 올려야 한다.", "trap": "가격과 금리는 반대로 움직인다. 모델가가 높으면 금리를 올린다.", "f": "", "why": {"A": "금리를 내리면 모델가가 더 올라가 시장가와 더 벌어집니다.", "B": "모델가(100.1684)가 시장가(100)와 달라 조정이 필요합니다."}, "orig": "Mock 1 Session 1 Q25", "conf": false}, {"id": "mock1-1-Q26", "src": "정답", "module": "FI", "tag": "풋·콜 내재 채권 가치 비교", "vig": 6, "stem": "Which of the bonds issued by Y Corporation most likely has the highest value?", "opts": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}, "ans": "B", "en": "A. Bond 1 — Incorrect\nIncorrect because Bond 2 should have a higher valuation than Bond 1 due to Bond 2's embedded put option. The value of the put option increases the value of the putable bond relative to the value of the straight bond.\nValue of putable bond = Value of straight bond + Value of investor put option.\nB. Bond 2 — Correct\nCorrect because Bond 2 should have a higher valuation than Bond 1 (the straight bond) due to Bond 2's embedded put option. The value of the put option increases the value of the putable bond relative to the value of the straight bond.\nValue of putable bond = Value of straight bond + Value of investor put option.\nFurther, Bond 1 should have a higher value than Bond 3 due to Bond 3's embedded call option. The value of the call option decreases the value of the callable bond relative to the value of the straight bond:\nValue of callable bond = Value of straight bond – Value of issuer call option.\nHence, Bond 2's value > Bond 1's value > Bond 3's value.\nThe fact that the put strike price of 100 is lower than the call strike price of 102 does not affect the relative valuations of these bonds. From an investor's perspective, an embedded put option adds value while an embedded call decreases value.\nC. Bond 3 — Incorrect\nIncorrect because Bond 2 should have a higher valuation than Bond 3 due to Bond 2's embedded put option and Bond 3's embedded call option. The value of the put option increases the value of the putable bond relative to the value of the straight bond. The value of the call option decreases the value of the callable bond relative to the value of the straight bond.\nValue of putable bond = Value of straight bond + Value of investor put option\nValue of callable bond = Value of straight bond – Value of issuer call option\nHence, Bond 2's value > Bond 1's value > Bond 3's value.", "ko": "풋은 투자자 권리라 가치를 더하고, 콜은 발행자 권리라 가치를 뺀다. 가치: Bond 2(풋) > Bond 1(일반) > Bond 3(콜).", "trap": "누구의 옵션인지 먼저 본다. 투자자 옵션 = +, 발행자 옵션 = −.", "f": "풋옵션부 = 일반채 + 풋 / 콜옵션부 = 일반채 − 콜", "why": {"A": "일반채는 풋옵션 가치만큼 Bond 2보다 낮습니다.", "C": "콜옵션부는 콜 가치만큼 일반채보다도 낮습니다."}, "orig": "Mock 1 Session 1 Q26", "conf": false}, {"id": "mock1-1-Q27", "src": "정답", "module": "FI", "tag": "음의 볼록성: 콜옵션부 채권", "vig": 6, "stem": "Which of the bonds issued by Y Corporation is most likely to exhibit negative convexity?", "opts": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}, "ans": "C", "en": "A. Bond 1 — Incorrect\nIncorrect because Bond 1 is an option-free bond and an option-free bond exhibits low positive convexity.\nB. Bond 2 — Incorrect\nIncorrect because Bond 2 is a putable bond and putable bonds always have positive convexity.\nC. Bond 3 — Correct\nCorrect because Bond 3 (the callable bond) is most likely to exhibit negative convexity. When interest rates are high and the value of the call option is low, the callable and straight bond experience very similar effects from changes in interest rates. They both have positive convexity. However, the effective convexity of the callable bond turns negative when the call option is near the money which indicates that the upside for a callable bond is much smaller than the downside. The reason is because when interest rates decline, the price of the callable bond is capped by the price of the call option if it is near the exercise date. Conversely, putable bonds always have positive convexity.", "ko": "금리가 내려가 콜옵션이 내가격에 가까워지면 가격 상승이 콜 가격 근처에서 막혀 콜옵션부 채권은 음의 볼록성을 보인다.", "trap": "풋옵션부 채권은 항상 양의 볼록성이다.", "f": "", "why": {"A": "일반채는 양의 볼록성입니다.", "B": "풋옵션부 채권은 항상 양의 볼록성입니다."}, "orig": "Mock 1 Session 1 Q27", "conf": false}, {"id": "mock1-1-Q28", "src": "정답", "module": "FI", "tag": "전환사채 시장 전환 프리미엄 비율", "vig": 6, "stem": "The current market conversion premium ratio for Z Corporation's convertible bond is closest to:", "opts": {"A": "43.7%.", "B": "47.4%.", "C": "56.8%."}, "ans": "B", "en": "A. 43.7%. — Incorrect\nIncorrect because this is the calculation for the market conversion premium ratio at the time of issuance.\nInitial conversion premium per share = Initial conversion price – Share price at issuance = 25.00 – 17.40 = 7.60\nInitial conversion premium ratio = Initial conversion premium per share / Share price at issuance = 7.60 / 17.40 = 43.7%\nB. 47.4%. — Correct\nCorrect because the current market conversion price and the current share price were used in the calculations, which are as follows:\nConversion ratio = Issue price of bond / Initial conversion price = 1,000 / 25 = 40\nMarket conversion price = Convertible bond price / Conversion ratio = 1,091 / 40 = 27.275\nMarket conversion premium per share = Market conversion price – Current share price = 27.275 – 18.50 = 8.775\nMarket conversion premium ratio = Market conversion premium per share / Current share price = 8.775 / 18.50 = 47.4%\nC. 56.8%. — Incorrect\nIncorrect because this calculation compares the market conversion price to the share price at issuance instead of the current share price.\nConversion ratio = Issue price of bond / Initial conversion price = 1,000 / 25 = 40\nMarket conversion price = Convertible bond price / Conversion ratio = 1,091 / 40 = 27.275\nMarket conversion premium per share = Market conversion price – Share price at issuance = 27.275 – 17.40 = 9.875\nMarket conversion premium ratio = Market conversion premium per share / Share price at issuance = 9.875 / 17.40 = 56.8%", "ko": "전환비율 = 1,000 / 25 = 40. 시장전환가격 = 1,091 / 40 = 27.275. (27.275 − 18.50) / 18.50 = 47.4%.", "trap": "발행 시점 값(A)이나 발행 시 주가(C)가 아니라 현재 CB 가격·현재 주가를 쓴다.", "f": "전환비율 = 액면 / 전환가격 / 시장전환가격 = CB 가격 / 전환비율 / 프리미엄 비율 = (시장전환가격 − 현재 주가) / 현재 주가", "why": {"A": "발행 시점의 전환 프리미엄 비율입니다.", "C": "분모·비교 대상으로 현재 주가 대신 발행 시 주가($17.40)를 썼습니다."}, "orig": "Mock 1 Session 1 Q28", "conf": true}, {"id": "mock1-1-Q29", "src": "정답", "module": "CI", "tag": "리스 내재 이자비용(IRR)", "vig": 7, "stem": "The implied annual interest cost of the helicopter lease is closest to:", "opts": {"A": "6.30%.", "B": "7.10%.", "C": "8.00%."}, "ans": "A", "en": "A. 6.30%. — Correct\nCorrect because the implied interest cost of the lease equates the initial cash outflow to the present value of the net cash flows beyond the initial year. Using a calculator, the implied interest cost is calculated as follows:\nPayment (PMT) = $125,000\nPresent value (PV) = –$15,750,000 ($15 million fair value plus $750,000 direct costs)\nNumber of payments (N) = 120 (10 years × 12 monthly payments)\nFuture value (FV) = $8,700,000\nSolve for interest rate (i) = 0.5249% per month\nImplied annual interest rate = 0.5249% × 12 = 6.299% ≈ 6.30%\nB. 7.10%. — Incorrect\nIncorrect because this response does not include Feldcroft's direct costs as part of the cash flows of the lease. Using a calculator, the implied interest cost is calculated as follows:\nPayment (PMT) = $125,000\nPresent value (PV) = –$15,000,000\nNumber of payments (N) = 120 (10 years × 12 monthly payments)\nFuture value (FV) = $8,700,000\nSolve for interest rate (i) = 0.5921% per month\nImplied annual interest rate = 0.5921% × 12 = 7.1049% ≈ 7.10%\nC. 8.00%. — Incorrect\nIncorrect because this response assumes the lease cost will be based on Feldcroft's unsecured incremental borrowing rate. However, the implied interest cost of the lease is based on the cash flows of the lease itself and is calculated independently from the unsecured incremental borrowing rate.", "ko": "PV = −(15,000,000 + 750,000), PMT = 125,000, N = 120, FV = 8,700,000 → 월 0.5249% → 연 6.30%. 리스의 내재 이자비용은 리스 현금흐름 자체로 계산한다.", "trap": "직접원가를 빼먹으면 B, 회사 차입금리를 쓰면 C.", "f": "PV = 공정가치 + 직접원가, PMT·N·FV로 i 풀기 → × 12", "why": {"B": "직접원가 $750,000을 초기 현금유출에 넣지 않았습니다.", "C": "회사의 무담보 차입금리입니다. 리스 내재이자는 리스 현금흐름으로 계산합니다."}, "orig": "Mock 1 Session 1 Q29", "conf": true}, {"id": "mock1-1-Q30", "src": "오답", "module": "CI", "tag": "Country spread model ERP", "vig": 7, "stem": "Based on the country spread model, the equity risk premium that should be used in calculating Feldcroft's cost of equity is closest to:", "opts": {"A": "6.11%.", "B": "6.35%.", "C": "7.59%."}, "ans": "A", "en": "A. 6.11%. — Correct\nCorrect because, under the country spread model, Feldcroft's equity risk premium (ERP) is based on the ERP of the US plus a country risk premium adjusted for the level of Feldcroft's exposure to Country A.\nERP = ERP for a developed market + (λ × Country risk premium)\nwhere,\nλ is the level of Feldcroft's exposure to Country A\nCountry risk premium = Yield on Country A bonds (denominated in USD) – Yield on US bonds (denominated in USD)\nTherefore,\nERP = 5.94% + [10% × (5.15% – 3.50%)]\nERP = 6.105% ≈ 6.11%\nB. 6.35%. — Incorrect\nIncorrect because this response uses Country A's 10-year bond denominated in local currency instead of the USD-denominated 10-year bond. This response incorrectly calculates the equity risk premium as:\nERP = 5.94% + [10% × (7.55% – 3.50%)]\nERP = 6.345% ≈ 6.35%\nC. 7.59%. — Incorrect\nIncorrect because this response does not adjust Feldcroft's equity risk premium (ERP) for the level of exposure to Country A. This response incorrectly calculates the equity risk premium as:\nERP = 5.94% + (5.15% – 3.50%)\nERP = 7.59%", "ko": "국가위험 프리미엄은 같은 통화(USD) 표시 채권끼리 비교: 5.15% − 3.50% = 1.65%. 노출도 λ = 10%를 곱해 5.94% + 0.165% = 6.11%.", "trap": "현지통화 채권 수익률을 쓰면(B) 인플레이션 차이가 섞인다. λ를 빼먹으면 C.", "f": "ERP = 선진국 ERP + λ × (해당국 USD 채권 수익률 − 미국 국채 수익률)", "why": {"B": "USD 표시 채권 대신 현지통화 표시 채권 수익률을 썼습니다.", "C": "국가위험 프리미엄에 노출도 λ(10%)를 곱하지 않았습니다."}, "orig": "Mock 1 Session 1 Q30", "conf": true}, {"id": "mock1-1-Q31", "src": "정답", "module": "CI", "tag": "비교거래 분석: 인수 프리미엄 내재", "vig": 7, "stem": "Based on comparable transaction analysis, the fair takeover value per share of the target construction company is closest to:", "opts": {"A": "$9.45.", "B": "$12.25.", "C": "$13.23."}, "ans": "B", "en": "A. $9.45. — Incorrect\nIncorrect because this response applies Feldcroft's P/S ratio of 1.35 instead of the mean P/S ratio of the comparable transactions (1.75). Given the target company's sales per share of $7.00:\nFair takeover value per share = Sales per share × Feldcroft's P/S ratio\n= $7.00 × 1.35\n= $9.45\nB. $12.25. — Correct\nCorrect because comparable transaction analysis is closely related to comparable company analysis, except that the analyst uses valuation multiples from historical acquisitions of similar targets. It is not necessary to separately estimate a takeover premium. The takeover premium is embedded in the comparable transaction multiples.\nGiven the target company's sales per share of $7.00:\nFair takeover value per share = Sales per share × Mean P/S of comparable transactions\nMean P/S of comparable transactions = (1.78 + 1.84 + 1.63) / 3 = 1.75\nFair takeover value per share = $7.00 × 1.75 = $12.25\nC. $13.23. — Incorrect\nIncorrect because this response adds the 8% average takeover premium in the construction industry, which is double-counting as the premium is already embedded in the comparable transaction multiples. Given the target company's sales per share of $7.00:\nFair takeover value per share = Sales per share × Mean P/S of comparable transactions × (1 + Average industry takeover premium)\nMean P/S of comparable transactions = (1.78 + 1.84 + 1.63) / 3 = 1.75\nFair takeover value per share = $7.00 × 1.75 × (1 + 8%) = $13.23", "ko": "비교거래 배수에는 인수 프리미엄이 이미 들어 있다. $7.00 × 1.75 = $12.25.", "trap": "업계 평균 인수 프리미엄을 또 더하면(C) 이중 계산. 인수회사 자기 배수(A)를 쓰지 않는다.", "f": "공정 인수가치 = 주당 매출 × 비교거래 평균 P/S", "why": {"A": "비교거래 평균 P/S(1.75) 대신 인수회사 P/S(1.35)를 썼습니다.", "C": "비교거래 배수에 이미 들어 있는 인수 프리미엄 8%를 또 더했습니다."}, "orig": "Mock 1 Session 1 Q31", "conf": true}, {"id": "mock1-1-Q32", "src": "정답", "module": "CI", "tag": "Pro forma 손익: 감가상각·이자·영업비용", "vig": 7, "stem": "Which of the following balances on the pro forma income statement does Traver most likely model correctly?", "opts": {"A": "Interest expense", "B": "Operating expenses", "C": "Depreciation and amortization expense"}, "ans": "C", "en": "A. Interest expense — Incorrect\nIncorrect because Traver double counts interest expense on the target's pre-acquisition debt, which would be refinanced as part of the new debt issuance associated with the acquisition. In addition, to the extent Feldcroft has any pre-acquisition debt (which is not stated in the vignette), Traver also omits interest expense related to that debt.\n1. Start with current acquirer interest expense.\n2. Add increased interest from new debt issuance and revised interest rate.\nB. Operating expenses — Incorrect\nIncorrect because cost synergies should be subtracted from, not added to, operating expenses, and cost dis-synergies should be added to, not subtracted from, operating expenses.\n1. Combine acquirer and target operating expenses.\n2. Subtract cost synergies or add the cost of incompatible activities (dis-synergies).\nC. Depreciation and amortization expense — Correct\nCorrect because these are the appropriate steps to determine pro forma depreciation and amortization.\n1. Combine acquirer and target depreciation and amortization.\n2. Add amortization of acquired intangible assets.", "ko": "감가상각비는 인수자 + 피인수자 감가상각을 합치고 인수한 무형자산 상각을 더한다. Traver는 이 단계대로 했다.", "trap": "피인수자 기존 부채는 재조달되므로 그 이자를 따로 더하면 이중 계산. 비용 시너지는 영업비용에서 뺀다.", "f": "", "why": {"A": "재조달되는 피인수자 기존 부채의 이자를 이중으로 넣었습니다.", "B": "비용 시너지는 빼고, 비용 역시너지는 더해야 하는데 반대로 했습니다."}, "orig": "Mock 1 Session 1 Q32", "conf": false}, {"id": "mock1-1-Q33", "src": "정답", "module": "QM", "tag": "과적합 = 분산 오차", "vig": 8, "stem": "Helmer’s ROE prediction model most likely suffers from:", "opts": {"A": "overfitting and base error.", "B": "underfitting and bias error.", "C": "overfitting and variance error."}, "ans": "C", "en": "A. overfitting and base error. — Incorrect\nIncorrect because base error is due to randomness in the data, which impacts both training data and out-of-sample data. Variance error captures how much the model’s results change in response to new data from validation and test samples. Unstable models pick up noise and produce high variance, causing overfitting and high out-of-sample error. Hence, high out-of-sample error (variance error) in the model is caused by overfitting to the training data.\nB. underfitting and bias error. — Incorrect\nIncorrect because bias error captures the degree to which a model fits the training data. Algorithms with erroneous assumptions produce high bias with poor approximation, causing underfitting and high in-sample error. The case states that the model performs well on training or in-sample data, so there is no evidence of bias error or underfitting.\nC. overfitting and variance error. — Correct\nCorrect because Helmer’s model is good at correctly classifying using the training data, but it does not perform well using new data. Low or no in-sample error but large out-of-sample error are indicative of poor generalization. Variance error captures how much the model’s results change in response to new data from validation and test samples. Unstable models pick up noise and produce high variance, causing overfitting and high out-of-sample error. Hence, high out-of-sample error (variance error) in the model is caused by overfitting to the training data.", "ko": "훈련 데이터에서는 잘 맞지만 새 데이터에서 성능이 나쁘다 → 일반화 실패 = 과적합, 높은 분산(variance) 오차.", "trap": "표본 내 오차가 크면 편향(과소적합), 표본 외 오차만 크면 분산(과적합). base error는 데이터 자체의 잡음.", "f": "", "why": {"A": "base error는 데이터 자체의 무작위성으로, 과적합의 원인이 아닙니다.", "B": "표본 내 성능이 좋으므로 편향·과소적합의 증거가 없습니다."}, "orig": "Mock 1 Session 1 Q33", "conf": false}, {"id": "mock1-1-Q34", "src": "오답", "module": "QM", "tag": "로지스틱 회귀 확률 계산", "vig": 8, "stem": "Based on the logistic regression model, the probability that ACME defaults within the next year is closest to:", "opts": {"A": "29%.", "B": "71%.", "C": "90%."}, "ans": "B", "en": "A. 29%. — Incorrect\nIncorrect because the negative sign is omitted when calculating the event probability. The event probability is incorrectly calculated as:\nP = 1/(1 + exp(b0 + b1 × LEVERAGE + b2 × COVERAGE)).\nBased on the coefficient estimates in Exhibit 1 and the value of the independent variables for ACME:\nP = 1/(1 + exp(–20 + 65.5 × 0.8 – 35 × 0.9)) = 1/(1 + exp(0.9)) = 0.2891 or 29%\nB. 71%. — Correct\nCorrect because a logistic regression model uses a log-odds transformation:\nln(P/(1 – P)) = b0 + b1 × LEVERAGE + b2 × COVERAGE,\nwhere b0 is the intercept, b1 and b2 are the slope parameters.\nThe event probability is then calculated as:\nP = 1/(1 + exp(–(b0 + b1 × LEVERAGE + b2 × COVERAGE))).\nBased on the coefficient estimates in Exhibit 1 and the value of the independent variables for ACME:\nP = 1/(1 + exp(–(–20 + 65.5 × 0.8 – 35 × 0.9))) = 1/(1 + exp(–0.9)) = 0.7109 or 71%\nC. 90%. — Incorrect\nIncorrect because the regression is treated as a linear regression instead of a logistic regression and the probability of default is incorrectly calculated as:\nP = b0 + b1 × LEVERAGE + b2 × COVERAGE\nP = –20 + 65.5 × 0.8 – 35 × 0.9 = 0.9 or 90%\nIn case the intercept is missed in calculating the event probability in the logistic regression model, the default probability is 100%, which is closest to 90%.\nThe event probability is incorrectly calculated as:\nP = 1/(1 + exp(–(b1 × LEVERAGE + b2 × COVERAGE))).\nBased on the coefficient estimates in Exhibit 1 and the value of the independent variables for ACME:\nP = 1/(1 + exp(–(65.5 × 0.8 – 35 × 0.9))) = 1/(1 + exp(–20.9)) = 1.0000 or 100%", "ko": "선형결합: −20 + 65.5 × 0.8 − 35 × 0.9 = 0.9. P = 1 / (1 + e^(−0.9)) ≈ 0.71.", "trap": "선형결합 값을 그대로 확률로 쓰면 C(90%), 지수의 음수 부호를 빼면 A(29%).", "f": "P = 1 / (1 + exp(−(b0 + b1X1 + b2X2)))", "why": {"A": "exp 안의 음수 부호를 빼먹었습니다.", "C": "로지스틱 변환 없이 선형결합 값을 확률로 썼습니다."}, "orig": "Mock 1 Session 1 Q34", "conf": false}, {"id": "mock1-1-Q35", "src": "정답", "module": "QM", "tag": "Q-Q plot → 정규성 위반", "vig": 8, "stem": "Observation 1 indicates a violation of which regression assumption?", "opts": {"A": "Normality", "B": "Homoskedasticity", "C": "Independence of explanatory variables"}, "ans": "A", "en": "A. Normality — Correct\nCorrect because a Q-Q plot is used to visualize the distribution of a variable by comparing it to a normal distribution (the diagonal). In the case of regression, we can use a Q-Q plot to compare the model’s standardized residuals to a theoretical standard normal distribution. If the residuals are normally distributed, they should align along the diagonal. Significant deviations of the residuals from the diagonal of the Q-Q plot, as per Observation 1, indicate that the residuals are not normally distributed.\nB. Homoskedasticity — Incorrect\nIncorrect because a Q-Q plot is used to visualize the distribution of a variable by comparing it to a normal distribution (the diagonal). Significant deviations of the residuals from the diagonal of the Q-Q plot, as per Observation 1, indicate that the residuals are not normally distributed, but it does not mean that there is heteroskedasticity. Homoskedasticity could be visually explored with a scatterplot between dependent and independent variables included in the regression.\nC. Independence of explanatory variables — Incorrect\nIncorrect because a Q-Q plot is used to visualize the distribution of a variable by comparing it to a normal distribution (the diagonal). The Q-Q plot cannot be used to identify non-linear relationships between the dependent variable (Y) and the independent variables (Xi). Significant deviations of the residuals from the diagonal of the Q-Q plot, as per Observation 1, indicate that the residuals are not normally distributed, but this does not mean that there is interdependence of explanatory variables or multicollinearity. A pairwise scatterplot of the independent variables is used to detect this relationship.", "ko": "Q-Q plot은 표준화 잔차를 정규분포와 비교한다. 대각선에서 크게 벗어나면 잔차의 정규성 가정 위반.", "trap": "이분산성은 잔차 vs 독립변수 산점도·BP 검정으로, 다중공선성은 VIF로 본다. Q-Q plot은 정규성.", "f": "", "why": {"B": "Q-Q plot의 이탈은 비정규성을 뜻할 뿐, 이분산성을 보여주지 않습니다.", "C": "Q-Q plot으로는 설명변수 간 관계를 알 수 없습니다."}, "orig": "Mock 1 Session 1 Q35", "conf": true}, {"id": "mock1-1-Q36", "src": "정답", "module": "QM", "tag": "Breusch–Pagan 기각 → 강건 표준오차", "vig": 8, "stem": "With respect to the tests for violations of regression assumptions, Observation 2 indicates that:", "opts": {"A": "no corrective action is necessary.", "B": "a larger sample size should be used.", "C": "robust standard errors should be calculated."}, "ans": "C", "en": "A. no corrective action is necessary. — Incorrect\nIncorrect because the null hypothesis for the Breusch–Pagan test is that there is no conditional heteroskedasticity. Since the hypothesis is rejected, it indicates that the residuals are conditionally heteroskedastic. This is a violation of the assumptions of linear regression, which needs to be corrected.\nB. a larger sample size should be used. — Incorrect\nIncorrect because the null hypothesis for the Breusch–Pagan test is that there is no conditional heteroskedasticity. Since the hypothesis is rejected, it indicates that the residuals are conditionally heteroskedastic. Increasing the sample size does not fix the existing conditional heteroskedasticity. This is instead a possible solution in the presence of multicollinearity.\nC. robust standard errors should be calculated. — Correct\nCorrect because the null hypothesis for the Breusch–Pagan test is that there is no conditional he

teroskedasticity. Since the hypothesis is rejected, it indicates that the residuals are conditionally heteroskedastic. The easiest method to correct for the effects of conditional heteroskedasticity in linear regression is to compute robust standard errors, which adjust the standard errors of the regression’s estimated coefficients to account for the heteroskedasticity.", "ko": "BP 검정의 귀무가설은 '조건부 이분산 없음'. 기각됐으므로 조건부 이분산이 있다. 가장 간단한 교정은 강건(robust) 표준오차.", "trap": "표본 크기 확대는 다중공선성 대응책이다.", "f": "", "why": {"A": "가정 위반이 확인됐으므로 교정이 필요합니다.", "B": "표본을 늘려도 조건부 이분산은 해결되지 않습니다(다중공선성 대응책)."}, "orig": "Mock 1 Session 1 Q36", "conf": true}, {"id": "mock1-1-Q37", "src": "오답", "module": "AI", "tag": "REIT 평가: 일회성 항목 → P/FFO·P/AFFO 불리", "vig": 9, "stem": "The issues Lambert is considering regarding REIT A would pose a disadvantage for which of the following valuation models?", "opts": {"A": "Net asset value", "B": "P/AFFO multiple", "C": "Dividend discount model"}, "ans": "B", "en": "A. Net asset value — Incorrect\nIncorrect because NAVPS (net asset value per share) can be reasonably estimated when there are ample market transactions to provide property comparables.\nB. P/AFFO multiple — Correct\nCorrect because an increased level of one-time items such as gains and accounting charges, as well as new revenue recognition rules, has affected the income statement, thus making P/FFO and P/AFFO more difficult to compute and complicating comparisons between companies.\nC. Dividend discount model — Incorrect\nIncorrect because REITs return a significant portion of their income to their investors as required by law and, as a result, tend to pay high dividends. Thus, dividend discount or discounted cash flow models for valuation are also applicable. One-time charges and gains have a limited effect on dividend payouts.", "ko": "일회성 이익·비용 증가와 새 수익인식 규정은 손익계산서에 영향을 줘 FFO·AFFO 계산과 회사 간 비교를 어렵게 한다 → P/AFFO가 불리.", "trap": "일회성 항목은 배당에는 영향이 작다. 손익 기반 배수가 흔들린다.", "f": "", "why": {"A": "비교 가능한 거래가 충분하면 NAVPS는 합리적으로 추정됩니다.", "C": "REIT는 배당 성향이 높고 일회성 항목이 배당에 주는 영향이 작아 DDM에는 큰 문제가 아닙니다."}, "orig": "Mock 1 Session 1 Q37", "conf": false}, {"id": "mock1-1-Q38", "src": "정답", "module": "AI", "tag": "AFFO와 P/AFFO", "vig": 9, "stem": "The P/AFFO multiple for REIT B is closest to:", "opts": {"A": "16.6.", "B": "17.9.", "C": "18.9."}, "ans": "B", "en": "A. 16.6. — Incorrect\nIncorrect because only Non-cash (straight-line) rent adjustment is subtracted from FFO, and not recurring maintenance-type capital expenditures and leasing commissions.\nIncorrect AFFO = FFO – Non-cash (straight-line) rent adjustment = $465,419 – $14,705 = $450,714.\nIncorrect AFFO/share = $450,714/100,000 = $4.51 per share.\nIncorrect Price/AFFO = $74.65/$4.51 = 16.56x = 16.6x.\nB. 17.9. — Correct\nCorrect because AFFO is calculated as:\nAFFO = FFO – Non-cash (straight-line) rent adjustment – Recurring maintenance-type capital expenditures and leasing commissions = $465,419 – $14,705 – $33,297 = $417,417.\nAFFO/share = $417,417/100,000 = $4.17 per share.\nPrice/AFFO = $74.65/$4.17 = 17.88x = 17.9x.\nC. 18.9. — Incorrect\nIncorrect because (Gains)/Losses from sale of depreciable real estate are incorrectly subtracted from FFO to derive AFFO. This double counts (Gains)/Losses from sale of depreciable real estate since they have already been removed when calculating FFO.\nIncorrect AFFO = FFO – (Gains)/Losses from sale of depreciable real estate – Non-cash (straight-line) rent adjustment – Recurring maintenance-type capital expenditures and leasing commissions = $465,419 – $22,613 – $14,705 – $33,297 = $394,804.\nIncorrect AFFO/share = $394,804/100,000 = $3.95 per share.\nIncorrect Price/AFFO = $74.65/$3.95 = 18.91x = 18.9x.", "ko": "AFFO = 465,419 − 14,705 − 33,297 = 417,417 → 주당 4.17. P/AFFO = 74.65 / 4.17 = 17.9x.", "trap": "부동산 처분손익은 FFO 단계에서 이미 제거됐으니 다시 빼지 않는다(C). 유지보수 capex를 빼먹으면 A.", "f": "AFFO = FFO − 정액 임대료 조정 − 반복적 유지보수 capex·임대 수수료", "why": {"A": "반복적 유지보수 capex·임대 수수료를 빼지 않았습니다.", "C": "FFO에서 이미 제거한 처분손익을 다시 뺐습니다."}, "orig": "Mock 1 Session 1 Q38", "conf": false}, {"id": "mock1-1-Q39", "src": "정답", "module": "AI", "tag": "REIT 유형별 경제 변수: 호텔 vs 산업", "vig": 9, "stem": "Which of Lambert's forecasts about the wider economy best supports her recommended REIT property type?", "opts": {"A": "Job creation", "B": "Consumer credit", "C": "Retail sales growth"}, "ans": "B", "en": "A. Job creation — Incorrect\nIncorrect because job creation is a factor for both hotel and industrial REITs, thus not supporting a preference for one over the other.\nB. Consumer credit — Correct\nCorrect because consumer credit is a factor for hotel REITs but not for industrial REITs, thus supporting Lambert's recommendation.\nC. Retail sales growth — Incorrect\nIncorrect because retail sales growth is a factor for industrial REITs but not for hotel REITs and is thus contrary to Lambert's recommendation.", "ko": "Lambert는 호텔 REIT를 추천했다. 소비자 신용은 호텔 REIT에만 해당하는 요인이라 추천을 뒷받침한다.", "trap": "두 유형 모두에 해당하는 요인(고용)은 선호의 근거가 못 된다.", "f": "", "why": {"A": "고용 증가는 호텔·산업 REIT 모두의 요인이라 한쪽을 지지하지 않습니다.", "C": "소매 판매 증가는 산업 REIT 요인이라 오히려 추천과 반대입니다."}, "orig": "Mock 1 Session 1 Q39", "conf": false}, {"id": "mock1-1-Q40", "src": "정답", "module": "AI", "tag": "롤 수익률 부호", "vig": 9, "stem": "The roll return on Gemini's natural gas futures contract on the 26 June trade date was:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "C", "en": "A. negative. — Incorrect\nIncorrect because the roll return is positive when the numerator is correctly calculated as Near-term futures contract closing price - Farther-term futures contract closing price. The roll return is only negative if the numerator calculation is incorrectly reversed and becomes Farther-term futures contract price - Near-term futures contract price = $2.338 − $2.546 = −$0.208 < 0.\nB. zero. — Incorrect\nIncorrect because the roll return would equal zero only if the June and July futures prices were equal on 26 June, which is not the case since the June futures price is $2.546 and the July futures price is $2.338.\nC. positive. — Correct\nCorrect because Roll return = [(Near-term futures contract closing price − Farther-term futures contract closing price) / Near-term futures contract closing price] × Percentage of the position in the futures contract being rolled.\n$2.546 − $2.338 = $0.208 > 0.\nAll the other factors in the formula are positive, so the roll return is positive.", "ko": "근월물(6월) $2.546 > 원월물(7월) $2.338 → backwardation → 롤 수익률 양(+).", "trap": "분자를 원월물 − 근월물로 뒤집으면 음수가 나온다.", "f": "롤 수익률 = (근월물 가격 − 원월물 가격) / 근월물 가격 × 롤 비중", "why": {"A": "분자를 원월물 − 근월물로 거꾸로 계산한 결과입니다.", "B": "두 가격이 같을 때만 0입니다."}, "orig": "Mock 1 Session 1 Q40", "conf": false}, {"id": "mock1-1-Q41", "src": "정답", "module": "ETH", "tag": "IV(A) 충실 의무: 퇴사 시 행동", "vig": 10, "stem": "When leaving StockCo, Benoit violates the Standards in her actions related to:", "opts": {"A": "her friend only.", "B": "her brother only.", "C": "both her friend and her brother."}, "ans": "C", "en": "A. her friend only. — Incorrect\nIncorrect because Benoit’s actions related to both her friend and her brother violate Standard IV(A) Loyalty.\nB. her brother only. — Incorrect\nIncorrect because Benoit’s actions related to both her friend and her brother violate Standard IV(A) Loyalty.\nC. both her friend and her brother. — Correct\nCorrect because both of Benoit’s actions violate Standard IV(A) Loyalty.\nHer friend: Standard IV(A) Loyalty states that members must not cause harm to their employer. Standard IV(A) requires Benoit to protect the interests of StockCo by refraining from any conduct that would injure the firm. The Standard specifies that members must not divulge confidential information. Although there are rumors about the merger, Benoit knows from senior management meetings that the merger will take place next year. She is therefore divulging confidential information to her friend. Benoit is in violation of Standard IV(A) for disclosing confidential firm information through his personal blog.\nHer brother: Standard IV(A) Loyalty states that members must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities and must not cause harm to their employer. The Standard prohibits Benoit from solicitation of the employer’s clients prior to cessation of employment. A member or candidate who is contemplating seeking other employment must not contact existing clients or potential clients prior to leaving his or her employer for purposes of soliciting their business for the new employer. In this case, Benoit’s brother is a client and Benoit most likely causes harm to StockCo by causing her brother to close his existing account and bringing his money to BCT.", "ko": "친구: 소문만 있는 합병을 내부 회의로 '확정'된 사실로 알고 문자로 알렸다 → 회사 기밀 누설. 동생: 동생은 StockCo 고객인데, 퇴사 전에 계좌를 닫고 BCT로 옮기라고 권유했다 → 퇴사 전 고객 유치. 둘 다 Standard IV(A) Loyalty 위반.", "trap": "퇴사 준비(회사 설립 계획)는 허용되지만, 재직 중 기밀 누설과 고객 유치 권유는 안 된다. 가족이어도 고객이면 같다.", "f": "", "why": {"A": "동생(StockCo 고객)에게 퇴사 전 계좌 이전을 권유한 것도 IV(A) 위반입니다.", "B": "친구에게 확정된 합병 사실을 알린 것도 기밀 누설로 IV(A) 위반입니다."}, "orig": "Mock 1 Session 1 Q41", "conf": false}, {"id": "mock1-1-Q42", "src": "오답", "module": "ETH", "tag": "I(B) 독립성: 발행사 출장 경비", "vig": 10, "stem": "Which procedure in the BCT compliance manual is not consistent with the Standards?", "opts": {"A": "Procedure 1", "B": "Procedure 2", "C": "Procedure 3"}, "ans": "C", "en": "A. Procedure 1 — Incorrect\nIncorrect because Procedure 1 is consistent with Standard I(B) Independence and Objectivity, which does not preclude customary, ordinary business-related entertainment as long as its purpose is not to influence or reward members or candidates. Firms should consider a strict value limit for acceptable gifts that is based on the local or regional customs and should address whether the limit is per gift or an aggregate annual value. BCT’s procedure is that analysts may accept gifts in the form of business-related entertainment and a maximum annual value is listed by the compliance office.\nB. Procedure 2 — Incorrect\nIncorrect because Procedure 2 is consistent with Standard I(B) Independence and Objectivity. A policy which specifies that purchases of a company’s stock through a private placement are capped at a maximum per purchase as listed by the compliance office is an example of a formal policy related to employee purchases of equity or equity-related IPOs. The Standard states that firms should develop formal policies related to employee purchases of equity or equity-related IPOs. Strict limits should be imposed on investment personnel acquiring securities in private placements.\nC. Procedure 3 — Correct\nCorrect because Procedure 3 is not consistent with Standard I(B) Independence and Objectivity. Allowing analysts to accept modest commercial transportation and hotel accommodation paid by the issuer when attending meetings at an issuer’s headquarters is not consistent with Standard I(B). The recommended procedures for Standard I(B) state: When attending meetings at an issuer’s headquarters, members and candidates should pay for commercial transportation and hotel charges. No corporate issuer should reimburse members or candidates for air transportation.", "ko": "발행사 본사 방문 시 상업 교통·숙박비는 본인(회사)이 내야 한다. 발행사가 '적당한' 교통·숙박을 대 줘도 된다는 Procedure 3이 Standard I(B) 위반.", "trap": "통상적인 업무 접대(1)와 사모 매입 한도 정책(2)은 권장 절차와 맞다. 발행사가 출장비를 대는 것만 안 된다.", "f": "", "why": {"A": "통상적 업무 접대는 영향력 행사 목적이 아니면 I(B)에서 허용됩니다.", "B": "사모 매입 한도를 두는 정책은 I(B)가 권장하는 직원 매입 관리 절차입니다."}, "orig": "Mock 1 Session 1 Q42", "conf": true}, {"id": "mock1-1-Q43", "src": "정답", "module": "ETH", "tag": "III(E) 기밀 유지", "vig": 10, "stem": "Who violates the Standard relating to confidentiality during Benoit's first month at BCT?", "opts": {"A": "Lee only", "B": "Benoit only", "C": "Both Lee and Benoit"}, "ans": "C", "en": "A. Lee only — Incorrect\nIncorrect because both Lee's and Benoit’s actions violate Standard III(E) Preservation of Confidentiality.\nB. Benoit only — Incorrect\nIncorrect because both Lee's and Benoit’s actions violate Standard III(E) Preservation of Confidentiality.\nC. Both Lee and Benoit — Correct\nCorrect because both Lee and Benoit violate Standard III(E) Preservation of Confidentiality with their actions.\nLee: Standard III(E) Preservation of Confidentiality requires that client information must be kept confidential and shared only under specific circumstances. If a client of StockCo expressly authorizes StockCo to disclose information to Benoit, StockCo may follow the terms of the authorization and provide the information to Benoit. However, nothing in the case indicates that Benoit’s access to personal information about StockCo’s clients is done with their knowledge. Because Benoit is no longer employed by StockCo, it would be improper for her to have access to confidential client information. Lee violates the Standard as he is responsible for managing access to the database. This is because the Standard specifies that members and candidates need to understand and follow their firm’s electronic information communication and storage procedures. The firm has indicated that the personal client information is confidential and, since Benoit is no longer employed by StockCo, Lee should have removed Benoit's access to the database.\nBenoit: Standard III(E) Preservation of Confidentiality does not prevent Benoit from using an external marketing company to provide cards or gifts for prospective clients. The Standard does not specify that external companies cannot be used for this specific task. However, the external company is given access to the portfolio value of clients by Benoit. That detail is a violation of Standard III(E), which requires that client information must be kept confidential and shared only under specific circumstances. Note that Benoit also likely violates the Standard in this case since she should not check her own list against StockCo’s internal data system after leaving StockCo.", "ko": "Lee: 데이터베이스 관리자로서 퇴사한 Benoit의 접근 권한을 지우지 않아 기밀 고객정보 접근을 방치했다. Benoit: 외부 마케팅 회사에 고객별 포트폴리오 금액을 넘겼다(외부 업체 이용 자체는 괜찮음). 퇴사 후 내부 시스템으로 명단을 대조한 것도 문제. 둘 다 Standard III(E) 위반.", "trap": "외부 마케팅 업체를 쓰는 것 자체는 허용된다. 문제는 고객 포트폴리오 금액 같은 기밀 정보를 넘긴 것.", "f": "", "why": {"A": "Benoit의 행동도 III(E) 위반입니다.", "B": "Lee의 행동도 III(E) 위반입니다."}, "orig": "Mock 1 Session 1 Q43", "conf": false}, {"id": "mock1-1-Q44", "src": "정답", "module": "ETH", "tag": "I(C) 허위표시: AI 사용·오류·수익 보장", "vig": 10, "stem": "Regarding BCT's social media page, which of the following is consistent with the Standards?", "opts": {"A": "The use of the AI program", "B": "The treatment of the error in the research report", "C": "The statement regarding transaction costs and returns"}, "ans": "A", "en": "A. The use of the AI program — Correct\nCorrect because Standard I(C) Misrepresentation states that Kiprotich must not knowingly make any misrepresentation related to investment analysis, recommendations, or actions. The Standard states that Kiprotich must not copy (or represent as their own) original ideas or material without permission and must acknowledge and identify the source of ideas or material that is not their own. Using and crediting the online generative AI program to summarize his report is not a violation.\nB. The treatment of the error in the research report — Incorrect\nIncorrect because Standard I(C) Misrepresentation states that Kiprotich must not knowingly make any misrepresentation related to investment analysis, recommendations, or actions. Kiprotich should not knowingly misrepresent information of a security in electronic communications. Knowingly means that Kiprotich either knows or should have known that the misrepresentation was being made. Actions undertaken through social media that knowingly misrepresent investment recommendations or professional activities are considered a violation of Standard I(C).\nKiprotich does not correct (i.e., resolve) the error in the report posted on the social media page when he becomes aware of it. He therefore implicitly endorses and approves the content of the report. That is effectively a communication made by Kiprotich and he is therefore responsible for the inaccurate content. Once the error is discovered, Kiprotich must take steps to cease distribution of the incorrect material and correct the error by informing those who have received the erroneous information.\nC. The statement regarding transaction costs and returns — Incorrect\nIncorrect because Standard I(C) Misrepresentation states that Kiprotich must not knowingly make any misrepresentation related to investment analysis, recommendations, or actions. Standard I(C) prohibits Kiprotich from guaranteeing clients any specific return on volatile investments. Stating that investors will recover their transaction costs with higher investment returns from cryptocurrencies is a guarantee offered by Kiprotich. If Kiprotich were to rephrase the statement to include a qualifying statement, such as in my opinion, investors may earn, it would not be in violation of the Standards.", "ko": "AI 프로그램으로 요약하고 그 출처를 밝힌 것은 I(C)에 맞는다. 알게 된 오류를 고치지 않은 것과 거래비용을 더 높은 수익으로 회수한다는 보장성 표현은 I(C) 위반.", "trap": "오류를 알고도 방치하면 그 내용을 묵시적으로 승인한 것으로 본다.", "f": "", "why": {"B": "오류를 알고도 고치지 않아 묵시적으로 승인한 셈이라 I(C) 위반입니다.", "C": "변동성 있는 투자에서 수익을 보장하는 표현은 I(C) 위반입니다."}, "orig": "Mock 1 Session 1 Q44", "conf": false}], "vignettes": ["Janet Kuspa is an Australia-based manager of globally diversified portfolios.\nOne year ago, Kuspa hedged the currency risk of a Australian dollar (AUD) 50,000,000 long position by selling AUD one year forward at an all-in forward price of 0.7530 USD/AUD (0.7530 USD per 1 AUD). Now, nine months before the forward's settlement date, Kuspa marks the forward position to market based on the data in Exhibit 1 (MRR is the market reference rate).\nExhibit 1\n\tExchange Rate Data (USD/AUD)\t\nMaturity\tBid\tOffer\nSpot\t0.7233\t0.7234\n9 months (forward points)\t+7\t+8\n\tOther Data\t\nInterest Rate\tUS\tAustralia\nMRR (annual rate)\t0.28%\t0.10%\nA few days later, Kuspa evaluates a carry trade strategy that involves borrowing AUD for one year and converting it to USD to earn the US MRR. She calculates the expected 1-year all-in percentage return of this strategy, based on the following:\nThe 1-year MRR is 0.31% for the USD\nThe 1-year MRR is 0.09% for the AUD\nThe current mid-market USD/AUD spot rate is 0.7235\nKuspa's prediction is that the USD/AUD spot rate will be 0.7243 at the end of one year.\nKuspa next evaluates three countries with floating exchange rates, as summarized in Exhibit 2. She uses the Mundell-Fleming model to forecast the short-term monetary and fiscal policy impacts on each of their domestic currencies.\nExhibit 2\nEconomic Characteristic\tCountry A\tCountry B\tCountry C\nCapital mobility\tHigh\tLow\tLow\nMonetary policy\tExpansionary\tExpansionary\tRestrictive\nFiscal policy\tRestrictive\tRestrictive\tRestrictive\nFinally, Kuspa analyzes the risks related to the currencies of three emerging market countries, summarized in Exhibit 3. These countries have recently experienced increased global investor interest and significant foreign capital inflows. Kuspa uses the information in Exhibit 3 to evaluate the potential negative effects of these inflows.\nExhibit 3\nRisk Characteristic\tCountry D\tCountry E\tCountry F\nEquity market returns (5-year compound annual growth rate)\t20%\t7%\t19%\nExternal debt (% of GDP)\t120%\t60%\t300%\nForeign exchange reserves (% average daily foreign exchange turnover in domestic currency)\t27%\t30%\t30%", "Margaret Smith is a consultant specializing in private company valuations. She evaluates Lytham Corporation, a small, family-owned company whose CEO is a member of the controlling family. Smith wants to normalize Lytham's reported operating income to compare it with public companies in the same industry. She notes the following items:\nThe current annual salary of Lytham's CEO is $600,000. The annual salary of a similarly qualified CEO of a comparable public company is $1,000,000.\nLytham owns a luxury apartment in Singapore that is used by the CEO for both business and personal travel. The apartment would be sold if Lytham were a public company. The annual operating costs for the property are $200,000 per year and the annual depreciation expense is $200,000.\nLytham pays 15% of its net income in dividends to its owners. Smith believes the payout ratio would be closer to 50% if Lytham were a public company.\nSmith calculates the required return on equity for Lytham using the expanded CAPM and the information in Exhibit 1. Smith determines that the appropriate industry risk premium is zero.\nExhibit 1\nBeta\t1.3\nRisk-free rate\t6%\nEquity risk premium\t4%\nSmall-cap risk premium\t3%\nCompany-specific risk premium\t1%\nCalcyte is a publicly traded company with an equity value of $9,043 million. Smith conducts a valuation of Calcyte for a private buyout client who is interested in purchasing a controlling stake. She determines the relevant discount for lack of control to be 23% and the relevant discount for lack of marketability to be 20%.\nSmith also values Ramabo Corporation, a privately held company with annual revenues of $10 million. Smith identifies comparable public companies and calculates an average EV/Sales multiple for each of Ramabo's three business segments. She uses these multiples and the revenue generated by each segment in Exhibit 2 to calculate Ramabo's EV based on the guideline public company method.\nExhibit 2\n\tRevenue (in $ Millions)\tEV/Sales\nSegment A\t6\t3.3\nSegment B\t3\t1.2\nSegment C\t1\t4.9", "Fazly Ahmad is an equity analyst researching Rose Mass Rapid Limited (RMRL), a Canadian transport operator. RMRL reports under IFRS and has a 31 December year end. Ahmad compares RMRL to one of its competitors, Orchid Mass Transit Inc., which reports under US GAAP and also has a 31 December year end.\nOn 1 January of the current year, RMRL purchased a 30% interest in Begonia Bus Inc.'s outstanding common equity for $12,000,000. The excess purchase price was $2,150,000. Half of the excess was attributable to Begonia's plant and equipment, and the other half was attributable to land. Begonia depreciates its plant and equipment using the straight-line method with a remaining useful life of 10 years and zero residual value. RMRL has the ability to exercise significant influence over Begonia. Ahmad expects Begonia to report net income of $1,500,000 for the current year and not pay any dividends. Ahmad assumes Begonia does not have any intercompany transactions with RMRL. He then estimates the carrying value of RMRL's investment in Begonia at the end of the current year.\nDuring the current year, RMRL acquired 80% of the outstanding shares of Petunia Transit Co. in exchange for common shares of RMRL. At the time of the acquisition, RMRL accounted for the acquisition using the partial goodwill method (Method 1). Also during the current year, Orchid acquired a controlling interest in another company and accounted for the acquisition using the full goodwill method (Method 2). Ahmad considers whether differences in the accounting treatment of these acquisitions could affect certain financial metrics.\nAhmad reviews the trend in RMRL's balance-sheet-based and cash-flow-based accruals ratios, as well as the trend in the Beneish M-scores and Altman Z-scores over the past two years, using the data in Exhibit 1.\nExhibit 1\n\tMost Recent Year\tTwo Years Ago\nBalance-sheet-based accruals ratio\t4.3%\t0.6%\nCash-flow-based accruals ratio\t1.7%\t–2.5%\nBeneish M-score\t–1.94\t–1.43\nAltman Z-score\t1.54\t1.85", "John Smith, an advisor at Godel Securities, is meeting with one of his clients, Client A, to provide advice on fixed income investments. Client A currently has investments in Country 1 and Country 2. Smith first analyzes the fixed income market in Country 1. In Exhibit 1, he gathers spot rates (with annual compounding) for government zero-coupon bonds, as well as swap spreads, for maturities of one, two, and three years. He uses that information to construct a forward curve.\nExhibit 1\nMaturity (years)\t1\t2\t3\nGovernment spot rate\t3%\t5%\t8%\nSwap spread\t0.20%\t0.25%\t0.40%\nSmith tells Client A that there are a number of theories that attempt to explain the shape of the yield curve. While the computation of forward rates is straightforward, Smith states that he believes forward rates are upwardly biased predictors of future spot rates.\nIn Country 2, there is uncertainty about how the government will manage inflation. Smith evaluates the effect on Client A's portfolio from changes in the yields on 1-year, 3-year and 10-year securities. Selected key rate durations for the portfolio as well as Smith's expected change in interest rates at each key rate are shown in Exhibit 2.\nExhibit 2\nSecurity\tKey Rate Duration\tExpected Key Rate Change\n1-year\t0.50\t1.00%\n3-year\t0.75\t0.75%\n10-year\t2.50\t–0.25%\nSmith computes the percentage change in the value of the portfolio. He observes that the average change in the three rates is 0.50%.\nSmith also advises Client A on an actively managed corporate bond portfolio in Country 2 using the swap spread as a measure of risk. Smith discusses the implied credit and liquidity risk with Client A using the 5-year swap rate as an example. The 5-year government and corresponding fixed swap rate at selected times over the last 12 months is presented in Exhibit 3.\nExhibit 3\nPeriod\tGovernment Bond Yield (%)\tFixed Swap Rate (%)\n1 month ago\t7.48\t8.28\n6 months ago\t8.51\t8.86\n12 months ago\t8.55\t8.84", "James Ryan is a portfolio manager who is reviewing the risk exposure of his stock and bond portfolios, and evaluating new trading strategies.\nWhen analyzing his current stock portfolio, Ryan determines that the monthly 5% VaR is $10.6 million.\nRyan's current bond portfolio has a value of $260 million. He uses the parametric method to estimate the daily 5% VaR based on a daily expected return of 0.0218% and a daily standard deviation of returns of 0.8246%. He assumes that portfolio returns follow a normal distribution and that a 5% VaR is 1.65 standard deviations below the expected value.\nRyan considers the implications of adding bonds with embedded options to his current bond portfolio. He is concerned that adding these bonds will cause portfolio performance to deviate significantly from the benchmark. Given this concern, he wants to use an extension of VaR that will measure the extent of this deviation.\nRyan is in the process of backtesting a new multifactor portfolio strategy. For his investment universe of liquid securities, he assesses the performance of a large number of different strategies that use a wide range of factors and rebalancing periods.\nAfter completing his backtesting, Ryan identifies three factor strategies that are all expected to generate a similar mean return and standard deviation. He uses the metrics in Exhibit 1 to evaluate which strategy would provide the most attractive statistical properties for his risk-averse clients.\nExhibit 1\n\tStrategy X\tStrategy Y\tStrategy Z\nSkewness\t–0.9\t2.4\t2.4\nKurtosis\t12.7\t20.3\t12.7\nMaximum drawdown\t35.3%\t31.4%\t30.2%", "Anita Daani, a research analyst, is evaluating the financial institutions in her coverage universe. She begins with an analysis of KTR Insurance, a property and casualty (P&C) insurance company. KTR reports under IFRS with a fiscal year end of 31 December. The company has two employee compensation plans:\nPlan A - a defined benefit pension plan\nPlan B - a share-based compensation plan which grants restricted stock units (RSUs)\nFor the most recent year, Daani calculates the amount recognized by KTR as an operating expense in its income statement related to Plan A. She observes that Plan A had a current service cost of $10 million and a past service cost of $2 million for the most recent year.\nDaani next assesses the dilutive effect of the share-based compensation plan on KTR's financial statements. She uses the treasury stock method and the data for the most recent year for Plan B in Exhibit 1. Daani assumes that KTR has no other potentially dilutive securities outstanding besides the RSUs granted under Plan B.\nExhibit 1\nBasic shares outstanding at end of year\t2,700 million\nNumber of unvested RSUs at end of year\t150 million\nAverage unrecognized share-based compensation expense\t$840 million\nAverage share price during the most recent year\t$7\nOn 1 January of the current year, KTR grants 2 million new RSUs to employees under Plan B. The share price on the grant date was $8 and the vesting period is 4 years. Daani calculates the effect of the new RSU grants under Plan B on KTR's financial statements for the current year.\nDaani next analyzes KTR's competitive position in the P&C insurance industry. She uses data in Exhibit 2 to compare KTR and its peers in their efficiency of obtaining new premiums.\nExhibit 2\n\tKTR\tPeer Company 1\tPeer Company 2\nLoss and loss adjustment expense ratio\t59.5%\t65.4%\t61.9%\nUnderwriting expense ratio\t38.1%\t30.7%\t33.2%\nCombined ratio\t97.6%\t96.1%\t95.1%", "Susanne Blythe is a fixed income analyst with an institutional fixed-income manager. She evaluates bonds for potential inclusion in the firm's portfolio.\nBlythe is calibrating the binomial tree shown in Exhibit 1 to be consistent with observable prices of default-free bonds. In the tree, interest rate volatility is assumed to be 10% and branching from each node to a high state or a low state occurs with equal probability. She uses the tree to calculate the value of a default-free 3-year bond with a 3.5% annual coupon that is priced at par ($100).\nBlythe has determined that the 1-year forward rates at Year 0 and Year 1 are correct. In the next iteration of the calibration process, she needs to determine if the 1-year forward rates at Year 2 must be adjusted for the bond's calculated value to equal its market price.\n[IMAGE: CFA-IS-2023.04-FIIN-Kos+1-Case_2.png]\nYear zero: 2 point 4 5 zero zero percent. Arrow upward to: Year 1: 3 point 8 7 8 4 percent. Arrow downward to Year 1, 3 point 1 7 5 4 percent. From the top box in year 1, arrow upward to Year 2: 5 point 3 5 3 4 percent. Arrow downward to 4 point 3 8 3 zero percent. From the bottom box, arrow upward to the Year 2, 4 point 3 8 3 zero box. Arrow downward to 3 point 5 8 8 5 percent.\nBlythe evaluates three bonds just issued by Y Corporation. All three bonds have identical characteristics except for optionality, as shown in Exhibit 2.\nExhibit 2\nBond\tMaturity\tAnnual Coupon\tType of Bond\nBond 1\t3 years\t4.5%\tOption-free\nBond 2\t3 years\t4.5%\tPutable at 100 one year and two years from now\nBond 3\t3 years\t4.5%\tCallable at 102 one year and two years from now\nBlythe also evaluates a convertible bond issued by Z Corporation with the characteristics provided in Exhibit 3.\nExhibit 3\nMaturity\t5 years\nIssue price of convertible bond\t$1,000 (at par)\nCurrent convertible bond price\t$1,091\nInitial conversion price\t$25.00 per share\nShare price at issuance\t$17.40\nCurrent share price\t$18.50\nBlythe computes the market conversion premium ratio to compare the Z Corporation bond to other convertible bonds.", "Sebastian Traver is a financial analyst at Feldcroft Inc., a large, US-based construction company specializing in commercial and residential projects. He is reviewing the company's asset financing options and evaluating potential growth opportunities.\nFeldcroft is considering the purchase of a new corporate helicopter to access remote construction sites. Traver evaluates a proposal for a 10-year lease with payments of $125,000 at the end of each month. The helicopter has a fair value of $15 million, and the lessor would incur a direct cost of $750,000 at the beginning of the lease. The residual value of the helicopter at the end of the lease is expected to be $8,700,000. Feldcroft has an unsecured incremental borrowing rate of 8%.\nFeldcroft has operations in Country A, an emerging market that represents 10% of the company's revenue. To estimate the equity risk premium that should be used in calculating Feldcroft's cost of equity, Traver uses the country spread model with no adjustment for the relative volatility of Country A equity and bond returns. The current US equity risk premium is 5.94% and 10-year US Treasury bonds yield 3.50%. Country A recently issued a 10-year bond denominated in local currency that yields 7.55% and a 10-year bond denominated in US dollars that yields 5.15%.\nFeldcroft is considering acquiring a construction company that has sales of $7.00 per share. To estimate a fair takeover value for this target company, Traver uses comparable transaction analysis with equal weights on three transactions, as shown in Exhibit 1. He notes that Feldcroft's current price-to-sales (P/S) ratio is 1.35 and that transactions in the construction industry take place at an average takeover premium of 8%.\nExhibit 1\nVariable\tAcquired Company 1\tAcquired Company 2\tAcquired Company 3\nSales per share\t$6.30\t$12.98\t$9.01\nP/S ratio at acquisition price\t1.78\t1.84\t1.63\nFinally, Traver prepares a pro forma income statement reflecting the acquisition of the target construction company. He assumes the acquisition would generate cost synergies and be funded with new debt, which would include refinancing the target company's existing debt. After separating depreciation and amortization from operating expenses, Traver models selected pro forma income statement balances as follows:\nInterest expense: Add interest expense from the new debt issuance to the target company's current interest expense\nOperating expenses: Add cost synergies to and subtract cost dis-synergies from combined operating expenses\nDepreciation and amortization expense: Add amortization of acquired intangible assets to combined depreciation and amortization expense", "Megan Helmer is an analyst at Acuity Investments. She uses machine learning to build a model that categorizes companies according to whether their predicted ROE is low or high. The model uses multiple features to explain the variations in ROE. The model produces low error rates using training data, but much higher error rates using out-of-sample data.\nHelmer also builds a logistic regression model to predict the 1-year probability of default for junk bond issuers. She collects data for 70 issuers over the past five years and identifies those that defaulted within the subsequent year (DEFAULT = 1) and those that did not default (DEFAULT = 0). She uses two independent variables in the logistic regression model: the ratio of debt to total capital (LEVERAGE) and the interest coverage ratio (COVERAGE). The coefficients of the regression are shown in Exhibit 1. Using this model, Helmer then estimates the probability of default by ACME, an issuer with LEVERAGE of 0.8 and COVERAGE of 0.9.\nExhibit 1\n\tCoefficient\nIntercept\t–20.0\nLEVERAGE\t65.5\nCOVERAGE\t–35.0\nNext, Helmer builds a linear regression model for manufacturing companies (Model 1) to forecast the impact of inflation caused by supply chain disruptions on profit margin. She uses five years of quarterly data for 100 companies and the following model specification:\nModel 1: MARGINt = b0 + b1INPUTt + b2LOGISTICSt + εt,\nwhere MARGIN is profit margin, INPUT is raw material cost inflation, and LOGISTICS is freight cost inflation.\nHelmer assesses possible violations of regression assumptions in Model 1 and makes the following observations:\nObservation 1: There are significant deviations of the residuals from the diagonal in the Q-Q plot.\nObservation 2: The null hypothesis of the Breusch–Pagan test is rejected.", "Sarah Lambert is an investment advisor meeting with one of her clients, Edward Banner. Banner is considering adding real estate and commodities to his portfolio.\nReal Estate\nLambert researches REIT A, a hotel REIT, and notes that recent property market transaction volumes have been high. In addition, REIT A has recorded a number of one-time gains and charges. Lambert considers the potential impact these issues could have on different valuation approaches.\nLambert next reviews REIT B, an industrial REIT. She performs a price-to-adjusted funds from operations (P/AFFO) calculation based on the full-year financial information (in thousands) contained in Exhibit 1. The current share price is $74.65.\nExhibit 1\nFunds from operations\t$465,419\n(Gains)/Losses from sale of depreciable real estate\t$22,613\nNon-cash (straight-line) rent adjustment\t$14,705\nRecurring maintenance-type capital expenditures and leasing commissions\t$33,297\nShares outstanding\t100,000\nLambert carries out further analysis on the wider economy and forecasts that job creation, retail sales growth, and consumer credit will all be stronger than expected. Based on these forecasts, she recommends hotel REITs over industrial REITs.\nCommodities\nLambert then recommends an investment in the Gemini Commodity Futures Fund. According to Gemini's prospectus, the fund always takes a long position in the natural gas futures contract with the shortest maturity. At the contract maturity date, Gemini sells the existing contract and buys the new contract with the shortest maturity. In Exhibit 2, Lambert gathers prior-year price information from the natural gas futures market for two of Gemini's trade dates. All prices are in $ per million British thermal units as of the date listed.\nExhibit 2\nTrade Date\tSpot Price\tJune Futures Price\tJuly Futures Price\tAugust Futures Price\n28 May\t2.546\t2.489\t2.418\t1.957\n26 June\t2.546\t2.546\t2.338\t1.795", "Irina Benoit, CFA, is a senior research analyst at StockCo, an investment management firm. Multiple rumors have been circulating about a merger of StockCo with another firm. Benoit knows from internal senior management meetings that the merger will take place next year. As a result, Benoit has decided to leave StockCo and start her own investment management firm, Benoit Capital Traders (BCT). StockCo did not require Benoit to sign a non-compete agreement. During a family dinner, Benoit announces that she intends to start BCT after leaving StockCo. Benoit asks her brother to close his existing account at StockCo and bring his money to BCT once the new firm is operational. A week before Benoit leaves StockCo, she sends a message to a friend on her mobile phone: \"Goodbye StockCo—I'm glad I won't be here for the merger!\"\nUpon starting BCT, Benoit adopts the Standards with her firm and writes a compliance manual. She adds the following three procedures to BCT’s compliance manual.\nProcedure 1: Analysts may accept gifts in the form of business-related entertainment to a maximum value listed by the compliance office.\nProcedure 2: For all analysts, the purchase of a company’s stock through a private placement is capped at a maximum per private placement as listed by the compliance office.\nProcedure 3: When attending meetings at an issuer’s headquarters, analysts are allowed to accept modest commercial transportation and hotel accommodation paid by the issuer.\nDuring the first month of BCT's operations, Benoit creates a list of StockCo clients from memory to solicit their business. Benoit then uses an external marketing company to send each prospective client either a card or a coffee mug. She provides this marketing company with a list of clients with their approximate portfolio values. Benoit requests that the company send the coffee mugs to only those clients with portfolios larger than $1 million. During Benoit's employment at StockCo, she had access to the firm's internal data system that contains confidential personal information about StockCo’s clients. The database and its access are managed by Benoit's former department manager at StockCo, Mike Lee, CFA. Lee neglected to remove Benoit's access from the server and, as a result, Benoit discovers that she still has access to the system. Benoit checks the names on the client list that she created from memory against the list in StockCo’s internal data system and confirms that her list is complete and accurate. She then contacts Lee to request him to cancel her access.\nThree months later, Benoit hires and starts supervising two new analysts, Robert Kiprotich and Yoko Tanaka. Kiprotich’s first assignment is to write a report on a cryptocurrency. After writing the report, Kiprotich uses BCT’s social media page to promote the report. He starts by using an online generative artificial intelligence (AI) program to summarize his report and credits the generative AI program as the source of his summary. At the end of the summary, Kiprotich states that investors should not be concerned about the transaction costs of switching their investments because the higher returns from the cryptocurrency will more than offset the costs. He then posts the summary online, along with a link to the report. A week later, someone comments on the social media post, pointing out an error in the report. Kiprotich leaves the report unchanged since he intends to post a new report at the end of the week in which he will also correct the unintentional error."], "modules": {"QM": "Quantitative Methods", "ECO": "Economics", "CI": "Corporate Issuers", "FSA": "Financial Statement Analysis", "EQ": "Equity Valuation", "FI": "Fixed Income", "AI": "Alternative Investments", "PM": "Portfolio Management", "ETH": "Ethical and Professional Standards"}, "images": {"CFA-IS-2023.04-FIIN-Kos+1-Case_2.png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAw8AAAFlCAMAAACa8iTxAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAwBQTFRF////+/v79vb2+vr6/f39/v7++fn5/Pz89/f3+Pj49PT08vLy9fX16Ojozs7Orq6ur6+vqqqqq6ursbGxsLCwra2twsLC7e3t0NDQurq6srKy5+fn3d3d8/Pz4+PjysrKvb292dnZ1dXVvLy8rKyswcHBw8PD function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables + [IMAGE: 파일명]
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], im=/^\[IMAGE: (.+)\]$/.exec(l.trim());
    if(im){ flush(); if(IMG[im[1]]) html+='<p><img class="exh" src="'+IMG[im[1]]+'" alt="'+esc(im[1])+'"></p>'; continue; }
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]||m; }
function srcClass(s){ return s==="오답"?"src-wrong":"src-rel"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }
function isWrong(q){ return q.src==="오답"; }
function isConf(q){ var v=CONF.ids[q.id]; return v===undefined ? !!q.conf : !!v; }
function toggleConf(id){
  var q=BYID[id]; CONF.ids[id]=!isConf(q);
  if(CONF.ids[id]===!!q.conf) delete CONF.ids[id]; // 원래 값으로 돌아오면 덮어쓴 기록 삭제
  CONF.at=new Date().toISOString(); store.set(CONFKEY,CONF);
}
function confBtn(q){ return '<button class="btn conf'+(isConf(q)?' on':'')+'" id="bConf" title="헷갈린 문제로 표시/해제">'+(isConf(q)?'★ 헷갈림':'☆ 헷갈림')+'</button>'; }
function metaHtml(q, no){
  return '<div class="meta"><span class="qno">'+no+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span>'+
    (isConf(q)?'<span class="pill src-var">헷갈림</span>':'')+'<span class="tagline">'+esc(q.tag)+'</span><span style="flex:1"></span>'+confBtn(q)+'</div>';
}
// 범위: wrong = 오답만, wc = 오답+헷갈림, all = 전체
var FILT = {wrong:"오답만", wc:"오답+헷갈림", all:"전체"};
function pick(f, m){
  return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (f==="all" || isWrong(q) || (f==="wc" && isConf(q))); }).map(function(q){return q.id;});
}

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
var MODE = {all:"전체 풀기", list:"학습한 목록 풀기", wrong:"오답만 풀기", wc:"오답+헷갈림 풀기", review:"틀린 문제 다시 풀기", rwc:"틀린+헷갈림 다시 풀기"};
function header(){
  if(UI.view==="study"){ var T=UI.study; $("nOk").textContent="-"; $("nBad").textContent="-"; $("pbar").style.width=((T.i+1)/T.ids.length*100)+"%"; $("ptxt").textContent=(T.i+1)+" / "+T.ids.length; $("pmode").textContent="해설 보며 학습 · "+T.label; return; }
  if(!S || !S.order){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=MODE[S.mode]||"";
}

/* ---------- setup screen ---------- */
function setup(){
  UI.view=null; saveUI();
  S && (S.view="setup", save());
  var wrongAll=Q.filter(isWrong).length, confAll=Q.filter(isConf).length;
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 토픽 ('+Q.length+')</option>'+Object.keys(MN).filter(function(m){return counts[m];}).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  var f = UI.filt || "wc";
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">'+esc(DATA.meta.title)+' 오답 퀴즈</h2>'+
   '<p class="muted">전체 '+Q.length+'문제 · 내가 틀린 문제 '+wrongAll+' · 헷갈린 문제 '+confAll+'. 정답과 영어 해설은 CFA Institute 원문, 한국어 해설은 원문을 바탕으로 작성했습니다. 헷갈림 표시는 문제 화면의 ☆ 버튼으로 켜고 끌 수 있습니다.</p>'+
   '<label>토픽 <select id="selMod">'+opts+'</select></label>'+
   '<div class="seg" id="segF">'+Object.keys(FILT).map(function(k){return '<button class="btn'+(k===f?' on':'')+'" data-f="'+k+'">'+FILT[k]+' <span id="n_'+k+'"></span></button>';}).join("")+'</div>'+
   '<p class="kbd">풀기: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 / 학습: ← → 이동</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">풀기</button> <button class="btn" id="bStudy">해설 보며 학습</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function labels(){
    var m=$("selMod").value;
    Object.keys(FILT).forEach(function(k){ $("n_"+k).textContent="("+pick(k,m).length+")"; });
    var n=pick(f,m).length; $("bStart").textContent=FILT[f]+" 풀기 ("+n+")"; $("bStudy").textContent=FILT[f]+" 해설 보며 학습 ("+n+")";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(b){ b.onclick=function(){
    f=b.getAttribute("data-f"); UI.filt=f; saveUI();
    Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(x){ x.classList.toggle("on", x===b); }); labels(); }; });
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){
    var order=pick(f,$("selMod").value); if(!order.length){ alert("이 범위에는 문제가 없습니다."); return; }
    S=fresh(order,f); save(); render();
  };
  $("bStudy").onclick=function(){
    var m=$("selMod").value, ids=pick(f,m); if(!ids.length){ alert("이 범위에는 문제가 없습니다."); return; }
    startStudy(ids, FILT[f]+(m==="all"?"":" · "+mname(m)));
  };
  header();
}

/* ---------- study screen: 문제 + 정답 + 해설을 같이 본다 ---------- */
function startStudy(ids, label){ UI.view="study"; UI.study={ids:ids, i:0, label:label}; saveUI(); study(); window.scrollTo(0,0); }
function study(){
  var T=UI.study, id=T.ids[T.i], q=BYID[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case"><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    return '<div class="opt'+(L===q.ans?' sel-ok':'')+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+
      (L!==q.ans && q.why && q.why[L] ? '<span class="whyl">'+esc(q.why[L])+'</span>' : '')+'</span></div>';
  }).join("");
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  $("view").innerHTML='<section class="card">'+metaHtml(q, esc(q.orig))+vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div>'+
    '<div class="fb ok"><h3>정답 '+q.ans+'</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+trap+
    '<details class="en"><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details></div>'+
    '<div class="nav"><button class="btn" id="sPrev" '+(T.i===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+(T.i+1)+' / '+T.ids.length+'</span>'+
    '<button class="btn primary" id="sNext" '+(T.i===T.ids.length-1?'disabled':'')+'>다음 →</button></div>'+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="btn" id="sQuiz">이 목록 풀기 ('+T.ids.length+')</button><button class="btn" id="sHome">처음 화면</button></div></section>';
  $("sPrev").onclick=function(){ studyGo(T.i-1); };
  $("sNext").onclick=function(){ studyGo(T.i+1); };
  $("sQuiz").onclick=function(){ UI.view=null; saveUI(); S=fresh(T.ids.slice(),"list"); save(); render(); };
  $("sHome").onclick=setup;
  $("bConf").onclick=function(){ toggleConf(id); study(); };
  header();
}
function studyGo(i){ var T=UI.study; if(i<0||i>=T.ids.length) return; T.i=i; saveUI(); study(); window.scrollTo(0,0); }

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card">'+metaHtml(q,'Q'+(S.idx+1))+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll("button.opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  $("bConf").onclick=function(){ toggleConf(id); quiz(); };
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  var wcIds=S.order.filter(function(id){var r=S.round[id];return (r&&!r.correct) || isConf(BYID[id]);});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"||S.mode==="rwc"?"다시 풀기 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">토픽별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bRetryWC" '+(wcIds.length?'':'disabled')+'>틀린 문제 + 헷갈림 다시 풀기 ('+wcIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  function retry(ids, mode){ if(!ids.length) return; S.order=ids; S.idx=0; S.mode=mode; S.round={}; S.finished=false; S.view="quiz"; save(); render(); }
  $("bRetry").onclick=function(){ retry(wrongIds,"review"); };
  $("bRetryWC").onclick=function(){ retry(wcIds,"rwc"); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S || !S.order){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, confused:isConf(q), selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak,
    confusedOverrides:CONF.ids
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{이름}/latest.json)의 마지막 attempt로 진행 상태와 헷갈림 표시를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  if(at.confusedOverrides){ CONF={ids:at.confusedOverrides, at:at.exportedAt||""}; store.set(CONFKEY,CONF); }
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:MODE[at.mode]?at.mode:"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  UI.view=null; saveUI();
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기·헷갈림 변경보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(CONF.at>t) t=CONF.at;
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(UI.view!=="study" && (!S || S.view==="setup")){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(UI.view==="study" && UI.study && UI.study.ids && UI.study.ids.length) return study();
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} UI.view=null; saveUI(); S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(UI.view==="study"){ if(e.key==="ArrowRight") studyGo(UI.study.i+1); else if(e.key==="ArrowLeft") studyGo(UI.study.i-1); return; }
  if(!S||S.view!=="quiz"||!document.querySelector("button.opt")) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>

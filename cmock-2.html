><td>5,000<\/td><\/tr><tr><td>Cash and short-term investments<\/td><td>300<\/td><td>350<\/td><td>520<\/td><\/tr><tr><td>Total liabilities<\/td><td>2,600<\/td><td>2,800<\/td><td>2,400<\/td><\/tr><tr><td>Total debt<\/td><td>1,300<\/td><td>1,350<\/td><td>860<\/td><\/tr><tr><td>Total shareholders' equity<\/td><td>1,700<\/td><td>1,900<\/td><td>2,600<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Velmora Werke AG — Notes Data<br>Panel A: Defined Benefit Pension Plan<\/caption><thead><tr><th>Defined benefit plan, 2025 (€ millions)<\/th><th>Obligation<\/th><th>Plan assets<\/th><\/tr><\/thead><tbody><tr><td>Balance at 1 January 2025<\/td><td>1,250<\/td><td>1,050<\/td><\/tr><tr><td>Current service cost<\/td><td>46<\/td><td>—<\/td><\/tr><tr><td>Interest cost / interest income at 4.0%<\/td><td>50<\/td><td>42<\/td><\/tr><tr><td>Actuarial loss on obligation<\/td><td>36<\/td><td>—<\/td><\/tr><tr><td>Return on plan assets excluding interest income<\/td><td>—<\/td><td>(12)<\/td><\/tr><tr><td>Employer contributions<\/td><td>—<\/td><td>64<\/td><\/tr><tr><td>Benefits paid<\/td><td>(52)<\/td><td>(52)<\/td><\/tr><tr><td>Balance at 31 December 2025<\/td><td>1,330<\/td><td>1,092<\/td><\/tr><\/tbody><\/table><table><caption>Panel B: Share Option Grants (four-year cliff vesting, no forfeitures expected)<\/caption><thead><tr><th>Grant date (1 January)<\/th><th>Options granted (millions)<\/th><th>Exercise price (€)<\/th><th>Grant-date fair value per option (€)<\/th><\/tr><\/thead><tbody><tr><td>2022<\/td><td>2.0<\/td><td>21.50<\/td><td>6.40<\/td><\/tr><tr><td>2023<\/td><td>2.4<\/td><td>23.00<\/td><td>6.50<\/td><\/tr><tr><td>2024<\/td><td>2.5<\/td><td>25.40<\/td><td>7.20<\/td><\/tr><tr><td>2025<\/td><td>2.6<\/td><td>28.20<\/td><td>8.10<\/td><\/tr><tr><td>2026<\/td><td>2.8<\/td><td>At-the-money on grant date<\/td><td>9.60 (estimate)<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s15-q1", "rel": [0, 3], "los": "FSA-R6-L1", "tier": 1, "type": "calc", "stem": "Holding the other DuPont components at their 2025 values, if Velmora's financial leverage had remained at its 2024 level, Velmora's 2025 ROE would have been <i>closest<\/i> to:", "options": {"A": "12.9%.", "B": "16.0%.", "C": "18.6%."}}, {"id": "m2-s15-q2", "rel": [0, 3], "los": "FSA-R6-L3", "tier": 1, "type": "calc", "stem": "Velmora's 2025 balance-sheet-based accruals ratio is <i>closest<\/i> to:", "options": {"A": "1.4%.", "B": "6.3%.", "C": "29.2%."}}, {"id": "m2-s15-q3", "rel": [1, 4], "los": "FSA-R2-L3", "tier": 2, "type": "calc", "stem": "Velmora's forecast share-based compensation expense for 2026 is <i>closest<\/i> to:", "options": {"A": "€9.4 million.", "B": "€20.4 million.", "C": "€24.7 million."}}, {"id": "m2-s15-q4", "rel": [0, 2, 4], "los": "FSA-R2-L4", "tier": 2, "type": "concept", "stem": "Which of the following <i>best<\/i> describes how Velmora reports its defined benefit plan in its 2025 financial statements?", "options": {"A": "A net pension liability of €238 million, with the actuarial loss and return shortfall recognized in other comprehensive income.", "B": "A net pension liability of €238 million, with the actuarial loss and return shortfall recognized in profit or loss.", "C": "A pension liability of €1,330 million, with the actuarial loss and return shortfall recognized in other comprehensive income."}}]}, {"set": 16, "session": 2, "topic": "Derivatives", "code": "DER", "vignette": "<p>Hana Nakagawa heads the derivatives desk at Ostervik Markets, a dealer bank. She is reviewing three client positions with Tomás Ibarra, a junior trader.<\/p>\n<p><b>Equity Swap<\/b><\/p>\n<p>Sixteen months ago, Ostervik entered into a three-year equity swap with Delmont Pension Trust. Ostervik receives a fixed rate of 2.80% and pays the total return on the BX 300 equity index; settlement is annual, and the notional amount is €50 million. The index was 4,000 when the swap was initiated and 4,200 at the first annual settlement four months ago. The index now stands at 4,420. Present value factors for the remaining settlement dates are shown in Exhibit 1.<\/p>\n<p><b>Currency Swap<\/b><\/p>\n<p>Quaresma Instruments, a US company that is building a plant in Switzerland, asks Ostervik for a new three-year fixed-for-fixed currency swap with annual payments. At initiation, Quaresma will pay USD40 million to Ostervik and receive the equivalent Swiss franc amount at the current spot rate of CHF0.8800 per USD. Quaresma will then pay fixed CHF interest and receive fixed USD interest, and the notional amounts will be re-exchanged at maturity. Each fixed rate will be set so that the swap has zero value at initiation.<\/p>\n<p><b>Options on Single Shares and on Index Futures<\/b><\/p>\n<p>A client wants to buy 200,000 six-month European puts on Halvard Steel shares with an exercise price of €85. Halvard shares trade at €80. Ibarra models the price with a one-period binomial tree in which the share price either rises by 20% or falls by 15% over the six months. The risk-free rate is 4.0% per year, compounded annually. Ibarra's own estimate of the probability of a price increase is 60%.<\/p>\n<p>Ostervik has also sold European puts on BX 300 index futures to another client. Ibarra makes the following statements about valuing them with the Black model:<\/p>\n<ul><li>Statement 1: \"The futures component of each put is the present value of the futures price multiplied by N(d<sub>1<\/sub>).\"<\/li>\n<li>Statement 2: \"Each put is equivalent to a long bond position combined with a short futures position, so the puts we sold give us exposure similar to a long futures position.\"<\/li>\n<li>Statement 3: \"Because a futures contract requires no initial investment, the futures price in the model is not discounted; only the exercise price is discounted.\"<\/li><\/ul>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Present Value Factors for the Delmont Equity Swap<\/caption><thead><tr><th>Remaining settlement (from today)<\/th><th>Present value factor (€)<\/th><\/tr><\/thead><tbody><tr><td>8 months<\/td><td>0.9850<\/td><\/tr><tr><td>20 months<\/td><td>0.9580<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Present Value Factors for the Quaresma Currency Swap<\/caption><thead><tr><th>Maturity (years)<\/th><th>CHF present value factor<\/th><th>USD present value factor<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0.9950<\/td><td>0.9597<\/td><\/tr><tr><td>2<\/td><td>0.9801<\/td><td>0.9238<\/td><\/tr><tr><td>3<\/td><td>0.9535<\/td><td>0.8914<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s16-q1", "rel": [2, 9], "los": "DER-R1-L7", "tier": 1, "type": "calc", "stem": "The current value of the equity swap to Ostervik is <i>closest<\/i> to:", "options": {"A": "−€4.63 million.", "B": "−€2.00 million.", "C": "€0.10 million."}}, {"id": "m2-s16-q2", "rel": [4, 10], "los": "DER-R1-L6", "tier": 2, "type": "calc", "stem": "The annual fixed interest payment that Quaresma will make on the Swiss franc leg of the swap is <i>closest<\/i> to:", "options": {"A": "CHF0.56 million.", "B": "CHF0.72 million.", "C": "CHF1.38 million."}}, {"id": "m2-s16-q3", "rel": [6], "los": "DER-R2-L1", "tier": 2, "type": "calc", "stem": "Using Ibarra's binomial model, the value of each Halvard Steel put is <i>closest<\/i> to:", "options": {"A": "€6.67.", "B": "€7.47.", "C": "€8.58."}}, {"id": "m2-s16-q4", "rel": [7, 8], "los": "DER-R2-L9", "tier": 2, "type": "concept", "stem": "Which of Ibarra's statements about the puts on BX 300 index futures is correct?", "options": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}}]}, {"set": 17, "session": 2, "topic": "Economics", "code": "ECO", "vignette": "<p>Priya Kapoor is the chief economist at Ellsworth Global Bond Fund. She is preparing a 10-year outlook for Meridia, an emerging economy whose output per worker is well below that of developed economies and whose firms mainly adopt technologies developed abroad.<\/p>\n<p>Over the past decade, Meridia's labor force grew rapidly because of a young population and large inflows of working-age immigrants. Kapoor expects this to change. The share of Meridians aged 65 and over is projected to double by 2035, and a new law caps net immigration at a level well below recent inflows. Meridia's unemployment rate is currently 11%. The finance ministry argues that \"reducing unemployment to 6% by 2030 will permanently offset the effect of population aging on Meridia's sustainable growth rate.\"<\/p>\n<p>Kapoor also compares Meridia with Solvaria, a developed economy. Meridia's real GDP grew 6.5% last year, well above her estimate of its potential growth, and capacity utilization is at a record high. Solvaria's real GDP grew 1.0% last year, compared with potential growth of 2.5%. The fund currently holds equal weights in the two countries' government bonds.<\/p>\n<p>Kapoor prefers to forecast potential GDP with the labor productivity growth accounting equation, because she regards Meridia's estimates of total factor productivity (TFP) as unreliable. Her projections for the next decade are shown in Exhibit 1.<\/p>\n<p>Finally, Kapoor reviews three proposals in Meridia's new growth plan:<\/p>\n<ul><li>Proposal 1: Subsidize a nationwide high-speed broadband and mobile data network.<\/li>\n<li>Proposal 2: Grant large tax credits to laboratories conducting basic research aimed at new-to-the-world patents.<\/li>\n<li>Proposal 3: Expand technical secondary schools and apprenticeship programs.<\/li><\/ul>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Kapoor's Projections for Meridia<\/caption><thead><tr><th>Meridia: projected average annual rate, next 10 years<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Growth in labor force<\/td><td>0.45%<\/td><\/tr><tr><td>Growth in labor productivity (output per worker)<\/td><td>3.25%<\/td><\/tr><tr><td>Growth in TFP (official estimate)<\/td><td>1.15%<\/td><\/tr><tr><td>Growth in capital stock<\/td><td>4.20%<\/td><\/tr><tr><td>Labor share of income<\/td><td>0.60<\/td><\/tr><tr><td>Population growth<\/td><td>0.90%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s17-q1", "rel": [1], "los": "ECO-R2-L7", "tier": 1, "type": "concept", "stem": "Kapoor should <i>most likely<\/i> conclude that the finance ministry's argument is:", "options": {"A": "correct, because a lower unemployment rate permanently raises the growth rate of the labor force.", "B": "correct, because the employment gains will permanently raise the growth rate of per capita GDP.", "C": "incorrect, because lower unemployment raises the level of employment but not the sustainable growth rate, which aging and the immigration cap will reduce."}}, {"id": "m2-s17-q2", "rel": [2], "los": "ECO-R2-L3", "tier": 1, "type": "concept", "stem": "Over the next 12 months, based on the relationship between actual and potential GDP growth in the two countries, Kapoor should <i>most likely<\/i> recommend that the fund:", "options": {"A": "overweight Meridia government bonds, because Meridia's higher potential GDP growth improves the credit quality of its sovereign debt.", "B": "underweight Meridia government bonds relative to Solvaria government bonds, because growth above potential signals rising inflation and monetary tightening in Meridia.", "C": "underweight Solvaria government bonds relative to Meridia government bonds, because Solvaria's lower potential GDP growth implies higher real interest rates."}}, {"id": "m2-s17-q3", "rel": [3, 6], "los": "ECO-R2-L5", "tier": 1, "type": "calc", "stem": "Using her preferred method, Kapoor's forecast of Meridia's annual potential GDP growth over the next decade is <i>closest<\/i> to:", "options": {"A": "3.10%.", "B": "3.25%.", "C": "3.70%."}}, {"id": "m2-s17-q4", "rel": [0, 4, 5], "los": "ECO-R2-L8", "tier": 2, "type": "concept", "stem": "Given Meridia's stage of development, which proposal is <i>least<\/i> consistent with how less developed economies typically achieve technological progress?", "options": {"A": "Proposal 1", "B": "Proposal 2", "C": "Proposal 3"}}]}, {"set": 18, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Ingrid Sorensen, CFA, is a valuation specialist engaged to value a 15% equity interest in Rosales Precision Castings, a private manufacturer of engine components founded and controlled by Rafael Rosales. The interest is held by Rosales's nephew, who is not involved in management and cannot sell his shares without the family's consent. The company has no plans for a sale or an initial public offering.<\/p>\n<p>Sorensen first normalizes Rosales's 2025 earnings using the data in Exhibit 1. She learns that Rafael Rosales, the chief executive, was paid $2.40 million in 2025, whereas chief executives of comparable companies are paid about $0.90 million. Rosales Precision leases its only plant from a company owned by Rafael Rosales at an annual rent of $1.80 million; market rent for a similar plant is $1.20 million. The 2025 results also include a one-time litigation settlement expense of $0.80 million and a $0.50 million gain on the sale of a surplus warehouse.<\/p>\n<p>Sorensen applies two valuation approaches. Using the guideline transactions method, based on acquisitions of entire companies, she estimates the value of Rosales's equity on a controlling, marketable basis at $48.0 million. She estimates a control premium of 30% from those transactions and a discount for lack of marketability (DLOM) of 15%.<\/p>\n<p>She also applies the capitalized cash flow method, using the data in Exhibit 2. Kovalenko Industrial, a listed competitor with a weighted average cost of capital (WACC) of 9.5%, has expressed interest in buying Rosales Precision.<\/p>\n<p>Finally, Rafael Rosales asks Sorensen to value Aurelio Alloys, a two-year-old company he founded. Aurelio is developing a metal powder for 3D printing; it has no revenue yet, its future cash flows are highly uncertain, and no comparable companies or transactions exist. Its assets consist mainly of laboratory equipment and cash.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Reported Financial Data<\/caption><thead><tr><th>Rosales Precision Castings, 2025<\/th><th>$ millions<\/th><\/tr><\/thead><tbody><tr><td>Revenue<\/td><td>64.0<\/td><\/tr><tr><td>Reported pretax income<\/td><td>5.40<\/td><\/tr><tr><td>Income tax rate<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense<\/td><td>2.10<\/td><\/tr><tr><td>Capital expenditures<\/td><td>2.60<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Capitalized Cash Flow Method Inputs<\/caption><thead><tr><th>Capitalized cash flow inputs<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Normalized free cash flow to the firm (FCFF), 2025<\/td><td>$5.20 million<\/td><\/tr><tr><td>Long-term growth rate of FCFF<\/td><td>3.0%<\/td><\/tr><tr><td>Risk-free rate<\/td><td>4.0%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>5.5%<\/td><\/tr><tr><td>Size premium<\/td><td>3.0%<\/td><\/tr><tr><td>Company-specific risk premium<\/td><td>2.5%<\/td><\/tr><tr><td>Pretax cost of debt<\/td><td>7.0%<\/td><\/tr><tr><td>Target debt-to-total capital (based on comparable companies)<\/td><td>20%<\/td><\/tr><tr><td>Market value of debt<\/td><td>$9.0 million<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s18-q1", "rel": [1, 5], "los": "EQ-R6-L3", "tier": 2, "type": "calc", "stem": "Rosales Precision's normalized 2025 pretax income is <i>closest<\/i> to:", "options": {"A": "$5.7 million.", "B": "$7.2 million.", "C": "$7.8 million."}}, {"id": "m2-s18-q2", "rel": [0, 2], "los": "EQ-R6-L6", "tier": 2, "type": "calc", "stem": "Based on the guideline transactions method, the value of the nephew's 15% interest is <i>closest<\/i> to:", "options": {"A": "$4.28 million.", "B": "$4.46 million.", "C": "$4.71 million."}}, {"id": "m2-s18-q3", "rel": [3, 6], "los": "EQ-R6-L8", "tier": 2, "type": "calc", "stem": "Using the capitalized cash flow method, Sorensen's estimate of the value of Rosales Precision's equity is <i>closest<\/i> to:", "options": {"A": "$44.3 million.", "B": "$53.3 million.", "C": "$73.4 million."}}, {"id": "m2-s18-q4", "rel": [4], "los": "EQ-R6-L7", "tier": 2, "type": "concept", "stem": "The valuation approach that is <i>most<\/i> appropriate for Aurelio Alloys is the:", "options": {"A": "market approach.", "B": "income approach.", "C": "asset-based approach."}}]}, {"set": 19, "session": 2, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Mireille Fontaine, CFA, is chief investment officer of the Merrow College Endowment, which holds a traditional portfolio of 60% global equities and 40% investment-grade bonds. The investment committee has approved a 20% allocation to a single hedge fund, funded proportionally from equities and bonds. Fontaine's analyst, Tomasz Wieczorek, has short-listed three funds.<\/p>\n<p><b>Sextant Systematic<\/b> trades futures on 45 markets, including equity indexes, government bonds, currencies, and commodities. Each month, its computer model goes long any contract whose own trailing 12-month return is positive and short any contract whose trailing return is negative; positions are sized by the inverse of each contract's volatility. Sextant's net exposure is sometimes strongly net long and sometimes strongly net short. Sextant uses no fundamental or economic data.<\/p>\n<p><b>Larchmont Event Partners<\/b> invests in announced acquisitions. Its largest current position follows Draycott Foods' announced all-cash offer of €54.00 per share for Ennisford Dairies, which is expected to close in five months pending regulatory approval. Larchmont bought Ennisford shares at €51.20. Wieczorek notes that Larchmont's returns have been steady but that its worst months coincided with equity market sell-offs.<\/p>\n<p><b>Kessick Relative Value<\/b> runs convertible bond arbitrage. Wieczorek reviews a proposed Kessick trade in Varnell Logistics (Exhibit 1): Kessick would buy 4,000 Varnell convertible bonds (par €1,000) and short the shares into which they convert. Kessick would hold the position for one year and then convert the bonds and use the shares received to close the short position. Wieczorek expects Varnell's share price in one year to be between €27 and €36.<\/p>\n<p>The investment committee's criteria for the combined portfolio are that (1) its standard deviation must be lower than that of the current portfolio, (2) its maximum drawdown must not exceed that of the current portfolio, and (3) among portfolios meeting (1) and (2), it should have the best downside-risk-adjusted return. Wieczorek's simulated results appear in Exhibit 2; the risk-free rate is 1.9%.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Proposed Kessick Convertible Arbitrage Trade<\/caption><thead><tr><th>Varnell Logistics<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Convertible bond price (% of par)<\/td><td>112.0<\/td><\/tr><tr><td>Annual coupon (paid at year-end)<\/td><td>4.0%<\/td><\/tr><tr><td>Remaining maturity<\/td><td>1 year<\/td><\/tr><tr><td>Conversion ratio (shares per bond)<\/td><td>40<\/td><\/tr><tr><td>Credit rating<\/td><td>BB+<\/td><\/tr><tr><td>Current share price<\/td><td>€31.50<\/td><\/tr><tr><td>P/E: Varnell / industry average<\/td><td>26x / 18x<\/td><\/tr><tr><td>Cost to borrow shares (paid to lender, per share per year)<\/td><td>€1.20<\/td><\/tr><tr><td>Dividend per share over the next year<\/td><td>€0.80<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Simulated Annual Statistics, 20% Hedge Fund Allocation<\/caption><thead><tr><th>Portfolio<\/th><th>Mean return (%)<\/th><th>Standard deviation (%)<\/th><th>Sharpe ratio<\/th><th>Sortino ratio<\/th><th>Maximum drawdown (%)<\/th><\/tr><\/thead><tbody><tr><td>Current 60/40 portfolio<\/td><td>6.80<\/td><td>10.20<\/td><td>0.48<\/td><td>0.71<\/td><td>24.6<\/td><\/tr><tr><td>48/32/20 with Larchmont Event Partners<\/td><td>6.90<\/td><td>9.10<\/td><td>0.55<\/td><td>0.82<\/td><td>26.1<\/td><\/tr><tr><td>48/32/20 with Sextant Systematic<\/td><td>6.70<\/td><td>9.30<\/td><td>0.52<\/td><td>0.86<\/td><td>19.4<\/td><\/tr><tr><td>48/32/20 with Kessick Relative Value<\/td><td>7.30<\/td><td>9.60<\/td><td>0.56<\/td><td>0.80<\/td><td>23.8<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s19-q1", "rel": [1], "los": "AI-R4-L5", "tier": 1, "type": "concept", "stem": "Sextant Systematic's strategy is <i>best<\/i> described as a:", "options": {"A": "time-series momentum strategy.", "B": "cross-sectional momentum strategy.", "C": "global macro strategy."}}, {"id": "m2-s19-q2", "rel": [2], "los": "AI-R4-L3", "tier": 2, "type": "concept", "stem": "Which of the following statements about Larchmont's Ennisford position is <i>most<\/i> accurate?", "options": {"A": "It follows a soft-catalyst approach, which is generally riskier than a hard-catalyst approach.", "B": "Its payoff profile resembles a long call option, with a loss limited to the €2.80 spread.", "C": "Its payoff profile resembles a riskless bond plus a short put option."}}, {"id": "m2-s19-q3", "rel": [3, 5], "los": "AI-R4-L4", "tier": 2, "type": "calc", "stem": "Kessick's total profit on the proposed Varnell trade over one year is <i>closest<\/i> to:", "options": {"A": "€80,000.", "B": "€240,000.", "C": "€400,000."}}, {"id": "m2-s19-q4", "rel": [4, 6], "los": "AI-R4-L9", "tier": 2, "type": "concept", "stem": "Based on Exhibit 2, which fund <i>best<\/i> meets the investment committee's criteria?", "options": {"A": "Larchmont Event Partners", "B": "Sextant Systematic", "C": "Kessick Relative Value"}}]}, {"set": 20, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Ifeoma Abara, CFA, manages a corporate bond portfolio at Harwell Mutual Insurance. She is reviewing three issuers with her junior analyst.<\/p>\n<p>Harwell holds a 9-year bond of Saltire Packaging, rated BBB, with a yield to maturity of 5.30% and a modified duration of 7.0. Assuming stable yields and spreads, the bond's modified duration at the end of one year will be 6.1. Abara estimates the bond's expected one-year return using the transition probabilities and typical spreads in Exhibit 1, assuming no default.<\/p>\n<p>To hedge the Saltire position, Abara plans to buy €25 million of protection using a five-year Saltire CDS, which carries the standard investment-grade coupon of 1% and has a duration of 4.4. She estimates Saltire's annual probability of default at 3.0% and the expected recovery rate at 45%. Saltire's 10-year CDS currently trades at a spread of 2.05%.<\/p>\n<p>Calvaro Retail, a high-yield issuer, was recently acquired by a private equity firm in a leveraged buyout that sharply increased its debt. The new owners plan to close unprofitable stores and cut costs. Calvaro's credit spreads are shown in Exhibit 2.<\/p>\n<p>Ternmoor Chemicals, rated A, has just sold a division for cash that exceeds all of its debt maturing in the next three years. However, Abara expects regulators to phase out Ternmoor's main product starting in 2033. She wants to use Ternmoor single-name CDS to profit if her view is correct while limiting her exposure to a parallel shift in Ternmoor's credit spreads.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Partial One-Year Transition Matrix (%) and Typical Credit Spreads<\/caption><thead><tr><th>From / To<\/th><th>AA<\/th><th>A<\/th><th>BBB<\/th><th>BB<\/th><th>B<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>2.60<\/td><td>88.90<\/td><td>7.40<\/td><td>0.80<\/td><td>0.30<\/td><\/tr><tr><td>BBB<\/td><td>0.00<\/td><td>4.20<\/td><td>89.60<\/td><td>5.10<\/td><td>1.10<\/td><\/tr><tr><td>Typical credit spread (%)<\/td><td>0.80<\/td><td>1.05<\/td><td>1.55<\/td><td>3.30<\/td><td>5.60<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Calvaro Retail Credit Spreads<\/caption><thead><tr><th>Calvaro Retail<\/th><th>2-year<\/th><th>5-year<\/th><th>10-year<\/th><\/tr><\/thead><tbody><tr><td>Credit spread (%)<\/td><td>6.40<\/td><td>5.10<\/td><td>4.30<\/td><\/tr><tr><td>Benchmark government yield (%)<\/td><td>3.10<\/td><td>3.35<\/td><td>3.60<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s20-q1", "rel": [1, 5], "los": "FI-R4-L3", "tier": 1, "type": "calc", "stem": "The expected one-year return on the Saltire bond is <i>closest<\/i> to:", "options": {"A": "4.51%.", "B": "4.61%.", "C": "5.99%."}}, {"id": "m2-s20-q2", "rel": [3, 6], "los": "FI-R4-L7", "tier": 2, "type": "concept", "stem": "The shape of Calvaro's credit spread curve <i>most likely<\/i> reflects investor expectations that:", "options": {"A": "Calvaro's default probabilities will rise as the time horizon lengthens.", "B": "Calvaro's credit quality is high and insensitive to the credit cycle.", "C": "the new owners' restructuring will improve Calvaro's future cash flow and profitability."}}, {"id": "m2-s20-q3", "rel": [2], "los": "FI-R5-L3", "tier": 2, "type": "calc", "stem": "The upfront payment that Abara would make to buy protection on Saltire is <i>closest<\/i> to:", "options": {"A": "€715,000.", "B": "€1,815,000.", "C": "€2,200,000."}}, {"id": "m2-s20-q4", "rel": [4], "los": "FI-R5-L4", "tier": 2, "type": "concept", "stem": "Which CDS position <i>best<\/i> expresses Abara's view on Ternmoor?", "options": {"A": "A curve-steepening trade: buy protection using a 10-year CDS and sell protection using a 2-year CDS", "B": "A curve-flattening trade: buy protection using a 2-year CDS and sell protection using a 10-year CDS", "C": "A naked CDS position: buy protection using a 10-year CDS only"}}]}, {"set": 21, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Clarisse Moreau is chief investment officer of the Vintry Municipal Pension Plan. The plan has just terminated its external European small-cap equity manager. A replacement manager benchmarked to the same index is expected to be hired and funded in 5 months. Meanwhile, Moreau will invest the €80 million released by the terminated manager in ETF P, which tracks the replacement manager's benchmark, and will sell the ETF position when the new manager is funded. Moreau's estimates of ETF P's costs are in Exhibit 1.<\/p>\n<p>Separately, Vintry's three global equity managers, whom Moreau intends to keep, are collectively underweight Japanese equities relative to the plan's strategic target. Moreau is considering ETF J, a Japanese equity ETF listed on a European exchange, to bring the plan's total Japanese exposure back to target.<\/p>\n<p>Moreau's analyst, Dev Raghunathan, makes the following statements about Exhibit 2:<\/p>\n<p>Statement 1: \"Because ETF P holds an optimized sample of the most liquid index constituents rather than all 900 stocks, its tracking error should be lower than if it fully replicated the index.\"<\/p>\n<p>Statement 2: \"ETF J's frequent premiums and discounts to NAV arise mainly because ETF J trades during European hours, when the Tokyo market is closed.\"<\/p>\n<p>Statement 3: \"ETF P's tracking error of 0.41% means that ETF P underperformed its index by 0.41% over the past year.\"<\/p>\n<p>During a sharp sell-off one afternoon, ETF P trades at €31.42 while its indicated NAV is €31.66. The discount exceeds the costs that authorized participants (APs) would incur, including the ETF sponsor's service fee, to create or redeem shares.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: ETF P Cost Estimates<\/caption><thead><tr><th>ETF P cost item<\/th><th>Estimate<\/th><\/tr><\/thead><tbody><tr><td>Annual management fee (expense ratio)<\/td><td>0.30%<\/td><\/tr><tr><td>Bid–ask spread<\/td><td>0.08%<\/td><\/tr><tr><td>Commission per trade (each purchase or sale)<\/td><td>0.03%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: ETF Statistics<\/caption><thead><tr><th>One-year statistics<\/th><th>ETF P (European small cap)<\/th><th>ETF J (Japanese equity)<\/th><\/tr><\/thead><tbody><tr><td>Index constituents / ETF holdings<\/td><td>900 / 410<\/td><td>1,700 / 1,700<\/td><\/tr><tr><td>Tracking difference (ETF NAV return − index return)<\/td><td>−0.36%<\/td><td>−0.14%<\/td><\/tr><tr><td>Tracking error<\/td><td>0.41%<\/td><td>0.12%<\/td><\/tr><tr><td>Average absolute premium/discount to NAV<\/td><td>0.07%<\/td><td>0.58%<\/td><\/tr><tr><td>Average daily trading volume<\/td><td>€95 million<\/td><td>€40 million<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s21-q1", "rel": [0, 7], "los": "PM-R3-L6", "tier": 1, "type": "calc", "stem": "The total expected cost of holding ETF P during the 5-month transition is <i>closest<\/i> to:", "options": {"A": "€212,000.", "B": "€276,000.", "C": "€352,000."}}, {"id": "m2-s21-q2", "rel": [2, 3, 4, 5, 8], "los": "PM-R3-L6", "tier": 1, "type": "concept", "stem": "Which of Raghunathan's statements is <i>most<\/i> accurate?", "options": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}}, {"id": "m2-s21-q3", "rel": [6], "los": "PM-R3-L1", "tier": 2, "type": "concept", "stem": "In response to ETF P's price during the sell-off, an AP would <i>most likely<\/i>:", "options": {"A": "buy the creation basket securities, exchange them with the ETF sponsor for new ETF P shares, and sell those shares on the exchange.", "B": "sell ETF P shares short on the exchange and buy the securities in the ETF's portfolio.", "C": "buy ETF P shares on the exchange, redeem them with the ETF sponsor for the redemption basket, and sell those securities."}}, {"id": "m2-s21-q4", "rel": [0, 1], "los": "PM-R3-L8", "tier": 2, "type": "concept", "stem": "Moreau's planned use of ETF P is <i>best<\/i> described as:", "options": {"A": "portfolio completion.", "B": "portfolio rebalancing.", "C": "transition management."}}]}, {"set": 22, "session": 2, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Kelderman Asset Management manages equity portfolios for institutions and wealthy families. Matteo Ferrandi, CFA, is a portfolio manager; Tamsin Rourke, CFA, is an equity analyst; and Yusra Haddad, a CFA Level II candidate, is a quantitative analyst.<\/p>\n<p>Aldwych Family Office, one of Ferrandi's largest clients, offers to pay Ferrandi personally a bonus equal to 1% of any annual return above 12% on the family's Kelderman account. Ferrandi emails his supervisor describing the full terms of the offer. The supervisor replies by email approving the arrangement, and Aldwych confirms the terms in a signed letter. Ferrandi continues to manage the Aldwych account under the same mandate and trading procedures as his other accounts.<\/p>\n<p>Rourke has served for two years on the board of directors of Haverick Rail, a listed freight company. The board meets quarterly, and Rourke spends about four days a year on board matters. Before joining the board, she obtained written approval from Kelderman's compliance department, and she reports her annual board fee and the Haverick shares she receives as directors' compensation. Kelderman has placed a firewall between Rourke and the portfolio managers on all Haverick matters. When Kelderman's research head is absent, Rourke writes the firm's client report on Haverick, rating it \"Buy.\" The report discloses Kelderman's holdings in Haverick but does not mention Rourke's board seat or her Haverick shares.<\/p>\n<p>At 10:00 a.m., Rourke changes her recommendation on Talmont Logistics from Buy to Sell. Kelderman's policy is to email changed recommendations at the same time to all clients for whom the security is suitable, and the email is sent at 10:05 a.m. Ferrandi immediately places a block order to sell 200,000 Talmont shares across 14 discretionary accounts, but only 120,000 shares are executed before the close. At 10:20 a.m., a non-discretionary client who has not read the email calls Ferrandi and asks him to buy 5,000 Talmont shares.<\/p>\n<p>Ferrandi asks Haddad to develop a stock-selection model for a new global small-cap fund to be offered to clients next month at a management fee of 0.85%. Haddad's development notes are summarized in Exhibit 1. She explains the model's factors and their economic rationale to Ferrandi, who will present the model to clients.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Haddad's Model Development Notes<\/caption><thead><tr><th>Item<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>Data source<\/td><td>Commercial database from a widely used vendor<\/td><\/tr><tr><td>Sample period<\/td><td>January 2010 – December 2019<\/td><\/tr><tr><td>Universe<\/td><td>Companies listed as of December 2019 (companies delisted during the period are not in the database)<\/td><\/tr><tr><td>Testing<\/td><td>Model weights estimated and performance measured on the full sample; no stress tests<\/td><\/tr><tr><td>Results<\/td><td>Annualized excess return 4.8%, maximum drawdown 9%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s22-q1", "rel": [1], "los": "ETH-R3-L1", "tier": 2, "type": "concept", "stem": "Does Ferrandi's acceptance of the Aldwych bonus arrangement violate Standard IV(B) Additional Compensation Arrangements?", "options": {"A": "No.", "B": "Yes, because approval sent by email does not constitute written consent.", "C": "Yes, because performance-based compensation from a client is prohibited even with the employer's consent."}}, {"id": "m2-s22-q2", "rel": [2], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "With respect to the Haverick report, Rourke <i>most likely<\/i>:", "options": {"A": "did not violate the Standards, because she obtained compliance approval for her board seat and Kelderman maintains a firewall.", "B": "violated the Standards, because a director of a company may not write research on that company.", "C": "violated the Standards, because the report does not disclose her board seat and her Haverick shares."}}, {"id": "m2-s22-q3", "rel": [3], "los": "ETH-R2-L2", "tier": 1, "type": "concept", "stem": "To comply with Standard III(B) Fair Dealing, Ferrandi should <i>most appropriately<\/i>:", "options": {"A": "allocate the 120,000 executed shares first to the accounts with the largest Talmont positions and execute the caller's order as requested, because it is unsolicited.", "B": "allocate the 120,000 executed shares pro rata on the basis of each account's order and inform the caller of the Sell recommendation before accepting the order.", "C": "allocate the 120,000 executed shares pro rata on the basis of each account's order and execute the caller's order without comment, because the change was already disseminated by email."}}, {"id": "m2-s22-q4", "rel": [4, 5], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "To comply with Standard V(A) Diligence and Reasonable Basis before the model is offered to clients, Haddad should <i>most appropriately<\/i>:", "options": {"A": "provide clients with the model's factor weights, because members must be able to explain the basic nature of quantitative research.", "B": "rely on the vendor's data without further review, because the database is widely used in the industry.", "C": "test the model on data that include delisted companies and on scenarios outside the 2010–2019 sample, including a severe market downturn."}}]}]};

  } catch (e) {}
}

function getSecret() {
  if (secret) return secret;
  const bin = atob(SECRET_B64), k = KEYS, u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ k.charCodeAt(i % k.length);

}

// ---------- pause / wall-clock timer ----------
const r3 = x => Math.round(x * 1000) / 1000;

let lastTick = Date.now();

}
function pauseSecOf(e, now) { return e.end ? (e.sec || 0) : Math.max(0, ((now || Date.now()) - Date.parse(e.start)) / 1000); }

function tick() {

}
function highlightSel(setNo) {
  const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0), v = $("vig");
  if (!v.contains(r.commonAncestorContainer)) return;
  try { const m = document.createElement("mark"); m.appendChild(r.extractContents()); r.insertNode(m); } catch (e) { return; }
  sel.removeAllRanges(); S.hl[setNo] = v.innerHTML; save();
}

function renderReview(app) {
  app.dataset.mode = "review";
  const se = curSess(), [a, b] = sessRange(se);
  let un = [], fl = [];
  for (let i = a; i <= b; i++) { const id = QL[i].q.id; if (!S.answers[id]) un.push(i); if (S.flagged[id]) fl.push(i); }
  const chip = i => `<button class="nb ${S.answers[QL[i].q.id] ? "ans" : ""} ${S.flagged[QL[i].q.id] ? "fl" : ""}" data-i="${i}">${QL[i].no}</button>`;
  app.innerHTML = `<div id="top"><b>Session ${se} — 제출 전 확인</b><span class="grow"></span><span id="timer"></span><button id="pausebtn" title="일시정지 (P)">⏸ 일시정지</button>${darkBtn()}</div>
  <div class="center"><div class="card"><h3>미응답 ${un.length}문항</h3><div style="display:flex;flex-wrap:wrap;gap:3px">${un.map(chip).join("") || "<span class='mut'>없음</span>"}</div></div>
  <div class="card"><h3>Flag ${fl.length}문항</h3><div style="display:flex;flex-wrap:wrap;gap:3px">${fl.map(chip).join("") || "<span class='mut'>없음</span>"}</div></div>
  <div style="display:flex;gap:10px"><button id="back">돌아가기</button><button class="pri" id="sub">Session ${se} 제출${se === 2 ? " 및 채점" : ""}</button></div></div>`;
  app.querySelectorAll(".nb").forEach(bt => bt.onclick = () => { S.phase = "s" + se; S.cur = +bt.dataset.i; save(); render(); });
  $("pausebtn").onclick = () => pauseExam("manual");
  $("back").onclick = () => { S.phase = "s" + se; save(); render(); };
  $("sub").onclick = () => { if (confirm("제출하면 이 세션으로 돌아올 수 없습니다. 제출할까요?")) submitSession(se); };
  updateTimer();
}

// ---------- 복습: 채점 후 시험 화면 그대로 한 문항씩 ----------
const SFILT = [["wf", "오답+Flag"], ["wrong", "오답"], ["flag", "Flag"], ["all", "전체"]];
function studyList(f, rows) {
  f = f || S.sfilt || "wf"; rows = rows || grade();
  return rows.filter(r => f === "all" || (f === "wrong" && !r.ok) || (f === "flag" && r.flag) || (f === "wf" && (!r.ok || r.flag))).map(r => r.i);
}
function openStudy(i) {
  S.study = true; S.sfilt = S.sfilt || "wf";
  if (i === undefined) { const l = studyList(); i = l.length ? l[0] : 0; }
  S.cur = i; $("app").dataset.mode = ""; save(); render();
}
function closeStudy() { S.study = false; save(); render(); }
function studyGo(i) { S.cur = i; save(); renderStudy(); }
function studyStep(dir) {
  const l = studyList(), p = l.indexOf(S.cur);
  const j = p >= 0 ? l[p + dir] : (dir > 0 ? l.find(i => i > S.cur) : l.slice().reverse().find(i => i < S.cur));
  if (j !== undefined) studyGo(j);
}
// 간결 오답노트: 핵심 · 공식 · 풀이 · 함정 (선지별 오답 사유는 각 선지 아래에)
function noteHTML(sec) {
  const n = sec.n || {k: sec.e, s: [], t: ""};
  const row = (l, v) => v ? `<div class="nl">${l}</div><div>${v}</div>` : "";
  return `<div class="note">${row("핵심", esc(n.k))}${row("공식", sec.f ? esc(sec.f) : "")}${row("풀이", n.s.map(esc).join("<br>"))}${row("함정", esc(n.t))}</div>`;
}
function renderStudy() {
  const app = $("app"), rows = grade(), r = rows[S.cur], x = r.x, q = r.q, s = DATA.sets[x.si], sec = getSecret()[r.id];
  S.reviewed = S.reviewed || {};
  if (!$("left") || app.dataset.mode !== "study") {
    app.dataset.mode = "study";
    app.innerHTML = `<div id="top"><b>Mock ${MOCK} · 복습</b><span id="qinfo"></span><span class="grow"></span>
      <span class="tabs" id="sfilt" style="margin:0"></span><button id="doneb" title="복습 완료 표시 (하단 번호에 ✓)"></button>${darkBtn()}<button id="tores">결과 화면</button></div>
      <div id="main"><div id="left"></div><div id="right"></div></div>
      <div id="bottom"><button id="prev">◀ Prev</button><button id="next">Next ▶</button><div id="nav"></div></div>`;
    $("prev").onclick = () => studyStep(-1);
    $("next").onclick = () => studyStep(1);
    $("tores").onclick = closeStudy;
    $("doneb").onclick = () => { const id = QL[S.cur].q.id; if (S.reviewed[id]) delete S.reviewed[id]; else S.reviewed[id] = 1; save(); renderStudy(); };
  }
  const l = studyList(null, rows), p = l.indexOf(S.cur);
  $("qinfo").textContent = `S${x.sess} Q${x.no} · Set ${s.set}` + (p >= 0 ? ` · ${p + 1}/${l.length}` : " · 목록 밖");
  $("sfilt").innerHTML = SFILT.map(f => `<button data-f="${f[0]}" class="${S.sfilt === f[0] ? "on" : ""}">${f[1]} ${studyList(f[0], rows).length}</button>`).join("");
  $("sfilt").querySelectorAll("button").forEach(bt => bt.onclick = () => {
    S.sfilt = bt.dataset.f; const nl = studyList(null, rows);
    if (nl.length && !nl.includes(S.cur)) S.cur = nl.find(i => i > S.cur) ?? nl[0];
    save(); renderStudy();
  });
  $("doneb").className = S.reviewed[r.id] ? "on" : "";
  $("doneb").textContent = S.reviewed[r.id] ? "✓ 복습 완료" : "복습 완료";
  renderLeft(x, renderStudy);
  const R = $("right"), dl = sec.d || {};
  R.scrollTop = 0;
  R.innerHTML = `<div class="sh"><b class="${r.ok ? "okc" : "warn"}">${r.ok ? "정답" : r.sel ? "오답" : "미응답"}</b><span class="mut">내 답 ${r.sel || "-"} · 정답 ${r.ans} · ${fmt(r.time)}${r.flag ? " · ⚑ Flag" : ""}</span><span class="tag">${esc(r.los)}</span><span class="tag">Tier ${r.tier}</span></div>
    <div class="mut" style="font-size:13px">Question ${x.no}</div><div class="stem">${q.stem}</div>` +
    Object.keys(q.options).map(k => `<div class="opt ${k === r.ans ? "right" : (k === r.sel ? "wrong" : "")}"><span class="l">${k}</span><span class="t">${q.options[k]}${k !== r.ans && dl[k] ? `<div class="why">${esc(dl[k])}</div>` : ""}</span>${k === r.sel ? "<span class='tag'>내 답</span>" : ""}${k === r.ans ? "<span class='tag'>정답</span>" : ""}</div>`).join("") +
    `${noteHTML(sec)}<details class="raw"><summary>원문 해설 (출처 포함)</summary><div class="expl">${esc(sec.e)}</div></details>
    <details class="raw"><summary>문항 이의</summary><textarea class="dsp" data-id="${r.id}" rows="2" placeholder="결함이 의심되는 이유…">${esc(S.dispute[r.id] || "")}</textarea></details>`;
  R.querySelectorAll(".dsp").forEach(t => t.onchange = () => { if (t.value.trim()) S.dispute[t.dataset.id] = t.value.trim(); else delete S.dispute[t.dataset.id]; save(); });
  typeset(R);
  const inl = new Set(l);
  $("nav").innerHTML = QL.map((y, i) => {
    const rr = rows[i], first = i === 0 || QL[i - 1].si !== y.si, ss = i === 0 || QL[i - 1].sess !== y.sess;
    return `${ss ? `<span class="sl">S${y.sess}</span>` : ""}<button class="nb ${rr.ok ? "nok" : "nno"}${i === S.cur ? " cur" : ""}${rr.flag ? " fl" : ""}${first && !ss ? " setstart" : ""}${inl.has(i) ? "" : " out"}${S.reviewed[rr.id] ? " rvd" : ""}" data-i="${i}" title="Set ${DATA.sets[y.si].set}">${y.no}</button>`;
  }).join("");
  $("nav").querySelectorAll("button").forEach(bt => bt.onclick = () => studyGo(+bt.dataset.i));
}

// ---------- grading ----------
function grade() {
  const sec = getSecret();
  const rows = QL.map((x, i) => {
    const q = x.q, id = q.id, sel = S.answers[id] || null, ans = sec[id].a, s = DATA.sets[x.si];
    return {i, id, x, q, set: s.set, sess: x.sess, code: s.code, topic: s.topic, los: q.los, tier: q.tier, sel, ans,
            ok: sel === ans, time: S.time[id] || 0, flag: !!S.flagged[id]};
  });
  return rows;
}
const pct = (n, d) => d ? Math.round(1000 * n / d) / 10 : 0;
const bar = p => `<div class="bar"><i style="width:${p}%"></i></div>`;
function agg(rows, keyf) {
  const m = {};
  rows.forEach(r => { const k = keyf(r); (m[k] = m[k] || {n: 0, c: 0, t: 0}); m[k].n++; m[k].c += r.ok ? 1 : 0; m[k].t += r.time; });
  return m;
}
const pauseLine = () => `일시정지 ${S.pauseLog.length}회 · 총 ${fmt(pauseTotal())}`;
function renderResults(app) {
  app.dataset.mode = "results";
  const rows = grade(), n = rows.length, c = rows.filter(r => r.ok).length;
  app.innerHTML = `<div id="top"><b>Mock ${MOCK} — 결과</b><span class="grow"></span><button class="pri" id="studybtn">◀ 문제 화면으로 복습</button>${darkBtn()}</div><div class="center" id="res" style="overflow:auto"></div>`;
  $("studybtn").onclick = () => openStudy(S.cur);
  const s1 = rows.filter(r => r.sess === 1), s2 = rows.filter(r => r.sess === 2), fl = rows.filter(r => r.flag), m = agg(rows, r => r.code);
  $("res").innerHTML = `<div class="card"><h2>${c} / ${n} (${pct(c, n)}%)</h2>
      <p>Session 1: ${s1.filter(r => r.ok).length}/${s1.length} (${pct(s1.filter(r => r.ok).length, s1.length)}%) · Session 2: ${s2.filter(r => r.ok).length}/${s2.length} (${pct(s2.filter(r => r.ok).length, s2.length)}%)</p>
      <p class="mut">비공식 참고선 ~65–70% (CFA Institute는 합격선을 공개하지 않음). ${S.unlimited ? "<b class='warn'>※ 시간 무제한 모드로 응시</b>" : ""}${[1, 2].filter(k => S.rem[k] < 0).map(k => ` <b class='warn'>※ Session ${k} 시간 초과 +${fmt(-S.rem[k])}</b>`).join("")}</p>
      <p>${pauseLine()}</p>
      <p>미응답 ${rows.filter(r => !r.sel).length}문항 · Flag ${fl.length}문항 (정답률 ${pct(fl.filter(r => r.ok).length, fl.length)}%)</p></div>
    <div class="card"><h3>Topic</h3><table class="r"><tr><th>Topic</th><th class="n">정답/문항</th><th class="n">정답률</th><th></th><th class="n">본 회차 비중</th><th class="n">CFAI 공식 비중</th></tr>` +
      Object.keys(m).sort((a, b) => pct(m[a].c, m[a].n) - pct(m[b].c, m[b].n)).map(k => `<tr><td>${k}</td><td class="n">${m[k].c}/${m[k].n}</td><td class="n">${pct(m[k].c, m[k].n)}%</td><td>${bar(pct(m[k].c, m[k].n))}</td><td class="n">${pct(m[k].n, n)}%</td><td class="n">${OFFICIAL[k] ? OFFICIAL[k][0] + "–" + OFFICIAL[k][1] + "%" : "-"}</td></tr>`).join("") + `</table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="expbtn">Export JSON</button><button id="impbtn2">Import JSON</button><input type="file" id="impfile2" accept=".json" style="display:none"><button id="resetbtn">초기화 후 처음으로</button></div>`;
  $("expbtn").onclick = exportJSON; $("impbtn2").onclick = () => $("impfile2").click();
  $("impfile2").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importJSON(r.result); r.readAsText(f); };
  $("resetbtn").onclick = () => { if (confirm("저장된 진행 상황을 삭제하고 처음으로 돌아갑니다. Export 했는지 확인하세요.")) { S = fresh(); try { localStorage.removeItem(SKEY); } catch (e) {} render(); } };
}
// ---------- export / import ----------
function exportJSON() {
  save();
  const rows = S.phase === "done" ? grade() : null, answers = {};
  QL.forEach(x => { const id = x.q.id; if (S.answers[id] || S.time[id]) answers[id] = {selected: S.answers[id] || null, correct: rows ? rows[byId[id]].ans : null, time: S.time[id] || 0}; });
  const answered = Object.keys(S.answers).length, correct = rows ? rows.filter(r => r.ok).length : null;
  const attempt = {exportedAt: new Date().toISOString(), exportedFrom: "cmock-" + MOCK + ".html", phase: S.phase,
    totalQuestions: QL.length, answered, correct, wrong: rows ? answered - correct : null,
    state: {answers, timeSpentSec: Math.round(Object.values(S.time).reduce((a, b) => a + b, 0)), flagged: S.flagged, struck: S.struck, dispute: S.dispute,
            phase: S.phase, unlimited: S.unlimited, remaining: S.rem, cur: S.cur, startedAt: S.startedAt, finishedAt: S.finishedAt,
            paused: S.paused, pausedAt: S.pausedAt, pauseLog: S.pauseLog, pauseSummary: {count: S.pauseLog.length, totalSec: Math.round(pauseTotal())}}};
  const d = new Date(), date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const o = {subject: SUBJECT, date, latest: {phase: S.phase, totalQuestions: QL.length, answered, correct, wrong: attempt.wrong}, attempts: [attempt]};
  const blob = new Blob([JSON.stringify(o, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = SUBJECT + "_results_" + date + ".json";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return o;
}
function importJSON(txt, quiet) {
  try {
    let o = typeof txt === "string" ? JSON.parse(txt) : txt;
    if (o.subject === SUBJECT && Array.isArray(o.attempts) && o.attempts.length) o = o.attempts[o.attempts.length - 1];
    else if (o.subject !== "agent-mock-" + MOCK) { if (!quiet) alert("다른 회차의 파일입니다: " + o.subject); return; }
    const st = o.state, n = fresh();
    Object.keys(st.answers || {}).forEach(id => { if (byId[id] !== undefined && st.answers[id].selected) { n.answers[id] = st.answers[id].selected; } n.time[id] = st.answers[id].time || 0; });
    n.flagged = st.flagged || {}; n.struck = st.struck || {}; n.dispute = st.dispute || {};
    n.unlimited = !!st.unlimited; n.rem = st.remaining || n.rem; n.startedAt = st.startedAt || null; n.finishedAt = st.finishedAt || null;
    n.phase = st.phase || "s1"; n.cur = st.cur || 0;
    n.pauseLog = Array.isArray(st.pauseLog) ? st.pauseLog.map(e => Object.assign({}, e)) : [];
    S = n; lastTick = Date.now();
    // 열려 있던 일시정지는 export 시각에서 닫고, 세션 중이면 지금부터 새 일시정지로 복원
    const open = S.pauseLog[S.pauseLog.length - 1];
    if (open && !open.end) closeOpenPause(Math.max(Date.parse(open.start), Date.parse(o.exportedAt) || 0));
    S.paused = false; S.pausedAt = null;
    if (inSession() || S.phase === "review1" || S.phase === "review2") { if (S.phase === "review1") S.phase = "s1"; if (S.phase === "review2") S.phase = "s2"; pauseExam("import"); }
    save(); render();
  } catch (e) { if (!quiet) alert("Import 실패: " + e.message); }
}
// GitHub의 results/Mock{N}/latest.json이 이 브라우저 저장본보다 최신이면 자동 복원
function loadRemote() {
  if (!window.fetch) return;
  fetch("results/" + SUBJECT + "/latest.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || d.subject !== SUBJECT || !Array.isArray(d.attempts) || !d.attempts.length) return;
    const at = d.attempts[d.attempts.length - 1], local = load();
    if ((at.exportedAt || "") > ((local && local.savedAt) || "")) importJSON(d, true);
  }).catch(() => {});
}
// ---------- boot ----------
window.__mock = {get S() { return S; }, pauseExam, resumeExam, pauseTotal, QL, grade, exportJSON, submitSession, startExam, render, getSecret};
document.addEventListener("DOMContentLoaded", () => {
  const prev = load();
  if (prev && ["s1", "s2", "review1", "review2", "done"].includes(prev.phase)) restoreFrom(prev); else render();
  lastTick = Date.now();
  setInterval(tick, 1000);
  loadRemote();
  window.addEventListener("beforeunload", save);
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if ((document.hidden || document.visibilityState === "hidden") && pausable()) pauseExam("hidden"); });
  // 복사 시 KaTeX 수식을 노션 inline LaTeX($...$) 텍스트로 바꿔 넣는다 (display 수식도 inline으로)
  document.addEventListener("copy", e => {
    const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
    const r = sel.getRangeAt(0).cloneRange();
    const mathOf = n => { const el = n.nodeType === 1 ? n : n.parentElement; return el && (el.closest(".katex-display") || el.closest(".katex")); };
    let k;
    if ((k = mathOf(r.startContainer))) r.setStartBefore(k);
    if ((k = mathOf(r.endContainer))) r.setEndAfter(k);
    const box = document.createElement("div"); box.appendChild(r.cloneContents());
    const ms = [...box.querySelectorAll(".katex-display, .katex")];
    if (!ms.length) return;
    // 본문의 통화 기호 $는 수식 구분자로 오인되지 않게 \$로
    const tw = document.createTreeWalker(box, NodeFilter.SHOW_TEXT), tn = [];
    while (tw.nextNode()) if (!tw.currentNode.parentElement?.closest(".katex")) tn.push(tw.currentNode);
    tn.forEach(n => { n.nodeValue = n.nodeValue.replace(/\$/g, "\\$"); });
    ms.forEach(m => { if (!box.contains(m)) return; const a = m.querySelector('annotation[encoding="application/x-tex"]'); m.replaceWith(a ? "$" + a.textContent.trim().replace(/\s+/g, " ") + "$" : m.textContent); });
    box.style.cssText = "position:fixed;left:-99999px;top:0;white-space:pre-wrap";
    document.body.appendChild(box);
    let t = box.innerText; box.remove();
    t = t.replace(/(\$[^$\n]+\$)(?=[가-힣])/g, "$1 ").replace(/([가-힣])(?=\$[^$\n]+\$)/g, "$1 ");
    e.preventDefault(); e.clipboardData.setData("text/plain", t);
  });
  document.addEventListener("keydown", e => {
    if (S.phase === "done" && S.study !== false && !/TEXTAREA|INPUT/.test(e.target.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === "ArrowRight") studyStep(1); else if (e.key === "ArrowLeft") studyStep(-1);
      return;
    }
    if (!pausable() || /TEXTAREA|INPUT/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); return; }
    if (S.paused || !inSession()) return;
    const x = QL[S.cur], [a, b] = sessRange(x.sess);
    if (e.key === "ArrowRight" && S.cur < b) goto(S.cur + 1);
    else if (e.key === "ArrowLeft" && S.cur > a) goto(S.cur - 1);
    else if ("abcABC".includes(e.key) && e.key.length === 1) { S.answers[x.q.id] = e.key.toUpperCase(); save(); renderExam(); }
  });
  window.addEventListener("load", () => { if (S.phase === "done") { $("app").dataset.mode = ""; render(); } else if (inSession()) typeset($("app")); });
});
</script>

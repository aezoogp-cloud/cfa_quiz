<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent Mock 2 — CFA Level II</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1d2330;--mut:#5d6677;--bd:#d5d9e0;--acc:#1f5fbf;--accbg:#e6efff;--ok:#1b7f45;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fbe9e7;--flag:#c77700;--flagbg:#fff1d6;--hl:#fff176}
body.dark{--bg:#14171d;--panel:#1d222b;--fg:#e4e8ef;--mut:#9aa3b2;--bd:#343b48;--acc:#6ea8ff;--accbg:#22314d;--ok:#5fd18b;--okbg:#17332379;--bad:#ff8a80;--badbg:#3d1f1c;--flag:#ffb74d;--flagbg:#3d2f14;--hl:#6b5f00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
textarea{width:100%;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px}
#top{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--bd);flex:none;flex-wrap:wrap}
#top .grow{flex:1}
#timer{font:600 20px/1 ui-monospace,Menlo,monospace}
#timer.low{color:var(--bad)}
#main{flex:1;min-height:0;display:flex}
#left,#right{overflow:auto;padding:14px 18px}
#left{flex:1 1 50%;border-right:1px solid var(--bd);background:var(--panel)}
#right{flex:1 1 50%}
#bottom{flex:none;background:var(--panel);border-top:1px solid var(--bd);padding:6px 14px;display:flex;gap:10px;align-items:center}
#nav{display:flex;flex-wrap:wrap;gap:3px;flex:1;max-height:96px;overflow:auto}
.nb{width:30px;height:26px;padding:0;font-size:12px;position:relative}
.nb.ans{background:var(--accbg);border-color:var(--acc)}
.nb.cur{outline:2px solid var(--acc);outline-offset:1px;font-weight:700}
.nb.fl::after{content:"";position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:var(--flag);border-right-color:var(--flag)}
.nb.setstart{margin-left:8px}
#left table{border-collapse:collapse;margin:10px 0;font-size:14px}
#left th,#left td{border:1px solid var(--bd);padding:3px 9px}
#left th{background:var(--bg)}
#left caption{font-weight:600;text-align:left;padding-bottom:4px}
.vh{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;gap:8px;align-items:center}
mark{background:var(--hl);color:inherit}
.vb{transition:opacity .15s}
.vb.dim{opacity:.35}
#relbtn.on{background:var(--accbg);border-color:var(--acc)}
.nb.nno{color:var(--bad);border-color:var(--bad)}
.nb.out{opacity:.35}
.nb.rvd::before{content:"✓";position:absolute;left:2px;bottom:-1px;font-size:9px;color:var(--ok)}
.sl{font-size:11px;color:var(--mut);align-self:center;margin:0 2px 0 8px}
.why{font-size:13px;color:var(--mut);margin-top:4px}
.note{display:grid;grid-template-columns:40px 1fr;gap:10px 12px;font-size:14px;line-height:1.65;border-top:1px solid var(--bd);margin-top:16px;padding-top:14px}
.nl{font-size:12px;font-weight:600;color:var(--mut);padding-top:2px}
.raw{margin-top:10px;font-size:13px;color:var(--mut)}
.raw .expl{color:var(--fg)}
.sh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#doneb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.stem{font-size:16px;margin:4px 0 14px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin:8px 0;background:var(--panel);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.sel{background:var(--accbg);border-color:var(--acc)}
.opt .l{font-weight:700;min-width:20px}
.opt .t{flex:1}
.opt.strike .t{text-decoration:line-through;opacity:.5}
.opt .x{padding:0 6px;font-size:12px;color:var(--mut)}
.flagbtn.on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.center{max-width:860px;margin:0 auto;padding:22px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px 20px;margin:12px 0}
h1,h2,h3{margin:.4em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
table.r{border-collapse:collapse;width:100%;font-size:14px}
table.r th,table.r td{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left}
table.r td.n,table.r th.n{text-align:right}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.opt{cursor:default}
body.live .opt{cursor:pointer}
.expl{white-space:pre-wrap;font-size:14px;border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;color:var(--mut)}
.warn{color:var(--bad)}.okc{color:var(--ok)}.mut{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:520px;margin:0}
#pauseov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center}
#pauseov.show{display:flex}
#pauseov .card{max-width:440px;text-align:center;margin:0}
#pauseov .big{font:600 44px/1.2 ui-monospace,Menlo,monospace}
@media (max-width:900px){#main{flex-direction:column}#left{border-right:0;border-bottom:1px solid var(--bd);flex-basis:40%}}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100%"></div>
<div id="pauseov" role="dialog" aria-modal="true" aria-label="일시정지"></div>
<script>
"use strict";
const DATA = {"mock": 2, "sets": [{"set": 1, "session": 1, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Ashcombe Rowe Private Wealth is the wealth management arm of Ashcombe Rowe Group, which also owns Ashcombe Rowe Securities, a broker-dealer. Tobias Fenn, CFA, is a portfolio manager on the private wealth team headed by Margaret Oyelaran, CFA. Fenn manages about 140 discretionary client accounts using the firm's model portfolios. Team members' annual bonuses are paid from a pool linked to Ashcombe Rowe Group's total profit.<\/p>\n<p>Fenn routes all equity trades for his clients through Ashcombe Rowe Securities. A review by the firm's trading desk last quarter found that two unaffiliated brokers charged commissions about 40% lower than the affiliate, with equal or better execution quality. Fenn did not change his routing after the review. Client agreements state that \"trades may be executed through an affiliated broker,\" and no client has asked Fenn to use a particular broker.<\/p>\n<p>In June, after Ashcombe Rowe's research team downgrades Lorrin Industries, Fenn decides to sell the stock from every model account. One of the fee-paying discretionary accounts he manages belongs to his mother; it follows the same model as other clients' accounts. Fenn also holds Lorrin shares in his personal account, and he is considering the most appropriate way to handle all three sets of orders.<\/p>\n<p>The team is also launching the Dividend Momentum Model, a strategy that has been run in client accounts for only six months. Keiko Sato, a Level III CFA candidate on the team, drafts a pitchbook for prospective clients, and Oyelaran approves it. The performance page is shown in Exhibit 1. The ten-year figures come from applying the model's current rules to historical data; no client account followed the model before January. The pitchbook does not otherwise describe how the ten-year figures were produced.<\/p>\n<p>Elsewhere in the pitchbook, Sato includes three items. The first is a chart of dividend-momentum returns across 22 countries, copied from a working paper by two university professors; the chart carries no reference to the paper or its authors. The second is a set of price and dividend data downloaded from a widely used financial data service, also shown without a source. The third is a risk-model summary built by Ashcombe Rowe's internal quantitative team, presented without naming the team members who developed it.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Draft Pitchbook, Page 3 — “Strategy Performance” (net of the model's 0.85% annual fee). Footnote: “Past performance is no guarantee of future results.”<\/caption><thead><tr><th>Period<\/th><th>Dividend Momentum Model<\/th><th>Benchmark<\/th><\/tr><\/thead><tbody><tr><td>Six months to 30 June (annualized)<\/td><td>6.2%<\/td><td>5.3%<\/td><\/tr><tr><td>Ten years to 30 June (annualized)<\/td><td>11.4%<\/td><td>7.9%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s01-q1", "rel": [0, 1], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Does Fenn's routing of client trades comply with Standard III(A) Loyalty, Prudence, and Care?", "options": {"A": "No, because he uses client brokerage in a way that benefits his employer rather than seeking best execution for clients.", "B": "Yes, because the client agreements disclose that trades may be executed through an affiliated broker.", "C": "Yes, because no client has directed him to use a particular broker."}}, {"id": "m2-s01-q2", "rel": [2], "los": "ETH-R2-L2", "tier": 1, "type": "concept", "stem": "To comply with Standard VI(B) Priority of Transactions when selling Lorrin Industries, Fenn should <i>most appropriately<\/i>:", "options": {"A": "sell the stock for clients first, then for his mother's account, and finally for his personal account.", "B": "sell the stock for his personal account and his mother's account before the client orders, because those positions are too small to affect the price.", "C": "sell the stock for his mother's account together with the other client accounts, and sell his personal shares only after the client orders have been executed."}}, {"id": "m2-s01-q3", "rel": [3, 5], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Which change to the performance page in Exhibit 1 is <i>most<\/i> necessary for the pitchbook to comply with Standard III(D) Performance Presentation?", "options": {"A": "Removing the ten-year figures, because the Standards do not permit the use of hypothetical results in marketing materials.", "B": "Replacing the net-of-fee figures with gross-of-fee figures so that they can be compared with the benchmark.", "C": "Identifying the ten-year figures as backtested (simulated) results rather than actual performance and presenting them separately from the six-month record."}}, {"id": "m2-s01-q4", "rel": [4], "los": "ETH-R3-L1", "tier": 2, "type": "concept", "stem": "In preparing the pitchbook, Sato <i>most likely<\/i> violated Standard I(C) Misrepresentation by:", "options": {"A": "presenting the risk-model summary without naming the internal team members who built it.", "B": "copying the professors' chart without crediting the working paper or its authors.", "C": "showing the price and dividend data without identifying the data service."}}]}, {"set": 2, "session": 1, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>Freya Lindqvist is a demand analyst at Nordvatten Energi, a regional electricity distributor. She is building quarterly demand forecasts for the company's capacity-planning team, using 64 quarters of data from 2010 to 2025.<\/p>\n<p>Lindqvist first works with raw readings from 1.2 million household smart meters. A cleansing step has already removed readings that were impossible, such as negative consumption caused by meter faults. The remaining readings still include a small number of very large values. Most of these come from households with electric heating during two severe cold snaps, and Lindqvist wants to keep them because they carry information about peak demand. Her colleague Mats Berg suggests dropping the highest and lowest 1% of readings, but she points out that the downstream model needs an observation for every meter in every quarter. The cleaned readings will later be scaled and fed, together with weather and price features, into a neural network that requires features to be on a similar scale.<\/p>\n<p>Lindqvist then estimates two regression models on the aggregated data, shown in Exhibit 1. Model 1 is an AR(1) model of the quarterly percentage change in total demand, which is not seasonally adjusted. The most recent quarterly change, for the fourth quarter of 2025, was 1.50%. Exhibit 2 shows the autocorrelations of the Model 1 residuals. Berg notes that the Durbin–Watson statistic for Model 1 is 1.71 and says that \"a value this close to 2 means we can rule out serial correlation in the errors.\"<\/p>\n<p>Model 2 regresses the quarterly demand level, in gigawatt-hours (GWh), on dummy variables for the first three quarters of the year; the fourth quarter is the omitted category. Berg proposes adding a fourth-quarter dummy \"so that every season has its own coefficient.\"<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Regression Results (critical two-tailed t-value at the 5% level ≈ 2.00)<\/caption><thead><tr><th><\/th><th>Coefficient<\/th><th>t-statistic<\/th><\/tr><\/thead><tbody><tr><td><b>Model 1: Δdemand<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>Δdemand<sub>t−1<\/sub> + ε<sub>t<\/sub><\/b><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>0.36<\/td><td>2.84<\/td><\/tr><tr><td>Δdemand<sub>t−1<\/sub><\/td><td>0.70<\/td><td>7.95<\/td><\/tr><tr><td>Observations / Durbin–Watson<\/td><td>64 / 1.71<\/td><td><\/td><\/tr><tr><td><b>Model 2: Demand<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>Q1<sub>t<\/sub> + b<sub>2<\/sub>Q2<sub>t<\/sub> + b<sub>3<\/sub>Q3<sub>t<\/sub> + ε<sub>t<\/sub><\/b><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>2,850<\/td><td>25.40<\/td><\/tr><tr><td>Q1<\/td><td>310<\/td><td>3.92<\/td><\/tr><tr><td>Q2<\/td><td>−265<\/td><td>−3.31<\/td><\/tr><tr><td>Q3<\/td><td>40<\/td><td>0.58<\/td><\/tr><tr><td>Observations / R²<\/td><td>64 / 0.62<\/td><td><\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Autocorrelations of Model 1 Residuals<\/caption><thead><tr><th>Lag<\/th><th>Residual autocorrelation<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0.071<\/td><\/tr><tr><td>2<\/td><td>−0.094<\/td><\/tr><tr><td>3<\/td><td>0.112<\/td><\/tr><tr><td>4<\/td><td>0.402<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s02-q1", "rel": [2, 4], "los": "QM-R5-L6", "tier": 1, "type": "calc", "stem": "Based on Model 1, the mean-reverting level of the quarterly change in demand and the expected direction of the next quarterly change are <i>best<\/i> described as:", "options": {"A": "1.20%, and the next change is expected to be lower than 1.50%.", "B": "1.20%, and the next change is expected to be higher than 1.50%.", "C": "1.41%, and the next change is expected to be lower than 1.50%."}}, {"id": "m2-s02-q2", "rel": [0, 2, 4, 5], "los": "QM-R5-L5", "tier": 1, "type": "concept", "stem": "Based on Exhibit 2 and Berg's comment, which conclusion about Model 1 is <i>most<\/i> appropriate?", "options": {"A": "Model 1 is misspecified, and a fourth lag should be added because the lag-4 residual autocorrelation is significant.", "B": "Model 1 is correctly specified, because a Durbin–Watson statistic of 1.71 is close to 2.", "C": "Model 1 is correctly specified, because the residual autocorrelations at lags 1 to 3 are not significant."}}, {"id": "m2-s02-q3", "rel": [3, 4], "los": "QM-R4-L2", "tier": 2, "type": "concept", "stem": "Which interpretation of Model 2 is <i>most<\/i> accurate?", "options": {"A": "Average first-quarter demand is 310 GWh.", "B": "Adding a fourth-quarter dummy, as Berg proposes, would allow each quarter's average demand to be estimated separately.", "C": "Average third-quarter demand is not significantly different from average fourth-quarter demand at the 5% level."}}, {"id": "m2-s02-q4", "rel": [1], "los": "QM-R7-L2", "tier": 2, "type": "concept", "stem": "Given Lindqvist's objectives, the <i>most<\/i> appropriate way to prepare the cleaned smart-meter readings for the neural network is to:", "options": {"A": "winsorize the extreme readings and then normalize the data, because normalization is less sensitive to outliers than standardization.", "B": "trim the highest and lowest 1% of readings and then standardize the data, because trimming removes the outliers that distort scaling.", "C": "winsorize the extreme readings and then standardize the data, because standardization is less sensitive to outliers than normalization."}}]}, {"set": 3, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Henrike Vos is a forensic analyst at a long/short equity fund. She is screening three mid-cap companies for earnings quality before the fund's annual portfolio review: Brantley Instruments, a maker of laboratory equipment; Pellham Textiles, a fabric producer; and Ostara Pharma, a generic-drug manufacturer. Exhibit 1 summarizes her screening scores, and Exhibit 2 shows two earnings-persistence models that the fund estimated on a panel of mid-cap industrial companies, together with each company's 2025 data. Vos uses a cutoff of −1.78 for the Beneish M-score.<\/p>\n<p>For forecasting, Vos prefers the model that separates earnings into a cash component and an accruals component. In that model, the cash component is cash flow from operations and the accruals component is net income minus cash flow from operations; earnings and both components are scaled by average total assets.<\/p>\n<p>Reviewing Brantley's 2025 annual report, Vos notes that Brantley sold a small product line during the year at a gain of $14 million. In prior years, Brantley reported similar gains in \"non-operating income,\" but in 2025 the gain is included in \"other operating income.\" Brantley also extended the period during which distributors can return unsold units from 60 to 120 days.<\/p>\n<p>Ostara reports under IFRS. Vos lists three changes that Ostara made in 2025:<\/p>\n<ul><li>Change 1: Ostara began classifying interest paid as a financing cash flow; it was previously classified as an operating cash flow.<\/li>\n<li>Change 2: Ostara began capitalizing development costs for a new production process; similar costs were previously expensed.<\/li>\n<li>Change 3: Ostara negotiated payment terms with its main suppliers that are 60 days longer than before.<\/li><\/ul>\n<p>Vos ignores tax effects in her analysis.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Screening Scores<\/caption><thead><tr><th><\/th><th>Brantley Instruments<\/th><th>Pellham Textiles<\/th><th>Ostara Pharma<\/th><\/tr><\/thead><tbody><tr><td>Beneish M-score, 2024<\/td><td>−2.64<\/td><td>−3.12<\/td><td>−1.95<\/td><\/tr><tr><td>Beneish M-score, 2025<\/td><td>−1.62<\/td><td>−2.47<\/td><td>−2.21<\/td><\/tr><tr><td>Altman Z-score, 2025<\/td><td>3.4<\/td><td>2.6<\/td><td>1.7<\/td><\/tr><tr><td>Reporting standard<\/td><td>US GAAP<\/td><td>IFRS<\/td><td>IFRS<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Earnings-Persistence Models and 2025 Data (E = earnings, CF = cash component, ACC = accruals component; all in % of average total assets)<\/caption><thead><tr><th><\/th><th>Brantley Instruments<\/th><th>Pellham Textiles<\/th><th>Ostara Pharma<\/th><\/tr><\/thead><tbody><tr><td><b>Model 1:<\/b> E<sub>t+1<\/sub> = 1.20 + 0.62 E<sub>t<\/sub><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><b>Model 2:<\/b> E<sub>t+1<\/sub> = 0.90 + 0.80 CF<sub>t<\/sub> + 0.45 ACC<sub>t<\/sub><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2025 net income ($ millions)<\/td><td>112<\/td><td>126<\/td><td>75<\/td><\/tr><tr><td>2025 cash flow from operations ($ millions)<\/td><td>48<\/td><td>90<\/td><td>95<\/td><\/tr><tr><td>2025 average total assets ($ millions)<\/td><td>1,000<\/td><td>1,500<\/td><td>1,250<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s03-q1", "rel": [0, 6], "los": "FSA-R5-L5", "tier": 1, "type": "concept", "stem": "Based on Exhibit 1, which conclusion about the probability of earnings manipulation is <i>most<\/i> accurate?", "options": {"A": "Pellham's 2025 probability of earnings manipulation is the highest of the three companies.", "B": "Brantley's 2025 M-score is above the cutoff, and its probability of earnings manipulation has increased since 2024.", "C": "Ostara's 2025 M-score indicates a higher probability of earnings manipulation than its 2024 M-score."}}, {"id": "m2-s03-q2", "rel": [1, 7], "los": "FSA-R5-L7", "tier": 2, "type": "calc", "stem": "Using the model Vos prefers, her forecast of Pellham's 2026 earnings, as a percentage of average total assets, is <i>closest<\/i> to:", "options": {"A": "5.52%.", "B": "6.41%.", "C": "6.78%."}}, {"id": "m2-s03-q3", "rel": [2], "los": "FSA-R5-L2", "tier": 2, "type": "concept", "stem": "Compared with its presentation in prior years, Brantley's 2025 presentation of the gain on the sale of the product line <i>most likely<\/i>:", "options": {"A": "increases Brantley's net income and shareholders' equity.", "B": "increases Brantley's operating income and operating margin but leaves net income unchanged.", "C": "leaves all of Brantley's reported profit measures unchanged, because only the classification of the gain changes."}}, {"id": "m2-s03-q4", "rel": [3, 4], "los": "FSA-R5-L12", "tier": 2, "type": "concept", "stem": "Which of Ostara's 2025 changes increase its reported cash flow from operations <i>without<\/i> changing its total net cash flow for the year?", "options": {"A": "Change 1 only", "B": "Change 1 and Change 2 only", "C": "Change 1, Change 2, and Change 3"}}]}, {"set": 4, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Tobias Hartmann covers regulated utilities for an income-oriented fund. He is comparing two companies: Aldmere Water, a water utility with a stable regulated asset base, and Corrin Power, an electricity generator and network operator that is replacing old plants with grid investments. Exhibit 1 shows his inputs. Hartmann assumes that both shares are fairly priced unless his analysis shows otherwise, and he values dividends with the Gordon growth model.<\/p>\n<p>For Aldmere, Hartmann expects dividends to grow at a constant 3.0% a year indefinitely. He also wants to know how much of Aldmere's market price reflects growth opportunities rather than assets in place. For Corrin, he estimates the long-run sustainable growth rate from the retention ratio and return on equity in Exhibit 1 and compares it with the growth rate implied by Corrin's share price.<\/p>\n<p>Corrin's 2025 net income of $310 million includes three items that Hartmann reviews before building a free cash flow to the firm (FCFF) model:<\/p>\n<ul><li>An impairment charge of $180 million on a coal-fired plant that will close early. The charge involved no cash payment.<\/li>\n<li>A gain of $95 million on the sale of a transmission line. The sale proceeds are included in Corrin's net investment in fixed capital for 2025.<\/li>\n<li>An increase of $40 million in the deferred tax liability, which arises from accelerated tax depreciation on grid investments. Because the investment program will continue for many years, Hartmann does not expect the liability to reverse.<\/li><\/ul>\n<p>Corrin also paid dividends of $220 million in 2025.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Valuation Inputs<\/caption><thead><tr><th><\/th><th>Aldmere Water<\/th><th>Corrin Power<\/th><\/tr><\/thead><tbody><tr><td>Current share price<\/td><td>$52.00<\/td><td>$41.60<\/td><\/tr><tr><td>Most recent annual dividend per share (D<sub>0<\/sub>)<\/td><td>$2.40<\/td><td>$1.80<\/td><\/tr><tr><td>Trailing EPS (2025)<\/td><td>$3.30<\/td><td>$2.75<\/td><\/tr><tr><td>Forecast EPS (2026)<\/td><td>$3.40<\/td><td>$2.85<\/td><\/tr><tr><td>Required return on equity<\/td><td>7.5%<\/td><td>8.0%<\/td><\/tr><tr><td>Long-run retention ratio<\/td><td>0.27<\/td><td>0.35<\/td><\/tr><tr><td>Long-run return on equity<\/td><td>11.0%<\/td><td>9.0%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s04-q1", "rel": [0, 1, 5], "los": "EQ-R2-L7", "tier": 1, "type": "calc", "stem": "Based on its market price, Aldmere's present value of growth opportunities (PVGO) per share and the proportion of its leading P/E that is attributable to growth opportunities are <i>closest<\/i> to:", "options": {"A": "PVGO of $6.67; 12.8% of the leading P/E.", "B": "PVGO of $8.00; 15.4% of the leading P/E.", "C": "PVGO of $19.04; 36.6% of the leading P/E."}}, {"id": "m2-s04-q2", "rel": [1, 5], "los": "EQ-R2-L6", "tier": 1, "type": "calc", "stem": "The dividend growth rate implied by Corrin's share price and Hartmann's <i>most<\/i> appropriate conclusion are:", "options": {"A": "3.52%, and Corrin's shares appear undervalued.", "B": "3.52%, and Corrin's shares appear overvalued.", "C": "3.67%, and Corrin's shares appear overvalued."}}, {"id": "m2-s04-q3", "rel": [1, 5], "los": "EQ-R2-L3", "tier": 2, "type": "calc", "stem": "Using Hartmann's growth assumption, the value per share of Aldmere based on the Gordon growth model is <i>closest<\/i> to:", "options": {"A": "$53.33.", "B": "$54.93.", "C": "$56.58."}}, {"id": "m2-s04-q4", "rel": [2, 3, 4], "los": "EQ-R3-L3", "tier": 1, "type": "concept", "stem": "When Hartmann calculates Corrin's 2025 FCFF starting from net income, the <i>most<\/i> appropriate treatment of the three items he reviews is to:", "options": {"A": "add back the impairment charge, subtract the gain on sale, and add back the increase in the deferred tax liability.", "B": "add back the impairment charge and subtract the gain on sale, but make no adjustment for the deferred tax liability.", "C": "add back the impairment charge and the increase in the deferred tax liability, but make no adjustment for the gain on sale."}}]}, {"set": 5, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Ines Carvalho works on the model-validation team of Solent Pension Trust. Before the trust's portfolio managers use a vendor's binomial interest rate tree to value callable bonds, Carvalho must confirm that the tree is consistent with the current benchmark government curve. Exhibit 1 shows the benchmark curve, and Exhibit 2 shows the vendor's tree, which assumes an interest rate volatility of 15%. All bonds pay annual coupons.<\/p>\n<p>Carvalho runs three validation checks:<\/p>\n<ul><li>Check 1: For each year, adjacent rates in the tree differ by a factor of e<sup>2σ<\/sup> = e<sup>0.30<\/sup>.<\/li>\n<li>Check 2: The tree value of an off-the-run 4.25% government bond maturing in three years equals the bond's market price of 102.66.<\/li>\n<li>Check 3: The tree values the two-year and three-year benchmark par bonds at 100.00.<\/li><\/ul>\n<p>Checks 1 and 3 are satisfied. Check 2 is not: the tree value of the 4.25% bond is slightly different from its market price.<\/p>\n<p>The vendor's documentation also describes the short-rate model behind its scenario generator: the model's parameters are estimated from historical data and do not vary with maturity, the short rate is pulled toward a long-run level, and the volatility of rate changes rises with the level of rates so that rates cannot become negative.<\/p>\n<p>A portfolio manager, Pieter Langeveld, asks Carvalho for a quick estimate. He is considering buying a three-year zero-coupon government strip and selling it after one year. He expects that, one year from now, the two-year spot rate will be 4.10%.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Benchmark Government Curve (annual compounding)<\/caption><thead><tr><th>Maturity (years)<\/th><th>Par rate<\/th><th>Spot rate<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>2.000%<\/td><td>2.000%<\/td><\/tr><tr><td>2<\/td><td>2.789%<\/td><td>2.800%<\/td><\/tr><tr><td>3<\/td><td>3.323%<\/td><td>3.350%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Vendor's Binomial Tree of One-Year Rates (σ = 15%)<\/caption><thead><tr><th>Year 0<\/th><th>Year 1<\/th><th>Year 2<\/th><\/tr><\/thead><tbody><tr><td><\/td><td><\/td><td>5.9012%<\/td><\/tr><tr><td><\/td><td>4.1464%<\/td><td><\/td><\/tr><tr><td>2.0000%<\/td><td><\/td><td>4.3717%<\/td><\/tr><tr><td><\/td><td>3.0717%<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td>3.2387%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s05-q1", "rel": [0, 2, 3, 6], "los": "FI-R2-L2", "tier": 1, "type": "calc", "stem": "The arbitrage-free value of the off-the-run 4.25% government bond and the <i>most<\/i> appropriate conclusion about it are:", "options": {"A": "102.63, and the bond is overvalued in the market.", "B": "102.63, and the bond is undervalued in the market.", "C": "102.70, and the bond is undervalued in the market."}}, {"id": "m2-s05-q2", "rel": [0, 2, 3], "los": "FI-R2-L4", "tier": 2, "type": "concept", "stem": "Which of Carvalho's checks <i>most<\/i> directly confirms that the vendor's tree is calibrated to the current benchmark term structure?", "options": {"A": "Check 1", "B": "Check 2", "C": "Check 3"}}, {"id": "m2-s05-q3", "rel": [4], "los": "FI-R2-L9", "tier": 2, "type": "concept", "stem": "The short-rate model described in the vendor's documentation is <i>most likely<\/i> the:", "options": {"A": "Cox–Ingersoll–Ross model.", "B": "Vasicek model.", "C": "Ho–Lee model."}}, {"id": "m2-s05-q4", "rel": [5, 6], "los": "FI-R1-L1", "tier": 1, "type": "calc", "stem": "If Langeveld's expectation is realized, the one-year holding-period return on the three-year zero-coupon strip is <i>closest<\/i> to:", "options": {"A": "1.87%.", "B": "2.00%.", "C": "4.46%."}}]}, {"set": 6, "session": 1, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p>Maren Castellanos leads a valuation team at an investment firm that is reviewing two companies in the same domestic market: Vestby Telecom, a listed network operator, and Saltdal Precision, a privately owned maker of machined components that the firm's private equity fund may acquire and hold for about five years.<\/p>\n<p>The team first estimates a forward-looking equity risk premium (ERP) for the domestic market with the Grinold–Kroner model, using the inputs in Exhibit 1. The team infers expected inflation from the two 10-year government yields and uses the 10-year nominal government bond yield as the risk-free rate.<\/p>\n<p>For Vestby, three team members each propose a method to estimate the required return on equity:<\/p>\n<ul><li>Proposal 1: the CAPM, using Vestby's beta of 0.85 and the Grinold–Kroner ERP.<\/li>\n<li>Proposal 2: the Gordon growth model, using Vestby's dividend yield plus expected dividend growth.<\/li>\n<li>Proposal 3: the bond-yield-plus-risk-premium approach, using the 5.6% yield to maturity on Vestby's actively traded long-term straight bonds plus a 3.0% premium.<\/li><\/ul>\n<p>Vestby has not paid a dividend since 2020 and has said it has no plans to resume payments. For Saltdal, the team uses the expanded CAPM with the Grinold–Kroner ERP and the inputs in Exhibit 2.<\/p>\n<p>The team's ESG review identifies two issues at Saltdal. Issue 1: a proposed national limit on an industrial solvent used by Saltdal would take effect in 2038 and could be met at low cost. Issue 2: Saltdal's largest customer will stop buying from suppliers that do not cut production emissions by 40% by 2027. Saltdal can comply by spending €6 million on new furnaces, and two of the customer's competitors have said they will favor suppliers that meet the same standard.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Domestic Market Inputs<\/caption><thead><tr><th>Input<\/th><th>Estimate<\/th><\/tr><\/thead><tbody><tr><td>Dividend yield on the market index<\/td><td>2.6%<\/td><\/tr><tr><td>Expected annual change in the market P/E (contraction)<\/td><td>−0.5%<\/td><\/tr><tr><td>Expected real earnings growth (real GDP growth)<\/td><td>2.2%<\/td><\/tr><tr><td>Expected annual change in shares outstanding (net buybacks)<\/td><td>−0.4%<\/td><\/tr><tr><td>10-year nominal government bond yield<\/td><td>3.80%<\/td><\/tr><tr><td>10-year inflation-linked government bond yield<\/td><td>1.30%<\/td><\/tr><tr><td>3-month government bill yield<\/td><td>2.90%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Saltdal Precision — Cost of Equity Inputs<\/caption><thead><tr><th>Input<\/th><th>Estimate<\/th><\/tr><\/thead><tbody><tr><td>Average beta of listed peers, adjusted to Saltdal's capital structure<\/td><td>1.30<\/td><\/tr><tr><td>Size premium<\/td><td>2.4%<\/td><\/tr><tr><td>Specific-company risk premium (key-person risk, customer concentration)<\/td><td>1.5%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s06-q1", "rel": [1, 6], "los": "CI-R3-L3", "tier": 1, "type": "calc", "stem": "The forward-looking ERP for the domestic market estimated with the Grinold–Kroner model is <i>closest<\/i> to:", "options": {"A": "3.4%.", "B": "4.4%.", "C": "5.9%."}}, {"id": "m2-s06-q2", "rel": [1, 4, 6, 7], "los": "CI-R3-L5", "tier": 1, "type": "calc", "stem": "Using the Grinold–Kroner ERP, the team's estimate of Saltdal's required return on equity is <i>closest<\/i> to:", "options": {"A": "9.7%.", "B": "11.1%.", "C": "12.1%."}}, {"id": "m2-s06-q3", "rel": [3, 4], "los": "CI-R3-L4", "tier": 1, "type": "concept", "stem": "Which proposal for estimating Vestby's required return on equity is <i>least<\/i> appropriate?", "options": {"A": "Proposal 1", "B": "Proposal 2", "C": "Proposal 3"}}, {"id": "m2-s06-q4", "rel": [0, 5], "los": "CI-R2-L3", "tier": 2, "type": "concept", "stem": "Which statement about the team's ESG review of Saltdal is <i>most<\/i> accurate?", "options": {"A": "Issue 1 is material to the fund's valuation, because all identified ESG risks should be included regardless of when they affect the company.", "B": "Issue 2 should be reflected in Saltdal's forecast cash flows, including both the furnace spending and the potential new business.", "C": "Issue 2 should be reflected only by raising the discount rate, because ESG analysis of an equity investment focuses on downside risk."}}]}, {"set": 7, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Lucía Ferreyra manages the Tidewell Real Assets Fund, which holds fully collateralized commodity futures positions and directly owned commercial real estate. At the fund's quarter-end review, she meets with two commodity analysts and with Ilse Brandvold, the fund's real estate acquisitions officer.<\/p>\n<p>Kwabena Asante covers energy. He reports that distillate inventories held by refiners and distributors are at a ten-year low heading into winter and that heating oil users place a high value on having physical supply on hand; in his view, this benefit far exceeds the cost of storing heating oil. Mei Takahara covers grains. She reports that, after a record harvest, wheat stocks in commercial elevators are at multi-year highs, storage space is scarce and expensive, and holding additional physical wheat offers processors little benefit. Both analysts add that producers' short hedging and users' long hedging have been roughly in balance in both markets. Ferreyra asks which theory of commodity futures returns is consistent with both analysts' explanations of the quarter-end curves in Exhibit 1.<\/p>\n<p>During the quarter just ended, the fund held a long heating oil futures position that was fully collateralized with 3-month Treasury bills yielding 4.20% (annualized). At quarter-end, the fund rolled its entire position from the expiring February contract into the March contract at the quarter-end prices in Exhibit 1. Takahara's broker separately quotes the March–July wheat calendar spread at −21.75 cents per bushel.<\/p>\n<p>Brandvold is evaluating the purchase of Ashgrove Plaza, a stabilized, multi-tenant Class B office building. Her Year 1 projections are in Exhibit 2, Panel A. She values the property with the direct capitalization method, applying the simple average of the cap rates implied by recent sales of Class B office buildings in the same submarket (Exhibit 2, Panel B).<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Spot and Futures Prices<\/caption><thead><tr><th>Contract<\/th><th>Start of quarter<\/th><th>Quarter-end<\/th><\/tr><\/thead><tbody><tr><td><b>Heating oil ($/gallon)<\/b><\/td><td><\/td><td><\/td><\/tr><tr><td>Spot<\/td><td>2.552<\/td><td>2.571<\/td><\/tr><tr><td>February futures (contract held by the fund)<\/td><td>2.480<\/td><td>2.535<\/td><\/tr><tr><td>March futures<\/td><td>—<\/td><td>2.498<\/td><\/tr><tr><td>June futures<\/td><td>—<\/td><td>2.412<\/td><\/tr><tr><td><b>Wheat (cents/bushel)<\/b><\/td><td><\/td><td><\/td><\/tr><tr><td>Spot<\/td><td>—<\/td><td>548.00<\/td><\/tr><tr><td>March futures<\/td><td>—<\/td><td>561.25<\/td><\/tr><tr><td>May futures<\/td><td>—<\/td><td>572.50<\/td><\/tr><tr><td>July futures<\/td><td>—<\/td><td>583.00<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Panel A: Ashgrove Plaza — Year 1 Projections<\/caption><thead><tr><th>Item<\/th><th>$ millions<\/th><\/tr><\/thead><tbody><tr><td>Gross potential rental income<\/td><td>9.60<\/td><\/tr><tr><td>Vacancy and collection loss (% of gross potential rental income)<\/td><td>8%<\/td><\/tr><tr><td>Operating expenses (property taxes, insurance, utilities, management)<\/td><td>2.95<\/td><\/tr><tr><td>Depreciation<\/td><td>1.10<\/td><\/tr><tr><td>Interest on planned acquisition loan<\/td><td>1.40<\/td><\/tr><\/tbody><\/table><table><caption>Panel B: Recent Office Transactions<\/caption><thead><tr><th>Sale<\/th><th>Property<\/th><th>NOI ($ millions)<\/th><th>Sale price ($ millions)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Class B office, same submarket<\/td><td>4.12<\/td><td>58.0<\/td><\/tr><tr><td>2<\/td><td>Class B office, same submarket<\/td><td>3.35<\/td><td>49.6<\/td><\/tr><tr><td>3<\/td><td>Class B office, same submarket<\/td><td>5.06<\/td><td>71.8<\/td><\/tr><tr><td>4<\/td><td>Class A office tower, newly renovated, central business district<\/td><td>7.40<\/td><td>134.5<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s07-q1", "rel": [1, 4], "los": "AI-R1-L6", "tier": 1, "type": "concept", "stem": "Which theory of commodity futures returns is <i>most<\/i> consistent with both analysts' explanations of the futures curves in Exhibit 1?", "options": {"A": "Insurance theory", "B": "Hedging pressure hypothesis", "C": "Theory of storage"}}, {"id": "m2-s07-q2", "rel": [2, 4], "los": "AI-R1-L7", "tier": 2, "type": "calc", "stem": "The fund's total return on its heating oil futures position for the quarter is <i>closest<\/i> to:", "options": {"A": "1.81%.", "B": "3.25%.", "C": "4.73%."}}, {"id": "m2-s07-q3", "rel": [3, 5], "los": "AI-R2-L4", "tier": 2, "type": "calc", "stem": "Using the direct capitalization method, Brandvold's estimate of the value of Ashgrove Plaza is <i>closest<\/i> to:", "options": {"A": "$84.4 million.", "B": "$89.1 million.", "C": "$95.4 million."}}, {"id": "m2-s07-q4", "rel": [2, 4], "los": "AI-R1-L5", "tier": 2, "type": "concept", "stem": "The sign of the March–July wheat calendar spread quoted by Takahara's broker <i>most likely<\/i> indicates that:", "options": {"A": "wheat futures are in backwardation, so a rolled long wheat futures position earns a positive roll return.", "B": "the nearer wheat contract is priced below the more distant contract, so a long wheat futures position tends to lose value as futures prices converge toward spot prices.", "C": "the spot price of wheat exceeds the March futures price."}}]}, {"set": 8, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Marisol Rautio is the chief multi-asset strategist at Pellwood Partners. She is preparing the firm's outlook for the government and corporate bond markets of three developed economies—Arvania, Belstrand, and Corvesse—using the data in Exhibit 1. All government bonds in Exhibit 1 are considered default-free.<\/p>\n<p><b>Arvania.<\/b> Rautio expects Arvania's central bank to replace its loosely defined policy objectives with a formal, independently monitored inflation target. She believes investors' expected inflation over the next ten years will remain at 2.0%, but that their uncertainty about future inflation will fall once the target is adopted.<\/p>\n<p><b>Belstrand.<\/b> Belstrand's economy is at the trough of a recession. Rautio uses the price of Belstrand's one-year government zero-coupon bond, together with her estimates of expected inflation and of the premium for inflation uncertainty, to infer the real default-free one-year rate. She expects a recovery to begin over the coming year, with credit spreads narrowing across the corporate bond market. Her junior colleague, Teodor Kalvik, comments on the three Belstrand corporate bonds in Exhibit 2: \"Because the central bank will start raising its policy rate in the recovery, these corporate bonds should underperform government bonds, and the BB-rated bond should do worst because its issuer needs the most time to repair its balance sheet.\"<\/p>\n<p><b>Corvesse.<\/b> Corvesse is in a late expansion, and its yield curve is currently flat. Rautio forecasts that Corvesse will enter a recession next year, with output falling below potential and inflation dropping below the central bank's target.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Economic and Government Bond Market Data<\/caption><thead><tr><th><\/th><th>Arvania<\/th><th>Belstrand<\/th><th>Corvesse<\/th><\/tr><\/thead><tbody><tr><td>Current phase of the business cycle<\/td><td>Mid-expansion<\/td><td>Trough of recession<\/td><td>Late expansion<\/td><\/tr><tr><td>Forecast real GDP growth, next year<\/td><td>1.8%<\/td><td>2.5%<\/td><td>−0.6%<\/td><\/tr><tr><td>Long-term trend real GDP growth<\/td><td>1.6%<\/td><td>2.3%<\/td><td>1.9%<\/td><\/tr><tr><td>Volatility of real GDP growth<\/td><td>0.8%<\/td><td>2.1%<\/td><td>1.2%<\/td><\/tr><tr><td>Price of 1-year government zero-coupon bond (per 100 par)<\/td><td>96.62<\/td><td>95.80<\/td><td>96.95<\/td><\/tr><tr><td>Expected inflation, next year<\/td><td>2.00%<\/td><td>2.60%<\/td><td>1.40%<\/td><\/tr><tr><td>Premium for inflation uncertainty, 1-year horizon<\/td><td>0.10%<\/td><td>0.35%<\/td><td>0.15%<\/td><\/tr><tr><td>2-year government bond yield<\/td><td>3.20%<\/td><td>3.05%<\/td><td>3.10%<\/td><\/tr><tr><td>10-year government bond yield<\/td><td>3.70%<\/td><td>4.40%<\/td><td>3.15%<\/td><\/tr><tr><td>10-year inflation-indexed government bond yield<\/td><td>1.40%<\/td><td>1.85%<\/td><td>1.20%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Selected Belstrand Corporate Bonds<\/caption><thead><tr><th>Bond<\/th><th>Issuer sector<\/th><th>Rating<\/th><th>Spread over government bond<\/th><th>Modified duration<\/th><\/tr><\/thead><tbody><tr><td>Bond 1<\/td><td>Water utility (non-cyclical)<\/td><td>AA<\/td><td>0.70%<\/td><td>6.8<\/td><\/tr><tr><td>Bond 2<\/td><td>Food retailer (non-cyclical)<\/td><td>A<\/td><td>1.10%<\/td><td>6.9<\/td><\/tr><tr><td>Bond 3<\/td><td>Automotive parts (cyclical)<\/td><td>BB<\/td><td>4.20%<\/td><td>6.7<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s08-q1", "rel": [1, 4], "los": "PM-R1-L5", "tier": 1, "type": "concept", "stem": "If Rautio's expectations for Arvania are realized, Arvania's 10-year break-even inflation rate will <i>most likely<\/i>:", "options": {"A": "decrease, because the risk premium for inflation uncertainty embedded in it will fall.", "B": "remain unchanged, because investors' expected inflation will not change.", "C": "increase, because the yield on inflation-indexed bonds will fall relative to the yield on conventional bonds."}}, {"id": "m2-s08-q2", "rel": [2, 4], "los": "PM-R1-L3", "tier": 2, "type": "calc", "stem": "The real default-free one-year rate that Rautio infers for Belstrand is <i>closest<\/i> to:", "options": {"A": "1.25%.", "B": "1.43%.", "C": "1.78%."}}, {"id": "m2-s08-q3", "rel": [3, 4], "los": "PM-R1-L4", "tier": 2, "type": "concept", "stem": "If Rautio's forecast for Corvesse is realized, Corvesse's central bank and yield curve will <i>most likely<\/i> respond as follows:", "options": {"A": "The central bank raises its policy rate, and the yield curve inverts.", "B": "The central bank cuts its policy rate, and the yield curve inverts because long-term yields fall more than short-term yields.", "C": "The central bank cuts its policy rate, and the yield curve steepens because short-term yields fall more than long-term yields."}}, {"id": "m2-s08-q4", "rel": [2, 5], "los": "PM-R1-L6", "tier": 2, "type": "concept", "stem": "If Rautio's forecast for Belstrand is realized, which statement about the bonds in Exhibit 2 is <i>most<\/i> accurate?", "options": {"A": "Kalvik is correct that the three corporate bonds will underperform government bonds, because the policy rate will rise.", "B": "Kalvik is correct that Bond 3 will perform worst, because the spread between BB-rated and AA-rated bonds will widen.", "C": "Bond 3 will most likely outperform Bonds 1 and 2, because spreads of lower-rated and cyclical issuers narrow the most when credit spreads are narrowing."}}]}, {"set": 9, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Celeste Ambrose is an equity analyst covering Ostrander Tools, a manufacturer of industrial hand tools domiciled in Norland. Ostrander's shares are listed in the United States, and it reports in US dollars (USD) under US GAAP. Ostrander has operating segments in Norland, Eskland, and Asia-Pacific and a wholly owned manufacturing subsidiary, Ruvala, in Ruvania.<\/p>\n<p>Cumulative inflation in Ruvania over the past three years exceeded 140%, and the Ruvanian ruval (RVL) has depreciated sharply against the USD. Throughout the year, Ruvala's monetary liabilities, mostly RVL bank loans, exceeded its monetary assets. Ruvala's equipment was purchased three years ago, and the inventory it sold this year was acquired at a weighted average rate shown in Exhibit 1. Ruvala's selling and administrative expenses were incurred evenly during the year.<\/p>\n<p>Ambrose's colleague, Jonah Delacroix, asks how Ruvala's financial statements would be converted into USD if Ostrander reported under IFRS rather than US GAAP.<\/p>\n<p>Ambrose also reviews Ostrander's tax position. Norland exempts the foreign profits of its companies from domestic tax, so each segment's profit is taxed only at the statutory rate of the country where it is earned. Management forecasts the pretax profit mix for next year shown in Exhibit 2 and expects statutory rates to remain unchanged. Finally, Ambrose reviews the components of each segment's sales growth for the year, also shown in Exhibit 2.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Ruvala Data — Panel A: Income Statement for the Year<\/caption><thead><tr><th>Item<\/th><th>RVL millions<\/th><\/tr><\/thead><tbody><tr><td>Revenue<\/td><td>9,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>3,600<\/td><\/tr><tr><td>Depreciation<\/td><td>300<\/td><\/tr><tr><td>Selling and administrative expenses<\/td><td>1,800<\/td><\/tr><tr><td>Operating profit<\/td><td>3,300<\/td><\/tr><\/tbody><\/table><table><caption>Panel B: Exchange Rates<\/caption><thead><tr><th>Date or period<\/th><th>RVL per USD<\/th><\/tr><\/thead><tbody><tr><td>Equipment purchase date (three years ago)<\/td><td>15<\/td><\/tr><tr><td>Beginning of the year<\/td><td>40<\/td><\/tr><tr><td>Weighted average rate for inventory sold this year<\/td><td>45<\/td><\/tr><tr><td>Average for the year<\/td><td>50<\/td><\/tr><tr><td>End of the year<\/td><td>62<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Ostrander Segment Data — Panel A: Pretax Profit by Tax Jurisdiction<\/caption><thead><tr><th><\/th><th>Norland<\/th><th>Ruvania (Ruvala)<\/th><th>Eskland<\/th><\/tr><\/thead><tbody><tr><td>Statutory tax rate<\/td><td>24.0%<\/td><td>35.0%<\/td><td>12.5%<\/td><\/tr><tr><td>Pretax profit, this year (USD millions)<\/td><td>310<\/td><td>50<\/td><td>150<\/td><\/tr><tr><td>Forecast pretax profit, next year (USD millions)<\/td><td>290<\/td><td>30<\/td><td>230<\/td><\/tr><\/tbody><\/table><table><caption>Panel B: Components of Sales Growth for the Year<\/caption><thead><tr><th>Component of sales growth<\/th><th>Norland<\/th><th>Eskland<\/th><th>Asia-Pacific<\/th><\/tr><\/thead><tbody><tr><td>Volume<\/td><td>1.5%<\/td><td>4.5%<\/td><td>1.0%<\/td><\/tr><tr><td>Price/mix<\/td><td>1.0%<\/td><td>2.5%<\/td><td>1.5%<\/td><\/tr><tr><td>Acquisitions<\/td><td>7.0%<\/td><td>0.0%<\/td><td>0.0%<\/td><\/tr><tr><td>Currency translation<\/td><td>0.0%<\/td><td>−2.0%<\/td><td>9.0%<\/td><\/tr><tr><td>Reported sales growth (USD)<\/td><td>9.5%<\/td><td>5.0%<\/td><td>11.5%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s09-q1", "rel": [1, 2], "los": "FSA-R3-L7", "tier": 1, "type": "concept", "stem": "The <i>most<\/i> accurate response to Delacroix's question is that, under IFRS, Ruvala's financial statements would be:", "options": {"A": "restated for inflation, including its monetary assets and liabilities, and then translated at the current exchange rate.", "B": "restated for inflation for nonmonetary items and then translated at the current exchange rate, with a purchasing power gain recognized in net income.", "C": "restated for inflation for nonmonetary items and then translated at the current exchange rate, with a purchasing power loss included in the cumulative translation adjustment."}}, {"id": "m2-s09-q2", "rel": [1, 4], "los": "FSA-R3-L5", "tier": 1, "type": "calc", "stem": "Under US GAAP, Ruvala's operating profit for the year in USD, excluding any remeasurement gain or loss, is <i>closest<\/i> to:", "options": {"A": "$16.1 million.", "B": "$44.0 million.", "C": "$66.0 million."}}, {"id": "m2-s09-q3", "rel": [3, 5], "los": "FSA-R3-L8", "tier": 2, "type": "calc", "stem": "If management's forecast is realized, Ostrander's effective tax rate for next year will be <i>closest<\/i> to:", "options": {"A": "19.8%.", "B": "21.7%.", "C": "23.8%."}}, {"id": "m2-s09-q4", "rel": [3, 5], "los": "FSA-R3-L9", "tier": 2, "type": "concept", "stem": "Which statement about the sales growth of Ostrander's segments is <i>most<\/i> accurate?", "options": {"A": "Norland's sales growth is the most sustainable, because it was not affected by currency translation.", "B": "Eskland's organic sales growth is higher than its reported sales growth, because currency translation reduced its reported growth.", "C": "Asia-Pacific's sales growth is the most sustainable, because it has the highest reported growth and positive price/mix growth."}}]}, {"set": 10, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Saoirse Brennan, an equity analyst, is valuing Halberd Machinery, a cyclical maker of mining and construction equipment. Halberd's earnings fell sharply in 2025 as equipment orders slowed. Brennan considers 2021–2025 to be Halberd's most recent full business cycle and wants a normalized EPS that reflects the company's growth in size over the cycle. Exhibit 1 shows Halberd's per-share history.<\/p>\n<p>Brennan next estimates a justified leading P/E for Halberd from forecast fundamentals. She expects Halberd to retain 55% of earnings and earn a long-run ROE of 12.4%. She estimates the required return on equity with the CAPM, using a risk-free rate of 3.6%, an equity risk premium of 5.5%, and Halberd's beta of 1.20. Halberd's shares trade at $42.00, and the consensus EPS forecast for next year is $3.00.<\/p>\n<p>Brennan also compares Halberd with Corran Industries, a more highly leveraged competitor, using the data in Exhibit 2. She makes three statements:<\/p>\n<ul><li>Statement 1: \"Given the large difference in the two companies' debt levels, EV/EBITDA is a more appropriate multiple than P/E for comparing them.\"<\/li>\n<li>Statement 2: \"Because EBITDA excludes depreciation and amortization, EV/EBITDA fully adjusts for the difference in the two companies' capital spending.\"<\/li>\n<li>Statement 3: \"To compute each company's enterprise value, I add its cash and cash equivalents to the market values of its equity and debt.\"<\/li><\/ul>\n<p>Finally, Halberd's reported EPS for the most recent quarter was $0.74, versus a consensus forecast of $0.62. The standard deviation of analysts' EPS forecasts for the quarter was $0.08, and the standard deviation of Halberd's quarterly unexpected earnings over the past 20 quarters was $0.15. Brennan's assistant, Felix Wendt, divides $0.12 by $0.08 and reports Halberd's \"SUE\" as 1.50.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Halberd Machinery — Per-Share Data<\/caption><thead><tr><th>Year<\/th><th>2020<\/th><th>2021<\/th><th>2022<\/th><th>2023<\/th><th>2024<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>EPS ($)<\/td><td>3.40<\/td><td>1.90<\/td><td>3.10<\/td><td>3.65<\/td><td>2.20<\/td><td>1.40<\/td><\/tr><tr><td>ROE<\/td><td>17.4%<\/td><td>9.2%<\/td><td>14.2%<\/td><td>15.6%<\/td><td>8.9%<\/td><td>5.5%<\/td><\/tr><tr><td>Book value per share at year-end ($)<\/td><td>20.20<\/td><td>21.10<\/td><td>22.60<\/td><td>24.30<\/td><td>25.40<\/td><td>25.90<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Halberd and Corran — Selected Data (2025)<\/caption><thead><tr><th>$ millions<\/th><th>Halberd<\/th><th>Corran<\/th><\/tr><\/thead><tbody><tr><td>Market value of equity<\/td><td>2,100<\/td><td>1,150<\/td><\/tr><tr><td>Market value of debt<\/td><td>380<\/td><td>1,480<\/td><\/tr><tr><td>Cash and cash equivalents<\/td><td>140<\/td><td>90<\/td><\/tr><tr><td>EBITDA<\/td><td>410<\/td><td>395<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>120<\/td><td>165<\/td><\/tr><tr><td>Capital expenditures<\/td><td>115<\/td><td>240<\/td><\/tr><tr><td>Net income<\/td><td>70<\/td><td>38<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s10-q1", "rel": [0, 5], "los": "EQ-R4-L5", "tier": 1, "type": "calc", "stem": "Using the method Brennan prefers, Halberd's normalized EPS is <i>closest<\/i> to:", "options": {"A": "$2.16.", "B": "$2.45.", "C": "$2.77."}}, {"id": "m2-s10-q2", "rel": [1], "los": "EQ-R4-L9", "tier": 1, "type": "calc", "stem": "Based on Brennan's justified leading P/E, Halberd's shares are <i>most likely<\/i>:", "options": {"A": "overvalued, because the justified leading P/E is about 13.3.", "B": "undervalued, because the justified leading P/E is about 14.2.", "C": "undervalued, because the justified leading P/E is about 16.3."}}, {"id": "m2-s10-q3", "rel": [2, 3, 6], "los": "EQ-R4-L15", "tier": 1, "type": "concept", "stem": "Which of Brennan's statements is <i>most<\/i> accurate?", "options": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}}, {"id": "m2-s10-q4", "rel": [4], "los": "EQ-R4-L17", "tier": 2, "type": "concept", "stem": "The figure of 1.50 that Wendt reports is <i>best<\/i> described as Halberd's:", "options": {"A": "standardized unexpected earnings, which measures the earnings surprise relative to the size of past forecast errors.", "B": "scaled earnings surprise; Halberd's standardized unexpected earnings is 0.80.", "C": "relative-strength indicator, because it compares Halberd's reported results with analysts' expectations."}}]}, {"set": 11, "session": 1, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Ilse Vardanyan, CFA, is an equity trading analyst at Marlowe Bridge Capital, a broker-dealer with an institutional trading desk and a retail brokerage division. Vardanyan reports to Kasimir Ostby, CFA, head of the institutional desk. Each morning she prepares market commentary for the desk's 30 institutional clients. Clients often ask her follow-up questions, and over the past year she has started answering them through a messaging app on her personal phone because clients find it faster than email. She clears the app's chat history at the end of each month to free storage space. Excerpts from Marlowe's compliance manual are shown in Exhibit 1.<\/p>\n<p>Outside work, Vardanyan posts on a widely followed investing forum under the pseudonym \"NorthCapeTrader.\" In March, after obtaining pre-clearance from compliance, she buys 20,000 shares of Ostrel Mining, a thinly traded small-cap company, for her personal account. That evening she posts: \"Hearing that a major producer is circling Ostrel — a bid could come at a 40% premium. Unconfirmed, just what I'm hearing. Disclosure: I'm long OSTL.\" Vardanyan has not heard anything about a possible bid from any source. Over the next two days, Ostrel's share price rises 18% on volume six times its normal level, and she sells all of her shares.<\/p>\n<p>Vardanyan also publishes Quillfern Notes, a weekly newsletter of short-term trade ideas for individual investors. About 400 subscribers pay $25 a month. Marlowe's retail brokerage division sells a similar daily trade-ideas service to its own clients for a monthly fee. Before launching the newsletter, Vardanyan mentioned to Ostby in a hallway conversation that she \"writes about markets on weekends\"; she did not mention subscriptions or fees. She drafts most issues during quiet afternoon periods at her desk, using the charting terminal that Marlowe licenses for the trading desk. Teodor Brask, a Level II CFA candidate on the desk, proofreads the newsletter on weekends without pay.<\/p>\n<p>Last year, Ostby filed for personal bankruptcy after a restaurant he co-owned with his brother-in-law closed during a regional recession. The bankruptcy court approved a repayment plan and noted that Ostby had fully and accurately disclosed his assets and debts to his creditors. Ostby informed Marlowe's compliance department of the filing when he made it. The case was later reported in a local business newspaper, and one of the desk's institutional clients has asked Marlowe whether Ostby should continue to supervise the desk.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Marlowe Bridge Capital — Compliance Manual Excerpts<\/caption><thead><tr><th>Section<\/th><th>Policy<\/th><\/tr><\/thead><tbody><tr><td>4.2 Personal trading<\/td><td>Employees must obtain pre-clearance from compliance before trading any security with a market capitalization below $500 million.<\/td><\/tr><tr><td>6.1 Electronic communications<\/td><td>All business email sent from firm accounts is archived automatically for seven years.<\/td><\/tr><tr><td>6.3 Mobile devices<\/td><td>Employees should use firm-issued phones for client contact. Messages sent from personal devices are not captured by the firm's archive.<\/td><\/tr><tr><td>8.4 Gifts<\/td><td>Gifts from clients or vendors above $100 in value must be reported to compliance.<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s11-q1", "rel": [1], "los": "ETH-R3-L1", "tier": 2, "type": "concept", "stem": "Did Vardanyan's forum post about Ostrel Mining violate Standard II(B) Market Manipulation?", "options": {"A": "Yes, because she spread information she knew had no basis in order to induce trading and profit from the price move.", "B": "No, because she disclosed in the post that she held a long position in Ostrel.", "C": "No, because she labeled the information as unconfirmed and posted under a personal pseudonym rather than as a Marlowe employee."}}, {"id": "m2-s11-q2", "rel": [0, 4], "los": "ETH-R2-L2", "tier": 1, "type": "concept", "stem": "Under Standard V(C) Record Retention, Vardanyan should <i>most appropriately<\/i> handle the messaging-app communications with clients by:", "options": {"A": "continuing her current practice, because Marlowe's policy archives only firm email and the recordkeeping requirement is the firm's responsibility.", "B": "retaining the messages, because investment-related communications with clients must be kept regardless of the medium used.", "C": "retaining only the messages after which a client placed a trade, because those are the communications that support investment actions."}}, {"id": "m2-s11-q3", "rel": [2], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Does Vardanyan's operation of Quillfern Notes violate Standard IV(A) Loyalty?", "options": {"A": "No, because she told her supervisor about her market writing before launching the newsletter.", "B": "Yes, because she runs a paid service that competes with her employer, partly on its time and resources, without obtaining its consent to the terms.", "C": "Yes, because members and candidates may not receive compensation from an outside business while employed."}}, {"id": "m2-s11-q4", "rel": [3], "los": "ETH-R3-L1", "tier": 2, "type": "concept", "stem": "Does Ostby's personal bankruptcy constitute a violation of Standard I(D) Misconduct?", "options": {"A": "Yes, because the publicly reported bankruptcy has led a client to question his role and so reflects adversely on his professional reputation.", "B": "No, because the bankruptcy did not involve dishonesty, fraud, or deceit.", "C": "Yes, because a member who is unable to manage his personal finances lacks the competence required to supervise an institutional trading desk."}}]}, {"set": 12, "session": 2, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>Oona Fairhurst is a quantitative credit analyst at Wexcombe Asset Management, which manages high-yield bond portfolios. She is building four tools for Wexcombe's credit committee.<\/p>\n<p>The first tool forecasts each issuer's five-year CDS spread, measured in basis points, from 85 financial ratios and market variables, many of which are highly correlated with one another. The committee wants a parsimonious linear model whose remaining coefficients can be explained to portfolio managers. A colleague suggests using a support vector machine instead.<\/p>\n<p>The second tool groups the 240 issuers in Wexcombe's high-yield universe using 18 unlabeled features. Fairhurst does not want to fix the number of groups in advance. She wants to see how small groups of very similar issuers combine into progressively larger groups and then choose the number of peer groups after reviewing the result.<\/p>\n<p>The third tool flags issuers likely to default within 12 months. Fairhurst has trained two classifiers, and Exhibit 2 shows their results on a test sample of 1,000 issuers, 80 of which defaulted. The committee states that failing to flag an issuer that later defaults is far more costly than reviewing an issuer that does not default.<\/p>\n<p>The fourth tool is a logistic regression of 12-month default (1 = default, 0 = no default) estimated on the same universe. Exhibit 1 shows the estimates and data for Brevik Freight, an issuer in Wexcombe's portfolio. Brevik plans a debt-financed acquisition that Fairhurst expects to raise its Debt/EBITDA by one turn, to 5.0, with its other variables unchanged.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Logistic Regression of 12-Month Default (n = 2,400 issuer-years; log-likelihood −512.4)<\/caption><thead><tr><th>Variable<\/th><th>Coefficient<\/th><th>t-statistic<\/th><th>Sample mean<\/th><th>Brevik Freight (current)<\/th><\/tr><\/thead><tbody><tr><td>Intercept<\/td><td>−4.20<\/td><td>−6.85<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>Debt/EBITDA (×)<\/td><td>0.65<\/td><td>5.12<\/td><td>3.1<\/td><td>4.0<\/td><\/tr><tr><td>Interest coverage (×)<\/td><td>−0.38<\/td><td>−3.47<\/td><td>4.6<\/td><td>3.0<\/td><\/tr><tr><td>Log total assets<\/td><td>−0.12<\/td><td>−2.21<\/td><td>2.9<\/td><td>2.5<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Test-Sample Results for Default Classifiers (positive = default; 1,000 issuers, 80 defaults)<\/caption><thead><tr><th>Classifier<\/th><th>True positives<\/th><th>False positives<\/th><th>False negatives<\/th><th>True negatives<\/th><\/tr><\/thead><tbody><tr><td>Model X<\/td><td>52<\/td><td>18<\/td><td>28<\/td><td>902<\/td><\/tr><tr><td>Model Y<\/td><td>64<\/td><td>56<\/td><td>16<\/td><td>864<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s12-q1", "rel": [1], "los": "QM-R6-L3", "tier": 1, "type": "concept", "stem": "For Fairhurst's first tool, which of the following is <i>most appropriate<\/i>?", "options": {"A": "LASSO; increasing the penalty parameter λ would set the coefficients of more features to zero.", "B": "A support vector machine, because it can separate observations using a large number of features.", "C": "LASSO; setting the penalty parameter λ equal to zero would retain only the most predictive features."}}, {"id": "m2-s12-q2", "rel": [2], "los": "QM-R6-L4", "tier": 1, "type": "concept", "stem": "The algorithm <i>most appropriate<\/i> for Fairhurst's second tool is:", "options": {"A": "agglomerative hierarchical clustering.", "B": "k-means clustering.", "C": "principal components analysis."}}, {"id": "m2-s12-q3", "rel": [3, 6], "los": "QM-R7-L3", "tier": 1, "type": "calc", "stem": "Given the committee's view on the cost of errors, which classifier should Fairhurst prefer, and why?", "options": {"A": "Model X, because its F1 score is about 0.69.", "B": "Model Y, because its recall is about 0.80.", "C": "Model X, because its accuracy is about 0.95."}}, {"id": "m2-s12-q4", "rel": [4, 5], "los": "QM-R4-L3", "tier": 2, "type": "calc", "stem": "If Brevik's Debt/EBITDA rises to 5.0 with its other variables unchanged, its estimated probability of default is <i>closest<\/i> to:", "options": {"A": "7.5%.", "B": "8.4%.", "C": "9.2%."}}]}, {"set": 13, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Dmitri Vosk manages a corporate bond portfolio for Wendlebury Mutual Assurance, a life insurer. He is reviewing a convertible bond issued by Corvale Systems and two bonds with embedded options issued by Pennick Utilities. Wendlebury's investment policy limits exposure to any single issuer to 3% of the portfolio and requires all holdings to be rated investment grade at purchase.<\/p>\n<p>The terms of the Corvale convertible and Vosk's estimate of its straight value are shown in Exhibit 1. Corvale's shares currently trade at $34.40. Vosk's colleague, Hanna Treloar, asks how the convertible would behave if a product launch failed and Corvale's share price fell to $12, with Corvale's credit quality unchanged.<\/p>\n<p>Pennick has issued two bonds that are identical except for their embedded options. Both pay a 4.10% annual coupon and mature in seven years. One is callable at par, and the other is putable at par; each option can first be exercised two years from now. Pennick also has an option-free seven-year bond outstanding. Wendlebury's economist expects the benchmark yield curve, which is currently upward sloping, to flatten: short-term rates would rise and long-term rates would fall by amounts that leave the price of Pennick's option-free seven-year bond unchanged. Interest rate volatility is expected to remain unchanged.<\/p>\n<p>To assess interest rate risk, Vosk values the three Pennick bonds with Wendlebury's binomial interest rate model after parallel shifts of 30 bps in the benchmark yield curve. The results are shown in Exhibit 2. Vosk notes that Wendlebury's liabilities are most exposed to a rise in interest rates.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Corvale Systems Convertible Bond<\/caption><thead><tr><th>Feature<\/th><th>Corvale 3.25% Convertible Bond due 2031<\/th><\/tr><\/thead><tbody><tr><td>Par value<\/td><td>$1,000<\/td><\/tr><tr><td>Conversion ratio<\/td><td>25 shares per bond<\/td><\/tr><tr><td>Market price<\/td><td>$1,052.00<\/td><\/tr><tr><td>Vosk's estimated straight value<\/td><td>$905.00<\/td><\/tr><tr><td>Issuer call<\/td><td>Callable from 2028 at 103% of par<\/td><\/tr><tr><td>Threshold dividend<\/td><td>$0.60 per share per year (current dividend $0.40)<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Pennick Utilities — Model Values per 100 of Par<\/caption><thead><tr><th>Pennick 4.10% bond due in seven years<\/th><th>Current value<\/th><th>Benchmark curve up 30 bps<\/th><th>Benchmark curve down 30 bps<\/th><\/tr><\/thead><tbody><tr><td>Option-free<\/td><td>102.20<\/td><td>100.40<\/td><td>104.03<\/td><\/tr><tr><td>Callable at par<\/td><td>101.20<\/td><td>99.47<\/td><td>102.31<\/td><\/tr><tr><td>Putable at par<\/td><td>103.05<\/td><td>101.96<\/td><td>104.80<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s13-q1", "rel": [1, 4], "los": "FI-R3-L15", "tier": 2, "type": "calc", "stem": "The market conversion premium per share of the Corvale convertible bond is <i>closest<\/i> to:", "options": {"A": "$1.80.", "B": "$5.60.", "C": "$7.68."}}, {"id": "m2-s13-q2", "rel": [1, 4], "los": "FI-R3-L17", "tier": 2, "type": "concept", "stem": "In the scenario Treloar describes, the Corvale convertible bond will <i>most likely<\/i>:", "options": {"A": "trade much like a straight bond, with its price driven mainly by interest rates and Corvale's credit risk.", "B": "trade much like Corvale's common stock, falling roughly in proportion to the share price.", "C": "trade below its straight value, because the conversion option would be far out of the money."}}, {"id": "m2-s13-q3", "rel": [2], "los": "FI-R3-L5", "tier": 2, "type": "concept", "stem": "If the economist's yield curve forecast is realized, the prices of Pennick's callable and putable bonds will <i>most likely<\/i>:", "options": {"A": "increase for the callable bond and decrease for the putable bond.", "B": "decrease for the callable bond and increase for the putable bond.", "C": "decrease for both bonds."}}, {"id": "m2-s13-q4", "rel": [3, 5], "los": "FI-R3-L11", "tier": 2, "type": "calc", "stem": "Based on Exhibit 2, the one-sided up-duration of Pennick's callable bond is <i>closest<\/i> to:", "options": {"A": "3.66.", "B": "4.68.", "C": "5.70."}}]}, {"set": 14, "session": 2, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p>Thornvale Group is a listed packaging manufacturer founded by the Ravensholt family. Thornvale has two share classes. Class A shares carry one vote each and trade on the stock exchange; Class B shares carry ten votes each, are unlisted, and are all held by the Ravensholt family. The family also owns some Class A shares (Exhibit 2). Thornvale's chief executive, Marta Strandberg, is not a family member; she was appointed by a board on which family representatives hold five of nine seats.<\/p>\n<p>After the sale of a non-core division, the board is considering how to return $360 million to shareholders. The sale proceeds are included in Thornvale's year-end 2025 cash balance. Ines Okonedo, the chief financial officer, presents three proposals:<\/p>\n<ul><li>Proposal 1: Pay a special cash dividend of $6.00 per share from the sale proceeds.<\/li>\n<li>Proposal 2: Keep the sale proceeds for acquisitions and instead repurchase Class A shares through a fixed-price tender offer at a 10% premium to the current share price of $48.00. The repurchase would be financed entirely with new debt at a pre-tax interest rate of 6.0%. Thornvale's marginal tax rate is 25%. The family has said it would not tender any of its shares.<\/li>\n<li>Proposal 3: Pay a 10% stock dividend now and defer any cash distribution.<\/li><\/ul>\n<p>Okonedo expects Thornvale's net income before any financing effects of the proposals to remain at its 2025 level. Selected 2025 data are shown in Exhibit 1. Thornvale's regular dividend policy targets a payout ratio of 60% of net income, and its revolving credit facility requires a debt-to-equity ratio below 0.60.<\/p>\n<p>Mateo Quirke, an analyst at a pension fund that owns Class A shares, is assessing Thornvale's dividend safety and governance. He notes that the family's representatives on the board voted for Proposal 2, which would leave the family's Class B shares untouched and raise the family's share of total votes. Quirke also observes that no shareholder outside the family owns more than 4% of the Class A shares.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Thornvale Group — Selected Financial Data<\/caption><thead><tr><th>$ millions, except per-share data<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Net income<\/td><td>240<\/td><\/tr><tr><td>Free cash flow to equity (FCFE)<\/td><td>310<\/td><\/tr><tr><td>Regular cash dividends paid<\/td><td>150<\/td><\/tr><tr><td>Share repurchases<\/td><td>90<\/td><\/tr><tr><td>Cash and cash equivalents<\/td><td>520<\/td><\/tr><tr><td>Current assets<\/td><td>1,180<\/td><\/tr><tr><td>Current liabilities<\/td><td>640<\/td><\/tr><tr><td>Total debt<\/td><td>900<\/td><\/tr><tr><td>Total shareholders' equity<\/td><td>2,400<\/td><\/tr><tr><td>Shares outstanding, Class A + Class B (millions)<\/td><td>60.0<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Thornvale Group — Share Classes<\/caption><thead><tr><th>Share class<\/th><th>Shares outstanding (millions)<\/th><th>Votes per share<\/th><th>Held by Ravensholt family (millions)<\/th><\/tr><\/thead><tbody><tr><td>Class A (listed)<\/td><td>52.0<\/td><td>1<\/td><td>5.2<\/td><\/tr><tr><td>Class B (unlisted)<\/td><td>8.0<\/td><td>10<\/td><td>8.0<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m2-s14-q1", "rel": [2, 3, 5], "los": "CI-R1-L1", "tier": 1, "type": "concept", "stem": "Compared with Proposal 1, Proposal 3 would <i>most likely<\/i>:", "options": {"A": "leave Thornvale's current ratio and debt-to-equity ratio unchanged.", "B": "increase Thornvale's debt-to-equity ratio, because retained earnings would decrease.", "C": "reduce the Ravensholt family's proportional ownership of Thornvale, because new shares would be issued."}}, {"id": "m2-s14-q2", "rel": [2, 3, 5, 6], "los": "CI-R1-L10", "tier": 2, "type": "calc", "stem": "If Proposal 2 is implemented, Thornvale's EPS is <i>closest<\/i> to:", "options": {"A": "$4.21.", "B": "$4.26.", "C": "$4.51."}}, {"id": "m2-s14-q3", "rel": [4, 5], "los": "CI-R1-L13", "tier": 2, "type": "calc", "stem": "The 2025 dividend safety ratio that Quirke should use to reflect all cash distributed to Thornvale's shareholders is <i>closest<\/i> to:", "options": {"A": "1.29.", "B": "1.60.", "C": "2.07."}}, {"id": "m2-s14-q4", "rel": [0, 4, 6], "los": "CI-R2-L1", "tier": 1, "type": "concept", "stem": "The governance conflict that Quirke should regard as <i>most<\/i> significant at Thornvale is a:", "options": {"A": "principal–agent conflict, because Thornvale's share ownership is dispersed and its chief executive is not a family member.", "B": "principal–principal conflict, because the family controls a majority of the votes through its Class B shares.", "C": "principal–principal conflict, because the family owns a majority of Thornvale's equity."}}]}, {"set": 15, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Oskar Pettersen, a credit and equity analyst, is reviewing Velmora Werke AG, a listed manufacturer of industrial pumps that reports under IFRS. In March 2025, Velmora issued new shares and used most of the proceeds to repay bank debt. Velmora's 2025 return on equity (ROE) was higher than in 2024, but Pettersen believes the improvement understates the gain in operating performance because the share issue reduced financial leverage. He also wants to check whether the higher 2025 earnings are supported by low accruals. Selected financial data are shown in Exhibit 1. Velmora defines debt as short-term and long-term borrowings.<\/p>\n<p>Pettersen then meets Leah Mbatha, Velmora's chief financial officer, to discuss employee compensation. Velmora grants at-the-money share options to managers on 1 January each year. Each grant has a 10-year contractual term and vests in full after four years of service; the expense is recognized on a straight-line basis over the vesting period. Mbatha says that Velmora expects no forfeitures and plans a further grant on 1 January 2026. Mbatha estimates that the 2026 grant will have a fair value of €9.60 per option, which is also the current fair value of the options outstanding.<\/p>\n<p>Velmora also sponsors a defined benefit pension plan for its German employees. Pettersen notes that the 2025 actual return on plan assets was lower than the interest income on plan assets computed at the 4.0% discount rate, and that a decrease in the discount rate produced an actuarial loss on the obligation. Data from the pension and share option notes are shown in Exhibit 2.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Velmora Werke AG — Selected Financial Data<br>Panel A: Income and Cash Flow Data<\/caption><thead><tr><th>€ millions<\/th><th>2024<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Revenue<\/td><td>4,800<\/td><td>5,300<\/td><\/tr><tr><td>Operating profit (EBIT)<\/td><td>432<\/td><td>530<\/td><\/tr><tr><td>Interest expense<\/td><td>72<\/td><td>50<\/td><\/tr><tr><td>Profit before tax<\/td><td>360<\/td><td>480<\/td><\/tr><tr><td>Income tax expense<\/td><td>90<\/td><td>120<\/td><\/tr><tr><td>Net income<\/td><td>270<\/td><td>360<\/td><\/tr><tr><td>Cash flow from operating activities<\/td><td>380<\/td><td>520<\/td><\/tr><tr><td>Cash flow from investing activities<\/td><td>(330)<\/td><td>(230)<\/td><\/tr><\/tbody><\/table><table><caption>Panel B: Balance Sheet Data<\/caption><thead><tr><th>€ millions, at 31 December<\/th><th>2023<\/th><th>2024<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Total assets<\/td><td>4,300<\/td><td>4,700<\/td

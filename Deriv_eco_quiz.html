<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Derivatives Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>

<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q2", "src": "ECO 오답", "module": 1, "tag": "Full price = clean price + AI", "vig": 0, "stem": "The full spot price of the three-year Treasury note is:", "opts": {"A": "101.00.", "B": "101.25.", "C": "101.50."}, "ans": "B", "en": "S0 = quoted (clean) price + accrued interest. AI = (60/180) × (1.5/2) = 0.25, so S0 = 101 + 0.25 = 101.25.", "ko": "Full(dirty) price는 clean price에 경과이자(AI)를 더한 값입니다. AI는 '마지막 쿠폰 이후 지난 날수 / 쿠폰기간'에 반기 쿠폰을 곱합니다. (60/180) × 0.75 = 0.25 → 101.25.", "trap": "AI는 '지난 날수'로 계산한다. 다음 쿠폰까지 남은 날수(120일)를 쓰면 틀린다.", "f": "Full price = Clean price + AI,  AI = (지난 날수 / 쿠폰기간) × 쿠폰", "why": {"A": "101은 clean(quoted) price입니다. 실제 결제가격인 full price는 AI를 더해야 합니다.", "C": "다음 쿠폰까지 남은 120일로 AI를 계산한 값(0.50)입니다. AI는 지난 60일 기준입니다."}, "orig": "ECO Module 1 Q2"}, {"id": "ECO-M1-Q4", "src": "ECO 오답", "module": 1, "tag": "Forward 가치 = PV(Ft − F0)", "vig": 0, "stem": "The value of the JGB long forward position is closest to:", "opts": {"A": "JPY15,980,823.", "B": "JPY15,990,409.", "C": "JPY16,000,000."}, "ans": "B", "en": "Vt = PV[Ft − F0] = (155 − 153)/(1.0012)^(6/12) = 1.9988 per 100 par. For eight contracts of JPY100 million: 0.019988 × 100,000,000 × 8 = JPY15,990,409.", "ko": "Long forward 가치는 (현재 forward 가격 − 계약 forward 가격)을 남은 기간(6개월)만큼 할인한 값입니다. (155 − 153)/1.0012^0.5 = 1.9988(par 100당) → 0.019988 × 1억 × 8 = JPY15,990,409.", "trap": "할인 기간은 '남은 만기'(6/12)다. 지수를 빼먹거나(1년 할인), 할인 자체를 빼먹는 실수가 오답 보기다.", "f": "V_t(long) = (F_t − F_0) / (1 + r)^(T−t)", "why": {"A": "지수 6/12를 빼고 1년 전체로 할인한 값입니다(2/1.0012 = 1.9980).", "C": "가격 차이 2를 할인하지 않은 값입니다. Forward 차액은 만기에 받으므로 현재가치로 바꿔야 합니다."}, "orig": "ECO Module 1 Q4"}, {"id": "ECO-M1-Q6", "src": "ECO 오답", "module": 1, "tag": "Pay-fixed swap 가치 = NA(FSt − FS0)ΣPV", "vig": 0, "stem": "Based on Exhibit 2, the value of the pay-fixed interest rate swap is closest to:", "opts": {"A": "–JPY6,491,550.", "B": "–JPY2,980,500.", "C": "–JPY994,793."}, "ans": "B", "en": "Current 3-year swap rate FSt = (1 − 0.9976)/2.9961 = 0.000801. Pay-fixed value = NA × (FSt − FS0) × ΣPV = JPY5 billion × (0.000801 − 0.001) × 2.9961 = –JPY2,980,500. Rates fell, so paying the old higher fixed rate is a loss.", "ko": "남은 만기 3년의 현재 swap rate는 (1 − 마지막 PV factor)/ΣPV = (1 − 0.9976)/2.9961 = 0.0801%입니다. Pay-fixed 쪽 가치 = 50억 × (0.000801 − 0.001) × 2.9961 = –JPY2,980,500. 금리가 내려서 옛날의 높은 고정금리를 내는 쪽이 손해입니다.", "trap": "현재 swap rate는 spot rate 평균이 아니라 PV factor로 구한다. 금리 차이에 반드시 annuity factor(ΣPV)를 곱한다.", "f": "FS_t = (1 − PV_n) / ΣPV_i,  V(pay-fixed) = NA × (FS_t − FS_0) × ΣPV_i", "why": {"A": "spot rate 평균(0.06%)을 현재 swap rate로 쓴 값입니다. Swap rate는 (1 − PV_n)/ΣPV로 구합니다.", "C": "금리 차이 × 원금만 계산하고 ΣPV(2.9961)를 곱하지 않은 값입니다. 남은 3번의 지급 차액을 모두 할인해서 더해야 합니다."}, "orig": "ECO Module 1 Q6"}, {"id": "ECO-M1-Q9", "src": "ECO 오답", "module": 1, "tag": "Carry arbitrage 존재 여부 – F0 vs FV(S0)", "vig": 1, "stem": "Based on Exhibit 2, Troubadour should find that an arbitrage opportunity relating to TSI shares is", "opts": {"A": "not available.", "B": "available based on carry arbitrage.", "C": "available based on reverse carry arbitrage."}, "ans": "A", "en": "The carry arbitrage model price is FV(S0) = 250 × (1.003)^0.75 = $250.562289, exactly the market forward price. With F0 = FV(S0), neither carry nor reverse carry arbitrage exists.", "ko": "무차익 forward 가격 = 250 × 1.003^0.75 = 250.562289로, 시장 forward 가격과 정확히 같습니다. 같으면 차익거래 기회가 없습니다.", "trap": "F0 > FV(S0)이면 carry arbitrage, F0 < FV(S0)이면 reverse carry arbitrage, 같으면 기회 없음.", "f": "F_0 = S_0 × (1 + r)^T (carry 없음)", "why": {"B": "Carry arbitrage(현물 매수 + forward 매도)는 forward가 고평가(F0 > FV(S0))일 때만 가능합니다. 여기는 두 값이 같습니다.", "C": "Reverse carry arbitrage(현물 공매도 + forward 매수)는 forward가 저평가일 때만 가능합니다. 여기는 두 값이 같습니다."}, "orig": "ECO Module 1 Q9"}, {"id": "ECO-M1-Q11", "src": "ECO 오답", "module": 1, "tag": "배당 있는 equity forward 중도 가치 (short)", "vig": 1, "stem": "Based on Exhibits 2 and 3, and assuming annual compounding, the per share value of Troubadour's short position in the TSI forward contract three months after contract initiation is closest to:", "opts": {"A": "$1.6549.", "B": "$5.1561.", "C": "$6.6549."}, "ans": "C", "en": "New forward price: F0.25 = [245 − 1.50/(1.00325)^0.25] × (1.00325)^0.5 = $243.8966. Long value = (243.8966 − 250.562289)/(1.00325)^0.5 = –$6.6549, so the short position gains $6.6549.", "ko": "3개월 뒤 같은 만기의 새 forward 가격 = (245 − 배당 1.50의 현재가치) × 1.00325^0.5 = 243.8966. Long 가치 = (243.8966 − 250.5623)/1.00325^0.5 = –6.6549이므로 short는 +6.6549입니다.", "trap": "배당은 받을 시점(3개월 뒤)까지 할인해 현물가에서 빼고, 남은 기간(6개월)으로 forward를 다시 구한다. Short는 long의 부호를 뒤집는다.", "f": "F_t = [S_t − PV(배당)] × (1+r)^(T−t),  V_t(short) = (F_0 − F_t)/(1+r)^(T−t)", "why": {"A": "새 forward 가격을 제대로 구하지 않은 값입니다. 새 forward 가격은 243.8966이고, 이를 원래 가격 250.5623과 비교해 할인하면 6.6549입니다.", "B": "배당 1.50을 빼지 않고 새 forward 가격을 245 × 1.00325^0.5로 구한 값입니다. 배당은 carry benefit이므로 현재가치로 빼야 합니다."}, "orig": "ECO Module 1 Q11"}, {"id": "ECO-M1-Q20", "src": "ECO 오답", "module": 1, "tag": "FRA 결제금액 – 만기 MRR로 할인", "vig": 2, "stem": "Based on Exhibit 6 and the three-month US dollar MRR at expiration, the payment amount that the bank will receive to settle the 6 × 9 FRA is closest to:", "opts": {"A": "$19,945.", "B": "$24,925.", "C": "$39,781."}, "ans": "A", "en": "Settlement (pay-fixed) = NA × [(Lm − FRA0) × tm]/(1 + Dm × tm) = 20,000,000 × [(0.011 − 0.007) × 90/360]/(1 + 0.011 × 90/360) = 20,000/1.00275 = $19,945.", "ko": "6 × 9 FRA는 만기(6개월) 시점에 3개월 MRR로 결제합니다. (1.10% − 0.70%) × 90/360 × 2,000만 = 20,000을 3개월 할인(1 + 0.011 × 0.25)하면 $19,945입니다. Advanced settle이라 할인합니다.", "trap": "FRA의 기초금리는 6개월이 아니라 3개월(9 − 6) MRR이다. 결제는 만기에 하므로 이자 지급 시점에서 3개월 할인한다.", "f": "Settlement = NA × (L_m − FRA_0) × t_m / (1 + D_m × t_m)", "why": {"B": "6개월 MRR(1.20%)을 써서 계산한 값에 가깝습니다. 6 × 9 FRA의 기초금리는 3개월 MRR(1.10%)입니다.", "C": "기간을 6개월(180/360)로 잡아 이자 차이를 두 배로 계산한 값입니다. FRA 기간은 3개월입니다."}, "orig": "ECO Module 1 Q20"}, {"id": "ECO-M1-Q22", "src": "ECO 오답", "module": 1, "tag": "FRA 고정금리 – 단리 기간금리 비율", "vig": 3, "stem": "Gutiérrez's fixed-rate calculation for the forward rate agreement should be closest to:", "opts": {"A": "3.73%.", "B": "3.88%.", "C": "5.59%."}, "ans": "A", "en": "A 6 × 24 FRA starts in 6 months and ends in 24 months (an 18-month loan). FRA0 = {[1 + 0.0335 × 720/360]/[1 + 0.021 × 180/360] − 1}/(540/360) = (1.067/1.0105 − 1)/1.5 = 3.73%.", "ko": "6 × 24 FRA는 6개월 뒤 시작해 24개월에 끝나는 18개월짜리 금리입니다. 긴 쪽 24개월 금리와 짧은 쪽 6개월 금리를 '1 + 금리 × 기간'으로 바꿔 나누고, 1을 뺀 뒤 기간 1.5년으로 나눕니다. (1.067/1.0105 − 1)/1.5 = 3.73%.", "trap": "A × B FRA는 'A개월 뒤 시작, B개월에 끝'이다. 6 × 24는 30개월이 아니다. 마지막에 t_m으로 나누는 것을 잊지 말 것.", "f": "FRA_0 = {[1 + L_T × t_T] / [1 + L_h × t_h] − 1} / t_m", "why": {"B": "FRA가 6 + 24 = 30개월에 끝난다고 보고 30개월 금리를 쓴 값입니다. 6 × 24는 24개월에 끝납니다.", "C": "기간 금리(5.59%)를 t_m(1.5)으로 나누지 않은 값입니다. 연율로 바꿔야 합니다."}, "orig": "ECO Module 1 Q22"}, {"id": "ECO-M1-Q28", "src": "ECO 오답", "module": 1, "tag": "Pay-fixed swap 가치 – 남은 PV factor 합", "vig": 4, "stem": "The market value of the pay fixed receive floating interest rate swap is closest to:", "opts": {"A": "−$221,220.", "B": "$79,271.", "C": "$647,145."}, "ans": "C", "en": "New 3-year swap rate = (1 − 0.9326)/(0.9832 + 0.9604 + 0.9326) = 0.0234. Pay-fixed value = −50,000,000 × (0.0189 − 0.0234) × 2.8762 = $647,145.", "ko": "남은 3년의 새 swap rate = (1 − 0.9326)/2.8762 = 2.34%. 고정금리를 1.89%로 내는데 시장 금리가 2.34%로 올랐으니 pay-fixed가 이득입니다. 5,000만 × (0.0234 − 0.0189) × 2.8762 = $647,145.", "trap": "금리 차이에는 남은 모든 지급 시점의 PV factor 합(annuity factor)을 곱한다. 첫 해나 마지막 해 PV factor 하나만 곱하면 틀린다. (참고: 지문 앞부분은 receive-fixed라고 적혀 있지만 이 문제는 pay-fixed 쪽 가치를 묻습니다.)", "f": "V(pay-fixed) = NA × (FS_t − FS_0) × ΣPV", "why": {"A": "PV factor를 첫 해 것(0.9832) 하나만 곱하고 부호도 반대로 둔 값입니다.", "B": "마지막 PV factor(0.9326) 하나만 곱한 값입니다. 남은 3번의 지급을 모두 반영해야 합니다."}, "orig": "ECO Module 1 Q28"}, {"id": "ECO-M1-Q30", "src": "ECO 오답", "module": 1, "tag": "차익거래의 두 원칙", "vig": 5, "stem": "Are Fourie's comments regarding fundamental rules for arbitrageurs most likely correct?", "opts": {"A": "Yes", "B": "No, Rule 1 is incorrect", "C": "No, Rule 2 is incorrect"}, "ans": "A", "en": "Both rules are correct. The arbitrageur (a) never uses her own money (short-sale proceeds are invested at the risk-free rate) and (b) takes no market price risk on the total trade, even though individual legs may carry price risk that offsets when done simultaneously.", "ko": "둘 다 맞습니다. 차익거래자는 ① 자기 돈을 쓰지 않고(공매도 대금은 무위험이자율로 운용) ② 전체 거래에서 가격 위험을 지지 않습니다. 개별 거래 하나하나에는 가격 위험이 있어도 동시에 하므로 서로 상쇄됩니다.", "trap": "'개별 구성요소에 가격 위험이 있을 수 있다'는 말이 틀린 것처럼 보이지만 맞는 설명이다. 위험이 없어야 하는 것은 전체 포지션이다.", "f": "차익거래 원칙: 자기 돈 0, 전체 가격 위험 0", "why": {"B": "Rule 1은 맞습니다. 차익거래자는 자기 돈을 쓰지 않고, 공매도 대금은 무위험이자율로 운용합니다.", "C": "Rule 2도 맞습니다. 개별 거래에는 가격 위험이 있어도 동시에 실행하므로 전체 위험은 상쇄됩니다."}, "orig": "ECO Module 1 Q30"}, {"id": "ECO-M1-Q32", "src": "ECO 오답", "module": 1, "tag": "Equity swap 현금흐름 – 주식수익률 음수", "vig": 5, "stem": "The cash flow to Ndlovu after the first quarter of the Tanzanite swap is closest to:", "opts": {"A": "–ZAR140,471.", "B": "ZAR219,529.", "C": "ZAR340,000."}, "ans": "B", "en": "Ndlovu is the counterparty: he receives fixed and pays the equity return. Quarterly rate = (1.032)^(1/4) − 1 = 0.0079 → fixed receipt ZAR39,528.77. Equity return is −3.6%, so instead of paying he receives 5,000,000 × 0.036 = ZAR180,000. Net = ZAR219,529.", "ko": "고객이 receive-equity/pay-fixed이니 Ndlovu는 반대로 receive-fixed/pay-equity입니다. 고정금리 분기분 약 39,529를 받고, 주식 수익률이 −3.6%라서 주식 쪽 지급이 거꾸로 ZAR180,000 '수취'가 됩니다. 합계 ZAR219,529.", "trap": "Pay-equity 쪽은 주식 수익률이 음수면 오히려 돈을 받는다. 연 고정금리를 분기 금리로 바꾸는 것도 잊지 말 것. (ECO 해설은 (1.032)^(1/4) − 1로 분기 금리를 구했고, 3.2% × 90/360 = 0.8%로 해도 답은 B입니다.)", "f": "Pay-equity 쪽 CF = NA × (분기 고정금리 − 주식 수익률)", "why": {"A": "주식 쪽 180,000을 받는 대신 내는 것으로 처리한 값입니다. 수익률이 음수이면 pay-equity 쪽이 받습니다.", "C": "연 고정금리 3.2%를 분기에 그대로 적용해 고정 수취액을 160,000으로 계산한 값입니다."}, "orig": "ECO Module 1 Q32"}, {"id": "ECO-M1-Q34", "src": "ECO 오답", "module": 1, "tag": "FRA 중도 가치 – 새 FRA rate와 할인", "vig": 6, "stem": "The current value of Cline's FRA is closest to:", "opts": {"A": "–US$10,625.", "B": "–US$10,515.", "C": "US$10,612."}, "ans": "B", "en": "After 30 days the 3 × 6 FRA is a 2 × 5 FRA. New FRA rate = {[1 + 0.025 × 150/360]/[1 + 0.015 × 60/360] − 1}/(90/360) = 3.16%. Value to the long (receive-floating) = 5,000,000 × (0.0316 − 0.0231) × (90/360)/(1 + 0.025 × 150/360) = $10,515. Cline pays floating (short FRA), so the value is −US$10,515.", "ko": "30일이 지나서 3 × 6 FRA는 이제 2 × 5 FRA입니다. 새 FRA rate = 3.16%. 금리 차이(3.16% − 2.31%) × 90/360 × 500만을 FRA 만기(지금부터 5개월)까지 5개월 금리로 할인하면 10,515입니다. Cline은 pay-floating(short FRA)이라 금리 상승이 손해 → −US$10,515.", "trap": "할인은 남은 FRA 만기 전체 기간(h + m − g = 150일)으로 한다. Pay-floating(receive-fixed)은 short FRA다.", "f": "V_g = NA × [FRA_g − FRA_0] × t_m / [1 + L(h+m−g) × t(h+m−g)]", "why": {"A": "금리 차이를 할인하지 않고 계산한 값입니다(−10,625). 차액은 5개월 뒤 받으므로 할인해야 합니다.", "C": "2개월 금리(1.5%)와 30일로 잘못 할인했고 부호도 반대입니다. Pay-floating은 금리가 오르면 손해입니다."}, "orig": "ECO Module 1 Q34"}, {"id": "ECO-M1-Q35", "src": "ECO 오답", "module": 1, "tag": "Currency swap 고정금리 – 해당 통화 PV factor", "vig": 6, "stem": "Based on the information in Exhibit 1, the annual fixed swap rate Mehta would pay is closest to:", "opts": {"A": "0.48%.", "B": "0.92%.", "C": "1.88%."}, "ans": "A", "en": "Mehta pays euros. Euro periodic rate = (1 − 0.9953)/(0.9991 + 0.9979 + 0.9967 + 0.9953) = 0.0012; annualized × 4 = 0.48%.", "ko": "Mehta는 유로를 내는 쪽이므로 유로 PV factor로 계산합니다. (1 − 0.9953)/(4개 PV 합 3.989) = 0.12%(분기) → × 4 = 0.48%.", "trap": "내는 통화(EUR)의 금리 구조를 써야 한다. HK$ 금리는 받는 쪽 금리다. 분모는 PV factor 합이다.", "f": "분기 swap rate = (1 − PV_n) / ΣPV_i,  연율 = 분기 × 4", "why": {"B": "HK$ PV factor로 계산한 값으로, Mehta가 받는 HK$ 고정금리입니다.", "C": "분모에 마지막 PV factor 하나만 넣은 값입니다. 분모는 모든 지급 시점의 PV factor 합입니다."}, "orig": "ECO Module 1 Q35"}, {"id": "ECO-M1-Q36", "src": "ECO 오답", "module": 1, "tag": "Receive-equity / pay-fixed swap 중도 가치", "vig": 6, "stem": "Based on the information in Exhibit 2, the market value of Mensah's equity swap is closest to:", "opts": {"A": "AUD 7,665,000.", "B": "AUD 7,713,870.", "C": "AUD 9,993,870."}, "ans": "C", "en": "Value = equity leg − fixed-rate bond. Equity leg = (3,738/3,250) × 75,000,000 = 86,256,923. Fixed bond = 900,000 × (0.9976 + 0.9924 + 0.9861 + 0.9696) + 75,000,000 × 0.9696 = 76,263,053. Value ≈ AUD 9,993,870.", "ko": "Receive-equity, pay-fixed는 '주식 쪽 가치 − 고정금리채 가치'입니다. 주식 쪽 = (3,738/3,250) × 7,500만. 고정금리채 = 분기 쿠폰 90만(4.8%/4) × 남은 4개 PV 합 + 원금 7,500만 × 마지막 PV 0.9696. 차이 ≈ AUD 9,993,870.", "trap": "고정금리채 가치에서 원금도 반드시 마지막 PV factor로 할인한다. 원금을 할인하지 않으면 B가 된다.", "f": "V = (S_t/S_0) × NA − [C × ΣPV + NA × PV_n]", "why": {"A": "주식 수익률과 고정금리의 차이에 원금을 곱한 값입니다. 남은 고정 지급과 원금을 현재가치로 계산해야 합니다.", "B": "고정금리채의 원금 7,500만을 할인하지 않고 그대로 더한 값입니다."}, "orig": "ECO Module 1 Q36"}, {"id": "ECO-M1-Q38", "src": "ECO 오답", "module": 1, "tag": "Reverse carry arbitrage – 연속복리 배당수익률", "vig": 7, "stem": "Does Nils's stock index evaluation most likely identify an arbitrage opportunity?", "opts": {"A": "No, the forward is fairly priced", "B": "Yes, there is a carry arbitrage opportunity", "C": "Yes, there is a reverse carry arbitrage opportunity"}, "ans": "C", "en": "F0 = S0 × e^((r − δ)T) = 1,900 × e^(0.0075 − 0.025) = 1,867.04. The market forward (1,863) is below this, so the forward is underpriced: buy the forward and short-sell the index (reverse carry arbitrage). The expected future index level is irrelevant.", "ko": "무차익 forward = 1,900 × e^(0.75% − 2.5%) = 1,867.04입니다. 시장가 1,863이 더 낮으니 forward가 저평가 → forward 매수 + 지수 공매도(reverse carry arbitrage). Kozorez의 지수 전망(1,903)은 상관없습니다.", "trap": "배당수익률이 금리보다 높으면 forward 가격은 현물보다 낮다. '현물보다 싸다 = 저평가'가 아니라 무차익 가격과 비교한다. 미래 지수 예상치는 무시한다.", "f": "F_0 = S_0 × e^((r_c − δ)T);  F_0 < 무차익가 → reverse carry", "why": {"A": "1,863은 무차익 가격 1,867.04보다 낮아서 공정가격이 아닙니다.", "B": "Carry arbitrage는 forward가 고평가(F0 > 무차익가)일 때입니다. 여기는 저평가입니다."}, "orig": "ECO Module 1 Q38"}, {"id": "ECO-M1-Q39", "src": "ECO 오답", "module": 1, "tag": "FRA 포지션 – Euribor 예금 의무 없음", "vig": 7, "stem": "Kozorez's comments to Nils regarding FRAs are most likely:", "opts": {"A": "correct regarding counterparties and correct regarding their transactions.", "B": "correct regarding counterparties and incorrect regarding their transactions.", "C": "incorrect regarding counterparties and incorrect regarding their transactions."}, "ans": "B", "en": "The fixed-rate receiver is short (short Euribor) and the floating-rate receiver is long (long Euribor) — correct. But an FRA is cash-settled; the long is not required to make a Euribor deposit, though it can be combined with one.", "ko": "고정금리 수취자 = short FRA(short Euribor), 변동금리 수취자 = long FRA(long Euribor)는 맞습니다. 하지만 FRA는 차액만 현금 결제하므로 long이 실제로 Euribor 예금을 '해야 하는' 것은 아닙니다.", "trap": "FRA는 실제 대출·예금이 일어나지 않는 차액결제 계약이다. 'must make a deposit'이라는 표현이 함정이다.", "f": "Long FRA = receive floating(pay fixed),  Short FRA = receive fixed(pay floating)", "why": {"A": "거래 설명이 틀렸습니다. FRA는 현금 차액결제라 Euribor 예금 의무가 없습니다.", "C": "상대방 설명(고정 수취 = short, 변동 수취 = long)은 맞습니다."}, "orig": "ECO Module 1 Q39"}, {"id": "ECO-M1-Q40", "src": "ECO 오답", "module": 1, "tag": "Conversion factor는 AI에 적용 안 됨", "vig": 7, "stem": "Which characteristic observed by Nils regarding Treasury futures is least likely correct?", "opts": {"A": "Characteristic 1", "B": "Characteristic 2", "C": "Characteristic 3"}, "ans": "B", "en": "Characteristic 2 is incorrect: the conversion factor does not apply to accrued interest. It adjusts the futures price so that eligible bonds with different coupons and maturities are comparable (e.g., to an equivalent 6% coupon bond). Characteristics 1 (cheapest-to-deliver basket) and 3 (daily MTM → value zero at day end) are correct.", "ko": "Characteristic 2가 틀렸습니다. Conversion factor는 경과이자를 조정하는 것이 아니라, 쿠폰·만기가 다른 인도 가능 채권들을 비슷하게 맞추는 조정입니다(예: 6% 쿠폰 채권 기준). 1(최저가 인도 채권 바스켓)과 3(매일 정산 → 하루 끝 가치 0)은 맞습니다.", "trap": "인도대금 = 선물가 × CF + AI. CF는 선물가에만 곱하고 AI에는 곱하지 않는다.", "f": "Delivery proceeds = Q × CF + AI_T", "why": {"A": "맞는 설명입니다. Short는 바스켓에서 가장 싼(cheapest-to-deliver) 채권을 인도합니다.", "C": "맞는 설명입니다. 선물은 매일 정산되어 하루가 끝날 때 가치가 0으로 돌아갑니다."}, "orig": "ECO Module 1 Q40"}, {"id": "ECO-M1-Q44", "src": "ECO 오답", "module": 1, "tag": "Receive-fixed swap 90일 뒤 가치", "vig": 8, "stem": "Using data in Exhibit 2 and a 30/360 day count, the market value of Novatel's swap after 90 days is closest to:", "opts": {"A": "–$2,875,000.", "B": "–$2,408,880.", "C": "–$602,250."}, "ans": "C", "en": "Original quarterly fixed rate (from Exhibit 1) = 0.008396. New PV factors: PV(90) = 0.994505, PV(180) = 0.987069, PV(270) = 0.972786. New periodic swap rate = (1 − 0.972786)/(sum 2.95436) = 0.009211. Receive-fixed value = (0.008396 − 0.009211) × 2.95436 × 250,000,000 ≈ –$602,250.", "ko": "처음 정한 분기 고정금리는 0.8396%입니다. 90일 뒤 금리로 새 PV factor를 구하고 남은 3번 지급의 새 swap rate를 구하면 0.9211%입니다. Receive-fixed는 낮은 옛 금리를 받으니 손해: (0.008396 − 0.009211) × ΣPV 2.954 × 2.5억 ≈ –$602,250.", "trap": "새 PV factor는 90일 뒤 금리로 다시 만든다(예: 1/(1 + 0.0262 × 180/360)). 금리 차이는 분기 단위, annuity는 남은 3개 PV 합이다.", "f": "V(receive-fixed) = NA × (FS_0 − FS_t) × ΣPV_t", "why": {"A": "계산이 틀린 값입니다. 새 PV factor로 남은 3번 지급의 새 분기 swap rate(0.9211%)를 구해 옛 금리(0.8396%)와 비교해야 합니다.", "B": "금리 차이를 분기 단위로 맞추지 않아 손실이 약 4배로 커진 값입니다."}, "orig": "ECO Module 1 Q44"}, {"id": "ECO-M1-Q46", "src": "ECO 오답", "module": 1, "tag": "Receive-equity / pay-floating CF – 처음 변동금리", "vig": 8, "stem": "The equity swap cash flow for KPS Financial Services' at 90 days is closest to:", "opts": {"A": "–$2,517,200.", "B": "–$2,232,400.", "C": "–$1,807,200."}, "ans": "A", "en": "Receive equity, pay floating: CF = NA × (equity return − floating rate). Equity return = (905 − 925)/925 = −2.1622%. Floating rate set at initiation: 1.42% × 90/360 = 0.355%. CF = (−0.021622 − 0.00355) × 100,000,000 = –$2,517,200.", "ko": "주식 수익률(−2.16%)을 받고 변동금리를 냅니다. 변동금리는 '처음에 정해지고 나중에 지급'(advanced set, settled in arrears)이므로 시작 시점의 90일 MRR 1.42%를 씁니다. (−2.1622% − 0.355%) × 1억 = –$2,517,200.", "trap": "첫 변동금리 지급은 90일 뒤의 새 MRR(2.21%)이 아니라 시작 시점 MRR(1.42%)로 정해진다. 주식 수익률이 음수면 그만큼도 낸다.", "f": "CF = NA × (R_equity − MRR_0 × 90/360)", "why": {"B": "계산이 틀린 값입니다. 주식 수익률 −2.1622%와 변동금리 0.355%를 둘 다 KPS가 내므로 합계 −2.5172%입니다.", "C": "변동금리 0.355%를 빼지 않고 더한 값입니다(−2.1622% + 0.355%). KPS는 변동금리를 내는 쪽입니다."}, "orig": "ECO Module 1 Q46"}, {"id": "ECO-M1-Q47", "src": "ECO 오답", "module": 1, "tag": "Carry cost에 차입이자 포함 X", "vig": 9, "stem": "Is Kang most likely correct in her description of the pricing of forward contracts?", "opts": {"A": "Yes", "B": "No, she is incorrect regarding inputs to the arbitrage model", "C": "No, she is incorrect regarding her examples of carry costs and carry benefits"}, "ans": "C", "en": "Kang wrongly includes interest paid to borrow funds as a carry cost. The financing cost is already captured by compounding the spot price at the risk-free rate; counting it again would be double counting. Her inputs and carry-benefit examples are correct.", "ko": "Kang은 '자산 매입 자금의 차입이자'를 carry cost에 넣었는데 이것이 틀렸습니다. 자금 조달 비용은 현물가를 무위험이자율로 복리 계산할 때 이미 들어가 있어 이중 계산이 됩니다. 입력 변수와 carry benefit 예시는 맞습니다.", "trap": "Carry cost = 보관·보험·손실 등. 차입이자는 FV(S0)에 이미 들어 있다.", "f": "F_0 = FV(S_0) + FV(carry costs) − FV(carry benefits)", "why": {"A": "carry cost 목록에 차입이자가 들어 있어 틀렸습니다.", "B": "입력 변수(현물가, 금리, carry benefit, carry cost) 설명은 맞습니다."}, "orig": "ECO Module 1 Q47"}, {"id": "ECO-M1-Q48", "src": "ECO 오답", "module": 1, "tag": "Short equity index forward 손실 – 연속복리", "vig": 9, "stem": "Given the information Kang provided in her response to Pak's question about the equity forward position, the loss on the position is closest to:", "opts": {"A": "KRW0.38 billion.", "B": "KRW1.65 billion.", "C": "KRW2.03 billion."}, "ans": "C", "en": "New forward price for the remaining 0.5 year: F0.5 = 278.50 × e^((0.0068 − 0.022) × 0.5) = 276.39. Short value = (265.07 − 276.39)/e^(0.0068 × 0.5) = −11.28. × KRW180 million = loss of KRW2.03 billion.", "ko": "남은 6개월짜리 새 forward 가격 = 278.50 × e^((0.68% − 2.2%) × 0.5) = 276.39입니다. Short 가치 = (265.07 − 276.39)를 6개월 할인 = −11.28 → × 1억 8천만 = KRW2.03 billion 손실.", "trap": "새 forward 가격과 할인 모두 남은 기간 0.5년을 쓴다. 현물가와 비교하는 것이 아니라 새 forward 가격과 비교한다.", "f": "F_t = S_t × e^((r − δ)(T−t)),  V(short) = (F_0 − F_t) × e^(−r(T−t))", "why": {"A": "새 forward 가격과 현재 지수(278.50)의 차이로 계산한 값입니다. 원래 계약가 265.07과 비교해야 합니다.", "B": "남은 기간 0.5년을 반영하지 않고 1년으로 계산한 값입니다."}, "orig": "ECO Module 1 Q48"}, {"id": "ECO-M1-Q50", "src": "ECO 오답", "module": 1, "tag": "Equity-for-equity swap은 가격 결정 불필요", "vig": 9, "stem": "Is Kang most likely correct in her description of equity-for-equity swaps?", "opts": {"A": "Yes.", "B": "No, she is incorrect regarding the need to price the swap.", "C": "No, she is incorrect regarding the relationship between the pricing of equity swaps and interest rate swaps."}, "ans": "A", "en": "Both descriptions are correct. An equity-for-equity swap equals an equity-for-fixed swap plus a fixed-for-equity swap; the fixed legs are identical and cancel, so no pricing is needed. The fixed rate on an equity-for-fixed swap equals the fixed rate of a same-maturity fixed-for-floating interest rate swap.", "ko": "둘 다 맞습니다. 주식-주식 swap = (주식↔고정) + (고정↔주식)이고 두 고정금리가 같아 상쇄되므로 따로 가격을 정할 필요가 없습니다. 주식-고정 swap의 고정금리는 같은 만기의 일반 금리스왑 고정금리와 같습니다.", "trap": "Equity swap의 고정금리 = 같은 만기 IRS 고정금리. 주식 기대수익률과는 상관없다.", "f": "Equity-for-equity = Equity-for-fixed + Fixed-for-equity", "why": {"B": "가격 결정이 필요 없다는 설명은 맞습니다. 두 고정 다리가 상쇄됩니다.", "C": "Equity swap의 고정금리는 같은 만기·같은 시점의 IRS 고정금리와 같다는 설명도 맞습니다."}, "orig": "ECO Module 1 Q50"}, {"id": "ECO-M1-Q54", "src": "ECO 오답", "module": 1, "tag": "Swap 변동금리는 advanced set, settled in arrears", "vig": null, "stem": "A 1-year plain vanilla interest rate swap has semiannual resets. The fixed swap rate is 5.2% and the subsequent floating MRRs through the life of the contract are given as follows:\nTime\t6-Month MRR (Annualized) Observed at Time t\nt = 0\t5.0%\nt = 6 months\t4.8%\nt = 12 months\t5.4%\nIf the 30/360 day count method is used, the pay-fixed, receive-floating net cash flow at t = 6 months is closest to:", "opts": {"A": "–0.002 per unit notional.", "B": "–0.001 per unit notional.", "C": "0.001 per unit notional."}, "ans": "B", "en": "The floating rate is set in advance and paid in arrears, so the payment at 6 months uses the MRR observed at t = 0 (5.0%). Net CF (pay-fixed) = 0.5 × (0.050 − 0.052) = –0.001.", "ko": "변동금리는 기간 시작 때 정하고 기간 끝에 지급합니다. 그래서 6개월 시점 지급에는 t = 0의 MRR 5.0%를 씁니다. Pay-fixed 순현금흐름 = 0.5 × (5.0% − 5.2%) = –0.001.", "trap": "6개월 시점 지급에 6개월 시점 MRR(4.8%)을 쓰면 틀린다. 반기라서 0.5를 곱하는 것도 잊지 말 것.", "f": "CF(pay-fixed)_t = AP × (MRR_(t−1) − r_FIX)", "why": {"A": "6개월 시점 MRR(4.8%)을 쓴 값입니다. 그 시점 지급은 t = 0에 정해진 5.0%로 합니다.", "C": "receive-fixed 쪽 현금흐름(부호 반대)이거나 12개월 MRR을 쓴 값입니다."}, "orig": "ECO Module 1 Q54"}, {"id": "ECO-M1-Q55", "src": "ECO 오답", "module": 1, "tag": "Floating-rate bond는 reset 시점에 par", "vig": null, "stem": "Which of the following is not an assumption made when using replication with bonds to price a plain vanilla interest rate swap at initiation? The value of the floating-rate bond at initiation should be equal to:", "opts": {"A": "zero.", "B": "its par value.", "C": "the value of the fixed-rate bond."}, "ans": "A", "en": "It is the swap (not the floating-rate bond) whose value is zero at initiation. The floating-rate bond is worth par at each reset date, including initiation, and the swap rate is set so that the fixed-rate bond equals the floating-rate bond.", "ko": "시작 시점에 가치가 0인 것은 swap이지 변동금리채가 아닙니다. 변동금리채는 reset 시점(시작 포함)에 항상 par(1)이고, swap rate는 고정금리채 가치가 변동금리채 가치(par)와 같아지도록 정합니다.", "trap": "'0'인 것은 swap 가치, 'par'인 것은 변동금리채 가치. 둘을 헷갈리지 말 것.", "f": "시작 시점: V_floating = 1 = V_fixed → V_swap = 0", "why": {"B": "맞는 가정입니다. 변동금리채는 reset 시점에 쿠폰이 할인율과 같아 par로 거래됩니다.", "C": "맞는 가정입니다. Swap을 pricing한다는 것은 고정금리채 가치 = 변동금리채 가치가 되게 고정금리를 정하는 것입니다."}, "orig": "ECO Module 1 Q55"}, {"id": "ECO-M1-Q56", "src": "ECO 오답", "module": 1, "tag": "Currency swap 가치 V = Va − St·Vb", "vig": null, "stem": "Sixty days ago, a European company entered into a receive-fixed GBP, pay-fixed EUR swap with the following specifications:\nSwap notional amount (exchanged at initiation and maturity)\tEUR 5 million\nOriginal swap term\t1 year, with quarterly resets\nFixed swap rate (at initiation) in EUR\t4.55%\nFixed swap rate (at initiation) in GBP\t5.28%\nGBP/EUR spot exchange rate at initiation (amount of GBP per 1 EUR)\t0.88\nCurrently, long positions in the associated bonds with unit face value are priced at EUR 0.97 and GBP 1.06, respectively. If the current exchange rate is 0.91 GBP/EUR, the value of the swap to the European company is closest to:", "opts": {"A": "GBP 250,500.", "B": "GBP 396,000.", "C": "GBP 693,057."}, "ans": "A", "en": "NA in GBP = S0 × NA(EUR) = 0.88 × 5,000,000 = GBP 4,400,000. V = Va − St × Vb = 4,400,000 × 1.06 − 0.91 × (5,000,000 × 0.97) = 4,664,000 − 4,413,500 = GBP 250,500.", "ko": "받는 통화(GBP) 채권 가치에서 주는 통화(EUR) 채권 가치를 '현재 환율'로 GBP로 바꿔 뺍니다. GBP 원금 = 0.88 × 500만 = 440만. 440만 × 1.06 − 0.91 × (500만 × 0.97) = GBP 250,500.", "trap": "원금 환산에는 처음 환율(S0), 가치 환산에는 현재 환율(St)을 쓴다. 환율 표기(GBP per EUR)를 뒤집지 말 것.", "f": "V_CS = V_a − S_t × V_b,  NA_a = S_0 × NA_b", "why": {"B": "EUR 채권을 처음 환율 0.88로 환산한 값입니다. 가치 평가는 현재 환율 0.91로 합니다.", "C": "환율을 EUR per GBP로 거꾸로 읽은 값입니다. 0.88은 1 EUR당 GBP입니다."}, "orig": "ECO Module 1 Q56"}, {"id": "ECO-M1-Q57", "src": "ECO 오답", "module": 1, "tag": "9 × 12 FRA 가격", "vig": null, "stem": "An analyst gathers the following market quotations for spot market reference rates up to one year:\nMaturity (Months)\tRate\n3\t2.30%\n6\t2.50%\n9\t2.70%\n12\t3.00%\nAssuming a 30/360 day count, the no-arbitrage fixed rate on a new 9 × 12 forward rate agreement (FRA) is closest to:", "opts": {"A": "2.30%.", "B": "2.85%.", "C": "3.82%."}, "ans": "C", "en": "FRA0 = {[1 + LT × tT]/[1 + Lh × th] − 1}/tm = {[1 + 0.030 × 1]/[1 + 0.027 × 9/12] − 1}/(3/12) ≈ 3.82%.", "ko": "9 × 12 FRA는 9개월 뒤 시작하는 3개월 금리입니다. (1 + 3.00% × 1)/(1 + 2.70% × 0.75) − 1을 구하고 0.25로 나누면 3.82%입니다.", "trap": "Forward 금리는 두 spot 금리의 평균이 아니다. 긴 금리가 짧은 금리보다 높으면 forward 금리는 둘보다 더 높다.", "f": "FRA_0 = {[1 + L_T × t_T] / [1 + L_h × t_h] − 1} / t_m", "why": {"A": "3개월 spot 금리를 그대로 쓴 값입니다. 9개월 뒤 시작하는 forward 금리를 구해야 합니다.", "B": "9개월과 12개월 금리의 단순 평균입니다. Forward 금리는 평균이 아닙니다."}, "orig": "ECO Module 1 Q57"}, {"id": "ECO-M1-Q61", "src": "ECO 오답", "module": 1, "tag": "Carry 포트폴리오 만기 가치 = 0", "vig": null, "stem": "A trader buys an asset using funds borrowed at the risk-free interest rate, and simultaneously sells it forward. The no-arbitrage value of the position at the forward expiration date should be:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "B", "en": "Asset + borrowed funds + short forward must be worth zero at T to prevent arbitrage: the forward price F0 must equal the financing cost FV(S0).", "ko": "자산 매수 + 무위험 차입 + forward 매도 포트폴리오는 만기에 가치가 0이어야 차익거래가 없습니다. 즉 F0 = FV(S0)입니다.", "trap": "양수면 판 쪽이, 음수면 산 쪽이 공짜 이익을 얻는다. 무차익이면 0이다.", "f": "F_0 = FV(S_0) ⇔ 만기 가치 0", "why": {"A": "음수면 매수자가 이익을 보므로 매도자가 계약할 이유가 없습니다. 무차익 가치는 0입니다.", "C": "양수면 차익거래 이익이 생깁니다. 무차익 가치는 0입니다."}, "orig": "ECO Module 1 Q61"}, {"id": "ECO-M1-Q64", "src": "ECO 오답", "module": 1, "tag": "Forward 중도 가치 – 새 forward 가격 사용", "vig": null, "stem": "An investor buys a 1-year futures contract at 104 that expires in six months. The underlying is currently trading at 107, and the annually compounded risk-free rate is 3%. Assuming no other carry cash flows, the forward value of the existing contract is closest to:", "opts": {"A": "–4.53.", "B": "2.96.", "C": "4.53."}, "ans": "C", "en": "Ft = 107 × (1.03)^0.5 = 108.5931. Vt = (108.5931 − 104)/(1.03)^0.5 = 4.5257 ≈ 4.53.", "ko": "남은 6개월 기준 새 forward 가격 = 107 × 1.03^0.5 = 108.59. Long 가치 = (108.59 − 104)/1.03^0.5 = 4.53.", "trap": "현물가(107)가 아니라 새 forward 가격(108.59)과 비교한다. Long은 (Ft − F0).", "f": "V_t(long) = [S_t(1+r)^(T−t) − F_0]/(1+r)^(T−t) = S_t − F_0/(1+r)^(T−t)", "why": {"A": "(F0 − Ft)로 순서를 뒤집은 값입니다. Long 포지션은 (Ft − F0)입니다.", "B": "현물가 107을 새 forward 가격으로 쓴 값입니다. 남은 기간의 이자를 반영해야 합니다."}, "orig": "ECO Module 1 Q64"}, {"id": "ECO-M1-Q68", "src": "ECO 오답", "module": 1, "tag": "Adjusted futures price = Q0 × CF", "vig": null, "stem": "The adjusted price of a fixed-income futures contract at Time 0 is equal to the:", "opts": {"A": "sum of the quoted bond price and accrued interest.", "B": "ratio of the quoted futures price to the conversion factor.", "C": "product of the quoted futures price and the conversion factor."}, "ans": "C", "en": "The adjusted futures price F0 = Q0 × CF. Conversion factors allow multiple deliverable bonds; the futures price is the quoted futures price times (not divided by) the conversion factor.", "ko": "조정 선물가격 F0 = 호가 선물가격 Q0 × CF입니다. 여러 채권을 인도할 수 있게 하는 장치이고, CF로 나누는 것이 아니라 곱합니다.", "trap": "선물가 → 채권 쪽 금액: × CF. 채권 가격 → 선물 호가: ÷ CF.", "f": "F_0 = Q_0 × CF,  Q_0 = F_0 / CF", "why": {"A": "clean price + AI는 채권의 full spot price입니다. 선물가격이 아닙니다.", "B": "Q0 ÷ CF가 아니라 Q0 × CF입니다. 나누는 것은 채권 쪽 가격에서 선물 호가를 구할 때입니다."}, "orig": "ECO Module 1 Q68"}, {"id": "ECO-M1-Q69", "src": "ECO 오답", "module": 1, "tag": "Swap 가치 – 고정금리 변화 없으면 0", "vig": null, "stem": "The equilibrium fixed rate for a 3-year fixed-for-floating interest rate swap with semiannual resets was 1.5% on the initiation date. At the first swap reset, the equilibrium fixed rate for the 2.5-year fixed-for-floating interest rate swap is 1.5% and the present value factors are as follows:\nMaturity (Years)\tPresent Value Factor\n0.5\t0.995025\n1.0\t0.987167\n1.5\t0.977995\n2.0\t0.967118\n2.5\t0.954654\nThe value of the swap to the pay-fixed party is:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "B", "en": "Swap value = NA × (FSt − FS0) × ΣPV. Since FSt = FS0 = 1.5%, the value is zero; the PV factors do not matter.", "ko": "Swap 가치 = 원금 × (현재 swap rate − 처음 swap rate) × ΣPV입니다. 둘 다 1.5%로 같으니 가치는 0이고, PV factor는 계산할 필요가 없습니다.", "trap": "PV factor 표를 주면 계산하고 싶어지지만, 고정금리 차이가 0이면 가치도 0이다.", "f": "V(pay-fixed) = NA × (FS_t − FS_0) × ΣPV", "why": {"A": "현재 고정금리가 처음보다 낮을 때 pay-fixed가 음수가 됩니다. 여기는 같습니다.", "C": "현재 고정금리가 처음보다 높을 때 pay-fixed가 양수가 됩니다. 여기는 같습니다."}, "orig": "ECO Module 1 Q69"}, {"id": "ECO-M1-Q73", "src": "ECO 오답", "module": 1, "tag": "Bond futures 무차익 호가 – AI 처리", "vig": null, "stem": "An analyst gathers the following information about a bond futures contract and the underlying semiannual pay bond:\nClean bond price\t101\nCoupon rate\t4.0%\nDays since last coupon\t20\nDays until next coupon\t160\nConversion factor\t0.7325\nDays until futures contract expiry\t90\nAnnualized 3-month risk-free rate\t3.6%\nBased on the carry arbitrage model, the equilibrium futures price is closest to:", "opts": {"A": "136.52.", "B": "137.75.", "C": "138.05."}, "ans": "B", "en": "Q0 = (1/CF) × {FV(B0 + AI0) − AIT − FVCI}. AI0 = (20/180) × 2 = 0.222; AIT = (110/180) × 2 = 1.222; FV = 101.222 × 1.036^(90/360) = 102.121. Q0 = (102.121 − 1.222)/0.7325 = 137.75.", "ko": "현재 full price(101 + 0.222)를 만기까지 복리로 키우고, 만기 시점 AI(지난 날수 20 + 90 = 110일 → 1.222)를 뺀 뒤 CF로 나눕니다. (102.121 − 1.222)/0.7325 = 137.75.", "trap": "현재 AI는 더하고 만기 AI는 뺀다. 만기 AI의 날수는 '지난 날수 + 선물 만기까지 날수'다. full price는 반드시 FV로 키운다.", "f": "Q_0 = [ (B_0 + AI_0)(1+r)^T − AI_T − FVCI ] / CF", "why": {"A": "full price를 만기까지 복리로 키우지 않고 현재 값을 그대로 쓴 값입니다.", "C": "만기 AI를 90일만으로 계산(1.000)한 값입니다. 마지막 쿠폰 이후 20일도 더해 110일로 계산해야 합니다."}, "orig": "ECO Module 1 Q73"}, {"id": "ECO-M1-Q78", "src": "ECO 오답", "module": 1, "tag": "3 × 6 FRA 가격", "vig": null, "stem": "An analyst gathers the following information about MRRs:\n90-day MRR\t1.40%\n180-day MRR\t2.20%\n270-day MRR\t2.40%\nAssuming a 30/360-day count convention, the no-arbitrage price of the 3 × 6 FRA is closest to:", "opts": {"A": "2.77%.", "B": "2.89%.", "C": "2.99%."}, "ans": "C", "en": "3 × 6: short period 90 days, long period 180 days, tm = 90/360. FRA0 = {[1 + 0.022 × 180/360]/[1 + 0.014 × 90/360] − 1}/(90/360) ≈ 2.99%.", "ko": "3 × 6 FRA는 3개월 뒤 시작해 6개월에 끝납니다. 짧은 쪽 90일(1.40%), 긴 쪽 180일(2.20%)을 쓰고 기간 90일로 나눕니다. ≈ 2.99%.", "trap": "3 × 6의 긴 기간은 9개월이 아니라 6개월이다. 270일 금리는 함정이다.", "f": "FRA_0 = {[1 + L_T × t_T] / [1 + L_h × t_h] − 1} / t_m", "why": {"A": "짧은 쪽을 6개월, 긴 쪽을 9개월로 잡은 값입니다(6 × 9 FRA).", "B": "긴 쪽을 3 + 6 = 9개월로 잡은 값입니다. 3 × 6은 6개월에 끝납니다."}, "orig": "ECO Module 1 Q78"}, {"id": "ECO-M1-Q80", "src": "ECO 오답", "module": 1, "tag": "Pay-fixed swap 가치 – MRR 쓰지 않음", "vig": null, "stem": "An analyst gathers the following information about a one year pay-fixed, receive-floating interest rate swap:\nNotional amount\t$10 million\nMarket reference rate (MRR)\t4%\nInitial fixed rate\t2.5%\nCurrent fixed rate\t2%\nSum of PV factors\t4.85\nThe current no-arbitrage value of the swap for the fixed-rate payer is closest to:", "opts": {"A": "–$970,000.", "B": "–$242,500.", "C": "$970,000."}, "ans": "B", "en": "Pay-fixed value = NA × (FSt − FS0) × ΣPV = 10,000,000 × (0.02 − 0.025) × 4.85 = –$242,500. The current MRR is not used.", "ko": "Pay-fixed 가치 = 원금 × (현재 고정금리 − 처음 고정금리) × ΣPV = 1,000만 × (2% − 2.5%) × 4.85 = –$242,500. MRR 4%는 쓰지 않습니다.", "trap": "Swap 가치는 '고정금리끼리'의 차이로 계산한다. 현재 MRR은 함정 정보다.", "f": "V(pay-fixed) = NA × (FS_t − FS_0) × ΣPV", "why": {"A": "MRR(4%)과 현재 고정금리의 차이를 쓴 값입니다. 처음 고정금리와 현재 고정금리를 비교해야 합니다.", "C": "MRR을 쓰고 부호도 receive-fixed 쪽으로 뒤집은 값입니다."}, "orig": "ECO Module 1 Q80"}, {"id": "ECO-M1-Q81", "src": "ECO 오답", "module": 1, "tag": "Currency swap 분기 지급액 – USD 원금 환산", "vig": null, "stem": "An analyst gathers the following information about a fixed-fixed currency swap for a US company borrowing GBP. The swap is for one year with a quarterly reset:\nAmount borrowed (in GBP)\tGBP 50 million\nSpot exchange rate\t0.9 GBP/USD\nAnnual GBP fixed swap interest rate\t2.25%\nAnnual USD fixed swap interest rate\t0.65%\nNote: GBP/USD is the amount of GBP per 1 USD.\nThe fixed swap quarterly payment for the USD side will be closest to:", "opts": {"A": "$73,125.", "B": "$90,278.", "C": "$361,111."}, "ans": "B", "en": "USD notional = 50 million / 0.9 = USD 55.5556 million. Annual USD payment = 55.5556m × 0.0065 = $361,111; quarterly = $90,278.", "ko": "0.9 GBP/USD는 1달러당 0.9파운드이므로 USD 원금 = 5,000만 ÷ 0.9 = 5,555.56만 달러입니다. 연 지급 = × 0.65% = 361,111, 분기 = ÷ 4 = $90,278.", "trap": "환율 표기 'GBP/USD = 1 USD당 GBP'를 확인하고 곱할지 나눌지 정한다. 연 지급액을 4로 나누는 것도 잊지 말 것.", "f": "NA_USD = NA_GBP / S(GBP/USD),  분기 지급 = NA × r / 4", "why": {"A": "USD 원금을 50 × 0.9 = 4,500만으로 곱해서 구한 값입니다. 1달러당 0.9파운드이므로 나눠야 합니다.", "C": "연간 지급액입니다. 분기 지급은 4로 나눠야 합니다."}, "orig": "ECO Module 1 Q81"}, {"id": "VAR-M1-01", "src": "변형", "module": 1, "tag": "Full price = clean price + AI", "vig": null, "stem": "A 4% semiannual-pay bond is quoted at a clean price of 98.50. It has been 45 days since the last coupon in a 180-day coupon period. The full (dirty) price is closest to:", "opts": {"A": "98.50.", "B": "99.00.", "C": "100.00."}, "ans": "B", "en": "AI = (45/180) × (4/2) = 0.50. Full price = 98.50 + 0.50 = 99.00.", "ko": "AI = (45/180) × 2 = 0.50. Full price = clean 98.50 + 0.50 = 99.00. 실제 결제(invoice) 금액은 full price입니다.", "trap": "AI는 '지난 날수'(45일)로 계산한다. 남은 날수(135일)를 쓰면 C가 된다.", "f": "Full = Clean + AI,  AI = (지난 날수 / 쿠폰기간) × 쿠폰", "why": {"A": "clean(quoted, flat) price입니다. AI를 더해야 full price입니다.", "C": "다음 쿠폰까지 남은 135일로 AI(1.50)를 계산한 값입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-02", "src": "변형", "module": 1, "tag": "Bond futures 호가 = (FV(full) − AI_T) ÷ CF", "vig": null, "stem": "A Treasury futures contract expires in 90 days. Information on the cheapest-to-deliver bond:\nClean price\t99.20\nCoupon\t3% semiannual (180-day coupon period)\nDays since last coupon\t60\nCoupons paid during the futures life\tNone\nAnnual risk-free rate (annual compounding)\t2.4%\nConversion factor\t0.85\nThe equilibrium quoted futures price is closest to:", "opts": {"A": "84.19.", "B": "116.52.", "C": "117.99."}, "ans": "B", "en": "AI0 = (60/180) × 1.5 = 0.50 → full price 99.70. FV = 99.70 × 1.024^(90/360) = 100.293. AIT = (150/180) × 1.5 = 1.25. Q0 = (100.293 − 1.25)/0.85 = 116.52.", "ko": "현재 full price = 99.20 + 0.50 = 99.70을 90일 복리로 키우면 100.293. 만기 AI(60 + 90 = 150일 → 1.25)를 빼고 CF 0.85로 나눕니다. (100.293 − 1.25)/0.85 = 116.52.", "trap": "채권 가격 → 선물 호가는 ÷ CF. 현재 AI는 더하고(full price), 만기 AI는 뺀다.", "f": "Q_0 = [ (B_0 + AI_0)(1+r)^T − AI_T − FVCI ] / CF", "why": {"A": "CF로 나누지 않고 곱한 값입니다. 채권 쪽 가격에서 선물 호가를 구할 때는 CF로 나눕니다.", "C": "만기 AI(1.25)를 빼지 않은 값입니다. 선물 호가는 clean 기준이라 만기 AI를 빼야 합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-03", "src": "변형", "module": 1, "tag": "인도대금 = Q × CF + AI (CF는 AI에 안 곱함)", "vig": null, "stem": "At delivery, a Treasury futures contract has a quoted futures price of 120.00. The delivered bond has a conversion factor of 0.80 and accrued interest of 0.60 at delivery. The amount the short receives per 100 par is closest to:", "opts": {"A": "96.00.", "B": "96.60.", "C": "150.60."}, "ans": "B", "en": "Delivery proceeds = Q × CF + AI = 120 × 0.80 + 0.60 = 96.60. The conversion factor applies to the futures price only, not to accrued interest.", "ko": "인도대금 = 선물 호가 × CF + 만기 AI = 120 × 0.8 + 0.6 = 96.60. CF는 선물가에만 곱하고 AI에는 곱하지 않습니다.", "trap": "선물가 → 채권 인도가격은 × CF. AI는 그대로 더한다.", "f": "Delivery proceeds = Q × CF + AI_T", "why": {"A": "AI를 더하지 않은 값입니다. Short는 경과이자도 받습니다.", "C": "CF로 나눈 값(150) + AI입니다. 선물가에서 인도가격으로 갈 때는 CF를 곱합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-04", "src": "변형", "module": 1, "tag": "Futures 고평가 → cash-and-carry", "vig": null, "stem": "The quoted price of a bond futures contract is above its carry arbitrage (no-arbitrage) price. The appropriate arbitrage strategy is to:", "opts": {"A": "buy the bond with borrowed funds, hold it, and short the futures.", "B": "short the bond, lend the proceeds, and buy the futures.", "C": "buy the futures and buy the bond with borrowed funds."}, "ans": "A", "en": "If futures are overpriced, carry arbitrage: buy the underlying bond (financed at the risk-free rate), hold it, short the futures, and deliver the bond at expiration. Profit = delivery proceeds − cost of carry.", "ko": "선물이 고평가면 carry arbitrage(cash-and-carry): 돈을 빌려 채권을 사서 보유하고, 선물은 매도한 뒤 만기에 채권을 인도합니다. 이익 = 인도대금 − 보유비용.", "trap": "고평가된 것을 판다. 선물 고평가 → 선물 매도 + 현물 매수. 선물 저평가 → reverse carry.", "f": "Profit = (Q × CF + AI_T) − [ (B_0 + AI_0)(1+r)^T − FVCI ]", "why": {"B": "Reverse carry arbitrage로, 선물이 저평가일 때의 전략입니다.", "C": "선물과 채권을 둘 다 사면 가격 위험이 상쇄되지 않습니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-05", "src": "변형", "module": 1, "tag": "Pay-fixed swap 가치 – 새 swap rate 먼저", "vig": null, "stem": "Two years ago a company entered a 5-year, USD20 million pay-fixed swap with annual resets at a fixed rate of 2.00%. Current present value factors for the remaining payments are:\nYear\tPV factor\n1\t0.985\n2\t0.968\n3\t0.948\nThe current value of the swap to the company is closest to:", "opts": {"A": "–USD120,400.", "B": "–USD41,503.", "C": "USD120,400."}, "ans": "A", "en": "Current 3-year swap rate = (1 − 0.948)/(0.985 + 0.968 + 0.948) = 0.052/2.901 = 1.7925%. Pay-fixed value = 20,000,000 × (0.017925 − 0.02) × 2.901 = –USD120,400.", "ko": "남은 3년 swap rate = (1 − 0.948)/2.901 = 1.7925%. 회사는 2.00%를 내는데 시장 금리가 더 낮으니 손해: 2,000만 × (1.7925% − 2.00%) × 2.901 = –USD120,400.", "trap": "Pay-fixed는 (현재 − 처음), receive-fixed는 (처음 − 현재). 금리 차이에 ΣPV를 꼭 곱한다.", "f": "FS_t = (1 − PV_n)/ΣPV,  V(pay-fixed) = NA × (FS_t − FS_0) × ΣPV", "why": {"B": "ΣPV(2.901)를 곱하지 않은 값입니다.", "C": "부호가 반대입니다. 시장 금리가 내려서 pay-fixed는 손해입니다(receive-fixed라면 +120,400)."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-06", "src": "변형", "module": 1, "tag": "Forward 저평가 → reverse carry", "vig": null, "stem": "A forward contract on a non-dividend-paying stock is priced below FV(S0). An arbitrageur would most likely:", "opts": {"A": "buy the stock with borrowed funds and short the forward.", "B": "short the stock, invest the proceeds at the risk-free rate, and go long the forward.", "C": "short the stock and short the forward."}, "ans": "B", "en": "F0 < FV(S0): the forward is underpriced → reverse carry arbitrage: short the underlying, lend the proceeds at the risk-free rate, and buy the forward.", "ko": "Forward가 저평가(F0 < FV(S0))면 reverse carry arbitrage: 주식을 공매도하고 대금은 무위험이자율로 운용하며 forward를 삽니다.", "trap": "Carry = 현물 매수 + forward 매도(forward 고평가). Reverse carry = 현물 공매도 + forward 매수(forward 저평가).", "f": "F_0 > FV(S_0) → carry,  F_0 < FV(S_0) → reverse carry", "why": {"A": "Carry arbitrage로, forward가 고평가일 때입니다.", "C": "둘 다 매도하면 위험이 상쇄되지 않습니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-07", "src": "변형", "module": 1, "tag": "FRA 가격 – (1 + L × t)로 계산", "vig": null, "stem": "Current MRRs (30/360):\n90-day MRR\t1.60%\n270-day MRR\t2.20%\nThe no-arbitrage fixed rate for a 3 × 9 FRA is closest to:", "opts": {"A": "1.18%.", "B": "1.25%.", "C": "2.49%."}, "ans": "C", "en": "FRA0 = {[1 + 0.022 × 270/360]/[1 + 0.016 × 90/360] − 1}/(180/360) = (1.0165/1.004 − 1)/0.5 = 2.49%.", "ko": "3 × 9 FRA는 3개월 뒤 시작하는 6개월 금리입니다. 기간 금리로 바꿔 (1 + 2.2% × 0.75)/(1 + 1.6% × 0.25) − 1 = 1.245%, 이를 0.5로 나누면 2.49%.", "trap": "'1 + 연금리'가 아니라 '1 + 연금리 × 기간'이다. 마지막에 t_m으로 나눠 연율로 바꾼다.", "f": "FRA_0 = {[1 + L_T × t_T] / [1 + L_h × t_h] − 1} / t_m", "why": {"A": "기간을 곱하지 않고 (1.022/1.016 − 1)/0.5로 계산한 값입니다.", "B": "기간 금리(1.245%)를 t_m(0.5)으로 나누지 않은 값입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-08", "src": "변형", "module": 1, "tag": "FRA long/short = 변동/고정 수취", "vig": null, "stem": "A treasurer expects short-term rates to rise and wants to lock in a borrowing rate with an FRA. The treasurer should:", "opts": {"A": "go long the FRA (pay fixed, receive floating).", "B": "go short the FRA (receive fixed, pay floating).", "C": "go short the FRA (pay fixed, receive floating)."}, "ans": "A", "en": "Long FRA = pay fixed / receive floating (long MRR). If rates rise, the floating receipt exceeds the fixed payment, offsetting the higher borrowing cost.", "ko": "Long FRA = 고정 지급, 변동 수취(long MRR)입니다. 금리가 오르면 변동 쪽으로 받는 돈이 커져 차입 비용 상승을 상쇄합니다.", "trap": "Floating-rate receiver = long FRA, fixed-rate receiver = short FRA. 금리 상승 대비 → long.", "f": "Long FRA payoff ∝ (L_m − FRA_0)", "why": {"B": "Short FRA는 금리가 내릴 때 이익입니다.", "C": "Short FRA는 고정 수취·변동 지급입니다. 포지션과 현금흐름 짝이 틀렸습니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-09", "src": "변형", "module": 1, "tag": "Carry cost에 차입이자 X", "vig": null, "stem": "In the carry arbitrage model for a commodity forward, which of the following is least likely included as a carry cost?", "opts": {"A": "Storage costs", "B": "Insurance costs", "C": "Interest on funds borrowed to buy the commodity"}, "ans": "C", "en": "Financing cost is already captured by compounding the spot price at the risk-free rate, FV(S0). Including borrowing interest as a carry cost would double count it. Storage and insurance are carry costs.", "ko": "자금 조달 비용은 현물가를 무위험이자율로 키우는 FV(S0)에 이미 들어 있습니다. 차입이자를 carry cost에 또 넣으면 이중 계산입니다. 보관비·보험료는 carry cost입니다.", "trap": "Carry cost = 보관·보험·손실. 차입이자 X.", "f": "F_0 = FV(S_0) + FV(CC) − FV(CB)", "why": {"A": "보관비는 대표적인 carry cost입니다.", "B": "보험료도 carry cost입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-10", "src": "변형", "module": 1, "tag": "Short equity forward 중도 가치", "vig": null, "stem": "Three months ago an investor took a short position in a 9-month equity forward at 105.00. Today, the no-arbitrage forward price for the same expiration is 102.00. With an annually compounded risk-free rate of 2%, the value of the short position is closest to:", "opts": {"A": "–2.97.", "B": "2.97.", "C": "3.00."}, "ans": "B", "en": "Short value = (F0 − Ft)/(1 + r)^(T−t) = (105 − 102)/1.02^0.5 = 2.97. The forward price fell, which benefits the short.", "ko": "Short 가치 = (처음 forward 가격 − 현재 forward 가격)을 남은 6개월 할인 = (105 − 102)/1.02^0.5 = 2.97. 가격이 내렸으니 short가 이득입니다.", "trap": "Short는 (F0 − Ft), long은 (Ft − F0). 남은 기간으로 할인한다.", "f": "V_t(short) = (F_0 − F_t)/(1 + r)^(T−t)", "why": {"A": "long 기준 값입니다. Short는 부호가 반대입니다.", "C": "할인하지 않은 값입니다. 차액은 만기에 실현되므로 현재가치로 바꿔야 합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-11", "src": "변형", "module": 1, "tag": "Receive-equity / pay-fixed 분기 현금흐름", "vig": null, "stem": "An investor enters a receive-equity, pay-fixed swap with quarterly settlement (30/360), a notional amount of USD8 million, and a fixed rate of 3.2% per year. Over the first quarter the equity index returns +2.5%. The investor's net cash flow is closest to:", "opts": {"A": "–USD56,000.", "B": "USD136,000.", "C": "–USD136,000."}, "ans": "B", "en": "Quarterly fixed payment = 8,000,000 × 0.032 × 90/360 = 64,000. Equity receipt = 8,000,000 × 0.025 = 200,000. Net = +USD136,000.", "ko": "분기 고정 지급 = 800만 × 3.2% × 90/360 = 64,000. 주식 수취 = 800만 × 2.5% = 200,000. 순현금흐름 = +136,000.", "trap": "연 고정금리는 지급 주기에 맞게 나눈다(notional × fixed rate ÷ 주기). 받는 쪽·내는 쪽 부호 확인.", "f": "CF = NA × (R_equity − r_fix × 90/360)", "why": {"A": "연 고정금리 3.2%를 분기에 그대로 써서 256,000을 낸다고 계산한 값입니다.", "C": "부호가 반대입니다. 투자자는 주식 수익률을 받는 쪽입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-12", "src": "변형", "module": 1, "tag": "Currency swap 가치 – 현재 환율로 환산", "vig": null, "stem": "A UK company entered a receive-GBP, pay-USD fixed-for-fixed currency swap with USD10 million notional when the spot rate was 0.80 GBP/USD (GBP per 1 USD). Today:\nValue of GBP bond per 1 unit of par\t1.02\nValue of USD bond per 1 unit of par\t0.99\nSpot rate\t0.78 GBP/USD\nThe value of the swap to the UK company, in GBP, is closest to:", "opts": {"A": "GBP240,000.", "B": "GBP438,000.", "C": "–GBP438,000."}, "ans": "B", "en": "GBP notional = 0.80 × 10,000,000 = GBP8,000,000. V = Va − St × Vb = 8,000,000 × 1.02 − 0.78 × (10,000,000 × 0.99) = 8,160,000 − 7,722,000 = GBP438,000.", "ko": "GBP 원금 = 0.80 × 1,000만 = 800만(처음 환율). 가치 = 받는 GBP 채권 816만 − 현재 환율 0.78 × 주는 USD 채권 990만 = GBP438,000.", "trap": "원금은 처음 환율(S0), 가치 비교는 현재 환율(St). 받는 통화 − 주는 통화.", "f": "V_CS = V_a − S_t × V_b", "why": {"A": "USD 채권을 처음 환율 0.80으로 환산한 값입니다. 현재 환율 0.78을 써야 합니다.", "C": "받는 쪽과 주는 쪽을 바꾼 값입니다. 회사는 GBP를 받습니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-13", "src": "변형", "module": 1, "tag": "Swap 변동금리 – 직전 reset의 MRR", "vig": null, "stem": "A 1-year interest rate swap has semiannual payments (30/360) and a fixed rate of 3.0%. Six-month MRR observed at each date:\nt = 0\t2.6%\nt = 6 months\t3.4%\nt = 12 months\t2.9%\nThe pay-fixed party's net cash flow at t = 12 months, per unit notional, is closest to:", "opts": {"A": "–0.002.", "B": "+0.002.", "C": "+0.004."}, "ans": "B", "en": "The payment at 12 months uses the MRR set at 6 months (3.4%): 0.5 × (0.034 − 0.030) = +0.002.", "ko": "12개월 시점 지급은 6개월 시점에 정해진 MRR 3.4%로 합니다(advanced set, settled in arrears). 0.5 × (3.4% − 3.0%) = +0.002.", "trap": "지급 시점의 MRR이 아니라 직전 reset 시점의 MRR을 쓴다. 반기면 0.5를 곱한다.", "f": "CF(pay-fixed)_t = AP × (MRR_(t−1) − r_FIX)", "why": {"A": "t = 0의 MRR(2.6%)을 쓴 값입니다. 12개월 지급은 6개월 시점 MRR로 정해집니다.", "C": "accrual period 0.5를 곱하지 않은 값입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-14", "src": "변형", "module": 1, "tag": "Futures 매일 정산 → 하루 끝 가치 0", "vig": null, "stem": "Which statement about forwards and futures is most accurate?", "opts": {"A": "After daily settlement, the market value of a futures contract is zero.", "B": "Forward contracts are marked to market daily, but futures are not.", "C": "A forward contract's value is reset to zero at the end of each day."}, "ans": "A", "en": "Futures gains and losses are settled daily, so after marking to market the contract's value returns to zero. Forwards are not marked to market; their value accumulates until expiration.", "ko": "선물은 매일 손익을 정산하므로 정산 후 가치가 0으로 돌아갑니다. Forward는 매일 정산하지 않아 가치가 만기까지 쌓입니다.", "trap": "MTM(매일 정산)은 futures의 특징. 시작 시점 가치는 둘 다 0이다.", "f": "Futures value after MTM = 0", "why": {"B": "반대입니다. 매일 정산하는 것은 futures입니다.", "C": "Forward는 매일 정산하지 않아 가치가 0으로 돌아가지 않습니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M1-15", "src": "변형", "module": 1, "tag": "Equity swap 고정금리 = 같은 만기 IRS rate", "vig": null, "stem": "At initiation, the fixed rate on a plain equity-for-fixed swap is most likely equal to the:", "opts": {"A": "expected return on the equity index.", "B": "fixed rate on a fixed-for-floating interest rate swap of the same maturity.", "C": "dividend yield on the equity index."}, "ans": "B", "en": "Equity swap pricing replicates the fixed leg with a fixed-rate bond and the equity leg with an investment in the index worth par at initiation, so the fixed rate equals that of a same-maturity interest rate swap.", "ko": "Equity swap의 주식 다리는 시작 시점에 원금(par)과 같은 가치이므로, 고정금리는 같은 만기 금리스왑의 고정금리와 같습니다. 주식 기대수익률과는 관계없습니다.", "trap": "Equity swap 고정금리 = IRS 고정금리. 그래서 equity-for-equity swap은 고정 다리가 상쇄되어 가격을 정할 필요가 없다.", "f": "r_fix(equity swap) = (1 − PV_n)/ΣPV", "why": {"A": "주식 기대수익률은 swap 가격 결정에 쓰지 않습니다.", "C": "배당수익률로 정하지 않습니다."}, "orig": "오답노트 기반 변형"}, {"id": "ECO-M2-Q4", "src": "ECO 오답", "module": 2, "tag": "Call 고평가 → call 매도 + 복제(주식 매수·차입)", "vig": 10, "stem": "For the Alpha Company option, the positions to take advantage of the arbitrage opportunity are to write the call and:", "opts": {"A": "short shares of Alpha stock and lend.", "B": "buy shares of Alpha stock and borrow.", "C": "short shares of Alpha stock and borrow."}, "ans": "B", "en": "Sell the overpriced call and buy the replicating portfolio: buy h shares and borrow PV(hS− − c−). h = (6 − 0)/(56 − 46) = 0.60. Model value = 3.714; if the call trades at 4.50, writing it and buying 0.6 shares financed by borrowing 26.287 earns 0.787 today with zero net payoff at Time 1.", "ko": "고평가된 call은 팔고, call을 복제하는 포트폴리오(주식 h주 매수 + 차입)를 삽니다. h = (6 − 0)/(56 − 46) = 0.6. 모델 가치 3.714보다 비싸게(예: 4.50) 팔면 0.6주를 차입으로 사서 오늘 0.787을 남기고, 1기 뒤 순현금흐름은 0입니다.", "trap": "Call 복제 = 주식 매수 + 차입(레버리지 매수). 고평가 call → call 매도 + 복제 매수. 저평가 call → call 매수 + 복제 매도(공매도 + 대출).", "f": "h = (c+ − c−)/(S+ − S−),  c = hS − PV(hS− − c−)", "why": {"A": "공매도 + 대출은 call 복제를 '매도'하는 것으로, call이 저평가일 때 call을 사면서 하는 거래입니다.", "C": "공매도와 차입을 함께 하면 call 복제가 되지 않습니다. Call 복제는 주식 매수 + 차입입니다."}, "orig": "ECO Module 2 Q4"}, {"id": "ECO-M2-Q8", "src": "ECO 오답", "module": 2, "tag": "금리 call option – 2기간 이항 기대값", "vig": 10, "stem": "Based on Exhibit 2 and the parameters used by Sousa, the value of the interest rate option is closest to:", "opts": {"A": "5,251.", "B": "6,236.", "C": "6,429."}, "ans": "C", "en": "Time 2 payoffs: c++ = 0.050 − 0.0275 = 0.0225; c+− = 0.030 − 0.0275 = 0.0025; c−− = 0. Time 1: c+ = 0.961538 × [0.5(0.0225) + 0.5(0.0025)] = 0.012019; c− = 0.980392 × [0.5(0.0025) + 0] = 0.001225. Time 0: c = 0.970874 × [0.5(0.012019) + 0.5(0.001225)] = 0.006429 → × 1,000,000 = 6,429.", "ko": "만기(t = 2) 지급액은 Max(0, 금리 − 2.75%)입니다: 2.25%, 0.25%, 0. 각 노드에서 그 노드의 1년 할인계수로 기대값을 할인해 거꾸로 올라옵니다. t = 1 위 0.012019, 아래 0.001225 → t = 0: 0.970874 × 평균 = 0.006429 → 6,429.", "trap": "각 노드의 할인은 그 노드 금리의 할인계수로 한다(위 노드 0.961538, 아래 노드 0.980392, 처음 0.970874). 하나의 할인율로 통일하면 틀린다.", "f": "c_node = PV_node × [π c_up + (1 − π) c_down],  만기 payoff = Max(0, r − X) × 원금", "why": {"A": "계산이 틀린 값입니다. 각 노드에서 그 노드의 할인계수로 기대값을 할인하며 거꾸로 계산하면 6,429입니다.", "B": "계산이 틀린 값입니다. 노드별 할인계수(위 0.961538, 아래 0.980392, t = 0 0.970874)를 정확히 써야 6,429가 나옵니다."}, "orig": "ECO Module 2 Q8"}, {"id": "ECO-M2-Q14", "src": "ECO 오답", "module": 2, "tag": "모델가 > 시장가 → IV < historical vol", "vig": 11, "stem": "Based on Solomon's observation about the model price and market price for the put option in Exhibit 2, the implied volatility for the GPX is most likely:", "opts": {"A": "less than the historical volatility.", "B": "equal to the historical volatility.", "C": "greater than the historical volatility."}, "ans": "A", "en": "Using historical volatility of 24%, the model put value is $7.4890, above the market price of $7.20. Option value rises with volatility, so the volatility implied by the lower market price must be below 24%.", "ko": "Historical vol 24%를 넣은 모델 가격(7.489)이 시장가(7.20)보다 비쌉니다. 옵션 가격은 변동성이 클수록 높으므로, 시장가에서 거꾸로 구한 implied vol은 24%보다 낮아야 합니다.", "trap": "Put이든 call이든 vega > 0이다. 모델가 > 시장가 ⇒ 시장이 쓰는 변동성(IV)이 더 낮다.", "f": "모델가(σ_hist) > 시장가 ⇒ IV < σ_hist", "why": {"B": "같다면 모델가와 시장가가 같아야 합니다. 모델가가 더 높습니다.", "C": "IV가 더 크면 시장가가 모델가보다 높아야 합니다. 여기는 반대입니다."}, "orig": "ECO Module 2 Q14"}, {"id": "ECO-M2-Q15", "src": "ECO 오답", "module": 2, "tag": "금리 option 기초변수 = FRA rate, 옵션 만기", "vig": 11, "stem": "The valuation inputs used by Lee to price a call reflecting Solomon's interest rate views should include an underlying FRA rate of:", "opts": {"A": "0.60% with six months to expiration.", "B": "0.75% with nine months to expiration.", "C": "0.75% with six months to expiration."}, "ans": "C", "en": "The option is on three-month MRR in six months. In the Black/standard market model the underlying is the current FRA rate for a three-month loan starting in six months (0.75%), and the option expires in six months.", "ko": "6개월 뒤의 3개월 MRR에 대한 옵션이므로 기초변수는 '6개월 뒤 시작하는 3개월 FRA rate' 0.75%이고, 옵션 만기는 6개월입니다.", "trap": "기초변수는 현재 spot MRR(0.60%)이 아니라 FRA rate. 옵션 만기는 FRA의 시작 시점(6개월)이지 대출 만기(9개월)가 아니다.", "f": "Underlying = FRA(0, t_(j−1), t_m),  옵션 만기 = t_(j−1)", "why": {"A": "0.60%는 현재 3개월 spot MRR입니다. 기초변수는 FRA rate 0.75%입니다.", "B": "9개월은 3개월 대출이 끝나는 시점입니다. 옵션 만기는 6개월입니다."}, "orig": "ECO Module 2 Q15"}, {"id": "ECO-M2-Q17", "src": "ECO 오답", "module": 2, "tag": "주식 + long put → gamma 양수", "vig": 11, "stem": "Lee's put-based hedge strategy for Solomon's ETF position would most likely result in a portfolio gamma that is:", "opts": {"A": "negative.", "B": "neutral.", "C": "positive."}, "ans": "C", "en": "The stock has delta +1 and gamma 0. Long options always have non-negative gamma (put gamma = call gamma), so adding long puts gives a positive portfolio gamma.", "ko": "주식의 delta는 항상 +1이라 gamma는 0입니다. 옵션을 사면(long) call이든 put이든 gamma가 양수이므로, 주식 + long put 포트폴리오의 gamma는 양수입니다.", "trap": "Put의 delta는 음수지만 gamma는 양수다. Long option → +gamma, short option → −gamma.", "f": "Γ(stock) = 0,  Γ(long call) = Γ(long put) > 0", "why": {"A": "Gamma가 음수가 되려면 옵션을 팔아야(short) 합니다. 여기는 put을 삽니다.", "B": "주식 gamma가 0이고 long put gamma가 양수이니 합은 양수입니다."}, "orig": "ECO Module 2 Q17"}, {"id": "ECO-M2-Q19", "src": "ECO 오답", "module": 2, "tag": "Vega는 ATM에서 가장 큼", "vig": 12, "stem": "Jeffinsin's statement about option Greeks is least likely correct with respect to:", "opts": {"A": "vega.", "B": "theta.", "C": "delta and gamma."}, "ans": "A", "en": "Vega is highest when an option is near or at the money and lower when it is out of (or deep in) the money, so the statement about vega is wrong. The delta/gamma and theta descriptions are correct.", "ko": "Vega는 ATM 근처에서 가장 크고 OTM·ITM으로 갈수록 작아집니다. 그래서 'OTM일 때 vega가 높다'는 말이 틀렸습니다. Delta·gamma, theta 설명은 맞습니다.", "trap": "ATM은 행사될지 말지 가장 불확실해서 변동성에 가장 민감하다.", "f": "Vega 최대: ATM", "why": {"B": "Theta 설명은 맞습니다. 만기가 가까워질수록 시간가치 감소가 빨라집니다.", "C": "Delta와 gamma는 주가 변화와 옵션 가격의 관계를 재는 지표라는 설명이 맞습니다."}, "orig": "ECO Module 2 Q19"}, {"id": "ECO-M2-Q20", "src": "ECO 오답", "module": 2, "tag": "Delta + gamma로 헤지 주식 수 (ECO 기준)", "vig": 12, "stem": "Is Madisox's suggested hedging strategy for Weehawkin options most likely correct?", "opts": {"A": "Yes", "B": "No, he should only use delta", "C": "No, he should subtract gamma"}, "ans": "A", "en": "Per the ECO answer, the statement is correct: to hedge against a small change in the stock price while accounting for how delta changes, use the call delta plus the call gamma, i.e., 0.587 + 0.019 = 0.606 shares per call.", "ko": "ECO 정답 기준으로 맞는 설명입니다. 주가가 조금 변할 때 delta가 바뀌는 것(gamma)까지 반영하려면 delta에 gamma를 더해 0.587 + 0.019 = 0.606주를 씁니다.", "trap": "ECO는 'small change → delta + gamma'를 정답으로 본다(오답노트 내용). 빼는 것이 아니라 더한다. 참고: Schweser의 근사식은 ΔC ≈ Δ·ΔS + ½Γ·ΔS²라서 ΔS = 1이면 Γ의 절반을 더한다. 이 문제는 ECO 해설 기준으로 답한다.", "f": "헤지 주식 수(옵션 1개당) ≈ Δ + Γ (ECO 해설)", "why": {"B": "ECO 해설은 delta가 변하는 것까지 반영하려면 gamma를 더해야 한다고 봅니다.", "C": "Gamma는 빼는 것이 아니라 더합니다."}, "orig": "ECO Module 2 Q20"}, {"id": "ECO-M2-Q21", "src": "ECO 오답", "module": 2, "tag": "Implied vol = 미래 변동성 기대, skew ≠ smile", "vig": 12, "stem": "Whose comment regarding implied volatility is most likely correct?", "opts": {"A": "Burr's", "B": "Madisox's", "C": "Jeffinsin's"}, "ans": "B", "en": "Madisox is correct: the volatility surface shows how implied volatility varies across exercise price and time to maturity. Burr is wrong: implied volatility is backed out of option prices and reflects expected future volatility, not historical volatility. Jeffinsin is wrong: the skew tends to steepen when the market price of hedging rises, so it differs from the smile.", "ko": "Madisox가 맞습니다. Volatility surface는 행사가와 만기에 따라 IV가 어떻게 달라지는지 보여줍니다. Burr는 틀렸습니다. IV는 옵션 시장가에서 역산한 '미래' 변동성 기대이지 과거 변동성으로 계산하지 않습니다. Jeffinsin도 틀렸습니다. 헤지 수요가 커지면 skew가 가팔라져 smile과 모양이 달라집니다.", "trap": "IV는 historical vol로 계산하지 않는다. 헤지 비용이 오르면 skew가 가팔라진다.", "f": "IV: 시장가 → 모델 역산, surface = IV(X, T)", "why": {"A": "IV는 과거 변동성이 아니라 시장가에서 역산한 미래 변동성 기대치입니다.", "C": "헤지 수요가 커지면 skew가 가팔라져서 smile과 같은 모양이 아닙니다."}, "orig": "ECO Module 2 Q21"}, {"id": "ECO-M2-Q22", "src": "ECO 오답", "module": 2, "tag": "무차익·기대값 접근은 투자자 전망과 무관", "vig": 13, "stem": "Is Schwartz's statement about the one-period binomial model most likely correct?", "opts": {"A": "Yes", "B": "No, she is incorrect about the probability of an up move", "C": "No, she is incorrect about expectations of future stock prices"}, "ans": "C", "en": "π = (1.02 − 0.75)/(1.35 − 0.75) = 0.45 is correct. But the no-arbitrage and expectations approaches use risk-neutral probabilities, so the investor's outlook for the stock is irrelevant; only the DCF approach to securities valuation depends on investor expectations.", "ko": "상승 확률 π = (1.02 − 0.75)/(1.35 − 0.75) = 45%는 맞습니다. 하지만 무차익 접근과 기대값 접근은 위험중립확률을 쓰므로 투자자의 주가 전망은 상관없습니다. 투자자 전망이 들어가는 것은 증권 가치평가의 DCF 접근입니다.", "trap": "옵션 가치평가(무차익·기대값)는 위험중립확률 + 무위험이자율. 투자자의 주관적 전망·위험조정 할인율은 쓰지 않는다.", "f": "π = (1 + r − d)/(u − d)", "why": {"A": "투자자 전망이 무차익·기대값 접근의 기초라는 부분이 틀렸습니다.", "B": "π = 0.27/0.60 = 45%로 맞습니다."}, "orig": "ECO Module 2 Q22"}, {"id": "ECO-M2-Q32", "src": "ECO 오답", "module": 2, "tag": "고평가 call → call 매도 + 차입해 주식 매수", "vig": 14, "stem": "With respect to the one-year call option on Lafayette stock, whose strategy is most likely correct?", "opts": {"A": "Burr's", "B": "Laurens's", "C": "Hamilton's"}, "ans": "A", "en": "h = (25 − 0)/(125 − 85) = 0.625; π = (1.05 − 0.85)/(1.25 − 0.85) = 0.5; c = 0.5 × 25/1.05 = $11.90. The market price of $15.28 is too high, so sell the call and replicate a long call by buying shares with borrowed funds (Burr).", "ko": "1년 call 가치 = 0.5 × 25/1.05 = 11.90입니다. 시장가 15.28은 고평가이므로 call을 팔고, 주식을 차입금으로 사서(복제 long call) 상쇄합니다. Burr가 맞습니다.", "trap": "회사채 금리(7%)가 아니라 무위험이자율(5%)을 쓴다. 고평가 call은 '사는' 게 아니라 '판다'.", "f": "c = π c+ / (1 + r),  π = (1 + r − d)/(u − d)", "why": {"B": "공매도 + 대출은 call 복제를 파는 쪽으로, call이 저평가일 때의 전략입니다.", "C": "Call이 고평가라 사면 안 되고 팔아야 합니다."}, "orig": "ECO Module 2 Q32"}, {"id": "ECO-M2-Q34", "src": "ECO 오답", "module": 2, "tag": "2기간 이항 call 가치", "vig": 15, "stem": "Using the binomial valuation method and the data in Exhibit 1, the price Messer paid one year ago for the call option with a strike price of EUR750 is closest to:", "opts": {"A": "EUR47.57.", "B": "EUR51.54.", "C": "EUR102.08."}, "ans": "B", "en": "Index paths: 720 → 828/648 → 952.2/745.2/583.2. Payoffs at 750: 202.2, 0, 0. C+ = 0.52 × 202.2/1.03 = 102.08; C− = 0. C0 = 0.52 × 102.08/1.03 = EUR51.54.", "ko": "지수는 720 → 828/648 → 952.2/745.2/583.2입니다. 행사가 750 기준 만기 payoff는 202.2, 0, 0. 위 노드 C+ = 0.52 × 202.2/1.03 = 102.08, 아래 C− = 0. 오늘 C0 = 0.52 × 102.08/1.03 = 51.54.", "trap": "두 단계 모두 할인한다. 중간 노드 값(C+ = 102.08)을 답으로 고르지 말 것. 확률 π와 1 − π를 바꾸지 말 것.", "f": "C = PV[π C+ + (1 − π) C−]", "why": {"A": "상승·하락 확률(π와 1 − π)을 바꿔 쓴 값입니다.", "C": "1기 후 위 노드 값 C+입니다. 한 번 더 할인해야 오늘 가치가 됩니다."}, "orig": "ECO Module 2 Q34"}, {"id": "ECO-M2-Q37", "src": "ECO 오답", "module": 2, "tag": "BSM 가정 – 연속복리 수익률이 정규분포", "vig": 15, "stem": "Which of Szillat's assumptions is least consistent with the BSM model?", "opts": {"A": "Assumption 1", "B": "Assumption 2", "C": "Assumption 3"}, "ans": "C", "en": "BSM assumes continuously compounded (log) returns are normally distributed (prices lognormal), not annualized returns. Continuous trading and known, constant volatility are BSM assumptions.", "ko": "BSM은 '연속복리(로그) 수익률'이 정규분포라고 가정합니다(주가는 로그정규). 연율 수익률이 정규분포라는 것은 틀렸습니다. 연속 거래와 변동성을 알고 있다는 가정은 맞습니다.", "trap": "Annualized return ≠ continuously compounded return. 정규분포인 것은 로그 수익률이다.", "f": "BSM: ln(S_T/S_0) ~ Normal", "why": {"A": "연속 거래 가능은 BSM 가정입니다.", "B": "변동성이 알려져 있고 일정하다는 것도 BSM 가정입니다."}, "orig": "ECO Module 2 Q37"}, {"id": "ECO-M2-Q38", "src": "ECO 오답", "module": 2, "tag": "Gamma = delta의 변화율", "vig": 15, "stem": "In describing how call option prices change, Messer is most likely referring to:", "opts": {"A": "vega.", "B": "delta.", "C": "gamma."}, "ans": "C", "en": "\"How the rate of change of an option price speeds up or slows down for a change in the underlying\" is the change in delta — gamma.", "ko": "'옵션 가격 변화 속도가 빨라지거나 느려지는 정도'는 delta(가격 변화율)의 변화율, 즉 gamma입니다.", "trap": "Delta = 가격 변화율, gamma = delta의 변화율(가속도). 'speeds up or slows down'이 나오면 gamma.", "f": "Δ = ∂c/∂S,  Γ = ∂Δ/∂S", "why": {"A": "Vega는 변동성 변화에 대한 옵션 가격 민감도입니다.", "B": "Delta는 기초자산 변화에 대한 옵션 가격의 변화율 자체입니다. 그 변화율이 빨라지거나 느려지는 것은 gamma입니다."}, "orig": "ECO Module 2 Q38"}, {"id": "ECO-M2-Q39", "src": "ECO 오답", "module": 2, "tag": "낮은 행사가 IV ↑ → OTM put이 비쌈", "vig": 15, "stem": "Which of the following would Messer most likely conclude from the implied volatility data in Exhibit 2 if he excludes the effects of moneyness and time to expiration?", "opts": {"A": "Using out-of-the-money call or put options to establish either long or short positions is more expensive than using at-the-money options", "B": "Using out-of-the-money put options to hedge is more expensive than establishing a long position with out-of-the-money call options", "C": "Using out-of-the-money call options to establish a long position is more expensive than establishing a short position using out-of-the-money put options"}, "ans": "B", "en": "Implied volatility falls as the strike rises (skew). Low-strike (OTM put) options have higher IV than high-strike (OTM call) options, so OTM puts are relatively more expensive than OTM calls.", "ko": "행사가가 낮을수록 IV가 높습니다(skew). 낮은 행사가 옵션은 OTM put, 높은 행사가 옵션은 OTM call이므로 OTM put이 OTM call보다 상대적으로 비쌉니다.", "trap": "Skew(행사가 ↑ → IV ↓)면 OTM put이 비싸다. 양쪽 OTM이 모두 비싼 것은 smile일 때다.", "f": "낮은 X → 높은 IV ⇒ OTM put 상대적으로 비쌈", "why": {"A": "양쪽 OTM이 모두 ATM보다 비싼 것은 smile 모양일 때입니다. 여기는 한쪽으로 기운 skew입니다.", "C": "반대입니다. 높은 행사가(OTM call)의 IV가 낮아 OTM call이 상대적으로 쌉니다."}, "orig": "ECO Module 2 Q39"}, {"id": "ECO-M2-Q40", "src": "ECO 오답", "module": 2, "tag": "기대값 접근 – 무위험이자율로 할인", "vig": 16, "stem": "Franco's understanding of the valuation of the European style six-month call option is most likely:", "opts": {"A": "correct with respect to the payoffs and the discount rate.", "B": "correct with respect to the payoffs but incorrect about the discount rate.", "C": "incorrect with respect to the payoffs but correct about the discount rate."}, "ans": "B", "en": "Option value = present value of expected terminal payoffs (using risk-neutral probabilities) — correct. But they are discounted at the risk-free rate, not a risk-adjusted rate.", "ko": "옵션 가치 = 만기 payoff 기대값(위험중립확률)의 현재가치라는 부분은 맞습니다. 하지만 할인율은 위험조정 할인율이 아니라 무위험이자율입니다.", "trap": "'risk-adjusted rate'라는 말이 나오면 오답. 옵션 가치평가는 위험중립확률 + 무위험이자율.", "f": "c = PV_rf[E^π(payoff_T)]", "why": {"A": "할인율 설명이 틀렸습니다. 위험조정 할인율이 아니라 무위험이자율로 할인합니다.", "C": "payoff 설명(만기 payoff 기대값의 현재가치)은 맞습니다."}, "orig": "ECO Module 2 Q40"}, {"id": "ECO-M2-Q43", "src": "ECO 오답", "module": 2, "tag": "Delta hedge – 주식 수 ÷ call delta", "vig": 16, "stem": "Assuming one option per share, an appropriate delta hedge for the GI stock would most likely be to:", "opts": {"A": "buy 40,100 puts.", "B": "sell 148,428 calls.", "C": "sell 168,010 calls."}, "ans": "C", "en": "The 100,000 shares have delta +100,000. Each call has delta 0.5952, so sell 100,000/0.5952 = 168,010 calls (alternatively buy 100,000/0.4010 = 249,377 puts).", "ko": "주식 10만 주의 delta는 +100,000입니다. Call 1개 delta가 0.5952이므로 100,000/0.5952 = 168,010개의 call을 팔면 delta가 0이 됩니다. (put으로 하면 100,000/0.4010 = 249,377개를 사야 합니다.)", "trap": "필요한 옵션 수 = 포트폴리오 delta ÷ 옵션 1개 delta. 주식 수 × delta로 곱하면 틀린다.", "f": "N_H = −Portfolio Δ / Δ_H", "why": {"A": "100,000 × 0.4010으로 곱한 값입니다. 나눠야 하므로 put은 249,377개가 필요합니다.", "B": "put delta/call delta 비율(0.6737)을 잘못 쓴 값입니다. 주식 헤지에는 call delta 0.5952로 바로 나눕니다."}, "orig": "ECO Module 2 Q43"}, {"id": "ECO-M2-Q45", "src": "ECO 오답", "module": 2, "tag": "American put – 조기행사 가치로 교체", "vig": null, "stem": "An analyst gathers the following information about a put option on a non-dividend-paying stock:\nStrike price\t50.00\nUnderlying stock price at Time 0\t52.00\nUnderlying stock price at Time 1 when an up move occurs\t76.24\nUnderlying stock price at Time 1 when a down move occurs\t34.12\nEuropean-style put value at Time 1 when an up move occurs\t0.00\nEuropean-style put value at Time 1 when a down move occurs\t14.88\nTime steps\t2\nRisk-free interest rate per period\t2.05%\nThe American-style put option value at Time 0 is closest to:", "opts": {"A": "8.02.", "B": "8.56.", "C": "9.32."}, "ans": "B", "en": "u = 76.24/52 = 1.4662, d = 34.12/52 = 0.6562, π = (1.0205 − 0.6562)/(1.4662 − 0.6562) = 0.4498. At the down node, exercise value 50 − 34.12 = 15.88 > 14.88, so use 15.88. p = (1/1.0205) × [(1 − 0.4498) × 15.88] ≈ 8.56.", "ko": "아래 노드에서 지금 행사하면 50 − 34.12 = 15.88로, 계속 보유 가치 14.88보다 큽니다. American put은 15.88로 바꿉니다. π = 0.4498 → p = (1 − 0.4498) × 15.88/1.0205 ≈ 8.56.", "trap": "American put은 각 노드에서 Max(보유 가치, 행사 가치). u·d는 행사가가 아니라 현재 주가로 구한다.", "f": "p_node = Max[ PV(π p+ + (1 − π) p−),  X − S_node ]", "why": {"A": "아래 노드에 European 값 14.88을 그대로 쓴 값입니다. 조기행사 가치 15.88로 바꿔야 합니다.", "C": "u와 d를 행사가(50)로 나눠 구한 값입니다. u = S+/S0, d = S−/S0입니다."}, "orig": "ECO Module 2 Q45"}, {"id": "ECO-M2-Q47", "src": "ECO 오답", "module": 2, "tag": "Dynamic replication – 노드마다 행사가치 복제", "vig": null, "stem": "In the two-period binomial option valuation model, dynamic replication:", "opts": {"A": "is intended to exactly match the exercise value of the option at each time node.", "B": "results in the value of options at Time 1 driven by arbitrage transactions at Time 0.", "C": "computes the value of options at Time 2 based on the option values at Time 1 using the no-arbitrage approach."}, "ans": "A", "en": "Dynamic replication means the option's payoffs are exactly replicated by planned trading in the underlying and financing, matching the option's value at each node over time.", "ko": "Dynamic replication은 기초자산과 차입·대출을 계획대로 조정해서 각 노드의 옵션 가치를 정확히 맞추는 것입니다.", "trap": "이항모형은 뒤에서 앞으로(backward induction) 계산한다. Time 0 값은 Time 1 값에서, Time 1 값은 Time 2 값에서 나온다.", "f": "Backward induction: t = 2 → t = 1 → t = 0", "why": {"B": "방향이 반대입니다. Time 0의 옵션 가치가 Time 1의 옵션 가치를 복제하는 거래로 정해집니다.", "C": "방향이 반대입니다. Time 2 값(만기 payoff)으로 Time 1 값을 구합니다."}, "orig": "ECO Module 2 Q47"}, {"id": "ECO-M2-Q50", "src": "ECO 오답", "module": 2, "tag": "금리 call option – 노드별 할인계수", "vig": null, "stem": "An analyst values a 2-year, European-style call option on a 1-year spot rate. The notional value of the option is $10,000,000, and the exercise rate is 3.50% of par. The risk-neutral probability of an up move is 0.50. Annually compounded 1-year interest rates, along with the corresponding zero-coupon bond values, are shown below.\nNode\t1-year rate\t1-year zero value\nt=0\t4%\t0.961538\nt=1 up\t5%\t0.952381\nt=1 down\t3%\t0.970874\nt=2 up-up\t6%\t0.943396\nt=2 up-down\t4%\t0.961538\nt=2 down-down\t2%\t0.980392\nThe value of the interest rate option is closest to:", "opts": {"A": "$34,118.", "B": "$45,343.", "C": "$80,350."}, "ans": "C", "en": "Time 2 payoffs: 0.025, 0.005, 0. c+ = 0.952381 × [0.5(0.025) + 0.5(0.005)] = 0.014286; c− = 0.970874 × [0.5(0.005)] = 0.002427. c = 0.961538 × [0.5(0.014286) + 0.5(0.002427)] = 0.008035 → × 10,000,000 = $80,350.", "ko": "만기 payoff = Max(0, 금리 − 3.5%): 2.5%, 0.5%, 0. t = 1 위 0.952381 × 평균 = 0.014286, 아래 0.970874 × 0.0025 = 0.002427. t = 0 = 0.961538 × 평균 = 0.008035 → $80,350.", "trap": "기대값은 π와 (1 − π)를 '더한다'. 음수 payoff는 0으로 바꾼다(Max).", "f": "c = PV × [π c_up + (1 − π) c_down]", "why": {"A": "각 단계에서 두 값을 더하지 않고 뺀 값입니다.", "B": "아래-아래 노드 payoff에 Max를 적용하지 않아 음수(−1.5%)를 그대로 쓴 값입니다."}, "orig": "ECO Module 2 Q50"}, {"id": "ECO-M2-Q54", "src": "ECO 오답", "module": 2, "tag": "기대값 접근 – 투자자 전망 무관", "vig": null, "stem": "The expectations approach to the valuation of European options assumes that:", "opts": {"A": "the discount rate is risk-adjusted.", "B": "investors' beliefs about the future course of the underlying are irrelevant.", "C": "the probability of an up or down move in the underlying is subjectively determined."}, "ans": "B", "en": "Unlike DCF valuation, the expectations approach uses objectively determined risk-neutral probabilities and discounts at the risk-free rate; investors' beliefs about the underlying do not matter.", "ko": "DCF와 달리 기대값 접근은 객관적으로 정해지는 위험중립확률을 쓰고 무위험이자율로 할인합니다. 투자자가 기초자산을 어떻게 전망하는지는 상관없습니다.", "trap": "위험조정 할인율, 주관적 확률은 모두 오답 키워드다.", "f": "c = PV_rf[π c+ + (1 − π) c−]", "why": {"A": "할인율은 위험조정이 아니라 무위험이자율입니다.", "C": "확률은 주관적이 아니라 객관적으로 정해지는 위험중립확률입니다."}, "orig": "ECO Module 2 Q54"}, {"id": "ECO-M2-Q56", "src": "ECO 오답", "module": 2, "tag": "BSM – 공매도 가능, 조기행사 불가", "vig": null, "stem": "The Black–Scholes–Merton option valuation model assumes that:", "opts": {"A": "both short selling and early exercise are permitted.", "B": "short selling is permitted but early exercise is not permitted.", "C": "early exercise is permitted but short selling is not permitted."}, "ans": "B", "en": "BSM assumes short selling of the underlying with full use of proceeds is permitted, and that options are European (no early exercise).", "ko": "BSM은 기초자산 공매도(대금 전액 사용)가 가능하고, 옵션은 European이라 조기행사가 안 된다고 가정합니다.", "trap": "BSM = European option. 조기행사 가능하다는 보기는 오답.", "f": "BSM 가정: 공매도 O, 조기행사 X, 연속 거래, 일정한 변동성·금리", "why": {"A": "BSM은 European 옵션이라 조기행사를 허용하지 않습니다.", "C": "반대입니다. 공매도는 허용, 조기행사는 불허입니다."}, "orig": "ECO Module 2 Q56"}, {"id": "ECO-M2-Q57", "src": "ECO 오답", "module": 2, "tag": "Long 금리 call + short 금리 put = pay-fixed FRA", "vig": null, "stem": "To hedge against a rise in interest rates, a company purchases an interest rate call option and sells short an interest rate put option with exercise rates equal to the current forward rate agreement (FRA) rate. The company's option position is equivalent to a:", "opts": {"A": "receive-fixed, pay-floating FRA.", "B": "receive-floating, pay-fixed FRA.", "C": "receive-fixed, pay-floating swap."}, "ans": "B", "en": "With the exercise rate equal to the FRA rate, long an interest rate call + short an interest rate put = receive-floating, pay-fixed FRA (long FRA).", "ko": "행사금리를 FRA rate로 맞추면, 금리 call 매수 + 금리 put 매도 = 금리가 오르면 이득인 receive-floating, pay-fixed FRA(long FRA)와 같습니다.", "trap": "금리 call은 금리 상승에 이득 → 변동 수취. 여러 기간이면 cap − floor = pay-fixed swap.", "f": "Long call + short put (X = FRA) = receive-floating, pay-fixed FRA", "why": {"A": "Long put + short call 조합이 receive-fixed, pay-floating FRA입니다.", "C": "Swap은 여러 기간이라 cap과 floor로 만들고, receive-fixed swap은 long floor + short cap입니다."}, "orig": "ECO Module 2 Q57"}, {"id": "ECO-M2-Q59", "src": "ECO 오답", "module": 2, "tag": "Delta hedge – put 매도 계약 수", "vig": null, "stem": "An investor is short at-the-money call options with a delta of 0.607 on 500,000 shares of stock. At-the-money put options with the same maturity have a delta of –0.434. Assuming an option contract is for 100 shares, the most appropriate action to achieve a delta neutral position is to:", "opts": {"A": "sell 303,500 shares.", "B": "sell 6,993 put option contracts.", "C": "purchase 6,993 put option contracts."}, "ans": "B", "en": "Portfolio delta = 500,000 × (−0.607) = −303,500. NH = −(−303,500)/(−0.434) = −699,309 → negative, so sell puts on about 699,300 shares = 6,993 contracts.", "ko": "Short call의 포트폴리오 delta = 500,000 × (−0.607) = −303,500입니다. Delta를 +로 만들어야 하는데 put delta는 음수이므로 put을 '팔아야' 합니다. 303,500/0.434 = 699,309주 → 6,993계약 매도.", "trap": "부호를 끝까지 따라간다. N_H가 음

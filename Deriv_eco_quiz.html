수면 그 헤지 수단을 판다. 주식으로 헤지하면 '사야' 한다.", "f": "N_H = −Portfolio Δ / Δ_H", "why": {"A": "주식으로 헤지하려면 303,500주를 '사야' 합니다. 파는 것은 delta를 더 음수로 만듭니다.", "C": "Put을 사면 delta가 더 음수가 됩니다. 양의 delta가 필요하므로 put을 팔아야 합니다."}, "orig": "ECO Module 2 Q59"}, {"id": "ECO-M2-Q63", "src": "ECO 오답", "module": 2, "tag": "금리 call option – t = 1 값에서 할인", "vig": null, "stem": "An analyst gathers the following information about a 2-year European-style call option on the periodically compounded 1-year spot interest rate:\nCall exercise rate\t3.1000%\nRisk-neutral probability of an up move\t50%\n1-year spot interest rate at Time 0\t3.0454%\n1-year spot interest rate at Time 2 after two up moves occur\t3.9706%\n1-year spot interest rate at Time 2 after up and down moves occur\t3.2542%\nCall option value at Time 1 when an up move occurs\t0.4209%\nCall option value at Time 1 when a down move occurs\t0.0751%\nIf the option is cash settled at Time 2 based on the observed rate, the option value as a percentage of the notional amount at Time 0 is closest to:", "opts": {"A": "0.15%.", "B": "0.24%.", "C": "0.87%."}, "ans": "B", "en": "Time 1 values are given, so just discount one step: c = (1/1.030454) × [0.5 × 0.4209% + 0.5 × 0.0751%] ≈ 0.24%.", "ko": "t = 1의 옵션 가치가 이미 주어졌으니 만기 금리로 다시 계산할 필요 없이 한 단계만 할인합니다. (0.5 × 0.4209% + 0.5 × 0.0751%)/1.030454 ≈ 0.24%.", "trap": "중간 노드 값을 주면 만기 payoff는 계산하지 않고 바로 backward induction. 만기 노드 payoff(0.15%, 0.87%)는 함정이다.", "f": "c_0 = PV_0 × [π c+ + (1 − π) c−]", "why": {"A": "만기 up-down 노드의 payoff(3.2542% − 3.10%)입니다.", "C": "만기 up-up 노드의 payoff(3.9706% − 3.10%)입니다."}, "orig": "ECO Module 2 Q63"}, {"id": "ECO-M2-Q64", "src": "ECO 오답", "module": 2, "tag": "Put 복제 – 공매도라 t = 0 현금흐름 양수", "vig": null, "stem": "A trader engages in a strategy that replicates the payoff of a long position in a put option within a single-period binomial framework. At time step 0, the cash flow is:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "C", "en": "Replicating a long put: short sell −h units of the underlying (h < 0 for a put) and lend part of the proceeds. The short sale produces a positive cash flow −hS at Time 0, so the net cash flow is positive.", "ko": "Long put 복제 = 기초자산 공매도 + 대출입니다. Put의 hedge ratio는 음수라 주식을 공매도하고, 공매도 대금이 들어오므로 t = 0 현금흐름은 양수입니다.", "trap": "Put 복제는 공매도로 시작 → 돈이 들어온다. (옵션을 사는 것과 '복제 포지션의 현금흐름'은 부호가 반대다.)", "f": "h_put = (p+ − p−)/(S+ − S−) < 0", "why": {"A": "공매도 대금이 들어오므로 음수가 아닙니다.", "B": "공매도와 대출을 하므로 현금흐름이 0이 아닙니다."}, "orig": "ECO Module 2 Q64"}, {"id": "ECO-M2-Q67", "src": "ECO 오답", "module": 2, "tag": "American put – 아래 노드 조기행사", "vig": null, "stem": "Using the two-period binomial model, an analyst estimates the value of an American-style put option on a stock that pays no dividend. The current stock price is €65, and the put option exercise price is €63. The up factor (u) is 1.20, and the down factor (d) is 0.85. The risk-free rate of return is 5% per period. The binomial tree analysis for a European-style put option is shown in the exhibit below.\nNode\tStock\tEuropean put\nt=0\t65.00\t2.67\nt=1 up\t78.00\t0\nt=1 down\t55.25\t6.55\nt=2 up-up\t93.60\t0\nt=2 up-down\t66.30\t0\nt=2 down-down\t46.96\t16.04\nAt Time Step 0, the value of the American-style put option is closest to:", "opts": {"A": "2.67.", "B": "3.16.", "C": "4.22."}, "ans": "B", "en": "π = (1.05 − 0.85)/(1.20 − 0.85) = 0.5714. At the down node, exercise value = 63 − 55.25 = 7.75 > 6.55, so replace it. p = (1/1.05) × [0.5714 × 0 + 0.4286 × 7.75] = 3.16.", "ko": "아래 노드(55.25)에서 지금 행사하면 63 − 55.25 = 7.75로 보유 가치 6.55보다 큽니다. 7.75로 바꾸고 할인: (0.4286 × 7.75)/1.05 = 3.16.", "trap": "American put은 중간 노드마다 행사 가치와 비교한다. 하락 확률은 1 − π = 0.4286이다.", "f": "p_node = Max[ PV(π p+ + (1 − π) p−),  X − S_node ]", "why": {"A": "European put 가치입니다. 조기행사 가능성을 반영하지 않았습니다.", "C": "하락 노드에 1 − π 대신 π(0.5714)를 곱한 값입니다."}, "orig": "ECO Module 2 Q67"}, {"id": "ECO-M2-Q74", "src": "ECO 오답", "module": 2, "tag": "같은 조건 call vega = put vega", "vig": null, "stem": "A trader has a long position in two options on the same underlying:\n\tPut/Call\tRemaining Maturity\tStrike\tContract\nOption 1\tCall\t1 month\t100\t1,000 shares\nOption 2\tPut\t1 month\t100\t1,000 shares\nThe vega of Option 1 is:", "opts": {"A": "less than Option 2.", "B": "equal to Option 2.", "C": "greater than Option 2."}, "ans": "B", "en": "By put–call parity, c − p = S0 − e^(−rT)X, and the right side does not depend on volatility. So a call and a put with the same strike and maturity have the same vega.", "ko": "Put–call parity(c − p = S − PV(X))의 오른쪽은 변동성과 관계없습니다. 그래서 행사가·만기가 같은 call과 put의 vega는 같습니다.", "trap": "Vega와 gamma는 같은 조건의 call과 put이 같다. Delta·rho·theta는 다르다.", "f": "c − p = S_0 − e^(−rT)X ⇒ vega_c = vega_p", "why": {"A": "조건이 같으면 vega가 같습니다.", "C": "조건이 같으면 vega가 같습니다."}, "orig": "ECO Module 2 Q74"}, {"id": "ECO-M2-Q75", "src": "ECO 오답", "module": 2, "tag": "금리 put option – 2기간 이항", "vig": null, "stem": "An analyst values a 2-year, European-style put option on a 1-year spot rate. The notional value of the option is $2,000,000, and the exercise rate is 2.50% of par. The risk-neutral probability of an up move is 0.50. Annually compounded 1-year interest rates, along with the corresponding zero-coupon bond values, are shown below.\nNode\t1-year rate\t1-year zero value\nt=0\t3%\t0.970874\nt=1 up\t4%\t0.961538\nt=1 down\t2%\t0.980392\nt=2 up-up\t5%\t0.952381\nt=2 up-down\t3%\t0.970874\nt=2 down-down\t1%\t0.990099\nThe value of the interest rate option is closest to:", "opts": {"A": "$7,139.", "B": "$14,706.", "C": "$16,383."}, "ans": "A", "en": "Put payoffs Max(0, X − rate): 0, 0, 0.015. p+ = 0; p− = 0.980392 × 0.5 × 0.015 = 0.007353. p = 0.970874 × 0.5 × 0.007353 = 0.003569 → × 2,000,000 = $7,139.", "ko": "금리 put payoff는 Max(0, 2.5% − 금리): 0, 0, 1.5%. t = 1 아래 노드 = 0.980392 × 0.5 × 0.015 = 0.007353. t = 0 = 0.970874 × 0.5 × 0.007353 = 0.003569 → $7,139.", "trap": "금리 put은 행사금리 − 금리. t = 0까지 두 번 할인한다.", "f": "p = PV × [π p_up + (1 − π) p_down]", "why": {"B": "t = 1 값(0.007353)에서 멈추고 t = 0으로 할인하지 않은 값입니다.", "C": "put이 아니라 call 가치를 계산한 값입니다."}, "orig": "ECO Module 2 Q75"}, {"id": "ECO-M2-Q78", "src": "ECO 오답", "module": 2, "tag": "금리 option의 기초 FRA – 옵션 만기에 시작", "vig": null, "stem": "An interest rate call option on a 3-month MRR has one year to expiration. The underlying interest rate is a forward rate agreement (FRA) rate used in the Black model to value the interest rate option. The underlying rate of the FRA is a 3-month MRR deposit that is:", "opts": {"A": "investable in 3 months and matures in 12 months.", "B": "investable in 9 months and matures in 12 months.", "C": "investable in 12 months and matures in 15 months."}, "ans": "C", "en": "The FRA expires when the option expires (one year), and its underlying is a 3-month deposit starting then: investable in 12 months, maturing in 15 months (a 12 × 15 FRA).", "ko": "옵션 만기(1년)에 시작하는 3개월 금리가 기초입니다. 즉 12개월 뒤 예치해 15개월에 만기가 되는 12 × 15 FRA rate입니다.", "trap": "옵션 만기 = FRA 시작 시점. 그 뒤로 3개월이 더 붙는다.", "f": "Underlying = FRA(0, t_(j−1), t_m),  t_(j−1) = 옵션 만기", "why": {"A": "3개월 뒤 시작해 12개월에 끝나는 3 × 12 FRA는 9개월짜리 금리입니다.", "B": "9 × 12 FRA는 옵션 만기(12개월)보다 먼저 시작합니다. 기초 금리는 12개월에 시작합니다."}, "orig": "ECO Module 2 Q78"}, {"id": "ECO-M2-Q79", "src": "ECO 오답", "module": 2, "tag": "Standard market model – accrual period 조정", "vig": null, "stem": "Compared to the Black model to value European interest rate options, the standard market model assumes that the:", "opts": {"A": "underlying is a futures price.", "B": "discount factor applies to the option expiration.", "C": "actual option premium needs to be adjusted for the accrual period."}, "ans": "C", "en": "Rates in the model are annualized, so the actual option premium must be adjusted for the accrual period (tm). The underlying is a forward (FRA) rate, not a futures price, and the discount factor applies to the FRA maturity (tj−1 + tm), not the option expiration.", "ko": "모델 안의 금리는 연율이라서 실제 옵션 프리미엄은 accrual period(t_m)로 조정해야 합니다. 기초변수는 선물가격이 아니라 FRA rate이고, 할인은 옵션 만기가 아니라 FRA 만기(t_(j−1) + t_m)까지 합니다.", "trap": "Black model = 선물가격이 기초. Standard market model = FRA rate가 기초 + accrual period 조정 + FRA 만기까지 할인.", "f": "c = AP × e^(−r(t_(j−1)+t_m)) × [FRA N(d1) − R_X N(d2)] × NA", "why": {"A": "선물가격이 기초인 것은 Black model입니다. Standard market model은 forward 금리(FRA rate)가 기초입니다.", "B": "할인은 옵션 만기가 아니라 FRA 만기(이자 지급 시점)까지 합니다."}, "orig": "ECO Module 2 Q79"}, {"id": "ECO-M2-Q80", "src": "ECO 오답", "module": 2, "tag": "Volatility smile = IV vs 행사가", "vig": null, "stem": "Market participants use the term volatility smile to describe the implied volatility of a stock option with respect to the:", "opts": {"A": "dividend yield.", "B": "exercise price.", "C": "time to expiration."}, "ans": "B", "en": "Implied volatility versus exercise price is the volatility smile (or skew); implied volatility versus time to expiration is the term structure of volatility.", "ko": "IV를 행사가에 따라 그린 것이 volatility smile(또는 skew)이고, 만기에 따라 그린 것은 term structure of volatility입니다.", "trap": "Smile/skew ↔ 행사가, term structure ↔ 만기, surface ↔ 둘 다.", "f": "Smile: IV(X),  Term structure: IV(T),  Surface: IV(X, T)", "why": {"A": "배당수익률에 따른 IV를 부르는 이름은 없습니다. Smile은 행사가 기준입니다.", "C": "만기에 따른 IV는 term structure of volatility입니다."}, "orig": "ECO Module 2 Q80"}, {"id": "ECO-M2-Q81", "src": "ECO 오답", "module": 2, "tag": "기대값 접근 = 만기 payoff 기대값의 PV", "vig": null, "stem": "The expectations approach values an option as:", "opts": {"A": "the present value of the expected payoff at expiration.", "B": "the expected current payoff from exercising the option before expiration.", "C": "dependent on the investors' expectation for the price of the underlying at expiration."}, "ans": "A", "en": "Option value = present value of the expected terminal payoffs (risk-neutral probabilities, risk-free discounting). It does not depend on early exercise or on investors' subjective expectations.", "ko": "옵션 가치 = 만기 payoff 기대값(위험중립확률)의 현재가치(무위험이자율)입니다. 조기행사나 투자자의 주관적 전망과는 관계없습니다.", "trap": "'expectations'라는 이름 때문에 투자자 기대를 떠올리면 틀린다. 위험중립 기대값이다.", "f": "c = PV_rf[E^π(payoff_T)]", "why": {"B": "조기행사 시 현재 payoff가 아니라 만기 payoff의 기대값입니다.", "C": "투자자의 주관적 기대가 아니라 위험중립확률을 씁니다."}, "orig": "ECO Module 2 Q81"}, {"id": "ECO-M2-Q83", "src": "ECO 오답", "module": 2, "tag": "Black model put = bond − futures 성분", "vig": null, "stem": "An investor wishes to replicate the value of a long European put on a futures contract using a bond component and a futures component. According to the Black model, which of the following combinations will replicate the put value?", "opts": {"A": "The futures component plus the bond component", "B": "The bond component minus the futures component", "C": "The futures component minus the bond component"}, "ans": "B", "en": "Black model: call = futures component − bond component; put = bond component − futures component.", "ko": "Black model에서 call = 선물 성분 − 채권 성분, put = 채권 성분 − 선물 성분입니다.", "trap": "BSM과 같은 구조: call은 '기초자산 − 채권', put은 '채권 − 기초자산'.", "f": "c = e^(−rT)[F N(d1) − X N(d2)],  p = e^(−rT)[X N(−d2) − F N(−d1)]", "why": {"A": "선물과 채권을 모두 long하면 call이나 put이 되지 않습니다.", "C": "선물 성분 − 채권 성분은 call입니다."}, "orig": "ECO Module 2 Q83"}, {"id": "ECO-M2-Q85", "src": "ECO 오답", "module": 2, "tag": "금리 하락 → put 가치 상승 (rho)", "vig": null, "stem": "A decrease in the value of the risk-free interest rate will:", "opts": {"A": "decrease the value of a long put.", "B": "increase the value of a long put.", "C": "increase the value of long call."}, "ans": "B", "en": "Put rho is negative: lower rates raise put value (the PV of the strike received rises). Call rho is positive, so lower rates reduce call value.", "ko": "Put의 rho는 음수입니다. 금리가 내리면 받을 행사가의 현재가치가 커져서 put 가치가 오릅니다. Call의 rho는 양수라 금리 하락 시 call 가치는 내립니다.", "trap": "금리 ↑ → call ↑, put ↓. 금리 ↓ → call ↓, put ↑.", "f": "rho_call > 0,  rho_put < 0", "why": {"A": "반대입니다. 금리가 내리면 put 가치는 오릅니다.", "C": "Call의 rho는 양수라 금리가 내리면 call 가치도 내립니다."}, "orig": "ECO Module 2 Q85"}, {"id": "ECO-M2-Q87", "src": "ECO 오답", "module": 2, "tag": "특별배당 → put 가치 ↑ → short put 손해", "vig": null, "stem": "An investment manager sells 6-month put options on a company's shares. Two months later, the company announces a special dividend payable to shareholders at the end of the month. Based on the Black–Scholes–Merton model, the special dividend will:", "opts": {"A": "reduce the return on the put option position.", "B": "not impact the return on the put option position.", "C": "increase the return on the put option position."}, "ans": "A", "en": "A special dividend during the option's life increases carry benefits, lowering call values and raising put values. The manager is short puts, so the higher put value reduces the position's return.", "ko": "옵션 기간 중 특별배당은 carry benefit 증가 → call 가치 ↓, put 가치 ↑. 매니저는 put을 판 쪽이라 put 가치가 오르면 손해(수익률 감소)입니다.", "trap": "배당 ↑ → 주가 하락 예상 → put ↑. 포지션이 short인지 long인지 확인할 것.", "f": "배당(carry benefit) ↑ ⇒ c ↓, p ↑", "why": {"B": "옵션 기간 중 배당은 옵션 가치에 영향을 줍니다.", "C": "Put 가치가 오르는데 매니저는 put을 팔았으므로 손해입니다."}, "orig": "ECO Module 2 Q87"}, {"id": "ECO-M2-Q90", "src": "ECO 오답", "module": 2, "tag": "IV는 행사가·만기별로 다름", "vig": null, "stem": "Which of the following statements about implied volatility is least accurate? In practice, the implied volatility of options:", "opts": {"A": "is constant across exercise price and time to expiration.", "B": "may be used to revalue existing option positions over time.", "C": "makes it easier to understand the current market price of various risk exposures."}, "ans": "A", "en": "False statement: in practice implied volatility varies across exercise prices and times to expiration (and through calendar time). The other two are accurate uses of implied volatility.", "ko": "틀린 설명입니다. 실제로 IV는 행사가와 만기에 따라 다르고, 시간이 지나며 바뀝니다. 나머지 두 개(기존 포지션 재평가, 위험의 시장가격 파악)는 맞는 설명입니다.", "trap": "'least accurate' 문제. BSM은 변동성이 일정하다고 가정하지만 실제 IV는 smile·term structure가 있다.", "f": "IV = f(X, T, 시간)", "why": {"B": "맞는 설명입니다. IV가 바뀌면 그것으로 기존 포지션을 다시 평가할 수 있습니다.", "C": "맞는 설명입니다. 가격 대신 IV로 호가하면 위험의 시장가격을 이해하기 쉽습니다."}, "orig": "ECO Module 2 Q90"}, {"id": "ECO-M2-Q94", "src": "ECO 오답", "module": 2, "tag": "Delta hedge된 long call – 큰 변동 시 가치 ↑", "vig": null, "stem": "An at-the-money long call option is delta hedged using stock. If the price of the stock increases by a large amount, the value of the combined option and delta hedge position:", "opts": {"A": "decreases.", "B": "remains the same.", "C": "increases."}, "ans": "C", "en": "Long call has positive gamma. The delta approximation is biased low for both up and down moves, so after a large rise the call gains more than the delta estimate and the combined position's value increases.", "ko": "Long call은 gamma가 양수입니다. 주가가 크게 오르면 call 가치가 delta로 예상한 것보다 더 많이 올라서, short 주식 손실을 넘어 전체 포지션 가치가 오릅니다.", "trap": "Delta hedge는 작은 변동에만 맞는다. Long option(+gamma)이면 큰 변동은 위든 아래든 이득.", "f": "Δc ≈ Δ·ΔS + ½Γ·(ΔS)²,  Γ > 0", "why": {"A": "Long call은 gamma가 양수라 큰 변동에서 오히려 이득입니다.", "B": "가치가 그대로인 것은 아주 작은 변동일 때뿐입니다."}, "orig": "ECO Module 2 Q94"}, {"id": "ECO-M2-Q95", "src": "ECO 오답", "module": 2, "tag": "1기간 이항 call – π에 1 + r", "vig": null, "stem": "An analyst gathers the following information about a non-dividend paying stock:\nCurrent stock price\t€60\nCall option exercise price\t€60\nPeriodically compounded risk-free interest rate\t4%\nIn one period, the stock price will either rise to €66 or decline to €54. Based on the one-period binomial option pricing model, the value of the call option is closest to:", "opts": {"A": "€2.88.", "B": "€4.04.", "C": "€4.37."}, "ans": "B", "en": "u = 1.10, d = 0.90, π = (1.04 − 0.90)/(1.10 − 0.90) = 0.70. c+ = 6, c− = 0. c = 0.70 × 6/1.04 = 4.04.", "ko": "u = 1.10, d = 0.90, π = (1.04 − 0.90)/0.20 = 0.70. c = 0.70 × 6/1.04 = 4.04.", "trap": "π 분자는 (1 + r − d)다. 1 − d로 쓰면 틀린다. 기대값은 할인(PV)한다.", "f": "π = (1 + r − d)/(u − d),  c = π c+ / (1 + r)", "why": {"A": "π에서 1 + r 대신 1을 써서 π = 0.5로 계산한 값입니다.", "C": "기대값을 할인하지 않고 1.04를 곱한 값입니다."}, "orig": "ECO Module 2 Q95"}, {"id": "ECO-M2-Q97", "src": "ECO 오답", "module": 2, "tag": "IV로 옵션 상대가치 비교", "vig": null, "stem": "Which of the following statements about implied volatility is most accurate?", "opts": {"A": "Implied volatility remains constant across time to expiration as well as across exercise prices", "B": "Current implied volatility provides information regarding the perceived uncertainty for the historical time period", "C": "Implied volatility can be used to assess the relative value of different options, neutralizing the moneyness and time to expiration effects"}, "ans": "C", "en": "Implied volatility lets us compare the relative value of options with different moneyness and maturities, and revalue positions over time. It varies across strikes and maturities and reflects expected future (not past) uncertainty.", "ko": "IV를 쓰면 moneyness와 만기가 다른 옵션들의 상대가치를 비교할 수 있습니다. IV는 행사가·만기에 따라 다르고, 과거가 아니라 앞으로의 불확실성을 보여줍니다.", "trap": "IV는 미래 지향, 행사가·만기별로 다르다. '상대가치 비교'가 핵심 쓰임새.", "f": "IV: 시장가 → 역산한 미래 변동성", "why": {"A": "IV는 만기와 행사가에 따라 다릅니다(term structure, smile).", "B": "IV는 과거가 아니라 앞으로의 불확실성에 대한 시장 기대입니다."}, "orig": "ECO Module 2 Q97"}, {"id": "VAR-M2-01", "src": "변형", "module": 2, "tag": "Call 고평가 → call 매도 + h주 매수 + 차입", "vig": null, "stem": "A stock is at 40 and will be either 48 or 34 in one period. A one-period call with exercise price 40 trades at 4.80, and the risk-free rate is 4% per period. The model value of the call is 4.18. The arbitrage trade is to sell the call and:", "opts": {"A": "buy 0.571 shares and borrow 18.68.", "B": "short 0.571 shares and lend 18.68.", "C": "buy 0.571 shares and lend 18.68."}, "ans": "A", "en": "h = (8 − 0)/(48 − 34) = 0.571. π = (1.04 − 0.85)/(1.20 − 0.85) = 0.543; c = 0.543 × 8/1.04 = 4.18 < 4.80, so the call is overpriced. Sell it and replicate a long call: buy 0.571 shares and borrow PV(0.571 × 34) = 19.43/1.04 = 18.68.", "ko": "h = 8/14 = 0.571, 모델 가치 4.18 < 시장가 4.80 → call 고평가. Call을 팔고 call 복제(0.571주 매수 + 18.68 차입)를 사면 오늘 4.80 − 4.18 = 0.62를 남깁니다.", "trap": "Call 복제 = 주식 매수 + 차입. 고평가 call → 매도 + 복제 매수.", "f": "h = (c+ − c−)/(S+ − S−),  차입액 = PV(hS− − c−)", "why": {"B": "Call 복제를 '파는' 거래입니다. Call이 저평가일 때 call을 사면서 하는 전략입니다.", "C": "주식을 사면서 돈을 빌려줄 수는 없습니다(자기 돈 사용). Call 복제는 차입이 필요합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-02", "src": "변형", "module": 2, "tag": "Put 복제 = 공매도 + 대출", "vig": null, "stem": "In a one-period binomial model, the portfolio that replicates a long put option consists of:", "opts": {"A": "buying shares and borrowing.", "B": "short selling shares and lending.", "C": "short selling shares and borrowing."}, "ans": "B", "en": "The put hedge ratio is negative, so replication requires short selling shares; the short-sale proceeds exceed the put value, and the excess is lent at the risk-free rate. Time 0 cash flow from the replicating trades is positive.", "ko": "Put의 hedge ratio가 음수라 주식을 공매도합니다. 공매도 대금 일부를 무위험이자율로 빌려줍니다(대출). 그래서 복제 거래의 t = 0 현금흐름은 양수입니다.", "trap": "Call 복제 = 매수 + 차입, put 복제 = 공매도 + 대출.", "f": "p = hS + PV(−hS− + p−),  h < 0", "why": {"A": "Call을 복제하는 포트폴리오입니다.", "C": "공매도 대금이 들어오는데 또 빌릴 필요가 없습니다. Put 복제는 대출입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-03", "src": "변형", "module": 2, "tag": "Covered call 포트폴리오 gamma", "vig": null, "stem": "A portfolio consists of 1,000 shares of stock and short calls on 1,000 shares. The portfolio gamma is most likely:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "A", "en": "Stock gamma = 0. Short options have negative gamma, so the portfolio gamma is negative.", "ko": "주식 gamma는 0이고, 옵션을 팔면(short) gamma가 음수입니다. 그래서 포트폴리오 gamma는 음수입니다.", "trap": "Long option → +Γ, short option → −Γ. Call이든 put이든 같다.", "f": "Γ(portfolio) = 0 + (−Γ_call × 1,000) < 0", "why": {"B": "주식 gamma만 0입니다. Short call의 gamma는 음수입니다.", "C": "Gamma가 양수가 되려면 옵션을 사야 합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-04", "src": "변형", "module": 2, "tag": "모델가 > 시장가 → IV < 입력 σ (call)", "vig": null, "stem": "Using historical volatility of 28%, the BSM value of a call is 6.10. The call trades in the market at 5.70. The implied volatility of the call is most likely:", "opts": {"A": "below 28%.", "B": "equal to 28%.", "C": "above 28%."}, "ans": "A", "en": "Option value increases with volatility. The market price is below the model value computed with 28%, so the volatility implied by the market price is below 28%.", "ko": "옵션 가치는 변동성이 클수록 높습니다. 28%로 계산한 모델가(6.10)보다 시장가(5.70)가 낮으니 시장이 쓰는 변동성(IV)은 28%보다 낮습니다.", "trap": "Historical vol = 내가 모델에 넣은 σ, IV = 시장가에서 역산한 σ. 모델가 > 시장가 ⇒ IV < historical.", "f": "Vega > 0", "why": {"B": "같다면 모델가와 시장가가 같아야 합니다.", "C": "IV가 더 높으면 시장가가 모델가보다 높아야 합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-05", "src": "변형", "module": 2, "tag": "Vega 최대 – ATM", "vig": null, "stem": "Holding maturity constant, the vega of a call option is highest when the option is:", "opts": {"A": "deep in the money.", "B": "at the money.", "C": "deep out of the money."}, "ans": "B", "en": "Vega is highest at the money, where the outcome (exercise or not) is most uncertain. Deep ITM options are almost certain to be exercised and deep OTM almost certain not to be, so volatility matters less.", "ko": "Vega는 ATM에서 가장 큽니다. 행사될지 말지 가장 불확실하기 때문입니다. Deep ITM은 거의 행사되고 deep OTM은 거의 행사되지 않아 변동성 영향이 작습니다.", "trap": "Vega와 gamma는 ATM에서 가장 크다.", "f": "Vega max at S ≈ X", "why": {"A": "Deep ITM은 거의 확실히 행사되어 변동성에 덜 민감합니다.", "C": "Deep OTM은 거의 행사되지 않아 변동성에 덜 민감합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-06", "src": "변형", "module": 2, "tag": "Delta hedge – 주식 delta ÷ call delta", "vig": null, "stem": "An investor holds 50,000 shares and wants a delta-neutral position using calls with a delta of 0.625 (one option per share). The investor should:", "opts": {"A": "sell 31,250 calls.", "B": "buy 80,000 calls.", "C": "sell 80,000 calls."}, "ans": "C", "en": "Portfolio delta = +50,000. Each call has delta 0.625, so sell 50,000/0.625 = 80,000 calls.", "ko": "주식 5만 주의 delta = +50,000. 음의 delta가 필요하므로 call을 팝니다. 50,000/0.625 = 80,000개.", "trap": "옵션 수 = 주식 delta ÷ 옵션 1개 delta(곱하지 않는다). Long stock → short call 또는 long put.", "f": "N_H = −Portfolio Δ / Δ_H = −50,000/0.625 = −80,000", "why": {"A": "50,000 × 0.625로 곱한 값입니다. 나눠야 합니다.", "B": "Call을 사면 delta가 더 양수가 됩니다. 팔아야 합니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-07", "src": "변형", "module": 2, "tag": "만기 접근 → theta 더 음수", "vig": null, "stem": "For an at-the-money option, as expiration approaches, theta most likely:", "opts": {"A": "becomes more negative, so its absolute value increases.", "B": "becomes less negative, approaching zero gradually.", "C": "becomes positive."}, "ans": "A", "en": "Time decay accelerates near expiration for at-the-money options: theta becomes more negative and its absolute value increases.", "ko": "ATM 옵션은 만기가 가까워질수록 시간가치가 더 빨리 줄어듭니다. 그래서 theta가 더 음수가 되고 절댓값이 커집니다.", "trap": "만기 직전 시간가치 감소가 가장 빠르다. Theta는 보통 음수.", "f": "|Θ| ↑ as T → 0 (ATM)", "why": {"B": "반대입니다. 만기가 가까워질수록 시간가치 감소가 빨라집니다.", "C": "일반적인 옵션의 theta는 음수입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-08", "src": "변형", "module": 2, "tag": "BSM 가정 – 로그 수익률 정규분포", "vig": null, "stem": "Which of the following is not an assumption of the BSM model?", "opts": {"A": "The underlying's continuously compounded returns are normally distributed.", "B": "Volatility is known and constant.", "C": "The underlying's annual (simple) returns are normally distributed."}, "ans": "C", "en": "BSM assumes continuously compounded (log) returns are normally distributed, which makes prices lognormal. Annual simple returns are not assumed normal. Known, constant volatility is a BSM assumption.", "ko": "BSM은 연속복리(로그) 수익률이 정규분포(주가는 로그정규)라고 가정합니다. 연 단순 수익률이 정규분포라는 가정은 없습니다. 변동성을 알고 일정하다는 것은 BSM 가정입니다.", "trap": "'annualized return normal'은 오답 키워드.", "f": "ln(S_T/S_0) ~ Normal", "why": {"A": "BSM 가정입니다.", "B": "BSM 가정입니다(변동성 예측 가능·일정)."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-09", "src": "변형", "module": 2, "tag": "Receiver swaption = bond − swap component", "vig": null, "stem": "Using the Black model framework, a receiver swaption can be viewed as:", "opts": {"A": "the swap component minus the bond component.", "B": "the bond component minus the swap component.", "C": "the swap component plus the bond component."}, "ans": "B", "en": "A payer swaption (hedge against rising rates) = swap component − bond component, like a call on the swap rate. A receiver swaption = bond component − swap component, like a put on the swap rate.", "ko": "Payer swaption(금리 상승 대비) = swap 성분 − bond 성분(swap rate에 대한 call). Receiver swaption = bond 성분 − swap 성분(swap rate에 대한 put)입니다.", "trap": "Payer = call on swap rate, receiver = put on swap rate.", "f": "PAY = AP × PVA × [FS N(d1) − X N(d2)] × NA,  REC = AP × PVA × [X N(−d2) − FS N(−d1)] × NA", "why": {"A": "Payer swaption입니다.", "C": "두 성분을 더하면 옵션이 되지 않습니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-10", "src": "변형", "module": 2, "tag": "금리 option 기초 FRA 기간", "vig": null, "stem": "Using the standard market model, an interest rate call option on 6-month MRR expires in 6 months. Its underlying FRA rate is for a 6-month deposit that is:", "opts": {"A": "investable in 6 months and matures in 12 months.", "B": "investable today and matures in 6 months.", "C": "investable in 12 months and matures in 18 months."}, "ans": "A", "en": "The FRA starts when the option expires (6 months) and covers the 6-month MRR period: a 6 × 12 FRA.", "ko": "옵션 만기(6개월)에 시작하는 6개월 금리이므로 6개월 뒤 예치, 12개월 만기인 6 × 12 FRA rate입니다.", "trap": "옵션 만기 = FRA 시작. 그 뒤로 기초 MRR 기간만큼 더한다.", "f": "Underlying = FRA(0, t_(j−1), t_m)", "why": {"B": "오늘 시작하는 것은 현재 spot MRR입니다. 기초는 FRA rate입니다.", "C": "옵션 만기(6개월)보다 늦게 시작하는 금리입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-11", "src": "변형", "module": 2, "tag": "IV vs 만기 = term structure", "vig": null, "stem": "A plot of implied volatility against time to expiration for options with the same exercise price is called the:", "opts": {"A": "volatility smile.", "B": "volatility skew.", "C": "term structure of volatility."}, "ans": "C", "en": "Implied volatility versus time to expiration is the term structure of volatility. Implied volatility versus exercise price is the smile or skew; both dimensions together form the volatility surface.", "ko": "만기에 따른 IV는 term structure of volatility입니다. 행사가에 따른 IV는 smile 또는 skew이고, 둘을 함께 그리면 volatility surface입니다.", "trap": "Smile/skew ↔ 행사가, term structure ↔ 만기.", "f": "Term structure: IV(T)", "why": {"A": "Smile은 행사가에 따른 IV입니다.", "B": "Skew도 행사가에 따른 IV 모양입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-12", "src": "변형", "module": 2, "tag": "금리 상승 → call ↑ put ↓", "vig": null, "stem": "Holding all else constant, an increase in the risk-free rate will most likely:", "opts": {"A": "increase the value of a long call and decrease the value of a long put.", "B": "decrease the value of a long call and increase the value of a long put.", "C": "increase the value of both a long call and a long put."}, "ans": "A", "en": "Call rho is positive (buying a call delays paying the strike, saving financing cost). Put rho is negative (a put delays receiving the strike, so higher rates lower its PV).", "ko": "Call의 rho는 양수입니다(행사가 지급을 미뤄 이자를 아낌). Put의 rho는 음수입니다(행사가 수취가 늦어져 금리가 높으면 현재가치가 줄어듦).", "trap": "금리 ↑ → call ↑, put ↓.", "f": "rho_c > 0,  rho_p < 0", "why": {"B": "금리가 '내릴 때'의 효과입니다.", "C": "Put의 rho는 음수라 금리가 오르면 put 가치가 내립니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-13", "src": "변형", "module": 2, "tag": "American put – 아래 노드 조기행사", "vig": null, "stem": "A non-dividend-paying stock trades at 50. In each of two periods, it moves up by a factor of 1.25 or down by a factor of 0.80. The risk-free rate is 3% per period. Using a two-period binomial model, the value of an American put with an exercise price of 52 is closest to:", "opts": {"A": "5.45.", "B": "5.95.", "C": "6.17."}, "ans": "C", "en": "π = (1.03 − 0.80)/(1.25 − 0.80) = 0.5111. Time 2 payoffs: Suu = 78.125 → 0; Sud = 50 → 2; Sdd = 32 → 20. Time 1: p+ = (0.5111 × 0 + 0.4889 × 2)/1.03 = 0.949 (exercise −10.5, keep 0.949); p− = (0.5111 × 2 + 0.4889 × 20)/1.03 = 10.49 < exercise 52 − 40 = 12 → use 12. p0 = (0.5111 × 0.949 + 0.4889 × 12)/1.03 = 6.17. (European = 5.45.)", "ko": "π = 0.5111. 만기 payoff: 0, 2, 20. 1기 위 노드 0.949, 아래 노드 보유 가치 10.49 < 즉시 행사 12 → 12로 교체. 오늘 = (0.5111 × 0.949 + 0.4889 × 12)/1.03 = 6.17. European이면 5.45.", "trap": "American put은 중간 노드마다 Max(보유 가치, 즉시 행사 가치). 1 − π를 하락 쪽에 곱한다.", "f": "p_node = Max[ PV(π p+ + (1 − π) p−),  X − S_node ]", "why": {"A": "European put 가치입니다. 아래 노드의 조기행사(12)를 반영하지 않았습니다.", "B": "아래 노드 값 12에 1 − π 대신 π를 곱한 값입니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-14", "src": "변형", "module": 2, "tag": "Long 금리 put + short 금리 call = receive-fixed FRA", "vig": null, "stem": "A bank buys an interest rate put and sells an interest rate call, both with exercise rates equal to the current FRA rate and the same terms. The position is equivalent to a:", "opts": {"A": "receive-floating, pay-fixed FRA.", "B": "receive-fixed, pay-floating FRA.", "C": "pay-fixed interest rate swap."}, "ans": "B", "en": "Long interest rate put + short interest rate call (strike = FRA rate) gains when rates fall and loses when they rise: a receive-fixed, pay-floating (short) FRA.", "ko": "금리 put 매수 + 금리 call 매도(행사금리 = FRA rate)는 금리가 내리면 이득, 오르면 손해입니다. 즉 receive-fixed, pay-floating FRA(short FRA)와 같습니다.", "trap": "Long call + short put = pay-fixed FRA, long put + short call = receive-fixed FRA. 여러 기간이면 cap/floor와 swap.", "f": "Long put − call (X = FRA) = short FRA", "why": {"A": "Long call + short put 조합입니다.", "C": "Pay-fixed swap은 long cap + short floor입니다. 한 기간짜리 옵션 조합은 FRA와 같습니다."}, "orig": "오답노트 기반 변형"}, {"id": "VAR-M2-15", "src": "변형", "module": 2, "tag": "Delta hedge된 long put – 큰 하락 시 가치 ↑", "vig": null, "stem": "An investor is long puts and has delta hedged them by buying shares. If the stock falls sharply, the value of the combined position most likely:", "opts": {"A": "increases.", "B": "decreases.", "C": "remains unchanged."}, "ans": "A", "en": "Long puts have positive gamma. The delta approximation is biased low for large moves in either direction, so after a sharp fall the puts gain more than the delta estimate and the hedged position's value increases.", "ko": "Long put도 gamma가 양수입니다. 큰 변동에서는 delta 추정이 실제보다 작게 나오므로, 주가가 크게 내리면 put이 예상보다 더 올라 헤지 포지션 전체 가치가 오릅니다.", "trap": "Long option(+Γ) + delta hedge → 큰 변동은 방향과 상관없이 이득. Short option이면 손해.", "f": "Δp ≈ Δ·ΔS + ½Γ·(ΔS)²,  Γ > 0", "why": {"B": "Short option(−gamma)을 delta hedge했을 때 큰 변동에서 손해를 봅니다.", "C": "가치가 그대로인 것은 아주 작은 변동일 때뿐입니다."}, "orig": "오답노트 기반 변형"}], "vignettes": ["Tim Doyle is a portfolio manager at BestFutures Group, a hedge fund that frequently enters into derivative contracts either to hedge the risk of investments it holds or to speculate outside of those investments. Doyle works alongside Diane Kemper, a junior analyst at the hedge fund. They meet to evaluate new investment ideas and to review several of the firm's existing investments.\nCarry Arbitrage Model\nDoyle and Kemper discuss the carry arbitrage model and how they can take advantage of mispricing in bond markets. Specifically, they would like to execute an arbitrage transaction on a Eurodollar futures contract in which the underlying Eurodollar bond is expected to make an interest payment in two months. Doyle makes the following statements:\nStatement 1: If the Eurodollar futures price is less than the price suggested by the carry arbitrage model, the futures contract should be purchased.\nStatement 2: Based on the cost of carry model, the futures price would be higher if the underlying Eurodollar bond's upcoming interest payment was expected in five months instead of two.\nThree-Year Treasury Note Futures Contract\nKemper then presents two investment ideas to Doyle. Kemper's first investment idea is to purchase a three-year Treasury note futures contract. The underlying 1.5%, semi-annual three-year Treasury note is quoted at a clean price of 101. It has been 60 days since the three-year Treasury note's last coupon payment, and the next coupon payment is payable in 120 days. Doyle asks Kemper to calculate the full spot price of the underlying three-year Treasury note.\n10-Year Treasury Note Futures Contract\nKemper's second investment idea is to purchase a 10-year Treasury note futures contract. The underlying 2%, semi-annual 10-year Treasury note has a dirty price of 104.17. It has been 30 days since the 10-year Treasury note's last coupon payment. The futures contract expires in 90 days. The quoted futures contract price is 129. The current annualized three-month risk-free rate is 1.65%. The conversion factor is 0.7025. Doyle asks Kemper to calculate the equilibrium quoted futures contract price based on the carry arbitrage model.\nJapanese Government Bonds\nAfter discussing Kemper's new investment ideas, Doyle and Kemper evaluate one of their existing forward contract positions. Three months ago, BestFutures took a long position in eight 10-year Japanese government bond (JGB) forward contracts, with each contract having a contract notional value of 100 million yen. The contracts had a price of JPY153 (quoted as a percentage of par) when the contracts were purchased. Now, the contracts have six months left to expiration and have a price of JPY155. The annualized six-month interest rate is 0.12%. Doyle asks Kemper to value the JGB forward position.\nInterest Rate Swaps\nAdditionally, Doyle asks Kemper to price a one-year plain vanilla swap. The spot rates and days to maturity at each payment date are presented in Exhibit 1.\nExhibit 1 – Selected US Spot Rate Data\nDays to Maturity\tSpot Interest Rates (%)\n90\t1.90\n180\t2.00\n270\t2.10\n360\t2.20\nFinally, Doyle and Kemper review one of BestFutures's pay-fixed interest rate swap positions. Two years ago, the firm entered into a JPY5 billion five-year interest rate swap, paying the fixed rate. The fixed rate when BestFutures entered into the swap two years ago was 0.10%. The current term structure of interest rates for JPY cash flows, which are relevant to the interest rate swap position, is presented in Exhibit 2.\nExhibit 2 – Selected Japanese Interest Rate Data\nMaturity (Years)\tYen Spot Interest Rates (%)\tPresent Value Factors\n1\t0.03\t0.9997\n2\t0.06\t0.9988\n3\t0.08\t0.9976\nSum\t\t2.9961\nDoyle asks Kemper to calculate the value of the pay-fixed interest rate swap.", "Donald Troubadour is a derivatives trader for Southern Shores Investments. The firm seeks arbitrage opportunities in the forward and futures markets using the carry arbitrage model.\nTroubadour identifies an arbitrage opportunity relating to a fixed-income futures contract and its underlying bond. Current data on the futures contract and underlying bond are presented in Exhibit 1. The current annual compounded risk-free rate is 0.30%.\nExhibit 1 – Current Data for Futures and Underlying Bond\nFutures Contract\t\tUnderlying Bond\t\nQuoted futures price\t125.00\tQuoted bond price\t112.00\nConversion factor\t0.90\tAccrued interest since last coupon payment\t0.08\nTime remaining to contract expiration\tThree months\tAccrued interest at futures contract expiration\t0.20\n\t\tAccrued interest over life of futures contract\t0.00\nTroubadour next gathers information on a Japanese equity index futures contract, the Nikkei 225 Futures Contract: Troubadour holds a long position in a Nikkei 225 futures contract that has a remaining maturity of three months. The continuously compounded dividend yield on the Nikkei 225 Stock Index is 1.1%, and the current stock index level is 16,080. The continuously compounded annual interest rate is 0.2996%.\nTroubadour next considers an equity forward contract for Texas Steel, Inc. (TSI). Information regarding TSI common shares and a TSI equity forward contract is presented in Exhibit 2.\nExhibit 2 – Selected Information for TSI\n• The price per share of TSI's common shares is $250.\n• The forward price per share for a nine-month TSI equity forward contract is $250.562289.\n• Assume annual compounding.\nTroubadour takes a short position in the TSI equity forward contract. His supervisor asks, \"Under which scenario would our position experience a loss?\"\nThree months after contract initiation, Troubadour gathers information on TSI and the risk-free rate, which is presented in Exhibit 3.\nExhibit 3 – Selected Data on TSI and the Risk-Free Rate (Three Months Later)\n• The price per share of TSI's common shares is $245.\n• The risk-free rate is 0.325% (quoted on an annual compounding basis).\n• TSI recently announced its regular semiannual dividend of $1.50 per share that will be paid exactly three months before contract expiration.\n• The market price of the TSI equity forward contract is equal to the no-arbitrage forward price.", "Sonal Johnson is a risk manager for a bank. She manages the bank's risks using a combination of swaps and forward rate agreements (FRAs).\nJohnson prices a three-year MRR-based interest rate swap with annual resets using the present value factors presented in Exhibit 1.\nExhibit 1 – Present Value Factors\nMaturity (years)\tPresent Value Factors\n1\t0.990099\n2\t0.977876\n3\t0.965136\nJohnson also uses the present value factors in Exhibit 1 to value an interest rate swap that the bank entered into one year ago as the pay-fixed (receive-floating) party. Selected data for the swap are presented in Exhibit 2. Johnson notes that the current equilibrium two-year fixed swap rate is 1.12%.\nExhibit 2 – Selected Data on Fixed for Floating Interest Rate Swap\nSwap notional amount\t$50,000,000\nOriginal swap term\tThree years, with annual resets\nFixed swap rate (since initiation)\t3.00%\nOne of the bank's investments is exposed to movements in the Japanese yen, and Johnson desires to hedge the currency exposure. She prices a one-year fixed-for-fixed currency swap involving yen and US dollars, with a quarterly reset. Johnson uses the interest rate data presented in Exhibit 3 to price the currency swap.\nExhibit 3 – Selected Japanese and US Interest Rate Data\nDays to Maturity\tYen Spot Interest Rates\tUS Dollar Spot Interest Rates\n90\t0.05%\t0.20%\n180\t0.10%\t0.40%\n270\t0.15%\t0.55%\n360\t0.25%\t0.70%\nJohnson next reviews an equity swap with an annual reset that the bank entered into six months ago as the receive-fixed, pay-equity party. Selected data regarding the equity swap, which is linked to an equity index, are presented in Exhibit 4. At the time of initiation, the underlying equity index was trading at 100.00.\nExhibit 4 – Selected Data on Equity Swap\nSwap notional amount\t$20,000,000\nOriginal swap term\tFive years, with annual resets\nFixed swap rate\t2.00%\nThe equity index is currently trading at 103.00, and relevant US spot rates, along with their associated present value factors, are presented in Exhibit 5.\nExhibit 5 – Selected US Spot Rates and Present Value Factors\nMaturity (years)\tSpot Rate\tPresent Value Factors\n0.5\t0.40%\t0.998004\n1.5\t1.00%\t0.985222\n2.5\t1.20%\t0.970874\n3.5\t2.00%\t0.934579\n4.5\t2.60%\t0.895255\nJohnson reviews a 6 × 9 FRA that the bank entered into 90 days ago as the pay-fixed/receive-floating party. Selected data for the FRA are presented in Exhibit 6, and current MRR data are presented in Exhibit 7. Based on her interest rate forecast, Johnson also considers whether the bank should enter into new positions in 1 × 4 and 2 × 5 FRAs.\nExhibit 6 – 6 × 9 FRA Data\nFRA term\t6 × 9\nFRA rate\t0.70%\nFRA notional amount\tUS$20,000,000\nFRA settlement terms\tAdvanced set, advanced settle\nExhibit 7 – Current MRR (Market Reference Rate)\n30-day MRR\t0.75%\n60-day MRR\t0.82%\n90-day MRR\t0.90%\n120-day MRR\t0.92%\n150-day MRR\t0.94%\n180-day MRR\t0.95%\n210-day MRR\t0.97%\n270-day MRR\t1.00%\nThree months later, the 6 × 9 FRA in Exhibit 6 reaches expiration, at which time the three-month US dollar MRR is 1.10% and the six-month US dollar MRR is 1.20%. Johnson determines that the appropriate discount rate for the FRA settlement cash flows is 1.10%.", "Gabriela Torres is the CFO of Fabricantes Conchos (FabC), an automobile parts manufacturer located in Chihuahua, Mexico. She is currently evaluating the firm's debt structure and anticipated financing needs.\nFabC sells most of its product to US auto companies and their suppliers through long-term contracts priced in US dollars. FabC's debt is denominated in US dollars. Torres actively manages the firm's interest rate risk profile using interest rate and fixed-income derivatives, specifically OTC forwards, futures, and swap contracts.\nTorres explains to her deputy, Alejandro Gutiérrez, \"The derivatives contracts we enter into are typically priced using a carry arbitrage model to have zero cost to us at origination. In addition to requiring current interest rates and coupon payments of the underlying bonds, the model makes three assumptions: (1) There are no transaction costs for buying and selling securities; (2) short-selling proceeds become available when the short is covered; and (3) we can borrow and lend at the same risk-free rate of interest.\"\nGutiérrez mentions a major new contract requiring FabC to increase its working capital by borrowing USD35 million in six months. Torres states she is concerned interest rates will rise substantially in the near future and is considering entering a long position (pay fixed) in a 6 × 24 forward rate agreement to lock in the price of the new loan. She asks Gutiérrez what the fixed rate would be using a 30/360 convention and the spot interest rates found in Exhibit 1.\nExhibit 1 – USD Interest Rates\nMonths\tSpot Interest Rate\tPV Factor\n6\t2.10%\t0.9896\n12\t2.64%\t0.9743\n18\t3.07%\t0.9560\n24\t3.35%\t0.9372\n30\t3.56%\t0.9183\n36\t3.81%\t0.8974\n42\t3.92%\t0.8794\n48\t3.98%\t0.8627\n54\t4.02%\t0.8468\n60\t4.03%\t0.8323\nTorres tells Gutiérrez, \"If we issue a long-term bond, it makes more sense to enter a bond futures contract in order to hedge interest rate changes. Typically, bond futures are quoted with pricing that reflects interest accrued since the last coupon payment. Therefore, in markets where spot prices are quoted \"clean\" rather than \"dirty,\" there can be some disconnect between spot and futures prices. In addition, a conversion factor must be applied to quoted bond prices because more than one bond can be delivered to fulfill the terms of the contract. The short (selling) counterparty to the contract will always want to deliver the cheapest bond when the forward contract matures. The conversion factor attempts to adjust for differences in pricing between the bonds that can be delivered to fulfill a particular contract.\"\nTorres continues, \"We are about to enter into a five-year loan with semi-annual interest payments based on prevailing six-month MRR. I think it might make sense to simultaneously enter into a pay-fixed five-year interest rate swap with semi-annual payments to effectively convert that to a fixed-rate loan. Based on the interest rates shown in Exhibit 1, what would the fixed rate be?\"", "Laura Talbot is a portfolio manager at Rock Ledge Capital Advisors (RLCA), an investment firm based in Charlotte, North Carolina. Talbot is meeting with two assistant portfolio managers, Vinay Gupta and Zhong Geng, to review the performance of investments made by RLCA, to evaluate potential new investments and to review client requests for advice.\nTalbot asks Gupta to assess potential mispricing in equity futures markets with a goal of implementing an investment strategy to take advantage of any mispricing that may exist. Specifically, she asks him to evaluate a futures contract on the S&P 400 Mid-Cap stock index expiring in 145 days. The annual risk-free rate is 1.2% and the index price level is 1,935 today. The accumulated value of dividends reinvested over the life of the futures contract is $3.15 per contract.\nOne month (30 days) ago, RLCA entered into a long forward contract on the S&P 500 stock index expiring in 60 days. Talbot has asked Zhong to calculate the value of the forward position today — that is, 30 days after the contract was initiated. Zhong has collected the information in Exhibit 1 to carry out the valuation assignment.\nExhibit 1 – Selected Financial Information for Valuation Assignment\n60-day S&P 500 forward contract, 30 days ago\t3402.49\nS&P 500 index level today\t3450.82\nAnnualized continuously compounded risk-free rate\t1.19%\nAnnualized continuously compounded dividend yield for S&P 500\t0.75%\nA client of RCLA currently has a $250,000,000 one-year loan that carries a 5.15% fixed interest rate. Talbot feels the current interest rate on the loan is high relative to current market rates and that rates will decline further. She recommends that RCLA's client enter into a one-year pay floating MRR receiving fixed-interest rate swap with quarterly payments (30/360 day count convention). The notional amount of the swap is $250,000,000. The current MRR term structure and the corresponding present value factors are provided in Exhibit 2.\nExhibit 2 – MRR Rates and PV Factors\nMaturity (Days)\tRate (%)\tPV Factor\n90\t0.71\t0.9982\n180\t0.92\t0.9954\n270\t1.06\t0.9921\n360\t1.71\t0.9832\nOne year ago, RCLA entered into the four-year pay floating MRR receiving fixed-interest rate swap with annual resets, 30/360 day count, and a notional amount of $50,000,000. The fixed rate on the swap one year ago was 1.89%. Talbot wants to know the value of the swap today given the present value factors given in Exhibit 3.\nExhibit 3 – Present Value Factors\nMaturity (Days)\tPV Factors\n360\t0.9832\n720\t0.9604\n1,080\t0.9326", "Mafadi Consulting Limited is a boutique financial services company located in Johannesburg, South Africa. Mafadi specializes in providing commodity and currency hedging solutions to institutional investors and corporations.\nAndre Fourie is a senior client services consultant for Mafadi. He manages relationships with a number of institutions to assist with their hedging needs. One of Fourie's clients is Global Bullion, a mining and exploration company headquartered in the United States.\nFourie is discussing forward contracts with Patrick Jacob, a new risk analyst at Global Bullion. Jacob is asking about similarities and differences between forward and futures contracts. Fourie makes the following comments to Jacob:\n• Comment 1: If you are long a futures or forward contract and the price of the underlying has risen, the value of a futures contract is most likely lower than that of the equivalent forward contract.\n• Comment 2: Forward contracts are marked to market each day, whereas futures contracts are not.\n• Comment 3: The market value of both futures and forward contracts at initiation is zero.\nJacob wants to understand more about the carry arbitrage approach to valuation and, as part of the discussion, Fourie describes the two fundamental rules for the arbitrageur:\n• Rule 1: The arbitrageur never uses her own money to purchase the underlying security and always invests any proceeds from short selling transactions at the risk-free rate.\n• Rule 2: The arbitrageur does not take any market price risk on the total trade, but individual components of the trade may involve price risk.\nMbali Ndlovu, a trader on Mafadi's derivatives desk, works closely with Fourie to implement solutions for his clients. Fourie asks Ndlovu to review and calculate the value of a five-year ZAR20,000,000 swap into which Global Bullion entered two years ago. It is a receive-fixed, MRR-based interest rate swap with annual resets (30/360 day count). The fixed rate in the swap contract established two years ago was 3%. Exhibit 1 estimates the present value factors.\nExhibit 1 – Present Value Factors for Five-Year Swap\nMaturity (years)\tPresent Value Factor\n1\t0.9802\n2\t0.9560\n3\t0.9311\nIn addition to assisting Fourie, Ndlovu focuses on finding profitable trades for Mafadi by investing the firm's own capital. Ndlovu has noticed some unusual activity in foreign exchange forward rates, especially the rates for the New Zealand dollar (NZD) and the South African rand (ZAR), ZAR/NZD. The foreign exchange forward rate, F0(ZAR/NZD, T), is currently below the foreign exchange spot rate, S0(ZAR/NZD).\nNdlovu is also evaluating the forward contract in Zulu Mineral Mining (Zulu) stock to determine if an arbitrage opportunity exists. The South African 12-month prime rate is 3.25%. The spot price for Zulu is ZAR 60.50. Zulu pays an annual dividend of ZAR3.00, and the next dividend is paid in three months. Interest compounds annually.\nNdlovu receives a request from Fourie to structure an OTC swap transaction for one of his clients. After reviewing the request, Ndlovu agrees to be the counterparty for a one-year swap on Tanzanite Resources (Tanzanite) stock in which the client is seeking to enter into a receive-equity returns and pay-fixed arrangement. Tanzanite does not pay a dividend. The swap is structured as a quarterly reset, 30/360 day count, with a notional value of ZAR 5,000,000. The fixed rate is 3.2% annually. Tanzanite has a return of –3.6% for the first quarter.", "Matthew Riley is a managing director in the Derivatives Group at Stone Ridge Capital Partners (SRCP). Riley specializes in advising clients on the use of derivatives to manage portfolio management strategies. Riley is preparing to meet with four of the firm's clients: Kaeun Kim, Erin Cline, Rahul Mehta, and Michael Mensah.\nThree months ago (90 days), Kim purchased a bond with a 3% annual coupon and a maturity date of seven years from the date of purchase. The bond has a face value of US$1,000 and pays interest every 180 days from the date of issue. Kim is concerned about a potential increase in interest rates over the next year and has approached Riley for advice on how to use forward contracts to manage this risk. Riley advises Kim to enter into a short position in a fixed-income forward contract expiring in 360 days. The annualized risk-free rate now is 1.5% per year and the price of the bond with accrued interest is US$1,103.45.\nOne month ago (30 days), Cline entered a pay floating 3 × 6 forward rate agreement (FRA) at a rate of 2.31% with a notional amount of US$5,000,000. At the time, the three-month MRR was 1.28% and the six-month MRR was 1.8%. Now, 30 days after entering the FRA, two-month MRR is 1.5% and the five-month MRR is 2.5%.\nMehta, who is based in Hong Kong SAR, requires a €25,000,000 one-year bridge loan to fund operations in Germany. He wants to fund this loan at a competitive rate. Riley advises Mehta to borrow HK dollars domestically and then enter into a one-year foreign currency swap to swap into euros. The current exchange rate is HK$9.15 per euro. Exhibit 1 below provides Hong Kong and euro spot interest rates and present value factors.\nExhibit 1 – Hong Kong and Euro Spot Interest Rates\nDays to Maturity\tHK$ Spot Rate (%)\tHK$ PV Factor\tEuro Spot Rate (%)\tEuro PV Factor\n90\t0.610\t0.9985\t0.372\t0.9991\n180\t0.765\t0.9962\t0.422\t0.9979\n270\t0.850\t0.9937\t0.448\t0.9967\n360\t0.935\t0.9907\t0.468\t0.9953\nMichael Mensah is based in Australia and entered into a one-year equity swap 30 days ago. Under the terms of the swap, he would receive the return on the S&P/ASX 300 Metals and Mining Index and pay a fixed annual interest rate of 4.8% on a notional amount of AUD75,000,000. The swap payments are quarterly. At the time the swap was initiated 30 days ago, the value of the S&P/ASX 300 index was 3,250. Today, the value of the S&P/ASX 300 index is 3,738. Exhibit 2 provides present value factors based on the current Australian term structure of interest rates.\nExhibit 2 – Present Value Factors Based on Current Australian Term Structure\nDays to Maturity\tPresent Value Factors\n60\t0.9976\n150\t0.9924\n240\t0.9861\n330\t0.9696", "Vladimir Kozorez is chief investment officer of MegaArb Associates (MAA), a multi-asset-class arbitrage hedge fund he recently launched. He has hired Ludvig Nils, an analyst with a deep and broad background in security analysis but no experience in arbitrage investing. At their first research meeting, Kozorez, who is mentoring Nils, makes the following comments regarding arbitrage using derivative contracts.\n• Comment 1: A forward commitment is a derivative instrument in the form of a contract that provides the ability to lock in a price or rate at which one can buy or sell the underlying instrument at some future date or exchange an agreed-on amount of money on a series of dates.\n• Comment 2: There is a difference between the pricing and the valuation of forward commitments. Pricing involves determining the appropriate forward commitment price or rate, typically after it has been initiated. Valuation involves determining the appropriate rate of the forward commitment when initiating the contract.\n• Comment 3: The two fundamental rules of arbitrage are that one does not use any of one's own money in a transaction, and one does not take any price risk.\nKozorez asks Nils to evaluate a carry arbitrage trade for a S&P 500 Index forward contract. He believes the contract may be mispriced. The index is currently trading at 1,900, and the forward contract expiring in one year is priced at 1,863. The index has a continuously compounded dividend yield of 2.50%, and the one-year continuously compounded interest rate is 0.75%. Kozorez believes that at the time of the contract's expiration, the index will be trading at 1903.\nNils sets out to evaluate arbitrage opportunities using forward rate agreements (FRAs). Kozorez makes the following comments to Nils regarding FRAs: \"An FRA has two counterparties, a fixed-rate receiver that is short Euribor and a floating-rate receiver that is long Euribor. The party that is long a 3 × 9 FRA must make a Euribor deposit in three months and earns the Euribor rate for the subsequent six months.\"\nNils also analyzes a US Treasury futures contract that he plans to use to hedge a corporate bond's interest rate risk. He researches the characteristics of Treasury futures and observes the following characteristics.\n• Characteristic 1: The underlying deliverable bond in a US Treasury futures contract consists of a basket of bonds from which the short position can deliver the cheapest bond.\n• Characteristic 2: Eligible deliverable bonds can have various maturities and coupon rates, and the seller will receive the futures price adjusted by a conversion factor to account for any accrued interest.\n• Characteristic 3: Long and short positions are marked to market each day. Therefore, the contract's market value at the end of each day is zero.\nKozorez has a position in Spanish sovereign bonds that he wants to hold during the next year because he believes euro rates will rally as the European Central Bank continues with its quantitative easing program. He is less hopeful, however, about the EUR currency, which he wants hedged back to USD. Kozorez asks Nils to evaluate this hedging strategy. The US risk-free rate is 0.27%, and the eurozone risk-free rate is 0.94%. Nils also uses the data in Exhibit 1 for his analysis.\nExhibit 1 – Foreign Exchange Rates\n\tUSD/EUR\tEUR/USD\nSpot\t1.1156\t0.8964\nForward\t1.1104\t0.9006\nLastly, MAA has a number of fixed-rate investments, which Kozorez is looking to hedge against rising rates. He asks Nils to review interest rate swap contracts. Nils determines that MAA should enter into a receive-floating, pay-fixed swap. He recognizes that this arrangement will require an exchange of cash flows at initiation, and he sets out to calculate the arbitrage-free amount of the cash flows. Based on his work on other types of derivative instruments, he realizes that he could synthetically create a swap contract through either a portfolio of underlying instruments or a portfolio of forward contracts.", "Meredith Whitney is a senior consultant in the Swaps Advisory Group of DCM Capital, an independent advisory firm. Whitney will be preparing to meet with three clients who need advice on structuring and implementing a swap program to manage their interest rate exposures. She is assisted by a junior analyst from the fixed income group, Toni Yang.\nFor her meetings, Whitney plans to use the data presented in Exhibit 1 below.\nExhibit 1 – Current Term Structure of Rates (%)\nDays\tMRR\tEuribor\tHibor\n90\t1.42\t1.86\t1.22\n180\t1.84\t2.11\t1.53\n270\t2.12\t2.24\t1.70\n360\t3.42\t2.34\t1.87\nNote: MRR is the Market Reference Rate. Euribor is the Euro Interbank Offered Rate. Hibor is the Hong Kong Interbank Offered Rate. All rates shown are annualized.\nWhitney's first meeting is with Novatel, a US based company that currently has an outstanding loan of $250,000,000 that carries a 5.15% fixed interest rate. Novatel's managers feel that the current interest rate on the loan is high and they also believe that interest rates are poised to decline. Whitney advises Novatel to enter into a one-year pay-floating MRR receive-fixed interest rate swap with quarterly payments. The notional principal on the swap will be $250,000,000. Whitney's first task is to determine the appropriate swap rate.\nYang asks Whitney to explain the calculation of the fixed swap rate in a floating-for-fixed interest rate swap. Whitney outlines three possible methods for Yang to consider:\n• Method 1: The swap rate is the difference between MRR and the fixed interest rate on the bond.\n• Method 2: The swap rate is the rate that sets the value of the fixed-rate bond equal to the notional principal of the swap.\n• Method 3: The swap rate is the rate that sets the initial value of the swap equal to zero.\nNext, Whitney meets with Grand Manufacturing. This client is based in Hong Kong but requires a €25,000,000 one-year bridge loan to fund operations in Germany. Grand Manufacturing is currently able to borrow euros at an interest rate of 3.75% but wonders if there is a less expensive alternative. Whitney advises Grand to borrow in HK$ and enter into a one-year foreign currency swap with quarterly payments to pay euros at a fixed rate and receive HK$ at a fixed rate. The current exchange rate is HK$11.42 per €1, and the notional amounts will be exchanged at initiation and at maturity.\nThe final meeting is with KPS Financial Services, a US based asset manager. KPS wants to increase the equity exposure to the US market in one of its portfolios by $100,000,000. Whitney advises KPS to enter into a one-year equity swap with quarterly payments to receive the return on a US stock index and pay a floating MRR interest rate. The current value of the US stock index is 925.\nEach client follows Whitney's advice and immediately implements the recommended position.\nNinety days have passed since Whitney's initial meetings, and in the interim interest rates have increased dramatically. Whitney's clients have asked to meet with her to review their positions.\nIn order to prepare for the meeting, Whitney has obtained updated interest rate data that is presented in Exhibit 2. In addition, she determines that the exchange rate for the Hong Kong dollar is HK$9.96 per €1, and the US stock index is at 905.\nExhibit 2 – Term Structure of Rates 90 Days Later (%)\nDays\tMRR\tEuribor\tHibor\n90\t2.21\t2.94\t1.95\n180\t2.62\t3.03\t2.45\n270\t3.73\t3.08\t2.70\nNote: MRR is the Market Reference Rate. Euribor is Euro Interbank Offered Rate. Hibor is the Hong Kong Interbank Offered Rate. All rates shown are annualized.", "Seo-jun Pak is the CEO of the Nakdong Foundation (\"the Foundation\"), an organization located in Busan, South Korea, whose mission is to support rural healthcare initiatives. The Foundation has a KRW220 billion portfolio consisting entirely of actively managed South Korean equities. The portfolio manager, Ha-eun Kang, has an excellent 14-year track record of beating the KOSPI 200, an index of the 200 largest firms traded on the Korea Exchange. She is permitted to use derivatives to control risks within the portfolio and to synthetically alter positions without trading the underlying securities, many of which are somewhat illiquid.\nKang is meeting with Pak to review a forward position in the portfolio and to discuss two other positions she is considering establishing. Kang explains that six months ago she was concerned the Korean stock market was going to experience a substantial downward price movement in the near term, so she entered into a one-year forward contract to sell KRW180 million times the KOSPI 200, which was at 270.00, at a forward price of 265.07.\nPak asks, \"Why did you agree to sell the index at a forward price that is less than the price it was trading at that time? Stocks are generally expected to rise in value over time.\" Kang responds, \"Forward agreements are priced using an arbitrage model that considers the current price of the asset, the level of interest rates, any carry benefits received from owning the asset, and any carry costs associated with owning the asset. Carry benefits can include dividends or coupon payments, while carry costs can include storage, insurance, waste, or interest paid to borrow funds to purchase the asset. The forward price is the future value of the current price plus the future value of the carry costs less the future value of the carry benefits.\"\nPak notes the KOSPI 200 has risen to 278.50 over the last six months and asks, \"How much have we lost on the KRW180 million forward position to date?\" Kang responds, \"I'll calculate the loss taking into account the current six-month interest rate of 0.68% and the continuously compounded dividend yield on the KOSPI 200, which is 2.20%.\"\nKang tells Pak she is considering entering into a currency swap because the Foundation has a number of long-term contracts to purchase supplies and equipment for rural clinics and these contracts are priced in US dollars. She explains, \"A fixed-for-fixed currency swap would help reduce the risk from fluctuating USD/KRW exchange rates by providing fixed US dollar payments in exchange for fixed Korean won payments. I'm looking at a five-year swap with annual payments. I've done some analysis of this swap based on current Korean and US interest rates and present value factors, which I'm providing to you in Exhibit 1.\"\nExhibit 1 – Korean and US Interest Rates and PV Factors\nT\tKorean Treasury Yield\tPV of KRW1\tUS Treasury Yield\tPV of USD1\n1\t1.82\t0.9821\t1.17\t0.9884\n2\t2.05\t0.9602\t1.23\t0.9758\n3\t2.18\t0.9374\t1.29\t0.9623\n4\t2.26\t0.9145\t1.37\t0.9470\n5\t2.30\t0.8925\t1.55\t0.9260\nKang also brings up a concern about the portfolio's 100% allocation to Korean equities. She tells Pak, \"The KOSPI 200 has been far more volatile over the past 15 years than other major market indexes. Although I have great confidence in my ability to continue to beat the index, it would be useful to diversify our holdings by using a swap to exchange some of the underlying index return for another return, such as the S&P 500. Assuming no dividends, as is the case for these two indexes, equity-for-equity swaps do not need to be priced. The carry arbitrage model shows that the two parties to the swap must agree to swap the index returns without any adjustment because the swap is equivalent to two equity-for-fixed swaps. The fixed interest payments will be the same and will cancel each other out. The fixed interest rates will also be the same as those for a fixed-for-floating interest rate swap of the same maturity entered into at the same time.\"", "Bruno Sousa has been hired recently to work with senior analyst Camila Rocha. Rocha gives him three option valuation tasks.\nAlpha Company\nSousa's first task is to illustrate how to value a call option on Alpha Company with a one-period binomial option pricing model. It is a non-dividend-paying stock, and the inputs are as follows.\n• The current stock price is 50, and the call option exercise price is 50.\n• In one period, the stock price will either rise to 56 or decline to 46.\n• The risk-free rate of return is 5% per period.\nBased on the model, Rocha asks Sousa to estimate the hedge ratio, the risk-neutral probability of an up move, and the price of the call option. In the illustration, Sousa is also asked to describe related arbitrage positions to use if the call option is overpriced relative to the model.\nBeta Company\nNext, Sousa uses the two-period binomial model to estimate the value of a European-style call option on Beta Company's common shares. The inputs are as follows.\n• The current stock price is 38, and the call option exercise price is 40.\n• The up factor (u) is 1.300, and the down factor (d) is 0.800.\n• The risk-free rate of return is 3% per period.\nSousa then analyzes a put option on the same stock. All of the inputs, including the exercise price, are the same as for the call option. He estimates that the value of a European-style put option is 4.53. Exhibit 1 summarizes his analysis. Sousa next must determine whether an American-style put option would have the same value.\nExhibit 1 – Two-Period Binomial European-Style Put Option on Beta Company\nNode\tUnderlying\tPut\tHedge ratio\nt=1 up\t49.40\t0.2517\t–0.01943\nt=1 down\t30.40\t8.4350\t–1\nt=2 up-up\t64.22\t0\t\nt=2 up-down\t39.52\t0.48\t\nt=2 down-down\t24.32\t15.68\t\nSousa makes two statements with regard to the valuation of a European-style option under the expectations approach.\nStatement 1: The calculation involves discounting at the risk-free rate.\nStatement 2: The calculation uses risk-neutral probabilities instead of true probabilities.\nRocha asks Sousa whether it is ever profitable to exercise American options prior to maturity. Sousa answers, \"I can think of two possible cases. The first case is the early exercise of an American call option on a dividend-paying stock. The second case is the early exercise of an American put option.\"\nInterest Rate Option\nThe final option valuation task involves an interest rate option. Sousa must value a two-year, European-style call option on a one-year spot rate. The notional value of the option is 1 million, and the exercise rate is 2.75%. The risk-neutral probability of an up move is 0.50. The current and expected one-year interest rates are shown in Exhibit 2, along with the values of a one-year zero-coupon bond of 1 notional value for each interest rate.\nExhibit 2 – Two-Year Interest Rate Lattice for an Interest Rate Option\nNode\t1-year rate\t1-year zero value\nt=0\t3%\t0.970874\nt=1 up\t4%\t0.961538\nt=1 down\t2%\t0.980392\nt=2 up-up\t5%\t0.952381\nt=2 up-down\t3%\t0.970874\nt=2 down-down\t1%\t0.990099\nRocha asks Sousa why the value of a similar in-the-money interest rate call option decreases if the exercise price is higher. Sousa provides two reasons.\nReason 1: The exercise value of the call option is lower.\nReason 2: The risk-neutral probabilities are changed.", "Trident Advisory Group manages assets for high-net-worth individuals and family trusts.\nAlice Lee, chief investment officer, is meeting with a client, Noah Solomon, to discuss risk management strategies for his portfolio. Solomon is concerned about recent volatility and has asked Lee to explain options valuation and the use of options in risk management.\nOptions on Stock\nLee uses the BSM model to price TCB, which is one of Solomon's holdings. Exhibit 1 provides the current stock price (S), exercise price (X), risk-free interest rate (r), volatility (σ), and time to expiration (T) in years as well as selected outputs from the BSM model. TCB does not pay a dividend.\nExhibit 1 – BSM Model for European Options on TCB\nS\tX\tr\tσ\tT\n$57.03\t55\t0.22%\t32%\t0.25\nd1\tN(d1)\td2\tN(d2)\tCall / Put\n0.3100\t0.6217\t0.1500\t0.5596\t$4.695 / $2.634\nOptions on Futures\nThe Black model valuation and selected outputs for options on another of Solomon's holdings, the GPX 500 Index (GPX), are shown in Exhibit 2. The spot index level for the GPX is 187.95, and the index is assumed to pay a continuous dividend at a rate of 2.2% (δ) over the life of the options being valued, which expire in 0.36 years. A futures contract on the GPX also expiring in 0.36 years is currently priced at 186.73.\nExhibit 2 – Black Model for European Options on the GPX Index\nGPX Index\tX\tr\tσ\tT\tδ Yield\n187.95\t180\t0.39%\t24%\t0.36\t2.2%\nModel Call\tModel Put\tMarket Call\tMarket Put\n$14.2089\t$7.4890\t$14.26\t$7.20\nDelta (call)\tDelta (put)\tGamma\tTheta (call, daily)\tRho (call, per %)\tVega (per %)\n0.6232\t–0.3689\t0.0139\t–0.0327\t0.3705\t0.4231\nAfter reviewing Exhibit 2, Solomon asks Lee which option Greek letter best describes the changes in an option's value as time to expiration declines.\nSolomon observes that the market price of the put option in Exhibit 2 is $7.20. Lee responds that she used the historical volatility of the GPX of 24% as an input to the BSM model, and she explains the implications for the implied volatility for the GPX.\nOptions on Interest Rates\nSolomon forecasts the three-month MRR will exceed 0.85% in six months and is considering using options to reduce the risk of rising rates. He asks Lee to value an interest rate call with a strike price of 0.85%. The current three-month MRR is 0.60%, and an FRA for a three-month MRR loan beginning in six months is currently 0.75%.\nHedging Strategy for the Equity Index\nSolomon's portfolio currently holds 10,000 shares of an exchange-traded fund (ETF) that tracks the GPX. He is worried the index will decline. He remarks to Lee, \"You have told me how the BSM model can provide useful information for reducing the risk of my GPX position.\" Lee suggests a delta hedge as a strategy to protect against small moves in the GPX Index.\nLee also indicates that a long position in puts could be used to hedge larger moves in the GPX. She notes that although hedging with either puts or calls can result in a delta-neutral position, they would need to consider the resulting gamma.", "Arnie Burr is CEO and chief investment officer of Princeton Capital, a registered investment advisory firm. He is working with Tom Jeffinsin, head trader, and Jim Madisox, a new analyst. They meet to discuss option valuation methodologies in the context of the firm's use of derivatives to manage client portfolios.\nBurr begins the discussion by stating that the Black–Scholes–Merton (BSM) model is a relatively straightforward tool for valuing options despite its rigorous computational components. Burr writes the BSM model on the firm's whiteboard, presented as Exhibit 1.\nExhibit 1 – BSM Model for Options on Non-Dividend Paying Stocks\nc = S·N(d1) – e^(–rT)·X·N(d2)\np = e^(–rT)·X·N(–d2) – S·N(–d1)\nd1 = [ln(S/X) + (r – γ + σ²/2)T] / (σ√T),  d2 = d1 – σ√T\nBurr wants to assess Madisox's comprehension of the components of the BSM. Madisox states that a call option can be viewed as a leveraged position in the underlying stock. To replicate a call option, the appropriate strategy is to purchase N(d1) shares and simultaneously borrow an amount e^(–rT)·X·N(–d2).\nJeffinsin introduces option Greeks into the conversation, stating, \"The BSM model contains six inputs: the stock price, the option's exercise price, dividends, the risk-free interest rate, time to maturity, and implied volatility. The effect of the BSM model inputs on the price of an option can be measured by the option Greeks. Delta and gamma are measures of the relationship between a change in the stock price and the option price. Theta is a measure that typically approaches zero at an increasing rate as the option approaches maturity. Holding all other factors constant, Vega is a measure that typically is higher whenever an option is \"out of the money.\"\"\nBurr states that a client would like to sell calls on 1,000 shares of Weehawkin stock. Stock and option information on Weehawkin stock is presented in Exhibit 2.\nExhibit 2 – Option Information on Weehawkin Corporation Stock\nStock Price\t$100\nCall Option Exercise Price\t$100\nCall Option Value\t$9.23\nCall Option Delta\t0.587\nCall Option Gamma\t0.019\nBurr asks Madisox to outline an appropriate hedging strategy. Madisox replies that to be fully hedged, an option trader will need to consider how changes in the stock price relative to the option exercise price affect the value of the call options. To be fully hedged against a small change in the stock price, Madisox suggests that the proper strategy to construct the hedge is to use call option delta and add the call option gamma to arrive at the number of shares required.\nMadisox notes that the implied volatility for the Weehawkin call option outlined in Exhibit 2 is 30%. With respect to other call options on Weehawkin stock, Madisox states the volatility surface provides a visualization of how implied volatility varies across both exercise price and time to maturity. Burr adds that implied volatility is useful in assessing the market price of risk since it is calculated on the basis of the historical volatility in the stock price. Jeffinsin concurs and adds that the volatility smile and skew typically have identical shapes whenever the market price of hedging is rising.", "High Street Investment Management is an investment subadvisory firm partnering with Registered Investment Advisors to provide counsel for options trading strategies. Scott Cummins is High Street's CEO and chief investment officer. Phyllis Schwartz leads the client relationship team. David Spelding is a recent college graduate, who just joined the firm as an analyst. Cummins and Schwartz are conducting an introductory training session on options pricing, focusing on the binomial option valuation model (i.e., the binomial model).\nCummins begins the session by listing, in Exhibit 1, variables and values for a binomial model to illustrate an outcome.\nExhibit 1 – Binomial Model Variables and Values\nVariable\tValue\nStock price (S)\tUS$100\nExercise price (X)\tUS$100\nUp factor (U)\t1.35\nDown factor (D)\t0.75\nRisk-free rate (r)\t2.00%\nSchwartz states, \"The one-period binomial model is based on the no-arbitrage approach in which an investor does not take any risk or use his own money. Based on the information in Exhibit 1, the probability of an up move is 45%. For an investor, the no-arbitrage approach is similar to both the expectations approach and the discounted cash flow approach. Each approach is based on the investor's expectation regarding the future course of the underlying stock price.\"\nSchwartz then introduces the two-period binomial model. She states that the two-period binomial lattice can be viewed as three one-period binomial lattices and that each lattice may be used to value a call option. Schwartz instructs Spelding to use the two-period binomial model and the information in Exhibit 1 to calculate the value of a two-year European-style call option.\nCummins states that long-/short-hedge fund managers seek to identify and exploit any mispricing that may exist between the price of an option and the price of its underlying stock, utilizing a replicating strategy. Cummins asks Spelding to assess the three scenarios outlined in Exhibit 2, based on the information in Exhibit 1 and assuming that the price of a one-year European-style call option is $19.25.\nExhibit 2 – Scenarios and Replicating Strategies\n\tOptions Trade\tStock Trade\tFinancing\nScenario 1\tSell\tBuy\tLend\nScenario 2\tSell\tBuy\tBorrow\nScenario 3\tBuy\tSell\tLend\nSchwartz then asks Spelding to use the information in Exhibit 1 to calculate the no-arbitrage value of a two-year US-style put option, assuming that the option may be exercised in one year.", "Alfred Hamilton is CEO and CIO of Nevis Capital, a Registered Investment Advisory firm. He is meeting with Phil Burr, head trader, and Jon Laurens, a recently hired analyst, to discuss option valuation methodologies in the context of the firm's use of derivatives to manage client portfolios.\nHamilton begins by stating that the binomial option valuation (binomial) model and the Black-Scholes-Merton (BSM) model are each useful in understanding option valuation approaches. Hamilton compares the binomial model to the BSM model, stating that \"both the binomial model and the BSM model are dependent on the path of the underlying security price during the term of the option. In addition, both models assume the investor is not taking price risk and the risk-free interest rate is used to discount future outcomes that are probabilistic.\"\nBurr describes the two-period binomial model to Laurens and provides information related to Lafayette Corporation's common stock and options on that stock (presented in Exhibit 1). Lafayette stock does not pay a dividend.\nExhibit 1 – Information on Lafayette Corporation Stock and Options\nStock price\t$100\nCall strike\t$100\nLafayette bond rate\t7.00%\nRisk-free interest rate\t5.00%\nUp factor\t1.25\nDown factor\t0.85\nThe price of a one-year call option on Lafayette Corporation common stock is $15.28. Based on this price and on information provided in Exhibit 1, Hamilton, Laurens, and Burr believe that an arbitrage opportunity may exist, which arbitrageurs could exploit based on the binomial model no-arbitrage approach. Hamilton states the arbitrageurs should buy call options using borrowed funds. Laurens disagrees, stating that arbitrageurs should short-sell shares and lend the proceeds. Burr also disagrees, stating that arbitrageurs should buy shares using borrowed funds.\nLaurens discusses European-style and American-style call options in the context of the multiperiod binomial model. Laurens states that \"by dividing the time steps of the two-period binomial model into a larger number of shorter and equal length time steps, the expectations approach can be applied to a European-style call option to calculate its value based on the present value of expected future cash flows. For a non-dividend-paying stock, an American-style call option's value can be calculated based on the present value of expected future cash flows because American-style call options and European-style call options can be described and interpreted similarly and because the no-arbitrage approach applies to each.\"", "Athena Advisors Inc. offers portfolio replication services to pension funds and insurance companies through the use of options. Clients are typically able to replicate market exposures with smaller than normal investments of funds. Athena manages exposures for its client Wertfin Insurance Company related to annuities indexed to the German Blue Chip Equity Index. Athena portfolio manager Hannes Messer is meeting with Wertfin's risk manager, Jens Szillat, who has asked to learn more about the principles behind the option strategies being employed.\nSzillat tells Messer, \"I am somewhat familiar with option valuation models; however, I would like to learn more about Athena's methodologies with respect to the index options you are managing for our portfolio.\"\nMesser replies, \"The binomial valuation model can be applied to the two-year European style index call options we purchased one year ago. The applicable underlying instrument is the German Blue Chip Equity price index, which excludes dividends. Exhibit 1 shows the option's characteristics at the time of purchase.\"\nExhibit 1 – Binomial Model Variables\nu\t1.15\nd\t0.90\nπ\t0.52\nIndex price\tEUR 720\nStrike price\tEUR 750\nHedge ratio\t0.5697\n1-year interest rate\t3%\nS–\t648\nC–\t0\nMesser explains, \"Of course, with the index moving down 10% in the last 12 months, the payoffs with these options could have been replicated without using options.\" Szillat responds, \"My understanding is that the payoff would have been the same as the call option if you had purchased 0.5697 index units and lent EUR 356.79 at the one-year interest rate.\"\nMesser continues, \"Twelve months ago, I noted that two-year puts with a strike price of EUR750 cost EUR38.48. Using the information in Exhibit 1 and today's index value, the binomial val

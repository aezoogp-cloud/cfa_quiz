<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 4 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.jump{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.jump select,.jump input{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:inherit}
.jump select{flex:1;min-width:0;max-width:100%}
.jump input{width:72px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
/* 지문 왼쪽 · 문제/해설 오른쪽 (cmock처럼) */
body.wide .wrap{max-width:1440px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
.split .card{margin-top:0}
.vpane{position:sticky;top:104px;max-height:calc(100vh - 116px);overflow:auto;background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:12px;padding:12px 18px 16px;font-size:14.5px}
.vpane .vhead{font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:4px}
.vpane p{margin:.5em 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.vpane{position:static;max-height:42vh}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Mock 4 오답 퀴즈<span>CFA Level II, CFA Institute 모의고사</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>

</div></header>

</main>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock4", "title": "Mock 4"}, "questions": [{"id": "mock4-Q1", "src": "정답", "module": "AI", "tag": "REIT NAVPS (cap rate)", "vig": 0, "stem": "Maipo's NAVPS is closest to:", "opts": {"A": "$63.", "B": "$74.", "C": "$86."}, "ans": "B", "en": "A. $63. — Incorrect\nIncorrect because NOI is valued at the cost of equity, not the cap rate:\nLast-12-month pro forma cash net operating income (NOI)\t$240\nPlus: Next-12-month growth in NOI\t$36\nEquals: Estimated next-12-month cash NOI\t$276\nIncorrectly divide the above number by cost of equity of 9.5% to get: Estimated value of operating real estate ($276/0.095)\t$2,905.26\nPlus: Cash, Accounts Receivable, and Prepaid Assets\t$50\nPlus: Land held for future development\t$800\nEquals: Estimated gross asset value\t$3,755.26\nLess: Total debt\t$600\nEquals: Net asset value (NAV)\t$3,155.26\nDivide by: Number of shares\t50\nEquals: NAVPS\t$63.11\nB. $74. — Correct\nCorrect because NAVPS is calculated correctly:\nLast-12-month pro forma cash net operating income (NOI)\t$240\nPlus: Next-12-month growth in NOI\t$36\nEquals: Estimated next-12-month cash NOI\t$276\nDivide above number by the cap rate of 8.0% to get: Estimated value of operating real estate ($276/0.08)\t$3,450\nPlus: Cash, Accounts Receivable, and Prepaid Assets\t$50\nPlus: Land held for future development\t$800\nEquals: Estimated gross asset value\t$4,300\nLess: Total debt\t$600\nEquals: Net asset value (NAV)\t$3,700\nDivide by: Number of shares\t50\nEquals: NAVPS\t$74\nC. $86. — Incorrect\nIncorrect because debt is not subtracted from the estimated value of operating real estate when NAVPS is calculated:\nLast-12-month pro forma cash net operating income (NOI)\t$240\nPlus: Next-12-month growth in NOI\t$36\nEquals: Estimated next-12-month cash NOI\t$276\nDivide above number by the cap rate of 8.0% to get: Estimated value of operating real estate ($276/0.08)\t$3,450\nPlus: Cash, Accounts Receivable, and Prepaid Assets\t$50\nPlus: Land held for future development\t$800\nEquals: Estimated gross asset value\t$4,300\nLess: Total debt (Omitted)\t\nEquals: Net asset value\t$4,300\nDivide by: Number of shares\t50\nEquals: NAVPS\t$86\nThis also rounds up from $85.50 which you get if you add the cash, accounts receivable, and prepaid assets before applying the cap rate (and subtract total debt correctly).", "ko": "다음 12개월 현금 NOI = 240 + 36 = 276. 영업 부동산 가치 = 276 / 0.08(cap rate) = 3,450. 여기에 현금·매출채권·선급자산 50과 개발용 토지 800을 더하면 총자산가치 4,300. 부채 600을 빼면 NAV 3,700, 주식 수 50으로 나누면 NAVPS = $74.", "trap": "NOI는 자기자본비용(9.5%)이 아니라 cap rate로 나눈다. 부채 차감을 빼먹으면 $86.", "f": "NAVPS = [NOI_next / cap rate + 기타 자산 − 부채] / 주식 수", "why": {"A": "cap rate 대신 자기자본비용 9.5%로 할인(276/0.095).", "C": "부채 600을 빼지 않음."}, "orig": "Mock 4 Session 1 Q1", "conf": false}, {"id": "mock4-Q2", "src": "정답", "module": "AI", "tag": "원자재 섹터 공통 요인", "vig": 0, "stem": "Which of the following factors is most likely a primary influence for all three commodity sectors held by Crescent?", "opts": {"A": "Spoilage", "B": "Weather conditions", "C": "Consumer preferences"}, "ans": "B", "en": "A. Spoilage — Incorrect\nIncorrect because spoilage has very little effect on the supply of natural gas. Spoilage does affect the supply for the softs and livestock sectors.\nB. Weather conditions — Correct\nCorrect because the weather affects all three sectors. Demand for natural gas is driven primarily by weather conditions, such as providing heat during cold weather and cooling during hot weather. Weather is a primary factor for both softs and livestock. Additionally, the health of livestock is vulnerable to unfavorable weather conditions.\nC. Consumer preferences — Incorrect\nIncorrect because consumer preferences are not a primary influence on natural gas.\nDemand for natural gas is driven primarily by weather conditions (heating and cooling) and only secondarily by industrial activity.", "ko": "천연가스 수요는 주로 날씨(난방·냉방)에 좌우되고, 농산물(softs)과 가축도 날씨가 수확·건강에 직접 영향을 준다. 그래서 세 섹터 모두의 주요 요인은 날씨다.", "trap": "부패(spoilage)는 농산물·가축에는 중요하지만 천연가스에는 거의 상관없다.", "f": "", "why": {"A": "천연가스에는 부패 문제가 거의 없다.", "C": "소비자 선호는 천연가스의 주요 요인이 아니다."}, "orig": "Mock 4 Session 1 Q2", "conf": false}, {"id": "mock4-Q3", "src": "정답", "module": "AI", "tag": "roll return 부호 (contango)", "vig": 0, "stem": "The roll return on Crescent's natural gas futures contract on the 26 June trade date was:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "A", "en": "A. negative. — Correct\nCorrect because Roll return = [(Near-term futures contract closing price − Farther-term futures contract closing price) / Near-term futures contract closing price] × Percentage of the position in the futures contract being rolled\n= ($1.795 – $2.338) / $1.795 = –$0.543 / $1.795 < 0.\nB. zero. — Incorrect\nIncorrect because the roll return would equal zero only if the June and July futures prices were equal on 26 June, which is not the case since the June price is $1.795 and the July price is $2.338.\nC. positive. — Incorrect\nIncorrect because the roll return is negative when the numerator is correctly calculated as (Near-term futures contract closing price − Farther-term futures contract closing price). The roll return is only positive if the numerator calculation is incorrectly reversed: (Farther-term futures contract closing price − Near-term futures contract closing price) = $2.338 – $1.795 = $0.543 > 0.", "ko": "6월 26일에 만기가 된 6월물(1.795)을 7월물(2.338)로 굴린다. Roll return = (근월물 − 원월물)/근월물 = (1.795 − 2.338)/1.795 < 0. 원월물이 더 비싼 contango에서는 롤 수익이 음수다.", "trap": "분자를 (원월물 − 근월물)로 뒤집으면 양수가 나와 틀린다.", "f": "Roll return = (근월물 가격 − 원월물 가격) / 근월물 가격 × 롤 비중", "why": {"B": "6월물과 7월물 가격이 같아야 0.", "C": "분자를 거꾸로 계산한 경우."}, "orig": "Mock 4 Session 1 Q3", "conf": false}, {"id": "mock4-Q4", "src": "정답", "module": "AI", "tag": "hedging pressure 가설", "vig": 0, "stem": "Under the hedging pressure hypothesis, the prices in Exhibit 2 indicate:", "opts": {"A": "excess demand for price protection by producers.", "B": "excess demand for price protection by consumers.", "C": "balanced demand for price protection by producers and consumers."}, "ans": "B", "en": "A. excess demand for price protection by producers. — Incorrect\nIncorrect because if commodity producers as a group are more interested in selling forward (seeking price insurance) than commodity consumers (as per the concept of normal backwardation) are, then the shape and structure of the futures price curve can be illustrated as backwardation.\nB. excess demand for price protection by consumers. — Correct\nCorrect because if the buyers are especially worried about the availability of the crop in the next harvest but producers are less concerned this situation would lead to a futures price curve that represents a market in contango. In this case, the additional demand for price insurance among buyers (versus sellers) of the commodity will lead them to bid up the futures price to induce speculators to take on this price uncertainty risk.\nC. balanced demand for price protection by producers and consumers. — Incorrect\nIncorrect because if the two forces of producers and consumers both seeking price protection are equal in weight, then a flat futures curve is produced. However, in this case the futures curve is upward sloping and so the demand must not be balanced.", "ko": "Exhibit 2의 선물가격은 만기가 길수록 높다(contango). Hedging pressure 가설에서 contango는 소비자(구매자)가 가격 보호를 더 원해서 선물가격을 끌어올린 결과다.", "trap": "생산자 쪽 헤지 수요가 크면 backwardation(만기 갈수록 하락).", "f": "", "why": {"A": "생산자 수요 우위면 backwardation.", "C": "균형이면 평평한 곡선."}, "orig": "Mock 4 Session 1 Q4", "conf": false}, {"id": "mock4-Q5", "src": "정답", "module": "FI", "tag": "spot rate로 YTM 구하기", "vig": 1, "stem": "The YTM for the bond in Strategy A is closest to:", "opts": {"A": "3.65%.", "B": "4.00%.", "C": "4.96%."}, "ans": "C", "en": "A. 3.65%. — Incorrect\nIncorrect because this calculation is based on getting the correct price of the bond (98.21) but then assuming that the YTM involves multiplying the amortized discount by a factor of two (for a two-year bond).\n[(100/98.21) – 1] × 2 = 3.65%\nB. 4.00%. — Incorrect\nIncorrect because this is the average of the 1- and 2-year spot rates (3.00%, 5.00%). It is also the coupon rate (4.00%). Neither of these approaches correctly uses the spot rates to value the bond's cash flows.\nC. 4.96%. — Correct\nCorrect because to determine the YTM of a bond it first has to be priced using the spot rates. Using the data given and a par of 100:\nP = 4/(1 + 0.03) + 104/(1 + 0.05)^2= 98.21\nThen, to get the YTM of this bond on a calculator the following is input:\nFV = 100\nPMT = 4\nPV = -98.21\nN = 2\nThen solving for \"I\" leads to a YTM of 4.96%\n(Rounded to two decimal places, using a truncated price of -98.21. Without truncation gives 4.96% to two decimal places).", "ko": "먼저 spot rate로 가격을 구한다: P = 4/1.03 + 104/1.05^2 = 98.21. 계산기에 N=2, PMT=4, FV=100, PV=−98.21 → I/Y = 4.96%.", "trap": "1·2년 spot rate 평균(4%)이나 쿠폰율은 YTM이 아니다.", "f": "P = Σ CF_t/(1+z_t)^t, 그 P로 YTM 계산", "why": {"A": "할인액을 단순히 2배로 계산.", "B": "spot rate 평균이자 쿠폰율일 뿐."}, "orig": "Mock 4 Session 1 Q5", "conf": true}, {"id": "mock4-Q6", "src": "정답", "module": "FI", "tag": "rolling down the yield curve", "vig": 1, "stem": "Given Yang's expectation for the yield curve in Country 1, the expected total return for Strategy A over her investment horizon is:", "opts": {"A": "less than that of Strategy B.", "B": "equal to that of Strategy B.", "C": "greater than that of Strategy B."}, "ans": "A", "en": "A. less than that of Strategy B. — Correct\nCorrect because the spot rate curve is upward sloping and expected to remain unchanged over Yang's two-year investment horizon. Under these circumstances, the total return of a strategy of 'rolling down the yield curve' (Strategy B) will exceed that of a buy-and-hold strategy (Strategy A).\nB. equal to that of Strategy B. — Incorrect\nIncorrect because the total return for a buy-and-hold strategy (Strategy A) will be less than that of 'rolling down the yield curve' (Strategy B) when the yield curve is upward sloping and expected to remain unchanged over the investment horizon.\nC. greater than that of Strategy B. — Incorrect\nIncorrect because the total return from 'rolling down the yield curve' (Strategy B) is higher than that of buy-and-hold (Strategy A).", "ko": "수익률 곡선이 우상향이고 그대로 유지된다고 예상하면, 3년물을 사서 2년 뒤(잔존 1년) 파는 전략 B는 만기가 짧아지며 수익률이 떨어져 가격 상승 이익을 얻는다. 그래서 만기 보유 전략 A의 총수익이 B보다 낮다.", "trap": "곡선이 변하지 않아도 우상향이면 roll-down 이익이 생긴다.", "f": "", "why": {"B": "우상향 곡선에서는 롤다운 전략이 더 높다.", "C": "반대."}, "orig": "Mock 4 Session 1 Q6", "conf": false}, {"id": "mock4-Q7", "src": "정답", "module": "FI", "tag": "bear steepener 대응", "vig": 1, "stem": "Given Yang expectations for Country 2's yield curve, the most appropriate bond portfolio composition would be:", "opts": {"A": "Portfolio 1.", "B": "Portfolio 2.", "C": "Portfolio 3."}, "ans": "A", "en": "A. Portfolio 1. — Correct\nCorrect because Yang expects that the yield rate curve will rise and become steeper. With higher yields, especially at the longer maturities, Yang will want to have the shortest portfolio duration. The yield curve movement described is a 'bear steepener'. With higher rates and a steeper curve, the investor will want to shift from long-term bonds into short-term bonds. Portfolio 1 is effectively a bullet portfolio focused on short-term bonds (80% of the portfolio).\nB. Portfolio 2. — Incorrect\nIncorrect because Portfolio 2, whose composition is evenly spread across a range of maturities, is a 'laddered portfolio', will have a higher portfolio duration than Portfolio 1. Given rising yields and a steeper yield curve, Yang will want to have a portfolio with the shortest duration possible.\nC. Portfolio 3. — Incorrect\nIncorrect because Portfolio 3 is a barbell portfolio with a greater weighting to long-term bonds than Portfolio 1 (45% compared with 10%). As a result, its portfolio duration will be longer than that of Portfolio 1. Given the expectation of a rising and steepening yield curve, Yang will want to have a portfolio with the shortest duration possible.", "ko": "금리가 오르고(bear) 곡선이 가팔라지면(steepener) 장기물 가격이 가장 많이 떨어진다. 롱온리 포트폴리오는 듀레이션을 가장 짧게 해야 하므로 단기채 80%인 Portfolio 1(단기 bullet)이 맞다.", "trap": "barbell(Portfolio 3)은 장기물 45%라 듀레이션이 길다.", "f": "", "why": {"B": "ladder라 듀레이션이 Portfolio 1보다 길다.", "C": "barbell, 장기물 비중이 커 듀레이션이 더 길다."}, "orig": "Mock 4 Session 1 Q7", "conf": true}, {"id": "mock4-Q8", "src": "오답", "module": "FI", "tag": "swap spread = on-the-run 국채", "vig": 1, "stem": "The 5-year swap spread in Country 3 is:", "opts": {"A": "15 bps.", "B": "20 bps.", "C": "25 bps."}, "ans": "B", "en": "A. 15 bps. — Incorrect\nIncorrect because this is the spread between the swap rate the interpolated YTMs of the bonds with the 4.5-year and 5.5-year remaining maturities, Bonds B and C.\n0.15% = 5.50% – (5.30% + 5.40%) / 2\nB. 20 bps. — Correct\nCorrect because the 5-year swap spread is defined as the difference between the fixed rate on the 5-year interest rate swap minus the YTM of the 'on-the-run' 5-year government bond, which is Bond B in this case. The 5-year swap spread is calculated as:\n0.20% = 5.50% – 5.30%\nThe relevant 'on-the-run' 5-year bond is Bond B because it is the most recently issued 5-year bond.\nC. 25 bps. — Incorrect\nIncorrect because this is calculated from the interpolated YTMs of the bonds with the 4.0-year and 4.5-year remaining maturities, but which were both originally issued as 5-year bonds, Bonds A and B:\n0.25% = 5.50% – (5.20% + 5.30%) / 2", "ko": "5년 swap spread = 5년 스왑금리 − on-the-run(가장 최근 발행된) 5년 국채 YTM. 원래 5년 만기로 발행된 채권 중 가장 최근 것은 잔존 4.5년인 Bond B(5.30%). 5.50% − 5.30% = 20bp.", "trap": "잔존만기로 보간하지 않는다. 기준은 '최근 발행된 5년물'이다.", "f": "Swap spread = 스왑금리 − 같은 만기 on-the-run 국채 YTM", "why": {"A": "Bond B·C를 보간(6년물 C는 5년물이 아님).", "C": "Bond A·B를 보간."}, "orig": "Mock 4 Session 1 Q8", "conf": true, "my": "A"}, {"id": "mock4-Q9", "src": "정답", "module": "EQ", "tag": "잔여이익 모형을 쓰는 이유", "vig": 2, "stem": "Which of the following best supports McAlister's choice of valuation models for Zedco?", "opts": {"A": "The properties of Zedco's ROE", "B": "The characteristics of Zedco's debt", "C": "The estimation of Zedco's terminal value"}, "ans": "C", "en": "A. The properties of Zedco's ROE — Incorrect\nIncorrect because Zedco has the highest average ROE in its industry, but it has been volatile, and McAlister is not highly confident in using past data to estimate future ROE. ROE is a critical input to the residual income model, so an uncertain estimate of ROE would not support the use of the residual income model. Residual income models are least appropriate when significant determinants of residual income, such as book value and ROE, are not predictable.\nB. The characteristics of Zedco's debt — Incorrect\nIncorrect because Zedco is expected to refinance most of its older debt within the year in response to lower interest rates. This implies that the interest cost on the most recent income statement does not accurately reflect the current cost of debt. One of the potential weaknesses of the residual income model is that: The residual income model’s use of accounting income assumes that the cost of debt capital is reflected appropriately by interest expense.\nC. The estimation of Zedco's terminal value — Correct\nCorrect because McAlister chooses the residual income model to value Zedco. She is uncertain about her estimate of Zedco's terminal value. Residual income places significantly less emphasis on a firm's terminal value relative to the dividend discount model or free cash flow models. So, an uncertain estimate of terminal value would support the use of the residual income model.\nThe strengths of residual income models include the following:\nTerminal values do not make up a large portion of the total present value, relative to other models.\nAdditionally, in residual income valuation, the current book value often captures a large portion of total value and the terminal value may not be a large component of total value because book value is larger than the periodic residual income and because ROE may fade over time toward the cost of equity. This contrasts with other multistage approaches (DDM and DCF), in which the present value of the terminal value is frequently a significant portion of total value.", "ko": "잔여이익(RI) 모형은 현재 장부가치가 가치의 큰 부분을 차지해서 터미널 가치의 비중이 DDM·FCF 모형보다 작다. McAlister가 터미널 가치 추정에 자신이 없으므로 이것이 RI 모형을 고른 근거다.", "trap": "ROE가 불안정하거나 이자비용이 실제 부채비용을 반영 못 하는 것은 오히려 RI 모형의 약점이다.", "f": "", "why": {"A": "ROE 예측이 어렵다면 RI 모형에 불리하다.", "B": "재융자로 이자비용이 현재 부채비용과 다르면 RI 모형의 약점."}, "orig": "Mock 4 Session 1 Q9", "conf": true}, {"id": "mock4-Q10", "src": "오답", "module": "EQ", "tag": "single-stage RI 내재 성장률", "vig": 2, "stem": "Using the single-stage residual income model, Zedco's implied growth rate in residual income is closest to:", "opts": {"A": "3.7%.", "B": "6.3%.", "C": "7.8%."}, "ans": "B", "en": "A. 3.7%. — Incorrect\nIncorrect because the WACC (10%) is used in place of the cost of equity capital:\n0.10 – [(0.29 – 0.10)/($80/$20 – 1)] = 0.03667 ≈ 3.7%.\nB. 6.3%. — Correct\nCorrect because the implied growth in residual income using the single-stage model is backed out of the valuation model: V0 = B0 + [(ROE – r)/(r – g)] × B0\nwhere:\nV0 = P0 = current price per share = $80\nB0 = book value per share = $20\nROE = 29%\nr = cost of equity capital = 12%\ng = implied growth rate in residual income\n$80 = $20 + [(0.29 – 0.12)/(0.12 – g)] × $20\ng = 0.06333 ≈ 6.3%.\nAlternately: g = r – [(ROE – r)/(V0/B0 – 1)] = 0.12 – [(0.29 – 0.12)/($80/$20 – 1)] = 6.3%.\nC. 7.8%. — Incorrect\nIncorrect because the \"–1\" is omitted from the denominator:\n0.12 – [(0.29 – 0.12)/($80/$20)] = 0.0775 ≈ 7.8%.", "ko": "V0 = B0 + (ROE − r)/(r − g) × B0. 80 = 20 + (0.29 − 0.12)/(0.12 − g) × 20 → 60/20 = 3 = 0.17/(0.12 − g) → 0.12 − g = 0.0567 → g = 6.3%. 할인율은 WACC가 아니라 자기자본비용 12%.", "trap": "분모의 '−1'을 빼먹으면 7.8%, WACC를 쓰면 3.7%.", "f": "g = r − (ROE − r)/(P0/B0 − 1)", "why": {"A": "자기자본비용 대신 WACC 10% 사용.", "C": "P/B에서 1을 빼지 않음."}, "orig": "Mock 4 Session 1 Q10", "conf": false, "my": "C"}, {"id": "mock4-Q11", "src": "정답", "module": "EQ", "tag": "two-stage DDM 터미널 가치 (P/E)", "vig": 2, "stem": "Using the two-stage DDM, the estimated terminal value per share for Midord is closest to:", "opts": {"A": "$16.", "B": "$45.", "C": "$68."}, "ans": "B", "en": "A. $16. — Incorrect\nIncorrect because the dividend payout ratio is multiplied instead of divided.\nTV = 20 × $0.55 × [(1.12)^8 × 0.60] = $16.34 ≈ $16.\nB. $45. — Correct\nCorrect because TV = P/E × [D0(1 + g)^t/(D/E)], where:\nTV = terminal value\nP/E = trailing P/E ratio = 20\nD0 = most recent dividend = $0.55\ng = growth rate of dividends years 1 – 8 = 12%\nt = 8 years\nD/E = dividend payout ratio = 60%\nTV = 20 × $0.55 × [(1.12)^8/0.60] = $45.39 ≈ $45.\nC. $68. — Incorrect\nIncorrect because (1 – D/E) or the retention ratio is used instead of the dividend payout ratio.\nTV = 20 × $0.55 × [(1.12)^8/(1 – 0.60)] = $68.09 ≈ $68.", "ko": "8년차 배당 D8 = 0.55 × 1.12^8 = 1.362. 배당성향 60%이므로 E8 = D8/0.60 = 2.27. 터미널 가치 = trailing P/E 20 × E8 = $45.4.", "trap": "배당성향은 곱하지 말고 나눠서 EPS를 구한다.", "f": "TV = P/E × D0(1+g)^n / payout ratio", "why": {"A": "배당성향으로 나누지 않고 곱함.", "C": "배당성향 대신 유보율(0.40)로 나눔."}, "orig": "Mock 4 Session 1 Q11", "conf": false}, {"id": "mock4-Q12", "src": "정답", "module": "EQ", "tag": "H-model", "vig": 2, "stem": "Using the H-model, the estimated value per share of Midord stock is closest to:", "opts": {"A": "$12.", "B": "$13.", "C": "$15."}, "ans": "C", "en": "A. $12. — Incorrect\nIncorrect because H is omitted.\nV0 = [$0.55(1.05) + $0.55(0.12 – 0.05)]/(0.10 – 0.05) = $12.32 ≈ $12.\nB. $13. — Incorrect\nIncorrect because 0.5H (= 2) is used instead of H (= 4).\nV0 = [$0.55(1.05) + $0.55(2)(0.12 – 0.05)]/(0.10 – 0.05) = $13.09 ≈ $13.\nC. $15. — Correct\nCorrect because by the H-model V0 = [D0(1 + gL) + D0H(gS − gL)]/(r – gL), where:\nV0 = estimated value\nD0 = most recent dividend = $0.55\ngL = long-term dividend growth rate = 5%\ngS = initial short-term dividend growth rate = 12%\nH = half-life of the high-growth period = 4\nr = cost of equity capital = 10%\nV0 = [$0.55(1.05) + $0.55(4)(0.12 – 0.05)]/(0.10 – 0.05) = $14.63 ≈ $15.", "ko": "V0 = [D0(1 + gL) + D0 × H × (gS − gL)]/(r − gL) = [0.55 × 1.05 + 0.55 × 4 × 0.07]/(0.10 − 0.05) = (0.5775 + 0.154)/0.05 = $14.63 ≈ $15. 문제에서 H는 이미 반감기(half-life)로 주어졌으므로 4를 그대로 쓴다.", "trap": "H는 고성장 기간의 절반. 이미 H = 4로 주어졌으니 다시 2로 나누지 않는다.", "f": "V0 = [D0(1+gL) + D0·H·(gS − gL)] / (r − gL)", "why": {"A": "H 항을 빼먹음.", "B": "H 대신 0.5H(=2)를 씀."}, "orig": "Mock 4 Session 1 Q12", "conf": false}, {"id": "mock4-Q13", "src": "정답", "module": "ETH", "tag": "III(D) 성과 표시 – 종료 계좌", "vig": 3, "stem": "Which of Park's criteria is not consistent with the Standard relating to performance presentation?", "opts": {"A": "Criterion 1", "B": "Criterion 2", "C": "Criterion 3"}, "ans": "B", "en": "A. Criterion 1 — Incorrect\nIncorrect because, when a firm does not claim compliance with GIPS, members and candidates can meet their obligations under Standard III(D) Performance Presentation by meeting certain criteria which include: presenting the performance of the weighted composite of similar portfolios rather than using a single representative account. Therefore, Criterion 1 is consistent with the Standard relating to performance presentation.\nB. Criterion 2 — Correct\nCorrect because, when a firm does not claim compliance with GIPS, members and candidates can meet their obligations under Standard III(D) Performance Presentation by meeting certain criteria which include: including terminated accounts as part of performance history with a clear indication of when the accounts were terminated. Therefore, by excluding terminated accounts, Criterion 2 is not consistent with the Standard relating to performance presentation.\nC. Criterion 3 — Incorrect\nIncorrect because, when a firm does not claim compliance with GIPS, members and candidates can meet their obligations under Standard III(D) Performance Presentation by meeting certain criteria which include: considering the knowledge and sophistication of the audience to whom a performance presentation is addressed. Therefore, Criterion 3 is consistent with the Standard relating to performance presentation.", "ko": "GIPS를 준수하지 않는 회사도 III(D)를 지키려면 비슷한 포트폴리오의 가중 composite를 쓰고, 종료된 계좌도 종료 시점을 밝혀 성과 기록에 포함해야 한다. Criterion 2는 종료 계좌를 빼므로 위반.", "trap": "고객 수준에 맞춘 성과 표시(Criterion 3)는 오히려 권장 사항.", "f": "", "why": {"A": "가중 composite 사용은 권장 방법.", "C": "청중의 지식 수준 고려는 권장 방법."}, "orig": "Mock 4 Session 1 Q13", "conf": false}, {"id": "mock4-Q14", "src": "오답", "module": "ETH", "tag": "III(B) IPO 배분 정책 공개", "vig": 3, "stem": "With regard to her actions associated with the IPO, did Park violate the Standard relating to fair dealing?", "opts": {"A": "No", "B": "Yes, because she allocated IPO shares to her family member", "C": "Yes, because she did not appropriately disclose the firm's IPO allocation policy"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Park violated Standard III(B) Fair Dealing by not disclosing the trade allocation policy to all clients—she did so to only those clients that participate in IPOs.\nB. Yes, because she allocated IPO shares to her family member — Incorrect\nIncorrect because Park's allocation of IPO shares to her family member did not violate Standard III(B) Fair Dealing. Because the family member's account is a regular fee-paying account and is managed similarly to other clients' accounts, it was appropriate to allocate IPO shares to the family member.\nIf the investment professional’s family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member accounts should not be excluded from buying such shares.\nC. Yes, because she did not appropriately disclose the firm's IPO allocation policy — Correct\nCorrect because Park violated Standard III(B) Fair Dealing by not disclosing the trade allocation policy to all clients—she did so to only those clients that participate in IPOs.\nMembers and candidates should disclose to clients and prospective clients the documented allocation procedures they or their firms have in place and how the procedures would affect the client or prospect. The disclosure should be clear and complete so that the client can make an informed investment decision. Members and candidates should disclose to clients and prospective clients how they select accounts to participate in an order and how they determine the amount of securities each account will buy or sell.", "ko": "Park은 IPO 주식을 주문 규모 비례로 배분했고, 가족 계좌도 일반 수수료 계좌로 다른 고객과 똑같이 운용되므로 배분해도 된다. 하지만 배분 정책을 IPO에 참여하는 고객에게만 알렸다. III(B)는 배분 절차를 모든 고객과 잠재 고객에게 공개하도록 요구하므로 위반.", "trap": "가족 계좌라도 수수료를 내고 다른 고객처럼 운용되면 배분에서 빼면 안 된다.", "f": "", "why": {"A": "배분 정책을 일부 고객에게만 공개한 것이 위반.", "B": "가족 계좌가 일반 고객 계좌와 같으면 배분해도 된다."}, "orig": "Mock 4 Session 1 Q14", "conf": true, "my": "A"}, {"id": "mock4-Q15", "src": "정답", "module": "ETH", "tag": "VII(B) CFA 명칭 사용", "vig": 3, "stem": "Which of Park's statements to the prospective client is a violation of the Standards?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "A. Statement 1 — Incorrect\nIncorrect because, according to Standard VII(B), if a candidate passes each level of the exam in consecutive years and wants to state that he or she did so, that is not a violation of Standard VII(B) because it is a statement of fact.\nB. Statement 2 — Incorrect\nIncorrect because Park's statement that completion of the CFA Program has enhanced her portfolio management skills is an example of a proper reference to the CFA designation and allowed under Standard VII(B).\nC. Statement 3 — Correct\nCorrect because, according to Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed. Park's statement that, as a CFA charterholder, she is most qualified to manage the client's investments implies superior ability and is therefore an improper reference to the CFA designation and a violation of Standard VII(B).", "ko": "Statement 3 '나는 CFA 차터홀더라서 당신의 자산을 운용할 가장 적임자다'는 CFA 자격으로 능력이 뛰어남을 암시하므로 VII(B) 위반. 세 레벨을 한 번에 합격했다는 것(사실)과 CFA 프로그램이 실력을 높였다는 것은 허용된다.", "trap": "연속·첫 시도 합격 사실을 말하는 것은 사실 진술이라 괜찮다.", "f": "", "why": {"A": "합격 사실 진술은 허용.", "B": "CFA 프로그램이 실력을 높였다는 말은 허용."}, "orig": "Mock 4 Session 1 Q15", "conf": false}, {"id": "mock4-Q16", "src": "정답", "module": "ETH", "tag": "IV(B) 추가 보상 서면 동의", "vig": 3, "stem": "After their initial meeting, are Park's actions with regard to the prospective client a violation of the Standards?", "opts": {"A": "No", "B": "Yes, because she did not pay the cafe bill", "C": "Yes, because she used the client's vacation home"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Park did not receive appropriate approval for the vacation home arrangement, so she should not have accepted the offer to use the home. She should have gotten written approval from all parties involved, not just verbal approval.\nB. Yes, because she did not pay the cafe bill — Incorrect\nIncorrect because, according to Standard IV(B), modest gifts and entertainment are acceptable. A meal at an inexpensive cafe most likely falls within this category.\nC. Yes, because she used the client's vacation home — Correct\nCorrect because Park did not receive appropriate consent for the vacation home arrangement, so she should not have accepted the offer to use the home. She should have gotten written consent from all parties involved, not just verbal consent. Standard IV(B) Additional Compensation Arrangements requires that Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved.", "ko": "고객이 '분기 성과가 벤치마크를 넘으면 별장을 1주 쓰게 해 주겠다'고 한 것은 성과에 따른 추가 보상이다. IV(B)는 모든 당사자의 서면 동의가 필요한데 Park은 준법감시인의 구두 동의만 받고 별장을 썼으므로 위반. 저렴한 카페 식사는 소소한 접대라 괜찮다.", "trap": "준법감시인의 '구두' 승인은 충분하지 않다. 서면 동의가 필요하다.", "f": "", "why": {"A": "서면 동의 없이 별장을 썼다.", "B": "싼 카페 식사는 허용되는 소소한 접대."}, "orig": "Mock 4 Session 1 Q16", "conf": true}, {"id": "mock4-Q17", "src": "정답", "module": "EQ", "tag": "average ROE로 정상화 EPS", "vig": 4, "stem": "Using the method of average ROE for earnings normalization, Rummidge's P/E ratio based on normalized EPS is closest to:", "opts": {"A": "9.6.", "B": "12.6.", "C": "13.3."}, "ans": "B", "en": "A. 9.6. — Incorrect\nIncorrect because this is the P/E when EPS is normalized by the method of historical average EPS and not the method of average ROE used by Georgiou.\nThe historical average EPS over the past 7 years is $2.45, which is deemed in this case to reflect average profitability over the business cycle.\nThe current share price is $23.40, so P/E = $23.40/$2.45 = 9.55 ≈ 9.6.\nB. 12.6. — Correct\nCorrect because this is the P/E when EPS is normalized by the method of average ROE used by Georgiou.\nUnder this method, normalized EPS is calculated as the average ROE over the most recent business cycle multiplied by the current book value per share.\nThe historical average ROE over the past 7 years is 9.5%, which is deemed in this case to reflect average profitability over the business cycle. This is multiplied by the current book value per share of $19.50 to give normalized EPS: 0.095 × $19.50 = $1.8525.\nThe current share price is $23.40, so P/E = $23.40/$1.8525 = 12.63 ≈ 12.6.\nC. 13.3. — Incorrect\nIncorrect because this is the P/E when EPS is calculated by multiplying the book value per share by the required rate of return on equity and not the historical average ROE, which is the method used by Georgiou.\nThe required rate of return on equity is 9.0% and the book value per share is $19.50, so EPS is 0.09 × $19.50 = $1.755.\nP/E is then $23.40/$1.755 = 13.33 ≈ 13.3.", "ko": "average ROE 방식: 정상화 EPS = 평균 ROE × 현재 BVPS = 0.095 × 19.50 = 1.8525. P/E = 23.40 / 1.8525 = 12.6.", "trap": "평균 EPS(2.45)를 쓰는 것은 historical average EPS 방식(9.6).", "f": "Normalized EPS = 평균 ROE × 현재 BVPS", "why": {"A": "평균 EPS 방식.", "C": "평균 ROE 대신 요구수익률 9%를 곱함."}, "orig": "Mock 4 Session 1 Q17", "conf": true}, {"id": "mock4-Q18", "src": "정답", "module": "EQ", "tag": "justified P/B", "vig": 4, "stem": "Based on Georgiou's forecasts, Rummidge's justified P/B ratio is closest to:", "opts": {"A": "0.93.", "B": "1.08.", "C": "1.27."}, "ans": "B", "en": "A. 0.93. — Incorrect\nIncorrect because this would be the justified P/B ratio if the numerator and denominator in the formula were switched.\nJustified P/B = (r – g)/(ROE – g)\nJustified P/B = (0.09 – 0.02375)/(0.095 – 0.02375) = 0.9298 ≈ 0.93\nB. 1.08. — Correct\nCorrect because this is the justified P/B ratio based on Georgiou's forecasts.\nThe average ROE for the past seven years is used as the forecast of long-term future ROE and the forecast long-term dividend payout ratio is given.\nThe formula for justified P/B is as follows:\nJustified P/B = (ROE – g)/(r – g)\nThis formula assumes the Gordon growth model and uses the following expression for the sustainable growth rate: g = b × ROE, where:\nROE = forecast long-term ROE = 9.5%\nr = required rate of return on equity = 9.0%\nb = earnings retention rate and therefore (1 – b) = dividend payout ratio\nThe dividend payout ratio is 75%, so the earnings retention rate is b = (1 – 75%) = 25%. Therefore, g = 25% × 9.5% = 2.375%.\nJustified P/B = (0.095 – 0.02375)/(0.09 – 0.02375) = 1.0755 ≈ 1.08\nC. 1.27. — Incorrect\nIncorrect because this would be the justified P/B ratio if the dividend payout ratio of 75% was used in the formula instead of the earnings retention rate of 25% as follows:\ng = 75% × 9.5% = 7.125%.\nJustified P/B = (0.095 – 0.07125)/(0.09 – 0.07125) = 1.2667 ≈ 1.27", "ko": "g = 유보율 × ROE = 0.25 × 9.5% = 2.375%. Justified P/B = (ROE − g)/(r − g) = (0.095 − 0.02375)/(0.09 − 0.02375) = 1.08.", "trap": "g는 배당성향(75%)이 아니라 유보율(25%)로 구한다.", "f": "P/B = (ROE − g)/(r − g), g = b × ROE", "why": {"A": "분자·분모를 뒤바꿈.", "C": "배당성향 75%로 g를 계산."}, "orig": "Mock 4 Session 1 Q18", "conf": false}, {"id": "mock4-Q19", "src": "오답", "module": "EQ", "tag": "비상장사 EBITDA 정상화", "vig": 4, "stem": "To facilitate comparison with publicly listed peers, Georgiou should adjust Gimmerton's EBITDA:", "opts": {"A": "down by $0.6 million.", "B": "up by $0.6 million.", "C": "up by $1.1 million."}, "ans": "B", "en": "A. down by $0.6 million. — Incorrect\nIncorrect because this is the result if the correct adjustments are identified but incorrectly applied when adjusting reported EBITDA as follows:\nIncorrectly adding $0.6 million (with respect to the CEO's salary in excess of the market rate) and subtracting $1.2 million (with respect to the yacht's operating expenses, which are not related to core operations) results in an adjustment of:\n$0.6 million – $1.2 million = –$0.6 million.\nB. up by $0.6 million. — Correct\nCorrect because this is the EBITDA adjustment taking into account the following:\nFirst, the CEO is paid $0.4 million annually, whereas the market rate is $1.0 million. So this salary is $0.6 million less than the market rate. In order to make a comparison with a publicly owned company, it is necessary to add $0.6 million to salary expenses.\nThis will result in a reduction in EBITDA by $0.6 million.\nSecondly, the yacht is not required for Gimmerton's core operations. Therefore, it is necessary to adjust costs by deducting the $1.2 million operating costs, which will increase EBITDA by the same amount. An adjustment to take account of the depreciation associated with the yacht is not required as this does not impact EBITDA.\nTherefore, the adjustment is:\n–$0.6 million + $1.2 million = $0.6 million.\nC. up by $1.1 million. — Incorrect\nIncorrect because this is the EBITDA adjustment if an adjustment for depreciation of the luxury yacht is also taken into account in addition to the other adjustments.\nSubtracting $0.6 million (with respect to the CEO's salary in excess of the market rate) and adding $1.2 million (with respect to the yacht's operating expenses, which are not related to core activities) and also adding $0.5 million (with respect to depreciation) results in an adjustment of:\n–$0.6 million + $1.2 million + $0.5 million = $1.1 million.", "ko": "CEO 급여는 시장 수준보다 0.6m 적으므로 비용을 0.6m 늘려야 하고 EBITDA는 0.6m 감소. 영업과 무관한 요트 운영비 1.2m는 빼야 하므로 EBITDA는 1.2m 증가. 요트 감가상각 0.5m는 EBITDA 아래 항목이라 조정하지 않는다. 합계 −0.6 + 1.2 = +0.6m.", "trap": "감가상각은 EBITDA에 영향이 없다(포함하면 +1.1m).", "f": "", "why": {"A": "조정 방향을 반대로 적용.", "C": "요트 감가상각 0.5m까지 더함."}, "orig": "Mock 4 Session 1 Q19", "conf": false, "my": "C"}, {"id": "mock4-Q20", "src": "정답", "module": "EQ", "tag": "DLOC·DLOM 합산", "vig": 4, "stem": "The total discount that Georgiou should apply when valuing the minority stake in Gimmerton is:", "opts": {"A": "28.0%.", "B": "30.0%.", "C": "32.5%."}, "ans": "A", "en": "A. 28.0%. — Correct\nCorrect because this is the total discount for Gimmerton based on the following:\nThe discount for lack of control (DLOC) is calculated from the control premium as follows:\nDLOC = 1 – [1/(1 + Control premium)]\nWith a control premium of 25%, DLOC = 1 – [1/(1.25)] = 0.20 or 20%.\nThe discount for lack of marketability (DLOM) is 0.10 or 10%.\nTotal discount = 1 – [(1 – DLOC) × (1 – DLOM)] = 1 – [(1 – 0.20) × (1 – 0.10)] = 0.28 or 28%\nB. 30.0%. — Incorrect\nIncorrect because the discounts for lack of control and lack of marketability are simply added as follows:\nWith a control premium of 25%, DLOC = 1 – [1/(1.25)] = 0.20 or 20%.\nTotal discount = DLOC + DLOM = 20% + 10% = 30%\nC. 32.5%. — Incorrect\nIncorrect because the control premium is used instead of the discount for lack of control as follows:\nTotal discount = 1 – [(1 – Control premium) × (1 – DLOM)] = 1 – [(1 – 0.25) × (1 – 0.10)]\n= 0.325 or 32.5%", "ko": "DLOC = 1 − 1/(1 + 지배 프리미엄) = 1 − 1/1.25 = 20%. 전체 할인 = 1 − (1 − 0.20)(1 − 0.10) = 1 − 0.72 = 28%.", "trap": "할인은 더하지 않고 곱해서 합친다. 지배 프리미엄 25%를 그대로 할인율로 쓰지 않는다.", "f": "DLOC = 1 − 1/(1 + CP), 총할인 = 1 − (1 − DLOC)(1 − DLOM)", "why": {"B": "두 할인을 단순히 더함.", "C": "지배 프리미엄 25%를 DLOC 대신 씀."}, "orig": "Mock 4 Session 1 Q20", "conf": false}, {"id": "mock4-Q21", "src": "정답", "module": "PM", "tag": "Carhart 4요인 스타일 해석", "vig": 5, "stem": "Over the previous quarter, Polari’s investment style has exhibited which of the following?", "opts": {"A": "Value bias", "B": "Large-cap bias", "C": "Momentum bias"}, "ans": "A", "en": "A. Value bias — Correct\nCorrect because, over the previous quarter, Polari had positive sensitivity to HML (0.4), which indicates a value bias.\nHML (high minus low) is one of the factors used in Carhart's (1997) four-factor model and is calculated as the average return on two high book-to-market portfolios minus the average return on two low book-to-market portfolios. A positive HML indicates that portfolio returns are driven more by the return on value (i.e., high book-to-market) stocks than by that on growth (i.e., low book-to-market) stocks.\nB. Large-cap bias — Incorrect\nIncorrect because, over the previous quarter, Polari had positive sensitivity to SMB (0.3), which indicates a small-cap, not a large-cap, bias.\nSMB (small minus big) is one of the factors used in Carhart's (1997) four-factor model and is calculated as the average return on three small-cap portfolios minus the average return on three large-cap portfolios. A positive SMB indicates that portfolio returns are driven more by the return on small-cap stocks than by the return on large-cap stocks.\nC. Momentum bias — Incorrect\nIncorrect because, over the previous quarter, Polari had a negative sensitivity to WML (–0.1), which indicates a contrarian, not a momentum, bias.\nWML (winners minus losers) is one of the factors used in Carhart's (1997) four-factor model and is calculated as the return on a portfolio of the past year’s winners minus the return on a portfolio of the past year’s losers. A negative WML indicates that portfolio returns are driven more by the return of the past year's losers (contrarian bias) than the past year's winners (momentum bias).", "ko": "Polari의 HML 민감도가 +0.4로 양수 → 가치주(value) 성향. SMB +0.3은 소형주 성향, WML −0.1은 모멘텀이 아니라 역발상(contrarian) 성향.", "trap": "SMB 양수는 대형주가 아니라 소형주 성향.", "f": "", "why": {"B": "SMB가 양수라 소형주 성향.", "C": "WML이 음수라 역발상 성향."}, "orig": "Mock 4 Session 1 Q21", "conf": true}, {"id": "mock4-Q22", "src": "정답", "module": "PM", "tag": "요인 tilt vs 종목 선택 수익", "vig": 5, "stem": "Over the previous quarter, the active return from security selection for Polari was closest to:", "opts": {"A": "–3.1%.", "B": "0.6%.", "C": "1.9%."}, "ans": "C", "en": "A. –3.1%. — Incorrect\nIncorrect because the return from security selection is calculated as active return minus return from factor sensitivities, instead of factor tilts (i.e., ignoring the return from factor sensitivities of the benchmark).\nThe return from factor sensitivities is calculated as follows:\nRMRF: 1.1 × 5.0% = 5.50%\nSMB: 0.3 × (–2.0%) = –0.60%\nHML: 0.4 × 1.0% = 0.40%\nWML: –0.1 × (–2.5%) = 0.25%\nTotal return from factor sensitivities = 5.50% – 0.60% + 0.40% + 0.25% = 5.55%\nActive return – Return from factor sensitivities = 2.50% – 5.55% = –3.05% ≈ –3.1%\nB. 0.6%. — Incorrect\nIncorrect because this is the total return from factor tilts, not security selection.\nThe factor tilt return for each of the four factors of the Carhart model is calculated as follows:\nRMRF: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (1.1 – 1.0) × (5.0%) = 0.5%\nSMB: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (0.3 – 0.0) × (–2.0%) = –0.6%\nHML: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (0.4 – 0.2) × (1.0%) = 0.2%\nWML: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (–0.1 – 0.1) × (–2.5%) = 0.5%\nTotal return from factor tilts = 0.5% – 0.6% + 0.2% + 0.5% = 0.6%\nC. 1.9%. — Correct\nCorrect because active return from security selection can be calculated as active return (2.5%) minus return from factor tilts (0.6%, calculated below), which gives: 2.5% – 0.6% = 1.9%.\nThe tilt return for each of the four factors of the Carhart model is calculated as follows:\nRMRF: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (1.1 – 1.0) × (5.0%) = 0.5%\nSMB: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (0.3 – 0.0) × (–2.0%) = –0.6%\nHML: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (0.4 – 0.2) × (1.0%) = 0.2%\nWML: [(Portfolio sensitivity) − (Benchmark sensitivity)] × (Factor return) = (–0.1 – 0.1) × (–2.5%) = 0.5%\nTotal return from factor tilts = 0.5% – 0.6% + 0.2% + 0.5% = 0.6%", "ko": "요인 tilt 수익 = (포트 민감도 − 벤치마크 민감도) × 요인 수익. RMRF 0.1×5% = 0.5%, SMB 0.3×(−2%) = −0.6%, HML 0.2×1% = 0.2%, WML (−0.2)×(−2.5%) = 0.5% → 합 0.6%. 종목 선택 = 액티브 수익 2.5% − 0.6% = 1.9%.", "trap": "벤치마크 민감도를 빼지 않으면 −3.1%. 0.6%는 tilt 수익 자체.", "f": "Selection = Active return − Σ(β_p − β_b)·factor return", "why": {"A": "포트폴리오 민감도 전체로 계산(벤치마크 미차감).", "B": "요인 tilt 수익이지 종목 선택 수익이 아님."}, "orig": "Mock 4 Session 1 Q22", "conf": false}, {"id": "mock4-Q23", "src": "정답", "module": "PM", "tag": "ETF 보유기간 비용", "vig": 5, "stem": "The 3-month holding period cost of investing in the zTrak ETF is:", "opts": {"A": "lower than that of the xShares ETF.", "B": "the same as that of the xShares ETF.", "C": "higher than that of the xShares ETF."}, "ans": "A", "en": "A. lower than that of the xShares ETF. — Correct\nCorrect because the 3-month holding period cost is 30 bps for zTrak and 33.75 bps for xShares. The holding period cost is calculated as: (2 × one-way commission) + bid–ask spread on purchase and sale + (3/12 × annual management fee).\nzTrak: (2 × 5 bps) + 15 bps + (3/12 × 20 bps) = 30 bps\nxShares: (2 × 10 bps) + 10 bps + (3/12 × 15 bps) = 33.75 bps\nB. the same as that of the xShares ETF. — Incorrect\nIncorrect because zTrak has a lower 3-month holding period cost, however, both ETFs would have the same 12-month holding period cost, calculated as follows:\nzTrak: (2 × 5 bps) + 15 bps + 20 bps = 45 bps\nxShares: (2 × 10 bps) + 10 bps + 15 bps = 45 bps\nC. higher than that of the xShares ETF. — Incorrect\nIncorrect because zTrak has a lower 3-month holding period cost than xShares. If the one-way commission was incorrectly not multiplied by two, this would result in xShares having a lower 3-month holding period cost, calculated as follows:\nzTrak: (1 × 5 bps) + 15 bps + (3/12 × 20 bps) = 25 bps\nxShares: (1 × 10 bps) + 10 bps + (3/12 × 15 bps) = 23.75 bps", "ko": "보유기간 비용 = 왕복 수수료(2 × 편도) + 매수·매도 스프레드 + 관리보수 × 보유기간. zTrak = 2×5 + 15 + 20×3/12 = 30bp, xShares = 2×10 + 10 + 15×3/12 = 33.75bp. zTrak이 더 싸다.", "trap": "12개월이면 둘 다 45bp로 같다. 수수료를 한 번만 넣으면 xShares가 더 싸 보인다.", "f": "비용 = 2 × 편도 수수료 + 스프레드 + 연 보수 × (보유월/12)", "why": {"B": "12개월 기준일 때만 같다.", "C": "편도 수수료를 2배하지 않은 경우."}, "orig": "Mock 4 Session 1 Q23", "conf": false}, {"id": "mock4-Q24", "src": "오답", "module": "PM", "tag": "ETN 거래상대방 위험", "vig": 5, "stem": "Which of the following statements is correct with regard to yPath?", "opts": {"A": "Similarly to zTrak and xShares, it holds underlying securities", "B": "It has greater potential counterparty risk than zTrak and xShares", "C": "Unlike zTrak and xShares, it does not have a creation/redemption mechanism"}, "ans": "B", "en": "A. Similarly to zTrak and xShares, it holds underlying securities — Incorrect\nIncorrect because yPath is an ETN and exchange-traded notes (ETNs) are not truly funds because they do not hold underlying securities. ETNs are unsecured debt obligations of the institution that issues them and are structured as a promise to pay a pattern of returns based on the return of the stated index minus fund expenses. The issuer of the note takes responsibility for setting up the counterbalancing hedges it believes necessary to meet the obligations.\nB. It has greater potential counterparty risk than zTrak and xShares — Correct\nCorrect because yPath is an ETN whereas zTrak and xShares are ETFs. ETNs have the largest potential counterparty risk of all exchange-traded products because they are unsecured, unsubordinated debt notes and, therefore, are subject to default by the ETN issuer.\nC. Unlike zTrak and xShares, it does not have a creation/redemption mechanism — Incorrect\nIncorrect because both ETFs (like zTrak and xShares) and ETNs (like yPath) have creation/redemption mechanisms. ETFs are intrinsically linked to the creation/redemption process, which allows them to operate at lower cost and with greater tax efficiency than mutual funds and generally keeps ETF prices in line with their NAVs. ETNs also \"trade on exchanges and have a creation/redemption mechanism.", "ko": "yPath는 ETN으로, 기초자산을 보유하지 않는 발행사의 무담보 채무다. 그래서 ETF보다 거래상대방(발행사 부도) 위험이 크다. ETN도 거래소에서 거래되고 설정·환매 구조가 있다.", "trap": "ETN에도 creation/redemption 메커니즘이 있다.", "f": "", "why": {"A": "ETN은 기초 증권을 보유하지 않는다.", "C": "ETN도 설정·환매 구조가 있다."}, "orig": "Mock 4 Session 1 Q24", "conf": true, "my": "C"}, {"id": "mock4-Q25", "src": "정답", "module": "ETH", "tag": "VI(C) 소개 수수료 공개", "vig": 6, "stem": "To comply with the Standards, which of the characteristics of the referral fee arrangement must Habba disclose to existing and prospective clients?", "opts": {"A": "Characteristic 1 only", "B": "Characteristic 2 only", "C": "Both Characteristic 1 and Characteristic 2"}, "ans": "C", "en": "A. Characteristic 1 only — Incorrect\nIncorrect because by only disclosing Characteristic 1, Habba would not be disclosing Characteristic 2, which is a required disclosure under the Standards. The disclosure of the referral fee arrangement must include the nature of the consideration or benefit -for example, flat fee or percentage basis, one-time or continuing benefit.\nB. Characteristic 2 only — Incorrect\nIncorrect because by only disclosing Characteristic 2, Habba would not be disclosing Characteristic 1, which is a required disclosure under the Standards:\nMembers and candidates must disclose to clients and prospective clients any benefit received for the recommendation of products or services.\nIn particular, the disclosure must include the nature of the consideration or benefit together with the estimated dollar value.\nC. Both Characteristic 1 and Characteristic 2 — Correct\nCorrect because the disclosure must include both the estimated dollar value and the nature of the consideration or benefit, such as whether it's a one-time or continuing benefit: The member or candidate must disclose the nature of the consideration or benefit—for example, flat fee or percentage basis, one-time or continuing benefit, based on performance, benefit in the form of provision of research or other noncash benefit—together with the estimated dollar value.", "ko": "VI(C) Referral Fees: 추천 대가로 받는 혜택은 그 성격(정액/비율, 일회성/지속적, 리서치 같은 비현금 혜택 등)과 추정 금액을 함께 공개해야 한다. 연 $100,000(금액)과 계속 제공됨(성격) 둘 다 공개.", "trap": "금액만 또는 성격만 공개하면 부족하다.", "f": "", "why": {"A": "지속적 혜택이라는 성격도 공개해야 한다.", "B": "추정 금액도 공개해야 한다."}, "orig": "Mock 4 Session 1 Q25", "conf": false}, {"id": "mock4-Q26", "src": "정답", "module": "ETH", "tag": "V(B) 위험 공개·사실과 의견", "vig": 6, "stem": "In her email regarding the structured note, Habba violates the Standards with:", "opts": {"A": "Statement 1 only.", "B": "Statement 2 only.", "C": "both Statement 1 and Statement 2."}, "ans": "B", "en": "A. Statement 1 only. — Incorrect\nIncorrect because Statement 1 states that Habba is basing her recommendation on her view of the market trend, thereby stating that this is her opinion. Standard V(B)–Communication with Clients and Prospective Clients indicates that the content of any investment recommendation should include the distinction between facts and opinions.\nB. Statement 2 only. — Correct\nCorrect because Standard V(B)–Communication with Clients and Prospective Clients indicates that the content of any investment recommendation should include the identification of risks and limitations: members and candidates must adequately disclose the general market-related risks and the risks associated with the use of complex financial instruments that are deemed significant. Because the 15% drawdown offers limited downside protection, and is a significant element of risk in the complex financial instrument (the structured note), it should have been communicated clearly to clients and prospective clients. Furthermore, stating that there is 'no downside risk' can be comparable to stating an opinion as a fact, which would also be a violation of the standards.\nC. both Statement 1 and Statement 2. — Incorrect\nIncorrect because Statement 1 is not a violation as Habba is, in that statement, stating that the market trend is her opinion and not a fact. Standard V(B)–Communication with Clients and Prospective Clients indicates that the content of any investment recommendation should include the distinction between facts and opinions.", "ko": "Statement 1은 '내 생각에(in my view)' 시장이 오를 것이라고 의견임을 밝혔으므로 괜찮다. Statement 2는 최대 15% 손실이 있는 노트를 '하방 위험 없음'이라고 해서 중요한 위험을 공개하지 않았고 의견을 사실처럼 말했다 → V(B) 위반.", "trap": "의견임을 분명히 밝힌 전망은 위반이 아니다.", "f": "", "why": {"A": "Statement 1은 의견임을 밝혀 위반 아님.", "C": "Statement 1은 위반이 아니다."}, "orig": "Mock 4 Session 1 Q26", "conf": true}, {"id": "mock4-Q27", "src": "정답", "module": "ETH", "tag": "III(C) 고객의 비적합 주문", "vig": 6, "stem": "Does Habba violate the Standards when executing Laurent's trade order?", "opts": {"A": "No", "B": "Yes, because the trade is not suitable for Laurent", "C": "Yes, because she should update the IPS before executing the trade"}, "ans": "A", "en": "A. No — Correct\nCorrect because this is the best course of action to ensure that Habba meets the Standards, in particular, Standard III(C): Duties to Clients – Suitability states that:\nAn unsolicited request may be expected to have only a minimum impact on the entire portfolio because the size of the requested trade is small. In discussing the trade, the member or candidate should focus on educating the investor on how the request deviates from the current policy statement. Following the discussion, the member or candidate may follow his or her firm’s policies regarding the necessary client approval for executing unsuitable trades. At a minimum, the client should acknowledge the discussion and accept the conditions that make the recommendation unsuitable.\nB. Yes, because the trade is not suitable for Laurent — Incorrect\nIncorrect because, even if the trade is not suitable, Habba should discuss with Laurent that the trade is not suitable for him, with the goal of educating the investor on how the request deviates from the current policy statement, instead of declining the trade outright. Habba does not violate the standards in this respect as she explains to Laurent that the trade is not suitable for him, which he acknowledges.\nC. Yes, because she should update the IPS before executing the trade — Incorrect\nIncorrect, because not updating the IPS is not a violation, given that the trade only accounts for a small amount in relation to Laurent's total wealth: should the unsolicited request be expected to have a material impact on the portfolio, the member or candidate should use this opportunity to update the investment policy statement. Doing so would allow the client to fully understand the potential effect of the requested trade on his or her current goals or risk levels.", "ko": "Laurent가 먼저 요청한(unsolicited) 주문이고 전체 자산 대비 규모가 작다. Habba는 IPS와 맞지 않는다고 설명했고 고객이 이를 인정했으므로 주문을 실행해도 위반이 아니다. 영향이 클 때만 IPS를 먼저 업데이트한다.", "trap": "비적합하다고 무조건 거절할 필요는 없다. 설명하고 고객의 인정을 받으면 된다.", "f": "", "why": {"B": "적합하지 않다는 점을 설명·인정받았으므로 실행 가능.", "C": "규모가 작아 IPS 업데이트가 필수 아님."}, "orig": "Mock 4 Session 1 Q27", "conf": true}, {"id": "mock4-Q28", "src": "정답", "module": "ETH", "tag": "I(A) 더 엄격한 법 적용", "vig": 6, "stem": "In marketing the funds in Country B, Habba must follow:", "opts": {"A": "the Standards.", "B": "the laws of Country A.", "C": "the laws of Country B."}, "ans": "A", "en": "A. the Standards. — Correct\nCorrect because Country A states that the laws of the location where business is conducted should govern and local laws are less strict than the Code and Standards. Therefore, members must adhere to the Code and Standards. According to Standard I(A): Professionalism - Knowledge of the Law: members and candidates must follow the more strict of the applicable law or the Code and Standards. Applicable law is the law that governs the member’s or candidate’s conduct. The more strict law or regulation is the law or regulation that imposes greater restrictions on the action of the member or candidate or calls for the member or candidate to exert a greater degree of action that protects the interests of investors.\nB. the laws of Country A. — Incorrect\nIncorrect because, although the case states that Country A's laws are more restrictive in this area than the Standards, Country A's laws state that the laws of the location where business is conducted should govern. In this case, the local laws are laws of Country B which are less strict than the Standards.\nC. the laws of Country B. — Incorrect\nIncorrect because, even if the funds are sold in Country B, the Standards are more restrictive than the laws of Country B, and therefore the Standards should govern instead.", "ko": "Country A 법은 사업하는 현지 법을 따르라고 하므로 적용법은 Country B 법이다. Country B 법은 Standards보다 느슨하므로 더 엄격한 Standards를 따른다.", "trap": "Country A 법이 더 엄격해도, 그 법이 현지 법을 따르라고 하면 A 법은 적용되지 않는다.", "f": "", "why": {"B": "A 법은 현지(B) 법을 따르라고 해서 적용법이 아니다.", "C": "B 법이 Standards보다 느슨하다."}, "orig": "Mock 4 Session 1 Q28", "conf": true}, {"id": "mock4-Q29", "src": "정답", "module": "QM", "tag": "AR(1) 평균 회귀 수준", "vig": 7, "stem": "The mean-reverting level of the AR(1) model is closest to:", "opts": {"A": "0.002.", "B": "0.059.", "C": "0.946."}, "ans": "B", "en": "A. 0.002. — Incorrect\nIncorrect because the mean-reverting level is mistakenly calculated as b0 / (1 + b1) = 0.003 / (1 + 0.949) = 0.00154 ≈ 0.002.\nB. 0.059. — Correct\nCorrect because the mean-reverting level is calculated as b0 / (1 – b1) = 0.003 / (1 – 0.949) = 0.05882 ≈ 0.059.\nC. 0.946. — Incorrect\nIncorrect because the mean-reverting level is mistakenly calculated as b1 / (1 + b0) = 0.949 / (1 + 0.003) = 0.94616 ≈ 0.946.\nThis is also closest to swapping the coefficients in the correct calculation: 0.949 / (1 – 0.003) = 0.952.", "ko": "평균 회귀 수준 = b0/(1 − b1) = 0.003/(1 − 0.949) = 0.003/0.051 = 0.059.", "trap": "분모는 (1 + b1)이 아니라 (1 − b1).", "f": "Mean-reverting level = b0 / (1 − b1)", "why": {"A": "(1 + b1)로 나눔.", "C": "b1/(1 + b0)로 잘못 계산."}, "orig": "Mock 4 Session 1 Q29", "conf": false}, {"id": "mock4-Q30", "src": "오답", "module": "QM", "tag": "AR(2) 2기 앞 예측 (chain rule)", "vig": 7, "stem": "Using the AR(2) model, the 2-week-ahead forecast for NTPC is closest to:", "opts": {"A": "0.066.", "B": "0.068.", "C": "0.091."}, "ans": "B", "en": "A. 0.066. — Incorrect\nIncorrect because this is the 1-week-ahead forecast of NTPC rather than the 2-week-ahead forecast, calculated as:\nxt+1 = b0 + b1xt + b2xt–1 = 0.003 + 1.096 × 0.061 – 0.116 × 0.034 = 0.003 + 0.06686 – 0.00394 = 0.065912 ≈ 0.066.\nB. 0.068. — Correct\nCorrect because the 2-week-ahead forecast of NTPC is calculated using the chain rule of forecasting.\nFirst, the 1-week-ahead forecast is calculated as xt+1 = b0 + b1xt + b2xt–1 = 0.003 + 1.096 × 0.061 – 0.116 × 0.034 = 0.003 + 0.06686 – 0.00394 = 0.065912,\nwhere xt is the value of NTPC for this week or the current week (0.061) and xt–1 is the value of NTPC for the prior week (0.034).\nThis is then used to forecast xt+2 = b0 + b1xt+1 + b2xt = 0.003 + 1.096 × 0.065912 – 0.116 × 0.061 = 0.003 + 0.07224 – 0.00708 = 0.06816 ≈ 0.068.\nC. 0.091. — Incorrect\nIncorrect because the 2-week-ahead forecast of NTPC is calculated using the chain rule of forecasting but the minus sign for the second lag is mistakenly ignored.\nThe 1-week-ahead forecast is calculated as xt+1 = b0 + b1xt + b2xt–1 = 0.003 + 1.096 × 0.061 + 0.116 × 0.034 = 0.003 + 0.06686 + 0.00394 = 0.0738\nThis is then used to forecast xt+2 = b0 + b1xt+1 + b2xt = 0.003 + 1.096 × 0.0738 + 0.116 × 0.061 = 0.003 + 0.08089 + 0.00708 = 0.09096 ≈ 0.091.", "ko": "1주 뒤: 0.003 + 1.096×0.061 − 0.116×0.034 = 0.0659. 2주 뒤: 0.003 + 1.096×0.0659 − 0.116×0.061 = 0.003 + 0.0722 − 0.0071 = 0.068. 1기 예측값을 다음 식에 넣는 연쇄 법칙.", "trap": "0.066은 1주 뒤 예측. 2주 뒤에는 1주 뒤 예측값과 이번 주 값을 쓴다.", "f": "x̂_{t+2} = b0 + b1·x̂_{t+1} + b2·x_t", "why": {"A": "1주 뒤 예측값.", "C": "두 번째 시차 계수의 마이너스 부호를 무시."}, "orig": "Mock 4 Session 1 Q30", "conf": false, "my": "A"}, {"id": "mock4-Q31", "src": "오답", "module": "QM", "tag": "표본 외 예측력 = RMSE", "vig": 7, "stem": "Compared to the AR(1) model, the out-of-sample forecasting performance of the AR(2) model is:", "opts": {"A": "worse.", "B": "equal.", "C": "better."}, "ans": "C", "en": "A. worse. — Incorrect\nIncorrect because we compare the out-of-sample forecasting performance of forecasting models by comparing their root mean squared error (RMSE). The model with the smallest RMSE is judged the most accurate, and not the model with the largest R-squared. This means that the AR(2) model has better out-of-sample forecasting performance.\nB. equal. — Incorrect\nIncorrect because we compare the out-of-sample forecasting performance of forecasting models by comparing their root mean squared error (RMSE), and not the standard error of regression. The model with the smallest RMSE is judged the most accurate, which means that the AR(2) model has better out-of-sample forecasting performance.\nC. better. — Correct\nCorrect because we compare the out-of-sample forecasting performance of forecasting models by comparing their root mean squared error (RMSE) and the model with the smallest RMSE is judged the most accurate. Since the RMSE of the AR(2) model is lower than that of the AR(1) model (0.30 < 0.32), this indicates that the AR(2) model has better out-of-sample forecasting performance.", "ko": "표본 외 예측 성과는 RMSE로 비교하고 작을수록 좋다. AR(2) RMSE 0.030 < AR(1) 0.032 → AR(2)가 더 좋다. R²나 회귀 표준오차는 표본 내 적합도 지표다.", "trap": "R²가 약간 낮다고 예측력이 나쁜 것이 아니다.", "f": "", "why": {"A": "R²로 판단한 경우.", "B": "회귀 표준오차(둘 다 0.027)로 판단한 경우."}, "orig": "Mock 4 Session 1 Q31", "conf": true, "my": "A"}, {"id": "mock4-Q32", "src": "정답", "module": "QM", "tag": "혼동행렬 accuracy", "vig": 7, "stem": "The accuracy of Hardie's text classification model is closest to:", "opts": {"A": "0.74.", "B": "0.77.", "C": "0.80."}, "ans": "A", "en": "A. 0.74. — Correct\nCorrect because this is the accuracy of the model, calculated as:\nAccuracy = (TP + TN) / (TP + FP + TN + FN) = (546 + 384) / (546 + 182 + 384 + 140) = 930 / 1,252 = 0.742812 ≈ 0.74,\nwhere TP = True Positives, TN = True Negatives, FP = False Positives, and FN = False Negatives.\nB. 0.77. — Incorrect\nIncorrect because this is the F1 score of the model, calculated as:\nF1 score = (2 × P × R) / (P + R) = (2 × 0.7500 × 0.795918) / (0.7500 + 0.795918) = 1.193878 / 1.545918 = 0.772277 ≈ 0.77,\nwhere\nP = Precision = TP / (TP + FP) = 546 / (546 + 182) = 546 / 728 = 0.7500\nR = Recall = TP / (TP + FN) = 546 / (546 + 140) = 546 / 686 = 0.795918\nand TP = True Positives, FP = False Positives, and FN = False Negatives.\nC. 0.80. — Incorrect\nIncorrect because this is the recall of the model, calculated as:\nRecall = TP / (TP + FN) = 546 / (546 + 140) = 546 / 686 = 0.795918 ≈ 0.80,\nwhere TP = True Positives and FN = False Negatives.", "ko": "TP 546, FP 182, FN 140, TN 384. Accuracy = (TP + TN)/전체 = (546 + 384)/1,252 = 0.74.", "trap": "0.77은 F1 score, 0.80은 recall.", "f": "Accuracy = (TP + TN)/(TP + FP + TN + FN)", "why": {"B": "F1 score.", "C": "recall = 546/686."}, "orig": "Mock 4 Session 1 Q32", "conf": true}, {"id": "mock4-Q33", "src": "정답", "module": "ECO", "tag": "성장회계 TFP", "vig": 8, "stem": "Based on the growth accounting equation, the growth in total factor productivity in Country A is closest to:", "opts": {"A": "1.1%.", "B": "1.8%.", "C": "2.0%."}, "ans": "A", "en": "A. 1.1%. — Correct\nCorrect because, using the growth accounting equation, the growth in total factor productivity is calculated as follows:\nΔY/Y = ΔA/A + αΔK/K + (1 − α)ΔL/L\nwhere:\nΔY/Y = Growth rate of output = 6.7%\nΔA/A = Total factor productivity growth (to be determined)\nΔK/K = Growth rate of capital = 4.5%\nΔL/L = Growth rate of labor = 6.5%\nα = Relative share of capital in GDP = 45% or 0.45\n1 – α = Relative share of labor in GDP = 1 – 0.45 = 0.55\nTherefore:\nΔA/A = ΔY/Y – αΔK/K – (1 – α)ΔL/L\nΔA/A = 6.7% – (0.45 × 4.5%) – (0.55 × 6.5%) = 1.1%\nB. 1.8%. — Incorrect\nIncorrect because the relative share of capital is used instead of the relative share of labor as follows:\nΔA/A = ΔY/Y – α(ΔK/K) – α(ΔL/L)\nΔA/A = 6.7% – (0.45 × 4.5%) – (0.45 × 6.5%) = 1.75% ≈ 1.8%\nC. 2.0%. — Incorrect\nIncorrect because this is simply the difference between the growth rate of labor (6.5%) and the growth rate of capital (4.5%).", "ko": "ΔA/A = ΔY/Y − α·ΔK/K − (1 − α)·ΔL/L = 6.7% − 0.45×4.5% − 0.55×6.5% = 6.7 − 2.025 − 3.575 = 1.1%.", "trap": "노동에는 1 − α(0.55)를 곱한다.", "f": "ΔY/Y = ΔA/A + αΔK/K + (1 − α)ΔL/L", "why": {"B": "노동에도 α(0.45)를 곱함.", "C": "노동·자본 증가율 차이일 뿐."}, "orig": "Mock 4 Session 1 Q33", "conf": false}, {"id": "mock4-Q34", "src": "정답", "module": "ECO", "tag": "1인당 GDP와 노동 참여율", "vig": 8, "stem": "The growth in per capita GDP in Country A over the past ten years is best explained by the change in the:", "opts": {"A": "age profile of the population.", "B": "female labor force participation.", "C": "average hours worked per year."}, "ans": "B", "en": "A. age profile of the population. — Incorrect\nIncorrect because there has been an increase in the percentage of the population both under the age of 16 and over the age of 64, implying a decrease in the percentage of the population of working age (16–64) compared with ten years ago, which would be contrary to the observed increase in per capita GDP.\nB. female labor force participation. — Correct\nCorrect because the female labor force participation rate has increased and this is a likely driver of Country A's increased per capita GDP. The labor force participation rate is defined as the percentage of the working age population in the labor force. It has trended upward in most countries over the last few decades because of rising participation rates among women. In contrast to population growth, an increase in the participation rate may raise the growth of per capita GDP.\nC. average hours worked per year. — Incorrect\nIncorrect because an increase in the average hours worked typically results in higher output. In this case, the average hours worked per year have decreased, indicating less output and consequently lower per capita GDP.\nWe can measure the potential size of the labor input as the total number of hours available for work.", "ko": "16세 미만과 64세 초과 비중이 모두 늘어 생산가능인구 비중은 줄었고, 평균 근로시간도 줄었다. 둘 다 1인당 GDP를 낮추는 쪽이다. 여성 경제활동참가율이 50% → 65%로 늘어 1인당 GDP 증가를 설명한다.", "trap": "인구 구조와 근로시간 변화는 증가의 원인이 아니라 반대 방향이다.", "f": "", "why": {"A": "생산가능인구 비중이 줄었다.", "C": "근로시간이 줄었다."}, "orig": "Mock 4 Session 1 Q34", "conf": true}, {"id": "mock4-Q35", "src": "정답", "module": "ECO", "tag": "내생적 성장이론", "vig": 8, "stem": "Nod’s conclusion about Country A’s future per capita GDP growth rate is most consistent with the:", "opts": {"A": "classical growth theory.", "B": "neoclassical growth theory.", "C": "endogenous growth theory."}, "ans": "C", "en": "A. classical growth theory. — Incorrect\nIncorrect because Nod concludes that the planned significant investments in research and development will result in a permanently higher growth rate in per capita GDP in Country A. This would be inconsistent with the classical growth theory.\nSpecifically, the classical model predicts that in the long run, the adoption of new technology results in a larger but not richer population. Thus, the standard of living is constant over time even with technological progress, and there is no growth in per capita output.\nB. neoclassical growth theory. — Incorrect\nIncorrect because Nod concludes that increased investment in research and development will result in a permanently higher growth rate in per capita GDP in Country A, with no diminishing returns to capital. This would be inconsistent with the neoclassical growth theory because it assumes diminishing returns to capital.\nOnce the economy reaches this steady state, capital deepening cannot be a source of sustained growth in the economy. Only when the economy is operating below the steady state and when the marginal product of capital exceeds its marginal cost can capital deepening raise per capita growth.\nC. endogenous growth theory. — Correct\nCorrect because Nod concludes that increased investment in research and development will result in a permanently higher growth rate in per capita GDP in Country A, with no diminishing returns to capital. This would be consistent with the endogenous growth theory.\nUnlike the neoclassical model, there are no diminishing marginal returns to capital for the economy as a whole in the endogenous growth models. So increasing the saving rate permanently increases the rate of economic growth.\nAlso, if the additional capital embodies new, more efficient methods of production or previously unavailable products, then more rapid capital accumulation can result in a permanently higher growth rate of per capita output.", "ko": "R&D 투자로 자본의 수확체감 없이 1인당 성장률이 영구적으로 높아진다는 결론은 내생적 성장이론이다. 신고전파는 자본의 수확체감을 가정해 저축률 증가가 영구 성장률을 높이지 못하고, 고전파는 1인당 소득이 결국 일정하다고 본다.", "trap": "'수확체감 없음'과 '영구적 성장률 상승'이 핵심 단서.", "f": "", "why": {"A": "고전파는 장기적으로 1인당 소득 성장이 없다.", "B": "신고전파는 자본의 수확체감을 가정."}, "orig": "Mock 4 Session 1 Q35", "conf": false}, {"id": "mock4-Q36", "src": "오답", "module": "ECO", "tag": "조건부 수렴 – 자본/노동 비율", "vig": 8, "stem": "Assuming conditional convergence, which country is most likely to experience the highest growth in per capita income?", "opts": {"A": "Country B", "B": "Country C", "C": "Country D"}, "ans": "C", "en": "A. Country B — Incorrect\nIncorrect because the capital-to-labor ratio for Country B is higher than that for Country D and, as per conditional convergence, the economy with a lower capital-to-labor ratio will experience more rapid growth of productivity and per capita income.\nB. Country C — Incorrect\nIncorrect because, even though Country C's per capita income is the same as Country D's, the capital-to-labor ratio for Country C is higher than that for Country D and, as per conditional convergence, the economy with a lower capital-to-labor ratio will experience more rapid growth of productivity and per capita income.\nC. Country D — Correct\nCorrect because Country D has the lowest capital-to-labor ratio and is therefore most likely to have the highest growth rate in per capita income, assuming conditional convergence.\nAssuming conditional convergence, for countries starting with different capital-to-labor ratios, their growth rates will differ in the transition to the steady state. The economy with a lower capital-to-labor ratio will experience more rapid growth of productivity and per capita income, but the differential will diminish until they finally converge.", "ko": "조건부 수렴(저축률·인구증가율·생산함수가 같은 나라들)에서는 자본/노동 비율이 낮을수록 1인당 소득이 빠르게 성장한다. Country D의 자본/노동 비율이 30%로 가장 낮다.", "trap": "1인당 소득이 같은 C와 D 중 기준은 소득이 아니라 자본/노동 비율이다.", "f": "", "why": {"A": "자본/노동 비율 40%로 D보다 높다.", "B": "소득은 D와 같지만 자본/노동 비율이 높다."}, "orig": "Mock 4 Session 1 Q36", "conf": true, "my": "B"}, {"id": "mock4-Q37", "src": "정답", "module": "CI", "tag": "배당 실효세율 (이중과세)", "vig": 9, "stem": "Client X's effective tax rate on dividends is closest to:", "opts": {"A": "36%.", "B": "44%.", "C": "50%."}, "ans": "B", "en": "A. 36%. — Incorrect\nIncorrect because only 40% of pre-tax income is allocated to dividend payments, so only 40% of corporate tax contributes to the effective tax rate on dividends. This answer assumes that the total corporate tax ($75) on pre-tax income contributes to the effective tax rate. It was computed as follows:\nGiven in vignette:\nPre-tax earnings are $250 million.\nProportion allocated to dividend payments is 40%.\nCorporate tax rate is 30%.\nPersonal tax rate is 20%.\nIncorrect solution:\nPre-tax earnings = $250.00\nCorporate income tax = 0.30 × $250 = $75\nAfter-tax earnings = $250 – $75 = $175\nAfter-tax earnings paid as dividends = 0.40 × $175 = $70\nShareholder tax on dividends = 0.20 × $70 = $14\nNet dividend to shareholders = $70 – $14 = $56\nTotal taxes paid = $75 + $14 = $89\nEffective tax rate on dividends = (Corporate tax + Personal tax) / Pre-tax earnings\nEffective tax rate on dividends = $89/$250 = 35.6% ≈ 36%\nB. 44%. — Correct\nCorrect because the effective tax rate is computed by first applying the corporate tax to the pre-tax earnings allocated to dividends and then applying the personal tax on after-tax earnings paid as dividends. The investor's effective tax rate on dividends is computed as follows:\nGiven in vignette:\nPre-tax earnings are $250 million.\nProportion allocated to dividend payments is 40%.\nCorporate tax rate is 30%.\nPersonal tax rate is 20%.\nCalculations:\nPre-tax earnings allocated to dividend payments = 0.40 × $250 = $100\nCorporate income tax = 0.30 × $100 = $30\nAfter-tax earnings paid as dividends = $100 – $30 = $70\nShareholder tax on dividends = 0.20 × $70 = $14\nNet dividend to shareholders = $70 – $14 = $56\nEffective tax rate on dividends = (Corporate tax + Personal

ce levels — Correct\nCorrect because the joint contribution is tested using the F-statistic for the overall model. The F-statistic is calculated as F = mean square regression / mean square error = MSR/MSE = 0.0151/0.0015 ≈ 10. This exceeds the critical value at the 5% and 1% significance levels.", "ko": "F = MSR/MSE = 0.0151/0.0015 ≈ 10. 1% 임계값 3.813과 5% 임계값 2.619보다 크므로 두 유의수준에서 모두 독립변수들이 함께 유의하다.", "trap": "MSE/MSR로 뒤집거나 SSR/MSR로 계산하지 않는다.", "f": "F = MSR/MSE = (RSS/k)/(SSE/(n − k − 1))", "why": {"A": "F를 MSE/MSR로 거꾸로 계산.", "B": "SSR/MSR = 3으로 잘못 계산."}, "orig": "Mock 4 Session 2 Q33", "conf": true}, {"id": "mock4-Q78", "src": "오답", "module": "QM", "tag": "VIF·Breusch–Godfrey 해석", "vig": 19, "stem": "Does the testing of the platinum return model indicate model misspecification?", "opts": {"A": "No", "B": "Yes, because there is evidence of multicollinearity", "C": "Yes, because there is evidence of serial correlation"}, "ans": "A", "en": "A. No — Correct\nCorrect because the Breusch–Godfrey test and variance inflation factors do not provide evidence of misspecification.\nThe null hypothesis of the Breusch–Godfrey test is that there is no serial correlation in the model's residuals up to lag p. Since the null is not rejected, there is no evidence of serial correlation.\nWe can use the variance inflation factor (VIF) to quantify multicollinearity issues. VIFj > 5 warrants further investigation of the given independent variable. Since each VIF is close to 1, there is no evidence of multicollinearity.\nB. Yes, because there is evidence of multicollinearity — Incorrect\nIncorrect because each variance inflation factor is close to 1. We can use the variance inflation factor (VIF) to quantify multicollinearity issues and only VIF > 5 warrants further investigation of the given independent variable.\nC. Yes, because there is evidence of serial correlation — Incorrect\nIncorrect because the results of the Breusch–Godfrey test do not reject the null hypothesis.\nThe null hypothesis of the Breusch–Godfrey test is that there is no serial correlation in the model's residuals up to lag p.", "ko": "VIF가 모두 1 근처(5 넘으면 조사 필요)라 다중공선성 증거가 없다. Breusch–Godfrey 검정의 귀무가설은 '잔차에 자기상관 없음'인데 기각하지 못했으므로 자기상관 증거도 없다 → 모형 설정 오류 없음.", "trap": "VIF 1은 상관이 전혀 없는 최솟값. 귀무가설 '기각 실패'는 문제가 없다는 뜻.", "f": "", "why": {"B": "VIF ≈ 1이면 다중공선성 없음.", "C": "BG 검정 귀무가설(자기상관 없음)을 기각 못 함."}, "orig": "Mock 4 Session 2 Q34", "conf": true, "my": "B"}, {"id": "mock4-Q79", "src": "정답", "module": "QM", "tag": "AIC vs BIC 모형 선택", "vig": 19, "stem": "Which of the models for platinum returns should Kendall select based on her objective?", "opts": {"A": "Model 1", "B": "Model 2", "C": "Model 3"}, "ans": "A", "en": "A. Model 1 — Correct\nCorrect because Model 1 has the lowest Schwarz's Bayesian information criterion (BIC). BIC is preferred when the best goodness of fit is desired and the lower the better.\nB. Model 2 — Incorrect\nIncorrect because Model 2 has the lowest Akaike's information criterion (AIC), which is preferred if the model is used for prediction purposes. However, BIC is preferred when the best goodness of fit is desired and Model 2 does not have the lowest BIC.\nC. Model 3 — Incorrect\nIncorrect because Model 3 has the highest R^2 but this is not generally suitable for testing the significance of the model's fit. The R^2 cannot tell whether the model fit is good. BIC is preferred when the best goodness of fit is desired and Model 3 does not have the lowest BIC.\nIn addition, as both the R^2 and adjusted R^2 may increase when we add independent variables, we risk model overfitting.", "ko": "목표가 가장 간결하면서 잘 적합하는(goodness of fit) 모형이면 BIC를 쓰고 낮을수록 좋다. BIC가 가장 낮은 것은 Model 1(5.141). AIC는 예측 목적일 때 쓴다.", "trap": "AIC 최저(Model 2)는 예측용. R²는 변수만 늘려도 커진다.", "f": "", "why": {"B": "AIC 최저 – 예측 목적일 때.", "C": "R² 최고지만 과적합 위험."}, "orig": "Mock 4 Session 2 Q35", "conf": true}, {"id": "mock4-Q80", "src": "정답", "module": "QM", "tag": "비선형 수치 예측 ML", "vig": 19, "stem": "Which of the following machine-learning algorithms is best suited to Kendall's goal?", "opts": {"A": "Neural networks", "B": "Support vector machine", "C": "Principal components analysis"}, "ans": "A", "en": "A. Neural networks — Correct\nCorrect because Kendall's goal is to predict future returns using complex non-linear data. If numerical prediction, then depending on whether the data have non-linear characteristics, the choice of ML algorithms is from a set of regression algorithms—either penalized regression/LASSO for linear data or CART, random forest, or neural networks for non-linear data.\nB. Support vector machine — Incorrect\nIncorrect because support vector machines are useful for classification of linear data but Kendall's goal is to predict future returns using complex non-linear data. If the problem is one of classification, then depending on whether the data are labeled, the choice is either from a set of classification algorithms using labeled data or from a set of clustering algorithms using unlabeled data. If the data are labeled, then the choice of classification algorithm would be K-nearest neighbor and support vector machine for linear data.\nC. Principal components analysis — Incorrect\nIncorrect because principal components analysis (PCA) is best suited to dimension reduction but Kendall's goal is to predict future returns using complex non-linear data.\nDimension reduction aims to represent a dataset with many typically correlated features by a smaller set of features that still does well in describing the data. PCA is used to summarize or transform highly correlated features of data into a few main, uncorrelated composite variables.", "ko": "목표는 복잡한 비선형 데이터로 수익률(숫자)을 예측하는 것이다. 비선형 회귀 문제에는 CART, 랜덤 포레스트, 신경망이 맞다 → 신경망.", "trap": "SVM은 선형 분류, PCA는 차원 축소.", "f": "", "why": {"B": "SVM은 (선형) 분류용.", "C": "PCA는 차원 축소용."}, "orig": "Mock 4 Session 2 Q36", "conf": false}, {"id": "mock4-Q81", "src": "정답", "module": "PM", "tag": "주식 위험 프리미엄과 소비", "vig": 20, "stem": "Country A's equity risk premium most likely suggests that investors expect equity returns and the marginal value of future consumption to be:", "opts": {"A": "negatively correlated.", "B": "uncorrelated.", "C": "positively correlated."}, "ans": "A", "en": "A. negatively correlated. — Correct\nCorrect because an asset’s risk premium is determined by the relationship between its future payoff and the marginal value of consumption as given by the covariance between the two quantities. When the covariance is negative—that is, payoffs are low and expected utility from consumption is high—or equivalently, when times in the future are expected to be bad and the value of an extra unit of consumption is high, the risk premium will be high. When the covariance term is zero (there is no relationship), the asset is risk free. When the covariance term is positive, the asset is a hedge and will have a rate of return less than the risk-free rate. Also, equity investors will demand an equity risk premium if the consumption hedging properties of equities are poor—that is, if equities tend not to pay off in bad times. Our arguments earlier indicate that the equity risk premium should be positive and therefore, implicitly, that equities are a bad hedge for bad consumption outcomes. Thus, a large positive equity risk premium most likely suggests that investors expect the marginal value of future consumption and equity returns to be negatively correlated.\nB. uncorrelated. — Incorrect\nIncorrect because a large positive equity risk premium suggests that investors expect the marginal value of future consumption and equity returns to be negatively correlated. An equity risk premium of zero would suggest that the marginal value of future consumption and equity returns are uncorrelated.\nC. positively correlated. — Incorrect\nIncorrect because a large positive equity risk premium suggests that investors expect the marginal value of future consumption and equity returns to be negatively correlated. A negative (not positive) equity risk premium would suggest that the marginal value of future consumption and equity returns are positively correlated.", "ko": "위험 프리미엄은 자산 수익과 미래 소비의 한계 가치 사이 공분산으로 정해진다. 나쁜 시기(소비의 한계 가치가 높을 때)에 주식 수익이 낮으면, 즉 음의 상관이면 위험 프리미엄이 크다.", "trap": "상관 0이면 무위험, 양의 상관이면 헤지 자산(수익률 < 무위험).", "f": "", "why": {"B": "상관이 없으면 위험 프리미엄 0.", "C": "양의 상관이면 음의 위험 프리미엄."}, "orig": "Mock 4 Session 2 Q37", "conf": true}, {"id": "mock4-Q82", "src": "오답", "module": "PM", "tag": "breakeven inflation rate", "vig": 20, "stem": "Based on the most recent financial data, Country B's breakeven inflation rate is closest to:", "opts": {"A": "2.2%.", "B": "2.5%.", "C": "2.8%."}, "ans": "B", "en": "A. 2.2%. — Incorrect\nIncorrect because this answer choice incorrectly subtracts the risk premium for inflation uncertainty (0.3%) from the difference between the current yield on a 5-year zero-coupon default-free nominal bond (4.5%) and the current yield on a 5-year zero-coupon default-free real bond (2.0%).\nThe difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate. It should be clear from the discussion earlier that this break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon of the two bonds, plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation.\nB. 2.5%. — Correct\nCorrect because the difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate. Thus, the current break-even inflation rate for Country B is 4.5% (current yield on 5-year zero-coupon default-free nominal bond) – 2.0% (current yield on 5-year zero-coupon default-free real bond) = 2.5%.\nC. 2.8%. — Incorrect\nIncorrect because this answer choice incorrectly adds the risk premium for inflation uncertainty (0.3%) to the difference between the current yield on a 5-year zero-coupon default-free nominal bond (4.5%) and the current yield on a 5-year zero-coupon default-free real bond (2.0%).\nThe difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate. It should be clear from the discussion earlier that this break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon of the two bonds, plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation.", "ko": "BEI = 명목 무위험 무이표채 수익률 − 같은 만기 실질 무이표채 수익률 = 4.5% − 2.0% = 2.5%. 인플레이션 위험 프리미엄은 이미 BEI 안에 포함돼 있어 따로 더하거나 빼지 않는다.", "trap": "위험 프리미엄 0.3%를 더하면 2.8%, 빼면 2.2%(이건 기대 인플레이션).", "f": "BEI = 명목 수익률 − 실질 수익률 (= 기대 인플레이션 + 인플레이션 위험 프리미엄)", "why": {"A": "위험 프리미엄을 뺌.", "C": "위험 프리미엄을 더함."}, "orig": "Mock 4 Session 2 Q38", "conf": true, "my": "C"}, {"id": "mock4-Q83", "src": "정답", "module": "PM", "tag": "자산배분 부가가치", "vig": 20, "stem": "The value added to the global asset portfolio from asset allocation is closest to:", "opts": {"A": "0.69%.", "B": "2.95%.", "C": "3.64%."}, "ans": "A", "en": "A. 0.69%. — Correct\nCorrect because the value added from asset allocation is calculated as the sum of the differences in the weights between the strategic (benchmark) allocation and the actual sub-portfolio allocation multiplied by each sub-portfolio benchmark return. Thus, the value added from the asset allocation decision is: ([74% – 70%] × 12.8%) + ([26% – 30%] × (–4.5%)) = 0.512% + 0.180% = 0.692% ≈ 0.69%.\nB. 2.95%. — Incorrect\nIncorrect because this is the value added from the security selection (not asset allocation) decision. The value added from security selection is calculated as the sum of the actual portfolio weights multiplied by each sub-portfolio’s value added measure. Thus, the value added from the security selection decision is: (74% × [16.4% – 12.8%]) + (26% × [–3.4% – (–4.5%)]) = 2.664% + 0.286% = 2.95%.\nC. 3.64%. — Incorrect\nIncorrect because this is the total value added from the asset allocation and security selection decisions: 0.692% + 2.950% = 3.642% ≈ 3.64%.\nTotal value added is also computed as the portfolio return minus the benchmark return: ([74% × 16.4%] + [26% × (–3.4%)]) – ([70% × 12.8%] + [30% × (–4.5%)]) = 11.252% – 7.610% = 3.642% ≈ 3.64%.", "ko": "자산배분 부가가치 = Σ(실제 비중 − 전략 비중) × 벤치마크 수익. 주식 (74 − 70)% × 12.8% = 0.512%, 채권 (26 − 30)% × (−4.5%) = 0.180%. 합계 0.69%.", "trap": "2.95%는 종목 선택, 3.64%는 전체 부가가치.", "f": "AA = Σ(w_p − w_b) × R_b", "why": {"B": "종목 선택 부가가치.", "C": "전체 부가가치."}, "orig": "Mock 4 Session 2 Q39", "conf": false}, {"id": "mock4-Q84", "src": "정답", "module": "PM", "tag": "최대 샤프비율 = √(SR² + IR²)", "vig": 20, "stem": "The maximum Sharpe ratio that can be achieved by combining Fund X with an investment in its passive index benchmark portfolio is closest to:", "opts": {"A": "0.25.", "B": "0.28.", "C": "0.37."}, "ans": "C", "en": "A. 0.25. — Incorrect\nIncorrect because this is the information ratio of Fund X (active return/active risk = 1.5%/6.0%), not the maximum Sharpe ratio that can be achieved by combining Fund X with an investment in its passive index benchmark portfolio.\nB. 0.28. — Incorrect\nIncorrect because this is the Sharpe ratio of the passive index benchmark portfolio (0.275 ≈ 0.28), but it is not the maximum Sharpe ratio that can be achieved by combining Fund X with an investment in its passive index benchmark portfolio.\nC. 0.37. — Correct\nCorrect because the highest Sharpe ratio that can be achieved by combining investments in an actively managed fund and its benchmark equals the square root of the sum of the squared Sharpe ratio of the benchmark and the squared information ratio of the actively managed fund. A similarly important property in active management theory is that given the opportunity to adjust active risk and return by investing in both the actively managed and benchmark portfolios, the squared Sharpe ratio of an actively managed portfolio is equal to the squared Sharpe ratio of the benchmark plus the information ratio squared.\nThus, combining Fund X with an investment in its passive index benchmark portfolio will produce a squared Sharpe ratio equal to: 0.275^2 + (1.5%/6.0%)^2 = 0.075625 + 0.0625 = 0.138125. The maximum Sharpe ratio that can be achieved is approximately 0.37 (0.138125^(1/2) = 0.371652 ≈ 0.37).", "ko": "IR = 1.5%/6.0% = 0.25. 최대 샤프비율 = √(0.275^2 + 0.25^2) = √0.138 = 0.37.", "trap": "펀드 X 자체의 샤프비율(0.242)이 벤치마크보다 낮아도 결합하면 높아진다.", "f": "SR_max = √(SR_B² + IR²)", "why": {"A": "펀드 X의 정보비율.", "B": "벤치마크 샤프비율."}, "orig": "Mock 4 Session 2 Q40", "conf": false}, {"id": "mock4-Q85", "src": "정답", "module": "FI", "tag": "콜러블 채권 이항 트리", "vig": 21, "stem": "The value of Bond X is closest to:", "opts": {"A": "99.15.", "B": "99.98.", "C": "101.74."}, "ans": "A", "en": "A. 99.15. — Correct\nCorrect because this value reflects the exercise of the call option at the appropriate nodes in Year 1 and Year 2. The calculations are:\nValues at Year 2\nTop node: (100 + 5.85) / 1.104577 = $95.8285\nMiddle node: (100 + 5.85) / 1.077472 = $98.2392\nBottom node: (100 + 5.85) / 1.057393 = $100.1047, so the bond would be called at 100\nValues at Year 1\nTop node: [5.85 + (0.5 × 95.8285 + 0.5 × 98.2392)] / (1.042530) = $98.6867\nBottom node: [5.85 + (0.5 × 98.2392 + 0.5 × 100.0000)] / (1.031507) = $101.7633, so the bond would be called at 100\nValues at Year 0\nCurrent node: [5.85 + (0.5 × 98.6867 + 0.5 × 100.0000)] / (1.0610) = $99.1454 ≈ 99.15\nB. 99.98. — Incorrect\nIncorrect because this response only reflects the exercise of the call option in Year 2. The calculations are:\nValues at Year 2\nTop node: (100 + 5.85) / 1.104577 = $95.8285\nMiddle node: (100 + 5.85) / 1.077472 = $98.2392\nBottom node: (100 + 5.85) / 1.057393 = $100.1047, so the bond would be called at 100\nValues at Year 1\nTop node: [5.85 + (0.5 × 95.8285 + 0.5 × 98.2392)] / (1.042530) = $98.6867\nBottom node: [5.85 + (0.5 × 98.2392 + 0.5 × 100.0000)] / (1.031507) = $101.7633\nValues at Year 0\nCurrent node: [5.85 + (0.5 × 98.6867 + 0.5 × 101.7633)] / (1.0610) = $99.9764 ≈ $99.98\nThis response is also closest to the result of ignoring the call option completely, which is $100.00.\nC. 101.74. — Incorrect\nIncorrect because this response reflects the exercise of a put option, rather than a call option, at the appropriate nodes in Year 1 and Year 2. The calculations are:\nValues at Year 2\nTop node: (100 + 5.85) / 1.104577 = $95.8285, so the bond would be put at 100\nMiddle node: (100 + 5.85) / 1.077472 = $98.2392, so the bond would be put at 100\nBottom node: (100 + 5.85) / 1.057393 = $100.1047\nValues at Year 1\nTop node: [5.85 + (0.5 × 100.0000 + 0.5 × 100.0000)] / (1.042530) = $101.5319\nBottom node: [5.85 + (0.5 × 100.0000 + 0.5 × 100.1047)] / (1.031507) = $102.6676\nValues at Year 0\nCurrent node: [5.85 + (0.5 × 101.5319 + 0.5 × 102.6676)] / (1.0610) = $101.7433 ≈ $101.74", "ko": "2년차: 위 105.85/1.104577 = 95.83, 중간 105.85/1.077472 = 98.24, 아래 105.85/1.057393 = 100.10 → 100에서 콜. 1년차: 위 [5.85 + (95.83 + 98.24)/2]/1.04253 = 98.69, 아래 [5.85 + (98.24 + 100)/2]/1.031507 = 101.76 → 100에서 콜. 0년: [5.85 + (98.69 + 100)/2]/1.061 = 99.15.", "trap": "1년차 노드에서도 콜 가능 여부를 확인한다(빠뜨리면 99.98).", "f": "V = [C + 0.5(V_up + V_down)]/(1 + r), 콜 가능 노드에서 min(V, 100)", "why": {"B": "1년차 콜을 반영하지 않음.", "C": "콜 대신 풋으로 처리."}, "orig": "Mock 4 Session 2 Q41", "conf": false}, {"id": "mock4-Q86", "src": "정답", "module": "FI", "tag": "금리 변동성 하락 영향", "vig": 21, "stem": "If Kent's expectation for interest rate volatility is realized, which of the following bonds would most likely decrease in value?", "opts": {"A": "Bond X only", "B": "Bond Y only", "C": "Both Bond X and Bond Y"}, "ans": "B", "en": "A. Bond X only — Incorrect\nIncorrect because Kent's expectation is that interest rate volatility will decrease, which will increase the value of Bond X as a result of the embedded short call option. All else being equal, the call option increases in value with interest rate volatility as interest rate volatility increases, the value of the callable bond decreases. Conversely, when interest rate volatility decreases, the value of the callable bond increases.\nValue of callable bond = Value of straight bond – Value of issuer call option\nB. Bond Y only — Correct\nCorrect because Kent's expectation is that interest rate volatility will decrease, which will decrease the value of Bond Y as a result of the embedded long put option. All else being equal, the put option increases in value with interest rate volatility as interest rate volatility increases, the value of the putable bond increases. Conversely, when interest rate volatility decreases, the value of the putable bond decreases.\nValue of putable bond = Value of straight bond + Value of investor put option\nC. Both Bond X and Bond Y — Incorrect\nIncorrect because Kent's expectation is that interest rate volatility will decrease, which will increase the value of callable Bond X and decrease the value of putable Bond Y.", "ko": "변동성이 낮아지면 옵션 가치가 떨어진다. 콜러블(X) = 일반 채권 − 콜 → 콜 가치 하락으로 가치 상승. 풋어블(Y) = 일반 채권 + 풋 → 풋 가치 하락으로 가치 하락. 그래서 Y만 하락.", "trap": "콜러블 채권은 투자자가 콜을 매도한 상태라 변동성 하락이 유리하다.", "f": "콜러블 = 일반 − 콜, 풋어블 = 일반 + 풋", "why": {"A": "콜러블은 오히려 가치가 오른다.", "C": "X는 오른다."}, "orig": "Mock 4 Session 2 Q42", "conf": false}, {"id": "mock4-Q87", "src": "정답", "module": "FI", "tag": "몬테카를로 drift 조정", "vig": 21, "stem": "The technique used by Kent to customize the Monte Carlo model is best described as:", "opts": {"A": "making a drift adjustment.", "B": "implementing mean reversion.", "C": "benchmarking the term structure."}, "ans": "A", "en": "A. making a drift adjustment. — Correct\nCorrect because in the Monte Carlo method, a constant is added to all interest rates on all paths such that the average present value for each benchmark bond equals its market value. The constant added to all short interest rates is called a drift term. When this technique is used, the model is said to be drift adjusted.\nB. implementing mean reversion. — Incorrect\nIncorrect because mean reversion is implemented by implementing upper and lower bounds on the random process generating future interest rates. Mean reversion has the effect of moving the interest rate toward the implied forward rates from the yield curve. No adjustment involving adding a constant to all rates on all paths is required.\nC. benchmarking the term structure. — Incorrect\nIncorrect because the benchmark term structure is represented by the current spot curve such that the average present value across all scenario interest rate paths for each benchmark bond equals its actual market value.", "ko": "모든 경로의 모든 금리에 같은 상수를 더해 벤치마크 채권의 평균 현재가치가 시장가격과 같게 만드는 것을 drift 조정이라고 한다.", "trap": "평균 회귀는 금리에 상·하한을 두는 것.", "f": "", "why": {"B": "평균 회귀는 상·하한 설정.", "C": "벤치마크 기간구조는 현재 spot curve 자체."}, "orig": "Mock 4 Session 2 Q43", "conf": true}, {"id": "mock4-Q88", "src": "정답", "module": "FI", "tag": "시장 전환 프리미엄(주당)", "vig": 21, "stem": "The current market conversion premium per share for the convertible bond is closest to:", "opts": {"A": "$1.29.", "B": "$2.23.", "C": "$3.52."}, "ans": "A", "en": "A. $1.29. — Correct\nCorrect because the market conversion premium per share is calculated as follows:\nMarket conversion premium per share = (Convertible bond price / Conversion ratio) – Underlying share price\nwhere\nConvertible bond price = $1,198\nConversion ratio = (Par value / Conversion price) = $1,000 / $17.77 = 56.2746\nUnderlying share price = $20\n= ($1,198 / 56.2746) – $20\n= $21.2884 – $20\n= $1.2884 ≈ $1.29\nB. $2.23. — Incorrect\nIncorrect because this response is derived from the current share price less the conversion price, which does not reflect the change in the convertible bond's price since issuance:\nIncorrect market conversion premium per share = Current share price – Conversion price\nwhere\nCurrent share price = $20\nConversion price = $17.77\n= $20 – $17.77\n= $2.23\nC. $3.52. — Incorrect\nIncorrect because this response uses the conversion price instead of the current share price:\nIncorrect market conversion premium per share = (Convertible bond price / Conversion ratio) – Conversion price\nwhere\nConvertible bond price = $1,198\nConversion ratio = (Par value / Conversion price) = $1,000 / $17.77 = 56.2746\nConversion price = $17.77\n= ($1,198 / 56.2746) – $17.77\n= $21.2884 – $17.77\n= $3.5184 ≈ $3.52", "ko": "전환비율 = 1,000/17.77 = 56.27주. 시장 전환가격 = 1,198/56.27 = 21.29. 주당 시장 전환 프리미엄 = 21.29 − 주가 20 = $1.29.", "trap": "전환가격(17.77)을 주가 대신 빼지 않는다.", "f": "프리미엄/주 = 전환사채 가격/전환비율 − 주가", "why": {"B": "주가 − 전환가격.", "C": "주가 대신 전환가격을 뺌."}, "orig": "Mock 4 Session 2 Q44", "conf": false}], "vignettes": ["George Hansen manages portfolios for high-net-worth clients based in the US. He meets with a client who recently inherited a portfolio with investments in both a REIT and a commodity futures fund.\nREIT\nHansen reviews the client's investment in Maipo Valley Group, a retail REIT located in the US. Hansen uses the information in Exhibit 1 to calculate Maipo's net asset value per share (NAVPS).\nExhibit 1\nLast-12-month pro forma cash net operating income (NOI)\t$240 million\nNext-12-month growth in NOI\t$36 million\nCash and equivalents\t$10 million\nAccounts receivable\t$25 million\nPrepaid/Other assets\t$15 million\nLand held for future development\t$800 million\nTotal debt\t$600 million\nMarket capitalization\t$2,250 million\nShares outstanding\t50 million\nCapitalization rate\t8.0%\nCost of equity\t9.5%\nDividend payout ratio\t100.0%\nManaged Commodity Futures Fund\nHansen then reviews the investment in the Crescent commodity futures fund. The fund currently holds positions in the natural gas, softs (cash crops), and livestock sectors.\nHansen observes that Crescent's returns in the natural gas sector behaved differently from the other two sectors over the past five years. According to Crescent's prospectus, the fund always takes a long position in the natural gas futures contract with the shortest maturity. At the contract maturity date, Crescent rolls forward the existing contract to the new contract with the shortest maturity. Hansen gathers in Exhibit 2 prior-year price information for the natural gas market for two of Crescent's trade dates. All prices are in $ per million British thermal units as of the date listed.\nExhibit 2\nTrade Date\tSpot Price\tJune Futures Price\tJuly Futures Price\tAugust Futures Price\n28 May\t1.795\t1.957\t2.418\t2.793\n26 June\t1.795\t1.795\t2.338\t2.546", "Fei Yang is a portfolio manager analyzing fixed-income investments in various currencies.\nYang begins by analyzing investment opportunities in Country 1. She has a 2-year investment horizon and evaluates the following two strategies, each of which uses government bonds with a 4.00% annual coupon and a par value of $100.\nStrategy A: Purchase a 2-year bond and hold it to maturity\nStrategy B: Purchase a 3-year bond and sell it in two years\nYang uses the spot rates for Country 1 government bonds, shown in Exhibit 1, to evaluate these strategies. Yang expects the shape and level of the yield curve in Country 1 to remain unchanged over her investment horizon.\nExhibit 1\nTerm (Years)\tSpot Rate\n1\t3.00%\n2\t5.00%\n3\t7.00%\nFor Country 2, Yang anticipates that economic growth will accelerate. As a result, she expects Country 2's yield curve, which is currently upward sloping, to rise and become steeper than currently expected by the market. Given her expectations, Yang considers which of the three compositions for her long–only government bond portfolio in Exhibit 2 would be the most appropriate.\nExhibit 2\nPortfolio\tShort-Term Bonds\tIntermediate-Term Bonds\tLong-Term Bonds\n1\t80%\t10%\t10%\n2\t33%\t34%\t33%\n3\t45%\t10%\t45%\nYang then considers Country 3 and calculates the 5-year swap spread, based on a 5-year swap rate of 5.50% and the data on recently issued government bonds shown in Exhibit 3.\nExhibit 3\nGovernment Bond\tOriginal Maturity\tRemaining Maturity\tYield-to-Maturity\nBond A\t5.0 years\t4.0 years\t5.20%\nBond B\t5.0 years\t4.5 years\t5.30%\nBond C\t6.0 years\t5.5 years\t5.40%", "Debra McAlister is an equity analyst for a mutual fund company. She is researching two equities, Zedco Inc. and Midord Corporation, as possible additions to the firm's portfolios.\nZedco Inc.\nZedco's average ROE is the highest in its industry, but it has been volatile. McAlister is concerned about using past data to estimate the company's future ROE. Zedco has an average level of debt for its industry but, in response to lower interest rates, is expected to refinance most of its older debt within the next year. In developing her valuation, McAlister is uncertain about her estimate of Zedco's terminal value. Zedco has a low dividend payout ratio, which McAlister expects to be maintained. Finally, compared to its historical financial statements, Zedco's most recent financial statement shows an abnormally high level of accounting accruals.\nMcAlister decides to use both single-stage and multistage residual income models to value Zedco. To check her assumptions, McAlister calculates the implied growth rate in Zedco's residual income using its current market price. She uses the data in Exhibit 1 for her analysis.\nExhibit 1\nCost of equity capital\t12%\nWACC\t10%\nROE (3-year average)\t29%\nCurrent price per share\t$80\nBook value per share\t$20\nMidord Corporation\nBased on Midord's characteristics, McAlister decides to estimate its value using both a two-stage DDM and the H-model. For both models, she uses a required return on equity of 10% and Midord's most recent dividend payment of $0.55 per share. For the two-stage DDM, McAlister uses Midord's trailing P/E ratio to estimate its terminal value per share in Year 8 with the following additional assumptions:\nAnnual growth in dividends in years 1 through 8 = 12%\nDividend payout ratio at the end of Year 8 = 60%\nTrailing P/E ratio at the end of Year 8 = 20\nFor the H-model, McAlister's additional model inputs are:\nHalf-life of the high-growth period (H) = 4 years\nInitial short-term dividend growth rate (gS) = 12%\nLong-term dividend growth rate (gL) = 5%", "Susan Park, CFA, is a portfolio manager at Plum Asset Management. Plum has adopted the Standards as part of its ethics and compliance policy, but does not claim compliance with the GIPS standards.\nWhen preparing reports relating to performance presentation for her clients, Park applies the following criteria:\nCriterion 1:\tPerformance is presented using a weighted composite of similar portfolios.\nCriterion 2\tTerminated accounts are excluded from the calculation of performance history.\nCriterion 3:\tPerformance presentations are tailored to the knowledge and sophistication of the client.\nPark receives orders from four of her clients to purchase shares in an oversubscribed IPO. She determines that the IPO is suitable for all of these clients. One of the clients, a family member of Park's, has a regular fee-paying account that is managed similarly to those of the other three clients. Park allocates the shares she receives to the four clients on a pro rata basis according to order size. She discloses the firm's IPO allocation policy to only those clients that participate in IPOs.\nPark meets with a prospective client. During their initial meeting, Park makes the following statements to the client:\nStatement 1:\t\"I passed all three levels of the CFA exam on my first attempt.\"\nStatement 2:\t\"The CFA Program has enhanced my portfolio management skills.\"\nStatement 3:\t\"As a CFA charterholder, I am the most qualified to manage your investments.\"\nAfter their initial meeting, Park and the prospective client visit an inexpensive cafe. During their meal, the prospective client states that he is impressed with Plum's services and indicates that he will open an account with Plum. The client offers Park to use the client's vacation home for a week whenever she outperforms the benchmark index in a given quarter. At the end of the meal, the client insists on paying the cafe bill. Later that day, Park speaks with Plum's compliance officer about the client's offer to use the vacation home. The compliance officer does not raise any objections to the vacation home arrangement and gives verbal consent to use the home. Park also discloses to the compliance officer that the client paid the cafe bill. In the next quarter, Park outperforms the benchmark and then uses the vacation home.", "Evangelia Georgiou is an analyst with a family office. She is researching Rummidge, a publicly listed company, and Gimmerton, a private company.\nTo analyze Rummidge, Georgiou uses the information in Exhibit 1. She believes that the past seven years reflect average profitability over the company's business cycle. Using the method of average ROE for earnings normalization, Georgiou calculates Rummidge's P/E ratio based on normalized EPS.\nExhibit 1\nCurrent share price\t$23.40\nCurrent book value per share\t$19.50\nAverage EPS (past 7 years)\t$2.45\nAverage ROE (past 7 years)\t9.5%\nRequired rate of return on equity\t9.0%\nForecast long-term dividend payout ratio\t75%\nFor comparison, Georgiou also determines Rummidge's justified P/B ratio based on her forecasts and using the Gordon growth model. For her calculation, she uses the average ROE for the past seven years as the forecast of long-term future ROE.\nNext, the family office asks Georgiou to evaluate a proposal to take a minority stake in Gimmerton. To facilitate comparison with the EBITDA disclosed by its publicly listed peers, Georgiou adjusts Gimmerton's reported EBITDA to account for the following:\n• Gimmerton's founder and CEO is paid a fixed annual salary of $0.4 million. A market-based compensation package for a CEO of a similar public company would be $1.0 million.\n• Gimmerton owns a luxury yacht that is not required for its core operations. In the last fiscal year, expenses associated with the yacht contributed $1.2 million to operating costs and $0.5 million to depreciation expense.\nGeorgiou values a 100% equity stake in Gimmerton and then calculates the total discount for the minority stake to incorporate both the lack of control and the lack of marketability. She uses a control premium of 25% and a discount for lack of marketability of 10%.", "Isabelle Boyer is a fund-of-funds portfolio manager based in Ireland. She is assessing the performance of active asset managers across different regions over the previous quarter, and is planning her fund's tactical allocation for the next quarter.\nBoyer begins by looking at Polari, an active US equity manager. She analyzes Polari's performance for the previous quarter using the Carhart four-factor model, which includes the following factors: market return minus risk-free rate (RMRF), small minus big (SMB), high minus low (HML), and winners minus losers (WML).\nExhibit 1 illustrates factor sensitivities and factor returns for Polari and its benchmark over the previous quarter. Polari’s active return for the quarter was 2.5%. Boyer uses this information to assess the investment style of the manager and to decompose the active returns into the return from factor tilts and from security selection.\nExhibit 1\nFactor\tFactor Sensitivity for Polari\tFactor Sensitivity for Benchmark\tFactor Return\nRMRF\t1.1\t1.0\t5.0%\nSMB\t0.3\t0.0\t–2.0%\nHML\t0.4\t0.2\t1.0%\nWML\t–0.1\t0.1\t–2.5%\nThe current factor exposures of Polari do not reflect Boyer's preferred exposures for the next quarter. She considers using a smart beta ETF to implement a tactical allocation.\nIn Exhibit 2, Boyer compares the characteristics of two smart beta ETFs, zTrak and xShares, both of which track the same US equity market index. Boyer calculates the 3-month holding period cost of investing in the two ETFs.\nExhibit 2\n\tzTrak\txShares\nCommission (one-way)\t5 bps\t10 bps\nBid–ask spread on purchase and sale\t15 bps\t10 bps\nAnnual management fee\t20 bps\t15 bps\nAs an alternative, Boyer considers investing in yPath, a smart beta exchange-traded note (ETN) issued by a large US investment bank. Boyer compares the structure, creation/redemption mechanism, and counterparty risk of yPath with those of zTrak and xShares.", "Tina Habba, CFA, provides advisory services to high-net-worth individuals at FundLand, a wealth management firm that distributes both its own funds and third-party funds to clients.\nFundLand is setting up a referral fee arrangement with Schula Asset Management. Under this arrangement, Schula provides research services to FundLand in exchange for FundLand distributing Schula's funds. The arrangement has the following characteristics:\nCharacteristic 1: The estimated value of the research services is $100,000 per year.\nCharacteristic 2: The research services are provided on an ongoing basis, for as long as FundLand distributes Schula's funds.\nFundland plans to offer a structured note to its clients. The structured note replicates the 1-year return of a US equity index, with a 15% cap on upside return and a maximum loss of 15%. Habba sends a brief email to all of her suitable clients with the following two statements and an invitation to follow up if they require more information:\nStatement 1: \"This note is attractive because, in my view, the market will trend moderately higher.\"\nStatement 2: \"This note provides the return of the US equity index with no downside risk.\"\nHabba receives a call from her client Trey Laurent, who has heard about the structured note. Laurent sends Habba a purchase order for a small amount relative to his total wealth. Laurent's recently updated IPS indicates that the structured note is not suitable for his portfolio. During the call Habba explains to Laurent that the trade is not suitable for him, which he acknowledges. Nonetheless, Laurent insists on purchasing the security. Habba then proceeds to execute the trade order according to his instructions.\nBoth Habba and FundLand are based in Country A. Habba is preparing to market FundLand’s funds to investors in Country B, a rapidly growing economy. Country B investor protection laws are minimal and there are no restrictions on fund distribution and marketing practices. Country A's laws are more restrictive in this regard than the Standards, but Country A laws state that advisory firms must follow the laws of the local country where they conduct business.", "Aaron Hardie is an analyst with a commodity trading firm. Hardie is evaluating quantitative models for making predictions in the market for wheat futures.\nHardie models commodity trading positions as he believes they provide information for future price movements. He calculates the net trading position for commercial traders (NTPC) as the difference in the number of long and short contracts as a proportion of the total number of outstanding contracts in week t. Hardie develops two autoregressive (AR) models to help predict the future NTPC:\nAR(1) model: NTPCt = 0.003 + 0.949 × NTPCt–1\nAR(2) model: NTPCt = 0.003 + 1.096 × NTPCt–1 – 0.116 × NTPCt–2\nHardie uses the models to determine the mean-reverting level of NTPC. He also forecasts NTPC for the next two weeks given that it is 0.061 in the current week and was 0.034 in the prior week. He then uses the regression statistics in Exhibit 1 to compare the forecasting performance of the two models.\nExhibit 1\n\tAR(1) Model\tAR(2) Model\nR-squared\t0.907\t0.905\nStandard error of regression\t0.027\t0.027\nRoot mean squared error\t0.032\t0.030\nHardie has access to a range of social media and news articles related to agricultural commodity markets. He decides to use this unstructured data to create a sentiment score by classifying articles as positive (Class \"1\") or negative (Class \"0\"). Since he plans to use the sentiment score generated by the text classification model to predict market movements, Hardie conducts error analysis on the classifications identified during model training. He uses the confusion matrix shown in Exhibit 2 to calculate the accuracy of the model.\nExhibit 2\n\t\tActual Training Labels\t\nClass \"1\"\tClass \"0\"\nPredicted Results\tClass \"1\"\t546\t182\nClass \"0\"\t140\t384", "Olbab Nod is an analyst reviewing economic data from various countries.\nNod begins by calculating the contribution of total factor productivity to economic growth for Country A. He gathers the relevant data in Exhibit 1.\nExhibit 1\nShare of capital in GDP\t45.0%\nGrowth rate of capital\t4.5%\nGrowth rate of labor\t6.5%\nGrowth rate of output\t6.7%\nNod observes a consistent increase in Country A's per capita GDP over the past ten years. To better understand this increase, he analyzes the country's labor supply using the information in Exhibit 2.\nExhibit 2\n\t10 Years Ago\tToday\nPercentage of population under the age of 16\t15%\t16%\nPercentage of population over the age of 64\t17%\t19%\nFemale labor force participation\t50%\t65%\nAverage hours worked per year\t1,875\t1,750\nOver the next two years, Nod expects an increase in the saving rate in Country A, resulting in increased investment in research and development targeting more efficient production methods. He concludes that this will lead to a permanently higher per capita GDP growth rate in the future, with no diminishing returns to capital.\nNod reviews the information on three developing economies in Exhibit 3. There are no material differences in the countries' saving rates, population growth rates, and production functions. Nod believes that the three countries will benefit from conditional convergence with developed economies.\nExhibit 3\n\tCountry B\tCountry C\tCountry D\nCapital-to-labor ratio\t40%\t40%\t30%\nPer capita income\t$1,100\t$1,000\t$1,000", "Emily Connelly is an investment analyst at Cove Investment Management. Connelly is analyzing a company that has $250 million in pretax earnings, 40% of which are distributed as dividends while the rest are retained. Both distributed and retained earnings are taxed at a 30% corporate tax rate. Connelly computes the effective tax rate on dividends for a client, Client X, who has a 20% personal tax rate on dividends received.\nConnelly evaluates potential stock price reactions to a reduction in dividend payments made by three firms (Firm A, Firm B, and Firm C), based on the metrics shown in Exhibit 1.\nExhibit 1\nMetric\tFirm A\tFirm B\tFirm C\nGrowth opportunities\tHigh\tLow\tHigh\nFinancial flexibility\tHigh\tHigh\tLow\nFirm D is a producer of consumer staples and follows a stable dividend policy. Connelly uses the target payout adjustment model to forecast the current year’s dividend based on the information presented in Exhibit 2. She assumes Firm D's dividends will move toward the target payout ratio over four years.\nExhibit 2\nMost recent EPS\t$3.25\nMost recent dividend per share\t$1.35\nTarget payout ratio\t40%\nExpected earnings growth rate\t10%\nThe founder of Firm E owns 51% of the firm's outstanding shares. One of Cove's clients, Client Y, is considering the purchase of all the founder's shares. No other investor holds more than 3% of the outstanding shares. Firm E is located in a country of which the client is not a citizen, and regulations subject foreign ownership holdings in Firm E's equity to 5% voting caps. Connelly considers the ownership structure that would result from this transaction.", "Karl Reinke, a research analyst, is examining the financial statements of Argon plc, a UK-based company that reports under IFRS. Argon's primary competitors are US-based companies that report under US GAAP. On 1 January of the current year, Argon purchased a 40% non-controlling interest in Xenon plc for GBP 500 million. The book values of the assets and liabilities were equal to their fair values except for inventory, which was undervalued by GBP 5 million, and equipment, which was undervalued by GBP 10 million. Xenon uses the FIFO inventory valuation method and depreciates all of its equipment using the straight-line method. The equipment has an estimated remaining useful life of ten years with no residual value. Reinke estimates that Xenon will report net income of GBP 60 million and will not declare any dividends for the current year.\nArgon also acquired an 80% controlling interest in Radon plc in the current year, and has elected to use the partial goodwill option for recognizing goodwill when consolidating Radon.\nReinke next examines Argon's financial statement trends for the past three reported years. He compiles the accruals ratios in Exhibit 1, and the Beneish M-scores and Altman Z-scores in Exhibit 2.\nExhibit 1\n\tMost Recent Year\tTwo Years Ago\tThree Years Ago\nCash-flow-based accruals ratio\t–3.6%\t–2.4%\t1.1%\nBalance-sheet-based accruals ratio\t2.5%\t–2.9%\t–4.4%\nExhibit 2\n\tMost Recent Year\tTwo Years Ago\tThree Years Ago\nBeneish M-score\t–1.93\t–1.81\t–1.76\nAltman Z-score\t3.03\t2.86\t2.78", "Tokushi Stone is a risk manager at Brockway Asset Management, a multi-manager hedge fund. Brockway has $10 billion in assets under management across three strategies: equity long–short, quantitative, and fixed income.\nBrockway's entity-level risk exposure is measured and monitored using VaR. Stone prepares a quarterly risk report and determines that the entity-level daily VaR is $15.8 million at the 95% confidence level.\nStone first evaluates Brockway's equity long–short strategy. To calculate the VaR of the equity long–short portfolio, Stone compiles the portfolio characteristics in Exhibit 1 and estimates the monthly VaR at the 95% confidence level using the variance–covariance method. At the 95% confidence level, the critical value of the one-tailed z-statistic is 1.65.\nExhibit 1\nExpected monthly return\t0.738%\nMonthly volatility of returns\t1.100%\nPortfolio value\t$500 million\nNext, Stone reviews backtesting results of two portfolios for Brockway's quantitative strategy. Summary statistics using monthly returns for the two portfolios are presented in Exhibit 2.\nExhibit 2\n\tPortfolio 1\tPortfolio 2\nMean return\t0.7%\t0.6%\nStandard deviation\t1.5%\t0.8%\nSkewness\t–1.9\t1.1\nKurtosis\t15.8\t4.6\nVaR (95%)\t–1.9%\t–0.6%\nConditional VaR (95%)\t–6.9%\t–2.3%\nFinally, Stone reviews Brockway's fixed-income strategy, which uses a multifactor model to pick undervalued securities. He estimates downside risk measures for the strategy using Monte Carlo simulation. To perform the simulation, Stone specifies a functional form using ten factors and calibrates the model to a multivariate Student’s t-distribution. The model is complex and several factors have limited historical data.", "Chun Tian is a US-based portfolio manager actively involved in the foreign exchange market.\nThree months ago, Tian made a 6-month deposit of 50 million Australian dollars (AUD) at the annualized 6-month AUD reference interest rate. She then fully hedged the deposit by selling AUD forward against USD. Today, she marks the forward position to market and notes that reference rates have not changed over the past three months. Selected current reference rates are provided in Exhibit 1.\nExhibit 1\n\t3-Month\t6-Month\nAUD reference rate (annualized)\t0.60%\t0.67%\nUSD reference rate (annualized)\t0.26%\t0.36%\nNext, Tian researches Cambodia, an emerging market that has the riel (KHR) as its currency. Tian notes that the 1-year KHR reference rate is 1.50% and the 1-year USD reference rate is 0.67%. The current KHR/USD (number of KHR per USD) spot rate is 4,100.00 and Tian expects the spot rate to be 4,161.50 one year from now. Tian explores a potential carry trade based on this information.\nOne week later, Tian determines whether a triangular arbitrage opportunity exists based on the dealer quotes provided in Exhibit 2.\nExhibit 2\n\tCurrency Pair\tBid / Ask Quote\nDealer 1\tJPY/USD\t107.64 / 107.65\nDealer 1\tKHR/USD\t4,043.00 / 4,156.00\nDealer 2\tJPY/KHR\t0.0250 / 0.0256\nNext, Tian researches investment opportunities in Country L, a developing country. She concludes that Country L has low capital mobility and restrictive fiscal and monetary policies. Tian uses the Mundell–Fleming model to evaluate the effect of these conditions on the currency of Country L.", "Fabiano Arlandi, a portfolio manager, is analyzing the term structure of credit spreads for three companies.\nCompany A is a high-quality issuer with a strong competitive position in a stable industry with strong fundamentals; the company is currently refinancing near-term maturities with long-term debt.\nCompany B was recently acquired in a leveraged buyout by an experienced team that is expected to restructure the organization and improve margins and profitability.\nCompany C operates in a cyclical industry that is currently at the bottom of its economic cycle.\nArlandi determines the credit spread of Company A's zero-coupon bond over a default-risk-free government bond, given the following information:\nThe bond has a remaining maturity of five years and a face value of 100.\nThe default-risk-free discount rate is 4% and the government yield curve is flat.\nThe credit valuation adjustment is 2.924.\nArlandi assumes there is no interest rate volatility.\nThree months ago, Arlandi bought $10 million of 5-year protection on Company B through a CDS contract with a duration of 3.7 years. The CDS credit spread has since narrowed from 350 bps to 220 bps currently. Arlandi closes out the trade by selling the CDS contract.\nArlandi purchases CDS protection on a 7-year senior unsecured bond issued by Company C and held in his portfolio. Several months after purchasing protection, a credit event occurs. The following bonds of Company C are trading in the market.\nBond 1: 7-year subordinated unsecured bond trading at 25% of par\nBond 2: 3-year senior unsecured bond trading at 35% of par\nBond 3: 7-year senior unsecured bond trading at 45% of par", "Yasmine Bernal, an equity analyst, is valuing two port operators: Ariel Port Inc and Boston Terminals Ltd. Bernal uses [free cash flow models] to value the stocks.\nAriel Port is an established business, which maintains moderate leverage and has steadily growing cash flows. Boston Terminals is completing construction of its second terminal this year, partially financed with new debt. Bernal forecasts that revenues of Boston Terminals will rise significantly in the first two years of operations of the new terminal and then stabilize. Bernal expects the leverage of Boston Terminals to decrease in the medium term once the second terminal is operational and the new debt is gradually repaid.\nAriel Port\nBernal reviews key financial data from Ariel Port, which reports under IFRS. Based on data from Ariel's annual report in Exhibit 1, Bernal gathers data for the latest reporting year starting from cash flow from operations (CFO). Ariel Port's tax rate is 30%.\nExhibit 1\nCash Flow Statement ($ Million)\t\nNet income\t648.2\nDepreciation and amortization\t900.0\nDecrease/(increase) in working capital\t100.0\nInterest expense\t183.4\nCash flow from operations\t1,831.6\nNet purchases of fixed assets\t(370.0)\nCash flow from investing activities\t(370.0)\nNew borrowings\t2,298.0\nRepayment of borrowings\t(1,944.0)\nInterest expense\t(262.0)\nCash flow from financing activities\t92.0\nNet change in cash\t1,553.6\nBoston Terminals\nBernal reviews Boston Terminals fundamental data and identifies three variables to consider:\nVariable 1:\tThe dividend payout ratio will decrease in the future\nVariable 2:\tBoston Terminals will have an inconsistent capital structure\nVariable 3:\tCapital expenditures will increase dramatically\nBernal decides to use FCFF to value Boston Terminals.\nThere are rumors that Boston Terminals plans to acquire a competitor, whose shares are currently trading at $24.1 per share. Bernal would like to determine if the stock is fairly valued, using the following assumptions:\nFCFF is estimated at $368 million in Year 1, $442 million in Year 2 and is expected to grow by 3% per year afterwards.\nWACC is 12% and number of outstanding shares is 100 million.\nMarket value of non-operating assets is $300 million.\nBook value of debt is $2,000 million and market value of debt is $2,300 million.\nBernal thinks that the competitor is likely to deploy anti-takeover measures against acquisition by Boston Terminals. She believes the competitor will issue new debt and use the proceeds to buy-back its own shares. Bernal assesses how these measures will affect the competitor's FCFF and FCFE.", "Susan Li, CFA, an equity research analyst with Maipo Canyon Investment Bank (MCIB), specializes in identifying companies that are likely takeover candidates. MCIB has adopted the Standards as part of its ethics and compliance policy.\nBloomberry, an institutional client of MCIB, recently earned a substantial return on a stock recommended by Li. To show its appreciation, Bloomberry offers Li tickets to a sold-out Broadway show as a gift. Li accepts the gift and plans to take her family to the show. Li does not notify her supervisor that she accepted the gift.\nIn a recently published investment report, Li included a table with statistical analysis of publicly available information from a well-recognized industry journal. By downloading the table and not performing the statistical analysis herself, she saved considerable time and effort. Li did not cite the source of the table in her report nor did she verify the statistical analysis.\nLi uses MCIB's proprietary model to identify companies that are likely takeover candidates. The proprietary model uses third-party accounting data. Although Li lacks the relevant programming skills, she understands the assumptions and limitations of the proprietary model. Li does not verify the underlying third-party data herself because MCIB has an established procedure for verifying the data.\nMCIB's proprietary model predicts that a takeover of Godoggo Corporation is highly likely. In a recent report, Li assigned a \"Buy\" recommendation to Godoggo's stock. Based on the report, one of MCIB's portfolio managers buys a large number of shares in Godoggo for his fund. He subsequently promotes the stock in several online chat rooms by stating, \"I have purchased Godoggo stock because our internal research indicates that it is highly likely to be taken over.\" A week later, the price of Godoggo's stock has doubled and the portfolio manager subsequently sells all the shares of the stock in his fund.", "Joanne Gordon is a buy-side analyst covering the banking and insurance sectors.\nGordon first analyzes the liquidity of Grand Bank. She reviews the information (in $ millions) from the bank's most recent annual report in Exhibit 1 and calculates its liquidity coverage ratio.\nExhibit 1\nHigh-quality liquid assets\t400\nNet cash outflows\t300\nHigh-quality liquid assets in excess of net cash outflows\t100\nTotal available stable funding\t1,300\nTotal required stable funding\t1,100\nGordon next evaluates the performance of a property and casualty insurance company, Bronx Insurance Company. She calculates the company's combined ratio for the most recent year using the information (in $ millions) presented in Exhibit 2.\nExhibit 2\nNet premiums written\t3,600\nNet premiums earned\t3,200\nLoss and loss adjustment expenses\t2,300\nUnderwriting expenses\t990\nDividends paid to policyholders\t100\nBronx Insurance has two share-based compensation plans: (1) a restricted stock unit (RSU) plan for employees; and (2) executive stock options. Settlement for the RSUs is made at the end of each year. On the grant date at the beginning of the first year, the share price was $6.00 per RSU. At the end of the second year, the share price was $5.00 per RSU. The CEO has vested stock options equivalent to 10% of the company's current outstanding shares. Gordon forecasts a net loss for Bronx Insurance during the second year of the RSU plan.", "Elaine Azul is an investment advisor at a mid-sized US investment firm. She is preparing for meetings with two of her clients, Jacob Green and Stella White.\nJacob Green has a large position in the non-dividend-paying stock of his own firm. Four months ago, Azul advised Green to reduce his exposure to the firm's stock by $2 million. Due to tax considerations, Green entered into a short 6-month equity forward contract for the firm's stock instead of selling the shares outright. At the meeting, Green asks Azul how the value of the current forward position would be affected if the company pays a $3.50 dividend in three months and the share price is unchanged.\nAzul is evaluating longer-term solutions to reduce Green’s exposure to the firm’s stock. One approach is to enter into a 3-year equity swap. The proposed equity swap has a semiannual reset, a 30/360 day count, a 2.5% annual fixed rate, and a $2 million notional principal.\nAzul's second client, Stella White, is expecting a cash inflow of $5 million in three months that she plans to deposit for six months in a non-domestic account. Azul suggests protecting this investment from an expected decrease in interest rates. She proposes a market reference rate (MRR)-based 3 × 9 forward rate agreement (FRA) that is advanced set, advanced settled. Relevant MRR data are presented in Exhibit 1.\nExhibit 1\nMaturity\tMRR Spot Rate (Annualized)\n3 months\t0.72%\n6 months\t0.93%\n9 months\t1.20%\nTwo years ago, White entered into a local market $7 million 5-year interest rate swap with annual resets (30/360 day count), receiving the fixed rate of 1.36% and paying the MRR. Azul determines the value of the swap today using the relevant spot rate data in Exhibit 2.\nExhibit 2\nMaturity\tSpot Rate\tPresent Value Factor\n1 year\t0.262%\t0.9974\n2 years\t0.672%\t0.9867\n3 years\t0.956%\t0.9721\n4 years\t1.140%\t0.9564\n5 years\t1.280%\t0.9398", "Chloe Smith is an equity analyst evaluating Calpurnia Corp., a multinational company based in the US. Calpurnia reports under US GAAP and its fiscal year end is 31 December. Its reporting currency is the USD.\nCalpurnia has certain transactions in EUR and also has foreign subsidiaries which report in EUR. Smith analyzes the effect of these on Calpurnia's consolidated financial statements. The USD/EUR (number of USD per 1 EUR) exchange rates over the most recent year are in Exhibit 1.\nExhibit 1\n\tUSD/EUR\n1 January\t1.14\n15 December\t1.08\n31 December\t1.05\nAverage for the year\t1.10\nOn 15 December of the most recent year, Calpurnia purchased inventory from a supplier in Spain for EUR 50 million. Calpurnia paid for the inventory on 31 January of the current year.\nOn 1 January of the most recent year, Calpurnia established a wholly-owned subsidiary in the Eurozone, Bartolo AG. Bartolo has the EUR as its reporting currency and uses the FIFO method to account for inventory. The exchange rate when Bartolo's inventory was purchased over the most recent year was 1.11. Bartolo's financial statements are translated into USD using the current rate method. Smith considers the effect of translation on Bartolo's gross profit margin. For the most recent year, Bartolo reported net income of EUR 10 million. On 15 December, Bartolo declared dividends of EUR 800,000.\nFinally, Smith evaluates the sustainability of growth in Calpurnia's geographic segments. She gathers information on the components of total net sales growth in Exhibit 2.\nExhibit 2\nGeographic Segment\tContribution from Volume Growth\tContribution from Price Growth\tContribution from Foreign Currency Exchange\tTotal Net Sales Growth\nEurozone\t9.3%\t4.5%\t–2.5%\t11.3%\nAmericas\t10.1%\t2.4%\t0.6%\t13.1%\nAsia Pacific\t8.1%\t0.4%\t5.4%\t13.9%", "Sarah Kendall is an analyst at a commodity trading firm. She is tasked with evaluating quantitative models to explain precious metal returns. Kendall develops a model with three factors to explain weekly returns (RET):\nRETt = b0 + b1FSIt + b2EPUt + b3GPRt + εt,\nwhere FSI is the weekly change in the financial stress index, EPU is the weekly change in economic policy uncertainty, and GPR is the weekly change in geopolitical risk. She estimates the model for silver and platinum returns using 624 weekly observations.\nKendall gathers the model output for silver returns and tests whether the model explains RET with any statistical significance. She uses the partial ANOVA table results in Exhibit 1 and notes that the critical value of the F-statistic is 3.813 at the 1% significance level and 2.619 at the 5% significance level.\nExhibit 1\nSource\tDegrees of Freedom\tSum of Squares\tMean Squares\nRegression\t3\t0.0453\t0.0151\nResidual\t620\t0.9512\t0.0015\nTotal\t623\t0.9965\t---\nNext, Kendall considers platinum returns. After running the model, she tests for model misspecification. The variance inflation factor for each of the independent variables is close to 1.00, and the Breusch–Godfrey test fails to reject the null hypothesis.\nKendall considers alternate model specifications using the three factors to model platinum returns. Her objective is to select the most parsimonious, best-fitting model. Kendall evaluates several goodness-of-fit measures, including Akaike's information criterion (AIC), Schwarz's Bayesian information criteria (BIC), and R^2. She gathers relevant model output in Exhibit 2.\nExhibit 2\nModel\tFactors\tAIC\tBIC\tR^2\n1\tFSI\t5.134\t5.141\t0.098\n2\tFSI, GPR\t5.132\t5.153\t0.103\n3\tFSI, GPR, EPU\t5.139\t5.160\t0.106\nAs a result of her firm investing in new data sources and technology, Kendall gains access to a wide range of new inputs that could be used to model the commodity market. She decides to utilize this dataset in a machine-learning algorithm with the goal of predicting commodity returns from the complex non-linear data.", "Amanda Glade is an analyst with an investment management firm that actively manages several diversified portfolios. She is currently updating her analysis of investment markets in Country A and Country B, both of which have developed economies, and assessing portfolio performance in preparation for a report to the firm's portfolio managers.\nGlade notes that Country A has a large positive equity risk premium, and she considers what this suggests about investor expectations.\nGlade analyzes the breakeven inflation rate of Country B. She examines the following most recent financial data for the country:\nCurrent yield on a 5-year zero-coupon default-free nominal bond: 4.5%\nCurrent yield on a 5-year zero-coupon default-free real bond: 2.0%\nRisk premium for inflation uncertainty: 0.3%\nNext, Glade assesses the performance of the firm's actively managed global asset portfolio. Using the most recent financial information presented in Exhibit 1, she calculates the value added to the portfolio from asset allocation.\nExhibit 1\n\tPortfolio Return (%)\tBenchmark Return (%)\tCurrent Allocation (%)\tStrategic Asset Allocation (%)\nGlobal equities\t16.4\t12.8\t74\t70\nGlobal fixed income\t–3.4\t–4.5\t26\t30\nGlade considers the possibility of combining one of the firm's actively managed domestic equity funds, Fund X, with an investment in its passive index benchmark portfolio. Using the information in Exhibit 2, she determines the maximum Sharpe ratio that a portfolio manager could achieve by combining Fund X with the passive index benchmark portfolio.\nExhibit 2\n\tIndex\tFund X\nSharpe ratio\t0.275\t0.242\nActive return\t---\t1.5%\nActive risk\t---\t6.0%", "Alice Kent, a fixed-income analyst, is evaluating several bonds for potential addition to her firm's portfolios.\nKent reviews newly issued Bond X, a 3-year default-free bond with an annual coupon of 5.85% that is callable at its par value of 100 one year and two years from today. She assumes interest rate volatility of 15% and constructs the binomial interest rate tree shown in Exhibit 1. In the tree, branching from each node to a high state or a low state occurs with equal probability. Kent uses the tree to value Bond X.\n[IMAGE: CFA-IS-2023.04-FIIN-Richardson+1-Case_2.png]\nYear zero: 6 point 1 zero zero percent. Arrow upward to: Year 1: 4 point 2 5 3 zero percent. Arrow downward to Year 1, 3 point 1 5 zero 7 percent. From the top box in year 1, arrow upward to Year 2: 10 point 4 5 7 7 percent. Arrow downward to 7 point 7 4 7 2 percent. From the bottom box, arrow upward to the Year 2, 7 point 7 4 7 2 percent box. Arrow downward to 5 point 7 3 9 3 percent.\nKent compares Bond X to Bond Y, a 3-year default-free putable bond with the same coupon. She expects interest rate volatility to decrease in the future and determines how the values of the two bonds would change if her expectation is realized.\nKent wants to develop a more flexible model than the binomial tree. She uses the Monte Carlo method to\nsimulate various potential interest rate paths, with a 30-year default-free coupon-paying bond as the benchmark bond. After the initial simulation of the paths, she customizes the model by adding a constant to all interest rates on all paths to ensure that the average present value for the benchmark bond equals its current market price.\nLastly, Kent gathers information on a convertible bond that was issued at par two years ago and has three years to maturity. The bond has a par value of $1,000, a 4.90% coupon payable annually, and a conversion price of $17.77 per share. Currently the bond's price is $1,198 and the price of the underlying shares is $20."], "modules": {"QM": "Quantitative Methods", "ECO": "Economics", "CI": "Corporate Issuers", "FSA": "Financial Statement Analysis", "EQ": "Equity Valuation", "FI": "Fixed Income", "DER": "Derivatives", "AI": "Alternative Inv

tax) / Pre-tax earnings allocated to dividends\nEffective tax rate on dividends = ($30 + $14)/$100 = 44%\nAlternatively, the effective tax rate can be computed as 1 minus the fraction of 1 unit of (pre-tax) earnings (allocated to dividends) that investors retain after all taxes, or:\nEffective tax rate = 1 − (1 − Corporate tax rate)(1 − Personal tax rate)\nEffective tax rate = 1 − (1 − 0.30)(1 − 0.20) = 1 − 0.56 = 0.44 or 44%\nThe effective tax rate can also be calculated by adding the two tax rates and subtracting an interaction term as follows:\nEffective tax rate = Corporate tax rate + Personal tax rate − (Corporate tax rate × Personal tax rate)\nEffective tax rate = 0.30 + 0.20 − (0.30 × 0.20) = 0.50 − 0.06 = 0.44 or 44%\nC. 50%. — Incorrect\nIncorrect because this is simply the sum of the two tax rates; 30% + 20% = 50%. This ignores the fact that dividends are paid from after-tax earnings.", "ko": "배당에 배정된 세전이익 100(250×40%)에 법인세 30 → 배당 70, 개인세 20% = 14 → 순배당 56. 실효세율 = (30 + 14)/100 = 44%. 공식으로 1 − (1 − 0.30)(1 − 0.20) = 44%.", "trap": "두 세율을 단순히 더하면 50%.", "f": "실효세율 = 1 − (1 − t_corp)(1 − t_ind)", "why": {"A": "법인세 전체(75)를 배당 세금에 포함.", "C": "세율 단순 합."}, "orig": "Mock 4 Session 1 Q37", "conf": false}, {"id": "mock4-Q38", "src": "오답", "module": "CI", "tag": "배당 축소에 대한 주가 반응", "vig": 9, "stem": "Based on Connelly's metrics, the stock price of which firm would most likely have a favorable reaction to a dividend reduction?", "opts": {"A": "Firm A", "B": "Firm B", "C": "Firm C"}, "ans": "C", "en": "A. Firm A — Incorrect\nIncorrect because, while both Firm A and Firm C have high growth opportunities, Firm A has high financial flexibility whereas Firm C does not. Consequently, Firm C would be more likely to have a favorable stock price reaction to a reduction in dividend payments than would Firm A.\nB. Firm B — Incorrect\nIncorrect because Firm B has low growth opportunities and high financial flexibility. Based on this information, a reduction in dividends by Firm B would most likely result in an unfavorable stock price reaction. Firm B would more likely benefit from an increase in dividend payments.\nC. Firm C — Correct\nCorrect because Firm C has high growth opportunities but low financial flexibility. Based on these two factors, it could benefit from a reduction in dividend payments. A reduction in dividend payments could give its management the ability to take advantage of those opportunities without needing to go to the capital market. Firm A has high growth opportunities, but it also has high financial flexibility, which would mitigate the need to cut dividends to raise investment capital. Firm B has low growth opportunities and high financial flexibility. A reduction in dividends by Firm B would most likely result in an unfavorable stock price reaction. Consequently, Firm C would be most likely to have a favorable stock price reaction to a reduction in dividend payments.\nCompanies may not initiate, or may reduce or omit, dividends to obtain the financial flexibility associated with having substantial cash on hand. A company with substantial cash holdings is in a relatively strong position to meet unforeseen operating needs and to exploit investment opportunities with minimum delay.", "ko": "성장 기회는 많은데 재무 유연성이 낮은 Firm C는 배당을 줄여 외부 자금 없이 투자할 수 있으므로 배당 축소에 주가가 긍정적으로 반응할 가능성이 가장 높다. Firm A는 재무 유연성이 높아 배당을 줄일 필요가 적고, Firm B는 성장 기회가 없어 배당 축소에 부정적 반응.", "trap": "성장 기회만 보지 말고 재무 유연성이 낮은지(현금이 필요한지)도 봐야 한다.", "f": "", "why": {"A": "재무 유연성이 높아 배당을 줄일 필요가 적다.", "B": "성장 기회가 낮아 배당 축소는 부정적."}, "orig": "Mock 4 Session 1 Q38", "conf": false, "my": "A"}, {"id": "mock4-Q39", "src": "정답", "module": "CI", "tag": "target payout 조정 모형", "vig": 9, "stem": "Based on the approach used by Connelly, Firm D's forecasted dividend per share for the current year is closest to:", "opts": {"A": "$1.37.", "B": "$1.43.", "C": "$1.49."}, "ans": "A", "en": "A. $1.37. — Correct\nCorrect because, using the target payout adjustment model and the information presented in the exhibit, the forecast of Firm D's dividend for the current year is computed as follows:\nExpected EPS based on 10% growth rate = $3.25 × 1.10 = $3.575\nAdjustment factor = 1 / (4 years) = 0.25\nExpected change in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor\n= ($3.575 × 0.40 – $1.35) × 0.25 = $0.02\nForecast of dividend per share = $1.35 + $0.02 = $1.37\nB. $1.43. — Incorrect\nIncorrect because this ignores the 'adjustment' component of the forecast model used by Connelly, as follows:\nExpected EPS = $3.25 × 1.10 = $3.575\nForecast of dividend per share = $3.575 × 0.40 = $1.43\nC. $1.49. — Incorrect\nIncorrect because this is computed by assuming that the most recent dividend per share increases at the expected earnings growth rate, as follows:\nForecast of dividend per share = $1.35 × 1.10 = $1.485 ≈ $1.49\nAlternatively, this answer can be incorrectly computed as:\nMost recent payout ratio = $1.35/$3.25 = 41.54%\nSince this payout ratio is above the new, higher target, maintain it for the current year.\nThen:\nForecast of dividend per share = $3.25 × 1.10 × 41.54% = $1.485 ≈ $1.49", "ko": "예상 EPS = 3.25 × 1.10 = 3.575. 목표 배당 = 3.575 × 0.40 = 1.43. 조정 속도 = 1/4 = 0.25. 배당 변화 = (1.43 − 1.35) × 0.25 = 0.02 → 예상 배당 = 1.35 + 0.02 = $1.37.", "trap": "1.43은 조정 없이 목표 배당성향만 적용한 값.", "f": "D1 = D0 + (E1 × 목표 배당성향 − D0) × 조정계수", "why": {"B": "조정계수를 무시.", "C": "기존 배당을 이익 성장률로 늘림."}, "orig": "Mock 4 Session 1 Q39", "conf": false}, {"id": "mock4-Q40", "src": "정답", "module": "CI", "tag": "voting cap – 집중 소유·분산 지배", "vig": 9, "stem": "The ownership structure that would result from the Firm E transaction is best characterized as having:", "opts": {"A": "dispersed ownership and concentrated control.", "B": "concentrated ownership and dispersed control.", "C": "concentrated ownership and concentrated control."}, "ans": "B", "en": "A. dispersed ownership and concentrated control. — Incorrect\nIncorrect because Client Y will own 51% of Firm E shares, giving the client concentrated ownership. The voting caps will prevent the client from having concentrated control.\nB. concentrated ownership and dispersed control. — Correct\nCorrect because the purpose of voting caps is to limit the voting power and control of large foreign owners. Client Y would be buying 51% of the shares in Firm E—a position that would be subject to 5% voting caps. As a result, the ownership structure of Firm E would be characterized as having concentrated ownership and dispersed control.\nThe combination of concentrated ownership and dispersed voting power arises when there are legal restrictions on the voting rights of large share positions, known as voting caps. A number of sovereign governments have imposed voting caps to deter foreign investors from obtaining controlling ownership positions in strategically important local companies.\nC. concentrated ownership and concentrated control. — Incorrect\nIncorrect because, while Client Y will have concentrated ownership (51% of shares), the voting caps on foreign investors in Firm E will prevent concentrated control.", "ko": "Client Y가 51%를 사면 소유는 집중되지만, 외국인 의결권 5% 상한 때문에 지배(의결권)는 분산된다 → 집중 소유·분산 지배.", "trap": "지분율이 높아도 voting cap이 있으면 지배력은 제한된다.", "f": "", "why": {"A": "51% 보유라 소유는 집중이다.", "C": "voting cap 때문에 지배는 분산."}, "orig": "Mock 4 Session 1 Q40", "conf": true}, {"id": "mock4-Q41", "src": "정답", "module": "FSA", "tag": "지분법 투자 장부가 (초과액 상각)", "vig": 10, "stem": "The estimated amount of Argon's investment in Xenon at the end of the current year should be:", "opts": {"A": "GBP 521.6 million.", "B": "GBP 522.4 million.", "C": "GBP 523.6 million."}, "ans": "A", "en": "A. GBP 521.6 million. — Correct\nCorrect because the estimated amount of Argon's investment in Xenon is determined as follows (in GBP millions):\n1 January purchase price\t500.0\nAdd Argon's share of Xenon's estimated net income for the current year (GBP 60 million × 40%)\t24.0\nLess: Fair value excess of inventory sold during the current year under FIFO (GBP 5 million × 40%)\t(2.0)\nLess: Amortization of excess purchase price attributable to equipment (FV greater than BV): (GBP 10 million/10 years) × 40%\t(0.4)\n31 December investment amount\t521.6\nB. GBP 522.4 million. — Incorrect\nIncorrect because the depreciation for the undervalued equipment is treated as though it was overvalued (500.0 + 24.0 – 2.0 + 0.4 = 522.4).\nC. GBP 523.6 million. — Incorrect\nIncorrect because the deduction for the inventory sold under the FIFO valuation method is omitted from the calculation (500.0 + 24.0 – 0.4 = 523.6).", "ko": "취득가 500 + 순이익 몫 60×40% = 24 − 재고 초과액(FIFO라 올해 모두 판매) 5×40% = 2 − 설비 초과액 상각 (10/10년)×40% = 0.4 → 521.6.", "trap": "설비 상각은 빼야 하고(더하면 522.4), FIFO 재고 초과액도 올해 비용으로 뺀다(빼먹으면 523.6).", "f": "투자 = 취득가 + 지분 × (NI − 초과액 상각) − 배당", "why": {"B": "설비 상각을 더함.", "C": "재고 초과액 차감을 빠뜨림."}, "orig": "Mock 4 Session 1 Q41", "conf": true}, {"id": "mock4-Q42", "src": "정답", "module": "FSA", "tag": "partial vs full goodwill D/E", "vig": 10, "stem": "When consolidating Radon, Argon's D/E ratio at the end of the current year would be:", "opts": {"A": "lower than if it used the method of its primary competitors.", "B": "the same as if it used the method of its primary competitors.", "C": "higher than if it used the method of its primary competitors."}, "ans": "C", "en": "A. lower than if it used the method of its primary competitors. — Incorrect\nIncorrect because total shareholders' equity is lower under the partial goodwill method, thereby increasing the debt-to-equity ratio. Total debt is the same under both methods.\nB. the same as if it used the method of its primary competitors. — Incorrect\nIncorrect because total shareholders' equity is lower under the partial goodwill method, thereby increasing the debt-to-equity ratio. Total debt is the same under both methods.\nC. higher than if it used the method of its primary competitors. — Correct\nCorrect because the value of partial goodwill is less than the value of full goodwill. In this case, Argon uses the partial goodwill method, which is permissible under IFRS, while its primary competitors (which report under US GAAP) are required to use the full goodwill method. Accordingly, Argon's debt-to-equity ratio (Total debt ÷ Total shareholders' equity) will be higher under the partial goodwill method: total shareholders' equity is lower (due to the lower non-controlling interest) compared to that under the full goodwill method, while total debt is the same under both methods.\nIFRS allows two methods for recognizing goodwill at the transaction date. The goodwill option is on a transaction-by-transaction basis. Partial goodwill is measured as the fair value of the acquisition (fair value of consideration given) less the acquirer's share of the fair value of all identifiable tangible and intangible assets, liabilities, and contingent liabilities acquired. Full goodwill is measured as the fair value of the entity as a whole less the fair value of all identifiable tangible and intangible assets, liabilities, and contingent liabilities. US GAAP views the entity as a whole and requires full goodwill.", "ko": "IFRS의 partial goodwill은 US GAAP의 full goodwill보다 goodwill과 비지배지분이 작아 총자본이 작다. 부채는 같으므로 D/E는 partial goodwill 쪽(Argon)이 더 높다.", "trap": "US GAAP 경쟁사는 full goodwill만 쓴다.", "f": "", "why": {"A": "자본이 작아지므로 D/E는 더 높다.", "B": "자본이 달라 D/E가 다르다."}, "orig": "Mock 4 Session 1 Q42", "conf": false}, {"id": "mock4-Q43", "src": "정답", "module": "FSA", "tag": "accruals ratio 추세 (절댓값)", "vig": 10, "stem": "With respect to the trends in the cash-flow-based and the balance-sheet-based accruals ratios, Reinke should conclude that:", "opts": {"A": "only the cash-flow-based accruals ratio has improved.", "B": "only the balance-sheet-based-accruals ratio has improved.", "C": "both the cash-flow-based and the balance-sheet-based accruals ratios have improved."}, "ans": "B", "en": "A. only the cash-flow-based accruals ratio has improved. — Incorrect\nIncorrect because the absolute values of the cash-flow-based accruals ratio have trended further away from zero. This is a deteriorating trend.\nB. only the balance-sheet-based-accruals ratio has improved. — Correct\nCorrect because it is the trend in the absolute values that determines whether the accruals ratios have improved or deteriorated over time. In addition, absolute accruals ratios close to zero (whether positive or negative) are better than ratios that are further away from zero. For Argon, the cash-flow-based accruals ratio (1.1% three years ago, –2.4% two years ago, and –3.6% in the most recent year) is trending further away from zero, while the balance-sheet-based accruals ratio (–4.4% three years ago, –2.9% two years ago, and 2.5% in the most recent year) is trending closer to zero. This means only the balance-sheet-based accruals ratio has improved whereas the cash-flow-based accruals ratio has worsened.\nC. both the cash-flow-based and the balance-sheet-based accruals ratios have improved. — Incorrect\nIncorrect because, while the balance-sheet-based accruals ratio has improved, the absolute values of the cash-flow-based accruals ratios have trended further away from zero. This is a deteriorating trend.", "ko": "accruals ratio는 부호와 상관없이 절댓값이 0에 가까울수록 좋다. 현금흐름 기준: 1.1% → −2.4% → −3.6%로 0에서 멀어짐(악화). 대차대조표 기준: −4.4% → −2.9% → 2.5%로 0에 가까워짐(개선).", "trap": "음수가 커지는 것도 악화다. 부호가 아니라 절댓값을 본다.", "f": "", "why": {"A": "현금흐름 기준은 0에서 멀어져 악화.", "C": "현금흐름 기준은 악화."}, "orig": "Mock 4 Session 1 Q43", "conf": false}, {"id": "mock4-Q44", "src": "정답", "module": "FSA", "tag": "Beneish M-score·Altman Z-score", "vig": 10, "stem": "Regarding the trends in the Altman Z-score and the Beneish M-score, Reinke should conclude that:", "opts": {"A": "only the Altman Z-score has improved.", "B": "only the Beneish M-score has improved.", "C": "both the Altman Z-score and the Beneish M-score have improved."}, "ans": "C", "en": "A. only the Altman Z-score has improved. — Incorrect\nIncorrect because the Beneish M-score has also improved.\nB. only the Beneish M-score has improved. — Incorrect\nIncorrect because the Altman Z-score has also improved.\nC. both the Altman Z-score and the Beneish M-score have improved. — Correct\nCorrect because higher M-scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation. For Argon, the Beneish M-score has become more negative and hence slightly improved each year (–1.76 three years ago, –1.81 two years ago, and –1.93 in the most recent year).\nRegarding Altman's Z-score, the interpretation of the score is that a higher Z-score is better. For Argon, the Altman Z-score has increased and hence improved slightly each year (2.78 three years ago, 2.86 two years ago, and 3.03 in the most recent year).", "ko": "Beneish M-score는 높을수록(덜 음수일수록) 이익 조작 가능성이 크다. −1.76 → −1.81 → −1.93으로 더 음수가 되어 개선. Altman Z-score는 높을수록 좋은데 2.78 → 2.86 → 3.03으로 올라 개선. 둘 다 개선.", "trap": "M-score는 낮아지는(더 음수) 것이 좋은 방향이다.", "f": "", "why": {"A": "M-score도 개선됐다.", "B": "Z-score도 개선됐다."}, "orig": "Mock 4 Session 1 Q44", "conf": false}, {"id": "mock4-Q45", "src": "정답", "module": "PM", "tag": "VaR 해석 (최소 손실)", "vig": 11, "stem": "Based on the measure included in the quarterly report, Stone should expect Brockway to lose:", "opts": {"A": "at least $15.8 million in a day 5% of the time.", "B": "on average $15.8 million in a day 5% of the time.", "C": "at most $15.8 million in a day 5% of the time."}, "ans": "A", "en": "A. at least $15.8 million in a day 5% of the time. — Correct\nCorrect because VaR is the minimum loss that would be expected a certain percentage of the time over a specified period of time, given the assumed market conditions. These are the explicit elements of a VaR statement: the frequency of losses of a given minimum magnitude expressed either in currency or percentage terms. As per the vignette, Brockway should expect to lose at least $15.8 million in a day 5% of the time.\nB. on average $15.8 million in a day 5% of the time. — Incorrect\nIncorrect because $15.8 million is the minimum loss in a day and not the average loss that the fund would expect to experience. These are the explicit elements of a VaR statement: the frequency of losses of a given minimum magnitude expressed either in currency or percentage terms.\nC. at most $15.8 million in a day 5% of the time. — Incorrect\nIncorrect because VaR is the minimum and not the maximum loss that would be expected a certain percentage of the time over a specified period of time, given the assumed market conditions. As per the vignette, Brockway should expect to lose at least $15.8 million in a day 5% of the time.", "ko": "VaR는 주어진 기간에 일정 확률로 발생하는 '최소' 손실이다. 일간 95% VaR $15.8m → 하루에 5% 확률로 최소 $15.8m 이상 잃는다.", "trap": "평균 꼬리 손실은 CVaR, 최대 손실이 아니다.", "f": "", "why": {"B": "평균 손실은 CVaR 개념.", "C": "VaR는 최대가 아니라 최소 손실."}, "orig": "Mock 4 Session 2 Q1", "conf": false}, {"id": "mock4-Q46", "src": "정답", "module": "PM", "tag": "모수적 VaR 계산", "vig": 11, "stem": "The monthly VaR of the equity long–short portfolio at the 95% confidence level is closest to:", "opts": {"A": "$1.8 million.", "B": "$5.4 million.", "C": "$9.1 million."}, "ans": "B", "en": "A. $1.8 million. — Incorrect\nIncorrect because the calculation omits the z-value of 1.65.\nVaR = [E(Rp) – σp](–1)(Portfolio Value)\nThe monthly 5% VaR is incorrectly calculated as:\n[0.738% – 1.100%](–1)($500,000,000) = $1,810,000 ≈ $1.8 million\nB. $5.4 million. — Correct\nCorrect because the variance–covariance method of estimating VaR implies a normal distribution. A 5% VaR lies 1.65 standard deviations to the left of the mean and is thus calculated using the following equation:\nVaR = [E(Rp) – 1.65σp](–1)(Portfolio Value)\nThe monthly 5% VaR is:\n[0.738% – 1.65 × 1.100%](–1)($500,000,000) = $5,385,000 ≈ $5.4 million\nC. $9.1 million. — Incorrect\nIncorrect because the expected return is omitted in the equation for VaR and only volatility is taken into consideration:\nVaR = 1.65σp(Portfolio Value)\nThe monthly 5% VaR is incorrectly calculated as:\n[1.65 × 1.100%] × $500,000,000 = $9,075,000 ≈ $9.1 million", "ko": "분산-공분산 VaR = −[E(R) − 1.65σ] × 포트폴리오 가치 = −[0.738% − 1.65×1.100%] × 500m = −(0.738% − 1.815%) × 500m = 1.077% × 500m = $5.4m.", "trap": "기대수익률을 빼먹으면 9.1m, z값을 빼먹으면 1.8m.", "f": "VaR = [1.65σ − E(R)] × V", "why": {"A": "z = 1.65를 곱하지 않음.", "C": "기대수익률을 무시."}, "orig": "Mock 4 Session 2 Q2", "conf": false}, {"id": "mock4-Q47", "src": "정답", "module": "PM", "tag": "왜도·첨도와 꼬리 위험", "vig": 11, "stem": "Based on the backtesting results, Portfolio 1 has a:", "opts": {"A": "lower volatility of returns than Portfolio 2.", "B": "smaller expected tail loss than Portfolio 2.", "C": "higher probability of large negative returns than Portfolio 2."}, "ans": "C", "en": "A. lower volatility of returns than Portfolio 2. — Incorrect\nIncorrect because Portfolio 1 has a higher standard deviation of returns (1.5%) than Portfolio 2 (0.8%).\nB. smaller expected tail loss than Portfolio 2. — Incorrect\nIncorrect because Portfolio 1 has a larger expected tail loss as measured by CVaR (the average loss conditional on exceeding the VaR cutoff). Portfolio 1 has a CVaR of –6.9% and Portfolio 2 has a CVaR of –2.3%.\nC. higher probability of large negative returns than Portfolio 2. — Correct\nCorrect because Portfolio 1 exhibits excess kurtosis and negative skewness relative to the normal distribution. The kurtosis of 15.8 implies that Portfolio 1 has fat tails or outliers (surprises), thus it is more likely to generate extreme returns than the normal distribution. The skewness of –1.9 suggests that these surprises are more likely to be negative as they sit in the left tail of the distribution, which is longer or fatter than the tail on the right side. Portfolio 2 has kurtosis of 4.6 and positive skewness of 1.1, indicating a lower probability of surprises compared to Portfolio 1, and these surprises are more likely to be positive.", "ko": "Portfolio 1은 첨도 15.8(두꺼운 꼬리)과 왜도 −1.9(왼쪽 꼬리가 길다)라서 큰 음의 수익이 나올 확률이 높다. 표준편차(1.5% > 0.8%)와 CVaR(−6.9% vs −2.3%)도 Portfolio 1이 더 나쁘다.", "trap": "CVaR가 더 음수면 꼬리 손실이 더 크다.", "f": "", "why": {"A": "표준편차 1.5%로 더 높다.", "B": "CVaR −6.9%로 꼬리 손실이 더 크다."}, "orig": "Mock 4 Session 2 Q3", "conf": true}, {"id": "mock4-Q48", "src": "정답", "module": "PM", "tag": "몬테카를로 – 추정 오차", "vig": 11, "stem": "The model used in Stone’s Monte Carlo simulation most likely has a:", "opts": {"A": "large estimation error.", "B": "high specification error.", "C": "low probability of producing extreme return estimates."}, "ans": "A", "en": "A. large estimation error. — Correct\nCorrect because several factors have limited empirical/historical data, which means that it may not be possible to specify these factors accurately. We can specify a highly complex model with many parameters (all of which need to be estimated/calibrated from historical data) that describe the empirical properties of the data well. Given limited historical data, however, we may be unable to estimate all the underlying parameters with sufficient precision. Such models tend to have low specification errors, but they suffer from large estimation errors.\nB. high specification error. — Incorrect\nIncorrect because high specification error arises when the model is overly simplistic.\nOverly simplistic models require fewer parameters (therefore, they might have low estimation errors), but they may not fit the data well (because they are mis-specified). Stone’s model is complex and has ten key decision variables.\nC. low probability of producing extreme return estimates. — Incorrect\nIncorrect because a multivariate Student’s t-distribution is used, which has fatter tails than the normal distribution and accounts for a higher probability of extreme events. The Student’s t-distribution is a natural extension of the multivariate normal distribution, because it has the ability to account for the skewness and the excess kurtosis often observed in factor and asset return data. Excess kurtosis indicates a higher probability of extreme events.", "ko": "요인이 10개나 되는 복잡한 모형인데 여러 요인의 과거 데이터가 부족하다. 복잡한 모형은 설정 오차(specification error)는 작지만, 많은 모수를 적은 데이터로 추정해야 해서 추정 오차(estimation error)가 크다.", "trap": "설정 오차는 모형이 너무 단순할 때 커진다. t-분포는 꼬리가 두꺼워 극단값을 더 잘 만든다.", "f": "", "why": {"B": "설정 오차는 단순한 모형의 문제.", "C": "Student's t-분포는 극단값 확률이 더 높다."}, "orig": "Mock 4 Session 2 Q4", "conf": true}, {"id": "mock4-Q49", "src": "정답", "module": "ECO", "tag": "커버드 금리평가 – 헤지 수익률", "vig": 12, "stem": "Assuming covered interest rate parity holds, the all-in annualized USD return that Tian should earn on the AUD deposit is closest to:", "opts": {"A": "0.26%.", "B": "0.36%.", "C": "0.67%."}, "ans": "B", "en": "A. 0.26%. — Incorrect\nIncorrect because 0.26% is the 3-month annualized USD reference rate, but the AUD deposit has a term of 6 months. Candidates who mix up the time duration of placement and maturity of the deposit, but do not overlook the fact that the question asks for the rate of return in USD terms, may incorrectly select this answer option.\nB. 0.36%. — Correct\nCorrect because if covered interest rate parity holds, then the all-in investment return to a USD-based investor like Tian in a 6-month, fully hedged AUD-reference-rate-based deposit would be identical to the return on a 6-month US-reference-rate-based deposit. In this case, the 6-month annualized USD reference rate is 0.36%, and hence 0.36% is the right answer.\nNote that in this case, interest rates have remained unchanged over the last 3 months. So the rates given in the exhibit are the rates which prevail today, and are the same as the rates which prevailed 3 months ago.\nC. 0.67%. — Incorrect\nIncorrect because 0.67% is the 6-month annualized AUD reference rate. Candidates who overlook the fact that the question asks for the rate of return in USD terms may incorrectly select this answer option.", "ko": "커버드 금리평가가 성립하면, 완전 헤지한 6개월 AUD 예금의 USD 기준 수익률은 6개월 USD 금리와 같다 → 0.36%. 금리가 3개월 동안 변하지 않아 표의 6개월 금리가 처음 금리와 같다.", "trap": "AUD 금리(0.67%)는 USD 기준 수익률이 아니다. 3개월 금리와도 헷갈리지 않는다.", "f": "", "why": {"A": "3개월 USD 금리.", "C": "6개월 AUD 금리."}, "orig": "Mock 4 Session 2 Q5", "conf": true}, {"id": "mock4-Q50", "src": "정답", "module": "ECO", "tag": "캐리 트레이드 수익률", "vig": 12, "stem": "The expected 1-year all-in USD return from the KHR/USD carry trade is closest to:", "opts": {"A": "−1.49%.", "B": "−0.67%.", "C": "0.83%."}, "ans": "B", "en": "A. −1.49%. — Incorrect\nIncorrect because the candidate has mistakenly used the interest rate of the US in calculating investment growth.\nFor this candidate,\nStep 1: Tian borrows in USD (assume she borrows USD 1)\nStep 2: Tian converts borrowed USD to KHR at current spot rate (USD 1 = KHR 4,100)\nStep 3: Tian invests converted KHR at 0.67% p.a.\nStep 4 (wrong): At the end of 1 year, Tian's investment grows to\nStep 5: Tian reconverts the investments from KHR to USD at the then prevailing spot rate to get back USD\nStep 6: Tian needs to repay her USD borrowings with interest, amounting to USD 1.0067.\nStep 7: Calculation of all-in-rate-of-return\nInitial investment: USD 1\nLoss on investment:\nRate of return\nB. −0.67%. — Correct\nCorrect because the candidate uses the correct exchange rates and interest rates, as per the following steps:\nStep 1: Tian borrows in USD (assume she borrows USD 1)\nStep 2: Tian converts borrowed USD to KHR at current spot rate (USD 1 = KHR 4,100)\nStep 3: Tian invests converted KHR at 1.5% p.a.\nStep 4: At the end of 1 year, Tian's investment grows to\n(1+0.015)×4100=KHR4161.50\nStep 5: At the end of 1 year, Tian converts KHR back to USD at the then-prevailing spot rate (her expected spot rate of KHR 4,161.50 = USD 1). She ends up with USD 1, the same amount she began with in Step 1.\nStep 6: Tian needs to pay back the borrowed USD with interest\n=(1+0.0067)×1=USD1.0067\nStep 7: Calculation of all-in-rate-of-return\nInitial investment (in step 1): USD 1\nLoss on investment\n=USD1-USD1.0067=-USD0.0067\nRate of return\n=(-0.0067/1)×100=-0.67%\nC. 0.83%. — Incorrect\nIncorrect because the candidate simply subtracts the interest rate differentials without giving any importance to the spot rates.\nSpecifically for this candidate, the USD interest rate is 0.67% and the KHR rate is 1.50%. The difference between these two rates is 0.83%. This candidate erroneously believes that this interest rate differential is the rate of return on the carry trade.", "ko": "USD 1을 0.67%에 빌려 KHR 4,100으로 바꿔 1.50%에 투자 → 1년 뒤 4,100 × 1.015 = 4,161.50 KHR. 예상 환율 4,161.50으로 바꾸면 USD 1. 빌린 돈 상환 1.0067 → 손실 0.0067 → 수익률 −0.67%. KHR 약세가 금리차를 정확히 상쇄했다.", "trap": "금리차(0.83%)만 보면 안 되고 예상 환율 변화를 반영한다.", "f": "수익 ≈ (1 + i_투자) × S0/S1 − (1 + i_차입)", "why": {"A": "KHR 투자에 USD 금리를 씀.", "C": "환율 변화를 무시하고 금리차만 계산."}, "orig": "Mock 4 Session 2 Q6", "conf": true}, {"id": "mock4-Q51", "src": "정답", "module": "ECO", "tag": "삼각 차익거래", "vig": 12, "stem": "Based on Exhibit 2, does a triangular arbitrage opportunity exist?", "opts": {"A": "No", "B": "Yes, by buying KHR from Dealer 1 and selling it to Dealer 2", "C": "Yes, by buying KHR from Dealer 2 and selling it to Dealer 1"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because an arbitrage opportunity does exist by buying KHR from Dealer 2 and selling it to Dealer 1.\nB. Yes, by buying KHR from Dealer 1 and selling it to Dealer 2 — Incorrect\nIncorrect because buying KHR from Dealer 1 is more expensive than buying KHR from Dealer 2. Doing this transaction would imply buying KHR at 0.0266 JPY and selling at 0.0250 JPY, thereby making a loss for every KHR bought and sold.\nC. Yes, by buying KHR from Dealer 2 and selling it to Dealer 1 — Correct\nCorrect because the candidate correctly inverts the given exchange rates to calculate the cross rate, and correctly compares this cross rate with the available quote from Dealer 2 to arrive at the right answer. The specific steps followed by the candidate to get at the right answer are as follows:\nStep 1:\nIn the process of inverting, bid and offer rates will get swapped.\nHence,\nStep 2: Calculation of Dealer 1's implied cross rate\nHence,\nand\nStep 3: Compare Dealer 1's implied cross rate with the quote of 0.0250/0.0256 from Dealer 2.\nConclusion: Buy KHR from Dealer 2 at 0.0256 JPY, and sell it to Dealer 1 at 0.0259 JPY.\nRiskless profit = 0.0259 - 0.0256 = 0.0003 JPY (3 pips) per KHR", "ko": "Dealer 1의 JPY/KHR 교차환율: bid = 107.64/4,156 = 0.0259, ask = 107.65/4,043 = 0.0266. Dealer 2는 0.0250/0.0256. Dealer 2에서 KHR을 0.0256에 사서 Dealer 1에 0.0259에 팔면 KHR당 0.0003 JPY 무위험 이익.", "trap": "교차환율 bid는 분모에 ask를 넣어 구한다(나누면 bid·ask가 바뀜).", "f": "JPY/KHR bid = (JPY/USD bid)/(KHR/USD ask), ask = (JPY/USD ask)/(KHR/USD bid)", "why": {"A": "Dealer 2 ask < Dealer 1 bid라서 차익이 있다.", "B": "Dealer 1에서 0.0266에 사서 0.0250에 팔면 손실."}, "orig": "Mock 4 Session 2 Q7", "conf": false}, {"id": "mock4-Q52", "src": "정답", "module": "ECO", "tag": "Mundell–Fleming (낮은 자본이동성)", "vig": 12, "stem": "Based on Tian's conclusion and the Mundell–Fleming model, Country L's currency will most likely:", "opts": {"A": "depreciate.", "B": "not change.", "C": "appreciate."}, "ans": "C", "en": "A. depreciate. — Incorrect\nIncorrect. Candidates who mix up between the effects of expansionary and contractionary fiscal and monetary policies under conditions of low capital mobility may incorrectly believe that the currency of country L will depreciate. This will happen only if the fiscal and monetary policies are expansionary, and not contractionary as the case suggests.\nB. not change. — Incorrect\nIncorrect. An unprepared candidate, or a candidate who misses the condition of low capital mobility may choose this answer. Under conditions of high capital mobility and combination of restrictive fiscal and monetary policies, the direction of exchange rates is indeterminate.\nC. appreciate. — Correct\nCorrect because under conditions of low capital mobility, the combination of restrictive monetary and fiscal policy will be bullish for a currency. This policy mix will tend to reduce imports, leading to an improvement in the trade balance.", "ko": "자본 이동성이 낮으면 환율은 주로 무역수지로 결정된다. 긴축 재정·긴축 통화는 수입을 줄여 무역수지를 개선하므로 통화 강세.", "trap": "자본 이동성이 높을 때 긴축 재정·긴축 통화 조합은 방향이 불확실하다.", "f": "", "why": {"A": "확장 정책일 때 약세.", "B": "자본 이동성이 높을 때 불확실한 경우와 혼동."}, "orig": "Mock 4 Session 2 Q8", "conf": true}, {"id": "mock4-Q53", "src": "오답", "module": "FI", "tag": "신용 스프레드 기간구조 모양", "vig": 13, "stem": "The term structure of credit spreads is most likely upward sloping for:", "opts": {"A": "Company A.", "B": "Company B.", "C": "Company C."}, "ans": "A", "en": "A. Company A. — Correct\nCorrect because positive-sloped credit spread curves are likely when a high-quality issuer with a strong competitive position in a stable industry has low leverage, strong cash flow, and a high profit margin. This type of issuer tends to exhibit very low short-term credit spreads rising with increasing maturity given greater uncertainty due to the macroeconomic environment, potential adverse changes in the competitive landscape, technological change or other factors that drive a higher implied probability of default over time. In addition, one might expect the credit curve to steepen for a borrower refinancing near-term maturities with long-term debt.\nB. Company B. — Incorrect\nIncorrect because an inverted credit spread curve is typical for a company undergoing a leveraged buyout. For example, an ownership change resulting from a leveraged buyout or private equity acquisition may often be accompanied by a significant increase of leverage. In such a case, an inverted credit curve may indicate investor expectations that the new owners will create efficiencies in the restructured organization, leading to improved future cash flows and profitability that will benefit debt investors.\nC. Company C. — Incorrect\nIncorrect because an inverted credit spread curve is typical for a company at the bottom of the economic cycle. Another example of an inverted credit term structure might result when issuers in a historically cyclical industry (such as oil and gas exploration or retail) find themselves at the bottom of an economic cycle, with investor expectations of a recovery in the industry tied to improving credit spreads over time.", "ko": "Company A는 경쟁력이 강하고 안정적인 우량 발행사라 단기 스프레드가 매우 낮고 만기가 길수록 불확실성이 커져 우상향한다. 단기 부채를 장기로 차환하면 곡선이 더 가팔라진다. LBO 기업(B)과 경기 바닥의 경기순환 기업(C)은 앞으로 좋아질 것으로 기대되어 역전(우하향) 곡선이 일반적.", "trap": "LBO·경기 바닥 기업은 회복 기대로 역전 곡선.", "f": "", "why": {"B": "LBO 후 개선 기대 → 역전 곡선.", "C": "경기 바닥 기업 → 역전 곡선."}, "orig": "Mock 4 Session 2 Q9", "conf": true, "my": "C"}, {"id": "mock4-Q54", "src": "정답", "module": "FI", "tag": "CVA로 신용 스프레드 계산", "vig": 13, "stem": "The credit spread for Company A's zero-coupon bond is closest to:", "opts": {"A": "0.15%.", "B": "0.72%.", "C": "0.76%."}, "ans": "C", "en": "A. 0.15%. — Incorrect\nIncorrect because the credit valuation adjustment is divided by 5.\n(1) The present value of the default-risk-free bond is 100/1.04^5 = 82.1927\n(2) Incorrectly subtracting only 1/5 of the credit valuation adjustment yields 82.1927 – 2.924/5 = 81.6079\n(3) Hence the yield on the corporate bond is calculated as (100/81.6079)^0.2 – 1 = 4.149%\n(4) Subtracting the default-risk-free discount rate of 4%: 4.149% – 4% = 0.149% ≈ 0.15%\nB. 0.72%. — Incorrect\nIncorrect because the credit valuation adjustment is added to the present value of the default-risk-free bond, rather than subtracted, and the resulting yield is subtracted from the 4% risk-free yield—not the reverse.\n(1) The present value of the corresponding risk-free bond is 100/1.04^5 = 82.1927\n(2) Incorrectly adding the credit valuation adjustment yields 82.1927 + 2.924 = 85.1167\n(3) Hence the yield on the corporate bond is calculated as (100/85.1167)^0.2 – 1 = 3.2754%\n(4) Subtracting this value from 4.00% yields 4% – 3.2754% = 0.7246% ≈ 0.72%\nC. 0.76%. — Correct\nCorrect because calculating the spread requires (1) determining the present value of the default-risk-free bond, (2) subtracting the credit valuation adjustment, (3) calculating the yield on the corporate bond, and (4) determining the spread.\nThe calculation is as follows:\n(1) The present value of the default-risk-free bond is 100/1.04^5 = 82.1927\n(2) Subtracting the credit valuation adjustment yields 82.1927 – 2.924 = 79.2687\n(3) Hence the yield on the corporate bond is (100/79.2687)^0.2 – 1 = 4.756%\n(4) Subtracting the default-risk-free discount rate of 4%: 4.756% – 4% = 0.756% ≈ 0.76%", "ko": "무위험 채권 가치 = 100/1.04^5 = 82.19. CVA를 빼면 82.19 − 2.924 = 79.27. 회사채 수익률 = (100/79.27)^(1/5) − 1 = 4.756%. 스프레드 = 4.756% − 4% = 0.76%.", "trap": "CVA는 더하지 않고 뺀다. 5로 나누지 않는다.", "f": "회사채 가격 = 무위험 가치 − CVA", "why": {"A": "CVA를 5로 나눠 뺌.", "B": "CVA를 더하고 차이를 거꾸로 계산."}, "orig": "Mock 4 Session 2 Q10", "conf": false}, {"id": "mock4-Q55", "src": "정답", "module": "FI", "tag": "CDS 손익 근사", "vig": 13, "stem": "The estimated loss on the CDS trade on Company B is closest to:", "opts": {"A": "$481,000.", "B": "$650,000.", "C": "$814,000."}, "ans": "A", "en": "A. $481,000. — Correct\nCorrect because the approximate loss on the trade is calculated as follows:\nEstimated loss = Change in credit spread × Duration × Notional amount\n= (220 bps – 350 bps) × 3.7 × $10 million = –130 bps × 3.7 × $10 million = –$481,000.\nB. $650,000. — Incorrect\nIncorrect because the term to maturity of 5 years is used instead of duration:\nEstimated loss = Change in credit spread × Term to maturity × Notional amount\n= (220 bps – 350 bps) × 5.0 × $10 million = –130 bps × 5.0 × $10 million = –$650,000.\nC. $814,000. — Incorrect\nIncorrect because the negative ending spread of 220 bps is used instead of the change in the spread:\nEstimated loss = –Ending credit spread × Duration × Notional amount\n= –220 bps × 3.7 × $10 million = –220 bps × 3.7 × $10 million = –$814,000.", "ko": "보호 매수자는 스프레드가 좁아지면 손실. 손익 ≈ 스프레드 변화 × 듀레이션 × 명목 = (220 − 350)bp × 3.7 × 10m = −0.013 × 3.7 × 10m = −$481,000.", "trap": "만기 5년이 아니라 듀레이션 3.7을 쓴다.", "f": "ΔValue ≈ −Δspread × duration × notional (보호 매수자 기준)", "why": {"B": "듀레이션 대신 만기 5년.", "C": "스프레드 변화 대신 현재 스프레드 220bp."}, "orig": "Mock 4 Session 2 Q11", "conf": true}, {"id": "mock4-Q56", "src": "정답", "module": "FI", "tag": "CDS 최저가 인도 채권", "vig": 13, "stem": "The cheapest-to-deliver obligation for the CDS contract on the Company C senior unsecured bond is:", "opts": {"A": "Bond 1.", "B": "Bond 2.", "C": "Bond 3."}, "ans": "B", "en": "A. Bond 1. — Incorrect\nIncorrect because Bond 1 is subordinated and therefore does not qualify as the cheapest-to-deliver obligation under the CDS.\nB. Bond 2. — Correct\nCorrect because Bond 2 is the lowest-priced instrument that has the same seniority as the reference obligation. The payoff of the CDS is determined by the cheapest-to-deliver obligation, which is the debt instrument that can be purchased and delivered at the lowest cost but has the same seniority as the reference obligation. Bond 2 (trading at 35% of par) has a lower cost than Bond 3 (trading at 45% of par) and has the same seniority as the Company C bond.\nC. Bond 3. — Incorrect\nIncorrect because Bond 3 is priced higher than Bond 2. The two bonds are of the same seniority and therefore the payoff of the CDS is determined by the cheapest-to-deliver obligation.", "ko": "인도 가능 채권은 기준 채무와 같은 순위(선순위 무담보)여야 한다. Bond 2(35%)와 Bond 3(45%) 중 더 싼 Bond 2가 최저가 인도 채권. Bond 1은 후순위라 인도 대상이 아니다.", "trap": "만기가 달라도 순위가 같으면 인도 가능하다. 가장 싼 후순위 채권은 안 된다.", "f": "", "why": {"A": "후순위라 자격 없음.", "C": "Bond 2보다 비싸다."}, "orig": "Mock 4 Session 2 Q12", "conf": false}, {"id": "mock4-Q57", "src": "정답", "module": "EQ", "tag": "FCFE vs FCFF 선택", "vig": 14, "stem": "Which approach is the most appropriate to value equity of the stocks Bernel is analyzing?", "opts": {"A": "FCFE for both Ariel Ports and Boston Terminals", "B": "FCFE for Boston Terminals and FCFF for Ariel Ports", "C": "FCFE for Ariel Ports and FCFF for Boston Terminals"}, "ans": "C", "en": "A. FCFE for both Ariel Ports and Boston Terminals — Incorrect\nIncorrect because FCFF should be used for Boston Terminals. FCFF estimation is easier than FCFE estimation when the firm's leverage is changing. FCFE is less appropriate to value the equity of Boston Terminals than FCFF due to its changing capital structure. Boston Terminal's capital structure is changing and amounts of borrowings will be fluctuating in the medium-term. Therefore, FCFF will be more appropriate to use. Also, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify.\nB. FCFE for Boston Terminals and FCFF for Ariel Ports — Incorrect\nIncorrect because FCFF should be used for Boston Terminals and FCFE should be used for Ariel Ports.\nFCFF estimation is easier than FCFE estimation when the firm's leverage is changing. Large swings in net borrowings will cause large changes in FCFE and interest expense. In addition, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify. Boston Terminal's capital structure is changing and amounts of borrowings will be fluctuating in the medium-term. Therefore, FCFF will be more appropriate to use.\nAn analyst may prefer to use one approach rather than the other because of the characteristics of the company being valued. For example, if the company's structure is relatively stable, using FCFE to value equity is more direct and simpler than using FCFF. Ariel Ports is an established business with steadily growing cash flows and a capital structure that is stable. I.e. it maintains a moderate leverage. Therefore, the use of FCFE is preferred.\nC. FCFE for Ariel Ports and FCFF for Boston Terminals — Correct\nCorrect because the two stocks should be valued by with the following approaches:\nFCFE for Ariel Ports\nAn analyst may prefer to use one approach rather than the other because of the characteristics of the company being valued. For example, if the company's structure is relatively stable, using FCFE to value equity is more direct and simpler than using FCFF. Ariel Ports is an established business with steadily growing cash flows and a capital structure that is stable. I.e. it maintains a moderate leverage. Therefore, the use of FCFE is preferred.\nFCFF for Boston Terminals\nFCFF estimation is easier than FCFE estimation when the firm's leverage is changing. Large swings in net borrowings will cause large changes in FCFE and interest expense. In addition, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify. Boston Terminal's capital structure is changing and amounts of borrowings will be fluctuating in the medium-term. Therefore, FCFF will be more appropriate to use.", "ko": "Ariel은 레버리지가 안정적이고 현금흐름이 꾸준히 늘어 FCFE로 자기자본을 직접 평가하는 것이 간단하다. Boston은 신규 부채 후 상환으로 자본 구조가 바뀌므로 순차입이 크게 변해 FCFE가 흔들린다 → FCFF가 적절.", "trap": "레버리지가 변하는 회사는 FCFF.", "f": "", "why": {"A": "Boston은 레버리지가 변해 FCFF가 적절.", "B": "두 회사를 거꾸로 짝지음."}, "orig": "Mock 4 Session 2 Q13", "conf": false}, {"id": "mock4-Q58", "src": "오답", "module": "EQ", "tag": "IFRS 이자 분류와 FCFF", "vig": 14, "stem": "Ariel Port's FCFF is closest to:", "opts": {"A": "$1,462 million.", "B": "$1,645 million.", "C": "$1,816 million."}, "ans": "A", "en": "A. $1,462 million. — Correct\nCorrect because the FCFF for Ariel Port can be calculated as follows:\nFCFF = CFO - CFInv\nwhere, CFO = Cash flow from operations = 1,831.6\nCFInv = Cash flow from operations = 370\nFCFF = 1,831.6 - 370 = $1,461.6 million\nNote: Ariel Port reports under IFRS and classifies its interest expenses as cash flow from financing activities. In this case to estimate FCFF by starting with CFO, it is not necessary to add interest when CFO is the starting point.\nB. $1,645 million. — Incorrect\nIncorrect because in the FCFF calculation, interest expense is mistakenly added back to cash flow from operations and as a result is double counted.\nThe incorrect calculation of FCFF is thus:\nFCFF = CFO + Interest Expense (1-Tax rate) - CFInv\nFCFF = 1,831.6 + 262*(1-30%) - 370 = $1,645 million\nC. $1,816 million. — Incorrect\nIncorrect because this is the FCFE equation which adds net borrowing.\nNet borrowing is calculated as: new borrowings - repayment of borrowings = 2,298.0 - 1,944.0 = 354\nFCFE = CFO - FCInv + Net borrowing = 1,831.6 - 370 + 354 = $1,815.6 million", "ko": "Ariel은 IFRS로 이자 지급을 재무활동으로 분류했다(CFO에서 이미 빠지지 않음). 그래서 CFO에서 시작할 때 이자를 다시 더하지 않는다. FCFF = CFO − FCInv = 1,831.6 − 370 = $1,461.6m.", "trap": "IFRS에서 이자를 재무활동으로 분류하면 이자를 더하면 이중 계산.", "f": "FCFF = CFO + Int(1 − t) − FCInv (이자가 CFO에서 차감된 경우만 더함)", "why": {"B": "이자를 다시 더해 이중 계산.", "C": "순차입을 더한 FCFE."}, "orig": "Mock 4 Session 2 Q14", "conf": true, "my": "B"}, {"id": "mock4-Q59", "src": "오답", "module": "EQ", "tag": "2단계 FCFF 주당 가치", "vig": 14, "stem": "Based on her assumptions for Boston Terminals competitor, Bernal should conclude that the stock is:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "A", "en": "A. undervalued. — Correct\nCorrect because the fair value of the Boston Terminals competitor is $27.1 per share whereas the shares are currently trading at $24.1 per share.\nThe equity value is the value of the firm minus the market value of its debt plus the market value of its non-operating assets:\nEquity value = Value of operating assets + MV of non-operating assets - MV of debt\nThe value of operating assets can be calculated in a two-stage free cash flow model. The two-stage model is appropriate for Boston Terminals because its FCFF exhibit higher growth in the first two years and dropping to the long-run sustainable rate of 3% thereafter (Stage 2).\nValue of operating assets =\n- free cash flow to firm in Year t\nWACC - weighted average cost of capital\ng - long-term growth rate\n\tY1\tY2\tY3\nFCFF\t368\t442\t455\nDiscount factor\t0.89\t0.80\t0.80\nTV\t\t\t5,053.9\nPV at 12%\t328.6\t352.0\t4,028.9\nFirm value / value of operating assets\t4,709.5\t\t\nUsing the equation and the exhibit above, equity value is calculated as follows:\nFirm Value=\nEquity value = Value of operating assets + MV of non-operating assets - MV of debt\nEquity value = 4,709.5 + 300 - 2,300 = $2,709.5 million\nShare price = $2,709.5 million/100 million shares = $27.1.\nB. fairly valued. — Incorrect\nIncorrect because the fair value of the Boston Terminals competitor is $27.1 per share whereas the shares are currently trading at $24.1 per share. The correct calculation of equity value = Value of operating assets + MV of non-operating assets - MV of debt. However, if the MV of non-operating assets is mistakenly omitted from the formula, this will lead to:\nEquity value = Value of operating assets - MV of debt\nEquity value = 4,709.5 - 2,300 = 2,409.5\nShare price = $2,409.5 million/100 million shares = $24.1.\nC. overvalued. — Incorrect\nIncorrect because the fair value of the Boston Terminals competitor is $27.1 per share whereas the shares are currently trading at $24.1 per share. The correct calculation of equity value = Value of operating assets + MV of non-operating assets - MV of debt. However, if book value of debt is mistakenly used instead of MV of debt, this will lead to:\nEquity value = Value of operating assets + Value of non-operating assets - Book Value of debt\nEquity value = 4,709.5 + 300 - 2,000 = 3,009.5\nShare price = $3,009.5 million/100 million shares = $30.1.", "ko": "FCFF1 368, FCFF2 442, FCFF3 = 442 × 1.03 = 455.3. TV2 = 455.3/(0.12 − 0.03) = 5,059 정도. 영업자산 가치 = 368/1.12 + (442 + TV)/1.12^2 ≈ 4,710. 자기자본 = 4,710 + 비영업자산 300 − 부채 시가 2,300 = 2,710 → 주당 $27.1 > 시장가 $24.1 → 저평가.", "trap": "비영업자산을 빠뜨리면 $24.1(적정), 부채 장부가를 쓰면 $30.1.", "f": "Equity = Σ FCFF/(1+WACC)^t + 비영업자산 − 부채 시가", "why": {"B": "비영업자산 300을 더하지 않음.", "C": "고평가 근거가 없다. 내재가치 $27.1 > 시장가 $24.1 (부채 장부가를 쓰면 $30.1)."}, "orig": "Mock 4 Session 2 Q15", "conf": true, "my": "B"}, {"id": "mock4-Q60", "src": "정답", "module": "EQ", "tag": "부채 발행·자사주 매입과 FCFF·FCFE", "vig": 14, "stem": "The competitor's anti-takeover measures against the acquisition by Boston Terminals will:", "opts": {"A": "increase FCFF and decrease FCFE.", "B": "not impact FCFF and increase FCFE.", "C": "not impact FCFF and decrease FCFE."}, "ans": "B", "en": "A. increase FCFF and decrease FCFE. — Incorrect\nIncorrect because an increase in debt and share buy-backs are cash flows available to all investors, including shareholders, and as a result have no effect on FCFF. An increase in net borrowings increases FCFE in the year of issuance.\nB. not impact FCFF and increase FCFE. — Correct\nCorrect because an increase in debt and share buy-backs are cash flows available to all investors, including shareholders, and as a result have no effect on FCFF. An increase in net borrowings increases FCFE in the year of issuance. This can be illustrated by examining the uses of free cash flows:\nUses of FCFF:\nIncreases in cash balances\nPlus: net payments to providers of debt capital (repayments - new borrowings + after-tax interest expense)\nPlus: payments to providers of equity capital (dividends plus share buy-back minus new share issuance)\nUses of FCFE:\nIncreases in cash balances\nPlus: payments to providers of equity capital (dividends plus share buy-back minus new share issuance)\nC. not impact FCFF and decrease FCFE. — Incorrect\nIncorrect because an increase in debt and share buy-backs are cash flows available to all investors, including shareholders, and as a result have no effect on FCFF. An increase in net borrowings increases FCFE in the year of issuance.", "ko": "부채를 발행해 자사주를 사는 것은 자금 조달·분배 활동이라 FCFF에는 영향이 없다. FCFE = FCFF − 이자(1 − t) + 순차입이므로 발행 연도에는 순차입만큼 FCFE가 늘어난다.", "trap": "자사주 매입은 FCFE의 '사용'이지 FCFE를 줄이지 않는다.", "f": "FCFE = FCFF − Int(1 − t) + 순차입", "why": {"A": "FCFF는 변하지 않는다.", "C": "순차입 증가로 FCFE는 늘어난다."}, "orig": "Mock 4 Session 2 Q16", "conf": true}, {"id": "mock4-Q61", "src": "정답", "module": "ETH", "tag": "I(B) 고객 선물 – 고용주 공개", "vig": 15, "stem": "Do Li's actions regarding the tickets violate the Standard relating to independence and objectivity?", "opts": {"A": "No", "B": "Yes, because Li should have refused the tickets", "C": "Yes, because Li should have notified her supervisor"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Li did not disclose the gift from the client to her employer.\nB. Yes, because Li should have refused the tickets — Incorrect\nIncorrect because Li does not have to refuse the tickets in order to be consistent with Standard I(B) - Independence and Objectivity, but she does have to disclose the gift to her employer. Members may accept gifts from clients as long as they disclose them to their employer because gifts in a client relationship are deemed less likely to affect a member's objectivity and independence than gifts in other situations.\nC. Yes, because Li should have notified her supervisor — Correct\nCorrect because Li violated Standard I(B) - Independence and Objectivity as she did not disclose the gift from a client to her employer. A gift from a client could be considered supplementary compensation. When possible, prior to accepting 'bonuses' or gifts from clients, members and candidates should disclose to their employers such benefits offered by clients. If notification is not possible prior to acceptance, members and candidates must disclose to their employer benefits previously accepted from clients.", "ko": "고객이 준 선물은 고객 관계 안의 것이라 객관성을 해칠 가능성이 낮아 받아도 된다. 다만 고용주에게 알려야 한다(가능하면 받기 전에, 아니면 받은 뒤라도). Li는 상사에게 알리지 않았으므로 I(B) 위반.", "trap": "고객 선물은 거절할 필요가 없고 공개만 하면 된다.", "f": "", "why": {"A": "고용주에게 공개하지 않았다.", "B": "거절할 의무는 없다."}, "orig": "Mock 4 Session 2 Q17", "conf": false}, {"id": "mock4-Q62", "src": "정답", "module": "ETH", "tag": "I(C) 표절 – 출처 미표기", "vig": 15, "stem": "By including the table in her investment report, did Li violate the Standard relating to misrepresentation?", "opts": {"A": "No", "B": "Yes, by not citing the source", "C": "Yes, by not verifying the statistical analysis"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because Li committed plagiarism by mispresenting the statistical analysis in the table as her own work.\nB. Yes, by not citing the source — Correct\nCorrect because Li violated Standard I(C) - Misrepresentation by committing plagiarism when she included the table in her report without citing the source, thereby implying it was her own work. Plagiarism involves copying substantially the same materials prepared by others without acknowledging the source.\nC. Yes, by not verifying the statistical analysis — Incorrect\nIncorrect because failing to verify the statistical analysis is not a violation of Standard I(C) - Misrepresentation. Because the statistical analysis table is from a reputable source (a well-recognized industry journal), under Standard V(A) - Diligence and Reasonable Basis, it can reasonably be relied upon without Li having to verify the analysis for herself.\nWhen providing information to clients from a third party, members and candidates share a responsibility for the accuracy of the marketing and distribution materials that pertain to the third party’s capabilities, services, and products.", "ko": "다른 사람이 만든 표를 출처 없이 보고서에 넣으면 자기 작업처럼 보이게 하는 표절 → I(C) 위반. 신뢰할 수 있는 업계 저널의 분석이므로 직접 검증하지 않은 것은 문제가 아니다.", "trap": "평판 있는 출처의 자료는 검증 없이 쓸 수 있지만 출처는 반드시 밝힌다.", "f": "", "why": {"A": "출처를 밝히지 않아 표절.", "C": "신뢰할 출처라 검증 의무는 없다."}, "orig": "Mock 4 Session 2 Q18", "conf": true}, {"id": "mock4-Q63", "src": "오답", "module": "ETH", "tag": "V(A) 사내 모형·제3자 데이터", "vig": 15, "stem": "By using MCIB's proprietary model in her analysis, does Li violate the Standard relating to diligence and reasonable basis?", "opts": {"A": "No", "B": "Yes, because she lacks the relevant programming skills", "C": "Yes, because she does not verify the third-party data used in the model"}, "ans": "A", "en": "A. No — Correct\nCorrect because Li's actions do not violate Standard V(A) - Diligence and Reasonable Basis.\nShe is not required to become an expert in programming. It is sufficient for her to understand the assumptions and limitations of the model. From the curriculum: Members and candidates need to have an understanding of the parameters used in models and quantitative research that are incorporated into their investment recommendations. Although they are not required to become experts in every technical aspect of the models, they must understand the assumptions and limitations inherent in any model and how the results were used in the decision-making process.\nIn addition, Li is not required to verify the third-party data used in the proprietary model herself, as her company has in place a procedure for verifying the third-party information. A member or candidate may rely on others in his or her firm to determine whether secondary or third-party research is sound and use the information in good faith.\nB. Yes, because she lacks the relevant programming skills — Incorrect\nIncorrect because Li is not required to become an expert in every technical aspect of the proprietary model. It is sufficient for her to understand the assumptions and limitations of the model.\nC. Yes, because she does not verify the third-party data used in the model — Incorrect\nIncorrect because Li's firm has a procedure for verifying third-party information. Standard V(A) - Diligence and Reasonable Basis does not require verification of the data by Li.", "ko": "모형의 프로그래밍까지 알 필요는 없고 가정과 한계를 이해하면 된다. Li는 이를 이해하고 있다. 제3자 데이터도 회사에 검증 절차가 있으므로 그 절차에 기대어 선의로 쓸 수 있다 → 위반 아님.", "trap": "회사에 검증 절차가 있으면 개인이 직접 데이터를 검증할 필요는 없다.", "f": "", "why": {"B": "기술 전문가일 필요는 없다.", "C": "회사의 검증 절차에 의존할 수 있다."}, "orig": "Mock 4 Session 2 Q19", "conf": true, "my": "C"}, {"id": "mock4-Q64", "src": "정답", "module": "ETH", "tag": "II(B) 시장 조작 여부", "vig": 15, "stem": "Are the portfolio manager's actions with regard to Godoggo shares a violation of the Standard relating to market manipulation?", "opts": {"A": "No", "B": "Yes, because he engaged in transaction-based market manipulation", "C": "Yes, because he engaged in information-based market manipulation"}, "ans": "A", "en": "A. No — Correct\nCorrect because the portfolio manager did not violate Standard II(B) - Market Manipulation based on his stock purchase and subsequent sale or his online promotion of the stock.\nFirst, the portfolio manager did not engage in transaction-based manipulation because his purchase was based on Li's report and was not an attempt to manipulate the share price. Transaction-based manipulation includes transactions that artificially affect prices or volume to give the impression of activity or price movement in a financial instrument, which represent a diversion from the expectations of a fair and efficient market, and securing a controlling, dominant position in a financial instrument to exploit and manipulate the price of a related derivative and/or the underlying asset. None of these apply to the portfolio manager's stock purchase or stock sale. He had valid reasons to purchase and sell the stock and did not attempt to manipulate the stock price.\nSecond, the manager's use of online chat rooms was not an attempt to use rumors to manipulate the stock price or mislead market participants. Information-based manipulation includes, but is not limited to, spreading false rumors to induce trading by others. The manager was not attempting to spread false rumors, but stating an opinion based on Li's report.\nB. Yes, because he engaged in transaction-based market manipulation — Incorrect\nIncorrect because the manager bought the stock based on a recommendation in Li's report and presumably sold the stock because its price had doubled.\nC. Yes, because he engaged in information-based market manipulation — Incorrect\nIncorrect because the portfolio manager's promotion of the stock was based on a recommendation contained in a report. The portfolio manager was not seemingly attempting to spread false information about the stock.", "ko": "PM은 Li의 보고서를 근거로 샀고 가격이 두 배가 되어 팔았으므로 거래 기반 조작이 아니다. 채팅방 글도 보고서에 근거한 의견이지 허위 소문이 아니므로 정보 기반 조작도 아니다.", "trap": "정당한 근거로 사고판 뒤 의견을 밝히는 것은 조작이 아니다.", "f": "", "why": {"B": "보고서 근거 매수와 수익 실현 매도는 조작이 아니다.", "C": "허위 정보를 퍼뜨리지 않았다."}, "orig": "Mock 4 Session 2 Q20", "conf": false}, {"id": "mock4-Q65", "src": "오답", "module": "FSA", "tag": "LCR 계산", "vig": 16, "stem": "The liquidity coverage ratio for Grand Bank is closest to:", "opts": {"A": "33%.", "B": "118%.", "C": "133%."}, "ans": "C", "en": "A. 33%. — Incorrect\nIncorrect because the calculation uses the high-quality liquid assets (HQLA) in excess of net cash outflows in the numerator instead of total high-quality liquid assets as required.\nLCR = HQLA in excess of net cash outflows/Net cash outflows = 100/300 ≈ 33%\nB. 118%. — Incorrect\nIncorrect because this is the value for the net stable funding ratio.\nNet stable funding ratio = Total available stable funding/Total required stable funding\n= 1,300/1,100 ≈ 118%\nC. 133%. — Correct\nCorrect because liquidity coverage ratio (LCR) represents the minimum percentage of a bank’s expected cash outflows that must be held in highly liquid assets. For this ratio, the net cash outflows (the denominator) are the bank’s anticipated one-month liquidity needs in a stress scenario, and the high-quality liquid assets (the numerator) include only those that are easily convertible into cash.\nLCR = High-quality liquid assets / Net cash outflows\nHigh-quality liquid assets = $400 million\nNet cash outflows = $300 million\nLCR = 400/300 ≈ 133%", "ko": "유동성 커버리지 비율(LCR) = 고유동성 자산(HQLA)/순현금유출 = 400/300 = 133%.", "trap": "분자는 초과분(100)이 아니라 HQLA 전체(400). 1,300/1,100 = 118%는 NSFR.", "f": "LCR = HQLA / 30일 스트레스 순현금유출", "why": {"A": "HQLA 초과분을 분자로 씀.", "B": "순안정자금조달비율(NSFR)."}, "orig": "Mock 4 Session 2 Q21", "conf": true, "my": "A"}, {"id": "mock4-Q66", "src": "정답", "module": "FSA", "tag": "손해보험 combined ratio", "vig": 16, "stem": "The combined ratio for Bronx Insurance is closest to:", "opts": {"A": "91%.", "B": "99%.", "C": "103%."}, "ans": "B", "en": "A. 91%. — Incorrect\nIncorrect because this calculation uses net premiums written, rather than net premiums earned as the denominator of the loss and loss adjustment expense ratio:\nLoss and loss adjustment expense ratio = Loss and loss adjustment expenses/Net premiums earned = 2,300/3,600 ≈ 63.9%\nUnderwriting expense ratio = Underwriting expenses/Net premiums written = 990/3,600 = 27.5%\nCombined ratio = 63.9% + 27.5% = 91.4% ≈ 91%\nB. 99%. — Correct\nCorrect because the combined ratio is calculated as the sum of (1) the loss and loss adjustment expense ratio and (2) the underwriting expense ratio, as follows:\nLoss and loss adjustment expense ratio = Loss and loss adjustment expenses/Net premiums earned = 2,300/3,200 ≈ 71.9%\nUnderwriting expense ratio = Underwriting expenses/Net premiums written = 990/3,600 = 27.5%\nCombined ratio = 71.9% + 27.5% = 99.4% ≈ 99%\nC. 103%. — Incorrect\nIncorrect because it is the combined ratio after dividends, rather than the combined ratio.\nThe combined ratio after dividends is calculated as the combined ratio plus the dividends to policyholders ratio.\nDividends to policyholders ratio = Dividends paid to policyholders/Net premiums earned = 100/3,200 ≈ 3.1%\nCombined ratio after dividends = 99.4% + 3.1% = 102.5% ≈ 103%", "ko": "손해율 = 손해·손해조사비/경과보험료 = 2,300/3,200 = 71.9%. 사업비율 = 사업비/보유보험료 = 990/3,600 = 27.5%. Combined ratio = 71.9% + 27.5% = 99.4%.", "trap": "손해율 분모는 earned, 사업비율 분모는 written. 계약자 배당을 더하면 '배당 후' combined ratio(103%).", "f": "Combined = 손실/경과보험료(earned) + 사업비/보유보험료(written)", "why": {"A": "손해율 분모에 보유보험료(written)를 씀.", "C": "계약자 배당을 더한 배당 후 combined ratio."}, "orig": "Mock 4 Session 2 Q22", "conf": false}, {"id": "mock4-Q67", "src": "정답", "module": "FSA", "tag": "RSU 세금 shortfall", "vig": 16, "stem": "During the second year of the RSU plan, Bronx Insurance incurred:", "opts": {"A": "a tax shortfall.", "B": "an excess tax benefit.", "C": "neither a tax shortfall nor an excess tax benefit."}, "ans": "A", "en": "A. a tax shortfall. — Correct\nCorrect because a lower share price at settlement versus at the grant date results in a lower tax deduction than the cumulative stock-based compensation expense. This is known as a tax shortfall because taxable income and tax expense are increased.\nThe share price on settlement date is $5.00 at year end of second year of RSU plan, which is lower than the share price on grant date of $6.00, resulting in a tax shortfall.\nB. an excess tax benefit. — Incorrect\nIncorrect because the share price of $5.00 on the settlement date at the end of the second year is lower than the share price of $6.00 on the grant date, resulting in a tax shortfall.\nA higher share price at settlement versus the grant date results in a higher tax deduction than the cumulative stock-based compensation expense. This is known as an excess tax benefit or tax windfall because taxable income and tax expense are reduced.\nC. neither a tax shortfall nor an excess tax benefit. — Incorrect\nIncorrect because the share price of $5.00 on the settlement date at the end of the second year is lower than the share price of $6.00 on the grant date, resulting in a tax shortfall.", "ko": "정산일 주가($5)가 부여일 주가($6)보다 낮으면, 세무상 공제액이 누적 보상비용보다 작아 과세소득과 법인세가 늘어난다 → tax shortfall.", "trap": "정산일 주가가 더 높을 때가 excess tax benefit(windfall).", "f": "", "why": {"B": "정산일 주가가 더 높을 때.", "C": "주가가 달라졌으므로 차이가 생긴다."}, "orig": "Mock 4 Session 2 Q23", "conf": false}, {"id": "mock4-Q68", "src": "정답", "module": "FSA", "tag": "순손실 시 희석 EPS", "vig": 16, "stem": "As a result of the employee RSU plan and executive stock options, Gordon's forecasted value for diluted EPS of the second year of the RSU plan should be:", "opts": {"A": "lower than basic EPS.", "B": "the same as basic EPS.", "C": "higher than basic EPS."}, "ans": "B", "en": "A. lower than basic EPS. — Incorrect\nIncorrect because when EPS is positive, unvested RSUs are added to shares outstanding balance, resulting in a lower diluted EPS than basic EPS. The options would be excluded from the calculation as they are anti-dilutive: exercise is uneconomic for the holder, and if they were exercised, fewer shares would be issued upon their exercise than would be repurchased with the resulting cash received, reducing shares outstanding and increasing EPS.\nB. the same as basic EPS. — Correct\nCorrect, because diluted EPS cannot exceed basic EPS, so companies that report a net loss will report the same basic and diluted shares outstanding.\nWhen basic EPS is negative, unvested RSUs are anti-dilutive as the additional shares they represent increase the denominator of the EPS calculation, making them anti-dilutive; therefore, they are not included in the calculation. The same is true for the stock options as the options are anti-dilutive if their exercise increases the shares outstanding, which happens when the strike price is less than the current share price. Since neither RSUs nor options affect the diluted EPS calculation, both diluted and basic EPS can be equal.\nC. higher than basic EPS. — Incorrect\nIncorrect because diluted EPS cannot exceed basic EPS, so companies that report a net loss will report the same basic and diluted shares outstanding.", "ko": "2년차에 순손실이 예상된다. 손실일 때 RSU·옵션을 분모에 넣으면 주당 손실이 작아져 반희석(anti-dilutive)이므로 제외한다. 그래서 희석 EPS = 기본 EPS.", "trap": "희석 EPS는 기본 EPS보다 클 수 없다(손실이면 같음).", "f": "", "why": {"A": "이익일 때만 RSU가 희석 효과.", "C": "희석 EPS가 기본 EPS보다 높을 수 없다."}, "orig": "Mock 4 Session 2 Q24", "conf": true}, {"id": "mock4-Q69", "src": "오답", "module": "DER", "tag": "선도 만기 후 배당", "vig": 17, "stem": "Azul's best response to Green’s question regarding the value of the forward position is that it will:", "opts": {"A": "decrease.", "B": "be unaffected.", "C": "increase."}, "ans": "B", "en": "A. decrease. — Incorrect\nIncorrect because the dividend is paid after the forward contract expires, therefore there is no impact on the value of the forward contract. If the dividend did occur before the forward contract expired, this answer would still be incorrect because Green shorted the forward and the payment of a dividend would increase the value of his position. However, in case of a long position, the value of his position would decrease.\nB. be unaffected. — Correct\nCorrect because the dividend is paid after the forward contract expires, therefore there is no impact on the value of the forward contract.\nC. increase. — Incorrect\nIncorrect because the dividend is paid after the forward contract expires. However, if the dividend did occur before the forward contract expired, this answer would be correct because Green shorted the forward and the payment of a dividend would increase the value of his position.", "ko": "6개월 선도를 4개월 전에 맺었으므로 만기까지 2개월 남았다. 배당은 3개월 뒤라 만기 이후에 지급된다 → 선도 가치에 영향 없음.", "trap": "만기 전 배당이었다면 매도 포지션 가치는 증가했을 것이다. 날짜부터 확인.", "f": "", "why": {"A": "배당이 만기 후라 영향이 없다(만기 전이어도 매도 포지션은 증가).", "C": "만기 전 배당일 때만 맞는 답."}, "orig": "Mock 4 Session 2 Q25", "conf": true, "my": "C"}, {"id": "mock4-Q70", "src": "정답", "module": "DER", "tag": "주식 스왑 현금흐름", "vig": 17, "stem": "If Green's stock has a –4.5% return (not annualized) over the next six months, the proposed equity swap's net cash flow to Green on its first payment date would be:", "opts": {"A": "–$65,000.", "B": "$115,000.", "C": "$140,000."}, "ans": "B", "en": "A. –$65,000. — Incorrect\nIncorrect because Green would receive fixed and pay the equity return. If the negative equity return is considered an outflow, this coupled with the receipt of the fixed payment would result in a negative cash flow of –$65,000:\nReceive Fixed Cash Flow = 0.025/2 × $2 million = $25,000\nPay Equity Cash Flow = –0.045 × $2 million = –$90,000\nB. $115,000. — Correct\nCorrect because the cash flows for the equity leg (Si) of an equity swap can be expressed as:\nSi = NAE RE,\nwhere\nNAE denotes the notional amount, and\nRE denotes the periodic return of the equity either with or without dividends as specified in the swap contract.\nThe cash flows for a fixed-interest rate leg (FS) of an equity swap are:\nFS = NAE × APFIX × rFIX,\nwhere\nAPFIX denotes the accrual period for the fixed leg and\nrFIX denotes the fixed rate on the equity swap.\nTherefore, the receive-fixed/pay-equity cash flows (FS – Si = NAE x (rFIX – RE)) are as follows:\n$2,000,000 × (0.025/2 – (–0.045)) = $115,000,\nwhere:\nNAE = $2 million\nRE = –4.5%\nAPFIX = 0.5\nrFIX = 2.5%\nReceive Fixed Cash Flow = 0.025/2 × $2 million = $25,000\nPay Equity Cash Flow = –0.045 × $2 million = –$90,000 (paying a negative cash flow is actually an inflow).\nC. $140,000. — Incorrect\nIncorrect because the cash inflow from the fixed-rate receipt is not adjusted for a semi-annual reset; –$2,000,000 × (0.025 – (–0.045)) = $140,000.", "ko": "Green은 주식 수익을 지급하고 고정금리를 받는다. 고정 수취 = 2m × 2.5%/2 = $25,000. 주식 수익 −4.5%를 '지급'하므로 오히려 2m × 4.5% = $90,000를 받는다. 순 = 25,000 + 90,000 = $115,000.", "trap": "고정금리는 반기라 2로 나눈다. 음의 주식 수익을 지급하면 유입.", "f": "순수취 = NA × (r_fix × 기간 − R_equity)", "why": {"A": "음의 주식 수익을 유출로 처리.", "C": "고정금리를 반기로 나누지 않음."}, "orig": "Mock 4 Session 2 Q26", "conf": false}, {"id": "mock4-Q71", "src": "정답", "module": "DER", "tag": "3×9 FRA 금리", "vig": 17, "stem": "The fixed rate on the 3 × 9 FRA is closest to:", "opts": {"A": "0.9583%.", "B": "1.0331%.", "C": "1.4374%."}, "ans": "C", "en": "A. 0.9583%. — Incorrect\nIncorrect because the calculation assumes m = the term of the deposit, 270 days instead of 180 days.\nFRA0= {[1 + (0.0120 × (270/360))]/[1 + (0.0072 × (90/360))] – 1}/(270/360) = 0.9583%\nB. 1.0331%. — Incorrect\nIncorrect because the calculation uses the 6-month rate, 0.93%, instead of the 9-month rate, 1.20%.\nFRA0 = {[1 + (0.0093 × (270/360))]/[1 + (0.0072 × (90/360))] – 1}/(180/360) = 1.0331%\nC. 1.4374%. — Correct\nCorrect because the 3 × 9 FRA rate equals:\nFRA0 = {[1 + LTtT]/[1 + Lhth] – 1}/tm\nwhere:\nL is the MRR rate\nT is the maturity of the underlying deposit, 270 days\nh is the FRA expiration, 90 days\nm = T – h, 180 days\ntT = term of deposit/360\nth = term of FRA/360\ntm = (T – h)/360\nFRA0 = {[1 + L270 x t270]/[1 + L90 x t90] – 1}/tm\nFRA0 = {[1 + (0.0120 × (270/360))]/[1 + (0.0072 × (90/360))] – 1}/(180/360) = 1.4374%", "ko": "FRA = {[1 + 0.0120 × 270/360]/[1 + 0.0072 × 90/360] − 1}/(180/360) = (1.009/1.0018 − 1)/0.5 = 0.0071873/0.5 = 1.4374%.", "trap": "기간 연환산은 예금 기간 m = 180일로 한다. 9개월 금리를 쓴다.", "f": "FRA = {[1 + L_T·t_T]/[1 + L_h·t_h] − 1} / t_m", "why": {"A": "180일 대신 270일로 연환산.", "B": "9개월 대신 6개월 금리 사용."}, "orig": "Mock 4 Session 2 Q27", "conf": false}, {"id": "mock4-Q72", "src": "오답", "module": "DER", "tag": "금리 스왑 가치 (잔존 3년)", "vig": 17, "stem": "The current value of White’s interest rate swap is closest to:", "opts": {"A": "–$148,338.", "B": "$86,130.", "C": "$151,062."}, "ans": "B", "en": "A. –$148,338. — Incorrect\nIncorrect because the calculation of the current fixed swap rate uses the sum of the FV factors based on spot rates in years 3, 4, and 5 (2.8683). This yields a FSt of 2.10%.\nFSt = (1 – 0.9398)/2.8683 = 0.020988.\nValue of Swap = $7 million × (0.0136 – 0.020988) × 2.8683 = –$148,338.\nB. $86,130. — Correct\nCorrect because the value of Received Fixed Swap (VS) = NA × (FS0 – FSt) × Sum of PV Factors for 1-, 2-, and 3- year spot rates.\nValue of Swap = $7 million × (0.0136 – 0.009438) × 2.9562 = $86,130\nwhere:\nNA = $7 million\nInitial Fixed Rate (FS0) = 1.36%\nSum of PV Factors for 1-, 2-, and 3- year spot rates = 2.9562\nCurrent Fixed Rate (FSt) = 1 – PV factor for the 3-year spot rate (1 – 0.9721)/Sum of PV Factors for 1-, 2-, and 3-year spot rate (2.9562) = 0.009438.\nC. $151,062. — Incorrect\nIncorrect because the current fixed swap rate (FSt) is calculated as the average of the spot rates in year 1, 2, and 3 (0.63%).\nValue of Swap = $7 million × (0.0136 – 0.0063) × 2.9562 = $151,062.", "ko": "5년 스왑을 2년 전에 맺었으므로 잔존 3년. 현재 스왑금리 = (1 − 0.9721)/(0.9974 + 0.9867 + 0.9721) = 0.0279/2.9562 = 0.944%. 고정 수취자 가치 = 7m × (1.36% − 0.944%) × 2.9562 = $86,130.", "trap": "잔존 기간 1~3년의 할인계수를 쓴다(3~5년 아님). 스왑금리는 spot rate 평균이 아니다.", "f": "V = NA × (FS0 − FSt) × Σ PV factor(잔존 기간)", "why": {"A": "3·4·5년 할인계수를 씀.", "C": "스왑금리를 spot rate 평균으로 계산."}, "orig": "Mock 4 Session 2 Q28", "conf": true, "my": "C"}, {"id": "mock4-Q73", "src": "정답", "module": "FSA", "tag": "외화 매입채무 환차익", "vig": 18, "stem": "For the most recent year, Calpurnia's inventory purchase resulted in a foreign exchange:", "opts": {"A": "loss of USD 1.5 million.", "B": "loss of USD 1.0 million.", "C": "gain of USD 1.5 million."}, "ans": "C", "en": "A. loss of USD 1.5 million. — Incorrect\nIncorrect because the foreign exchange transaction effect is calculated as the difference between the value using the exchange rate at 31 December of the most recent year and value at the date of purchase (cost) rather than vice versa as follows:\nInventory cost in USD at purchase date: EUR 50 million × 1.08 = USD 54 million.\nInventory cost in USD at 31 December of the most recent year = EUR 50 million × 1.05 = USD 52.5 million\nFX Gain (Loss) (incorrect) = USD 52.5 million - USD 54 million = (USD 1.5 million)\nB. loss of USD 1.0 million. — Incorrect\nIncorrect because the foreign exchange transaction effect is calculated using the most recent year average USD/EUR exchange rate of 1.10 instead of the USD/EUR exchange rate of 1.05 at 31 December of the most recent year as follows:\nInventory cost in USD at purchase date = EUR 50 million × 1.08 = USD 54 million.\nInventory cost in USD at average rate = EUR 50 million × 1.10 = USD 55 million\nFX Gain (Loss) = USD 54 million - USD 55 million = (USD 1 million)\nC. gain of USD 1.5 million. — Correct\nCorrect because the foreign exchange transaction effect for the most recent year is calculated as follows:\nInventory cost at purchase date in USD: EUR 50 million × 1.08 = USD 54 million.\nInventory cost at 31 December of the most recent year in USD: EUR 50 million x 1.05 = USD 52.5 million\nFX Gain (Loss) = USD 54 million - USD 52.5 million = USD 1.5 million. The year-end exchange rate is used for this calculation.", "ko": "EUR 50m 매입채무: 매입일 50 × 1.08 = USD 54m, 연말 50 × 1.05 = USD 52.5m. 갚을 USD가 1.5m 줄었으므로 환차익 USD 1.5m.", "trap": "부채는 외화 약세면 이익. 평균 환율이 아니라 연말 환율.", "f": "", "why": {"A": "부호를 거꾸로(부채인데 자산처럼).", "B": "연말 환율 대신 평균 환율."}, "orig": "Mock 4 Session 2 Q29", "conf": false}, {"id": "mock4-Q74", "src": "오답", "module": "FSA", "tag": "현행환율법 매출총이익률", "vig": 18, "stem": "After Bartolo’s financial statements are translated into USD, its gross profit margin would be:", "opts": {"A": "lower than before translation.", "B": "the same as before translation.", "C": "higher than before translation."}, "ans": "B", "en": "A. lower than before translation. — Incorrect\nIncorrect because under the current rate method, sales and cost of goods sold must be translated using the same rate (average rate during the year). Gross profit margin does not change in translation.\nB. the same as before translation. — Correct\nCorrect because Bartolo's financial statements are translated using the current rate method, whereby both sales and cost of goods sold are translated using the same rate, namely, the average rate for the most recent year. As a result, the translated USD gross profit margin will be the same as the gross profit margin in EUR before translation.\nC. higher than before translation. — Incorrect\nIncorrect because under the current method both sales and cost of goods sold must be translated using the same rate (the average rate for the most recent year). Gross profit margin does not change in translation.", "ko": "현행환율법에서는 매출과 매출원가를 같은 평균 환율로 환산하므로 매출총이익률은 환산 전과 같다.", "trap": "재고 매입 환율(1.11)은 시제법(temporal)에서 COGS에 쓰인다. 현행환율법은 아니다.", "f": "", "why": {"A": "현행환율법에서는 비율이 변하지 않는다.", "C": "시제법과 혼동."}, "orig": "Mock 4 Session 2 Q30", "conf": true, "my": "C"}, {"id": "mock4-Q75", "src": "정답", "module": "FSA", "tag": "환산 이익잉여금 증가", "vig": 18, "stem": "The increase in Bartolo's retained earnings when translated into USD for the most recent year is:", "opts": {"A": "USD 9,660,000.", "B": "USD 10,120,000.", "C": "USD 10,136,000."}, "ans": "C", "en": "A. USD 9,660,000. — Incorrect\nIncorrect because the increase in retained earnings is translated using the current rate as of the end of the most recent year:\nNet increase in retained earnings (incorrect): (EUR 10,000,000 – EUR 800,000) × 1.05 = USD 9,660,000.\nB. USD 10,120,000. — Incorrect\nIncorrect because the increase in Bartolo's retained earnings is translated by using the average rate of the most recent year as follows:\nIncrease in retained earnings: (EUR 10,000,000 – EUR 800,000) × 1.10 = USD 10,120,000.\nC. USD 10,136,000. — Correct\nCorrect because Bartolo is translated using the current rate method. Retained earnings for the most recent year are increased by net income EUR 10 million, translated at the average rate of 1.10, and decreased by dividends EUR 800,0000, translated at the exchange rate that existed when they were declared namely 1.08. The increase in Bartolo's translated net earnings is therefore: EUR 10,000,000 × 1.10 – EUR 800,000 × 1.08 = USD 11,000,000 – USD 864,000 = USD 10,136,000.", "ko": "현행환율법: 순이익은 평균 환율, 배당은 선언일 환율로 환산. 10m × 1.10 − 0.8m × 1.08 = 11,000,000 − 864,000 = USD 10,136,000.", "trap": "배당에 평균 환율이나 연말 환율을 쓰지 않는다.", "f": "ΔRE = NI × 평균 환율 − 배당 × 선언일 환율", "why": {"A": "모두 연말 환율로 환산.", "B": "배당까지 평균 환율로 환산."}, "orig": "Mock 4 Session 2 Q31", "conf": true}, {"id": "mock4-Q76", "src": "정답", "module": "FSA", "tag": "지속 가능한 매출 성장", "vig": 18, "stem": "Based on the components of total net sales growth, which of Calpurnia's segments has the highest sustainable growth rate?", "opts": {"A": "Eurozone", "B": "Americas", "C": "Asia Pacific"}, "ans": "A", "en": "A. Eurozone — Correct\nCorrect because the Eurozone has both 1) the highest net change in sales resulting from the combined effect of price and volume at 13.8% (9.3% + 4.5% and excluding the contribution from foreign currency exchange) and 2) the lowest contribution from foreign currency exchange (–2.5%). Calpurnia's management has more control over growth in sales resulting from volume and prices than growth resulting from currency fluctuations, and hence the growth in the Eurozone is considered more sustainable.\nFor a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price are more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.\nB. Americas — Incorrect\nIncorrect because the Americas segment, while having the highest Contribution from Volume growth, has a combined sustainable volume and price growth component of only 12.5% (10.1% + 2.4%), which is lower than the sustainable component of growth in the Eurozone (13.8%). In addition, it has a contribution for foreign currency exchange (0.6%) that is higher than that of the Eurozone (–2.5%), which also points to a less sustainable overall growth than that of the Eurozone.\nC. Asia Pacific — Incorrect\nIncorrect because the Asia Pacific segment, while having the highest Total Net Sales Growth rate at 13.9%, has only 8.5% of that growth due to the combined effect of volume and price, which represents the sustainable component of growth. The remaining 5.4% is due to currency fluctuations, which are outside the control of Calpurnia's management. The sustainable component of growth in Asia Pacific (8.5%) is lower than the sustainable component of growth in the Eurozone (13.8%). In addition, the Asia Pacific segment has a contribution for foreign currency exchange (5.4%) that is higher than that of the Eurozone (–2.5%), which also points to a less sustainable overall growth than that of the Eurozone.", "ko": "물량·가격으로 인한 성장이 환율 효과보다 지속 가능하다. 물량+가격: 유로존 9.3 + 4.5 = 13.8%, 미주 12.5%, 아태 8.5%. 유로존이 가장 높고 환율 기여도는 −2.5%로 가장 낮다.", "trap": "전체 성장률(아태 13.9%)이 높아도 환율 효과가 크면 지속성이 낮다.", "f": "", "why": {"B": "물량+가격 12.5%로 유로존보다 낮다.", "C": "성장의 5.4%가 환율 효과."}, "orig": "Mock 4 Session 2 Q32", "conf": false}, {"id": "mock4-Q77", "src": "정답", "module": "QM", "tag": "회귀 F-검정", "vig": 19, "stem": "Do the independent variables jointly contribute to the explanation of silver returns?", "opts": {"A": "No", "B": "Yes, at the 5% significance level only", "C": "Yes, at both the 5% and 1% significance levels"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because the joint contribution is tested using the F-statistic for the overall model. The F-statistic is calculated as F = mean square regression / mean square error = MSR/MSE = 0.0151/0.0015 ≈ 10. This exceeds the critical value at the 5% and 1% significance levels.\nThis response would be chosen if F were calculated as mean square error / mean square regression = MSE/MSR = 0.0015/0.0151 ≈ 0.1.\nB. Yes, at the 5% significance level only — Incorrect\nIncorrect because the joint contribution is tested using the F-statistic for the overall model. The F-statistic is calculated as F = mean square regression / mean square error = MSR/MSE = 0.0151/0.0015 ≈ 10. This exceeds the critical value at the 5% and 1% significance levels.\nThis response would be chosen if F were calculated as sum of squares regression / mean square regression = SSR/MSR = 0.0453/0.0151 = 3.\nC. Yes, at both the 5% and 1% significan

d curve. Smith's belief is that forward rates are upwardly biased.", "ko": "Smith는 선도금리가 미래 현물금리의 '상향 편의(upwardly biased)' 예측치라고 본다. 선도금리에 유동성(기간) 프리미엄이 붙어 있다는 뜻이므로 유동성 선호 이론.", "trap": "'편의 없음'이면 순수 기대이론, '선호 구간 이탈'이면 선호서식지. 키워드로 구분한다.", "f": "", "why": {"A": "선호서식지는 투자자가 프리미엄을 받으면 선호 만기를 벗어난다는 이론으로, 상향 편의 자체를 설명하지 않습니다.", "C": "순수 기대이론은 선도금리가 미래 현물금리의 편의 없는 예측치라고 봅니다. Smith 생각과 반대."}, "orig": "Mock 1 Session 1 Q14", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q19", "src": "모의고사 오답", "module": "10-PM", "tag": "VaR 확장: Relative VaR(벤치마크 이탈)", "vig": 80, "stem": "Given his concern about the impact of adding bonds with embedded options to his current bond portfolio, which of the following extensions of VaR should Ryan use?", "opts": {"A": "Relative VaR", "B": "Conditional VaR", "C": "Incremental VaR"}, "ans": "A", "en": "A. Relative VaR — Correct\nCorrect because Ryan is concerned about the performance of his portfolio deviating from its benchmark if he adds bonds with embedded options and ex ante tracking error, also known as relative VaR, is a measure of the degree to which the performance of a given investment portfolio might deviate from its benchmark.\nB. Conditional VaR — Incorrect\nIncorrect because Ryan is concerned about the performance of his portfolio deviating from its benchmark if he adds bonds with embedded options, however, conditional VaR would not enable him to address this concern. Conditional VaR is the average loss conditional on exceeding the VaR cutoff, which answers the question 'How much can I expect to lose if VaR is exceeded?'\nC. Incremental VaR — Incorrect\nIncorrect because Ryan is concerned about the performance of his portfolio deviating from its benchmark if he adds bonds with embedded options, however, incremental VaR would not enable him to address this concern. Incremental VaR allows the user to know how the portfolio VaR will change if a position size is changed relative to the remaining positions.", "ko": "옵션부 채권을 넣으면 포트폴리오 성과가 벤치마크에서 벗어날까 걱정하는 것이므로, 벤치마크 대비 위험인 relative VaR(ex ante tracking error)을 쓴다.", "trap": "'포지션 추가 → incremental VaR'로 바로 연결하기 쉽다. 걱정의 대상이 벤치마크 이탈이면 relative VaR.", "f": "", "why": {"B": "Conditional VaR은 VaR을 넘을 때의 평균 손실로, 벤치마크 이탈을 재지 않습니다.", "C": "Incremental VaR은 포지션 크기를 바꿀 때 포트폴리오 VaR 변화로, 벤치마크 이탈을 재지 않습니다."}, "orig": "Mock 1 Session 1 Q19", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q21", "src": "모의고사 오답", "module": "10-FSA", "tag": "IFRS 연금: 영업비용 = 당기+과거 근무원가", "vig": 81, "stem": "For the most recent year, KTR's operating expense (in $ millions) related to Plan A was:", "opts": {"A": "8.", "B": "10.", "C": "12."}, "ans": "C", "en": "A. 8. — Incorrect\nIncorrect because this is the difference in the current and the past service cost.\nOperating expense on the income statement ($ million) = Current service cost – Past service cost = 10 – 2 = 8\nB. 10. — Incorrect\nIncorrect because this is only the current service cost with the past service cost omitted. Under IFRS, service cost has two sub-components: current and past service costs. Service costs are recognized as an operating expense on the income statement.\nThis would be the correct answer if KTR reported under US GAAP, as under US GAAP, past service costs are reported in OCI in the period in which the change giving rise to the cost occurs. In subsequent periods, past service costs are amortized to the income statement over the average service lives of the affected employees.\nC. 12. — Correct\nCorrect because under IFRS service cost has two sub-components: current and past and service costs are recognized as an operating expense on the income statement.\nOperating expense on the income statement ($ million) = Current service cost + Past service cost = 10 + 2 = 12", "ko": "IFRS에서는 과거근무원가도 즉시 손익(영업비용)으로 인식한다. 10 + 2 = $12m. (US GAAP이면 과거근무원가는 OCI 후 상각이라 10)", "trap": "US GAAP 처리(B)와 섞지 않는다. 과거근무원가는 더하는 것이지 빼는 게 아니다(A).", "f": "IFRS 손익의 service cost = current + past service cost", "why": {"A": "과거근무원가를 빼면 안 되고 더해야 합니다.", "B": "US GAAP 기준 답입니다. IFRS는 과거근무원가도 영업비용으로 인식합니다."}, "orig": "Mock 1 Session 1 Q21", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q22", "src": "모의고사 오답", "module": "10-FSA", "tag": "RSU 희석주식: 자기주식법", "vig": 81, "stem": "Using the treasury stock method, KTR's number of diluted shares outstanding at the end of the most recent year (in millions) is closest to:", "opts": {"A": "2,730.", "B": "2,850.", "C": "2,970."}, "ans": "A", "en": "A. 2,730. — Correct\nCorrect because diluted shares outstanding using treasury stock method is calculated as shown below:\nBasic shares outstanding\t2,700 million\nPlus: Unvested RSUs\t150 million\nMinus: Assumed repurchases = Average unrecognized share-based compensation expense/ Average stock price\t$840 million/ $7 = 120 million\nDiluted shares outstanding\t2,730 million\nThe above calculation is based on:\nDiluted shares outstanding is computed using the treasury stock method, where unvested RSUs are added to basic shares outstanding, net of assumed repurchases which is based on the average unrecognized share-based compensation expense and average prevailing market price for the shares.\nBasic shares outstanding\nPlus: Shares issued from conversion or exercise of share-based awards\nMinus: (Assumed proceeds from conversion or exercise of the share-based awards / Average share price for the reporting period) = Diluted shares outstanding.\nand the treasury stock method adds a 'net' amount of potentially dilutive securities like unvested RSUs to basic shares outstanding.\nB. 2,850. — Incorrect\nIncorrect because assumed repurchases are ignored rather than being deducted\nBasic shares outstanding\t2,700 million\nPlus: Unvested RSUs\t150 million\nDiluted shares outstanding\t2,850 million\nC. 2,970. — Incorrect\nIncorrect because diluted shares outstanding is wrongly calculated by adding assumed repurchases rather than deducting\nBasic shares outstanding\t2,700 million\nPlus: Unvested RSUs\t150 million\nPlus: Assumed repurchases = Average unrecognized share based compensation expense/ Average stock price\t$840 million/ $7 = 120 million\nDiluted shares outstanding\t2,970 million", "ko": "2,700 + 150 − (840 / 7 = 120) = 2,730백만 주.", "trap": "가정 재매입 주식은 빼야 한다. 무시하면 B, 더하면 C.", "f": "희석주식 = 기본주식 + 미가득 RSU − (미인식 보상비용 평균 / 평균 주가)", "why": {"B": "가정 재매입 주식(120m)을 빼지 않았습니다.", "C": "가정 재매입 주식을 빼야 하는데 더했습니다."}, "orig": "Mock 1 Session 1 Q22", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q23", "src": "모의고사 오답", "module": "10-FSA", "tag": "RSU 보상비용 인식: 가득기간 배분", "vig": 81, "stem": "In KTR's current year financial statements, which of the following would result from its new RSU grants under Plan B?", "opts": {"A": "$4 million increase in compensation expense", "B": "$4 million increase in cash flow from financing activities", "C": "$16 million increase in share-based compensation reserve"}, "ans": "A", "en": "A. $4 million increase in compensation expense — Correct\nCorrect because the annual share-based compensation expense can be calculated by taking the product of the RSUs granted and the grant-date share prices, further multiplied by the fraction of awards that vest each period.\nFor the current financial year:\nRSUs granted = 2 million\nGrant date share price = $8\nFraction of awards that vest each period = 2 million/ 4 years vesting period = 0.5 million\nAnnual share based compensation expense = 0.5 million × $8 = $4 million\nTherefore the impact of the RSUs granted during the current year will lead to an increase in income statement compensation expense by $4 million.\nB. $4 million increase in cash flow from financing activities — Incorrect\nIncorrect because there is no impact on the statement of cash flows because of the vesting of RSUs, which is a non-cash transaction.\nAs a non-cash transaction, share-based compensation does not impact cash flows.\nC. $16 million increase in share-based compensation reserve — Incorrect\nIncorrect because the share-based compensation reserve will increase by $4 million in the current financial year (first year of vesting) not $16 million (this is the cumulative increase in reserve over the 4 years of vesting).\nThe general approach is to measure the fair value of the share-based award at the grant date, recognize it as an expense over the vesting period with the offsetting entry to equity, and transfer the entries from one equity account to another at settlement.", "ko": "부여 RSU 2m × 부여일 주가 $8 = $16m을 4년 가득기간에 나눠 인식 → 올해 비용 $4m 증가. 보상 적립금(자본)도 $4m만 늘고, 현금 유출이 없어 현금흐름에는 영향 없다.", "trap": "$16m은 4년 누적 금액이다. 주식보상은 비현금 거래라 재무활동 현금흐름에 안 잡힌다.", "f": "", "why": {"B": "RSU 가득은 비현금 거래라 현금흐름표에 영향이 없습니다.", "C": "$16m은 4년 누적액입니다. 올해 적립금 증가는 $4m입니다."}, "orig": "Mock 1 Session 1 Q23", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q30", "src": "모의고사 오답", "module": "10-CI", "tag": "Country spread model ERP", "vig": 82, "stem": "Based on the country spread model, the equity risk premium that should be used in calculating Feldcroft's cost of equity is closest to:", "opts": {"A": "6.11%.", "B": "6.35%.", "C": "7.59%."}, "ans": "A", "en": "A. 6.11%. — Correct\nCorrect because, under the country spread model, Feldcroft's equity risk premium (ERP) is based on the ERP of the US plus a country risk premium adjusted for the level of Feldcroft's exposure to Country A.\nERP = ERP for a developed market + (λ × Country risk premium)\nwhere,\nλ is the level of Feldcroft's exposure to Country A\nCountry risk premium = Yield on Country A bonds (denominated in USD) – Yield on US bonds (denominated in USD)\nTherefore,\nERP = 5.94% + [10% × (5.15% – 3.50%)]\nERP = 6.105% ≈ 6.11%\nB. 6.35%. — Incorrect\nIncorrect because this response uses Country A's 10-year bond denominated in local currency instead of the USD-denominated 10-year bond. This response incorrectly calculates the equity risk premium as:\nERP = 5.94% + [10% × (7.55% – 3.50%)]\nERP = 6.345% ≈ 6.35%\nC. 7.59%. — Incorrect\nIncorrect because this response does not adjust Feldcroft's equity risk premium (ERP) for the level of exposure to Country A. This response incorrectly calculates the equity risk premium as:\nERP = 5.94% + (5.15% – 3.50%)\nERP = 7.59%", "ko": "국가위험 프리미엄은 같은 통화(USD) 표시 채권끼리 비교: 5.15% − 3.50% = 1.65%. 노출도 λ = 10%를 곱해 5.94% + 0.165% = 6.11%.", "trap": "현지통화 채권 수익률을 쓰면(B) 인플레이션 차이가 섞인다. λ를 빼먹으면 C.", "f": "ERP = 선진국 ERP + λ × (해당국 USD 채권 수익률 − 미국 국채 수익률)", "why": {"B": "USD 표시 채권 대신 현지통화 표시 채권 수익률을 썼습니다.", "C": "국가위험 프리미엄에 노출도 λ(10%)를 곱하지 않았습니다."}, "orig": "Mock 1 Session 1 Q30", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q34", "src": "모의고사 오답", "module": "10-QM", "tag": "로지스틱 회귀 확률 계산", "vig": 83, "stem": "Based on the logistic regression model, the probability that ACME defaults within the next year is closest to:", "opts": {"A": "29%.", "B": "71%.", "C": "90%."}, "ans": "B", "en": "A. 29%. — Incorrect\nIncorrect because the negative sign is omitted when calculating the event probability. The event probability is incorrectly calculated as:\nP = 1/(1 + exp(b0 + b1 × LEVERAGE + b2 × COVERAGE)).\nBased on the coefficient estimates in Exhibit 1 and the value of the independent variables for ACME:\nP = 1/(1 + exp(–20 + 65.5 × 0.8 – 35 × 0.9)) = 1/(1 + exp(0.9)) = 0.2891 or 29%\nB. 71%. — Correct\nCorrect because a logistic regression model uses a log-odds transformation:\nln(P/(1 – P)) = b0 + b1 × LEVERAGE + b2 × COVERAGE,\nwhere b0 is the intercept, b1 and b2 are the slope parameters.\nThe event probability is then calculated as:\nP = 1/(1 + exp(–(b0 + b1 × LEVERAGE + b2 × COVERAGE))).\nBased on the coefficient estimates in Exhibit 1 and the value of the independent variables for ACME:\nP = 1/(1 + exp(–(–20 + 65.5 × 0.8 – 35 × 0.9))) = 1/(1 + exp(–0.9)) = 0.7109 or 71%\nC. 90%. — Incorrect\nIncorrect because the regression is treated as a linear regression instead of a logistic regression and the probability of default is incorrectly calculated as:\nP = b0 + b1 × LEVERAGE + b2 × COVERAGE\nP = –20 + 65.5 × 0.8 – 35 × 0.9 = 0.9 or 90%\nIn case the intercept is missed in calculating the event probability in the logistic regression model, the default probability is 100%, which is closest to 90%.\nThe event probability is incorrectly calculated as:\nP = 1/(1 + exp(–(b1 × LEVERAGE + b2 × COVERAGE))).\nBased on the coefficient estimates in Exhibit 1 and the value of the independent variables for ACME:\nP = 1/(1 + exp(–(65.5 × 0.8 – 35 × 0.9))) = 1/(1 + exp(–20.9)) = 1.0000 or 100%", "ko": "선형결합: −20 + 65.5 × 0.8 − 35 × 0.9 = 0.9. P = 1 / (1 + e^(−0.9)) ≈ 0.71.", "trap": "선형결합 값을 그대로 확률로 쓰면 C(90%), 지수의 음수 부호를 빼면 A(29%).", "f": "P = 1 / (1 + exp(−(b0 + b1X1 + b2X2)))", "why": {"A": "exp 안의 음수 부호를 빼먹었습니다.", "C": "로지스틱 변환 없이 선형결합 값을 확률로 썼습니다."}, "orig": "Mock 1 Session 1 Q34", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q37", "src": "모의고사 오답", "module": "10-AI", "tag": "REIT 평가: 일회성 항목 → P/FFO·P/AFFO 불리", "vig": 84, "stem": "The issues Lambert is considering regarding REIT A would pose a disadvantage for which of the following valuation models?", "opts": {"A": "Net asset value", "B": "P/AFFO multiple", "C": "Dividend discount model"}, "ans": "B", "en": "A. Net asset value — Incorrect\nIncorrect because NAVPS (net asset value per share) can be reasonably estimated when there are ample market transactions to provide property comparables.\nB. P/AFFO multiple — Correct\nCorrect because an increased level of one-time items such as gains and accounting charges, as well as new revenue recognition rules, has affected the income statement, thus making P/FFO and P/AFFO more difficult to compute and complicating comparisons between companies.\nC. Dividend discount model — Incorrect\nIncorrect because REITs return a significant portion of their income to their investors as required by law and, as a result, tend to pay high dividends. Thus, dividend discount or discounted cash flow models for valuation are also applicable. One-time charges and gains have a limited effect on dividend payouts.", "ko": "일회성 이익·비용 증가와 새 수익인식 규정은 손익계산서에 영향을 줘 FFO·AFFO 계산과 회사 간 비교를 어렵게 한다 → P/AFFO가 불리.", "trap": "일회성 항목은 배당에는 영향이 작다. 손익 기반 배수가 흔들린다.", "f": "", "why": {"A": "비교 가능한 거래가 충분하면 NAVPS는 합리적으로 추정됩니다.", "C": "REIT는 배당 성향이 높고 일회성 항목이 배당에 주는 영향이 작아 DDM에는 큰 문제가 아닙니다."}, "orig": "Mock 1 Session 1 Q37", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q42", "src": "모의고사 오답", "module": "10-ETH", "tag": "I(B) 독립성: 발행사 출장 경비", "vig": 85, "stem": "Which procedure in the BCT compliance manual is not consistent with the Standards?", "opts": {"A": "Procedure 1", "B": "Procedure 2", "C": "Procedure 3"}, "ans": "C", "en": "A. Procedure 1 — Incorrect\nIncorrect because Procedure 1 is consistent with Standard I(B) Independence and Objectivity, which does not preclude customary, ordinary business-related entertainment as long as its purpose is not to influence or reward members or candidates. Firms should consider a strict value limit for acceptable gifts that is based on the local or regional customs and should address whether the limit is per gift or an aggregate annual value. BCT’s procedure is that analysts may accept gifts in the form of business-related entertainment and a maximum annual value is listed by the compliance office.\nB. Procedure 2 — Incorrect\nIncorrect because Procedure 2 is consistent with Standard I(B) Independence and Objectivity. A policy which specifies that purchases of a company’s stock through a private placement are capped at a maximum per purchase as listed by the compliance office is an example of a formal policy related to employee purchases of equity or equity-related IPOs. The Standard states that firms should develop formal policies related to employee purchases of equity or equity-related IPOs. Strict limits should be imposed on investment personnel acquiring securities in private placements.\nC. Procedure 3 — Correct\nCorrect because Procedure 3 is not consistent with Standard I(B) Independence and Objectivity. Allowing analysts to accept modest commercial transportation and hotel accommodation paid by the issuer when attending meetings at an issuer’s headquarters is not consistent with Standard I(B). The recommended procedures for Standard I(B) state: When attending meetings at an issuer’s headquarters, members and candidates should pay for commercial transportation and hotel charges. No corporate issuer should reimburse members or candidates for air transportation.", "ko": "발행사 본사 방문 시 상업 교통·숙박비는 본인(회사)이 내야 한다. 발행사가 '적당한' 교통·숙박을 대 줘도 된다는 Procedure 3이 Standard I(B) 위반.", "trap": "통상적인 업무 접대(1)와 사모 매입 한도 정책(2)은 권장 절차와 맞다. 발행사가 출장비를 대는 것만 안 된다.", "f": "", "why": {"A": "통상적 업무 접대는 영향력 행사 목적이 아니면 I(B)에서 허용됩니다.", "B": "사모 매입 한도를 두는 정책은 I(B)가 권장하는 직원 매입 관리 절차입니다."}, "orig": "Mock 1 Session 1 Q42", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q3", "src": "모의고사 오답", "module": "10-EQ", "tag": "RI: OCI(clean surplus 위반) 조정", "vig": 86, "stem": "Firm B’s per-share residual income for Year 2 is closest to:", "opts": {"A": "$14.73.", "B": "$15.55.", "C": "$18.30."}, "ans": "C", "en": "A. $14.73. — Incorrect\nIncorrect because the capital charge is based on end-of-Year 2 book value of equity.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nBook value at the end of Year 2:\n= Book value at the end of Year 1 + net income – dividends + other comprehensive income = $133.45 + $31.56 – $4.57 + $2.75 = $163.19\nResidual income in Year 2:\n= Net income + other comprehensive income – (cost of capital × end-of-year book value) = $31.56 + $2.75 – (12% × $163.19) = $14.73\nB. $15.55. — Incorrect\nIncorrect because the residual income calculation does not adjust net income for other comprehensive income.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nResidual income in Year 2:\n= Net income – (cost of capital × beginning-of-year book value) = $31.56 – (12% × $133.45) = $15.55\nC. $18.30. — Correct\nCorrect because residual income equals net income minus equity charge (the cost of equity × beginning-of-year book value). The residual income model assumes clean surplus accounting, i.e., end-of-year book value equals beginning-of-year book value + earnings – dividends. However, there are accounting items (referred to as other comprehensive income) that can affect the book value of equity directly while bypassing the income statement.\nIn that case, net income is adjusted by the amount of other comprehensive income.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nResidual income in Year 2:\n= Net income + other comprehensive income – (cost of capital × beginning-of-year book value) = $31.56 + $2.75 – (12% × $133.45) = $18.30", "ko": "① Year 1 말 장부가 = 111 + 26.25 − 3.80 + 0 = 133.45. ② Year 2에 OCI 2.75가 장부가를 직접 바꿨으므로(clean surplus 위반) 이익에 더해 준다. RI_2 = 31.56 + 2.75 − 12% × 133.45 = 34.31 − 16.01 = $18.30.", "trap": "자본비용은 기초(Year 1 말) 장부가에 곱한다. OCI는 이익에 더해 준다.", "f": "RI_t = NI_t + OCI_t − r × B_(t−1)", "why": {"A": "자본비용을 Year 2 말 장부가에 곱했습니다(기초 장부가를 써야 함).", "B": "OCI 2.75를 이익에 더하지 않았습니다."}, "orig": "Mock 1 Session 2 Q3", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q4", "src": "모의고사 오답", "module": "10-EQ", "tag": "Gordon growth model: D1 사용", "vig": 86, "stem": "Based on the Gordon growth model, the per-share value of Firm C’s stock is closest to:", "opts": {"A": "$34.", "B": "$36.", "C": "$44."}, "ans": "B", "en": "A. $34. — Incorrect\nIncorrect because this calculation uses D0 instead of D1.\nV0 = $1.6875/(12.0% – 7.0%) = $33.75 ≈ $34,\nwhere D0 is last year’s dividend = last year’s EPS × dividend payout ratio = $3.75 × 45% = $1.6875\nB. $36. — Correct\nCorrect because the Gordon growth model (GGM) assumes that dividends grow indefinitely at a constant rate, g. Assuming that the required equity return, r, is greater than the growth rate, the value of a stock according to the GGM equals:\nV0 = D0 × (1 + g)/(r – g) = D1/(r – g), where D0 is last year’s dividend = last year’s EPS × dividend payout ratio = $3.75 × 45% = $1.6875\nD1 = $1.6875 × (1.07) = $1.8056\nV0 = $1.6875 × (1.07)/(12.0% – 7.0%) = $1.8056/(5.0%) = $36.1125 ≈ $36\nC. $44. — Incorrect\nIncorrect because D1 is calculated as last year’s EPS × (1 – dividend payout ratio) × (1 + g) = $3.75 × (1 – 45%) × (1.07) = $2.2069.\nV0 = $2.2069/(5.0%) = $44.1375 ≈ $44", "ko": "D0 = 3.75 × 45% = 1.6875, D1 = 1.6875 × 1.07 = 1.8056. V0 = 1.8056 / (12% − 7%) = $36.11 ≈ $36.", "trap": "분자는 D0가 아니라 D1. 배당은 payout ratio로 구한다(1 − payout은 유보율).", "f": "V0 = D1/(r − g), D1 = EPS0 × payout × (1 + g)", "why": {"A": "D1 대신 D0(1.6875)를 썼습니다.", "C": "배당을 (1 − payout) = 유보율로 계산했습니다."}, "orig": "Mock 1 Session 2 Q4", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q6", "src": "모의고사 오답", "module": "10-ECO", "tag": "선진국 성장 정책: 노동 공급", "vig": 87, "stem": "Which of the following policies would most likely have the greatest impact on economic growth in Country A?", "opts": {"A": "Encouraging immigration", "B": "Encouraging increased savings and investment", "C": "Loosening credit restraints in the financial sector"}, "ans": "A", "en": "A. Encouraging immigration — Correct\nCorrect because Country A already has a high rate of capital per worker and the economy is growing slowly. An increase in the quantity of labor that would result from higher immigration would likely increase economic growth.\nAnother factor increasing economic and population growth, especially among the developed countries, is immigration. Heightened immigration is a possible solution to the slowing labor force growth being experienced by many developed countries with low birthrates within the native population.\nB. Encouraging increased savings and investment — Incorrect\nIncorrect because Country A is a developed country with a high rate of capital per worker. Consequently, increased savings and investment, which would further increase capital per worker, is unlikely to substantially increase economic growth.\nOne of the major problems for some developing countries is a low level of capital per worker.\nC. Loosening credit restraints in the financial sector — Incorrect\nIncorrect because Country A being a developed economy already has a high rate of capital per worker and the economy is growing slowly. Consequently, a loosening of credit restraints, which would encourage additional capital, is unlikely to substantially increase economic growth.", "ko": "Country A는 이미 1인당 자본이 높고 성장이 느린 선진국이다. 자본을 더 늘려도(capital deepening) 수확체감 때문에 효과가 작다. 노동 투입을 늘리는 이민 장려가 성장에 가장 큰 영향을 준다.", "trap": "'저축·투자 늘리기'는 자본이 적은 개도국에 효과가 크다.", "f": "", "why": {"B": "1인당 자본이 이미 높아 자본을 더 늘려도 수확체감으로 효과가 작습니다.", "C": "신용 완화도 자본 투자를 늘리는 경로라 같은 이유로 효과가 작습니다."}, "orig": "Mock 1 Session 2 Q6", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q7", "src": "모의고사 오답", "module": "10-ECO", "tag": "성장회계: capital deepening 기여", "vig": 87, "stem": "In the most recent five years, the contribution of capital deepening to Country A's labor productivity growth was:", "opts": {"A": "0.3%.", "B": "0.8%.", "C": "0.9%."}, "ans": "C", "en": "A. 0.3%. — Incorrect\nIncorrect because this is the difference between the labor productivity annual growth rate and the growth rates of hours worked and total factor productivity:\n1.4% – 0.6% – 0.5% = 0.3%\nThe contribution of capital deepening to Country A's labor productivity growth should be the difference between the labor productivity growth rate and the total factor productivity growth rate:\n= 1.4% – 0.5% = 0.9%\nB. 0.8%. — Incorrect\nIncorrect because this is the difference between the labor productivity growth rate and the growth rate of the hours worked:\n= 1.4% – 0.6% = 0.8%\nThe contribution of capital deepening to Country A's labor productivity growth should be the difference between the labor productivity growth rate and the total factor productivity growth rate:\n= 1.4% – 0.5% = 0.9%\nC. 0.9%. — Correct\nCorrect because the contribution of capital deepening can be measured as the difference between the growth rates of labor productivity and total factor productivity (TFP). Also, the larger the difference between the productivity growth measures, the more important capital deepening is as a source of economic growth. For the most recent 5-year period, Country A's labor productivity grew by 1.4% per year of which 0.5% came from TFP growth and 0.9% (1.4% – 0.5%) from capital deepening.\nCapital deepening = labor productivity growth – TFP growth = 1.4% – 0.5% = 0.9%", "ko": "노동생산성 성장 = TFP 성장 + capital deepening 기여. 1.4% − 0.5% = 0.9%. 근로시간(0.6%)은 노동생산성 분해에 들어가지 않는다.", "trap": "근로시간 증가율을 빼면 안 된다(그건 GDP 성장 분해에 쓰임).", "f": "Capital deepening 기여 = 노동생산성 성장률 − TFP 성장률", "why": {"A": "근로시간(0.6%)까지 빼서 1.4 − 0.6 − 0.5로 계산했습니다.", "B": "TFP가 아니라 근로시간을 뺐습니다(1.4 − 0.6)."}, "orig": "Mock 1 Session 2 Q7", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q9", "src": "모의고사 오답", "module": "10-FI", "tag": "부도 시 채권 수익률(IRR)", "vig": 88, "stem": "Under his base case scenario, the annualized return on Moffet's Company A bond investment would be closest to:", "opts": {"A": "–19.57%.", "B": "–15.45%.", "C": "–9.29%."}, "ans": "A", "en": "A. –19.57%. — Correct\nCorrect because the return from the bond investment if it defaults at the end of Year 3 is –19.57%.\nIf default occurs at the end of Year 3, the bondholder will have received the two coupon payments for the first two years and can expect to receive the Year 3 recovery value of $43.20 from Exhibit 1.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + $43.20/(1 + IRR)^3\nSolving for IRR results in a value of –19.57%.\nB. –15.45%. — Incorrect\nIncorrect because this answer includes an extra coupon payment in Year 3, which is already reflected in the exposure amount as an accrual.\nThe Year 3 exposure value of $108 already reflects the accrued coupon in Year 3. If default occurs in Year 3, the recovery amount of $43.20 already includes the coupon value expected to be paid along with the principal and hence the coupon should not be added again.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + ($43.20 + $8)/(1 + IRR)^3\nSolving for IRR results in a value of –15.45%.\nC. –9.29%. — Incorrect\nIncorrect because this uses the loss given default value from Year 3 instead of the recovery value.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + $64.80/(1 + IRR)^3\nSolving for IRR results in a value of –9.29%.", "ko": "Year 3 말 부도 시나리오: Year 1·2 쿠폰 8씩은 받고, Year 3에는 회수액 43.20만 받는다. 105.35 = 8/(1+IRR) + 8/(1+IRR)^2 + 43.20/(1+IRR)^3 → IRR = −19.57%.", "trap": "Year 3 exposure 108에 이미 Year 3 쿠폰이 들어 있으므로 쿠폰을 따로 더하지 않는다. 회수액(recovery)을 써야 하며 LGD가 아니다.", "f": "105.35 = 8/(1+IRR) + 8/(1+IRR)^2 + 회수액/(1+IRR)^3", "why": {"B": "Year 3 쿠폰 8을 회수액에 또 더했습니다(이미 exposure에 포함).", "C": "회수액 43.20 대신 LGD 64.80을 썼습니다."}, "orig": "Mock 1 Session 2 Q9", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q11", "src": "모의고사 오답", "module": "10-FI", "tag": "CDS 결제: 현금 vs 실물, CTD", "vig": 88, "stem": "Would the two settlement methods for the CDS on Company C result in the same total proceeds for Moffet?", "opts": {"A": "Yes", "B": "No, cash settlement would result in higher total proceeds", "C": "No, physical settlement would result in higher total proceeds"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because the total proceeds are not the same for cash and physical settlements. The same proceeds would occur if the bond held by Moffet was also the cheapest-to-deliver bond. In this instance, however, Bond 1 is held by Moffet and trades at 40% of par, but Bond 2 is the cheapest-to-deliver bond and trades at 35% of par.\nB. No, cash settlement would result in higher total proceeds — Correct\nCorrect because the maximum total proceeds occurs if Moffet opts for cash settlement of the CDS.\nWhen Company C defaults, the CDS will recover based on the cheapest-to-deliver defaulted debt which has the same seniority as the reference obligation.\nBond 1 and Bond 2 are at the same seniority level and Bond 2 is the cheapest-to-deliver bond as it trades at 35% of par value. The payoff of the CDS is determined by the cheapest-to-deliver obligation, which is the debt instrument that can be purchased and delivered at the lowest cost but has the same seniority as the reference obligation.\nThe recovery value on Bond 2 is 35% and the loss given default, which is an indicator of credit risk, is (1 – 0.35) for the cheapest-to-deliver bond.\nTherefore, the CDS will pay out (1 – 0.35) × $10 million = $6.5 million. Moffet can then sell Bond 1 for 40% of par value for another $4 million (40% × $10 million). The total proceeds will be $6.5 million + $4 million = $10.5 million.\nC. No, physical settlement would result in higher total proceeds — Incorrect\nIncorrect because the total proceeds will not be higher in physical settlement when compared to cash settlement.\nIf Moffet opts for physical settlement, he will surrender his holding of Bond 1 and obtain the notional $10 million in cash. This is lower than the total amount that would be received if he sold the bond and cash settled the CDS ($4 million + $6.5 million = $10.5 million).", "ko": "CDS 지급액은 같은 순위의 가장 싼 채권(CTD)인 Bond 2(35)를 기준으로 정해진다. 현금결제: CDS가 (1 − 0.35) × 10M = 6.5M을 주고, 보유한 Bond 1을 시장에서 40%에 팔아 4M → 합계 10.5M. 실물결제: Bond 1을 넘기고 명목 10M을 받아 합계 10M. 그래서 현금결제가 더 많다.", "trap": "보유 채권이 CTD가 아니면 결제 방식에 따라 총액이 달라진다.", "f": "현금결제 지급액 = (1 − CTD 회수율) × 명목", "why": {"A": "보유 채권(Bond 1)이 CTD였다면 같았겠지만, CTD는 Bond 2입니다.", "C": "실물결제는 Bond 1을 넘기고 10M만 받아 현금결제(10.5M)보다 적습니다."}, "orig": "Mock 1 Session 2 Q11", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q12", "src": "모의고사 오답", "module": "10-FI", "tag": "CDS upfront premium", "vig": 88, "stem": "As a percentage of the notional amount, the estimated upfront premium for the CDS on Company D is closest to:", "opts": {"A": "1.0%.", "B": "1.4%.", "C": "1.5%."}, "ans": "B", "en": "A. 1.0%. — Incorrect\nIncorrect because this is derived by taking the difference between the CDS maturity and effective duration and multiplying it by the CDS coupon rate.\nUpfront premium = (Maturity – Effective duration) × Coupon rate\n= (3 – 2.8) × 5.0%\n= 1.0%\nB. 1.4%. — Correct\nCorrect because the approximate upfront premium for a CDS can be estimated as (Credit spread – Fixed coupon rate) × Effective duration.\nNote that the duration used here is effective duration, since the cash flows arising from the coupon leg of the CDS are uncertain because they are contingent on the reference entity not defaulting.\nEffective duration = 2.8\nCredit spread = 5.5%\nFixed coupon rate = 5.0%\nUpfront premium ≈ (Credit spread – Coupon rate) × Effective duration\n= (5.5% – 5.0%) × 2.8\n= 1.4%\nC. 1.5%. — Incorrect\nIncorrect because this uses the wrong duration of 3 years, which is the CDS maturity, instead of the effective CDS duration, to calculate the upfront premium.\nUpfront premium ≈ (Credit spread – Coupon rate) × Maturity\n= (5.5% – 5.0%) × 3\n= 1.5%", "ko": "(5.5% − 5.0%) × 2.8 = 1.4%. CDS의 쿠폰 다리는 부도가 안 나야만 지급되는 불확실한 현금흐름이라 만기가 아니라 effective duration을 쓴다.", "trap": "CDS 만기(3년)가 아니라 effective duration(2.8)을 곱한다.", "f": "Upfront ≈ (credit spread − fixed coupon) × effective duration", "why": {"A": "(만기 − duration) × 쿠폰으로 잘못 계산했습니다.", "C": "duration 대신 만기 3년을 곱했습니다."}, "orig": "Mock 1 Session 2 Q12", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q18", "src": "모의고사 오답", "module": "10-FSA", "tag": "Current rate method: 누적 환산조정", "vig": 89, "stem": "On 31 December of the most recent year, after translating Ametrine, Obsidian should have reported a:", "opts": {"A": "foreign exchange loss on its consolidated income statement.", "B": "positive translation adjustment on its consolidated balance sheet.", "C": "negative translation adjustment on its consolidated balance sheet."}, "ans": "B", "en": "A. foreign exchange loss on its consolidated income statement. — Incorrect\nIncorrect because Obsidian translates Ametrine's financial statements using the current rate method, with a translation adjustment reported on the consolidated balance sheet rather than the income statement. Gains or losses are reported on the consolidated income statement only when a subsidiary is translated using the temporal method.\nB. positive translation adjustment on its consolidated balance sheet. — Correct\nCorrect because the current rate method results in a net asset balance sheet exposure (except in the rare case in which an entity has negative stockholders' equity):\nItems Translated at Current Exchange Rate\nTotal assets > Total liabilities → Net asset balance sheet exposure\nWhen the foreign currency increases in value (i.e., strengthens), application of the current rate method results in an increase in the positive cumulative translation adjustment (or a decrease in the negative translation adjustment) reflected in stockholders' equity.\nSince Ametrine had positive equity (assets > liabilities), and the foreign currency (GBP) of Ametrine strengthened against the EUR, Obsidian should report a positive translation adjustment to stockholders' equity on the consolidated balance sheet.\nC. negative translation adjustment on its consolidated balance sheet. — Incorrect\nIncorrect because when the foreign currency decreases in value (i.e., weakens), the current rate method results in a decrease in the positive cumulative translation adjustment (or an increase in the negative cumulative translation adjustment) in stockholders' equity.\nDuring the most recent year, the foreign currency (GBP) strengthened, rather than weakened, against the EUR. A positive translation adjustment should be reported on the consolidated balance sheet.", "ko": "Current rate method는 자산·부채를 모두 기말 환율로 환산하므로 순자산(자본) 노출이 생긴다. Ametrine은 자본이 양수이고 GBP가 EUR 대비 강해졌으므로, 순자산의 EUR 가치가 늘어 연결 재무상태표(자본, OCI)에 양(+)의 환산조정이 생긴다.", "trap": "current rate method의 환산손익은 손익계산서가 아니라 자본(CTA)에 간다.", "f": "", "why": {"A": "current rate method의 환산손익은 손익계산서가 아니라 자본에 반영됩니다.", "C": "외화(GBP)가 강해졌고 순자산 노출이라 조정은 양(+)입니다."}, "orig": "Mock 1 Session 2 Q18", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q24", "src": "모의고사 오답", "module": "10-PM", "tag": "실질 무위험 금리 결정 요인", "vig": 90, "stem": "Based on the macroeconomic data of the three countries, real short-term default-free interest rates are most likely highest in:", "opts": {"A": "Country 1.", "B": "Country 2.", "C": "Country 3."}, "ans": "C", "en": "A. Country 1. — Incorrect\nIncorrect because Country 1 has the lowest real GDP growth rate (2.8%) and the lowest volatility of real GDP growth (0.5%). Therefore, real default-free interest rates in Country 1 are most likely the lowest of the three countries.\nB. Country 2. — Incorrect\nIncorrect because, although Country 2 has the same real GDP growth rate (4.2%) as Country 3, the volatility of its real GDP growth (0.5%) is lower than Country 3's (0.8%). Therefore, real default-free interest rates in Country 2 are most likely lower than in Country 3.\nC. Country 3. — Correct\nCorrect because Country 3 has both the highest real GDP growth rate (4.2%) and the highest volatility of real GDP growth (0.8%) among the three countries.\nAn economy with higher trend real economic growth, other things being equal, should have higher real default-free interest rates than an economy with lower trend growth. This is because more goods and services will be available in the future relative to today, so investors' willingness to substitute over time will fall, resulting in less saving and more borrowing, so that the real default-free interest rate increases.\nAlso, other things being equal, real interest rates are higher in an economy in which GDP growth is more volatile than in an economy in which growth is more stable. Because of such uncertain circumstances, the real default-free interest rate will be positively related to the expected volatility of GDP growth.", "ko": "실질 성장률이 높을수록(미래 소비가 더 많아 지금 저축할 유인↓) 실질 금리가 높다. 성장의 변동성이 클수록 소비 헤지 수요가 커져 위험프리미엄이 붙어 실질 금리가 높다. Country 3은 성장률(4.2%)과 변동성(0.8%)이 둘 다 가장 높다.", "trap": "Country 2와 3은 성장률이 같으니 변동성으로 구분한다.", "f": "", "why": {"A": "성장률(2.8%)과 변동성(0.5%)이 모두 가장 낮아 실질 금리가 가장 낮습니다.", "B": "성장률은 Country 3과 같지만 변동성(0.5%)이 낮습니다."}, "orig": "Mock 1 Session 2 Q24", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q30", "src": "모의고사 오답", "module": "10-EQ", "tag": "2단계 FCFF 가치: ESG 프리미엄", "vig": 91, "stem": "Based on Connor’s assumptions, the company value (in $ millions) of Omega is closest to:", "opts": {"A": "27,500.", "B": "29,700.", "C": "32,600."}, "ans": "B", "en": "A. 27,500. — Incorrect\nIncorrect because the terminal value of the firm is discounted back three years instead of two years. The value of Omega is erroneously computed as follows.\nStep 1 Identify the FCFFs\nConnor is using a two-stage model with no growth in the first two years followed by a long-term growth rate of 3% starting in Year 3. The first three FCFFs would be:\nYear\tFCFF\n1\t$1,850\n2\t$1,850\n3\t$1,906 = $1,850 × (1 + 3.0%)\nStep 2 Estimate the WACC\nCost of debt = (Pre-tax cost of debt) × (1 – Tax rate) = 6.0% × (1 – 25%) = 4.5%\nCost of equity = Risk-free rate + [Beta × (Market risk premium)] + ESG premium\nCost of equity = 3.5% + [1.4 × 5.5%] + 0.9% = 12.1%\nWACC = Proportion of debt × Cost of debt + Proportion of equity × Cost of equity\nWACC = 0.4 × 4.5% + 0.6 × 12.1% = 9.06%\nStep 3 Estimate the terminal value of the firm but incorrectly assume that the TV is at the end of Year 3\nTV3 = CF3/(WACC – Long-term growth rate) = $1,906/(9.06% – 3.0%) = $31,444\nStep 4 Compute the value of the FCFFs to estimate the value of the firm\nValue of the firm = FCFF1/(1 + WACC) + FCFF2/(1 + WACC)^2 + TV3/(1 + WACC)^3\nValue of the firm = $1,850/1.0906 + $1,850/(1.0906)^2 + $31,444/(1.0906)^3\nValue of the firm = $1,696 + $1,555 + $24,240 = $27,492 ≈ $27,500\nB. 29,700. — Correct\nCorrect because the company value of Omega is the present value of the forecast FCFFs discounted at the WACC, which includes an ESG risk premium added to the cost of equity. The value of Omega is computed as follows.\nStep 1 Identify the FCFFs\nConnor is using a two-stage model with no growth in the first two years followed by a long-term growth rate of 3.0% starting in Year 3. The first three FCFFs would be:\nYear\tFCFF\n1\t$1,850\n2\t$1,850\n3\t$1,906 = $1,850 × (1 + 3.0%)\nStep 2 Estimate the WACC\nCost of debt = (Pre-tax cost of debt) × (1 – Tax rate) = 6.0% × (1 – 25%) = 4.5%\nCost of equity = Risk-free rate + [Beta × (Market risk premium)] + ESG premium\nCost of equity = 3.5% + [1.4 × 5.5%] + 0.9% = 12.1%\nWACC = Proportion of debt × Cost of debt + Proportion of equity × Cost of equity\nWACC = 0.4 × 4.5% + 0.6 × 12.1% = 9.06%\nStep 3 Estimate the terminal value of the firm at the end of Year 2\nTV2 = CF3/(WACC – Long-term growth rate) = $1,906/(9.06% – 3.0%) = $31,444\nStep 4 Compute the value of the FCFFs to estimate the value of the firm\nValue of the firm = FCFF1/(1 + WACC) + (FCFF2 + TV2)/(1 + WACC)^2\nValue of the firm = $1,850/1.0906 + ($1,850 + $31,444)/(1.0906)^2\nValue of the firm = $1,696 + $27,992 = $29,688 ≈ $29,700\nC. 32,600. — Incorrect\nIncorrect because the ESG risk premium is ignored and not added to the cost of equity. The value of Omega is erroneously computed as follows.\nStep 1 Identify the FCFFs\nConnor is using a two-stage model with no growth in the first two years followed by a long-term growth rate of 3% starting in Year 3. The first three FCFFs would be:\nYear\tFCFF\n1\t$1,850\n2\t$1,850\n3\t$1,906 = $1,850 × (1 + 3.0%)\nStep 2 Estimate the WACC\nCost of debt = (Pre-tax cost of debt) × (1 – Tax rate)\nCost of debt = 6.0% × (1 – 25%) = 4.5%\nCost of equity = Risk-free rate + [Beta × (Market risk premium)]\nCost of equity = 3.5% + [1.4 × 5.5%] = 11.2%\nWACC = Proportion of debt × Cost of debt + Proportion of equity × Cost of equity\nWACC = 0.4 × 4.5% + 0.6 × 11.2% = 8.52%\nStep 3 Estimate the terminal value of the firm at the end of Year 2\nTV2 = CF3/(WACC – Long-term growth rate) = $1,906/(8.52% – 3.0%) = $34,520\nStep 4 Compute the value of the FCFFs to estimate the value of the firm\nValue of the firm = FCFF1/(1 + WACC) + (FCFF2 + TV2)/(1 + WACC)^2\nValue of the firm = $1,850/1.0852 + ($1,850 + $34,520)/(1.0852)^2\nValue of the firm = $1,705 + $30,883 = $32,588 ≈ $32,600", "ko": "세후 부채비용 = 6% × 0.75 = 4.5%. 자기자본비용 = 3.5 + 1.4 × 5.5 + 0.9 = 12.1%. WACC = 0.4 × 4.5 + 0.6 × 12.1 = 9.06%. FCFF3 = 1,850 × 1.03 = 1,906, TV2 = 1,906/(9.06% − 3%) = 31,444. 가치 = 1,850/1.0906 + (1,850 + 31,444)/1.0906² = 1,696 + 27,992 = $29,688M ≈ 29,700.", "trap": "TV는 Year 2 말 값이라 2년만 할인한다. ESG 프리미엄은 자기자본비용에 더한다.", "f": "WACC = wd × rd(1 − t) + we × (RF + β × ERP + ESG 프리미엄), TV2 = FCFF3/(WACC − g)", "why": {"A": "Year 2 말 터미널 가치를 3년 할인했습니다.", "C": "ESG 프리미엄을 빼 할인율이 낮아져 가치가 커졌습니다."}, "orig": "Mock 1 Session 2 Q30", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q31", "src": "모의고사 오답", "module": "10-EQ", "tag": "자본구조 변경과 FCFF", "vig": 91, "stem": "After incorporating Omega's capital structure change, Connor's FCFF forecasts would most likely be:", "opts": {"A": "lower.", "B": "unchanged.", "C": "higher."}, "ans": "B", "en": "A. lower. — Incorrect\nIncorrect because FCFF is determined before any payments are made to the suppliers of capital. The issuance of debt for the purpose of repurchasing common shares only impacts how the FCFF is distributed to the suppliers of capital but not what the FCFF is.\nAn increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense.\nB. unchanged. — Correct\nCorrect because FCFF is determined before any payments are made to the suppliers of capital. The issuance of debt for the purpose of repurchasing common shares only impacts how the FCFF is distributed to the suppliers of capital but not what the FCFF is.\nChanging leverage (changing the amount of debt financing in the company’s capital structure), however, does have some effects on FCFE particularly. An increase in leverage will not affect FCFF (although it might affect the calculations used to arrive at FCFF). An increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense.\nAlso consider the top down calculation of FCFF starting with cash flow from operations (CFO):\nAssuming that interest paid is included in operating cash flow, FCFF can be estimated as follows:\nFree cash flow to the firm = Cash flow from operations\nPlus: Interest expense × (1 − Tax rate )\nLess: Investment in fixed capital,\nor\nFCFF = CFO + Int(1 – Tax rate) – FCInv.\nNotice that FCFF does not include any returns to investors. The after-tax interest (Int(1 – Tax rate)) payment in the FCFF calculation is there only because it was previously deducted in the calculation of CFO.\nC. higher. — Incorrect\nIncorrect because FCFF is determined before any payments are made to the suppliers of capital. The issuance of debt for the purpose of repurchasing common shares only impacts how the FCFF is distributed to the suppliers of capital but not what the FCFF is.\nAn increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense.", "ko": "FCFF는 자본 제공자에게 지급하기 전의 현금흐름이다. 부채를 발행해 자사주를 사는 것은 FCFF를 누구에게 나누느냐만 바꿀 뿐 FCFF 자체는 그대로다(FCFE는 바뀜).", "trap": "레버리지 변화는 FCFE와 WACC에 영향을 주지, FCFF 예측치는 그대로다.", "f": "", "why": {"A": "부채 이자는 FCFF 계산 이후에 나누는 것이라 FCFF를 줄이지 않습니다.", "C": "자본구조 변경으로 영업 현금흐름이 늘지 않습니다."}, "orig": "Mock 1 Session 2 Q31", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q35", "src": "모의고사 오답", "module": "10-DER", "tag": "선물옵션 put-call parity (Black)", "vig": 92, "stem": "The value of the call option on equity index futures is closest to:", "opts": {"A": "25.", "B": "30.", "C": "35."}, "ans": "B", "en": "A. 25. — Incorrect\nIncorrect because the difference between the futures price and the strike price is not discounted.\nc = (1,100 – 1,300) + 225 = 25\nB. 30. — Correct\nCorrect because the data provided on the put with the same underlying, strike price, and time to expiration is used in the following formula to determine the value of the call option:\nc = e^((-rT)^())[F0(T) – X] + ρ\nρ = 225\nF0(T) = 1,100\nX = 1,300\nr = 0.05\nT = 6 / 12 = 0.5\nTherefore\nc = e^(()^(–0.05 x 0.5))× [1,100 – 1,300] + 225\nc = 0.97531 × (–200) + 225\nc = 29.93802 ≈ 30\nC. 35. — Incorrect\nIncorrect because the 0.5 in the exponent is ignored.\nc = e^(()^(–0.05))[1,100 – 1,300] + 225\nc = 0.95123 × –200 + 225\nc = –190.246 + 225\nc = 34.754 ~ 35", "ko": "c = 225 + e^(−0.05 × 0.5) × (1,100 − 1,300) = 225 + 0.97531 × (−200) = 225 − 195.06 = 29.94 ≈ 30.", "trap": "(F − X)를 할인하고, T = 6/12 = 0.5를 지수에 넣는다.", "f": "c = p + e^(−rT) × (F − X)", "why": {"A": "(F − X)를 할인하지 않았습니다.", "C": "지수에 T = 0.5를 곱하지 않았습니다."}, "orig": "Mock 1 Session 2 Q35", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q41", "src": "모의고사 오답", "module": "10-ETH", "tag": "IPO 참여: VI(B) 거래 우선순위", "vig": 93, "stem": "With respect to the IPO, does Hirayo violate the Standard relating to priority of transactions?", "opts": {"A": "No", "B": "Yes, because he allocates shares to himself", "C": "Yes, because he applied for the IPO for his personal account"}, "ans": "A", "en": "A. No — Correct\nCorrect because Summit receives all requested IPO shares and Hirayo allocates them pro rata among his subscribing clients and his own account, with no client being disadvantaged. Therefore, Hirayo does not violate the Standards.\nAccording to Standard VI(B) Priority of Transactions, members and candidates should not benefit from the position that their clients occupy in the marketplace—through preferred trading, the allocation of limited offerings, or oversubscription.\nB. Yes, because he allocates shares to himself — Incorrect\nIncorrect because, although Hirayo receives IPO shares, he does not disadvantage his clients. Summit receives all requested IPO shares and Hirayo allocates them pro rata among his subscribing clients and his own account, with no client being disadvantaged. Therefore, Hirayo does not violate the Standards.\nAccording to Standard VI(B) Priority of Transactions, members and candidates should not benefit from the position that their clients occupy in the marketplace—through preferred trading, the allocation of limited offerings, or oversubscription.\nC. Yes, because he applied for the IPO for his personal account — Incorrect\nIncorrect because Hirayo does not disadvantage his clients by applying for the IPO for his personal account. Summit receives all requested IPO shares and Hirayo allocates them pro rata among his subscribing clients and his own account, with no client being disadvantaged. Therefore, Hirayo does not violate the Standards.\nAccording to Standard VI(B) Priority of Transactions, members and candidates should not benefit from the position that their clients occupy in the marketplace—through preferred trading, the allocation of limited offerings, or oversubscription.", "ko": "Hirayo는 사전 승인(preclearance)을 받았고, 청약이 결국 다 찼어도 Summit이 신청 물량을 전부 받았다. 그는 이를 청약 고객과 본인 계좌에 비례 배분했으므로 고객이 손해 본 것이 없다. VI(B) 위반이 아니다.", "trap": "본인 IPO 참여 자체가 위반은 아니다. 고객 몫을 줄였는지가 기준이다.", "f": "", "why": {"B": "신청 물량을 전부 받아 비례 배분했으니 고객에게 손해가 없습니다.", "C": "사전 승인을 받았고 고객에게 불리하지 않아 참여해도 됩니다."}, "orig": "Mock 1 Session 2 Q41", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q42", "src": "모의고사 오답", "module": "10-ETH", "tag": "공개된 리포트로 매매: II(A)", "vig": 93, "stem": "When purchasing ION shares, does Hirayo violate the Standards?", "opts": {"A": "No", "B": "Yes, because he acts on material nonpublic information", "C": "Yes, because he does not have a reasonable basis for buying the shares"}, "ans": "A", "en": "A. No — Correct\nCorrect because the leading analyst issued the strong buy rating on ION during the morning, which means it is already public information. According to Standard II(A) Material Nonpublic Information, once the information is disseminated to the market, it is public information that is no longer covered by this standard. Similarly, the rumor about the merger is also no longer considered material nonpublic information.\nB. Yes, because he acts on material nonpublic information — Incorrect\nIncorrect because the leading analyst issued the strong buy rating on ION during the morning, which means it is already public information. According to Standard II(A) Material Nonpublic Information, once the information is disseminated to the market, it is public information that is no longer covered by this standard. Similarly, the rumor about the merger is also no longer considered material nonpublic information.\nC. Yes, because he does not have a reasonable basis for buying the shares — Incorrect\nIncorrect because a reasonable basis is required by Standard V(A) Diligence and Reasonable Basis when making investment analysis, recommendations, and actions for clients and for the firm. Hirayo bought the securities for his own account. The Standards do not impose a requirement of diligence or reasonable basis on personal trades.", "ko": "브로커들이 말한 리포트(합병 루머·강력 매수 의견)는 그날 아침 온라인에 이미 공개된 것이다. 공개된 정보는 MNPI가 아니므로 II(A) 위반이 아니다. 본인 계좌 매매라 고객용 reasonable basis 요건(V(A))도 해당 없다.", "trap": "'식당에서 엿들었다'가 아니라 '이미 공개된 리포트'인지가 핵심이다.", "f": "", "why": {"B": "리포트는 이미 공개돼 비공개 정보가 아닙니다.", "C": "V(A)는 고객·회사를 위한 분석·추천에 적용되고, 본인 계좌 매수에는 해당하지 않습니다."}, "orig": "Mock 1 Session 2 Q42", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q43", "src": "모의고사 오답", "module": "10-ETH", "tag": "보상 공개: VI(A) 이해상충", "vig": 93, "stem": "In relation to his compensation, Hirayo violates the Standards when he fails to disclose:", "opts": {"A": "the $60,000 bonus only.", "B": "the $12,000 reward only.", "C": "both the $60,000 bonus and the $12,000 reward."}, "ans": "A", "en": "A. the $60,000 bonus only. — Correct\nCorrect because, according to Standard VI(A) Disclosure of Conflicts, a conflict of interest is any matter that could reasonably be expected to impair independence and objectivity or raise a question about whether actions, judgement, or decision making is free from bias. A common source of conflict is compensation structure, especially incentive and bonus structures that provide immediate returns for members and candidates with little or no consideration of long-term value creation.\nMembers and Candidates must avoid or make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer.\nHirayo violates Standard VI(A) when he fails to disclose the $60,000 performance bonus arrangement to his prospective clients.\nB. the $12,000 reward only. — Incorrect\nIncorrect because Hirayo is not in violation of the CFA Institute Code and Standards. The $12,000 does not have to be disclosed to clients because it is not a referral fee or additional compensation, and it does not create a conflict of interest with his employer, clients, or prospective clients.\nAccording to Standard VI(C): Conflicts of Interest, Referral Fees, referral fees are any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services.\nThe $12,000 reward Hirayo will receive from Summit for bringing over clients from his previous employer is not a referral fee because this reward is paid by Summit (the employer) and not charged to clients. This amount is compensation paid by the firm, not a fee charged to clients.\nC. both the $60,000 bonus and the $12,000 reward. — Incorrect\nIncorrect because Hirayo is not in violation of the Standards when he fails to disclose the $12,000 reward received from Summit (the employer) for bringing over clients, with Summit paying the reward that is not charged back to clients. The $12,000 does not have to be disclosed to clients because it is not a referral fee or additional compensation, and it does not create a conflict of interest with his employer, clients, or prospective clients.\nHowever, Hirayo violates the Standards regarding the $60,000 performance bonus arrangement by not disclosing it to his prospective clients.", "ko": "월간 성과가 다른 포트폴리오보다 좋으면 받는 $60,000 보너스는 단기 성과를 쫓게 만드는 이해상충이라 잠재 고객에게도 공개해야 한다. Hirayo는 기존 고객에게만 알렸으므로 위반. $12,000는 Summit이 자기 돈으로 주는 고객 유치 보상이고 고객에게 비용이 없어 공개 의무가 없다.", "trap": "성과 보너스는 기존 고객뿐 아니라 잠재 고객에게도 공개한다. 회사가 직접 주는 유치 보상은 referral fee가 아니다.", "f": "", "why": {"B": "$12,000는 고객에게 청구되지 않는 회사의 보상이라 공개 의무가 없습니다.", "C": "$12,000는 공개 대상이 아니고 $60,000만 위반입니다."}, "orig": "Mock 1 Session 2 Q43", "subject": "Mock1"}, {"id": "Mock1:mock1-2-Q44", "src": "모의고사 오답", "module": "10-ETH", "tag": "기록 보관: V(C)", "vig": 93, "stem": "To comply with the Standards, which provision in Summit’s record retention policy should be amended?", "opts": {"A": "Provision 1", "B": "Provision 2", "C": "Provision 3"}, "ans": "B", "en": "A. Provision 1 — Incorrect\nIncorrect because, according to Standard V(C) Record Retention, records may be maintained either in hard copy or electronic form.\nB. Provision 2 — Correct\nCorrect because, according to Standard V(C) Record Retention, the nature or format of the information does not remove a member’s or candidate’s responsibility to maintain a record of information used in his or her analysis or communicated to clients.\nExamples of non-print media formats that should be retained include, but are not limited to, e-mails, text messages, blog posts, and Twitter posts.\nC. Provision 3 — Incorrect\nIncorrect because, according to Standard V(C) Record Retention, firms may also implement policies detailing the applicable time frame for retaining research and client communication records. Fulfilling such regulatory and firm requirements satisfies the requirements of Standard V(C).\nThe Standard adds that in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years. The 7-year retention period is only recommended in the absence of a firm policy.\nㄴ", "ko": "V(C)는 분석·고객 소통에 쓴 정보의 형식과 상관없이 기록을 보관하라고 한다. 블로그·짧은 메시지(트위터 등) 게시물도 보관 대상이라 '보관 안 해도 된다'는 Provision 2를 고쳐야 한다.", "trap": "종이·전자 형식은 자유, 보관 기간은 회사가 정할 수 있다(현지 규정 없으면 7년 권고).", "f": "", "why": {"A": "기록은 종이 또는 전자 형식 어느 쪽으로든 보관할 수 있습니다.", "C": "보관 기간은 회사 정책으로 정할 수 있습니다."}, "orig": "Mock 1 Session 2 Q44", "subject": "Mock1"}, {"id": "Mock2:mock2-Q2", "src": "모의고사 오답", "module": "11-DER", "tag": "receive-fixed 스왑 가치", "vig": 94, "stem": "The value (in ZAR) of the receive-fixed interest rate swap position is closest to:", "opts": {"A": "318,000.", "B": "398,000.", "C": "481,000."}, "ans": "A", "en": "A. 318,000. — Correct\nCorrect because the value of a swap is calculated as follows:\nFirst, the sum of the appropriate PV factors is calculated:\n\tSpot Market Reference Rate\tPV Factors\n6-month\t3.79%\t0.9814\n12-month\t4.15%\t0.9602\n\tΣ PV\t1.9416\nThen the value of the swap is determined as follows:\nVSWAP,t = NA × (FS0 – FSt) × AP × ∑^ni=1 PVi\nWhere:\nVSWAP,t = value of receive-fixed swap\nNA = notional amount\nFS0 = initial fixed rate\nFSt = current fixed rate\nAP = accrual period (semiannual, 180 / 360)\n∑^ni=1 PVi = sum of the present value factors\n= 10,000,000 x (0.0738 – 0.041) × 180 / 360 x 1.9416\n= 318,422.40\n≈ 318,000\nB. 398,000. — Incorrect\nIncorrect because the current fixed rate of the swap is used instead of the difference, as follows:\nVSWAP,t = NA × (FS0 – FSt) × AP × ∑^ni=1 PVi\n= 10,000,000 x 0.041 × 180 / 360 x 1.9416\n= 398,028.00\n≈ 398,000\nC. 481,000. — Incorrect\nIncorrect because the 3-month PV factors is incorrectly included when calculating the sum of the PV factors:\n\tSpot Market Reference Rate\tPV Factors\n3-month\t3.67%\t0.9909\n6-month\t3.79%\t0.9814\n12-month\t4.15%\t0.9602\n\tΣ PV\t2.9325\nThen the value of the swap is determined as follows:\nVSWAP,t = NA × (FS0 – FSt) × AP × ∑^ni=1 PVi\n= 10,000,000 × (0.0738 – 0.041) × 180 / 360 × 2.9325\n= 480,930.00\n≈ 481,000", "ko": "남은 만기 1년, 반기 리셋이므로 남은 지급일은 6개월·12개월 두 번이다. PV factor 합 = 0.9814 + 0.9602 = 1.9416 (3개월 값은 지급일이 아니라 안 씀). receive-fixed 쪽은 처음 고정금리 7.38%를 받고 지금 시장 고정금리는 4.10%라 이득이다. 가치 = 10,000,000 × (0.0738 − 0.041) × 180/360 × 1.9416 = 318,422 ≈ ZAR 318,000.", "trap": "PV factor는 남은 결제일(6M, 12M)만 더한다. 고정금리 '차이'를 곱해야 한다.", "f": "V = NA × (FS0 − FSt) × AP × ΣPV", "why": {"B": "금리 차이 대신 현재 고정금리 4.10%만 곱했습니다.", "C": "결제일이 아닌 3개월 PV factor까지 더했습니다(합 2.9325)."}, "orig": "Mock 2 Session 1 Q2", "subject": "Mock2"}, {"id": "Mock2:mock2-Q7", "src": "모의고사 오답", "module": "11-EQ", "tag": "인수 대상 기업 가치평가 모형", "vig": 95, "stem": "Which of the following is the most appropriate model to value Firm B?", "opts": {"A": "DDM", "B": "FCFE", "C": "FCFF"}, "ans": "C", "en": "A. DDM — Incorrect\nIncorrect because the possible takeover will likely result in the new owner altering its dividend and capital structure policies.\nB. FCFE — Incorrect\nIncorrect because, with the possibility of a change in control and capital structure, the free cash flow to the firm is more appropriate as it represents funds a new owner can access to change the capital structure and payments to the firm's financing sources.\nC. FCFF — Correct\nCorrect because, with a growing cash reserve, Firm B's dividends paid differ significantly from the company's capacity to pay dividends. With a possible change in control, Norberg expects a change in dividend payouts and a greater reliance on debt financing (and thus a change in capital structure to emphasize new debt over new equity).\nThe FCFF model is often chosen in the case of a levered company with a changing capital structure. First, if historical data are used to forecast free cash flow growth rates, FCFF growth might reflect fundamentals more clearly than does FCFE growth, which reflects fluctuating amounts of net borrowing. Second, in a forward-looking context, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify.", "ko": "Firm B는 현금이 쌓여 실제 배당이 배당 여력과 다르고, 인수되면 새 주인이 배당 정책을 바꾸고 부채를 늘려(자본구조 변경) 투자를 유지할 것으로 예상된다. 지배권이 바뀌고 자본구조가 바뀌는 경우에는 FCFF가 가장 알맞다. 레버리지가 바뀌면 자기자본비용이 크게 변하지만 WACC는 덜 변하기 때문이다.", "trap": "배당 정책이 바뀌면 DDM 탈락, 자본구조(부채)가 바뀌면 FCFE보다 FCFF.", "f": "", "why": {"A": "인수 뒤 배당 정책이 바뀔 것이라 DDM은 맞지 않습니다.", "B": "부채 발행으로 자본구조가 바뀌면 순차입이 출렁여 FCFE보다 FCFF가 낫습니다."}, "orig": "Mock 2 Session 1 Q7", "subject": "Mock2"}, {"id": "Mock2:mock2-Q14", "src": "모의고사 오답", "module": "11-AI", "tag": "선물 곡선 이론 (backwardation)", "vig": 96, "stem": "Based on Exhibit 1 and Becker's additional information, the shape of the futures price curve of Commodity 3 is most consistent with the:", "opts": {"A": "insurance theory.", "B": "theory of storage.", "C": "hedging pressure hypothesis."}, "ans": "B", "en": "A. insurance theory. — Incorrect\nIncorrect because the insurance theory explains the situation of backwardation with the fact that there is more hedging by producers than consumers. Alternatively, this theory posits that the futures price has to be lower than the current spot price as a form of payment or remuneration to the speculator who takes on the price risk and provides price insurance to the commodity seller. However, the case states that hedging by consumers exceeds hedging by producers, which is inconsistent with the insurance theory, given that the market is in backwardation.\nB. theory of storage. — Correct\nCorrect because Commodity 3 is in backwardation. Backwardation occurs when the convenience yield exceeds storage costs, based on the following formula, which describes the theory of storage: Futures Price = Spot Price + Direct Storage Costs – Convenience Yield. This situation is described in the vignette.\nIn contrast, the fact that hedging by consumers exceeds hedging by producers would lead to a situation of contango based on the hedging pressure hypothesis. However, based on Exhibit 1, Commodity 3 is in backwardation, which means that this theory cannot explain the shape of the price curve. Finally, while the insurance theory describes a situation of backwardation, it requires that there is more hedging by producers than by consumers.\nTo sum up, the backwardation of Commodity 3 is consistent with the theory of storage and the situation where the convenience yield exceeds storage costs. Given Becker's information about relative hedging positions, backwardation cannot be explained by either the insurance theory or the hedging pressure hypothesis, since backwardation would require hedging demand of producers (and not consumers) to exceed hedging demand of consumers (and not producers).\nC. hedging pressure hypothesis. — Incorrect\nIncorrect because the hedging pressure hypothesis describes the shape of the price curve with reference to relative hedging demand. The case states that there is more demand for hedging from consumers than from producers. Based on the hedging pressure hypothesis, this will lead to a situation of contango. However, Commodity 3 is in backwardation.", "ko": "Commodity 3은 현물 87.20 > 근월 85.90 > 원월 84.60이라 backwardation이다. 정보: 소비자 헤지 수요 > 생산자 헤지 수요, convenience yield > 저장비용. 저장 이론(선물 = 현물 + 저장비용 − convenience yield)에서는 convenience yield가 크면 선물이 현물보다 낮아 backwardation이 된다 → 맞음. 헤지 압력 가설에서는 소비자 헤지가 많으면(소비자가 선물 매수) contango가 되어야 하는데 실제는 backwardation → 설명 못 함. 보험 이론도 생산자 헤지가 많아야 backwardation이라 맞지 않는다.", "trap": "소비자 헤지 우세 → 헤지 압력 가설로는 contango. 실제 곡선과 반대라 답이 될 수 없다.", "f": "Futures = Spot + Storage cost − Convenience yield", "why": {"A": "보험 이론은 생산자 헤지가 많을 때 backwardation을 설명합니다. 여기는 소비자 헤지가 많습니다.", "C": "소비자 헤지가 많으면 헤지 압력 가설은 contango를 예측하지만 Commodity 3은 backwardation입니다."}, "orig": "Mock 2 Session 1 Q14", "subject": "Mock2"}, {"id": "Mock2:mock2-Q16", "src": "모의고사 오답", "module": "11-AI", "tag": "상품 지수 선택: 리밸런싱·backwardation", "vig": 96, "stem": "Based on his objective regarding the commodity index investment, Wyman should select an index that:", "opts": {"A": "rebalances frequently and contains a large percentage of constituents in backwardation.", "B": "rebalances frequently and contains a small percentage of constituents in backwardation.", "C": "rebalances infrequently and contains a large percentage of constituents in backwardation."}, "ans": "C", "en": "A. rebalances frequently and contains a large percentage of constituents in backwardation. — Incorrect\nIncorrect because frequent rebalancing can lead to underperformance in a trending market, because the outperforming assets are sold, but will continue up in price, whereas the underperforming assets are purchased, but will drift lower. With regard to backwardation, commodity sectors in backwardation typically improve index returns. This is because backwardation leads to positive roll returns.\nB. rebalances frequently and contains a small percentage of constituents in backwardation. — Incorrect\nIncorrect because frequent rebalancing can lead to underperformance in a trending market, because the outperforming assets are sold, but will continue up in price, whereas the underperforming assets are purchased, but will drift lower. Also, a small percentage of constituents in backwardation limits the potential for positive roll return. Instead, a large percentage of constituents in backwardation is preferred.\nC. rebalances infrequently and contains a large percentage of constituents in backwardation. — Correct\nCorrect because in markets that are trending, infrequent rebalancing coupled with a large percentage of constituents in backwardation provides the largest contribution to performance among the three options. With regard to rebalancing, frequent rebalancing can lead to underperformance in a trending market, because the outperforming assets are sold, but will continue up in price, whereas the underperforming assets are purchased, but will drift lower. With regard to backwardation, commodity sectors in backwardation typically improve index returns. This is because backwardation leads to positive roll returns. So a large percentage of constituents in backwardation is preferred.", "ko": "추세장(오른 것은 계속 오르고 내린 것은 계속 내림)에서는 자주 리밸런싱하면 오른 것을 팔고 내린 것을 사게 되어 손해다 → 리밸런싱은 드물게. 곡선 모양이 그대로라면 backwardation 종목은 롤 수익이 양수라 지수 수익을 높인다 → backwardation 비중이 큰 지수. 따라서 C.", "trap": "추세장 = 리밸런싱을 덜 할수록 유리. 리밸런싱은 평균 회귀(mean-reverting) 장에서 유리하다.", "f": "", "why": {"A": "backwardation 비중은 맞지만 추세장에서 잦은 리밸런싱은 성과를 깎습니다.", "B": "잦은 리밸런싱도, 적은 backwardation 비중(롤 수익 제한)도 불리합니다."}, "orig": "Mock 2 Session 1 Q16", "subject": "Mock2"}, {"id": "Mock2:mock2-Q22", "src": "모의고사 오답", "module": "11-FSA", "tag": "IFRS 손상차손 (CGU)", "vig": 97, "stem": "Based on Kriser's projections, the expected impairment loss for Delphine's cash-generating unit is:", "opts": {"A": "€200,000.", "B": "€300,000.", "C": "€500,000."}, "ans": "C", "en": "A. €200,000. — Incorrect\nIncorrect because the impairment loss under IFRS is the difference between the recoverable amount and the carrying value of the cash-generating unit. This answer choice assumes that the impairment loss is the difference between the excess carrying value and the recorded goodwill of the cash-generating unit.\nB. €300,000. — Incorrect\nIncorrect because the impairment loss (the difference between these two amounts) is first applied to the goodwill that has been allocated to the cash-generating unit. Once this has been reduced to zero, the remaining amount of the loss is then allocated to all of the other non-cash assets in the unit on a pro rata basis. This answer choice assumes that the impairment loss is limited to the goodwill allocated to the reporting unit.\nC. €500,000. — Correct\nCorrect because, under IFRS, an impairment loss is recognized if the recoverable amount of the cash-generating unit is less than its carrying value. The impairment loss (the difference between these two amounts) is first applied to the goodwill that has been allocated to the cash-generating unit. Once this has been reduced to zero, the remaining amount of the loss is then allocated to all of the other non-cash assets in the unit on a pro rata basis. In the vignette, the recoverable amount of the cash-generating unit is €17,700,000 and the carrying value is €18,200,000, which makes the impairment loss equal to €500,000.", "ko": "IFRS에서는 CGU의 회수가능액이 장부가보다 작으면 그 차이 전부가 손상차손이다. 18,200,000 − 17,700,000 = €500,000. 이 손실은 먼저 CGU에 배분된 goodwill(€300,000)을 0까지 줄이고, 남은 €200,000은 다른 자산에 비례 배분한다. 손실 총액은 €500,000.", "trap": "goodwill 300,000은 손실을 '먼저 배분하는 곳'이지 손실 한도가 아니다.", "f": "Impairment loss = Carrying value − Recoverable amount (IFRS, one-step)", "why": {"A": "goodwill을 빼고 남은 금액(200,000)만 손실로 봤습니다.", "B": "손실이 goodwill 금액까지만 생긴다고 봤습니다."}, "orig": "Mock 2 Session 1 Q22", "subject": "Mock2"}, {"id": "Mock2:mock2-Q25", "src": "모의고사 오답", "module": "11-ETH", "tag": "Standard I(C): 원출처 인용", "vig": 98, "stem": "Did Garrett violate the Standards in her report on industry trends?", "opts": {"A": "No", "B": "Yes, because she did not cite the trade association", "C": "Yes, because she did not independently review the trade association report"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because in all instances, a member or candidate must cite the actual source of the information. Best practice would be either to obtain the complete study from its original author and cite only that author or to use the information provided by the intermediary and cite both sources. An unprepared candidate might select this response believing that the media outlet citation is sufficient.\nB. Yes, because she did not cite the trade association — Correct\nCorrect because in all instances, a member or candidate must cite the actual source of the information. Best practice would be either to obtain the complete study from its original author and cite only that author or to use the information provided by the intermediary and cite both sources.\nC. Yes, because she did not independently review the trade association report — Incorrect\nIncorrect because there is no requirement that the analyst independently review third-party research. From the reading, in the case of distributing third-party, outsourced research, members and candidates may use and distribute such reports as long as they do not represent themselves as the report’s authors. Indeed, the member or candidate may add value for the client by sifting through research and repackaging it for clients. Therefore, there is no violation of Standard I(C) - Diligence and Reasonable Basis. An unprepared candidate might select this option believing that such reports must be independently reviewed.", "ko": "Garrett은 무역협회 연구를 직접 구하지 않고 신문 기사 요약을 보고서에 넣으면서 신문만 인용했다. 정보의 실제 출처(무역협회)를 반드시 밝혀야 하므로 위반이다. 모범 관행은 원 연구를 구해 원저자만 인용하거나, 중간 매체 정보를 쓰고 두 출처를 모두 인용하는 것이다. 제3자 연구를 직접 검토해야 한다는 요구는 없다.", "trap": "신문만 인용 = 위반. 원 보고서를 직접 검토할 의무는 없다.", "f": "", "why": {"A": "신문 인용만으로는 부족합니다. 실제 출처인 무역협회를 밝혀야 합니다.", "C": "제3자 연구를 독립적으로 검토해야 한다는 요구는 없습니다."}, "orig": "Mock 2 Session 1 Q25", "subject": "Mock2"}, {"id": "Mock2:mock2-Q27", "src": "모의고사 오답", "module": "11-ETH", "tag": "Standard IV(C) 권장: 윤리강령 내용", "vig": 98, "stem": "Is Garrett's statement about the Standard's recommendation for the code of ethics correct?", "opts": {"A": "Yes", "B": "No, with regard to compliance procedures", "C": "No, with regard to general fiduciary concepts"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because the recommended procedures for compliance with Standard IV(C) states stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. Further, separating the code of ethics from compliance procedures will also reduce, if not eliminate, the legal terminology and boilerplate language that can make the underlying ethical principles incomprehensible to the average person. An unprepared candidate might select this response believing that a code of ethics that is compliant with the Standards should include detailed compliance procedures.\nB. No, with regard to compliance procedures — Correct\nCorrect because the recommended procedures for compliance with Standard IV(C) states stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. Further, separating the code of ethics from compliance procedures will also reduce, if not eliminate, the legal terminology and boilerplate language that can make the underlying ethical principles incomprehensible to the average person.\nC. No, with regard to general fiduciary concepts — Incorrect\nIncorrect because the recommended procedures for compliance with Standard IV(C) states stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. An unprepared candidate might select this response believing that a code of ethics that is compliant with the Standards should not include general fiduciary concepts.", "ko": "Garrett은 윤리강령에 일반적인 fiduciary 개념과 '상세한 compliance 절차'를 모두 넣으라고 권장한다고 말했다. Standards는 윤리강령을 쉬운 말로 쓰고 일반 fiduciary 개념을 다루되, 상세 절차는 넣지 말고 따로 두라고 권장한다. 그래서 compliance 절차 부분이 틀렸다.", "trap": "윤리강령 = 쉬운 말 + fiduciary 개념, 상세 절차는 분리.", "f": "", "why": {"A": "상세 compliance 절차를 넣으라는 부분이 틀렸습니다.", "C": "일반 fiduciary 개념은 윤리강령에 넣는 것이 맞습니다."}, "orig": "Mock 2 Session 1 Q27", "subject": "Mock2"}, {"id": "Mock2:mock2-Q36", "src": "모의고사 오답", "module": "11-ECO", "tag": "carry trade 성공 조건", "vig": 99, "stem": "What condition would best support Francis' trade proposal between AUD and ZAR?", "opts": {"A": "Low market volatility", "B": "Covered interest rate parity not holding in the short term", "C": "The interest rate differential between the two countries being expected to widen after the trade is initiated"}, "ans": "A", "en": "A. Low market volatility — Correct\nCorrect because the payoff in a carry trade is the gradual accrual of the interest rate differential—income that is unrelated to exchange rate volatility. During periods of low turbulence, investors may feel relatively confident that exchange rate movements will not jeopardize the gradual accrual of the interest differential. When volatility in the currency markets spikes, however, the risk of an adverse exchange rate movement rises sharply relative to the gradual flow of income. During periods of low volatility, carry trades tend to generate positive returns, but they are prone to significant crash risk in turbulent times.\nB. Covered interest rate parity not holding in the short term — Incorrect\nIncorrect because for a carry trade to succeed, it is uncovered interest rate parity, not covered interest rate parity, that must not hold. If it held, the investor would receive identical returns from either an unhedged foreign currency return or a domestic currency investment as the appreciation or depreciation of the exchange rate would offset the yield differential. If uncovered interest rate parity held at all times, investors would not be able to profit from a strategy that undertook long positions in high-yield currencies and short positions in low-yield currencies. The change in spot rates over the tenor of the forward contracts would cancel out the interest rate differentials locked in at the inception of the position.\nC. The interest rate differential between the two countries being expected to widen after the trade is initiated — Incorrect\nIncorrect because the difference in yields is locked in at the time of the trade, so the movement of the yield spread once the trade is initiated is irrelevant.", "ko": "carry trade는 저금리 통화를 빌려 고금리 통화에 투자해 금리 차이를 조금씩 쌓는 전략이다. 환율 변동성이 낮으면 환율 손실이 금리 차이 수익을 깎을 위험이 적어 유리하다. 변동성이 커지면 급락(crash) 위험이 크다. 금리 차이는 거래 시작 때 고정되므로 이후 차이가 벌어질 것이라는 예상은 상관없다. 또 깨져야 하는 것은 covered가 아니라 uncovered 금리평가다.", "trap": "carry trade = 낮은 변동성 + uncovered IRP가 성립하지 않을 때.", "f": "", "why": {"B": "carry trade가 성공하려면 covered가 아니라 uncovered 금리평가가 성립하지 않아야 합니다.", "C": "금리 차이는 거래 시작 시점에 고정되므로 이후 벌어지는 것은 관계없습니다."}, "orig": "Mock 2 Session 1 Q36", "subject": "Mock2"}, {"id": "Mock2:mock2-Q38", "src": "모의고사 오답", "module": "11-FI", "tag": "회수율과 implied PD", "vig": 100, "stem": "Based on the recovery rate estimated by the junior analyst, the probability of default of the AHM01 bond would be:", "opts": {"A": "less than 2.25%.", "B": "equal to 2.25%.", "C": "greater than 2.25%."}, "ans": "A", "en": "A. less than 2.25%. — Correct\nCorrect because a lower recovery rate (i.e., 30% stated by the junior analyst vs. 40% assumed by Wang) is associated with a lower probability of default (given price and credit spread), holding all else equal. Given the observed bond price (and credit spread), we would need a lower probability of default to offset the lower rate of recovery.\nB. equal to 2.25%. — Incorrect\nIncorrect because the probability of default would need to be reduced from its current value of 2.25%.\nC. greater than 2.25%. — Incorrect\nIncorrect because the probability of default would be lower than 2.25%.", "ko": "채권 가격(=신용 스프레드)이 그대로라면, 기대 손실(대략 PD × LGD)도 그대로여야 한다. 회수율이 40% → 30%로 낮아지면 LGD가 커지므로, 같은 가격을 맞추려면 PD가 더 낮아야 한다. 따라서 PD는 2.25%보다 작다.", "trap": "가격 고정 상태에서 회수율 ↓ → LGD ↑ → PD ↓ (서로 상쇄).", "f": "Credit spread ≈ PD × LGD = PD × (1 − RR)", "why": {"B": "LGD가 커졌으므로 같은 가격을 맞추려면 PD가 줄어야 합니다.", "C": "PD가 커지면 가격이 더 내려가야 합니다. 가격이 같다면 PD는 작아집니다."}, "orig": "Mock 2 Session 1 Q38", "subject": "Mock2"}, {"id": "Mock2:mock2-Q62", "src": "모의고사 오답", "module": "11-FI", "tag": "spot rate로 선도금리 f(1,1)", "vig": 101, "stem": "The forward rate for a 1-year zero-coupon government bond issued one year from today is closest to:", "opts": {"A": "3.32%.", "B": "3.43%.", "C": "3.55%."}, "ans": "A", "en": "A. 3.32%. — Correct\nCorrect because using the Treasury spot rates provided in the Exhibit and the forward rate model, the forward rate for a one-year zero issued one year from today would be:\n(1 + z2)^2= (1 + z1)^1(1 + f1,1)^1\n(1 + 0.0310)^2= (1 + 0.0288)^1(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0310)^2/(1 + 0.0288)^1 – 1\n(1 + f1,1)^1= 1.0629/1.0288 – 1\n(1 + f1,1)^1= 0.0332.\nB. 3.43%. — Incorrect\nIncorrect because this response calculates the one-year forward rate in two years (rather than in one year). Using the forward rate model with these incorrect assumptions, the forward rate would be:\n(1 + z3)^3= (1 + z2)^2(1 + f1,1)^1\n(1 + 0.0321)^3= (1 + 0.0310)^2(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0321)^3/(1 + 0.0310)^2 – 1\n(1 + f1,1)^1= 1.099424/1.062961 – 1\n(1 + f1,1)^1= 0.034304.\nC. 3.55%. — Incorrect\nIncorrect because this response uses the swap rates instead of spot rates:\n(1 + z2)^2= (1 + z1)^1(1 + f1,1)^1\n(1 + 0.0326)^2= (1 + 0.0297)^1(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0326)^2 /(1 + 0.0297)^1 – 1\n(1 + f1,1)^1= 1.0663/1.0297 – 1\n(1 + f1,1)^1= 0.0355.", "ko": "국채 spot rate를 쓴다. (1 + z2)² = (1 + z1)(1 + f1,1) → 1 + f = 1.0310² / 1.0288 = 1.06296 / 1.0288 = 1.0332 → f(1,1) = 3.32%.", "trap": "스왑금리가 아니라 국채 spot rate. 1년 뒤 시작하는 1년물은 z1과 z2로 구한다.", "f": "(1 + z2)² = (1 + z1)(1 + f1,1)", "why": {"B": "z2와 z3으로 계산한 2년 뒤 시작하는 1년 선도금리(f2,1)입니다.", "C": "국채 spot rate 대신 스왑금리를 썼습니다."}, "orig": "Mock 2 Session 2 Q18", "subject": "Mock2"}, {"id": "Mock2:mock2-Q68", "src": "모의고사 오답", "module": "11-FSA", "tag": "환산 조정: current rate method", "vig": 102, "stem": "Based on Viniciu’s expectations, the translation of Carro’s financial statements in the current year will most likely result in a:", "opts": {"A": "translation loss in Pedra's income statement.", "B": "translation gain in Pedra's income statement.", "C": "positive translation adjustment in Pedra's shareholders’ equity."}, "ans": "C", "en": "A. translation loss in Pedra's income statement. — Incorrect\nIncorrect because Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity. Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency). Therefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment which will be reflected in stockholders’ equity because Pedra uses the current rate method to translate Carro's financial statements. If Carro used the temporal method for translation and there was a strengthening of the BRL, there would have been a translation loss recognized in the income statement.\nB. translation gain in Pedra's income statement. — Incorrect\nIncorrect because Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity. Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency). Therefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment which will be reflected in stockholders’ equity because Pedra uses the current rate method to translate Carro's financial statements. If Carro used the temporal method for translation then there would have been a translation gain recognized in the income statement.\nC. positive translation adjustment in Pedra's shareholders’ equity. — Correct\nCorrect because Pedra uses the current ra

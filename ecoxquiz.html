te method to translate Carro’s financial statements. When the current rate method is used, the cumulative translation adjustment needed to keep the translated balance sheet in balance is reported as a separate component of stockholders’ equity.\nThe sign (positive or negative) of the current period’s translation adjustment is a function of two factors: (1) The nature of the balance sheet exposure (asset or liability), and (2) The direction of change in the exchange rate (strengthens or weakens). The relationship between exchange rate fluctuations, balance sheet exposure, and the current period’s translation adjustment can be summarized as follows:\nBalance Sheet Exposure\tForeign Currency Strengthens\tForeign Currency Weakens\nNet asset\tPositive translation adjustment\tNegative translation adjustment\nNet liability\tNegative translation adjustment\tPositive translation adjustment\nIn this case, Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency).\nTherefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity.", "ko": "current rate method의 환산 차이는 손익계산서가 아니라 자본(CTA, OCI)에 들어간다. 부호: Carro는 순자산 노출이고, BRL 약세 = 외화(USD) 강세. 순자산 + 외화 강세 → 양(+)의 환산 조정. 그래서 '자본에 양의 환산 조정'.", "trap": "current rate method → 손익이 아니라 자본(CTA). 순자산 노출 + 외화 강세 = +.", "f": "", "why": {"A": "current rate method의 환산 차이는 손익계산서에 가지 않고, 부호도 양수입니다.", "B": "부호는 맞지만 current rate method라 손익계산서가 아니라 자본에 반영됩니다."}, "orig": "Mock 2 Session 2 Q24", "subject": "Mock2"}, {"id": "Mock2:mock2-Q86", "src": "모의고사 오답", "module": "11-FSA", "tag": "대손충당금 / 부실채권 비율", "vig": 103, "stem": "Over the most recent year, the ratio of Gowran's allowances for loan losses to non-performing loans:", "opts": {"A": "decreased.", "B": "not changed.", "C": "increased."}, "ans": "B", "en": "A. decreased. — Incorrect\nIncorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nThe conclusion that the ratio decreased could be derived if provision for loan losses during the year was subtracted rather than added when calculating the allowance for loan losses at the end of the year.\nAllowance for loan losses at start of year\t1,500\nSubtract: Provision for loan losses during the year\t500\nSubtract: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t800\nThen the calculation of the ratio of allowances for loan losses to non-performing loans becomes;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t800\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.33\nB. not changed. — Correct\nCorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nFirst, we calculate the allowance for loan losses at the end of the year on the basis that provision for loan losses is an income statement expense account that increases the amount of the allowance for loan losses. Actual loan losses (i.e., charge-offs—net of recoveries) reduce the amount of the allowance for loan losses.\nAllowance for loan losses at start of year\t1,500\nAdd: Provision for loan losses during the year\t500\nSubtract: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t1,800\nThen, we calculate the ratio of allowances for loan losses to non-performing loans;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t1,800\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.75\nC. increased. — Incorrect\nIncorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nThe conclusion that the ratio increased could be derived if the net charge-offs were added rather than subtracted in calculating the allowance for loan losses at the end of the year.\nAllowance for loan losses at start of year\t1,500\nAdd: Provision for loan losses during the year\t500\nAdd: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t2,200\nThen the calculation of the ratio of allowances for loan losses to non-performing loans becomes;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t2,200\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.92", "ko": "기말 충당금 = 기초 1,500 + 대손상각비(provision) 500 − 순상각(charge-off) 200 = 1,800. 비율: 기초 1,500 / 2,000 = 0.75, 기말 1,800 / 2,400 = 0.75 → 변화 없음.", "trap": "provision은 충당금을 늘리고, charge-off는 줄인다.", "f": "기말 충당금 = 기초 + Provision − Net charge-offs", "why": {"A": "provision을 빼서 기말 충당금을 800으로 계산했습니다.", "C": "charge-off를 더해서 기말 충당금을 2,200으로 계산했습니다."}, "orig": "Mock 2 Session 2 Q42", "subject": "Mock2"}, {"id": "cMock1:m1-s02-q2", "src": "모의고사 오답", "module": "12-ETH", "subject": "cMock1", "tag": "Ethical and Professional Standards", "vig": 104, "html": true, "stem": "Under a fair allocation procedure, the number of Norvik Energy shares Reyes should allocate to the Lund account is <i>closest<\/i> to:", "opts": {"A": "0.", "B": "4,000.", "C": "8,000."}, "ans": "B", "ko": "Standard III(B) Fair Dealing. 공모 초과청약(oversubscribed) IPO는 사전 indication이 있는 적합 고객 계좌에 pro rata로 배분한다. 직원 개인 계좌는 참여 불가. 가족 소유라도 일반 수수료를 내는 고객 계좌는 다른 고객 계좌와 똑같이 취급하며, 불리하게 대해서도 안 된다.\n풀이: 고객 indication 합계 = 30,000 + 20,000 + 10,000 = 60,000주. 배분 비율 = 24,000 / 60,000 = 40%. Lund 계좌 = 10,000 × 40% = 4,000주 (Calder 12,000, Albrecht 8,000).", "f": "\\[ \\text{Lund}=10{,}000\\times\\frac{24{,}000}{30{,}000+20{,}000+10{,}000}=4{,}000 \\]", "trap": "개인 계좌는 제외하고, fee를 내는 가족 계좌는 포함한다. 배분 기준은 사전 indication에 따른 pro rata다.", "why": {"A": "가족(친인척) 계좌를 무조건 배제 — fee를 내는 정상 고객 계좌는 다른 고객과 동일하게 취급해야 함.", "C": "fair = equal로 오해하여 24,000주를 3개 계좌에 균등 배분(8,000)."}, "en": "정답 B. Standard III(B) Fair Dealing (LOS: 위반 예방 절차 권고). 공모 초과청약(oversubscribed) IPO는 사전 indication이 있는 적합 고객 계좌에 pro rata로 배분한다. 직원 개인 계좌는 참여 불가(회사 정책 + Schweser: \"Allocation of shares in oversubscribed IPOs to personal accounts is NOT permitted\"). 가족 소유라도 일반 수수료를 내는 고객 계좌는 다른 고객 계좌와 똑같이 취급하며, 불리하게 대해서도 안 된다(Schweser p.154).\n\n풀이: 고객 indication 합계 = 30,000 + 20,000 + 10,000 = 60,000주. 배분 비율 = 24,000 / 60,000 = 40%. Lund 계좌 = 10,000 × 40% = 4,000주 (Calder 12,000, Albrecht 8,000).\n\n오답: A — 가족 계좌를 일괄 배제하면 그 고객이 불리해진다(trap: excluding family accounts from pro rata). C — \"Fairly does not mean equally\". 균등 배분하면 indication에 비례하지 않는다. Reyes 개인 주문 5,000주를 분모에 넣으면 10,000×24/65 ≈ 3,692주가 되는데, 개인 계좌는 처음부터 배분 대상이 아니다.\n\nExam trap: 개인 계좌는 제외하고, fee를 내는 가족 계좌는 포함한다. 배분 기준은 사전 indication에 따른 pro rata다.\n\n[참조] LOS ETH-R2-L2: recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct | Schweser Book 5, Reading 41 (Guidance for Standards I–VII), III(B) Fair Dealing, pdf p.129–130; family accounts p.154; personal IPO p.113", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q6"}, {"id": "cMock1:m1-s03-q3", "src": "모의고사 오답", "module": "12-FSA", "subject": "cMock1", "tag": "Financial Statement Analysis", "vig": 105, "html": true, "stem": "In response to Engel's question about Brenna, compared with the equity method, consolidating Brenna <i>most likely<\/i> results in Valtek reporting a:", "opts": {"A": "lower net profit margin.", "B": "higher net income attributable to Valtek's shareholders.", "C": "lower total equity."}, "ans": "A", "ko": "equity method와 acquisition method(연결)는 (지배주주) 순이익이 같다. 연결하면 자산·부채·매출이 더 크고, 자본은 NCI만큼 더 크다. → 순이익은 같고 매출(분모)에 Brenna의 €310m 100%가 더해지므로 net profit margin이 낮아진다.", "f": "", "trap": "80% 자회사도 매출은 80%가 아니라 100% 연결되고, 순이익은 변하지 않는다. 연결 vs equity method의 D/E 비교는 부채·자본이 함께 늘어나 방향이 일정하지 않으므로 직접 계산해야 한다.", "why": {"B": "연결하면 자회사 매출·비용이 100% 들어오므로 지배주주 순이익도 커진다고 오해 — 지배주주 순이익은 equity method와 동일.", "C": "방향 반대: 연결 시 NCI가 자본에 포함되어 total equity가 더 큼."}, "en": "정답 A. Schweser LOS 7.c 요약(Book 2 pdf p.36): equity method와 acquisition method(연결)는 (지배주주) 순이익이 같다. 연결하면 자산·부채·매출이 더 크고, 자본은 NCI만큼 더 크다.\n→ 순이익은 같고 매출(분모)에 Brenna의 €310m 100%가 더해지므로 net profit margin이 낮아진다.\n\n오답: B — Brenna 지분율이 80%여도 지배주주 몫 순이익은 두 방법에서 같다. 매출·비용은 100% 합산되지만 NCI 몫이 따로 배분된다. C — 연결하면 NCI가 equity에 포함되므로 total equity가 오히려 크다.\n\nExam trap: 80% 자회사도 매출은 80%가 아니라 100% 연결되고, 순이익은 변하지 않는다(본인 Eco FSA 1-54 오답 — 연결 손익계산서에 반영되는 자회사 매출 비중). 연결 vs equity method의 D/E 비교는 부채·자본이 함께 늘어나 방향이 일정하지 않으므로 직접 계산해야 한다(오답노트 R-FSA-M1-05).\n\n[참조] LOS FSA-R1-L3: analyze how different methods used to account for intercorporate investments affect financial statements and ratios | Schweser Book 2, Reading 7 (Intercorporate Investments), LOS 7.c summary, pdf p.36 | 관련 Eco: FSA 1-54 (1st 오답), FSA 1-29 (1st 오답), FSA 1-30 | 오답노트: R-FSA-M1-05", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q11"}, {"id": "cMock1:m1-s04-q1", "src": "모의고사 오답", "module": "12-ECO", "subject": "cMock1", "tag": "Economics", "vig": 106, "html": true, "stem": "Using the mid-market spot rate, the 180-day TVL/CHF forward rate consistent with covered interest rate parity is <i>closest<\/i> to:", "opts": {"A": "20.3359.", "B": "22.0071.", "C": "22.8499."}, "ans": "B", "ko": "Covered interest rate parity(A/B 호가 = price/base): \\(F_{A/B} = S_{A/B} \\times \\dfrac{1 + R_A(\\text{days}/360)}{1 + R_B(\\text{days}/360)}\\). 분자는 price currency(TVL), 분모는 base currency(CHF) 금리.\n풀이: F = 21.1550 × (1 + 0.0920×0.5)/(1 + 0.0110×0.5) = 21.1550 × 1.0460/1.0055 = 22.0071.\n풀이: 연결 개념(angle): CIP로 완전 헤지한 TVL 예금의 CHF 수익률 = CHF 금리(180일 1.10% 연율)이며 9.20%가 아니다. 애널리스트 발언은 틀렸다(금리차는 forward premium으로 정확히 상쇄). UIP 기대 현물환율 ≈ S × [1 + (R_TVL − R_CHF)×180/360] = 22.0118로, 선물환(CIP, 차익거래로 강제)과 달리 차익거래로 강제되지 않는 '기대치'다.", "f": "\\[ F_{TVL/CHF}=S_{mid}\\times\\frac{1+0.0920\\times\\frac{180}{360}}{1+0.0110\\times\\frac{180}{360}} \\]", "trap": "호가의 분자 통화 금리가 분자; 기간 조정(days/360).", "why": {"A": "numerator–denominator 규칙 위반: TVL/CHF인데 CHF 금리를 분자, TVL 금리를 분모에 둠.", "C": "연율 금리를 180/360으로 기간 조정하지 않고 그대로 사용."}, "en": "정답 B. Covered interest rate parity(A/B 호가 = price/base): \\(F_{A/B} = S_{A/B} \\times \\dfrac{1 + R_A(\\text{days}/360)}{1 + R_B(\\text{days}/360)}\\). 분자는 price currency(TVL), 분모는 base currency(CHF) 금리(Schweser numerator–denominator rule).\n\n출처: Schweser Book 1, Reading 5 (Currency Exchange Rates), Module 5.2, LOS 5.e, pdf p.120–121; Quick Sheet \"Covered interest rate parity\".\n변수: S(mid) = (21.1500 + 21.1600)/2 = 21.1550; R_TVL(180일) = 9.20%; R_CHF(180일) = 1.10%; days = 180.\n\n풀이: F = 21.1550 × (1 + 0.0920×0.5)/(1 + 0.0110×0.5) = 21.1550 × 1.0460/1.0055 = 22.0071.\n\n오답: A(20.3359)는 금리를 거꾸로 넣어 고금리 통화(TVL)가 선물에서 강세가 되는 결과 — 고금리 통화는 forward discount. C(22.8499)는 180일인데 연율 금리를 그대로 써 premium이 약 2배.\n\n연결 개념(angle): CIP로 완전 헤지한 TVL 예금의 CHF 수익률 = CHF 금리(180일 1.10% 연율)이며 9.20%가 아니다. 애널리스트 발언은 틀렸다(금리차는 forward premium으로 정확히 상쇄). UIP 기대 현물환율 ≈ S × [1 + (R_TVL − R_CHF)×180/360] = 22.0118로, 선물환(CIP, 차익거래로 강제)과 달리 차익거래로 강제되지 않는 '기대치'다.\n\nExam trap: 호가의 분자 통화 금리가 분자; 기간 조정(days/360). 오답노트 R-ECO-M1-05 \"Covered IRP : Forward, Spot, 금리의 관계 → Forward, Spot으로 금리를 역추정 / Uncovered IRP : Spot, 금리의 관계 → 금리의 차이로 미래의 Spot을 예측\" 적용(본인 Eco ECO 1-12 계산 오답).\n\n[참조] LOS ECO-R1-L5: explain international parity conditions (covered and uncovered interest rate parity, forward rate parity, purchasing power parity, and the international Fisher effect) | Schweser Book 1, Reading 5 (Currency Exchange Rates), Module 5.2, LOS 5.e, pdf p.120–121; Quick Sheet CIP/UIP | 관련 Eco: ECO 1-12 (1st 오답), ECO 1-30, ECO 1-61 | 오답노트: R-ECO-M1-05", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q13"}, {"id": "cMock1:m1-s04-q2", "src": "모의고사 오답", "module": "12-ECO", "subject": "cMock1", "tag": "Economics", "vig": 106, "html": true, "stem": "The current mark-to-market value of the fund's existing forward contract is <i>closest<\/i> to:", "opts": {"A": "TVL 889,976.", "B": "TVL 907,731.", "C": "TVL 1,007,335."}, "ans": "A", "ko": "기존 계약 = 180일 만기 CHF 10,000,000 매수(long base currency) at 21.4800, 잔존 90일. 청산(offset)은 잔존 만기 90일 선물로 CHF를 매도 → dealer bid 사용(up the bid). 가치는 price currency(TVL)로 계산하고 TVL 90일 금리로 할인.\n풀이: \\(V_t = \\dfrac{(F_t - F_0)\\times \\text{Notional}_{base}}{1 + R_{price}\\times(\\text{days remaining}/360)}\\) (long base 기준).\n풀이: 변수: F_0 = 21.4800; F_t(90일 bid) = 21.1500 + 4,210/10,000 = 21.5710; Notional = CHF 10,000,000; R_TVL(90일) = 9.00%; 잔존 90일.\n풀이: (F_t − F_0) × N = (21.5710 − 21.4800) × 10,000,000 = TVL 910,000; 할인 = 1 + 0.09×90/360 = 1.0225; V = TVL 889,976 (fund에 이익).", "f": "\\[ V=\\frac{(21.1500+0.4210-21.4800)\\times10{,}000{,}000}{1+0.09\\times\\frac{90}{360}} \\]", "trap": "① 청산 방향(long base → bid) ② 잔존 만기 forward points ③ price currency 금리·잔존일수로 할인.", "why": {"B": "할인율로 base currency(CHF) 금리 사용 — price currency(TVL) 금리로 할인해야 함.", "C": "청산 시 ask(down the ask) 사용 — long CHF를 청산하려면 CHF를 매도하므로 bid(up the bid)."}, "en": "정답 A. 기존 계약 = 180일 만기 CHF 10,000,000 매수(long base currency) at 21.4800, 잔존 90일. 청산(offset)은 잔존 만기 90일 선물로 CHF를 매도 → dealer bid 사용(up the bid). 가치는 price currency(TVL)로 계산하고 TVL 90일 금리로 할인.\n\n수식(Schweser Book 1, Reading 5 (Currency Exchange Rates), Module 5.2, LOS 5.d, pdf p.118–120; Yip 예제 역산 확인: (1.06206 − 1.05358)×1,000,000/(1 + 0.0116×60/360) = AUD 8,463.64):\n\\(V_t = \\dfrac{(F_t - F_0)\\times \\text{Notional}_{base}}{1 + R_{price}\\times(\\text{days remaining}/360)}\\) (long base 기준).\n\n변수: F_0 = 21.4800; F_t(90일 bid) = 21.1500 + 4,210/10,000 = 21.5710; Notional = CHF 10,000,000; R_TVL(90일) = 9.00%; 잔존 90일.\n\n풀이: (F_t − F_0) × N = (21.5710 − 21.4800) × 10,000,000 = TVL 910,000; 할인 = 1 + 0.09×90/360 = 1.0225; V = TVL 889,976 (fund에 이익).\n\n오답: B(907,731)는 CHF 금리(1.00%)로 할인 — 결과가 TVL 금액이므로 TVL 금리로 할인해야 한다. C(1,007,335)는 forward ask(21.1600 + 0.4230 = 21.5830)로 청산 — CHF를 '파는' 거래이므로 bid.\n\nExam trap: ① 청산 방향(long base → bid) ② 잔존 만기 forward points ③ price currency 금리·잔존일수로 할인. 오답노트 R-ECO-M1-03 그대로: \"[기존 포지션이 Long Base Currency일 때] (FP_t − FP)×Notional_base / (1 + r_price currency × (T−t)/360) → FP_t는 잔존 만기의 Short Base Currency(Up the bid) Forward로 청산\"(본인 Eco ECO 1-55 계산 오답).\n\n[참조] LOS ECO-R1-L4: calculate the mark-to-market value of a forward contract | Schweser Book 1, Reading 5 (Currency Exchange Rates), Module 5.2, LOS 5.d, pdf p.118–120 | 관련 Eco: ECO 1-55 (1st 오답), ECO 1-9, ECO 1-36 | 오답노트: R-ECO-M1-03", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q14"}, {"id": "cMock1:m1-s04-q4", "src": "모의고사 오답", "module": "12-ECO", "subject": "cMock1", "tag": "Economics", "vig": 106, "html": true, "stem": "According to the Mundell–Fleming model, the policy changes in Tavaria will <i>most likely<\/i> cause the TVL to:", "opts": {"A": "appreciate, because higher government borrowing raises real interest rates and attracts capital inflows.", "B": "depreciate, because the increase in net imports dominates the effect on the exchange rate.", "C": "move in an ambiguous direction, because the monetary and fiscal policy effects offset each other."}, "ans": "B", "ko": "Tavaria는 자본통제로 capital mobility가 낮다. 이 경우 금리를 통한 financial flow 효과보다 무역수지(goods flow) 효과가 크다. 확장 재정과 확장 통화는 모두 총수요를 늘려 순수입을 증가시키고, 따라서 통화가 절하된다. 두 정책 효과가 같은 방향이므로 결과가 분명하다.", "f": "", "trap": "먼저 capital mobility가 높은지 낮은지 확인하고 그에 맞는 표를 쓴다.", "why": {"A": "high capital mobility 논리(재정확장 → 실질금리↑ → 자본유입 → 절상)를 자본통제국에 적용.", "C": "high capital mobility 표(확장 통화 + 확장 재정 = 불확실)를 low mobility에 적용."}, "en": "정답 B. Tavaria는 자본통제로 capital mobility가 낮다. 이 경우 금리를 통한 financial flow 효과보다 무역수지(goods flow) 효과가 크다. 확장 재정과 확장 통화는 모두 총수요를 늘려 순수입을 증가시키고, 따라서 통화가 절하된다. 두 정책 효과가 같은 방향이므로 결과가 분명하다.\n\n출처: Schweser Book 1, Module 5.3, LOS 5.k, pdf p.131–132 (Figure 5.2). high mobility에서는 확장 통화가 절하, 확장 재정이 절상으로 서로 반대 → 불확실. low mobility에서는 확장 통화·재정 모두 절하.\n\n오답: A — 실질금리 상승으로 자본이 유입되는 경로는 capital mobility가 높을 때의 논리다. 자본통제 하에서는 이 경로가 약하다. C — 확장+확장 조합이 '불확실'인 것은 high mobility일 때다. Swiss National Bank의 금리 동결은 distractor 정보다.\n\nExam trap: 먼저 capital mobility가 높은지 낮은지 확인하고 그에 맞는 표를 쓴다. 본인 Eco ECO 1-37(direction_sign) 오답과 같은 방향 함정이다.\n\n[참조] LOS ECO-R1-L11: explain the potential effects of monetary and fiscal policy on exchange rates | Schweser Book 1, Reading 5, Module 5.3, LOS 5.k, pdf p.131–132 | 관련 Eco: ECO 1-37 (1st 오답), ECO 1-16, ECO 1-47 | 오답노트: R-ECO-M1-08", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q16"}, {"id": "cMock1:m1-s06-q4", "src": "모의고사 오답", "module": "12-FI", "subject": "cMock1", "tag": "Fixed Income", "vig": 107, "html": true, "stem": "The five-year swap spread that Quintero reports is <i>closest<\/i> to:", "opts": {"A": "28 basis points.", "B": "40 basis points.", "C": "45 basis points."}, "ans": "C", "ko": "Swap spread = 같은 만기의 swap rate − 정부채 수익률(YTM).\n풀이: 4.25% − 3.80% = 0.45% = 45bp.", "f": "\\[ \\text{swap spread}_5=4.25\\%-3.80\\%=45\\text{ bp} \\]", "trap": "swap spread의 기준은 동일 만기 '정부채 수익률'(on-the-run YTM)이다.", "why": {"A": "utility 채권 YTM − swap rate = I-spread(28bp)를 swap spread로 혼동.", "B": "정부채 YTM 대신 5년 spot rate(3.85%)를 차감."}, "en": "정답 C. Swap spread = 같은 만기의 swap rate − 정부채 수익률(YTM).\n\n수식(Schweser Book 4, Module 23.4, LOS 23.f, pdf p.24: 1년 예제 0.57% − 0.11% = 46bp).\n풀이: 4.25% − 3.80% = 0.45% = 45bp.\n\n오답: A(28bp) — 4.53% − 4.25% 는 utility 채권의 I-spread(채권 YTM − swap rate). B(40bp) — 정부채 YTM이 아닌 spot rate 3.85%를 차감. 우상향 곡선에서 par 채권의 YTM(3.80%)은 같은 만기의 spot rate보다 낮다.\n\nExam trap: swap spread의 기준은 동일 만기 '정부채 수익률'(on-the-run YTM)이다. 오답노트 R-FI-M1-03(Swap spread = SFR − Treasury yield, I-spread = 위험채 YTM − SFR) 적용.\n\n[참조] LOS FI-R1-L6: calculate and interpret the swap spread for a given maturity | Schweser Book 4, Reading 23 (The Term Structure and Interest Rate Dynamics), Module 23.4, LOS 23.f, pdf p.24 | 관련 Eco: FI 1-14, FI 1-15, FI 1-58 | 오답노트: R-FI-M1-03", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q24"}, {"id": "cMock1:m1-s07-q2", "src": "모의고사 오답", "module": "12-CI", "subject": "cMock1", "tag": "Corporate Issuers", "vig": 108, "html": true, "stem": "Using Ferreira's assumptions, Corvane's pro forma EPS for the first full year after the acquisition is <i>closest<\/i> to:", "opts": {"A": "&euro;2.83.", "B": "&euro;2.90.", "C": "&euro;3.02."}, "ans": "C", "ko": "Pro forma 순이익 = 인수자 순이익 + 피인수자 세전이익·시너지·추가 상각을 합해 세후로 환산; 주식 수 = 인수자 주식 + 신규 발행 주식.\n풀이: 풀이(€ millions):\n풀이: 1) 신규 발행 주식 = 0.75 × 20.0 = 15.0m → 합병 후 주식 = 60.0 + 15.0 = 75.0m\n풀이: 2) Pellis 세전이익 + 시너지 − 상각 = 50.0 + 20.0 − 8.0 = 62.0 → 세후 62.0 × 0.75 = 46.5\n풀이: 3) Pro forma 순이익 = 180.0 + 46.5 = 226.5\n풀이: 4) EPS = 226.5 / 75.0 = €3.02 (Corvane 단독 EPS 180/60 = €3.00 → 소폭 accretive)", "f": "\\[ EPS_{PF}=\\frac{180.0+(50.0+20.0-8.0)(1-0.25)}{60.0+0.75\\times20.0}=\\frac{226.5}{75.0}=3.02 \\]", "trap": "주식 교환 인수의 분모는 '교환비율 × 피인수자 주식 수'이고, 시너지·추가 상각은 세후로 반영한다.", "why": {"A": "새로 발행되는 Corvane 주식(15m) 대신 Pellis 주식 수(20m)를 더함: 226.5 / 80.", "B": "시너지와 인수 무형자산 상각을 빠뜨리고 두 회사 순이익만 합산: 217.5 / 75."}, "en": "정답 C. Pro forma 순이익 = 인수자 순이익 + 피인수자 세전이익·시너지·추가 상각을 합해 세후로 환산; 주식 수 = 인수자 주식 + 신규 발행 주식.\n\n수식 출처: Schweser Book 2, LOS 16.d, pdf p.228(단계표는 이미지) → 커리큘럼 Corporate Restructuring Example 9(CN + KCS) Exhibit 21로 역산 확인: (19,063 − 9,332 − 2,968 + 353 − 1,650) × (1 − 0.22) = 4,264, 4,264 / (710 + 103) = 5.24 일치.\n\n풀이(€ millions):\n1) 신규 발행 주식 = 0.75 × 20.0 = 15.0m → 합병 후 주식 = 60.0 + 15.0 = 75.0m\n2) Pellis 세전이익 + 시너지 − 상각 = 50.0 + 20.0 − 8.0 = 62.0 → 세후 62.0 × 0.75 = 46.5\n3) Pro forma 순이익 = 180.0 + 46.5 = 226.5\n4) EPS = 226.5 / 75.0 = €3.02 (Corvane 단독 EPS 180/60 = €3.00 → 소폭 accretive)\n\n오답: A(2.83) — 주식 수에 Pellis 주식 20m을 그대로 더함. B(2.90) — 시너지·상각 누락(180 + 37.5 = 217.5). 시너지·상각을 세전 그대로 더하면 3.06이다.\n\nExam trap: 주식 교환 인수의 분모는 '교환비율 × 피인수자 주식 수'이고, 시너지·추가 상각은 세후로 반영한다.\n\n[참조] LOS CI-R4-L4: demonstrate how corporate restructurings affect an issuer’s EPS, net debt to EBITDA ratio, and weighted average cost of capital | Schweser Book 2, Reading 16 (Corporate Restructuring), Module 16.2, LOS 16.d, pdf p.228–229 | 관련 Eco: CI 4-6, CI 4-8, CI 4-12", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q26"}, {"id": "cMock1:m1-s08-q1", "src": "모의고사 오답", "module": "12-PM", "subject": "cMock1", "tag": "Portfolio Management", "vig": 109, "html": true, "stem": "If the plan accepts Kestrel's offer of an unconstrained account, Kestrel's expected active return is <i>closest<\/i> to:", "opts": {"A": "2.98%.", "B": "3.50%.", "C": "4.21%."}, "ans": "A", "ko": "Expanded fundamental law: \\(E(R_A)=TC\\times IC\\times\\sqrt{BR}\\times\\sigma_A\\).\n풀이: 1) BR = 98종목 × 연 2회 독립 결정 = 196 → √BR = 14\n풀이: 2) 현재(TC 0.50): 0.50 × 0.05 × 14 × 5.0% = 1.75% (IR = 0.35)\n풀이: 3) 제약 제거(TC 0.85): 0.85 × 0.05 × 14 × 5.0% = 2.975% ≈ 2.98% (IR = 0.595)", "f": "\\[ E(R_A)=0.85\\times0.05\\times\\sqrt{98\\times2}\\times5.0\\%=2.98\\% \\]", "trap": "리밸런싱 빈도 2배 → BR 2배(√BR은 √2배).", "why": {"B": "TC를 빼고 basic fundamental law(IC × √BR × σ<sub>A<\/sub>) 적용 — 제약 제거 후 TC는 1이 아니라 0.85.", "C": "Breadth를 √98 × 2로 계산 — BR = 98 × 2 = 196이고 √196 = 14."}, "en": "정답 A. Expanded fundamental law: \\(E(R_A)=TC\\times IC\\times\\sqrt{BR}\\times\\sigma_A\\).\n\n수식(Schweser Book 5, Module 35.3, LOS 35.c, pdf p.27–28; 수식 이미지 → 커리큘럼 Analysis of Active Portfolio Management 식 (14)·Example 7로 역산: 0.80 × 0.05 × √100 × 4.0% = 1.6% 일치).\n\n풀이:\n1) BR = 98종목 × 연 2회 독립 결정 = 196 → √BR = 14\n2) 현재(TC 0.50): 0.50 × 0.05 × 14 × 5.0% = 1.75% (IR = 0.35)\n3) 제약 제거(TC 0.85): 0.85 × 0.05 × 14 × 5.0% = 2.975% ≈ 2.98% (IR = 0.595)\n\n오답: B(3.50%) — TC를 1로 둔 이론적 최대치. 실제 TC는 0.85로 주어졌다. C(4.21%) — √98에 2를 곱했다. 리밸런싱 횟수는 √ 안에서 곱해야 한다(BR = N × 빈도).\n\nExam trap: 리밸런싱 빈도 2배 → BR 2배(√BR은 √2배). 오답노트 R-PM-M2-06(E(R_A) = TC × IC × √BR × σ_A) · R-PM-M2-07(연 → 반기 리밸런싱 시 BR 2배) · R-PM-M2-09(TC = 최적 vs 실제 active weight의 상관) 적용.\n\n[참조] LOS PM-R2-L3: describe and interpret the fundamental law of active portfolio management, including its component terms—transfer coefficient, information coefficient, breadth, and active risk (aggressiveness) | Schweser Book 5, Reading 35 (Analysis of Active Portfolio Management), Module 35.3, LOS 35.c, pdf p.27–29 | 관련 Eco: PM 2-9 (1st 오답), PM 2-26 (1st 오답), PM 2-8 | 오답노트: R-PM-M2-06, R-PM-M2-07, R-PM-M2-09", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q29"}, {"id": "cMock1:m1-s08-q2", "src": "모의고사 오답", "module": "12-PM", "subject": "cMock1", "tag": "Portfolio Management", "vig": 109, "html": true, "stem": "Regarding Pryce's comment on Rowan's cash buffer, the <i>most likely<\/i> effect of the cash buffer is that Rowan's:", "opts": {"A": "Sharpe ratio and information ratio are both unchanged.", "B": "Sharpe ratio decreases and its information ratio is unchanged.", "C": "Sharpe ratio is unchanged and its information ratio decreases."}, "ans": "C", "ko": "Sharpe ratio는 현금이나 레버리지를 더해도 변하지 않는다(현금 50% → 초과수익과 표준편차가 모두 절반). 반면 IR은 현금 편입이나 레버리지 사용으로 변한다. 분자인 active return이 비현금 benchmark 대비로 측정되기 때문이다. 현금 편입은 active return을 낮추지만 active risk(추적오차)는 크게 줄지 않으므로 IR은 하락할 가능성이 가장 높다.", "f": "", "trap": "'benchmark와 혼합 → IR 불변' vs '현금과 혼합 → SR 불변, IR 하락'.", "why": {"A": "IR은 비현금 benchmark 대비 측정 — 현금 편입은 active return을 낮추지만 active risk는 크게 줄지 않음.", "B": "SR과 IR의 성질을 뒤바꿈: 현금 편입은 초과수익과 변동성을 같은 비율로 줄여 SR 불변."}, "en": "정답 C. Schweser LOS 35.b(Book 5 pdf p.25): Sharpe ratio는 현금이나 레버리지를 더해도 변하지 않는다(현금 50% → 초과수익과 표준편차가 모두 절반). 반면 IR은 현금 편입이나 레버리지 사용으로 변한다. 분자인 active return이 비현금 benchmark 대비로 측정되기 때문이다. 현금 편입은 active return을 낮추지만 active risk(추적오차)는 크게 줄지 않으므로 IR은 하락할 가능성이 가장 높다.\n\n오답: A — IR까지 불변이라는 것은 active weight를 '비례적으로' 키우거나 줄일 때(benchmark와 혼합)의 성질이다. 현금은 benchmark가 아니다. B — SR과 IR에 대한 결론이 뒤바뀌었다. Pryce의 진술은 IR에 대해서만 맞고, SR에 대해서는 틀리다.\n\nExam trap: 'benchmark와 혼합 → IR 불변' vs '현금과 혼합 → SR 불변, IR 하락'. 오답노트 R-PM-M2-08 \"Cash 비중 확대 → IR ↓ … SR은 불변; Active weight를 공격적 ↑ → IR 불변\" 그대로 — 본인 Eco PM 2-15·2-16·2-31 1차 오답이 모두 이 구분.\n\n[참조] LOS PM-R2-L2: calculate and interpret the information ratio (ex post and ex ante) and contrast it to the Sharpe ratio | Schweser Book 5, Reading 35 (Analysis of Active Portfolio Management), Module 35.2, LOS 35.b, pdf p.25 | 관련 Eco: PM 2-15 (1st 오답), PM 2-16 (1st 오답), PM 2-31 (1st 오답) | 오답노트: R-PM-M2-08", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q30"}, {"id": "cMock1:m1-s09-q2", "src": "모의고사 오답", "module": "12-DER", "subject": "cMock1", "tag": "Derivatives", "vig": 110, "html": true, "stem": "The current value of the Danholt forward contract to Vellmark is <i>closest<\/i> to:", "opts": {"A": "&euro;4.42 million.", "B": "&euro;4.98 million.", "C": "&euro;5.61 million."}, "ans": "C", "ko": "이산 배당이 있는 equity forward의 시점 t 가치(long) = (S_t − PVD_t) − F_0/(1 + r)^{T−t}; short는 부호 반대: V_short = F_0/(1 + r)^{T−t} − (S_t − PVD_t).\n풀이: 풀이(주당):\n풀이: 1) 남은 기간 T − t = 9 − 3 = 6개월 = 0.5년\n풀이: 2) PVD_t = 0.80/1.035^{4/12} = €0.7909\n풀이: 3) PV(F_0) = 50.00/1.035^{0.5} = €49.1473\n풀이: 4) V_short = 49.1473 − (46.20 − 0.7909) = €3.7382\n풀이: 5) 1.5백만 주 × €3.7382 = €5.61m\n풀이: 주가가 계약 체결 후 하락했으므로 매도 계약(short)의 가치는 양(+)이다.", "f": "\\[ V_{\\text{short}}=\\frac{F_0}{(1+r)^{T-t}}-\\Big(S_t-\\frac{D}{(1+r)^{t_D}}\\Big)=\\frac{50}{1.035^{0.5}}-\\Big(46.20-\\frac{0.80}{1.035^{4/12}}\\Big) \\]", "trap": "할인기간은 '남은 기간', 배당은 계약 만기 전 지급분만 PV로 차감.", "why": {"A": "남은 배당(€0.80)의 PV를 빼지 않음 — short 포지션에 배당이 주는 가치를 누락.", "B": "F0를 원래 계약기간(9개월)으로 할인 — 남은 6개월로 할인해야 함."}, "en": "정답 C. 이산 배당이 있는 equity forward의 시점 t 가치(long) = (S_t − PVD_t) − F_0/(1 + r)^{T−t}; short는 부호 반대: V_short = F_0/(1 + r)^{T−t} − (S_t − PVD_t).\n\n수식 출처: Schweser Book 4, Module 28.2, LOS 28.a, pdf p.138–140(식 이미지 → 커리큘럼 Derivatives LM1 Eq.2–3과 Example 3·7로 확인: F0 = 1,000×1.05^{3/12} − 10×1.05^{1/12} = 1,002.23; V_t = 110 − 102/1.05^{0.25} = 9.2366).\n\n풀이(주당):\n1) 남은 기간 T − t = 9 − 3 = 6개월 = 0.5년\n2) PVD_t = 0.80/1.035^{4/12} = €0.7909\n3) PV(F_0) = 50.00/1.035^{0.5} = €49.1473\n4) V_short = 49.1473 − (46.20 − 0.7909) = €3.7382\n5) 1.5백만 주 × €3.7382 = €5.61m\n\n주가가 계약 체결 후 하락했으므로 매도 계약(short)의 가치는 양(+)이다.\n\n오답: A(€4.42m) — 배당 미반영(49.1473 − 46.20 = 2.9473). 주식 보유자에게 배당이 지급되므로 forward 매수자가 받는 기초자산 가치는 S_t − PVD_t다. B(€4.98m) — 원래 9개월로 할인(50/1.035^{0.75} = 48.7254). (방향을 반대로 잡으면 −€5.61m.)\n\nExam trap: 할인기간은 '남은 기간', 배당은 계약 만기 전 지급분만 PV로 차감.\n\n[참조] LOS DER-R1-L1: describe how equity forwards and futures are priced, and calculate and interpret their no-arbitrage value | Schweser Book 4, Reading 28 (Pricing and Valuation of Forward Commitments), Module 28.2, LOS 28.a, pdf p.138–140; Curriculum Derivatives LM1 Example 3·7 | 관련 Eco: DER 1-11, DER 1-26, DER 1-53", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q34"}, {"id": "cMock1:m1-s10-q2", "src": "모의고사 오답", "module": "12-FSA", "subject": "cMock1", "tag": "Financial Statement Analysis", "vig": 111, "html": true, "stem": "Under the method that Halvern should use, the cumulative translation adjustment for Alimentos at 31 December 2025 is <i>closest<\/i> to:", "opts": {"A": "&minus;$7.22 million.", "B": "&minus;$6.00 million.", "C": "$7.22 million."}, "ans": "A", "ko": "Current rate method: 자산·부채 = 기말(current) 환율, 보통주 = 납입 시점 historical rate, 수익·비용 = 평균환율, 배당 = 선언일 환율. CTA는 대차를 맞추는 plug.\n풀이: 풀이(USD millions):\n풀이: 1) 순자산(= 자산 − 부채) = 800 − 90 − 260 = BRL450 → × 0.1800 = $81.00\n풀이: 2) 보통주 = 300 × 0.2000 = $60.00\n풀이: 3) 환산 이익잉여금 = 70 × 0.1920 + 110 × 0.1840 − 30 × 0.1820 = 13.44 + 20.24 − 5.46 = $28.22\n풀이: 4) CTA = 81.00 − 60.00 − 28.22 = −$7.22\n풀이: (참고: 2024년 말 CTA = 370 × 0.188 − 60.00 − 13.44 = −$3.88, 2025년 발생분 = −$3.34.) BRL이 계속 약세였고 자회사가 순자산 노출(net asset position)이므로 누적 CTA는 음(−)이다.", "f": "\\[ CTA=\\underbrace{450(0.18)}_{\\text{net assets}}-\\underbrace{300(0.20)}_{\\text{stock}}-\\underbrace{[70(0.192)+110(0.184)-30(0.182)]}_{\\text{RE}}=-7.22 \\]", "trap": "CTA는 B/S에서 역산, RE는 연도별로 누적 환산.", "why": {"B": "이익잉여금을 기말 환율로 환산(150 × 0.18 = 27.00) — RE는 연도별 NI(평균환율) − 배당(선언일 환율)로 누적해야 함.", "C": "부호 오류 — 순자산 노출 + 외화(BRL) 약세 → 환산손실(음의 CTA)."}, "en": "정답 A. Current rate method: 자산·부채 = 기말(current) 환율, 보통주 = 납입 시점 historical rate, 수익·비용 = 평균환율, 배당 = 선언일 환율. CTA는 대차를 맞추는 plug(Schweser Book 2, Module 9.4, LOS 9.d, pdf p.62; 예제 Module Quiz 답 pdf p.90: $1.55 × £400 − $1.60 × £100 = $460).\n\n풀이(USD millions):\n1) 순자산(= 자산 − 부채) = 800 − 90 − 260 = BRL450 → × 0.1800 = $81.00\n2) 보통주 = 300 × 0.2000 = $60.00\n3) 환산 이익잉여금 = 70 × 0.1920 + 110 × 0.1840 − 30 × 0.1820 = 13.44 + 20.24 − 5.46 = $28.22\n4) CTA = 81.00 − 60.00 − 28.22 = −$7.22\n\n(참고: 2024년 말 CTA = 370 × 0.188 − 60.00 − 13.44 = −$3.88, 2025년 발생분 = −$3.34.) BRL이 계속 약세였고 자회사가 순자산 노출(net asset position)이므로 누적 CTA는 음(−)이다.\n\n오답: B(−$6.00) — RE를 기말 환율로 환산. C(+$7.22) — 부호 오류.\n\nExam trap: CTA는 B/S에서 역산(오답노트 R-FSA-M3-08), RE는 연도별로 누적 환산. 오답노트 R-FSA-M3-02 적용.\n\n[참조] LOS FSA-R3-L5: calculate the translation effects and evaluate the translation of a subsidiary’s balance sheet and income statement into the parent company’s presentation currency | Schweser Book 2, Reading 9 (Multinational Operations), Module 9.4–9.5, LOS 9.d–9.e, pdf p.62–72, p.90 | 관련 Eco: FSA 3-11, FSA 3-24, FSA 3-49 | 오답노트: R-FSA-M3-08, R-FSA-M3-02", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q38"}, {"id": "cMock1:m1-s11-q4", "src": "모의고사 오답", "module": "12-ETH", "subject": "cMock1", "tag": "Ethical and Professional Standards", "vig": 112, "html": true, "stem": "Which of the following matters is Okafor required to disclose in the Torvane report?", "opts": {"A": "Brightwater's pursuit of the underwriting mandate only.", "B": "Her ownership of Torvane shares and Brightwater's pursuit of the underwriting mandate.", "C": "Her ownership of Torvane shares, Brightwater's pursuit of the underwriting mandate, and the lunch provided at the investor day."}, "ans": "B", "ko": "Standard VI(A) Avoid or Disclose Conflicts: 독립성·객관성을 해치거나 고객에 대한 의무를 방해할 것으로 합리적으로 예상되는 모든 사항을 눈에 띄게, 쉬운 언어로 완전·공정하게 고지해야 한다.\n풀이: ① 개인 보유 주식: 추천 대상 회사 주식의 실제 보유는 가장 흔한 고지 대상 이해상충이다. compliance의 사전승인은 사내 개인거래 정책을 지켰다는 뜻일 뿐 보고서 독자에 대한 고지 의무를 면제하지 않는다. ② 회사의 investment-banking 관계: 추천 대상과의 사업 관계(인수 업무 추진)는 고객이 편향 가능성을 판단할 수 있도록 고지해야 한다. compliance에 알린 것만으로는 보고서 독자 고지가 되지 않는다. ③ investor day 뷔페 점심: 모든 참석자에게 제공된 통상적·소액 편의이고 여행·숙박은 본인이 부담했다. 독립성 훼손이 합리적으로 예상되지 않으므로 I(B) 위반도 아니고 보고서 고지 대상도 아니다(I(B): modest gifts permitted).", "f": "", "trap": "고용주 승인과 고객 고지는 별개다. 과잉 위반 판정(over-flag)에도 주의한다.", "why": {"A": "compliance 사전승인은 사내 거래 정책 충족일 뿐 — 추천 대상 주식의 개인 보유는 보고서 독자에게 고지해야 하는 대표적 이해상충.", "C": "모든 참석 애널리스트에게 제공된 뷔페 점심은 통상적·소액 — 독립성 훼손을 합리적으로 예상할 사항이 아니므로 보고서 고지 대상 아님."}, "en": "정답 B. Standard VI(A) Avoid or Disclose Conflicts: 독립성·객관성을 해치거나 고객에 대한 의무를 방해할 것으로 합리적으로 예상되는 모든 사항을 눈에 띄게, 쉬운 언어로 완전·공정하게 고지해야 한다(Schweser Book 5, VI(A), pdf p.151–152).\n\n① 개인 보유 주식: 추천 대상 회사 주식의 실제 보유는 가장 흔한 고지 대상 이해상충이다(pdf p.151). compliance의 사전승인은 사내 개인거래 정책을 지켰다는 뜻일 뿐 보고서 독자에 대한 고지 의무를 면제하지 않는다. ② 회사의 investment-banking 관계: 추천 대상과의 사업 관계(인수 업무 추진)는 고객이 편향 가능성을 판단할 수 있도록 고지해야 한다(pdf p.152 Example 1·3 취지). compliance에 알린 것만으로는 보고서 독자 고지가 되지 않는다. ③ investor day 뷔페 점심: 모든 참석자에게 제공된 통상적·소액 편의이고 여행·숙박은 본인이 부담했다. 독립성 훼손이 합리적으로 예상되지 않으므로 I(B) 위반도 아니고 보고서 고지 대상도 아니다(I(B): modest gifts permitted, pdf p.113, p.115).\n\n오답: A — '고용주가 승인 = 고지 불필요'라는 함정. C — 소액·통상적 편의까지 고지 대상으로 과대 판단한 것.\n\nExam trap: 고용주 승인과 고객 고지는 별개다. 과잉 위반 판정(over-flag)에도 주의한다.\n\n[참조] LOS ETH-R3-L1: evaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct | Schweser Book 5, Reading 41 (Guidance for Standards I–VII), VI(A) Avoid or Disclose Conflicts, pdf p.151–152; I(B) Guidance pdf p.113, p.115", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q44"}, {"id": "cMock1:m1-s15-q1", "src": "모의고사 오답", "module": "12-ECO", "subject": "cMock1", "tag": "Economics", "vig": 113, "html": true, "stem": "Using Dragan's method, Tessaly's forecast potential GDP growth rate is <i>closest<\/i> to:", "opts": {"A": "3.44%.", "B": "3.76%.", "C": "3.90%."}, "ans": "A", "ko": "Solow growth accounting: ΔY/Y = ΔA/A + αΔK/K + (1 − α)ΔL/L. α는 capital share = 1 − labor share이다.\n풀이: 풀이(Tessaly):\n풀이: 1) α = 1 − 0.55 = 0.45\n풀이: 2) ΔY/Y = 1.2% + 0.45 × 4.0% + 0.55 × 0.8% = 1.2% + 1.80% + 0.44% = 3.44%", "f": "\\[ \\frac{\\Delta Y}{Y}=1.2\\%+0.45(4.0\\%)+0.55(0.8\\%)=3.44\\% \\]", "trap": "Exhibit에 남는 데이터(과거 노동생산성)를 보고 다른 방식으로 바꾸지 않는다. 'labor share'가 주어지면 α = 1 − labor share.", "why": {"B": "labor share(0.55)를 α(capital share)로 사용 — α = 1 − 0.55 = 0.45.", "C": "labor productivity 방식(노동력 0.8% + 과거 노동생산성 3.1%) — Dragan은 Solow growth accounting을 사용하며, 과거 추세는 예측 입력값이 아님."}, "en": "정답 A. Solow growth accounting: ΔY/Y = ΔA/A + αΔK/K + (1 − α)ΔL/L. α는 capital share = 1 − labor share이다.\n\n수식 출처: Curriculum Economics LM2 Eq.4 (텍스트 확인: 'ΔY/Y = ΔA/A + αΔK/K + (1 − α)ΔL/L', 'α estimated as one minus the labor share of GDP'); Schweser Book 1, Module 6.2, LOS 6.e, pdf p.151 (식은 이미지 — Azikland 예제 역산: labor 60%, ΔL 1.5%, ΔK 3%, TFP 2% → 2% + 0.4 × 3% + 0.6 × 1.5% = 4.1%).\n\n풀이(Tessaly):\n1) α = 1 − 0.55 = 0.45\n2) ΔY/Y = 1.2% + 0.45 × 4.0% + 0.55 × 0.8% = 1.2% + 1.80% + 0.44% = 3.44%\n\n오답: B(3.76%) — α와 (1 − α)를 바꿈: 1.2% + 0.55 × 4.0% + 0.45 × 0.8%. C(3.90%) — labor productivity growth accounting(Eq.5: 노동력 증가율 + 노동생산성 증가율)에 과거 추세 3.1%를 넣음.\n\nExam trap: Exhibit에 남는 데이터(과거 노동생산성)를 보고 다른 방식으로 바꾸지 않는다. 'labor share'가 주어지면 α = 1 − labor share(오답노트 R-ECO-M2-03).\n\n[참조] LOS ECO-R2-L5: demonstrate forecasting potential GDP based on growth accounting relations | Schweser Book 1, Reading 6 (Economic Growth), Module 6.2, LOS 6.e, pdf p.151; Curriculum Economics LM2 Eq.4–5 | 관련 Eco: ECO 2-26, ECO 2-47, ECO 2-54 | 오답노트: R-ECO-M2-03", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q57"}, {"id": "cMock1:m1-s16-q1", "src": "모의고사 오답", "module": "12-FSA", "subject": "cMock1", "tag": "Financial Statement Analysis", "vig": 114, "html": true, "stem": "Which of Okonkwo's observations is <i>least likely<\/i> to be fully addressed by a CAMELS analysis of Corvane?", "opts": {"A": "Observation 1", "B": "Observation 2", "C": "Observation 3"}, "ans": "A", "ko": "Off-balance-sheet 항목(standby L/C, 미인출 대출약정 등)은 커리큘럼이 'CAMELS가 다루지 않는(또는 충분히 다루지 않는) 분석 고려사항'으로 따로 꼽는 항목이다. 이런 항목은 재무상태표에 나타나지 않아 불투명하고, 예상치 못하게 자원을 소진시킬 수 있다.\n풀이: - Observation 2 → Asset quality: allowance / NPL 배수가 1.6배에서 1.1배로 떨어진 것은 충당금 쿠션이 줄었다는 뜻이다.\n풀이: - Observation 3 → Earnings: 순이자이익 비중이 오르고 트레이딩 이익 비중이 내려가 이익의 지속가능성이 좋아졌다.", "f": "", "trap": "CAMELS 6요소(C·A·M·E·L·S)에 바로 들어가는 재무제표 지표와, CAMELS 밖의 요소(정부 지원, mission, culture, 경쟁환경, off-balance-sheet, segment, 통화 노출)를 구분한다.", "why": {"B": "Allowance / NPL 비율은 CAMELS의 'A'(Asset quality) 항목에서 직접 분석.", "C": "수익 구성(순이자이익 vs 트레이딩 이익)과 지속가능성은 CAMELS의 'E'(Earnings) 항목."}, "en": "정답 A. Off-balance-sheet 항목(standby L/C, 미인출 대출약정 등)은 커리큘럼이 'CAMELS가 다루지 않는(또는 충분히 다루지 않는) 분석 고려사항'으로 따로 꼽는 항목이다. 이런 항목은 재무상태표에 나타나지 않아 불투명하고, 예상치 못하게 자원을 소진시킬 수 있다.\n\n근거: Curriculum FSA LM4, 'Analytical Considerations Not Addressed by CAMELS That Are Also Relevant for Any Company' — 'Off-balance-sheet items. Off-balance-sheet assets and liabilities pose a risk to entities and their investors if they should unexpectedly drain resources'; Schweser Book 2, Module 10.5, LOS 10.e, pdf p.109 ('Apart from these factors ... Off-balance-sheet assets and/or liabilities ... key information ... may be opaque').\n\n- Observation 2 → Asset quality: allowance / NPL 배수가 1.6배에서 1.1배로 떨어진 것은 충당금 쿠션이 줄었다는 뜻이다(덜 보수적, 오답노트 R-FSA-M4-04).\n- Observation 3 → Earnings: 순이자이익 비중이 오르고 트레이딩 이익 비중이 내려가 이익의 지속가능성이 좋아졌다(오답노트 R-FSA-M4-05).\n\nExam trap: CAMELS 6요소(C·A·M·E·L·S)에 바로 들어가는 재무제표 지표와, CAMELS 밖의 요소(정부 지원, mission, culture, 경쟁환경, off-balance-sheet, segment, 통화 노출)를 구분한다.\n\n[참조] LOS FSA-R4-L3: explain the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach to analyzing a bank, including key ratios and its limitations | Schweser Book 2, Reading 10 (Analysis of Financial Institutions), Module 10.2–10.5, LOS 10.c, 10.e, pdf p.94–95, p.109; Curriculum FSA LM4 (non-CAMELS factors) | 관련 Eco: FSA 4-12, FSA 4-20, FSA 4-43 | 오답노트: R-FSA-M4-04, R-FSA-M4-05", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q61"}, {"id": "cMock1:m1-s18-q3", "src": "모의고사 오답", "module": "12-AI", "subject": "cMock1", "tag": "Alternative Investments", "vig": 115, "html": true, "stem": "Corrêa's estimate of Fennick's net asset value per share (NAVPS) is <i>closest<\/i> to:", "opts": {"A": "$45.07.", "B": "$46.63.", "C": "$47.54."}, "ans": "B", "ko": "NAVPS = [다음 12개월 cash NOI / cap rate + 기타 유형자산 − 부채] / 발행주식수.\n풀이: 1) 인수 tower의 full-year 조정: 4개월 NOI $3.6m → 연간 $10.8m, 추가분 = 3.6 × 8/4 = $7.2m\n풀이: 2) Pro forma cash NOI(LTM) = 236.0 − 9.8 + 7.2 = $233.4m\n풀이: 3) 다음 12개월 cash NOI = 233.4 × 1.02 = $238.068m\n풀이: 4) 운영 부동산 가치 = 238.068 / 0.0625 = $3,809.088m\n풀이: 5) 기타 자산 = 42.5 + 31.0 + 58.0 + 12.5 = $144.0m (goodwill·deferred financing costs 제외)\n풀이: 6) NAV = 3,809.088 + 144.0 − 1,620.0 − 95.0 = $2,238.088m\n풀이: 7) NAVPS = 2,238.088 / 48.0 = $46.63\n풀이: 해석: 주가 $41.80은 NAVPS 대비 약 10% 할인되어 있다.", "f": "\\[ NAVPS = \\frac{\\frac{(236.0 - 9.8 + 7.2)(1.02)}{0.0625} + 144.0 - 1{,}620.0 - 95.0}{48.0} = 46.63 \\]", "trap": "NAVPS 순서는 ① non-cash rent 차감 ② 인수 자산 full-year 조정 ③ ×(1 + g) ④ ÷ cap rate ⑤ + 기타 유형자산(현금·매출채권·개발용 토지·선급비용, GW·DTA 제외) ⑥ − 부채다(R-AI-M3-02). 이자비용·감가상각은 NOI 계산과 무관하다.", "why": {"A": "pro forma cash NOI를 다음 12개월로 성장(2.0%)시키지 않고 바로 capitalization.", "C": "goodwill $40.0m과 deferred financing costs $4.0m을 자산에 포함 — NAV는 hard economic asset만 포함."}, "en": "정답 B. NAVPS = [다음 12개월 cash NOI / cap rate + 기타 유형자산 − 부채] / 발행주식수.\n\n수식 출처: Schweser Book 4, Module 32.1, LOS 32.b, pdf p.239–241 (cash NOI는 non-cash rent 차감, 기중 인수 자산의 full-year 조정, 성장률 적용 후 cap rate로 나눔; goodwill·deferred financing expenses·deferred tax assets 제외), Curriculum AI LM3 Exhibit 2 (역산: 270,432 − 7,667 + 4,534 = 267,299 → ×1.015 = 271,308 → /0.07 = 3,875,829 → NAV 2,914,198 / 55,689 = $52.33 일치).\n\n풀이:\n1) 인수 tower의 full-year 조정: 4개월 NOI $3.6m → 연간 $10.8m, 추가분 = 3.6 × 8/4 = $7.2m\n2) Pro forma cash NOI(LTM) = 236.0 − 9.8 + 7.2 = $233.4m\n3) 다음 12개월 cash NOI = 233.4 × 1.02 = $238.068m\n4) 운영 부동산 가치 = 238.068 / 0.0625 = $3,809.088m\n5) 기타 자산 = 42.5 + 31.0 + 58.0 + 12.5 = $144.0m (goodwill·deferred financing costs 제외)\n6) NAV = 3,809.088 + 144.0 − 1,620.0 − 95.0 = $2,238.088m\n7) NAVPS = 2,238.088 / 48.0 = $46.63\n\n해석: 주가 $41.80은 NAVPS 대비 약 10% 할인되어 있다.\n\n오답: A($45.07) — 3)의 성장 반영을 생략(233.4/0.0625). C($47.54) — goodwill과 deferred financing costs $44.0m을 자산에 포함. 참고로 인수 조정을 빠뜨리면 $44.18, non-cash rent를 빼지 않으면 $49.96이 된다(선택지 없음).\n\nExam trap: NAVPS 순서는 ① non-cash rent 차감 ② 인수 자산 full-year 조정 ③ ×(1 + g) ④ ÷ cap rate ⑤ + 기타 유형자산(현금·매출채권·개발용 토지·선급비용, GW·DTA 제외) ⑥ − 부채다(R-AI-M3-02). 이자비용·감가상각은 NOI 계산과 무관하다.\n\n[참조] LOS AI-R3-L2: justify the use of net asset value per share (NAVPS) in valuation of publicly traded real estate securities and estimate NAVPS based on forecasted cash net operating income | Schweser Book 4, Reading 32 (Investments in Real Estate through Publicly Traded Securities), Module 32.1, LOS 32.b, pdf p.239–241; Curriculum AI LM3 Exhibit 2 | 관련 Eco: AI 3-19, AI 3-20, AI 3-6 | 오답노트: R-AI-M3-02", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q71"}, {"id": "cMock1:m1-s18-q4", "src": "모의고사 오답", "module": "12-AI", "subject": "cMock1", "tag": "Alternative Investments", "vig": 115, "html": true, "stem": "Which price multiple <i>best<\/i> meets the board's two criteria for ranking the six REITs?", "opts": {"A": "Price-to-AFFO", "B": "Price-to-FFO", "C": "Enterprise value-to-EBITDA"}, "ans": "B", "ko": "FFO는 Nareit가 정의를 표준화했고 데이터 제공업체에서 널리 구할 수 있다(기준 1). FFO는 이자비용을 차감한 순이익에서 출발하는 levered income이므로 P/FFO는 각 REIT의 레버리지를 반영한다(기준 2). 레버리지가 높을수록 요구수익률이 올라 P/FFO가 낮아진다.", "f": "", "trap": "'더 좋은 경제적 이익 척도'(AFFO)와 '더 일관되게 계산되는 척도'(FFO)는 다르다. 문제의 기준이 무엇을 요구하는지 먼저 확인한다.", "why": {"A": "AFFO는 recurring capex 추정 방법이 회사·애널리스트마다 달라 표준화되어 있지 않음 → 기준 (1) 불충족.", "C": "EBITDA는 이자 차감 전(unlevered) 이익이므로 레버리지를 반영하지 않음 → 기준 (2) 불충족."}, "en": "정답 B. FFO는 Nareit가 정의를 표준화했고 데이터 제공업체에서 널리 구할 수 있다(기준 1). FFO는 이자비용을 차감한 순이익에서 출발하는 levered income이므로 P/FFO는 각 REIT의 레버리지를 반영한다(기준 2). 레버리지가 높을수록 요구수익률이 올라 P/FFO가 낮아진다.\n\n근거: Curriculum AI LM3 ('FFO and AFFO are based on net income available to equity and thus represent levered income ... EBITDA, by definition, measures income before the leveraging effect of debt'; 'Nareit took steps to standardize and promote the definition'; P/AFFO의 단점 'wide variations in estimates and assumptions are incorporated into the calculation of AFFO'), Schweser Book 4, Module 32.1, pdf p.242–243 ('FFO estimates are widely available'; 'AFFO relies more on estimates and is considered more subjective'). 오답노트 R-AI-M3-04: AFFO는 Economic Return to Shareholder 고려, FFO 대비 Variation Error ↑.\n\n오답: A — AFFO는 경제적 이익과 배당 여력을 더 잘 나타내지만, recurring capex 가정이 제각각이라 회사 간 비교 가능성(기준 1)이 떨어진다. C — EV/EBITDA는 부동산 cap rate와 비슷한 like-for-like 비교에는 좋지만 이자 차감 전 이익이라 기준 (2)를 충족하지 못한다.\n\nExam trap: '더 좋은 경제적 이익 척도'(AFFO)와 '더 일관되게 계산되는 척도'(FFO)는 다르다. 문제의 기준이 무엇을 요구하는지 먼저 확인한다.\n\n[참조] LOS AI-R3-L4: calculate and interpret the value of a REIT share using the net asset value, relative value (price-to-FFO and price-to-AFFO), and discounted cash flow approaches | Schweser Book 4, Reading 32 (Investments in Real Estate through Publicly Traded Securities), Module 32.1, LOS 32.c–d, pdf p.242–243; Curriculum AI LM3 'Relative Value Approach' and 'P/FFO and P/AFFO Multiples' | 관련 Eco: AI 3-31, AI 3-21, AI 3-28 | 오답노트: R-AI-M3-04", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q72"}, {"id": "cMock1:m1-s19-q3", "src": "모의고사 오답", "module": "12-DER", "subject": "cMock1", "tag": "Derivatives", "vig": 116, "html": true, "stem": "If the economist's forecasts in Request 3 are correct, the delta-neutral straddle position is <i>most likely<\/i> to lose value over the next week because of its exposure to:", "opts": {"A": "vega.", "B": "theta.", "C": "rho."}, "ans": "B", "ko": "Delta-neutral long straddle은 long gamma·long vega·short theta 포지션이다. 지수가 좁은 범위에서 움직이면 gamma로 얻는 이익(큰 가격 변동에서 생기는 convexity 이익)이 거의 없고, 1주일의 시간 경과에 따른 time decay(theta < 0)가 그대로 손실이 된다. 만기가 3주로 짧고 ATM이므로 |theta|가 특히 크다.", "f": "", "trap": "실현변동성(realized)이 낮다는 전망은 vega가 아니라 gamma 이익이 작다는 뜻이다. vega는 '내재'변동성의 변화에 반응한다.", "why": {"A": "long option은 vega > 0. 내재변동성이 불변이거나 소폭 상승하면 손실이 아니라 0 또는 이익.", "C": "call rho(+)와 put rho(−)가 같은 행사가·만기에서 서로 상쇄되고, 3주 만기 옵션의 rho는 작다. 금리 인하는 put 쪽에는 오히려 이익."}, "en": "정답 B. Delta-neutral long straddle은 long gamma·long vega·short theta 포지션이다. 지수가 좁은 범위에서 움직이면 gamma로 얻는 이익(큰 가격 변동에서 생기는 convexity 이익)이 거의 없고, 1주일의 시간 경과에 따른 time decay(theta < 0)가 그대로 손실이 된다. 만기가 3주로 짧고 ATM이므로 |theta|가 특히 크다.\n\n근거: Schweser Book 4, Module 29.7, LOS 29.k, pdf p.188–190 (long call·put의 gamma > 0이고 ATM에서 최대, vega > 0, theta < 0이며 만기에 가까울수록 |theta| 증가, rho는 'not a very important sensitivity measure'). 오답노트 R-DER-M2-14: Theta는 시간이 흐를수록 Option Value 감소 → Long Call/Put과 Negative(−) 관계 (만기에 가까워질수록 theta의 절대값 증가). R-DER-M2-05: Long Call/Put → Gamma Positive(+).\n\n오답: A — vega는 long option에서 양수다. 내재변동성이 불변이면 영향이 없고 소폭 상승하면 이익이다. C — 같은 행사가·만기의 call과 put을 함께 보유하면 rho가 대부분 상쇄되고, 단기 옵션의 rho는 원래 작다.\n\nExam trap: 실현변동성(realized)이 낮다는 전망은 vega가 아니라 gamma 이익이 작다는 뜻이다. vega는 '내재'변동성의 변화에 반응한다.\n\n[참조] LOS DER-R2-L11: interpret each of the option Greeks | Schweser Book 4, Reading 29 (Valuation of Contingent Claims), LOS 29.k, pdf p.188–190 | 관련 Eco: DER 2-38 (1st 오답), DER 2-13, DER 2-29 | 오답노트: R-DER-M2-14, R-DER-M2-05", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q75"}, {"id": "cMock1:m1-s20-q2", "src": "모의고사 오답", "module": "12-FI", "subject": "cMock1", "tag": "Fixed Income", "vig": 117, "html": true, "stem": "The credit spread implied by Moretti's fair value of the Calloway bond is <i>closest<\/i> to:", "opts": {"A": "0.54%.", "B": "1.06%.", "C": "1.21%."}, "ans": "C", "ko": "공정가치 = VND(무위험 가치) − CVA, credit spread = YTM(공정가치) − YTM(무위험 채권).\n풀이: 1) VND = 5/1.03 + 5/1.03² + 105/1.03³ = 105.6572\n풀이: 2) 공정가치 = 105.6572 − 3.4785 = 102.1787\n풀이: 3) 102.1787 = 5/(1 + y) + 5/(1 + y)² + 105/(1 + y)³ → y = 4.2117%\n풀이: 4) 무위험 YTM = 3.0%(flat) → credit spread = 4.2117% − 3.0% = 1.21%\n풀이: 해석: 시장가격 102.60 > 공정가치 102.18이므로 Moretti의 가정으로는 채권이 고평가되어 있다(시장 spread 1.06% < 공정 spread 1.21%). 근사식 h × (1 − RR) = 1.8% × 0.65 = 1.17%와도 비슷하다(R-FI-M4-03).", "f": "\\[ 105.6572 - 3.4785 = 102.1787 = \\sum_{t=1}^{3}\\frac{CF_t}{(1+y)^t} \\Rightarrow y = 4.2117\\%,\\quad spread = 4.2117\\% - 3.0\\% = 1.21\\% \\]", "trap": "분석가 가정이 의미하는 spread는 VND − CVA로 구한 가격의 YTM에서 나온다. 시장가격을 쓰면 시장의 spread가 나오고, 둘을 비교해야 고평가·저평가를 판단할 수 있다.", "why": {"A": "위험중립 hazard rate 대신 과거 실제 부도율 0.8%로 CVA(1.56)를 계산해 공정가치를 과대평가.", "B": "공정가치(VND − CVA) 대신 시장가격 102.60으로 YTM을 구함 — 시장이 반영한 spread이지 Moretti의 가정이 의미하는 spread가 아님."}, "en": "정답 C. 공정가치 = VND(무위험 가치) − CVA, credit spread = YTM(공정가치) − YTM(무위험 채권).\n\n수식 출처: Schweser Book 4, Module 26.1, pdf p.96–97 ('it is the difference in value between a risk-free bond and an otherwise identical risky bond'; 'Credit spread = YTM risky – YTM risk-free'; 예제 91.51 − 2.15 = 89.36 → YTM 3.82% → spread 0.82% 역산 일치), Module 26.5, LOS 26.e, pdf p.106 ('VND is calculated using the risk-free rate to value the risky bond').\n\n풀이:\n1) VND = 5/1.03 + 5/1.03² + 105/1.03³ = 105.6572\n2) 공정가치 = 105.6572 − 3.4785 = 102.1787\n3) 102.1787 = 5/(1 + y) + 5/(1 + y)² + 105/(1 + y)³ → y = 4.2117%\n4) 무위험 YTM = 3.0%(flat) → credit spread = 4.2117% − 3.0% = 1.21%\n\n해석: 시장가격 102.60 > 공정가치 102.18이므로 Moretti의 가정으로는 채권이 고평가되어 있다(시장 spread 1.06% < 공정 spread 1.21%). 근사식 h × (1 − RR) = 1.8% × 0.65 = 1.17%와도 비슷하다(R-FI-M4-03).\n\n오답: A(0.54%) — 실제 부도율 0.8% 사용(CVA 1.56, 공정가치 104.10). B(1.06%) — 시장가격으로 YTM을 구함.\n\nExam trap: 분석가 가정이 의미하는 spread는 VND − CVA로 구한 가격의 YTM에서 나온다. 시장가격을 쓰면 시장의 spread가 나오고, 둘을 비교해야 고평가·저평가를 판단할 수 있다(오답노트 R-FI-M4-04).\n\n[참조] LOS FI-R4-L5: calculate the value of a bond and its credit spread, given assumptions about the credit risk parameters | Schweser Book 4, Reading 26 (Credit Analysis Models), Module 26.1, pdf p.96–97; Module 26.5, LOS 26.e, pdf p.106 | 관련 Eco: FI 4-4, FI 4-9, FI 4-19, FI 4-16 (1st 오답) | 오답노트: R-FI-M4-04, R-FI-M4-03", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q78"}, {"id": "cMock1:m1-s21-q1", "src": "모의고사 오답", "module": "12-PM", "subject": "cMock1", "tag": "Portfolio Management", "vig": 118, "html": true, "stem": "Based on Exhibit 1, the expected annual return of the HMS portfolio is <i>closest<\/i> to:", "opts": {"A": "5.50%.", "B": "6.15%.", "C": "9.15%."}, "ans": "C", "ko": "다요인(APT) 모형의 기대수익률은 무위험수익률에 각 요인의 sensitivity × 기대 risk premium을 더한 값이다. 실현된 과거 요인 수익률이 아니라 '기대' premium을 쓴다.\n풀이: 변수: R_F = 3.0%, β = HMS sensitivity(Exhibit 1 둘째 열), λ = expected annual risk premium(넷째 열).\n풀이: 1) Market: 0.95 × 5.0% = 4.75%\n풀이: 2) Size: −0.15 × 2.0% = −0.30% (large-cap tilt → 음의 sensitivity)\n풀이: 3) Value: 0.30 × 3.0% = 0.90%\n풀이: 4) Momentum: 0.20 × 4.0% = 0.80%\n풀이: 5) E(R) = 3.0% + 4.75% − 0.30% + 0.90% + 0.80% = 9.15%", "f": "\\[ E(R)=3.0+0.95(5.0)-0.15(2.0)+0.30(3.0)+0.20(4.0)=9.15\\% \\]", "trap": "표에 '실현 수익률' 열이 함께 있으면 기대 premium 열을 골라야 한다. size 요인이 small − large로 정의되면 large-cap tilt는 음수 sensitivity로 반영된다.", "why": {"A": "기대 risk premium 대신 최근 12개월 실현 factor return을 사용(3.0 + 1.90 + 0.15 − 0.75 + 1.20).", "B": "무위험수익률 3.0%를 더하지 않음 — factor premium × sensitivity 합(6.15%)만 보고함."}, "en": "정답 C. 다요인(APT) 모형의 기대수익률은 무위험수익률에 각 요인의 sensitivity × 기대 risk premium을 더한 값이다. 실현된 과거 요인 수익률이 아니라 '기대' premium을 쓴다.\n\n수식 출처: Schweser Book 5, Module 37.1, LOS 37.c, pdf p.51 — E(R) = R_F + Σ(factor sensitivity × factor risk premium) (예제: 0.05 + 1.5(0.03) + 2(0.0125) = 12% 역산 일치).\n\n오답노트 R-PM-M4-10: \"Carhart 4 Factor 활용한 기대수익률 $E(R_p)$= $R_f$ + 4 Factor Return × Sensitivity\" — 여기서 'Factor Return'은 기대 risk premium이다.\n\n변수: R_F = 3.0%, β = HMS sensitivity(Exhibit 1 둘째 열), λ = expected annual risk premium(넷째 열).\n\n풀이:\n1) Market: 0.95 × 5.0% = 4.75%\n2) Size: −0.15 × 2.0% = −0.30% (large-cap tilt → 음의 sensitivity)\n3) Value: 0.30 × 3.0% = 0.90%\n4) Momentum: 0.20 × 4.0% = 0.80%\n5) E(R) = 3.0% + 4.75% − 0.30% + 0.90% + 0.80% = 9.15%\n\n오답: A(5.50%) — Mendes의 제안대로 최근 12개월 실현 요인 수익률(2.0%, −1.0%, −2.5%, 6.0%)을 넣은 값이다. APT의 λ는 요인 위험을 지는 대가인 기대 premium이고, 한 해의 실현값은 기대 premium의 추정치가 아니다. B(6.15%) — 무위험수익률을 빠뜨렸다. Benchmark sensitivity는 기대수익률 계산에 쓰이지 않는다(active exposure 분석용).\n\nExam trap: 표에 '실현 수익률' 열이 함께 있으면 기대 premium 열을 골라야 한다. size 요인이 small − large로 정의되면 large-cap tilt는 음수 sensitivity로 반영된다.\n\n[참조] LOS PM-R4-L3: calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums | Schweser Book 5, Reading 37 (Using Multifactor Models), Module 37.1, LOS 37.c, pdf p.51 | 관련 Eco: PM 4-9, PM 4-31 | 오답노트: R-PM-M4-10", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q81"}, {"id": "cMock1:m1-s21-q2", "src": "모의고사 오답", "module": "12-PM", "subject": "cMock1", "tag": "Portfolio Management", "vig": 118, "html": true, "stem": "Based on Exhibit 2, the proportion of the HMS strategy's active risk squared attributable to its value factor exposure is <i>closest<\/i> to:", "opts": {"A": "19.8%.", "B": "30.7%.", "C": "44.0%."}, "ans": "B", "ko": "Active risk squared(= tracking error²)는 active factor risk와 active specific risk의 합이다. 이 분해는 분산 단위에서 성립하므로, 표준편차로 주어진 tracking error와 specific risk를 먼저 제곱해야 한다.\n풀이: 1) Tracking error = active return / IR = 2.40% / 0.60 = 4.00% → active risk squared = 16.00 (%²)\n풀이: 2) Active specific risk = 2.20² = 4.84\n풀이: 3) Active factor risk = 16.00 − 4.84 = 11.16 → active risk squared 중 비중 11.16 / 16.00 = 69.75%\n풀이: 4) Value 몫 = 44% × 69.75% = 30.69% ≈ 30.7% (= 0.44 × 11.16 / 16.00 = 4.91 / 16.00)", "f": "\\[ \\frac{0.44\\,\\left[(2.40/0.60)^2-2.20^2\\right]}{(2.40/0.60)^2}=\\frac{0.44\\times11.16}{16.00}=30.7\\% \\]", "trap": "tracking error가 직접 주어지지 않으면 IR = active return / active risk로 역산한다. 비중 질문은 반드시 '무엇 대비'인지(active factor risk 대비 vs active risk squared 대비) 확인한다.", "why": {"A": "표준편차 단위에서 빼기: (4.00 − 2.20)/4.00 = 45% → 0.44 × 45% = 19.8%. Active risk는 분산(제곱) 단위에서만 가법적.", "C": "'active factor risk 중 비중' 44%를 'active risk squared 중 비중'으로 그대로 읽음 — active specific risk 몫을 빼지 않음."}, "en": "정답 B. Active risk squared(= tracking error²)는 active factor risk와 active specific risk의 합이다. 이 분해는 분산 단위에서 성립하므로, 표준편차로 주어진 tracking error와 specific risk를 먼저 제곱해야 한다.\n\n수식 출처: Schweser Book 5, Module 37.3, LOS 37.e, pdf p.59–60 — 'active risk squared = active factor risk + active specific risk', 'active factor risk = active risk squared − active specific risk'(예제: style factor 비중 12.22 / 21.69 = 56% 역산 일치). IR = 평균 active return / tracking risk: Module 37.3, LOS 37.g, pdf p.63.\n\n오답노트 R-PM-M4-07: \"Active Risk(=Tracking Error) Squared = Active Factor Risk + Active Specific Risk = $\\sigma_{(R_P-R_B)}^2$\"\n\n풀이:\n1) Tracking error = active return / IR = 2.40% / 0.60 = 4.00% → active risk squared = 16.00 (%²)\n2) Active specific risk = 2.20² = 4.84\n3) Active factor risk = 16.00 − 4.84 = 11.16 → active risk squared 중 비중 11.16 / 16.00 = 69.75%\n4) Value 몫 = 44% × 69.75% = 30.69% ≈ 30.7% (= 0.44 × 11.16 / 16.00 = 4.91 / 16.00)\n\n오답: A(19.8%) — 4.00% − 2.20%처럼 표준편차를 빼면 factor 몫이 45%로 줄어든다. 표준편차는 가법적이지 않다. C(44.0%) — Exhibit 2의 44%는 active factor risk 안에서의 비중이다. 전체 active risk squared에는 specific risk(30.25%)도 들어 있으므로 69.75%를 곱해야 한다.\n\nExam trap: tracking error가 직접 주어지지 않으면 IR = active return / active risk로 역산한다. 비중 질문은 반드시 '무엇 대비'인지(active factor risk 대비 vs active risk squared 대비) 확인한다.\n\n[참조] LOS PM-R4-L7: explain sources of active risk and interpret tracking risk and the information ratio | Schweser Book 5, Reading 37 (Using Multifactor Models), Module 37.3, LOS 37.e pdf p.59–60, LOS 37.g pdf p.63 | 관련 Eco: PM 4-10, PM 4-44 | 오답노트: R-PM-M4-07", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q82"}, {"id": "cMock1:m1-s21-q3", "src": "모의고사 오답", "module": "12-PM", "subject": "cMock1", "tag": "Portfolio Management", "vig": 118, "html": true, "stem": "Which of Halvorsen's comments is <i>most<\/i> accurate?", "opts": {"A": "Comment 1", "B": "Comment 2", "C": "Comment 3"}, "ans": "B", "ko": "Lotti는 36개 조합을 시험한 뒤 t-statistic이 가장 높은 조합을 골랐다. 이는 data snooping이며 false positive 위험이 크다. 대책은 두 가지다. 유의성 기준을 높이고(critical t ≥ 3.0), 선택에 쓰지 않은 데이터로 검증한다(cross-validation, out-of-sample). 선택된 조합의 t = 2.4는 3.0 기준을 넘지 못한다.", "f": "", "trap": "'편향의 이름'과 '해결책'을 짝지어 외운다. 현재 구성종목 → survivorship → point-in-time(상장폐지 포함). 공시 전 데이터 사용 → look-ahead → point-in-time·lag. 여러 모형 중 최고 선택 → data snooping → t ≥ 3.0·cross-validation.", "why": {"A": "현재 지수 구성종목만 쓰는 것은 survivorship bias이고, 해결책은 상장폐지 종목을 포함한 point-in-time 구성종목 — reporting lag는 look-ahead 대책.", "C": "분기말 회계자료를 분기말 당일에 쓰는 것은 look-ahead bias(reporting lag 무시) — 해결은 point-in-time 데이터 또는 lag 가정; 상장폐지 종목 추가는 survivorship 대책."}, "en": "정답 B. Lotti는 36개 조합을 시험한 뒤 t-statistic이 가장 높은 조합을 골랐다. 이는 data snooping이며 false positive 위험이 크다. 대책은 두 가지다. 유의성 기준을 높이고(critical t ≥ 3.0), 선택에 쓰지 않은 데이터로 검증한다(cross-validation, out-of-sample). 선택된 조합의 t = 2.4는 3.0 기준을 넘지 못한다.\n\n근거: Schweser Book 5, Module 39.3, LOS 39.d, pdf p.93–95 — survivorship bias는 'consider only those firms or stocks that have remained in existence', point-in-time data로 해결; look-ahead bias는 'data that would not have been available at the time', reporting lag와 lag assumption; data snooping은 'use a higher-than-normal critical t-statistic (e.g., 3.0)'와 cross-validation으로 대응.\n\n오답노트 R-PM-M6-01: \"Backtesting 3대 문제점\n① Survivorship ****Bias: 현존 entity만 포함 → 해결: Point-in-Time Data\n② Look-Ahead Bias: 해당 시점에 없는 정보 사용 → 해결: Point-in-Time Data + Lag Assumption\n③ Data Snooping: 다수 모델 시도 후 유의 결과만 선택 → 해결: Critical t-stat ≥ 3.0 + Cross-Validation\"\n\n오답: A — 현재 구성종목으로 universe를 만들면 살아남은 종목만 남는 survivorship bias가 생긴다. 해결책은 당시 구성종목(상장폐지 포함)을 담은 point-in-time 데이터이고, reporting lag로는 해결되지 않는다. Schweser는 survivorship을 look-ahead의 특수한 경우로 보기도 하지만, Comment 1의 해결책이 틀렸다. C — 분기말 실적을 분기말 당일에 쓰는 것은 당시 공개되지 않은 정보를 쓰는 look-ahead bias다. 대책은 point-in-time 데이터나 1–3개월 lag 가정이다. 문제의 이름과 해결책이 모두 틀렸다.\n\nExam trap: '편향의 이름'과 '해결책'을 짝지어 외운다. 현재 구성종목 → survivorship → point-in-time(상장폐지 포함). 공시 전 데이터 사용 → look-ahead → point-in-time·lag. 여러 모형 중 최고 선택 → data snooping → t ≥ 3.0·cross-validation.\n\n[참조] LOS PM-R6-L4: identify problems in a backtest of an investment strategy | Schweser Book 5, Reading 39 (Backtesting and Simulation), Module 39.3, LOS 39.d, pdf p.93–95 | 관련 Eco: PM 6-7, PM 6-9 | 오답노트: R-PM-M6-01", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q83"}, {"id": "cMock1:m1-s22-q4", "src": "모의고사 오답", "module": "12-ETH", "subject": "cMock1", "tag": "Ethical and Professional Standards", "vig": 119, "html": true, "stem": "Does Ruiz's social media post violate Standard VII(A) Conduct as Participants in CFA Institute Programs?", "opts": {"A": "Yes, because it reveals a topic that was tested on the exam.", "B": "Yes, because it publicly criticizes a CFA Institute exam policy.", "C": "No, because it does not disclose any specific exam question."}, "ans": "A", "ko": "Standard VII(A)는 CFA 시험의 무결성을 해치는 행위를 금지한다. 여기에는 시험에 나왔거나 나오지 않은 넓은 주제나 구체적 주제, 문항 내용, 필요하거나 필요하지 않았던 공식을 밝히는 것도 포함된다. 시험 프로그램이나 CFA Institute에 대한 의견은 자유롭게 표현할 수 있다.\n풀이: \"spent extra hours on swap valuation; it paid off on exam day\"는 swap valuation이 출제되었다는 사실을 공개적으로 알린 것이므로 위반이다. 시험 기간(testing window)이 짧다는 비판은 의견 표현이라 문제가 없다.", "f": "", "trap": "'어떤 공식·주제가 나왔다/안 나왔다'는 말은 넓게 표현해도 위반이다. CFA Institute 정책에 대한 불만이나 비판은 위반이 아니다.", "why": {"B": "CFA Institute나 시험 정책에 대한 의견 표명(비판 포함)은 허용 — VII(A)는 의견 표현을 막지 않음.", "C": "구체적 문항뿐 아니라 '출제된 넓은 주제'를 밝히는 것도 금지 — 'swap valuation이 도움이 됐다'는 출제 주제 공개."}, "en": "정답 A. Standard VII(A)는 CFA 시험의 무결성을 해치는 행위를 금지한다. 여기에는 시험에 나왔거나 나오지 않은 넓은 주제나 구체적 주제, 문항 내용, 필요하거나 필요하지 않았던 공식을 밝히는 것도 포함된다(Schweser Book 5, VII(A), pdf p.157: 'Revealing anything about either broad or specific topics tested, content of exam questions, or formulas required or not required on the exam'). 시험 프로그램이나 CFA Institute에 대한 의견은 자유롭게 표현할 수 있다(pdf p.157; 모듈 퀴즈 해설 pdf p.169).\n\n적용: \"spent extra hours on swap valuation; it paid off on exam day\"는 swap valuation이 출제되었다는 사실을 공개적으로 알린 것이므로 위반이다. 시험 기간(testing window)이 짧다는 비판은 의견 표현이라 문제가 없다.\n\n오답: B — 정책 비판은 허용된다. C — 구체적 문항을 밝히지 않았더라도 출제 주제를 알리면 위반이다.\n\nExam trap: '어떤 공식·주제가 나왔다/안 나왔다'는 말은 넓게 표현해도 위반이다. CFA Institute 정책에 대한 불만이나 비판은 위반이 아니다.\n\n[참조] LOS ETH-R3-L1: evaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct | Schweser Book 5, Reading 41 (Guidance for Standards I–VII), VII(A) Conduct as Participants in CFA Institute Programs, pdf p.157–158, p.169", "enLabel": "전체 해설", "orig": "Agent Mock 1 Q88"}], "vignettes": ["Aaliyah Schultz is a fixed-income portfolio manager at Aries Investments. She supervises Ameris Steele, a junior analyst, who begins building a model that combines structured financial data and sentiment data. Exhibit 1 presents a small sample of the raw dataset before cleansing.\nExhibit 1 – Sample of Raw Structured Data Before Cleansing\nID\tTicker\tIPO Date\tIndustry (NAICS)\tEBIT\tInterest Expense\tTotal Debt\n1\tABC\t4/6/17\t44\t9.4\t0.6\t10.1\n2\tBCD\tNovember 15, 2004\t52\t5.5\t0.4\t6.2\n3\tHIJ\t26-Jun-74\t54\t8.9\t1.2\t15.8\n4\tKLM\t14-Mar-15\t72\t5.7\t1.5\t0.0\nAfter cleansing the data, Steele preprocesses the dataset. She creates two new variables: an \"Age\" variable based on the firm's IPO date and an \"Interest Coverage Ratio\" variable equal to EBIT divided by interest expense. She also deletes the \"IPO Date\" variable from the dataset. After applying these transformations, Steele scales the financial data using normalization. She notes that over the full sample dataset, the \"Interest Expense\" variable ranges from a minimum of 0.2 and a maximum of 12.2, with a mean of 1.1 and a standard deviation of 0.4.\nAfter properly cleansing and preprocessing the raw text data, Steele performs exploratory data analysis. To assist in feature selection, she wants to create a visualization that shows the most informative words in the dataset based on their term frequency (TF) values.", "Bernadette Rivera is a portfolio manager at Voxkor, a private equity company. She is working with a data analyst, Tim Achler, on a text-based machine-learning (ML) model that classifies text information into positive or negative sentiment classes.\nAchler uses a web spidering program to obtain the data. After curating the text, Achler removes unnecessary elements from the raw text and completes additional text cleansing and preprocessing tasks. Next, Achler divides unique tokens into three groups; a sample of each group is shown in Exhibit 1.\nExhibit 1 – Summary of Sample Tokens\nToken Group 1\tToken Group 2\tToken Group 3\n\"not_increas_market\"\t\"not_increased_market\"\t\"not,\" \"increased,\" \"market\"\n\"currencysign\"\t\"currencysign\"\t\"EUR\"\n\"sale_decreas\"\t\"sale_decreased\"\t\"Sales,\" \"decreased\"\nAs part of the text exploration step, Achler conducts a term frequency analysis to identify outliers (Exhibit 2).\nExhibit 2 – Words with Highest and Lowest Frequency Value\nGroup 1 word\tFrequency\tGroup 2 word\tFrequency\nthe\t0.04935\tnaval\t1.0123e-05\nand\t0.04661\tstereotype\t1.5185e-05\nto\t0.04179\ttill\t1.5185e-05\nthat\t0.03577\tribbon\t2.0247e-05\nin\t0.03368\tdeposit\t2.5308e-05\nAchler splits the DTM into training, cross-validation, and test datasets and trains a logistic regression model. Applying ROC and AUC metrics, Achler evaluates model performance on both the training and the cross-validation datasets (Exhibit 3).\nExhibit 3 – AUC for Different Threshold p-values\nThreshold p-Value\tTraining Set\tCross-Validation Set\np = 0.57\t56.7%\t57.3%\np = 0.79\t91.3%\t89.7%\np = 0.84\t98.4%\t87.1%", "Iesha Azarov is a senior analyst at Ganymede Moon Partners, where he works with junior analyst Pàola Bector. Bector develops ML models for two unstructured stock sentiment datasets, Dataset ABC and Dataset XYZ. Both datasets have been cleaned and preprocessed in preparation for text exploration and model training.\nFollowing an exploratory data analysis that revealed Dataset ABC's most frequent tokens, Bector conducts a collection frequency analysis. Bector then computes TF–IDF for several words in the collection and tells Azarov the following:\nStatement 1: IDF is equal to the inverse of the document frequency measure.\nStatement 2: TF at the collection level is multiplied by IDF to calculate TF–IDF.\nStatement 3: TF–IDF values vary by the number of documents in the dataset, and therefore, model performance can vary when applied to a dataset with just a few documents.\nBector notes that Dataset ABC is characterized by the absence of ground truth.\nFor Dataset XYZ, each sentence has been labeled as either positive sentiment (Class \"1\") or negative sentiment (Class \"0\"). Azarov requests that Bector apply the ML model to the test dataset for Dataset XYZ, assuming a threshold p-value of 0.65. Exhibit 2 contains a sample of results from the test dataset corpus.\nExhibit 2 – 10 Sample Results of Test Data for Dataset XYZ\nSentence #\tActual Sentiment\tTarget p-Value\n1\t1\t0.75\n2\t0\t0.45\n3\t1\t0.64\n4\t1\t0.81\n5\t0\t0.43\n6\t1\t0.78\n7\t0\t0.59\n8\t1\t0.60\n9\t0\t0.67\n10\t0\t0.54\nBector makes the following remarks regarding model training:\nRemark 1: Method selection is governed by such factors as the type of data and the size of data.\nRemark 2: In the performance evaluation stage, model fitting errors, such as bias error and variance error, are used to measure goodness of fit.", "James Quinn is the founder and CEO of GoogolMining Inc. (GMI), which applies data science and machine learning to assist lenders in predicting the credit risk of their customers. Quinn is meeting with Judy Wu, the chief lending officer at onLineLoans.com.\nWu tells Quinn that she recalls that text preparation must be carried out by removing such items as HTML tags, punctuation, numbers, and stop words and eliminating the distinction between uppercase and lowercase words by lowercasing them all.\nQuinn uses logistic regression to train the model: Defaulting loans are classified as Class 1, and non-defaulting loans are classified as Class 0. After tuning, the threshold p-value of 0.60 (for Class 1) is used to predict the outcome for each loan application in the test data. Exhibit 2 indicates the result for one of those applications.\nExhibit 2 – Result for a Selected Credit Applicant in Test Data\nActual Outcome\tp\nDefaulted (Class 1)\t0.41\nAfter running his model on the test set, Quinn produces a confusion matrix (Exhibit 3). He reminds Wu that since the number of defaults in the dataset is likely much smaller than the number of non-defaults, this needs to be considered in evaluating model performance.\nExhibit 3 – Confusion Matrix (Threshold p-Value = 0.60)\n\tActual Class 1\tActual Class 0\nPredicted Class 1\tTP = 118\tFP = 32\nPredicted Class 0\tFN = 8\tTN = 320", "Victor Klymchuk, the chief economist at ECONO Consulting (EC), is reviewing the long-term GDP growth of three countries and is interested in forecasting the long-term change in stock market value for each country.\nExhibit 1 – Select Country Factors and Historical Economic Data (2009–2019)\nCountry\tCountry Factors\tGrowth in Hours Worked (%)\tGrowth in Labor Productivity (%)\tGrowth in TFP (%)\tGrowth in GDP (%)\nCountry A\tHigh savings and investment; highly educated workforce; low tariffs on foreign imports; limited natural resources\t0.9\t2.4\t0.6\t3.3\nCountry B\tDeveloped financial markets; moderate disposable income; significant foreign direct and indirect investments; significant natural resources\t−0.3\t1.6\t0.8\t1.3\nCountry C\tPolitically unstable; limited property rights; poor public education and health; significant natural resources\t1.8\t0.8\t−0.3\t2.6\nStatement 1: \"Over short time horizons, percentage changes in GDP, the ratio of earnings to GDP, and the price-to-earnings ratio are important factors for describing the relationship between economic growth and stock prices. However, I am interested in a long-term stock market forecast.\"\nStatement 4: \"Although countries with greater access to natural resources are often wealthier, the relationship between resource abundance and economic growth is not clear. My analysis shows that the presence of a dominant natural resource (oil) in Country C is constraining growth. Interestingly, Country A has few natural resources but is experiencing a strong rate of increase in per capita GDP growth.\"\nKlymchuk knows that growth in per capita income cannot be sustained by pure capital deepening. He asks the associate economist to determine how important capital deepening is as a source of economic growth for each country, using the data in Exhibit 1.\nThe associate economist believes that developing countries, irrespective of their particular characteristics, will eventually equal developed countries in per capita output. Klymchuk responds:\nStatement 5: \"Poor countries will only converge to the income levels of the richest countries if they make appropriate institutional changes.\"", "Sagara, a resource-abundant West African country, has a developing economy with low capital per worker available. President Benjamin Banantoumou appointed Fatima N'Diarra, PhD, as Economic Development Secretary to help develop economic policies to promote growth.\nN'Diarra believes that according to the classical growth theory, gains in per capita GDP are temporary because the resulting population explosion will lower per capita GDP to subsistence real wage levels. She considers endogenous growth theory to be more realistic, believing that (1) investments, such as the new tire factory, will increase the rate of per capita output growth until the steady state rate of growth is achieved; and (2) investment in research and development will boost growth even further, thus extending the abnormal growth period before diminishing marginal returns eventually set in.", "Barbara Carlyle is a financial adviser to high-net-worth individuals. She is currently reviewing the equity portfolio of a client and is considering adding new securities to it, as the client has indicated a preference for more income-producing securities. With this in mind, Carlyle takes a closer look at Avignon Corporation (“Avignon”), a chain of Canadian boutiques that has recently registered unusually high sales, resulting in large increases in the company’s cash balance. Avignon’s current stock price is C$47.33. Exhibit 1 shows earnings and dividends for the preceding four years.\nExhibit 1: Avignon Corporation Earnings and Dividend History\n\t2013\t2014\t2015\t2016\nEPS\tC$1.38\tC$1.39\tC$1.37\tC$1.44\nDPS\tC$0.20\tC$0.22\tC$0.22\tC$0.22\nCarlyle reviews analysts’ reports. She notes the significant change in cash due to the high sales volume and wonders whether that will prompt a dividend increase. However, most analysts have stated that because the industry is cyclical, the increase in sales is believed to be temporary.\nCarlyle asks her assistant, Richard Lee, to investigate whether Avignon might use its surplus cash for a share repurchase rather than for dividends. Lee, a junior analyst, comments that share repurchases can be beneficial for several reasons:\nStatement 1: The distribution of cash among shareholders is equivalent to what would have otherwise been distributed to them as dividends.\nStatement 2: Share repurchases provide greater flexibility to management than the payment of cash dividends.\nStatement 3: When directly negotiated, share repurchases can be used to purchase stock for less than the current market price.\nLee believes that looking at other companies that have completed share repurchases could be helpful to his analysis. He looks at the history of SpeedyPro Inc. (“SpeedyPro”), a US-based industrial services company whose business depends heavily on the petroleum exploration and production sector. SpeedyPro made its first share repurchase in early 2017 using surplus cash. SpeedyPro’s selected financial information just prior to the repurchase is shown in Exhibit 2.\nExhibit 2: SpeedyPro, Inc. Selected Financial Information as of Year-End 2016\nNet income\t$124 million\nEPS\t$1.24\nShares outstanding\t100 million\nCash available for repurchase\t$836 million\nShare price at the time of repurchase\t$38.00\nPremium over current share price for repurchase\t10.0%\nLee returns to Carlyle to continue the discussion. Carlyle explains to Lee that a complete analysis of the impact of a share repurchase should also include an evaluation of the effects on leverage. She points out that Avignon’s most recent bond issue includes a covenant that limits the company’s debt-to-equity ratio to 35%. She asks Lee to prepare an analysis for Avignon, using the information in Exhibit 3, to see if the debt covenant will be violated if the company repurchases shares.\nExhibit 3: Avignon Corporation Selected Financial Information as of Year-End 2016\nBook value of equity\tC$3,600 million\nShares outstanding\t200 million\nCash available for repurchase\tC$155 million\nDebt-to-equity ratio\t30.0%\nAfter-tax cost of debt\t5.0%", "BetterCare Hospitals, Inc. operates a chain of hospitals throughout the United States. The company has been expanding by acquiring local hospitals. Its largest acquisition, that of Statewide Medical, was made in 2001 under the pooling of interests method. BetterCare complies with US GAAP.\n\nBetterCare is currently forming a 50/50 joint venture with Supreme Healthcare under which the companies will share control of several hospitals. BetterCare plans to use the equity method to account for the joint venture. Supreme Healthcare complies with IFRS and will use the proportionate consolidation method to account for the joint venture.\n\nErik Ohalin is an equity analyst who covers both companies. He has estimated the joint venture’s financial information for 2018 in order to prepare his estimates of each company’s earnings and financial performance. This information is presented in Exhibit 1.\n\nExhibit 1\nSelected Financial Statement Forecasts for Joint Venture ($ Millions)\nYear ending 31 December\t2018\nRevenue\t1,430\nOperating income\t128\nNet income\t62\n31 December\t2018\nTotal assets\t1,500\nShareholders’ equity\t740\nSupreme Healthcare recently announced it had formed a special purpose entity through which it plans to sell up to $100 million of its accounts receivable. Supreme Healthcare has no voting interest in the SPE, but it is expected to absorb any losses that it may incur. Ohalin wants to estimate the impact this will have on Supreme Healthcare’s consolidated financial statements.", "John Thronen is an analyst in the research department of an international securities firm. Thronen is preparing a research report on Topmaker, Inc., a publicly-traded company that complies with IFRS. Thronen reviews two of Topmaker’s recent transactions relating to investments in Blanco Co. and Rainer Co.\n\nInvestment in Blanca Co.\n\nOn 1 January 2016, Topmaker invested $11 million in Blanca Co. debt securities (with a 5.0% stated coupon rate on par value, payable each 31 December). The par value of the securities is $10 million, and the market interest rate in effect when the bonds were purchased was 4.0%. Topmaker designates the investment as held-to-maturity. On 31 December 2016, the fair value of the securities was $12 million.\n\nBlanca Co. plans to raise $40 million in capital by borrowing against its financial receivables. Blanca plans to create a special purpose entity (SPE), invest $10 million in the SPE, have the SPE borrow $40 million, and then use the total funds to purchase $50 million of receivables from Blanca. Blanca meets the definition of control and plans to consolidate the SPE. Blanca’s current balance sheet is presented in Exhibit 1.\n\nExhibit 1\nBlanca Co. Balance Sheet at 31 December 2016 ($ millions)\nCash\t20\t \tCurrent liabilities\t25\nAccounts receivable\t50\t \tNoncurrent liabilities\t30\nOther assets\t30\t \tShareholders’ equity\t45\nTotal assets\t100\t \tTotal liabilities and equity\t100\nInvestment in Rainer Co.\n\nOn 1 January 2016, Topmaker acquired a 15% equity interest with voting power in Rainer Co. for $300 million. Exhibit 2 presents selected financial information for Rainer on the acquisition date. Thronen notes that the plant and equipment are depreciated on a straight-line basis and have 10 years of remaining life. Topmaker has representation on Rainer’s board of directors and participates in the associate’s policy-making process.\n\nExhibit 2\nSelected Financial Data for Rainer Co., 1 January 2016 (Acquisition Date) ($ millions)\n \tBook Value\tFair Value\nCurrent assets\t270\t270\nPlant and equipment\t2,900\t3,160\nTotal assets\t3,170\t3,430\nLiabilities\t1,830\t1,830\nNet assets\t1,340\t1,600\nThronen notes that, for fiscal year 2016, Rainer reported total revenue of $1,740 million and net income of $360 million, and paid dividends of $220 million.\n\nThronen is concerned about possible goodwill impairment for Topmaker due to expected changes in the industry effective at the end of 2017. He calculates the impairment loss based on selected data from the projected consolidated balance sheet data presented in Exhibit 3, assuming that the cash-generating unit and reporting unit of Topmaker are the same.\n\nExhibit 3\nSelected Financial Data for Topmaker, Inc., Estimated Year Ending 31 December 2017 ($ millions)\nCarrying value of cash-generating unit/reporting unit\t15,200\nRecoverable amount of cash-generating unit/reporting unit\t14,900\nFair value of reporting unit\t14,800\nIdentifiable net assets\t14,400\nGoodwill\t520\nFinally, Topmaker announces its plan to increase its ownership interest in Rainer to 80% effective 1 January 2018 and will account for the investment in Rainer using the partial goodwill method. Thronen estimates that the fair market value of the Rainer’s shares on the expected date of exchange is $2 billion with the identifiable assets valued at $1.5 billion.", "Percy Byron, CFA, is an equity analyst with a UK-based investment firm. One firm Byron follows is NinMount PLC, a UK-based company. On 31 December 2018, NinMount paid £320 million to purchase a 50 percent stake in Boswell Company. The excess of the purchase price over the fair value of Boswell’s net assets was attributable to previously unrecorded licenses. These licenses were estimated to have an economic life of six years. The fair value of Boswell’s assets and liabilities other than licenses was equal to their recorded book values. NinMount and Boswell both use the pound sterling as their reporting currency and prepare their financial statements in accordance with IFRS.\n\nByron is concerned whether the investment should affect his “buy” rating on NinMount common stock. He knows NinMount could choose one of several accounting methods to report the results of its investment, but NinMount has not announced which method it will use. Byron forecasts that both companies’ 2019 financial results (excluding any merger accounting adjustments) will be identical to those of 2018.\n\nNinMount’s and Boswell’s condensed income statements for the year ended 31 December 2018, and condensed balance sheets at 31 December 2018, are presented in Exhibits 1 and 2, respectively.\n\nExhibit 1\nNinMount PLC and Boswell Company Income Statements for the Year Ended 31 December 2018 (£ millions)\n \tNinMount\t \tBoswell\nNet sales\t950\t \t510\nCost of goods sold\t(495)\t \t(305)\nSelling expenses\t(50)\t \t(15)\nAdministrative expenses\t(136)\t \t(49)\nDepreciation & amortization expense\t(102)\t \t(92)\nInterest expense\t(42)\t \t(32)\n   Income before taxes\t125\t \t17\nIncome tax expense\t(50)\t \t(7)\n   Net income\t75\t \t10\nExhibit 2\nNinMount PLC and Boswell Company Balance Sheets at 31 December 2018 (£ millions)\n \tNinMount\t \tBoswell\nCash\t50\t \t20\nReceivables—net\t70\t \t45\nInventory\t130\t \t75\n   Total current assets\t250\t \t140\nProperty, plant, & equipment—net\t1,570\t \t930\nInvestment in Boswell\t320\t \t—\n   Total assets\t2,140\t \t1,070\nCurrent liabilities\t110\t \t90\nLong-term debt\t600\t \t400\n   Total liabilities\t710\t \t490\nCommon stock\t850\t \t535\nRetained earnings\t580\t \t45\n   Total equity\t1,430\t \t580\n   Total liabilities and equity\t2,140\t \t1,070\nNote: Balance sheets reflect the purchase price paid by NinMount, but do not yet consider the impact of the accounting method choice.", "Javier Casado, an analyst who manages funds for high-net-worth investors, is evaluating Bardem S.A. (Bardem) as a possible addition to a large investment portfolio. Bardem, based in Madrid, Spain, is a manufacturing firm that specializes in packaging materials. The company reports using IFRS, and its reporting currency is the Euro.\n\nCasado learns that Bardem acquired a 25% stake in Ariana Shipping S.A. (Ariana) on 1 January 2020. Ariana, which is based in Greece, has bought packaging supplies from Bardem in the past based on catalog prices. Casado believes that the purchase will change the relationship between the two companies and will also affect Bardem’s financial reporting. He mentions to a coworker, Ana Domingues, that the price paid by Bardem for the Ariana shares was €80 million.\n\nDomingues tells Casado that Bardem’s purchase of Ariana’s equity will likely allow Bardem to influence Ariana’s financial and operating performance. As a result, she states, Bardem will be required to use the equity method of accounting for this investment. Casado replies that the equity method of accounting is only required under IFRS for joint ventures or when the investee holds a seat on the associate’s board of directors.\n\nBardem prepares the following table to examine the purchase more closely.\n\nExhibit 1 Book Values and Fair Values of Ariana Shipping Assets and Liabilities as of 31 December 2019 (€ millions)\n\n \tBook Value\tFair Value\nCurrent assets\t15\t15\nPlant and equipment\t230\t275\nLand\t100\t115\n \t345\t405\nLiabilities\t110\t110\nNet assets\t235\t295\nDomingues says that she is concerned that Bardem didn’t sufficiently investigate Ariana before the purchase, given economic uncertainty surrounding Greek companies. She asks Casado what will happen to Bardem’s financial statements if the value of Ariana is permanently impaired due to business losses or other demonstrable events. Casado replies that if the equity method is not required, then there will be no impact. However, if the equity method is used, he states:\n\nGoodwill must be separately tested for impairment.\nImpairment losses should be recognized on the income statement.\nImpairment losses exceeding the goodwill value are allocated pro-rata to the unit’s non-cash assets.\nDomingues informs Casado of a final piece of information relevant to his evaluation. To increase liquidity, Bardem is considering borrowing €70M against accounts receivable. As an alternative to borrowing, they could securitize the receivables by creating a special purpose entity (SPE) over which they would exercise control. To do so, they would invest €5M in the SPE. The SPE would then borrow €70M, and would buy €75M in receivables from Bardem. Domingues comments that securitization using an SPE would impact Bardem’s reported financial condition in three ways. It would:\n\nreduce the cost of borrowing.\nincrease the level of current assets.\nimprove balance sheet ratios.", "Robert Krey is a financial analyst who is evaluating the financial statements of Ernst AG, a German manufacturing company that reports under IFRS. During the current year, Ernst invested in three different companies (Astrid, Balto, and Cordeau) that are based in the eurozone. All three investments were acquired on 1 January of the current year. Krey wants to determine the effect of these investments on Ernst's current year financial statements and ratios.\n\nErnst purchased a 10% ownership interest in Astrid for €90 million. During the current year, Astrid reported €80 million in pre-tax income and paid €40 million in dividends. The fair value of Astrid shares at 31 December of the current year was €970 million. Ernst accounts for Astrid by using the fair value through profit or loss (FVPL) method.  \n\nA 25% ownership interest in Balto was purchased for €500 million. The fair values of all Balto's assets and liabilities were equal to their book values except for equipment which was undervalued by €40 million. The undervalued equipment has a remaining useful life of 5 years and wi

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ECO·Mock Wrong Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
img.exh{max-width:100%;height:auto;background:#fff}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="quizdata" type="application/json">{"questions": [{"id": "Quant:ECO-M7-Q10", "src": "ECO 오답", "module": "01-7", "tag": "단어 빈도 시각화 → word cloud", "vig": 0, "stem": "Given her objective, the visualization that Steele should create in the exploratory data analysis step is a:", "opts": {"A": "scatter plot.", "B": "word cloud.", "C": "document term matrix."}, "ans": "B", "en": "A word cloud is a common visualization for text data that shows the most informative words and their TF values; higher-frequency words are shown in larger font, and color can add dimensions such as frequency and length of words.", "ko": "텍스트 EDA에서 단어 빈도를 글자 크기로 보여주는 시각화 = word cloud. DTM은 시각화가 아니라 문서×토큰 행렬(구조화 데이터)입니다.", "trap": "DTM을 시각화로 착각.", "f": "Word cloud: 빈도 ↑ → 글자 크기 ↑", "why": {"A": "scatter plot은 두 수치 변수의 관계를 보는 구조화 데이터용 시각화입니다.", "C": "DTM은 텍스트를 구조화한 행렬이지 시각화가 아닙니다."}, "orig": "Quant · ECO Module 7 Q10", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q18", "src": "ECO 오답", "module": "01-7", "tag": "텍스트 정제·가공 완료 토큰 (stemming, n-gram)", "vig": 1, "stem": "Based on Exhibit 1, which token group has most likely undergone the text preparation and wrangling process?", "opts": {"A": "Token Group 1", "B": "Token Group 2", "C": "Token Group 3"}, "ans": "A", "en": "Token Group 1 includes n-grams (\"not_increas_market,\" \"sale_decreas\"), words converted from inflected forms into their base word (stemming: \"increas,\" \"decreas\"), and the currency symbol replaced with a \"currencysign\" token. Group 2 still has inflected forms; Group 3 has inflected forms, the \"EUR\" symbol, and the uppercase \"Sales.\"", "ko": "정제·가공 완료 신호: 소문자화, 통화기호 → 'currencysign' 같은 annotation, n-gram(부정어 유지), stemming(어간만 남김: increas). Group 1만 모두 해당합니다.", "trap": "Group 2도 n-gram은 있지만 stemming이 안 되어 있음.", "f": "Stemming: increased → increas", "why": {"B": "n-gram은 있지만 'increased', 'decreased'처럼 어간 추출(stemming)이 안 되어 있습니다.", "C": "어간 추출도 없고, 'EUR' 기호와 대문자 'Sales'도 그대로입니다."}, "orig": "Quant · ECO Module 7 Q18", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q20", "src": "ECO 오답", "module": "01-7", "tag": "TF 너무 높음·너무 낮음 → 둘 다 제거", "vig": 1, "stem": "Based on Exhibit 2, Achler should exclude from further analysis words in:", "opts": {"A": "only Group 1.", "B": "only Group 2.", "C": "both Group 1 and Group 2."}, "ans": "C", "en": "Group 1 has the highest frequency values (mostly stop words) and Group 2 has the lowest (rare terms). The most frequent tokens make it hard to choose a decision boundary (underfitting), and the least frequent tokens mislead the model into classifying texts with rare terms into a specific class (overfitting). Both are noise features and should be removed.", "ko": "고빈도 토큰(stop words) → 모든 문서에 있어 구분력 없음 → underfitting. 저빈도 토큰 → 특정 문서에만 있는 noise → overfitting. 둘 다 제거합니다.", "trap": "한쪽만 noise라고 생각하는 함정.", "f": "High TF → underfit, Low TF → overfit → 둘 다 제거", "why": {"A": "저빈도 단어(Group 2)도 감성 구분에 기여하지 않는 noise라 제거해야 합니다.", "B": "고빈도 단어(Group 1)는 대부분 stop words라 제거해야 합니다."}, "orig": "Quant · ECO Module 7 Q20", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q26", "src": "ECO 오답", "module": "01-7", "tag": "IDF·TF-IDF 정의", "vig": 2, "stem": "Which of Bector's statements regarding TF, IDF, and TF–IDF is correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "Statement 3 is correct: TF–IDF values vary by the number of documents in the dataset, so model performance can vary when applied to a dataset with just a few documents. Statement 1 is incorrect because IDF is the log of the inverse of document frequency. Statement 2 is incorrect because TF at the sentence (not collection) level is multiplied by IDF.", "ko": "IDF = log(1/DF) – 그냥 역수가 아니라 '로그'. TF-IDF = 문장(문서) 수준 TF × IDF – collection 수준 TF가 아님. 문서 수가 적으면 TF-IDF가 불안정합니다.", "trap": "'inverse'만 보고 log를 놓치기 쉬움.", "f": "IDF = ln(1/DF);  TF-IDF = TF(sentence) × IDF", "why": {"A": "IDF는 DF의 역수가 아니라 역수의 로그입니다.", "B": "TF-IDF에는 collection 수준이 아니라 문장(문서) 수준 TF를 씁니다."}, "orig": "Quant · ECO Module 7 Q26", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q31", "src": "ECO 오답", "module": "01-7", "tag": "모델 학습 3단계 (선택→평가→튜닝)", "vig": 2, "stem": "Which of Bector's remarks related to model training is correct?", "opts": {"A": "Only Remark 1", "B": "Only Remark 2", "C": "Both Remark 1 and Remark 2"}, "ans": "A", "en": "Method selection is governed by (1) supervised or unsupervised learning, (2) the type of data, and (3) the size of data. Remark 2 is incorrect because model fitting errors (bias and variance error) are used in tuning, not performance evaluation. Performance evaluation uses error analysis, ROC plots, and RMSE.", "ko": "모델 학습 순서: ① Method selection(지도/비지도, 데이터 유형, 크기) → ② Performance evaluation(오류 분석·ROC·RMSE) → ③ Tuning(bias/variance error 균형).", "trap": "bias/variance error는 '평가'가 아니라 '튜닝' 단계.", "f": "Method selection → Performance evaluation → Tuning", "why": {"B": "Remark 2는 틀렸습니다 – bias/variance error는 튜닝 단계에서 씁니다.", "C": "Remark 2가 틀렸으므로 둘 다 맞을 수 없습니다."}, "orig": "Quant · ECO Module 7 Q31", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q32", "src": "ECO 오답", "module": "01-7", "tag": "텍스트 정제 단계 vs 가공 단계", "vig": 3, "stem": "Wu's recollection about the preparation of the textual data is most accurate with respect to:", "opts": {"A": "numbers.", "B": "stop words.", "C": "lowercasing."}, "ans": "A", "en": "Punctuation, HTML tags, numbers, and white space are removed in the text preparation (cleansing) stage; numbers are replaced with an annotation such as \"/number/\". Stop words and lowercasing are part of the text wrangling (preprocessing) stage.", "ko": "텍스트 정제(cleansing): HTML 태그, 구두점, 숫자, 공백 제거. 텍스트 가공(wrangling/preprocessing): 토큰화, 소문자화, stop words 제거, stemming·lemmatization.", "trap": "stop words·소문자화를 정제 단계로 착각.", "f": "Cleansing: HTML·punctuation·numbers·white space", "why": {"B": "stop words 제거는 정제가 아니라 가공(preprocessing) 단계입니다.", "C": "소문자화는 정제가 아니라 가공(preprocessing) 단계입니다."}, "orig": "Quant · ECO Module 7 Q32", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q34", "src": "ECO 오답", "module": "01-7", "tag": "실제 1, 예측 0 → Type II error", "vig": 3, "stem": "Based on Exhibit 2, the most appropriate statement about the model's performance for the selected credit applicant is that it results in:", "opts": {"A": "a Type I error.", "B": "a Type II error.", "C": "the correct classification."}, "ans": "B", "en": "The threshold p-value for Class 1 (default) is 0.60, which has not been met (p = 0.41), so the model predicts non-default (Class 0). The loan actually defaulted, so it is a false negative (Type II error).", "ko": "p = 0.41 < 0.60 → Class 0(정상) 예측 → 실제는 부도(Class 1) → 거짓 음성(FN) = Type II error.", "trap": "Type I = FP(실제 0인데 1로 예측), Type II = FN(실제 1인데 0으로 예측).", "f": "FP = Type I,  FN = Type II", "why": {"A": "Type I(거짓 양성)은 부도가 아닌데 부도로 예측한 경우입니다.", "C": "부도를 정상으로 예측했으므로 오분류입니다."}, "orig": "Quant · ECO Module 7 Q34", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q35", "src": "ECO 오답", "module": "01-7", "tag": "클래스 불균형 → F1 score", "vig": 3, "stem": "Using Exhibit 3 and Quinn's reminder, the most appropriate measure of the accuracy of the model is:", "opts": {"A": "0.79.", "B": "0.86.", "C": "0.92."}, "ans": "B", "en": "With unequal class distributions, F1 (the harmonic mean of precision and recall) is a better measure. P = 118/(118 + 32) = 0.79; R = 118/(118 + 8) = 0.94; F1 = 2PR/(P + R) = 0.86. Accuracy (118 + 320)/478 = 0.92 is less appropriate with class imbalance.", "ko": "클래스 불균형(부도 ≪ 정상)이면 accuracy보다 F1이 적절합니다. F1 = 2PR/(P + R).", "trap": "accuracy(0.92)를 그대로 고르는 함정.", "f": "F1 = 2 × P × R / (P + R)", "why": {"A": "0.79는 정밀도(precision)입니다.", "C": "0.92는 정확도(accuracy)로, 클래스 불균형일 때는 F1보다 부적절합니다."}, "orig": "Quant · ECO Module 7 Q35", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q42", "src": "ECO 오답", "module": "01-7", "tag": "N-grams – 다단어 패턴 유지", "vig": null, "stem": "Which of the following is a feature engineering technique where multi-word patterns that are particularly discriminative can be identified and their connection kept intact?", "opts": {"A": "N-grams", "B": "Parts of speech", "C": "Name entity recognition"}, "ans": "A", "en": "N-grams is a feature engineering technique where multi-word patterns that are particularly discriminative are identified and their connection kept intact (e.g., \"stock market\" vs. \"market\"). POS tags each token with a part of speech; NER tags tokens with an object class.", "ko": "N-gram: 여러 단어를 하나의 토큰으로 묶어 순서 유지(예: expansionary_monetary_policy). POS: 품사 태그. NER: 조직·장소·날짜 등 개체 태그.", "trap": "", "f": "N-gram = multi-word token", "why": {"B": "POS는 각 토큰에 품사(명사·동사 등) 태그를 붙입니다.", "C": "NER은 토큰에 조직·장소 같은 개체 클래스 태그를 붙입니다."}, "orig": "Quant · ECO Module 7 Q42", "subject": "Quant"}, {"id": "Quant:ECO-M7-Q43", "src": "ECO 오답", "module": "01-7", "tag": "Type I error = 거짓 양성", "vig": null, "stem": "In error analysis for classification problems, a Type I error refers to the situation where:", "opts": {"A": "both the predicted condition and the actual condition are negative.", "B": "the predicted condition is negative but the actual condition is positive.", "C": "the predicted condition is positive but the actual condition is negative."}, "ans": "C", "en": "A false positive (predicted positive, actually negative) is a Type I error. A false negative is a Type II error. Both negative is a true negative.", "ko": "Type I error = FP(실제 음성인데 양성으로 예측). Type II error = FN(실제 양성인데 음성으로 예측).", "trap": "", "f": "FP = Type I,  FN = Type II", "why": {"A": "예측·실제 모두 음성이면 TN(맞힌 것)입니다.", "B": "실제 양성을 음성으로 예측하면 FN = Type II error입니다."}, "orig": "Quant · ECO Module 7 Q43", "subject": "Quant"}, {"id": "Econ:ECO-M2-Q2", "src": "ECO 오답", "module": "02-2", "tag": "Capital deepening 기여 = 노동생산성 성장 − TFP 성장", "vig": 4, "stem": "Based on Exhibit 1, capital deepening as a source of growth was most important for:", "opts": {"A": "Country A.", "B": "Country B.", "C": "Country C."}, "ans": "A", "en": "The effect of pure capital deepening is measured as the difference between the growth rates of labor productivity and total factor productivity; the larger the difference, the more important capital deepening is. Country A: 2.4% − 0.6% = 1.8%; Country B: 1.6% − 0.8% = 0.8%; Country C: 0.8% − (−0.3%) = 1.1%.", "ko": "노동생산성 성장 = TFP 기여 + capital deepening 기여이므로, capital deepening = 노동생산성 − TFP입니다. A 1.8%, B 0.8%, C 1.1%로 A가 가장 큽니다.", "trap": "GDP 성장률이나 근로시간이 아니라 '노동생산성 − TFP'를 비교. TFP가 음수면 빼면서 더해진다(C: 0.8 + 0.3).", "f": "Capital deepening = 노동생산성 성장률 − TFP 성장률", "why": {"B": "B는 1.6% − 0.8% = 0.8%로 세 나라 중 가장 작습니다.", "C": "C는 0.8% − (−0.3%) = 1.1%로 A(1.8%)보다 작습니다."}, "orig": "Econ · ECO Module 2 Q2", "subject": "Econ"}, {"id": "Econ:ECO-M2-Q37", "src": "ECO 오답", "module": "02-2", "tag": "Classical vs Endogenous – steady state·체감은 neoclassical 개념", "vig": 5, "stem": "N'Diarra's understanding of the two growth theories is most accurate with regard to:", "opts": {"A": "classical growth theory.", "B": "endogenous growth theory.", "C": "both classical growth theory and endogenous growth theory."}, "ans": "A", "en": "N'Diarra's understanding of classical growth theory is correct: growth in real GDP per person is temporary because of a population explosion. Her description of endogenous growth theory is not accurate: she references a steady state rate of growth and diminishing marginal returns, which are tenets of neoclassical growth theory.", "ko": "고전학파 설명(1인당 소득 증가 → 인구 폭발 → 생계 수준으로 회귀)은 맞습니다. 하지만 내생적 성장이론에는 steady state도, 자본의 수확 체감도 없습니다. 그녀가 말한 '성장률이 steady state에 이를 때까지 오르다가 결국 수확 체감'은 신고전학파 이론입니다.", "trap": "'steady state', '수확 체감'이 나오면 neoclassical. 내생적 성장 = 자본 수익 일정, 투자·R&D로 성장률을 영구적으로 높임.", "f": "Endogenous: 수확 체감 없음, steady state 없음, 저축·R&D ↑ → 성장률 영구 ↑", "why": {"B": "내생적 성장이론 설명에 steady state와 수확 체감을 넣었는데, 이는 신고전학파의 개념이라 틀렸습니다.", "C": "고전학파 설명은 맞지만 내생적 성장이론 설명이 틀렸으므로 둘 다 맞다고 할 수 없습니다."}, "orig": "Econ · ECO Module 2 Q37", "subject": "Econ"}, {"id": "Econ:ECO-M2-Q44", "src": "ECO 오답", "module": "02-2", "tag": "Grinold–Kroner – 경제성장이 주식수익률로 가는 주 경로 = EPS 성장", "vig": null, "stem": "Based on the Grinold–Kroner model, which of the following factors is the primary channel through which economic growth can impact equity returns?", "opts": {"A": "Dividend yield", "B": "Earnings growth per share", "C": "Expected repricing term of the market's P/E ratio"}, "ans": "B", "en": "Earnings growth per share is the primary channel through which economic growth can impact equity returns. The dividend yield has been fairly stable over time, and the repricing term mainly reflects volatility in the market's P/E ratio over market cycles; it cannot continue to grow in the long run.", "ko": "E(R) = 배당수익률 + 실질 EPS 성장 + 인플레이션 − 주식 수 변화 + P/E 변화입니다. 배당수익률은 안정적이고 P/E 변화는 경기 따라 출렁일 뿐 장기적으로 계속 커질 수 없습니다. 경제성장은 EPS 성장을 통해 수익률로 이어집니다.", "trap": "P/E는 경기 좋을 때 오르지만 그건 '변동'이지 지속적인 경로가 아니다.", "f": "E(R) = DY + ΔEPS_R + π − ΔS + ΔP/E", "why": {"A": "배당수익률은 오랜 기간 꽤 안정적이라 경제성장을 반영하는 주된 경로가 아닙니다.", "C": "P/E 재평가는 경기 순환에 따른 변동을 주로 반영하고, 장기적으로 계속 커질 수 없습니다."}, "orig": "Econ · ECO Module 2 Q44", "subject": "Econ"}, {"id": "Econ:ECO-M2-Q51", "src": "ECO 오답", "module": "02-2", "tag": "기술 진보 → 인구 증가 가정 = Classical", "vig": null, "stem": "Which of the following growth theories assumes that technological progress translates into higher population growth?", "opts": {"A": "Classical model", "B": "Neoclassical model", "C": "Endogenous growth model"}, "ans": "A", "en": "The key assumption of the classical model is that population growth accelerates when per capita income rises above the subsistence level. Technological progress and land expansion, which increase labor productivity, therefore translate into higher population growth, and per capita income eventually returns to subsistence. In the neoclassical and endogenous models, labor (population) is an input independent of technological progress.", "ko": "고전학파(맬서스)는 기술 진보로 1인당 소득이 생계 수준을 넘으면 인구가 폭발해 다시 생계 수준으로 돌아간다고 봅니다. 신고전학파와 내생적 성장 모형에서는 인구(노동)와 기술이 서로 독립된 투입 요소입니다.", "trap": "'인구 폭발', '생계 수준(subsistence)' → classical.", "f": "Classical: 기술 진보 → 1인당 소득 ↑ → 인구 ↑ → 생계 수준으로 회귀", "why": {"B": "신고전학파에서 인구 증가(L)와 기술(A)은 서로 독립된 요소입니다. Y = A·K^α·L^(1−α).", "C": "내생적 성장 모형에서도 기술 진보와 인구 증가는 별개의 요소입니다."}, "orig": "Econ · ECO Module 2 Q51", "subject": "Econ"}, {"id": "Econ:ECO-M2-Q68", "src": "ECO 오답", "module": "02-2", "tag": "성장 제약 요인 – 창업 억제 세제는 개도국에 더 흔함", "vig": null, "stem": "Which of the following statements regarding factors of economic growth is most accurate?", "opts": {"A": "Developing countries would not benefit from removing restrictions on foreign direct and indirect investment", "B": "Tax policies discouraging entrepreneurship tend to be more prevalent in developing countries compared to developed countries", "C": "Incremental spending on primary and secondary education has a significant impact on innovation and growth in developed countries"}, "ans": "B", "en": "The lack of appropriate institutions and poor legal and political environments restrain growth in developing economies. Tax and regulatory policies discouraging entrepreneurship are not absent in developed countries but tend to be more prevalent in developing countries. Developing countries would benefit from removing restrictions on foreign investment, and developed countries need post-secondary (not primary/secondary) education spending to encourage innovation.", "ko": "창업을 막는 세제·규제는 선진국에도 있지만 개발도상국에서 더 흔하고, 이것이 성장을 막는 요인입니다. 개발도상국은 해외 투자 제한을 없애면 이익이고, 선진국은 초·중등이 아니라 대학 이상 교육 투자가 혁신에 중요합니다.", "trap": "교육 효과: 선진국 → 고등교육(혁신), 개도국 → 초·중등교육(기술 적용).", "f": "성장 우호: 낮은 세금·규제, 자유무역·자본이동, 재산권, 인적자본", "why": {"A": "개발도상국은 해외 직접·간접투자 제한을 없애면 부족한 국내 저축을 해외 자본으로 메울 수 있어 이익입니다.", "C": "선진국은 기술의 최전선에 있어 혁신을 위해 대학 이상 교육에 투자해야 합니다. 초·중등교육 추가 지출의 효과는 작습니다."}, "orig": "Econ · ECO Module 2 Q68", "subject": "Econ"}, {"id": "CI:ECO-M1-Q12", "src": "ECO 오답", "module": "03-1", "tag": "Tax-exempt clientele: 배당락 가격으로 재투자", "vig": null, "stem": "Sophie Chan owns 100,000 shares of PAT Company. PAT is selling for €40 per share, so Chan’s investment is worth €4,000,000. Chan reinvests the gross amount of all dividends received to purchase additional shares. Assume that the clientele for PAT shares consists of tax-exempt investors. If PAT pays a €1.50 dividend, Chan’s new share ownership after reinvesting dividends at the ex-dividend price is most likely to be closest to:", "opts": {"A": "103,600.", "B": "103,750.", "C": "103,900."}, "ans": "C", "en": "C is correct. Because the clientele for PAT investors has the same tax rate (zero) for dividends and capital gains, the ex-dividend stock price of PAT should decline by the amount of the dividend to €40 − €1.50 = €38.50. Chan will purchase €150,000/€38.50 = 3,896 additional shares. This increases her total shares owned to 103,896. Chan’s new share ownership is closest to 103,900.", "ko": "고객층이 비과세(배당세 = 자본이득세 = 0)이므로 배당락 주가는 배당만큼 정확히 떨어집니다: €40 − €1.50 = €38.50. 받은 배당 100,000 × €1.50 = €150,000을 €38.50에 재투자 → 3,896주 추가 → 103,896 ≈ 103,900주.", "trap": "재투자 가격은 배당락(ex-dividend) 가격. 배당 전 가격 €40으로 나누면 안 된다.", "f": "Ex-div price = P − D (세율 동일 시) ; 추가 주식 = 배당 총액 / ex-div price", "why": {"A": "배당락 가격 하락을 제대로 반영하지 않은 값입니다. 정확한 계산은 €150,000 / €38.50 = 3,896주.", "B": "배당 전 가격 €40으로 나눈 값(€150,000 / €40 = 3,750주)입니다. 재투자는 배당락 가격 €38.50에 합니다."}, "orig": "CI · ECO Module 1 Q12", "subject": "CI"}, {"id": "CI:ECO-M1-Q17", "src": "ECO 오답", "module": "03-1", "tag": "Stable dividend policy", "vig": null, "stem": "Beta Corporation is a manufacturer of inflatable furniture. Which of the following scenarios best reflects a stable dividend policy for Beta?", "opts": {"A": "Maintaining a constant dividend payout ratio of 40–50%.", "B": "Maintaining the dividend at US$1.00 a share for several years given no change in Beta’s long-term prospects.", "C": "Increasing the dividend 5% a year over several years to reflect the two years in which Beta recognized mark-to-market gains on derivatives positions."}, "ans": "B", "en": "B is correct. Choice A is consistent with a constant dividend target payout ratio policy. Choice C is not correct because the earnings increases described are not sustainable long term.", "ko": "Stable dividend policy = 이익이 해마다 흔들려도 장기 이익 전망에 맞춰 주당배당금을 안정적으로 유지. 장기 전망이 그대로이니 US$1.00을 유지하는 B가 해당합니다.", "trap": "Stable = 주당배당금 안정 / Constant payout ratio = 비율 고정(배당액은 이익 따라 출렁).", "f": "", "why": {"A": "일정 배당성향(constant payout ratio) 정책의 설명입니다.", "C": "일회성 파생상품 평가이익(mark-to-market gain)은 장기적으로 지속되는 이익이 아니므로 그것에 맞춰 배당을 올리는 것은 stable policy가 아닙니다."}, "orig": "CI · ECO Module 1 Q17", "subject": "CI"}, {"id": "CI:ECO-M1-Q22", "src": "ECO 오답", "module": "03-1", "tag": "자사주매입 BVPS: 매입가 vs BVPS", "vig": null, "stem": "A company with 20 million shares outstanding decides to repurchase 2 million shares at the prevailing market price of €30 per share. At the time of the buyback, the company reports total assets of €850 million and total liabilities of €250 million. As a result of the buyback, that company’s book value per share will most likely:", "opts": {"A": "increase.", "B": "decrease.", "C": "remain the same."}, "ans": "C", "en": "C is correct. The company’s book value before the buyback is €850 million in assets − €250 million in liabilities = €600 million. Book value per share is €600 million/20 million = €30 per share. The buyback will reduce equity by 2 million shares at the prevailing market price of €30 per share. The book value of equity will be reduced to €600 million − €60 million = €540 million, and the number of shares will be reduced to 18 million; €540 million/18 million = €30 book value per share. If the prevailing market price is equal to the book value per share at the time of the buyback, book value per share is unchanged.", "ko": "BV = 850 − 250 = €600m, BVPS = 600 / 20 = €30. 매입가 €30 = BVPS €30 → 매입 후 (600 − 60) / 18 = €30으로 변하지 않음.", "trap": "BVPS 변화는 '매입가 vs 매입 전 BVPS'만 비교. 같으면 불변.", "f": "매입가 > BVPS → BVPS↓ / 매입가 < BVPS → BVPS↑ / 같으면 불변", "why": {"A": "매입가가 BVPS보다 낮을 때 BVPS가 오릅니다. 여기서는 같습니다.", "B": "매입가가 BVPS보다 높을 때 BVPS가 내려갑니다. 여기서는 같습니다."}, "orig": "CI · ECO Module 1 Q22", "subject": "CI"}, {"id": "CI:ECO-M1-Q24", "src": "ECO 오답", "module": "03-1", "tag": "자사주매입 방법: 주가 하락 시 지지 → Open market", "vig": null, "stem": "If a company’s objective is to support its stock price in the event of a market downturn, it would be advised to authorize:", "opts": {"A": "an open market share repurchase plan to be executed over the next five years.", "B": "a tender offer share repurchase at a fixed price effective in 30 days.", "C": "a Dutch auction tender offer effective in 30 days."}, "ans": "A", "en": "A is correct. Of the three methods, only an authorized open market share repurchase plan allows the company the flexibility to time share repurchases to coincide with share price declines.", "ko": "주가가 떨어질 때마다 사서 받치려면 매입 시점을 고를 수 있어야 합니다. 여러 해에 걸친 open market 매입 프로그램만 그 유연성이 있습니다.", "trap": "Open market = 가장 유연(시점 선택, 중단 가능). Tender offer류 = 빠르지만 한 번에 정해진 날.", "f": "", "why": {"B": "Fixed-price tender offer는 30일 뒤 정해진 가격으로 한 번 사는 방식이라 하락 시점에 맞춰 살 수 없습니다.", "C": "Dutch auction도 정해진 날 한 번 하는 tender offer라 시장 하락 시점에 맞출 수 없습니다."}, "orig": "CI · ECO Module 1 Q24", "subject": "CI"}, {"id": "CI:ECO-M1-Q34", "src": "ECO 오답", "module": "03-1", "tag": "자사주매입 방법: 프리미엄 → Fixed-price tender", "vig": 6, "stem": "Based on Exhibit 2, SpeedyPro most likely repurchased shares using:", "opts": {"A": "open market purchases.", "B": "a fixed-price tender offer.", "C": "a negotiated purchase agreement."}, "ans": "B", "en": "A is incorrect. Open market purchases are market based and can be timed to avoid price impact.\nB is correct. SpeedyPro offered a 10% premium over the current price. This is most consistent with a fixed-price tender offer, which normally requires a premium. Negotiated purchase agreements are almost as likely to take place at prices lower than market because they are at prices above market, particularly when shareholders are trying to meet liquidity needs. Open market purchases are market based and can be timed to avoid price impact.\nC is incorrect. Negotiated purchase agreements are almost as likely to take place at prices lower than market as they are at prices above market when shareholders are trying to meet liquidity needs.", "ko": "SpeedyPro는 현재가 대비 10% 프리미엄을 제시했습니다. 정해진 가격(보통 프리미엄 포함)으로 정해진 수량을 사는 fixed-price tender offer와 가장 잘 맞습니다.", "trap": "프리미엄 + 전체 주주 대상 → tender offer. 직접협상은 할인/할증 둘 다 가능.", "f": "", "why": {"A": "Open market 매입은 시장가로 사고 시점을 조절해 가격 충격을 피합니다. 프리미엄을 붙이지 않습니다.", "C": "직접협상 매입은 시장가보다 낮게도 높게도 이뤄질 수 있어 '10% 프리미엄'의 근거가 되지 않습니다."}, "orig": "CI · ECO Module 1 Q34", "subject": "CI"}, {"id": "CI:ECO-M1-Q48", "src": "ECO 오답", "module": "03-1", "tag": "FCFE coverage ratio로 배당 안전성 비교", "vig": null, "stem": "An analyst gathers the following financial statement data of three companies for the most recent fiscal year (amounts are in $ millions):\n\tCompany A\tCompany B\tCompany C\nNet income\t550\t725\t254\nCash flow from operations\t745\t810\t295\nCapital expenditures\t315\t432\t75\nNet borrowing\t–100\t–250\t–85\nDividends paid\t135\t40\t45\nStock repurchases\t65\t70\t50\nBased on the FCFE coverage ratio, the company with the greatest dividend safety is:", "opts": {"A": "Company A.", "B": "Company B.", "C": "Company C."}, "ans": "A", "en": "A is correct. Under the FCFE method Company A has the greatest dividend safety.\nFCFE coverage ratio = FCFE / (Dividends + Share repurchases)\nFCFE = Cash flow from operations – Capital expenditures + Net borrowing\nFCFE A = 745 – 315 – 100 = 330; B = 810 – 432 – 250 = 128; C = 295 – 75 – 85 = 135\nCoverage A = 330 / (135 + 65) = 1.65; B = 128 / (40 + 70) = 1.16; C = 135 / (45 + 50) = 1.42", "ko": "FCFE = CFO − CapEx + 순차입(음수면 차감). A: 745 − 315 − 100 = 330 → 330 / (135 + 65) = 1.65. B: 128 / 110 = 1.16. C: 135 / 95 = 1.42. 가장 높은 A가 가장 안전.", "trap": "순차입이 음수(부채 상환)면 FCFE에서 뺀다. 분모에 자사주매입 포함. (NI 기준 dividend coverage로 보면 B가 가장 높아 함정)", "f": "FCFE coverage = FCFE / (배당 + 자사주매입), FCFE = CFO − FCInv + Net borrowing", "why": {"B": "순이익/배당으로 보면 B가 가장 높지만, FCFE 기준으로는 1.16으로 가장 낮습니다(순상환 250이 큼).", "C": "C는 1.42로 A(1.65)보다 낮습니다."}, "orig": "CI · ECO Module 1 Q48", "subject": "CI"}, {"id": "CI:ECO-M1-Q51", "src": "ECO 오답", "module": "03-1", "tag": "Target payout adjustment model", "vig": null, "stem": "An analyst gathers the following information about a company with a stable dividend policy:\nPrevious year's EPS\t$2.00\nPrevious year's payout ratio\t30%\nCurrent year's expected EPS\t$2.50\nTarget payout ratio\t36%\nIf the company uses a 3-year period to adjust its dividends, the expected increase in the current year dividend per share should be:", "opts": {"A": "$0.10.", "B": "$0.20.", "C": "$0.30."}, "ans": "A", "en": "A is correct because Expected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor, where the adjustment factor is equal to 1 / Number of years to adjust dividends. In this case:\nAdjustment factor = 1/3\nExpected increase in dividends = (2.50 × 36% − 2.00 × 30%) × 1/3 = 0.10 = $0.10\nB is incorrect because it assumes that the adjustment towards the target payout ratio is done linearly over time. Since the difference between the target payout ratio and current payout ratio is 36% − 30% = 6%, the annual equal adjustment over the three-year period will be 6% / 3 = 2%. Therefore, this year's payout ratio is expected to be current payout ratio + 2%, that is 30% + 2% = 32%. Finally:\nExpected increase in dividends = (Expected earnings × This year's target payout ratio − Previous dividend) = (2.50 × 32% − 2 × 30%) = 0.20 = $0.20\nC is incorrect because this calculation overlooks the adjustment factor. In that case:\nExpected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) = (2.50 × 36% − 2 × 30%) = 0.30 = $0.30", "ko": "이전 배당 = 2.00 × 30% = 0.60. 증가액 = (2.50 × 36% − 0.60) × 1/3 = (0.90 − 0.60) / 3 = $0.10.", "trap": "조정계수 1/n을 곱한다. payout 비율을 매년 2%p씩 올리는 식으로 계산하지 않는다.", "f": "ΔD = (기대 EPS × 목표 payout − D0) × (1 / 조정 연수)", "why": {"B": "목표 배당성향까지 비율을 매년 똑같이(30% → 32%) 올린다고 본 오류입니다. 모델은 금액 차이에 1/3을 곱합니다.", "C": "조정계수(1/3)를 빼먹은 값입니다."}, "orig": "CI · ECO Module 1 Q51", "subject": "CI"}, {"id": "CI:ECO-M1-Q54", "src": "ECO 오답", "module": "03-1", "tag": "글로벌 배당정책 추세", "vig": null, "stem": "Based on global trends in corporate payout policies, which of the following has generally decreased over time?", "opts": {"A": "Dividend payout ratios", "B": "Aggregate dividend amounts paid", "C": "Percentage of companies paying dividends"}, "ans": "C", "en": "C is correct. Research on dividend behavior globally shows that aggregate dividend amounts as well as payout ratios have generally increased over time, although the fraction of dividend payers has decreased.\nA is incorrect because payout ratios have generally increased over time.\nB is incorrect because aggregate dividend amounts have generally increased over time.", "ko": "Schweser: 선진시장에서 현금배당을 하는 회사의 비율은 장기적으로 하락했고, 자사주매입을 하는 회사 비율은 상승했습니다. 총배당액과 배당성향은 대체로 증가했습니다.", "trap": "'배당하는 회사 수(비율)'↓ ≠ '배당 금액·배당성향'↓.", "f": "", "why": {"A": "배당성향은 대체로 증가했습니다.", "B": "총배당액도 대체로 증가했습니다."}, "orig": "CI · ECO Module 1 Q54", "subject": "CI"}, {"id": "CI:ECO-M1-Q57", "src": "ECO 오답", "module": "03-1", "tag": "Agency 문제(과잉투자) 완화 → 현금배당", "vig": null, "stem": "Which of the following would best constrain management's ability to overinvest by taking on negative NPV projects?", "opts": {"A": "Increase stock dividends", "B": "Increase internally financed cash dividends", "C": "Set minimum levels of EBITDA coverage of interest charges as a condition for paying dividends"}, "ans": "B", "en": "A is incorrect because to prevent potential overinvestment agency problems the company should increase cash dividends, not stock dividends. From a company’s perspective, the key difference between a stock dividend and a cash dividend is that a cash dividend affects a company’s capital structure, whereas a stock dividend has no economic impact on a company. Cash dividends reduce assets (because cash is being paid out) and shareholders’ equity (by reducing retained earnings), while stock dividends do not. Therefore, by increasing stock dividends any free cash will remain available to managers for potential overinvestment in negative NPV projects.\nB is correct because one managerial incentive of particular concern is the potential private benefit managers may obtain from investment in negative net present value (NPV) projects. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.\nC is incorrect because all else equal, both dividends and share repurchases increase the default risk of debt. Reflecting bondholders’ concern, the bond indenture (contract) often includes a covenant restricting distributions to shareholders that might impair the position of bondholders. Covenants that specify minimum levels of EBITDA and/or EBIT coverage of interest charges are frequently used. Therefore, covenants are designed to protect bondholders rather than alleviating potential overinvestment agency problems.", "ko": "경영진이 NPV < 0 프로젝트에 돈을 쓰는(empire building) 문제는 잉여현금을 현금배당으로 내보내면 줄어듭니다.", "trap": "주식배당은 현금이 안 나가 과잉투자 억제 효과 없음. 커버넌트는 채권자 보호 장치.", "f": "", "why": {"A": "주식배당은 현금이 빠져나가지 않아 경영진이 쓸 수 있는 현금이 그대로입니다.", "C": "이자보상 조건 같은 커버넌트는 주주-채권자 갈등에서 채권자를 보호하는 장치이지 과잉투자 억제 수단이 아닙니다."}, "orig": "CI · ECO Module 1 Q57", "subject": "CI"}, {"id": "CI:ECO-M1-Q64", "src": "ECO 오답", "module": "03-1", "tag": "Imputation 세제 유효세율", "vig": null, "stem": "An analyst gathers the following information about a company:\nPretax income\t$1,000,000\nCorporate tax rate\t30%\nDividend payout\t100%\nThe shareholder's marginal tax rate is 22%. Under the dividend imputation tax system, the effective tax rate on dividends is:", "opts": {"A": "22.0%.", "B": "30.0%.", "C": "45.4%."}, "ans": "A", "en": "A is correct because under the dividend imputation tax system, a corporation’s earnings are first taxed at the corporate level. When those earnings are distributed to shareholders in the form of dividends, shareholders receive a tax credit, known as a franking credit, for the taxes that the corporation paid on those distributed earnings (i.e., corporate taxes paid are imputed to the individual shareholder). A shareholder with a lower marginal tax bracket than the company’s actually receives a tax credit for the difference between the corporate rate and his own rate. This system effectively applies the shareholder tax rate to corporate pretax income by using tax credits or additional taxes to account for any differences between the corporate and shareholder tax rates.\nIn this case:\nTaxes at 30% corporate tax rate = Pretax income × 30% = 1,000,000 × 30% = 300,000\nNet income after tax = Pretax income – Taxes at 30% corporate tax rate = 1,000,000 – 300,000 = 700,000\nDividends paid = Net income after tax × Dividend payout = 700,000 × 100% = 700,000\nShareholder tax on pretax income = Pretax income × Shareholder’s marginal tax rate = 1,000,000 × 22% = 220,000\nTax credit for corporate payment = Taxes at 30% corporate tax rate = 300,000\nTax credit to the shareholder = Shareholder tax on pretax income – Tax credit for corporate payment = 220,000 – 300,000 = –80,000\nAmounts received by shareholder = Dividends + Tax credit = 700,000 + 80,000= 780,000.\nEffective tax rate on dividend = Shareholder tax on pretax income/Pretax income = 220,000/1,000,000= 22% or (Pretax income – Amounts received by shareholder)/Pretax income = (1,000,000 – 780,000)/1,000,000 = 220,000/1,000,000 = 22%.\nB is incorrect because this is the corporate tax rate (30%) and it ignores the tax credit to the shareholder considering the lower shareholder’s marginal tax rate (22%).\nC is incorrect because this considers the double taxation system where corporate pretax earnings are taxed at the corporate level and then taxed again at the shareholder level if they are distributed to taxable shareholders as dividends.\nIn this case:\nTaxes at 30% corporate tax rate = Pretax income × 30% = 1,000,000 × 30% = 300,000. Net income after tax = Pretax income – Taxes at 30% corporate tax rate = 1,000,000 – 300,000 = 700,000\nDividends paid = Net income after tax × Dividend payout = 700,000 × 100% = 700,000\nShareholder tax on dividends paid = Dividends paid × Shareholder’s marginal tax rate = 700,000 × 22% = 154,000\nAmounts received by shareholder = Dividends – Shareholder tax on dividends paid = 700,000 – 154,000 = 546,000.\nEffective tax rate on dividend = (Pretax income – Amounts received by shareholder)/Pretax income = (1,000,000 – 546,000)/1,000,000 = 454,000/1,000,000 = 45.4%.", "ko": "Imputation 제도에서는 법인세가 주주에게 세액공제로 넘어가 최종 부담은 주주의 한계세율이 됩니다 → 22%. 법인세율 30%는 계산에 쓰지 않습니다.", "trap": "Imputation이면 법인세율이 주어져도 답은 주주 세율.", "f": "Imputation: ETR = 주주 한계세율 ; Double: t_c + (1 − t_c)t_i", "why": {"B": "법인세율입니다. 주주 세율이 더 낮으면 차액을 세액공제로 돌려받습니다.", "C": "이중과세 공식 0.30 + 0.70 × 0.22 = 45.4%입니다. Imputation에서는 쓰지 않습니다."}, "orig": "CI · ECO Module 1 Q64", "subject": "CI"}, {"id": "CI:SCH-R14-01", "src": "Schweser MQ", "module": "03-2", "tag": "소유구조와 principal–agent 문제", "vig": null, "stem": "The principal–agent problem is most severe under a corporate ownership structure of:", "opts": {"A": "dispersed ownership and dispersed voting power.", "B": "concentrated ownership and concentrated voting power.", "C": "dispersed ownership and concentrated voting power."}, "ans": "A", "en": "Under the combination of dispersed ownership and dispersed voting power, the principal–agent problem is likely to arise: this is the risk that managers will use a company’s resources to pursue their own interests. The other two ownership structures mentioned are more closely associated with the principal–principal problem.", "ko": "소유도 의결권도 흩어져 있으면 약한 주주 vs 강한 경영진 → principal–agent 문제가 가장 큽니다. 나머지 두 구조는 지배주주 vs 소수주주(principal–principal) 문제와 연결됩니다.", "trap": "분산+분산만 principal–agent. 나머지 조합은 principal–principal.", "f": "", "why": {"B": "집중 소유·집중 의결권은 지배주주가 소수주주를 희생시키는 principal–principal 문제가 큽니다.", "C": "피라미드·차등의결권으로 의결권만 집중된 경우도 principal–principal 문제입니다."}, "orig": "CI · Schweser MQ 14.1 Q1", "subject": "CI"}, {"id": "CI:SCH-R14-02", "src": "Schweser MQ", "module": "03-2", "tag": "Two-tier board", "vig": null, "stem": "A corporation’s two-tier board of directors is most likely to consist of a(n):", "opts": {"A": "executive board that oversees an internal board.", "B": "external board that oversees a nonexecutive board.", "C": "supervisory board that oversees a management board."}, "ans": "C", "en": "Two-tier boards of directors consist of a supervisory board that oversees a management board. A one-tier board is a single board of directors that is composed of internal (i.e., executive) and external (i.e., nonexecutive) directors.", "ko": "Two-tier = 감독이사회(supervisory board)가 경영이사회(management board)를 감독(독일·러시아·아르헨티나 등 의무). One-tier = 사내·사외이사가 한 이사회에 함께.", "trap": "감독하는 쪽이 supervisory, 감독받는 쪽이 management.", "f": "", "why": {"A": "사내(executive)·사외 이사 구분은 one-tier 이사회 구성 설명이며, 감독 관계가 아닙니다.", "B": "external/nonexecutive는 one-tier 이사회 안의 사외이사를 뜻합니다."}, "orig": "CI · Schweser MQ 14.1 Q2", "subject": "CI"}, {"id": "CI:SCH-R14-03", "src": "Schweser MQ", "module": "03-2", "tag": "CEO duality", "vig": null, "stem": "CEO duality refers to a situation where the chief executive officer (CEO):", "opts": {"A": "is a shareholder in the company.", "B": "serves as chairperson of the board.", "C": "has been granted superior or even sole voting rights."}, "ans": "B", "en": "CEO duality refers to the situation when the chief executive officer also serves as chairperson of the board. When a board director or manager is also a shareholder of a company, they are known as insiders. Dual-class shares generally grant one or more share classes superior or even sole voting rights.", "ko": "CEO duality = CEO가 이사회 의장을 겸임 → 이사회의 감독 기능이 약해질 우려.", "trap": "주주인 경영진 = insider, 우월 의결권 = dual-class. 혼동 주의.", "f": "", "why": {"A": "경영진이 주주이면 insider라고 합니다.", "C": "우월·단독 의결권은 dual-class shares입니다."}, "orig": "CI · Schweser MQ 14.2 Q1", "subject": "CI"}, {"id": "CI:VAR-M2-02", "src": "변형", "module": "03-2", "tag": "Green bond 특징", "vig": null, "stem": "Compared with an issuer's conventional bonds, a green bond issued by the same company most likely has:", "opts": {"A": "a higher credit rating because its proceeds fund environmental projects.", "B": "the same recourse and credit rating as the issuer's other bonds.", "C": "no exposure to greenwashing risk."}, "ans": "B", "en": "Aside from the intended use of the proceeds, green bonds tend to have the same recourse and credit ratings as the issuer’s other bonds. Green bonds may command a price premium. One concern is greenwashing, where a bond’s proceeds are not actually used for the environmental purpose advertised.", "ko": "Green bond는 자금 용도만 환경 프로젝트로 정해져 있을 뿐, 상환청구권과 신용등급은 같은 발행자의 다른 채권과 같습니다. 가격 프리미엄이 붙을 수 있고, greenwashing 위험이 있습니다.", "trap": "용도가 친환경이라고 신용도가 오르지 않는다.", "f": "", "why": {"A": "신용등급은 발행자의 다른 채권과 같습니다.", "C": "자금이 실제로 환경 목적에 쓰이지 않을 greenwashing 위험이 대표적인 우려입니다."}, "orig": "CI · 변형 (오답노트 R14, Schweser LOS 14.c)", "subject": "CI"}, {"id": "CI:VAR-M2-04", "src": "변형", "module": "03-2", "tag": "Voting caps", "vig": null, "stem": "A government limits the voting rights of large shareholdings in companies in a strategic industry to discourage foreign investors from gaining control. This situation is best described as:", "opts": {"A": "concentrated ownership and dispersed voting power.", "B": "dispersed ownership and concentrated voting power.", "C": "dispersed ownership and dispersed voting power."}, "ans": "A", "en": "Concentrated ownership and dispersed voting power occurs in the presence of voting caps, where the voting rights of large share positions are restricted. Sovereign countries sometimes enact voting caps to discourage foreign investors from taking a controlling position in a company belonging to an industry that is considered important.", "ko": "큰 지분의 의결권을 제한하는 voting cap → 소유는 집중돼 있어도 의결권은 분산.", "trap": "Voting cap = 집중 소유 + 분산 의결권. 차등의결권·피라미드 = 분산 소유 + 집중 의결권.", "f": "", "why": {"B": "피라미드·차등의결권으로 적은 지분으로 의결권을 모으는 경우입니다.", "C": "주주가 많고 아무도 지배하지 않는 경우(principal–agent)입니다."}, "orig": "CI · 변형 (Schweser LOS 14.a)", "subject": "CI"}, {"id": "CI:ECO-M4-Q13", "src": "ECO 오답", "module": "03-4", "tag": "CTA: 중앙값 P/E로 적정 인수가", "vig": null, "stem": "An analyst gathers the following information in conducting comparable transaction analysis of an acquisition. For her analysis, she uses the median of valuation ratios from three recently closed comparable acquisitions.\nValuation Variable\tAcquired Company 1\tAcquired Company 2\tAcquired Company 3\nAcquisition share price\t$30\t$40\t$50\nEPS\t$2.50\t$2.20\t$3.00\nIf the target company had an EPS of $2.50 and was acquired at a price of $40 per share, the analyst should conclude that the acquirer:", "opts": {"A": "underpaid for this transaction.", "B": "paid fair value for this transaction.", "C": "overpaid for this transaction."}, "ans": "A", "en": "A is correct because the P/E ratio for the three companies is $30/$2.50 = 12 for Company 1, $40/$2.20 = 18.2 for Company 2 and $50/$3.00 = 16.7 for Company 3. The median of these three ratios is 16.7 and the estimated fair takeover value is 16.7 × $2.5 = $41.75. Compared to an acquisition price of $40, the acquirer underpaid for this transaction.\nB is incorrect because as demonstrated in the correct answer, the acquirer underpaid for this transaction.\nC is incorrect because as demonstrated in the correct answer, the acquirer underpaid for this transaction.", "ko": "거래 P/E: 30/2.50 = 12, 40/2.20 = 18.2, 50/3.00 = 16.7 → 중앙값 16.7. 적정 인수가 = 16.7 × 2.50 = $41.75 > 실제 $40 → 덜 지불(underpaid).", "trap": "중앙값은 '배수'의 중앙값(16.7). 가격 $40의 중앙값과 같다고 fair라고 보면 함정.", "f": "적정가 = 중앙값(거래가/EPS) × 타깃 EPS", "why": {"B": "인수가격 $40이 비교 거래 가격의 중앙값과 같아 보일 뿐, 배수 기준 적정가는 $41.75입니다.", "C": "적정가($41.75)보다 낮게 샀으므로 과다 지불이 아닙니다."}, "orig": "CI · ECO Module 4 Q13", "subject": "CI"}, {"id": "CI:ECO-M4-Q16", "src": "ECO 오답", "module": "03-4", "tag": "Cost restructuring: 영업비용 감축률", "vig": null, "stem": "A company has $189 million in sales and $17 million of EBIT. All else equal, if the company restructures its operations to achieve an EBIT margin of 20%, the required percentage reduction in its operating expenses is closest to:", "opts": {"A": "9.9%.", "B": "11.0%.", "C": "12.1%."}, "ans": "C", "en": "A is incorrect because the percentage reduction in operating expenses is incorrectly calculated as EBIT divided by the operating expenses, or $17 million / $172 million = 9.9%.\nB is incorrect because the percentage reduction in operating expenses is incorrectly calculated as the target EBIT margin minus the actual EBIT margin, or 20% – 9% = 11%, where the current EBIT margin is calculated as EBIT/sales, or $17 million/$189 million = 9.0%.\nC is correct because the company's current EBIT margin is $17 million/$189 million = 9.0% which implies that the company had operating expenses of Sales – EBIT = $189 million – $17 million = $172 million. To achieve an EBIT margin of 20%, EBIT needs to be $189 million × 20% = $37.8 million, and the company must decrease its operating expenses by $37.8 million – $17 million = $20.8 million. In percent, the reduction is equal to $20.8 million/$172 million = 12.1%.", "ko": "현재 영업비용 = 189 − 17 = $172m. 목표 EBIT = 189 × 20% = $37.8m → 비용을 37.8 − 17 = $20.8m 줄여야 함. 감축률 = 20.8 / 172 = 12.1%.", "trap": "'영업비용' 대비 비율을 묻는다. 마진 차이(20% − 9%)가 답이 아님.", "f": "감축률 = (목표 EBIT − 현재 EBIT) / 현재 영업비용", "why": {"A": "EBIT / 영업비용(17 / 172)입니다.", "B": "목표 마진 − 현재 마진(20% − 9%)입니다. 매출 대비 비율이지 영업비용 대비가 아닙니다."}, "orig": "CI · ECO Module 4 Q16", "subject": "CI"}, {"id": "FSA:ECO-M1-Q17", "src": "ECO 오답", "module": "04-1", "tag": "JV – Equity method (one-line consolidation)", "vig": 7, "stem": "Based on Ohalin’s estimates, the amount of joint venture revenue (in $ millions) included on BetterCare’s consolidated 2018 financial statements should be closest to:", "opts": {"A": "$0.", "B": "$715.", "C": "$1,430."}, "ans": "A", "en": "A is correct. Under the equity method, BetterCare would record its interest in the joint venture’s net profit as a single line item, but would show no line-by-line contribution to revenues or expenses.", "ko": "Equity method는 one-line consolidation입니다. JV의 매출·비용은 라인별로 들어오지 않고 지분 순이익만 한 줄로 반영 → BetterCare 연결 매출에 포함되는 JV 매출 = $0.", "trap": "$715(50%)는 proportionate consolidation일 때의 답입니다. 방법(equity vs proportionate)을 먼저 확인하세요.", "f": "", "why": {"B": "$715(= 50% × 1,430)는 proportionate consolidation 결과입니다. BetterCare는 equity method를 사용합니다.", "C": "$1,430(100%)은 acquisition method(완전 연결) 결과입니다. 공동지배 JV는 연결하지 않습니다."}, "orig": "FSA · ECO Module 1 Q17", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q26", "src": "ECO 오답", "module": "04-1", "tag": "Equity method – 기말 장부가", "vig": 8, "stem": "Using only the information from Exhibit 2, the carrying value of Topmaker’s investment in Rainer at the end of 2016 is closest to:", "opts": {"A": "$282 million.", "B": "$317 million.", "C": "$321 million."}, "ans": "B", "en": "B is correct. The carrying value of Topmaker’s investment in Rainer using the equity method is $317 million and is calculated as:\n\n \t$ Millions\nPurchase price\t$300\nPlus: Topmaker’s share of Rainer’s net income (15% x $360)\t54\nLess: Dividends received (15% x $220)\t33\nLess: Amortization of excess purchase price attributable to plant and equipment (15% x ($3,160 – $2,900))) / 10 years\t3.9\nInvestment in associate (Rainer) at the end of 2016\t$317.1", "ko": "기말 투자계정 = 취득가 + 지분 순이익 − 수령 배당 − 초과취득가 상각. P&E 초과분 39는 10년 상각 → 연 3.9 차감. 300 + 54 − 33 − 3.9 = 317.1.", "trap": "321은 초과분 상각 누락, 282는 초과분 39 전액을 한 해에 차감한 실수입니다.", "f": "Investment(t) = Cost + %×NI − %×Div − %×(FV−BV)/잔존연수", "why": {"A": "P&E 초과분 39 전체를 한 해에 차감한 값입니다. 10년 정액 상각이므로 연 3.9만 차감합니다.", "C": "초과취득가 상각(3.9)을 빼지 않은 값(300 + 54 − 33 = 321)입니다."}, "orig": "FSA · ECO Module 1 Q26", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q30", "src": "ECO 오답", "module": "04-1", "tag": "Equity vs Consolidation – LT Debt/Equity", "vig": 9, "stem": "NinMount’s long-term debt to equity ratio on 31 December 2018 most likely will be lowest if the results of the acquisition are reported using:", "opts": {"A": "the equity method.", "B": "consolidation with full goodwill.", "C": "consolidation with partial goodwill."}, "ans": "A", "en": "A is correct. Using the equity method, long-term debt to equity = £600/£1,430 = 0.42. Using the consolidation method, long-term debt to equity = long-term debt/equity = £1,000/£1,750 = 0.57. Equity includes the £320 noncontrolling interest under either consolidation. It does not matter if the full or partial goodwill method is used since there is no goodwill.", "ko": "Equity method: 자회사 부채 미포함 → 600/1,430 = 0.42. 연결: 부채 1,000(600+400), 자본 1,750(NCI 320 포함) → 0.57. 초과 지급액은 전부 licenses에 배분되어 goodwill이 없으므로 full/partial 차이도 없습니다.", "trap": "연결은 NCI 덕에 자본이 늘지만 자회사 부채 100%가 들어와 D/E는 오히려 커집니다.", "f": "", "why": {"B": "연결 시 Boswell 부채 400이 합산되어 LTD 1,000/자본 1,750 = 0.57로 더 높습니다.", "C": "Goodwill이 없어 full/partial 결과가 같고, 둘 다 equity method보다 D/E가 높습니다."}, "orig": "FSA · ECO Module 1 Q30", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q33", "src": "ECO 오답", "module": "04-1", "tag": "Equity vs Consolidation – ROE(기초자본)", "vig": 9, "stem": "Based on Byron’s forecast, NinMount’s 2019 return on beginning equity most likely will be the same under:", "opts": {"A": "either of the consolidations, but different under the equity method.", "B": "the equity method, consolidation with full goodwill, and consolidation with partial goodwill.", "C": "none of the equity method, consolidation with full goodwill, or consolidation with partial goodwill."}, "ans": "A", "en": "A is correct. Net income attributable to shareholders of the parent is the same using any of the choices. Beginning equity under the equity method is £1,430. Under either of the consolidations, beginning equity is £1,750 since it includes the £320 noncontrolling interest. Return on beginning equity is highest under the equity method.", "ko": "지배주주 귀속 NI는 세 방법 모두 동일. 분모: equity method 1,430, 연결(full/partial)은 NCI 320 포함 1,750. Goodwill이 0이라 full=partial → 두 연결은 같고 equity method만 다름(더 높음).", "trap": "'NI가 같으니 ROE도 같다'(B) — 분모에 NCI가 포함되는지 꼭 확인하세요.", "f": "", "why": {"B": "NI는 같아도 분모(기초자본)가 다릅니다. 연결은 NCI 320이 자본에 포함되어 1,750, equity method는 1,430입니다.", "C": "Goodwill이 0이므로 full과 partial의 자본(NCI)은 같습니다 → 두 연결 방법의 ROE는 동일합니다."}, "orig": "FSA · ECO Module 1 Q33", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q34", "src": "ECO 오답", "module": "04-1", "tag": "Equity vs Consolidation – Asset turnover", "vig": 9, "stem": "Based on Byron’s forecast, NinMount’s 2019 total asset turnover ratio on beginning assets under the equity method is most likely:", "opts": {"A": "lower than if the results are reported using consolidation.", "B": "the same as if the results are reported using consolidation.", "C": "higher than if the results are reported using consolidation."}, "ans": "A", "en": "A is correct. Using the equity method, Total asset turnover = Net sales/Beginning total assets = £950/£2,140 = 0.444. Total asset turnover on beginning assets using consolidation = £1,460/£2,950 = 0.495. Under consolidation, Assets = £2,140 − 320 + 1,070 + 60 = £2,950. Therefore, total asset turnover is lowest using the equity method.", "ko": "Equity method: 950/2,140 = 0.444. 연결: 매출 1,460, 자산 2,140 − 320 + 1,070 + 60 = 2,950 → 0.495. 이 문제에서는 연결 시 매출 증가 비율이 자산 증가 비율보다 커서 equity method의 회전율이 더 낮습니다.", "trap": "'연결하면 자산이 커지니 회전율은 항상 낮아진다'는 직관에 의존하지 말고 계산으로 확인하세요.", "f": "", "why": {"B": "분자(매출)와 분모(자산)가 모두 바뀌므로 같을 수 없습니다: 0.444 vs 0.495.", "C": "직관과 달리 이 사례에서는 연결 회전율(1,460/2,950 = 0.495)이 equity method(950/2,140 = 0.444)보다 높습니다."}, "orig": "FSA · ECO Module 1 Q34", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q41", "src": "ECO 오답", "module": "04-1", "tag": "Equity method 투자 손상", "vig": 10, "stem": "Which of Casado’s three statements regarding the potential impairment of the investment in Ariana is most accurate? Statement:", "opts": {"A": "1", "B": "2", "C": "3"}, "ans": "B", "en": "Correct. Both IFRS and US GAAP require that impairment losses on equity method investments be recognized in the income statement.", "ko": "Equity method 투자의 goodwill은 투자 장부가에 포함되어 있어 별도로 손상검사하지 않고 투자 전체를 검사합니다. 손상차손은 IFRS·US GAAP 모두 I/S 인식(진술 2 정답). 'goodwill 초과 손상을 비현금자산에 pro-rata 배분'은 사업결합 CGU 규칙입니다.", "trap": "사업결합(CGU) goodwill 손상 규칙을 equity method 투자에 섞는 함정.", "f": "", "why": {"A": "Incorrect. IFRS includes goodwill in the carrying value of the investment, so it is not separately tested for impairment.", "C": "Incorrect. Impairment losses exceeding goodwill are allocated pro-rata to the unit’s non-cash assets."}, "orig": "FSA · ECO Module 1 Q41", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q43", "src": "ECO 오답", "module": "04-1", "tag": "FVPL 투자수익", "vig": 11, "stem": "For the current year, Ernst reported pre-tax income from Astrid in the amount of:", "opts": {"A": "€4 million.", "B": "€8 million.", "C": "€11 million."}, "ans": "C", "en": "Correct because income earned from investments accounted for under the FVPL method includes both dividend income as well as any gains or losses (realized or unrealized) from holding the investment shares during the accounting measurement period. For the current year, Astrid received €4 million in dividend income (€40 million × 10%) plus €7 million in unrealized holding gains (€970 million year –end market value × 10% = €97 million valuation for Ernst's shares in Astrid at year-end. Then, €97 million – €90 million beginning of the year market value for Ernst's shares in Astrid = €7 million unrealized gain).", "ko": "FVPL 수익 = 배당 + 실현·미실현 평가손익. 배당 10%×40 = 4, 평가이익 97 − 90 = 7 → 11.", "trap": "4 = FVOCI(배당만 P&L), 8 = equity method(지분이익) 답입니다.", "f": "FVPL income = Dividends + ΔFair value", "why": {"A": "Incorrect because this is only the dividend income from Astrid. This would be a correct answer if Ernst accounted for Astrid by using the fair value through other comprehensive income (FVOCI) method. Under FVOCI, any unrealized gains or losses bypass the income statement and are reported as other comprehensive income.", "B": "Incorrect because €8 million would only be correct if Ernst had significant influence over Astrid and thereby used the equity method of accounting (reported pre-tax income of €80 million × 10%)."}, "orig": "FSA · ECO Module 1 Q43", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q44", "src": "ECO 오답", "module": "04-1", "tag": "Equity method – 초과취득가 상각", "vig": 11, "stem": "At the end of the current year, Ernst's investment in Balto has a recorded balance of:", "opts": {"A": "€523 million.", "B": "€525 million.", "C": "€533 million."}, "ans": "A", "en": "Correct because under the equity method of accounting the investment balance in an associate at the end of an accounting period is determined by adding to the beginning balance, the proportionate amount of reported investee income earned (which is then adjusted for any amortization of excess purchase price that is attributable to tangible and identifiable intangible assets), less the  proportionate amount of dividends received from the associate. Accordingly, for the investment in Balto, the proportionate amount of income earned is €33 million (€140 million × 25% = €35 million less the proportionate amount of additional depreciation expense from the undervalued equipment, or [€40 million ÷ 5 years] × 25% = €2 million). The dividends received for the investment in Balto were €10 million (€40 million × 25%). Therefore, the investment balance in Balto at the end of the current year is €523 million (€500 million + €33 million – €10 million).", "ko": "500 + 지분이익(25%×140 = 35) − 추가 감가상각(40/5×25% = 2) − 배당(25%×40 = 10) = 523.", "trap": "배당은 수익이 아니라 투자계정 차감입니다(533 함정). 저평가 설비의 추가 감가상각 누락 시 525.", "f": "Investment = Cost + %×NI − %×(FV−BV)/n − %×Div", "why": {"B": "Incorrect because the additional depreciation expense for the undervalued equipment was improperly omitted in calculating the investment income and the year-end investment balance in Balto (€500 million + €35 million – €10 million = €525 million).", "C": "Incorrect because the dividends received were not properly deducted from the investment account balance (€500 million + €33 million). Under the equity method of accounting, any dividends received from an associate are considered a reduction in the investment account."}, "orig": "FSA · ECO Module 1 Q44", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q46", "src": "ECO 오답", "module": "04-1", "tag": "주식 발행 인수 – 부채비율", "vig": 11, "stem": "Upon acquiring a controlling ownership interest in Cordeau on 1 January, Ernst's pre-consolidation debt-to-assets ratio:", "opts": {"A": "decreased.", "B": "remained unchanged.", "C": "increased."}, "ans": "A", "en": "Correct because total assets increased by €1,800 million for the pre-consolidation investment account balance in Cordeau (that is, the fair value of the net assets that Ernst paid for). Shareholders' equity also increased by €1,800 million because of the issuance of common shares to pay for the 75% ownership interest in Cordeau. The debt-to-assets ratio (Total debt ÷ Total assets) therefore decreased since total assets increased and total debt was unaffected.", "ko": "주식 발행으로 지급: (연결 전) 투자자산 +1,800, 자본 +1,800, 부채 불변 → 부채/자산 하락.", "trap": "현금 지급을 가정하면 '불변'이 됩니다. 지급 수단(주식 vs 현금)을 반드시 확인하세요.", "f": "", "why": {"B": "Incorrect because this response assumes that the acquisition was made with cash (a typical form of payment for an acquisition). Under this scenario, total assets are increased by the €1,800 million pre-consolidation investment balance in Cordeau, but are then simultaneously decreased by the €1,800 cash payment to acquire the interest in Cordeau. The net effect on total assets is zero and the debt-to-assets ratio would then be unchanged.", "C": "Incorrect because the debt-to-assets ratio decreased. This response might occur if it is assumed that a €1,800 million cash payment was made to acquire the 75% ownership interest in Cordeau (thus decreasing total assets), but then forgetting that total assets are simultaneously increased by €1,800 million on Ernst's balance sheet for its pre-consolidation investment balance in Cordeau."}, "orig": "FSA · ECO Module 1 Q46", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q49", "src": "ECO 오답", "module": "04-1", "tag": "IFRS 9 분류 – Amortized cost 요건", "vig": 12, "stem": "The least appropriate classification for the investment in the Alme bonds is:", "opts": {"A": "amortized cost.", "B": "fair value through profit and loss.", "C": "fair value through other comprehensive income."}, "ans": "A", "en": "Correct. Investments in a bond can be classified as amortized cost if it meets the two criteria; business model test and cash flow characteristic test. But if the asset may be sold prior to collecting all the contractual cash flows, as is Dagmar’s intent, it should be measured using one of the two fair value methods.", "ko": "Amortized cost 요건: ① business model = 계약현금흐름 수취(hold to collect) ② 현금흐름 = 원리금만(SPPI). 유동성 필요 시 매각 의도가 있으면 hold-to-collect가 아니므로 amortized cost가 가장 부적절, FVOCI·FVPL은 가능.", "trap": "'least appropriate' — 가능한 분류(FVPL, FVOCI)를 고르면 오답.", "f": "", "why": {"B": "Incorrect. Because Dagmar’s intent is to sell the asset prior to collecting all the contractual cash flows if it requires liquidity, the bond may be measured at Fair value through profit and loss.", "C": "Incorrect. Because Dagmar’s intent is to sell the asset prior to collecting all the contractual cash flows if it requires liquidity the bond it may be measured at Fair value through other comprehensive income."}, "orig": "FSA · ECO Module 1 Q49", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q53", "src": "ECO 오답", "module": "04-1", "tag": "Bargain purchase (negative goodwill)", "vig": 13, "stem": "Prior to translating the subsidiary’s financial statements, Nakiska’s allocation of the Val Blanc acquisition purchase price most likely resulted in which of the following for Nation?", "opts": {"A": "A gain of €1,500", "B": "Goodwill of €8,000", "C": "An increase in retained earnings of €9,500"}, "ans": "A", "en": "Correct. The acquisition was a bargain purchase for Nation:\nPrice paid for 100%\t€28 million\nFair value of the net assets (€ thousands)\nShare capital + Retained earnings = 20,000 + 9,500\t29,500\nNegative goodwill\t–€1,500\nNegative goodwill is recognized immediately as a gain in profit or loss.", "ko": "순자산 공정가치 = 20,000 + 9,500 = 29,500 > 지급액 28,000 → 염가매수 −1,500은 즉시 P&L 이익(gain).", "trap": "share capital만 순자산으로 보면 goodwill 8,000(오답). 피취득사의 취득 전 이익잉여금은 연결 이익잉여금으로 넘어오지 않습니다.", "f": "Goodwill = 지급액 − 식별가능 순자산 FV (음수면 즉시 gain)", "why": {"B": "Incorrect. It uses only the share capital for the net book value acquired and forgets to include retained earnings: 28 – 20 = 8 goodwill.", "C": "Incorrect. It is the retained earnings of Val Blanc at acquisition, but those retained earnings do not carry forward on the consolidated financial statements—only earnings after acquisition accrue to the parent company."}, "orig": "FSA · ECO Module 1 Q53", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q54", "src": "ECO 오답", "module": "04-1", "tag": "연결 – 내부거래 제거", "vig": 14, "stem": "The best estimate of the proportion of Anart’s sales that is reflected in Trana’s consolidated income statement is:", "opts": {"A": "0%.", "B": "80%.", "C": "100%."}, "ans": "A", "en": "Correct. Trana owns 80% of Anart. Because this is a controlling interest, Trana would consolidate Anart into the group financial statements. Even though Trana owns only 80%, consolidation requires the inclusion of 100% of the subsidiary’s assets, liabilities, revenues, and expenses (excepting intercompany sales, which are eliminated on consolidation to prevent double counting). Therefore, because Anart sells all of its production to Trana and Trana’s other subsidiaries, none of Anart’s sales would be included in the consolidated income statement.", "ko": "80% 지배 → 자산·부채·수익·비용 100% 연결하되 내부거래는 전액 제거. Anart 매출은 전부 그룹 내 판매 → 연결 손익계산서 반영 비율 0%.", "trap": "지분율(80%)이나 100% 연결만 보고 내부거래 제거를 잊는 함정.", "f": "", "why": {"B": "Incorrect. Even though Trana only owns 80%, consolidation requires 100% inclusion of the subsidiary’s assets, liabilities, revenues, and expenses. Intercompany sales (here 100%), however, must be eliminated.", "C": "Incorrect. Even though Trana only owns 80%, consolidation requires 100% inclusion of the subsidiary’s assets, liabilities, revenues, and expenses. Intercompany sales (here 100%), however, must be eliminated"}, "orig": "FSA · ECO Module 1 Q54", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q55", "src": "ECO 관련유형", "module": "04-1", "tag": "JV – IFRS·US GAAP 모두 equity method", "vig": null, "stem": "A US company reporting under US GAAP forms a joint venture with a European company reporting under IFRS. The two companies have joint control of this venture. When reporting the venture's results, it is most likely that:", "opts": {"A": "each company will present its proportionate share of each financial statement line item.", "B": "each company will present a single line item on its income statement and balance sheet.", "C": "the US company will present a single line item and the European company will present its proportionate share of each line item."}, "ans": "B", "en": "Correct because both IFRS and US GAAP require the equity method of accounting for joint ventures. Only under rare circumstances will joint ventures be allowed to use proportionate consolidation under IFRS and US GAAP. The equity method is often referred to as one-line consolidation because the investor’s proportionate ownership interest in the assets and liabilities of the investee is disclosed as a single line item (net assets) on its balance sheet, and the investor’s share of the revenues and expenses of the investee is disclosed as a single line item on its income statement.", "ko": "IFRS·US GAAP 모두 JV는 equity method(한 줄 표시). Proportionate consolidation은 극히 예외적.", "trap": "IFRS는 proportionate를 쓴다는 오래된 지식 함정.", "f": "", "why": {"A": "Incorrect because both companies will present the results as a single line item on the balance sheet and income statement.", "C": "Incorrect because both companies will present the results as a single line item on the balance sheet and income statement."}, "orig": "FSA · ECO Module 1 Q55", "subject": "FSA"}, {"id": "FSA:ECO-M1-Q56", "src": "ECO 관련유형", "module": "04-1", "tag": "IFRS 9 재분류 – 채무상품만", "vig": null, "stem": "A company reporting under IFRS initially classified its holdings of debt and equity instruments as fair value through profit and loss. The company's business model has changed, and if it bought the same securities today, it would classify them as fair value through other comprehensive income. The company is permitted to reclassify:", "opts": {"A": "debt instruments only.", "B": "equity instruments only.", "C": "both debt instruments and equity instruments."}, "ans": "A", "en": "Correct because reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations. Changes to the business model will require judgment and are expected to be very infrequent.", "ko": "사업모형 변경 시 재분류는 채무상품만 가능. 지분상품은 재분류 불가.", "trap": "", "f": "", "why": {"B": "Incorrect because under IFRS 9, the reclassification of equity instruments is not permitted because an entity’s initial classification of FVPL and FVOCI is irrevocable.", "C": "Incorrect because under IFRS 9, the reclassification of equity instruments is not permitted because an entity’s initial classification of FVPL and FVOCI is irrevocable. Reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations. Changes to the business model will require judgment and are expected to be very infrequent."}, "orig": "FSA · ECO Module 1 Q56", "subject": "FSA"}, {"id": "FSA:SCH-M1-03", "src": "Schweser MQ", "module": "04-1", "tag": "Equity method – 투자이익 vs 현금", "vig": null, "stem": "Using the same facts (Delta owns 30% of Echo; Echo NI $600,000, dividends $200,000), the investment income Delta reports on its income statement for the year is:", "opts": {"A": "$60,000.", "B": "$120,000.", "C": "$180,000."}, "ans": "C", "en": "Under the equity method, investment income = 30% × $600,000 = $180,000. The $60,000 dividend is a cash flow that reduces the investment account, not income.", "ko": "Equity method 이익 = 지분 × NI = 180,000. 배당 60,000은 현금유입(투자계정 차감)이지 이익이 아닙니다.", "trap": "60,000(배당=FVOCI식 사고), 120,000(NI−배당 혼동) 함정.", "f": "", "why": {"A": "60,000은 배당 수령액(현금)입니다. Equity method에서 배당은 이익이 아닙니다.", "B": "120,000은 지분 × (NI − 배당) — 투자계정 '순증가액'이지 이익이 아닙니다."}, "orig": "FSA · Schweser MQ 7.3 변형", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q7", "src": "ECO 오답", "module": "04-2", "tag": "할인율 하락 – Funded status", "vig": 15, "stem": "A 100 basis point decrease in investment grade corporate bond yields may affect Kensington’s plan funded status by less than the increase in the benefit obligation because:", "opts": {"A": "remeasurements from changes in assumptions are recognized in OCI, not in earnings.", "B": "a decrease in service cost will partially offset the increase.", "C": "the fair value of plan assets may simultaneously increase."}, "ans": "C", "en": "C is correct. A decrease in interest rates may result in an increase in the fair value of plan assets that offsets the increase in the benefit obligation from a lower discount rate, especially plan assets invested in longer-duration fixed-income securities.", "ko": "금리↓ → 할인율↓ → PBO↑. 동시에 plan assets 내 장기채 가격↑(duration 효과) → 자산 증가가 일부 상쇄 → funded status 악화폭 < PBO 증가폭.", "trap": "Remeasurement가 OCI로 간다는 것은 '어디에 기록되는가'일 뿐 funded status 크기와 무관합니다.", "f": "", "why": {"A": "OCI 인식은 '기록 위치'의 문제일 뿐 funded status(자산 − PBO) 크기를 바꾸지 않습니다.", "B": "할인율 하락은 보통 service cost를 증가시키며, 어쨌든 service cost는 funded status 변화 폭을 설명하지 못합니다."}, "orig": "FSA · ECO Module 2 Q7", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q8", "src": "ECO 오답", "module": "04-2", "tag": "IFRS service cost = current + past", "vig": 16, "stem": "The amount recognized by XYZ as operating expense on the income statement related to its DB plan for fiscal year 2024 is closest to:", "opts": {"A": "200.", "B": "320.", "C": "1,000."}, "ans": "B", "en": "B is correct. Service cost, comprising current and past service costs of 200 and 120, respectively, is recognized on the income statement as an operating expense.", "ko": "IFRS: service cost = current(200) + past(120) = 320, 전부 즉시 P&L 영업비용. Employer contribution 1,000은 현금 항목입니다.", "trap": "Past service cost를 빼먹는 실수 — IFRS는 즉시 비용화, US GAAP은 OCI 인식 후 상각.", "f": "IFRS P&L pension cost = Service cost(current + past) + Net interest", "why": {"A": "200은 current service cost만입니다. IFRS는 past service cost(120)도 즉시 P&L에 인식합니다.", "C": "1,000은 employer contribution(현금 납부액)으로 비용이 아닙니다."}, "orig": "FSA · ECO Module 2 Q8", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q12", "src": "ECO 오답", "module": "04-2", "tag": "RSU 공정가치 – 변동성 무관", "vig": 16, "stem": "If XYZ SA also granted RSUs to employees in fiscal 2024, the decrease in XYZ SA’s share price volatility assumption would:", "opts": {"A": "increase the grant-date fair value of the RSUs.", "B": "decrease the grant-date fair value of the RSUs.", "C": "not affect the grant-date fair value of the RSUs."}, "ans": "C", "en": "C is correct. The grant-date fair value of an RSU is the share price, which may be adjusted for expected dividends. The volatility assumption is not relevant to the valuation of RSUs.", "ko": "RSU의 부여일 공정가치 = 부여일 주가(예상배당 조정 가능). 변동성은 옵션가격모형에만 쓰이는 입력값이라 RSU 가치에 영향 없음.", "trap": "옵션 논리(변동성↓ → 가치↓)를 RSU에 그대로 적용하는 함정.", "f": "", "why": {"A": "RSU 가치는 주가 기반 — 변동성은 입력값이 아닙니다.", "B": "옵션이라면 변동성↓ → 가치↓이지만, RSU에는 해당되지 않습니다."}, "orig": "FSA · ECO Module 2 Q12", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q16", "src": "ECO 오답", "module": "04-2", "tag": "Tax windfall – IFRS vs US GAAP", "vig": 17, "stem": "If SKI reported under IFRS instead of US GAAP, its effective tax rate would likely be:", "opts": {"A": "lower.", "B": "higher.", "C": "the same."}, "ans": "B", "en": "B is correct. Excess tax benefits or tax windfalls related to share-based compensation are recognized as gains directly in equity under IFRS, not as reductions in income tax expense on the P&L under US GAAP.", "ko": "Tax windfall(정산일 주가 > 부여일 주가): US GAAP은 법인세비용 감소 → ETR↓. IFRS는 자본에 직접 반영 → ETR 영향 없음. 따라서 SKI가 IFRS를 쓰면 ETR이 더 높아집니다.", "trap": "방향을 거꾸로 기억하는 함정 — 'US GAAP = I/S, IFRS = Equity'.", "f": "", "why": {"A": "방향이 반대입니다. US GAAP의 windfall이 법인세비용을 낮추고 있었으므로 IFRS로 바꾸면 ETR이 올라갑니다.", "C": "IFRS는 windfall을 자본에 직접 반영하므로 ETR에서 그 효과가 빠져 달라집니다."}, "orig": "FSA · ECO Module 2 Q16", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q17", "src": "ECO 오답", "module": "04-2", "tag": "RSU 희석 – Treasury stock method", "vig": 17, "stem": "SKI reported basic shares outstanding of 270,400,000 and positive net income on its income statement for the year ended 31 December 20X2. Besides unvested RSUs, SKI had no other potentially dilutive securities outstanding. Assuming an average share price of SGD 71.50 for the year, diluted shares outstanding for the year ended 31 December 20X2 is closest to:", "opts": {"A": "273,284,585.", "B": "275,695,075.", "C": "279,341,928."}, "ans": "B", "en": "B is correct. Diluted shares outstanding is computed using the treasury stock method, where unvested RSUs are added to basic shares outstanding, net of assumed repurchases which is based on the average unrecognized share-based compensation expense and average prevailing market price for the shares.\n\nBasic shares outstanding:\t270,400,000\nPlus: Unvested RSUs of\t9,341,928\nMinus: Average unrecognized share-based compensation expense of (145.6 + 433.1 million)/2 = 289.350 million / average share price of 71.50 =\t4,046,853\nDiluted shares outstanding:\t275,695,075", "ko": "Diluted shares = basic + 미가득 RSU − (평균 미인식 보상비용 ÷ 평균주가). 270.4m + 9.342m − (289.35m ÷ 71.50 = 4.047m) = 275.695m.", "trap": "TSM 차감 누락(279.3m) 또는 기말 미인식 비용만 사용하는 실수.", "f": "Dilutive shares = Unvested RSUs − Avg unrecognized SBC / Avg price", "why": {"A": "기말 미인식 비용(433.1m)만 사용한 값입니다. TSM은 '평균' 미인식 비용((145.6 + 433.1)/2)을 씁니다.", "C": "TSM 재매입 차감 없이 미가득 RSU 전체를 더한 값입니다."}, "orig": "FSA · ECO Module 2 Q17", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q20", "src": "ECO 오답", "module": "04-2", "tag": "기대수익률 – PBO 무관", "vig": 18, "stem": "Compared to the 20X3 reported financial statements, if Terra Mercado had used the same expected long-term rate of return on plan assets assumption in 20X3 as it used in 20X1, its year-end 20X3 pension obligation would most likely have been:", "opts": {"A": "lower.", "B": "higher.", "C": "the same."}, "ans": "C", "en": "C is correct. The assumed long-term rate of return on plan assets is not a component used in calculating the pension obligation, so there would be no change. However, the long-term rate of return can affect the pension expense under US GAAP.", "ko": "Expected return on plan assets는 PBO 계산 입력값이 아닙니다(PBO: 할인율·임금상승률·사망률 등). US GAAP에서는 pension expense에만 영향을 줍니다.", "trap": "'수익률 가정이 바뀌면 부채도 바뀐다'는 함정.", "f": "", "why": {"A": "기대수익률은 PBO 계산에 들어가지 않습니다.", "B": "기대수익률은 PBO 계산에 들어가지 않습니다(US GAAP pension expense에만 영향)."}, "orig": "FSA · ECO Module 2 Q20", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q21", "src": "ECO 오답", "module": "04-2", "tag": "할인율 상승 효과", "vig": 18, "stem": "Compared to the reported 20X3 financial statements, if Terra Mercado had used the same discount rate it used in 20X1, it would have most likely reported lower:", "opts": {"A": "net income.", "B": "total liabilities.", "C": "cash flow from operating activities."}, "ans": "B", "en": "B is correct. A higher discount rate (5.38% instead of 4.85%) will reduce the present value of the pension obligation (liability). In most cases, a higher discount rate will decrease the interest cost component of the net periodic cost because the decrease in the obligation will more than offset the increase in the discount rate (except if the pension obligation is of short duration). Therefore, periodic pension cost would have been lower and reported net income higher. Cash flow from operating activities should not be affected by the change.", "ko": "20X1 할인율 5.38% > 20X3 4.85% → 할인율↑ → PBO↓ → 총부채↓. 대부분 interest cost도 감소 → 비용↓ → NI는 오히려 증가. CFO는 영향 없음.", "trap": "'할인율↑ → interest cost↑ → NI↓' 함정 — 부채 감소 효과가 더 큽니다(장기 duration).", "f": "", "why": {"A": "할인율이 높으면 PBO와 (대개) interest cost가 낮아져 비용↓ → NI는 '증가'합니다.", "C": "할인율은 회계 추정치일 뿐 현금 기여금과 무관 → CFO 변화 없음."}, "orig": "FSA · ECO Module 2 Q21", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q24", "src": "ECO 오답", "module": "04-2", "tag": "옵션 변동성 가정 – 비용", "vig": 18, "stem": "Compared to the reported 20X3 financial statements, if Terra Mercado had used the 20X1 volatility assumption to value its employee stock option grants, it would have most likely reported higher:", "opts": {"A": "net income.", "B": "operating expense.", "C": "accrued compensation liability."}, "ans": "B", "en": "B is correct. A higher volatility assumption increases the value of the stock option and thus the compensation expense, which, in turn, reduces net income. There is no associated liability for equity-settled stock options.", "ko": "20X1 변동성(35%) > 20X3(29%) → 옵션가치↑ → 보상비용(영업비용)↑ → NI↓. Equity-settled 옵션은 부채가 생기지 않습니다.", "trap": "Accrued compensation liability 선지 — 주식결제형은 자본(reserve) 계정입니다.", "f": "", "why": {"A": "변동성↑ → 옵션가치·비용↑ → N

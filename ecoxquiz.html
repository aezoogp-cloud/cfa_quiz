L shares is that the fund should:", "opts": {"A": "take a long position in ZTL.", "B": "not add ZTL to the portfolio.", "C": "take a short position in ZTL."}, "ans": "B", "en": "(A) Incorrect. The stock’s intrinsic value differs by less than $1 from the market price, so it should not be added to the portfolio.\n(B) Correct. The growth rate of dividends over the past five years is calculated as follows:\n(D5/D1)^(1/n) − 1 = (2.53/1.89)^(1/4) − 1 = 7.56%\nwhere\nD5 = 2015 dividend\nD1 = 2011 dividend\nn = number of years between the first and last dividends\nUsing the Gordon growth model, the intrinsic value is\nD0 × (1 + g)/(r − g) = 2.53 × 1.0756/(0.1048 − 0.0756) = $93.19\nwhere\nD0 = dividend just paid (in Most Recent Year)\ng = compound growth rate in dividends\nr = required return on the stock, given in Exhibit 1\nWith a current market price of $93.05, the stock is fairly valued according to the fund’s definition of mispricing (i.e., mispriced by less than $1). It should not be added to the portfolio as either a short or long position.\nNote that the answer is calculated without rounding intermediate steps. If rounding is used, the calculated answer may differ slightly.\n(C) Incorrect. The stock’s intrinsic value differs by less than $1 from the market price, so it should not be added to the portfolio.", "ko": "g = (2.53/1.89)^(1/4) − 1 = 7.56%. V0 = 2.53 × 1.0756/(0.1048 − 0.0756) = $93.19. 시장가 $93.05 → 차이 $0.14 < $1 → 펀드 기준상 적정가 → 편입하지 않음.", "trap": "5년 데이터의 성장 기간은 4년(n = 4). 문제의 '미스프라이싱 기준($1)'을 꼭 적용.", "f": "V0 = D0(1+g)/(r − g)", "why": {"A": "가치가 약간 높지만 차이가 $1 미만이라 펀드 기준상 미스프라이싱이 아닙니다.", "C": "공매도 근거도 없습니다(차이 $1 미만)."}, "orig": "Equity · ECO Module 2 Q59", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q13", "src": "ECO 오답", "module": "05-3", "tag": "Single-stage FCFF → equity value (target debt ratio)", "vig": 34, "stem": "Based on Exhibit 1 and Exhibit 2 and the proposed single-stage FCFF model, the intrinsic value of Company C’s equity is closest to:", "opts": {"A": "$277,907 million.", "B": "$295,876 million.", "C": "$306,595 million."}, "ans": "C", "en": "C is correct. Company C’s firm value is calculated as follows:\nThe required rate of return on equity for Company C is\nr = E(Ri) = RF + βi[E(RM) – RF] = 3% + 1.1(7%) = 10.7%.\nWACC = [MV(Debt)/(MV(Debt) + MV(Equity))] × rd(1 − Tax rate) + [MV(Equity)/(MV(Debt) + MV(Equity))] × re.\nWACC = 0.40(6%)(1 – 0.30) + 0.60(10.7%) = 1.68% + 6.42% = 8.10%.\nFCFF for the most recent year for Company C is calculated as follows:\nNet income\t$15,409.00\nPlus: Net noncash charges\t3,746.00\nLess: Investment in working capital\t992.00\nLess: Investment in fixed capital\t3,463.00\nPlus: Interest expense × (1 – Tax rate)\t386.40\nFCFF (in millions)\t$15,086.40\nInvestment in working capital is found by adding the increase in accounts receivable, the increase in inventories, the decrease in accounts payable, and the increase in other current liabilities: –$536 million – $803 million – $3 million + $350 million = –$992 million.\nFCFF is expected to grow at 5.0% indefinitely. Thus,\nFirm value = FCFF1/(WACC − g) = FCFF0(1 + g)/(WACC − g) = 15,086.4(1.05)/(0.081 − 0.05) = $510,990.97 million.\nThe value of equity is the value of the firm minus the value of debt. The value of debt is found by multiplying the target debt ratio by the total firm value:\nDebt value = 0.40($510,990.97) = $204,396.39.\nTherefore, equity value = $510,990.97 – $204,396.39 = $306,594.58 million.", "ko": "r_e = 3% + 1.1×7% = 10.7%. WACC = 0.40×6%×(1−0.30) + 0.60×10.7% = 8.10%. FCFF0 = NI 15,409 + NCC 3,746 − WCInv 992 − FCInv 3,463 + Int(1−t) 552×0.7 = 386.4 → 15,086.4. Firm = 15,086.4×1.05/(0.081 − 0.05) = 510,991. Debt = 40% × firm = 204,396 → Equity = 306,595.", "trap": "① WCInv = AR증가 + 재고증가 − AP증가 − 기타유동부채증가 ② Int × (1 − t) ③ FCFF1 = FCFF0(1+g) ④ 부채 = 목표비율 × 기업가치.", "f": "Firm = FCFF0(1+g)/(WACC − g),  Equity = Firm − Debt", "why": {"A": "정확한 절차(WACC 8.10%, FCFF0 × 1.05, 부채 = 목표부채비율 40% × 기업가치)를 따르면 306,595가 나옵니다. 277,907은 이 중 일부 단계를 잘못 적용한 값입니다.", "B": "295,876도 정확한 계산과 다릅니다. 특히 FCFF0를 (1+g)로 성장시키고, 이자는 세후로 더하고, WCInv(992)를 차감해야 합니다."}, "orig": "Equity · ECO Module 3 Q13", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q27", "src": "ECO 오답", "module": "05-3", "tag": "FCF 성장 원천 – 재고 감소의 한계", "vig": 35, "stem": "Leigh’s comment about not considering decreases in inventory to be a source of long-term growth in free cash flow for Holt is:", "opts": {"A": "inconsistent with a forecasting perspective.", "B": "mistaken because decreases in inventory are a use rather than a source of cash.", "C": "consistent with a forecasting perspective because inventory reduction has a limit, particularly for a growing firm."}, "ans": "C", "en": "C is correct. Inventory cannot be reduced below zero. Furthermore, sales growth tends to increase inventory.", "ko": "재고 감소는 0 아래로 내려갈 수 없어 한계가 있고, 성장하는 기업은 매출 증가에 따라 재고가 늘어나는 경향 → 재고 감소를 장기 FCF 성장 원천으로 보지 않는 것은 예측 관점에서 타당합니다.", "trap": "", "f": "", "why": {"A": "예측 관점과 '일치'합니다. 재고 감소는 지속 가능한 성장 원천이 아닙니다.", "B": "재고 감소는 현금의 '원천(source)'입니다(재고 증가가 사용)."}, "orig": "Equity · ECO Module 3 Q27", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q36", "src": "ECO 오답", "module": "05-3", "tag": "Sensitivity analysis – range(가치 차이)로 판단", "vig": 36, "stem": "Based on Exhibit 3, Ho’s FCFF sensitivity analysis should conclude that Colanari’s value is most sensitive to the:", "opts": {"A": "FCFF growth rate.", "B": "before-tax cost of debt.", "C": "required rate of return for equity."}, "ans": "C", "en": "C is correct. Colanari’s valuation is most sensitive to the cost of equity (re) because the range of estimated values is larger than the valuation ranges estimated from the sensitivity analysis of both the FCFF growth rate (GFCFF) and the before-tax cost of debt (rd).\nVariable\tBase Case\tLow Estimate\tHigh Estimate\tValuation with Low Estimate (€ millions)\tValuation with High Estimate (€ millions)\tRange (€ millions)\nGFCFF\t4.6%\t4.2%\t5.0%\t3,274.16\t4,021.34\t747.18\nrd\t4.9%\t3.9%\t5.9%\t3,793.29\t3,445.24\t348.05\nre\t11.0%\t10.0%\t12.0%\t4,364.18\t3,079.38\t1,284.80\nWACC = [wd × rd(1 – Tax rate)] + (we × re).\nFirm value = FCFF0(1 + g)/(WACC – g).\nCost of equity sensitivity\nUsing the base case estimates for the FCFF growth rate and the before-tax cost of debt and using the low estimate for the cost of equity (re) of 10.0%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.10) = 7.96%.\nFirm value = 140 million(1 + 0.046)/(0.0796 – 0.046) = €4,364.18 million.\nUsing the base case estimates for the FCFF growth rate and the before-tax cost of debt and using the high estimate for the cost of equity (re) of 12.0%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.120) = 9.36%.\nFirm value = 140 million(1 + 0.046)/(0.0936 – 0.046) = €3,079.38 million.\nTherefore, the range in valuation estimates from using the highest and lowest estimates of the cost of equity is €1,284.80 million.\nFCFF growth rate sensitivity\nUsing the base case estimates for the cost of equity and the before-tax cost of debt and using the low estimate for the FCFF growth rate (GFCFF) of 4.2%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.11) = 8.66%.\nFirm value = 140 million(1 + 0.042)/(0.0866 – 0.042) = €3,274.16 million.\nUsing the base case estimates for the cost of equity and the before-tax cost of debt and using the high estimate for the FCFF growth rate (GFCFF) of 5.0%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.11) = 8.66%.\nFirm value = 140 million(1 + 0.05)/(0.0866 – 0.05) = €4,021.34 million.\nTherefore, the range in valuation estimates from using the highest and lowest estimates of the FCFF growth rate is €747.18 million.\nBefore-tax cost of debt sensitivity\nUsing the base case estimates for the FCFF growth rate and the cost of equity and using the low estimate for the before-tax cost of debt (rd) of 3.9%, the valuation estimate is\nWACC = [(0.30)(0.039)(1 – 0.35)] + (0.70)(0.11) = 8.46%.\nFirm value = 140 million(1 + 0.046)/(0.0846 – 0.046) = €3,793.29 million.\nUsing the base case estimates for the FCFF growth rate and the cost of equity and using the high estimate for the before-tax cost of debt (rd) of 5.9%, the valuation estimate is\nWACC = [(0.30)(0.059)(1 – 0.35)] + (0.70)(0.11) = 8.85%.\nFirm value = 140 million(1 + 0.046)/(0.0885 – 0.046) = €3,445.24 million.\nTherefore, the range in valuation estimates from using the highest and lowest estimates of the before-tax cost of debt is €348.05 million.", "ko": "각 변수의 low/high 추정치로 계산한 '가치'의 범위를 비교: g(4.2~5.0%) → 747.18, r_d(3.9~5.9%) → 348.05, r_e(10~12%) → 1,284.80 → 자기자본비용에 가장 민감.", "trap": "입력값(%)의 폭이 아니라 '가치(Valuation)'의 range로 비교. 노트 정리와 동일.", "f": "Range = |V(low) − V(high)|", "why": {"A": "FCFF 성장률 범위(747.18)는 r_e 범위(1,284.80)보다 작습니다.", "B": "세전 부채비용 범위(348.05)가 가장 작습니다."}, "orig": "Equity · ECO Module 3 Q36", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q37", "src": "ECO 오답", "module": "05-3", "tag": "Total firm value = 영업자산 + 비영업자산", "vig": 36, "stem": "Based on Exhibit 4, Bern’s firm value under Scenario 1 is closest to:", "opts": {"A": "€100,951.3 million.", "B": "€105,349.1 million.", "C": "€105,399.1 million."}, "ans": "C", "en": "C is correct. Based on Scenario 1, where Bern receives regulatory approval for its new drugs, the growth rate in FCFF for Bern will be constant at 4.5%. Therefore, a constant-growth valuation model can be used to calculate firm value.\nBern’s weighted average cost of capital is calculated as\nWACC = [wd × rd(1 – Tax rate)] + (wp × rp) + (we × re).\nThe total market value of the firm is the sum of the debt, preferred stock, and common stock market values: 15,400 + 4,000 + 18,100 = 37,500.\nWACC = [(15,400/37,500)(0.060)(1 – 0.269] + (4,000/37,500)(0.055) + (18,100/37,500)(0.11) = 7.70%.\nValue of operating assets = FCFF0(1 + g)/(WACC – g).\nValue of operating assets = 3,226 million(1 + 0.045)/(0.0770 – 0.045) = €105,349.06 million.\nTotal value of the company = Value of operating assets + Value of non-operating assets.\nTotal value of the company = 105,349.06 million + 50 million = €105,399.06 million.", "ko": "WACC = (15,400/37,500)×6.0%×(1−0.269) + (4,000/37,500)×5.5% + (18,100/37,500)×11% = 7.70%. 영업자산 = 3,226×1.045/(0.077 − 0.045) = €105,349.1M. 비영업자산(투자목적 토지) €50M 가산 → €105,399.1M.", "trap": "'Total firm value' → FCFF로 구한 영업자산 + 비영업자산. 보통주 가치는 여기서 부채·우선주 차감.", "f": "Firm = FCFF0(1+g)/(WACC − g) + Non-operating assets", "why": {"A": "100,951.3은 정확한 WACC(7.70%)와 FCFF1 = FCFF0 × 1.045 절차를 따른 값과 다릅니다.", "B": "€105,349.1M은 영업자산 가치만입니다. 투자목적 토지(비영업자산) €50M을 더해야 기업 전체가치."}, "orig": "Equity · ECO Module 3 Q37", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q62", "src": "ECO 오답", "module": "05-3", "tag": "비현금 항목 조정 – 구조조정 환입·처분이익", "vig": 37, "stem": "To properly account for the two unusual noncash items when calculating FCFE, Horzak’s previous year’s net income should be:", "opts": {"A": "reduced by USD 7 million.", "B": "reduced by USD 3 million.", "C": "increased by USD 3 million."}, "ans": "A", "en": "(A) Correct because the USD 5 million restructuring charge reversal is a noncash item that will have boosted earnings in previous year, as it is a reversal of a previous charge that has been added back to net income. He is trying to use a normalized definition of net income to calculate FCFE, so this must be subtracted from net income to arrive at FCFE. Similarly with the USD 2 million after-tax gain on the sale of two manufacturing plants, this is a boost to net income that is a noncash item, so it also must be subtracted from net income to arrive at FCFE. So in total both items must be subtracted to arrive at FCFE, in total a reduction of USD 7 million.\n(B) Incorrect because this response mistakenly adds the USD 2 million after-tax gain on the sale of two manufacturing plants instead of subtracting it, though has correctly subtracted the USD 5 million restructuring charge reversal. This results in an incorrect response of a reduction of USD 3 million.\n(C) Incorrect because this response mistakenly adds the USD 5 million restructuring charge reversal instead of subtracting it. This results in an incorrect response of an increase of USD 3 million (when the USD 2 million after-tax gain on the sale of two manufacturing plants is subtracted from the USD 5 million restructuring charge reversal).", "ko": "비현금 '이익'은 순이익에서 차감: 구조조정 충당금 환입(비현금 이익) $5M 차감 + 자산처분이익(비현금 이익; 현금은 투자활동) $2M 차감 → 총 $7M 감소.", "trap": "비현금 손실 → 가산, 비현금 이익(환입·처분이익) → 차감.", "f": "", "why": {"B": "−$3M은 처분이익 $2M을 차감하지 않고 더한 오류입니다.", "C": "+$3M은 환입 $5M을 더하고 처분이익 $2M을 뺀 오류입니다. 둘 다 차감 대상."}, "orig": "Equity · ECO Module 3 Q62", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q63", "src": "ECO 오답", "module": "05-3", "tag": "2-stage FCFE – 시점 처리", "vig": 38, "stem": "According to the approach preferred by Bahrami and using the estimates developed by him in Exhibit 4, the value of FDF’s equity as of the previous year end is closest to:", "opts": {"A": "$8,554,891.", "B": "$8,793,104.", "C": "$12,755,292."}, "ans": "B", "en": "(A) Incorrect. The mistakes are in treating the FCFE for the current year as if it were for the previous year and the associated timing differences.\nCash flow from operations (CFO) for the current year\t1,000,000\nLess: Investment in fixed capital\t(400,000)\nPlus: Net borrowing\t250,000\nFree cash flow to equity (FCFE) )mistakenly taken for the previous year )\t850,000\nFCFEcurr yr +2 = 850,000 × 1.102 × 1.06 = 1,090,210\nTVcurr yr +1 = 1,090,210/(0.16 – 0.06) = 10,902,100\nVprev yr = (850,000 × 1.10)/1.16 + (850,000 × 1.102)/1.162 + 10,902,100/1.163\n= 806,034 + 764,343 + 6,984,514\n= 8,554,891\n(B) Correct.\nCalculation of the current year's FCFE and Value of Equity at the End of the previous year\nCash flow from operations (CFO) for current year\t$1,000,000\nLess: investment in fixed capital\t–400,000\nPlus: net borrowing\t250,000\nFree cash flow to equity (FCFEcurr yr)\t$850,000\nFCFEcurr yr +1 = FCFEcurr yr × 1.10 = 850,000 × 1.10\t935,000\nFCFEcurr yr +2 = FCFEcurr yr +1 × 1.06 = 935,000 × 1.06\t991,100\nUsing a two-stage model:\nTVcurr yr + 1 = 991,100/(0.16 – 0.06) = 9,911,000\nVprev yr = 850,000/1.16 + 935,000/1.162 + 9,911,000/1.162\n= 732,759 + 694,857 + 7,365,488 =\t8,793,104\n(C) Incorrect. The mistake is in using WACC for discount rate, instead of the required return on equity.\nCash flow from operations (CFO) for the current year end\t1,000,000\nLess: Investment in fixed capital\t(400,000)\nPlus: Net borrowing\t250,000\nFree cash flow to equity (FCFE) for the current year end\t850,000\nFCFEcurr yr +2 = 850,000 × 1.10 × 1.06 = 991,100\nTVcurr yr +1 = 991,100/(0.129 – 0.06) = 14,363,768\nVprev yr = 850,000/1.129 + (850,000 × 1.10)/1.1292 + 12,388,750/1.1292\n= 752,879 + 733,540 + 11,268,873\n= 12,755,292", "ko": "FCFE(당해) = CFO 1,000,000 − FCInv 400,000 + 차입 250,000 = 850,000. 다음해 = 935,000(10%), 그 다음 = 991,100(6%). TV(다음해 말) = 991,100/(0.16 − 0.06) = 9,911,000. V(전년도 말) = 850,000/1.16 + (935,000 + 9,911,000)/1.16² = $8,793,104.", "trap": "평가 시점(전년도 말) 기준 당해 FCFE = 1기 현금흐름. FCFE ↔ r_e, FCFF ↔ WACC.", "f": "V0 = Σ FCFE_t/(1+r)^t + TV/(1+r)^n", "why": {"A": "당해 FCFE를 전년도 값으로 취급해 한 기간씩 밀린 타이밍 오류입니다.", "C": "FCFE를 WACC로 할인한 오류입니다. FCFE는 자기자본비용(16%)으로 할인."}, "orig": "Equity · ECO Module 3 Q63", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q65", "src": "ECO 오답", "module": "05-3", "tag": "FCFF → FCFE (net borrowing 음수)", "vig": 39, "stem": "Assuming 2012 FCFF equals $500 million, McLaughlin’s FCFE ($ millions) for 2012 is closest to:", "opts": {"A": "$114.", "B": "$174.", "C": "$574."}, "ans": "B", "en": "(A) Incorrect. It ignores tax adjustment for interest expense.\nFCFE = 500 – 186 + (–200) = $114 million\n(B) Correct.\nFCFE = FCFF – Interest (1 – T) + Net borrowing\nGiven: 2012 FCFF base case estimate = $500; Interest expense = $186; Tax rate = 32%\n2012\t2011\tNet increase\nLong-term debt ($)\t2,249\t2,449\t–200\nFCFE = 500 – 186 × (1 – 0.32) + (–200) = $174 million\n(C) Incorrect. It switches the sign for net borrowing\nFCFE = 500 – 186 × (1 – 0.32) + 200 = $574 million", "ko": "FCFE = FCFF − Int(1 − t) + Net borrowing = 500 − 186×0.68 + (2,249 − 2,449 = −200) = $174M.", "trap": "부채 감소 = 음(−)의 net borrowing.", "f": "FCFE = FCFF − Int(1 − t) + Net borrowing", "why": {"A": "$114M은 이자를 세후로 조정하지 않은 값입니다(500 − 186 − 200).", "C": "$574M은 순차입의 부호를 반대로(+200) 쓴 오류입니다. 부채 상환은 FCFE를 '감소'."}, "orig": "Equity · ECO Module 3 Q65", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q66", "src": "ECO 오답", "module": "05-3", "tag": "FCFF 가치 → 주당가치 (WACC 할인)", "vig": 39, "stem": "Using Yee’s base case valuation assumptions and the FCFF valuation approach, the year-end 2012 value per share of McLaughlin common stock is closest to:", "opts": {"A": "$12.78.", "B": "$23.73.", "C": "$29.20."}, "ans": "B", "en": "(A) Incorrect. It uses cost of equity, not WACC: [600/(0.12 – 0.04) – 2249]/411 = 12.78.\n(B) Correct. In the base case, the growth rate is stable, thus using the constant-growth FCFF model the value of the firm is\nFirm value = FCFF1/(WACC − g) = 600/(0.09 − 0.04) = $12,000 million\nEquity value = Firm value – Market value of debt = 12,000 – 2,249 = $9,751 million.\nValue per share = Equity value/Number of shares\n= 9,751 million/411 million\n= 23.7251 = $23.73 per share\n(C) Incorrect. It does not deduct the market value of debt: $12 million/411 million shares = $29.20.", "ko": "Firm = FCFF1/(WACC − g) = 600/(0.09 − 0.04) = $12,000M. Equity = 12,000 − 2,249 = $9,751M. Per share = 9,751/411 = $23.73.", "trap": "FCFF ↔ WACC, 그다음 부채 차감. 2013 FCFF(600)는 이미 FCFF1.", "f": "Equity = FCFF1/(WACC − g) − Debt", "why": {"A": "$12.78은 FCFF를 자기자본비용(12%)으로 할인한 오류입니다.", "C": "$29.20은 부채를 차감하지 않은 값입니다."}, "orig": "Equity · ECO Module 3 Q66", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q69", "src": "ECO 오답", "module": "05-3", "tag": "FCF vs DDM, FCFF vs FCFE 선택", "vig": 39, "stem": "Which of Nicosia’s three statements pertaining to McLaughlin’s valuation is the most accurate? Statement:", "opts": {"A": "1", "B": "2", "C": "3"}, "ans": "A", "en": "(A) Correct. Nicosia’s first statement is correct. Analysts should use a FCFE valuation whenever dividends differ significantly from the company’s capacity to pay dividends or when a change of control is anticipated. A FCFF valuation is preferred over a FCFE valuation whenever the capital structure is unstable or ever-changing. So, Nicosia’s first statement is correct, and her second and third statements are incorrect.\n(B) Incorrect. Analysts should use free cash flow to equity valuation whenever dividends differ significantly from the company’s capacity to pay dividends. FCFF valuation is preferred over FCFE valuation whenever the capital structure is unstable or ever-changing.\n(C) Incorrect. With control comes discretion over the uses of free cash flow, as does the capacity to change dividend levels. As such, a free cash flow valuation approach is likely to be superior to a discounted dividend valuation approach.", "ko": "Statement 1 정확: 배당이 FCFE(배당 지급 능력)와 크게 다르면 FCF 접근이 DDM보다 우월합니다.", "trap": "불안정 자본구조 → FCFF / 배당 ≠ 지급능력 or 지배 관점 → FCF.", "f": "", "why": {"B": "Statement 2 오류: 자본구조가 불안정하면 FCFF가 FCFE보다 우월합니다.", "C": "Statement 3 오류: 지배권 변경 시에는 FCF 접근이 우월합니다(배당 결정권 확보)."}, "orig": "Equity · ECO Module 3 Q69", "subject": "Equity"}, {"id": "Equity:ECO-M3-Q74", "src": "ECO 오답", "module": "05-3", "tag": "FCFF 계산 – NWC 감소는 현금 원천", "vig": null, "stem": "An analyst gathers the following information (in $ millions) from a company's financial statements:\n\tYear 1\tYear 2\nNet income\t300\t330\nInterest expense\t40\t44\nNet working capital\t500\t300\nGross fixed assets\t6,000\t6,800\nDepreciation expense\t300\t400\nLong-term debt\t5,000\t5,700\nIf the corporate tax rate is 25%, what is the company's FCFF (in $ millions) in Year 2?", "opts": {"A": "–$237", "B": "$163", "C": "$174"}, "ans": "B", "en": "(A) Incorrect because it treats the decrease in net working capital as a use of cash rather than a source of cash as follows:\nFCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv. FCFF = $330 + 400 + 44 × (1 – 25%) – $800 – $200 = $330 + $400 + $33 – $800 – $200 = –$237.\n(B) Correct because FCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv. Also, the adjustment for net increases in working capital represents the net investment in current assets (such as accounts receivable) less current liabilities (such as accounts payable).\nWCInv = change in NWC = 300 – 500 = –$200.\nFCInv = change in gross fixed assets = $6,800 – $6,000 = $800.\nFCFF = $330 + 400 + 44 × (1 – 25%) – $800 – (–$200) = $330 + $400 + $33 – $800 + $200 = $163.\n(C) Incorrect because it adds back total interest expense rather than tax adjusted interest expense in the calculation as follows: FCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv\nFCFF = $330 + 400 + 44 – $800 – (–$200) = $330 + $400 + $44 – $800 + $200 = $163.", "ko": "FCInv = 6,800 − 6,000 = 800. WCInv = 300 − 500 = −200. FCFF = 330 + 400 + 44×0.75 − 800 − (−200) = $163M.", "trap": "WCInv 음수 → 차감하면 결국 더해짐. 이자는 세후.", "f": "FCFF = NI + NCC + Int(1 − t) − FCInv − WCInv", "why": {"A": "−$237M은 NWC 감소(−200)를 현금 '사용'으로 처리한 오류입니다. NWC 감소는 현금 원천 → 가산.", "C": "$174M은 세후가 아니라 세전 이자(44)를 더한 값입니다."}, "orig": "Equity · ECO Module 3 Q74", "subject": "Equity"}, {"id": "Equity:ECO-M6-Q14", "src": "ECO 오답", "module": "05-6", "tag": "EV/Sales → equity value", "vig": 40, "stem": "Which of the following is closest to the proper calculation of LPE’s equity value using the EV/Sales multiple?", "opts": {"A": "EUR 18 million", "B": "EUR 12 million", "C": "EUR 24 million"}, "ans": "B", "en": "B is correct. Applying the EV/Sales multiple of 0.60 to LPE’s base year sales of EUR 30 million results in an EV of EUR 18 million. To calculate equity value from EV, we deduct the debt of EUR 6 million to arrive at an equity value of EUR 12 million.", "ko": "EV = 0.60 × 매출 30M = 18M. Equity = 18 − 부채 6 = EUR 12M.", "trap": "EV 배수 → EV → 부채 차감해 equity.", "f": "Equity = EV − Debt", "why": {"A": "EUR 18M은 EV 자체입니다(부채 미차감).", "C": "EUR 24M은 부채를 더한 오류입니다."}, "orig": "Equity · ECO Module 6 Q14", "subject": "Equity"}, {"id": "Equity:ECO-M6-Q25", "src": "ECO 오답", "module": "05-6", "tag": "CCM (FCFE) – 자기자본가치", "vig": 37, "stem": "The estimated value (in USD millions) of Horzak’s equity under the capitalized cash flow method is closest to:", "opts": {"A": "27.0.", "B": "32.0.", "C": "33.6."}, "ans": "C", "en": "(A) Incorrect because this response incorrectly subtracts the market value of debt of USD 6.6 million from the correct answer.\nThe incorrect formula to arrive at this response is:\nV = FCFE1/(r − g) − market value of debt\nV = 4.0 × 1.05/(0.175 − 0.05) − 6.6 = 4.2/0.125 − 6.6 = 33.6 − 6.6 = USD 27 million.\n(B) Incorrect because this response omits the growth rate, g, in the numerator of the equation, as shown below:\nV = FCFE0/(r − g) = 4.0/(0.175 − 0.05) = 4.0/0.125 = USD 32.0 million.\n(C) Correct because, according to the FCFE variation of the capitalized cash flow method, the estimated value of equity equals the estimate of the normalized free cash flow to equity for the next period divided by the capitalization rate for equity. The capitalization rate is the required rate of return (i.e., cost of equity) for equity less the long-term growth rate in free cash flow to equity.\nThe formula for the value of equity, V, is:\nV = FCFE1/(r − g)\nwhere FCFE1 is the next period's FCFE, equivalent to the current period's FCFE increased by the long-term growth rate, g, and is r is the cost of equity.\nV = 4.0 × 1.05/(0.175 − 0.05) = 4.2/0.125 = USD 33.6 million.", "ko": "V(equity) = FCFE1/(r − g) = 4.0 × 1.05/(0.175 − 0.05) = 4.2/0.125 = USD 33.6M.", "trap": "FCFE 모형 결과 = 이미 equity value. 부채 차감은 FCFF 모형에서만.", "f": "V_equity = FCFE0(1 + g)/(r − g)", "why": {"A": "27.0은 FCFE로 구한 '자기자본' 가치에서 부채를 또 뺀 오류입니다.", "B": "32.0은 FCFE0를 성장시키지 않은 값입니다."}, "orig": "Equity · ECO Module 6 Q25", "subject": "Equity"}, {"id": "Equity:ECO-M6-Q26", "src": "ECO 오답", "module": "05-6", "tag": "Normalized operating income after taxes", "vig": 38, "stem": "Using the company’s data and Hester’s assessments and estimates in Exhibits 1 and 2, FDF’s normalized operating income after taxes for the previous year is closest to:", "opts": {"A": "$325,500.", "B": "$367,500.", "C": "$402,500."}, "ans": "B", "en": "(A) Incorrect. The mistake is in subtracting the interest expense as well.\nFDF’s Financial Performance for the previous year\nAs reported ($)\tNormalized ($)\nGross Revenues from crops, livestock, feed, etc.\t2,500,000\t2,500,000\nCost of goods sold: Normalized to 45% of Revenues\t–1,000,000\t–1,125,000\nGross profit\t1,500,000\t1,375,000\nSG&A (reflects $200,000 reduction in owner’s compensation and $100,000 reduction in operating expenses related to the ranch)\t–900,000\t–600,000\nEBITDA\t600,000\t775,000\nDepreciation and amortization (normalized to 10% of revenues)\t–200,000\t–250,000\nEarnings before interest and taxes\t400,000\t525,000\nInterest expense: $750,000 at 8%\t \t–60,000\nEarnings before taxes\t \t465,000\nPro forma taxes (at 30 percent)\t–120,000\t–139,500\nOperating income after taxes\t280,000\t325,500\n(B) Correct.\nFDF’s Financial Performance for the Previous Year Ended\nAs Reported ($)\tNormalized ($)\nGross revenues from crops, livestock, feed, and so on\t2,500,000\t2,500,000\nCost of goods sold (normalized to 45% of revenues)\t–1,000,000\t–1,125,000\nGross profit\t1,500,000\t1,375,000\nSG&A (reflects $200,000 reduction in owner’s compensation and $100,000 reduction in operating expenses related to the ranch)\t–900,000\t–600,000\nEBITDA\t600,000\t775,000\nDepreciation and amortization (normalized to 10% of revenues)\t–200,000\t–250,000\nEarnings before interest and taxes\t400,000\t525,000\nPro forma taxes (at 30%)\t–120,000\t–157,500\nOperating income after taxes\t280,000\t367,500\n(C) Incorrect. The mistake is in depreciation. It keeps the old depreciation as reported.\nFDF’s Financial Performance for the previous year\nAs reported ($)\tNormalized ($)\nGross Revenues from crops, livestock, feed, etc.\t2,500,000\t2,500,000\nCost of goods sold: Normalized to 45% of Revenues\t–1,000,000\t–1,125,000\nGross profit\t1,500,000\t1,375,000\nSG&A (reflects $200,000 reduction in owner’s compensation and $100,000 reduction in operating expenses related to the ranch)\t–900,000\t–600,000–\nEBITDA\t600,000\t775,000\nDepreciation and amortization (normalized to 10% of revenues)\t–200,000\t–200,000\nEarnings before interest and taxes\t400,000\t575,000\nPro forma taxes (at 30 percent)\t–120,000\t–172,500\nOperating income after taxes\t280,000\t402,500", "ko": "매출 2.5M, 매출원가 45% → 1.125M, SG&A 900k − 오너보수 초과 200k − 목장 운영비 100k = 600k, D&A 10% = 250k → EBIT 525k → 세후 525k × 0.7 = $367,500 (영업이익이므로 이자 차감 X).", "trap": "Operating income after taxes = EBIT × (1 − t). 이자 차감 X.", "f": "", "why": {"A": "$325,500은 이자비용(60k)까지 차감한 오류입니다. '영업' 이익은 이자 전.", "C": "$402,500 = 575,000 × 0.7 — D&A를 매출의 10%(250k)로 정상화하지 않고 200k를 그대로 쓴 값입니다."}, "orig": "Equity · ECO Module 6 Q26", "subject": "Equity"}, {"id": "Equity:ECO-M6-Q27", "src": "ECO 오답", "module": "05-6", "tag": "FCFF → equity (WACC, 당해 FCFF = 1기)", "vig": 38, "stem": "Using the data and assumptions in Exhibit 3 compiled by Hester, FDF’s value of equity as at the end of the previous year is closest to:", "opts": {"A": "$2,986,111.", "B": "$4,423,077.", "C": "$4,681,731."}, "ans": "B", "en": "(A) Incorrect. The mistake is in the use of cost of equity instead of WACC\nV = FCFF1/(WACC – g)\t336,250/(0.14 – 0.05) = 3,736,111\nValue of equity\t3,736,111 – 750,000\t2,986,111\n(B) Correct.\nVprev yr = FCFFcurr yr/(WACC – g)\t336.250/(0.115 – 0.05)\t$5,173,077\nLess debt\t \t(750,000)\nValue of equity (Prevous Year end)\t \t$4,423,077\n(C) Incorrect. The mistake is in multiplying FCFF1 with (1 + g)\nV = FCFF1(1 + g)/(WACC – g)\t336,250(1.05)/(0.115 – 0.05) = 5,431,731\nValue of equity\t5,431,731 – 750,000\t4,681,731", "ko": "평가 시점(전년도 말) 기준 당해 FCFF 336,250이 1기 현금흐름. V = 336,250/(0.115 − 0.05) = 5,173,077 − 부채 750,000 = $4,423,077.", "trap": "'Current year FCFF'로 '전년도 말' 가치 → 이미 FCFF1.", "f": "V = FCFF1/(WACC − g) − Debt", "why": {"A": "자기자본비용(14%)으로 FCFF를 할인한 오류입니다. FCFF는 WACC.", "C": "이미 1기 값인 FCFF에 (1+g)를 또 곱한 오류입니다."}, "orig": "Equity · ECO Module 6 Q27", "subject": "Equity"}, {"id": "Equity:ECO-M6-Q29", "src": "ECO 오답", "module": "05-6", "tag": "Build-up method → WACC", "vig": 41, "stem": "According to the method used by Metev for computing the cost of equity and data in Exhibits 1B and 3, RRBL’s WACC is closest to:", "opts": {"A": "9.2%.", "B": "10.9%.", "C": "12.0%."}, "ans": "C", "en": "(A) Incorrect. It uses the regular CAPM and adds the company-specific risk premium.\nCost of equity = Risk-free rate + Equity risk premium × (Beta) + Company-specific premium\n= 3.9 + 6 × (0.75) + 1.5 = 9.9%\n= 10.0 × (1 – 0.25) × (0.3) + 9.9 × (0.7) = 2.25 + 6.30 = 9.18%\n(B) Incorrect. It uses expanded the CAPM method instead of the build-up method.\nCost of equity (expanded CAPM) = Risk-free rate + Equity risk premium adjusted for beta + Small stock premium + Company-specific risk adjustment\n= 3.9 + 6 × (0.75) + 2.5 + 1.5 = 12.4%\n= 10.0 × (1 – 0.25) × (0.3) + 12.4 × (0.7) =2.25 + 8.68 = 10.93%\n(C) Correct. Using data from Exhibit 3, the cost of equity (build-up method) = Risk-free rate + Equity risk premium + Small stock risk premium + Industry risk premium + Company-specific risk adjustment.\nCost of equity = 3.9 + 6.0 + 2.5 + 0.0 + 1.5 = 13.9%\nWACC = Pre-tax cost of debt × (1 – T) × (Debt weight) + Cost of equity × (Equity weight)\nWACC = 10.0 × (1 – 0.25) × (0.3) + 13.9 × (0.7) = 2.25 + 9.03 = 11.98%", "ko": "Build-up: r_e = 3.9 + 6.0 + 2.5 + 0.0 + 1.5 = 13.9%. WACC = 10% × (1 − 0.25) × 0.3 + 13.9% × 0.7 = 11.98% ≈ 12.0%.", "trap": "문제에서 지정한 방법(build-up) 확인. Build-up엔 β 없음.", "f": "Build-up r_e = rf + ERP + SSP + IRP + CSRP", "why": {"A": "9.2%는 일반 CAPM(β 적용) + 회사고유 프리미엄만 쓴 값입니다.", "B": "10.9%는 expanded CAPM을 쓴 값입니다. Metev는 build-up 방법 사용."}, "orig": "Equity · ECO Module 6 Q29", "subject": "Equity"}, {"id": "Equity:ECO-M6-Q30", "src": "ECO 오답", "module": "05-6", "tag": "Capitalization rate = WACC − g", "vig": 41, "stem": "According to the revised method used by Metev, the WACC suggested by Nenkov, and the data provided in Exhibit 3, RRBL’s capitalization rate is closest to:", "opts": {"A": "6.0%.", "B": "8.5%.", "C": "11.0%."}, "ans": "A", "en": "(A) Correct. Capitalization rate = (WACC – Long-term growth rate) = 11.0% – 5.0% = 6.0%.\n(B) Incorrect. It is the equity risk premium plus small stock risk-premium = 6.0% + 2.5% = 8.5%.\n(C) Incorrect. It is the same as RRBL’s estimate of WACC, which is 11.0%.", "ko": "FCFF 기반 CCM의 자본화율 = WACC − 장기성장률 = 11% − 5% = 6%.", "trap": "노트: Capitalization rate = WACC − g (FCFE면 r − g).", "f": "Cap rate = WACC − g", "why": {"B": "8.5%는 ERP + 소형주 프리미엄입니다.", "C": "11%는 WACC 자체입니다."}, "orig": "Equity · ECO Module 6 Q30", "subject": "Equity"}, {"id": "Equity:ECO-M6-Q42", "src": "ECO 오답", "module": "05-6", "tag": "비상장사 특성 – 경영진 지배의 장점", "vig": null, "stem": "An analyst identifies the following characteristics that make a private company different from public companies:\nThe financial statements have limited disclosures\nThe senior management owns 60% of the shares\nThe shareholder agreement restricts the ability to sell shares\nWhich characteristic would most likely have a positive effect on the private company valuation?", "opts": {"A": "Limited financial statement disclosures", "B": "Senior management owning a controlling interest in the company", "C": "A shareholder agreement that restricts the shareholders' ability to sell shares"}, "ans": "B", "en": "(A) Incorrect because limited disclosure in the financial statements would be a negative factor in projecting future cash flows to value the company. Public company valuation is usually conducted based on standard issuer disclosures. Analysts typically rely on audited financial statements as a basis to project future cash flows.\n(B) Correct because when senior management has a controlling interest it reduces the principal-agent problem and gives them more direct control over strategic decisions. Both factors allow managers to take a longer-term perspective in decision-making which would be a positive factor in valuing the company. The senior management of many private firms often has a controlling ownership interest in the company. This feature of private companies greatly reduces the principal-agent problem which may arise when owners and managers are separate allows more direct control over strategic decisions than for public companies. Private company managers can take a longer-term perspective in strategic decision making without pressure from external investors seeking short-term gains on publicly traded shares.\n(C) Incorrect because a shareholder agreement with restrictions would be a negative factor. Shareholder agreements that restrict the ability to sell shares may also reduce the marketability of equity interests. The stock-specific factors just listed are generally a negative for private company valuation.", "ko": "경영진이 지배 지분을 보유 → 주인-대리인 문제 감소, 장기적 의사결정 가능 → 가치에 긍정적.", "trap": "", "f": "", "why": {"A": "공시 부족은 현금흐름 예측을 어렵게 해 부정적 요인입니다.", "C": "주식 매각 제한은 시장성을 낮춰 부정적 요인입니다."}, "orig": "Equity · ECO Module 6 Q42", "subject": "Equity"}, {"id": "FI:ECO-M1-Q13", "src": "ECO 오답", "module": "06-1", "tag": "Swap rate 정의", "vig": null, "stem": "In a typical interest rate swap contract, the swap rate is best describedas the interest rate for the:", "opts": {"A": "fixed-rate leg of the swap.", "B": "floating-rate leg of the swap.", "C": "difference between the fixed and floating legs of the swap."}, "ans": "A", "en": "A is correct. The swap rate is the interest rate for the fixed-rate leg of an interest rate swap.", "ko": "Swap rate = interest rate swap의 fixed-rate leg 금리입니다. Floating leg는 MRR(SOFR 등)이고, 두 leg의 차이를 swap rate라고 부르지 않습니다.", "trap": "swap rate(고정 leg 금리) vs swap spread(swap rate − 동일만기 국채) 용어 혼동.", "f": "Swap spread = Swap rate(fixed leg) − 동일만기 on-the-run 국채 수익률", "why": {"B": "floating leg는 MRR(시장기준금리)로 결정됩니다. swap rate는 그와 교환되는 '고정' 금리입니다.", "C": "fixed와 floating의 차이는 swap rate가 아니라 (net) 결제액 개념입니다. swap spread도 'swap rate − 국채 수익률'이지 두 leg의 차이가 아닙니다."}, "orig": "FI · ECO Module 1 Q13", "subject": "FI"}, {"id": "FI:ECO-M1-Q18", "src": "ECO 오답", "module": "06-1", "tag": "Bootstrapping – 5년 spot rate", "vig": 42, "stem": "Based on Exhibit 1, the five-year spot rate is closest to:", "opts": {"A": "4.40%.", "B": "4.45%.", "C": "4.50%."}, "ans": "B", "en": "B is correct. Forward substitution (bootstrapping) using the known one- to four-year spot rates:\n1 = 0.0437/1.025 + 0.0437/1.03^2 + 0.0437/1.035^3 + 0.0437/1.04^4 + 1.0437/(1 + z5)^5\nz5 = (1.0437/0.8394)^(1/5) − 1 = 4.453%", "ko": "5년 par rate 4.37%짜리 par bond(가격 1)의 쿠폰을 1~4년 spot으로 할인하고, 남는 가치로 z5를 풉니다. 1 = 0.0437/1.025 + 0.0437/1.03² + 0.0437/1.035³ + 0.0437/1.04⁴ + 1.0437/(1+z5)⁵ → 앞 4개 PV 합 = 0.1606, 1.0437/(1+z5)⁵ = 0.8394 → z5 = 4.453% ≈ 4.45%.", "trap": "Upward-sloping 커브에서는 spot > par (차이가 작음). par rate를 그대로 쓰거나 대충 반올림하지 말 것.", "f": "1 = Σ PMT/(1+z_t)^t + (1+PMT)/(1+z_N)^N   (par bond, 가격 = 1)", "why": {"A": "4.40%는 par rate(4.37%) 근처에서 근사한 값입니다. 상승하는 커브에서는 spot이 par보다 더 높아야 합니다(쿠폰이 낮은 spot으로 할인되므로 마지막 spot이 보상).", "C": "4.50%는 과대추정입니다. 실제 계산값은 4.453%로 4.45%에 가장 가깝습니다."}, "orig": "FI · ECO Module 1 Q18", "subject": "FI"}, {"id": "FI:ECO-M1-Q27", "src": "ECO 오답", "module": "06-1", "tag": "Riding the yield curve – swap rate을 회사채 수익률 대용", "vig": 43, "stem": "In presenting Investment 2, Smith should show an annual return closest to:", "opts": {"A": "4.31%.", "B": "5.42%.", "C": "6.53%."}, "ans": "C", "en": "C is correct. The swap spread is a common way to indicate credit spreads in a market. The four-year swap rate (fixed leg of an interest rate swap) can be used as an indication of the four-year corporate yield. Riding the yield curve by purchasing a four-year zero-coupon bond with a yield of 4.75% {i.e., 4.05% + 0.70%, [P4 = 100/(1 + 0.0475)^4 = 83.058]} and then selling it when it becomes a two-year zero-coupon bond with a yield of 3.00% {i.e., 2.70% + 0.30%, [P2 = 100/(1 + 0.0300)^2 = 94.260]} produces an annual return of 6.53%: (94.260/83.058)^0.5 – 1.0 = 0.0653.", "ko": "Swap rate = 국채 spot + swap spread를 회사채 수익률 대용으로 씁니다. 4년 zero: 4.05% + 0.70% = 4.75% → P4 = 100/1.0475⁴ = 83.058. 2년 후 2년 zero로 매도: 2.70% + 0.30% = 3.00% → P2 = 100/1.03² = 94.260. 연환산 수익률 = (94.260/83.058)^0.5 − 1 = 6.53%.", "trap": "① 매입·매도 시점 각각 '해당 만기'의 spot + swap spread 사용 ② 보유기간 2년 → 0.5승 연환산.", "f": "연환산 HPR = (P_sell / P_buy)^(1/n) − 1,  회사채 yield 대용 = 국채 spot + swap spread", "why": {"A": "swap spread를 빼먹거나 매도시점 수익률을 잘못 적용한 값입니다. 매입 4.75%, 매도 3.00%를 각각 써야 합니다.", "B": "5.42%는 2년 수익률을 단순 평균하거나 연환산을 잘못한 값입니다. 2년 보유 → (P2/P4)^(1/2) − 1로 기하 연환산해야 합니다."}, "orig": "FI · ECO Module 1 Q27", "subject": "FI"}, {"id": "FI:ECO-M1-Q32", "src": "ECO 오답", "module": "06-1", "tag": "Swap spread 계산·해석", "vig": 44, "stem": "Based on Exhibit 2, the implied credit and liquidity risks as indicated by the historical three-year swap spreads for Country B were the lowest:", "opts": {"A": "1 month ago.", "B": "6 months ago.", "C": "12 months ago."}, "ans": "B", "en": "B is correct. The historical three-year swap spread for Country B was the lowest six months ago. Swap spread is defined as the spread paid by the fixed-rate payer of an interest rate swap over the rate of the “on the run” (most recently issued) government bond security with the same maturity as the swap. The lower (higher) the swap spread, the lower (higher) the return that investors require for credit and/or liquidity risks.\nThe fixed rate of the three-year fixed-for-floating Libor swap was 0.01% six months ago, and the three-year government bond yield was –0.08% six months ago. Thus the swap spread six months ago was 0.01% – (–0.08%) = 0.09%.\nOne month ago, the fixed rate of the three-year fixed-for-floating Libor swap was 0.16%, and the three-year government bond yield was –0.10%. Thus the swap spread one month ago was 0.16% – (–0.10%) = 0.26%.\nTwelve months ago, the fixed rate of the three-year fixed-for-floating Libor swap was 0.71%, and the three-year government bond yield was –0.07%. Thus, the swap spread 12 months ago was 0.71% – (–0.07%) = 0.78%.", "ko": "Swap spread = swap(fixed) rate − 동일만기 국채 수익률. 6개월 전: 0.01 − (−0.08) = 0.09%(최저), 1개월 전: 0.16 − (−0.10) = 0.26%, 12개월 전: 0.71 − (−0.07) = 0.78%. Spread가 낮을수록 시장이 요구하는 신용·유동성 위험 보상이 낮습니다.", "trap": "국채금리가 음수일 때 부호 실수. swap rate만 보고 최저 시점을 고르면 안 됨(반드시 차이 계산).", "f": "Swap spread = Swap rate − Government yield (same maturity)", "why": {"A": "1개월 전 spread는 0.16 − (−0.10) = 0.26%. 음수 국채금리를 빼면 spread가 커진다는 점(마이너스의 마이너스)을 놓치기 쉽습니다.", "C": "12개월 전은 0.78%로 가장 높습니다 → 신용·유동성 위험이 가장 컸던 시점입니다."}, "orig": "FI · ECO Module 1 Q32", "subject": "FI"}, {"id": "FI:ECO-M1-Q36", "src": "ECO 오답", "module": "06-1", "tag": "Term structure 이론 – Liquidity preference", "vig": 44, "stem": "With respect to their discussion of yield curves, Tyo and her assistant are most likely discussing which term structure theory?", "opts": {"A": "Pure expectations theory", "B": "Local expectations theory", "C": "Liquidity preference theory"}, "ans": "C", "en": "C is correct. Liquidity preference theory suggests that liquidity premiums exist to compensate investors for the added interest rate risk that they face when lending long term and that these premiums increase with maturity. Tyo and her assistant are assuming that liquidity premiums exist.", "ko": "Tyo와 조수는 '투자자가 유동성 프리미엄을 요구한다'는 가정 하에서도 커브가 하향할 수 있는지 논의합니다. 유동성 프리미엄(만기 증가에 따라 커짐)을 전제하는 이론은 liquidity preference theory입니다. 프리미엄이 있어도 기대 spot이 크게 하락(심한 디플레 예상)하면 하향 커브 가능.", "trap": "키워드 매칭: 'liquidity premium·요구 보상' → Liquidity preference. 'risk neutral, unbiased' → Pure expectations. '단기 보유수익률 = rf' → Local expectations.", "f": "Liquidity preference: forward = E(future spot) + liquidity premium (forward는 상향 편의)", "why": {"A": "Pure(unbiased) expectations theory는 위험중립·프리미엄 없음 → forward = 기대 미래 spot. 유동성 프리미엄을 가정하지 않습니다.", "B": "Local expectations theory는 '단기 보유수익률이 모든 채권에서 무위험금리와 같다'는 이론으로, 장기에 대해서만 위험프리미엄을 허용하지만 '유동성 프리미엄이 만기에 따라 증가'를 핵심 전제로 하지 않습니다."}, "orig": "FI · ECO Module 1 Q36", "subject": "FI"}, {"id": "FI:ECO-M1-Q50", "src": "ECO 오답", "module": "06-1", "tag": "Level/Steepness/Curvature 3-factor model", "vig": 45, "stem": "Based on Exhibit 1, the results of Analysis 1 should show the yield on the 20-year bond decreasing by:", "opts": {"A": "0.3015%.", "B": "0.6030%.", "C": "0.8946%."}, "ans": "B", "en": "B is correct. Because the factors in Exhibit 1 have been standardized to have unit standard deviations, a two-standard-deviation increase in the steepness factor will lead to the yield on the 20-year bond decreasing by 0.6030%, calculated as follows:\nChange in 20-year bond yield = –0.3015% × 2 = –0.6030%", "ko": "Exhibit 1의 factor는 1 SD 증가 시 수익률 변화(표준화). Steepness 2 SD 증가 → 20년 수익률 = −0.3015% × 2 = −0.6030% (감소).", "trap": "SD 배수 곱하기 누락, 다른 factor까지 더하는 실수.", "f": "Δyield = Σ (factor loading × factor 변화(SD 단위))", "why": {"A": "0.3015%는 1 SD 효과입니다. 문제는 '2 SD' 증가이므로 2배를 곱해야 합니다.", "C": "0.8946%는 level 등 다른 factor까지 합산한 값입니다. Analysis 1은 steepness factor만 변합니다."}, "orig": "FI · ECO Module 1 Q50", "subject": "FI"}, {"id": "FI:ECO-M1-Q51", "src": "ECO 오답", "module": "06-1", "tag": "Level/Steepness/Curvature 3-factor model", "vig": 45, "stem": "Based on Exhibit 1, the results of Analysis 2 should show the yield on the five-year bond:", "opts": {"A": "decreasing by 0.8315%.", "B": "decreasing by 0.0389%.", "C": "increasing by 0.0389%."}, "ans": "C", "en": "C is correct. Because the factors in Exhibit 1 have been standardized to have unit standard deviations, a one-standard-deviation decrease in both the level factor and the curvature factor will lead to the yield on the five-year bond increasing by 0.0389%, calculated as follows:\nChange in five-year bond yield = 0.4352% – 0.3963% = 0.0389%", "ko": "5년물: level 1 SD 감소 → −(−0.4352%) = +0.4352%, curvature 1 SD 감소 → −(0.3963%) = −0.3963%. 합계 = +0.0389% (상승).", "trap": "'Factor 감소' = loading × (−1). 음수 loading의 감소 → 수익률 상승.", "f": "Δy(5y) = (−1)(−0.4352%) + (−1)(0.3963%) = +0.0389%", "why": {"A": "0.8315% 감소는 부호를 반대로 적용하고 두 효과를 더한 값입니다(−0.4352 − 0.3963). factor '감소'면 loading의 부호를 뒤집어야 합니다.", "B": "크기는 맞지만 방향이 틀렸습니다. level loading이 음수(−0.4352%)라 level 감소는 수익률을 '올립니다'."}, "orig": "FI · ECO Module 1 Q51", "subject": "FI"}, {"id": "FI:ECO-M1-Q58", "src": "ECO 오답", "module": "06-1", "tag": "Spot/forward/DF → 채권 가치, YTM 비교(rich/cheap)", "vig": 46, "stem": "Based on the data in Exhibit 1 and the yield to maturity quoted by the dealer referenced in Module 2, what action should an analyst most likely take with regard to the Treasury bond?", "opts": {"A": "Buy", "B": "Sell", "C": "Hold"}, "ans": "B", "en": "B is correct. Step 1: z3 = (1/0.8163)^(1/3) − 1 = 7.00%. Step 2: (1 + z2)^2 = 1.07^3/1.0852 = 1.128824 → z2 = 6.25%. Step 3: Value = 4/1.055 + 4/1.0625^2 + 4/1.07^3 + 104/1.0825^4 = 86.34, implying YTM = 8.14%. Step 4: The quoted YTM of 7.89% (price = $87.08) is more expensive than the fair value (8.14%, price = $86.34), so the analyst should sell the bond.", "ko": "① DF3 = 0.8163 → z3 = (1/0.8163)^(1/3) − 1 = 7.00% ② (1+z2)² = 1.07³/1.0852 → z2 = 6.25% ③ 공정가 = 4/1.055 + 4/1.0625² + 4/1.07³ + 104/1.0825⁴ = 86.34 → 공정 YTM 8.14% ④ 딜러 호가 YTM 7.89%(가격 87.08) < 8.14% → 시장가격이 공정가보다 비쌈(rich) → Sell.", "trap": "YTM과 가격의 역관계! 호가 YTM < 공정 YTM → 비싸다(Sell).", "f": "z_N = (1/DF_N)^(1/N) − 1,  (1+z3)^3 = (1+z2)^2 (1+f2,1)", "why": {"A": "YTM이 낮을수록 가격이 높습니다. 7.89% < 8.14% → 가격 87.08 > 공정가 86.34 → 고평가(rich)이므로 매수가 아니라 매도입니다.", "C": "Hold는 호가 YTM이 spot 기반 공정 YTM(8.14%)과 같을 때만 맞습니다."}, "orig": "FI · ECO Module 1 Q58", "subject": "FI"}, {"id": "FI:ECO-M1-Q60", "src": "ECO 오답", "module": "06-1", "tag": "Spread 지표 – TED / MRR–OIS / Z-spread", "vig": 46, "stem": "Akron is least likely correct with regard to which spread measure in Module 4?", "opts": {"A": "Z-spread", "B": "TED spread", "C": "MRR–OIS spread"}, "ans": "B", "en": "(A) Incorrect because Akron’s description of the Z-spread is correct.\n(B) Correct. The TED spread is not used for individual bonds but rather is an indicator of perceived risk in the general economy. The TED spread is calculated as the difference between MRR and the yield on a T-bill of equal maturity.\n(C) Incorrect because Akron’s description of the MRR–OIS spread is correct.", "ko": "TED spread = 3개월 MRR − 3개월 T-bill. 개별 국채 가치평가용이 아니라 경제 전반의 위험 인식(은행 신용위험) 지표입니다. Akron은 TED를 '국채 valuation용'이라고 해서 틀렸습니다. Z-spread와 MRR–OIS 설명은 맞습니다.", "trap": "TED = 경제 전반 위험(counterparty) 지표, 개별 채권 가치평가 X. MRR–OIS = 은행 신용·유동성.", "f": "TED = MRR(3M) − T-bill(3M),  MRR–OIS = MRR − OIS rate", "why": {"A": "Z-spread = 벤치마크 spot curve에 더해 가격을 맞추는 상수 spread. 회사채 등 신용위험 측정에 유용 — Akron 설명 정확.", "C": "MRR–OIS spread는 은행 간 무담보 대출 위험을 반영하며 money market 증권의 위험·유동성 지표 — Akron 설명 정확."}, "orig": "FI · ECO Module 1 Q60", "subject": "FI"}, {"id": "FI:ECO-M1-Q69", "src": "ECO 오답", "module": "06-1", "tag": "Par rate 정의 & Bootstrapping 식", "vig": 47, "stem": "Is Klopp’s statement on par rates and bootstrapping most likely correct?", "opts": {"A": "Yes.", "B": "No, he is incorrect about par rates.", "C": "No, he is incorrect about bootstrapping."}, "ans": "C", "en": "C is correct. Klopp correctly describes par rates but is incorrect about the process of bootstrapping. Bootstrapping is forward substitution: the one-year spot rate equals the one-year par rate, and the two-year spot rate r(2) solves Par value = 2-year par coupon/(1 + r(1)) + (2-year par coupon + Par value)/(1 + r(2))^2, where r(1) = 2.041%. In the vignette, Klopp incorrectly discounts the first coupon at (1 + r(2)) instead of (1 + r(1)).\nA/B are incorrect: Klopp correctly describes par rates and incorrectly describes bootstrapping.", "ko": "Par rate 설명(on-the-run 국채가 par에 거래될 때의 YTM)은 맞습니다. 하지만 Klopp의 2년 spot 식에서 첫 쿠폰을 r(2)로 할인한 것이 틀렸습니다. 첫 해 쿠폰은 1년 spot r(1)로 할인해야 합니다: Par = C/(1+r(1)) + (C+Par)/(1+r(2))².", "trap": "각 현금흐름은 '그 시점의 spot'으로 할인. 1년차 쿠폰 → r(1).", "f": "Par = C/(1+r1) + (C+Par)/(1+r2)^2", "why": {"A": "식의 첫 항 분모를 (1+r(2))로 쓴 오류가 있으므로 완전히 맞지 않습니다.", "B": "Par rate 정의는 정확합니다. 틀린 곳은 bootstrapping 식입니다."}, "orig": "FI · ECO Module 1 Q69", "subject": "FI"}, {"id": "FI:ECO-M1-Q71", "src": "ECO 오답", "module": "06-1", "tag": "전통적 Term structure 이론 비교", "vig": 48, "stem": "With regard to Aguero’s question regarding traditional theories of the term structure of interest rates, who is most likely correct?", "opts": {"A": "Torres", "B": "Dengler", "C": "Pochettino"}, "ans": "C", "en": "(A) Incorrect. Torres is incorrect. He is correct that under segmented markets theory, the shape of the yield curve is determined by supply and demand for funds at each maturity. He is also correct that depending on the nature of supply and demand mismatch, a downward or upward sloping yield curve is possible. However, the theory does not state that institutions will deviate from their preferred maturities if they are adequately compensated, which is true only under the preferred habitat theory.\n(B) Incorrect. Dengler is incorrect. Dengler is correct that forward rates are an unbiased predictor of expected future spot rates and that the theory can explain an upward sloping or downward sloping yield curve. However, the unbiased expectations theory assumes risk neutrality and only applies to risk-free assets, not risk assets.\n(C) Correct. Pochettino correctly describes the liquidity preference theory of the term structure of interest rates. The theory states that investors require a liquidity premium to lend over longer maturities. Consequently, forward rates are an upwardly biased estimate of expected future spot rates, and the yield curve will typically be upward sloping. A downward sloping yield curve is possible only if expected future spot rates decline by enough to offset the liquidity premium.", "ko": "Pochettino(liquidity preference)가 정확합니다: 장기 대출에 유동성 프리미엄 요구 → forward는 기대 spot의 상향 편의 추정치 → 커브는 보통 상승, 하락은 기대 spot의 큰 하락으로만 가능.", "trap": "Segmented = 선호 만기 이탈 불가 / Preferred habitat = 보상 충분하면 이탈. Unbiased expectations = risk-neutral, 무위험 자산.", "f": "Liquidity preference: f = E(S) + LP(만기↑ → LP↑)", "why": {"A": "Torres는 segmented markets theory에 '충분히 보상받으면 선호 만기를 벗어난다'를 붙였는데, 이는 preferred habitat theory의 내용입니다.", "B": "Dengler는 unbiased expectations theory가 위험자산에도 적용된다고 했지만, 이 이론은 위험중립을 가정하고 무위험 자산에만 적용됩니다."}, "orig": "FI · ECO Module 1 Q71", "subject": "FI"}, {"id": "FI:ECO-M1-Q75", "src": "ECO 오답", "module": "06-1", "tag": "YTM vs 실현수익률 (upward curve, forward대로 실현)", "vig": 49, "stem": "Using the information provided in Exhibit 1 and assuming that Bird’s interest rate expectation materializes, the realized return for an investor who buys and holds to maturity the US Treasury 7.00% coupon bond would most likely be:", "opts": {"A": "less than the yield to maturity.", "B": "equal to the yield to maturity.", "C": "greater than the yield to maturity."}, "ans": "C", "en": "(A) Incorrect because the realized return will be less than the yield to maturity only when the yield curve is downward sloping.\n(B) Incorrect because the realized return will equal the yield to maturity only when the coupons are reinvested at the YTM.\n(C) Correct. The realized return would be greater than the yield to maturity (YTM) because the coupons would be reinvested at forward rates that increase and eventually exceed the YTM because the spot curve is upward sloping. The YTM can be a poor estimate of expected return if interest rates are volatile and if the yield curve is steeply sloped. YTM assumes that all reinvestment of coupons is made at the assumed rate, which is the YTM. Although this math is not necessary to answer the question, the present value of the bond is 101.15; the future value of the bond assuming that all coupons are reinvested at the forward rates is 141.87; the annualized realized return is 7.0%, which is greater than the 6.72% yield to maturity.\nWhere 141.87 =\nYear 1 FVCFs = 7(1 + 0.05)(1 + 0.07)(1.091)(1.111) = 9.53\nYear 2 FVCFs = 7(1 + 0.07)(1.091)(1.111) = 9.08\nYear 3 FVCFs = 7(1.091)(1.111) = 8.48\nYear 4 FVCFs = 7(1.111) = 7.78\nYear 5 FVCFs = 107\nAnd where (141.87 – 101.15)/101.15 = 0.40257 [solve 1.075 = 1 + 0.40257].", "ko": "Spot curve가 상승(3%→7%)하고 금리가 forward대로 실현되면, 쿠폰은 점점 높아지는 forward rate(5.01%→11.10%)로 재투자되어 결국 YTM(6.72%)보다 높은 금리로 재투자됩니다 → 실현수익률(약 7.0%) > YTM.", "trap": "YTM의 숨은 가정 = 'YTM으로 재투자'. 상승 커브 + forward 실현 → 재투자율 ↑ → 실현수익률 > YTM.", "f": "실현수익률 = (Σ 쿠폰×재투자 FV + 원금)/Price 의 연환산", "why": {"A": "실현수익률 < YTM은 재투자율이 YTM보다 낮을 때(하향 커브)입니다.", "B": "실현수익률 = YTM은 쿠폰이 정확히 YTM으로 재투자될 때만 성립합니다."}, "orig": "FI · ECO Module 1 Q75", "subject": "FI"}, {"id": "FI:ECO-M1-Q80", "src": "ECO 오답", "module": "06-1", "tag": "Bootstrapping 목적", "vig": null, "stem": "The process of bootstrapping is most likely used to:", "opts": {"A": "derive the forward rate curve using the spot rate curve.", "B": "adjust for the shape of the par curve when deriving the spot rate curve.", "C": "derive zero-coupon rates using the par yields of coupon-paying government bonds."}, "ans": "C", "en": "(A) Incorrect because even though the spot rate curve can be used to derive the forward rate curve, this is not known as bootstrapping.\n(B) Incorrect because the shape of the yield curve is not relevant in the process of bootstrapping. The zero-coupon rates are determined by using the par yields and solving for the zero-coupon rates one by one, from the shortest to longest maturities.\n(C) Correct because zero-coupon rates are determined by using the par yields and solving for the zero-coupon rates one by one, from the shortest to longest maturities using a forward substitution process known as bootstrapping. The par curve represents the yields to maturity on coupon-paying government bonds, priced at par, over a range of maturities.", "ko": "Bootstrapping = coupon-paying 국채의 par yield로부터 zero-coupon(spot) rate를 짧은 만기부터 순차적으로 도출하는 forward substitution 과정입니다.", "trap": "Bootstrapping: par → spot. Forward rate model: spot → forward. 혼동 주의.", "f": "par curve —(bootstrapping)→ spot curve —(forward model)→ forward curve", "why": {"A": "spot curve로 forward curve를 구하는 것은 forward rate model이며 bootstrapping이라 부르지 않습니다.", "B": "커브 '모양'을 보정하는 절차가 아닙니다. 모양과 무관하게 par yield에서 spot을 하나씩 풉니다."}, "orig": "FI · ECO Module 1 Q80", "subject": "FI"}, {"id": "FI:ECO-M1-Q87", "src": "ECO 오답", "module": "06-1", "tag": "Swap spread vs I-spread vs G-spread", "vig": null, "stem": "A German manufacturing company has an outstanding bond maturing in five years and trading with a YTM of 3.90%. If the 5-year Bund is yielding 2.65% and the fixed rate of a 5-year, fixed-for-float MRR swap is 3.20%, the swap spread is:", "opts": {"A": "55 bps.", "B": "70 bps.", "C": "125 bps."}, "ans": "A", "en": "(A) Correct because a swap spread is an excess yield of swap rates over the yields on government bonds, and we use the terms I-spread, ISPRD, or interpolated spread to refer to bond yields net of the swap rates of the same maturities.\nSwap spread = 3.20% – 2.65% = 0.55% = 55 bps.\n(B) Incorrect because this is the I-spread, a swap spread is an excess yield of swap rates over the yields on government bonds, and we use the terms I-spread, ISPRD, or interpolated spread to refer to bond yields net of the swap rates of the same maturities. In its simplest form, the I-spread can be measured as the difference between the yield-to-maturity of the bond and the swap rate given by a straight-line interpolation of the swap curve.\nI-spread = 3.90% – 3.20% = 0.70% = 70 bps.\n(C) Incorrect because this is the spread between the yield-to-maturity of the company's bond and the benchmark government bond.\nBenchmark spread = 3.90% – 2.65% = 1.25% = 125 bps.", "ko": "Swap spread = swap rate − 동일만기 국채 = 3.20% − 2.65% = 0.55% = 55 bps. I-spread = 채권 YTM − swap rate = 3.90 − 3.20 = 70 bps. G-spread(benchmark spread) = 채권 YTM − 국채 = 3.90 − 2.65 = 125 bps.", "trap": "3가지 spread를 한 문제에 모두 선지로 제시하는 전형적 패턴. '무엇에서 무엇을 빼는지' 공식으로 구분.", "f": "Swap spread = Swap − Govt  |  I-spread = Bond YTM − Swap  |  G-spread = Bond YTM − Govt", "why": {"B": "70 bps는 I-spread(채권 YTM − swap rate)입니다. swap spread는 회사채 YTM을 쓰지 않습니다.", "C": "125 bps는 회사채 YTM − 국채(G-spread/benchmark spread)입니다."}, "orig": "FI · ECO Module 1 Q87", "subject": "FI"}, {"id": "FI:ECO-M1-Q88", "src": "ECO 오답", "module": "06-1", "tag": "Segmented markets vs Preferred habitat", "vig": null, "stem": "In contrast to the preferred habitat theory of the term structure of interest rates, the segmented market theory assumes that:", "opts": {"A": "borrowers and lenders have strong preferences for particular maturities.", "B": "investors will accept additional risk in return for additional expected returns.", "C": "yields are determined entirely by the supply and demand for funds of a particular maturity."}, "ans": "C", "en": "(A) Incorrect because this applies to both theories. The preferred habitat theory is similar to the segmented markets theory in proposing that many borrowers and lenders have strong preferences for particular maturities, but it does not assert that yields at different maturities are determined independently of each other.\n(B) Incorrect because the preferred habitat theory is based on the realistic notion that agents and institutions will accept additional risk in return for additional expected returns. The theory contends that if the expected additional returns to be gained become large enough, institutions will be willing to deviate from their preferred maturities or habitats. On the other hand, the segmented markets theory assumes that market participants are either unwilling or unable to invest in anything other than securities of their preferred maturity.\n(C) Correct because this is a characteristic of the segmented markets theory. In summary, the segmented markets theory assumes that market participants are either unwilling or unable to invest in anything other than securities of their preferred maturity. It follows that the yield of securities of a particular maturity is determined entirely by the supply and demand for funds of that particular maturity.", "ko": "Segmented markets theory: 참여자는 선호 만기 외에는 투자하지 않거나 못하므로, 각 만기 수익률은 그 만기의 자금 수요·공급만으로 (다른 만기와 독립적으로) 결정됩니다.", "trap": "'In contrast to' 문제 → 공통점(A)은 오답. Segmented만의 고유 특징 = 만기별 '독립적' 수급 결정.", "f": "Segmented: 이탈 불가, 만기별 독립 / Preferred habitat: 보상 충분 시 이탈", "why": {"A": "차입자·대여자가 특정 만기를 강하게 선호한다는 것은 두 이론 '공통' 전제입니다. 차이점이 아닙니다.", "B": "추가 기대수익이 충분하면 위험을 감수하고 선호 만기를 벗어난다 → preferred habitat theory의 특징입니다."}, "orig": "FI · ECO Module 1 Q88", "subject": "FI"}, {"id": "FI:ECO-M5-Q1", "src": "ECO 오답", "module": "06-5", "tag": "CDS 결제 – Cash vs Physical settlement", "vig": 50, "stem": "If UNAB experienced a credit event on 1 July, Watt should recommend that Deem Advisors:", "opts": {"A": "prefer a cash settlement.", "B": "prefer a physical settlement.", "C": "be indifferent between a cash or a physical settlement."}, "ans": "A", "en": "A is correct. Deem Advisors would prefer a cash settlement. Deem Advisors owns Bond 2 (trading at 50% of par), which is worth more than the cheapest-to-deliver obligation (Bond 1, also a senior secured bond, trading at 40% of par). Based on the price of this cheapest-to-deliver security, the estimated recovery rate is 40%. Thus, Deem Advisors can cash settle for $6 million [= (1 – 40%) × $10 million] on its CDS contract and sell the bond it owns, Bond 2, for $5 million, for total proceeds of $11 million. If Deem Advisors were to physically settle the contract, only $10 million would be received, the face amount of the bonds, and it would deliver Bond 2.\nB is incorrect because if Deem Advisors were to physically settle the contract, it would receive only $10 million, which is less than the $11 million that could be obtained from a cash settlement. C is incorrect because Deem Advisors would not be indifferent between settlement protocols as the firm would receive $1 million more with a cash settlement in comparison to a physical settlement.", "ko": "Cheapest-to-deliver(동순위 senior unsecured 중 가장 싼 Bond 1, 40% of par) → 추정 회수율 40%. Cash settlement: (1 − 40%) × $10M = $6M 수령 + 보유 Bond 2(50% of par)를 $5M에 매도 = 총 $11M. Physical settlement: Bond 2를 인도하고 액면 $10M 수령. → Cash가 $1M 유리.", "trap": "CDS payoff는 CTD 가격 기준. 내가 가진 채권이 CTD보다 비싸면 → cash 결제 + 채권 시장 매도.", "f": "Cash payoff = (1 − RR_CTD) × Notional", "why": {"B": "Physical은 $10M만 수령합니다. 보유 채권이 CTD보다 비쌀 때(50% > 40%) cash settlement가 유리합니다.", "C": "두 방식의 수령액이 $11M vs $10M로 다르므로 무차별하지 않습니다."}, "orig": "FI · ECO Module 5 Q1", "subject": "FI"}, {"id": "FI:ECO-M5-Q5", "src": "ECO 오답", "module": "06-5", "tag": "CDS 청산 – protection buyer의 손익", "vig": 50, "stem": "If Deem Advisors enters into a new offsetting contract two months after purchasing protection on Kand Corporation, this action will most likely result in:", "opts": {"A": "a loss on the CDS position.", "B": "a profit on the CDS position.", "C": "neither a loss nor a profit on the CDS position."}, "ans": "B", "en": "B is correct. Deem Advisors purchased protection and therefore is economically short and benefits from an increase in the company’s spread. Since putting on the protection, the credit spread increased by 200 bps, and Deem Advisors realizes the profit by entering into a new, offsetting contract (sells protection to another party at a higher premium).\nA is incorrect because a decrease (not increase) in the spread would result in a loss for the credit protection buyer. C is incorrect because Deem Advisors, the credit protection buyer, would profit from an increase in the company’s credit spread, not break even.", "ko": "Protection 매수 = 신용에 대해 경제적으로 short. 매수 후 spread가 200bp 확대 → CDS 가치 상승. 반대(매도) 계약으로 청산하면 더 높은 프리미엄으로 protection을 팔게 되어 이익 실현.", "trap": "Buyer = short credit: spread↑ → 이익. Seller = long credit: spread↑ → 손실.", "f": "ΔCDS value(buyer) ≈ Δspread × Duration × Notional", "why": {"A": "손실은 spread가 '축소'될 때 protection buyer에게 발생합니다.", "C": "spread가 변했으므로 손익이 발생합니다(확대 → buyer 이익)."}, "orig": "FI · ECO Module 5 Q5", "subject": "FI"}, {"id": "FI:ECO-M5-Q20", "src": "ECO 오답", "module": "06-5", "tag": "CDS 청산 – seller, spread 축소", "vig": 51, "stem": "If Tundra closes its position in CDS 3 today, it will:", "opts": {"A": "pay an upfront premium and monetize a loss.", "B": "pay an upfront premium and monetize a gain.", "C": "receive an upfront premium and monetize a gain."}, "ans": "B", "en": "(A) Incorrect because Tundra will pay an upfront premium and monetize a gain.\n(B) Correct because if Tundra was to close its position in CDS 3, it will have to buy credit protection with a newly created CDS with a coupon of 5.0% and the same remaining maturity as CDS 3.  As the reference entity’s credit spread is currently 600 bps, to buy such credit protection, Tundra has to pay an upfront premium.\nHowever, as the reference entity’s credit spread decreased by 50 bps (i.e., credit quality improved) the upfront premium that Tundra has to pay is lower than the upfront premium it received at origination. Therefore, it will monetize a gain.\n(C) Incorrect because Tundra will pay an upfront premium and monetize a gain.", "ko": "CDS 3: protection seller, 쿠폰 5%, 체결 시 spread 650bp → 현재 600bp. 청산하려면 같은 조건의 protection을 '매수'해야 함. 현재 spread 600bp > 쿠폰 500bp → 매수자는 upfront를 '지급'. 하지만 spread가 50bp 축소(신용 개선)해 지급액이 체결 시 받은 upfront보다 작음 → 이익 실현.", "trap": "Upfront 방향: spread > coupon → buyer가 지급. 손익: seller는 spread 축소 시 이익.", "f": "Upfront (buyer pays) ≈ (Spread − Coupon) × Duration", "why": {"A": "spread 축소는 seller(long credit)에게 이익입니다.", "C": "spread(600) > 쿠폰(500)이므로 protection을 사는 쪽이 upfront를 '지급'합니다(받지 않음)."}, "orig": "FI · ECO Module 5 Q20", "subject": "FI"}, {"id": "FI:ECO-M5-Q22", "src": "ECO 오답", "module": "06-5", "tag": "Basis trade 방향 – negative basis", "vig": 51, "stem": "Which of the following trades is consistent with Pereira's belief about the local company's credit spread convergence?", "opts": {"A": "Buy bonds and sell CDS credit protection", "B": "Buy bonds and buy CDS credit protection", "C": "Sell bonds and buy CDS credit protection"}, "ans": "B", "en": "(A) Incorrect because as explained in the rationale for the correct answer Tundra should buy bonds and buy credit protection.\n(B) Correct because the credit spread situation provide an opportunity for a basis trade.  Per the reading, the general idea behind most basis trades is that any such mispricing is likely to be temporary and the spreads in the bond and the CDS markets should return to equivalence when the market recognizes the disparity. For example, suppose the bond market implies a 4.5% credit risk premium whereas the CDS market implies a 4.0% credit risk premium. The trader does not know which is correct but believes these two rates will eventually converge. From the perspective of the CDS, its risk premium is too low relative to the bond credit risk premium. From the perspective of the bond, its risk premium is too high relative to the CDS market, which means its price is too low. So, the CDS market could be pricing in too little credit risk, and/or the bond market could be pricing in too much credit risk. Either market could be correct, it does not matter. The investor would buy the bond at a price that appears to overestimate its credit risk, and, at the same time, buy credit protection at what appears to be an unjustifiably low premium. If the convergence occurs, the trade would capture the 0.5% differential in the two markets.\n(C) Incorrect because as explained in the rationale for the correct answer Tundra should buy bonds and buy credit protection.", "ko": "Bond spread 450bp > CDS spread 400bp → negative basis. 채권이 신용위험을 과다 반영(가격이 쌈), CDS는 과소 반영(protection이 쌈) → 채권 매수 + CDS protection 매수. 수렴 시 50bp 이익.", "trap": "Negative basis(bond spread > CDS) → buy bond + buy protection. Positive basis → sell(short) bond + sell protection.", "f": "", "why": {"A": "CDS protection을 '매도'하면 채권과 같은 방향(long credit)이라 헤지·차익이 아닙니다.", "C": "채권 매도는 싼 채권을 파는 것이라 basis 수렴 이익과 반대 방향입니다."}, "orig": "FI · ECO Module 5 Q22", "subject": "FI"}, {"id": "FI:ECO-M5-Q23", "src": "ECO 오답", "module": "06-5", "tag": "Expected loss – 연도별 조건부 PD (ECO 방식)", "vig": 52, "stem": "Based on the information in Exhibit 1, the expected loss for Apollo bond is most likely closest to:", "opts": {"A": "$35.28.", "B": "$48.03.", "C": "$90.00."}, "ans": "B", "en": "(A) Incorrect. An expected loss of $35.28 incorrectly presumes an equivalent hazard rate of 2% for each year:\n1.Probability of survival represents the probability of no default: 0.98 × 0.98 × 0.98 = 0.94119.\n2. Probability of default: 1.0 – Probability of survival = 1 – 0.94119 = 0.058810 = 5.8810%.\n3. Expected loss = Probability of default × Loss given default × Face amount = 5.8810% × 60% × $1,000 = $35.28.\n(B) Correct. Expected loss = Summation of conditional probability of default × Loss given default for each discrete cash flow, as illustrated.\nCalculation:\nCash flow (CF): $50.00 interest coupons, $1,000.00 principal repayment\nExpected loss (EL) = CF × Conditional probability of default (PD) × Loss given default (LGD), where LGD = 1 – Recovery rate\nConditional probability of default:\nYear 1 PD = 2.0% = 2% Hazard rate\n[98% no default in Year 1 (100% – 2% PD)].\nYear 2 conditional PD = 4.45% = 2.0% (Y1 PD) + 2.45% (Y2 conditional PD)\n[(2.5% Hazard rate × 98% No default Y1); 95.50% no default in Year 2 (100% – 4.5% PD)].\nYear 3 conditional PD = 7.317% = 2.0% (Y1 PD) + 2.45% (Y2 conditional PD) + 2.867% (Y3 conditional PD)\n[(3.0% Hazard rate × 0.955 No default Y2); 92.684% no default in Year 3 (100% – 7.317% PD)].\nExpected loss = $48.03, where\nYear 1 = $50.00 CF × (2.00% Y1 PD × 0.60 LGD) = $0.60.\nYear 2 = $50.00 CF × (4.45% Y2 conditional PD × 0.60 LGD) = $1.34.\nYear 3 = $1,050.00 CF × (7.316% Y3 conditional PD × 0.60 LGD) = $46.09.\n(C) Incorrect. An expected loss of $90.00 is incorrectly determined by the following calculation: $1,000 (face amount of the bond) × 15.00% (summation of the three years of 5.00% interest coupons) × (1.0 – 0.40 Recovery rate).", "ko": "ECO 해설 방식: 각 현금흐름 × 누적 조건부 PD × LGD(60%). 누적 PD: Y1 2.00%, Y2 2.00% + 2.5%×0.98 = 4.45%, Y3 4.45% + 3.0%×0.955 = 7.317%. EL = 50×2.00%×0.6 + 50×4.45%×0.6 + 1,050×7.317%×0.6 = 0.60 + 1.34 + 46.09 = $48.03. 노트 공식과 동일: PS_t = (1−h1)(1−h2)…(1−h_t), 누적 PD_t = 1 − PS_t → PS3 = 0.98 × 0.975 × 0.97 = 0.92684 → 누적 PD3 = 7.316%.", "trap": "연도별 hazard rate가 다르면 조건부로 누적(직전 생존확률 × 당해 hazard). Bregen의 '견해'가 아니라 Exhibit 1 시장자료를 사용.", "f": "PD_t(조건부) = hazard_t × S_(t−1),  S_t = S_(t−1) × (1 − hazard_t)", "why": {"A": "$35.28은 매년 2%(Bregen의 가정)를 적용해 3년 누적 PD 5.881% × 60% × $1,000으로 계산한 값입니다. Exhibit 1의 연도별 2.0%/2.5%/3.0%를 써야 합니다.", "C": "$90.00은 쿠폰 합계 15% × $1,000 × 60%라는 무의미한 계산입니다."}, "orig": "FI · ECO Module 5 Q23", "subject": "FI"}, {"id": "FI:ECO-M5-Q31", "src": "ECO 오답", "module": "06-5", "tag": "CDS 가격 & upfront premium", "vig": 53, "stem": "Based on Exhibit 1, the price per 100 par of Company A CDSs is closest to:", "opts": {"A": "95.70.", "B": "99.06.", "C": "104.29."}, "ans": "A", "en": "(A) Correct. Up-front premium = (Credit spread – Fixed coupon) × CDS duration\n= (1.94 – 1.0) × 4.57 = 4.2958.\nPrice of CDS per 100 par = 100 – Up-front premium\n= 100 – 4.2958 = 95.7042.\n(B) Incorrect. It is incorrectly calculated as follows: Up-front premium = (Credit spread – Fixed coupon)\n= (1.94 – 1.0) = 0.94.\nPrice of CDS per 100 par = 100 – Up-front premium\n= 100 – 0.94 = 99.06.\n(C) Incorrect. It is incorrectly calculated as follows: Up-front premium = (Fixed coupon – Credit spread) × CDS duration\n= (1.0 – 1.94) × 4.57 = –4.2958.\nPrice of CDS per 100 par = 100 – Up-front premium\n= 100 – (–4.2958) = 104.2958.", "ko": "Upfront premium(%) ≈ (credit spread − fixed coupon) × CDS duration = (1.94% − 1.00%) × 4.57 = 4.2958%. CDS price per 100 = 100 − 4.2958 = 95.70.", "trap": "Price = 100 − upfront. spread > coupon → price < 100 (buyer가 upfront 지급).", "f": "Upfront ≈ (Spread − Coupon) × Duration,  Price = 100 − Upfront(%)", "why": {"B": "99.06은 duration을 곱하지 않은 값(100 − 0.94).", "C": "104.29는 부호를 반대로(coupon − spread) 적용한 값."}, "orig": "FI · ECO Module 5 Q31", "subject": "FI"}, {"id": "FI:ECO-M5-Q34", "src": "ECO 오답", "module": "06-5", "tag": "Basis trade – positive basis (Company A)", "vig": 53, "stem": "Which of the following trades is most likely appropriate on the basis of the information in Statement 3 and Exhibit 1? Go long:", "opts": {"A": "Company B five-year CDSs and short Company B five-year bonds.", "B": "Company A five-year CDSs and short Company A five-year bonds.", "C": "Company A five-year bonds and CDSs and go short Company B five-year bonds and CDSs."}, "ans": "B", "en": "(A) Incorrect. For Company B, the correct strategy is to go short (buy) Company B five-year CDSs and go long Company B five-year bonds. The bond credit spread of 205.60 bps is greater than the CDS credit spread of 165.29 bps. This implies that the bond is underpriced and the CDS is overpriced. Thus, the appropriate strategy is to short the overpriced CDS (buy CDSs) and go long the underpriced bond.\n(B) Correct. The correct trade is to go long (sell) Company A five-year CDSs and short Company A five-year bonds. The bond credit spread of 85.40 bps is less than the CDS credit spread of 193.45 bps. This implies that the bond is overpriced and the CDS is underpriced. Thus, the appropriate strategy is to short the overpriced bond and go long the underpriced CDS (sell CDSs).\n(C) Incorrect. Company A bond is overpriced, so you would go short, not long. Company B bond is underpriced, so you would go long, not short.", "ko": "Company A: bond spread 85.40bp < CDS spread 193.45bp → 채권 고평가(spread 너무 낮음), CDS 저평가(protection 프리미엄 높음 → 팔기 좋음). → CDS 매도(long CDS) + 채권 공매도.", "trap": "'Long CDS' = protection 매도(long credit). Bond spread < CDS spread → short bond + sell protection.", "f": "", "why": {"A": "Company B는 bond spread 205.60 > CDS 165.29 → 채권 매수 + protection 매수가 맞는 방향. 선지는 반대.", "C": "Company A 채권은 고평가라 매수가 아니라 공매도, B 채권은 저평가라 공매도가 아니라 매수."}, "orig": "FI · ECO Module 5 Q34", "subject": "FI"}, {"id": "Deriv:ECO-M2-Q15", "src": "ECO 오답", "module": "07-2", "tag": "금리 option 기초변수 = FRA rate, 옵션 만기", "vig": 54, "stem": "The valuation inputs used by Lee to price a call reflecting Solomon's interest rate views should include an underlying FRA rate of:", "opts": {"A": "0.60% with six months to expiration.", "B": "0.75% with nine months to expiration.", "C": "0.75% with six months to expiration."}, "ans": "C", "en": "The option is on three-month MRR in six months. In the Black/standard market model the underlying is the current FRA rate for a three-month loan starting in six months (0.75%), and the option expires in six months.", "ko": "6개월 뒤의 3개월 MRR에 대한 옵션이므로 기초변수는 '6개월 뒤 시작하는 3개월 FRA rate' 0.75%이고, 옵션 만기는 6개월입니다.", "trap": "기초변수는 현재 spot MRR(0.60%)이 아니라 FRA rate. 옵션 만기는 FRA의 시작 시점(6개월)이지 대출 만기(9개월)가 아니다.", "f": "Underlying = FRA(0, t_(j−1), t_m),  옵션 만기 = t_(j−1)", "why": {"A": "0.60%는 현재 3개월 spot MRR입니다. 기초변수는 FRA rate 0.75%입니다.", "B": "9개월은 3개월 대출이 끝나는 시점입니다. 옵션 만기는 6개월입니다."}, "orig": "Deriv · ECO Module 2 Q15", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q22", "src": "ECO 오답", "module": "07-2", "tag": "무차익·기대값 접근은 투자자 전망과 무관", "vig": 55, "stem": "Is Schwartz's statement about the one-period binomial model most likely correct?", "opts": {"A": "Yes", "B": "No, she is incorrect about the probability of an up move", "C": "No, she is incorrect about expectations of future stock prices"}, "ans": "C", "en": "π = (1.02 − 0.75)/(1.35 − 0.75) = 0.45 is correct. But the no-arbitrage and expectations approaches use risk-neutral probabilities, so the investor's outlook for the stock is irrelevant; only the DCF approach to securities valuation depends on investor expectations.", "ko": "상승 확률 π = (1.02 − 0.75)/(1.35 − 0.75) = 45%는 맞습니다. 하지만 무차익 접근과 기대값 접근은 위험중립확률을 쓰므로 투자자의 주가 전망은 상관없습니다. 투자자 전망이 들어가는 것은 증권 가치평가의 DCF 접근입니다.", "trap": "옵션 가치평가(무차익·기대값)는 위험중립확률 + 무위험이자율. 투자자의 주관적 전망·위험조정 할인율은 쓰지 않는다.", "f": "π = (1 + r − d)/(u − d)", "why": {"A": "투자자 전망이 무차익·기대값 접근의 기초라는 부분이 틀렸습니다.", "B": "π = 0.27/0.60 = 45%로 맞습니다."}, "orig": "Deriv · ECO Module 2 Q22", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q34", "src": "ECO 오답", "module": "07-2", "tag": "2기간 이항 call 가치", "vig": 56, "stem": "Using the binomial valuation method and the data in Exhibit 1, the price Messer paid one year ago for the call option with a strike price of EUR750 is closest to:", "opts": {"A": "EUR47.57.", "B": "EUR51.54.", "C": "EUR102.08."}, "ans": "B", "en": "Index paths: 720 → 828/648 → 952.2/745.2/583.2. Payoffs at 750: 202.2, 0, 0. C+ = 0.52 × 202.2/1.03 = 102.08; C− = 0. C0 = 0.52 × 102.08/1.03 = EUR51.54.", "ko": "지수는 720 → 828/648 → 952.2/745.2/583.2입니다. 행사가 750 기준 만기 payoff는 202.2, 0, 0. 위 노드 C+ = 0.52 × 202.2/1.03 = 102.08, 아래 C− = 0. 오늘 C0 = 0.52 × 102.08/1.03 = 51.54.", "trap": "두 단계 모두 할인한다. 중간 노드 값(C+ = 102.08)을 답으로 고르지 말 것. 확률 π와 1 − π를 바꾸지 말 것.", "f": "C = PV[π C+ + (1 − π) C−]", "why": {"A": "상승·하락 확률(π와 1 − π)을 바꿔 쓴 값입니다.", "C": "1기 후 위 노드 값 C+입니다. 한 번 더 할인해야 오늘 가치가 됩니다."}, "orig": "Deriv · ECO Module 2 Q34", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q38", "src": "ECO 오답", "module": "07-2", "tag": "Gamma = delta의 변화율", "vig": 56, "stem": "In describing how call option prices change, Messer is most likely referring to:", "opts": {"A": "vega.", "B": "delta.", "C": "gamma."}, "ans": "C", "en": "\"How the rate of change of an option price speeds up or slows down for a change in the underlying\" is the change in delta — gamma.", "ko": "'옵션 가격 변화 속도가 빨라지거나 느려지는 정도'는 delta(가격 변화율)의 변화율, 즉 gamma입니다.", "trap": "Delta = 가격 변화율, gamma = delta의 변화율(가속도). 'speeds up or slows down'이 나오면 gamma.", "f": "Δ = ∂c/∂S,  Γ = ∂Δ/∂S", "why": {"A": "Vega는 변동성 변화에 대한 옵션 가격 민감도입니다.", "B": "Delta는 기초자산 변화에 대한 옵션 가격의 변화율 자체입니다. 그 변화율이 빨라지거나 느려지는 것은 gamma입니다."}, "orig": "Deriv · ECO Module 2 Q38", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q50", "src": "ECO 오답", "module": "07-2", "tag": "금리 call option – 노드별 할인계수", "vig": null, "stem": "An analyst values a 2-year, European-style call option on a 1-year spot rate. The notional value of the option is $10,000,000, and the exercise rate is 3.50% of par. The risk-neutral probability of an up move is 0.50. Annually compounded 1-year interest rates, along with the corresponding zero-coupon bond values, are shown below.\nNode\t1-year rate\t1-year zero value\nt=0\t4%\t0.961538\nt=1 up\t5%\t0.952381\nt=1 down\t3%\t0.970874\nt=2 up-up\t6%\t0.943396\nt=2 up-down\t4%\t0.961538\nt=2 down-down\t2%\t0.980392\nThe value of the interest rate option is closest to:", "opts": {"A": "$34,118.", "B": "$45,343.", "C": "$80,350."}, "ans": "C", "en": "Time 2 payoffs: 0.025, 0.005, 0. c+ = 0.952381 × [0.5(0.025) + 0.5(0.005)] = 0.014286; c− = 0.970874 × [0.5(0.005)] = 0.002427. c = 0.961538 × [0.5(0.014286) + 0.5(0.002427)] = 0.008035 → × 10,000,000 = $80,350.", "ko": "만기 payoff = Max(0, 금리 − 3.5%): 2.5%, 0.5%, 0. t = 1 위 0.952381 × 평균 = 0.014286, 아래 0.970874 × 0.0025 = 0.002427. t = 0 = 0.961538 × 평균 = 0.008035 → $80,350.", "trap": "기대값은 π와 (1 − π)를 '더한다'. 음수 payoff는 0으로 바꾼다(Max).", "f": "c = PV × [π c_up + (1 − π) c_down]", "why": {"A": "각 단계에서 두 값을 더하지 않고 뺀 값입니다.", "B": "아래-아래 노드 payoff에 Max를 적용하지 않아 음수(−1.5%)를 그대로 쓴 값입니다."}, "orig": "Deriv · ECO Module 2 Q50", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q59", "src": "ECO 오답", "module": "07-2", "tag": "Delta hedge – put 매도 계약 수", "vig": null, "stem": "An investor is short at-the-money call options with a delta of 0.607 on 500,000 shares of stock. At-the-money put options with the same maturity have a delta of –0.434. Assuming an option contract is for 100 shares, the most appropriate action to achieve a delta neutral position is to:", "opts": {"A": "sell 303,500 shares.", "B": "sell 6,993 put option contracts.", "C": "purchase 6,993 put option contracts."}, "ans": "B", "en": "Portfolio delta = 500,000 × (−0.607) = −303,500. NH = −(−303,500)/(−0.434) = −699,309 → negative, so sell puts on about 699,300 shares = 6,993 contracts.", "ko": "Short call의 포트폴리오 delta = 500,000 × (−0.607) = −303,500입니다. Delta를 +로 만들어야 하는데 put delta는 음수이므로 put을 '팔아야' 합니다. 303,500/0.434 = 699,309주 → 6,993계약 매도.", "trap": "부호를 끝까지 따라간다. N_H가 음수면 그 헤지 수단을 판다. 주식으로 헤지하면 '사야' 한다.", "f": "N_H = −Portfolio Δ / Δ_H", "why": {"A": "주식으로 헤지하려면 303,500주를 '사야' 합니다. 파는 것은 delta를 더 음수로 만듭니다.", "C": "Put을 사면 delta가 더 음수가 됩니다. 양의 delta가 필요하므로 put을 팔아야 합니다."}, "orig": "Deriv · ECO Module 2 Q59", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q75", "src": "ECO 오답", "module": "07-2", "tag": "금리 put option – 2기간 이항", "vig": null, "stem": "An analyst values a 2-year, European-style put option on a 1-year spot rate. The notional value of the option is $2,000,000, and the exercise rate is 2.50% of par. The risk-neutral probability of an up move is 0.50. Annually compounded 1-year interest rates, along with the corresponding zero-coupon bond values, are shown below.\nNode\t1-year rate\t1-year zero value\nt=0\t3%\t0.970874\nt=1 up\t4%\t0.961538\nt=1 down\t2%\t0.980392\nt=2 up-up\t5%\t0.952381\nt=2 up-down\t3%\t0.970874\nt=2 down-down\t1%\t0.990099\nThe value of the interest rate option is closest to:", "opts": {"A": "$7,139.", "B": "$14,706.", "C": "$16,383."}, "ans": "A", "en": "Put payoffs Max(0, X − rate): 0, 0, 0.015. p+ = 0; p− = 0.980392 × 0.5 × 0.015 = 0.007353. p = 0.970874 × 0.5 × 0.007353 = 0.003569 → × 2,000,000 = $7,139.", "ko": "금리 put payoff는 Max(0, 2.5% − 금리): 0, 0, 1.5%. t = 1 아래 노드 = 0.980392 × 0.5 × 0.015 = 0.007353. t = 0 = 0.970874 × 0.5 × 0.007353 = 0.003569 → $7,139.", "trap": "금리 put은 행사금리 − 금리. t = 0까지 두 번 할인한다.", "f": "p = PV × [π p_up + (1 − π) p_down]", "why": {"B": "t = 1 값(0.007353)에서 멈추고 t = 0으로 할인하지 않은 값입니다.", "C": "put이 아니라 call 가치를 계산한 값입니다."}, "orig": "Deriv · ECO Module 2 Q75", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q80", "src": "ECO 오답", "module": "07-2", "tag": "Volatility smile = IV vs 행사가", "vig": null, "stem": "Market participants use the term volatility smile to describe the implied volatility of a stock option with respect to the:", "opts": {"A": "dividend yield.", "B": "exercise price.", "C": "time to expiration."}, "ans": "B", "en": "Implied volatility versus exercise price is the volatility smile (or skew); implied volatility versus time to expiration is the term structure of volatility.", "ko": "IV를 행사가에 따라 그린 것이 volatility smile(또는 skew)이고, 만기에 따라 그린 것은 term structure of volatility입니다.", "trap": "Smile/skew ↔ 행사가, term structure ↔ 만기, surface ↔ 둘 다.", "f": "Smile: IV(X),  Term structure: IV(T),  Surface: IV(X, T)", "why": {"A": "배당수익률에 따른 IV를 부르는 이름은 없습니다. Smile은 행사가 기준입니다.", "C": "만기에 따른 IV는 term structure of volatility입니다."}, "orig": "Deriv · ECO Module 2 Q80", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q83", "src": "ECO 오답", "module": "07-2", "tag": "Black model put = bond − futures 성분", "vig": null, "stem": "An investor wishes to replicate the value of a long European put on a futures contract using a bond component and a futures component. According to the Black model, which of the following combinations will replicate the put value?", "opts": {"A": "The futures component plus the bond component", "B": "The bond component minus the futures component", "C": "The futures component minus the bond component"}, "ans": "B", "en": "Black model: call = futures component − bond component; put = bond component − futures component.", "ko": "Black model에서 call = 선물 성분 − 채권 성분, put = 채권 성분 − 선물 성분입니다.", "trap": "BSM과 같은 구조: call은 '기초자산 − 채권', put은 '채권 − 기초자산'.", "f": "c = e^(−rT)[F N(d1) − X N(d2)],  p = e^(−rT)[X N(−d2) − F N(−d1)]", "why": {"A": "선물과 채권을 모두 long하면 call이나 put이 되지 않습니다.", "C":

e statement as part of its reviewed financial statements is as follows:\nAs of 31 December (in EUR)\tAs Reported\nRevenues\t30,000,000\nCost of goods sold\t18,000,000\nGross profit\t12,000,000\nSG&A expenses\t8,000,000\nEBITDA\t4,000,000\nDepreciation and amortization\t2,400,000\nEarnings before interest and taxes\t1,600,000\nPro forma taxes (at 25%)\t400,000\nOperating income after taxes\t1,200,000\nAs Schwalke reviews compensation expenses, he learns that Jean Lapiere’s annual compensation is EUR 300,000 and that CEOs of similarly sized consumer durable goods companies earn EUR 600,000 on average.\nTo estimate LPE’s required return on equity, Schwalke gathers betas from public furniture manufacturing companies, and after making appropriate adjustments, estimates LPE’s beta at 0.80. He uses an equity risk premium of 6%, a small-cap stock premium of 2%, a company-specific stock premium of 1.5%, and an industry risk premium of 1%.\nAfter making other normalizing assumptions to LPE’s income statement and deducting the change in long-term assets of EUR 600,000 (equal to EUR 3,000,000 in capital expenditures less EUR 2,400,000 in depreciation), Schwalke estimates FCFF for the base year to be EUR 600,000. He decides to use the CCM in his income approach to valuing LPE with a WACC of 8% and perpetual growth of 4%.\nGiven the availability of similar publicly traded furniture manufacturing companies, Schwalke also uses a market approach to value LPE. He finds an average EV/Sales multiple of 0.60 from these public comparable companies. Schwalke notes that LPE’s debt is currently EUR 6 million.\nJean Lapiere is seeking an estimate of the value of his LPE ownership stake. In the course of discussing the ownership structure, Schwalke concludes that none of the family members, including Jean, has a controlling interest in the company. Schwalke estimates discounts for lack of control and lack of marketability as 20% and 15%, respectively.", "Rila Rakia & Beer Ltd. (RRBL), a small privately owned company, produces high quality rakia (a high-potency hard liquor), vino (wine), and bira (beer) in Bulgaria. After Bulgaria joined the European Union in 2007, international demand for the country’s liquor, wine, and beer increased substantially. Most firms in the industry, including RRBL, have been reporting double-digit sales growth on a year-over-year basis.\nMetiu Metev, a portfolio strategist at a major German investment consulting firm, inherited RRBL from his grandparents. Frankfurter Destillerie & LiqueurFabrik (FDLF), a German distillery interested in entering the Bulgarian market, has made a cash offer of BGN900 million for the company’s equity (BGN = Bulgarian Lev; EUR1 = BGN1.95586, pegged rate). FDLF will assume RRBL’s entire outstanding debt, including both current liabilities and long-term debt. If Metev does not want to sell a controlling interest, FDLF’s minimum equity stake will be 40%, with an appropriate discount for lack of control.\nMetev starts by evaluating the company himself using the capitalized cash flow method (CCM) and taking the following steps:\nUsing the build-up method to estimate the required rate of return on equity\nComputing the firm’s weighted average cost of capital (WACC) using the book values of debt and considering the current weight of total debt in capital structure to be optimal\nExhibits 1A, 1B, 2, and 3 contain RRBL’s financial data and other inputs that Metev uses.\nBefore responding to FDLF’s offer, however, Metev meets with Vasil Nenkov, his colleague and a senior equity analyst covering the wine and beer industry in the Balkan region. After reviewing the data and Metev’s valuation analysis, Nenkov suggests that 11% would be a more reasonable estimate of RRBL’s WACC based on an analysis of industry peers. Metev decides to use this rate to calculate the value of RRBL’s equity.\nNenkov also makes the following comments:\nComment 1: CCM is most often used for the valuation of large public companies, and it is less valid for valuing private companies such as RRBL.\nComment 2: The excess earnings method is preferable because it provides an estimate of the value of intangible assets by capitalizing future earnings in excess of the estimated return requirements associated with working capital and fixed assets.\nNenkov also suggests that the enterprise value (EV) multiple approach should work well for valuing RRBL. After searching his database, Nenkov finds that Rhodopi Wineries PLC, a publicly traded company and a close competitor of RRBL, is currently valued at an EV/EBITDA (earnings before interest, taxes, depreciation, and amortization) multiple of 7.2. Nenkov further suggests two adjustments:\nAdjustment 1: RRBL should command an upward adjustment of 25% in the EV/EBITDA multiple reflecting its lower risk and higher growth relative to Rhodopi Wineries.\nAdjustment 2: Forward-looking EBITDA should be used to determine RRBL’s value.\nOn a cautionary note, Nenkov makes two statements regarding the use of EV/EBITDA approach to valuation.\nStatement 1: It is more appropriate than the P/E for comparing companies with different financial leverage.\nStatement 2: EBITDA underestimates cash flow from operations if working capital is growing.\nFinally, Metev recalls FDLF’s willingness to purchase a non-controlling ownership interest at a discount for lack of control. Nenkov responds by saying that a control premium of 30% is typically applied for purchase transactions of small privately owned firms similar to RRBL and that proper adjustment for lack of control should be made if the transaction involves a non-controlling interest. Metev thanks Nenkov for his help and goes back to his desk to revise his valuations.\nExhibit 1A RRBL EBITDA and Other Data (BGN millions)\n \tFY2012 (Actual)\tFY2013 (Pro Forma)\nRevenues\t248.5\t300.6\nCost of goods sold\t–132.3\t–172.5\nGross profit\t116.2\t128.1\nSelling, general, and administrative expenses\t–19.2\t–23.0\nEBITDA\t97\t105.1\nOther Data\nCapital expenditures\t2.5\t4\nInterest expense\t2.7\t3.6\nDepreciation and amortization\t5\t6.4\nIncrease in working capital\t0.8\t1\nExhibit 1B Additional Information for RRBL\nPre-tax cost of debt\t10.00%\nWeight of total debt in capital structure\t30%\nTax rate\t25%\nExhibit 2 RRBL Balance Sheet for FY2012 (BGN millions)\nAssets\t\tLiabilities and Equity\t\nCash and short-term investment\t50\tAccounts payable\t10\nReceivables and inventory\t40\tNotes payable\t8\nNet fixed assets\t50\tLong-term debt\t30\nPatents and trademarks\t20\tCommon equity\t112\nTotal assets\t100\tTotal liabilities and equity\t160\nExhibit 3 Other Data and Inputs\nBulgarian government’s 10-year bond yield\t3.90%\nBeta of publicly traded firms in the industry\t0.75\nEquity risk premium\t6.00%\nSmall stock risk premium\t2.50%\nIndustry risk premium\t0.00%\nRRBL’s company-specific risk premium\t1.50%\nLong-term growth rate beyond FY2013\t5.00%", "Jane Nguyen is a senior bond trader for an investment bank, and Chris Alexander is a junior bond trader at the bank. Nguyen is responsible for her own trading activities and also for providing assignments to Alexander that will develop his skills and create profitable trade ideas. Exhibit 1 presents the current par and spot rates.\nExhibit 1\nCurrent Par and Spot Rates\nMaturity\tPar Rate\tSpot Rate\nOne year\t2.50%\t2.50%\nTwo years\t2.99%\t3.00%\nThree years\t3.48%\t3.50%\nFour years\t3.95%\t4.00%\nFive years\t4.37%\nNote: Par and spot rates are based on annual-coupon sovereign bonds.\nNguyen gives Alexander two assignments that involve researching various questions:\nAssignment 1: What is the yield-to-maturity of the option-free, default-risk-free bond presented in Exhibit 2? Assume that the bond is held to maturity, and use the rates shown in Exhibit 1. Exhibit 2Selected Data for $1,000 Par Bond\nBond Name\tMaturity (T)\tCoupon\nBond Z\tThree years\t6.00%\nNote: Terms are today for a T-year loan.\nAssignment 2: Assuming that the projected spot curve two years from today will be below the current forward curve, is Bond Z fairly valued, undervalued, or overvalued?\nAfter completing his assignments, Alexander asks about Nguyen’s current trading activities. Nguyen states that she has a two-year investment horizon and will purchase Bond Z as part of a strategy to ride the yield curve. Exhibit 1 shows Nguyen’s yield curve assumptions implied by the spot rates.", "Laura Mathews recently hired Robert Smith, an investment adviser at Shire Gate Advisers, to assist her in investing. Mathews states that her investment time horizon is short, approximately two years or less. Smith gathers information on spot rates for on-the-run annual-coupon government securities and swap spreads, as presented in Exhibit 1. Shire Gate Advisers recently published a report for its clients stating its belief that, based on the weakness in the financial markets, interest rates will remain stable, the yield curve will not change its level or shape for the next two years, and swap spreads will also remain unchanged.\nExhibit 1\nGovernment Spot Rates and Swap Spreads\nMaturity (years)\t1\t2\t3\t4\nGovernment spot rate\t2.25%\t2.70%\t3.30%\t4.05%\nSwap spread\t0.25%\t0.30%\t0.45%\t0.70%\nSmith decides to examine the following three investment options for Mathews:\nInvestment 1:\nBuy a government security that would have an annualized return that is nearly risk free. Smith is considering two possible implementations: a two-year investment or a combination of two one-year investments.\nInvestment 2:\nBuy a four-year, zero-coupon corporate bond and then sell it after two years. Smith illustrates the returns from this strategy using the swap rate as a proxy for corporate yields.\nInvestment 3:\nBuy a lower-quality, two-year corporate bond with a coupon rate of 4.15% and a Z-spread of 65 bps.\nWhen Smith meets with Mathews to present these choices, Mathews tells him that she is somewhat confused by the various spread measures. She is curious to know whether there is one spread measure that could be used as a good indicator of the risk and liquidity of money market securities during the recent past.", "Liz Tyo is a fund manager for an actively managed global fixed-income fund that buys bonds issued in Countries A, B, and C. She and her assistant are preparing the quarterly markets update. Tyo begins the meeting by distributing the daily rates sheet, which includes the current government spot rates for Countries A, B, and C as shown in Exhibit 1\nExhibit 1\nToday’s Government Spot Rates\nMaturity\tCountry A\tCountry B\tCountry C\nOne year\t0.40%\t–0.22%\t14.00%\nTwo years\t0.70\t–0.20\t12.40\nThree years\t1.00\t–0.12\t11.80\nFour years\t1.30\t–0.02\t11.00\nFive years\t1.50\t0.13\t10.70\nTyo asks her assistant how these spot rates were obtained. The assistant replies, “Spot rates are determined through the process of bootstrapping. It entails backward substitution using par yields to solve for zero-coupon rates one by one, in order from latest to earliest maturities.”\nTyo then provides a review of the fund’s performance during the last year and comments, “The choice of an appropriate benchmark depends on the country’s characteristics. For example, although Countries A and B have both an active government bond market and a swap market, Country C’s private sector is much bigger than its public sector, and its government bond market lacks liquidity.”\nTyo further points out, “The fund’s results were mixed; returns did not benefit from taking on additional risk. We are especially monitoring the riskiness of the corporate bond holdings. For example, our largest holdings consist of three four-year corporate bonds (Bonds 1, 2, and 3) with identical maturities, coupon rates, and other contract terms. These bonds have Z-spreads of 0.55%, 1.52%, and 1.76%, respectively.”\nTyo continues, “We also look at risk in terms of the swap spread. We considered historical three-year swap spreads for Country B, which reflect that market’s credit and liquidity risks, at three different points in time.” Tyo provides the information in Exhibit 2.\nExhibit 2\nSelected Historical Three-Year Rates for Country B\nPeriod\tGovernment Bond Yield (%)\tFixed-for-Floating MRR Swap (%)\n1 month ago\t–0.10\t0.16\n6 months ago\t–0.08\t0.01\n12 months ago\t–0.07\t0.71\nTyo then suggests that the firm was able to add return by riding the yield curve. The fund plans to continue to use this strategy but only in markets with an attractive yield curve for this strategy.\nShe moves on to present her market views on the respective yield curves for a five-year investment horizon.\nCountry A: “The government yield curve has changed little in terms of its level and shape during the last few years, and I expect this trend to continue. We assume that future spot rates reflect the current forward curve for all maturities.”\nCountry B: “Because of recent economic trends, I expect a reversal in the slope of the current yield curve. We assume that future spot rates will be higher than current forward rates for all maturities.”\nCountry C: “To improve liquidity,Country C’s central bank is expected to intervene, leading to a reversal in the slope of the existing yield curve. We assume that future spot rates will be lower than today’s forward rates for all maturities.”\nTyo’s assistant asks, “Assuming investors require liquidity premiums, how can a yield curve slope downward? What does this imply about forward rates?”\nTyo answers, “Even if investors require compensation for holding longer-term bonds, the yield curve can slope downward—for example, if there is an expectation of severe deflation. Regarding forward rates, it can be helpful to understand yield curve dynamics by calculating implied forward rates. To see what I mean, we can use Exhibit 1 to calculate the forward rate for a two-year Country C loan beginning in three years.”", "Rowan Madison is a junior analyst at Cardinal Capital. Sage Winter, a senior portfolio manager and Madison’s supervisor, meets with Madison to discuss interest rates and review two bond positions in the firm’s fixed-income portfolio.\nWinter begins the meeting by asking Madison to state her views on the term structure of interest rates. Madison responds:\n“Yields are a reflection of expected spot rates and risk premiums. Investors demand risk premiums for holding long-term bonds, and these risk premiums increase with maturity.”\nWinter tells Madison that, based on recent changes in spreads, she is concerned about a perceived increase in counterparty risk in the economy and its effect on the portfolio. Madison asks Winter:\n“Which spread measure should we use to assess changes in counterparty risk in the economy?”\nWinter is also worried about the effect of yield volatility on the portfolio. She asks Madison to identify the economic factors that affect short-term and long-term rate volatility. Madison responds:\n“Short-term rate volatility is mostly linked to uncertainty regarding monetary policy, whereas long-term rate volatility is mostly linked to uncertainty regarding the real economy and inflation.”\nFinally, Winter asks Madison to analyze the interest rate risk portfolio positions in a 5-year and a 20-year bond. Winter requests that the analysis be based on level, slope, and curvature as term structure factors. Madison presents her analysis in Exhibit 1.\nExhibit 1\nThree-Factor Model of Term Structure\nTime to Maturity (years)\nFactor\t5\t20\nLevel\t–0.4352%\t–0.5128%\nSteepness\t–0.0515%\t–0.3015%\nCurvature\t0.3963%\t0.5227%\nNote: Entries indicate how yields would change for a one standard deviation increase in a factor.\nWinter asks Madison to perform two analyses:\nAnalysis 1:\nCalculate the expected change in yield on the 20-year bond resulting from a two-standard-deviation increase in the steepness factor.\nAnalysis 2:\nCalculate the expected change in yield on the five-year bond resulting from a one-standard-deviation decrease in the level factor and a one-standard-deviation decrease in the curvature factor.", "Bill Akron is Director of Research at Cuyahoga Fixed Income Advisors. He has a large staff of research analysts and each year adds six new hires to the group. In addition to their regular work assignments, the analysts undergo formal training conducted by Akron. He plans to have six modules over the coming weeks each covering key fixed-income concepts. In each module, Akron starts out by outlining a lesson.\nModule 1:\n“A good place to start a fixed-income program is with a discussion of the yield curve and the information it conveys. This lesson will be theoretical in nature as we discuss interpretations of the term structure of interest rates. I want to present three theories that explain the shape of the yield curve. First is the pure expectations theory, which states that the forward rate is an unbiased predictor of the future spot rate. This theory assumes investors are affected by uncertainty and require a risk premium. Second is the liquidity preference theory, which postulates that investors are willing to take on more risk by investing in longer maturity bonds if they are paid a liquidity premium. Its explanation for an upward sloping yield curve, even if spot rates are expected to be unchanged, is the liquidity premium. A third explanation of the shape of the yield curve is the segmented markets theory, which says that yields are a function of supply and demand for funds in a specific maturity segment. This last theory is very similar to the preferred habitat theory and is premised on investors and borrowers having strong preferences for particular maturities.”\nModule 2:\n“Let’s use the term structure of interest rates to price bonds, and in particular, I want you to fully understand the relationships between spot and forward rates and yield to maturity. Use the data in Exhibit 1 to determine whether a 4% coupon Treasury bond, maturing in four years and offered by a dealer at a yield-to maturity of 7.89% is cheap (buy recommendation), fairly valued (hold recommendation), or rich (sell recommendation) based on arbitrage opportunities.”\nExhibit 1 Select Spot and Forward Rates\n \tYear 1\tYear 2\tYear 3\tYear 4\nSpot Rate\t0.055\t---\t---\t0.0825\nDiscount Factor\t---\t---\t0.8163\t---\nForward Rate f(2,1)\t---\t---\t0.0852\t---\nModule 3:\n“Today I want to go over techniques we use at Cuyahoga to add alpha to our active fixed-income strategies. Many of our portfolio managers like to use a portfolio management strategy called riding the yield curve. This strategy can enhance total return in two ways. First, it increases the yield of the portfolio by buying bonds with maturities longer than their investment horizon whenever the yield curve is upward sloping and expected to maintain the same level and whenever the shape and spot rates rise as predicted by forward rates. Second, even if interest rates increase unexpectedly, since the bonds roll down the yield curve, the bonds will appreciate in price.”\nModule 4:\n“Today I want to go over several spread measures used in fixed-income markets. The Z-spread provides a useful measure of risk for credit instruments such as corporate bonds. It uses the implied spot yield curve and adds the spread necessary to discount the bond’s cash flows and derive its current market price. The TED spread is used for the valuation of government bonds and is calculated as the difference between MRR and the yield on a T-bill of equal maturity. The MRR–OIS spread incorporates unsecured lending between banks. It serves as a good measure of the risk and liquidity of money market securities.”\nModule 5:\n“Swap rates are very useful in the valuation of bonds. I would like you to use the information in Exhibit 2 to value a bond, issued by AAA-rated European Supranational Bank (ESB), maturing in 3.86 years, with a coupon rate of 2.86% paid annually. Dealers are quoting the bond flat to swaps. Simple interpolation can be used to perform the calculations.”\nExhibit 2 Yield Measures at Various Maturities\nMaturity (Years)\t1\t2\t3\t4\t5\nOff the run Bund yield (%)\t0.25\t0.32\t0.46\t0.57\t0.66\nOn the run Bund yield (%)\t0.21\t0.27\t0.41\t0.5\t0.59\nSwap rate (%)\t0.81\t0.89\t1.05\t1.16\t1.27\nModule 6:\n“Consider a portfolio of zero-coupon bonds that mature at different times in the future. Changes in interest rates are not always parallel across maturities, so let’s analyze what happens as rates change across the yield curve. Let’s assume that the portfolio has sensitivities to factors as provided in Exhibit 3. The portfolio has equal weightings in each key rate duration and an effective duration of 4.7. I would like you to assess the impact on the return of the portfolio if rates rise evenly across the curve and also when the curve flattens but does not twist.”\nExhibit 3 Factor Movements per One Standard Deviation Shift and Portfolio Key Rate Durations\nYear\t5\t10\t30\nParallel\t1\t1\t1\nSteepness\t1\t0.5\t–1\nCurvature\t0.5\t0\t1\nKey rate curations\t1.8\t3.6\t8.7", "SCAI is a registered investment adviser based in Nashville, Tennessee, providing investment and private wealth management advice to endowments, retirement plans, and corporations. Dieter Klopp, a portfolio manager, is meeting with analysts Nabil Salah and Lisa Suarez to discuss fixed-income investment opportunities and portfolio management strategies. Klopp presents the group with the information on spot rates shown in Exhibit 1:\nExhibit 1 Spot Rates for Zero-Coupon Bonds\nMaturity (Years)\tSpot Rate\n1\t2.041%\n2\t2.598%\n3\t2.818%\n4\t2.956%\n5\t3.304%\nSalah is currently evaluating a corporate bond and makes the following statements:\n• Statement 1: “The value of a bond calculated by discounting its future cash flows by their corresponding spot rates will be the same as the value obtained by discounting future cash flows by the yield-to-maturity of a bond, as long as the yield-to-maturity is some weighted average of the spot rates.”\n• Statement 2: “Yield-to-maturity is a good estimate of the expected return on a bond assuming coupons are reinvested at the prevailing spot rates.”\n• Statement 3: “If the yield curve remains flat during the holding period, the realized rate of return on a bond will be the same as the expected rate of return.”\nSalah asks Klopp to explain the spot curve in Exhibit 1. Klopp responds that the spot rate curve in Exhibit 1 is derived from the par curve using a process called bootstrapping. The par rates are yields-to-maturity, at various maturities, for on-the-run, coupon-paying government bonds priced at par. Bootstrapping is a process of forward substitution, where successive spot rates are derived from par rates one at a time. The process begins with recognizing that the one-year spot rate is the same as the one-year par rate. The two-year spot rate, r(2), is then calculated by solving the following equation:\nPar Value= 2-year Par coupon(1+2)+2-year Par coupon+Par value(1+r(2))2.\nThis process continues until all spot rates are derived.\nKlopp then asks Suarez how the spot curve can be used in fixed-income analysis. Suarez responds, “Our expectations regarding the evolution of future spot rates compared to the forward curve allow for an evaluation of the relative value of a bond and the identification of appropriate bond trading strategies. Interest rate scenarios and corresponding appropriate strategies are outlined here”:\n• Scenario 1: If we expect future spot rates to be lower than current forward rates, then we should short the bond since it is likely to be overvalued.\n• Scenario 2: If the spot curve is expected to be above the forward curve and our expectations turn out to be correct, the bond should be purchased since the one-year return will be more than the one-year risk-free rate.\n• Scenario 3: If the yield curve is upward sloping and we expect it to remain static, then a strategy of buying bonds with maturities longer than the investment holding period will allow us to earn a return greater than a maturity matching strategy.", "GFC Advisory is a private independent investment firm that provides solutions and advice to individuals and institutions in the United States and internationally. Fernando Aguero is the director of research and is meeting with analysts Sergio Torres, Matteo Pochettino, and Karen Dengler to discuss the development of a research note that explains the role of the term structure of interest rates in fixed-income investment decision making.\nAguero asks the group to describe how traditional theories of the term structure of interest rates explain the shape of the yield curve as well as the relationship between forward rates and expected future spot rates. Each of the analysts responds as follows:\nDengler states that the unbiased expectations theory applies to risky and risk-free assets and maintains that forward rates are an unbiased predictor of expected future spot rates. This theory can explain an upward sloping or downward sloping yield curve.\nPochettino responds that under the liquidity preference theory, investors require a liquidity premium to lend over longer maturities. The theory states that forward rates are an upwardly biased estimate of expected future spot rates, and the yield curve will typically be upward sloping. A downward sloping yield curve is only possible if expected future spot rates decline by enough to offset the liquidity premium.\nTorres notes that according to the segmented markets theory, the shape of the yield curve is determined by supply and demand for funds at each maturity and that institutions will deviate from their preferred maturities if they are adequately compensated.\nAguero states there are modern theories of the term structure that offer more precise ways of describing the evolution of interest rates, specifically the Cox–Ingersoll–Ross (CIR) model, the Vasicek model, and the Ho–Lee model. He notes that all three models are structured similarly in that they have a drift term and a stochastic term. Aguero states the three models also assume that short-term interest rates converge to the long-term rate over time. He concludes by stating that while the CIR and Vasicek models assume constant interest rate volatility, the Ho–Lee model allows for interest rate volatility to increase with the level of interest rates.\nAguero notes that yield curve shaping risk is important in fixed-income portfolio management and asks for input on how this should be addressed in the research note. Dengler responds that our note should indicate three factors that describe yield curve movement: level, steepness, and curvature. The risk associated with these three factors can be measured using effective duration.\nTorres states the research note should also include a discussion of the impact of interest rate volatility on fixed-income portfolio management and makes the following statements:\n• Statement 1: “Interest rate volatility is an important consideration because it impacts the option values embedded in some fixed-income securities.”\n• Statement 2: “Long-term interest rates are typically more volatile than short-term interest rates.”\n• Statement 3: “Long-term interest rate volatility is linked to uncertainty regarding the real economy and inflation, whereas short-term interest rate volatility is related to uncertainty regarding monetary policy.", "Halstead Capital Advisors is an investment advisory firm that specializes in taxable fixed-income investing. Its clients consist of medium sized foundations and endowments who select outside managers such as Halstead after having formulated their investment policy and asset allocation targets.\nHalstead’s chief investment strategist, Charles Scott, and quantitative analyst, Catherine Bird, are meeting to discuss a research report that Bird is producing. The report will address various fixed-income investing topics, including investment strategies, credit spreads, and yield curve movements.\nBird is evaluating two US Treasury instruments. The first is a newly issued 7.00% coupon bond with a 5-year maturity issued at a price of $101.15 ($100.00 face value) with a yield to maturity of 6.72%. The second is newly issued zero-coupon bond with a 5-year maturity issued at a price of $71.30 ($100.00 face value) with a yield to maturity of 7.00%. Current US Treasury spot rates and extrapolated forward rates are provided in Exhibit 1. Bird expects that the future path of interest rates will follow that which is implied by the forward curve.\nExhibit 1 Spot and Forward Interest Rates\nMaturity (n)\tSpot rate r(n)\tOne-year forward rate n−1 years forward, f(n−1,1)\t(n−1)-year forward rate one year forward, f(1,n−1)\n1\t3.00%\t3.00%\t3.00%\n2\t4.00%\t5.01%\t5.01%\n3\t5.00%\t7.03%\t6.01%\n4\t6.00%\t9.06%\t7.02%\n5\t7.00%\t11.10%\t8.02%\nBird proposes to review other credit spread indicators that measure credit and liquidity risk for money market securities, general creditworthiness of individual debt issuers, and counterparty risk. Bird offers the following statements about measures of credit risk:\n• Statement 1: The TED spread represents the difference between MRR and overnight bank lending rates.\n• Statement 2: The MRR–OIS spread represents the difference between MRR and corporate bond spreads.\n• Statement 3: The Z spread represents the constant basis point spread that is added to the implied spot yield curve to measure the price of credit risky bonds.", "UNAB Corporation\nOn 1 January 20X2, Deem Advisors purchased a $10 million six-year senior unsecured bond issued by UNAB Corporation. Six months later (1 July 20X2), concerned about the portfolio’s credit exposure to UNAB, Doris Morrison, the chief investment officer at Deem Advisors, buys $10 million protection on UNAB with a standardized coupon rate of 5%. The reference obligation of the CDS is the UNAB bond owned by Deem Advisors. UNAB adheres to the ISDA CDS protocols.\nOn 1 January 20X3, Morrison asks Bill Watt, a derivatives analyst, to assess the current credit quality of UNAB bonds and the value of Deem Advisors’ CDS on UNAB debt. Watt gathers the following information on UNAB’s debt issues currently trading in the market:\nBond 1: A two-year senior unsecured bond trading at 40% of par\nBond 2: A five-year senior unsecured bond trading at 50% of par\nBond 3: A five-year subordinated unsecured bond trading at 20% of par\nWith respect to the credit quality of UNAB, Watt makes the following statement:\n“There is severe near-term stress in the financial markets, and UNAB’s credit curve clearly reflects the difficult environment.”\nOn 1 July 20X3, UNAB fails to make a scheduled interest payment on the outstanding subordinated unsecured obligation after a grace period; however, the company does not file for bankruptcy. Morrison asks Watt to determine if UNAB experienced a credit event and, if so, to recommend a settlement preference.\nKand Corporation\nMorrison is considering purchasing protection on Kand Corporation debt to hedge the portfolio’s position in Kand. She instructs Watt to determine if an upfront payment would be required and, if so, the amount of the premium. Watt presents the information for the CDS in Exhibit 1.\nExhibit 1\nSummary Data for 10-year CDS on Kand Corporation\nCredit spread\t700 bps\nDuration\t7 years\nCoupon rate\t5%\nMorrison purchases 10-year protection on Kand Corporation debt. Two months later the credit spread for Kand Corporation has increased by 200 bps. Morrison asks Watt to close out the firm’s CDS position on Kand Corporation by entering into a new, offsetting contract.\nTollunt Corporation\nDeem Advisors’ chief credit analyst recently reported that Tollunt Corporation’s five-year bond is currently yielding 7% and a comparable CDS contract has a credit spread of 4.25%. Since the current market reference rate is 2.5%, Watt has recommended executing a basis trade to take advantage of the pricing of Tollunt’s bonds and CDS. The basis trade would consist of purchasing both the bond and the CDS contract.", "Marcos Pereira is a credit analyst with Tundra Partners, a hedge fund manager. Tundra enters into single-name CDS for speculative purposes.  Pereira compiles information about Tundra’s CDS portfolio in Exhibit 1.\nExhibit 1\n \tPosition\tCoupon\tOrigination Credit Spread\tCurrent Credit Spread\nCDS 1\tProtection Buyer\t1.0%\t75 bps\t100 bps\nCDS 2\tProtection Seller\t1.0%\t100 bps\t200 bps\nCDS 3\tProtection Seller\t5.0%\t650 bps\t600 bps\nCDS 4\tProtection Seller\t5.0%\t450 bps\tIn default\nCDS 1 and 2 relate to the same reference entity, and were entered into by Tundra on the same date. CDS 1 and 2 have a remaining time to maturity of 2 and 5 years respectively.\nExhibit 2\n \tMaturity\tTrading Price\nSenior unsecured bond\t3 years\t30% of par\nSenior unsecured bond\t5 years\t35% of par\nSubordinated unsecured bond\t8 years\t20% of par\nPereira also whether Tundra should invest in CDS 5. He calculates that CDS 5’s reference entity has a hazard rate of 1.35% and 2.35% in each of the next 2 years.\nPereira notices that the market expects a local company to be the target of a leveraged buyout (LBO), whereby it will issue large amounts of debt and use the proceeds to repurchase its publicly traded equity. As a result, the credit spread of the company's senior unsecured bonds with 5 years until maturity has increased to 450 bps. A comparable 5-year CDS currently trades at a spread of 400 bps. Pereira believes that credit spreads in both markets should soon converge.", "FIQ Bank is a highly rated corporate and institutional bank that operates a client-facing credit default swap (CDS) desk. Larry Eckle is a CDS client strategist. Mark Priore is FIQ’s chief CDS trader. Eckle and Priore are meeting with Brian Bregen, a portfolio manager for BLB Fund, to discuss investment and trading strategies for bonds, CDSs, and equities.\nBregen begins the discussion by asking for a refresher on basic CDS concepts and parameters. Eckle replies that a CDS includes both a premium leg and a payment leg and that expected loss is among the functions that affect its price. Eckle provides information for a bond issued by Apollo Company.\nExhibit 1 Information for Apollo Bond\nAmount\t$1,000.00\nCoupon\t5.00%\nMaturity\t3 years\nProbability of Default\tYear 1: 2.0%. Year 2: 2.5%. Year 3: 3.0%\nRecovery Rate\t40%\nBregen reviews the data and opines that the market is incorrectly assessing Apollo’s credit risk. He believes that Apollo’s conditional probability of default is 2.0% for Year 1, Year 2, and Year 3. Priore reviews Apollo’s CDSs and adds that the market is pricing no basis between Apollo’s bonds and its CDSs.\nBregen expresses confidence in Apollo’s credit condition over a longer cycle, stating that Apollo is likely to experience improving credit fundamentals over the next five years. Priore compares Apollo’s bonds with its CDSs. Priore notes that Apollo’s five-year bond has a 200 bp credit spread and that Apollo’s five-year CDS has a 400 bp up-front premium. The CDS is based on a 1.00% fixed coupon and has duration of four years. Priore suggests that FIQ and BLB execute a five-year naked CDS in which FIQ buys the CDS and BLB sells the CDS.\nIn building credit portfolios, Bregen conducts fundamental credit research on companies. He discusses observations on three separate companies that he has been researching. Bregen states that Webster has low leverage and that its free cash flow will increase because of its new product pipeline. Bregen describes Levrom as being highly leveraged following an acquisition whose integration, he believes, will be more complex than originally expected. Bregen shares his view that Hamsco may potentially be affected by environmental litigation following its recent purchase of a manufacturing facility that contains unremediated hazardous materials.\nPriore believes that credit research should consider the proper pricing of credit risk. He states that basis trades are used by credit investors to ensure that the credit risk of bonds and CDSs is priced appropriately. He provides bond and CDS information for Webster, Hamsco, and Levrom. The current level of MRR is 2.00%.\nExhibit 2 Information for Three-Year Bonds and Three-Year CDSs\nCompany\tBond Yield\tCDS Spread\nWebster\t5.00%\t3.00%\nHamsco\t5.50%\t3.25%\nLevrom\t5.25%\t3.50%\nEckle adds that speculation about company balance sheet recapitalizations frequently affects bond yields, CDS spreads, and stock prices. He outlines three such recapitalization scenarios for Webster, Hamsco, and Levrom and an associated CDS trade idea for each scenario.\nExhibit 3 Recapitalization Scenarios and Related Trade Ideas\n \tRecapitalization Scenario\tTrade Idea\nScenario 1\tWebster issues five-year debt to acquire 100% of Levrom equity at a premium.\tBuy Webster CDS\nScenario 2\tLevrom issues equity in a “follow-on” (post-IPO) equity offering to retire debt.\tBuy Levrom CDS\nScenario 3\tHamsco issues five-year debt to acquire 100% of its public equity at a premium.\tSell Hamsco CDS", "Eleni Petsas is a portfolio manager in the fixed-income division of PDK Wealth Management (PDKW), based in Los Angeles. Petsas is running a training session for newly hired analysts Bonita Vasquez, Neil Gorman, and Rohit Kumar to examine the use of Credit Default Swaps (CDSs) in fixed-income portfolio management.\nPetsas begins the session by asking the analysts to identify types of CDSs. Vasquez responds, “There are three types of CDS; single-name CDSs, index CDSs, and tranche CDSs. A single-name CDS is on any obligation of a specific reference entity. An index CDS allows investors to take a position on the credit risk of multiple companies, although higher credit correlations make the index CDS more expensive to purchase. Tranche CDSs also cover multiple borrowers, but losses are covered only up to a specific level.”\nPetsas notes that a payment from the credit protection seller to the credit protection buyer is triggered whenever a credit event occurs. She asks each of the analysts to identify a credit event in the United States that will trigger a payment. The following are the responses of each analyst:\n• Vasquez: “A declaration of bankruptcy by the reference entity is a credit event that will trigger a payment from the CDS seller.”\n• Gorman: “If the reference entity fails to make a scheduled interest or principal payment, it is recognized as a failure-to-pay credit event.”\n• Kumar: “A change in seniority of outstanding obligations is also recognized as a credit event that will trigger a payment by the protection seller.”\nTo facilitate a discussion of CDS pricing and CDS trading strategies, Petsas presents the group with the information in Exhibit 1.\nExhibit 1 Select CDS Information\nCDS\tType\tCredit Spread (bps)\tRecovery Rate\tTenor (yrs.)\tCoupon (bps)\tDuration\nCDX NA IG\tIndex\t59\t40%\t5\t100\t4.76\nCDX NA HY\tIndex\t328\t30%\t5\t500\t4.34\nCompany A\tSingle-Name\t194\t25%\t5\t100\t4.57\nCompany A\tSingle-Name\t266\t40%\t10\t100\t7.38\nCompany B\tSingle-Name\t165\t40%\t5\t500\t4.55\nCompany B\tSingle-Name\t326\t40%\t10\t500\t8.19\nNotes: CDX NA IG is an index of CDSs of investment-grade North American corporations. CDX NA HY is an index of CDSs of high-yield North American corporations.\nPetsas states, “I would like you to formulate appropriate CDS trading strategies using the information provided in the following statements:”\n• Statement 1: “Our economists expect the US economy to strengthen over the coming year, with spreads on high-yield CDSs tightening by 100 bps and spreads on investment-grade CDSs tightening by 8 bps.”\n• Statement 2: “Our analysts expect that the credit curve for Company A will flatten, whereas the credit curve for Company B is expected to steepen.”\n• Statement 3: “Company A has a bond with five years to maturity with a credit risk premium of 85.40 bps, and Company B has a bond with five years to maturity with a credit risk premium of 205.60 bps.”\nOnly Kumar responds, as follows: “A trade that addresses Statement 2 would be to sell Company A CDSs with a 10-year tenor and buy Company A CDSs with a 5-year tenor. Alternatively, one could buy Company B CDSs with a 10-year tenor and sell Company B CDSs with a 5-year tenor.”", "Trident Advisory Group manages assets for high-net-worth individuals and family trusts.\nAlice Lee, chief investment officer, is meeting with a client, Noah Solomon, to discuss risk management strategies for his portfolio. Solomon is concerned about recent volatility and has asked Lee to explain options valuation and the use of options in risk management.\nOptions on Stock\nLee uses the BSM model to price TCB, which is one of Solomon's holdings. Exhibit 1 provides the current stock price (S), exercise price (X), risk-free interest rate (r), volatility (σ), and time to expiration (T) in years as well as selected outputs from the BSM model. TCB does not pay a dividend.\nExhibit 1 – BSM Model for European Options on TCB\nS\tX\tr\tσ\tT\n$57.03\t55\t0.22%\t32%\t0.25\nd1\tN(d1)\td2\tN(d2)\tCall / Put\n0.3100\t0.6217\t0.1500\t0.5596\t$4.695 / $2.634\nOptions on Futures\nThe Black model valuation and selected outputs for options on another of Solomon's holdings, the GPX 500 Index (GPX), are shown in Exhibit 2. The spot index level for the GPX is 187.95, and the index is assumed to pay a continuous dividend at a rate of 2.2% (δ) over the life of the options being valued, which expire in 0.36 years. A futures contract on the GPX also expiring in 0.36 years is currently priced at 186.73.\nExhibit 2 – Black Model for European Options on the GPX Index\nGPX Index\tX\tr\tσ\tT\tδ Yield\n187.95\t180\t0.39%\t24%\t0.36\t2.2%\nModel Call\tModel Put\tMarket Call\tMarket Put\n$14.2089\t$7.4890\t$14.26\t$7.20\nDelta (call)\tDelta (put)\tGamma\tTheta (call, daily)\tRho (call, per %)\tVega (per %)\n0.6232\t–0.3689\t0.0139\t–0.0327\t0.3705\t0.4231\nAfter reviewing Exhibit 2, Solomon asks Lee which option Greek letter best describes the changes in an option's value as time to expiration declines.\nSolomon observes that the market price of the put option in Exhibit 2 is $7.20. Lee responds that she used the historical volatility of the GPX of 24% as an input to the BSM model, and she explains the implications for the implied volatility for the GPX.\nOptions on Interest Rates\nSolomon forecasts the three-month MRR will exceed 0.85% in six months and is considering using options to reduce the risk of rising rates. He asks Lee to value an interest rate call with a strike price of 0.85%. The current three-month MRR is 0.60%, and an FRA for a three-month MRR loan beginning in six months is currently 0.75%.\nHedging Strategy for the Equity Index\nSolomon's portfolio currently holds 10,000 shares of an exchange-traded fund (ETF) that tracks the GPX. He is worried the index will decline. He remarks to Lee, \"You have told me how the BSM model can provide useful information for reducing the risk of my GPX position.\" Lee suggests a delta hedge as a strategy to protect against small moves in the GPX Index.\nLee also indicates that a long position in puts could be used to hedge larger moves in the GPX. She notes that although hedging with either puts or calls can result in a delta-neutral position, they would need to consider the resulting gamma.", "High Street Investment Management is an investment subadvisory firm partnering with Registered Investment Advisors to provide counsel for options trading strategies. Scott Cummins is High Street's CEO and chief investment officer. Phyllis Schwartz leads the client relationship team. David Spelding is a recent college graduate, who just joined the firm as an analyst. Cummins and Schwartz are conducting an introductory training session on options pricing, focusing on the binomial option valuation model (i.e., the binomial model).\nCummins begins the session by listing, in Exhibit 1, variables and values for a binomial model to illustrate an outcome.\nExhibit 1 – Binomial Model Variables and Values\nVariable\tValue\nStock price (S)\tUS$100\nExercise price (X)\tUS$100\nUp factor (U)\t1.35\nDown factor (D)\t0.75\nRisk-free rate (r)\t2.00%\nSchwartz states, \"The one-period binomial model is based on the no-arbitrage approach in which an investor does not take any risk or use his own money. Based on the information in Exhibit 1, the probability of an up move is 45%. For an investor, the no-arbitrage approach is similar to both the expectations approach and the discounted cash flow approach. Each approach is based on the investor's expectation regarding the future course of the underlying stock price.\"\nSchwartz then introduces the two-period binomial model. She states that the two-period binomial lattice can be viewed as three one-period binomial lattices and that each lattice may be used to value a call option. Schwartz instructs Spelding to use the two-period binomial model and the information in Exhibit 1 to calculate the value of a two-year European-style call option.\nCummins states that long-/short-hedge fund managers seek to identify and exploit any mispricing that may exist between the price of an option and the price of its underlying stock, utilizing a replicating strategy. Cummins asks Spelding to assess the three scenarios outlined in Exhibit 2, based on the information in Exhibit 1 and assuming that the price of a one-year European-style call option is $19.25.\nExhibit 2 – Scenarios and Replicating Strategies\n\tOptions Trade\tStock Trade\tFinancing\nScenario 1\tSell\tBuy\tLend\nScenario 2\tSell\tBuy\tBorrow\nScenario 3\tBuy\tSell\tLend\nSchwartz then asks Spelding to use the information in Exhibit 1 to calculate the no-arbitrage value of a two-year US-style put option, assuming that the option may be exercised in one year.", "Athena Advisors Inc. offers portfolio replication services to pension funds and insurance companies through the use of options. Clients are typically able to replicate market exposures with smaller than normal investments of funds. Athena manages exposures for its client Wertfin Insurance Company related to annuities indexed to the German Blue Chip Equity Index. Athena portfolio manager Hannes Messer is meeting with Wertfin's risk manager, Jens Szillat, who has asked to learn more about the principles behind the option strategies being employed.\nSzillat tells Messer, \"I am somewhat familiar with option valuation models; however, I would like to learn more about Athena's methodologies with respect to the index options you are managing for our portfolio.\"\nMesser replies, \"The binomial valuation model can be applied to the two-year European style index call options we purchased one year ago. The applicable underlying instrument is the German Blue Chip Equity price index, which excludes dividends. Exhibit 1 shows the option's characteristics at the time of purchase.\"\nExhibit 1 – Binomial Model Variables\nu\t1.15\nd\t0.90\nπ\t0.52\nIndex price\tEUR 720\nStrike price\tEUR 750\nHedge ratio\t0.5697\n1-year interest rate\t3%\nS–\t648\nC–\t0\nMesser explains, \"Of course, with the index moving down 10% in the last 12 months, the payoffs with these options could have been replicated without using options.\" Szillat responds, \"My understanding is that the payoff would have been the same as the call option if you had purchased 0.5697 index units and lent EUR 356.79 at the one-year interest rate.\"\nMesser continues, \"Twelve months ago, I noted that two-year puts with a strike price of EUR750 cost EUR38.48. Using the information in Exhibit 1 and today's index value, the binomial valuation model calculates the current price of the put as EUR80.15. It is actually trading now above that price at EUR92.\"\nSzillat responds, \"I am curious whether you also use the Black–Scholes–Merton (BSM) model for valuation. I understand the BSM and binomial models both have the following three assumptions in common.\n• Assumption 1: Trading is possible at every instant.\n• Assumption 2: Volatility can be predicted with certainty.\n• Assumption 3: The annualized returns on the underlying follow a normal distribution.\"\nSzillat then asks, \"How do you utilize the BSM model?\"\nMesser answers, \"We use the BSM model to calculate estimates on a wide array of comparative option variables, such as how much the option value will change for a change in a particular parameter. For example, we can estimate how the rate of change of an option price speeds up or slows down for a given change in the price of the underlying index.\"\nMesser concludes, \"We also use the BSM model to calculate the implied volatility. The implied volatilities of the index options expiring in one year are shown in Exhibit 2.\"\nExhibit 2 – Implied Volatility Curve\nStrike Price\tImplied Volatility\n700\t18.70\n710\t17.98\n720\t17.38\n730\t16.69\n740\t15.83\n750\t15.40\n760\t14.50\n770\t14.03\n780\t13.21\n790\t12.11\n800\t11.09", "Jane Lee is the new chief investment officer of the Eastland University Endowment Fund (the Fund). Historically, the Fund has invested based on a 60% equity/40% fixed-income allocation. However, Lee is looking to change the fund’s allocation to include real estate assets after incorporating data from the appraisal-based Global Real Estate Fund Index. GREFI returns and volatilities imply strong risk-adjusted performance from real estate assets with low correlation with stocks and bonds. Lee is considering the following two asset allocations:\nAllocation 1: 50% equity/35% fixed income/15% real estate\nAllocation 2: 55% equity/35% fixed income/10% real estate\nAllocation 1 is based on an allocation model incorporating the GREFI data, while Allocation 2 assumes a higher correlation between real estate and other asset classes in an attempt to adjust for smoothing and therefore has a lower real estate market allocation.\nLee recently hired Jon Tarrow as the Fund’s new head of real estate. During a recent meeting, Tarrow and Lee concluded that the initial real estate investment strategy would be to acquire stabilized office buildings located in primary markets. Tarrow has been working on the potential acquisition of a 100% occupied Class A office building located in New York City. Tarrow and his junior analyst will conduct a thorough due diligence process for the property. Tarrow has also hired an appraiser to value the building and provide valuation support. The appraiser will use three different approaches to estimate the building’s value but will place emphasis on both the direct capitalization and the discounted cash flow methods.\nDuring an internal meeting, the junior analyst makes the following three statements about the appraiser’s two primary valuation methods:\nStatement 1: The direct capitalization method requires an estimation of a terminal value.\nStatement 2: Properties expected to generate faster growth will require a capitalization rate that results in a higher value.\nStatement 3: The direct capitalization and discounted cash flow methods both consider growth and property quality.\nThe appraiser has concluded that net operating income for the New York City office building is expected to be USD15.6 million for the first year, and after that, NOI is expected to increase at 0.50% annually for the foreseeable future. The building’s value is also expected to increase by 0.50% annually, and investors expect to achieve a 5.75% required rate of return given the level of risk.\nAfter considering the appraiser’s valuation, Lee then tells Tarrow that she can negotiate a purchase price of USD283 million for the building. Furthermore, she can procure a loan with an interest-only 5.25% coupon provided that the loan-to-value ratio does not exceed 65% and the debt service coverage ratio is at least 1.65×, with the loan balance due after 10 years.", "Amanda Rodriguez is an alternative investment analyst for a US investment management firm, Delphinus Brothers. Delphinus’s chief investment officer, Michael Tang, has informed Rodriguez that he wants to reduce the amount invested in traditional asset classes and gain exposure to the real estate sector by acquiring commercial property in the United States. Rodriguez is asked to analyze potential commercial real estate investments for Delphinus Brothers. Selected data on three commercial real estate properties are shown in Exhibit 1.\nExhibit 1: Selected Property Data\n\tProperty 1\tProperty 2\tProperty 3\nProperty type\tDowntown Office Building\tGrocery-Anchored Retail Center\tMulti-Family Building\nLocation\tNew York City\tMiami\tBoston\nAge\t10 years\t7 years\t5 years\nOccupancy\t90.00%\t93.00%\t95.00%\nSquare feet or number of units\t100,000 sf\t205,000 sf\t360,000 sf\nGross potential rental income\t$4,750,000\t$1,800,000\t$3,100,000\nLoss to lease\t($475,000)\t($90,000)\t$155,000\nGross rental income\t$5,225,000\t$1,890,000\t$2,945,000\nVacancy loss\t($564,333)\t($156,887)\t($157,250)\nNet rental income\t$4,660,667\t$1,733,113\t$2,787,750\nExpense reimbursement revenue\t$333,333\t$426,248\t$0\nOther income (includes % rent)\t$560,000\t$15,000\t$45,000\nEffective gross income\t$5,554,000\t$2,174,361\t$2,832,750\nProperty management fees\t($203,160)\t($83,374)\t($119,510)\nOther operating expenses\t($2,100,000)\t($342,874)\t($1,175,000)\nNet operating income\t$3,250,840\t$1,748,113\t$1,538,240\nRodriguez asks Tang about the relative magnitudes of operating expenses in determining property NOI. Tang explains that the retail center in Miami is able to be fully reimbursed for its operating expenses but that the office property in New York City and the multi-family property in Boston must absorb considerable unreimbursed operating expenses.\nTang comments to Rodriguez that these three properties may be in different phases of the real estate cycle. He specifically cites the differences between gross potential rental income and gross rental income in making his argument. In response to Tang’s comments, Rodriguez makes the two following statements about the office building in New York City:\nStatement 1: I believe that the office market in New York City is likely to enter the recovery stage of the real estate cycle within two years.\nStatement 2: I believe that the high vacancy rates indicate that the net operating income of the office building has the potential to improve within two years.\nTang continues the conversation by commenting about the relative riskiness of various types of real estate given such developments as the COVID-19 pandemic, the movement toward remote working, and the evolution of internet-based retail.\nRodriguez asks Tang about the appropriateness of various valuation methods on these three properties. Tang suggests that the sales comparison approach is likely to be useful, but he is particularly interested in seeing the valuation results from an income approach for each of the three properties.", "Michael Tang, the chief investment officer of Delphinus Brothers, asks an analyst at the firm, Amanda Rodriguez, to focus her analysis on the 100,000 square foot office property in New York City (introduced in the previous question set). Tang believes that Delphinus can purchase the property for USD50 million.\nRodriguez begins her analysis by assembling the data shown in Exhibit 1.\nExhibit 1: Six-Year NOI and DCF Assumptions for New York City Office Property\n\tYear 1\tYear 2\tYear 3\tYear 4\tYear 5\tYear 6\nNOI\t$3,250,840\t$3,185,823\t$3,217,681\t$3,265,947\t$3,339,430\t$3,439,613\nDCF assumptions\t\nInvestment holding period\t5 years\nGoing-in cap rate\t6.50%\nTerminal cap rate\t6.00%\nDiscount rate\t9.00%\nUsing the data from Exhibit 1, Rodriguez is able to compute a value of USD49.9 million for this property using the DCF method. After Rodriguez presents this valuation to Tang, Tang is surprised that the analysis does not demonstrate that the property is underpriced. Tang asks Rodriguez to value the property using the sales comparison method, and she compiles the data shown in Exhibit 2.\nExhibit 2: Sales Comparison Data for Comparable Office Properties\nVariable\tNYC Office\tSales Comp A\tSales Comp B\tSales Comp C\nAge (years)\t10\t5\t12\t25\nCondition\tGood\tExcellent\tGood\tAverage\nLocation\tPrime\tSecondary\tSecondary\tPrime\nSale price (per ft2)\t\t$415/ft2\t$395/ft2\t$400/ft2\nAdjustment: Age\t\t–10%\t2%\t10%\nAdjustment: Condition\t\t–10%\t0%\t10%\nAdjustment: Location\t\t15%\t15%\t0%\nTotal adjustments\t\t–5%\t17%\t20%\nTo conclude her valuation work on the office property, Rodriguez compiles detailed data on the replacement costs of the office building, its land value, and the total depreciation. She finds that the cost of constructing a building identical to the subject property is USD57 million. The land value is USD7 million, and the total depreciation is USD5 million. From these data, she calculates a value of the property using the cost approach.\nRodriguez presents her valuation findings to Tang. After a thorough review of the valuation including consideration of a variety of scenarios, Tang decides to proceed with plans to purchase the office property in New York City. He contacts several potential lenders, ultimately deciding to contract with Rich Life Insurance, a publicly traded company with extensive investments in commercial real estate, to discuss terms on arranging a loan of USD35 million.", "Matteo Rossi is a financial adviser specializing in commercial real estate investing. He meets with Anika Patel, a new client, who wants to diversify her portfolio by adding real estate investments to it.\nUsing data from an appraisal-based index, Rossi discusses real estate return and risk statistics with Patel and compares them to the return and risk of Patel's current portfolio of stocks and bonds. Based on Patel's investment objectives, Rossi recommends the following types of investments:\n• Investment 1: A real estate operating company (REOC);\n• Investment 2: An equity real estate investment trust (REIT).\nPatel asks Rossi how REITs and REOCs are valued. Rossi mentions that the following measures are widely used in the valuation of REITs and REOCs:\n• Measure 1: EBITDA;\n• Measure 2: Funds from operations (FFO);\n• Measure 3: Adjusted funds from operations (AFFO).\nNext, Rossi presents Patel with the valuation of a REIT. REIT A is a multi-family REIT and its NAV is calculated based on the net operating income (NOI) information in Exhibit 1.\nExhibit 1\n\tREIT A\nProperty subsector\tMulti-family\nLast-12-month real estate NOI\t$280,000\nLast-12-month non-cash rent\t$9,800\nLast-12-month capital expenditures\t$40,000\nCash and equivalents\t$69,300\nTotal debt\t$823,000\nDiscount rate\t6.5%\nEstimated growth rate\t1.5%\nShares outstanding\t50,000", "Snohomish Mukilteo is a portfolio analyst for the Puyallup-Wenatchee Pension Fund (PWPF). PWPF’s investment committee (IC) asks Mukilteo to research adding hedge funds to the PWPF portfolio.\nA member of the IC meets with Mukilteo to discuss hedge fund strategies. During the meeting, the IC member admits that her knowledge of hedge fund strategies is fairly limited but tells Mukilteo she believes the following:\nStatement 1: Equity market-neutral strategies use a relative value approach.\nStatement 2: Event-driven strategies are not exposed to equity market beta risk.\nStatement 3: Opportunistic strategies have risk exposure to market directionality.\nThe IC member also informs Mukilteo that for equity-related strategies, the IC considers low volatility to be more important than negative correlation.\nMukilteo researches various hedge fund strategies. First, Mukilteo analyzes an event-driven strategy involving two companies, Algona Applications (AA) and Tukwila Technologies (TT). AA’s management, believing that its own shares are overvalued, uses its shares to acquire TT. The IC has expressed concern about this type of strategy because of the potential for loss if the acquisition unexpectedly fails. Mukilteo’s research reveals a way to use derivatives to protect against this loss, and he believes that such protection will satisfy the IC’s concern.\nNext, while researching relative value strategies, Mukilteo considers a government bond strategy that involves buying lower-liquidity, off-the-run bonds and selling higher-liquidity, duration-matched, on-the-run bonds.\nMukilteo examines an opportunistic strategy implemented by one of the hedge funds under consideration. The hedge fund manager selects 12 AAA rated corporate bonds with actively traded futures contracts and approximately equal durations. For each corporate bond, the manager calculates the 30-day change in the yield spread over a constant risk-free rate. He then ranks the bonds according to this spread change. For the bonds that show the greatest spread narrowing (widening), the hedge fund will take long (short) positions in their futures contracts. The net holding for this strategy is market neutral.\nMukilteo also plans to recommend a specialist hedge fund strategy that would allow PWPF to maintain a high Sharpe ratio even during a financial crisis when equity markets fall.\nThe IC has been considering the benefits of allocating to a fund of funds (FoF) or to a multi-strategy fund (MSF). Mukilteo receives the following email from a member of the IC:\n“From my perspective, an FoF is superior even though it entails higher manager-specific operational risk and will require us to pay a double layer of fees without being able to net performance fees on individual managers. I especially like the tactical allocation advantage of FoFs—that they are more likely to be well informed about when to tactically reallocate to a particular strategy and more capable of shifting capital between strategies quickly.”\nFinally, Mukilteo creates a model to simulate adding selected individual hedge fund strategies to the current portfolio with a 20% allocation. The IC’s primary considerations for a combined portfolio are (1) that the variance of the combined portfolio must be less than 90% of that of the current portfolio and (2) that the combined portfolio maximize the risk-adjusted return with the expectation of large negative events. Exhibit 1 provides historical performance and risk metrics for three simulated portfolios.\nExhibit 1: Performance of Various Combined Portfolios\nHedge Fund Strategy\tStandard Deviation (%)\tSharpe Ratio\tSortino Ratio\tMaximum Drawdown (%)\nCurrent Portfolio (NA)\t7.95\t0.58\t1.24\t14.18\nMerger arbitrage (20% allocation)\t7.22\t0.73\t1.35\t5.60\nSystematic futures (20% allocation)\t6.94\t0.83\t1.68\t8.04\nEquity market neutral (20% allocation)\t7.17\t0.73\t1.80\t10.72", "Arturo Rivas is the research manager for alternative investments at the Raritan Bay Endowment Fund. He is attending a conference where hedge fund managers are presenting a broad spectrum of investment strategies. He will take this opportunity to review their presentations, offering memorandums (OMs), and limited partnership agreements and engage in one-on-one meetings. The due diligence will allow him to recommend hedge fund managers and strategies to the endowment’s investment committee.\nRivas reads the OM for the Gemini Fund to evaluate its strategy and performance. He notices the following points in the OM:\n“Gemini specializes in the fundamental analysis of global companies in order to establish equity positions for its funds. We believe we have a particular advantage in valuing and actively shorting European companies in the technology, media, and communication sectors. Market timing does not play a role in our investment process. Our style is to take concentrated bets and use leverage to express our convictions. The primary focus is to have our analysts uncover irregularities in the financial reporting of companies and to exploit the potential impact on valuations when the irregularities become known. Our performance goal is to achieve returns that beat the equity market index return with 50% lower volatility. In order to diversify the portfolio, we also maintain value-oriented long positions. On average, the fund is 30%–60% net short the market.”\nRivas reviews managers that focus on event-driven strategies. In particular, the Pegasus Fund focuses on situations where a company has made a cash-for-stock or stock-for-stock offer for a target company. Its strategy takes a view that the merger will fail or that it can succeed, depending on Pegasus’s analysis. The range of returns using a modest degree of leverage is between 5% and 10% per deal if successful. Equities are the primary securities used in the merger arbitrage strategy, but Pegasus also uses convertible bonds, options, and senior and junior debt. A common trade is to take a long position in the target company and a short position in the acquirer. Despite the modest return targets, an attraction for investors is the high Sharpe ratio associated with the strategy.\nRivas evaluates the Orion Fund, a convertible bond strategy. Orion’s OM provides various examples of trades that its manager uses to generate alpha. Rivas reviews one of the many strategies Orion’s manager uses frequently, because he believes this is the best way to understand the fund’s investment style. The OM provides the data in Exhibit 1 from a trade the manager recently entered into.\nExhibit 1: Orion Fund Convertible Bond Arbitrage Position\nSecurity/Position Description\tTrade Direction\tRationale\n3% Convertible Bond due 6/1/2050\tLong\tPurchase new issue\nCommon Stock\tShort\tDelta-adjusted position\nCredit Default Swap\tShort\tHedge credit risk\nInterest Rate Swap\tShort\tDuration-neutral hedge\nPut Option on Stock\tLong\tOnly in place of delta hedging\nLeverage\tLong/Short\tTypically 300% long vs. 200% short\nRivas moves on to a specialist hedge fund strategy that focuses exclusively on volatility trading. Adding this fund to an investor’s portfolio strives to hedge long equity positions. The Taurus Fund typically implements the following three trades in its strategy:\n• Trade 1: Sell exchange-traded and over-the-counter equity call options on a market index. Selection of the options depends on the volatility smile and skew.\n• Trade 2: Sell VIX futures to capture the volatility premium and roll-down payoff.\n• Trade 3: Purchase a receiver volatility swap with an at-inception fair value of zero.", "Alise Pukitis works as an analyst for Winter Stone Associates. Winter Stone is a hedge fund consulting specialist that provides analysis and access to hedge funds for family offices and high-net-worth investment advisers. Amy Chu is a senior wealth adviser with Brownstein Legacy Associates who has engaged Winter Stone to educate the firm on current investment opportunities within the hedge fund universe.\nIn an initial meeting with Chu, Pukitis provides a summary of the hedge fund landscape. Brownstein has historically invested in traditional long-only investment strategies in public markets for its clients. Pukitis tells Chu to expect the following characteristics when reviewing the hedge fund universe:\nCharacteristic 1: Less regulatory oversight and a relatively narrow investment universe.\nCharacteristic 2: Less aggressive investment styles and increased use of leverage.\nCharacteristic 3: Investor-aligned fee structures and typically higher returns from privately placed versus liquid alternative strategies.\nPukitis explains that hedge funds are categorized and tracked by type. Exhibit 1 shows the six broad hedge fund categories tracked by Winter Stone.\nExhibit 1: Hedge Fund Categories Tracked by Winter Stone\nHedge Fund Category\tIncluded Hedge Fund Strategies\nEquity related\tLong-short equity, dedicated short bias, equity market neutral\nEvent-driven strategies\tMerger arbitrage, distressed securities\nRelative value\tFixed-income arbitrage, convertible bond arbitrage\nOpportunistic\tGlobal macro, managed futures, reinsurance\nSpecialist\tVolatility strategies involving options\nMultimanager\tMultistrategy, funds of hedge funds\nAfter reviewing the information, Chu tells Pukitis that she would like to receive more information on equity-related strategies. Pukitis makes the following statements to Chu regarding equity-related hedge fund managers:\nStatement 1: The most attractive feature of long–short equity managers is the lower beta sensitivity to equity markets than long-only equity managers.\nStatement 2: Dedicated short-bias managers typically benefit from higher levels of leverage and more frequent use of leverage than long–short or equity market neutral strategies.\nStatement 3: Equity market–neutral managers are likely to have high levels of diversification and turnover ratios.\nBrownstein’s investment committee has identified the following characteristics it is seeking in the selection of a hedge fund manager: low to moderate levels of leverage, idiosyncratic alpha, long biased, and no concerns about investing in an illiquid strategy. Chu reviews a number of strategies on Winter Stone’s recommended list but is having a difficult time determining which strategy will meet the needs of Brownstein’s investment committee. She reaches out to Pukitis for help identifying the appropriate strategy to bring to the committee for approval.", "Julie Carlisle is a financial planner at a large wealth management firm. One of her clients, Esteban Blake, just received a sizable inheritance. He invests a portion of the inheritance in an annuity that will immediately increase his income by a substantial amount. He enlists Carlisle’s help to invest the remaining amount of the inheritance.\nBlake informs Carlisle that he would like some short-term bonds in his portfolio. Carlisle proposes purchasing a one-year domestic government zero-coupon bond. It has a face value of $100 and is currently priced at $96.37. Carlisle estimates the one-year real risk-free rate at 1.15% and expects inflation over the next year to be 2.25%.\nIn an effort to provide Blake with some exposure to international markets, Carlisle proposes three countries to look for investment opportunities. Selected data on the three countries are presented in Exhibit 1.\nExhibit 1\nSelected Macroeconomic Data\n\tNominal GDP Growth\tInflation Rate\tVolatility of Real GDP Growth\tYield Curve Shape\tTrailing 12-Month Equity Index P/E\nCountry #1\t6.5%\t4.0%\tLow\tFlat\t16.5\nCountry #2\t5.0%\t2.5%\tHigh\tUpward slope\t17.3\nCountry #3\t3.5%\t2.0%\tLow\tFlat\t18.2\nIn her analysis, Carlisle observes that the spread between the three-year default-free nominal bond and the default-free real zero-coupon bond in Country #3 is 2.0%.\nBlake expresses concern that stocks may be currently overvalued in Country 3 given its 20-year historical equity index P/E of 16.0. Carlisle comments,\nI think the equilibrium P/E in Country #3 has increased because of changes in market conditions.\nCarlisle predicts that Country #3 will slip into a recession next quarter. She thinks it will be short-lived, lasting only 12 months or so, and considers the impact of such a recession on the performance of the country’s stocks and bonds.\nExhibit 2\nThree-Year Corporate Bonds from Country #3\nCorporate Bond\tMoody’s Investors Service Rating\tSpread*\nBond A\tAaa\t1.4%\nBond B\tBaa1\t3.2%\nBond C\tB3\t5.3%\n*Spread versus three-year sovereign bond", "Liam Ferguson works as an equity portfolio manager for Antrim Capital Partners, a wealth management firm located in Belfast, Northern Ireland. Antrim specializes in managing equity and commercial real estate portfolios for institutional investors throughout Europe.\nJoanne Donaghy, a representative of a large investment consulting firm, is considering recommending Antrim to institutional clients. As part of her due diligence, Donaghy is engaged in discussions with members of Antrim’s investment team, including Ferguson. She asks Ferguson to explain how Antrim’s process considers the relationship between the business cycle and earnings growth expectations. Ferguson makes the following observations:\nObservation 1:\n“Toward the end of a recession, corporate profit growth increases, resulting in a negative risk premium.”\nObservation 2:\n“The earnings of cyclical companies are considered a leading indicator for broader economic growth.”\nObservation 3:\n“During recessions, equities offer a good hedge against bad consumption outcomes.”\nFerguson describes how Antrim assesses overall market valuations using several measures, including the market P/E multiple. Ferguson describes changes in factors that could impact valuations and contribute to higher P/E multiples, including an increase in the equity risk premium, decreasing volatility of real GDP growth, and an increase in uncertainty regarding future inflation.\nDonaghy is interested in understanding Antrim’s approach to commercial real estate investing. As part of her diligence, she speaks with Colleen McKenna, head of Antrim’s real estate team. Donaghy asks McKenna for her view on the role of commercial real estate in diversified portfolios. McKenna responds that commercial real estate investments have both equity- and bond-like characteristics. She further explains, “From a bond-like perspective, rental income can be viewed as analogous to the coupon income derived from a bond, especially in countries with “upward only” restrictions that help protect property owners. Changes in property values resulting from the state of the underlying economy and any redevelopment opportunities provide an equity-like dimension to the investment.”\nMcKenna decides to walk Donaghy through a pricing example of the commercial properties in the portfolio to understand the pricing dynamics of this market. She explains that the fundamental present value formula can be applied to commercial real estate: “The numerator of the present value formula is comprised of the sum of future expected rent payments. The denominator reflects a discount rate that can vary depending on type of tenant and lease structure. For example, the discount rate for a property leased to a developed market government tenant paying rent indexed to inflation would reflect the real default-free rate, a risk premium for the uncertainty of the property value at the end of the lease, and a risk premium for the illiquidity of the property. If this property were instead leased to a commercial tenant paying fixed-rate nominal rent, the discount rate would also reflect expected future inflation, a risk-premium for future inflation uncertainty, and a risk premium for credit risk.”", "Andrew Rutherford is a fixed-income analyst with Quantum Credit Advisers, an institutional investment management company. Quantum offers a variety of fixed-income oriented investment strategies, including a core-plus-bond strategy as well as a popular long–short credit hedge fund. Rutherford participates in Quantum’s weekly fixed-income committee meetings.\nA macro topic for this week’s fixed-income committee is the possibility that the US Federal Reserve Board (Fed) will raise the federal funds rate (FFR) 25 bps at their next meeting. Quantum’s committee believes that the Fed is likely to hold off raising the FFR for at least six months because of weak economic data, and that weakness will be seen in the upcoming payroll numbers. Quantum expects the monthly non-farm payroll report to show that the US labor market added only 90,000 jobs this month, roughly in line with consensus expectations. The committee is debating what will happen to the short end of the US yield curve (and what will happen subsequently to short-dated bond prices) if the payroll report comes in at the level they expect.\nQuantum’s committee forecasts weaker-than-expected GDP growth in the future and expects that GDP growth will be more volatile as the economy ultimately adjusts to a changing interest rate policy. Rutherford believes these factors will exert downward pressure on short-term Treasury Inflation-Protected Securities (TIPS) rates.\nAs part of Rutherford’s analysis, he forecasts the real one-year risk-free rate to be 0.25% and average inflation over the next year to be 1.5%. A zero-coupon nominal Treasury bond with 1-year to maturity and a par value of $100 is currently trading at $98.05. Rutherford notes the discrepancy in market pricing relative to his forecasts.\nDiana Coombs is a senior credit analyst at Quantum. Based on the GDP outlook from the committee, she evaluates three bonds from different sectors (shown in Exhibit 1) for a potential new short position in the company’s hedge fund. All three bonds mature in five years.\nExhibit 1 Credit Market Observations\n\tEconomic Sector\tDebt/Capital\tEnterprise Value/EBITDA\tSpread to Treasuries (bps)\tCredit Rating\nBond 1\tPharmaceutical\t52.2%\t7.2\t255\tBaa2\nBond 2\tConsumer Discretionary\t48.3%\t7.8\t220\tBaa1\nBond 3\tSoft Drinks\t32.3%\t8.5\t210\tA3\nQuantum is looking to enhance its equity offerings. It has recently hired David Wu to help construct a quantitative equity rotation strategy that will use economic input from the fixed-income committee. Wu has a background in quantitative modeling of equity markets and is tasked with developing an aggregate earnings forecasts. He is also working on incorporating a target equity risk premium into an equity rotation model. Wu makes the following observations based on his prior experiences:\n• Observation 1: The equity premium should be larger than, and positively correlated with, the corporate bond premium.\n• Observation 2: Corporate profitability is a leading economic indicator.\n• Observation 3: Equities provide superior consumption-hedging properties to high-quality bonds.\nThe equity rotation model can allocate between small- and large-cap stocks and growth and value stocks and can take targeted sector positions to enhance returns relative to the broader equity market. As the model is nearing completion, Wu evaluates how it would have performed during previous economic cycles. He runs extensive backtesting and observes the following tendencies of the model in the aftermath of recessions:\n• Rotates from consumer discretionary to consumer staple stocks\n• Rotates from large-cap growth stocks into large-cap value stocks\n• Rotates from small-cap value stocks to mid-cap value stocks", "James Frazee is chief investment officer at H&F Capital Investors. Frazee hires a third-party adviser to develop a custom benchmark for three actively managed balanced funds he oversees: Fund X, Fund Y, and Fund Z. (Balanced funds are funds invested in equities and bonds.) The benchmark needs to be composed of 60% global equities and 40% global bonds. The third-party adviser submits the proposed benchmark to Frazee, who rejects the benchmark based on the following concerns:\nConcern 1: Many securities he wants to purchase are not included in the benchmark portfolio.\nConcern 2: One position in the benchmark portfolio will be somewhat costly to replicate.\nConcern 3: The benchmark portfolio is a float-adjusted, capitalization-weighted portfolio.\nAfter the third-party adviser makes adjustments to the benchmark to alleviate Frazee’s concerns, Frazee accepts the benchmark portfolio. He then asks his research staff to develop risk and expected return forecasts for Funds X, Y, and Z as well as for the benchmark. The forecasts are presented in Exhibit 1.\nExhibit 1\nForecasted Portfolio Statistics for Funds X, Y, and Z and the Benchmark\n\tFund X\tFund Y\tFund Z\tBenchmark\nPortfolio weights:\t\t\t\t\nGlobal equities (%)\t60.0\t65.0\t68.0\t60.0\nGlobal bonds (%)\t40.0\t35.0\t32.0\t40.0\n\t\t\t\t\nExpected return (%)\t10.0\t11.6\t13.2\t9.4\nExpected volatility (%)\t17.1\t18.7\t22.2\t16.3\nActive risk (%)\t5.2\t9.2\t15.1\tN/A\nSharpe ratio (SR)\t0.45\t0.50\t0.49\t0.44\nNote: Data are based on a risk-free rate of 2.3%.\nFrazee decides to add a fourth offering to his group of funds, Fund W, which w

 "선물 성분 − 채권 성분은 call입니다."}, "orig": "Deriv · ECO Module 2 Q83", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q87", "src": "ECO 오답", "module": "07-2", "tag": "특별배당 → put 가치 ↑ → short put 손해", "vig": null, "stem": "An investment manager sells 6-month put options on a company's shares. Two months later, the company announces a special dividend payable to shareholders at the end of the month. Based on the Black–Scholes–Merton model, the special dividend will:", "opts": {"A": "reduce the return on the put option position.", "B": "not impact the return on the put option position.", "C": "increase the return on the put option position."}, "ans": "A", "en": "A special dividend during the option's life increases carry benefits, lowering call values and raising put values. The manager is short puts, so the higher put value reduces the position's return.", "ko": "옵션 기간 중 특별배당은 carry benefit 증가 → call 가치 ↓, put 가치 ↑. 매니저는 put을 판 쪽이라 put 가치가 오르면 손해(수익률 감소)입니다.", "trap": "배당 ↑ → 주가 하락 예상 → put ↑. 포지션이 short인지 long인지 확인할 것.", "f": "배당(carry benefit) ↑ ⇒ c ↓, p ↑", "why": {"B": "옵션 기간 중 배당은 옵션 가치에 영향을 줍니다.", "C": "Put 가치가 오르는데 매니저는 put을 팔았으므로 손해입니다."}, "orig": "Deriv · ECO Module 2 Q87", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q90", "src": "ECO 오답", "module": "07-2", "tag": "IV는 행사가·만기별로 다름", "vig": null, "stem": "Which of the following statements about implied volatility is least accurate? In practice, the implied volatility of options:", "opts": {"A": "is constant across exercise price and time to expiration.", "B": "may be used to revalue existing option positions over time.", "C": "makes it easier to understand the current market price of various risk exposures."}, "ans": "A", "en": "False statement: in practice implied volatility varies across exercise prices and times to expiration (and through calendar time). The other two are accurate uses of implied volatility.", "ko": "틀린 설명입니다. 실제로 IV는 행사가와 만기에 따라 다르고, 시간이 지나며 바뀝니다. 나머지 두 개(기존 포지션 재평가, 위험의 시장가격 파악)는 맞는 설명입니다.", "trap": "'least accurate' 문제. BSM은 변동성이 일정하다고 가정하지만 실제 IV는 smile·term structure가 있다.", "f": "IV = f(X, T, 시간)", "why": {"B": "맞는 설명입니다. IV가 바뀌면 그것으로 기존 포지션을 다시 평가할 수 있습니다.", "C": "맞는 설명입니다. 가격 대신 IV로 호가하면 위험의 시장가격을 이해하기 쉽습니다."}, "orig": "Deriv · ECO Module 2 Q90", "subject": "Deriv"}, {"id": "Deriv:ECO-M2-Q95", "src": "ECO 오답", "module": "07-2", "tag": "1기간 이항 call – π에 1 + r", "vig": null, "stem": "An analyst gathers the following information about a non-dividend paying stock:\nCurrent stock price\t€60\nCall option exercise price\t€60\nPeriodically compounded risk-free interest rate\t4%\nIn one period, the stock price will either rise to €66 or decline to €54. Based on the one-period binomial option pricing model, the value of the call option is closest to:", "opts": {"A": "€2.88.", "B": "€4.04.", "C": "€4.37."}, "ans": "B", "en": "u = 1.10, d = 0.90, π = (1.04 − 0.90)/(1.10 − 0.90) = 0.70. c+ = 6, c− = 0. c = 0.70 × 6/1.04 = 4.04.", "ko": "u = 1.10, d = 0.90, π = (1.04 − 0.90)/0.20 = 0.70. c = 0.70 × 6/1.04 = 4.04.", "trap": "π 분자는 (1 + r − d)다. 1 − d로 쓰면 틀린다. 기대값은 할인(PV)한다.", "f": "π = (1 + r − d)/(u − d),  c = π c+ / (1 + r)", "why": {"A": "π에서 1 + r 대신 1을 써서 π = 0.5로 계산한 값입니다.", "C": "기대값을 할인하지 않고 1.04를 곱한 값입니다."}, "orig": "Deriv · ECO Module 2 Q95", "subject": "Deriv"}, {"id": "AI:ECO-M2-Q3", "src": "ECO 오답", "module": "08-2", "tag": "Due diligence: 100% 임대 → Current lease review", "vig": 57, "stem": "Which of the following phases of the due diligence process is most likely to ensure that the building’s NOI projection for the next year is correct?", "opts": {"A": "Documentation review", "B": "Current lease review", "C": "Future lease outlook"}, "ans": "B", "en": "B is correct. Currently, the building is 100% occupied, so the current lease review would provide information as to whether there will be any leases up for renewal during the next year, which ensures that the NOI projections are correct.\nA is incorrect because documentation review ensures that there are no legal issues that may complicate the purchase of the building.\nC is incorrect given that the building is 100% occupied, so the outlook for re-leasing space is not likely to be included in NOI projections.", "ko": "건물이 100% 임대 중이므로 내년 NOI는 현재 임대계약(만기·임대료·연체 이력)에 달려 있습니다. 그래서 current lease review가 NOI 추정 검증에 가장 중요합니다.", "trap": "공실 없음 → future lease outlook(재임대 전망)은 해당 사항이 거의 없음. Documentation review = 법적 권리(lien 등).", "f": "", "why": {"A": "서류 검토는 권리관계(lien, 소유권 분쟁) 같은 법적 문제를 확인하는 단계입니다.", "C": "100% 임대 상태라 빈 공간 재임대 전망은 내년 NOI 추정에 거의 들어가지 않습니다."}, "orig": "AI · ECO Module 2 Q3", "subject": "AI"}, {"id": "AI:ECO-M2-Q5", "src": "ECO 오답", "module": "08-2", "tag": "최대 대출액: LTV vs DSCR 중 작은 값", "vig": 57, "stem": "The maximum loan amount that the Fund can obtain on the New York City office building is closest to:", "opts": {"A": "USD111.5 million.", "B": "USD180.1 million.", "C": "USD184 million."}, "ans": "B", "en": "B is correct. Based on the LTV, the maximum loan amount would be 65% of 283 million, or 183.95 million, with a DSC of 1.62×, which is below the 1.65 minimum. However, with a minimum DSC of 1.65×, the maximum debt service would be 15,600,000/1.65 = 9,454,545. This amount is the mortgage payment that would result in a 1.65× DSC for an interest-only loan. If the loan is interest only, then we can obtain the loan amount by simply dividing the mortgage payment by the interest rate. Therefore, the loan amount would be 9,454,545/0.0525 = 180,086,580 (= 180,100,000 after rounding). Because the loan amount based on the minimum DSC results in a lower loan amount, that would be the maximum amount that could be borrowed.\nResponse A is incorrect because USD117,100,000 is incorrectly calculated as follows:\n283,000,000/1.65 = 180,086,580.\n180,086,580 × 65% = 111,484,848 (= 111,500,000 after rounding).\nC is incorrect because USD184 million is the rounded loan amount based on the maximum LTV of 65%. Because the loan amount based on the minimum DSC results in a lower loan amount, USD180,086,580 ($180,100,000 rounded) would be the maximum loan amount that could be borrowed.", "ko": "LTV 기준: 283m × 65% = 183.95m. DSCR 기준: 부채상환액 = 15.6m / 1.65 = 9.4545m → 이자만 내는 대출이므로 대출액 = 9.4545m / 5.25% = 180.09m. 둘 중 작은 USD180.1m이 최대.", "trap": "두 기준 중 '더 낮은' 금액이 한도. 이자만 내는 대출 → 대출액 = 상환액 / 금리.", "f": "Debt service = NOI / DSCR ; Loan = Debt service / 금리 ; Max loan = min(LTV × 가치, DSCR 기준)", "why": {"A": "가치를 DSCR로 나눈 뒤 LTV를 곱하는 엉뚱한 계산입니다.", "C": "LTV 기준 금액입니다. 이 금액이면 DSCR이 1.62×로 최소 1.65×에 못 미칩니다."}, "orig": "AI · ECO Module 2 Q5", "subject": "AI"}, {"id": "AI:ECO-M2-Q7", "src": "ECO 오답", "module": "08-2", "tag": "Loss to lease로 사이클 판단", "vig": 58, "stem": "Which of the following properties is least likely to be in the oversupply phase of its real estate cycle, based on Tang’s argument?", "opts": {"A": "The office building in New York City", "B": "The retail center in Miami", "C": "The multi-family complex in Boston"}, "ans": "C", "en": "C is correct. The difference between gross potential rental income and gross rental income is represented by the loss to lease figure. A positive loss to lease reflects that current lease rates are lower than potential lease rates. The multi-family complex in Boston is the only property of the three for which gross rental income is lower than potential income. This is likely due to a lack of supply of rental housing. Responses A and B are both incorrect because the negative loss to lease may indicate excess supply and a likelihood that lease rates are decreasing.", "ko": "Loss to lease = gross potential(시장 임대료) − gross rental(기존 계약). 보스턴은 +155,000 → 시장 임대료가 기존 계약보다 높아 공급 부족(oversupply 아님). 뉴욕·마이애미는 음수 → 시장 임대료가 기존 계약보다 낮아 공급 과잉 가능성.", "trap": "양수 = 시장 임대료 > 계약 임대료(상승기). 음수 = 시장 임대료 하락(공급 과잉 신호).", "f": "Loss to lease = GPRI − GRI (Exhibit 기준)", "why": {"A": "뉴욕 오피스는 loss to lease가 음수라 공급 과잉 국면일 가능성이 있습니다.", "B": "마이애미 리테일도 음수라 공급 과잉 국면일 가능성이 있습니다."}, "orig": "AI · ECO Module 2 Q7", "subject": "AI"}, {"id": "AI:ECO-M2-Q11", "src": "ECO 오답", "module": "08-2", "tag": "Terminal value = (n+1)년 NOI / terminal cap", "vig": 59, "stem": "Which of the following amounts is closest to the undiscounted terminal value of the New York City office property at the end of the five-year investment holding period?", "opts": {"A": "USD57.3 million", "B": "USD52.9 million", "C": "USD55.7 million"}, "ans": "A", "en": "A is correct. Terminal value is calculated by dividing the sixth-year NOI by the terminal cap rate of 6% (3,439,613/0.06). Response B is incorrect because this amount is obtained by dividing the sixth-year NOI by the going-in cap rate. Response C incorrectly uses the fifth-year NOI instead of the sixth-year NOI.", "ko": "5년 보유 → 종가 = 6년차 NOI / terminal cap rate = 3,439,613 / 0.06 = USD57.3m.", "trap": "5년차가 아니라 6년차 NOI, going-in이 아니라 terminal cap rate.", "f": "TV_n = NOI_{n+1} / terminal cap rate", "why": {"B": "6년차 NOI를 going-in cap rate(6.5%)로 나눈 값입니다.", "C": "5년차 NOI를 쓴 값입니다."}, "orig": "AI · ECO Module 2 Q11", "subject": "AI"}, {"id": "AI:ECO-M2-Q15", "src": "ECO 오답", "module": "08-2", "tag": "Private equity vs private debt", "vig": 59, "stem": "If Tang purchases the office property in New York City, what are the forms of real estate investment taken by Delphinus Brothers and Rich Life Insurance?", "opts": {"A": "Delphinus invests in public real estate equity and Rich invests in public real estate debt.", "B": "Delphinus invests in private real estate equity and Rich invests in private real estate debt.", "C": "Delphinus invests in private real estate equity and Rich invests in public real estate debt."}, "ans": "B", "en": "B is correct. Both parties are investors in private real estate because buying a property directly is a private market transaction. Delphinus takes a private position in real estate equity by investing USD15 million, and Rich takes a private position in real estate debt by lending USD35 million to Delphinus to purchase the property. Responses A and C are incorrect because public investments in real estate revolve around such securities as REITs, MBS, and covered bonds.", "ko": "건물을 직접 사는 것은 사모(private) 거래입니다. Delphinus는 지분을 넣어 private equity, Rich Life는 대출을 해 private debt 투자자입니다. 공모(public)는 REIT·MBS·커버드본드 같은 증권입니다.", "trap": "상장사(Rich Life)가 대출해도 '직접 대출'이면 private debt.", "f": "", "why": {"A": "건물 직접 매입과 직접 대출은 모두 private 투자입니다.", "C": "Rich Life의 직접 대출은 public debt(MBS 등)이 아니라 private debt입니다."}, "orig": "AI · ECO Module 2 Q15", "subject": "AI"}, {"id": "AI:ECO-M2-Q16", "src": "ECO 오답", "module": "08-2", "tag": "Appraisal-based index → 분산효과 과대평가", "vig": 60, "stem": "The type of index Rossi uses will most likely:", "opts": {"A": "introduce noise in the index measurement.", "B": "overstate the diversification benefits of real estate.", "C": "have values that lead the transaction values in the market."}, "ans": "B", "en": "A is incorrect because this is a problem associated with transaction-based indexes, not appraisal-based indexes. Transaction-based indexes can be noisy (that is, they include random elements in the observations) because of the need to use statistical techniques to estimate the index. So, there may be upward or downward movements from quarter to quarter that are somewhat random even though in general (viewed over a year or longer) the index is capturing the correct movements in the market. On the other hand, appraisal-based indexes combine valuation information from individual properties and provide a measure of market movements.\nB is correct because Rossi uses an appraisal-based index, and appraisal-based indexes are often criticized for having appraisal lag, which results from appraised values tending to lag when there are sudden shifts in the market. Appraisal lag tends to smooth the index, meaning that it has less volatility. It behaves somewhat like a moving average of what an index would look like if it were based on values obtained from transactions rather than appraisals. Because of the lag in appraisal-based real estate indexes, they will also tend to have a lower correlation with other asset classes. The smoothing effect will also overstate Sharpe ratios, which is problematic if the index is used in asset allocation models to determine how much of a portfolio should be allocated to real estate versus other asset classes. The appropriate allocation to and benefits from private real estate would likely be overestimated.\nC is incorrect because appraisal-based indexes are often criticized for having appraisal lag, which results from appraised values tending to lag when there are sudden shifts in the market. In an upward market, transaction prices usually start to rise first. Then as these higher prices are reflected in comparable sales and investor surveys, they are captured in appraised values. Thus, appraisal-based indexes may not capture the price increase until a quarter or more after it was reflected in transactions. The same lag would also occur in a down market, with appraised values not falling as soon as transaction prices.", "ko": "감정평가 기반 지수는 appraisal lag로 수익률이 smoothing → 변동성·다른 자산과의 상관관계가 낮게 측정 → Sharpe ratio와 분산효과가 과대평가됩니다.", "trap": "Noise = transaction-based 지수의 문제. Appraisal 지수는 거래가격보다 '늦게' 움직임.", "f": "", "why": {"A": "통계적 추정을 쓰는 transaction-based 지수의 문제입니다.", "C": "감정평가 지수는 거래가격을 선행하지 않고 뒤따릅니다(lag)."}, "orig": "AI · ECO Module 2 Q16", "subject": "AI"}, {"id": "AI:ECO-M4-Q7", "src": "ECO 오답", "module": "08-4", "tag": "위기에도 높은 Sharpe → Long volatility", "vig": 61, "stem": "The specialist hedge fund strategy that Mukilteo plans to recommend is most likely:", "opts": {"A": "cross-asset volatility trading between the US and Japanese markets.", "B": "selling equity volatility and collecting the volatility risk premium.", "C": "buying longer-dated out-of-the-money options on VIX index futures."}, "ans": "C", "en": "C is correct. Mukilteo needs to recommend a specialist hedge fund strategy that can help PWPF maintain a high Sharpe ratio even in a crisis when equity markets fall. Buying longer-dated out-of-the-money options on VIX index futures is a long equity volatility position that works as a protective hedge, particularly in an equity market crisis when volatility spikes and equity prices fall. A long volatility strategy is a useful potential diversifier for long equity investments (albeit at the cost of the option premium paid by the volatility buyer). Because equity volatility is approximately 80% negatively correlated with equity market returns, a long position in equity volatility can substantially reduce the portfolio’s standard deviation, which would serve to increase its Sharpe ratio. Longer-dated options will have more absolute exposure to volatility levels (i.e., vega exposure) than shorter-dated options, and out-of-the-money options will typically trade at higher implied volatility levels than at-the-money options.\nA is incorrect because cross-asset volatility trading, a type of relative value volatility trading, may often involve idiosyncratic, macro-oriented risks that may have adverse effects during an equity market crisis.\nB is incorrect because the volatility seller is the provider of insurance during crises, not the beneficiary of it. Selling volatility provides a volatility risk premium or compensation for taking on the risk of providing insurance against crises for holders of equities and other securities. On the short side, option premium sellers generally extract steadier returns in normal market environments.", "ko": "장기 OTM VIX 선물 옵션 매수 = long volatility. 주식 폭락 시 변동성이 급등해(주식 수익률과 약 −80% 상관) 위기에 보험 역할을 하고, 포트폴리오 표준편차를 낮춰 Sharpe를 유지합니다. 장기 옵션은 vega 노출이 큽니다.", "trap": "변동성 '매도'는 보험을 파는 쪽 → 위기 때 손실.", "f": "", "why": {"A": "교차자산 변동성 거래는 위기 때 불리할 수 있는 거시적 위험을 동반합니다.", "B": "변동성 매도는 평소 프리미엄을 받지만 위기 때 보험금을 내주는 쪽입니다."}, "orig": "AI · ECO Module 4 Q7", "subject": "AI"}, {"id": "AI:ECO-M4-Q9", "src": "ECO 오답", "module": "08-4", "tag": "분산 제한 + 하방위험 → Sortino 최고", "vig": 61, "stem": "Based on the IC’s primary considerations for a combined portfolio, which simulated hedge fund strategy portfolio in Exhibit 1 creates the most suitable combined portfolio?", "opts": {"A": "Merger arbitrage", "B": "Systematic futures", "C": "Equity market neutral"}, "ans": "C", "en": "C is correct. The variance of the combined portfolio must be less than 90% of that of the current portfolio: maximum variance = 0.90 × 7.95² ≈ 56.88, so maximum standard deviation ≈ 7.54%. All three portfolios meet this requirement. Because the IC expects large negative events, the Sortino ratio (which penalizes only downside deviation) is the more appropriate risk-adjusted measure. The equity market-neutral allocation has the highest Sortino ratio (1.80).\nA is incorrect because the merger arbitrage portfolio has a lower Sortino ratio (1.35), even though it has the lowest maximum drawdown.\nB is incorrect because the systematic futures portfolio has a lower Sortino ratio (1.68).", "ko": "분산 한도 = 현재 분산의 90% → 최대 표준편차 = 7.95 × √0.9 ≈ 7.54%. 세 후보 모두 통과. 큰 손실 사건을 고려하면 하방 편차만 보는 Sortino가 적합 → 1.80으로 가장 높은 EMN.", "trap": "Max drawdown이 가장 작은 merger arb에 끌리지 말 것. 기준은 Sortino.", "f": "Sortino = (R − MAR) / 하방편차 ; 최대 σ = σ_현재 × √0.9", "why": {"A": "Sortino 1.35로 EMN(1.80)보다 낮습니다. 낙폭이 작은 것은 기준이 아닙니다.", "B": "Sortino 1.68로 EMN보다 낮습니다(Sharpe는 높지만 기준은 Sortino)."}, "orig": "AI · ECO Module 4 Q9", "subject": "AI"}, {"id": "AI:ECO-M4-Q29", "src": "ECO 오답", "module": "08-4", "tag": "Merger arbitrage 편입 이유", "vig": 62, "stem": "What would the rationale most likely be for an institutional investor to include the Pegasus Fund in its portfolio?", "opts": {"A": "Uncorrelated source of alpha", "B": "Capital structure arbitrage of valuation divergence", "C": "Earn the illiquidity premium associated with the strategy"}, "ans": "A", "en": "A is correct. Merger arbitrage is a good uncorrelated source of alpha. Diversifying across a variety of mergers, deals, and industries can further help hedge the risk of any one deal failing. Merger arbitrage does not exploit capital structure divergence in a single company and is a relatively liquid strategy.\nB is incorrect because capital structure arbitrage involves taking long and short positions in the debt and equity of individual companies to extract misvaluations, and it would not be a rationale for inclusion in the portfolio. This generally falls under distressed security strategies.\nC is incorrect because merger arbitrage is a liquid strategy.", "ko": "Merger arbitrage는 딜 결과에 따라 수익이 결정돼 평상시 시장과 상관이 낮은 알파 원천이고, 여러 딜에 분산하면 개별 딜 실패 위험도 줄일 수 있습니다. 유동성도 비교적 높습니다.", "trap": "Capital structure arbitrage = distressed securities. Merger arb는 유동적 전략.", "f": "", "why": {"B": "자본구조 차익거래(부채·주식 간 괴리)는 distressed securities 전략에 속합니다.", "C": "Merger arbitrage는 비교적 유동적인 전략이라 비유동성 프리미엄과 거리가 멉니다."}, "orig": "AI · ECO Module 4 Q29", "subject": "AI"}, {"id": "AI:ECO-M4-Q30", "src": "ECO 오답", "module": "08-4", "tag": "Convertible arbitrage = 옵션 저평가 이용", "vig": 62, "stem": "Based on the data in Exhibit 1, what strategy is the Orion portfolio manager most likely implementing?", "opts": {"A": "Taking advantage of option mispricing", "B": "Profiting from extreme market volatility", "C": "Going long a put on the equity net of hedging"}, "ans": "A", "en": "A is correct. To access and extract the relatively cheap embedded optionality of the convertible, the manager hedges away other risks that are embedded in the convertible security. These include interest rate risk, credit risk, and market risk. These risks can be hedged using a combination of interest rate derivatives, credit default swaps, and short sales of an appropriate delta-adjusted amount of the underlying stock or, alternatively, the purchase of put options.\nB is incorrect because the convertible arbitrage strategy performs best when there is modest volatility. Heightened volatility would suggest a period of illiquidity and widening credit spreads.\nC is incorrect because buying a convertible bond and delta hedging the position does not equate to a long put position.", "ko": "전환사채를 사고 주식 델타 숏, CDS, 금리스왑으로 시장·신용·금리 위험을 헤지 → 싸게 내재된 옵션(변동성)만 추출하는 전략.", "trap": "Convertible arb는 '적당한' 변동성에서 가장 잘 됨. 극단적 변동성은 불리.", "f": "CB = 일반 채권 + 콜옵션", "why": {"B": "Convertible arb는 변동성이 적당할 때 가장 좋고, 극단적 변동성은 유동성 악화·스프레드 확대로 불리합니다.", "C": "CB 매수 + 델타 헤지는 풋 매수와 같은 포지션이 아닙니다."}, "orig": "AI · ECO Module 4 Q30", "subject": "AI"}, {"id": "AI:ECO-M4-Q34", "src": "ECO 오답", "module": "08-4", "tag": "EMN: 높은 분산·높은 회전율", "vig": 63, "stem": "Which of Pukitis statement’s to Chu regarding equity-related hedge fund managers is most likely correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "A is incorrect. Although a lower beta to equity markets is a characteristic of long–short managers, it is not one of the attractive features of long–short strategies. If an investor wishes to have exposure to a strategy with lower equity beta, there are cheaper long-only approaches to accomplish this goal.\nB is incorrect. Dedicated short-bias managers typically have low levels of leverage.\nC is correct. Pukitis correctly states that equity market–neutral managers are likely to have high levels of diversification and turnover ratios.", "ko": "Statement 3이 맞습니다. EMN은 많은 종목을 롱·숏으로 들고 있어 분산이 높고, 가격 괴리가 해소되면 바로 청산하고 갈아타 회전율이 높습니다.", "trap": "Dedicated short = 레버리지 낮음. L/S의 낮은 베타는 '가장 매력적인 특징'이 아님(더 싸게 얻는 방법이 있음).", "f": "", "why": {"A": "낮은 베타는 L/S의 특징이지만 가장 매력적인 점은 아닙니다(long-only로 더 싸게 낮은 베타를 얻을 수 있음). 핵심은 종목 선택 알파입니다.", "B": "Dedicated short 매니저는 보통 레버리지를 적게 씁니다."}, "orig": "AI · ECO Module 4 Q34", "subject": "AI"}, {"id": "AI:ECO-M4-Q38", "src": "ECO 오답", "module": "08-4", "tag": "Duration-neutral → 작은 평행이동만 헤지", "vig": null, "stem": "A fixed-income arbitrage fund implementing a duration-neutral strategy is most likely hedged against:", "opts": {"A": "large yield changes.", "B": "a steepening yield curve.", "C": "small shifts in the yield curve."}, "ans": "C", "en": "A is incorrect because duration neutrality will not provide a hedge against large yield changes. Duration neutrality provides a hedge against only small shifts in the yield curve. To hedge against large yield changes, the manager might employ a range of fixed-income derivatives, including futures, forwards, swaps, and swaptions (i.e., options on a swap).\nB is incorrect because duration neutrality will not provide a hedge against a steepening yield curve as a steepening yield curve is a non-parallel shift in the yield curve. Duration neutrality provides a hedge against only small shifts in the yield curve. To hedge against non-parallel yield curve movements (i.e., steepening or flattening), the manager might employ a range of fixed-income derivatives, including futures, forwards, swaps, and swaptions (i.e., options on a swap).\nC is correct because duration neutrality provides a hedge against only small shifts in the yield curve. Unless trading a price discrepancy directly involves establishing a desired yield curve exposure, fixed-income arbitrageurs will typically immunize their strategies, which involve both long and short positions, from interest rate risk by taking duration-neutral positions.", "ko": "Duration-neutral은 작은 평행이동에 대해서만 금리 위험을 없앱니다. 큰 금리 변화나 곡선 모양 변화(스티프닝)는 헤지되지 않습니다.", "trap": "", "f": "", "why": {"A": "큰 금리 변화는 듀레이션 중립으로 헤지되지 않습니다(컨벡시티 등).", "B": "스티프닝 같은 비평행 이동은 헤지되지 않습니다."}, "orig": "AI · ECO Module 4 Q38", "subject": "AI"}, {"id": "AI:ECO-M4-Q39", "src": "ECO 오답", "module": "08-4", "tag": "Global macro vs managed futures", "vig": null, "stem": "Compared to managed futures funds, global macro funds are more likely to:", "opts": {"A": "be a consistent source of alpha.", "B": "take a systematic approach to implementation.", "C": "be early and overly anticipatory in their positioning."}, "ans": "C", "en": "A is incorrect because managed futures funds tend to be a more dependable source of alpha than global macro funds. Global macro funds are not as consistently dependable as a source of short alpha when compared to pure systematic, trend-following managed futures funds that typically attempt to capture any significant market trend.\nB is incorrect because , compared to managed futures managers, global macro managers are not likely to take a systematic approach to implementation. Typically, managed futures managers tend to take a more systematic approach to implementation than global macro managers, who are generally more discretionary in their application of models and tools.\nC is correct because , compared to managed futures managers, global macro managers can be early and overly anticipatory in their positioning. Global macro managers tend to be anticipatory and sometimes contrarian in setting their strategies. Some macro managers may try to extract carry gains or ride momentum waves, but most have a tendency to be early in their positioning and then benefit when some rationality eventually returns to relative market pricing. Finally, global macro managers tend to be more anticipatory (compared to managed futures managers), which can be a useful attribute.", "ko": "글로벌 매크로는 재량적(discretionary)이고 남보다 먼저 추세를 예상해 포지션을 잡는 경향이 있어, 너무 이르게(과도하게 앞서) 들어가기 쉽습니다.", "trap": "Managed futures = 체계적(systematic), 더 꾸준한 알파.", "f": "", "why": {"A": "추세추종 managed futures가 더 꾸준한 알파 원천입니다.", "B": "체계적 실행은 managed futures의 특징입니다."}, "orig": "AI · ECO Module 4 Q39", "subject": "AI"}, {"id": "AI:ECO-M4-Q52", "src": "ECO 오답", "module": "08-4", "tag": "Multi-strategy vs FoF 성과", "vig": null, "stem": "Multi-strategy funds have typically:", "opts": {"A": "outperformed funds-of-funds.", "B": "experienced lower volatility than funds-of-funds.", "C": "provided better redemption provisions than funds-of-funds."}, "ans": "A", "en": "A is correct because multi-strategy hedge funds typically outperform funds-of-funds: They have higher mean returns (7.85%/TASS and 8.52%/CISDM) and among the highest Sharpe ratios and Sortino ratios. Multi-strategy funds have higher Rho (more than 20%) compared to FoFs, indicating relatively high serial autocorrelation. This is reasonable because multi-strategy funds may be simultaneously running strategies using less liquid instruments, such as convertible arbitrage, fixed-income arbitrage, and other relative value strategies.\nB is incorrect because multi-strategy funds are generally considered to have higher volatility than FOFs. Multi-strategy funds have generally outperformed FoFs but with more variance and occasional large losses often related to their higher leverage.\nC is incorrect because multi-strategy funds are generally considered to have more restrictive redemption terms than FOFs. Both groups (FOFs and multi-strategy funds) typically have similar initial lock-up and redemption periods, but multi-strategy funds also often impose investor-level or fund-level gates on maximum redemptions allowed per quarter. Further, multi-strategy funds may be simultaneously running strategies using less liquid instruments, such as convertible arbitrage, fixed-income arbitrage, and other relative value strategies. That is why, unlike FoFs, they often impose investor-level or fund-level gates on maximum quarterly redemptions.", "ko": "Schweser: multi-strategy 펀드는 더 나은 수수료 구조와 빠른 전술적 배분 덕분에 역사적으로 FoF보다 성과가 좋았습니다. 대신 레버리지 때문에 변동성이 더 크고 가끔 큰 손실이 있습니다.", "trap": "성과↑지만 변동성↑, 환매 조건은 더 엄격(gate).", "f": "", "why": {"B": "Multi-strategy는 레버리지 때문에 FoF보다 변동성이 큽니다.", "C": "Multi-strategy는 분기별 환매 한도(gate) 등 환매 조건이 더 엄격합니다."}, "orig": "AI · ECO Module 4 Q52", "subject": "AI"}, {"id": "AI:ECO-M4-Q60", "src": "ECO 오답", "module": "08-4", "tag": "Convertible arbitrage 주당 손익 계산", "vig": null, "stem": "A convertible arbitrage hedge fund manager observes the following information about a convertible bond and the underlying stock:\nConvertible bond par value\t$1,000,000\nBond price\t$105\nAnnual coupon rate\t5%\nConversion ratio\t80,000\nStock price\t$20\nBorrowing cost per share\t$4\nThe manager buys the bond and sells the stock short. If the stock price falls by 10% over one year, the per-share profit of this strategy is closest to:", "opts": {"A": "–$3.38.", "B": "$2.88.", "C": "$3.50."}, "ans": "C", "en": "A is incorrect because the starting stock price is used in the calculation rather than the conversion price. Thus, Ending stock price – Starting stock price = 0.9 × $20 – $20 = –$2, and the per-share profit of the strategy is –$2 + $0.625 – $2 = –$3.375 ≈ –$3.38.\nB is incorrect because the coupon receipt is not included in the calculation, resulting in a per-share profit of $4.875 – $2 = $2.875 ≈ $2.88.\nC is correct because the bond value is $1,000,000 × 105/100 = $1,050,000. The conversion price is $1,050,000/80,000 = $13.125. The profit on the long bond position is Ending stock price – Conversion price = 0.9 × $20 – $13.125 = $4.875. This is increased by the coupon receipt of 5% × $1,000,000 = $50,000 or $0.625 per share (= $50,000/80,000).\nThe profit on the short stock position is –(Ending stock price – Starting stock price) = –($18 – $20) = $2. This is reduced by the borrowing cost of $4 per share to a loss of $2 per share.\nThus, the profit per share of this strategy is $4.875 + $0.625 – $2 = $3.50.", "ko": "전환가격 = 1,050,000 / 80,000 = $13.125. Long CB 이익 = 18 − 13.125 = 4.875. 쿠폰 = 50,000 / 80,000 = 0.625. Short 이익 = 20 − 18 = 2, 차입비용 4 → −2. 합계 = 4.875 + 0.625 − 2 = $3.50.", "trap": "Long CB 이익은 '전환가격' 기준. 쿠폰과 차입비용을 빠뜨리지 말 것.", "f": "이익 = (S₁ − 전환가격) + 쿠폰/주 + (S₀ − S₁) − 차입비용", "why": {"A": "전환가격 대신 시작 주가를 써서 long 쪽 손익을 −2로 계산했습니다.", "B": "쿠폰(0.625)을 빠뜨렸습니다."}, "orig": "AI · ECO Module 4 Q60", "subject": "AI"}, {"id": "AI:ECO-M4-Q64", "src": "ECO 오답", "module": "08-4", "tag": "Fund-of-funds 수수료 후 수익률", "vig": null, "stem": "A fund-of-funds (FoF) invests equal amounts of capital in the following hedge funds, where incentive fees are calculated on returns net of management fees:\n\tGross Annual Return\tManagement Fee\tIncentive Fee\nFund 1\t4.5%\t1.8%\t10.0%\nFund 2\t3.6%\t1.2%\t10.0%\nIf the FoF also charges a base fee of 1.0% and an incentive fee of 10.0%, the net annual return to FoF investors is closest to:", "opts": {"A": "0.93%.", "B": "1.17%.", "C": "3.23%."}, "ans": "B", "en": "A is incorrect because incentive fees are calculated on gross rather than net returns.\nThe return to Fund 1 is then (4.5% – 1.8%) – 10% × 4.5% = 2.250%.\nThe return to Fund 2 is then (3.6% – 1.2%) – 10% × 3.6% = 2.040%.\nThe FoF gross return is therefore (2.250% + 2.040%)/2 = 2.145% and the FoF net return is (2.145% – 1%) – 10% × 2.145% = 0.9305% ≈ 0.93%.\nB is correct because the net-of-fees return to Fund 1 is (4.5% – 1.8%) – 10% × (4.5% – 1.8%) = 2.43%.\nThe net-of-fees return to Fund 2 is (3.6% – 1.2%) – 10% × (3.6% – 1.2%) = 2.16%.\nSince the FoF exposure to the two funds is equally weighted, the FoF gross return is (2.43% + 2.16%)/2 = 2.295% and the FoF net return is (2.295% – 1%) – 10% × (2.295% – 1%) = 1.1655% ≈ 1.17%.\nC is incorrect because the overall gross return to the FoF is calculated as the sum of the constituents rather than the average. The FoF gross return is therefore 2.43% + 2.16% = 4.59% and the FoF net return is (4.59% – 1%) – 10% × (4.59% – 1%) = 3.231% ≈ 3.23%.", "ko": "Fund 1: (4.5 − 1.8) × 0.9 = 2.43%. Fund 2: (3.6 − 1.2) × 0.9 = 2.16%. FoF 총수익 = 평균 2.295%. FoF 순수익 = (2.295 − 1.0) × 0.9 = 1.17%.", "trap": "성과보수는 '운용보수 차감 후' 수익 기준. FoF 총수익은 합이 아니라 가중평균.", "f": "순수익 = (총수익 − 운용보수) × (1 − 성과보수율)", "why": {"A": "성과보수를 운용보수 차감 전(총수익) 기준으로 계산했습니다.", "C": "두 펀드 수익을 평균하지 않고 더했습니다."}, "orig": "AI · ECO Module 4 Q64", "subject": "AI"}, {"id": "AI:ECO-M4-Q65", "src": "ECO 오답", "module": "08-4", "tag": "Technical + discretionary(herding 회피)", "vig": null, "stem": "A manager believes that past price trends can reliably predict future relative price movements and wants to avoid a strategy that is exposed to herding effects. The manager most likely prefers a strategy that employs:", "opts": {"A": "technical analysis with systematic implementation.", "B": "technical analysis with discretionary implementation.", "C": "fundamental analysis with systematic implementation."}, "ans": "B", "en": "A is incorrect because systematic implementation is rules-based and executed by computer algorithms with little or no human intervention; however, it may encounter difficulty coping with new, complex situations (not seen historically). As the absolute size of systematic trend-following funds has increased in significance, so too has the issue of negative execution slippage caused by the simultaneous reversal of multiple trend-following models that sometimes creates a 'herding effect.' Such effects can temporarily overwhelm normal market liquidity and at times temporarily distort fundamental market pricing of assets (i.e., trend-following 'overshoots' caused by momentum-signal triggers).\nB is correct because this combination aligns with the manager's beliefs. Technical analysis utilizes statistical methods to predict relative price movements based on past price trends. Further, in contrast to discretionary implementation, systematic implementation is rules-based and executed by computer algorithms where the simultaneous reversal of multiple trend-following models sometimes creates a 'herding effect.' Such effects can temporarily overwhelm normal market liquidity and at times temporarily distort fundamental market pricing of assets (i.e., trend-following 'overshoots' caused by momentum-signal triggers). Discretionary implementation is less subject to the 'herding effect' than systematic implementation.\nC is incorrect because fundamental-based strategies use economic data as inputs and focus on fair valuation of securities, sectors, markets, and intra-market relationships. In contrast, and more in line with the manager's beliefs, technical analysis utilizes statistical methods to predict relative price movements based on past price trends.", "ko": "과거 가격 추세로 예측 → technical analysis. 체계적 추세추종 펀드들이 같은 신호로 동시에 움직이는 herding 효과를 피하려면 → discretionary 실행.", "trap": "Systematic = herding·실행 slippage 위험. Fundamental = 경제 데이터.", "f": "", "why": {"A": "체계적 실행은 herding 효과에 노출됩니다.", "C": "펀더멘털 분석은 과거 가격 추세가 아니라 경제 데이터를 씁니다."}, "orig": "AI · ECO Module 4 Q65", "subject": "AI"}, {"id": "PM:ECO-M1-Q7", "src": "ECO 오답", "module": "09-1", "tag": "경기침체 → 수익률곡선 steepen", "vig": 64, "stem": "If Carlisle’s prediction about the economy of Country #3 is realized, the yield curve in Country #3 will most likely:", "opts": {"A": "remain flat.", "B": "become upward sloping.", "C": "become downward sloping."}, "ans": "B", "en": "B is correct. The yield curve in Country 3 is currently flat (Exhibit 1), and Carlisle predicts a recession. During a recession, short-term rates tend to be lower because central banks tend to lower their policy rate in these times. However, the impact of monetary policy on longer-term rates will not be as strong because the central bank will usually be expected to bring short-term rates back to normal as the recession recedes. Thus, the slope of the yield curve will likely become upward sloping during the recession.", "ko": "경기침체 시 중앙은행이 정책금리를 낮춰 단기금리가 크게 하락. 장기금리는 '침체가 끝나면 금리가 정상화될 것'이라는 기대 때문에 덜 하락. → 현재 평평한 곡선이 우상향(가팔라짐)으로 변함.", "trap": "역전은 침체의 '선행' 신호, 침체 '중'에는 steepen.", "f": "", "why": {"A": "침체가 오면 단기금리가 장기금리보다 더 많이 떨어지므로 평평한 상태로 남지 않습니다.", "C": "역전(inverted) 곡선은 보통 침체 '이전'(긴축 후반, 정책금리 인하 기대)에 나타납니다. 침체 중에는 단기금리 인하로 곡선이 가팔라집니다."}, "orig": "PM · ECO Module 1 Q7", "subject": "PM"}, {"id": "PM:ECO-M1-Q11", "src": "ECO 오답", "module": "09-1", "tag": "고성장 → 실질금리 ↑ (차입 증가)", "vig": null, "stem": "Default-free real interest rates tend to be relatively high in countries with high expected economic growth because investors:", "opts": {"A": "increase current borrowing.", "B": "have high inter-temporal rates of substitution.", "C": "have high uncertainty about levels of future consumption."}, "ans": "A", "en": "A is correct. The average level of default-free real interest rates is positively related to the expected rate of growth of the underlying economy and also to the volatility of economic growth in the economy. During periods of high expected economic growth, investors are less worried about the future and their consumption abilities in the future; that is, their inter-temporal rate of substitution is low, so they borrow more today and save less. Other things being equal, this means that the average level of default-free real interest rates (the reciprocal of the rate of substitution, see Equation 4) should be higher in an economy with high growth and lower in an economy with lower, more stable growth.", "ko": "고성장이 예상되면 투자자는 미래 소비를 덜 걱정 → 기간 간 대체율(m)이 낮음 → 지금 더 빌리고 덜 저축 → 실질 무위험이자율(≈ 1/m − 1) ↑.", "trap": "금리 ∝ 1/m. 고성장 → m ↓ → 금리 ↑.", "f": "1 + R = 1 / E(m),  m = u′(미래 소비)/u′(현재 소비)", "why": {"B": "방향 반대. 고성장 기대 시 기간 간 대체율은 '낮습니다'. 금리는 대체율의 역수이므로 대체율이 낮을 때 금리가 높습니다.", "C": "고성장 자체는 미래 소비 수준의 불확실성을 뜻하지 않습니다. 고성장 국가에서 금리가 높은 이유는 현재 차입 증가(저축 감소)입니다."}, "orig": "PM · ECO Module 1 Q11", "subject": "PM"}, {"id": "PM:ECO-M1-Q16", "src": "ECO 오답", "module": "09-1", "tag": "우상향 곡선 = 단기채가 좋은 헤지", "vig": null, "stem": "One interpretation of an upward sloping yield curve is that the returns to short-dated bonds are:", "opts": {"A": "uncorrelated with bad times.", "B": "more positively correlated with bad times than are returns to long-dated bonds.", "C": "more negatively correlated with bad times than are returns to long-dated bonds."}, "ans": "C", "en": "C is correct. One interpretation of an upward-sloping yield curve is that returns to short-dated bonds are more negatively correlated with bad times than are returns to long-dated bonds. This interpretation is based on the notion that investors are willing to pay a premium and accept a lower return for short-dated bonds if they believe that long-dated bonds are not a good hedge against economic “bad times.”", "ko": "우상향 곡선의 해석: 단기채 수익은 bad times와 '더 음(−)의 상관' → 좋은 헤지(보험 가치) → 낮은 기대수익도 수용. 장기채는 나쁜 헤지 → 위험프리미엄 요구 → 장기 수익률이 더 높음.", "trap": "좋은 헤지 = bad times와 음의 상관 = 낮은 기대수익. 단기채(좋은 헤지) vs 장기채(나쁜 헤지) → 우상향.", "f": "", "why": {"A": "단기채가 bad times와 무상관이면 헤지 가치가 없어 단기 수익률이 낮을 이유가 사라집니다.", "B": "방향 반대. 단기채가 bad times와 더 양(+)의 상관이면 단기채가 더 나쁜 헤지가 되어 곡선이 역전 방향이 됩니다."}, "orig": "PM · ECO Module 1 Q16", "subject": "PM"}, {"id": "PM:ECO-M1-Q28", "src": "ECO 오답", "module": "09-1", "tag": "상업용 부동산 할인율 = 주식 + 유동성 프리미엄", "vig": null, "stem": "Which of the following statements relating to commercial real estate is correct?", "opts": {"A": "Rental income from commercial real estate is generally unstable across business cycles.", "B": "Commercial real estate investments generally offer a good hedge against bad consumption outcomes.", "C": "The key difference in the discount rates applied to the cash flows of equity investments and commercial real estate investments relates to liquidity."}, "ans": "C", "en": "C is correct. To arrive at an appropriate discount rate to be used to discount the cash flows from a commercial real estate investment, a liquidity premium is added to the discount rate applicable to equity investments. The added liquidity premium provides additional compensation for the risk that the real estate investment may be very illiquid in bad economic times.", "ko": "상업용 부동산 할인율 = 주식 할인율 + 유동성 프리미엄. 부동산은 bad times에 특히 비유동적이므로 그에 대한 추가 보상이 필요.", "trap": "부동산 = 채권(임대료) + 주식(가치 변동) 성격 + 비유동성. 헤지 성격은 '나쁨'.", "f": "Discount rate(CRE) = R + π + θ + 주식형 프리미엄 + 유동성 프리미엄", "why": {"A": "임대수입은 장기 임대계약 덕분에 경기와 무관하게 비교적 안정적입니다(채권 같은 성격).", "B": "부동산 가치는 경기 침체 때 함께 하락하므로 bad consumption outcome에 대한 헤지가 좋지 않습니다."}, "orig": "PM · ECO Module 1 Q28", "subject": "PM"}, {"id": "PM:ECO-M1-Q32", "src": "ECO 오답", "module": "09-1", "tag": "부동산 PV 분자 = 순임대수입", "vig": 65, "stem": "In her discussion about the present value formula for commercial real estate, McKenna is least likely correct regarding her description of the:", "opts": {"A": "numerator.", "B": "discount rate for a commercial lease.", "C": "discount rate for a government lease."}, "ans": "A", "en": "Correct. Her description of the numerator is incorrect. The numerator in this formula consists of the sum of future rent payments, but instead it should be net rental income, which also incorporates expenses incurred.\nB: Incorrect. Her description of the discount rate for a commercial lease is correct. A commercial tenant paying a fixed-rate nominal rent would have a discount rate that incorporates the real default-free rate, expected future inflation, a risk-premium for future inflation uncertainty, a risk premium for the uncertainty of the property value at the end of the lease, a risk premium for credit risk, and a risk premium for the illiquidity of the property.\nC: Incorrect. Her description of the discount rate for a government lease is correct. The discount rate for a property leased to a developed market government tenant that pays rent indexed to inflation would consist of the real default-free rate, a risk premium for the uncertainty of the property value at the end of the lease, and a risk premium for the illiquidity of the property.", "ko": "부동산 현재가치 공식의 분자는 미래 '순(net)' 임대수입(임대료 − 비용)이어야 함. McKenna는 분자를 '임대료 총합'이라고 했으므로 틀림. 두 할인율 설명은 맞음.", "trap": "'least likely correct' 문제. 분자는 gross rent가 아니라 net rental income.", "f": "", "why": {"B": "상업 임차인 고정 명목 임대료의 할인율 = 실질 무위험 + 기대인플레이션 + 인플레이션 불확실성 + 잔존가치 불확실성 + 신용 + 비유동성 프리미엄. McKenna 설명이 맞습니다.", "C": "물가연동 정부 임차인의 할인율 = 실질 무위험 + 잔존가치 불확실성 + 비유동성 프리미엄. 인플레이션·신용 프리미엄이 없는 것이 맞으므로 설명이 옳습니다."}, "orig": "PM · ECO Module 1 Q32", "subject": "PM"}, {"id": "PM:ECO-M1-Q45", "src": "ECO 오답", "module": "09-1", "tag": "예상된 정보 = 가격 변화 없음", "vig": 66, "stem": "Which of the following is the most likely impact on short-term bond prices if Quantum’s expectations regarding the payroll report are correct?", "opts": {"A": "Fall", "B": "No change", "C": "Rise"}, "ans": "B", "en": "Correct. Although Quantum is forecasting a fairly low non-farm payroll number, their expectation is in line with market consensus forecasts. Although this data may be considered weak, it provides information that is anticipated and thus already reflected in asset prices. Prices would be more likely to rise or fall if the news is a surprise relative to fully anticipated information.\nA: Incorrect. Bond prices are unlikely to rise or fall based on this information because it is already anticipated by the market.\nC: Incorrect. Bond prices are unlikely to rise or fall based on this information because it is already anticipated by the market.", "ko": "Quantum의 고용지표 전망이 낮긴 하지만 시장 컨센서스와 같음 → 이미 가격에 반영 → 단기채 가격 변화 없음. 가격은 기대와 다른 '서프라이즈'에만 반응.", "trap": "수준(약함)이 아니라 기대 대비 서프라이즈로 판단.", "f": "", "why": {"A": "약한 지표라도 이미 예상된 정보면 가격에 반영돼 있어 하락하지 않습니다.", "C": "약한 고용지표가 금리 하락(채권가격 상승)으로 이어지려면 컨센서스보다 나빠야 합니다. 예상과 같으면 변화가 없습니다."}, "orig": "PM · ECO Module 1 Q45", "subject": "PM"}, {"id": "PM:ECO-M1-Q48", "src": "ECO 오답", "module": "09-1", "tag": "하방 서프라이즈 → 공매도 대상 고르기", "vig": 66, "stem": "Based on Quantum’s economic forecast and the data in Exhibit 1, which bond is Coombs most likely to recommend as the short position for the hedge fund?", "opts": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}, "ans": "B", "en": "Correct. Bond 1 is in a non-cyclical industry, unlike Bond 2, that is in a cyclical industry. Bond 1 has a slightly higher debt-to-capital ratio than Bond 2 but not material. Bond 2 has a relatively tight spread compared with Bond 1. These factors suggest that Bond 2 is a better candidate for a short position. During an environment in which GDP is forecast to surprise to the downside, higher-rated issues are likely to outperform such as Bond 3. Given Quantum’s expectation for declining GDP and its relatively tight spread, Bond 2 is the best candidate for a short position.\nA: Incorrect. Bond 1 is in a non-cyclical industry, unlike Bond 2, which is in a cyclical industry. Bond 1 has a slightly higher debt-to-capital ratio than Bond 2 but not material. Bond 2 has a relatively tight spread compared with Bond 1. These factors suggest that Bond 2 is a better candidate for a short position.\nC: Incorrect. During an environment where GDP is forecast to surprise to the downside, higher rated issues such as Bond 3 are likely to outperform.", "ko": "GDP 하방 서프라이즈 예상 → 스프레드 확대. 공매도 대상은 경기민감(cyclical) 업종이면서 현재 스프레드가 좁은(비싸게 거래되는) 채권 → Bond 2. 고등급인 Bond 3은 이런 환경에서 상대적으로 강함.", "trap": "공매도 = 경기민감 + 현재 스프레드가 좁음(넓어질 여지 큼).", "f": "", "why": {"A": "Bond 1은 비경기 업종이고 스프레드도 Bond 2보다 넓어 확대 여지가 작습니다. 부채비율이 조금 높은 것은 결정적이지 않습니다.", "C": "Bond 3은 고등급으로 경기 하방 서프라이즈 때 상대적으로 성과가 좋아 공매도 대상이 아닙니다."}, "orig": "PM · ECO Module 1 Q48", "subject": "PM"}, {"id": "PM:ECO-M1-Q54", "src": "ECO 오답", "module": "09-1", "tag": "경기 확장 → 회수율 ↑", "vig": null, "stem": "Recovery rates on corporate bonds tend to be higher when the economy is expanding because:", "opts": {"A": "credit spreads are higher.", "B": "default probabilities are lower.", "C": "any secured assets are likely to be sold at a higher price."}, "ans": "C", "en": "Correct because assets that can be sold in order to recover value for bond holders are likely to fetch a higher price in a buoyant economic environment than in a stagnant one.\nA: Incorrect because higher recovery rates will result in lower, not higher, credit spreads.\nB: Incorrect because, in the event of a default, the amount that the bond investor receives will depend on the recovery rate. Recovery rates are not directly related to default probabilities as they represent the amount received by the investor once default happens.", "ko": "경기 확장기에는 담보자산을 더 높은 가격에 팔 수 있어 부도 시 회수율이 높아짐.", "trap": "회수율(부도 후 회수)과 부도확률(부도 여부)은 별개 개념.", "f": "Expected loss = PD × (1 − Recovery rate)", "why": {"A": "회수율이 높으면 신용스프레드는 오히려 '낮아집니다'.", "B": "회수율은 '부도가 난 뒤' 받는 비율이라 부도확률과 직접 연결되지 않습니다."}, "orig": "PM · ECO Module 1 Q54", "subject": "PM"}, {"id": "PM:ECO-M1-Q60", "src": "ECO 오답", "module": "09-1", "tag": "실질금리 ∝ GDP 성장률 & 변동성", "vig": null, "stem": "The real default-free interest rate in an economy is most likely positively related to:", "opts": {"A": "the expected growth rate of GDP only.", "B": "the expected volatility of GDP growth only.", "C": "both the expected growth rate of GDP and the expected volatility of GDP growth."}, "ans": "C", "en": "Correct because GDP growth from one period to the next cannot be perfectly anticipated. Under these uncertain circumstances, interest rates will still be positively related to the expected growth rate of GDP, but additionally they will be positively related to the expected volatility of GDP growth.\nA: Incorrect because interest rates are also positively related to the expected volatility of GDP growth.\nB: Incorrect because interest rates are also positively related to the expected growth rate of GDP.", "ko": "실질 무위험이자율은 기대 GDP 성장률과 기대 GDP 성장 변동성 '둘 다'와 양(+)의 관계.", "trap": "'only'가 붙은 선택지 주의. 성장률·변동성 둘 다.", "f": "", "why": {"A": "성장률뿐 아니라 성장 변동성과도 양의 관계입니다.", "B": "변동성뿐 아니라 성장률 자체와도 양의 관계입니다."}, "orig": "PM · ECO Module 1 Q60", "subject": "PM"}, {"id": "PM:ECO-M2-Q1", "src": "ECO 오답", "module": "09-2", "tag": "Active return ≠ alpha", "vig": null, "stem": "Wei Liu makes two statements about active portfolio management:\nStatement 1: The “active return” of an actively managed portfolio is the difference between the portfolio’s return and the return on the benchmark portfolio, and it is equal to the managed portfolio’s alpha.\nStatement 2: The active weights are the differences in the managed portfolio’s weights and the benchmark’s weights.\nAre Liu’s statements correct?", "opts": {"A": "Only Statement 1 is correct.", "B": "Only Statement 2 is correct.", "C": "Both statements are correct."}, "ans": "B", "en": "B is correct. Although the first part of Statement 1 is correct (active return, or value added, equals the difference between the managed portfolio return and the benchmark return), active return is not the same as alpha. In other words, RA = RP − RB, while αP = RP − βP × RB. Statement 2 correctly defines active weights.", "ko": "Active return(RA) = RP − RB이지만 alpha(αP = RP − βP·RB)와 같지 않음(β = 1일 때만 같음). → Statement 1은 뒷부분이 틀림. Statement 2(Active weight = 포트폴리오 비중 − 벤치마크 비중)는 맞음.", "trap": "앞부분이 맞아도 뒤에 붙은 '= alpha' 같은 한 구절 때문에 전체가 틀림.", "f": "RA = RP − RB,  αP = RP − βP·RB,  Δwi = wP,i − wB,i", "why": {"A": "Statement 1의 '= alpha' 부분이 틀렸고, Statement 2는 맞습니다.", "C": "Active return은 β를 고려하지 않으므로 alpha와 같지 않습니다. Statement 1은 틀립니다."}, "orig": "PM · ECO Module 2 Q1", "subject": "PM"}, {"id": "PM:ECO-M2-Q4", "src": "ECO 오답", "module": "09-2", "tag": "벤치마크 요건: 투자 기회 반영", "vig": 67, "stem": "Which of Frazee’s concerns best justifies his decision to reject the proposed benchmark?", "opts": {"A": "Concern 1", "B": "Concern 2", "C": "Concern 3"}, "ans": "A", "en": "A is correct. Because the benchmark does not contain many assets that Frazee wants to invest in, the benchmark may not be representative of his investment approach. Concern 2, as stated, is less important because it does not imply that the cost of replicating the benchmark is a serious concern. Finally, Concern 3 actually states a generally positive feature of the benchmark.", "ko": "가장 큰 문제는 Concern 1: Frazee가 사고 싶은 종목이 벤치마크에 없음 → 벤치마크가 그의 투자 기회(opportunity set)를 대표하지 못함. Concern 2(복제 비용이 '다소' 높음)는 심각하지 않고, Concern 3(유동주식수 조정 시가총액 가중)은 오히려 좋은 특징.", "trap": "좋은 벤치마크의 1순위 = 매니저의 투자 기회를 대표할 것.", "f": "", "why": {"B": "한 포지션의 복제 비용이 '다소' 높다는 것은 큰 문제가 아닙니다. 벤치마크가 투자 기회를 대표하지 못하는 것이 훨씬 심각합니다.", "C": "Float-adjusted 시가총액 가중은 좋은 벤치마크의 일반적인 특징이라 거부할 근거가 아닙니다."}, "orig": "PM · ECO Module 2 Q4", "subject": "PM"}, {"id": "PM:ECO-M2-Q7", "src": "ECO 오답", "module": "09-2", "tag": "SR_P² = SR_B² + IR²", "vig": 67, "stem": "Based on Exhibit 1, combining Fund W with a fund that replicates the benchmark would produce a Sharpe ratio closest to:", "opts": {"A": "0.44.", "B": "0.56.", "C": "0.89."}, "ans": "B", "en": "B is correct. Given the IR for Fund W of 0.35 and the benchmark’s SR of 0.44, the optimal combination of the benchmark and Fund W has SR_P² = SR_B² + IR², so SR_P = (0.44² + 0.35²)^0.5 = 0.56.", "ko": "벤치마크와 액티브 펀드를 최적으로 결합한 포트폴리오의 Sharpe ratio: SR_P = √(0.44² + 0.35²) = √(0.1936 + 0.1225) = 0.56.", "trap": "SR과 IR을 단순 합산하지 말고, 제곱해서 더한 뒤 제곱근.", "f": "SR_P² = SR_B² + IR²", "why": {"A": "0.44는 벤치마크 SR 그대로입니다. 액티브 펀드를 더하면 IR만큼 SR이 올라갑니다.", "C": "0.89는 SR과 IR을 그냥 더한 값(0.44 + 0.35 = 0.79)과도 다르며, 공식은 제곱합의 제곱근입니다."}, "orig": "PM · ECO Module 2 Q7", "subject": "PM"}, {"id": "PM:ECO-M3-Q7", "src": "ECO 오답", "module": "09-3", "tag": "Tracking error 낮추는 요인", "vig": 68, "stem": "Which ETF in Exhibit 1 is most likely to have the lowest tracking error?", "opts": {"A": "ETF 2", "B": "ETF 3", "C": "ETF 4"}, "ans": "A", "en": "A is correct. Compared with a full replication approach, ETF portfolios managed using a representative sampling/optimization approach are likely to have greater tracking error. Also, differences in trading hours for depositary receipts and local constituent shares create discrepancies between the portfolio and index values. These discrepancies can lead to greater tracking error for portfolios holding ADRs in lieu of the underlying local shares. In exchange, the ETF receives a fee and earns interest on the collateral posted by the borrower (generally, overnight fixed-income securities), which creates income for the portfolio. As long as this securities-lending income is less than the fund expenses, it will lower the tracking error, but if it becomes larger, then it will become a source of tracking error. ETF 2 uses a full replication approach, holds only local foreign shares, and engages in securities lending. Therefore, ETF 2 will likely have the lowest tracking error out of the ETFs in Exhibit 1. ETF 3 will likely have greater tracking error than ETF 2 because it is managed using a representative sampling approach and is invested in depositary receipts in lieu of local shares. ETF 4 will likely have greater tracking error than ETF 2 because it is invested in depositary receipts in lieu of local shares and does not engage in securities lending.", "ko": "Tracking error ↓ 요인: full replication(sampling보다 정확), 현지 주식 보유(ADR은 거래시간 차이로 오차 발생), securities lending(대여 수익이 비용을 상쇄, 단 수익이 비용보다 크면 오히려 오차의 원인). 세 조건을 모두 갖춘 ETF 2가 가장 낮음.", "trap": "Full replication + 현지 주식 + securities lending = 최소 tracking error.", "f": "", "why": {"B": "ETF 3은 representative sampling과 ADR을 써서 tracking error가 더 큽니다.", "C": "ETF 4는 full replication이지만 ADR을 보유하고 securities lending을 하지 않아 ETF 2보다 tracking error가 큽니다."}, "orig": "PM · ECO Module 3 Q7", "subject": "PM"}, {"id": "PM:ECO-M3-Q10", "src": "ECO 오답", "module": "09-3", "tag": "ETF 총 보유비용 계산", "vig": 68, "stem": "Excluding the compounding effect, the expected total holding period cost for investing in the ETF over a nine-month holding period is closest to:", "opts": {"A": "0.54%.", "B": "0.62%.", "C": "0.64%."}, "ans": "A", "en": "A is correct. The expected total holding period cost for investing in the ETF over the nine-month holding period is calculated as follows:\nTotal expected holding period cost = Annual management fee + Round-trip trading commissions + Bid–offer spread on purchase/sale.\nTotal expected holding period cost = (9/12) × (0.32%) + 0.20% + 0.10% = 0.54%.", "ko": "총 보유기간 비용 = 운용보수 × (보유기간) + 왕복 수수료 + bid–offer spread = (9/12)(0.32%) + 0.20% + 0.10% = 0.24% + 0.30% = 0.54%.", "trap": "운용보수만 기간 비례, 거래 수수료와 spread는 1회분 그대로.", "f": "총비용 = 연보수 × (보유개월/12) + 왕복 수수료 + bid–offer spread", "why": {"B": "0.62%는 연 운용보수 0.32%를 9개월로 안분하지 않고 그대로 더한 값입니다(0.32 + 0.20 + 0.10).", "C": "0.64%는 bid–offer spread 0.10%를 매수·매도에 각각 두 번 더한 값입니다(0.24 + 0.20 + 0.20). 주어진 0.10%가 매수·매도를 합친 비용입니다."}, "orig": "PM · ECO Module 3 Q10", "subject": "PM"}, {"id": "PM:ECO-M3-Q16", "src": "ECO 오답", "module": "09-3", "tag": "ETF 분배: ROC vs 배당", "vig": null, "stem": "Which of the following statements regarding distributions made by ETFs is correct?", "opts": {"A": "Return-of-capital (ROC) distributions are generally not taxable.", "B": "ETFs generally reinvest any dividends received back into the ETF’s holdings.", "C": "A dividend distribution is a distribution paid to investors in excess of an ETF’s earnings."}, "ans": "A", "en": "A is correct. Return-of-capital distributions are amounts paid out in excess of an ETF’s earnings and serve to reduce an investor’s cost basis by the amount of the distribution. These distributions are generally not taxable.", "ko": "ROC(return of capital) 분배 = ETF 이익을 초과한 분배 → 분배 시점에는 보통 비과세이고, 취득원가를 그만큼 낮춤(과세 이연).", "trap": "ROC = 이익 초과분, 비과세, cost basis ↓.", "f": "", "why": {"B": "ETF는 받은 배당을 보통 투자자에게 분배합니다. 재투자는 투자자가 증권사에서 선택하는 DRIP입니다.", "C": "이익을 '초과'한 분배는 ROC입니다. 배당 분배는 이익 범위 안에서 지급됩니다."}, "orig": "PM · ECO Module 3 Q16", "subject": "PM"}, {"id": "PM:ECO-M4-Q8", "src": "ECO 오답", "module": "09-4", "tag": "Surprise 결합 효과 비교", "vig": 69, "stem": "Based on the data in Exhibit 2, which fund is most sensitive to the combined surprises in inflation and GDP growth in Exhibit 3?", "opts": {"A": "Fund A", "B": "Fund B", "C": "Fund C"}, "ans": "A", "en": "A is correct. The effect of the surprises in inflation and GDP growth on the returns of the three funds is calculated as the following.\n\nChange in Portfolio Return Because of Surprise in\nFund\nInflation\nGDP Growth\nA\n0.5 × 0.2% = 0.10%\n1.0 × −0.5% = −0.50%\nB\n1.6 × 0.2% = 0.32%\n0.0 × −0.5% = 0.00%\nC\n1.0 × 0.2% = 0.20%\n1.1 × −0.5% = −0.55%\nThe combined effects for the three funds are the following.\nFund A: 0.10% + (−0.50%) = −0.40%\nFund B: 0.32% + (0.00%) = 0.32%\nFund C: 0.20% + (−0.55%) = −0.35%\nTherefore, Fund A is the most sensitive to the surprises in inflation and GDP growth in Exhibit 3.", "ko": "각 펀드의 surprise 효과 = b_INF × 0.2% + b_GDP × (−0.5%). A: 0.10 − 0.50 = −0.40%, B: 0.32 + 0 = +0.32%, C: 0.20 − 0.55 = −0.35%. 절댓값이 가장 큰 Fund A가 가장 민감.", "trap": "개별 요인 하나가 아니라 결합 효과의 크기(절댓값)를 비교.", "f": "Σ bik × Fk", "why": {"B": "Fund B는 인플레이션 민감도(1.6)가 가장 크지만 GDP 민감도가 0이라 결합 효과는 +0.32%로 A보다 작습니다.", "C": "Fund C는 GDP 효과(−0.55%)가 가장 크지만 인플레이션 효과(+0.20%)가 일부 상쇄해 결합 효과는 −0.35%입니다."}, "orig": "PM · ECO Module 4 Q8", "subject": "PM"}, {"id": "PM:ECO-M4-Q28", "src": "ECO 오답", "module": "09-4", "tag": "요인 노출과 투자자 적합성", "vig": 70, "stem": "Based solely on the factor model, is Fund D an appropriate investment for Lakemont University?", "opts": {"A": "Yes", "B": "No, because of Fund D's sensitivity to inflation risk", "C": "No, because of Fund D's sensitivity to time horizon risk"}, "ans": "B", "en": "Correct because Fund D has a positive factor sensitivity to time horizon risk and a negative factor sensitivity to inflation risk. Investors may tilt their strategic asset allocation or investments within an asset class to capture the associated risk premiums for risks that do not much affect them. Lakemont University has an investment time horizon of 30 years and is not much affected by time horizon risk. Therefore, it has a comparative advantage in bearing time horizon risk. However, the activities supported by Lakemont University are sensitive to inflation risk. Therefore, Fund D's negative factor sensitivity to inflation risk does not help Lakemont University in reducing its exposure to inflation risk.\nA: Incorrect because the activities supported by Lakemont University are sensitive to inflation risk. Therefore, Fund D's negative factor sensitivity to inflation risk does not help Lakemont University in reducing its exposure to inflation risk.\nC: Incorrect because Lakemont University has an investment time horizon of 30 years and is not much affected by time horizon risk. Therefore, it has a comparative advantage in bearing time horizon risk.", "ko": "Lakemont: 투자기간 30년 → time horizon risk의 영향을 별로 받지 않아 그 위험을 질 수 있는 비교우위가 있음. 하지만 지원 활동이 인플레이션에 민감 → 인플레이션 헤지가 필요. Fund D의 인플레이션 민감도가 음수(−0.4)라 인플레이션 위험을 오히려 키우므로 부적합.", "trap": "자기에게 영향이 작은 위험은 감수(프리미엄 획득), 이미 노출된 위험은 헤지.", "f": "", "why": {"A": "Fund D의 음(−)의 인플레이션 민감도는 Lakemont의 인플레이션 노출을 줄여주지 못해 적합하지 않습니다.", "C": "장기 투자자인 Lakemont는 time horizon risk를 감당할 수 있으므로 양(+)의 time horizon 민감도는 문제가 아닙니다."}, "orig": "PM · ECO Module 4 Q28", "subject": "PM"}, {"id": "PM:ECO-M4-Q31", "src": "ECO 오답", "module": "09-4", "tag": "Fundamental 모형 기대수익률 계산", "vig": 71, "stem": "Based on Exhibit 1 and other information provided by Yusuf, the expected return on the portfolio is closest to:", "opts": {"A": "8.90%.", "B": "11.28%.", "C": "12.58%."}, "ans": "C", "en": "C is correct. Expected return = RF + Σ (portfolio sensitivity × factor return) = 1.3% + 1.05(3.5%) + 0.5(4.7%) + (−0.6)(−4.5%) + 0.5(5.1%) = 1.3% + 3.675% + 2.35% + 2.7% + 2.55% = 12.58%.\nA: Incorrect. This calculation neglects to add the Market factor (8.90%).\nB: Incorrect. This calculation neglects to add the risk-free rate of 1.3% (11.28%).", "ko": "E(R) = Rf + Σ b × 요인 프리미엄 = 1.3 + 1.05(3.5) + 0.5(4.7) + (−0.6)(−4.5) + 0.5(5.1) = 1.3 + 3.675 + 2.35 + 2.7 + 2.55 = 12.58%.", "trap": "Rf와 모든 요인(Market 포함)을 빠짐없이 더하기. Value는 음 × 음 = +.", "f": "E(RP) = Rf + Σ bP,k × λk", "why": {"A": "8.90%는 Market 요인(1.05 × 3.5% = 3.675%)을 빠뜨린 값입니다.", "B": "11.28%는 무위험이자율(1.3%)을 빠뜨린 값입니다."}, "orig": "PM · ECO Module 4 Q31", "subject": "PM"}, {"id": "PM:ECO-M4-Q33", "src": "ECO 오답", "module": "09-4", "tag": "요인별 active return 기여", "vig": 71, "stem": "Which of the following analysts most likely provides the correct answer to Yusuf’s question on the contribution to active return?", "opts": {"A": "Quek", "B": "Cerra", "C": "Singh"}, "ans": "B", "en": "B is correct. Cerra is correct. Contribution to active return = (portfolio sensitivity − benchmark sensitivity) × factor return:\nMarket: (1.05 − 1.00)(3.5%) = 0.175%\nSmall-Cap: (0.5 − 0.3)(4.7%) = 0.94%\nValue: (−0.6 − 0.2)(−4.5%) = 3.6%\nMomentum: (0.5 − 0.1)(5.1%) = 2.04%\nThe Value factor has the highest contribution to active return.", "ko": "기여 = (bP − bB) × 요인수익률. Market: 0.05 × 3.5 = 0.175%, Small-cap: 0.2 × 4.7 = 0.94%, Value: (−0.8) × (−4.5) = 3.6%, Momentum: 0.4 × 5.1 = 2.04% → Value가 가장 큼 → Cerra가 맞음.", "trap": "요인수익률 크기가 아니라 '민감도 차이 × 요인수익률'. 음 × 음 = +.", "f": "기여k = (bP,k − bB,k) × Fk", "why": {"A": "Momentum 기여는 2.04%로 Value(3.6%)보다 작습니다. Momentum 요인수익률(5.1%)이 가장 높다고 기여도 가장 큰 것은 아닙니다.", "C": "Market은 민감도 차이가 0.05에 불과해 기여가 0.175%로 가장 작습니다."}, "orig": "PM · ECO Module 4 Q33", "subject": "PM"}, {"id": "PM:ECO-M4-Q60", "src": "ECO 오답", "module": "09-4", "tag": "Macro 모형 기대수익률 = 가중 절편", "vig": null, "stem": "The returns of stocks X and Y are given by a macroeconomic factor model and expressed as follows:\nRX = 0.08 – 0.05F1 + 0.03F2 + εX\nRY = 0.16 + 0.02F1 + 0.04F2 + εY\nwhere F1 and F2 reflect surprises in two macroeconomic factors. If a portfolio has one quarter of its investment in Stock X and the rest in Stock Y, the portfolio's expected return is closest to:", "opts": {"A": "12%.", "B": "14%.", "C": "18%."}, "ans": "B", "en": "Correct because the expected return of an asset in a macroeconomic factor model is given by the intercept term. Hence, the expected return of the portfolio is computed as the weighted average of the intercepts in the expressions for RX and RY, i.e. (1/4)(0.08) + (3/4)(0.16) = 0.14 = 14%.\nA: Incorrect because here the simple average of both intercepts is used, i.e. (0.08 + 0.16)/2 = 0.12 = 12%, instead of the weighted average.\nC: Incorrect because here the weights have been applied to the intercepts and all independent variable coefficients as well, i.e. (1/4)(0.08 – 0.05 + 0.03) + (3/4)(0.16 + 0.02 + 0.04) = 0.18 = 18%, instead of the intercepts only.", "ko": "Macro 모형의 기대수익률 = 절편. 포트폴리오 기대수익률 = (1/4)(8%) + (3/4)(16%) = 2% + 12% = 14%.", "trap": "기대수익률 = 절편의 가중평균. 계수는 surprise가 있을 때만 영향.", "f": "E(RP) = Σ wi·ai", "why": {"A": "12%는 두 절편을 단순 평균한 값입니다. 비중(1/4, 3/4)을 적용해야 합니다.", "C": "18%는 절편에 요인 계수까지 더한 값입니다. Surprise의 기대값은 0이라 계수는 기대수익률에 들어가지 않습니다."}, "orig": "PM · ECO Module 4 Q60", "subject": "PM"}, {"id": "PM:VAR-M4-03", "module": "09-4", "tag": "요인별 active return 기여 (음수 요인)", "orig": "PM · 변형 (ECO M4 Q33, 오답노트 R37)", "stem": "A portfolio has a sensitivity of 0.8 to a size factor, while its benchmark has a sensitivity of 1.2. If the size factor return for the period is −2.0%, the contribution of the size factor to the portfolio’s active return is closest to:", "opts": {"A": "−0.8%.", "B": "+0.8%.", "C": "−1.6%."}, "ans": "B", "en": "Contribution = (bP − bB) × F = (0.8 − 1.2) × (−2.0%) = (−0.4)(−2.0%) = +0.8%.", "ko": "기여 = (bP − bB) × F = (0.8 − 1.2) × (−2.0%) = (−0.4) × (−2.0%) = +0.8%. 벤치마크보다 덜 노출된 요인이 하락해 이득.", "why": {"A": "부호를 놓쳤습니다. 민감도 차이(−0.4)와 요인수익률(−2.0%)이 모두 음수라 곱은 양수입니다.", "C": "−1.6%는 포트폴리오 민감도만 곱한 값(0.8 × −2.0%)입니다. 벤치마크와의 차이를 써야 합니다."}, "trap": "민감도 '차이' × 요인수익률. 음 × 음 = +.", "f": "기여 = (bP − bB) × F", "src": "변형", "vig": null, "subject": "PM"}, {"id": "PM:ECO-M5-Q5", "src": "ECO 오답", "module": "09-5", "tag": "VaR 한계: 유동성 위험 미반영", "vig": 72, "stem": "Which of the following statements should not be included in Abell’s report to management regarding the use of risk measures in capital allocation decisions?", "opts": {"A": "VaR measures capture the increased liquidity risk during stress periods.", "B": "Stress tests and scenario analysis can be used to evaluate the effect of outlier events on each line of business.", "C": "VaR approaches that can accommodate a non-normal distribution are critical to understand relative risk across lines of business."}, "ans": "A", "en": "A is correct. VaR measures do not capture liquidity risk. If some assets in a portfolio are relatively illiquid, VaR could be understated, even under normal market conditions. Additionally, liquidity squeezes are frequently associated with tail events and major market downturns, thereby exacerbating the risk.", "ko": "VaR는 유동성 위험을 반영하지 못함 → 비유동 자산이 있으면 평상시에도 VaR가 과소평가되고, 위기 때는 유동성 경색이 tail event와 함께 와서 위험이 더 커짐. 그래서 A는 보고서에 넣으면 안 되는 문장.", "trap": "VaR 한계: 유동성 미반영, 정규분포 가정 시 fat tail 과소평가, 위기 시 상관관계 급등 미반영.", "f": "", "why": {"B": "스트레스 테스트와 시나리오 분석으로 극단적 사건이 각 사업부에 미치는 영향을 평가할 수 있다는 것은 맞는 내용이라 보고서에 넣어도 됩니다.", "C": "비정규 분포를 다룰 수 있는 VaR 방법(historical, Monte Carlo)은 tail risk를 비교하는 데 중요하므로 맞는 내용입니다."}, "orig": "PM · ECO Module 5 Q5", "subject": "PM"}, {"id": "PM:ECO-M5-Q7", "src": "ECO 오답", "module": "09-5", "tag": "VaR 한계: 변동성 국면 변화", "vig": 73, "stem": "The number of Flusk’s VaR breaches most likely resulted from:", "opts": {"A": "using a standard normal distribution in the VaR model.", "B": "using a 95% confidence interval instead of a 99% confidence interval.", "C": "lower market volatility during the last year compared with the lookback period."}, "ans": "C", "en": "C is correct. Flusk experienced zero daily VaR breaches over the last year yet incurred a substantial loss. A limitation of VaR is its vulnerability to different volatility regimes. A portfolio might remain under its VaR limit every day but lose an amount approaching this limit each day. If market volatility during the last year is lower than in the lookback period, the portfolio could accumulate a substantial loss without technically breaching the VaR constraint.\nA is incorrect because VaR was calculated using historical simulation, so the distribution used was based on actual historical changes in the key risk factors experienced during the lookback period. Thus, the distribution is not characterized using estimates of the mean return, the standard deviation, or the correlations among the risk factors in the portfolio. In contrast, the parametric method of estimating VaR generally assumes that the distribution of returns for the risk factors is normal.\nB is incorrect because a specification with a higher confidence level will produce a higher VaR. If a 99% confidence interval was used to calculate historical VaR, the VaR would be larger (larger expected minimum loss). During the last year, none of Flusk’s losses were substantial enough to breach the 5% VaR number (95% confidence interval); therefore, if McKee used a 1% VaR (99% confidence interval), the number of VaR breaches would not change.", "ko": "VaR breach가 0번인데 큰 손실 → lookback 기간보다 최근 1년 변동성이 낮아서, 매일 VaR 한도 근처의 손실이 쌓여도 한도를 넘지 않은 것. VaR는 변동성 국면 변화에 취약함.", "trap": "Breach 0 + 누적 손실 큼 = 저변동성 국면에서 한도 직전 손실이 반복된 것.", "f": "", "why": {"A": "Historical simulation 방법을 썼기 때문에 정규분포를 가정하지 않았습니다. 정규분포 가정은 parametric 방법입니다.", "B": "99%로 바꾸면 VaR가 더 커져서 breach는 오히려 더 줄거나 그대로입니다. 95%에서도 breach가 0이었습니다."}, "orig": "PM · ECO Module 5 Q7", "subject": "PM"}, {"id": "PM:ECO-M5-Q26", "src": "ECO 오답", "module": "09-5", "tag": "채권 비중 큰 포트폴리오 → duration", "vig": 74, "stem": "What additional risk measures would be most appropriate to add to Hamilton’s risk assessment?", "opts": {"A": "Delta", "B": "Duration", "C": "Tracking error"}, "ans": "B", "en": "B is correct. Given the large fixed-income exposure in the LICIA portfolio, examining the portfolio duration more closely would be prudent. Duration is the primary sensitivity exposure measure for fixed-income investments.", "ko": "LICIA 포트폴리오는 채권(국채·모기지/인프라 대출·회사채) 비중이 90% → 채권의 핵심 민감도 지표인 duration을 추가하는 것이 적절.", "trap": "채권 = duration, 옵션 = delta/gamma, 벤치마크 대비 운용 = tracking error.", "f": "", "why": {"A": "Delta는 옵션의 민감도 지표입니다. 이 포트폴리오에는 옵션 노출이 거의 없습니다.", "C": "Tracking error는 벤치마크 대비 위험이라 보험사의 절대 위험 평가에 맞지 않습니다."}, "orig": "PM · ECO Module 5 Q26", "subject": "PM"}, {"id": "PM:ECO-M5-Q48", "src": "ECO 오답", "module": "09-5", "tag": "경제적 자본 대비 수익률 vs hurdle rate", "vig": 75, "stem": "With respect to capital allocation, which lending group listed in Exhibit 1 is least likely attractive?", "opts": {"A": "Secured", "B": "Cash Flow", "C": "Real Estate"}, "ans": "B", "en": "Correct. From a capital allocation perspective, the Cash Flow lending group is least attractive because its 10% rate of return is below the 11% minimum return (hurdle rate) required for the corporate banking division. The hurdle rate is being used as a risk measure since the $3,000 million aggregate amount of economic capital currently being consumed by the three lending groups exceeds the $2,800 million regulatory amount established for corporate banking. The rate of return is calculated as Portfolio return/Economic capital. The calculation for the Cash Flow group is $120 million/$1,200 million = 10%.\nA: Incorrect. The Secured lending group is not least attractive, because its 15% rate of return ($120 million/$800 million) exceeds the 11% hurdle rate.\nC: Incorrect. The Real Estate lending group is not least attractive, because its 12% rate of return ($120 million/$1,000 million) exceeds the 11% hurdle rate.", "ko": "자본 대비 수익률 = 수익/자본 한도. Secured 120/800 = 15%, Cash Flow 120/1,200 = 10%, Real Estate 120/1,000 = 12%. 사용 자본 합계($3,000M)가 할당 자본($2,800M)을 넘어 hurdle rate 11%가 기준 → 미달인 Cash Flow가 가장 덜 매력적.", "trap": "수익 금액이 같으면 분모(사용 자본)가 가장 큰 그룹의 수익률이 가장 낮음.", "f": "Return on capital = Return / Capital limit", "why": {"A": "Secured의 수익률은 15%로 hurdle rate 11%보다 높습니다.", "C": "Real Estate의 수익률은 12%로 hurdle rate 11%보다 높습니다. 포지션 한도가 가장 작다고 매력이 떨어지는 것은 아닙니다."}, "orig": "PM · ECO Module 5 Q48", "subject": "PM"}, {"id": "PM:ECO-M5-Q52", "src": "ECO 오답", "module": "09-5", "tag": "기관 유형별 위험 지표", "vig": 76, "stem": "In Exhibit 1 provided to Axiomada, for which institutional investor type does Muckroth most likely accurately list important risk categories?", "opts": {"A": "Bank", "B": "Hedge fund", "C": "Pension plan"}, "ans": "A", "en": "Correct because the Muckroth team is accurately describing risk considerations facing a bank, which include liquidity gap, VaR, leverage, key rate duration, operational risk capital, and scenario analysis.\nB: Incorrect because hedge funds would not be focused on categories such as tracking error or active shares, which are more traditional asset manager metrics, and instead would be focused on categories such as sensitivities, scenario analysis, gross exposure, and drawdown.\nC: Incorrect because pension plans are less likely to focus on items such as operational risk capital and would include VaR (surplus at risk), interest rate and curve risk, glide path, and liability hedging exposures instead of return-generating exposures.", "ko": "은행: liquidity gap, VaR, leverage, scenario analysis, key rate duration, operational risk capital → 표의 은행 열이 정확. 헤지펀드는 tracking error·active share(전통 운용사 지표) 대신 민감도·gross exposure·drawdown을 봄. 연기금은 operational risk capital 대신 surplus at risk·금리/커브 위험·glide path·부채 헤지 노출을 봄.", "trap": "Active share·tracking error = 전통 운용사. 헤지펀드 = VaR, gross exposure, leverage, drawdown.", "f": "", "why": {"B": "헤지펀드 열에 tracking error와 active share가 표시돼 있는데, 이는 벤치마크가 있는 전통 운용사 지표입니다.", "C": "연기금 열에 operational risk capital이 표시돼 있는데, 연기금은 이것보다 surplus at risk, 부채 헤지 노출 등을 중시합니다."}, "orig": "PM · ECO Module 5 Q52", "subject": "PM"}, {"id": "PM:ECO-M5-Q63", "src": "ECO 오답", "module": "09-5", "tag": "한 번도 없던 극단 사건 → stress test", "vig": null, "stem": "Alessia Rossi is the chief risk officer for Bellotti Bank, which operates in a region dominated by two established industries. Historically, these industries have provided stable employment to the region. Rossi would like to undertake an assessment of how the bank’s loans would perform if the regional economy lost one of these industries. The best choice for this assessment is a(n):", "opts": {"A": "stress test.", "B": "historical scenario analysis.", "C": "analysis of loan portfolio duration."}, "ans": "A", "en": "Correct because a stress test would be appropriate. The region is dominated by two industries that provide stable employment to the region, so the loss of one of these industries would represent an extreme negative event impacting the bank’s loan portfolio. Stress tests apply extreme negative stress to a particular portfolio exposure.\nB: Incorrect because historically, the two established industries have provided stable employment to the region. This suggests that the industries have not failed in the past, therefore a historical scenario analysis will not give an insight as to the effect of one of the industries leaving the region.\nC: Incorrect because an analysis of the bank’s loan portfolio duration would measure the portfolio’s sensitivity to changes in interest rates, rather than identify the impact of an extreme negative event such as the loss of a key industry that provides employment to a region.", "ko": "지역 핵심 산업 하나가 사라지는 것은 과거에 없던 극단적 부정 사건 → 특정 노출에 극단적 충격을 주는 stress test가 적합.", "trap": "과거에 없던 일 → historical scenario 불가 → stress test(가상).", "f": "", "why": {"B": "두 산업은 과거에 계속 안정적이었으므로 참고할 과거 사례가 없어 historical scenario 분석은 쓸 수 없습니다.", "C": "Duration은 금리 민감도라서 핵심 산업 상실 같은 극단적 사건의 영향을 측정하지 못합니다."}, "orig": "PM · ECO Module 5 Q63", "subject": "PM"}, {"id": "PM:ECO-M5-Q67", "src": "ECO 오답", "module": "09-5", "tag": "Position limit", "vig": null, "stem": "Position limits:", "opts": {"A": "take volatility into account.", "B": "are good controls on overconcentration.", "C": "require a reduction in the size of a portfolio when a loss of a particular size occurs in a specified period."}, "ans": "B", "en": "Correct because position limits are limits on the market value of any given investment, or the notional principal amount for a derivatives contract. They can be expressed in currency units or as a percentage of some other value, such as net assets. Position limits do not take into account duration, volatility, and correlation but they are excellent controls on overconcentration.\nA: Incorrect because position limits do not take into account duration, volatility, and correlation. In contrast, VaR does take these factors into account.\nC: Incorrect because stop-loss limits, rather than position limits, requires a reduction in the size of a portfolio, or its complete liquidation, when a loss of a particular size occurs in a specified period.", "ko": "Position limit = 개별 투자의 시장가치(또는 파생상품 명목금액) 한도 → 과도한 집중을 막는 데 탁월. 단, duration·변동성·상관관계는 반영하지 않음.", "trap": "Position limit = 집중 통제, stop-loss = 손실 기준 축소.", "f": "", "why": {"A": "Position limit은 변동성을 반영하지 않습니다. 변동성을 반영하는 것은 VaR입니다.", "C": "일정 손실이 나면 포트폴리오를 줄이는 것은 stop-loss limit입니다."}, "orig": "PM · ECO Module 5 Q67", "subject": "PM"}, {"id": "Mock1:mock1-1-Q7", "src": "모의고사 오답", "module": "10-EQ", "tag": "지배권 할인 → 지배권 프리미엄 변환 + DLOM", "vig": 77, "stem": "After applying the appropriate discounts or premiums, the value of Calcyte's equity (in $ millions) to the private buyout client should be closest to:", "opts": {"A": "8,898.", "B": "9,395.", "C": "11,744."}, "ans": "B", "en": "A. 8,898. — Incorrect\nIncorrect because the control premium is not adjusted when calculating the estimated equity value.\nValue of equity to the client after adjusting for control premium and DLOM\n= Equity value × (1 + Control premium) × (1 – DLOM)\n= $9,043 million × (1 + 0.23) × (1 – 0.20)\n≈ $8,898 million\nB. 9,395. — Correct\nCorrect because the market equity value needs to be adjusted to add a control premium. Also, since the valuation is being conducted from the perspective of a private buyer, a discount for lack of marketability is appropriate since the firm will not be publicly traded.\nThe discount for lack of marketability (DLOM) is given as 20%, but the discount for lack of control of 23% needs to be converted to a control premium. The conversion is:\nDiscount for lack of control = 1 – [1/(1 + Control premium)]\n1/(1 + Control premium) = 1 – Discount for lack of control\n(1 + Control premium) = 1/(1 – Discount for lack of control)\nControl premium = [1/(1 – Discount for lack of control)] – 1\nControl premium = [1/(1 – 0.23)] – 1\nControl premium ≈ 0.2987 or 29.87%\nValue of equity to the client after adjusting for control premium and DLOM\n= Equity value × (1 + Control premium) × (1 – DLOM)\n= $9,043 million × (1 + 0.2987) × (1 – 0.2000)\n≈ $9,395 million\nC. 11,744. — Incorrect\nIncorrect because the discount for lack of marketability is not applied when calculating the estimated equity value.\nValue of equity to the client after adjusting for control premium\n= Equity value × (1 + Control premium)\n= $9,043 million × (1 + 0.2987)\n≈ $11,744 million", "ko": "상장 시장가치(소수지분 기준)를 비상장 지배지분 매수자 관점으로 바꾸는 문제. DLOC 23%를 프리미엄으로 바꾸면 1/(1 − 0.23) − 1 = 29.87%. 매수 후 비상장이므로 DLOM 20%도 적용: 9,043 × 1.2987 × 0.80 ≈ 9,395.", "trap": "할인율 23%를 그대로 프리미엄으로 쓰면 A(8,898). DLOC와 control premium은 숫자가 다르다.", "f": "Control premium = 1 / (1 − DLOC) − 1 / 가치 = 시장가치 × (1 + CP) × (1 − DLOM)", "why": {"A": "할인율 23%를 프리미엄으로 그대로 썼습니다. 1/(1 − 0.23) − 1 = 29.87%로 바꿔야 합니다.", "C": "비상장이 되므로 적용해야 할 DLOM 20%를 빠뜨렸습니다."}, "orig": "Mock 1 Session 1 Q7", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q9", "src": "모의고사 오답", "module": "10-FSA", "tag": "지분법: 초과매입가 상각 반영 장부가", "vig": 78, "stem": "The estimated carrying value for RMRL's investment in Begonia at the end of the current year should be:", "opts": {"A": "$12,342,500.", "B": "$12,450,000.", "C": "$13,392,500."}, "ans": "A", "en": "A. $12,342,500. — Correct\nCorrect because RMRL has significant influence over Begonia and should account for Begonia as an investment in associate using the equity method. The excess purchase price must be allocated and then amortized periodically. The investor must directly record these adjustment effects by reducing the carrying amount of the investment on its balance sheet and by reducing the investee's profit recognized on its income statement. There are 12 months of amortization that must be recognized in the current year.\nThe annual amortization of excess purchase price attributable to plant and equipment = 0.5 × $2,150,000/10 = $1,075,000/10 = $107,500. Note that land is not amortized.\nThe estimated carrying value of the investment in Begonia at the end of the current year is:\n= Purchase price + RMRL's share of Begonia's net income –\nAnnual amortization of the excess purchase price of plant and equipment\n= $12,000,000 + (30% × $1,500,000) – $107,500\n= $12,342,500.\nB. $12,450,000. — Incorrect\nIncorrect because this calculation does not account for the annual amortization of the excess purchase price attributable to Begonia's plant and equipment:\n= $12,000,00 + (30% × $1,500,000)\n= $12,450,000\nC. $13,392,500. — Incorrect\nIncorrect because this calculation includes 100% of Begonia's net income instead of RMRL's 30% share of Begonia's net income:\n= $12,000,000 + $1,500,000 – $107,500\n= $13,392,500", "ko": "유의적 영향력 → 지분법. 초과매입가 중 설비 몫(지분 50% × $2,150,000 = $1,075,000)을 10년 상각: 연 $107,500 (토지는 상각 안 함). 장부가 = 12,000,000 + 30% × 1,500,000 − 107,500 = $12,342,500.", "trap": "투자회사 몫(30%)만 반영해야 한다. 피투자회사 순이익 100%를 더하면 C.", "f": "기말 장부가 = 취득가 + 지분율 × 순이익 − 배당 × 지분율 − 초과매입가 상각", "why": {"B": "초과매입가 중 설비 몫의 연간 상각액($107,500)을 빼지 않았습니다.", "C": "피투자회사 순이익 100%를 더했습니다. 지분율 30%만 반영해야 합니다."}, "orig": "Mock 1 Session 1 Q9", "subject": "Mock1"}, {"id": "Mock1:mock1-1-Q14", "src": "모의고사 오답", "module": "10-FI", "tag": "기간구조 이론: 선도금리 상향 편의 → 유동성 선호", "vig": 79, "stem": "Which of the following term structure theories of interest rates is most consistent with Smith's beliefs?", "opts": {"A": "Preferred habitat", "B": "Liquidity preference", "C": "Unbiased expectations"}, "ans": "B", "en": "A. Preferred habitat — Incorrect\nIncorrect because preferred habit is a theory where lenders/borrowers will deviate from their strong preferences for certain segments of the yield curve to earn additional returns (if large enough). In this theory it is expectations and institutional factors that influence the shape of the yield curve. In the vignette, Smith states that forward rates are upwardly biased predictors of future spot rates. This statement does not describe the preferred habitat model.\nB. Liquidity preference — Correct\nCorrect because Smith's belief is that forward rates are an upwardly biased predictor of future spot rates. With an upward sloping yield curve it would be liquidity premiums that could explain this shape.\nC. Unbiased expectations — Incorrect\nIncorrect because unbiased expectations implies that expected rates will rise with an upward sloping yiel

ll be fully depreciated by using the straight-line method. Ernst has significant influence over Balto but it does not have control. During the current year, Balto reported €140 million in income and paid €40 million in dividends.   \n\nFor Cordeau, Ernst exchanged €1,800 million in shares to acquire a 75% controlling interest in Cordeau. The book value of Cordeau on 1 January was €2,000 million. On that date, Cordeau's inventory was undervalued by €60 million. All other recorded assets and liabilities were equal to their fair values. Cordeau applies the FIFO inventory valuation method and Ernst uses the partial goodwill method when it consolidates Cordeau. Cordeau's primary competitor is a US company that reports under US GAAP. For the current year, Cordeau reported net income of €240 million and paid €40 million in dividends.", "Dagmar AG is a European-based manufacturing firm that prepares its financial statements according to International Financial Reporting Standards (IFRS). Two members of Dagmar’s treasury group, Henrik Ferdinand and Adele Christoph, are reviewing Dagmar’s portfolio of investments. They are interested in the investment income reported during the year and whether any of the investments should be considered impaired or need to be reclassified.\n\nOn July 1 the company purchased €4,000 of 10-year bonds of Alme AG. The bonds have a 5% coupon payable annually and cost €3,705.60, reflecting the effective market rate of 6%. Dagmar is expecting to collect the interest and principal payments but if liquidity needs arise will sell the bonds. Ferdinand and Christophe start by reviewing how the bond is classified.\n\nThe company also holds bonds issued by Bergenfeld AG with a face value of €5 million and a coupon rate of 8%, payable semi-annually. The bonds have been held for 10 years and are classified as amortized cost.\n\nThe final investment is Dagmar’s longstanding holding of Elbe AG common shares. Elbe has been profitable and paid a consistent dividend every year since it was acquired, Additional details are available in Exhibit 1.\n\nExhibit 1 Additional Information Investment in Elbe AG (All € figures in 000s except per share data)\n\nAt the date of acquisition (February 28, 2008)\n# shares purchased\t1.8 million\nTotal shares outstanding\t6.0 million\nPrice paid\t€17 per share\nTotal net book value of Elbe\t€90,000\nExcess of fair market value of plant and equipment above book value\t€5,250\nExpected useful life remaining on plant and equipment\t15 years\nElbe uses straight-line depreciation for all of its tangible assets\nDagmar classified Elbe as an associate company\nAt December 31, 2019\nBook value of investment on Dagmar’s statement of financial position\t€59,022\nNet income reported by Elbe for 2019\t€12,375\nDividends paid by Elbe in 2019\t€0.50 per share\nFerdinand continues the meeting with the following statement:\n\n“Before we consider impairment, let us calculate the amount Elbe will contribute to Dagmar’s net earnings this year.”\n\nTurning to the Bergenfeld bonds, Christoph says:\n\n“If we’re looking for contributions to net earnings, I see an opportunity with the Bergenfeld bonds. The decline in interest rates over the years since the original purchase has significantly increased their market value. IFRS allows us to reclassify these bonds to fair value as a way to increase reported income in the period. It works well because the standards don’t require us to restate the prior periods when we reclassify.”", "Nation Resorts Ltd (Nation) is a US-based operator of destination vacation resorts. Resorts are divided into three types: Winter, which are located at ski mountains; Golf, which are located on championship courses in such locations as Arizona; and Seaside, which are located at world-class ocean beaches. The three types of resorts generally attract different types of vacationers and provide different vacation packages for different budgets. Although the Winter and Golf resorts are somewhat counter seasonal, the company still suffers from risks related to the US economy, as well as the risk of unfavorable local weather conditions (lack of snow or sun). To diversify and reduce these risks, Nation started purchasing properties in other geographic areas, including Europe and Central America.\n\nNation made its first non-domestic investment when it bought a resort in Jamaica on 1 May 2008. Initially, Nation provided managers to assist in operating the resort but then hired local Jamaicans into its management development program, one of whom was recently appointed to a senior position at the resort. Nation invested in building and upgrading facilities, with the initial expansion financing provided by Nation’s US bank. Concerned about the high rate of inflation in Jamaica, which at the time of purchase averaged 20% per year over the previous three years, Nation kept any excess funds in US dollars. The company’s vacation packages are sold primarily in the United States, and its prices reflect competitive conditions in the US vacation market. In 2010, the Jamaican resort used local labor and supplies and was profitable for the first time. In addition, by that time, inflation had declined to 14% per year, and Nation expected to be able to reinvest any profits in the resort and start using a local bank for ongoing financing needs.\n\nOn 1 July 2010, Nation acquired its first European resort, Val Blanc SA, a ski resort in the Alps region of France. Nation paid €28 million for 100% of the company. The resort attracts skiers primarily from France and other European countries. The transition went very well, and Nation left the local managers in place to make all operating and financial decisions. By the end of 2011, Nation’s only financial contribution to the resort was the initial equity investment. Exhibit 1 shows financial statements for the ski resort at acquisition and for the following six months.\n\nExhibit 1 Val Blanc Financial Statements (€ thousands)\n\n \tIncome Statement\t\n \t31 Dec. 2010 (6 months)\t30 Jun. 2010 (12 months)\nResort revenues\t12,025\t46,805\nOperating expenses\t9,800\t35,105\nDepreciation and amortization\t1,750\t4,000\nInterest expense\t1,200\t2,500\nEarnings before taxes\t–725\t5,200\nIncome taxes\t0\t1,300\nNet earnings\t–725\t3,900\n \n \tStatement of Financial Position\t\n \t31 Dec. 2010\t30 Jun. 2010a\nCash and marketable securities\t5,750\t5,000\nAccounts receivable\t6,500\t3,000\nInventory\t8,000b\t5,000\nTotal current assets\t20,250\t13,000\nProperty, plant, and equipment\t41,750\t43,500\nIntangible assets\t5,000\t5,000\nTotal assets\t67,000\t61,500\n \nCurrent liabilities\t12,225\t5,000\nLong-term debt\t26,000\t27,000\nShare capital\t20,000\t20,000\nRetained earnings\t8,775\t9,500\nTotal liabilities and equity\t67,000\t61,500\na The 30 June 2010 Statement of Financial Position reflects the fair value of the identifiable assets and liabilities of Val Blanc at acquisition.\nb The 31 December 2010 inventory was acquired evenly throughout the period since acquisition.\nIn early January 2011, Paul Nakiska, a business analyst with Nation, met with Nation’s manager of financial reporting, Max Chara, to discuss how the company should account for the two non-domestic resorts in the 2010 financial statements and the impact the resorts would have on Nation’s reported results. Nation has a 31 December year end and prepares its financial statements according to US GAAP.\n\nIn preparation for the meeting, Nakiska’s first task was to prepare the purchase price allocation of the Val Blanc acquisition using the acquisition method. He also gathered some exchange rate information related to the two resorts, shown in Exhibit 2.\n\nExhibit 2 Selected Exchange Rates\n\nDate\tUSD/JMD\tUSD/EUR\n5/1/2008\t0.0139\tN/A\n1/1/2010\t0.0115\t1.4368\n6/30/2010\t0.0117\t1.225\n12/31/2010\t0.0117\t1.3261\nAverage 2010\t0.0115\t1.3277\nAverage January–July 2010\t0.0113\t1.3303\nAverage July–December 2010\t0.0117\t1.3198\nNakiska started the meeting:\n\n“I suggest we use the current rate method for both our non-domestic subsidiaries because that will simplify our financial reporting. The current rate method also allows the key metrics we use to evaluate performance—the current ratio, fixed asset turnover, and operating margin—to be the same after translation as they are before.”\n\nChara replied:\n\n“I am not so concerned about the translated metrics because we evaluate the performance of each resort in its local currency. I am concerned, however, about the effect on Nation’s consolidated net income and return on equity.\n\nIf we use the temporal method for the resort in France, we can take advantage of the strengthening euro and report the translation gain on the income statement.\n\nI am also not concerned about using the same method for all subsidiaries if using different methods will help increase our net income.\n\nNakiska agreed to calculate the effects of the various translation methods and of the Val Blanc acquisition on the financial statements and send a report to Chara.", "Marcus Eriksson, chief financial officer of Trana AB, and Katrina Lars, director of financial reporting, are preparing the company’s 2015 annual report. Today’s meeting is to discuss the transactions and disclosures related to Trana’s foreign operations. Trana, which reports under International Financial Reporting Standards (IFRS), is a Sweden-based retailer operating stores in three geographic locations: Sweden, the eurozone (with a current presence only in France, Germany, and Italy), and the United States. The stores in the eurozone and the United States are operated through a wholly owned subsidiary in each region. Consistent with Swedish accounting practice, the annual report includes separate financial statements for the parent company (Trana) and consolidated, or group, financial statements. The income statements are presented in Exhibit 1.\n\nExhibit 1 Trana AB Income Statements for the Years Ended 31 December\n\n \tConsolidated Income Statement (SEK millions)\t\tParent Income Statement (SEK million)\t\n \t2015\t2014\t2015\t2014\nSales\t30,200\t26,892\t4,700\t4,653\nCost of goods sold\t13,590\t12,639\t2,600\t2,650\nGross profit\t16,610\t14,253\t2,100\t2,003\nSelling expenses\t10,872\t9,143\t1,500\t1,525\nAdmin. expenses\t1,510\t1,076\t260\t200\nOperating profit\t4,228\t4,034\t340\t278\nNet other costs/losses\t10\t15\t2\t3\nEarnings before taxes\t4,218\t4,019\t338\t275\nIncome taxes\t1,122\t1,071\t74\t61\nNet profit\t3,096\t2,948\t264\t214\nEriksson and Lars start the meeting by reviewing some of the relevant currency exchange rates, shown in Exhibit 2. The functional currency for the eurozone and US subsidiaries is the local currency (EUR and USD, respectively), thus the financial statements of both are translated using the current rate method. Both subsidiaries are consistently profitable.\n\nExhibit 2 Exchange Rates\n\n \tSEK per EUR\tSEK per USD\nBeginning 2014\t8.43\t6.32\nAverage 2014\t8.555\t6.35\nEnd of 2014\t8.88\t6.38\nAverage 2015\t9.125\t7.595\nEnd of 2015\t9.31\t8.81\nNext, they review the performance and related disclosures by region. The number of stores operated in each region is shown in Exhibit 3.\n\nExhibit 3 Number of Stores by Region\n\nYear\tEurozone\tSweden\tUnited States\tTotal\n2014\t340\t99\t80\t519\n2015\t400\t100\t80\t580\nIn preparation for the meeting, Lars looked at the US region and calculated the effect of the change in the SEK/USD exchange rate on the increase in sales from 2014 to 2015. Her notes include the following:\n\nIn 2014, the sales per store, in SEK, were the same for both US and Swedish stores.\nThe sales per US store in USD remained constant in 2015.\nEriksson reminds Lars that Trana defines organic growth in retail as coming from two factors:\n\nincreasing the number of stores, and\nincreasing the sales per store in the local currency.\nHe says that he wants to provide disclosures related to the organic growth rate in domestic sales per store, by region, and asks Lars to calculate it for the eurozone region where the sales figures (in millions) were SEK18,394 in 2014 and SEK21,640 in 2015.\n\nIn 2012, at the start of Trana’s expansion into North American markets, the company established a subsidiary, Anart Inc., in a South American country to benefit from lower labor and shipping costs. The details of the Anart investment are as follows:\n\nAnart is 80% owned by Trana with 20% local investment.\nIt sells all of its production to Trana and Trana’s other subsidiaries and determines the transfer price as full cost plus 5%.\nIn 2015, sales (in millions) from Anart to Trana companies were SEK4,485 with net profit of SEK204.\nThe corporate tax rate in the country is 10%.\nThroughout 2013, the South American country experienced high rates of inflation, approaching 30% per year. Trana had originally assumed that the high inflation rate was temporary, but it has shown no signs of decreasing and is now a concern. Eriksson and Lars discuss the impact of Anart on Trana’s financial statements and Eriksson asks Lars:\n\n“Is the same accounting method being used this year to account for Anart in the consolidated financial statements as in prior years?”\n\nEriksson reminds Lars that there is a proposal in Sweden to reduce the corporate tax rate from the current 22% to 16.5%. He would like to provide pro-forma disclosures related to the potential change in net income this change could provide for Trana. He reminds Lars that the average tax rate for the eurozone countries where Trana operates is 30% and 25% in the United States. Sweden operates under a tax treaty with all countries in which it has subsidiaries, such that it will owe taxes on foreign earned income to the extent that the Swedish rate exceeds the foreign rate.\n\nIn closing the meeting, Eriksson mentions that Trana is undertaking a comprehensive review of its operations in 2016, and its objectives include reducing overall tax costs by lowering its effective tax rate and reducing foreign exchange gains and losses reported on the income statement.", "Kensington plc, a fictional company based in the United Kingdom, sponsors a DB pension plan for qualifying employees. Kensington prepares its financial statements under IFRS. The discount rate that the company used in estimating the present value of its pension obligation was 5.48%. Disclosures on Kensington’s pension plan in the company’s notes to financial statements for the year ended 31 December 20X1 included the following.\n\nComponents of periodic benefit cost\t\nService cost\t£228\nNet interest (income) expense\t273\nRemeasurements\t−18\nPeriodic pension cost\t£483\nChange in benefit obligation\t\nBenefit obligations at beginning of year\t£28,416\nService cost\t228\nInterest cost\t1,557\nBenefits paid\t−1,322\nActuarial gain or loss\t0\nBenefit obligations at end of year\t£28,879\nChange in plan assets\t\nFair value of plan assets at beginning of year\t£23,432\nActual return on plan assets\t1,302\nEmployer contributions\t693\nBenefits paid\t−1,322\nFair value of plan assets at end of year\t£24,105\nFunded status at beginning of year\t−£4,984\nFunded status at end of year\t−£4,774", "XYZ SA is a fictional company that uses a DB pension plan and stock option grants as part of its compensation to qualified employees. XYZ SA prepares its financial statements under IFRS.\n\nInformation on XYZ’s DB plan and volatility assumptions used to value stock option grants were as follows:\n\nXYZ SA Defined BP Information, Fiscal Year 2024\nEmployer contributions\t1,000\nCurrent service costs\t200\nPast service costs\t120\nDiscount rate used to estimate plan liabilities at beginning of year\t7.00%\nBenefit obligation at beginning of year\t42,000\nBenefit obligation at end of year\t41,720\nActuarial loss due to increase in plan obligation\t460\nPlan assets at beginning of year\t39,000\nPlan assets at end of year\t38,700\nActual return on plan assets\t2,700\nExpected rate of return on plan assets\t8.00%\nGrant Year\tWeighted Average Expected Volatility\n2024 Valuation Assumptions\t \n     2020–2024\t21.50%\n2023 Valuation Assumptions\t \n     2019–2023\t23.00%", "Sallie Kwan Industrials (SKI) is a Singapore-based automation equipment manufacturer that reports under US GAAP. The company disclosed the following information in a note to its financial statements titled “Share-Based Compensation.”\n\nUnder our Share Incentive Plan, the Company grants restricted stock units (“RSUs”) to its officers, employees, directors and other eligible persons of up to 83,000,000 Class A ordinary shares. RSUs vest 25% on the first anniversary year from the grant date and the remaining 75% vest in 12 substantially equal quarterly installments. RSU activity for the two years ended 31 December 20X2 was as follows.\n\n \tNumber of Shares\tWeighted Average Grant-Date Fair Value per Share (SGD)\nUnvested at 31 December 20X0\t4,754,972\t12.34\nGranted\t6,249,313\t20.50\nVested and settled\t(2,131,415)\t13.67\nForfeited\t(791,433)\t15.22\nUnvested at 31 December 20X1\t8,081,437\t18.02\nGranted\t5,034,735\t72.37\nVested and settled\t(3,332,063)\t19.25\nForfeited\t(442,181)\t28.74\nUnvested at 31 December 20X2\t9,341,928\t46.36\nShare-based compensation expense for RSUs is measured based on the fair value of the Company’s ordinary shares on the date of grant. SKI accounts for forfeitures as they occur.\n\nUnrecognized share-based compensation expense as of 31 December 20X0, 20X1, and 20X2 was SGD 58.7, SGD 145.6, and SGD 433.1 million, respectively.", "Terra Mercado is a retailer that compensates employees with a DB pension plan and stock options in addition to short-term benefits and a DC plan. Terra Mercado prepares its financial statements in accordance with US GAAP and reports in BRL.\n\nPeter Friedland, CFA, is an equity analyst concerned with earnings quality. He is particularly interested in whether the discretionary assumptions the company is making regarding compensation plans are contributing to the recent earnings growth at Terra Mercado. He gathers information from the company’s regulatory filings regarding the pension plan assumptions and assumptions related to option valuation for the three years ended 31 December 20X3.\n\nAssumptions Used for Terra Mercado DB Plan\n\t20X3\t20X2\t20X1\nExpected long-term rate of return on plan assets\t6.06%\t6.14%\t6.79%\nDiscount rate used to estimate pension obligation at beginning of year\t4.85%\t4.94%\t5.38%\nEstimated salary growth rate\t4.00%\t4.44%\t4.25%\nEstimated inflation rate\t3.00%\t2.72%\t2.45%\nAssumptions Used for Terra Mercado Option Grants\n\t20X3\t20X2\t20X1\nRisk-free rate\t4.6%\t3.8%\t2.4%\nExpected life\t5.0 yrs\t4.5 yrs\t5.0 yrs\nDividend yield\t1.0%\t0.0%\t0.0%\nExpected volatility\t29%\t31%\t35%", "Your colleague is building financial statement and discounted cash flow models for a company and has asked you review their modeling decisions with respect to the subject company’s post-employment and stock-based compensation plans.", "Adrienne Yu is an analyst with an international bank. She analyzes Ambleu S.A. (“Ambleu”), a multinational corporation, for a client presentation. Ambleu complies with IFRS, and its presentation currency is the Norvoltian krone (NVK). Ambleu’s two subsidiaries, Ngcorp and Cendaró, have different functional currencies: Ngcorp uses the Bindiar franc (₣B) and Cendaró uses the Crenland guinea (CRG).\n\nYu first analyzes the following three transactions to assess foreign currency transaction exposure:\n\nTransaction 1:\nCendaró sells goods to a non-domestic customer that pays in dollars on the purchase date.\n\nTransaction 2:\nNgcorp obtains a loan in Bindiar francs on 1 June 2016 from a European bank with the Norvoltian krone as its presentation currency.\n\nTransaction 3:\nAmbleu imports inventory from Bindiar under 45-day credit terms, and the payment is to be denominated in Bindiar francs.\n\nYu then reviews Transactions 2 and 3. She determines the method that Ambleu would use to translate Transaction 2 into its 31 December 2016 consolidated financial statements. While analyzing Transaction 3, Yu notes that Ambleu purchased inventory on 1 June 2016 for ₣B27,000/ton. Ambleu pays for the inventory on 15 July 2016. Exhibit 1 presents selected economic data for Bindiar and Crenland.\n\nExhibit 1\nSelected Economic Data for Bindiar and Crenland\nDate\tSpot ₣B/NVK Exchange Rate\tBindiar Inflation Rate (%)\tSpot CRG/NVK Exchange Rate\tCrenland Inflation Rate (%)\tCrenland GPI\n31 Dec 2015\t—\t—\t5.6780\t—\t100.0\n1 Jun 2016\t4.1779\t—\t—\t—\t—\n15 Jul 2016\t4.1790\t—\t—\t—\t—\n31 Dec 2016\t4.2374\t3.1\t8.6702\t40.6\t140.6\nAverage 2016\t4.3450\t—\t—\t—\t—\n31 Dec 2017\t4.3729\t2.1\t14.4810\t62.3\t228.2\nAverage 2017\t4.3618\t—\t11.5823\t—\t186.2\nPrior to reviewing the 2016 and 2017 consolidated financial statements of Ambleu, Yu meets with her supervisor, who asks Yu the following two questions:\n\nQuestion 1:\nWould a foreign currency translation loss reduce Ambleu’s net sales growth?\n\nQuestion 2:\nAccording to IFRS, what disclosures should be included relating to Ambleu’s treatment of foreign currency translation for Ngcorp?\n\nTo complete her assignment, Yu analyzes selected information and notes from Ambleu’s 2016 and 2017 consolidated financial statements, presented in Exhibit 2.\n\nExhibit 2\nSelected Information and Notes from Consolidated Financial Statements of Ambleu S.A. (in NVK millions)\nIncome Statement\t2017\t2016\t \tBalance Sheet\t2017\t2016\nRevenue (1)\t1,069\t1,034\t \tCash(3)\t467\t425\nProfit before tax\t294\t269\t \tIntangibles (4)\t575\t570\nIncome tax expense (2)\t−96\t−94\t \t—\t—\t—\nNet profit\t198\t175\t \t—\t—\t—\nNote 1: Cendaro’s revenue for 2017 is CRG125.23 million.\n\nNote 2: Ambleu’s consolidated income tax rate decreases by 2.29%, from 34.94% (=94/269) in 2016 to 32.65% (=96/294) in 2017. The largest component of the decrease stems from the 1.42% change in the effect of tax rates in non-domestic jurisdictions, which lowers Ambleu’s consolidated income tax rate in 2016 by 3.34% (=9/269) and in 2017 by 4.76% (=14/294).\n\nReconciliation of Income Tax Expense (in NVK millions)\n\t2017\t2016\nIncome tax at Ambleu’s domestic tax rate\t102\t92\nEffect of tax rates on non-domestic jurisdictions\t−14\t−9\nUnrecognized current year tax losses\t8\t11\nIncome tax expense\t96\t94\n\nNote 3: The parent company transferred NVK15 million to Cendaró on 1 January 2016 to purchase a patent from a competitor for CRG85.17 million.\n\nNote 4: The 2016 consolidated balance sheet includes Ngcorp’s total intangible assets of NVK3 million, which were added to Ngcorp’s balance sheet on 15 July 2016.", "Triofind, Inc. (Triofind), based in the country of Norvolt, provides wireless services to various countries, including Norvolt, Borliand, Abuelio, and Certait. The company’s presentation currency is the Norvolt euro (NER), and Triofind complies with IFRS. Triofind has two wholly owned subsidiaries, located in Borliand and Abuelio. The Borliand subsidiary (Triofind-B) was established on 30 June 2016, by Triofind both investing NER1,000,000, which was converted into Borliand dollars (BRD), and borrowing an additional BRD500,000.\n\nMarie Janssen, a financial analyst in Triofind’s Norvolt headquarters office, translates Triofind-B’s financial statements using the temporal method. Non-monetary assets are measured at cost under the lower of cost or market rule. Spot BRD/NER exchange rates are presented in Exhibit 1, and the balance sheet for Triofind-B is presented in Exhibit 2.\n\nExhibit 1\nSpot BRD/NER Exchange Rates\nDate\tBRD per NER\n30 June 2016\t1.15\nWeighted-average rate when inventory was acquired (2016)\t1.19\n31 December 2016\t1.20\nWeighted-average rate when inventory was acquired (2017)\t1.18\n30 June 2017\t1.17\nExhibit 2\nTriofind-B Balance Sheet for 2016 and 2017 (BRD)\nAssets\t31 December 2016\t30 June 2017\tLiabilities and Stockholders’ Equity\t31 December 2016\t30 June 2017\nCash\t900,000\t1,350,000\tNotes payable\t500,000\t500,000\nInventory\t750,000\t500,000\tCommon stock\t1,150,000\t1,150,000\n \t \t \tRetained earnings\t \t200,000\nTotal\t1,650,000\t1,850,000\tTotal\t1,650,000\t1,850,000\nJanssen next analyzes Triofind’s Abuelio subsidiary (Triofind-A), which uses the current rate method to translate its results into Norvolt euros. Triofind-A, which prices its goods in Abuelio pesos (ABP), sells mobile phones to a customer in Certait on 31 May 2017 and receives payment of 1 million Certait rand (CRD) on 31 July 2017.\n\nOn 31 May 2017, Triofind-A also received NER50,000 from Triofind and used the funds to purchase a new warehouse in Abuelio. Janssen translates the financial statements of Triofind-A as of 31 July 2017 and must determine the appropriate value for the warehouse in Triofind’s presentation currency. She observes that the cumulative Abuelio inflation rate exceeded 100% from 2015 to 2017. Spot exchange rates and inflation data are presented in Exhibit 3.\n\nExhibit 3\nSpot Exchange Rates and Inflation Data for Triofind-A\nDate\tNER per CRD\tNER per ABP\tAbuelio Monthly Inflation Rate (%)\n31 May 2017\t0.2667\t0.0496\t—\n30 June 2017\t0.2703\t0.0388\t25\n31 July 2017\t0.2632\t0.0312\t22\nJanssen gathers corporate tax rate data and company disclosure information to include in Triofind’s annual report. She determines that the corporate tax rates for Abuelio, Norvolt, and Borliand are 35%, 34%, and 0%, respectively, and that Norvolt exempts the non-domestic income of multinationals from taxation. Triofind-B constitutes 25% of Triofind’s net income, and Triofind-A constitutes 15%. Janssen also gathers data on components of net sales growth in different countries, presented in Exhibit 4.\n\nExhibit 4\nComponents of Net Sales Growth (%) Fiscal Year 2017\nCountry\tContribution from Volume Growth\tContribution from Price Growth\tForeign Currency Exchange\tNet Sales Growth\nAbuelio\t7\t6\t−2\t11\nBorliand\t4\t5\t4\t13\nNorvolt\t7\t3\t—\t10", "Consolidated Motors is a US-based corporation that sells mechanical engines and components used by electric utilities. Its Canadian subsidiary, Consol-Can, operates solely in Canada. It was created on 31 December 20X1, and Consolidated Motors determined at that time that it should use the US dollar as its functional currency.\n\nChief Financial Officer Monica Templeton was asked to explain to the board of directors how exchange rates affect the financial statements of both Consol-Can and the consolidated financial statements of Consolidated Motors. For the presentation, Templeton collects Consol-Can’s balance sheets for the years ended 20X1 and 20X2 (Exhibit 1), as well as relevant exchange rate information (Exhibit 2).\n\nExhibit 1\nConsol-Can Condensed Balance Sheet for Fiscal Years Ending 31 December (C$ millions)\nAccount\t20X2\t \t20X1\nCash\t135\t \t167\nAccounts receivable\t98\t \t—\nInventory\t77\t \t30\nFixed assets\t100\t \t100\nAccumulated depreciation\t(10)\t \t—\nTotal assets\t400\t \t297\nAccounts payable\t77\t \t22\nLong-term debt\t175\t \t175\nCommon stock\t100\t \t100\nRetained earnings\t48\t \t—\nTotal liabilities and shareholders’ equity\t400\t \t297\nExhibit 2\nExchange Rate Information\n \tUS$/C$\nRate on 31 December 20X1\t0.86\nAverage rate in 20X2\t0.92\nWeighted-average rate for inventory purchases\t0.92\nRate on 31 December 20X2\t0.95\nTempleton explains that Consol-Can uses the FIFO inventory accounting method and that purchases of C$300 million and the sell-through of that inventory occurred evenly throughout 20X2. Her presentation includes reporting the translated amounts in US dollars for each item, as well as associated translation-related gains and losses. The board responds with several questions.\n\nWould there be a reason to change the functional currency to the Canadian dollar?\n\nWould there be any translation effects for Consolidated Motors if the functional currency for Consol-Can were changed to the Canadian dollar?\n\nWould a change in the functional currency have any impact on financial statement ratios for the parent company?\n\nWhat would be the balance sheet exposure to translation effects if the functional currency were changed?", "Mark Crawley is an analyst at a London-based private equity firm and is reviewing the firm’s file on Thames Air Plc (Thames), a company it provides financing for. Thames uses International Financial Reporting Standards (IFRS) in the preparation of its financial statements. Thames is a relatively new airline based in the United Kingdom specializing in flights and vacation packages to Mediterranean locations, primarily Spain. Thames sells most of its flights and vacation packages to British residents in British pounds (GBP) and considers the costs of local competitors’ packages when determining its prices. Costs are incurred in multiple currencies:\n\nWage costs are primarily in GBP.\nTypical of the industry, airline fuel and lease costs are normally priced in US dollars (USD).\nThe landing fees paid at the vacation-area airports are in the local currency, primarily euros (EUR).\nFirst, Crawley turns his attention to the effect of the transactions undertaken in various currencies by Thames.\n\nHe reviews the change in the exchange rate for the USD to GBP during 2015, shown in Exhibit 1, and wonders what the effect of this change was on Thames’s operating income.\nAt year-end (31 December), Thames had a large outstanding payable in Spain related to landing fees that were incurred there evenly over the final quarter. The company paid the amount in full on its due date of 28 February. Crawley observed that the EUR to GBP exchange rate had changed between when the costs were incurred and the year-end and again by the payment date, as also shown in Exhibit 1.\nExhibit 1 Selected Exchange Rate Data\n\n \tGBP/USD Close\tGBP/EUR Close\n1-Jan-15\t0.64\t---\n30-Jun-15\t---\t0.72\n31-Dec-15\t0.68\t0.75\n28-Feb-16\t---\t0.73\nAverage, 1 July–31 December 2015\t---\t0.7325\nAverage, 1 October–31 December 2015\t---\t0.74\nBecause of the growing demand for vacation rentals in Spain during the past year, Thames acquired 100% of Tagus SA (Tagus), a Spanish company that owns a small vacation hotel and a few villas. Tagus has long-term debt outstanding from a Spanish bank that financed the 2012 purchase of the vacation properties, which will now be rented as part of the vacation packages offered by Thames. Tagus incurs all costs related to operating and maintaining the rental properties in EUR.\n\nSince the acquisition, all of Tagus’s revenue comes from Thames’s sales in Britain of the vacation packages. Tagus receives the amounts in GBP. But Tagus hopes to expand and start renting out any excess capacity of the properties, or newly acquired properties, to local tourists in the next few years. Crawley notices that Thames is using the temporal method to translate Tagus’s financial statements prior to consolidation and asks another analyst, Dee Chopra, if this is appropriate.\n\nCrawley next reviews the information in Exhibit 2 related to the Tagus acquisition to consider the effect on Thames’s year-end financial statements (31 December 2015).\n\nExhibit 2 Selected Financial Information of Tagus SA at Acquisition and Year-End (EUR thousands)\n\n \tBalance Sheet\t\tIncome Statement\t\n \tDate of Acquisition (30 June 2015)\tYear-End (31 December 2015)\tSix-Month Period Ending 31 December 2015\t\nCash and accounts receivable\t4,000\t4,200\tRevenues\t8,200\nInventory\t2,000\t2,250\tOperating costs\t6,485\nCapital assets\t15,000\t14,625\tOperating income\t1,715\nTotal assets\t21,000\t21,075\tInterest expense\t395\n\t\t\tEarnings before taxes\t1,320\nCurrent liabilities\t3,500\t3,400\tIncome taxes\t395\nLong-term debt\t10,000\t9,750\tEarnings after tax\t925\nShare capital\t5,000\t5,000\t \n\t\t\tDividends\t500\nRetained earnings\t2,500\t2,925\t \nAs the final step in his review, Crawley starts a ratio analysis of Thames and Tagus, and he asks Chopra which ratios, if any, would be unaffected by Thames’s choice of translation method for Tagus.", "Claus Petersen, a pension fund equity analyst, is preparing an analysis of Rhine AG for the upcoming quarterly fund meeting. Rhine is a Germany-based manufacturer that operates three distinct divisions: children’s products (infant car seats, strollers, cribs, etc.), recreational products (bicycles, bicycle trailers, etc.), and home furnishings (contemporary furniture). All three divisions sell through retail outlets around the world.\n\nThe company has been pursuing an aggressive growth strategy, achieved through both foreign acquisitions and organic growth. Petersen is interested in determining how well Rhine is allocating its resources between the three divisions and the effects of the foreign acquisitions on overall performance. Exhibit 1 summarizes selected divisional and corporate data for the current year and the prior year.\n\nExhibit 1 Rhine AG Selected Divisional and Corporate Data (€ millions)\n \tTotal for Three Divisions\t\tChildren's Products\t\tRecreational Products\t\tHome Furnishings\t\n \tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\nRevenues\t2,837.1\t2,775.5\t1,176.2\t1,236.2\t1,034.1\t930.0\t626.8\t609.3\nGross profit\t621.4\t640.8\t296.6\t337.6\t246.0\t220.3\t78.8\t82.9\nOperating profit\t172.7\t219.4\t64.7\t115.7\t72.9\t62.2\t35.1\t41.5\nEarnings before taxes (EBT)\t136.6\t170.0\t---\t---\t---\t---\t---\t---\nNet earnings after tax\t109.9\t132.3\t---\t---\t---\t---\t---\t---\nTotal assets\t2,498.0\t2,479.5\t1,270.9\t1,249.6\t961.5\t948.5\t265.6\t281.4\nCapital expenditures\t32.7\t42.3\t22.1\t30.0\t6.7\t8.6\t3.9\t3.7\nProportion of capital expenditures\t100%\t100%\t67.6%\t70.9%\t20.5%\t20.3%\t11.9%\t8.7%\nProportion of total assets\t100%\t100%\t50.9%\t50.4%\t38.5%\t38.3%\t10.6%\t11.3%\nPetersen’s preferred method to determine which division is becoming less significant over time is to review the relationship between capital expenditures and total assets by operating division. He plans to base his conclusion on the assumption that the current year's investment behavior is representative of future investment patterns.\n\nPetersen knows that revenues in the children’s products division have suffered because of declining birth rates in Europe and North America, but he believes that if Rhine can maintain the operating margin for this division then overall company profitability should not be affected.\n\nCorinna Berg, another analyst with the fund, reminds Petersen that during the current year, the US dollar weakened against the euro by 4% and that 50% of the sales in the recreational products division are sold in the United States.\n\nPetersen recalls that some of the recent global expansion was aimed at establishing operations in Ireland because its statutory corporate tax rate is lower than the German rate of 29.8%. If Petersen assumes that other tax credits were the same in the current year as the prior year, he can analyze changes in Rhine’s effective tax rate to determine whether the geographic mix of the company’s profits has changed in the current year.\n\nPetersen finally examines the company’s liquidity ratios, which are shown in Exhibit 2. Even though the company’s current and quick ratio have improved, his interpretation of the changes in the company’s cash conversion cycle is that the company’s liquidity position has deteriorated.\n\nExhibit 2 Rhine AG Selected Ratios\n\nRatio\tCurrent Year\tPrior Year\t2 Years Prior\nCurrent ratio\t2.31\t2.17\t1.16\nQuick ratio\t1.06\t0.89\t0.53\nAccounts receivable turnover\t5.82\t6.08\t6.11\nInventory turnover\t3.78\t3.91\t4.09\nAccounts payable turnover\t5.71\t5.78\t5.60\nCash conversion cycle\t95 days\t90 days\t84 days\nWorried that the balance sheet–based and cash flow–based accruals ratios (not shown) raise some concerns about the possible use of accruals to manage earnings, Petersen asks Berg for advice on what further type of analysis he should do as a follow-up on this issue.", "Quentin Abay, CFA, is an analyst for a private equity firm interested in purchasing Bickchip Enterprises, a conglomerate. His first task is to determine the trends in ROE and the main drivers of the trends using DuPont analysis. To do so he gathers the data in Exhibit 1.\n\nExhibit 1\nSelected Financial Data for Bickchip Enterprises (€ Thousands)\n \t2020\t2019\t2018\nRevenue\t72,448\t66,487\t55,781\nEarnings before interest and tax\t6,270\t4,710\t3,609\nEarnings before tax\t5,101\t4,114\t3,168\nNet income\t4,038\t3,345\t2,576\nAsset turnover\t0.79\t0.76\t0.68\nAssets/Equity\t3.09\t3.38\t3.43\nAfter conducting the DuPont analysis, Abay believes that his firm could increase the ROE without operational changes. Further, Abay thinks that ROE could improve if the company divested segments that were generating the lowest returns on capital employed (total assets less non-interest-bearing liabilities). Segment EBIT margins in 2020 were 11 percent for Automation Equipment, 5 percent for Power and Industrial, and 8 percent for Medical Equipment. Other relevant segment information is presented in Exhibit 2.\n\nExhibit 2\nSegment Data for Bickchip Enterprises (€ Thousands)\n \tCapital Employed\t\t\t\t\t\tCapital Expenditures (Excluding Acquisitions)\t\t\t\t\t\nOperating Segments\t2020\t\t2019\t\t2018\t\t2020\t\t2019\t\t2018\nAutomation Equipment\t10,705\t\t6,384\t\t5,647\t\t700\t\t743\t\t616\nPower and Industrial\t15,805\t\t13,195\t\t12,100\t\t900\t\t849\t\t634\nMedical Equipment\t22,870\t\t22,985\t\t22,587\t\t908\t\t824\t\t749\n \t49,380\t\t42,564\t\t40,334\t\t2,508\t\t2,416\t\t1,999\nAbay is also concerned with earnings quality, so he intends to calculate Bickchip’s cash-flow-based accruals ratio and the ratio of operating cash flow before interest and taxes to operating income. To do so, he prepares the information in Exhibit 3.\n\nExhibit 3\nEarnings Quality Data for Bickchip Enterprises (€ Thousands)\n \t2020\t2019\t2018\nNet income\t4,038\t3,345\t2,576\nNet cash flow provided by (used in) operating activitya\t9,822\t5,003\t3,198\nNet cash flow provided by (used in) investing activity\t(10,068)\t(4,315)\t(5,052)\nNet cash flow provided by (used in) financing activityb\t(5,792)\t1,540\t(2,241)\nAverage net operating assets\t43,192\t45,373\t40,421\na includes cash paid for taxes of:\t(1,930)\t(1,191)\t(1,093)\nb includes cash paid for interest of:\t(1,169)\t(596)\t(441)", "Claus Petersen, a pension fund equity analyst, is preparing an analysis of Rhine AG for the upcoming quarterly fund meeting. Rhine is a Germany-based manufacturer that operates three distinct divisions: children’s products (infant car seats, strollers, cribs, etc.), recreational products (bicycles, bicycle trailers, etc.), and home furnishings (contemporary furniture). All three divisions sell through retail outlets around the world.\n\nThe company has been pursuing an aggressive growth strategy, achieved through both foreign acquisitions and organic growth. Petersen is interested in determining how well Rhine is allocating its resources between the three divisions and the effects of the foreign acquisitions on overall performance. Exhibit 1 summarizes selected divisional and corporate data for the current year and the prior year.\n\nExhibit 1 Rhine AG Selected Divisional and Corporate Data (€ millions)\n\n \tTotal for Three Divisions\t\tChildren's Products\t\tRecreational Products\t\tHome Furnishings\t\n \tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\nRevenues\t2,837.1\t2,775.5\t1,176.2\t1,236.2\t1,034.1\t930.0\t626.8\t609.3\nGross profit\t621.4\t640.8\t296.6\t337.6\t246.0\t220.3\t78.8\t82.9\nOperating profit\t172.7\t219.4\t64.7\t115.7\t72.9\t62.2\t35.1\t41.5\nEarnings before taxes (EBT)\t136.6\t170.0\t---\t---\t---\t---\t---\t---\nNet earnings after tax\t109.9\t132.3\t---\t---\t---\t---\t---\t---\nTotal assets\t2,498.0\t2,479.5\t1,270.9\t1,249.6\t961.5\t948.5\t265.6\t281.4\nCapital expenditures\t32.7\t42.3\t22.1\t30.0\t6.7\t8.6\t3.9\t3.7\nProportion of capital expenditures\t100%\t100%\t67.6%\t70.9%\t20.5%\t20.3%\t11.9%\t8.7%\nProportion of total assets\t100%\t100%\t50.9%\t50.4%\t38.5%\t38.3%\t10.6%\t11.3%\nPetersen’s preferred method to determine which division is becoming less significant over time is to review the relationship between capital expenditures and total assets by operating division. He plans to base his conclusion on the assumption that the current year's investment behavior is representative of future investment patterns.\n\nPetersen knows that revenues in the children’s products division have suffered because of declining birth rates in Europe and North America, but he believes that if Rhine can maintain the operating margin for this division then overall company profitability should not be affected.\n\nCorinna Berg, another analyst with the fund, reminds Petersen that during the current year, the US dollar weakened against the euro by 4% and that 50% of the sales in the recreational products division are sold in the United States.\n\nPetersen recalls that some of the recent global expansion was aimed at establishing operations in Ireland because its statutory corporate tax rate is lower than the German rate of 29.8%. If Petersen assumes that other tax credits were the same in the current year as the prior year, he can analyze changes in Rhine’s effective tax rate to determine whether the geographic mix of the company’s profits has changed in the current year.\n\nPetersen finally examines the company’s liquidity ratios, which are shown in Exhibit 2. Even though the company’s current and quick ratio have improved, his interpretation of the changes in the company’s cash conversion cycle is that the company’s liquidity position has deteriorated.\n\nExhibit 2 Rhine AG Selected Ratios\n\nRatio\tCurrent Year\tPrior Year\t2 Years Prior\nCurrent ratio\t2.31\t2.17\t1.16\nQuick ratio\t1.06\t0.89\t0.53\nAccounts receivable turnover\t5.82\t6.08\t6.11\nInventory turnover\t3.78\t3.91\t4.09\nAccounts payable turnover\t5.71\t5.78\t5.60\nCash conversion cycle\t95 days\t90 days\t84 days\nWorried that the balance sheet–based and cash flow–based accruals ratios (not shown) raise some concerns about the possible use of accruals to manage earnings, Petersen asks Berg for advice on what further type of analysis he should do as a follow-up on this issue.", "Gianna Peters is an investment analyst who focuses on dividend-paying stocks. Peters uses a DCF approach to stock selection. She is meeting with her staff to evaluate portfolio holdings based on a bottom-up screening of stocks listed in the United States and Canada. Peters and her staff begin by reviewing the characteristics of the following portfolio candidates.\nCompany ABC\nA Canadian company in the consumer staples sector with a required rate of return of 7.35%. Recent media reports suggest that ABC might be a takeover candidate. Peters and her team estimate that if the incumbent Canadian prime minister’s party retains its power, the company’s current annual dividend of C$0.65 per share will grow 12% a year for the next four years and then stabilize at a 3.5% growth rate a year indefinitely. If a new government takes office in Canada, however, then the team estimates that ABC will likely not experience the elevated 12% short-run growth because of new regulatory and tax changes, and instead it will grow by 3.5% indefinitely.\nCompany XYZ\nA mid-sized US company in the utilities sector with a required rate of return of 10%. Peters and her team believe that because of a recent restructuring, the company is unlikely to pay dividends for the next three years. The team expects XYZ to pay an annual dividend of US$1.72 per share beginning four years from now, however. Thereafter, the dividend is expected to grow indefinitely at 4% even though the current price implies a growth rate of 6% during this same period.\nCompany JZY\nA large US company in the telecom sector with a required rate of return of 8%. The stock is currently trading at US$32.76 per share with an implied earnings growth rate of 5.3%. Peters believes that because JZY is mature and has a stable capital structure, the company will grow at its sustainable growth rate. Over the past 10 years, the company’s return on equity (ROE) has averaged 8.17% and its payout ratio has averaged 40%. Recently, the company paid an annual dividend of US$0.84 per share.\nPeters asks a newly hired analyst, Kurt Thomas, to comment on the evaluation approach for these three stocks. Thomas makes the following statements:\nStatement 1: A free cash flow valuation model would not be appropriate to evaluate Company ABC if the firm becomes a takeover candidate.\nStatement 2: A dividend discount model cannot be applied to Company XYZ if dividends are suspended for a few years.\nStatement 3: A dividend discount model is suitable for evaluating the stock of Company JZY because of the historically consistent payout ratio.\nPeters then asks the team to examine the growth opportunities of three Canadian stocks currently held in the portfolio. These stocks are listed in Exhibit 1. Peters believes that the stocks are fairly valued.\nExhibit 1\nSelected Stock Characteristics\nStock\tRequired Rate of Return\tNext Year’s Forecasted EPS (C$)\tCurrent Price per Share (C$)\nABTD\t10.5%\t7.30\t80.00\nBKKQ\t8.0%\t2.12\t39.00\nCPMN\t12.0%\t1.90\t27.39", "Jacob Daniel is the chief investment officer at a US pension fund sponsor, and Steven Rae is an analyst for the pension fund who follows consumer/non-cyclical stocks. At the beginning of 20X9, Daniel asks Rae to value the equity of Tasty Foods Company for its possible inclusion in the list of approved investments. Tasty Foods Company is involved in the production of frozen foods that are sold under its own brand name to retailers.\nRae is considering whether a dividend discount model would be appropriate for valuing Tasty Foods. He has compiled the information in the following table for the company’s EPS and DPS during the last five years. The quarterly dividends paid by the company have been added to arrive at the annual dividends. Rae has also computed the dividend payout ratio for each year as DPS/EPS and the growth rates in EPS and DPS.\nYear\tEPS ($)\tDPS ($)\tPayout Ratio\tGrowth in EPS (%)\tGrowth in DPS (%)\n20X8\t2.12\t0.59\t0.278\t2.9\t3.5\n20X7\t2.06\t0.57\t0.277\t2.5\t5.6\n20X6\t2.01\t0.54\t0.269\t6.3\t5.9\n20X5\t1.89\t0.51\t0.270\t6.2\t6.3\n20X4\t1.78\t0.48\t0.270\nRae notes that the company’s EPS has been increasing at an average rate of 4.48% per year. The dividend payout ratio has remained fairly stable, and dividends have increased at an average rate of 5.30%. In view of a history of dividend payments by the company and the understandable relationship dividend policy bears to the company’s earnings, Rae concludes that the DDM is appropriate to value the equity of Tasty Foods. Further, he expects the company’s moderate growth rate to persist and decides to use the Gordon growth model.\nRae uses the CAPM to compute the return on equity. He uses the annual yield of 4% on the 10-year Treasury bond as the risk-free return. He estimates the expected US equity risk premium, with the S&P 500 Index used as a proxy for the market, to be 6.5% per year. The estimated beta of Tasty Foods against the S&P 500 Index is 1.10. Accordingly, Rae’s estimate for the required return on equity for Tasty Foods is 0.04 + 1.10(0.065) = 0.1115, or 11.15%.\nUsing the past growth rate in dividends of 5.30% as his estimate of the future growth rate in dividends, Rae computes the value of Tasty Foods stock. He shows his analysis to Alex Renteria, his colleague at the pension fund who specializes in the frozen foods industry. Renteria concurs with the valuation approach used by Rae but disagrees with the future growth rate he used. Renteria believes that the stock’s current price of $8.42 is the fair value of the stock.", "BJL Financial provides clients with professional investment management services that are tailored to the specific needs of each client. The firm’s portfolio manager, Angelique Kwaza, has called a meeting with the senior analyst, Samira Khan, to discuss the quarterly rebalancing of three client portfolios. The valuation model used in the analyses is the discounted dividend model.\nClient 1 has a portfolio with significant exposure to dividend-paying stocks.\nClient 2 is interested in including preferred stock in the portfolio.\nClient 3 has a growth-oriented equity-only portfolio.\nKhan has identified two utilities (ABC and XYZ) for possible inclusion in Client 1’s portfolio, as shown in Exhibit 1. She uses a discount rate of 7% for both common stocks.\nExhibit 1\nCandidate Stocks for Client 1\nStock\tCompany Description\nABC\tABC is a publicly traded utility with an expected constant growth rate for earnings and dividends of 3.5%. The most recent year’s dividend payout is 70%. The expected dividend payout in future years is 60%. The common stock price is $14.49 per share.\nXYZ\tXYZ is a publicly traded utility with several unregulated business subsidiaries. The company generates 3% growth in dividends and has an annual dividend payout of 80%. No changes in dividend growth or payout are expected. The common stock price is $10 per share. The current year earnings are $0.45 per share, and next year’s earnings are expected to be $0.50 per share.\nKwaza asks Khan to investigate the most appropriate models for valuing utility companies. She tells Khan about the following points mentioned in various research reports on the utilities sector.\nReport 1: A resurgence in domestic manufacturing activity will generate long-term growth in earnings and dividends that exceeds the cost of equity.\nReport 2: Share repurchases are expected to increase. The report expresses confidence in the forecasts regarding the magnitude and timing of these repurchases.\nReport 3: The report forecasts earnings growth of 4.5%. The key growth drivers are increases in population and business creation associated with stable GDP growth of 2.75%.\nFor Client 2’s portfolio, Khan has identified the non-callable perpetual preferred stocks of Standard Company and Main Company.\nThe Standard Company’s preferred stock pays 2.75% on a par value of $100. Khan believes it to be fairly valued at a market price of $49.60.\nThe perpetual preferred stock of Main Company has a par value of $50 per share and pays an annual dividend of 5.5%. Khan estimates a capitalization rate at 6%. The current market price of Main Company preferred stock is $42.\nFinally, Khan has identified three stocks, shown in Exhibit 2, as likely candidates for Client 3’s portfolio.\nExhibit 2\nCandidate Stocks for Client 3\nStock\tCompany Description\nBIOK\tBIOK is a profitable biotech firm that currently pays an annual dividend of $1.20 per share. The current annual dividend growth rate is 15%. Patent protection runs out in eight years, after which dividend growth will likely decline at a steady rate over three years before stabilizing at a mature growth rate.\nCCAX\tCCAX builds communication software for state and federal prisons and detention facilities. The company is expected to hold its cash dividends steady at $0.56 per share for six years as it builds out facilities and acquires properties. Dividends are expected to grow at the nominal GDP growth rate after the next six years.\nHLTV\tHLTV is a health care equipment and services firm that is expected to maintain a stable dividend payout ratio. Earnings are forecast to grow over the next two years by 27% annually. After that, earnings will likely grow by 12% annually for another 10 years before stabilizing at a mature growth rate.", "June Withers is analyzing four stocks in the processed food industry as of 31 December 2019. All stocks pay a dividend at the end of each year.\nUkon Corporation\nWithers estimates a required rate of return for Ukon Corporation of 8% and notes that the dividend for 2019 was EUR 2.315 per share. Her first valuation approach is a basic two-stage DDM, with dividends growing at a rate of 5% from 2020 through 2023, after which time dividends will grow at a sustainable rate of 3%. Her second valuation approach is the H-model, assuming that dividend growth of 5% in 2020 declines linearly during the years 2021 through 2023 to the 3% growth rate after 2023. Exhibit 1 summarizes Withers’s dividend growth assumptions.\nExhibit 1\nUkon Corporation Dividend Growth Assumptions, by Model\nModel\tPeriod\tRate\nTwo-stage DDM\t2020 through 2023\t5%\n\tBeginning 2024\t3%\nH-model\t2020\t5%\n\t2021 through 2023\tDeclining linearly to 3.5%\n\tBeginning 2024\t3%\nVenus Company\nWithers has assembled the data on Venus Company in Exhibit 2. After analyzing competitive pressures and financial conditions in the industry, she predicts that Venus Company will lose market share because of new entrants but will stabilize within a few years. The required rate of return for Venus Company is 8%. Beginning with a per-share dividend of USD3.15 in 2019, she develops two scenarios regarding Venus Company’s dividend growth. The scenarios, shown in Exhibit 2, are summarized as follows:\nIn Scenario 1, the growth rate will fall in a linear manner over the years 2020 through 2023 from 8% to 4%. Using the H-model, Withers calculates a value of USD58.79 per share of Venus Company stock.\nIn Scenario 2, the growth rate falls from 8% in 2019 to 6% in 2020 and 2021, to 5% in 2022 and 2023, and then to a sustainable rate of 3% for 2024 and beyond.\nExhibit 2\nVenus Company Dividend Growth Scenarios\nScenario\tPeriod\tRate\nScenario 1\t2020 through 2023\tDeclining linearly to 4%\n\tBeginning 2024\tRemaining stable at 4%\nScenario 2\t2020 and 2021\t6%\n\t2022 and 2023\t5%\n\tBeginning 2024\tRemaining stable at 3%\nWakuni Corporation\nWithers evaluates Wakuni Corporation and uses recent financial data from Exhibit 3 to calculate a sustainable growth based on the DuPont model. In addition to this estimate, she performs a sensitivity analysis on the sustainable growth rate whereby the dividend payout ranges from 0% to 10% and the return on equity ranges from 8% to 12%.\nExhibit 3\nSelected Data for Wakuni Corporation (JPY billions)\nNet income\t43,923\nSales\t423,474\nTotal assets, average during year\t486,203\nShareholders’ equity, beginning of year\t397,925\nDividends paid\t1,518\nXavier Corporation\nIn her analysis of the stock of Xavier Corporation, Withers observes that it has a dividend of USD2 per share and a stock price of USD52. Two analyst interns have offered estimates of the company’s required rate of return and dividend growth rate, as shown in Exhibit 4.\nExhibit 4\nXavier Corporation Required Rate of Return and Dividend Growth Rates (Estimates)\n \tIntern 1\tIntern 2\nRequired rate of return\t8.3%\t7.8%\nGrowth rate, first four years\t5.0%\t4.8%\nGrowth rate, beyond first four years\t3.6%\t4.0%", "Susan Miller is an analyst for a global equity mutual fund. The fund is well-diversified and holds both dividend-paying and non-dividend-paying shares. She is evaluating three of the fund's holdings.\nOne holding is Canada-based Aster, a profitable non-dividend-paying company that is viewed by the market as an acquisition target. Miller expects Aster's level of corporate debt to change significantly over time. Because Aster reports a number of items through other comprehensive income, its net income does not always fully reflect underlying economic conditions. Miller considers the type of model she should use to value Aster.\nA second holding, UK-based Camelia, currently pays an annual dividend of £2.30 per share. Dividends are initially expected to grow at an annual rate of 10%, but then decline linearly during an 8-year period to a final and perpetual annual growth rate of 5%. Camelia's required return on equity is 9.25%. Miller uses the H-model to value Camelia.\nA third holding, France-based Dahlia, is in a mature growth phase. Dahlia has a dividend payout ratio of 45%, a return on assets of 7.50%, and an equity multiplier of 1.25. Upon further analysis, Miller concludes that Dahlia is over valued.", "Dong Tian is an equity analyst whose required ROE is 10%. He evaluates the stocks of several companies.\nCompany A\nTian wants to value Company A using a suitable DCF model. His forecasts on Company A are presented in Exhibit 1. Tian assumes that there are no capital issuances or repayments during his forecast period.\nExhibit 1\nYear\tDividend Payout Ratio\tEarnings ($ millions)\tOperating Cash Flow ($ millions)\tCapital Expenditure ($ millions)\n1\t30%\t81.90\t125.00\t100.00\n2\t25%\t83.76\t131.25\t120.00\n3\t20%\t85.32\t137.81\t144.00\n4\t15%\t86.52\t144.70\t172.80\n5\t5%\t87.23\t151.94\t207.36\nCompany C\nCompany C has just paid out an annual dividend of $2 per share. Tian expects dividends from Company C to grow at 5% annually in perpetuity and calculates the fair value of the stock of Company C using the Gordon growth model.\nCompany D\nCompany D just ended the year with earnings per share of $3 and its stock trades at $40 per share. Tian expects Company D's earnings to grow at 10% next year and calculates the present value of growth opportunities reflected in its share price.\nCompany E\nCompany E has just declared an annual dividend of $1 per share. Tian expects the company to have a dividend growth rate of 20% every year for the next 10 years and thereafter grow dividends at 8% per year in perpetuity. He calculates the fair value of Company E's stock using the H-model.", "Mary Barton is a junior equity analyst for an investment company. She is currently working on a large US-based equity fund.\nThe large US-based fund uses discount models to estimate the value of stock prices. For this fund, a difference in price of $1 or more between the market and estimated prices indicates that the shares are mispriced for the fund’s investment purposes. The fund is allowed to take either long or short positions in shares identified as misvalued. Barton’s manager, George Eckhart, asks her to evaluate the stocks of two companies for possible inclusion in that fund: XRail Company (XRL) and Z-Tarp Limited (ZTL). Selected data for the stocks are shown in Exhibit 1.\nExhibit 1 Selected Stock Data for XRL and ZTL and Additional Market Information\n \tXRL\t\tZTL\t\n \tEPS ($)\tDPS ($)\tEPS ($)\tDPS ($)\nMost Recent Year\t3.15\t1.77\t5.62\t2.53\n1 Year Prior\t3.08\t1.52\t4.98\t2.24\n2 Years Prior\t2.99\t1.36\t4.73\t2.13\n3 Years Prior\t2.77\t1.21\t4.5\t2.02\n4 Years Prior\t2.52\t0.9\t4.2\t1.89\nCurrent market price\t$77.23\t---\t$93.05\t---\nReturn on assets\t27.40%\t---\t25.80%\t---\nReturn on common equity\t31.60%\t---\t32.80%\t---\nBeta\t0.94\t---\t1.2\t---\nRequired rate of return on common equity\t8.84%\t---\t10.48%\t---\nAdditional Information\nRisk-free rate\t2.94%\nEquity risk premium for common shares\t6.28%\nUS economy real growth rate\t3.70%\nUS inflation rate\t2.00%\nNote: DPS is dividends per share, and EPS is earnings per share.\nBarton begins her analysis by looking at XRL. After doing some research, she concludes that a reasonable growth estimate for the company is the sustainable growth rate using the most recent year’s retention ratio and calculates a price for XRL using this information. She makes the following note:\nIt will not be possible to use the Gordon growth model for the analysis of XRL.\nBarton and Eckhart discuss the impact of a company’s growth rate on its future stock price. Barton determines XRL’s growth rate of earnings for the period from 4 Years Prior to the Most Recent Year and compares it with the current nominal growth rate of the US economy. She concludes that XRL is likely to be in the transition stage of growth.\nNext, Eckhart asks Barton to calculate the intrinsic value of ZTL shares using the Gordon growth model to determine whether it meets the fund’s investment objectives. He suggests that rather than using the sustainable growth rate, she should use the growth rate of dividends over the past five years.\nEckhart tells Barton that he has heard rumors that ZTL is contemplating selling one of its major manufacturing facilities. If that should happen, he believes that the company would pay a series of special dividends in each of the three years following the sale. Barton asks him how she could best incorporate such a possibility into the valuation of the shares.", "Yandie Izzo manages a dividend growth strategy for a large asset management firm. Izzo meets with her investment team to discuss potential investments in three companies: Company A, Company B, and Company C. Statements of cash flow for the three companies are presented in Exhibit 1.\nExhibit 1\nStatements of Cash Flow, Most Recent Fiscal Year End (Amounts in Millions of Dollars)\n \tCompany A\tCompany B\tCompany C\nCash Flow from Operating Activities\nNet Income\t4,844\t1,212\t15,409\nAdjustments\nDepreciation\t500\t288\t3,746\nOther noncash expenses\t1,000\t—\t—\nChanges in working capital\n(Increase) Decrease accounts receivable\t(452)\t(150)\t(536)\n(Increase) Decrease inventories\t—\t(200)\t(803)\nIncrease (Decrease) accounts payable\t(210)\t100\t(3)\nIncrease (Decrease) other current liabilities\t540\t14\t350\nNet cash from operating activities\t6,222\t1,264\t18,163\nCash Flow from Investing Activities\n(Purchase) Sale of fixed assets\t2,379\t(1,000)\t(3,463)\nNet cash from investing activities\t2,379\t(1,000)\t(3,463)\nCash Flow from Financing Activities\nIncrease (Decrease) notes payable\t25\t3000\t1,238\nIncrease (Decrease) long-term debt\t(1,500)\t(1,000)\t(1,379)\nPayment of common stock dividends\t(1,000)\t(237)\t(15,000)\nNet cash from financing activities\t(2,475)\t1,763\t(15,141)\nNet change in cash and cash equivalents\t6,126\t2,027\t(441)\nCash and equivalents at beginning of year\t50\t100\t3,000\nCash and equivalents at end of year\t6,176\t2,127\t2,559\nSupplemental Cash Flow Disclosures\nInterest\t(353)\t(50)\t(552)\nIncome taxes\t(1,605)\t(648)\t(3,787)\nIzzo’s team first discusses key characteristics of Company A. The company has a history of paying modest dividends relative to FCFE, has a stable capital structure, and is owned by a controlling investor.\nThe team also considers the impact of Company A’s three noncash transactions in the most recent year on its FCFE, including the following:\nTransaction 1: A $900 million loss on a sale of equipment\nTransaction 2: An impairment of intangibles of $400 million\nTransaction 3: A $300 million reversal of a previously recorded restructuring charge\nIn addition, Company A’s annual report indicates that the firm expects to incur additional noncash charges related to restructuring over the next few years.\nTo value the three companies’ shares, one team member suggests valuing the companies’ shares using net income as a proxy for FCFE. Another team member proposes forecasting FCFE using a sales-based methodology based on the following equation:\nFCFE = NI – (1 – DR)(FCInv – Dep) – (1 – DR)(WCInv).\nIzzo’s team ultimately decides to use actual free cash flow to value the three companies’ shares. Selected data and assumptions are provided in Exhibit 2.\nExhibit 2\nSupplemental Data and Valuation Assumptions\n \tCompany A\tCompany B\tCompany C\nTax rate\t35%\t35%\t30%\nBeta\t1.00\t0.90\t1.10\nBefore-tax cost of debt\t6%\t7%\t6%\nTarget debt ratio\t50%\t30%\t40%\nMarket data:\nRisk-free rate: 3%\nMarket risk premium: 7%\nThe team calculates the intrinsic value of Company B using a two-stage FCFE model. FCFE growth rates for the first four years are estimated at 10%, 9%, 8%, and 7%, respectively, before declining to a constant 6% starting in the fifth year.\nTo calculate the intrinsic value of Company C’s equity, the team uses the FCFF approach assuming a single-stage model where FCFF is expected to grow at 5% indefinitely.", "Ryan Leigh is preparing a presentation that analyzes the valuation of the common stock of two companies under consideration as additions to his firm’s recommended list, Emerald Corporation and Holt Corporation. Leigh has prepared preliminary valuations of both companies using an FCFE model and is also preparing a value estimate for Emerald using a dividend discount model. Holt’s 2019 and 2020 financial statements, contained in Exhibit 1 and Exhibit 2, are prepared in accordance with US GAAP.\nExhibit 1\nHolt Corporation Consolidated Balance Sheets (US$ Millions)\n \t \t \tAs of 31 December\n \t \t \t2020\t \t \t \t2019\nAssets\nCurrent assets\nCash and cash equivalents\t \t \t$ 372\t \t \t \t$ 315\nAccounts receivable\t \t \t770\t \t \t \t711\nInventories\t \t \t846\t \t \t \t780\nTotal current assets\t \t \t1,988\t \t \t \t1,806\nGross fixed assets\t4,275\t \t \t \t3,752\t\t\nLess: Accumulated depreciation\t1,176\t \t3,099\t \t906\t \t2,846\nTotal assets\t \t \t$5,087\t \t \t \t$4,652\nLiabilities and shareholders’ equity\nCurrent liabilities\nAccounts payable\t \t \t$ 476\t \t \t \t$ 443\nAccrued taxes and expenses\t \t \t149\t \t \t \t114\nNotes payable\t \t \t465\t \t \t \t450\nTotal current liabilities\t \t \t1,090\t \t \t \t1,007\nLong-term debt\t \t \t1,575\t \t \t \t1,515\nCommon stock\t \t \t525\t \t \t \t525\nRetained earnings\t \t \t1,897\t \t \t \t1,605\nTotal liabilities and shareholders’ equity\t \t \t$5,087\t \t \t \t$4,652\nExhibit 2\nHolt Corporation Consolidated Income Statement for the Year Ended 31 December 2020 (US$ Millions)\nTotal revenues\t$3,323\nCost of goods sold\t1,287\nSelling, general, and administrative expenses\t858\nEarnings before interest, taxes, depreciation, and amortization (EBITDA)\t1,178\nDepreciation expense\t270\nOperating income\t908\nInterest expense\t195\nPretax income\t713\nIncome tax (at 32%)\t228\nNet income\t$ 485\nLeigh presents his valuations of the common stock of Emerald and Holt to his supervisor, Alice Smith. Smith has the following questions and comments:\n“I estimate that Emerald’s long-term expected dividend payout rate is 20% and its return on equity is 10% over the long term.”\n“Why did you use an FCFE model to value Holt’s common stock? Can you use a DDM instead?”\n“How did Holt’s FCFE for 2008 compare with its FCFF for the same year? I recommend you use an FCFF model to value Holt’s common stock instead of using an FCFE model because Holt has had a history of leverage changes in the past.”\n“In the last three years, about 5% of Holt’s growth in FCFE has come from decreases in inventory.”\nLeigh responds to each of Smith’s points as follows:\n“I will use your estimates and calculate Emerald’s long-term, sustainable dividend growth rate.”\n“There are two reasons why I used the FCFE model to value Holt’s common stock instead of using a DDM. The first reason is that Holt’s dividends have differed significantly from its capacity to pay dividends. The second reason is that Holt is a takeover target and once the company is taken over, the new owners will have discretion over the uses of free cash flow.”\n“I will calculate Holt’s FCFF for 2020 and estimate the value of Holt’s common stock using an FCFF model.”\n“Holt is a growing company. In forecasting either Holt’s FCFE or FCFF growth rates, I will not consider decreases in inventory to be a long-term source of growth.”", "Gurmeet Singh, an equity portfolio manager at a wealth management company, meets with junior research analyst Cindy Ho to discuss potential investments in three companies: Sienna Limited, Colanari Manufacturing, and Bern Pharmaceutical.\nSingh and Ho review key financial data from Sienna’s most recent annual report, which are presented in Exhibit 1 and Exhibit 2, to assess the company’s ability to generate free cash flow.\nExhibit 1\nSelected Data from Sienna Limited’s Statement of Income for the Year Ended 31 December 2019 (Amounts in Millions of Euros)\nEBITDA\t4,000\nDepreciation expense\t800\nOperating income (EBIT)\t3,200\nInterest expense\t440\nTax rate\t35%\nExhibit 2\nSienna Limited’s Statement of Cash Flows for the Year Ended 31 December 2019 (Amounts in Millions of Euros)\nCash flow from operations\nNet income\t1,794\nPlus: Depreciation\t800\nIncrease in accounts receivable\t(2,000)\nIncrease in inventory\t(200)\nIncrease in accounts payable\t1,000\nCash flow from operations\t1,394\nCash flow from investing activities\nPurchases of PP&E\t(1,000)\nCash flow from financing activities\nBorrowing (repayment)\t500\nTotal cash flow\t894\nSingh and Ho also discuss the impact of dividends, share repurchases, and leverage on Sienna’s free cash flow. Ho tells Singh the following:\nStatement 1:\nChanges in leverage do not impact free cash flow to equity.\nStatement 2:\nTransactions between the company and its shareholders, such as the payment of dividends or share repurchases, do affect free cash flow.\nSingh and Ho next analyze Colanari. Last year, Colanari had FCFF of €140 million. Singh instructs Ho to perform an FCFF sensitivity analysis of Colanari’s firm value using the three sets of estimates presented in Exhibit 3. In her analysis, Ho assumes a tax rate of 35% and a stable capital structure of 30% debt and 70% equity.\nExhibit 3\nSensitivity Analysis for Colanari Valuation\nVariable\tBase-Case Estimate\tLow Estimate\tHigh Estimate\nFCFF growth rate\t4.6%\t4.2%\t5.0%\nBefore-tax cost of debt\t4.9%\t3.9%\t5.9%\nCost of equity\t11.0%\t10.0%\t12.0%\nFinally, Singh and Ho analyze Bern. Selected financial information on Bern is presented in Exhibit 4.\nExhibit 4\nSelected Financial Data on Bern Pharmaceutical\n \tMarket Value\tRequired Return\nDebt\t€15,400 million\t6.0%\nPreferred stock\t€4,000 million\t5.5%\nCommon stock\t€18,100 million\t11.0%\nFCFF, most recent year\t€3,226 million\nCorporate tax rate\t26.9%\nSingh notes that Bern has two new drugs that are currently in clinical trials awaiting regulatory approval. In addition to its operating assets, Bern owns a parcel of land from a decommissioned manufacturing facility with a current market value of €50 million that is being held for investment. Singh and Ho elect to value Bern under two scenarios:\nScenario 1:\nValue Bern assuming the two new drugs receive regulatory approval. In this scenario, FCFF is forecast to grow at 4.5% into perpetuity.\nScenario 2:\nValue Bern assuming the two new drugs do not receive regulatory approval. In this scenario, FCFF is forecast using a stable growth in FCFF of 1.5% for the next three years and then 0.75% thereafter into perpetuity.", "Daniel Pegham is a mergers and acquisitions analyst currently advising Horzak Digital, a privately owned, rapidly growing satellite dish manufacturer that reports in USD.\nPegham wants to use FCFE to value the company and recalls that some peers have used EBITDA as a proxy for FCFE. He concludes that EBITDA is not a good proxy for Horzak’s FCFE for two reasons. First, EBITDA fails to account for cash flows from new borrowings. Second, EBITDA understates cash flows for growth companies such as Horzak.\nInstead, Pegham uses the indirect method to calculate FCFE, starting with Horzak’s previous year’s net income. Horzak had two unusual noncash items in the previous year: a USD 5 million after-tax reversal of noncash restructuring charges taken in the previous year, and a USD 2 million after-tax gain.\nHorzak is entirely family-owned, and the president is the largest shareholder. Horzak is subject to a 30% tax rate. Pegham determines that, in the event of a takeover, his valuation should reflect two additional adjustments to normalize net income.\nBoard compensation was USD 1,500,000 in the previous year, compared to USD 800,000 at comparable companies.\nHorzak has had free use of storage facilities owned by the company’s president for warehousing inventory. This benefit would otherwise have cost USD 150,000 in the previous year.\nLastly, Pegham evaluates Horzak using the capitalized cash flow method under the following assumptions.\nNormalized FCFE in the current period (FCFE0) is USD 4.0 million.\nThe long-term growth rate of FCFE is 5%.\nThe market value of debt is USD 6.6 million.\nThe cost of equity is 17.5%.", "Minneapolis Viking Arbitrageurs, LLC (MVA), is a fledgling US-based hedge fund having slightly more than $50 million in assets under management. MVA specializes in owning and managing small-sized properties in agriculture, forestry, and mining.\nJim Hester, MVA’s merger and acquisition (M&A) analyst is evaluating Fargo Durum Farms, Inc. (FDF) for a potential acquisition. FDF owns 1,500 acres of fertile land, farm buildings, machinery, residential quarters, livestock, cattle feed, seeds, grain, significant amounts of intangible assets, and so on. Selected data from FDF’s income statement for the previous year ended and additional estimates compiled by Hester are presented in Exhibits 1 and 2.\nExhibit 1 FDF’s Select Financial Data for the Previous Year Ended\nGross revenues from crops, livestock, feed, and so on\t$2,500,000\nCost of goods sold\t1,000,000\nSelling, general, and administrative expenses (SG&A)\t900,000\nDepreciation and amortization\t200,000\nTax rate\t30%\nNotes:\n1) FDF carries debt in the amount of $750,000 at an interest rate of 8%, and it comprises 30% of total assets on a book value basis. Debt will be a part of the acquisition transaction.\n2) FDF holds $200,000 in cash and short-term investments, but it will not be a part of the assets under acquisition transaction.\nExhibit 2 Additional Data and Hester’s Estimates for Normalization\n1.\tThe cost of goods sold ratio should be higher at 45%.\n2.\tSG&A includes $400,000 in owners’ compensation. According to Hester’s research, owners’ compensation expense for similar sized farms is $200,000.\n3.\tA ranch and living quarters are not required for the farm’s core operations. The reported SG&A expenses include $100,000 for operating expenses relating to those properties. The ranch and living quarters will be kept by the current owners and are not a part of FDF’s farming operations being considered for purchase by the hedge fund.\n4.\tFor pro forma estimations, Hester will consider depreciation and amortization at 10% of gross revenues. He thinks the current tax rate of 30% is reasonable.\nFirst, Hester assesses FDF’s normalized operating income after tax. Next, Hester values FDF’s equity starting with the free cash flow to the firm (FCFF) with the data and assumptions in Exhibit 3.\nExhibit 3 FDF’s Data and Estimates for Valuing Its Equity\nFCFF for Current Year\t$336,250\nFCFF annual growth rate for the foreseeable future\t5%\nFDF’s debt holding at an interest rate of 8.0% per year\t$750,000\nFDF’s weighted average cost of capital (WACC)\t11.50%\nFDF’s cost of equity\t14.00%\nHester presents his initial assessment and valuation of FDF to MVA’s investment committee. The following are comments and suggestions from some members on the committee.\nXavier Moreno, commodities analyst, suggests the use of the excess earnings method (EEM) for valuing FDF and makes the following three statements in support of his preference:\nStatement 1: EEM involves estimating the earnings remaining before deducting amounts that reflect the required returns to the tangible assets.\nStatement 2: EEM is a widely-used method for valuing entire private businesses similar to FDF.\nStatement 3: EEM is especially useful for valuing FDF because it allows for valuing working capital, fixed assets, and intangibles using different discount rates.\nJamal Bahrami, the external consultant on the committee, differs from Hester and prefers the use of the free cash flow to equity (FCFE) model. Furthermore, he develops his own estimates for valuing FDF's equity, shown in Exhibit 4.\nExhibit 4 Bahrami’s Estimates for Valuing FDF’s Equity\n1.\tIn current year, FDF will:\nrealize $1,000,000 in cash flow from operations.\nrequire $400,000 in new capital investment.\nneed additional borrowing in the amount of $250,000 at an interest cost of 8%.\n2.\tBecause of the continued strength in the global demand for wheat, FDF will experience a higher annual growth rate of 10% for the following year; thereafter, it will grow at a constant rate of 6% per year.\n3.\tBecause of illiquidity and small-firm risk premiums, the appropriate WACC and required return on equity will be higher at 12.9% and 16%, respectively.", "Chan Mei Yee is valuing McLaughlin Corporation common shares using a free cash flow approach. Yee gathered information about McLaughlin from several sources. She begins her analysis by determining free cash flow to the firm (FCFF) and free cash flow to equity (FCFE) for the 2012 fiscal year, using the financial statements in Exhibits 1 and 2. McLaughlin’s fiscal year ends 31 December.\nExhibit 1 McLaughlin Corporation Selected Financial Data ($ millions, except per share amounts)\nFor Year Ending 31 December\t2012\nRevenues\t$6,456\nEarnings before interest, taxes, depreciation, and amortization (EBITDA)\t1,349\nDepreciation expense\t243\nOperating income\t1,106\nInterest expense\t186\nPretax income\t920\nIncome tax (32%)\t294\nNet income\t$626\nNumber of outstanding shares (millions)\t411\n2012 earnings per share\t$1.52\n2012 dividends paid (millions)\t148\n2012 dividends per share\t0.36\n2012 fixed capital investment (millions)\t535\nCost of equity\t12.0%\nWeighted average cost of capital (WACC)\t9.0%\nExhibit 2 McLaughlin Corporation Consolidated Balance Sheets ($ millions)\n \tas of 31 December\t\n\t2012\t2011\nAssets\nCash and cash equivalents\t$32\t$21\nAccounts receivable\t413\t417\nInventories\t709\t638\nOther current assets\t136\t123\nTotal current assets\t$1,290\t$1,199\nCurrent liabilities\t$2,783\t$2,678\nLong-term debt\t2,249\t2,449\nCommon stockholders' equity\t1,072\t594\nTotal liabilities and stockholders' equity\t$6,104\t$5,721\nYee plans to perform two different valuations of McLaughlin, which she calls the “base case” valuation and the “alternative” valuation. Critical assumptions for each are given in the following lists.\nBase case valuation\n2013 FCFF will be $600 million.\nBeyond 2013, FCFF will grow in perpetuity at 4% annually.\nThe market value and book value of McLaughlin’s long-term debt are approximately equal.\nAlternative valuation\n2013 earnings per share (EPS) will be $1.80.\nEPS will grow forever at 6% annually.\nFor 2013 and beyond:\nNet capital expenditures (fixed capital expenditures minus depreciation) will be 30% of EPS.\nInvestments in working capital will be 10% of EPS.\nOf future investments, 60% will be financed with equity and 40% will be financed with debt.\nYee is also concerned about the effects on McLaughlin’s 2013 FCFE of the following three possible financial actions by McLaughlin during the year 2013:\nAction 1: Increasing common stock cash dividends by $110 million\nAction 2: Repurchasing $60 million of common shares\nAction 3: Reducing its outstanding long-term debt by $100 million\nMelissa Nicosia, Yee’s supervisor, reviews McLaughlin’s valuations. Specifically, Nicosia makes the following three statements:\nStatement 1: The free cash flow valuation approach is superior to the discounted dividend valuation approach because the company’s dividends have been substantially different from its FCFE.\nStatement 2: Because the company’s capital structure seems unstable, the FCFE valuation approach is superior to the FCFF valuation approach.\nStatement 3: If there is a change in control at McLaughlin, the discounted dividend valuation approach would be superior to a free cash flow valuation approach.", "Schwalke is currently valuing LPE, a private furniture manufacturing company based in France. The company is owned entirely by the Lapiere family, with several family members employed as senior company managers. Jean Lapiere is the current CEO and owns 25% of LPE stock. LPE’s most recent incom

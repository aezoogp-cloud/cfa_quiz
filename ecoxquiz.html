I는 '감소'합니다.", "C": "Equity-settled 옵션의 상대계정은 자본(SBC reserve) — 부채가 생기지 않습니다."}, "orig": "FSA · ECO Module 2 Q24", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q25", "src": "ECO 오답", "module": "04-2", "tag": "옵션가치 입력변수 방향", "vig": 18, "stem": "Compared to the assumptions Terra Mercado used to value stock options in 20X2, earnings in 20X3 were most favorably affected by the change in the:", "opts": {"A": "expected life.", "B": "risk-free rate.", "C": "dividend yield."}, "ans": "C", "en": "C is correct. A higher dividend yield reduces the value of the option and thus option expense. The lower expense results in higher earnings. Higher risk-free rates and expected lives result in higher call option values.", "ko": "20X2→20X3: 무위험이자율 3.8→4.6%(가치↑, 불리), 만기 4.5→5.0년(가치↑, 불리), 배당수익률 0→1.0%(가치↓ → 비용↓ → 이익↑, 가장 유리).", "trap": "무위험이자율↑을 '할인율↑ → 가치↓'로 착각 — 콜옵션 가치는 rf↑에 상승합니다.", "f": "Call value↑: σ↑, T↑, rf↑ / Call value↓: dividend yield↑", "why": {"A": "만기 4.5 → 5.0년 증가 → 옵션가치↑ → 비용↑ → 이익에 불리합니다.", "B": "무위험이자율 3.8 → 4.6% 상승 → 콜옵션 가치↑ → 비용↑ → 이익에 불리합니다."}, "orig": "FSA · ECO Module 2 Q25", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q26", "src": "ECO 오답", "module": "04-2", "tag": "DCF – Net interest expense 이중계산", "vig": 19, "stem": "Your colleague’s discounted cash flow model expenses service cost and net interest expense in free cash flow and deducts the company’s net pension liability from enterprise value to arrive at an estimate of equity value. You most likely recommend that your colleague:", "opts": {"A": "make no changes.", "B": "remove service cost from free cash flow because it is a non-cash expense.", "C": "remove net interest expense from free cash flow because the net pension, at present value, is already deducted from enterprise value."}, "ans": "C", "en": "C is correct. Net interest expense for a DB plan represents the unwinding of the discount with the passage of time. The discounted cash flow model values a company at the present time. Service cost is correctly expensed in the model as it represents increases in the pension obligation unrelated to the time value of money.", "ko": "Net interest expense는 시간 경과에 따른 할인 해제(unwinding)입니다. Net pension liability를 PV로 이미 EV에서 차감했다면 FCF에서 net interest까지 빼면 시간가치 이중 반영. Service cost는 실제 영업비용이라 FCF에 남겨둡니다.", "trap": "Service cost를 '비현금'이라고 빼는 선지(B) — 새로 쌓인 의무의 PV이므로 영업비용입니다.", "f": "", "why": {"A": "Net interest expense를 FCF에서 빼면서 PV 기준 순부채도 차감하면 시간가치 이중계산입니다.", "B": "Service cost는 이번 기간 새로 생긴 의무의 PV로 실질 영업비용 — FCF에 남겨야 합니다."}, "orig": "FSA · ECO Module 2 Q26", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q29", "src": "ECO 관련유형", "module": "04-2", "tag": "SBC 희석 반영 – 둘 중 하나만", "vig": 19, "stem": "As an alternative to expensing stock-based compensation in free cash flow in the discounted cash flow valuation model, your colleague could account for the expected dilution by:", "opts": {"A": "increasing shares outstanding.", "B": "reducing operating expenses because the company could compensate its employees in cash rather than shares.", "C": "increasing net cash because share-based compensation expense is a non-cash expense."}, "ans": "A", "en": "A is correct. Dilution from share-based compensation can be accounted for by expensing share-based compensation in free cash flow or by increasing the share count for expected dilution.\n\nB and C are incorrect as they would be accretive, not dilutive, to valuation.", "ko": "SBC 희석은 ① FCF에서 비용 차감 또는 ② 예상 희석만큼 주식수 증가 중 하나로 반영(둘 다 하면 이중차감). 'SBC는 비현금이라 net cash↑', '현금보상으로 대체'는 가치를 부풀리는 방향.", "trap": "B·C는 희석이 아니라 가치 증가(accretive) 방향입니다.", "f": "", "why": {"B": "현금보상으로 대체할 수 있다는 가정으로 비용을 줄이면 SBC의 경제적 비용을 무시해 가치를 부풀립니다.", "C": "SBC가 비현금이라고 현금을 늘리면 희석을 반영하기는커녕 가치를 증가시킵니다."}, "orig": "FSA · ECO Module 2 Q29", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q34", "src": "ECO 오답", "module": "04-2", "tag": "단기 종업원급여 분류", "vig": null, "stem": "Which of the following is classified as short-term employee compensation?", "opts": {"A": "Stock options", "B": "Sabbatical paid leave", "C": "Contributions to social security"}, "ans": "C", "en": "Correct because contributions to social security schemes are considered short-term benefits.", "ko": "단기(12개월 내 정산): 급여·상여·건강보험·사회보장 기여금·유급휴가. 장기: sabbatical 등 장기유급휴가, 장기장애. 주식보상: 옵션·RSU.", "trap": "Sabbatical paid leave는 '장기' 급여입니다.", "f": "", "why": {"A": "Incorrect because stock options are considered share-based compensation (long-term) benefits.", "B": "Incorrect because paid leave for sabbaticals are considered long-term benefits."}, "orig": "FSA · ECO Module 2 Q34", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q38", "src": "ECO 오답", "module": "04-2", "tag": "SBC 예측 기준", "vig": null, "stem": "The common approach to forecasting share-based compensation expense in a financial statement model is as a percentage of:", "opts": {"A": "revenues.", "B": "gross profit.", "C": "total operating expenses."}, "ans": "A", "en": "Correct because the common approach to forecasting share-based compensation expense is as a percentage of revenues. Using that as the forecast object, an analyst can use a variety of forecasting approaches such as a historical average, management guidance, or by assuming the percentage will revert to an industry or sector average over time.", "ko": "SBC expense는 매출 대비 비율(% of revenues)로 예측하는 것이 일반적입니다. 이후 과거 평균, 경영진 가이던스, 산업 평균 회귀 등으로 비율을 정합니다.", "trap": "Gross profit·opex 기준은 함정입니다.", "f": "", "why": {"B": "Incorrect because the common approach to forecasting share-based compensation expense is as a percentage of revenues, not gross profit.", "C": "Incorrect because the common approach to forecasting share-based compensation expense is as a percentage of revenues, not total operating expenses."}, "orig": "FSA · ECO Module 2 Q38", "subject": "FSA"}, {"id": "FSA:ECO-M2-Q39", "src": "ECO 오답", "module": "04-2", "tag": "Plan 지급액 – 회사 재무제표", "vig": null, "stem": "Payments from a post-employment benefit plan to employees are:", "opts": {"A": "not reported on the employer's financial statements.", "B": "reported on the employer's financial statements in the case of defined benefit plans.", "C": "reported on the employer's financial statements in the case of defined contribution plans."}, "ans": "A", "en": "Correct because under both types of post-employment benefit plans – defined contribution and defined benefit – payments from the plans are not reported on employers' financial statements.  A defined contribution plan is a separate legal entity with its own financial statements. Under a defined benefit plan, the payment of benefits is neutral to the funded status reported on the employer’s balance sheet because it reduces plan assets and the pension obligation by the same amount.", "ko": "DC·DB 모두 plan이 직원에게 지급하는 금액은 회사 재무제표에 보고되지 않습니다. DC는 별도 법적 실체, DB는 지급 시 plan assets와 PBO가 같은 금액 감소 → funded status 불변.", "trap": "DB면 보고된다(B)는 함정 — 지급은 funded status 중립입니다.", "f": "", "why": {"B": "Incorrect because payments of benefits under a defined benefit plan are neutral to the funded status reported on the employer’s balance sheet.", "C": "Incorrect because a defined contribution plan is a separate legal entity with its own financial statements."}, "orig": "FSA · ECO Module 2 Q39", "subject": "FSA"}, {"id": "FSA:SCH-M2-03", "src": "Schweser MQ", "module": "04-2", "tag": "단기 종업원급여", "vig": null, "stem": "Which of the following statements about short-term employee compensation is least accurate?", "opts": {"A": "It is expensed as employees provide service, with unpaid amounts shown as a current liability.", "B": "It includes salaries, bonuses, health insurance, social security contributions, and paid leave.", "C": "It is subject to high measurement error because the costs must be estimated far into the future."}, "ans": "C", "en": "Short-term compensation is settled within 12 months, usually in cash, so there is limited scope for measurement error. It is expensed as service is provided.", "ko": "단기급여는 12개월 내 현금 정산 → 측정오차가 작음. 측정오차가 큰 것은 DB pension·장기급여.", "trap": "", "f": "", "why": {"A": "맞는 설명입니다(용역 제공 시 비용, 미지급분은 유동부채).", "B": "맞는 설명입니다(단기급여 구성 항목)."}, "orig": "FSA · Schweser MQ 8.1 변형", "subject": "FSA"}, {"id": "FSA:SCH-M2-04", "src": "Schweser MQ", "module": "04-2", "tag": "Plan assets 기말 공정가치", "vig": null, "stem": "For a DB plan: PBO at 1 January = $200m; PBO at 31 December = $226m; service cost plus interest cost for the year = $40m; plan assets at 1 January = $160m; actual return on plan assets = $30m. There were no employer contributions, no actuarial changes, and no other events. Plan assets at 31 December are closest to:", "opts": {"A": "$146m.", "B": "$176m.", "C": "$190m."}, "ans": "B", "en": "Benefits paid = 200 + 40 − 226 = $14m. Ending plan assets = 160 + 30 (actual return) − 14 = $176m.", "ko": "① PBO 롤포워드로 benefits paid 역산: 200 + 40 − 226 = 14. ② 자산 롤포워드: 160 + 30 + 기여금 0 − 14 = 176.", "trap": "Benefits paid를 빼지 않으면 190. 자산에는 '실제' 수익을 씁니다.", "f": "PBO말 = PBO초 + SC + IC ± 보험수리손익 − 지급 / 자산말 = 자산초 + 실제수익 + 기여금 − 지급", "why": {"A": "146은 실제수익(30)을 빠뜨린 값(160 − 14)입니다.", "C": "190은 benefits paid(14)를 차감하지 않은 값입니다."}, "orig": "FSA · Schweser MQ 8.2 변형", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q1", "src": "ECO 오답", "module": "04-3", "tag": "Transaction exposure 식별", "vig": 20, "stem": "Which transaction would generate foreign currency transaction exposure for Ambleu?", "opts": {"A": "Transaction 1", "B": "Transaction 2", "C": "Transaction 3"}, "ans": "C", "en": "C is correct. In Transaction 3, the payment for the inventory is due in Bindiar francs, a different currency from the Norvoltian krone, which is Ambleu’s presentation currency. Because the import purchase (account payable) is under 45-day credit terms, Ambleu has foreign currency transaction exposure. The payment is subject to fluctuations in the ₣B/NVK exchange rate during the 45-day period between the sale and payment dates. Thus, Ambleu is exposed to potential foreign currency gains if the Bindiar franc weakens against the Norvoltian krone or foreign currency losses if the Bindiar franc strengthens against the Norvoltian krone.", "ko": "거래 노출 = 기능통화가 아닌 통화로 거래 + 결제 시점이 나중. T1: 당일 결제 → 노출 없음. T2: Ngcorp(기능통화 ₣B)의 ₣B 대출 → 거래노출 아님(번역노출). T3: Ambleu가 45일 후 ₣B로 지급 → 거래노출.", "trap": "통화가 다르다는 것만 보고 결제 시차를 확인하지 않는 함정.", "f": "", "why": {"A": "구매일에 대금을 받았으므로 환율 변동 노출 기간이 없습니다.", "B": "Ngcorp의 기능통화가 ₣B이고 대출도 ₣B → 거래노출 없음(연결 시 번역노출 문제)."}, "orig": "FSA · ECO Module 3 Q1", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q2", "src": "ECO 오답", "module": "04-3", "tag": "번역방법 결정 기준", "vig": 20, "stem": "Yu’s determination regarding Transaction 2 should be based on the currency of the:", "opts": {"A": "loan.", "B": "bank.", "C": "borrower."}, "ans": "C", "en": "C is correct. The currency of Ngcorp as the borrowing foreign subsidiary, relative to that of Ambleu, determines Ambleu’s choice of translation method for Transaction 2. Because Ngcorp’s functional currency is the Bindiar franc and Ambleu’s presentation currency is the Norvoltian krone, the current rate method rather than the temporal method should be used. Regardless of the currency in which the loan is denominated, the loan is first recorded in Ngcorp’s financial statements. Then, Ngcorp’s financial statements, which include the bank loan, are translated into Ambleu’s consolidated financial statements.", "ko": "대출은 Ngcorp 장부에 먼저 기록되고 Ngcorp 재무제표 전체가 번역됩니다. 방법 선택은 차입자(Ngcorp) 기능통화 vs 모회사 표시통화 비교 → 다르므로 current rate method.", "trap": "대출 통화나 은행 소재국으로 판단하는 함정.", "f": "", "why": {"A": "대출 통화가 아니라, 대출을 기록하는 실체(Ngcorp)의 기능통화 vs 모회사 표시통화로 방법을 정합니다.", "B": "은행의 표시통화는 Ambleu의 회계처리와 무관합니다."}, "orig": "FSA · ECO Module 3 Q2", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q3", "src": "ECO 오답", "module": "04-3", "tag": "Transaction gain 계산", "vig": 20, "stem": "Based on Exhibit 1, what is the foreign exchange gain resulting from Transaction 3 on the 31 December 2016 financial statements?", "opts": {"A": "NVK1.70 per ton", "B": "NVK90.75 per ton", "C": "NVK248.54 per ton"}, "ans": "A", "en": "A is correct. On Ambleu’s balance sheet, the cost included in the inventory account is the translation of ₣B27,000/ton into Norvoltian krone on the purchase date. Ambleu could have paid this amount on the purchase date but chose to wait 45 days to settle the account. The inventory cost is determined using the ₣B/NVK exchange rate of 4.1779 on the purchase date of 1 June 2016. ₣B27,000/₣B4.1779/NVK = NVK6,462.58/ton\n\nThe cash outflow is the amount exchanged from the Norvoltian krone to the Bindiar franc to pay the ₣B27,000/ton owed for the inventory 45 days after the transaction date. This payment uses the ₣B/NVK exchange rate of 4.1790 on the settlement date of 15 July 2016.\n\n₣B 27,000/₣B4.1790 per NVK = NVK6,460.88/ton\nForeign exchange gain = Inventory cost − Cash payment\n = NVK6,462.58 − NVK6,460.88\n = NVK1.70/ton\nThus, Ambleu’s cash outflow is less than the cost included in the inventory account, and NVK1.70/ton is the realized foreign exchange gain relating to this transaction. By deferring payment for 45 days, and because the Bindiar franc decreased in value during this period, Ambleu pays NVK1.70/ton less than the inventory cost on the purchase date of 1 June 2016. Thus, Ambleu will report a foreign exchange gain in its 2016 net income.", "ko": "구매일 원가 27,000/4.1779 = 6,462.58 NVK, 결제일 지급 27,000/4.1790 = 6,460.88 NVK → 차액 1.70 NVK/ton 이익(₣B 약세로 부채 가치 감소).", "trap": "결제가 7/15에 끝났으므로 연말 환율(4.2374)이나 평균환율은 쓰지 않습니다.", "f": "FX gain on payable = FC금액/구매일환율 − FC금액/결제일환율 (FC per NVK 호가)", "why": {"B": "90.75는 연말 환율(4.2374)로 계산한 값입니다. 7/15에 이미 결제되었으므로 결제일 환율을 씁니다.", "C": "248.54는 2016년 평균환율(4.3450)로 계산한 값입니다. 결제일 환율(4.1790)을 써야 합니다."}, "orig": "FSA · ECO Module 3 Q3", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q4", "src": "ECO 오답", "module": "04-3", "tag": "Net sales growth 구성", "vig": 20, "stem": "What is the best response to Question 1?", "opts": {"A": "Yes", "B": "No, because it would reduce organic sales growth", "C": "No, because it would reduce net price realization and mix"}, "ans": "A", "en": "A is correct. Net sales growth equals organic sales growth plus or minus the effects of acquisitions, divestitures, and foreign exchange. A foreign currency translation loss would reduce net sales growth. Thus the answer to Question 1 is yes.", "ko": "Net sales growth = organic(가격·수량) ± 인수·매각 ± FX. 환산손실(외화 약세)은 net sales growth를 낮추므로 답은 'Yes'. Organic growth와 price/mix는 FX를 제외한 개념입니다.", "trap": "Organic growth에 FX가 포함된다고 착각하는 함정.", "f": "", "why": {"B": "Organic growth는 FX 효과를 제외한 개념이라 환산손실이 organic growth를 줄이지 않습니다.", "C": "Net price realization·mix도 FX와 별개 구성요소입니다. 환산손실은 FX 항목으로 net sales growth를 직접 낮춥니다."}, "orig": "FSA · ECO Module 3 Q4", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q7", "src": "ECO 오답", "module": "04-3", "tag": "ETR reconciliation – Profit mix", "vig": 20, "stem": "Based on Exhibit 2 and Note 2, the change in Ambleu’s consolidated income tax rate from 2016 to 2017 most likely resulted from a:", "opts": {"A": "decrease in Ambleu’s domestic tax rate.", "B": "more profitable business mix in its subsidiaries.", "C": "stronger Norvoltian krone relative to the currencies of its subsidiaries."}, "ans": "B", "en": "B is correct. The consolidated income tax rate is calculated as income tax expense divided by profit before tax. Note 2 shows that Ambleu’s consolidated income tax rate decreases by 2.29%, from 34.94% (=94/269) in 2016 to 32.65% (=96/294) in 2017. The largest component of the decrease stems from the 1.42% change in the effect of tax rates in non-domestic jurisdictions, which lowers Ambleu’s consolidated income tax rate in 2016 by 3.34% (=9/269) and in 2017 by 4.76% (=14/294). The decrease in 2017 could indicate that Ambleu’s business mix shifted to countries with lower marginal tax rates, resulting in a lower consolidated income tax rate and more profit. (The change could also indicate that the marginal tax rates decreased in the countries in which Ambleu earns profits.)", "ko": "Profit mix 판단은 'effect of tax rates in non-domestic jurisdictions' 항목만 봅니다. −9 → −14로 음(−)의 효과가 커짐 → 저세율 국가 이익 비중↑(more profitable business mix).", "trap": "ETR 합계 변화나 국내세율 변화로 판단하는 함정. 환율은 세율과 무관.", "f": "", "why": {"A": "국내세율 효과는 reconciliation에서 따로 보이며, profit mix 판단 근거가 아닙니다.", "C": "환율은 세율 차이를 설명하지 못합니다. 판단 근거는 'non-domestic jurisdictions' 세율효과 항목입니다."}, "orig": "FSA · ECO Module 3 Q7", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q12", "src": "ECO 오답", "module": "04-3", "tag": "Temporal method – 이익잉여금 plug", "vig": 21, "stem": "Based on Exhibits 1 and 2 and Janssen’s translation method, retained earnings for Triofind-B translated into Triofind’s presentation currency as of 30 June 2017 are closest to:", "opts": {"A": "NER150,225.", "B": "NER170,940.", "C": "NER172,414."}, "ans": "A", "en": "A is correct. Triofind uses the temporal method to translate the financial statements of Triofind-B. The temporal method uses the current exchange rate for translating monetary assets and liabilities and the historical exchange rate (based on the date when the assets were acquired) for non-monetary assets and liabilities. Monetary assets and liabilities are translated using the current exchange rate (as of 30 June 2017) of NER1 = BRD1.17 (or NER0.8547/BRD), and non-monetary assets and liabilities are translated using the historical exchange rate (as of 30 June 2016) of NER1 = BRD1.15 (or NER0.8696/BRD). Inventory is translated at the 2017 weighted average rate of NER1 = BRD1.18 (or NER0.8475/BRD). The difference required to maintain equality between (a) total assets and (b) total liabilities and shareholder’s equity is then recorded as retained earnings. The retained earnings for Triofind-B translated into Norvolt euros (Triofind’s presentation currency) as of 30 June 2017 is calculated as follows:\n\nAssets\t30 June 2017 (BRD)\tExchange Rate (NER/BRD)\tRate Used\t30 June 2017 (NER)\tLiabilities and Stockholders’ Equity\t30 June 2017 (BRD)\tExchange Rate (NER/BRD)\tRate Used\t30 June 2017 (NER)\nCash\t1,350,000\t0.8547\tC\t1,153,846\tNotes Payable\t500,000\t0.8547\tC\t427,350\nInventory\t500,000\t0.8475\tH\t423,729\tCommon Stock\t1,150,000\t0.8696\tH\t1,000,000\n \t \t \t \t \tRetained Earnings\t200,000\t \t \t150,225\n \t1,850,000\t \t \t1,577,575\tTotal\t1,850,000\t \t \t1,577,575", "ko": "Temporal: 현금·부채 = current(1.17), 재고 = 취득시 환율(2017 가중평균 1.18), 자본금 = 역사적(1.15). 자산 1,577,575 − 부채 427,350 − 자본금 1,000,000 = RE 150,225.", "trap": "모든 항목에 current rate를 쓰면(170,940) current rate method 방식.", "f": "Temporal: 화폐성 = current / 비화폐성·자본금 = historical / RE = plug", "why": {"B": "170,940은 RE 200,000을 기말환율(1.17)로 직접 환산한 값입니다. Temporal에서 RE는 B/S를 맞추는 plug입니다.", "C": "RE를 단일 환율로 직접 환산한 값입니다. 자산·부채·자본금을 각 규칙대로 환산한 뒤 plug로 구합니다."}, "orig": "FSA · ECO Module 3 Q12", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q24", "src": "ECO 오답", "module": "04-3", "tag": "Temporal method – RE 환산", "vig": 22, "stem": "After translating Consol-Can’s 31 December 20X2 balance sheet into the parent company’s currency (US$), the translated value of retained earnings will be closest to:", "opts": {"A": "$41 million.", "B": "$44 million.", "C": "$46 million."}, "ans": "B", "en": "B is correct. Translating the 20X2 balance sheet using the temporal method, as is required in this instance, results in assets of US$369 million. The translated liabilities and common stock are equal to US$325 million, meaning that the value for 20X2 retained earnings is US$369 million − US$325 million = US$44 million.\n\nTemporal Method (20X2)\nAccount\tC$\t \tRate\t \tUS$\nCash\t135\t \t0.95\t \t128\nAccounts receivable\t98\t \t0.95\t \t93\nInventory\t77\t \t0.92\t \t71\nFixed assets\t100\t \t0.86\t \t86\nAccumulated depreciation\t(10)\t \t0.86\t \t(9)\nTotal assets\t400\t \t \t \t369\nAccounts payable\t77\t \t0.95\t \t73\nLong-term debt\t175\t \t0.95\t \t166\nCommon stock\t100\t \t0.86\t \t86\nRetained earnings\t48\t \tto balance\t \t44\nTotal liabilities and shareholders’ equity\t400\t \t \t \t369", "ko": "Consol-Can 기능통화 = USD(모회사 통화) → temporal. 자산 369(현금·AR·AP·LTD는 0.95, 재고 0.92, 고정자산 0.86) − 부채 239 − 자본금 86 = RE 44.", "trap": "Current rate로 모두 환산하면 다른 값이 나옵니다. 기능통화부터 확인하세요.", "f": "", "why": {"A": "일부 항목(재고·고정자산 등)에 잘못된 환율을 적용한 값입니다. Temporal 규칙: 화폐성 = 0.95, 재고 = 0.92, 고정자산·자본금 = 0.86.", "C": "화폐성/비화폐성 구분을 잘못 적용한 값입니다. RE는 자산 369 − 부채 239 − 자본금 86 = 44."}, "orig": "FSA · ECO Module 3 Q24", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q25", "src": "ECO 오답", "module": "04-3", "tag": "기능통화 변경 근거", "vig": 22, "stem": "In response to the board’s first question, Templeton would most likely reply that such a change would be justified if:", "opts": {"A": "the inflation rate in the United States became hyperinflationary.", "B": "management wanted to flow more of the gains through net income.", "C": "Consol-Can were making autonomous decisions about operations, investing, and financing."}, "ans": "C", "en": "C is correct. The Canadian dollar would be the appropriate reporting currency when substantially all operating, financing, and investing decisions are based on the local currency. The parent country’s inflation rate is never relevant. Earnings manipulation is not justified, and at any rate changing the functional currency would take the gains off of the income statement.", "ko": "기능통화 = 주된 경제환경의 통화. 자회사가 영업·투자·재무 결정을 현지통화 기반으로 자율적으로 내리면 CAD로 변경이 정당합니다. 모회사 국가 인플레이션은 무관하고, 이익조작 목적의 변경은 불가.", "trap": "초인플레이션은 '자회사 소재국'일 때 의미 있음 — 모회사(미국) 인플레이션은 무관.", "f": "", "why": {"A": "초인플레이션 판단은 자회사 소재국 기준 — 모회사(미국) 인플레이션은 기능통화 선택과 무관합니다.", "B": "이익 조작 목적의 기능통화 변경은 불가하며, CAD로 바꾸면 오히려 환산손익이 NI에서 빠집니다(OCI)."}, "orig": "FSA · ECO Module 3 Q25", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q42", "src": "ECO 오답", "module": "04-3", "tag": "USD 강세 – 비용 측 영향", "vig": 23, "stem": "Which of the following statements about the effect of the change in the USD to GBP exchange rate during the year is most accurate? Operating income for Thames would:", "opts": {"A": "increase because of the positive effect on revenues.", "B": "increase because of the positive effect on operating costs.", "C": "decrease because of the negative effect on operating costs."}, "ans": "C", "en": "Correct. Thames incurs fuel and lease costs in USD. During the year, the USD has strengthened relative to the GBP (from GBP0.6400/USD to GBP0.6800/USD), thereby making purchases (costs) in USD more expensive for Thames and thus decreasing operating income.", "ko": "GBP/USD 0.64 → 0.68 = USD 강세. 연료·리스 비용이 USD → GBP 기준 비용↑ → 영업이익↓. 매출은 주로 GBP라 영향 미미.", "trap": "USD 강세를 매출 증가로 연결하는 함정 — 어느 쪽(매출/비용)이 외화인지 먼저 확인.", "f": "", "why": {"A": "Incorrect. The strengthening USD would not significantly affect revenues because most sales are in GBP.", "B": "Incorrect. The USD strengthened thereby increasing the costs incurred in USD and decreasing operating margins."}, "orig": "FSA · ECO Module 3 Q42", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q43", "src": "ECO 관련유형", "module": "04-3", "tag": "Transaction exposure – 연말 미실현손실", "vig": 23, "stem": "Which of the following best describes the effect on Thames’s financial statements of the payment terms related to the landing fees in Spain? Thames would:", "opts": {"A": "report an unrealized exchange loss at year-end.", "B": "defer recognizing any currency effects until the payable is paid.", "C": "adjust the landing fees expense to reflect the change in exchange rate when they are paid."}, "ans": "A", "en": "Correct. Between incurring the fees and the year-end, the EUR appreciated against the GBP (GBP0.7400/EUR to GBP0.7500/EUR), and Thames would report an unrealized loss (from holding a liability in an appreciating currency) in net income. The payable would be originally recorded when the landing fees were incurred during the final quarter (GBP0.7400) but revalued at year-end to GBP0.7500; an increase in a liability results in a loss.", "ko": "4분기 발생 EUR 부채를 0.74로 기록, 연말 0.75로 재측정 → 부채 증가 → 미실현손실을 NI에 인식. 결제 전이라도 연말엔 무조건 인식.", "trap": "'결제 시까지 인식 보류'(B)는 틀림.", "f": "", "why": {"B": "Incorrect. FX gains/losses from payables (monetary liabilities) are reported in the period they occur even if not realized.", "C": "Incorrect. The expense would not be adjusted. The choice to not pay it immediately and incur a payable is a financing decision, and the gains and losses from that are not adjusted to the operating cost."}, "orig": "FSA · ECO Module 3 Q43", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q52", "src": "ECO 오답", "module": "04-3", "tag": "FX 효과 – 경영 성과 평가", "vig": 24, "stem": "Which of the following is the most appropriate use of Berg’s reminder about the US dollar versus euro exchange rate in the current year? Peterson should use the information:", "opts": {"A": "when evaluating management’s historical performance.", "B": "to confirm that the division’s organic growth was less than 11.2%.", "C": "to determine the exchange gains or losses included in net income."}, "ans": "A", "en": "Correct. Analysts should consider the foreign currency effect on sales growth for evaluating management’s historical performance. Foreign currency fluctuations are out of management’s control, so management should not be held accountable for the fluctuations when their performance is evaluated.", "ko": "FX 변동은 경영진 통제 밖 → 과거 경영 성과 평가 시 FX 효과를 분리합니다. USD 약세는 매출의 50%를 줄이는 방향 → organic growth는 보고 성장률보다 높음.", "trap": "B는 방향이 반대(organic은 더 높음), C는 매출 환산 효과만으로 FX 손익을 계산할 수 없음.", "f": "", "why": {"B": "Incorrect. The unadjusted growth is 11.3%. If the currency devalued on 50% of the sales, then organic growth must have been greater than 11.3%.", "C": "Incorrect. Whether the FX gains/losses are included in net income depends on the type of foreign subsidiary. The calculation of the FX gains and losses considers more than just the devaluation on sales."}, "orig": "FSA · ECO Module 3 Q52", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q58", "src": "ECO 오답", "module": "04-3", "tag": "FX가 매출 증가에 미친 영향", "vig": 14, "stem": "Using Exhibits 1, 2, and 3 and Lars’s notes about the US operations, the change in sales reported for the US region (in SEK millions) explained by the change in the SEK/USD exchange rate in 2015 is closest to:", "opts": {"A": "SEK737.", "B": "SEK813.", "C": "SEK1,432."}, "ans": "A", "en": "Correct. The number of stores in the United States is the same in 2014 and 2015 (80). The average sales per US store in 2014 is the same as the Swedish stores, and the USD sales are the same in both years. But when sales are converted into SEK, the values reflect the change in the exchange rate over the period.\nCalculations\tSEK (millions)\nNumber of stores in the United States (Exhibit 1)\t80\t---\nAverage sales/US store in 2014 (same as the Swedish stores in 2014)\tSEK4,653/99 stores =\t47/Store\nSales/US store (in USD millions) based on average exchange rate in 2014\t(SEK47/Store)/(SEK6.350/USD) = USD7.40/Store\t---\nTotal USD sales (in USD millions) in 2014 and 2015 (same both years in USD)\t80 stores × (USD7.40/Store) = USD592.13\t---\nTotal USD sales in 2014 in SEK\tUSD592.13 × (SEK6.350/USD) =\t3,760\nSales in USD in 2015 (the same as 2014), converted at the 2015 average rate\tUSD592.13 × (SEK7.595/USD) =\t4,497\nIncrease in sales because of change in exchange rate\t737", "ko": "US 매장당 매출(2014) = 스웨덴 매장과 동일 4,653/99 = 47 SEK → USD 47/6.35 × 80 = USD 592.1 (2015도 동일). FX 효과 = 592.1 × (7.595 − 6.35) = 737.", "trap": "매출은 평균환율로 환산(기말환율 쓰면 1,432), 기준은 스웨덴(모회사) 매장(전체 평균 쓰면 813).", "f": "FX 효과 = USD 매출 × (평균환율t − 평균환율t−1)", "why": {"B": "Incorrect. It uses the average sales overall, not the Swedish ones to determine sales level.\nNumber of stores in the United States\t80\t---\nAverage sales/US store (in millions SEK) is the same as total stores in 2014\tIn 2014: SEK26,892/519 store = SEK51.815/store\t(the error)\nSales/US store (in millions USD)\nbased on average exchange rate in 2014\tSEK51.815/store/6.35 SEK/USD = $8.160/store\t---\nTotal USD sales (in millions USD) in 2014 and 2015 (same both years in USD)\t80 store × 8.160 USD/store = 652.79 USD\t---\nTotal USD sales in 2014 (in millions SEK)\t652.79 USD × 6.350 SEK/USD\tSEK4,145\nSales in USD in 2015 (the same as 2014)\nConverted at the 2015 average rate\t652.79 USD × 7.595 SEK/USD\tSEK4,958\nIncrease in sales (in millions) due to change in exchange rate\tSEK813", "C": "Incorrect. It uses year-end rates instead of average rates to convert sales\nNumber of stores in United States\t80\t---\nAverage sales/US store (in millions SEK)\n(same as the Swedish stores in 2014)\tIn 2014: SEK4,653/99 stores = SEK47/store\t---\nSales/US store (in millions USD)\nbased on ending exchange rate in 2014\tSEK47/store/6.380 SEK/USD = $7.367\t(the error)\nTotal USD sales (in millions USD) in 2014\t80 stores × $7.367/store = $589.36\t---\nTotal USD sales in 2014 (in millions SEK)\t$589.36 × 6.380 SEK/USD\tSEK3,760\nSales in USD in 2015 (the same as 2014)\nConverted at the 2015 closing rate (the error)\t$589.36 USD × 8.810 SEK/USD\tSEK5,192\nIncrease in sales (in millions) due to change in exchange rate\tSEK1,432"}, "orig": "FSA · ECO Module 3 Q58", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q61", "src": "ECO 오답", "module": "04-3", "tag": "세율 변경 효과 – Tax treaty", "vig": 14, "stem": "If the proposed reduction in Swedish tax rates had been in effect in 2015, the increase in Trana’s net profit (in SEK millions) would have been closest to:", "opts": {"A": "SEK18.6.", "B": "SEK29.8.", "C": "SEK31.2."}, "ans": "C", "en": "Correct. The proposed change in Swedish tax rates would have affected the income earned in Sweden (SEK338 before tax) and the pre-tax income earned in the South American subsidiary (SEK227, see calculation in following table) because the tax rate there is lower than in Sweden and hence subject to tax at Swedish rates. The income earned in tax jurisdictions with rates higher than Sweden’s (Europe and the United States) are not subject to tax in Sweden and thus would not have been affected.\n\t\tTax Effect as Reported (22%)\tUnder Proposal (16.5%)\tDifference\nSwedish earnings before taxes (EBT)\tSEK338\t74.4\t55.8\tSEK18.6\nSouth American EBT*\tSEK227\t50.0\t37.4\tSEK12.6\nTotal\t---\t---\t---\tSEK31.2\n* To calculate EBT, divide net profit of SEK204 by (1 – tax rate): 204/(1 – 0.10) = SEK227.", "ko": "스웨덴 세율 변화 영향: 스웨덴 EBT 338 + 저세율(10%) Anart의 EBT(204/0.9 = 227)만 해당. 고세율 지역(유로 30%, 미국 25%) 소득은 스웨덴 과세 없음 → (338 + 227) × 5.5% = 31.2.", "trap": "Anart 세후이익(204)을 그대로 쓰면 29.8, Anart를 빼면 18.6.", "f": "EBT = NI / (1 − t)", "why": {"A": "Incorrect. It is only the EBT in Sweden: 338 × (0.22 – 0.165) = 18.6.", "B": "Incorrect. It uses net profit as given for South America and fails to adjust it back to EBT: (338 + 204) × (0.22 – 0.165) = 29.81."}, "orig": "FSA · ECO Module 3 Q61", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q66", "src": "ECO 관련유형", "module": "04-3", "tag": "Profit mix – 해외세율 효과 항목", "vig": null, "stem": "An analyst gathers the following information about a company's tax disclosures:\nYear T – 1\tYear T – 2\nStatutory domestic tax rate\t28%\t30%\nEffect of tax rates in foreign jurisdictions\t4%\t2%\nEffect of tax exemptions and other reconciling items\t–2%\t–2%\nEffective tax rate\t30%\t30%\nCompared to Year T – 2, in Year T – 1 the company most likely generated:", "opts": {"A": "a lower share of its profit in countries with higher marginal tax rates.", "B": "the same proportion of profit in countries with higher marginal tax rates.", "C": "a higher share of its profit in countries with higher marginal tax rates."}, "ans": "C", "en": "Correct because the effect of tax rates in foreign jurisdictions rose from 2% to 4%. This greater impact could indicate that profit mix shifted to countries with higher marginal tax rates. The change could also indicate that the marginal tax rates increased in the countries in which it earns profits.", "ko": "Effect of foreign tax rates +2% → +4%(양(+)의 효과 확대) → 고세율 국가 이익 비중↑. ETR 합계(30%)가 같아도 구성 변화로 판단.", "trap": "ETR 합계가 같다고 '변화 없음'(B) 선택하는 함정.", "f": "", "why": {"A": "Incorrect because the effect of tax rates in foreign jurisdictions rose from 2% to 4%.", "B": "Incorrect because the effect of tax rates in foreign jurisdictions rose from 2% to 4%, indicating a higher share of profits being generated in countries with higher marginal tax rates."}, "orig": "FSA · ECO Module 3 Q66", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q67", "src": "ECO 오답", "module": "04-3", "tag": "Sustainable sales growth", "vig": null, "stem": "A company reported the following information related to its sales growth in the most recent year:\nContribution from volume growth\t7%\nContribution from price increases\t2%\nContribution from foreign currency exchange\t–3%\nTotal sales growth\t6%\nThe best estimate of its sustainable growth for the year is:", "opts": {"A": "6%.", "B": "7%.", "C": "9%."}, "ans": "C", "en": "Correct because volume and price increases are 7% + 2% = 9%. Growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.", "ko": "지속가능(organic) 성장 = 수량 + 가격 = 7% + 2% = 9%. FX 효과는 지속가능하지 않고 경영진 통제 밖이므로 제외.", "trap": "총 성장률(6%)이나 수량만(7%) 고르는 함정.", "f": "Sustainable growth = Volume + Price (FX 제외)", "why": {"A": "Incorrect because this is the total sales growth which includes the impact from foreign currency and it should not be considered sustainable. The sustainable sales growth consists of volume and price increases 7% + 2% = 9%.", "B": "Incorrect because this represents the volume growth. The sustainable sales growth should include both the price increases and the volume growth = 2% + 7% = 9%."}, "orig": "FSA · ECO Module 3 Q67", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q71", "src": "ECO 오답", "module": "04-3", "tag": "Functional currency 정의", "vig": null, "stem": "A foreign subsidiary is located in the UK and its parent is located in the US. The subsidiary primarily conducts business in EUR but reports in GBP. The subsidiary's functional currency is most likely:", "opts": {"A": "GBP.", "B": "EUR.", "C": "USD."}, "ans": "B", "en": "Correct because the functional currency, is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash.", "ko": "기능통화 = 주로 현금을 창출·지출하는 주된 경제환경의 통화 → EUR. 보고에 쓰는 GBP는 presentation currency, USD는 모회사 통화.", "trap": "표시통화·소재국 통화와 기능통화를 혼동.", "f": "", "why": {"A": "Incorrect because the currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located.", "C": "Incorrect because USD is the local currency of the parent company. Whereas in some cases, the foreign subsidiary could have the parent’s functional currency as its own. The functional currency, is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash."}, "orig": "FSA · ECO Module 3 Q71", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q72", "src": "ECO 오답", "module": "04-3", "tag": "Transaction exposure – 연말 미실현손익", "vig": null, "stem": "An analyst gathers the following information about a company’s transactions occurring on 15 December:\n• USD 50,000 export, invoiced and paid on the same day; and\n• USD 200,000 import, invoiced and will be paid in 30 days.\nThe company’s functional and presentation currency is EUR and the spot exchange rates are:\nReference Date\tEUR/USD\n15 December\t0.9525\n31 December\t0.9470\nNote: EUR/USD is the amount of EUR per 1 USD.\nIf the company's year end is 31 December, the company would report as a result of these transactions:", "opts": {"A": "no foreign currency gain or loss.", "B": "a EUR 825 foreign currency gain.", "C": "a EUR 1,100 foreign currency gain."}, "ans": "C", "en": "Correct because transaction exposure related to imports and exports can be summarized as follows: Import purchase - A transaction exposure arises when the importer is obligated to pay in foreign currency and is allowed to defer payment until sometime after the purchase date. Export sale - A transaction exposure arises when the exporter agrees to be paid in foreign currency and allows payment to be made sometime after the purchase date. Also, a foreign currency payable resulting from an import purchase creates a liability exposure to foreign exchange risk. If the foreign currency weakens, the foreign currency payable loses value in terms of the functional currency and a gain exists. In addition, for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. In this case:\nTransaction 1: the export is cashed the same day the invoice is issued, thus it does not lead to foreign exchange exposure\nTransaction 2: the import leads to foreign exchange exposure since payment is deferred for 30 days. Considering the foreign currency, USD, weakens, the company reports a gain equal to Import value × (Spot rate as of December 15 – Spot rate as of December 31) = USD 200,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 200,000 × 0.0055 EUR/USD = EUR 1,100.", "ko": "수출: 당일 결제 → 노출 없음. 수입: 30일 후 결제(다음 연도) → 연말에 반드시 미실현 손익 인식. USD 약세(0.9525 → 0.9470) → USD 부채 가치↓ → 이익 200,000 × 0.0055 = EUR 1,100.", "trap": "'결제 전이라 인식 보류'(A)는 틀림. 당일 결제 수출에 손실을 넣으면 B.", "f": "", "why": {"A": "Incorrect because it considers neither transaction generates any foreign exchange exposure, as follows:\nTransaction 1: the export is cashed the same day the invoice is issued thus it does not lead to foreign exchange exposure;\nTransaction 2: the payment is deferred for the following year, thus no exposure is recognized at the intervening balance sheet date as of December 31.", "B": "Incorrect because it determines a gain on Transaction 2 and a loss on Transaction 1 (instead of 0 impact) as follows:\nTransaction 1: Loss = Export value × (Spot rate as of December 15– Spot rate as of December 31) = USD50,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 50,000 × 0.0055 EUR/USD = EUR 275.\nTransaction 2: Gain = Import value × (Spot rate as of December 15– Spot rate as of December 31) = USD200,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 200,000 × 0.0055 EUR/USD = EUR 1,100.\nTotal result = Gain in Transaction 2 – Loss in Transaction 1 = 1,100 – 275 = EUR 825."}, "orig": "FSA · ECO Module 3 Q72", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q73", "src": "ECO 오답", "module": "04-3", "tag": "Current rate method – 총자산", "vig": null, "stem": "An analyst gathers the following information (in GBP) as of 31 December about the UK subsidiary of a German company that purchased property and equipment on 1 January:\nCash\t1,000,000\nAccounts receivable\t700,000\nInventory\t800,000\nProperty and equipment\t4,500,000\nTotal assets\t7,000,000\nThe following exchange rate information was gathered:\nDate\tEUR/GBP\n1 January\t1.1550\n31 December\t1.1625\nWeighted-average rate when inventory was acquired\t1.1430\nNote: EUR/GBP is the amount of EUR per 1 GBP.\nThe functional currency of the subsidiary is GBP. After translating the UK subsidiary's balance sheet into the parent company's currency (EUR), the UK subsidiary would recognize total assets of:", "opts": {"A": "EUR 8,088,150.", "B": "EUR 8,121,900.", "C": "EUR 8,137,500."}, "ans": "C", "en": "Correct because the functional currency of the subsidiary is GBP, the local currency, and thus, the current rate method is used. Thus, assets and liabilities are translated at the current exchange rate on the balance sheet date of 31 December.\nCash\t= GBP 1,000,000 × EUR/GBP 1.1625 = EUR1,162,500\nAccounts receivable\t= GBP 700,000 × EUR/GBP 1.1625 = EUR 813,750\nInventory\t= GBP 800,000 × EUR/GBP 1.1625 = EUR 930,000\nProperty and equipment\t= GBP 4,500,000 × EUR/GBP 1.1625 = EUR 5,231,250\nTotal assets\t= 1,162,500 + 813,750 + 930,000 + 5,231,250 = EUR 8,137,500\nAlternatively, Total assets = GBP 7,000,000 × EUR/GBP 1.1625 = EUR 8,137,500.", "ko": "기능통화 GBP(현지) ≠ 모회사 EUR → current rate → 모든 자산을 기말환율 1.1625로: 7,000,000 × 1.1625 = EUR 8,137,500.", "trap": "재고에 가중평균, PP&E에 역사적 환율을 쓰면 temporal 방식(A, B).", "f": "", "why": {"A": "Incorrect because Inventory is translated at the weighted-average rate when inventory was acquired (as per the temporal method) instead of the current exchange rate on the balance sheet date of 31 December (as required under the current method) and Property and Equipment is translated at the historical exchange rate when the assets were acquired, on 1 January.\nCash\t= GBP 1,000,000 × EUR/GBP 1.1625 = EUR1,162,500\nAccounts receivable\t= GBP 700,000 × EUR/GBP 1.1625 = EUR 813,750\nInventory\t= GBP 800,000 × EUR/GBP 1.1430 = EUR 914,400\nProperty and equipment\t= GBP 4,500,000 × EUR/GBP 1.1550 = EUR 5,197,500\nTotal assets\t= 1,162,500 + 813,750 + 914,400 + 5,197,500 = EUR 8,088,150", "B": "Incorrect because Inventory is translated at the weighted-average rate when inventory was acquired (as per the temporal method) instead of the current exchange rate on the balance sheet date of 31 December (as required under the current method).\nCash\t= GBP 1,000,000 × EUR/GBP 1.1625 = EUR1,162,500\nAccounts receivable\t= GBP 700,000 × EUR/GBP 1.1625 = EUR 813,750\nInventory\t= GBP 800,000 × EUR/GBP 1.1430 = EUR 914,400\nProperty and equipment\t= GBP 4,500,000 × EUR/GBP 1.1625 = EUR 5,231,250\nTotal assets\t= 1,162,500 + 813,750 + 914,400 + 5,231,250 = EUR 8,121,900"}, "orig": "FSA · ECO Module 3 Q73", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q76", "src": "ECO 오답", "module": "04-3", "tag": "미결제 외화거래 손익 – I/S", "vig": null, "stem": "A company entered into a foreign currency transaction whose settlement date falls in a subsequent accounting period. Will the unrealized gain or loss on this foreign currency transaction be reported on the financial statements for the current period?", "opts": {"A": "No", "B": "Yes, it will be reported on the income statement", "C": "Yes, it will be reported in other comprehensive income"}, "ans": "B", "en": "Correct because for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gains and losses are reported on the income statement, creating one of the few situations in which accounting rules allow, indeed require, companies to include (recognize) a gain or loss in income before it has been realized.", "ko": "결제일이 다음 기간이면 IFRS·US GAAP 모두 중간 B/S일 환율 변동을 반영하고 손익은 I/S에 인식(미실현이어도). 실현 전 손익을 인식하는 드문 예.", "trap": "OCI(C) 함정 — OCI는 current rate method의 translation adjustment.", "f": "", "why": {"A": "Incorrect because foreign currency transaction gains and losses are reported on the income statement.", "C": "Incorrect because foreign currency transaction gains and losses are reported on the income statement; not in other comprehensive income."}, "orig": "FSA · ECO Module 3 Q76", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q80", "src": "ECO 오답", "module": "04-3", "tag": "Temporal vs Current rate – 외화 약세", "vig": null, "stem": "The foreign currency of a subsidiary has consistently depreciated against the parent's presentation currency. The subsidiary does not have any non-monetary liabilities, but does have long-term debt issued five years ago. Compared to the current rate method, the temporal method of translation most likely results in:", "opts": {"A": "lower reported assets.", "B": "higher reported equity.", "C": "higher reported liabilities."}, "ans": "B", "en": "Correct because the temporal method will result in higher reported assets since some of the assets will be reported at a higher historical exchange rate. The liabilities will be the same as all liabilities will be translated at the same current exchange rate under both methods. As a result, the temporal method will result in a higher equity balance so that the balance sheet will balance. The current rate method will have a negative translation adjustment due to the depreciation of the foreign currency that will be reported in the equity section.", "ko": "외화 약세: temporal은 일부 비화폐성자산을 역사적(높은) 환율로 환산 → 자산↑. 부채는 비화폐성부채가 없으므로 둘 다 current → 동일. 따라서 temporal의 자본이 더 큼(current rate는 음(−)의 CTA).", "trap": "LT debt를 발행일 환율로 환산한다고 착각하면 C를 고르게 됩니다.", "f": "", "why": {"A": "Incorrect because as the foreign currency depreciates, the current rate method will use the lower current exchange rate to translate the assets, but the temporal method will use the higher historical rate to translate some of the non-monetary assets. As a result of using a higher exchange rate for some of the assets, the temporal method will report a higher total asset value than when using the current rate method.", "C": "Incorrect because as the foreign current depreciates, the current rate method will use the lower current exchange rate to translate the liabilities, as will the temporal method with the exception of non-monetary liabilities. If the company has no non-monetary liabilities, the reported liabilities will be the same under both methods."}, "orig": "FSA · ECO Module 3 Q80", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q81", "src": "ECO 오답", "module": "04-3", "tag": "Hyperinflation – Stock 항목 재작성", "vig": null, "stem": "A subsidiary of a European based parent company operates in a foreign country experiencing hyperinflation. The general price level and exchange rates for the country were reported as:\nGeneral\nPrice Level\nEuro (€) per\nForeign Currency\nBeginning of the year\t150\t0.360\nAverage for the year\t250\t0.210\nEnd of the year\t375\t0.160\nIf the subsidiary reported a capital stock of 100,000 (in foreign currency units) at the beginning of the year, the reported value at the end of the year is closest to:", "opts": {"A": "€16,000.", "B": "€27,000.", "C": "€40,000."}, "ans": "C", "en": "Correct because under IFRS, capital stock is first restated in terms of general price level and then translated at the current exchange rate at the end of the period.  The restatement factor using the general price index is 2.5 (= 375/150).  Therefore the inflation adjusted foreign currency value is 100,000 × 2.5 = 250,000.  The ending exchange rate is 0.160 so the reported value is 250,000 × 0.160 = 40,000.", "ko": "자본금(stock 항목) 재작성 계수 = 기말GPI/기초(취득)GPI = 375/150 = 2.5 → 250,000 × 0.160 = €40,000.", "trap": "재작성 없이 환산(16,000), 평균GPI 사용(27,000) 함정.", "f": "Stock: 금액 × GPI기말/GPI취득시점 × 기말환율", "why": {"A": "Incorrect because it does not restate the capital stock in terms of the general price index and translates the value at the ending exchange rate. Reported value of capital stock = 100,000 × 0.160 = 16,000.", "B": "Incorrect because it uses the average general price index for the year in the restatement factor. Ending reported value of capital stock = 100,000 × (250/150) × 0.160 = 26,667 ≈ 27,000."}, "orig": "FSA · ECO Module 3 Q81", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q85", "src": "ECO 오답", "module": "04-3", "tag": "Presentation currency", "vig": null, "stem": "A US-based multinational corporation has a UK subsidiary with primary activities in Europe. The financial statements of the subsidiary for local regulators are most likely presented in:", "opts": {"A": "EUR.", "B": "GBP.", "C": "USD."}, "ans": "B", "en": "Correct because the subsidiary's presentation currency is most likely GBP. The currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located.", "ko": "현지 규제당국용 재무제표는 보통 회사 소재국 통화(GBP)로 표시합니다. 기능통화는 EUR일 가능성, 모회사 표시통화는 USD.", "trap": "기능통화(EUR)와 표시통화를 혼동.", "f": "", "why": {"A": "Incorrect because the subsidiary's presentation currency is most likely GBP. The currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located. The parent's local currency is USD and the subsidiary's functional currency is most likely EUR. Another important concept in accounting for foreign currency activities is the functional currency, which is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash.", "C": "Incorrect because the subsidiary's presentation currency is most likely GBP.\nThe currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located. However, the parent's presentation currency is most likely USD."}, "orig": "FSA · ECO Module 3 Q85", "subject": "FSA"}, {"id": "FSA:ECO-M3-Q86", "src": "ECO 오답", "module": "04-3", "tag": "외화 약세 – Current rate 영업이익↑", "vig": null, "stem": "Masswell corporation opens a foreign subsidiary and elects to report the subsidiary's results using the current rate method. During the first year of operations, the foreign currency depreciates against Masswell's home currency. Did the choice of reporting method affect Masswell's reported operating income?", "opts": {"A": "No", "B": "Yes, operating income was lower than it would have been under the temporal method", "C": "Yes, operating income was higher than it would have been under the temporal method"}, "ans": "C", "en": "Correct because under the current rate method revenues and expenses are translated at the exchange rate that existed when the transactions took place. Under the temporal method expenses related to non-monetary assets, such as cost of goods sold (inventory), depreciation (fixed assets), and amortization (intangible assets), are translated at the exchange rates used to translate the related assets. The depreciating foreign currency means that under the current rate method these non-monetary expenses would be translated at the lower average exchange rate causing operating income to be higher under the current rate method than under the temporal method.", "ko": "외화 약세: current rate는 COGS·감가상각도 평균(더 낮은) 환율로 환산 → 비용이 작게 → 영업이익↑. Temporal은 이들 비용을 역사적(더 높은) 환율로 환산.", "trap": "매출은 두 방법 모두 평균환율 — 차이는 비화폐성 관련 비용에서 발생.", "f": "", "why": {"A": "Incorrect because operating income would be higher under the current rate method given these circumstances.", "B": "Incorrect because operating income would be higher under the current rate method given these circumstances."}, "orig": "FSA · ECO Module 3 Q86", "subject": "FSA"}, {"id": "FSA:SCH-M3-02", "src": "Schweser MQ", "module": "04-3", "tag": "Temporal 노출 정의", "vig": null, "stem": "If a foreign subsidiary's functional currency is the same as the parent's presentation currency, the parent's exposure to changing exchange rates is based on the subsidiary's:", "opts": {"A": "total assets minus total liabilities.", "B": "monetary assets minus monetary liabilities.", "C": "non-monetary assets minus non-monetary liabilities."}, "ans": "B", "en": "Functional currency = parent's presentation currency → temporal method → exposure is the net monetary asset (liability) position.", "ko": "기능통화 = 모회사 표시통화 → temporal → 노출 = 순화폐성자산. Current rate는 순자산(A).", "trap": "", "f": "Temporal: 순화폐성자산 / Current rate: 순자산", "why": {"A": "순자산(총자산 − 총부채) 노출은 current rate method입니다.", "C": "비화폐성 항목은 temporal에서 역사적 환율로 고정되어 노출되지 않습니다."}, "orig": "FSA · Schweser MQ 9.3 변형", "subject": "FSA"}, {"id": "FSA:SCH-M3-10", "src": "Schweser MQ", "module": "04-3", "tag": "Hyperinflation – 구매력 이익", "vig": null, "stem": "A subsidiary operates in a hyperinflationary economy and its parent reports under IFRS. Which exposure results in a net purchasing power gain?", "opts": {"A": "Non-monetary assets", "B": "Monetary liabilities", "C": "Monetary assets"}, "ans": "B", "en": "Non-monetary items are restated and not exposed to purchasing power gains/losses. Holding monetary liabilities during inflation produces purchasing power gains; monetary assets produce losses.", "ko": "인플레이션 시 화폐성부채 보유 → 실질 상환부담 감소 → 구매력 이익. 화폐성자산 → 손실. 비화폐성 항목은 재작성되므로 노출 없음.", "trap": "", "f": "", "why": {"A": "비화폐성자산은 재작성되므로 구매력 손익에 노출되지 않습니다.", "C": "인플레이션 시 화폐성자산 보유 = 구매력 '손실'입니다."}, "orig": "FSA · Schweser MQ 9.7 변형", "subject": "FSA"}, {"id": "FSA:SCH-M3-11", "src": "변형", "module": "04-3", "tag": "Hyperinflation – Flow 항목 계산 (변형)", "vig": null, "stem": "A subsidiary in a hyperinflationary economy reports annual revenue of LC1,000. General price index: beginning of year 100, average for year 160, end of year 240. Year-end exchange rate is €0.05 per LC. Under IFRS, revenue reported in euros is closest to:", "opts": {"A": "€50.", "B": "€75.", "C": "€120."}, "ans": "B", "en": "Revenue (a flow item) is restated by end-of-year GPI / average GPI: 1,000 × 240/160 = LC1,500, then translated at the current rate: 1,500 × 0.05 = €75.", "ko": "Flow 항목은 기말GPI/평균GPI로 재작성 → 1,500 → 기말환율 0.05 → €75. 기초GPI를 쓰면(stock 방식) €120, 재작성 생략 시 €50.", "trap": "Flow에 기초 GPI를 쓰는 함정 — 기초(취득) GPI는 자본금·PP&E 같은 stock 항목용.", "f": "Flow: × GPI말/GPI평균 → × 기말환율", "why": {"A": "€50은 재작성 없이 환산한 값입니다. IFRS는 먼저 GPI로 재작성합니다.", "C": "€120은 기초 GPI(100)로 재작성한 값 — flow 항목은 평균 GPI(160)를 씁니다."}, "orig": "FSA · Schweser R9 개념 변형", "subject": "FSA"}, {"id": "FSA:ECO-M6-Q2", "src": "ECO 오답", "module": "04-6", "tag": "DuPont – 레버리지 효과", "vig": 25, "stem": "Based on the DuPont analysis, Abay’s belief regarding ROE is most likely based on:", "opts": {"A": "leverage.", "B": "profit margins.", "C": "asset turnover."}, "ans": "A", "en": "A is correct. The DuPont analysis shows that profit margins and asset turnover have both increased over the last three years, but leverage has declined. The reduction in leverage offsets a portion of the improvement in profitability and turnover. Thus, ROE would have been higher if leverage had not decreased.", "ko": "NPM·자산회전율은 상승했지만 레버리지(3.43 → 3.09)는 하락. 운영 변화 없이 ROE를 높이려면 레버리지를 다시 높이면 됨.", "trap": "운영 지표(마진·회전율)는 '운영 변화'가 필요합니다.", "f": "ROE = NPM × Asset turnover × Assets/Equity", "why": {"B": "마진은 이미 개선되었고, 더 높이려면 운영 변화가 필요합니다.", "C": "자산회전율도 이미 개선되었고, 운영 변화가 필요합니다."}, "orig": "FSA · ECO Module 6 Q2", "subject": "FSA"}, {"id": "FSA:ECO-M6-Q17", "src": "ECO 오답", "module": "04-6", "tag": "부문 마진 유지 시 전체 마진", "vig": 26, "stem": "If the children’s products division had been able to maintain its prior year operating margin in the current year, the company’s overall operating margin in current year, compared to the prior year, would have been:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "A", "en": "Correct. Apply the prior year operating margin for the children’s products division to the current year revenues for the division to determine what the current year overall operating profit margin would have been if the margin had been maintained, and then compare it with the prior year overall operating profit margin.\nOperating margin in children’s products in prior year = Operating profit/revenues\t115.7/1,236.2\t9.4%\nApply the 9.4% margin to current year revenues for division\t0.094 × 1,176.2\t110.6\nIncrease in current year operating profit for division, had the margin been maintained\t110.6 – 64.7\t45.9\nRevised current year company operating profit with increase in children’s products operating profit\t172.7 + 45.9\t218.6\nRevised current year company operating margin\t218.6/2,837.1\t7.7%\nPrior year company operating margin\t219.4/2,775.5\t7.9%\nEven if the children’s products division had maintained its operating margin in the current year, the overall company operating margin would still have decreased slightly (7.7% versus 7.9%).", "ko": "아동 부문 전년 마진 9.4% × 당해 매출 1,176.2 = 110.6 → 증분 45.9 → 전사 영업이익 218.6/2,837.1 = 7.7% < 전년 7.9% → 여전히 lower.", "trap": "110.6 전체를 더하는 실수(증분만 더해야 함).", "f": "", "why": {"B": "Incorrect. It is not the same.", "C": "Incorrect: If they incorrectly add the full 110.6 to the operating profit (and not just the incremental change) then it would be higher: (172.7 + 110.6)/2,837.1 = 10%."}, "orig": "FSA · ECO Module 6 Q17", "subject": "FSA"}, {"id": "FSA:ECO-M6-Q20", "src": "ECO 오답", "module": "04-6", "tag": "Core 이익 조정", "vig": null, "stem": "An analyst gathers the following information about a company (in € millions):\nOne-off income from associates and joint ventures\t10\nOne-off revaluation loss\t4\nRecurring yearly provisions for restructuring activities\t3\nProfit before tax\t30\nThe adjusted profit before tax that best reflects the company's core performance (in € millions) is:", "opts": {"A": "20.", "B": "24.", "C": "27."}, "ans": "B", "en": "Correct because the analyst is interested in the ongoing operations of the company unaffected by non-repeating types of gains or losses (such as One-off income from associates and joint ventures and One-off revaluation loss).\nAccordingly, the Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures + One-off revaluation loss = 30 – 10 + 4 = 24.\nRecurring yearly provisions for restructuring activities are already reflected in Profit before tax and no adjustment is needed. Provisions involve decisions by management, they recur regularly, and they affect the returns to shareholders. In assessing the company’s prospects, these charges are important variables that should not to be ignored.", "ko": "일회성 항목만 제거: 30 − 일회성 관계기업 이익 10 + 일회성 재평가손실 4 = 24. 매년 반복되는 구조조정 충당금은 핵심 성과에 포함(조정 X).", "trap": "반복 항목까지 더하는 실수(27).", "f": "", "why": {"A": "Incorrect because net profit is adjusted for one-off gains only as follows: Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures = 30 – 10 = 20.", "C": "Incorrect because net profit is adjusted for one-offs and recurring items, as follows: Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures + One-off revaluation loss + Recurring yearly provisions for restructuring activities= 30 – 10 + 4 + 3 = 27."}, "orig": "FSA · ECO Module 6 Q20", "subject": "FSA"}, {"id": "FSA:ECO-M6-Q24", "src": "ECO 오답", "module": "04-6", "tag": "재작성(restatement) 요구 상황", "vig": null, "stem": "Which of the following situations most likely requires a company to restate its prior year financial statements?", "opts": {"A": "The cash-flow-based accruals ratio is exceptionally high", "B": "A significant amount of income is sourced from investments in associates", "C": "Changed accounting standards alter the calculation of benefit plan obligations"}, "ans": "C", "en": "Correct because a company is required to restate its prior year financial statements for changed accounting standards that alter the calculation of benefit obligations. The analyst identifies the beginning of year adjustments and revises the end of last year year-end balances accordingly. Therefore, when there is an accounting standards change, prior year financial statements have to be restated by the company to improve comparability across years, and the analyst should take this into account.", "ko": "회계기준 변경으로 퇴직급여 부채 계산이 바뀌면 전기 재무제표 재작성 필요. Accruals ratio가 높거나 관계기업 이익이 큰 것은 분석상 조정 대상일 뿐 재작성 사유 아님.", "trap": "", "f": "", "why": {"A": "Incorrect because the balance-sheet-based and cash-flow-based accruals ratios are measures of financial reporting quality. If the ratio is high in certain years, the analyst may want to examine the quality of the company's cash flow and its relationship to net income. Therefore, if the ratio is exceptionally different from prior years, the analyst would need to investigate further but the company need not restate the financial statements in prior years.", "B": "Incorrect because the income from associates is a pure net income figure, presented after taxes and with no related revenue in the income statement. To avoid making incorrect inferences about the profitability of the company's operations, the analyst wants to remove the effects of the investments in associates from the balance sheet and income statement. Therefore, if the company possess a significant amount of income from associates, the analyst may need to split out the amount in the current year, but the company need not restate the financial statements in prior years."}, "orig": "FSA · ECO Module 6 Q24", "subject": "FSA"}, {"id": "FSA:ECO-M6-Q27", "src": "ECO 오답", "module": "04-6", "tag": "분석 프레임워크 단계별 산출물", "vig": null, "stem": "A financial analyst is preparing an investment recommendation report on a public company. To prepare the report, she analyzes the company’s financial statements following a framework comprising the following phases: (1) Define purpose of analysis, (2) Collect input data, (3) Process input data, (4) Analyze/Interpret data, (5) Develop and communicate recommendations, (6) Follow-up. Which of the following is most likely an output of phase 3?", "opts": {"A": "Financial data tables", "B": "List of questions to answer", "C": "Adjusted financial statements"}, "ans": "C", "en": "Correct because adjusted financial statements is the result of processing financial data. After collecting the financial data (phase 2), the analyst processes the data (phase (3), making the adjustments necessary to leave the data ready for analysis.", "ko": "① 목적 정의 → 질문 목록, ② 자료 수집 → 재무 데이터 표, ③ 자료 처리 → 조정된 재무제표·common-size, ④ 분석/해석, ⑤ 권고, ⑥ 후속관리.", "trap": "수집(데이터 표)과 처리(조정 재무제표) 혼동.", "f": "", "why": {"A": "Incorrect because financial data tables is an output of phase 2, Collect input data.", "B": "Incorrect because a list of questions to answer is an output of phase 1, Define purpose of analysis."}, "orig": "FSA · ECO Module 6 Q27", "subject": "FSA"}, {"id": "Equity:ECO-M2-Q7", "src": "ECO 오답", "module": "05-2", "tag": "DDM 적합성 판단", "vig": 27, "stem": "Which of the following statements made by Thomas is correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "C is correct. A dividend discount model is especially useful when dividend policy bears an understandable and consistent relationship to the company’s profitability. The relatively consistent dividend payout ratio suggests Company JZY would be a suitable candidate for a dividend discount model.", "ko": "Statement 3이 맞습니다: 배당정책이 수익성과 이해 가능하고 일관된 관계(안정적 payout)를 가질 때 DDM이 특히 유용합니다.", "trap": "DDM 적합: 배당 지급 이력 + 배당과 이익의 일관된 관계 + 비지배(noncontrol) 관점.", "f": "", "why": {"A": "Statement 1 오류: 인수 대상(takeover candidate)이면 지배 관점이므로 오히려 FCF 모형이 '적합'합니다.", "B": "Statement 2 오류: 배당이 몇 년 중단되어도 재개 시점과 이후 배당을 예측하면 DDM 적용이 가능합니다."}, "orig": "Equity · ECO Module 2 Q7", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q15", "src": "ECO 오답", "module": "05-2", "tag": "PVGO – P/E의 성장 성분 (PVGO/E1)", "vig": 27, "stem": "Based on Exhibit 1, the growth component of the leading P/E is largest for:", "opts": {"A": "ABTD.", "B": "BKKQ.", "C": "CPMN."}, "ans": "C", "en": "C is correct. The leading P/E is calculated as follows:\nP0/E1 = [1/r] + [PVGO/E1],\nwhere 1/r captures the no-growth component of P/E and PVGO/E1 captures the growth component of the P/E.\nPVGO is computed as follows:\nPVGO (ABTD) = P0 – E1/r = 80.00 – [7.30/0.105] = C$10.48\nPVGO (BKKQ) = P0 – E1/r = 39.00 – [2.12/0.08] = C$12.50\nPVGO (CPMN) = P0 – E1/r = 27.39 – [1.90/0.12] = C$11.56\nwhere P0 is the current price per share, E1 is the forecasted earnings per share, and r is the required rate of return.\nThe growth component of the P/E for each stock [PVGO/E1] is as follows:\nABTD: 10.48/7.30 = 1.44×\nBKKQ: 12.50/2.12 = 5.90×\nCPMN: 11.56/1.90 = 6.08×", "ko": "Leading P/E = 1/r + PVGO/E1. 성장 성분 = PVGO/E1. PVGO = P0 − E1/r: ABTD 10.48, BKKQ 12.50, CPMN 11.56. 성장 성분: ABTD 1.44×, BKKQ 5.90×, CPMN 6.08× → CPMN 최대.", "trap": "PVGO(금액) 최대 ≠ P/E 성장성분(PVGO/E1) 최대. 질문이 무엇을 묻는지 확인.", "f": "P0/E1 = 1/r + PVGO/E1,  PVGO = P0 − E1/r", "why": {"A": "ABTD는 PVGO/E1 = 1.44×로 가장 작습니다.", "B": "PVGO '금액'은 BKKQ가 가장 크지만(12.50), 질문은 P/E의 성장 성분(PVGO/E1)입니다."}, "orig": "Equity · ECO Module 2 Q15", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q21", "src": "ECO 오답", "module": "05-2", "tag": "Gordon growth – 적정가격이면 자본이득률 = g", "vig": 28, "stem": "If Renteria is correct that the current price of Tasty Foods stock is its fair value, what is the expected capital gains yield on the stock?", "opts": {"A": "3.87%.", "B": "4.25%.", "C": "5.30%."}, "ans": "A", "en": "A is correct. If the stock is fairly priced in the market as per the Gordon growth model, the stock price is expected to increase at g, the expected growth rate in dividends. The implied growth rate in dividends, if price is the fair value, is 3.87%. Therefore, the expected capital gains yield is 3.87%.", "ko": "GGM에서 주가가 적정가치면 주가는 g로 성장 → 기대 자본이득률 = g. 시장가에 내재된 g: 8.42 = 0.59(1+g)/(0.1115−g) → g = (8.42×0.1115 − 0.59)/(8.42+0.59) = 3.87%.", "trap": "GGM: 총수익률 = 배당수익률(D1/P0) + 자본이득률(g).", "f": "g = (P0·r − D0)/(P0 + D0),  r = D1/P0 + g", "why": {"B": "4.25%는 내재 g 계산과 맞지 않는 값입니다. 정확한 내재 g는 3.87%.", "C": "5.30%는 Rae가 쓴 과거 배당성장률입니다. Renteria는 현재가가 적정가라고 보므로 가격에 내재된 g를 써야 합니다."}, "orig": "Equity · ECO Module 2 Q21", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q24", "src": "ECO 오답", "module": "05-2", "tag": "Gordon growth model 적용 조건", "vig": 29, "stem": "Which sector report best describes a situation in which the Gordon growth model could be used to value utility stocks?", "opts": {"A": "Report 1", "B": "Report 2", "C": "Report 3"}, "ans": "B", "en": "B is correct because the Gordon growth model can accurately value companies that are repurchasing shares when the analyst can appropriately adjust the dividend growth rate for the impact of share repurchases.", "ko": "Report 2: 자사주매입 규모·시기를 신뢰성 있게 예측할 수 있다면, 애널리스트가 배당성장률을 자사주매입 효과에 맞게 조정하여 GGM을 쓸 수 있습니다.", "trap": "GGM 전제: g < r, g는 장기 지속 가능(대체로 명목 GDP 성장 이하).", "f": "V0 = D1/(r − g),  g < r", "why": {"A": "Report 1: 성장률이 자기자본비용을 초과(g > r)하면 GGM이 성립하지 않습니다(분모 음수).", "C": "Report 3: 4.5% 이익성장이 장기 GDP 성장(2.75%)을 웃돌아 영구 성장률로 쓰기에 지속 불가능합니다."}, "orig": "Equity · ECO Module 2 Q24", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q27", "src": "ECO 오답", "module": "05-2", "tag": "3-stage DDM (H-model in stage 2·3)", "vig": 29, "stem": "Based on Exhibit 2, which stock can most appropriately be valued using a three-stage DDM with the second and third stages being treated as an H-model?", "opts": {"A": "BIOK", "B": "CCAX", "C": "HLTV"}, "ans": "A", "en": "A is correct because the dividend growth is declining linearly during the second stage of a three-stage DDM used to value BIOK. As noted in the text, a three-stage valuation clearly has an H-model process in the second and third stages. In contrast, abrupt—rather than linearly declining—dividend growth rates are implied for CCAX and HLTV.", "ko": "BIOK: 8년간 15% 고성장 → 이후 3년간 '선형적으로' 하락 → 성숙 성장. 2·3단계가 선형 감소 + 안정 성장 = H-model 구조 → 3-stage DDM(2·3단계를 H-model로) 적합.", "trap": "'linearly declining' 키워드 = H-model.", "f": "", "why": {"B": "CCAX는 6년간 배당 고정 후 GDP 성장으로 '급변' → 기본 2단계 모형.", "C": "HLTV는 27% → 12% → 성숙으로 '계단식(abrupt)' 변화 → 일반 3단계 모형(선형 감소 아님)."}, "orig": "Equity · ECO Module 2 Q27", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q29", "src": "ECO 오답", "module": "05-2", "tag": "2-stage DDM – 1단계 말 terminal value의 의미", "vig": 30, "stem": "Based on Exhibit 1, when Withers applies the first valuation approach to Ukon Corporation, the estimated value of the stock at the end of the first stage represents the:", "opts": {"A": "present value of the dividends beyond year 2023.", "B": "present value of the dividends for years 2020 through 2023.", "C": "sum of the present value of the dividends for 2020 through 2023 and the present value of dividends beyond year 2023."}, "ans": "A", "en": "A is correct because the estimated value of the stock at the end of the first stage of a basic two-stage DDM (terminal value) is the present value of all dividends beyond the first stage. The first stage is 2020 through 2023, and the second stage begins in 2024, so the terminal value (that is, the value of the stock at the end of 2023) is the present value of future dividends beyond 2023.", "ko": "기본 2단계 DDM에서 1단계 말(2023년 말) 주식가치 = 1단계 이후(2024년~) 모든 배당의 그 시점 현재가치.", "trap": "Terminal value(Vn) = n시점 이후 배당만의 PV (n시점 기준).", "f": "Vn = D(n+1)/(r − gL)", "why": {"B": "2020–2023 배당의 PV는 1단계 가치이지 1단계 '말'의 주식가치가 아닙니다.", "C": "두 부분의 합은 '오늘(0시점)' 주식가치입니다."}, "orig": "Equity · ECO Module 2 Q29", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q36", "src": "ECO 오답", "module": "05-2", "tag": "Sustainable growth → 배당성향", "vig": 30, "stem": "Based on Exhibit 4 and Intern 1’s analysis, Xavier Corporation’s sustainable dividend payout ratio is closest to:", "opts": {"A": "43.4%.", "B": "44.6%.", "C": "56.6%."}, "ans": "C", "en": "C is correct because it is based on the sustainable growth rate and the required rate of return:\nSustainable growth rate = (b in mature phase) × (Return on equity)\n= (1 – Dividend payout) × (Return on equity)\n0.036 = (1 – Dividend payout) × 0.083\nSolving for the dividend payout ratio, the dividend payout = 56.627% ≈ 56.6%.", "ko": "g = b × ROE → 0.036 = (1 − payout) × 0.083 → payout = 1 − 0.036/0.083 = 56.6%.", "trap": "g = b × ROE에서 구한 건 b. 배당성향 = 1 − b.", "f": "g = b × ROE,  payout = 1 − b", "why": {"A": "43.4%는 유보율 b(= 0.036/0.083)입니다. 질문은 배당성향(1 − b).", "B": "44.6%는 계산 오류 값입니다. 정확히는 1 − 0.4337 = 56.6%."}, "orig": "Equity · ECO Module 2 Q36", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q39", "src": "ECO 오답", "module": "05-2", "tag": "모형 선택 – FCFF (비배당·인수대상·레버리지 변화)", "vig": 31, "stem": "Which of the following is the most appropriate model for Miller to use in valuing Aster?", "opts": {"A": "Residual income", "B": "Free cash flow to equity", "C": "Free cash flow to the firm"}, "ans": "C", "en": "(A) Incorrect because Aster is a profitable company and is also an acquisition target; therefore, the free cash flow model is more appropriate. The residual income model, is most suitable when:\nthe company is not paying dividends, as an alternative to a free cash flow model, or\nthe company’s expected free cash flows are negative within the analyst’s comfortable forecast horizon.\nIn addition, the residual income model is less appropriate because Aster reports a number of items through other comprehensive income on the balance sheet, which distorts its reported income statement results. Although Miller may be able to adjust for such items in her model, this in combination with the above means that residual income is not the most appropriate model in this case.\n(B) Incorrect because free cash flow models are most suitable when the company is non-dividend-paying and the investor takes a control perspective. In this circumstance, however, Aster has expectations of a changing level of corporate debt (leverage) and so FCFF is therefore more appropriate to use as a valuation model than FCFE.\n(C) Correct because free cash flow models are most suitable when the company is non-dividend-paying and the investor takes a control perspective. Since Aster is a target for acquisition and has expectations of a changing level of corporate debt (leverage), the FCFF model is the appropriate model to use for valuation purposes.", "ko": "Aster: 무배당 + 인수 대상(지배 관점) → FCF 모형. 부채 수준이 크게 변할 것으로 예상 → FCFE보다 FCFF가 적합(FCFF는 자본구조 변화에 덜 민감, WACC로 할인).", "trap": "레버리지 변화 큼 → FCFF. 안정적 자본구조 → FCFE가 더 직접적.", "f": "", "why": {"A": "RI는 무배당·FCF 음수일 때 유용하지만, Aster는 수익성 있고 인수대상이며 OCI 항목이 많아 순이익이 경제 실질을 왜곡 → RI 부적합.", "B": "레버리지가 크게 변할 때는 FCFE보다 FCFF가 낫습니다."}, "orig": "Equity · ECO Module 2 Q39", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q43", "src": "ECO 오답", "module": "05-2", "tag": "모형 선택 – RI (배당 불규칙 + FCF 음수)", "vig": 32, "stem": "For company A, the most suitable forecast input to a DCF model is:", "opts": {"A": "dividends.", "B": "free cash flow.", "C": "residual income."}, "ans": "C", "en": "(A) Incorrect because the expected dividend payout of Company A has no consistent relationship with earnings, as evidenced by the varying expected dividend payout rates over the forecast years. The earnings of Company A are expected to grow every year during the forecast period, but the dividend is not likely to mimic the growth of earnings. This is probably because the management of Company A wants to conserve cash to fund its capital expenditure requirements. Hence, the expected dividends of Company A is not a good proxy for the value creation expected to happen in Company A during Tian's forecast period.\nIf dividends do not bear an understandable relation to value creation in the company, applying the DDM to value the stock is prone to error. Generally, the definition of returns as dividends, and the DDM, is most suitable when the company is dividend-paying (i.e., the analyst has a dividend record to analyze);\nthe board of directors has established a dividend policy that bears an understandable and consistent relationship to the company’s profitability; and\nthe investor takes a non-control perspective.\n(B) Incorrect because the capital expenditure of Company A is much larger than its operating cash flow so that free cash flow of the Company is negative over a few years in the forecast horizon, especially since the Company is not expected to witness any debt or equity issuances or repayments during this period.\nJust as there are cases in which an analyst would find it impractical to apply the DDM, applying the free cash flow approach is a problem in some cases. Some companies have intense capital demands and, as a result, have negative expected free cash flows far into the future. The present value of a series of negative free cash flows is a negative number: The use of a free cash flow model may entail a long forecast horizon to capture the point at which expected free cash flow turns positive. The uncertainty associated with distant forecasts may be considerable. In such cases, the analyst may have more confidence using another approach, such as residual income valuation.\n(C) Correct because analysts may choose a residual income approach for companies with negative expected free cash flows within their comfortable forecast horizon. In such cases, a residual income valuation often brings the recognition of value closer to the present as compared with a free cash flow valuation, producing higher value estimates. Also, a residual income model can be used for both dividend-paying and non-dividend-paying stocks.\nThe residual income model is a useful addition to an analyst’s toolbox. Because the record of residual income can always be calculated, a residual income model can be used for both dividend-paying and non-dividend-paying stocks. Analysts may choose a residual income approach for companies with negative expected free cash flows within their comfortable forecast horizon. In such cases, a residual income valuation often brings the recognition of value closer to the present as compared with a free cash flow valuation, producing higher value estimates.", "ko": "Company A: 배당성향이 불규칙(30% → 5%)해 이익과 일관된 관계가 없음 → DDM 부적합. 설비투자가 영업현금흐름보다 커 FCF가 음수 → FCF 모형 부적합. → Residual income 모형이 가장 적합.", "trap": "RI 모형 선호 조건: 무배당/불규칙 배당, 예측기간 내 FCF 음수, 회계 투명성.", "f": "", "why": {"A": "배당이 가치창출을 반영하지 못합니다(배당성향이 계속 감소).", "B": "Capex > 영업현금흐름 → FCF 음수(예측기간 중 여러 해)."}, "orig": "Equity · ECO Module 2 Q43", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q44", "src": "ECO 오답", "module": "05-2", "tag": "Gordon growth model – D1 사용", "vig": 32, "stem": "The fair value of Company C's stock for Tian is closest to:", "opts": {"A": "$21.", "B": "$40.", "C": "$42."}, "ans": "C", "en": "(A) Incorrect because the candidate uses V0 = D1/r\nHence incorrect fair value = 2 × (1 + 0.05)/0.1 = $21\nThe correct formula and calculation would have been:\nV0 = D0(1 + g)/(r − g) = D1/(r − g)\nCorrect fair value = 2 × (1 + 0.05)/(0.1 − 0.05) = $42\n(B) Incorrect because the candidate uses V0 = D0/(r − g)\nHence incorrect fair value = 2/(0.1 − 0.05) = $40\nThe correct formula and calculation would have been:\nV0 = D0(1 + g)/(r − g) = D1/(r − g)\nCorrect fair value = 2 × (1 + 0.05)/(0.1 − 0.05) = $42\n(C) Correct because it applies the formula of Gordon growth model.\nV0 = D0(1 + g)/(r − g) = D1/(r − g)\nwhere\nV0 is the fair value of the stock according to the GGM\nD0 is the most recent dividend at time t=0\nD1 is the expected dividend payable at time t=1\nr is the required rate of return on equity\ng is the expected constant growth rate in dividends\nCorrect fair value = 2 × (1 + 0.05)/(0.1 − 0.05) = $42\nThe Gordon growth model, developed by Gordon and Shapiro (1956) and Gordon (1962), assumes that dividends grow indefinitely at a constant rate. This assumption, applied to the general dividend discount model, leads to a simple and elegant valuation formula that has been influential in investment practice.\nTo illustrate the calculation, suppose that an annual dividend of €5 has just been paid (D0 = €5). The expected long-term growth rate is 5% and the required return on equity is 8%. The Gordon growth model value per share is D0(1 + g)/(r − g) = (€5 × 1.05)/(0.08 − 0.05) = €5.25/0.03 = €175. When calculating the model value, be careful to use D1 and not D0 in the numerator.", "ko": "방금 지급한 배당 D0 = $2 → D1 = 2 × 1.05 = 2.10. V0 = 2.10/(0.10 − 0.05) = $42.", "trap": "'just paid' = D0 → 반드시 D1 = D0(1+g).", "f": "V0 = D0(1+g)/(r − g) = D1/(r − g)", "why": {"A": "$21 = D1/r: 분모에서 g를 빼지 않았습니다.", "B": "$40 = D0/(r − g): D0를 D1로 성장시키지 않았습니다."}, "orig": "Equity · ECO Module 2 Q44", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q58", "src": "ECO 오답", "module": "05-2", "tag": "성장 단계 판정 – 명목 GDP 성장률 비교", "vig": 33, "stem": "Barton’s conclusion that XRL is in the transition phase is best described as:", "opts": {"A": "correct.", "B": "incorrect, because the company is in the mature phase.", "C": "incorrect, because the company is in the supernormal growth phase."}, "ans": "B", "en": "(A) Incorrect. A company in the transition phase is characterized by earnings growth rates above the average nominal growth for the economy but with the growth rate declining. The growth rate is not above the economy’s nominal growth rate, so the fact that it is declining (2.7% for Most Recent Year vs. 1 Year Prior) is not relevant.\n(B) Correct. Barton’s statement is incorrect because the company is in the mature phase. The economy’s nominal growth rate, from Exhibit 1, is Real growth rate + Inflation rate = 3.7% + 2% = 5.7%.\nXRL’s compound growth rate over the four-year period is 5.7%, which is approximately equal to the economy’s growth rate and calculated as follows:\ng = (EPS Most Recent Yr / EPS 4 Years Prior)^(1/4) − 1 = (3.15/2.52)^(1/4) − 1 = 5.7%\nwhere g is the compound growth rate in earnings, and EPS is earnings per share.\nA company in the mature phase typically has earnings growth at a rate comparable with the economy’s growth rate.\n(C) Incorrect. A company in the supernormal growth phase has growth higher than the economy’s nominal growth rate.", "ko": "명목 GDP 성장 = 실질 3.7% + 인플레 2% = 5.7%. XRL 4년 EPS 성장 = (3.15/2.52)^(1/4) − 1 = 5.7% ≈ 경제 성장률 → mature phase. Transition phase는 성장률이 경제 성장보다 '높으면서' 하락하는 단계.", "trap": "비교 기준은 '명목' GDP(실질 + 인플레). 4년간 CAGR은 n = 4.", "f": "g = (EPS_end/EPS_begin)^(1/n) − 1", "why": {"A": "성장률이 경제 명목성장률보다 높지 않으므로 transition이 아닙니다. 최근 성장 둔화는 무관.", "C": "Supernormal(초과성장)은 경제 명목성장률보다 훨씬 높은 성장입니다."}, "orig": "Equity · ECO Module 2 Q58", "subject": "Equity"}, {"id": "Equity:ECO-M2-Q59", "src": "ECO 오답", "module": "05-2", "tag": "Gordon growth – 과거 배당성장률 사용, 미스프라이싱 기준", "vig": 33, "stem": "Using the data in Exhibit 1 and following Eckhart’s suggestions regarding the valuation of ZTL, the most appropriate conclusion that Barton should make about the ZT

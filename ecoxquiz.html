l\"><table><caption>Exhibit 1: Selected Data for Orsa Components<\/caption><thead><tr><th>Orsa Components (&euro; millions)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Book value of net assets, 1 Jan 2025<\/td><td>180<\/td><\/tr><tr><td>Plant and equipment: book value / fair value, 1 Jan 2025<\/td><td>95 / 135<\/td><\/tr><tr><td>Remaining useful life of plant and equipment (straight-line, no salvage)<\/td><td>7 years<\/td><\/tr><tr><td>Net income, 2025<\/td><td>30<\/td><\/tr><tr><td>Dividends paid, 2025<\/td><td>12<\/td><\/tr><tr><td>Market value of 100% of Orsa's shares, 31 Dec 2025<\/td><td>262<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Selected Data for Brenna Systems<\/caption><thead><tr><th>Brenna Systems (&euro; millions)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Book value of identifiable net assets, 1 Jan 2025<\/td><td>190<\/td><\/tr><tr><td>Fair value of property, plant and equipment in excess of book value<\/td><td>20<\/td><\/tr><tr><td>Fair value of operating licence (not on Brenna's balance sheet)<\/td><td>40<\/td><\/tr><tr><td>Revenue, 2025<\/td><td>310<\/td><\/tr><tr><td>Net income, 2025<\/td><td>26<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Amara Okafor is a currency strategist at Lindqvist Partners, a Zurich-based fund manager that reports in Swiss francs (CHF). She is reviewing the fund's exposure to Tavaria, an emerging market whose currency is the Tavarian lira (TVL). Exchange rates are quoted as TVL/CHF (the number of TVL per CHF). Current money market rates are shown in Exhibit 1, and today's dealer quotes are shown in Exhibit 2.<\/p>\n<p>Okafor is considering a new 180-day TVL deposit for the fund that would be fully hedged back into CHF with a forward contract. A junior analyst remarks that \"a hedged TVL deposit lets us earn the 9.20% Tavarian rate without currency risk.\"<\/p>\n<p>Ninety days ago, to hedge existing Tavarian bond holdings, the fund entered into a 180-day forward contract to buy CHF 10,000,000 against TVL at a forward rate of 21.4800. Okafor wants to report the contract's current mark-to-market value.<\/p>\n<p>Okafor's colleague, Henrik Sjöberg, proposes a leveraged carry trade: borrowing CHF for 90 days and investing the proceeds in TVL deposits. Sjöberg notes that the TVL has been stable for the past 18 months and that implied volatility in TVL/CHF is near a five-year low.<\/p>\n<p>Okafor is also tracking policy developments. Tavaria maintains capital controls that sharply restrict cross-border portfolio flows. Its newly elected government has announced a large increase in infrastructure spending financed by borrowing, and the Tavarian central bank, under pressure to support growth, has cut its policy rate by 100 basis points. Meanwhile, the Swiss National Bank has left its policy rate unchanged.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Annualized Money Market Rates (actual/360)<\/caption><thead><tr><th>Currency<\/th><th>90-day rate<\/th><th>180-day rate<\/th><\/tr><\/thead><tbody><tr><td>CHF<\/td><td>1.00%<\/td><td>1.10%<\/td><\/tr><tr><td>TVL<\/td><td>9.00%<\/td><td>9.20%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Dealer Quotes Today (forward points are scaled by 10,000)<\/caption><thead><tr><th>Quote<\/th><th>Bid<\/th><th>Ask<\/th><\/tr><\/thead><tbody><tr><td>Spot TVL/CHF<\/td><td>21.1500<\/td><td>21.1600<\/td><\/tr><tr><td>90-day forward points<\/td><td>+4,210<\/td><td>+4,230<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Dagny Solberg is chief investment officer of the Harrowgate Teachers' Pension Fund. She meets with Rafael Quintero, who manages the fund's government bond portfolio, to review positioning. The government spot curve is upward sloping (Exhibit 1). All rates are annual-compounding, and all government bonds are assumed to be default-free.<\/p>\n<p>The fund will receive a &euro;150 million lump-sum contribution from a participating school district in exactly three years. Solberg wants to invest the contribution for two years from the date it is received and asks Quintero for the rate the fund could lock in today for that future investment.<\/p>\n<p>Separately, the fund has &euro;400 million of cash that it must hold in government bonds for exactly two years. Quintero proposes buying five-year zero-coupon government bonds and selling them after two years rather than buying two-year zero-coupon government bonds and holding them to maturity. Solberg comments, \"My base case is that the spot curve two years from now will have the same level and shape as today's curve.\"<\/p>\n<p>Quintero then shares his own interest rate view: he expects the two-year spot rate three years from now to be 4.20%. He explains that the fund could act on this view using forward contracts on two-year zero-coupon government bonds for settlement in three years.<\/p>\n<p>Finally, Solberg reviews the relative value of a five-year bond issued by a AA-rated European utility that the fund holds in a separate credit mandate. She asks Quintero to report the five-year swap spread using the market data in Exhibit 2.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Government Spot Rates<\/caption><thead><tr><th>Maturity (years)<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td>Government spot rate<\/td><td>2.40%<\/td><td>2.90%<\/td><td>3.30%<\/td><td>3.60%<\/td><td>3.85%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Five-Year Market Rates<\/caption><thead><tr><th>Five-year instrument<\/th><th>Rate<\/th><\/tr><\/thead><tbody><tr><td>Yield to maturity of on-the-run five-year government bond (trading at par)<\/td><td>3.80%<\/td><\/tr><tr><td>Five-year fixed-for-floating interest rate swap rate<\/td><td>4.25%<\/td><\/tr><tr><td>Yield to maturity of AA-rated utility bond<\/td><td>4.53%<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Corvane Instruments is a listed, mid-sized manufacturer of laboratory analysers. Its chief executive, Ingrid Hallström, has agreed terms to acquire all of the shares of Pellis Diagnostics, a privately controlled maker of point-of-care test kits. Hallström tells the board, \"Pellis gives us immediate access to the fast-growing point-of-care market, which would take us at least five years to build organically.\"<\/p>\n<p>The acquisition will be financed entirely with new Corvane shares: each Pellis shareholder will receive 0.75 Corvane shares per Pellis share. Corvane's shares trade at &euro;56.00. Before rumours of the deal, Pellis shares last changed hands in a private transaction at &euro;30.00. Corvane will assume Pellis's debt.<\/p>\n<p>Corvane's corporate development analyst, Mateo Ferreira, values Pellis using comparable transaction analysis based on the median EV/EBITDA multiple of recent acquisitions of diagnostics companies, and he also gathers trading multiples of listed diagnostics peers (Exhibit 1). For the first full year after closing, he projects pre-tax cost synergies of &euro;20 million and amortization of acquired intangible assets of &euro;8 million. He assumes that the standalone results of both companies remain at their 2025 levels and that all pre-tax items are taxed at 25%.<\/p>\n<p>Hallström has also proposed two further actions. First, Corvane would sell its headquarters campus to an insurance company and lease it back for 15 years; the insurer can finance the property at a lower cost than Corvane. Second, Corvane would divest its non-core industrial weighing division. The board wants this divestment to raise cash to repay the debt assumed from Pellis and to end Corvane's exposure to the weighing business entirely. Three industrial companies have approached Corvane about buying the division.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Selected Data for Corvane and Pellis<\/caption><thead><tr><th>(&euro; millions, except per share and multiples)<\/th><th>Corvane<\/th><th>Pellis<\/th><\/tr><\/thead><tbody><tr><td>Net income, 2025<\/td><td>180.0<\/td><td>&mdash;<\/td><\/tr><tr><td>Income before tax, 2025<\/td><td>&mdash;<\/td><td>50.0<\/td><\/tr><tr><td>EBITDA, 2025<\/td><td>&mdash;<\/td><td>84.0<\/td><\/tr><tr><td>Total debt / cash, 31 December 2025<\/td><td>&mdash;<\/td><td>120.0 / 30.0<\/td><\/tr><tr><td>Shares outstanding (millions)<\/td><td>60.0<\/td><td>20.0<\/td><\/tr><tr><td>Median EV/EBITDA, recent acquisitions of diagnostics companies<\/td><td>&mdash;<\/td><td>12.0&times;<\/td><\/tr><tr><td>Median EV/EBITDA, listed diagnostics peers (trading)<\/td><td>&mdash;<\/td><td>9.5&times;<\/td><\/tr><\/tbody><\/table><\/div>", "<p>The investment committee of the Calder Valley Firefighters' Pension Plan is reviewing the plan's active equity managers. The plan's consultant, Priya Nandakumar, CFA, has prepared ex ante estimates for three managers, each benchmarked to the same global equity index (Exhibit 1). All three managers have a beta of 1.0 relative to the index. The benchmark has an expected Sharpe ratio of 0.40 and expected volatility of 16%.<\/p>\n<p>Kestrel Partners runs a long-only quantitative strategy. It covers 98 stocks and rebalances twice a year, and Nandakumar judges its forecasts to be independent across stocks and across rebalancing dates. The long-only constraint keeps Kestrel's transfer coefficient at 0.50. Kestrel has offered the plan a separately managed account without the long-only constraint, which Nandakumar estimates would raise the transfer coefficient to 0.85 with no change in Kestrel's information coefficient or active risk.<\/p>\n<p>Rowan Capital has proposed holding 15% of its portfolio in cash as a liquidity buffer. A committee member, Gareth Pryce, comments: \"Holding cash dilutes both Rowan's excess return over the risk-free rate and its return relative to the benchmark, so the cash buffer will lower both Rowan's Sharpe ratio and its information ratio.\"<\/p>\n<p>The committee has set an active risk budget of 3.0% for the equity allocation and wants to hire one manager. Pryce favours Rowan \"because its active risk already matches our 3.0% budget, while Lumen's 6.0% active risk is too high for us.\"<\/p>\n<p>Finally, Nandakumar reports on last year's results for the plan's total portfolio (Exhibit 2). The plan's policy portfolio is 60% equities and 40% bonds.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Ex Ante Estimates for Active Equity Managers (excluding Rowan's cash proposal)<\/caption><thead><tr><th>Ex ante estimate<\/th><th>Kestrel<\/th><th>Lumen<\/th><th>Rowan<\/th><\/tr><\/thead><tbody><tr><td>Information coefficient (IC)<\/td><td>0.05<\/td><td>&mdash;<\/td><td>&mdash;<\/td><\/tr><tr><td>Transfer coefficient (TC), current mandate<\/td><td>0.50<\/td><td>&mdash;<\/td><td>&mdash;<\/td><\/tr><tr><td>Information ratio<\/td><td>&mdash;<\/td><td>0.42<\/td><td>0.35<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>6.0%<\/td><td>3.0%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Calder Valley Pension Plan, Last Year<\/caption><thead><tr><th>Asset class<\/th><th>Actual weight<\/th><th>Policy weight<\/th><th>Portfolio return<\/th><th>Benchmark return<\/th><\/tr><\/thead><tbody><tr><td>Equities<\/td><td>65%<\/td><td>60%<\/td><td>10.2%<\/td><td>9.0%<\/td><\/tr><tr><td>Bonds<\/td><td>35%<\/td><td>40%<\/td><td>2.8%<\/td><td>3.0%<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Annika Ressler is treasurer of Vellmark Industrie AG, a German manufacturer of industrial pumps. She is preparing the quarterly derivatives report with Tomas Brandt, a treasury analyst. All interest rates are annualized; market reference rates (MRR) use a 30/360 add-on convention, and all other rates use annual compounding.<\/p>\n<p><b>Interest rate swap.<\/b> One year ago, Vellmark entered a three-year, &euro;250 million notional interest rate swap with semiannual settlements under which it pays a fixed rate of 2.40% and receives six-month MRR. The swap has just made its second settlement payment. Current MRR spot rates are shown in Exhibit 1. Ressler asks Brandt to report the swap's current value to Vellmark and whether it should be recorded as an asset or a liability.<\/p>\n<p><b>Equity forward.<\/b> Three months ago, Vellmark entered a nine-month forward contract to sell 1.5 million shares of Danholt Systems, a listed supplier in which it holds a non-strategic stake, at a forward price of &euro;50.00 per share. Danholt shares now trade at &euro;46.20. Danholt is expected to pay a dividend of &euro;0.80 per share in four months, before the forward contract expires. The risk-free rate is 3.50% for all maturities.<\/p>\n<p><b>Bond futures.<\/b> Vellmark plans to issue bonds in four months and is considering selling government bond futures that expire in four months as a hedge. Information on the cheapest-to-deliver bond is given in Exhibit 2. The four-month risk-free rate is 2.80%.<\/p>\n<p><b>Dealer quote.<\/b> Finally, Brandt shows Ressler a dealer quote for a three-month forward contract on a zero-coupon government note. The note trades at 97.10, the three-month risk-free rate is 2.80%, and the dealer's forward price is 97.45. Brandt asks whether an arbitrage opportunity exists and which trades would capture it.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Current MRR Spot Rates (30/360, add-on)<\/caption><thead><tr><th>Days to maturity<\/th><th>180<\/th><th>360<\/th><th>540<\/th><th>720<\/th><\/tr><\/thead><tbody><tr><td>MRR spot rate<\/td><td>2.90%<\/td><td>3.10%<\/td><td>3.25%<\/td><td>3.40%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Cheapest-to-Deliver Bond<\/caption><thead><tr><th>Item<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Annual coupon rate (paid annually, 30/360)<\/td><td>5.00%<\/td><\/tr><tr><td>Quoted (clean) price per 100 par<\/td><td>104.20<\/td><\/tr><tr><td>Days since last coupon payment<\/td><td>75<\/td><\/tr><tr><td>Conversion factor<\/td><td>1.0850<\/td><\/tr><tr><td>Coupon payments before futures expiration<\/td><td>None<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Halvern Foods Inc. is a US-based packaged-food company that prepares its financial statements under US GAAP in US dollars. Priya Natarajan, an equity analyst, is reviewing Halvern's Brazilian subsidiary, Halvern Alimentos Ltda., which Halvern formed on 1 January 2024 by contributing BRL300 million of capital.<\/p>\n<p>Alimentos sells canned vegetables to Brazilian supermarket chains. Its selling prices are set in Brazilian reais (BRL) and are driven mainly by competition from local producers and by Brazilian food-pricing regulations. Nearly all of its labor and raw materials are sourced in Brazil and paid in reais, and its long-term debt is a BRL-denominated loan from a Brazilian bank. Alimentos retains its operating cash in reais. Each year it pays a dividend to Halvern, which converts the dividend into dollars, and it occasionally imports packaging machinery from the United States. Brazil is not considered a hyperinflationary economy.<\/p>\n<p>Alimentos reported net income of BRL70 million in 2024 and BRL110 million in 2025. It paid no dividend in 2024 and declared a BRL30 million dividend in 2025. Its condensed balance sheet and relevant exchange rates are shown in Exhibits 1 and 2. The real depreciated steadily against the dollar during 2025. Alimentos uses the FIFO inventory method, and its inventory turns over about every four months.<\/p>\n<p>Natarajan also notes that on 20 November 2025, Halvern's US operations sold goods to a German retailer for &euro;12 million, with payment due in euros on 20 February 2026. The euro weakened against the US dollar between 20 November and 31 December 2025.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Halvern Alimentos Ltda. Balance Sheet, 31 December 2025<\/caption><thead><tr><th>Assets<\/th><th>BRL millions<\/th><th>Liabilities and equity<\/th><th>BRL millions<\/th><\/tr><\/thead><tbody><tr><td>Cash<\/td><td>80<\/td><td>Accounts payable<\/td><td>90<\/td><\/tr><tr><td>Accounts receivable<\/td><td>120<\/td><td>Long-term debt<\/td><td>260<\/td><\/tr><tr><td>Inventory<\/td><td>150<\/td><td>Common stock<\/td><td>300<\/td><\/tr><tr><td>Property, plant, and equipment (net)<\/td><td>450<\/td><td>Retained earnings<\/td><td>150<\/td><\/tr><tr><td><b>Total assets<\/b><\/td><td><b>800<\/b><\/td><td><b>Total liabilities and equity<\/b><\/td><td><b>800<\/b><\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Exchange Rates<\/caption><thead><tr><th>Date or period<\/th><th>USD per BRL<\/th><\/tr><\/thead><tbody><tr><td>1 January 2024 (capital contributed)<\/td><td>0.2000<\/td><\/tr><tr><td>Average 2024<\/td><td>0.1920<\/td><\/tr><tr><td>31 December 2024<\/td><td>0.1880<\/td><\/tr><tr><td>Average 2025<\/td><td>0.1840<\/td><\/tr><tr><td>2025 dividend declaration date<\/td><td>0.1820<\/td><\/tr><tr><td>31 December 2025<\/td><td>0.1800<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Lena Okafor, CFA, is a senior equity analyst at Brightwater Securities, a broker-dealer with research, trading, and investment-banking divisions. She covers medical-device companies, including Torvane Medical, on which she has had a Buy rating for two years. Brightwater's investment-banking division is competing to be lead underwriter of a secondary share offering that Torvane expects to announce in about two months. Under Brightwater's policy, a company is placed on the firm's restricted list only once an offering is formally announced; Torvane is not on the list.<\/p>\n<p>Okafor is preparing an update report on Torvane with Marcus Hale, a research associate and CFA Level II candidate. Hale proposes building the report's revenue model on a five-year global demand forecast for cardiac stents published by Medlytics, an independent consultancy. \"Brightwater has bought Medlytics forecasts for years,\" Hale says, \"so we can drop the numbers straight into the model.\" Brightwater has no formal process for reviewing purchased research, and neither Hale nor Okafor has examined how Medlytics built the forecast.<\/p>\n<p>For the update, Okafor replaces her discounted cash flow model with a valuation based on peer EV/EBITDA multiples, because Torvane's new product cycle makes long-range cash flows hard to estimate. The draft report states the change of method and the reason for it in its first paragraph. The draft's summary also says, \"Torvane's new drug-coated stent will capture 20% of the European market by 2028.\" That figure is Okafor's own projection, but the draft does not identify it as an estimate.<\/p>\n<p>Okafor's revised analysis supports a Hold rating, and she tells colleagues that she plans to downgrade the stock. The next day, Victor Stanhope, head of investment banking, emails her: \"Torvane's CFO has heard about a possible downgrade, and we are close to winning the mandate. Please keep the Buy rating until after the offering. You can always revisit it later.\"<\/p>\n<p>Before the report is issued, Okafor reviews her potential conflicts. She owns 1,200 Torvane shares that she bought four years ago; the purchase was pre-cleared by Brightwater's compliance department under the firm's personal-trading policy. Last month she attended Torvane's annual investor day, where the company provided a buffet lunch to all attending analysts; Okafor paid for her own travel and hotel. Brightwater has disclosed its pursuit of the underwriting mandate to compliance, but the draft report contains no disclosures.<\/p>", "<p>Mirela Dragan is a sovereign credit analyst at Eastbrook Ratings. She is comparing the long-term growth prospects of three economies: Valmora, a high-income economy with a large stock of capital per worker; Tessaly, a fast-growing middle-income economy; and Ondra, a lower-income economy that has invested heavily in infrastructure over the past decade.<\/p>\n<p>Dragan forecasts potential GDP growth for the next ten years using the Solow growth accounting equation. Her trend forecasts of the inputs, together with each economy's historical labor productivity growth, are shown in Exhibit 1. To understand the sources of Ondra's past productivity gains, she also gathers the realized data for 2015–2025 in Exhibit 2.<\/p>\n<p>Valmora's finance ministry has announced tax incentives to raise the national saving rate and to expand private spending on research and education. The ministry's report states: \"Because knowledge created by private R&D spills over to other firms, returns to capital do not diminish for the economy as a whole. A permanently higher saving and investment rate will therefore permanently raise Valmora's growth rate.\"<\/p>\n<p>Dragan's colleague, Piotr Halas, comments on the outlook for the three economies: \"Tessaly's saving rate, population growth, and access to technology are now very similar to Valmora's, so I expect Tessaly's per capita income to converge to Valmora's level over time. Ondra's saving rate is much lower, so even if it grows faster for a while, its per capita income should converge to a lower level.\"<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Trend Forecasts of Growth Inputs, 2026–2035<\/caption><thead><tr><th>Forecast input (annual)<\/th><th>Valmora<\/th><th>Tessaly<\/th><th>Ondra<\/th><\/tr><\/thead><tbody><tr><td>Labor share of national income<\/td><td>0.65<\/td><td>0.55<\/td><td>0.60<\/td><\/tr><tr><td>Growth in total factor productivity<\/td><td>1.0%<\/td><td>1.2%<\/td><td>1.1%<\/td><\/tr><tr><td>Growth in capital stock<\/td><td>2.0%<\/td><td>4.0%<\/td><td>6.0%<\/td><\/tr><tr><td>Growth in labor force<\/td><td>0.2%<\/td><td>0.8%<\/td><td>1.8%<\/td><\/tr><tr><td>Historical labor productivity growth, 2015–2025<\/td><td>1.3%<\/td><td>3.1%<\/td><td>3.6%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Ondra — Realized Growth Data<\/caption><thead><tr><th>Realized annual average, 2015–2025<\/th><th>Ondra<\/th><\/tr><\/thead><tbody><tr><td>Real GDP growth<\/td><td>5.6%<\/td><\/tr><tr><td>Growth in capital stock<\/td><td>7.5%<\/td><\/tr><tr><td>Growth in labor force<\/td><td>2.0%<\/td><\/tr><tr><td>Labor share of national income<\/td><td>0.60<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Hana Okonkwo is a credit analyst at Ridgeline Bond Fund. She is reviewing two issuers whose bonds the fund holds: Corvane Bank, a regional bank, and Brackwater Insurance, a property and casualty (P&amp;C) insurer.<\/p>\n<p>Corvane was founded as a state development bank to finance farming and food processing in its home region, and most of its loans are still made to borrowers in that region. The national government had owned 51% of Corvane since its founding, as part of a long-standing policy of owning strategically important lenders. In 2025, as part of a broad privatization program, the government sold its entire stake to private investors.<\/p>\n<p>Okonkwo's notes on Corvane include the following observations:<\/p>\n<p>Observation 1: Corvane has issued €1.4 billion of standby letters of credit and unfunded loan commitments to commercial property developers. These are not recognized on its balance sheet.<br>\nObservation 2: Corvane's allowance for loan losses fell from 1.6 times to 1.1 times its non-performing loans during 2025.<br>\nObservation 3: Net interest income rose to 85% of Corvane's operating revenue, and trading income fell to 2%.<\/p>\n<p>Corvane's regulator applies the Basel III minimum capital ratios. Under its rules, goodwill and other intangible assets and all deferred tax assets are deducted in computing Common Equity Tier 1 capital. Selected data are shown in Exhibit 1.<\/p>\n<p>For Brackwater, Okonkwo computes underwriting ratios using statutory definitions: the loss and loss adjustment expense ratio is based on net premiums earned, and the underwriting expense ratio is based on net premiums written. Brackwater's data are shown in Exhibit 2.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Corvane Bank — Capital Data<\/caption><thead><tr><th>Item (€ millions), 31 December 2025<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Common stock and additional paid-in capital<\/td><td>380<\/td><\/tr><tr><td>Retained earnings<\/td><td>410<\/td><\/tr><tr><td>Accumulated other comprehensive income<\/td><td>15<\/td><\/tr><tr><td>Goodwill and other intangible assets<\/td><td>95<\/td><\/tr><tr><td>Deferred tax assets<\/td><td>40<\/td><\/tr><tr><td>Non-cumulative perpetual preferred stock (discretionary dividends)<\/td><td>30<\/td><\/tr><tr><td>Subordinated debt issued 2023, original maturity 8 years<\/td><td>290<\/td><\/tr><tr><td>Subordinated debt issued 2024, original maturity 4 years<\/td><td>60<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>12,000<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Brackwater Insurance — Underwriting Data<\/caption><thead><tr><th>€ millions<\/th><th>2024<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Net premiums written<\/td><td>2,560<\/td><td>2,840<\/td><\/tr><tr><td>Net premiums earned<\/td><td>2,480<\/td><td>2,650<\/td><\/tr><tr><td>Losses and loss adjustment expenses<\/td><td>1,560<\/td><td>1,850<\/td><\/tr><tr><td>Underwriting expenses<\/td><td>840<\/td><td>905<\/td><\/tr><\/tbody><\/table><\/div>", "<p>The Lindqvist Family Foundation manages a $1.4 billion portfolio, of which 65% is invested in public equities and the remainder in bonds and cash. The board has approved a 10% allocation to office real estate and has hired consultant Mateus Corrêa, CFA, to compare two ways of implementing it: buying Harbourline Plaza, a multi-tenant office building, directly, or buying shares of Fennick Office REIT, a listed equity REIT that owns 41 office properties.<\/p>\n<p>At the board meeting, the chair summarizes three objectives for the allocation:<\/p>\n<ul><li>Objective 1: The foundation must be able to reduce the allocation within a few days if grant commitments rise unexpectedly.<\/li>\n<li>Objective 2: The main purpose of the allocation is to lower the volatility of the total portfolio, so the board wants real estate returns that move as little as possible with the foundation's existing equity holdings.<\/li>\n<li>Objective 3: The foundation has no staff with property management experience and does not intend to hire any.<\/li><\/ul>\n<p>Corrêa gathers data on Harbourline Plaza (Exhibit 1) and on Fennick (Exhibit 2). Fennick's leases include contractual rent step-ups, so its reported rental revenue exceeds the cash rent it collects. Fennick acquired an office tower on 1 September 2025; its NOI for the 12 months ended 31 December 2025 includes four months of the tower's NOI, which totaled $3.6 million. Corrêa expects Fennick's cash NOI to grow 2.0% over the next 12 months, and recent sales of comparable office properties imply a capitalization rate of 6.25%. He assumes that the market value of Fennick's debt approximates its book value.<\/p>\n<p>Corrêa also compares Fennick with five other listed office REITs. The six REITs use very different amounts of debt, and the analysts covering them publish AFFO estimates based on differing assumptions about maintenance capital expenditures. The board asks him to rank the six REITs using a single price multiple that (1) is based on a standardized, widely reported earnings measure so that the figures are comparable across companies, and (2) relates the share price to an income measure available to shareholders after interest expense, so that the multiple reflects each REIT's leverage.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Direct Property Option<\/caption><thead><tr><th>Item<\/th><th>Harbourline Plaza<\/th><\/tr><\/thead><tbody><tr><td>Asking price<\/td><td>$138 million<\/td><\/tr><tr><td>Expected first-year NOI<\/td><td>$8.1 million<\/td><\/tr><tr><td>Occupancy<\/td><td>91%<\/td><\/tr><tr><td>Weighted average remaining lease term<\/td><td>6.2 years<\/td><\/tr><tr><td>Lease type<\/td><td>Gross leases (owner pays operating expenses)<\/td><\/tr><tr><td>Available mortgage financing<\/td><td>Up to 60% LTV; minimum DSCR 1.40×<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Fennick Office REIT — Selected Financial Data<\/caption><thead><tr><th>Item (fiscal year 2025 / 31 December 2025)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Net income<\/td><td>$142.9 million<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$88.4 million<\/td><\/tr><tr><td>Gain on sale of office properties<\/td><td>$21.5 million<\/td><\/tr><tr><td>Interest expense<\/td><td>$64.3 million<\/td><\/tr><tr><td>Non-cash (straight-line) rent<\/td><td>$9.8 million<\/td><\/tr><tr><td>Recurring maintenance-type capital expenditures and leasing commissions<\/td><td>$34.2 million<\/td><\/tr><tr><td>Net operating income, last 12 months<\/td><td>$236.0 million<\/td><\/tr><tr><td>Cash and equivalents<\/td><td>$42.5 million<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$31.0 million<\/td><\/tr><tr><td>Land held for future development<\/td><td>$58.0 million<\/td><\/tr><tr><td>Prepaid expenses<\/td><td>$12.5 million<\/td><\/tr><tr><td>Goodwill<\/td><td>$40.0 million<\/td><\/tr><tr><td>Deferred financing costs<\/td><td>$4.0 million<\/td><\/tr><tr><td>Total debt<\/td><td>$1,620.0 million<\/td><\/tr><tr><td>Other liabilities<\/td><td>$95.0 million<\/td><\/tr><tr><td>Shares outstanding<\/td><td>48.0 million<\/td><\/tr><tr><td>Share price<\/td><td>$41.80<\/td><\/tr><tr><td>Dividends per share<\/td><td>$2.90<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Hanna Okonkwo-Reyes is head of the equity and rates options desk at Brightwater Securities. She reviews four client requests with trainee Lukas Vieira.<\/p>\n<p><b>Request 1: American-style put<\/b><\/p>\n<p>A pension fund client holding shares of Torvane Industries, a non-dividend-paying stock, asks for a quote on a two-year American-style put option with an exercise price of $78.00. Okonkwo-Reyes uses the two-period binomial model with the inputs in Exhibit 1. Vieira suggests that because the stock pays no dividends, early exercise can be ignored, as it would be for a call.<\/p>\n<p><b>Request 2: Forward-starting swap<\/b><\/p>\n<p>The treasurer of Velden Logistics plans to borrow on a floating-rate basis for three years beginning one year from today and expects interest rates to rise before then. She is considering a one-year forward-starting, three-year swap in which Velden pays fixed. The current forward swap rate for that swap is 3.20%. Rather than enter the swap now, the treasurer asks whether Velden could create the same exposure with swaptions that expire in one year on the three-year swap, each with an exercise rate of 3.20%.<\/p>\n<p><b>Request 3: Delta-hedged straddle<\/b><\/p>\n<p>The desk holds a long position in at-the-money calls and puts on the Kestrel 100 Index, with the same exercise price and three weeks to expiration, and keeps the position delta-neutral by trading index futures. For the next week, the desk economist forecasts the following:<\/p>\n<ul><li>The index will trade in a very narrow range, so realized volatility will be far below the options' implied volatility.<\/li>\n<li>Implied volatility on Kestrel 100 options will remain unchanged or rise slightly.<\/li>\n<li>The central bank will cut its policy rate by 25 basis points.<\/li><\/ul>\n<p><b>Request 4: BSM components<\/b><\/p>\n<p>A hedge fund client asks how to interpret the Black–Scholes–Merton (BSM) output for a six-month European call option on Arlo Systems shares, shown in Exhibit 2. Vieira prepares three statements for the client.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Binomial Model Inputs for the Torvane Put<\/caption><thead><tr><th>Input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Current price of Torvane shares<\/td><td>$75.00<\/td><\/tr><tr><td>Up factor per period (u)<\/td><td>1.14<\/td><\/tr><tr><td>Down factor per period (d)<\/td><td>0.89<\/td><\/tr><tr><td>Risk-free rate per period<\/td><td>3.0%<\/td><\/tr><tr><td>Number of periods (one year each)<\/td><td>2<\/td><\/tr><tr><td>Exercise price<\/td><td>$78.00<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: BSM Output for the Arlo Systems Call<\/caption><thead><tr><th>BSM input / output<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Share price<\/td><td>$46.00<\/td><\/tr><tr><td>Exercise price<\/td><td>$45.00<\/td><\/tr><tr><td>Time to expiration<\/td><td>0.5 years<\/td><\/tr><tr><td>Continuously compounded risk-free rate<\/td><td>3.0%<\/td><\/tr><tr><td>Volatility<\/td><td>28%<\/td><\/tr><tr><td>N(d<sub>1<\/sub>)<\/td><td>0.6125<\/td><\/tr><tr><td>N(d<sub>2<\/sub>)<\/td><td>0.5350<\/td><\/tr><tr><td>PV of exercise price × N(d<sub>2<\/sub>)<\/td><td>$23.72<\/td><\/tr><tr><td>Call value<\/td><td>$4.46<\/td><\/tr><\/tbody><\/table><\/div>", "<p>The credit committee of Thornbury Asset Management is reviewing a possible purchase of a bond issued by Calloway Rail Corporation, a freight railroad rated BBB. The bond is a senior unsecured, option-free, three-year bond with a 5.0% annual coupon that was issued two years ago and currently trades at 102.60 per 100 of par value. Calloway's rating outlook is stable, and the bond's modified duration is 2.73.<\/p>\n<p>Credit analyst Ines Moretti prepares the valuation inputs in Exhibit 1. Thornbury's policy is to value credit-risky bonds using market-implied (risk-neutral) default probabilities, with a constant hazard rate, a recovery rate based on the bond's seniority, and the government benchmark curve for discounting. Moretti computes the credit valuation adjustment (CVA) per 100 of par value, defining the exposure at each date as the value at that date of all remaining payments, including the coupon due on that date. She then calculates the bond's fair value and the credit spread implied by that fair value.<\/p>\n<p>Committee member Daniel Achebe asks how the hazard rate was derived. Moretti explains that it was implied from Calloway's credit default swap spreads using a reduced-form approach, and adds that a structural model could be used as a cross-check. Achebe is skeptical of the structural approach because Calloway has substantial operating lease commitments and pension obligations.<\/p>\n<p>Finally, the committee discusses how Calloway's spread could change. Three members make the following comments:<\/p>\n<ul><li>Comment 1: \"If the economy moves toward recession, Calloway's credit spread should widen because default probabilities would rise and expected recovery rates would fall.\"<\/li>\n<li>Comment 2: \"If uncertainty about future inflation increases, Calloway's credit spread over the government benchmark should widen.\"<\/li>\n<li>Comment 3: \"If we raised our recovery rate assumption from 35% to 45% and left the hazard rate unchanged, the bond's fair value would fall and its credit spread would widen.\"<\/li><\/ul><div class=\"tbl\"><table><caption>Exhibit 1: Calloway Rail Corporation Bond — Credit Valuation Inputs<\/caption><thead><tr><th>Input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Government benchmark yield curve<\/td><td>Flat at 3.0% (annual compounding)<\/td><\/tr><tr><td>Risk-neutral hazard rate (from CDS spreads), per year<\/td><td>1.8%<\/td><\/tr><tr><td>Historical average annual default rate, BBB issuers<\/td><td>0.8%<\/td><\/tr><tr><td>Recovery rate, senior unsecured<\/td><td>35%<\/td><\/tr><tr><td>Recovery rate, subordinated<\/td><td>20%<\/td><\/tr><tr><td>Coupon / remaining maturity<\/td><td>5.0% annual / 3 years<\/td><\/tr><tr><td>Market price<\/td><td>102.60<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Halvorsen Quantitative Partners is building a systematic global equity strategy, the Halvorsen Multifactor Strategy (HMS), which will be benchmarked against a broad developed-market equity index. The research team is led by Ingrid Halvorsen, CFA. Before presenting the strategy to the firm's investment committee, she asks two analysts, Rahul Mendes and Chiara Lotti, to estimate the strategy's expected return, analyze its active risk, and backtest it.<\/p>\n<p>Mendes uses a four-factor model (market, size, value, and momentum). The size factor is defined as small-cap minus large-cap returns, so the HMS portfolio's negative size sensitivity reflects its large-cap tilt. The annual risk-free rate is 3.0%. Factor sensitivities and risk premiums are shown in Exhibit 1. Mendes notes that the value factor has had a poor year and suggests that \"the last twelve months tell us more about the coming year than any long-run premium.\"<\/p>\n<p>Lotti runs a rolling-window backtest using monthly data from January 2014 to December 2025. To save time, she builds the stock universe from the current constituents of the benchmark index. Each stock's earnings yield is computed from quarterly accounting data dated at the fiscal quarter-end, and portfolios are rebalanced on that same date. Lotti also tests 36 combinations of factor weights and look-back windows, and she keeps the combination with the highest t-statistic of mean active return (2.4). Summary results for that combination are given in Exhibit 2.<\/p>\n<p>In reviewing the results, Halvorsen makes three comments:<\/p>\n<p>Comment 1: \"Building the universe from current index members creates look-ahead bias; adding a three-month reporting lag to the accounting data will remove it.\"<\/p>\n<p>Comment 2: \"Choosing the best of 36 specifications risks a false positive. We should require a t-statistic of at least 3.0 and test the chosen combination on data that was not used to select it.\"<\/p>\n<p>Comment 3: \"Because the earnings data are used on the fiscal quarter-end date, the backtest suffers from survivorship bias, which we can fix by adding delisted stocks.\"<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Four-Factor Model Inputs for the HMS Portfolio<\/caption><thead><tr><th>Factor<\/th><th>HMS sensitivity<\/th><th>Benchmark sensitivity<\/th><th>Expected annual risk premium<\/th><th>Realized factor return, last 12 months<\/th><\/tr><\/thead><tbody><tr><td>Market<\/td><td>0.95<\/td><td>1.00<\/td><td>5.0%<\/td><td>2.0%<\/td><\/tr><tr><td>Size (small − large)<\/td><td>−0.15<\/td><td>0.00<\/td><td>2.0%<\/td><td>−1.0%<\/td><\/tr><tr><td>Value<\/td><td>0.30<\/td><td>0.05<\/td><td>3.0%<\/td><td>−2.5%<\/td><\/tr><tr><td>Momentum<\/td><td>0.20<\/td><td>0.00<\/td><td>4.0%<\/td><td>6.0%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: HMS Backtest Summary<\/caption><thead><tr><th>Statistic (backtest, Jan 2014–Dec 2025)<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Mean monthly return<\/td><td>0.90%<\/td><\/tr><tr><td>Standard deviation of monthly returns<\/td><td>3.20%<\/td><\/tr><tr><td>Mean monthly risk-free rate<\/td><td>0.25%<\/td><\/tr><tr><td>Annualized mean active return<\/td><td>2.40%<\/td><\/tr><tr><td>Information ratio (annualized)<\/td><td>0.60<\/td><\/tr><tr><td>Active specific risk (annualized standard deviation)<\/td><td>2.20%<\/td><\/tr><tr><td>Share of active factor risk: market / size / value / momentum<\/td><td>12% / 18% / 44% / 26%<\/td><\/tr><tr><td>Skewness of monthly returns<\/td><td>−0.85<\/td><\/tr><tr><td>Excess kurtosis of monthly returns<\/td><td>3.10<\/td><\/tr><tr><td>Wealth index (Jan 2014 = 100): peak, Jun 2018<\/td><td>168.0<\/td><\/tr><tr><td>Wealth index: lowest value after Jun 2018 peak, Mar 2020<\/td><td>126.0<\/td><\/tr><tr><td>Wealth index: peak, Nov 2021<\/td><td>190.0<\/td><\/tr><tr><td>Wealth index: lowest value after Nov 2021 peak, Oct 2022<\/td><td>171.0<\/td><\/tr><tr><td>Wealth index: Dec 2025<\/td><td>205.0<\/td><\/tr><\/tbody><\/table><\/div>", "<p>Corvane Asset Management is a mid-sized investment adviser that manages separate accounts for institutions and wealthy families. Nikolai Brandt, CFA, has managed Corvane's small-cap equity strategy for six years. Brandt reports to Sofia Marchetti, CFA, Corvane's head of equities, who supervises the firm's eight portfolio managers and analysts.<\/p>\n<p>In early March, Brandt accepts an offer to join Tessaro Capital, a competitor, and gives Corvane the four weeks' notice required by his employment contract. During the notice period, Brandt continues to manage his portfolios. In the evenings, he signs a lease for a home office and registers with Tessaro's regulator, which he must do before starting his new job. He also uses his personal mobile phone to call three of his largest clients. He tells them he is moving to Tessaro and that \"the strategy will come with me, so it would be easy to move your accounts over once I start.\" On his last week at Corvane, he copies the spreadsheet containing the stock-screening model he built while at Corvane onto a personal USB drive. Corvane's employment contract states that all work product created by employees belongs to the firm.<\/p>\n<p>Two weeks before Brandt's departure date, one of these clients calls Marchetti to ask whether Corvane would charge a fee for transferring the account. That is how Marchetti learns of Brandt's calls. Corvane's compliance manual is reviewed every year and covers personal trading, gifts, and trade allocation, but it contains no procedures for employees who resign, such as restricting system access or reviewing their client contacts.<\/p>\n<p>Brandt's portfolios will be taken over by Daniel Osei, CFA, a senior analyst. Osei has been studying Verdana Foods, a small-cap holding. He combines shipment data purchased from a commercial data vendor, his own counts of Verdana products on the shelves of 40 grocery stores, and the public financial statements of Verdana's largest packaging supplier. During a routine call, Verdana's investor relations officer tells him that \"the new plant is running on schedule,\" a comment that adds little to what the company said publicly at its last results. From all of this, Osei concludes that Verdana's quarterly earnings will be well above consensus, and he buys Verdana shares for the small-cap accounts.<\/p>\n<p>Ana Ruiz, a research associate on Osei's team, took the CFA Level II exam the previous weekend. On her public social media profile, she posts: \"So glad I spent extra hours on swap valuation; it paid off on exam day! Still think the testing window is too short, though.\"<\/p>"], "modules": {"01-7": "Quant · Reading 4 · M7 – Big Data Projects", "02-2": "Econ · Reading 6 – Economic Growth", "03-1": "CI · Reading 13 – Analysis of Dividends and Share Repurchases", "03-2": "CI · Reading 14 – Environmental, Social, and Governance (ESG) Considerations in Investment Analysis", "03-4": "CI · Reading 16 – Corporate Restructuring (일부)", "04-1": "FSA · Module 1 – Intercorporate Investments", "04-2": "FSA · Module 2 – Employee Compensation (일부)", "04-3": "FSA · Module 3 – Multinational Operations", "04-6": "FSA · Module 6 – Integration of FSA Techniques", "05-2": "Equity · Reading 18 – Discounted Dividend Valuation", "05-3": "Equity · Reading 19 – Free Cash Flow Valuation", "05-6": "Equity · Reading 22 – Private Company Valuation", "06-1": "FI · Module 1 – Term Structure & Interest Rate Dynamics", "06-5": "FI · Module 5 – Credit Default Swaps", "07-2": "Deriv · Reading 29 – Valuation of Contingent Claims", "08-2": "AI · Reading 31 – Overview of Types of Real Estate Investment", "08-4": "AI · Reading 33 – Hedge Fund Strategies", "09-1": "PM · Reading 34 – Economics and Investment Markets (일부)", "09-2": "PM · Reading 35 – Analysis of Active Portfolio Management (일부)", "09-3": "PM · Reading 36 – Exchange-Traded Funds: Mechanics and Applications (일부)", "09-4": "PM · Reading 37 – Using Multifactor Models", "09-5": "PM · Reading 38 – Measuring and Managing Market Risk", "10-EQ": "Mock1 · Equity Valuation", "10-FSA": "Mock1 · Financial Statement Analysis", "10-FI": "Mock1 · Fixed Income", "10-PM": "Mock1 · Portfolio Management", "10-CI": "Mock1 · Corporate Issuers", "10-QM": "Mock1 · Quantitative Methods", "10-AI": "Mock1 · Alternative Investments", "10-ETH": "Mock1 · Ethical and Professional Standards", "10-ECO": "Mock1 · Economics", "10-DER": "Mock1 · Derivatives", "11-DER": "Mock2 · Derivatives", "11-EQ": "Mock2 · Equity Valuation", "11-AI": "Mock2 · Alternative Investments", "11-FSA": "Mock2 · Financial Statement Analysis", "11-ETH": "Mock2 · Ethical and Professional Standards", "11-ECO": "Mock2 · Economics", "11-FI": "Mock2 · Fixed Income", "12-ETH": "cMock1 · Ethical and Professional Standards", "12-FSA": "cMock1 · Financial Statement Analysis", "12-ECO": "cMock1 · Economics", "12-FI": "cMock1 · Fixed Income", "12-CI": "cMock1 · Corporate Issuers", "12-PM": "cMock1 · Portfolio Management", "12-DER": "cMock1 · Derivatives", "12-AI": "cMock1 · Alternative Investments"}, "images": {}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules, IMG = DATA.images || {};
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "FirstWrong", KEY = "FirstWrong_quiz_state_v1", EXPKEY = "FirstWrong_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], im=/^\[IMAGE: (.+)\]$/.exec(l.trim());
    if(im){ flush(); if(IMG[im[1]]) html+='<p><img class="exh" src="'+IMG[im[1]]+'" alt="'+esc(im[1])+'"></p>'; continue; }
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]||m; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var subs=[], cnt={}, mcnt={};
  Q.forEach(function(q){ if(subs.indexOf(q.subject)<0) subs.push(q.subject); cnt[q.subject]=(cnt[q.subject]||0)+1; mcnt[q.module]=(mcnt[q.module]||0)+1; });
  var opts='<option value="all">전체 ('+Q.length+')</option>'+subs.map(function(s){
    return '<option value="s:'+s+'">'+esc(s)+' 전체 ('+cnt[s]+')</option>'+Object.keys(MN).filter(function(m){ return Q.some(function(q){return q.module===m&&q.subject===s;}); }).map(function(m){
      return '<option value="m:'+m+'">&nbsp;&nbsp;'+esc(mname(m))+' ('+(mcnt[m]||0)+')</option>'; }).join("");
  }).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">ECO 첫 풀이 오답 + 모의고사 오답</h2>'+
   '<p class="muted">과목별 ECO 오답 퀴즈를 처음 풀 때 틀린 문제(결과 기록으로 확인한 것만, "(일부)"는 처음 풀이를 끝까지 내보내지 않아 앞부분 오답만)와 모의고사 Mock1·Mock2·cMock1에서 틀린 문제를 모았습니다(전체 '+Q.length+'문제). 문제·해설은 각 원래 퀴즈와 같습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스(안 푼 문제 넘기기) · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">풀기</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function pick(){
    var v=$("selMod").value;
    return Q.filter(function(q){ return v==="all" || (v.indexOf("s:")===0 && q.subject===v.slice(2)) || (v.indexOf("m:")===0 && q.module===v.slice(2)); });
  }
  function labels(){ $("bStart").textContent="풀기 ("+pick().length+")"; }
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){
    var order=pick().map(function(q){return q.id;});
    if(!order.length){ alert("이 범위에는 문제가 없습니다."); return; }
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+(q.html?VIG[q.vig]:rich(VIG[q.vig]))+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+(q.html?q.opts[L]:esc(q.opts[L]))+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+(q.html?q.stem:rich(q.stem))+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = q.en ? '<details class="en"'+(r.correct?'':' open')+'><summary>'+esc(q.enLabel||'English explanation (원문 해설)')+'</summary><div class="enbody">'+rich(q.en)+'</div></details>' : '';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4>'+rich(q.ko)+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4>'+rich(q.ko)+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- history export ---------- */
// 이 브라우저에 쌓인 문제별 풀이 기록(첫 풀이 포함)과 지금까지 내보낸 결과를 한 파일로 내려받는다.
function exportHistory(){
  var exps=store.get(EXPKEY)||{};
  if((!S||!S.all||!Object.keys(S.all).length) && !Object.keys(exps).length){ alert("이 브라우저에는 풀이 기록이 없습니다."); return; }
  var file={subject:SUBJECT, kind:"history", exportedAt:new Date().toISOString(), device:navigator.userAgent,
    all:(S&&S.all)||{}, exports:exps,
    state:S?{order:S.order, mode:S.mode, round:S.round, started:S.started, updatedAt:S.updatedAt||""}:null};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_history_"+today()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
$("bHistory").onclick=exportHistory;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>

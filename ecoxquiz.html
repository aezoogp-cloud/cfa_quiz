ill use the same benchmark as in Exhibit 1. Frazee estimates Fund W’s information ratio to be 0.35. He is considering adding the following constraint to his portfolio construction model: Fund W would now have maximum over- and underweight constraints of 7% on single-country positions.\nFrazee conducts a search to hire a manager for the global equity portion of Fund W and identifies three candidates. He asks the candidates to prepare risk and return forecasts relative to Fund W’s benchmark based on their investment strategy, with the only constraint being no short selling. Each candidate develops independent annual forecasts with active return projections that are uncorrelated and constructs a portfolio made up of stocks that are diverse both geographically and across economic sectors. Selected data for the three candidates’ portfolios are presented in Exhibit 2.\nExhibit 2\nForecasted Portfolio Data for Equity Portion of Fund W\n\tCandidate A\tCandidate B\tCandidate C\nRebalancing\tAnnually\tAnnually\tAnnually\nNumber of securities\t100\t64\t36\nInformation ratio (IR)\t0.582\t0.746\t0.723\nTransfer coefficient (TC)\t0.832\t0.777\t0.548\nInformation coefficient*\t0.07\t0.12\t0.22\n* Information coefficient based on previously managed funds.\nFrazee asks Candidate C to re-evaluate portfolio data given the following changes:\nChange 1: Fix the number of securities to 50.\nChange 2: Rebalance on a semi-annual basis.\nChange 3: Add maximum over- or underweight constraints on sector weightings.", "Howie Rutledge is a senior portfolio strategist for an endowment fund. Rutledge meets with recently hired junior analyst Larry Stosur to review the fund’s holdings.\nRutledge asks Stosur about the mechanics of exchange-traded funds (ETFs). Stosur responds by making the following statements:\nStatement 1:Unlike mutual fund shares that can be shorted, ETF shares cannot be shorted.\nStatement 2:In the ETF creation/redemption process, the authorized participants (APs) absorb the costs of transacting securities for the ETF’s portfolio.\nStatement 3:If ETF shares are trading at a discount to NAV and arbitrage costs are sufficiently low, APs will buy the securities in the creation basket and exchange them for ETF shares from the ETF sponsor.\nRutledge notes that one holding, ETF 1, is trading at a premium to its intraday NAV. He reviews the ETF’s pricing and notes that the premium to the intraday NAV is greater than the expected arbitrage costs.\nStosur is evaluating three ETFs for potential investment. He notes that the ETFs have different portfolio characteristics that are likely to affect each ETF’s tracking error. A summary of the characteristics for the ETFs is presented in Exhibit 1.\nExhibit 1\nETF Characteristics Affecting Tracking Error\n\tETF 2\tETF 3\tETF 4\nPortfolio Construction Approach\tFull Replication\tRepresentative Sampling\tFull Replication\nType of Foreign Holdings\tLocal shares\tADRs*\tADRs*\nEngagement in Securities Lending\tYes\tYes\tNo\n*ADRs are American Depositary Receipts.\nRutledge and Stosur discuss the factors that influence ETF bid–ask spreads. Stosur tells Rutledge that quoted bid–ask spreads for a particular transaction size are (1) negatively related to the amount of the ongoing order flow in the ETF, (2) positively related to the costs and risks for the ETF liquidity provider, and (3) positively related to the amount of competition among market makers for the ETF.\nAs ETF shares may trade at prices that are different from the NAV, Rutledge examines selected data in Exhibit 2 for three ETFs that might have this problem.\nExhibit 2\nSelected Data on ETFs\n\tETF 5\tETF 6\tETF 7\nPercentage of Foreign Holdings\t10%\t50%\t90%\nTrading Frequency\tHigh\tLow\tLow\nRutledge considers a new ETF investment for the fund. He plans to own the ETF for nine months. The ETF has the following trading costs and management fees:\n• Annual management fee of 0.32%\n• Round-trip trading commissions of 0.20%\n• Bid–offer spread of 0.10% on purchase and sale\nRutledge asks Stosur to compute the expected total holding period cost for investing in the ETF.", "Carlos Altuve is a manager-of-managers at an investment company that uses quantitative models extensively. Altuve seeks to construct a multi-manager portfolio using some of the funds managed by portfolio managers within the firm. Maya Zapata is assisting him.\nAltuve uses arbitrage pricing theory (APT) as a basis for evaluating strategies and managing risks. From his earlier analysis, Zapata knows that Funds A and B in Exhibit 1 are well diversified. He has not previously worked with Fund C and is puzzled by the data because it is inconsistent with APT. He asks Zapata gather additional information on Fund C’s holdings and to determine if an arbitrage opportunity exists among these three investment alternatives. Her analysis, using the data in Exhibit 1, confirms that an arbitrage opportunity does exist.\nExhibit 1\nExpected Returns and Factor Sensitivities (One-Factor Model)\nFund\tExpected Return\tFactor Sensitivity\nA\t0.02\t0.5\nB\t0.04\t1.5\nC\t0.03\t0.9\nUsing a two-factor model, Zapata now estimates the three funds’ sensitivity to inflation and GDP growth. That information is presented in Exhibit 2. Zapata assumes a zero value for the error terms when working with the selected two-factor model.\nExhibit 2\nExpected Returns and Factor Sensitivities (Two-Factor Model)\nFund\tExpected Return\tSensitivity: Inflation\tSensitivity: GDP Growth\nA\t0.02\t0.5\t1.0\nB\t0.04\t1.6\t0.0\nC\t0.03\t1.0\t1.1\nAltuve asks Zapata to calculate the return for Portfolio AC, composed of a 60% allocation to Fund A and 40% allocation to Fund C, using the surprises in inflation and GDP growth in Exhibit 3.\nExhibit 3\nSelected Data on Factors\nFactor\tResearch Staff Forecast\tActual Value\nInflation\t2.0%\t2.2%\nGDP Growth\t1.5%\t1.0%\nFinally, Altuve asks Zapata about the return sensitivities of Portfolios A, B, and C given the information provided in Exhibit 3.", "Francesca Martinez is a portfolio manager. She decides to review several fund managers who use macroeconomic multifactor models.\nFrom her earlier analysis, she knows the funds in Exhibit 1 are well diversified. She determines the arbitrage opportunity that exists among the three funds.\nExhibit 1\nFund\tExpected Return (%)\tFactor Sensitivity\nA\t4.0\t1.5\nB\t8.0\t4.5\nC\t6.0\t2.7\nMartinez next estimates Fund D's sensitivity to time horizon risk and inflation risk. She wants to further understand the drivers of Fund D's risk relative to its benchmark. For this analysis, she calculates the active risk for each factor and assumes that the correlation between the model's factors is negligible. She also assumes a zero value for the error term when working with the selected two-factor model, given in Exhibit 2. The expected return for Fund D is 6.0% and it has a tracking error of 8.0%.\nExhibit 2\nRisk Factor\tActual Value (%)\tExpected Value (%)\tFund D's Factor Sensitivity\tActive Factor Risk (% Squared)\nTime horizon risk\t2.6\t2.0\t1.6\t24\nInflation risk\t1.5\t0.8\t–0.4\t16\nMartinez considers whether Fund D would be a suitable investment for Lakemont University's endowment. The endowment has an investment horizon of 30 years. The activities it supports have historically been subject to cost increases running above the average rate of inflation.", "Halimah Yusuf is a portfolio manager at VSL Asset Management (VSLAM), based in Singapore. VSLAM provides customized portfolio management and investment consulting services to institutional clients. Yusuf is meeting with new analysts, John Cerra, Eunice Quek, and Inderjit Singh, to review the firm’s portfolio management models and techniques.\nYusuf welcomes everyone to the meeting and begins by stating, “We use multifactor models for portfolio construction as well as return and risk attribution.” She asks, “Can anyone tell me how arbitrage pricing theory (APT) is related to these multifactor models?”\nQuek responds, “APT helps us determine the appropriate number of factors to use in a multifactor model; however, it does not specify the identity of those factors.”\nYusuf continues, “Multifactor models fall into one of three categories: macroeconomic factor models, fundamental factor models, and statistical factor models. For macroeconomic factor models, the factors are the value, or level, of selected macroeconomic variables. For fundamental factor models, the factors are company share attributes, such as price-to-earnings ratio and market capitalization. Finally, when using statistical factor models, we apply statistical techniques, such as factor analysis or principal component analysis, to derive factors that are portfolios of securities that best explain historical return covariances and variances.”\nTo explain the use of multifactor models for portfolio return attribution, Yusuf presents the group with portfolio and benchmark information in Exhibit 1. She also notes the risk-free rate of return is 1.3%.\nExhibit 1 Multifactor Model Data\nFactor\tPortfolio Sensitivity\tBenchmark Sensitivity\tFactor Return\nMarket\t1.05\t1\t3.5%\nSmall-Cap\t0.5\t0.3\t4.7%\nValue\t–0.6\t0.2\t–4.5%\nMomentum\t0.5\t0.1\t5.1%\nYusuf asks the group to use Exhibit 1 to characterize the portfolio manager’s investment style. Cerra responds, “This manager has a large-cap orientation and follows a contrarian strategy with a growth bias.”\nYusuf continues, “Based on your review of the information in Exhibit 1 and given that the portfolio manager’s active return from security selection is 1.5%, I would like each of you to identify the factor that contributes the most to the manager’s active return.” The analysts respond as follows:\nCerra says, “My calculations suggest that it is the Value factor.”\nQuek responds, “I disagree. In my view, it is the Momentum factor.”\nSingh states, “No, my analysis indicates that it is the Market factor.”\nFinally, Yusuf provides the group with the information in Exhibit 2 and states, “As I previously stated, multifactor models can also be used to identify a portfolio manager’s risk exposures. Please use the information in Exhibit 2 to identify the portfolio with the highest active factor risk related to style factors, relative to active risk.”\nExhibit 2 Active Risk Squared Analysis for Selected Portfolios (Entries Are in Percentage Squared)\nPortfolio\tActive Factor: Industry\tActive Factor: Style\tActive Factor: Total\tActive Specific\tActive Risk Squared\nX\t12\t28\t40\t24\t64\nY\t7.2\t14.4\t21.6\t14.4\t36\nZ\t4\t10\t14\t2\t16", "Randy Gorver, chief risk officer at Eastern Regional Bank, and John Abell, assistant risk officer, are currently conducting a risk assessment of several of the bank’s independent investment functions. These reviews include the bank’s fixed-income investment portfolio and an equity fund managed by the bank’s trust department. Gorver and Abell are also assessing Eastern Regional’s overall risk exposure.\nEastern Regional Bank Fixed-Income Investment Portfolio\nThe bank’s proprietary fixed-income portfolio is structured as a barbell portfolio: About half of the portfolio is invested in zero-coupon Treasuries with maturities in the 3- to 5-year range (Portfolio P1), and the remainder is invested in zero-coupon Treasuries with maturities in the 10- to 15-year range (Portfolio P2). Georges Montes, the portfolio manager, has discretion to allocate between 40% and 60% of the assets to each maturity “bucket.” He must remain fully invested at all times. Exhibit 1 shows details of this portfolio.\nExhibit 1\nUS Treasury Barbell Portfolio\n\tP1 (3–5 Years)\tP2 (10–15 Years)\nAverage duration\t3.30\t11.07\nAverage yield to maturity\t1.45%\t2.23%\nMarket value\t$50.3 million\t$58.7 million\nTrust Department’s Equity Fund\na Use of Options: The trust department of Eastern Regional Bank manages an equity fund called the Index Plus Fund, with $325 million in assets. This fund’s objective is to track the S&P 500 Index price return while producing an income return 1.5 times that of the S&P 500. The bank’s chief investment officer (CIO) uses put and call options on S&P 500 stock index futures to adjust the risk exposure of certain client accounts that have an investment in this fund. The portfolio of a 60-year-old widow with a below-average risk tolerance has an investment in this fund, and the CIO has asked his assistant, Janet Ferrell, to propose an options strategy to bring the portfolio’s delta to 0.90.\nb Value at Risk: The Index Plus Fund has a value at risk (VaR) of $6.5 million at 5% for one day. Gorver asks Abell to write a brief summary of the portfolio VaR for the report he is preparing on the fund’s risk position.\nCombined Bank Risk Exposures\nThe bank has adopted a new risk policy, which requires forward-looking risk assessments in addition to the measures that look at historical risk characteristics. Management has also become very focused on tail risk since the subprime crisis and is evaluating the bank’s capital allocation to certain higher-risk lines of business. Gorver must determine what additional risk metrics to include in his risk reporting to address the new policy. He asks Abell to draft a section of the risk report that will address the risk measures’ adequacy for capital allocation decisions.", "Tina Ming is a senior portfolio manager at Flusk Pension Fund (Flusk). Flusk’s portfolio is composed of fixed-income instruments structured to match Flusk’s liabilities. Ming works with Shrikant McKee, Flusk’s risk analyst.\nMing and McKee discuss the latest risk report. McKee calculated value at risk (VaR) for the entire portfolio using the historical method and assuming a lookback period of five years and 250 trading days per year. McKee presents VaR measures in Exhibit 1.\nExhibit 1\nFlusk Portfolio VaR (in $ millions)\nConfidence Interval\tDaily VaR\tMonthly VaR\n95%\t1.10\t5.37\nAfter reading McKee’s report, Ming asks why the number of daily VaR breaches over the last year is zero even though the portfolio has accumulated a substantial loss.\nNext, Ming requests that McKee perform the following two risk analyses on Flusk’s portfolio:\nAnalysis 1:Use scenario analysis to evaluate the impact on risk and return of a repeat of the last financial crisis.\nAnalysis 2:Estimate over one year, with a 95% level of confidence, how much Flusk’s assets could underperform its liabilities.\nMing recommends purchasing newly issued emerging market corporate bonds that have embedded options. Prior to buying the bonds, Ming wants McKee to estimate the effect of the purchase on Flusk’s VaR. McKee suggests running a stress test using a historical period specific to emerging markets that encompassed an extreme change in credit spreads.\nAt the conclusion of their conversation, Ming asks the following question about risk management tools: “What are the advantages of VaR compared with other risk measures?”", "Hiram Life (Hiram), a large multinational insurer located in Canada, has received permission to increase its ownership in an India-based life insurance company, LICIA, from 26% to 49%. Before completing this transaction, Hiram wants to complete a risk assessment of LICIA’s investment portfolio. Judith Hamilton, Hiram’s chief financial officer, has been asked to brief the management committee on investment risk in its India-based insurance operations.\nLICIA’s portfolio, which has a market value of CAD260 million, is currently structured as shown in Exhibit 1. Despite its more than 1,000 individual holdings, the portfolio is invested predominantly in India. The Indian government bond market is highly liquid, but the country’s mortgage and infrastructure loan markets, as well as the corporate bond market, are relatively illiquid. Individual mortgage and corporate bond positions are large relative to the normal trading volumes in these securities. Given the elevated current and fiscal account deficits, Indian investments are also subject to above-average economic risk.\nHamilton begins with a summary of the India-based portfolio. Exhibit 1 presents the current portfolio composition and the risk and return assumptions used to estimate value at risk (VaR).\nExhibit 1\nSelected Assumptions for LICIA’s Investment Portfolio\n\tAllocation\tAverage Daily Return\tDaily Standard Deviation\nIndia government securities\t50%\t0.015%\t0.206%\nIndia mortgage/infrastructure loans\t25%\t0.045%\t0.710%\nIndia corporate bonds\t15%\t0.025%\t0.324%\nIndia equity\t10%\t0.035%\t0.996%\nInfrastructure is a rapidly growing asset class with limited return history; the first infrastructure loans were issued just 10 years ago.\nHamilton’s report to the management committee must outline her assumptions and provide support for the methods she used in her risk assessment. If needed, she will also make recommendations for rebalancing the portfolio to ensure its risk profile is aligned with that of Hiram.\nHamilton develops the assumptions shown in Exhibit 2, which will be used for estimating the portfolio VaR.\nExhibit 2\nVaR Input Assumptions for Proposed CAD260 Million Portfolio\nMethod\tAverage Return Assumption\tStandard Deviation Assumption\nMonte Carlo simulation\t0.026%\t0.501%\nParametric approach\t0.026%\t0.501%\nHistorical simulation\t0.023%\t0.490%\nHamilton elects to apply a one-day, 5% VaR limit of CAD2 million in her risk assessment of LICIA’s portfolio. This limit is consistent with the risk tolerance the committee has specified for the Hiram portfolio.\nThe markets’ volatility during the last 12 months has been significantly higher than the historical norm, with increased frequency of large daily losses, and Hamilton expects the next 12 months to be equally volatile.\nShe estimates the one-day 5% portfolio VaR for LICIA’s portfolio using three different approaches:\nExhibit 3\nVaR Results over a One-Day Period for Proposed Portfolio\nMethod\t5% VaR\nMonte Carlo simulation\tCAD2,095,565\nParametric approach\tCAD2,083,610\nHistorical simulation\tCAD1,938,874\nThe committee is likely to have questions in a number of key areas—the limitations of the VaR report, potential losses in an extreme adverse event, and the reliability of the VaR numbers if the market continues to exhibit higher-than-normal volatility. Hamilton wants to be certain that she has thoroughly evaluated the risks inherent in the LICIA portfolio and compares them with the risks in Hiram’s present portfolio.\nHamilton believes the possibility of a ratings downgrade on Indian sovereign debt is high and not yet fully reflected in securities prices. If the rating is lowered, many of the portfolio’s holdings will no longer meet Hiram’s minimum ratings requirement. A downgrade’s effect is unlikely to be limited to the government bond portfolio. All asset classes can be expected to be affected to some degree. Hamilton plans to include a scenario analysis that reflects this possibility to ensure that management has the broadest possible view of the risk exposures in the India portfolio.", "Hoskins Bank Corporation (HB) is a US bank holding company with lines of business in corporate banking, retail banking, capital markets, and private wealth management.\nHB’s annual risk assessment meeting with its external regulator will be in 90 days. In preparation for this meeting, Richard Hextall, CEO, and Alice Klink, chief risk officer, are meeting with independent risk consultant David Donovan, a principal of Donovan and MacNab Risk Advisory LLC.\nHextall asks Klink to review HB’s primary risk exposures. Klink begins by suggesting that the liquidity gap is a primary risk exposure for retail banking, stating that “with a 99% level of confidence, we expect our ratio of interest-earning assets to interest-paying liabilities will range between 90% and 110%.” For corporate banking, Klink believes that credit deterioration is a primary risk exposure and states that “over any 1-month period, there is a 1% probability of incurring a single-name loan loss for an amount that is not greater than 0.55% of the loan portfolio.” Klink believes that market risk is a primary risk exposure for capital markets, stating that “there is a 1% chance of HB losing at least 1.30% of its Tier 1 capital over a 1-day period.”\nDuring last year’s review, the regulator expressed concern that HB did not have an effective risk management process in place for its short-term, investment-grade bond portfolio. Donovan asks about the bank’s progress in addressing this concern. Hextall explains that HB has implemented a value at risk (VaR) approach and notes that there are three distinct methods to estimate VaR. The parametric method assumes that the distribution of returns on the risk factors is normal, and it is considered to be a straightforward approach. The historical simulation method also relies on the normal distribution assumption. The Monte Carlo simulation method relies on neither a normal distribution nor past returns and, as a result, is able to accommodate bonds that may contain embedded options.\nDonovan cautions Hextall that VaR may not capture information related to large losses, portfolio composition, and performance. He states that these limitations may be addressed by variations, or extensions, to VaR. For example, CVaR captures the potential loss if VaR is exceeded. IVaR measures ex ante tracking error. Relative VaR is used to determine the effect on VaR from any changes in portfolio composition.\nRecalling the financial crisis, Hextall asks Klink about HB’s potential exposure to any future adverse, extreme events. Klink replies that HB’s investment portfolio currently holds short-duration, high-investment-grade bonds but does not hold any equity securities or derivative instruments. Klink adds that the illiquidity conditions that were prevalent during the financial crisis continue to exist, according to a reverse stress test she conducted on ten plausible independent risk factors.\nDonovan transitions the discussion to the private wealth division by asking Hextall to discuss the differences in risk measurement for banks in comparison to traditional asset managers, such as HB’s private wealth division. Hextall states that risk measures for banks typically consider liquidity, solvency, and capital sufficiency, whereas risk measures for traditional asset managers typically are focused on investment performance. Hextall provides an example, stating that “HB, for its private wealth clients, calculates active share for each client and uses ex ante tracking error to measure the degree to which clients’ current portfolios might underperform their benchmarks in the future. For equity-only portfolios, forward-looking beta is used to measure sensitivity to the broad equity market.”\nHextall asks Klink to review the constraints used in the context of measuring the risk of the corporate banking division. Klink responds by stating that the corporate banking division’s capital allocation is $2,800 million. This amount considers market risk, credit risk, and operational risk for which the minimum required return is 11%. Capital limits, position limits, and stop-loss limits are assigned to manage both overall exposure and exposure to single-name event risk. The market risk management constraints for each of the corporate banking division’s lending groups are summarized in Exhibit 1.\nExhibit 1 Market Risk Management Constraints for Corporate Banking Lending Groups ($ Millions)\nLending Group\tReturn\tCapital Limit\tPosition Limit\tStop-Loss Limit\nSecured\t120\t800\t32\t80\nCash Flow\t120\t1,200\t24\t60\nReal Estate\t120\t1,000\t10\t70", "Dierdre O’Callahan is a senior risk manager at Muckroth Investment Management, a global investment firm headquartered in Dublin, Ireland. O’Callahan’s team is responsible for tracking and estimating portfolio risk for the firm’s various investment strategies and for communicating risk exposures to Muckroth’s portfolio managers, investment committee, and chief risk officer. O’Callahan’s team also offers risk consulting services to the firm’s institutional investor clients.\nWhen assessing portfolio risk, O’Callahan makes frequent use of value at risk (VaR) in addition to other measures, such as volatility, sensitivity risk, and scenario risk. O’Callahan believes that VaR is an appropriate risk measure in this application for the following reasons:\nReason 1:\nThe reliability of VaR can be easily verified through a process known as backtesting.\nReason 2:\nVaR takes portfolio liquidity into account when some of the assets are relatively illiquid.\nReason 3:\nVaR effectively accounts for an increase in asset correlations during times of market stress.\nMichelle Ryan is a senior portfolio manager on the Muckroth Alpha Fund. Ryan and O’Callahan are reviewing the VaR report O’Callahan prepared for this fund to ensure that the fund is within the risk parameters established by the firm and communicated to investors. The Alpha Fund has assets under management of €315 million and has an expected annualized return of 10.4% with a volatility of 17.52%. The report describes VaR in both percentage and euro terms. It uses the parametric method of VaR at the 5% level (1.65 standard deviations), assuming 250 trading days per year.\nAfter reviewing the current VaR report, Ryan asks O’Callahan to calculate how much the VaR estimate would change if she were to reduce the portfolio weight of Bordeaux Industries stock in the Alpha Fund from 6% to 2% of the portfolio and then use the proceeds to establish a new 4% position in Riga Bank & Trust. O’Callahan tells Ryan that there are several extensions of VaR analysis that she can run.\nAxiomada, a prospective institutional client, is impressed by Muckroth’s investment track record and would like to learn more about the consulting services Muckroth offers to monitor risk. Representatives from Axiomada set up a meeting with O’Callahan to discuss how Muckroth considers important risk categories facing institutional investors. O’Callahan provides Axiomada with a risk management document Muckroth has prepared for institutional clients that includes Exhibit 1. Exhibit 1 illustrates how Muckroth considers a variety of different risk categories depending on the type of institutional investor.\nExhibit 1 Important Risk Categories by Type of Institutional Investor\nRisk Category\tBank\tHedge Fund\tPension Plan\nLiquidity Gap\t√\t---\t√\nVaR\t√\t√\t---\nTracking Error\t---\t√\t√\nLeverage\t√\t√\t---\nScenario Analysis\t√\t---\t√\nKey Rate Duration\t√\t---\t√\nActive Share\t---\t√\t---\nOperational Risk Capital\t√\t---\t√", "Margaret Smith is a consultant specializing in private company valuations. She evaluates Lytham Corporation, a small, family-owned company whose CEO is a member of the controlling family. Smith wants to normalize Lytham's reported operating income to compare it with public companies in the same industry. She notes the following items:\nThe current annual salary of Lytham's CEO is $600,000. The annual salary of a similarly qualified CEO of a comparable public company is $1,000,000.\nLytham owns a luxury apartment in Singapore that is used by the CEO for both business and personal travel. The apartment would be sold if Lytham were a public company. The annual operating costs for the property are $200,000 per year and the annual depreciation expense is $200,000.\nLytham pays 15% of its net income in dividends to its owners. Smith believes the payout ratio would be closer to 50% if Lytham were a public company.\nSmith calculates the required return on equity for Lytham using the expanded CAPM and the information in Exhibit 1. Smith determines that the appropriate industry risk premium is zero.\nExhibit 1\nBeta\t1.3\nRisk-free rate\t6%\nEquity risk premium\t4%\nSmall-cap risk premium\t3%\nCompany-specific risk premium\t1%\nCalcyte is a publicly traded company with an equity value of $9,043 million. Smith conducts a valuation of Calcyte for a private buyout client who is interested in purchasing a controlling stake. She determines the relevant discount for lack of control to be 23% and the relevant discount for lack of marketability to be 20%.\nSmith also values Ramabo Corporation, a privately held company with annual revenues of $10 million. Smith identifies comparable public companies and calculates an average EV/Sales multiple for each of Ramabo's three business segments. She uses these multiples and the revenue generated by each segment in Exhibit 2 to calculate Ramabo's EV based on the guideline public company method.\nExhibit 2\n\tRevenue (in $ Millions)\tEV/Sales\nSegment A\t6\t3.3\nSegment B\t3\t1.2\nSegment C\t1\t4.9", "Fazly Ahmad is an equity analyst researching Rose Mass Rapid Limited (RMRL), a Canadian transport operator. RMRL reports under IFRS and has a 31 December year end. Ahmad compares RMRL to one of its competitors, Orchid Mass Transit Inc., which reports under US GAAP and also has a 31 December year end.\nOn 1 January of the current year, RMRL purchased a 30% interest in Begonia Bus Inc.'s outstanding common equity for $12,000,000. The excess purchase price was $2,150,000. Half of the excess was attributable to Begonia's plant and equipment, and the other half was attributable to land. Begonia depreciates its plant and equipment using the straight-line method with a remaining useful life of 10 years and zero residual value. RMRL has the ability to exercise significant influence over Begonia. Ahmad expects Begonia to report net income of $1,500,000 for the current year and not pay any dividends. Ahmad assumes Begonia does not have any intercompany transactions with RMRL. He then estimates the carrying value of RMRL's investment in Begonia at the end of the current year.\nDuring the current year, RMRL acquired 80% of the outstanding shares of Petunia Transit Co. in exchange for common shares of RMRL. At the time of the acquisition, RMRL accounted for the acquisition using the partial goodwill method (Method 1). Also during the current year, Orchid acquired a controlling interest in another company and accounted for the acquisition using the full goodwill method (Method 2). Ahmad considers whether differences in the accounting treatment of these acquisitions could affect certain financial metrics.\nAhmad reviews the trend in RMRL's balance-sheet-based and cash-flow-based accruals ratios, as well as the trend in the Beneish M-scores and Altman Z-scores over the past two years, using the data in Exhibit 1.\nExhibit 1\n\tMost Recent Year\tTwo Years Ago\nBalance-sheet-based accruals ratio\t4.3%\t0.6%\nCash-flow-based accruals ratio\t1.7%\t–2.5%\nBeneish M-score\t–1.94\t–1.43\nAltman Z-score\t1.54\t1.85", "John Smith, an advisor at Godel Securities, is meeting with one of his clients, Client A, to provide advice on fixed income investments. Client A currently has investments in Country 1 and Country 2. Smith first analyzes the fixed income market in Country 1. In Exhibit 1, he gathers spot rates (with annual compounding) for government zero-coupon bonds, as well as swap spreads, for maturities of one, two, and three years. He uses that information to construct a forward curve.\nExhibit 1\nMaturity (years)\t1\t2\t3\nGovernment spot rate\t3%\t5%\t8%\nSwap spread\t0.20%\t0.25%\t0.40%\nSmith tells Client A that there are a number of theories that attempt to explain the shape of the yield curve. While the computation of forward rates is straightforward, Smith states that he believes forward rates are upwardly biased predictors of future spot rates.\nIn Country 2, there is uncertainty about how the government will manage inflation. Smith evaluates the effect on Client A's portfolio from changes in the yields on 1-year, 3-year and 10-year securities. Selected key rate durations for the portfolio as well as Smith's expected change in interest rates at each key rate are shown in Exhibit 2.\nExhibit 2\nSecurity\tKey Rate Duration\tExpected Key Rate Change\n1-year\t0.50\t1.00%\n3-year\t0.75\t0.75%\n10-year\t2.50\t–0.25%\nSmith computes the percentage change in the value of the portfolio. He observes that the average change in the three rates is 0.50%.\nSmith also advises Client A on an actively managed corporate bond portfolio in Country 2 using the swap spread as a measure of risk. Smith discusses the implied credit and liquidity risk with Client A using the 5-year swap rate as an example. The 5-year government and corresponding fixed swap rate at selected times over the last 12 months is presented in Exhibit 3.\nExhibit 3\nPeriod\tGovernment Bond Yield (%)\tFixed Swap Rate (%)\n1 month ago\t7.48\t8.28\n6 months ago\t8.51\t8.86\n12 months ago\t8.55\t8.84", "James Ryan is a portfolio manager who is reviewing the risk exposure of his stock and bond portfolios, and evaluating new trading strategies.\nWhen analyzing his current stock portfolio, Ryan determines that the monthly 5% VaR is $10.6 million.\nRyan's current bond portfolio has a value of $260 million. He uses the parametric method to estimate the daily 5% VaR based on a daily expected return of 0.0218% and a daily standard deviation of returns of 0.8246%. He assumes that portfolio returns follow a normal distribution and that a 5% VaR is 1.65 standard deviations below the expected value.\nRyan considers the implications of adding bonds with embedded options to his current bond portfolio. He is concerned that adding these bonds will cause portfolio performance to deviate significantly from the benchmark. Given this concern, he wants to use an extension of VaR that will measure the extent of this deviation.\nRyan is in the process of backtesting a new multifactor portfolio strategy. For his investment universe of liquid securities, he assesses the performance of a large number of different strategies that use a wide range of factors and rebalancing periods.\nAfter completing his backtesting, Ryan identifies three factor strategies that are all expected to generate a similar mean return and standard deviation. He uses the metrics in Exhibit 1 to evaluate which strategy would provide the most attractive statistical properties for his risk-averse clients.\nExhibit 1\n\tStrategy X\tStrategy Y\tStrategy Z\nSkewness\t–0.9\t2.4\t2.4\nKurtosis\t12.7\t20.3\t12.7\nMaximum drawdown\t35.3%\t31.4%\t30.2%", "Anita Daani, a research analyst, is evaluating the financial institutions in her coverage universe. She begins with an analysis of KTR Insurance, a property and casualty (P&C) insurance company. KTR reports under IFRS with a fiscal year end of 31 December. The company has two employee compensation plans:\nPlan A - a defined benefit pension plan\nPlan B - a share-based compensation plan which grants restricted stock units (RSUs)\nFor the most recent year, Daani calculates the amount recognized by KTR as an operating expense in its income statement related to Plan A. She observes that Plan A had a current service cost of $10 million and a past service cost of $2 million for the most recent year.\nDaani next assesses the dilutive effect of the share-based compensation plan on KTR's financial statements. She uses the treasury stock method and the data for the most recent year for Plan B in Exhibit 1. Daani assumes that KTR has no other potentially dilutive securities outstanding besides the RSUs granted under Plan B.\nExhibit 1\nBasic shares outstanding at end of year\t2,700 million\nNumber of unvested RSUs at end of year\t150 million\nAverage unrecognized share-based compensation expense\t$840 million\nAverage share price during the most recent year\t$7\nOn 1 January of the current year, KTR grants 2 million new RSUs to employees under Plan B. The share price on the grant date was $8 and the vesting period is 4 years. Daani calculates the effect of the new RSU grants under Plan B on KTR's financial statements for the current year.\nDaani next analyzes KTR's competitive position in the P&C insurance industry. She uses data in Exhibit 2 to compare KTR and its peers in their efficiency of obtaining new premiums.\nExhibit 2\n\tKTR\tPeer Company 1\tPeer Company 2\nLoss and loss adjustment expense ratio\t59.5%\t65.4%\t61.9%\nUnderwriting expense ratio\t38.1%\t30.7%\t33.2%\nCombined ratio\t97.6%\t96.1%\t95.1%", "Sebastian Traver is a financial analyst at Feldcroft Inc., a large, US-based construction company specializing in commercial and residential projects. He is reviewing the company's asset financing options and evaluating potential growth opportunities.\nFeldcroft is considering the purchase of a new corporate helicopter to access remote construction sites. Traver evaluates a proposal for a 10-year lease with payments of $125,000 at the end of each month. The helicopter has a fair value of $15 million, and the lessor would incur a direct cost of $750,000 at the beginning of the lease. The residual value of the helicopter at the end of the lease is expected to be $8,700,000. Feldcroft has an unsecured incremental borrowing rate of 8%.\nFeldcroft has operations in Country A, an emerging market that represents 10% of the company's revenue. To estimate the equity risk premium that should be used in calculating Feldcroft's cost of equity, Traver uses the country spread model with no adjustment for the relative volatility of Country A equity and bond returns. The current US equity risk premium is 5.94% and 10-year US Treasury bonds yield 3.50%. Country A recently issued a 10-year bond denominated in local currency that yields 7.55% and a 10-year bond denominated in US dollars that yields 5.15%.\nFeldcroft is considering acquiring a construction company that has sales of $7.00 per share. To estimate a fair takeover value for this target company, Traver uses comparable transaction analysis with equal weights on three transactions, as shown in Exhibit 1. He notes that Feldcroft's current price-to-sales (P/S) ratio is 1.35 and that transactions in the construction industry take place at an average takeover premium of 8%.\nExhibit 1\nVariable\tAcquired Company 1\tAcquired Company 2\tAcquired Company 3\nSales per share\t$6.30\t$12.98\t$9.01\nP/S ratio at acquisition price\t1.78\t1.84\t1.63\nFinally, Traver prepares a pro forma income statement reflecting the acquisition of the target construction company. He assumes the acquisition would generate cost synergies and be funded with new debt, which would include refinancing the target company's existing debt. After separating depreciation and amortization from operating expenses, Traver models selected pro forma income statement balances as follows:\nInterest expense: Add interest expense from the new debt issuance to the target company's current interest expense\nOperating expenses: Add cost synergies to and subtract cost dis-synergies from combined operating expenses\nDepreciation and amortization expense: Add amortization of acquired intangible assets to combined depreciation and amortization expense", "Megan Helmer is an analyst at Acuity Investments. She uses machine learning to build a model that categorizes companies according to whether their predicted ROE is low or high. The model uses multiple features to explain the variations in ROE. The model produces low error rates using training data, but much higher error rates using out-of-sample data.\nHelmer also builds a logistic regression model to predict the 1-year probability of default for junk bond issuers. She collects data for 70 issuers over the past five years and identifies those that defaulted within the subsequent year (DEFAULT = 1) and those that did not default (DEFAULT = 0). She uses two independent variables in the logistic regression model: the ratio of debt to total capital (LEVERAGE) and the interest coverage ratio (COVERAGE). The coefficients of the regression are shown in Exhibit 1. Using this model, Helmer then estimates the probability of default by ACME, an issuer with LEVERAGE of 0.8 and COVERAGE of 0.9.\nExhibit 1\n\tCoefficient\nIntercept\t–20.0\nLEVERAGE\t65.5\nCOVERAGE\t–35.0\nNext, Helmer builds a linear regression model for manufacturing companies (Model 1) to forecast the impact of inflation caused by supply chain disruptions on profit margin. She uses five years of quarterly data for 100 companies and the following model specification:\nModel 1: MARGINt = b0 + b1INPUTt + b2LOGISTICSt + εt,\nwhere MARGIN is profit margin, INPUT is raw material cost inflation, and LOGISTICS is freight cost inflation.\nHelmer assesses possible violations of regression assumptions in Model 1 and makes the following observations:\nObservation 1: There are significant deviations of the residuals from the diagonal in the Q-Q plot.\nObservation 2: The null hypothesis of the Breusch–Pagan test is rejected.", "Sarah Lambert is an investment advisor meeting with one of her clients, Edward Banner. Banner is considering adding real estate and commodities to his portfolio.\nReal Estate\nLambert researches REIT A, a hotel REIT, and notes that recent property market transaction volumes have been high. In addition, REIT A has recorded a number of one-time gains and charges. Lambert considers the potential impact these issues could have on different valuation approaches.\nLambert next reviews REIT B, an industrial REIT. She performs a price-to-adjusted funds from operations (P/AFFO) calculation based on the full-year financial information (in thousands) contained in Exhibit 1. The current share price is $74.65.\nExhibit 1\nFunds from operations\t$465,419\n(Gains)/Losses from sale of depreciable real estate\t$22,613\nNon-cash (straight-line) rent adjustment\t$14,705\nRecurring maintenance-type capital expenditures and leasing commissions\t$33,297\nShares outstanding\t100,000\nLambert carries out further analysis on the wider economy and forecasts that job creation, retail sales growth, and consumer credit will all be stronger than expected. Based on these forecasts, she recommends hotel REITs over industrial REITs.\nCommodities\nLambert then recommends an investment in the Gemini Commodity Futures Fund. According to Gemini's prospectus, the fund always takes a long position in the natural gas futures contract with the shortest maturity. At the contract maturity date, Gemini sells the existing contract and buys the new contract with the shortest maturity. In Exhibit 2, Lambert gathers prior-year price information from the natural gas futures market for two of Gemini's trade dates. All prices are in $ per million British thermal units as of the date listed.\nExhibit 2\nTrade Date\tSpot Price\tJune Futures Price\tJuly Futures Price\tAugust Futures Price\n28 May\t2.546\t2.489\t2.418\t1.957\n26 June\t2.546\t2.546\t2.338\t1.795", "Irina Benoit, CFA, is a senior research analyst at StockCo, an investment management firm. Multiple rumors have been circulating about a merger of StockCo with another firm. Benoit knows from internal senior management meetings that the merger will take place next year. As a result, Benoit has decided to leave StockCo and start her own investment management firm, Benoit Capital Traders (BCT). StockCo did not require Benoit to sign a non-compete agreement. During a family dinner, Benoit announces that she intends to start BCT after leaving StockCo. Benoit asks her brother to close his existing account at StockCo and bring his money to BCT once the new firm is operational. A week before Benoit leaves StockCo, she sends a message to a friend on her mobile phone: \"Goodbye StockCo—I'm glad I won't be here for the merger!\"\nUpon starting BCT, Benoit adopts the Standards with her firm and writes a compliance manual. She adds the following three procedures to BCT’s compliance manual.\nProcedure 1: Analysts may accept gifts in the form of business-related entertainment to a maximum value listed by the compliance office.\nProcedure 2: For all analysts, the purchase of a company’s stock through a private placement is capped at a maximum per private placement as listed by the compliance office.\nProcedure 3: When attending meetings at an issuer’s headquarters, analysts are allowed to accept modest commercial transportation and hotel accommodation paid by the issuer.\nDuring the first month of BCT's operations, Benoit creates a list of StockCo clients from memory to solicit their business. Benoit then uses an external marketing company to send each prospective client either a card or a coffee mug. She provides this marketing company with a list of clients with their approximate portfolio values. Benoit requests that the company send the coffee mugs to only those clients with portfolios larger than $1 million. During Benoit's employment at StockCo, she had access to the firm's internal data system that contains confidential personal information about StockCo’s clients. The database and its access are managed by Benoit's former department manager at StockCo, Mike Lee, CFA. Lee neglected to remove Benoit's access from the server and, as a result, Benoit discovers that she still has access to the system. Benoit checks the names on the client list that she created from memory against the list in StockCo’s internal data system and confirms that her list is complete and accurate. She then contacts Lee to request him to cancel her access.\nThree months later, Benoit hires and starts supervising two new analysts, Robert Kiprotich and Yoko Tanaka. Kiprotich’s first assignment is to write a report on a cryptocurrency. After writing the report, Kiprotich uses BCT’s social media page to promote the report. He starts by using an online generative artificial intelligence (AI) program to summarize his report and credits the generative AI program as the source of his summary. At the end of the summary, Kiprotich states that investors should not be concerned about the transaction costs of switching their investments because the higher returns from the cryptocurrency will more than offset the costs. He then posts the summary online, along with a link to the report. A week later, someone comments on the social media post, pointing out an error in the report. Kiprotich leaves the report unchanged since he intends to post a new report at the end of the week in which he will also correct the unintentional error.", "Victoria Lazslo is an analyst valuing three firms held in client portfolios.\nFirm A owns a chain of regional dental offices and has no debt. Lazslo initially selects a single-stage residual income model to estimate the intrinsic value of Firm A’s stock and compiles the data in Exhibit 1.\nExhibit 1\nConstant long-term growth rate\t9.6%\nConstant long-term ROE\t16.0%\nMarket price per share\t$220.00\nBook value per share\t$166.00\nCost of equity\t12.5%\nLazslo also considers the possibility that after Year 10 Firm A’s ROE will exhibit mean reversion. She uses a multistage residual income model to value Firm A’s stock and estimates residual income in Year 10 to be $8.38 per share, with a persistence factor of 0.7.\nFirm B is a distributor of building supplies. Firm B’s year-end (Year 0) book value of equity is $111 per share and its cost of equity is 12%. Lazslo forecasts financial data for the next two years in Exhibit 2.\nExhibit 2\n\tYear 1\tYear 2\nNet income\t$26.25\t$31.56\nDividends\t$3.80\t$4.57\nOther comprehensive income\t$0.00\t$2.75\nFirm C is an international carbon capture firm that reported EPS of $3.75 last year. Lazslo forecasts earnings growth of 7%, a required return on equity of 12%, and a dividend payout ratio of 45% for the foreseeable future. She selects the Gordon growth model to value Firm C's stock.", "Sarah Simpson is an economist for an investment firm. She researches the economic growth of several countries. Simpson believes the growth rate of per capita income in developing countries will increase and eventually match that of developed countries.\nCountry A has a developed, slow-growing economy and a high rate of capital per worker. Exhibit 1 provides the average annual growth rates for selected economic variables in Country A over the most recent five years. Simpson uses this information to determine the contribution of capital deepening to factor productivity.\nExhibit 1\nHours worked\t0.6%\nLabor productivity\t1.4%\nTotal factor productivity\t0.5%\nCountry B's potential GDP currently exceeds its actual GDP. Simpson forecasts that Country B's potential GDP growth rate will be higher than the actual GDP growth rate over the next two years. She assesses the implications of her forecast on Country B's economy.", "Nathan Moffet is a fixed-income portfolio manager analyzing the credit risk within a corporate bond portfolio.\nMoffet purchases a senior unsecured bond issued by Company A at a price of $105.35. The bond has the following characteristics:\nAn 8% annual-pay coupon, a face value of $100, and no embedded options\nThree years remain to maturity and a coupon has just been paid\nMoffet collects information on the bond in Exhibit 1, which provides end-of-period data. He uses the information to consider a base case scenario where the bond defaults at the end of Year 3.\nExhibit 1\n\tExposure\tRecovery\tLoss Given Default\tProbability of Default\tExpected Loss\tDiscount Factor\tPresent Value (PV) of Expected Loss\nYear 1\t$117.57\t$47.03\t$70.54\t5.00%\t$3.53\t0.9709\t$3.43\nYear 2\t$112.85\t$45.14\t$67.71\t4.75%\t$3.22\t0.9426\t$3.04\nYear 3\t$108.00\t$43.20\t$64.80\t4.51%\t$2.92\t0.9151\t$2.67\nSum\t---\t---\t---\t14.26%\t$9.67\t---\t$9.14\nMoffet learns that Company B plans to issue a covered bond. He considers the benefits of covered bonds from the perspective of the company.\nMoffet owns $10 million of Bond 1, a 5-year senior unsecured bond issued by Company C. He recently bought credit protection on Company C using a $10 million notional value CDS. The CDS can be settled by physical or cash settlement and its reference obligation is Bond 1. Company C recently filed for bankruptcy and Moffet gathers the information in Exhibit 2 on its outstanding debt obligations.\nExhibit 2\n\tSeniority\tTenor\tPar Value\tCurrent Price\nBond 1\tSenior unsecured\t5 years\t$100\t$40\nBond 2\tSenior unsecured\t4 years\t$100\t$35\nMoffet is considering buying CDS protection on Company D. He does not own any of the company's debt. He gathers the following information for a 3-year CDS on Company D:\nThe credit spread is 550 bps\nThe effective duration is 2.8\nThe coupon rate is 5.0%\nMoffet estimates the upfront premium needed to buy the CDS protection.", "Herbert Erikson is examining the multinational operations of Obsidian AG, a eurozone company that reports under IFRS.\nDuring the most recent year, Obsidian made unhedged export sales to customers located in non-eurozone countries. On 31 December, the end of the most recent year, USD 1 million of accounts receivable remained outstanding. At the time of sale, the EUR/USD (amount of EUR per 1 USD) exchange rate was 0.950. On 31 December, the EUR/USD exchange rate was 0.965.\nOn 1 January of the most recent year, Obsidian formed two new subsidiaries: Ametrine, a UK-based company, and Citrine, a Poland-based company. Ametrine was consolidated using the current rate method, while Citrine was consolidated using the temporal method. The GBP and the Polish zloty (PLN) steadily strengthened against the EUR throughout the year. All of the combined PP&E, and a major portion of the inventory that was sold during the year, were acquired when the companies were formed. Both companies were profitable and had positive shareholders' equity in their first year of operations.\nKunzite is a wholly owned subsidiary that Obsidian acquired six years ago. Erikson is concerned that Kunzite is based in a country that may soon become hyperinflationary, and considers the appropriate accounting treatment when Obsidian consolidates Kunzite.", "Juan Bolton is a fixed-income analyst at an investment firm. He is analyzing the firm's actively managed funds and examining macroeconomic data.\nBolton analyzes two actively managed funds, Fund X and Fund Y. He compiles data regarding the performance of the funds and their benchmark in Exhibit 1. Fund X’s expected active risk is 1.3% and Fund Y’s ex ante information ratio is 0.27. The risk-free rate is 2.3%.\nExhibit 1\n\tFund X\tFund Y\tBenchmark\nExpected annual return\t6.7%\t6.5%\t6.2%\nStandard deviation of returns\t8.9%\t8.6%\t8.3%\nBolton uses the fundamental law of active management to evaluate the performance of the managers of Fund X and Fund Y. He observes that both managers have access to the same set of securities and rebalance their portfolios at the same frequency. Neither manager has any restrictions on implementing their forecasts when constructing portfolios. Bolton also observes that Fund X’s manager has better forecasting skills than Fund Y’s manager.\nNext, Bolton examines the macroeconomic data of three countries for potential investment in their fixed-income securities. He collects selected market expectations for these countries, which are at similar stages of economic development, in Exhibit 2.\nExhibit 2\n\tCountry 1\tCountry 2\tCountry 3\nReal GDP growth (annual)\t2.8%\t4.2%\t4.2%\nVolatility of real GDP growth\t0.5%\t0.5%\t0.8%", "Clara Connor, an advisor for Newbridge Investments, is valuing three publicly traded firms: Lismore Corp., Omega Pipeline, and Slane Industries.\nConnor estimates Lismore’s FCFF for the next year based on its forecasted revenues. Lismore’s revenues over the past 12 months were $2,500 million. Connor’s assumptions for estimating Lismore's FCFF are summarized in Exhibit 1.\nExhibit 1\nSales growth over the next year\t40%\nEBIT margin\t30%\nIncremental fixed capital as percent of increased sales\t35%\nIncremental working capital as percent of increased sales\t25%\nProportion of new fixed and working capital financed by debt\t15%\nTax rate\t20%\nOmega Pipeline is a US-based company operating a network of oil and gas pipelines. Connor is concerned about increasing awareness of the environmental and social impacts these pipelines have on their surrounding communities. She believes these concerns are not fully reflected in Omega's current share price and that an ESG equity risk premium should be incorporated in the discount rate. Using a two-stage model and the assumptions provided in Exhibit 2, Connor determines the company value of Omega.\nExhibit 2\nFCFF for both Year 1 and Year 2\t$1,850 million\nExpected long-term FCFF annual growth rate starting in Year 3\t3.0%\nPretax cost of Omega's debt\t6.0%\nDebt-to-assets ratio\t40%\nRisk-free rate\t3.5%\nMarket equity risk premium\t5.5%\nESG equity risk premium\t0.9%\nOmega's equity beta\t1.4\nCorporate tax rate\t25%\nSoon after Connor completes her valuation of Omega, the company announces it will issue debt to buy back equity during the next year (Year 1). Connor considers how this capital structure change would impact her FCFF forecasts.\nFinally, Connor analyzes Slane Industries. Slane is composed of three independent divisions: 1) lithium mining, 2) bromine extraction, and 3) specialty chemicals. The values of the firm's lithium and bromine reserves are significant. The rates of revenue growth differ across the three divisions. Connor is able to identify publicly traded competitors for the specialty chemicals division but not for the other two divisions. After considering different approaches, she identifies the most appropriate approach for estimating the intrinsic value of Slane.", "Qiu Tian is a hedge fund manager evaluating options on several equities. She begins with Tara Corp., a non-dividend-paying stock priced in Indian rupees (INR). Tian is bullish on Tara stock and values European-style Tara call options using a two-period binomial model and information from Exhibit 1.\nExhibit 1\nCurrent stock price\tINR 10\nTime to option expiration\t2 years\nRisk-free rate (annual)\t5.0%\nOption strike price\tINR 12\nUp factor per period\t1.50\nDown factor per period\t0.67\nTian observes that the 2-year Tara call option is illiquid. She determines how to replicate a long position in this call option.\nNext, Tian assesses the value of a European-style call option on equity index futures using the Black model. She gathers information related to the call in Exhibit 2. The Black model value of a put with the same underlying, strike price, and time to expiration is 225.\nExhibit 2\nCurrent futures price\t1,100\nTime to expiration\t6 months\nExercise price\t1,300\nRisk-free rate\t5.0%\nTian is also evaluating the addition of Purnima Corp. options to her portfolio. She compares the relative value of three Purnima call options in Exhibit 3. Her objective is to select the option that is cheapest after she makes adjustments for differences in moneyness and time to expiration. Purnima stock is currently trading at INR 62.\nExhibit 3\n\tOption X\tOption Y\tOption Z\nCurrent price\tINR 10.55\tINR 6.89\tINR 6.44\nImplied volatility\t30%\t25%\t35%\nStrike price\tINR 55\tINR 62\tINR 75\nTime to expiration\t8 months\t12 months\t16 months", "Carl Hirayo, CFA, recently joined Summit Investments as a portfolio manager. Hirayo plans to participate in Tarragon Petroleum’s IPO for both his personal account and his clients' accounts. He obtains preclearance for his own participation because the IPO is not fully subscribed at that time. The offering turns out to be fully subscribed at the time of issue and Summit receives all requested shares. Hirayo allocates these shares on a pro rata basis among his subscribing clients and his own account.\nWhile meeting with a client at a restaurant, Hirayo overhears two brokers talking about ION, an electronic manufacturing company. The brokers discuss a report that was released online earlier in the morning by a leading analyst. The report included a merger rumor about ION and the analyst placed a strong buy recommendation on the stock. Hirayo calls his broker to buy 4,000 shares of ION for his personal account.\nHirayo will receive a $60,000 performance bonus from Summit if his monthly portfolio performance exceeds that of Summit's other portfolios. He discloses the bonus arrangement to his existing clients but not to prospective clients. Separately, Hirayo will receive a $12,000 reward from Summit after he successfully brought in 20 clients from his previous employer. This reward is paid by Summit and is not charged to clients. Hirayo does not disclose this reward arrangement to the clients that he brought over.\nSummit's management team decides to further strengthen its record retention policy. The current policy has the following notable provisions:\nProvision 1: Client meeting notes must be preserved in electronic form; hence, any hard copies must be digitized.\nProvision 2: Informal blog posts and short message form posts sourced from the internet do not need to be preserved.\nProvision 3: Research reports and all supporting documents have a retention period of three years.", "Lucy Wang is a derivatives trader for a South African broker-dealer. All of her firm's trades are in South African rand (ZAR) and use a 30/360 day count convention.\nWang wants to hedge a floating-rate note held by her firm against a decline in interest rates. She uses data from Exhibit 1 to price a 3 × 12 forward rate agreement (FRA).\nExhibit 1\nMaturity\tSpot Market Reference Rate\tPresent Value Factor\n3-month\t3.67%\t0.9909\n6-month\t3.79%\t0.9814\n12-month\t4.15%\t0.9602\nWang analyzes a receive-fixed, pay-floating interest rate swap with a fixed rate of 7.38% with a 1-year remaining maturity. The notional amount of the swap is ZAR 10,000,000 which resets semiannually. She values the swap position using the current 1-year fixed rate of 4.10% and data from Exhibit 1.\nNext, Wang determines the no-arbitrage price of a bond forward contract. She uses information from Exhibit 2 and an annualized risk-free rate of 3.7%.\nExhibit 2\nQuoted bond price without accrued interest (% of par)\t105.0\nFuture value of coupon interest (% of par)\t4.51\nAccrued interest at contract initiation (% of par)\t3.00\nAccrued interest at contract expiration (% of par)\t0.75\nTime to forward contract expiration\t90 days\nConversion factor\t1.0\nWang then evaluates whether an arbitrage opportunity exists in 9-month forward contracts on the shares of Pintel Electronics. She is quoted a 9-month forward price of ZAR 816 by a dealer. Pintel shares currently trade at ZAR 850 and will pay a dividend of ZAR 34 in six months.", "Charlene Norberg is an analyst for a sell-side firm. She is building valuation models for several publicly traded firms.\nNorberg estimates the intrinsic value of Firm A's shares based on an FCFE model, using her forecasts in Exhibit 1. She expects long-term annual sales growth of 4% starting in Year 3, with consistent relationships between sales and net profit, changes in fixed capital, changes in working capital, and changes in debt. She estimates Firm A's cost of equity to be 9% and its WACC to be 8%.\nExhibit 1\n\tYear 1\tYear 2\tYear 3\nSales per share\t$90.00\t$90.00\t$93.60\nFCFE per share\t$6.20\t$9.00\t$7.85\nNorberg notes that, in the previous year, Firm A's FCFF was greater than its FCFE.\nNext, Norberg values another firm, Firm B, which has consistently been paying dividends. The firm has a large cash balance with a growing retained earnings balance. Norberg believes that Firm B is a takeover target because it offers synergies to one of its main competitors. If a takeover does occur, Norberg expects the new owner will likely change Firm B's dividend payout and will issue debt to maintain its capital expenditures. Norberg evaluates the potential takeover from the acquirer's perspective.", "Ross Wyman is a portfolio manager for a family office. He plans to add commodities to his client's holdings and meets with Tina Becker, a commodity advisor.\nWyman and Becker discuss the current market prices for three commodities, summarized in Exhibit 1.\nExhibit 1\n\tCommodity 1\tCommodity 2\tCommodity 3\nSpot price\t$1,688\t$830\t$87.20\nNear-term futures price\t$1,688\t$835\t$85.90\nFarther-term futures price\t$1,707\t$835\t$84.60\nBecker provides additional information about Commodity 3. She notes that hedging demand by consumers currently exceeds hedging demand by producers and that the convenience yield exceeds direct storage costs.\nWyman takes a fully collateralized long futures position in Commodity 3 at a price of $84.60. Two months later, he rolls the entire position from the near-term futures contract into the farther-term futures contract. At that point, the near-term futures price is $85.50 and the farther-term futures price is $84.10. The collateral earned an annualized return of 1.2% during the two months.\nWyman also considers investing in a commodity index. His objective is to select the index that provides the largest contribution to performance based on the following two expectations:\ntrending commodity markets, where outperforming assets continue to go up in price and underperforming assets continue to drift lower;\nno changes in the shapes of forward curves, with some markets currently in backwardation and others in contango.", "Dora Kriser, a financial analyst, is currently evaluating the intercompany investments and earnings quality of Delphine Industries, a large diversified consumer products company that reports under IFRS.\nDelphine recently announced that it would be increasing its ownership interest in Company A from 35% to 50%. Delphine and Company A are both profitable. Kriser considers how Delphine's net profit margin might be affected after the increase in ownership under the following scenarios:\nScenario 1: Delphine exercises significant influence, but not control, over Company A.\nScenario 2: Delphine exercises control over Company A.\nKriser is concerned that recent industry changes may negatively affect one of Delphine's cash-generating units. She evaluates the following projections to determine the expected impairment loss under IFRS:\nCarrying value of cash-generating unit: €18,200,000\nRecoverable amount of cash-generating unit: €17,700,000\nGoodwill allocated to cash-generating unit: €300,000\nNext, Kriser analyzes Delphine's earnings quality. She begins by examining the cash component and accrual component of Delphine's recurring earnings. Based on this examination, she expects Delphine to continue to exhibit a high degree of earnings persistence.\nFinally, Kriser examines Delphine's statement of cash flows and observes that interest paid is classified as an operating activity and interest received is classified as an investing activity. She considers whether these cash flow classifications could affect comparisons with competitors that report under US GAAP.", "Marcia Garrett is a research analyst at IGMA Investments. IGMA is a large investment firm that claims compliance with the Standards.\nWhile preparing a report on industry trends, Garrett read an article that appeared in a leading business newspaper. Included in the article was a summary of a study conducted by a prominent trade association. Garrett did not obtain a copy of the study directly from the trade association, but did however include information from the article in her report. Garrett cites only the newspaper in her report.\nDuring the most recent quarter, Garrett prepared an analysis detailing her interest rate expectations over the next year and submitted it to IGMA's investment committee. Her research is to be included as part of a wider report by the firm regarding market expectations for the year ahead. Based on her analysis, Garrett's opinion is that interest rates will remain fairly stable. The committee disagrees with some of Garrett's assumptions and does not include her opinion in the wider report. The committee's final report issues a consensus expectation that interest rates will increase and includes detailed assumptions supporting that view. Despite the difference in opinions, Garrett acknowledges that the committee's conclusion has a reasonable basis. The final report is distributed to clients and includes Garrett's name, as well as other research analysts who contributed to the report as authors.\nGarrett is part of a working group asked to review IGMA's code of ethics and to suggest any necessary changes that are needed to ensure that it is consistent with the Standards. During one of the working group's discussions, Garrett states that the Standards recommend that the code of ethics include general fiduciary concepts as well as detailed compliance procedures.\nGarrett has accepted an offer to join a rival firm. While at IGMA, Garrett and a colleague developed a quantitative model that was used for industry and company analysis. Garrett considers if she can continue to use the model at her new firm.", "Jennifer Francis is a currency specialist helping clients manage their foreign exchange exposures. All currencies are quoted as the amount of the numerator currency per one unit of the denominator currency (e.g., USD/EUR is quoted as the amount of USD per 1 EUR).\nFrancis is working with a client looking to execute a trade in the Thai baht (THB) and Australian dollar (AUD) currency pair. Francis receives a bid–offer quote in THB/AUD (24.3065/24.3090) from a dealer and compares this to the interbank market quotes in THB/USD (33.3942/33.3965) and USD/AUD (0.7276/0.7279) to see if an arbitrage opportunity exists.\nStephan Podowski is a client of Francis' located in Country A, whose currency is the FXA. Podowski's company will receive a payment in Country B's currency (FXB) in 18 months, and he is considering using a forward contract to hedge the currency exposure. Francis uses the following information to determine the forward discount for a 540-day FXA/FXB forward contract:\nFXA/FXB spot exchange rate: 1.1423;\n540-day market reference rate (annualized, Actual/360) for Country A: 1.23%;\n540-day market reference rate (annualized, Actual/360) for Country B: 5.52%.\nNine months ago, Podowski bought EUR 20 million forward against the USD by entering into a 1-year forward contract at 1.1308 USD/EUR. He wants to calculate the mark-to-market value of this position today. The current USD/EUR spot rate is quoted at 1.1352/1.1355 and the 90-day forward points are –14/–12. The annualized 90-day market reference rate (Actual/360) is 0.53% for USD and 0.77% for EUR.\nFrancis is looking for potential carry trades to recommend to her clients. She focuses on a potential trade between the AUD and the South African rand (ZAR). She reviews what market conditions are required for the trade to be profitable.", "Liying Wang manages her firm's investment-grade bond portfolio. She considers purchasing a senior unsecured bond issued by AHM Manufacturing (the AHM01 bond) for the portfolio. This bond is rated BBB, has a 2-year maturity, and has a 5% annual coupon. Wang assumes a recovery rate of 40% and uses a government yield binomial interest rate model to estimate the fair value of the AHM01 bond. Selected information for the bond is presented in Exhibit 1. Given no default, the value of the AHM01 bond is 100.46.\nBased on her assumptions and the information in Exhibit 1, Wang purchases the AHM01 bond at a price equal to its fair value.\nExhibit 1\nYear\tExpected Exposure\tProbability of Default\tDiscount Factor\n1\t105.49\t2.25%\t0.9524\n2\t105.00\t2.20%\t0.9115\nWang’s junior analyst estimates that the recovery rate for the AHM01 bond will be 30%. Holding all else equal, Wang considers how this estimate would affect her valuation of the bond.\nWang purchases protection on the AHM01 bond using a single-name CDS. The counterparty for the transaction is XRM Bank. The CDS has a standard annual coupon of 100 basis points and the current market spread on AHM01 bonds is 150 basis points. The initial value of the CDS contract is set to zero.\nFinally, Wang makes the following observations regarding two other investment-grade bonds, Bond X and Bond Y, each of which has a 5-year maturity and is option-free:\nBond X trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.25%.\nBond Y trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.75%.\nBelieving that the disparity in risk premiums is temporary, Wang considers a basis trade.", "Stephen Russo is a treasury analyst at Central Finance Inc., which specializes in financing equipment and real estate. Russo and his manager, Ericka Patry, meet to discuss anticipated changes to interest rates and the potential impact on Central Finance's portfolio.\nPatry and Russo discuss the differences between Treasury rates and swap rates for the same maturity. Russo makes the following two comments.\nComment 1: Differences between the two rates arise because of differences in default risk and liquidity risk\nComment 2: Given the opportunity for arbitrage, differences between the two rates are minimal\nIn Exhibit 1, Patry presents current government bond spot rates and swap rates for annual maturities up to three years.\nExhibit 1\n\t1-year\t2-year\t3-year\nSwap rates\t2.97%\t3.26%\t3.43%\nTreasury spot rates\t2.88%\t3.10%\t3.21%\nUsing the government rates, Russo determines the forward rate for a 1-year zero coupon bond issued one year from today.\nPatry and Russo next discuss the term structure of interest rates. Russo accepts the theory that yields are solely a function of the supply and demand for funds at a particular maturity.\nCentral Finance manages yield curve risk using key rate durations and reviews portfolio exposures when there is a 25 basis point change in the yield curve. For one of the firm's real estate portfolios, Patry shares with Russo the key rate durations and expected change in yield curve at various maturities in Exhibit 2.\nExhibit 2\nMaturity\tKey Rate Duration\tChange in Yield Curve (bps)\n1 year\t0.4444\t18\n5 years\t0.5129\t35\n10 years\t1.1030\t57", "Joao Viniciu is an equity analyst researching Pedra S.A., a Brazilian multinational corporation. Pedra reports under IFRS with a fiscal year end of 31 December. Its reporting currency is the Brazilian Real (BRL).\nViniciu analyzes the sustainability of net sales growth for each of Pedra’s geographic segments. Exhibit 1 shows the components of total net sales growth for each of these segments.\nExhibit 1\nGeographic Segment\tContribution from Volume Growth\tContribution from Price Growth\tContribution from Foreign Currency Exchange\tTotal Net Sales Growth\nEurope\t4.6%\t1.9%\t1.4%\t7.9%\nAmericas\t0.7%\t1.1%\t4.3%\t6.1%\nAsia Pacific\t3.6%\t2.1%\t1.8%\t7.5%\nFor his research, Viniciu uses the BRL/USD (number of BRL per 1 USD) exchange rate information for the most recent year as shown in Exhibit 2.\nExhibit 2\n\tBRL/USD\n1 January\t5.07\n1 November\t5.53\n31 December\t5.45\nAverage for the year\t5.26\nOn 1 November of the most recent year, Pedra purchased imported goods worth USD 3.2 million on credit from an unaffiliated US supplier. The amount payable for these imported goods by Pedra was still outstanding as of 31 December.\nCarro Corp. is one of Pedra’s wholly-owned US-based subsidiaries. Pedra translates Carro’s financial statements using the current rate method based on the rates in Exhibit 2. Carro's only non-monetary assets are inventory and fixed assets, while all of its liabilities are monetary. Carro's inventory and fixed assets were purchased at a BRL/USD rate of 5.24. Viniciu analyzes the effect of the translation method on Carro’s debt-to-assets ratio for the most recent year.\nOver the current year, Viniciu expects that Carro will maintain a stable net asset balance sheet exposure and that the BRL will weaken against the USD.", "Darren Carter is a credit analyst reviewing Gowran Bank. The bank is subject to the Basel III regulatory framework and prepares its financial statements under IFRS.\nCarter first considers Gowran's capital adequacy. For the most recent year end, Gowran reported Common Equity Tier 1 Capital of $15 billion and risk-weighted assets of $100 billion. Carter determines Gowran's pro forma year-end Common Equity Tier 1 Capital ratio to account for the following two events, which occurred after the most recent year end.\nGowran issued $1 billion of Additional Tier 1 Capital.\nThe regulator required Gowran to recognize an additional $3.5 billion of operational risk-weighted assets.\nCarter next assesses Gowran's asset quality by analyzing the adequacy of its allowance for loan losses. Specifically, he examines how the ratio of the bank's allowance for loan losses to non-performing loans changed during the most recent year based on the data (in millions) in Exhibit 1.\nExhibit 1\nNon-performing loans at start of year\t$2,000\nNon-performing loans at end of year\t$2,400\nAllowance for loan losses at start of year\t$1,500\nProvision for loan losses during the year\t$500\nCharge-offs, net of recoveries, during the year\t$200\nGowran has a defined benefit pension plan (Plan A) that is closed to new members. Carter determines the effect of this pension plan on Gowran's income statement.\nAs part of its executive management compensation, Gowran also has a stock option plan (Plan B). Three years ago, Gowran granted executives 5 million at-the-money stock options with a three-year vesting period. On the grant date, Gowran's share price was $12 and the fair value of each option was $3. All of the options are now vested in the current year. Carter determines the effect on Gowran's paid-in capital on its balance sheet in the current year, assuming that 2 million of the stock options are exercised at the strike price of $12 and Gowran's share price is currently $18.", "<p>Halvorsen Ridge Capital is a boutique asset manager with 140 discretionary client accounts. Ingrid Solberg, CFA, the firm's chief investment officer, is preparing to launch a private-credit sleeve that will lend directly to mid-sized companies. Loans in the sleeve have maturities of four to six years, and investors may redeem only after a five-year lock-up. Tomas Reyes, a Level III CFA candidate, is the portfolio manager responsible for the firm's balanced accounts.<\/p>\n<p>Solberg proposes moving 15% of every balanced account into the sleeve, arguing that \"private credit lowers the volatility of the overall portfolio, so it is appropriate for every balanced client.\" One of Reyes's balanced clients is the Mertens Trust. The trust's investment policy statement (IPS), last updated four years ago, limits holdings to publicly traded securities and notes that the trust pays its beneficiaries a fixed distribution every January. The trustee has not been contacted about the sleeve.<\/p>\n<p>While the sleeve is being organized, Reyes receives 24,000 shares of the oversubscribed initial public offering of Norvik Energy. The issue is suitable for three of his accounts, which submitted indications of interest before the offering: the Calder Foundation (30,000 shares), the Albrecht Family Office (20,000 shares), and an account owned by Reyes's brother-in-law, Jens Lund (10,000 shares). Lund's account pays the firm's standard advisory fee. Reyes also entered an order for 5,000 shares for his personal account. Halvorsen Ridge's written policy states that employees may not participate in oversubscribed offerings and that IPO shares are allocated to client accounts in proportion to their indications of interest.<\/p>\n<p>To market the sleeve, Solberg drafts a presentation built around the firm's Direct Lending Composite, which reports an annualized five-year return of 9.8%. Two accounts that terminated in the third year after suffering loan losses are not included anywhere in the composite's history; including them would reduce the five-year return to 8.1%. A footnote states that all returns are shown gross of management fees and that net-of-fee returns are available on request.<\/p>\n<p>Seeking anchor investors, Reyes e-mails the Albrecht Family Office's current holdings and its projected liquidity needs to Kestrel Fund Services, an outside fund administrator that maintains a list of potential co-investors. Kestrel signed a non-disclosure agreement with Halvorsen Ridge. Reyes did not ask the family office before sending the information, but he informed Solberg afterward.<\/p>", "<p>Valtek Industrial Holdings, a manufacturer of packaging machinery, prepares its financial statements under IFRS. Valtek is not a venture capital organization, mutual fund, or similar entity. On 1 January 2025, Valtek completed two transactions.<\/p>\n<p>First, it paid &euro;84 million for 35% of the voting shares of Orsa Components, a supplier of precision bearings. Valtek appointed two of Orsa's seven directors and accounts for the investment using the equity method. At the acquisition date, the fair values of Orsa's assets and liabilities equaled their book values except for plant and equipment, as shown in Exhibit 1.<\/p>\n<p>Second, Valtek paid &euro;240 million in cash for 80% of Brenna Systems, a maker of food-grade conveyor belts. Valtek controls Brenna and accounts for the business combination using the acquisition method. Brenna holds an operating licence for food-contact manufacturing that Brenna developed internally; the licence is not recorded on Brenna's balance sheet but can be sold separately, and an independent appraiser valued it at &euro;40 million. Valtek's CFO, Paulina Rademacher, elects the full goodwill method and estimates the fair value of the noncontrolling interest using the price Valtek paid per share.<\/p>\n<p>Rademacher is preparing a presentation for analysts. Lukas Engel, a junior analyst, asks how Valtek's ratios would have differed had Brenna been accounted for using the equity method instead of being consolidated. Engel also asks how the Orsa investment would have been reported if Valtek prepared its statements under US GAAP.<\/p><div class=\"tb

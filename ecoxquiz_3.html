be is skeptical of the structural approach because Calloway has substantial operating lease commitments and pension obligations.<\/p>\n<p>Finally, the committee discusses how Calloway's spread could change. Three members make the following comments:<\/p>\n<ul><li>Comment 1: \"If the economy moves toward recession, Calloway's credit spread should widen because default probabilities would rise and expected recovery rates would fall.\"<\/li>\n<li>Comment 2: \"If uncertainty about future inflation increases, Calloway's credit spread over the government benchmark should widen.\"<\/li>\n<li>Comment 3: \"If we raised our recovery rate assumption from 35% to 45% and left the hazard rate unchanged, the bond's fair value would fall and its credit spread would widen.\"<\/li><\/ul><div class=\"tbl\"><table><caption>Exhibit 1: Calloway Rail Corporation Bond — Credit Valuation Inputs<\/caption><thead><tr><th>Input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Government benchmark yield curve<\/td><td>Flat at 3.0% (annual compounding)<\/td><\/tr><tr><td>Risk-neutral hazard rate (from CDS spreads), per year<\/td><td>1.8%<\/td><\/tr><tr><td>Historical average annual default rate, BBB issuers<\/td><td>0.8%<\/td><\/tr><tr><td>Recovery rate, senior unsecured<\/td><td>35%<\/td><\/tr><tr><td>Recovery rate, subordinated<\/td><td>20%<\/td><\/tr><tr><td>Coupon / remaining maturity<\/td><td>5.0% annual / 3 years<\/td><\/tr><tr><td>Market price<\/td><td>102.60<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s20-q2", "rel": [], "los": "Agent Mock 1 Q78", "tier": null, "type": "", "stem": "The credit spread implied by Moretti's fair value of the Calloway bond is <i>closest<\/i> to:", "options": {"A": "0.54%.", "B": "1.06%.", "C": "1.21%."}}]}, {"set": 25, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Margaret Smith is a consultant specializing in private company valuations. She evaluates Lytham Corporation, a small, family-owned company whose CEO is a member of the controlling family. Smith wants to normalize Lytham&#x27;s reported operating income to compare it with public companies in the same industry. She notes the following items:<\/p><p>The current annual salary of Lytham&#x27;s CEO is $600,000. The annual salary of a similarly qualified CEO of a comparable public company is $1,000,000.<\/p><p>Lytham owns a luxury apartment in Singapore that is used by the CEO for both business and personal travel. The apartment would be sold if Lytham were a public company. The annual operating costs for the property are $200,000 per year and the annual depreciation expense is $200,000.<\/p><p>Lytham pays 15% of its net income in dividends to its owners. Smith believes the payout ratio would be closer to 50% if Lytham were a public company.<\/p><p>Smith calculates the required return on equity for Lytham using the expanded CAPM and the information in Exhibit 1. Smith determines that the appropriate industry risk premium is zero.<\/p><p>Exhibit 1<\/p><table><tr><th>Beta<\/th><th>1.3<\/th><\/tr><tr><td>Risk-free rate<\/td><td>6%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4%<\/td><\/tr><tr><td>Small-cap risk premium<\/td><td>3%<\/td><\/tr><tr><td>Company-specific risk premium<\/td><td>1%<\/td><\/tr><\/table><p>Calcyte is a publicly traded company with an equity value of $9,043 million. Smith conducts a valuation of Calcyte for a private buyout client who is interested in purchasing a controlling stake. She determines the relevant discount for lack of control to be 23% and the relevant discount for lack of marketability to be 20%.<\/p><p>Smith also values Ramabo Corporation, a privately held company with annual revenues of $10 million. Smith identifies comparable public companies and calculates an average EV/Sales multiple for each of Ramabo&#x27;s three business segments. She uses these multiples and the revenue generated by each segment in Exhibit 2 to calculate Ramabo&#x27;s EV based on the guideline public company method.<\/p><p>Exhibit 2<\/p><table><tr><th><\/th><th>Revenue (in $ Millions)<\/th><th>EV/Sales<\/th><\/tr><tr><td>Segment A<\/td><td>6<\/td><td>3.3<\/td><\/tr><tr><td>Segment B<\/td><td>3<\/td><td>1.2<\/td><\/tr><tr><td>Segment C<\/td><td>1<\/td><td>4.9<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q7", "rel": [], "los": "Mock 1 Session 1 Q7", "tier": null, "type": "", "stem": "<p>After applying the appropriate discounts or premiums, the value of Calcyte&#x27;s equity (in $ millions) to the private buyout client should be closest to:<\/p>", "options": {"A": "8,898.", "B": "9,395.", "C": "11,744."}}]}, {"set": 26, "session": 1, "topic": "Derivatives", "code": "DER", "vignette": "<p>Annika Ressler is treasurer of Vellmark Industrie AG, a German manufacturer of industrial pumps. She is preparing the quarterly derivatives report with Tomas Brandt, a treasury analyst. All interest rates are annualized; market reference rates (MRR) use a 30/360 add-on convention, and all other rates use annual compounding.<\/p>\n<p><b>Interest rate swap.<\/b> One year ago, Vellmark entered a three-year, &euro;250 million notional interest rate swap with semiannual settlements under which it pays a fixed rate of 2.40% and receives six-month MRR. The swap has just made its second settlement payment. Current MRR spot rates are shown in Exhibit 1. Ressler asks Brandt to report the swap's current value to Vellmark and whether it should be recorded as an asset or a liability.<\/p>\n<p><b>Equity forward.<\/b> Three months ago, Vellmark entered a nine-month forward contract to sell 1.5 million shares of Danholt Systems, a listed supplier in which it holds a non-strategic stake, at a forward price of &euro;50.00 per share. Danholt shares now trade at &euro;46.20. Danholt is expected to pay a dividend of &euro;0.80 per share in four months, before the forward contract expires. The risk-free rate is 3.50% for all maturities.<\/p>\n<p><b>Bond futures.<\/b> Vellmark plans to issue bonds in four months and is considering selling government bond futures that expire in four months as a hedge. Information on the cheapest-to-deliver bond is given in Exhibit 2. The four-month risk-free rate is 2.80%.<\/p>\n<p><b>Dealer quote.<\/b> Finally, Brandt shows Ressler a dealer quote for a three-month forward contract on a zero-coupon government note. The note trades at 97.10, the three-month risk-free rate is 2.80%, and the dealer's forward price is 97.45. Brandt asks whether an arbitrage opportunity exists and which trades would capture it.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Current MRR Spot Rates (30/360, add-on)<\/caption><thead><tr><th>Days to maturity<\/th><th>180<\/th><th>360<\/th><th>540<\/th><th>720<\/th><\/tr><\/thead><tbody><tr><td>MRR spot rate<\/td><td>2.90%<\/td><td>3.10%<\/td><td>3.25%<\/td><td>3.40%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Cheapest-to-Deliver Bond<\/caption><thead><tr><th>Item<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Annual coupon rate (paid annually, 30/360)<\/td><td>5.00%<\/td><\/tr><tr><td>Quoted (clean) price per 100 par<\/td><td>104.20<\/td><\/tr><tr><td>Days since last coupon payment<\/td><td>75<\/td><\/tr><tr><td>Conversion factor<\/td><td>1.0850<\/td><\/tr><tr><td>Coupon payments before futures expiration<\/td><td>None<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s09-q2", "rel": [], "los": "Agent Mock 1 Q34", "tier": null, "type": "", "stem": "The current value of the Danholt forward contract to Vellmark is <i>closest<\/i> to:", "options": {"A": "&euro;4.42 million.", "B": "&euro;4.98 million.", "C": "&euro;5.61 million."}}]}, {"set": 27, "session": 2, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "CI:SCH-R14-01", "rel": [], "los": "CI · Schweser MQ 14.1 Q1", "tier": null, "type": "", "stem": "<p>The principal–agent problem is most severe under a corporate ownership structure of:<\/p>", "options": {"A": "dispersed ownership and dispersed voting power.", "B": "concentrated ownership and concentrated voting power.", "C": "dispersed ownership and concentrated voting power."}}, {"id": "CI:SCH-R14-02", "rel": [], "los": "CI · Schweser MQ 14.1 Q2", "tier": null, "type": "", "stem": "<p>A corporation’s two-tier board of directors is most likely to consist of a(n):<\/p>", "options": {"A": "executive board that oversees an internal board.", "B": "external board that oversees a nonexecutive board.", "C": "supervisory board that oversees a management board."}}, {"id": "CI:SCH-R14-03", "rel": [], "los": "CI · Schweser MQ 14.2 Q1", "tier": null, "type": "", "stem": "<p>CEO duality refers to a situation where the chief executive officer (CEO):<\/p>", "options": {"A": "is a shareholder in the company.", "B": "serves as chairperson of the board.", "C": "has been granted superior or even sole voting rights."}}, {"id": "CI:VAR-M2-02", "rel": [], "los": "CI · 변형 (오답노트 R14, Schweser LOS 14.c)", "tier": null, "type": "", "stem": "<p>Compared with an issuer&#x27;s conventional bonds, a green bond issued by the same company most likely has:<\/p>", "options": {"A": "a higher credit rating because its proceeds fund environmental projects.", "B": "the same recourse and credit rating as the issuer&#x27;s other bonds.", "C": "no exposure to greenwashing risk."}}]}, {"set": 28, "session": 2, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Lena Okafor, CFA, is a senior equity analyst at Brightwater Securities, a broker-dealer with research, trading, and investment-banking divisions. She covers medical-device companies, including Torvane Medical, on which she has had a Buy rating for two years. Brightwater's investment-banking division is competing to be lead underwriter of a secondary share offering that Torvane expects to announce in about two months. Under Brightwater's policy, a company is placed on the firm's restricted list only once an offering is formally announced; Torvane is not on the list.<\/p>\n<p>Okafor is preparing an update report on Torvane with Marcus Hale, a research associate and CFA Level II candidate. Hale proposes building the report's revenue model on a five-year global demand forecast for cardiac stents published by Medlytics, an independent consultancy. \"Brightwater has bought Medlytics forecasts for years,\" Hale says, \"so we can drop the numbers straight into the model.\" Brightwater has no formal process for reviewing purchased research, and neither Hale nor Okafor has examined how Medlytics built the forecast.<\/p>\n<p>For the update, Okafor replaces her discounted cash flow model with a valuation based on peer EV/EBITDA multiples, because Torvane's new product cycle makes long-range cash flows hard to estimate. The draft report states the change of method and the reason for it in its first paragraph. The draft's summary also says, \"Torvane's new drug-coated stent will capture 20% of the European market by 2028.\" That figure is Okafor's own projection, but the draft does not identify it as an estimate.<\/p>\n<p>Okafor's revised analysis supports a Hold rating, and she tells colleagues that she plans to downgrade the stock. The next day, Victor Stanhope, head of investment banking, emails her: \"Torvane's CFO has heard about a possible downgrade, and we are close to winning the mandate. Please keep the Buy rating until after the offering. You can always revisit it later.\"<\/p>\n<p>Before the report is issued, Okafor reviews her potential conflicts. She owns 1,200 Torvane shares that she bought four years ago; the purchase was pre-cleared by Brightwater's compliance department under the firm's personal-trading policy. Last month she attended Torvane's annual investor day, where the company provided a buffet lunch to all attending analysts; Okafor paid for her own travel and hotel. Brightwater has disclosed its pursuit of the underwriting mandate to compliance, but the draft report contains no disclosures.<\/p>", "exhibits": [], "qs": [{"id": "cMock1:m1-s11-q4", "rel": [], "los": "Agent Mock 1 Q44", "tier": null, "type": "", "stem": "Which of the following matters is Okafor required to disclose in the Torvane report?", "options": {"A": "Brightwater's pursuit of the underwriting mandate only.", "B": "Her ownership of Torvane shares and Brightwater's pursuit of the underwriting mandate.", "C": "Her ownership of Torvane shares, Brightwater's pursuit of the underwriting mandate, and the lunch provided at the investor day."}}]}, {"set": 29, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Mark Crawley is an analyst at a London-based private equity firm and is reviewing the firm’s file on Thames Air Plc (Thames), a company it provides financing for. Thames uses International Financial Reporting Standards (IFRS) in the preparation of its financial statements. Thames is a relatively new airline based in the United Kingdom specializing in flights and vacation packages to Mediterranean locations, primarily Spain. Thames sells most of its flights and vacation packages to British residents in British pounds (GBP) and considers the costs of local competitors’ packages when determining its prices. Costs are incurred in multiple currencies:<\/p><p>Wage costs are primarily in GBP.<\/p><p>Typical of the industry, airline fuel and lease costs are normally priced in US dollars (USD).<\/p><p>The landing fees paid at the vacation-area airports are in the local currency, primarily euros (EUR).<\/p><p>First, Crawley turns his attention to the effect of the transactions undertaken in various currencies by Thames.<\/p><p>He reviews the change in the exchange rate for the USD to GBP during 2015, shown in Exhibit 1, and wonders what the effect of this change was on Thames’s operating income.<\/p><p>At year-end (31 December), Thames had a large outstanding payable in Spain related to landing fees that were incurred there evenly over the final quarter. The company paid the amount in full on its due date of 28 February. Crawley observed that the EUR to GBP exchange rate had changed between when the costs were incurred and the year-end and again by the payment date, as also shown in Exhibit 1.<\/p><p>Exhibit 1 Selected Exchange Rate Data<\/p><table><tr><th><\/th><th>GBP/USD Close<\/th><th>GBP/EUR Close<\/th><\/tr><tr><td>1-Jan-15<\/td><td>0.64<\/td><td>---<\/td><\/tr><tr><td>30-Jun-15<\/td><td>---<\/td><td>0.72<\/td><\/tr><tr><td>31-Dec-15<\/td><td>0.68<\/td><td>0.75<\/td><\/tr><tr><td>28-Feb-16<\/td><td>---<\/td><td>0.73<\/td><\/tr><tr><td>Average, 1 July–31 December 2015<\/td><td>---<\/td><td>0.7325<\/td><\/tr><tr><td>Average, 1 October–31 December 2015<\/td><td>---<\/td><td>0.74<\/td><\/tr><\/table><p>Because of the growing demand for vacation rentals in Spain during the past year, Thames acquired 100% of Tagus SA (Tagus), a Spanish company that owns a small vacation hotel and a few villas. Tagus has long-term debt outstanding from a Spanish bank that financed the 2012 purchase of the vacation properties, which will now be rented as part of the vacation packages offered by Thames. Tagus incurs all costs related to operating and maintaining the rental properties in EUR.<\/p><p>Since the acquisition, all of Tagus’s revenue comes from Thames’s sales in Britain of the vacation packages. Tagus receives the amounts in GBP. But Tagus hopes to expand and start renting out any excess capacity of the properties, or newly acquired properties, to local tourists in the next few years. Crawley notices that Thames is using the temporal method to translate Tagus’s financial statements prior to consolidation and asks another analyst, Dee Chopra, if this is appropriate.<\/p><p>Crawley next reviews the information in Exhibit 2 related to the Tagus acquisition to consider the effect on Thames’s year-end financial statements (31 December 2015).<\/p><p>Exhibit 2 Selected Financial Information of Tagus SA at Acquisition and Year-End (EUR thousands)<\/p><table><tr><th><\/th><th>Balance Sheet<\/th><th><\/th><th>Income Statement<\/th><th><\/th><\/tr><tr><td><\/td><td>Date of Acquisition (30 June 2015)<\/td><td>Year-End (31 December 2015)<\/td><td>Six-Month Period Ending 31 December 2015<\/td><td><\/td><\/tr><tr><td>Cash and accounts receivable<\/td><td>4,000<\/td><td>4,200<\/td><td>Revenues<\/td><td>8,200<\/td><\/tr><tr><td>Inventory<\/td><td>2,000<\/td><td>2,250<\/td><td>Operating costs<\/td><td>6,485<\/td><\/tr><tr><td>Capital assets<\/td><td>15,000<\/td><td>14,625<\/td><td>Operating income<\/td><td>1,715<\/td><\/tr><tr><td>Total assets<\/td><td>21,000<\/td><td>21,075<\/td><td>Interest expense<\/td><td>395<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td>Earnings before taxes<\/td><td>1,320<\/td><\/tr><tr><td>Current liabilities<\/td><td>3,500<\/td><td>3,400<\/td><td>Income taxes<\/td><td>395<\/td><\/tr><tr><td>Long-term debt<\/td><td>10,000<\/td><td>9,750<\/td><td>Earnings after tax<\/td><td>925<\/td><\/tr><tr><td>Share capital<\/td><td>5,000<\/td><td>5,000<\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td>Dividends<\/td><td>500<\/td><\/tr><tr><td>Retained earnings<\/td><td>2,500<\/td><td>2,925<\/td><td><\/td><td><\/td><\/tr><\/table><p>As the final step in his review, Crawley starts a ratio analysis of Thames and Tagus, and he asks Chopra which ratios, if any, would be unaffected by Thames’s choice of translation method for Tagus.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q42", "rel": [], "los": "FSA · ECO Module 3 Q42", "tier": null, "type": "", "stem": "<p>Which of the following statements about the effect of the change in the USD to GBP exchange rate during the year is most accurate? Operating income for Thames would:<\/p>", "options": {"A": "increase because of the positive effect on revenues.", "B": "increase because of the positive effect on operating costs.", "C": "decrease because of the negative effect on operating costs."}}, {"id": "FSA:ECO-M3-Q43", "rel": [], "los": "FSA · ECO Module 3 Q43", "tier": null, "type": "", "stem": "<p>Which of the following best describes the effect on Thames’s financial statements of the payment terms related to the landing fees in Spain? Thames would:<\/p>", "options": {"A": "report an unrealized exchange loss at year-end.", "B": "defer recognizing any currency effects until the payable is paid.", "C": "adjust the landing fees expense to reflect the change in exchange rate when they are paid."}}]}, {"set": 30, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>June Withers is analyzing four stocks in the processed food industry as of 31 December 2019. All stocks pay a dividend at the end of each year.<\/p><p>Ukon Corporation<\/p><p>Withers estimates a required rate of return for Ukon Corporation of 8% and notes that the dividend for 2019 was EUR 2.315 per share. Her first valuation approach is a basic two-stage DDM, with dividends growing at a rate of 5% from 2020 through 2023, after which time dividends will grow at a sustainable rate of 3%. Her second valuation approach is the H-model, assuming that dividend growth of 5% in 2020 declines linearly during the years 2021 through 2023 to the 3% growth rate after 2023. Exhibit 1 summarizes Withers’s dividend growth assumptions.<\/p><p>Exhibit 1<\/p><p>Ukon Corporation Dividend Growth Assumptions, by Model<\/p><table><tr><th>Model<\/th><th>Period<\/th><th>Rate<\/th><\/tr><tr><td>Two-stage DDM<\/td><td>2020 through 2023<\/td><td>5%<\/td><\/tr><tr><td><\/td><td>Beginning 2024<\/td><td>3%<\/td><\/tr><tr><td>H-model<\/td><td>2020<\/td><td>5%<\/td><\/tr><tr><td><\/td><td>2021 through 2023<\/td><td>Declining linearly to 3.5%<\/td><\/tr><tr><td><\/td><td>Beginning 2024<\/td><td>3%<\/td><\/tr><\/table><p>Venus Company<\/p><p>Withers has assembled the data on Venus Company in Exhibit 2. After analyzing competitive pressures and financial conditions in the industry, she predicts that Venus Company will lose market share because of new entrants but will stabilize within a few years. The required rate of return for Venus Company is 8%. Beginning with a per-share dividend of USD3.15 in 2019, she develops two scenarios regarding Venus Company’s dividend growth. The scenarios, shown in Exhibit 2, are summarized as follows:<\/p><p>In Scenario 1, the growth rate will fall in a linear manner over the years 2020 through 2023 from 8% to 4%. Using the H-model, Withers calculates a value of USD58.79 per share of Venus Company stock.<\/p><p>In Scenario 2, the growth rate falls from 8% in 2019 to 6% in 2020 and 2021, to 5% in 2022 and 2023, and then to a sustainable rate of 3% for 2024 and beyond.<\/p><p>Exhibit 2<\/p><p>Venus Company Dividend Growth Scenarios<\/p><table><tr><th>Scenario<\/th><th>Period<\/th><th>Rate<\/th><\/tr><tr><td>Scenario 1<\/td><td>2020 through 2023<\/td><td>Declining linearly to 4%<\/td><\/tr><tr><td><\/td><td>Beginning 2024<\/td><td>Remaining stable at 4%<\/td><\/tr><tr><td>Scenario 2<\/td><td>2020 and 2021<\/td><td>6%<\/td><\/tr><tr><td><\/td><td>2022 and 2023<\/td><td>5%<\/td><\/tr><tr><td><\/td><td>Beginning 2024<\/td><td>Remaining stable at 3%<\/td><\/tr><\/table><p>Wakuni Corporation<\/p><p>Withers evaluates Wakuni Corporation and uses recent financial data from Exhibit 3 to calculate a sustainable growth based on the DuPont model. In addition to this estimate, she performs a sensitivity analysis on the sustainable growth rate whereby the dividend payout ranges from 0% to 10% and the return on equity ranges from 8% to 12%.<\/p><p>Exhibit 3<\/p><p>Selected Data for Wakuni Corporation (JPY billions)<\/p><table><tr><th>Net income<\/th><th>43,923<\/th><\/tr><tr><td>Sales<\/td><td>423,474<\/td><\/tr><tr><td>Total assets, average during year<\/td><td>486,203<\/td><\/tr><tr><td>Shareholders’ equity, beginning of year<\/td><td>397,925<\/td><\/tr><tr><td>Dividends paid<\/td><td>1,518<\/td><\/tr><\/table><p>Xavier Corporation<\/p><p>In her analysis of the stock of Xavier Corporation, Withers observes that it has a dividend of USD2 per share and a stock price of USD52. Two analyst interns have offered estimates of the company’s required rate of return and dividend growth rate, as shown in Exhibit 4.<\/p><p>Exhibit 4<\/p><p>Xavier Corporation Required Rate of Return and Dividend Growth Rates (Estimates)<\/p><table><tr><th><\/th><th>Intern 1<\/th><th>Intern 2<\/th><\/tr><tr><td>Required rate of return<\/td><td>8.3%<\/td><td>7.8%<\/td><\/tr><tr><td>Growth rate, first four years<\/td><td>5.0%<\/td><td>4.8%<\/td><\/tr><tr><td>Growth rate, beyond first four years<\/td><td>3.6%<\/td><td>4.0%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Equity:ECO-M2-Q29", "rel": [], "los": "Equity · ECO Module 2 Q29", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, when Withers applies the first valuation approach to Ukon Corporation, the estimated value of the stock at the end of the first stage represents the:<\/p>", "options": {"A": "present value of the dividends beyond year 2023.", "B": "present value of the dividends for years 2020 through 2023.", "C": "sum of the present value of the dividends for 2020 through 2023 and the present value of dividends beyond year 2023."}}, {"id": "Equity:ECO-M2-Q36", "rel": [], "los": "Equity · ECO Module 2 Q36", "tier": null, "type": "", "stem": "<p>Based on Exhibit 4 and Intern 1’s analysis, Xavier Corporation’s sustainable dividend payout ratio is closest to:<\/p>", "options": {"A": "43.4%.", "B": "44.6%.", "C": "56.6%."}}]}, {"set": 31, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Fazly Ahmad is an equity analyst researching Rose Mass Rapid Limited (RMRL), a Canadian transport operator. RMRL reports under IFRS and has a 31 December year end. Ahmad compares RMRL to one of its competitors, Orchid Mass Transit Inc., which reports under US GAAP and also has a 31 December year end.<\/p><p>On 1 January of the current year, RMRL purchased a 30% interest in Begonia Bus Inc.&#x27;s outstanding common equity for $12,000,000. The excess purchase price was $2,150,000. Half of the excess was attributable to Begonia&#x27;s plant and equipment, and the other half was attributable to land. Begonia depreciates its plant and equipment using the straight-line method with a remaining useful life of 10 years and zero residual value. RMRL has the ability to exercise significant influence over Begonia. Ahmad expects Begonia to report net income of $1,500,000 for the current year and not pay any dividends. Ahmad assumes Begonia does not have any intercompany transactions with RMRL. He then estimates the carrying value of RMRL&#x27;s investment in Begonia at the end of the current year.<\/p><p>During the current year, RMRL acquired 80% of the outstanding shares of Petunia Transit Co. in exchange for common shares of RMRL. At the time of the acquisition, RMRL accounted for the acquisition using the partial goodwill method (Method 1). Also during the current year, Orchid acquired a controlling interest in another company and accounted for the acquisition using the full goodwill method (Method 2). Ahmad considers whether differences in the accounting treatment of these acquisitions could affect certain financial metrics.<\/p><p>Ahmad reviews the trend in RMRL&#x27;s balance-sheet-based and cash-flow-based accruals ratios, as well as the trend in the Beneish M-scores and Altman Z-scores over the past two years, using the data in Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Most Recent Year<\/th><th>Two Years Ago<\/th><\/tr><tr><td>Balance-sheet-based accruals ratio<\/td><td>4.3%<\/td><td>0.6%<\/td><\/tr><tr><td>Cash-flow-based accruals ratio<\/td><td>1.7%<\/td><td>–2.5%<\/td><\/tr><tr><td>Beneish M-score<\/td><td>–1.94<\/td><td>–1.43<\/td><\/tr><tr><td>Altman Z-score<\/td><td>1.54<\/td><td>1.85<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q9", "rel": [], "los": "Mock 1 Session 1 Q9", "tier": null, "type": "", "stem": "<p>The estimated carrying value for RMRL&#x27;s investment in Begonia at the end of the current year should be:<\/p>", "options": {"A": "$12,342,500.", "B": "$12,450,000.", "C": "$13,392,500."}}]}, {"set": 32, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Halimah Yusuf is a portfolio manager at VSL Asset Management (VSLAM), based in Singapore. VSLAM provides customized portfolio management and investment consulting services to institutional clients. Yusuf is meeting with new analysts, John Cerra, Eunice Quek, and Inderjit Singh, to review the firm’s portfolio management models and techniques.<\/p><p>Yusuf welcomes everyone to the meeting and begins by stating, “We use multifactor models for portfolio construction as well as return and risk attribution.” She asks, “Can anyone tell me how arbitrage pricing theory (APT) is related to these multifactor models?”<\/p><p>Quek responds, “APT helps us determine the appropriate number of factors to use in a multifactor model; however, it does not specify the identity of those factors.”<\/p><p>Yusuf continues, “Multifactor models fall into one of three categories: macroeconomic factor models, fundamental factor models, and statistical factor models. For macroeconomic factor models, the factors are the value, or level, of selected macroeconomic variables. For fundamental factor models, the factors are company share attributes, such as price-to-earnings ratio and market capitalization. Finally, when using statistical factor models, we apply statistical techniques, such as factor analysis or principal component analysis, to derive factors that are portfolios of securities that best explain historical return covariances and variances.”<\/p><p>To explain the use of multifactor models for portfolio return attribution, Yusuf presents the group with portfolio and benchmark information in Exhibit 1. She also notes the risk-free rate of return is 1.3%.<\/p><p>Exhibit 1 Multifactor Model Data<\/p><table><tr><th>Factor<\/th><th>Portfolio Sensitivity<\/th><th>Benchmark Sensitivity<\/th><th>Factor Return<\/th><\/tr><tr><td>Market<\/td><td>1.05<\/td><td>1<\/td><td>3.5%<\/td><\/tr><tr><td>Small-Cap<\/td><td>0.5<\/td><td>0.3<\/td><td>4.7%<\/td><\/tr><tr><td>Value<\/td><td>–0.6<\/td><td>0.2<\/td><td>–4.5%<\/td><\/tr><tr><td>Momentum<\/td><td>0.5<\/td><td>0.1<\/td><td>5.1%<\/td><\/tr><\/table><p>Yusuf asks the group to use Exhibit 1 to characterize the portfolio manager’s investment style. Cerra responds, “This manager has a large-cap orientation and follows a contrarian strategy with a growth bias.”<\/p><p>Yusuf continues, “Based on your review of the information in Exhibit 1 and given that the portfolio manager’s active return from security selection is 1.5%, I would like each of you to identify the factor that contributes the most to the manager’s active return.” The analysts respond as follows:<\/p><p>Cerra says, “My calculations suggest that it is the Value factor.”<\/p><p>Quek responds, “I disagree. In my view, it is the Momentum factor.”<\/p><p>Singh states, “No, my analysis indicates that it is the Market factor.”<\/p><p>Finally, Yusuf provides the group with the information in Exhibit 2 and states, “As I previously stated, multifactor models can also be used to identify a portfolio manager’s risk exposures. Please use the information in Exhibit 2 to identify the portfolio with the highest active factor risk related to style factors, relative to active risk.”<\/p><p>Exhibit 2 Active Risk Squared Analysis for Selected Portfolios (Entries Are in Percentage Squared)<\/p><table><tr><th>Portfolio<\/th><th>Active Factor: Industry<\/th><th>Active Factor: Style<\/th><th>Active Factor: Total<\/th><th>Active Specific<\/th><th>Active Risk Squared<\/th><\/tr><tr><td>X<\/td><td>12<\/td><td>28<\/td><td>40<\/td><td>24<\/td><td>64<\/td><\/tr><tr><td>Y<\/td><td>7.2<\/td><td>14.4<\/td><td>21.6<\/td><td>14.4<\/td><td>36<\/td><\/tr><tr><td>Z<\/td><td>4<\/td><td>10<\/td><td>14<\/td><td>2<\/td><td>16<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "PM:ECO-M4-Q31", "rel": [], "los": "PM · ECO Module 4 Q31", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1 and other information provided by Yusuf, the expected return on the portfolio is closest to:<\/p>", "options": {"A": "8.90%.", "B": "11.28%.", "C": "12.58%."}}, {"id": "PM:ECO-M4-Q33", "rel": [], "los": "PM · ECO Module 4 Q33", "tier": null, "type": "", "stem": "<p>Which of the following analysts most likely provides the correct answer to Yusuf’s question on the contribution to active return?<\/p>", "options": {"A": "Quek", "B": "Cerra", "C": "Singh"}}]}, {"set": 33, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Halvern Foods Inc. is a US-based packaged-food company that prepares its financial statements under US GAAP in US dollars. Priya Natarajan, an equity analyst, is reviewing Halvern's Brazilian subsidiary, Halvern Alimentos Ltda., which Halvern formed on 1 January 2024 by contributing BRL300 million of capital.<\/p>\n<p>Alimentos sells canned vegetables to Brazilian supermarket chains. Its selling prices are set in Brazilian reais (BRL) and are driven mainly by competition from local producers and by Brazilian food-pricing regulations. Nearly all of its labor and raw materials are sourced in Brazil and paid in reais, and its long-term debt is a BRL-denominated loan from a Brazilian bank. Alimentos retains its operating cash in reais. Each year it pays a dividend to Halvern, which converts the dividend into dollars, and it occasionally imports packaging machinery from the United States. Brazil is not considered a hyperinflationary economy.<\/p>\n<p>Alimentos reported net income of BRL70 million in 2024 and BRL110 million in 2025. It paid no dividend in 2024 and declared a BRL30 million dividend in 2025. Its condensed balance sheet and relevant exchange rates are shown in Exhibits 1 and 2. The real depreciated steadily against the dollar during 2025. Alimentos uses the FIFO inventory method, and its inventory turns over about every four months.<\/p>\n<p>Natarajan also notes that on 20 November 2025, Halvern's US operations sold goods to a German retailer for &euro;12 million, with payment due in euros on 20 February 2026. The euro weakened against the US dollar between 20 November and 31 December 2025.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Halvern Alimentos Ltda. Balance Sheet, 31 December 2025<\/caption><thead><tr><th>Assets<\/th><th>BRL millions<\/th><th>Liabilities and equity<\/th><th>BRL millions<\/th><\/tr><\/thead><tbody><tr><td>Cash<\/td><td>80<\/td><td>Accounts payable<\/td><td>90<\/td><\/tr><tr><td>Accounts receivable<\/td><td>120<\/td><td>Long-term debt<\/td><td>260<\/td><\/tr><tr><td>Inventory<\/td><td>150<\/td><td>Common stock<\/td><td>300<\/td><\/tr><tr><td>Property, plant, and equipment (net)<\/td><td>450<\/td><td>Retained earnings<\/td><td>150<\/td><\/tr><tr><td><b>Total assets<\/b><\/td><td><b>800<\/b><\/td><td><b>Total liabilities and equity<\/b><\/td><td><b>800<\/b><\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Exchange Rates<\/caption><thead><tr><th>Date or period<\/th><th>USD per BRL<\/th><\/tr><\/thead><tbody><tr><td>1 January 2024 (capital contributed)<\/td><td>0.2000<\/td><\/tr><tr><td>Average 2024<\/td><td>0.1920<\/td><\/tr><tr><td>31 December 2024<\/td><td>0.1880<\/td><\/tr><tr><td>Average 2025<\/td><td>0.1840<\/td><\/tr><tr><td>2025 dividend declaration date<\/td><td>0.1820<\/td><\/tr><tr><td>31 December 2025<\/td><td>0.1800<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s10-q2", "rel": [], "los": "Agent Mock 1 Q38", "tier": null, "type": "", "stem": "Under the method that Halvern should use, the cumulative translation adjustment for Alimentos at 31 December 2025 is <i>closest<\/i> to:", "options": {"A": "&minus;$7.22 million.", "B": "&minus;$6.00 million.", "C": "$7.22 million."}}]}, {"set": 34, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>FIQ Bank is a highly rated corporate and institutional bank that operates a client-facing credit default swap (CDS) desk. Larry Eckle is a CDS client strategist. Mark Priore is FIQ’s chief CDS trader. Eckle and Priore are meeting with Brian Bregen, a portfolio manager for BLB Fund, to discuss investment and trading strategies for bonds, CDSs, and equities.<\/p><p>Bregen begins the discussion by asking for a refresher on basic CDS concepts and parameters. Eckle replies that a CDS includes both a premium leg and a payment leg and that expected loss is among the functions that affect its price. Eckle provides information for a bond issued by Apollo Company.<\/p><p>Exhibit 1 Information for Apollo Bond<\/p><table><tr><th>Amount<\/th><th>$1,000.00<\/th><\/tr><tr><td>Coupon<\/td><td>5.00%<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><\/tr><tr><td>Probability of Default<\/td><td>Year 1: 2.0%. Year 2: 2.5%. Year 3: 3.0%<\/td><\/tr><tr><td>Recovery Rate<\/td><td>40%<\/td><\/tr><\/table><p>Bregen reviews the data and opines that the market is incorrectly assessing Apollo’s credit risk. He believes that Apollo’s conditional probability of default is 2.0% for Year 1, Year 2, and Year 3. Priore reviews Apollo’s CDSs and adds that the market is pricing no basis between Apollo’s bonds and its CDSs.<\/p><p>Bregen expresses confidence in Apollo’s credit condition over a longer cycle, stating that Apollo is likely to experience improving credit fundamentals over the next five years. Priore compares Apollo’s bonds with its CDSs. Priore notes that Apollo’s five-year bond has a 200 bp credit spread and that Apollo’s five-year CDS has a 400 bp up-front premium. The CDS is based on a 1.00% fixed coupon and has duration of four years. Priore suggests that FIQ and BLB execute a five-year naked CDS in which FIQ buys the CDS and BLB sells the CDS.<\/p><p>In building credit portfolios, Bregen conducts fundamental credit research on companies. He discusses observations on three separate companies that he has been researching. Bregen states that Webster has low leverage and that its free cash flow will increase because of its new product pipeline. Bregen describes Levrom as being highly leveraged following an acquisition whose integration, he believes, will be more complex than originally expected. Bregen shares his view that Hamsco may potentially be affected by environmental litigation following its recent purchase of a manufacturing facility that contains unremediated hazardous materials.<\/p><p>Priore believes that credit research should consider the proper pricing of credit risk. He states that basis trades are used by credit investors to ensure that the credit risk of bonds and CDSs is priced appropriately. He provides bond and CDS information for Webster, Hamsco, and Levrom. The current level of MRR is 2.00%.<\/p><p>Exhibit 2 Information for Three-Year Bonds and Three-Year CDSs<\/p><table><tr><th>Company<\/th><th>Bond Yield<\/th><th>CDS Spread<\/th><\/tr><tr><td>Webster<\/td><td>5.00%<\/td><td>3.00%<\/td><\/tr><tr><td>Hamsco<\/td><td>5.50%<\/td><td>3.25%<\/td><\/tr><tr><td>Levrom<\/td><td>5.25%<\/td><td>3.50%<\/td><\/tr><\/table><p>Eckle adds that speculation about company balance sheet recapitalizations frequently affects bond yields, CDS spreads, and stock prices. He outlines three such recapitalization scenarios for Webster, Hamsco, and Levrom and an associated CDS trade idea for each scenario.<\/p><p>Exhibit 3 Recapitalization Scenarios and Related Trade Ideas<\/p><table><tr><th><\/th><th>Recapitalization Scenario<\/th><th>Trade Idea<\/th><\/tr><tr><td>Scenario 1<\/td><td>Webster issues five-year debt to acquire 100% of Levrom equity at a premium.<\/td><td>Buy Webster CDS<\/td><\/tr><tr><td>Scenario 2<\/td><td>Levrom issues equity in a “follow-on” (post-IPO) equity offering to retire debt.<\/td><td>Buy Levrom CDS<\/td><\/tr><tr><td>Scenario 3<\/td><td>Hamsco issues five-year debt to acquire 100% of its public equity at a premium.<\/td><td>Sell Hamsco CDS<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "FI:ECO-M5-Q23", "rel": [], "los": "FI · ECO Module 5 Q23", "tier": null, "type": "", "stem": "<p>Based on the information in Exhibit 1, the expected loss for Apollo bond is most likely closest to:<\/p>", "options": {"A": "$35.28.", "B": "$48.03.", "C": "$90.00."}}]}, {"set": 35, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q85", "rel": [], "los": "FSA · ECO Module 3 Q85", "tier": null, "type": "", "stem": "<p>A US-based multinational corporation has a UK subsidiary with primary activities in Europe. The financial statements of the subsidiary for local regulators are most likely presented in:<\/p>", "options": {"A": "EUR.", "B": "GBP.", "C": "USD."}}, {"id": "FSA:ECO-M3-Q86", "rel": [], "los": "FSA · ECO Module 3 Q86", "tier": null, "type": "", "stem": "<p>Masswell corporation opens a foreign subsidiary and elects to report the subsidiary&#x27;s results using the current rate method. During the first year of operations, the foreign currency depreciates against Masswell&#x27;s home currency. Did the choice of reporting method affect Masswell&#x27;s reported operating income?<\/p>", "options": {"A": "No", "B": "Yes, operating income was lower than it would have been under the temporal method", "C": "Yes, operating income was higher than it would have been under the temporal method"}}, {"id": "FSA:SCH-M3-02", "rel": [], "los": "FSA · Schweser MQ 9.3 변형", "tier": null, "type": "", "stem": "<p>If a foreign subsidiary&#x27;s functional currency is the same as the parent&#x27;s presentation currency, the parent&#x27;s exposure to changing exchange rates is based on the subsidiary&#x27;s:<\/p>", "options": {"A": "total assets minus total liabilities.", "B": "monetary assets minus monetary liabilities.", "C": "non-monetary assets minus non-monetary liabilities."}}, {"id": "FSA:SCH-M3-10", "rel": [], "los": "FSA · Schweser MQ 9.7 변형", "tier": null, "type": "", "stem": "<p>A subsidiary operates in a hyperinflationary economy and its parent reports under IFRS. Which exposure results in a net purchasing power gain?<\/p>", "options": {"A": "Non-monetary assets", "B": "Monetary liabilities", "C": "Monetary assets"}}]}, {"set": 36, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q13", "rel": [], "los": "FI · ECO Module 1 Q13", "tier": null, "type": "", "stem": "<p>In a typical interest rate swap contract, the swap rate is best describedas the interest rate for the:<\/p>", "options": {"A": "fixed-rate leg of the swap.", "B": "floating-rate leg of the swap.", "C": "difference between the fixed and floating legs of the swap."}}, {"id": "FI:ECO-M1-Q80", "rel": [], "los": "FI · ECO Module 1 Q80", "tier": null, "type": "", "stem": "<p>The process of bootstrapping is most likely used to:<\/p>", "options": {"A": "derive the forward rate curve using the spot rate curve.", "B": "adjust for the shape of the par curve when deriving the spot rate curve.", "C": "derive zero-coupon rates using the par yields of coupon-paying government bonds."}}, {"id": "FI:ECO-M1-Q87", "rel": [], "los": "FI · ECO Module 1 Q87", "tier": null, "type": "", "stem": "<p>A German manufacturing company has an outstanding bond maturing in five years and trading with a YTM of 3.90%. If the 5-year Bund is yielding 2.65% and the fixed rate of a 5-year, fixed-for-float MRR swap is 3.20%, the swap spread is:<\/p>", "options": {"A": "55 bps.", "B": "70 bps.", "C": "125 bps."}}, {"id": "FI:ECO-M1-Q88", "rel": [], "los": "FI · ECO Module 1 Q88", "tier": null, "type": "", "stem": "<p>In contrast to the preferred habitat theory of the term structure of interest rates, the segmented market theory assumes that:<\/p>", "options": {"A": "borrowers and lenders have strong preferences for particular maturities.", "B": "investors will accept additional risk in return for additional expected returns.", "C": "yields are determined entirely by the supply and demand for funds of a particular maturity."}}]}, {"set": 37, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M6-Q20", "rel": [], "los": "FSA · ECO Module 6 Q20", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information about a company (in € millions):<\/p><table><tr><th>One-off income from associates and joint ventures<\/th><th>10<\/th><\/tr><tr><td>One-off revaluation loss<\/td><td>4<\/td><\/tr><tr><td>Recurring yearly provisions for restructuring activities<\/td><td>3<\/td><\/tr><tr><td>Profit before tax<\/td><td>30<\/td><\/tr><\/table><p>The adjusted profit before tax that best reflects the company&#x27;s core performance (in € millions) is:<\/p>", "options": {"A": "20.", "B": "24.", "C": "27."}}, {"id": "FSA:ECO-M6-Q24", "rel": [], "los": "FSA · ECO Module 6 Q24", "tier": null, "type": "", "stem": "<p>Which of the following situations most likely requires a company to restate its prior year financial statements?<\/p>", "options": {"A": "The cash-flow-based accruals ratio is exceptionally high", "B": "A significant amount of income is sourced from investments in associates", "C": "Changed accounting standards alter the calculation of benefit plan obligations"}}, {"id": "FSA:ECO-M6-Q27", "rel": [], "los": "FSA · ECO Module 6 Q27", "tier": null, "type": "", "stem": "<p>A financial analyst is preparing an investment recommendation report on a public company. To prepare the report, she analyzes the company’s financial statements following a framework comprising the following phases: (1) Define purpose of analysis, (2) Collect input data, (3) Process input data, (4) Analyze/Interpret data, (5) Develop and communicate recommendations, (6) Follow-up. Which of the following is most likely an output of phase 3?<\/p>", "options": {"A": "Financial data tables", "B": "List of questions to answer", "C": "Adjusted financial statements"}}]}, {"set": 38, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Daniel Pegham is a mergers and acquisitions analyst currently advising Horzak Digital, a privately owned, rapidly growing satellite dish manufacturer that reports in USD.<\/p><p>Pegham wants to use FCFE to value the company and recalls that some peers have used EBITDA as a proxy for FCFE. He concludes that EBITDA is not a good proxy for Horzak’s FCFE for two reasons. First, EBITDA fails to account for cash flows from new borrowings. Second, EBITDA understates cash flows for growth companies such as Horzak.<\/p><p>Instead, Pegham uses the indirect method to calculate FCFE, starting with Horzak’s previous year’s net income. Horzak had two unusual noncash items in the previous year: a USD 5 million after-tax reversal of noncash restructuring charges taken in the previous year, and a USD 2 million after-tax gain.<\/p><p>Horzak is entirely family-owned, and the president is the largest shareholder. Horzak is subject to a 30% tax rate. Pegham determines that, in the event of a takeover, his valuation should reflect two additional adjustments to normalize net income.<\/p><p>Board compensation was USD 1,500,000 in the previous year, compared to USD 800,000 at comparable companies.<\/p><p>Horzak has had free use of storage facilities owned by the company’s president for warehousing inventory. This benefit would otherwise have cost USD 150,000 in the previous year.<\/p><p>Lastly, Pegham evaluates Horzak using the capitalized cash flow method under the following assumptions.<\/p><p>Normalized FCFE in the current period (FCFE0) is USD 4.0 million.<\/p><p>The long-term growth rate of FCFE is 5%.<\/p><p>The market value of debt is USD 6.6 million.<\/p><p>The cost of equity is 17.5%.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M3-Q62", "rel": [], "los": "Equity · ECO Module 3 Q62", "tier": null, "type": "", "stem": "<p>To properly account for the two unusual noncash items when calculating FCFE, Horzak’s previous year’s net income should be:<\/p>", "options": {"A": "reduced by USD 7 million.", "B": "reduced by USD 3 million.", "C": "increased by USD 3 million."}}, {"id": "Equity:ECO-M6-Q25", "rel": [], "los": "Equity · ECO Module 6 Q25", "tier": null, "type": "", "stem": "<p>The estimated value (in USD millions) of Horzak’s equity under the capitalized cash flow method is closest to:<\/p>", "options": {"A": "27.0.", "B": "32.0.", "C": "33.6."}}]}, {"set": 39, "session": 2, "topic": "Alternative Investments", "code": "AI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "AI:ECO-M4-Q38", "rel": [], "los": "AI · ECO Module 4 Q38", "tier": null, "type": "", "stem": "<p>A fixed-income arbitrage fund implementing a duration-neutral strategy is most likely hedged against:<\/p>", "options": {"A": "large yield changes.", "B": "a steepening yield curve.", "C": "small shifts in the yield curve."}}, {"id": "AI:ECO-M4-Q39", "rel": [], "los": "AI · ECO Module 4 Q39", "tier": null, "type": "", "stem": "<p>Compared to managed futures funds, global macro funds are more likely to:<\/p>", "options": {"A": "be a consistent source of alpha.", "B": "take a systematic approach to implementation.", "C": "be early and overly anticipatory in their positioning."}}, {"id": "AI:ECO-M4-Q52", "rel": [], "los": "AI · ECO Module 4 Q52", "tier": null, "type": "", "stem": "<p>Multi-strategy funds have typically:<\/p>", "options": {"A": "outperformed funds-of-funds.", "B": "experienced lower volatility than funds-of-funds.", "C": "provided better redemption provisions than funds-of-funds."}}, {"id": "AI:ECO-M4-Q60", "rel": [], "los": "AI · ECO Module 4 Q60", "tier": null, "type": "", "stem": "<p>A convertible arbitrage hedge fund manager observes the following information about a convertible bond and the underlying stock:<\/p><table><tr><th>Convertible bond par value<\/th><th>$1,000,000<\/th><\/tr><tr><td>Bond price<\/td><td>$105<\/td><\/tr><tr><td>Annual coupon rate<\/td><td>5%<\/td><\/tr><tr><td>Conversion ratio<\/td><td>80,000<\/td><\/tr><tr><td>Stock price<\/td><td>$20<\/td><\/tr><tr><td>Borrowing cost per share<\/td><td>$4<\/td><\/tr><\/table><p>The manager buys the bond and sells the stock short. If the stock price falls by 10% over one year, the per-share profit of this strategy is closest to:<\/p>", "options": {"A": "–$3.38.", "B": "$2.88.", "C": "$3.50."}}]}, {"set": 40, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Julie Carlisle is a financial planner at a large wealth management firm. One of her clients, Esteban Blake, just received a sizable inheritance. He invests a portion of the inheritance in an annuity that will immediately increase his income by a substantial amount. He enlists Carlisle’s help to invest the remaining amount of the inheritance.<\/p><p>Blake informs Carlisle that he would like some short-term bonds in his portfolio. Carlisle proposes purchasing a one-year domestic government zero-coupon bond. It has a face value of $100 and is currently priced at $96.37. Carlisle estimates the one-year real risk-free rate at 1.15% and expects inflation over the next year to be 2.25%.<\/p><p>In an effort to provide Blake with some exposure to international markets, Carlisle proposes three countries to look for investment opportunities. Selected data on the three countries are presented in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Selected Macroeconomic Data<\/p><table><tr><th><\/th><th>Nominal GDP Growth<\/th><th>Inflation Rate<\/th><th>Volatility of Real GDP Growth<\/th><th>Yield Curve Shape<\/th><th>Trailing 12-Month Equity Index P/E<\/th><\/tr><tr><td>Country #1<\/td><td>6.5%<\/td><td>4.0%<\/td><td>Low<\/td><td>Flat<\/td><td>16.5<\/td><\/tr><tr><td>Country #2<\/td><td>5.0%<\/td><td>2.5%<\/td><td>High<\/td><td>Upward slope<\/td><td>17.3<\/td><\/tr><tr><td>Country #3<\/td><td>3.5%<\/td><td>2.0%<\/td><td>Low<\/td><td>Flat<\/td><td>18.2<\/td><\/tr><\/table><p>In her analysis, Carlisle observes that the spread between the three-year default-free nominal bond and the default-free real zero-coupon bond in Country #3 is 2.0%.<\/p><p>Blake expresses concern that stocks may be currently overvalued in Country 3 given its 20-year historical equity index P/E of 16.0. Carlisle comments,<\/p><p>I think the equilibrium P/E in Country #3 has increased because of changes in market conditions.<\/p><p>Carlisle predicts that Country #3 will slip into a recession next quarter. She thinks it will be short-lived, lasting only 12 months or so, and considers the impact of such a recession on the performance of the country’s stocks and bonds.<\/p><p>Exhibit 2<\/p><p>Three-Year Corporate Bonds from Country #3<\/p><table><tr><th>Corporate Bond<\/th><th>Moody’s Investors Service Rating<\/th><th>Spread*<\/th><\/tr><tr><td>Bond A<\/td><td>Aaa<\/td><td>1.4%<\/td><\/tr><tr><td>Bond B<\/td><td>Baa1<\/td><td>3.2%<\/td><\/tr><tr><td>Bond C<\/td><td>B3<\/td><td>5.3%<\/td><\/tr><\/table><p>*Spread versus three-year sovereign bond<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M1-Q7", "rel": [], "los": "PM · ECO Module 1 Q7", "tier": null, "type": "", "stem": "<p>If Carlisle’s prediction about the economy of Country #3 is realized, the yield curve in Country #3 will most likely:<\/p>", "options": {"A": "remain flat.", "B": "become upward sloping.", "C": "become downward sloping."}}]}, {"set": 41, "session": 2, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "Quant:ECO-M7-Q42", "rel": [], "los": "Quant · ECO Module 7 Q42", "tier": null, "type": "", "stem": "<p>Which of the following is a feature engineering technique where multi-word patterns that are particularly discriminative can be identified and their connection kept intact?<\/p>", "options": {"A": "N-grams", "B": "Parts of speech", "C": "Name entity recognition"}}, {"id": "Quant:ECO-M7-Q43", "rel": [], "los": "Quant · ECO Module 7 Q43", "tier": null, "type": "", "stem": "<p>In error analysis for classification problems, a Type I error refers to the situation where:<\/p>", "options": {"A": "both the predicted condition and the actual condition are negative.", "B": "the predicted condition is negative but the actual condition is positive.", "C": "the predicted condition is positive but the actual condition is negative."}}]}, {"set": 42, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Liam Ferguson works as an equity portfolio manager for Antrim Capital Partners, a wealth management firm located in Belfast, Northern Ireland. Antrim specializes in managing equity and commercial real estate portfolios for institutional investors throughout Europe.<\/p><p>Joanne Donaghy, a representative of a large investment consulting firm, is considering recommending Antrim to institutional clients. As part of her due diligence, Donaghy is engaged in discussions with members of Antrim’s investment team, including Ferguson. She asks Ferguson to explain how Antrim’s process considers the relationship between the business cycle and earnings growth expectations. Ferguson makes the following observations:<\/p><p>Observation 1:<\/p><p>“Toward the end of a recession, corporate profit growth increases, resulting in a negative risk premium.”<\/p><p>Observation 2:<\/p><p>“The earnings of cyclical companies are considered a leading indicator for broader economic growth.”<\/p><p>Observation 3:<\/p><p>“During recessions, equities offer a good hedge against bad consumption outcomes.”<\/p><p>Ferguson describes how Antrim assesses overall market valuations using several measures, including the market P/E multiple. Ferguson describes changes in factors that could impact valuations and contribute to higher P/E multiples, including an increase in the equity risk premium, decreasing volatility of real GDP growth, and an increase in uncertainty regarding future inflation.<\/p><p>Donaghy is interested in understanding Antrim’s approach to commercial real estate investing. As part of her diligence, she speaks with Colleen McKenna, head of Antrim’s real estate team. Donaghy asks McKenna for her view on the role of commercial real estate in diversified portfolios. McKenna responds that commercial real estate investments have both equity- and bond-like characteristics. She further explains, “From a bond-like perspective, rental income can be viewed as analogous to the coupon income derived from a bond, especially in countries with “upward only” restrictions that help protect property owners. Changes in property values resulting from the state of the underlying economy and any redevelopment opportunities provide an equity-like dimension to the investment.”<\/p><p>McKenna decides to walk Donaghy through a pricing example of the commercial properties in the portfolio to understand the pricing dynamics of this market. She explains that the fundamental present value formula can be applied to commercial real estate: “The numerator of the present value formula is comprised of the sum of future expected rent payments. The denominator reflects a discount rate that can vary depending on type of tenant and lease structure. For example, the discount rate for a property leased to a developed market government tenant paying rent indexed to inflation would reflect the real default-free rate, a risk premium for the uncertainty of the property value at the end of the lease, and a risk premium for the illiquidity of the property. If this property were instead leased to a commercial tenant paying fixed-rate nominal rent, the discount rate would also reflect expected future inflation, a risk-premium for future inflation uncertainty, and a risk premium for credit risk.”<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M1-Q32", "rel": [], "los": "PM · ECO Module 1 Q32", "tier": null, "type": "", "stem": "<p>In her discussion about the present value formula for commercial real estate, McKenna is least likely correct regarding her description of the:<\/p>", "options": {"A": "numerator.", "B": "discount rate for a commercial lease.", "C": "discount rate for a government lease."}}]}, {"set": 43, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Yandie Izzo manages a dividend growth strategy for a large asset management firm. Izzo meets with her investment team to discuss potential investments in three companies: Company A, Company B, and Company C. Statements of cash flow for the three companies are presented in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Statements of Cash Flow, Most Recent Fiscal Year End (Amounts in Millions of Dollars)<\/p><table><tr><th><\/th><th>Company A<\/th><th>Company B<\/th><th>Company C<\/th><\/tr><\/table><p>Cash Flow from Operating Activities<\/p><table><tr><th>Net Income<\/th><th>4,844<\/th><th>1,212<\/th><th>15,409<\/th><\/tr><\/table><p>Adjustments<\/p><table><tr><th>Depreciation<\/th><th>500<\/th><th>288<\/th><th>3,746<\/th><\/tr><tr><td>Other noncash expenses<\/td><td>1,000<\/td><td>—<\/td><td>—<\/td><\/tr><\/table><p>Changes in working capital<\/p><table><tr><th>(Increase) Decrease accounts receivable<\/th><th>(452)<\/th><th>(150)<\/th><th>(536)<\/th><\/tr><tr><td>(Increase) Decrease inventories<\/td><td>—<\/td><td>(200)<\/td><td>(803)<\/td><\/tr><tr><td>Increase (Decrease) accounts payable<\/td><td>(210)<\/td><td>100<\/td><td>(3)<\/td><\/tr><tr><td>Increase (Decrease) other current liabilities<\/td><td>540<\/td><td>14<\/td><td>350<\/td><\/tr><tr><td>Net cash from operating activities<\/td><td>6,222<\/td><td>1,264<\/td><td>18,163<\/td><\/tr><\/table><p>Cash Flow from Investing Activities<\/p><table><tr><th>(Purchase) Sale of fixed assets<\/th><th>2,379<\/th><th>(1,000)<\/th><th>(3,463)<\/th><\/tr><tr><td>Net cash from investing activities<\/td><td>2,379<\/td><td>(1,000)<\/td><td>(3,463)<\/td><\/tr><\/table><p>Cash Flow from Financing Activities<\/p><table><tr><th>Increase (Decrease) notes payable<\/th><th>25<\/th><th>3000<\/th><th>1,238<\/th><\/tr><tr><td>Increase (Decrease) long-term debt<\/td><td>(1,500)<\/td><td>(1,000)<\/td><td>(1,379)<\/td><\/tr><tr><td>Payment of common stock dividends<\/td><td>(1,000)<\/td><td>(237)<\/td><td>(15,000)<\/td><\/tr><tr><td>Net cash from financing activities<\/td><td>(2,475)<\/td><td>1,763<\/td><td>(15,141)<\/td><\/tr><tr><td>Net change in cash and cash equivalents<\/td><td>6,126<\/td><td>2,027<\/td><td>(441)<\/td><\/tr><tr><td>Cash and equivalents at beginning of year<\/td><td>50<\/td><td>100<\/td><td>3,000<\/td><\/tr><tr><td>Cash and equivalents at end of year<\/td><td>6,176<\/td><td>2,127<\/td><td>2,559<\/td><\/tr><\/table><p>Supplemental Cash Flow Disclosures<\/p><table><tr><th>Interest<\/th><th>(353)<\/th><th>(50)<\/th><th>(552)<\/th><\/tr><tr><td>Income taxes<\/td><td>(1,605)<\/td><td>(648)<\/td><td>(3,787)<\/td><\/tr><\/table><p>Izzo’s team first discusses key characteristics of Company A. The company has a history of paying modest dividends relative to FCFE, has a stable capital structure, and is owned by a controlling investor.<\/p><p>The team also considers the impact of Company A’s three noncash transactions in the most recent year on its FCFE, including the following:<\/p><p>Transaction 1: A $900 million loss on a sale of equipment<\/p><p>Transaction 2: An impairment of intangibles of $400 million<\/p><p>Transaction 3: A $300 million reversal of a previously recorded restructuring charge<\/p><p>In addition, Company A’s annual report indicates that the firm expects to incur additional noncash charges related to restructuring over the next few years.<\/p><p>To value the three companies’ shares, one team member suggests valuing the companies’ shares using net income as a proxy for FCFE. Another team member proposes forecasting FCFE using a sales-based methodology based on the following equation:<\/p><p>FCFE = NI – (1 – DR)(FCInv – Dep) – (1 – DR)(WCInv).<\/p><p>Izzo’s team ultimately decides to use actual free cash flow to value the three companies’ shares. Selected data and assumptions are provided in Exhibit 2.<\/p><p>Exhibit 2<\/p><p>Supplemental Data and Valuation Assumptions<\/p><table><tr><th><\/th><th>Company A<\/th><th>Company B<\/th><th>Company C<\/th><\/tr><tr><td>Tax rate<\/td><td>35%<\/td><td>35%<\/td><td>30%<\/td><\/tr><tr><td>Beta<\/td><td>1.00<\/td><td>0.90<\/td><td>1.10<\/td><\/tr><tr><td>Before-tax cost of debt<\/td><td>6%<\/td><td>7%<\/td><td>6%<\/td><\/tr><tr><td>Target debt ratio<\/td><td>50%<\/td><td>30%<\/td><td>40%<\/td><\/tr><\/table><p>Market data:<\/p><p>Risk-free rate: 3%<\/p><p>Market risk premium: 7%<\/p><p>The team calculates the intrinsic value of Company B using a two-stage FCFE model. FCFE growth rates for the first four years are estimated at 10%, 9%, 8%, and 7%, respectively, before declining to a constant 6% starting in the fifth year.<\/p><p>To calculate the intrinsic value of Company C’s equity, the team uses the FCFF approach assuming a single-stage model where FCFF is expected to grow at 5% indefinitely.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M3-Q13", "rel": [], "los": "Equity · ECO Module 3 Q13", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1 and Exhibit 2 and the proposed single-stage FCFF model, the intrinsic value of Company C’s equity is closest to:<\/p>", "options": {"A": "$277,907 million.", "B": "$295,876 million.", "C": "$306,595 million."}}]}, {"set": 44, "session": 2, "topic": "Economics", "code": "ECO", "vignette": "<p>Victor Klymchuk, the chief economist at ECONO Consulting (EC), is reviewing the long-term GDP growth of three countries and is interested in forecasting the long-term change in stock market value for each country.<\/p><p>Exhibit 1 – Select Country Factors and Historical Economic Data (2009–2019)<\/p><table><tr><th>Country<\/th><th>Country Factors<\/th><th>Growth in Hours Worked (%)<\/th><th>Growth in Labor Productivity (%)<\/th><th>Growth in TFP (%)<\/th><th>Growth in GDP (%)<\/th><\/tr><tr><td>Country A<\/td><td>High savings and investment; highly educated workforce; low tariffs on foreign imports; limited natural resources<\/td><td>0.9<\/td><td>2.4<\/td><td>0.6<\/td><td>3.3<\/td><\/tr><tr><td>Country B<\/td><td>Developed financial markets; moderate disposable income; significant foreign direct and indirect investments; significant natural resources<\/td><td>−0.3<\/td><td>1.6<\/td><td>0.8<\/td><td>1.3<\/td><\/tr><tr><td>Country C<\/td><td>Politically unstable; limited property rights; poor public education and health; significant natural resources<\/td><td>1.8<\/td><td>0.8<\/td><td>−0.3<\/td><td>2.6<\/td><\/tr><\/table><p>Statement 1: &quot;Over short time horizons, percentage changes in GDP, the ratio of earnings to GDP, and the price-to-earnings ratio are important factors for describing the relationship between economic growth and stock prices. However, I am interested in a long-term stock market forecast.&quot;<\/p><p>Statement 4: &quot;Although countries with greater access to natural resources are often wealthier, the relationship between resource abundance and economic growth is not clear. My analysis shows that the presence of a dominant natural resource (oil) in Country C is constraining growth. Interestingly, Country A has few natural resources but is experiencing a strong rate of increase in per capita GDP growth.&quot;<\/p><p>Klymchuk knows that growth in per capita income cannot be sustained by pure capital deepening. He asks the associate economist to determine how important capital deepening is as a source of economic growth for each country, using the data in Exhibit 1.<\/p><p>The associate economist believes that developing countries, irrespective of their particular characteristics, will eventually equal developed countries in per capita output. Klymchuk responds:<\/p><p>Statement 5: &quot;Poor countries will only converge to the income levels of the richest countries if they make appropriate institutional changes.&quot;<\/p>", "exhibits": [], "qs": [{"id": "Econ:ECO-M2-Q2", "rel": [], "los": "Econ · ECO Module 2 Q2", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, capital deepening as a source of growth was most important for:<\/p>", "options": {"A": "Country A.", "B": "Country B.", "C": "Country C."}}]}, {"set": 45, "session": 2, "topic": "Derivatives", "code": "DER", "vignette": "<p>Qiu Tian is a hedge fund manager evaluating options on several equities. She begins with Tara Corp., a non-dividend-paying stock priced in Indian rupees (INR). Tian is bullish on Tara stock and values European-style Tara call options using a two-period binomial model and information from Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th>Current stock price<\/th><th>INR 10<\/th><\/tr><tr><td>Time to option expiration<\/td><td>2 years<\/td><\/tr><tr><td>Risk-free rate (annual)<\/td><td>5.0%<\/td><\/tr><tr><td>Option strike price<\/td><td>INR 12<\/td><\/tr><tr><td>Up factor per period<\/td><td>1.50<\/td><\/tr><tr><td>Down factor per period<\/td><td>0.67<\/td><\/tr><\/table><p>Tian observes that the 2-year Tara call option is illiquid. She determines how to replicate a long position in this call option.<\/p><p>Next, Tian assesses the value of a European-style call option on equity index futures using the Black model. She gathers information related to the call in Exhibit 2. The Black model value of a put with the same underlying, strike price, and time to expiration is 225.<\/p><p>Exhibit 2<\/p><table><tr><th>Current futures price<\/th><th>1,100<\/th><\/tr><tr><td>Time to expiration<\/td><td>6 months<\/td><\/tr><tr><td>Exercise price<\/td><td>1,300<\/td><\/tr><tr><td>Risk-free rate<\/td><td>5.0%<\/td><\/tr><\/table><p>Tian is also evaluating the addition of Purnima Corp. options to her portfolio. She compares the relative value of three Purnima call options in Exhibit 3. Her objective is to select the option that is cheapest after she makes adjustments for differences in moneyness and time to expiration. Purnima stock is currently trading at INR 62.<\/p><p>Exhibit 3<\/p><table><tr><th><\/th><th>Option X<\/th><th>Option Y<\/th><th>Option Z<\/th><\/tr><tr><td>Current price<\/td><td>INR 10.55<\/td><td>INR 6.89<\/td><td>INR 6.44<\/td><\/tr><tr><td>Implied volatility<\/td><td>30%<\/td><td>25%<\/td><td>35%<\/td><\/tr><tr><td>Strike price<\/td><td>INR 55<\/td><td>INR 62<\/td><td>INR 75<\/td><\/tr><tr><td>Time to expiration<\/td><td>8 months<\/td><td>12 months<\/td><td>16 months<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q35", "rel": [], "los": "Mock 1 Session 2 Q35", "tier": null, "type": "", "stem": "<p>The value of the call option on equity index futures is closest to:<\/p>", "options": {"A": "25.", "B": "30.", "C": "35."}}]}, {"set": 46, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Tina Ming is a senior portfolio manager at Flusk Pension Fund (Flusk). Flusk’s portfolio is composed of fixed-income instruments structured to match Flusk’s liabilities. Ming works with Shrikant McKee, Flusk’s risk analyst.<\/p><p>Ming and McKee discuss the latest risk report. McKee calculated value at risk (VaR) for the entire portfolio using the historical method and assuming a lookback period of five years and 250 trading days per year. McKee presents VaR measures in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Flusk Portfolio VaR (in $ millions)<\/p><table><tr><th>Confidence Interval<\/th><th>Daily VaR<\/th><th>Monthly VaR<\/th><\/tr><tr><td>95%<\/td><td>1.10<\/td><td>5.37<\/td><\/tr><\/table><p>After reading McKee’s report, Ming asks why the number of daily VaR breaches over the last year is zero even though the portfolio has accumulated a substantial loss.<\/p><p>Next, Ming requests that McKee perform the following two risk analyses on Flusk’s portfolio:<\/p><p>Analysis 1:Use scenario analysis to evaluate the impact on risk and return of a repeat of the last financial crisis.<\/p><p>Analysis 2:Estimate over one year, with a 95% level of confidence, how much Flusk’s assets could underperform its liabilities.<\/p><p>Ming recommends purchasing newly issued emerging market corporate bonds that have embedded options. Prior to buying the bonds, Ming wants McKee to estimate the effect of the purchase on Flusk’s VaR. McKee suggests running a stress test using a historical period specific to emerging markets that encompassed an extreme change in credit spreads.<\/p><p>At the conclusion of their conversation, Ming asks the following question about risk management tools: “What are the advantages of VaR compared with other risk measures?”<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M5-Q7", "rel": [], "los": "PM · ECO Module 5 Q7", "tier": null, "type": "", "stem": "<p>The number of Flusk’s VaR breaches most likely resulted from:<\/p>", "options": {"A": "using a standard normal distribution in the VaR model.", "B": "using a 95% confidence interval instead of a 99% confidence interval.", "C": "lower market volatility during the last year compared with the lookback period."}}]}, {"set": 47, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:SCH-M2-04", "rel": [], "los": "FSA · Schweser MQ 8.2 변형", "tier": null, "type": "", "stem": "<p>For a DB plan: PBO at 1 January = $200m; PBO at 31 December = $226m; service cost plus interest cost for the year = $40m; plan assets at 1 January = $160m; actual return on plan assets = $30m. There were no employer contributions, no actuarial changes, and no other events. Plan assets at 31 December are closest to:<\/p>", "options": {"A": "$146m.", "B": "$176m.", "C": "$190m."}}]}, {"set": 48, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Charlene Norberg is an analyst for a sell-side firm. She is building valuation models for several publicly traded firms.<\/p><p>Norberg estimates the intrinsic value of Firm A&#x27;s shares based on an FCFE model, using her forecasts in Exhibit 1. She expects long-term annual sales growth of 4% starting in Year 3, with consistent relationships between sales and net profit, changes in fixed capital, changes in working capital, and changes in debt. She estimates Firm A&#x27;s cost of equity to be 9% and its WACC to be 8%.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Year 1<\/th><th>Year 2<\/th><th>Year 3<\/th><\/tr><tr><td>Sales per share<\/td><td>$90.00<\/td><td>$90.00<\/td><td>$93.60<\/td><\/tr><tr><td>FCFE per share<\/td><td>$6.20<\/td><td>$9.00<\/td><td>$7.85<\/td><\/tr><\/table><p>Norberg notes that, in the previous year, Firm A&#x27;s FCFF was greater than its FCFE.<\/p><p>Next, Norberg values another firm, Firm B, which has consistently been paying dividends. The firm has a large cash balance with a growing retained earnings balance. Norberg believes that Firm B is a takeover target because it offers synergies to one of its main competitors. If a takeover does occur, Norberg expects the new owner will likely change Firm B&#x27;s dividend payout and will issue debt to maintain its capital expenditures. Norberg evaluates the potential takeover from the acquirer&#x27;s perspective.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q7", "rel": [], "los": "Mock 2 Session 1 Q7", "tier": null, "type": "", "stem": "<p>Which of the following is the most appropriate model to value Firm B?<\/p>", "options": {"A": "DDM", "B": "FCFE", "C": "FCFF"}}]}, {"set": 49, "session": 2, "topic": "Economics", "code": "ECO", "vignette": "<p>Mirela Dragan is a sovereign credit analyst at Eastbrook Ratings. She is comparing the long-term growth prospects of three economies: Valmora, a high-income economy with a large stock of capital per worker; Tessaly, a fast-growing middle-income economy; and Ondra, a lower-income economy that has invested heavily in infrastructure over the past decade.<\/p>\n<p>Dragan forecasts potential GDP growth for the next ten years using the Solow growth accounting equation. Her trend forecasts of the inputs, together with each economy's historical labor productivity growth, are shown in Exhibit 1. To understand the sources of Ondra's past productivity gains, she also gathers the realized data for 2015–2025 in Exhibit 2.<\/p>\n<p>Valmora's finance ministry has announced tax incentives to raise the national saving rate and to expand private spending on research and education. The ministry's report states: \"Because knowledge created by private R&D spills over to other firms, returns to capital do not diminish for the economy as a whole. A permanently higher saving and investment rate will therefore permanently raise Valmora's growth rate.\"<\/p>\n<p>Dragan's colleague, Piotr Halas, comments on the outlook for the three economies: \"Tessaly's saving rate, population growth, and access to technology are now very similar to Valmora's, so I expect Tessaly's per capita income to converge to Valmora's level over time. Ondra's saving rate is much lower, so even if it grows faster for a while, its per capita income should converge to a lower level.\"<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Trend Forecasts of Growth Inputs, 2026–2035<\/caption><thead><tr><th>Forecast input (annual)<\/th><th>Valmora<\/th><th>Tessaly<\/th><th>Ondra<\/th><\/tr><\/thead><tbody><tr><td>Labor share of national income<\/td><td>0.65<\/td><td>0.55<\/td><td>0.60<\/td><\/tr><tr><td>Growth in total factor productivity<\/td><td>1.0%<\/td><td>1.2%<\/td><td>1.1%<\/td><\/tr><tr><td>Growth in capital stock<\/td><td>2.0%<\/td><td>4.0%<\/td><td>6.0%<\/td><\/tr><tr><td>Growth in labor force<\/td><td>0.2%<\/td><td>0.8%<\/td><td>1.8%<\/td><\/tr><tr><td>Historical labor productivity growth, 2015–2025<\/td><td>1.3%<\/td><td>3.1%<\/td><td>3.6%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Ondra — Realized Growth Data<\/caption><thead><tr><th>Realized annual average, 2015–2025<\/th><th>Ondra<\/th><\/tr><\/thead><tbody><tr><td>Real GDP growth<\/td><td>5.6%<\/td><\/tr><tr><td>Growth in capital stock<\/td><td>7.5%<\/td><\/tr><tr><td>Growth in labor force<\/td><td>2.0%<\/td><\/tr><tr><td>Labor share of national income<\/td><td>0.60<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s15-q1", "rel": [], "los": "Agent Mock 1 Q57", "tier": null, "type": "", "stem": "Using Dragan's method, Tessaly's forecast potential GDP growth rate is <i>closest<\/i> to:", "options": {"A": "3.44%.", "B": "3.76%.", "C": "3.90%."}}]}, {"set": 50, "session": 2, "topic": "Derivatives", "code": "DER", "vignette": "<p>Hanna Okonkwo-Reyes is head of the equity and rates options desk at Brightwater Securities. She reviews four client requests with trainee Lukas Vieira.<\/p>\n<p><b>Request 1: American-style put<\/b><\/p>\n<p>A pension fund client holding shares of Torvane Industries, a non-dividend-paying stock, asks for a quote on a two-year American-style put option with an exercise price of $78.00. Okonkwo-Reyes uses the two-period binomial model with the inputs in Exhibit 1. Vieira suggests that because the stock pays no dividends, early exercise can be ignored, as it would be for a call.<\/p>\n<p><b>Request 2: Forward-starting swap<\/b><\/p>\n<p>The treasurer of Velden Logistics plans to borrow on a floating-rate basis for three years beginning one year from today and expects interest rates to rise before then. She is considering a one-year forward-starting, three-year swap in which Velden pays fixed. The current forward swap rate for that swap is 3.20%. Rather than enter the swap now, the treasurer asks whether Velden could create the same exposure with swaptions that expire in one year on the three-year swap, each with an exercise rate of 3.20%.<\/p>\n<p><b>Request 3: Delta-hedged straddle<\/b><\/p>\n<p>The desk holds a long position in at-the-money calls and puts on the Kestrel 100 Index, with the same exercise price and three weeks to expiration, and keeps the position delta-neutral by trading index futures. For the next week, the desk economist forecasts the following:<\/p>\n<ul><li>The index will trade in a very narrow range, so realized volatility will be far below the options' implied volatility.<\/li>\n<li>Implied volatility on Kestrel 100 options will remain unchanged or rise slightly.<\/li>\n<li>The central bank will cut its policy rate by 25 basis points.<\/li><\/ul>\n<p><b>Request 4: BSM components<\/b><\/p>\n<p>A hedge fund client asks how to interpret the Black–Scholes–Merton (BSM) output for a six-month European call option on Arlo Systems shares, shown in Exhibit 2. Vieira prepares three statements for the client.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Binomial Model Inputs for the Torvane Put<\/caption><thead><tr><th>Input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Current price of Torvane shares<\/td><td>$75.00<\/td><\/tr><tr><td>Up factor per period (u)<\/td><td>1.14<\/td><\/tr><tr><td>Down factor per period (d)<\/td><td>0.89<\/td><\/tr><tr><td>Risk-free rate per period<\/td><td>3.0%<\/td><\/tr><tr><td>Number of periods (one year each)<\/td><td>2<\/td><\/tr><tr><td>Exercise price<\/td><td>$78.00<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: BSM Output for the Arlo Systems Call<\/caption><thead><tr><th>BSM input / output<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Share price<\/td><td>$46.00<\/td><\/tr><tr><td>Exercise price<\/td><td>$45.00<\/td><\/tr><tr><td>Time to expiration<\/td><td>0.5 years<\/td><\/tr><tr><td>Continuously compounded risk-free rate<\/td><td>3.0%<\/td><\/tr><tr><td>Volatility<\/td><td>28%<\/td><\/tr><tr><td>N(d<sub>1<\/sub>)<\/td><td>0.6125<\/td><\/tr><tr><td>N(d<sub>2<\/sub>)<\/td><td>0.5350<\/td><\/tr><tr><td>PV of exercise price × N(d<sub>2<\/sub>)<\/td><td>$23.72<\/td><\/tr><tr><td>Call value<\/td><td>$4.46<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s19-q3", "rel": [], "los": "Agent Mock 1 Q75", "tier": null, "type": "", "stem": "If the economist's forecasts in Request 3 are correct, the delta-neutral straddle position is <i>most likely<\/i> to lose value over the next week because of its exposure to:", "options": {"A": "vega.", "B": "theta.", "C": "rho."}}]}], "sessSec": {"1": 7740, "2": 7740}};

<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1d2330;--mut:#5d6677;--bd:#d5d9e0;--acc:#1f5fbf;--accbg:#e6efff;--ok:#1b7f45;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fbe9e7;--flag:#c77700;--flagbg:#fff1d6;--hl:#fff176}
body.dark{--bg:#14171d;--panel:#1d222b;--fg:#e4e8ef;--mut:#9aa3b2;--bd:#343b48;--acc:#6ea8ff;--accbg:#22314d;--ok:#5fd18b;--okbg:#17332379;--bad:#ff8a80;--badbg:#3d1f1c;--flag:#ffb74d;--flagbg:#3d2f14;--hl:#6b5f00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
textarea{width:100%;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px}
#top{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--bd);flex:none;flex-wrap:wrap}
#top .grow{flex:1}
#timer{font:600 20px/1 ui-monospace,Menlo,monospace}
#timer.low{color:var(--bad)}
#main{flex:1;min-height:0;display:flex}
#left,#right{overflow:auto;padding:14px 18px}
#left{flex:1 1 50%;border-right:1px solid var(--bd);background:var(--panel)}
#right{flex:1 1 50%}
#bottom{flex:none;background:var(--panel);border-top:1px solid var(--bd);padding:6px 14px;display:flex;gap:10px;align-items:center}
#nav{display:flex;flex-wrap:wrap;gap:3px;flex:1;max-height:96px;overflow:auto}
.nb{width:30px;height:26px;padding:0;font-size:12px;position:relative}
.nb.ans{background:var(--accbg);border-color:var(--acc)}
.nb.cur{outline:2px solid var(--acc);outline-offset:1px;font-weight:700}
.nb.fl::after{content:"";position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:var(--flag);border-right-color:var(--flag)}
.nb.setstart{margin-left:8px}
#left table{border-collapse:collapse;margin:10px 0;font-size:14px}
#left th,#left td{border:1px solid var(--bd);padding:3px 9px}
#left th{background:var(--bg)}
#left caption{font-weight:600;text-align:left;padding-bottom:4px}
.vh{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;gap:8px;align-items:center}
mark{background:var(--hl);color:inherit}
.vb{transition:opacity .15s}
.vb.dim{opacity:.35}
#relbtn.on{background:var(--accbg);border-color:var(--acc)}
.nb.nno{color:var(--bad);border-color:var(--bad)}
.nb.out{opacity:.35}
.nb.rok{color:var(--ok);border-color:var(--ok)}
.nb.rvd::before{content:"✓";position:absolute;left:2px;bottom:-1px;font-size:9px;color:var(--ok)}
.sl{font-size:11px;color:var(--mut);align-self:center;margin:0 2px 0 8px}
.why{font-size:13px;color:var(--mut);margin-top:4px}
.note{display:grid;grid-template-columns:40px 1fr;gap:10px 12px;font-size:14px;line-height:1.65;border-top:1px solid var(--bd);margin-top:16px;padding-top:14px}
.nl{font-size:12px;font-weight:600;color:var(--mut);padding-top:2px}
.raw{margin-top:10px;font-size:13px;color:var(--mut)}
.raw .expl{color:var(--fg)}
.sh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#doneb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.stem{font-size:16px;margin:4px 0 14px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin:8px 0;background:var(--panel);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.sel{background:var(--accbg);border-color:var(--acc)}
.opt .l{font-weight:700;min-width:20px}
.opt .t{flex:1}
.opt.strike .t{text-decoration:line-through;opacity:.5}
.opt .x{padding:0 6px;font-size:12px;color:var(--mut)}
.flagbtn.on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.center{max-width:860px;margin:0 auto;padding:22px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px 20px;margin:12px 0}
h1,h2,h3{margin:.4em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
table.r{border-collapse:collapse;width:100%;font-size:14px}
table.r th,table.r td{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left}
table.r td.n,table.r th.n{text-align:right}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.opt{cursor:default}
body.live .opt{cursor:pointer}
.expl{white-space:pre-wrap;font-size:14px;border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;color:var(--mut)}
.warn{color:var(--bad)}.okc{color:var(--ok)}.mut{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:520px;margin:0}
#pauseov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center}
#pauseov.show{display:flex}
#pauseov .card{max-width:440px;text-align:center;margin:0}
#pauseov .big{font:600 44px/1.2 ui-monospace,Menlo,monospace}
@media (max-width:900px){#main{flex-direction:column}#left{border-right:0;border-bottom:1px solid var(--bd);flex:1 1 0;min-height:0}#right{flex:0 0 auto;max-height:45%;padding:8px 18px}#nav{display:none}#bottom{justify-content:center}}
</style>
</head>

<script>
"use strict";
const DATA = {"mock": 3, "sets": [{"set": 1, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Howie Rutledge is a senior portfolio strategist for an endowment fund. Rutledge meets with recently hired junior analyst Larry Stosur to review the fund’s holdings.<\/p><p>Rutledge asks Stosur about the mechanics of exchange-traded funds (ETFs). Stosur responds by making the following statements:<\/p><p>Statement 1:Unlike mutual fund shares that can be shorted, ETF shares cannot be shorted.<\/p><p>Statement 2:In the ETF creation/redemption process, the authorized participants (APs) absorb the costs of transacting securities for the ETF’s portfolio.<\/p><p>Statement 3:If ETF shares are trading at a discount to NAV and arbitrage costs are sufficiently low, APs will buy the securities in the creation basket and exchange them for ETF shares from the ETF sponsor.<\/p><p>Rutledge notes that one holding, ETF 1, is trading at a premium to its intraday NAV. He reviews the ETF’s pricing and notes that the premium to the intraday NAV is greater than the expected arbitrage costs.<\/p><p>Stosur is evaluating three ETFs for potential investment. He notes that the ETFs have different portfolio characteristics that are likely to affect each ETF’s tracking error. A summary of the characteristics for the ETFs is presented in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>ETF Characteristics Affecting Tracking Error<\/p><table><tr><th><\/th><th>ETF 2<\/th><th>ETF 3<\/th><th>ETF 4<\/th><\/tr><tr><td>Portfolio Construction Approach<\/td><td>Full Replication<\/td><td>Representative Sampling<\/td><td>Full Replication<\/td><\/tr><tr><td>Type of Foreign Holdings<\/td><td>Local shares<\/td><td>ADRs*<\/td><td>ADRs*<\/td><\/tr><tr><td>Engagement in Securities Lending<\/td><td>Yes<\/td><td>Yes<\/td><td>No<\/td><\/tr><\/table><p>*ADRs are American Depositary Receipts.<\/p><p>Rutledge and Stosur discuss the factors that influence ETF bid–ask spreads. Stosur tells Rutledge that quoted bid–ask spreads for a particular transaction size are (1) negatively related to the amount of the ongoing order flow in the ETF, (2) positively related to the costs and risks for the ETF liquidity provider, and (3) positively related to the amount of competition among market makers for the ETF.<\/p><p>As ETF shares may trade at prices that are different from the NAV, Rutledge examines selected data in Exhibit 2 for three ETFs that might have this problem.<\/p><p>Exhibit 2<\/p><p>Selected Data on ETFs<\/p><table><tr><th><\/th><th>ETF 5<\/th><th>ETF 6<\/th><th>ETF 7<\/th><\/tr><tr><td>Percentage of Foreign Holdings<\/td><td>10%<\/td><td>50%<\/td><td>90%<\/td><\/tr><tr><td>Trading Frequency<\/td><td>High<\/td><td>Low<\/td><td>Low<\/td><\/tr><\/table><p>Rutledge considers a new ETF investment for the fund. He plans to own the ETF for nine months. The ETF has the following trading costs and management fees:<\/p><p>• Annual management fee of 0.32%<\/p><p>• Round-trip trading commissions of 0.20%<\/p><p>• Bid–offer spread of 0.10% on purchase and sale<\/p><p>Rutledge asks Stosur to compute the expected total holding period cost for investing in the ETF.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M3-Q7", "rel": [], "los": "PM · ECO Module 3 Q7", "tier": null, "type": "", "stem": "<p>Which ETF in Exhibit 1 is most likely to have the lowest tracking error?<\/p>", "options": {"A": "ETF 2", "B": "ETF 3", "C": "ETF 4"}}, {"id": "PM:ECO-M3-Q10", "rel": [], "los": "PM · ECO Module 3 Q10", "tier": null, "type": "", "stem": "<p>Excluding the compounding effect, the expected total holding period cost for investing in the ETF over a nine-month holding period is closest to:<\/p>", "options": {"A": "0.54%.", "B": "0.62%.", "C": "0.64%."}}]}, {"set": 2, "session": 1, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Halvorsen Ridge Capital is a boutique asset manager with 140 discretionary client accounts. Ingrid Solberg, CFA, the firm's chief investment officer, is preparing to launch a private-credit sleeve that will lend directly to mid-sized companies. Loans in the sleeve have maturities of four to six years, and investors may redeem only after a five-year lock-up. Tomas Reyes, a Level III CFA candidate, is the portfolio manager responsible for the firm's balanced accounts.<\/p>\n<p>Solberg proposes moving 15% of every balanced account into the sleeve, arguing that \"private credit lowers the volatility of the overall portfolio, so it is appropriate for every balanced client.\" One of Reyes's balanced clients is the Mertens Trust. The trust's investment policy statement (IPS), last updated four years ago, limits holdings to publicly traded securities and notes that the trust pays its beneficiaries a fixed distribution every January. The trustee has not been contacted about the sleeve.<\/p>\n<p>While the sleeve is being organized, Reyes receives 24,000 shares of the oversubscribed initial public offering of Norvik Energy. The issue is suitable for three of his accounts, which submitted indications of interest before the offering: the Calder Foundation (30,000 shares), the Albrecht Family Office (20,000 shares), and an account owned by Reyes's brother-in-law, Jens Lund (10,000 shares). Lund's account pays the firm's standard advisory fee. Reyes also entered an order for 5,000 shares for his personal account. Halvorsen Ridge's written policy states that employees may not participate in oversubscribed offerings and that IPO shares are allocated to client accounts in proportion to their indications of interest.<\/p>\n<p>To market the sleeve, Solberg drafts a presentation built around the firm's Direct Lending Composite, which reports an annualized five-year return of 9.8%. Two accounts that terminated in the third year after suffering loan losses are not included anywhere in the composite's history; including them would reduce the five-year return to 8.1%. A footnote states that all returns are shown gross of management fees and that net-of-fee returns are available on request.<\/p>\n<p>Seeking anchor investors, Reyes e-mails the Albrecht Family Office's current holdings and its projected liquidity needs to Kestrel Fund Services, an outside fund administrator that maintains a list of potential co-investors. Kestrel signed a non-disclosure agreement with Halvorsen Ridge. Reyes did not ask the family office before sending the information, but he informed Solberg afterward.<\/p>", "exhibits": [], "qs": [{"id": "cMock1:m1-s02-q2", "rel": [], "los": "Agent Mock 1 Q6", "tier": null, "type": "", "stem": "Under a fair allocation procedure, the number of Norvik Energy shares Reyes should allocate to the Lund account is <i>closest<\/i> to:", "options": {"A": "0.", "B": "4,000.", "C": "8,000."}}]}, {"set": 3, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Consolidated Motors is a US-based corporation that sells mechanical engines and components used by electric utilities. Its Canadian subsidiary, Consol-Can, operates solely in Canada. It was created on 31 December 20X1, and Consolidated Motors determined at that time that it should use the US dollar as its functional currency.<\/p><p>Chief Financial Officer Monica Templeton was asked to explain to the board of directors how exchange rates affect the financial statements of both Consol-Can and the consolidated financial statements of Consolidated Motors. For the presentation, Templeton collects Consol-Can’s balance sheets for the years ended 20X1 and 20X2 (Exhibit 1), as well as relevant exchange rate information (Exhibit 2).<\/p><p>Exhibit 1<\/p><p>Consol-Can Condensed Balance Sheet for Fiscal Years Ending 31 December (C$ millions)<\/p><table><tr><th>Account<\/th><th>20X2<\/th><th><\/th><th>20X1<\/th><\/tr><tr><td>Cash<\/td><td>135<\/td><td><\/td><td>167<\/td><\/tr><tr><td>Accounts receivable<\/td><td>98<\/td><td><\/td><td>—<\/td><\/tr><tr><td>Inventory<\/td><td>77<\/td><td><\/td><td>30<\/td><\/tr><tr><td>Fixed assets<\/td><td>100<\/td><td><\/td><td>100<\/td><\/tr><tr><td>Accumulated depreciation<\/td><td>(10)<\/td><td><\/td><td>—<\/td><\/tr><tr><td>Total assets<\/td><td>400<\/td><td><\/td><td>297<\/td><\/tr><tr><td>Accounts payable<\/td><td>77<\/td><td><\/td><td>22<\/td><\/tr><tr><td>Long-term debt<\/td><td>175<\/td><td><\/td><td>175<\/td><\/tr><tr><td>Common stock<\/td><td>100<\/td><td><\/td><td>100<\/td><\/tr><tr><td>Retained earnings<\/td><td>48<\/td><td><\/td><td>—<\/td><\/tr><tr><td>Total liabilities and shareholders’ equity<\/td><td>400<\/td><td><\/td><td>297<\/td><\/tr><\/table><p>Exhibit 2<\/p><p>Exchange Rate Information<\/p><table><tr><th><\/th><th>US$/C$<\/th><\/tr><tr><td>Rate on 31 December 20X1<\/td><td>0.86<\/td><\/tr><tr><td>Average rate in 20X2<\/td><td>0.92<\/td><\/tr><tr><td>Weighted-average rate for inventory purchases<\/td><td>0.92<\/td><\/tr><tr><td>Rate on 31 December 20X2<\/td><td>0.95<\/td><\/tr><\/table><p>Templeton explains that Consol-Can uses the FIFO inventory accounting method and that purchases of C$300 million and the sell-through of that inventory occurred evenly throughout 20X2. Her presentation includes reporting the translated amounts in US dollars for each item, as well as associated translation-related gains and losses. The board responds with several questions.<\/p><p>Would there be a reason to change the functional currency to the Canadian dollar?<\/p><p>Would there be any translation effects for Consolidated Motors if the functional currency for Consol-Can were changed to the Canadian dollar?<\/p><p>Would a change in the functional currency have any impact on financial statement ratios for the parent company?<\/p><p>What would be the balance sheet exposure to translation effects if the functional currency were changed?<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q24", "rel": [], "los": "FSA · ECO Module 3 Q24", "tier": null, "type": "", "stem": "<p>After translating Consol-Can’s 31 December 20X2 balance sheet into the parent company’s currency (US$), the translated value of retained earnings will be closest to:<\/p>", "options": {"A": "$41 million.", "B": "$44 million.", "C": "$46 million."}}, {"id": "FSA:ECO-M3-Q25", "rel": [], "los": "FSA · ECO Module 3 Q25", "tier": null, "type": "", "stem": "<p>In response to the board’s first question, Templeton would most likely reply that such a change would be justified if:<\/p>", "options": {"A": "the inflation rate in the United States became hyperinflationary.", "B": "management wanted to flow more of the gains through net income.", "C": "Consol-Can were making autonomous decisions about operations, investing, and financing."}}]}, {"set": 4, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>BJL Financial provides clients with professional investment management services that are tailored to the specific needs of each client. The firm’s portfolio manager, Angelique Kwaza, has called a meeting with the senior analyst, Samira Khan, to discuss the quarterly rebalancing of three client portfolios. The valuation model used in the analyses is the discounted dividend model.<\/p><p>Client 1 has a portfolio with significant exposure to dividend-paying stocks.<\/p><p>Client 2 is interested in including preferred stock in the portfolio.<\/p><p>Client 3 has a growth-oriented equity-only portfolio.<\/p><p>Khan has identified two utilities (ABC and XYZ) for possible inclusion in Client 1’s portfolio, as shown in Exhibit 1. She uses a discount rate of 7% for both common stocks.<\/p><p>Exhibit 1<\/p><p>Candidate Stocks for Client 1<\/p><table><tr><th>Stock<\/th><th>Company Description<\/th><\/tr><tr><td>ABC<\/td><td>ABC is a publicly traded utility with an expected constant growth rate for earnings and dividends of 3.5%. The most recent year’s dividend payout is 70%. The expected dividend payout in future years is 60%. The common stock price is $14.49 per share.<\/td><\/tr><tr><td>XYZ<\/td><td>XYZ is a publicly traded utility with several unregulated business subsidiaries. The company generates 3% growth in dividends and has an annual dividend payout of 80%. No changes in dividend growth or payout are expected. The common stock price is $10 per share. The current year earnings are $0.45 per share, and next year’s earnings are expected to be $0.50 per share.<\/td><\/tr><\/table><p>Kwaza asks Khan to investigate the most appropriate models for valuing utility companies. She tells Khan about the following points mentioned in various research reports on the utilities sector.<\/p><p>Report 1: A resurgence in domestic manufacturing activity will generate long-term growth in earnings and dividends that exceeds the cost of equity.<\/p><p>Report 2: Share repurchases are expected to increase. The report expresses confidence in the forecasts regarding the magnitude and timing of these repurchases.<\/p><p>Report 3: The report forecasts earnings growth of 4.5%. The key growth drivers are increases in population and business creation associated with stable GDP growth of 2.75%.<\/p><p>For Client 2’s portfolio, Khan has identified the non-callable perpetual preferred stocks of Standard Company and Main Company.<\/p><p>The Standard Company’s preferred stock pays 2.75% on a par value of $100. Khan believes it to be fairly valued at a market price of $49.60.<\/p><p>The perpetual preferred stock of Main Company has a par value of $50 per share and pays an annual dividend of 5.5%. Khan estimates a capitalization rate at 6%. The current market price of Main Company preferred stock is $42.<\/p><p>Finally, Khan has identified three stocks, shown in Exhibit 2, as likely candidates for Client 3’s portfolio.<\/p><p>Exhibit 2<\/p><p>Candidate Stocks for Client 3<\/p><table><tr><th>Stock<\/th><th>Company Description<\/th><\/tr><tr><td>BIOK<\/td><td>BIOK is a profitable biotech firm that currently pays an annual dividend of $1.20 per share. The current annual dividend growth rate is 15%. Patent protection runs out in eight years, after which dividend growth will likely decline at a steady rate over three years before stabilizing at a mature growth rate.<\/td><\/tr><tr><td>CCAX<\/td><td>CCAX builds communication software for state and federal prisons and detention facilities. The company is expected to hold its cash dividends steady at $0.56 per share for six years as it builds out facilities and acquires properties. Dividends are expected to grow at the nominal GDP growth rate after the next six years.<\/td><\/tr><tr><td>HLTV<\/td><td>HLTV is a health care equipment and services firm that is expected to maintain a stable dividend payout ratio. Earnings are forecast to grow over the next two years by 27% annually. After that, earnings will likely grow by 12% annually for another 10 years before stabilizing at a mature growth rate.<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Equity:ECO-M2-Q24", "rel": [], "los": "Equity · ECO Module 2 Q24", "tier": null, "type": "", "stem": "<p>Which sector report best describes a situation in which the Gordon growth model could be used to value utility stocks?<\/p>", "options": {"A": "Report 1", "B": "Report 2", "C": "Report 3"}}, {"id": "Equity:ECO-M2-Q27", "rel": [], "los": "Equity · ECO Module 2 Q27", "tier": null, "type": "", "stem": "<p>Based on Exhibit 2, which stock can most appropriately be valued using a three-stage DDM with the second and third stages being treated as an H-model?<\/p>", "options": {"A": "BIOK", "B": "CCAX", "C": "HLTV"}}]}, {"set": 5, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Kensington plc, a fictional company based in the United Kingdom, sponsors a DB pension plan for qualifying employees. Kensington prepares its financial statements under IFRS. The discount rate that the company used in estimating the present value of its pension obligation was 5.48%. Disclosures on Kensington’s pension plan in the company’s notes to financial statements for the year ended 31 December 20X1 included the following.<\/p><table><tr><th>Components of periodic benefit cost<\/th><th><\/th><\/tr><tr><td>Service cost<\/td><td>£228<\/td><\/tr><tr><td>Net interest (income) expense<\/td><td>273<\/td><\/tr><tr><td>Remeasurements<\/td><td>−18<\/td><\/tr><tr><td>Periodic pension cost<\/td><td>£483<\/td><\/tr><tr><td>Change in benefit obligation<\/td><td><\/td><\/tr><tr><td>Benefit obligations at beginning of year<\/td><td>£28,416<\/td><\/tr><tr><td>Service cost<\/td><td>228<\/td><\/tr><tr><td>Interest cost<\/td><td>1,557<\/td><\/tr><tr><td>Benefits paid<\/td><td>−1,322<\/td><\/tr><tr><td>Actuarial gain or loss<\/td><td>0<\/td><\/tr><tr><td>Benefit obligations at end of year<\/td><td>£28,879<\/td><\/tr><tr><td>Change in plan assets<\/td><td><\/td><\/tr><tr><td>Fair value of plan assets at beginning of year<\/td><td>£23,432<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>1,302<\/td><\/tr><tr><td>Employer contributions<\/td><td>693<\/td><\/tr><tr><td>Benefits paid<\/td><td>−1,322<\/td><\/tr><tr><td>Fair value of plan assets at end of year<\/td><td>£24,105<\/td><\/tr><tr><td>Funded status at beginning of year<\/td><td>−£4,984<\/td><\/tr><tr><td>Funded status at end of year<\/td><td>−£4,774<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "FSA:ECO-M2-Q7", "rel": [], "los": "FSA · ECO Module 2 Q7", "tier": null, "type": "", "stem": "<p>A 100 basis point decrease in investment grade corporate bond yields may affect Kensington’s plan funded status by less than the increase in the benefit obligation because:<\/p>", "options": {"A": "remeasurements from changes in assumptions are recognized in OCI, not in earnings.", "B": "a decrease in service cost will partially offset the increase.", "C": "the fair value of plan assets may simultaneously increase."}}]}, {"set": 6, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>UNAB Corporation<\/p><p>On 1 January 20X2, Deem Advisors purchased a $10 million six-year senior unsecured bond issued by UNAB Corporation. Six months later (1 July 20X2), concerned about the portfolio’s credit exposure to UNAB, Doris Morrison, the chief investment officer at Deem Advisors, buys $10 million protection on UNAB with a standardized coupon rate of 5%. The reference obligation of the CDS is the UNAB bond owned by Deem Advisors. UNAB adheres to the ISDA CDS protocols.<\/p><p>On 1 January 20X3, Morrison asks Bill Watt, a derivatives analyst, to assess the current credit quality of UNAB bonds and the value of Deem Advisors’ CDS on UNAB debt. Watt gathers the following information on UNAB’s debt issues currently trading in the market:<\/p><p>Bond 1: A two-year senior unsecured bond trading at 40% of par<\/p><p>Bond 2: A five-year senior unsecured bond trading at 50% of par<\/p><p>Bond 3: A five-year subordinated unsecured bond trading at 20% of par<\/p><p>With respect to the credit quality of UNAB, Watt makes the following statement:<\/p><p>“There is severe near-term stress in the financial markets, and UNAB’s credit curve clearly reflects the difficult environment.”<\/p><p>On 1 July 20X3, UNAB fails to make a scheduled interest payment on the outstanding subordinated unsecured obligation after a grace period; however, the company does not file for bankruptcy. Morrison asks Watt to determine if UNAB experienced a credit event and, if so, to recommend a settlement preference.<\/p><p>Kand Corporation<\/p><p>Morrison is considering purchasing protection on Kand Corporation debt to hedge the portfolio’s position in Kand. She instructs Watt to determine if an upfront payment would be required and, if so, the amount of the premium. Watt presents the information for the CDS in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Summary Data for 10-year CDS on Kand Corporation<\/p><table><tr><th>Credit spread<\/th><th>700 bps<\/th><\/tr><tr><td>Duration<\/td><td>7 years<\/td><\/tr><tr><td>Coupon rate<\/td><td>5%<\/td><\/tr><\/table><p>Morrison purchases 10-year protection on Kand Corporation debt. Two months later the credit spread for Kand Corporation has increased by 200 bps. Morrison asks Watt to close out the firm’s CDS position on Kand Corporation by entering into a new, offsetting contract.<\/p><p>Tollunt Corporation<\/p><p>Deem Advisors’ chief credit analyst recently reported that Tollunt Corporation’s five-year bond is currently yielding 7% and a comparable CDS contract has a credit spread of 4.25%. Since the current market reference rate is 2.5%, Watt has recommended executing a basis trade to take advantage of the pricing of Tollunt’s bonds and CDS. The basis trade would consist of purchasing both the bond and the CDS contract.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M5-Q1", "rel": [], "los": "FI · ECO Module 5 Q1", "tier": null, "type": "", "stem": "<p>If UNAB experienced a credit event on 1 July, Watt should recommend that Deem Advisors:<\/p>", "options": {"A": "prefer a cash settlement.", "B": "prefer a physical settlement.", "C": "be indifferent between a cash or a physical settlement."}}, {"id": "FI:ECO-M5-Q5", "rel": [], "los": "FI · ECO Module 5 Q5", "tier": null, "type": "", "stem": "<p>If Deem Advisors enters into a new offsetting contract two months after purchasing protection on Kand Corporation, this action will most likely result in:<\/p>", "options": {"A": "a loss on the CDS position.", "B": "a profit on the CDS position.", "C": "neither a loss nor a profit on the CDS position."}}]}, {"set": 7, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Claus Petersen, a pension fund equity analyst, is preparing an analysis of Rhine AG for the upcoming quarterly fund meeting. Rhine is a Germany-based manufacturer that operates three distinct divisions: children’s products (infant car seats, strollers, cribs, etc.), recreational products (bicycles, bicycle trailers, etc.), and home furnishings (contemporary furniture). All three divisions sell through retail outlets around the world.<\/p><p>The company has been pursuing an aggressive growth strategy, achieved through both foreign acquisitions and organic growth. Petersen is interested in determining how well Rhine is allocating its resources between the three divisions and the effects of the foreign acquisitions on overall performance. Exhibit 1 summarizes selected divisional and corporate data for the current year and the prior year.<\/p><p>Exhibit 1 Rhine AG Selected Divisional and Corporate Data (€ millions)<\/p><table><tr><th><\/th><th>Total for Three Divisions<\/th><th><\/th><th>Children&#x27;s Products<\/th><th><\/th><th>Recreational Products<\/th><th><\/th><th>Home Furnishings<\/th><th><\/th><\/tr><tr><td><\/td><td>Current Year<\/td><td>Prior Year<\/td><td>Current Year<\/td><td>Prior Year<\/td><td>Current Year<\/td><td>Prior Year<\/td><td>Current Year<\/td><td>Prior Year<\/td><\/tr><tr><td>Revenues<\/td><td>2,837.1<\/td><td>2,775.5<\/td><td>1,176.2<\/td><td>1,236.2<\/td><td>1,034.1<\/td><td>930.0<\/td><td>626.8<\/td><td>609.3<\/td><\/tr><tr><td>Gross profit<\/td><td>621.4<\/td><td>640.8<\/td><td>296.6<\/td><td>337.6<\/td><td>246.0<\/td><td>220.3<\/td><td>78.8<\/td><td>82.9<\/td><\/tr><tr><td>Operating profit<\/td><td>172.7<\/td><td>219.4<\/td><td>64.7<\/td><td>115.7<\/td><td>72.9<\/td><td>62.2<\/td><td>35.1<\/td><td>41.5<\/td><\/tr><tr><td>Earnings before taxes (EBT)<\/td><td>136.6<\/td><td>170.0<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><\/tr><tr><td>Net earnings after tax<\/td><td>109.9<\/td><td>132.3<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><\/tr><tr><td>Total assets<\/td><td>2,498.0<\/td><td>2,479.5<\/td><td>1,270.9<\/td><td>1,249.6<\/td><td>961.5<\/td><td>948.5<\/td><td>265.6<\/td><td>281.4<\/td><\/tr><tr><td>Capital expenditures<\/td><td>32.7<\/td><td>42.3<\/td><td>22.1<\/td><td>30.0<\/td><td>6.7<\/td><td>8.6<\/td><td>3.9<\/td><td>3.7<\/td><\/tr><tr><td>Proportion of capital expenditures<\/td><td>100%<\/td><td>100%<\/td><td>67.6%<\/td><td>70.9%<\/td><td>20.5%<\/td><td>20.3%<\/td><td>11.9%<\/td><td>8.7%<\/td><\/tr><tr><td>Proportion of total assets<\/td><td>100%<\/td><td>100%<\/td><td>50.9%<\/td><td>50.4%<\/td><td>38.5%<\/td><td>38.3%<\/td><td>10.6%<\/td><td>11.3%<\/td><\/tr><\/table><p>Petersen’s preferred method to determine which division is becoming less significant over time is to review the relationship between capital expenditures and total assets by operating division. He plans to base his conclusion on the assumption that the current year&#x27;s investment behavior is representative of future investment patterns.<\/p><p>Petersen knows that revenues in the children’s products division have suffered because of declining birth rates in Europe and North America, but he believes that if Rhine can maintain the operating margin for this division then overall company profitability should not be affected.<\/p><p>Corinna Berg, another analyst with the fund, reminds Petersen that during the current year, the US dollar weakened against the euro by 4% and that 50% of the sales in the recreational products division are sold in the United States.<\/p><p>Petersen recalls that some of the recent global expansion was aimed at establishing operations in Ireland because its statutory corporate tax rate is lower than the German rate of 29.8%. If Petersen assumes that other tax credits were the same in the current year as the prior year, he can analyze changes in Rhine’s effective tax rate to determine whether the geographic mix of the company’s profits has changed in the current year.<\/p><p>Petersen finally examines the company’s liquidity ratios, which are shown in Exhibit 2. Even though the company’s current and quick ratio have improved, his interpretation of the changes in the company’s cash conversion cycle is that the company’s liquidity position has deteriorated.<\/p><p>Exhibit 2 Rhine AG Selected Ratios<\/p><table><tr><th>Ratio<\/th><th>Current Year<\/th><th>Prior Year<\/th><th>2 Years Prior<\/th><\/tr><tr><td>Current ratio<\/td><td>2.31<\/td><td>2.17<\/td><td>1.16<\/td><\/tr><tr><td>Quick ratio<\/td><td>1.06<\/td><td>0.89<\/td><td>0.53<\/td><\/tr><tr><td>Accounts receivable turnover<\/td><td>5.82<\/td><td>6.08<\/td><td>6.11<\/td><\/tr><tr><td>Inventory turnover<\/td><td>3.78<\/td><td>3.91<\/td><td>4.09<\/td><\/tr><tr><td>Accounts payable turnover<\/td><td>5.71<\/td><td>5.78<\/td><td>5.60<\/td><\/tr><tr><td>Cash conversion cycle<\/td><td>95 days<\/td><td>90 days<\/td><td>84 days<\/td><\/tr><\/table><p>Worried that the balance sheet–based and cash flow–based accruals ratios (not shown) raise some concerns about the possible use of accruals to manage earnings, Petersen asks Berg for advice on what further type of analysis he should do as a follow-up on this issue.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M6-Q17", "rel": [], "los": "FSA · ECO Module 6 Q17", "tier": null, "type": "", "stem": "<p>If the children’s products division had been able to maintain its prior year operating margin in the current year, the company’s overall operating margin in current year, compared to the prior year, would have been:<\/p>", "options": {"A": "lower.", "B": "the same.", "C": "higher."}}]}, {"set": 8, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>The investment committee of the Calder Valley Firefighters' Pension Plan is reviewing the plan's active equity managers. The plan's consultant, Priya Nandakumar, CFA, has prepared ex ante estimates for three managers, each benchmarked to the same global equity index (Exhibit 1). All three managers have a beta of 1.0 relative to the index. The benchmark has an expected Sharpe ratio of 0.40 and expected volatility of 16%.<\/p>\n<p>Kestrel Partners runs a long-only quantitative strategy. It covers 98 stocks and rebalances twice a year, and Nandakumar judges its forecasts to be independent across stocks and across rebalancing dates. The long-only constraint keeps Kestrel's transfer coefficient at 0.50. Kestrel has offered the plan a separately managed account without the long-only constraint, which Nandakumar estimates would raise the transfer coefficient to 0.85 with no change in Kestrel's information coefficient or active risk.<\/p>\n<p>Rowan Capital has proposed holding 15% of its portfolio in cash as a liquidity buffer. A committee member, Gareth Pryce, comments: \"Holding cash dilutes both Rowan's excess return over the risk-free rate and its return relative to the benchmark, so the cash buffer will lower both Rowan's Sharpe ratio and its information ratio.\"<\/p>\n<p>The committee has set an active risk budget of 3.0% for the equity allocation and wants to hire one manager. Pryce favours Rowan \"because its active risk already matches our 3.0% budget, while Lumen's 6.0% active risk is too high for us.\"<\/p>\n<p>Finally, Nandakumar reports on last year's results for the plan's total portfolio (Exhibit 2). The plan's policy portfolio is 60% equities and 40% bonds.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Ex Ante Estimates for Active Equity Managers (excluding Rowan's cash proposal)<\/caption><thead><tr><th>Ex ante estimate<\/th><th>Kestrel<\/th><th>Lumen<\/th><th>Rowan<\/th><\/tr><\/thead><tbody><tr><td>Information coefficient (IC)<\/td><td>0.05<\/td><td>&mdash;<\/td><td>&mdash;<\/td><\/tr><tr><td>Transfer coefficient (TC), current mandate<\/td><td>0.50<\/td><td>&mdash;<\/td><td>&mdash;<\/td><\/tr><tr><td>Information ratio<\/td><td>&mdash;<\/td><td>0.42<\/td><td>0.35<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>6.0%<\/td><td>3.0%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Calder Valley Pension Plan, Last Year<\/caption><thead><tr><th>Asset class<\/th><th>Actual weight<\/th><th>Policy weight<\/th><th>Portfolio return<\/th><th>Benchmark return<\/th><\/tr><\/thead><tbody><tr><td>Equities<\/td><td>65%<\/td><td>60%<\/td><td>10.2%<\/td><td>9.0%<\/td><\/tr><tr><td>Bonds<\/td><td>35%<\/td><td>40%<\/td><td>2.8%<\/td><td>3.0%<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s08-q1", "rel": [], "los": "Agent Mock 1 Q29", "tier": null, "type": "", "stem": "If the plan accepts Kestrel's offer of an unconstrained account, Kestrel's expected active return is <i>closest<\/i> to:", "options": {"A": "2.98%.", "B": "3.50%.", "C": "4.21%."}}, {"id": "cMock1:m1-s08-q2", "rel": [], "los": "Agent Mock 1 Q30", "tier": null, "type": "", "stem": "Regarding Pryce's comment on Rowan's cash buffer, the <i>most likely<\/i> effect of the cash buffer is that Rowan's:", "options": {"A": "Sharpe ratio and information ratio are both unchanged.", "B": "Sharpe ratio decreases and its information ratio is unchanged.", "C": "Sharpe ratio is unchanged and its information ratio decreases."}}]}, {"set": 9, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Valtek Industrial Holdings, a manufacturer of packaging machinery, prepares its financial statements under IFRS. Valtek is not a venture capital organization, mutual fund, or similar entity. On 1 January 2025, Valtek completed two transactions.<\/p>\n<p>First, it paid &euro;84 million for 35% of the voting shares of Orsa Components, a supplier of precision bearings. Valtek appointed two of Orsa's seven directors and accounts for the investment using the equity method. At the acquisition date, the fair values of Orsa's assets and liabilities equaled their book values except for plant and equipment, as shown in Exhibit 1.<\/p>\n<p>Second, Valtek paid &euro;240 million in cash for 80% of Brenna Systems, a maker of food-grade conveyor belts. Valtek controls Brenna and accounts for the business combination using the acquisition method. Brenna holds an operating licence for food-contact manufacturing that Brenna developed internally; the licence is not recorded on Brenna's balance sheet but can be sold separately, and an independent appraiser valued it at &euro;40 million. Valtek's CFO, Paulina Rademacher, elects the full goodwill method and estimates the fair value of the noncontrolling interest using the price Valtek paid per share.<\/p>\n<p>Rademacher is preparing a presentation for analysts. Lukas Engel, a junior analyst, asks how Valtek's ratios would have differed had Brenna been accounted for using the equity method instead of being consolidated. Engel also asks how the Orsa investment would have been reported if Valtek prepared its statements under US GAAP.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Selected Data for Orsa Components<\/caption><thead><tr><th>Orsa Components (&euro; millions)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Book value of net assets, 1 Jan 2025<\/td><td>180<\/td><\/tr><tr><td>Plant and equipment: book value / fair value, 1 Jan 2025<\/td><td>95 / 135<\/td><\/tr><tr><td>Remaining useful life of plant and equipment (straight-line, no salvage)<\/td><td>7 years<\/td><\/tr><tr><td>Net income, 2025<\/td><td>30<\/td><\/tr><tr><td>Dividends paid, 2025<\/td><td>12<\/td><\/tr><tr><td>Market value of 100% of Orsa's shares, 31 Dec 2025<\/td><td>262<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Selected Data for Brenna Systems<\/caption><thead><tr><th>Brenna Systems (&euro; millions)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Book value of identifiable net assets, 1 Jan 2025<\/td><td>190<\/td><\/tr><tr><td>Fair value of property, plant and equipment in excess of book value<\/td><td>20<\/td><\/tr><tr><td>Fair value of operating licence (not on Brenna's balance sheet)<\/td><td>40<\/td><\/tr><tr><td>Revenue, 2025<\/td><td>310<\/td><\/tr><tr><td>Net income, 2025<\/td><td>26<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s03-q3", "rel": [], "los": "Agent Mock 1 Q11", "tier": null, "type": "", "stem": "In response to Engel's question about Brenna, compared with the equity method, consolidating Brenna <i>most likely<\/i> results in Valtek reporting a:", "options": {"A": "lower net profit margin.", "B": "higher net income attributable to Valtek's shareholders.", "C": "lower total equity."}}]}, {"set": 10, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Gurmeet Singh, an equity portfolio manager at a wealth management company, meets with junior research analyst Cindy Ho to discuss potential investments in three companies: Sienna Limited, Colanari Manufacturing, and Bern Pharmaceutical.<\/p><p>Singh and Ho review key financial data from Sienna’s most recent annual report, which are presented in Exhibit 1 and Exhibit 2, to assess the company’s ability to generate free cash flow.<\/p><p>Exhibit 1<\/p><p>Selected Data from Sienna Limited’s Statement of Income for the Year Ended 31 December 2019 (Amounts in Millions of Euros)<\/p><table><tr><th>EBITDA<\/th><th>4,000<\/th><\/tr><tr><td>Depreciation expense<\/td><td>800<\/td><\/tr><tr><td>Operating income (EBIT)<\/td><td>3,200<\/td><\/tr><tr><td>Interest expense<\/td><td>440<\/td><\/tr><tr><td>Tax rate<\/td><td>35%<\/td><\/tr><\/table><p>Exhibit 2<\/p><p>Sienna Limited’s Statement of Cash Flows for the Year Ended 31 December 2019 (Amounts in Millions of Euros)<\/p><p>Cash flow from operations<\/p><table><tr><th>Net income<\/th><th>1,794<\/th><\/tr><tr><td>Plus: Depreciation<\/td><td>800<\/td><\/tr><tr><td>Increase in accounts receivable<\/td><td>(2,000)<\/td><\/tr><tr><td>Increase in inventory<\/td><td>(200)<\/td><\/tr><tr><td>Increase in accounts payable<\/td><td>1,000<\/td><\/tr><tr><td>Cash flow from operations<\/td><td>1,394<\/td><\/tr><\/table><p>Cash flow from investing activities<\/p><table><tr><th>Purchases of PP&amp;E<\/th><th>(1,000)<\/th><\/tr><\/table><p>Cash flow from financing activities<\/p><table><tr><th>Borrowing (repayment)<\/th><th>500<\/th><\/tr><tr><td>Total cash flow<\/td><td>894<\/td><\/tr><\/table><p>Singh and Ho also discuss the impact of dividends, share repurchases, and leverage on Sienna’s free cash flow. Ho tells Singh the following:<\/p><p>Statement 1:<\/p><p>Changes in leverage do not impact free cash flow to equity.<\/p><p>Statement 2:<\/p><p>Transactions between the company and its shareholders, such as the payment of dividends or share repurchases, do affect free cash flow.<\/p><p>Singh and Ho next analyze Colanari. Last year, Colanari had FCFF of €140 million. Singh instructs Ho to perform an FCFF sensitivity analysis of Colanari’s firm value using the three sets of estimates presented in Exhibit 3. In her analysis, Ho assumes a tax rate of 35% and a stable capital structure of 30% debt and 70% equity.<\/p><p>Exhibit 3<\/p><p>Sensitivity Analysis for Colanari Valuation<\/p><table><tr><th>Variable<\/th><th>Base-Case Estimate<\/th><th>Low Estimate<\/th><th>High Estimate<\/th><\/tr><tr><td>FCFF growth rate<\/td><td>4.6%<\/td><td>4.2%<\/td><td>5.0%<\/td><\/tr><tr><td>Before-tax cost of debt<\/td><td>4.9%<\/td><td>3.9%<\/td><td>5.9%<\/td><\/tr><tr><td>Cost of equity<\/td><td>11.0%<\/td><td>10.0%<\/td><td>12.0%<\/td><\/tr><\/table><p>Finally, Singh and Ho analyze Bern. Selected financial information on Bern is presented in Exhibit 4.<\/p><p>Exhibit 4<\/p><p>Selected Financial Data on Bern Pharmaceutical<\/p><table><tr><th><\/th><th>Market Value<\/th><th>Required Return<\/th><\/tr><tr><td>Debt<\/td><td>€15,400 million<\/td><td>6.0%<\/td><\/tr><tr><td>Preferred stock<\/td><td>€4,000 million<\/td><td>5.5%<\/td><\/tr><tr><td>Common stock<\/td><td>€18,100 million<\/td><td>11.0%<\/td><\/tr><tr><td>FCFF, most recent year<\/td><td>€3,226 million<\/td><td><\/td><\/tr><tr><td>Corporate tax rate<\/td><td>26.9%<\/td><td><\/td><\/tr><\/table><p>Singh notes that Bern has two new drugs that are currently in clinical trials awaiting regulatory approval. In addition to its operating assets, Bern owns a parcel of land from a decommissioned manufacturing facility with a current market value of €50 million that is being held for investment. Singh and Ho elect to value Bern under two scenarios:<\/p><p>Scenario 1:<\/p><p>Value Bern assuming the two new drugs receive regulatory approval. In this scenario, FCFF is forecast to grow at 4.5% into perpetuity.<\/p><p>Scenario 2:<\/p><p>Value Bern assuming the two new drugs do not receive regulatory approval. In this scenario, FCFF is forecast using a stable growth in FCFF of 1.5% for the next three years and then 0.75% thereafter into perpetuity.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M3-Q36", "rel": [], "los": "Equity · ECO Module 3 Q36", "tier": null, "type": "", "stem": "<p>Based on Exhibit 3, Ho’s FCFF sensitivity analysis should conclude that Colanari’s value is most sensitive to the:<\/p>", "options": {"A": "FCFF growth rate.", "B": "before-tax cost of debt.", "C": "required rate of return for equity."}}, {"id": "Equity:ECO-M3-Q37", "rel": [], "los": "Equity · ECO Module 3 Q37", "tier": null, "type": "", "stem": "<p>Based on Exhibit 4, Bern’s firm value under Scenario 1 is closest to:<\/p>", "options": {"A": "€100,951.3 million.", "B": "€105,349.1 million.", "C": "€105,399.1 million."}}]}, {"set": 11, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q73", "rel": [], "los": "FSA · ECO Module 3 Q73", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information (in GBP) as of 31 December about the UK subsidiary of a German company that purchased property and equipment on 1 January:<\/p><table><tr><th>Cash<\/th><th>1,000,000<\/th><\/tr><tr><td>Accounts receivable<\/td><td>700,000<\/td><\/tr><tr><td>Inventory<\/td><td>800,000<\/td><\/tr><tr><td>Property and equipment<\/td><td>4,500,000<\/td><\/tr><tr><td>Total assets<\/td><td>7,000,000<\/td><\/tr><\/table><p>The following exchange rate information was gathered:<\/p><table><tr><th>Date<\/th><th>EUR/GBP<\/th><\/tr><tr><td>1 January<\/td><td>1.1550<\/td><\/tr><tr><td>31 December<\/td><td>1.1625<\/td><\/tr><tr><td>Weighted-average rate when inventory was acquired<\/td><td>1.1430<\/td><\/tr><\/table><p>Note: EUR/GBP is the amount of EUR per 1 GBP.<\/p><p>The functional currency of the subsidiary is GBP. After translating the UK subsidiary&#x27;s balance sheet into the parent company&#x27;s currency (EUR), the UK subsidiary would recognize total assets of:<\/p>", "options": {"A": "EUR 8,088,150.", "B": "EUR 8,121,900.", "C": "EUR 8,137,500."}}, {"id": "FSA:ECO-M3-Q76", "rel": [], "los": "FSA · ECO Module 3 Q76", "tier": null, "type": "", "stem": "<p>A company entered into a foreign currency transaction whose settlement date falls in a subsequent accounting period. Will the unrealized gain or loss on this foreign currency transaction be reported on the financial statements for the current period?<\/p>", "options": {"A": "No", "B": "Yes, it will be reported on the income statement", "C": "Yes, it will be reported in other comprehensive income"}}, {"id": "FSA:ECO-M3-Q80", "rel": [], "los": "FSA · ECO Module 3 Q80", "tier": null, "type": "", "stem": "<p>The foreign currency of a subsidiary has consistently depreciated against the parent&#x27;s presentation currency. The subsidiary does not have any non-monetary liabilities, but does have long-term debt issued five years ago. Compared to the current rate method, the temporal method of translation most likely results in:<\/p>", "options": {"A": "lower reported assets.", "B": "higher reported equity.", "C": "higher reported liabilities."}}, {"id": "FSA:ECO-M3-Q81", "rel": [], "los": "FSA · ECO Module 3 Q81", "tier": null, "type": "", "stem": "<p>A subsidiary of a European based parent company operates in a foreign country experiencing hyperinflation. The general price level and exchange rates for the country were reported as:<\/p><p>General<\/p><p>Price Level<\/p><p>Euro (€) per<\/p><p>Foreign Currency<\/p><table><tr><th>Beginning of the year<\/th><th>150<\/th><th>0.360<\/th><\/tr><tr><td>Average for the year<\/td><td>250<\/td><td>0.210<\/td><\/tr><tr><td>End of the year<\/td><td>375<\/td><td>0.160<\/td><\/tr><\/table><p>If the subsidiary reported a capital stock of 100,000 (in foreign currency units) at the beginning of the year, the reported value at the end of the year is closest to:<\/p>", "options": {"A": "€16,000.", "B": "€27,000.", "C": "€40,000."}}]}, {"set": 12, "session": 1, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "CI:ECO-M1-Q48", "rel": [], "los": "CI · ECO Module 1 Q48", "tier": null, "type": "", "stem": "<p>An analyst gathers the following financial statement data of three companies for the most recent fiscal year (amounts are in $ millions):<\/p><table><tr><th><\/th><th>Company A<\/th><th>Company B<\/th><th>Company C<\/th><\/tr><tr><td>Net income<\/td><td>550<\/td><td>725<\/td><td>254<\/td><\/tr><tr><td>Cash flow from operations<\/td><td>745<\/td><td>810<\/td><td>295<\/td><\/tr><tr><td>Capital expenditures<\/td><td>315<\/td><td>432<\/td><td>75<\/td><\/tr><tr><td>Net borrowing<\/td><td>–100<\/td><td>–250<\/td><td>–85<\/td><\/tr><tr><td>Dividends paid<\/td><td>135<\/td><td>40<\/td><td>45<\/td><\/tr><tr><td>Stock repurchases<\/td><td>65<\/td><td>70<\/td><td>50<\/td><\/tr><\/table><p>Based on the FCFE coverage ratio, the company with the greatest dividend safety is:<\/p>", "options": {"A": "Company A.", "B": "Company B.", "C": "Company C."}}, {"id": "CI:ECO-M1-Q51", "rel": [], "los": "CI · ECO Module 1 Q51", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information about a company with a stable dividend policy:<\/p><table><tr><th>Previous year&#x27;s EPS<\/th><th>$2.00<\/th><\/tr><tr><td>Previous year&#x27;s payout ratio<\/td><td>30%<\/td><\/tr><tr><td>Current year&#x27;s expected EPS<\/td><td>$2.50<\/td><\/tr><tr><td>Target payout ratio<\/td><td>36%<\/td><\/tr><\/table><p>If the company uses a 3-year period to adjust its dividends, the expected increase in the current year dividend per share should be:<\/p>", "options": {"A": "$0.10.", "B": "$0.20.", "C": "$0.30."}}, {"id": "CI:ECO-M1-Q54", "rel": [], "los": "CI · ECO Module 1 Q54", "tier": null, "type": "", "stem": "<p>Based on global trends in corporate payout policies, which of the following has generally decreased over time?<\/p>", "options": {"A": "Dividend payout ratios", "B": "Aggregate dividend amounts paid", "C": "Percentage of companies paying dividends"}}, {"id": "CI:ECO-M1-Q57", "rel": [], "los": "CI · ECO Module 1 Q57", "tier": null, "type": "", "stem": "<p>Which of the following would best constrain management&#x27;s ability to overinvest by taking on negative NPV projects?<\/p>", "options": {"A": "Increase stock dividends", "B": "Increase internally financed cash dividends", "C": "Set minimum levels of EBITDA coverage of interest charges as a condition for paying dividends"}}]}, {"set": 13, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q55", "rel": [], "los": "FSA · ECO Module 1 Q55", "tier": null, "type": "", "stem": "<p>A US company reporting under US GAAP forms a joint venture with a European company reporting under IFRS. The two companies have joint control of this venture. When reporting the venture&#x27;s results, it is most likely that:<\/p>", "options": {"A": "each company will present its proportionate share of each financial statement line item.", "B": "each company will present a single line item on its income statement and balance sheet.", "C": "the US company will present a single line item and the European company will present its proportionate share of each line item."}}, {"id": "FSA:ECO-M1-Q56", "rel": [], "los": "FSA · ECO Module 1 Q56", "tier": null, "type": "", "stem": "<p>A company reporting under IFRS initially classified its holdings of debt and equity instruments as fair value through profit and loss. The company&#x27;s business model has changed, and if it bought the same securities today, it would classify them as fair value through other comprehensive income. The company is permitted to reclassify:<\/p>", "options": {"A": "debt instruments only.", "B": "equity instruments only.", "C": "both debt instruments and equity instruments."}}, {"id": "FSA:SCH-M1-03", "rel": [], "los": "FSA · Schweser MQ 7.3 변형", "tier": null, "type": "", "stem": "<p>Using the same facts (Delta owns 30% of Echo; Echo NI $600,000, dividends $200,000), the investment income Delta reports on its income statement for the year is:<\/p>", "options": {"A": "$60,000.", "B": "$120,000.", "C": "$180,000."}}]}, {"set": 14, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Laura Mathews recently hired Robert Smith, an investment adviser at Shire Gate Advisers, to assist her in investing. Mathews states that her investment time horizon is short, approximately two years or less. Smith gathers information on spot rates for on-the-run annual-coupon government securities and swap spreads, as presented in Exhibit 1. Shire Gate Advisers recently published a report for its clients stating its belief that, based on the weakness in the financial markets, interest rates will remain stable, the yield curve will not change its level or shape for the next two years, and swap spreads will also remain unchanged.<\/p><p>Exhibit 1<\/p><p>Government Spot Rates and Swap Spreads<\/p><table><tr><th>Maturity (years)<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td>Government spot rate<\/td><td>2.25%<\/td><td>2.70%<\/td><td>3.30%<\/td><td>4.05%<\/td><\/tr><tr><td>Swap spread<\/td><td>0.25%<\/td><td>0.30%<\/td><td>0.45%<\/td><td>0.70%<\/td><\/tr><\/table><p>Smith decides to examine the following three investment options for Mathews:<\/p><p>Investment 1:<\/p><p>Buy a government security that would have an annualized return that is nearly risk free. Smith is considering two possible implementations: a two-year investment or a combination of two one-year investments.<\/p><p>Investment 2:<\/p><p>Buy a four-year, zero-coupon corporate bond and then sell it after two years. Smith illustrates the returns from this strategy using the swap rate as a proxy for corporate yields.<\/p><p>Investment 3:<\/p><p>Buy a lower-quality, two-year corporate bond with a coupon rate of 4.15% and a Z-spread of 65 bps.<\/p><p>When Smith meets with Mathews to present these choices, Mathews tells him that she is somewhat confused by the various spread measures. She is curious to know whether there is one spread measure that could be used as a good indicator of the risk and liquidity of money market securities during the recent past.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q27", "rel": [], "los": "FI · ECO Module 1 Q27", "tier": null, "type": "", "stem": "<p>In presenting Investment 2, Smith should show an annual return closest to:<\/p>", "options": {"A": "4.31%.", "B": "5.42%.", "C": "6.53%."}}]}, {"set": 15, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Alise Pukitis works as an analyst for Winter Stone Associates. Winter Stone is a hedge fund consulting specialist that provides analysis and access to hedge funds for family offices and high-net-worth investment advisers. Amy Chu is a senior wealth adviser with Brownstein Legacy Associates who has engaged Winter Stone to educate the firm on current investment opportunities within the hedge fund universe.<\/p><p>In an initial meeting with Chu, Pukitis provides a summary of the hedge fund landscape. Brownstein has historically invested in traditional long-only investment strategies in public markets for its clients. Pukitis tells Chu to expect the following characteristics when reviewing the hedge fund universe:<\/p><p>Characteristic 1: Less regulatory oversight and a relatively narrow investment universe.<\/p><p>Characteristic 2: Less aggressive investment styles and increased use of leverage.<\/p><p>Characteristic 3: Investor-aligned fee structures and typically higher returns from privately placed versus liquid alternative strategies.<\/p><p>Pukitis explains that hedge funds are categorized and tracked by type. Exhibit 1 shows the six broad hedge fund categories tracked by Winter Stone.<\/p><p>Exhibit 1: Hedge Fund Categories Tracked by Winter Stone<\/p><table><tr><th>Hedge Fund Category<\/th><th>Included Hedge Fund Strategies<\/th><\/tr><tr><td>Equity related<\/td><td>Long-short equity, dedicated short bias, equity market neutral<\/td><\/tr><tr><td>Event-driven strategies<\/td><td>Merger arbitrage, distressed securities<\/td><\/tr><tr><td>Relative value<\/td><td>Fixed-income arbitrage, convertible bond arbitrage<\/td><\/tr><tr><td>Opportunistic<\/td><td>Global macro, managed futures, reinsurance<\/td><\/tr><tr><td>Specialist<\/td><td>Volatility strategies involving options<\/td><\/tr><tr><td>Multimanager<\/td><td>Multistrategy, funds of hedge funds<\/td><\/tr><\/table><p>After reviewing the information, Chu tells Pukitis that she would like to receive more information on equity-related strategies. Pukitis makes the following statements to Chu regarding equity-related hedge fund managers:<\/p><p>Statement 1: The most attractive feature of long–short equity managers is the lower beta sensitivity to equity markets than long-only equity managers.<\/p><p>Statement 2: Dedicated short-bias managers typically benefit from higher levels of leverage and more frequent use of leverage than long–short or equity market neutral strategies.<\/p><p>Statement 3: Equity market–neutral managers are likely to have high levels of diversification and turnover ratios.<\/p><p>Brownstein’s investment committee has identified the following characteristics it is seeking in the selection of a hedge fund manager: low to moderate levels of leverage, idiosyncratic alpha, long biased, and no concerns about investing in an illiquid strategy. Chu reviews a number of strategies on Winter Stone’s recommended list but is having a difficult time determining which strategy will meet the needs of Brownstein’s investment committee. She reaches out to Pukitis for help identifying the appropriate strategy to bring to the committee for approval.<\/p>", "exhibits": [], "qs": [{"id": "AI:ECO-M4-Q34", "rel": [], "los": "AI · ECO Module 4 Q34", "tier": null, "type": "", "stem": "<p>Which of Pukitis statement’s to Chu regarding equity-related hedge fund managers is most likely correct?<\/p>", "options": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}}]}, {"set": 16, "session": 1, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>Iesha Azarov is a senior analyst at Ganymede Moon Partners, where he works with junior analyst Pàola Bector. Bector develops ML models for two unstructured stock sentiment datasets, Dataset ABC and Dataset XYZ. Both datasets have been cleaned and preprocessed in preparation for text exploration and model training.<\/p><p>Following an exploratory data analysis that revealed Dataset ABC&#x27;s most frequent tokens, Bector conducts a collection frequency analysis. Bector then computes TF–IDF for several words in the collection and tells Azarov the following:<\/p><p>Statement 1: IDF is equal to the inverse of the document frequency measure.<\/p><p>Statement 2: TF at the collection level is multiplied by IDF to calculate TF–IDF.<\/p><p>Statement 3: TF–IDF values vary by the number of documents in the dataset, and therefore, model performance can vary when applied to a dataset with just a few documents.<\/p><p>Bector notes that Dataset ABC is characterized by the absence of ground truth.<\/p><p>For Dataset XYZ, each sentence has been labeled as either positive sentiment (Class &quot;1&quot;) or negative sentiment (Class &quot;0&quot;). Azarov requests that Bector apply the ML model to the test dataset for Dataset XYZ, assuming a threshold p-value of 0.65. Exhibit 2 contains a sample of results from the test dataset corpus.<\/p><p>Exhibit 2 – 10 Sample Results of Test Data for Dataset XYZ<\/p><table><tr><th>Sentence #<\/th><th>Actual Sentiment<\/th><th>Target p-Value<\/th><\/tr><tr><td>1<\/td><td>1<\/td><td>0.75<\/td><\/tr><tr><td>2<\/td><td>0<\/td><td>0.45<\/td><\/tr><tr><td>3<\/td><td>1<\/td><td>0.64<\/td><\/tr><tr><td>4<\/td><td>1<\/td><td>0.81<\/td><\/tr><tr><td>5<\/td><td>0<\/td><td>0.43<\/td><\/tr><tr><td>6<\/td><td>1<\/td><td>0.78<\/td><\/tr><tr><td>7<\/td><td>0<\/td><td>0.59<\/td><\/tr><tr><td>8<\/td><td>1<\/td><td>0.60<\/td><\/tr><tr><td>9<\/td><td>0<\/td><td>0.67<\/td><\/tr><tr><td>10<\/td><td>0<\/td><td>0.54<\/td><\/tr><\/table><p>Bector makes the following remarks regarding model training:<\/p><p>Remark 1: Method selection is governed by such factors as the type of data and the size of data.<\/p><p>Remark 2: In the performance evaluation stage, model fitting errors, such as bias error and variance error, are used to measure goodness of fit.<\/p>", "exhibits": [], "qs": [{"id": "Quant:ECO-M7-Q26", "rel": [], "los": "Quant · ECO Module 7 Q26", "tier": null, "type": "", "stem": "<p>Which of Bector&#x27;s statements regarding TF, IDF, and TF–IDF is correct?<\/p>", "options": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}}, {"id": "Quant:ECO-M7-Q31", "rel": [], "los": "Quant · ECO Module 7 Q31", "tier": null, "type": "", "stem": "<p>Which of Bector&#x27;s remarks related to model training is correct?<\/p>", "options": {"A": "Only Remark 1", "B": "Only Remark 2", "C": "Both Remark 1 and Remark 2"}}]}, {"set": 17, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Randy Gorver, chief risk officer at Eastern Regional Bank, and John Abell, assistant risk officer, are currently conducting a risk assessment of several of the bank’s independent investment functions. These reviews include the bank’s fixed-income investment portfolio and an equity fund managed by the bank’s trust department. Gorver and Abell are also assessing Eastern Regional’s overall risk exposure.<\/p><p>Eastern Regional Bank Fixed-Income Investment Portfolio<\/p><p>The bank’s proprietary fixed-income portfolio is structured as a barbell portfolio: About half of the portfolio is invested in zero-coupon Treasuries with maturities in the 3- to 5-year range (Portfolio P1), and the remainder is invested in zero-coupon Treasuries with maturities in the 10- to 15-year range (Portfolio P2). Georges Montes, the portfolio manager, has discretion to allocate between 40% and 60% of the assets to each maturity “bucket.” He must remain fully invested at all times. Exhibit 1 shows details of this portfolio.<\/p><p>Exhibit 1<\/p><p>US Treasury Barbell Portfolio<\/p><table><tr><th><\/th><th>P1 (3–5 Years)<\/th><th>P2 (10–15 Years)<\/th><\/tr><tr><td>Average duration<\/td><td>3.30<\/td><td>11.07<\/td><\/tr><tr><td>Average yield to maturity<\/td><td>1.45%<\/td><td>2.23%<\/td><\/tr><tr><td>Market value<\/td><td>$50.3 million<\/td><td>$58.7 million<\/td><\/tr><\/table><p>Trust Department’s Equity Fund<\/p><p>a Use of Options: The trust department of Eastern Regional Bank manages an equity fund called the Index Plus Fund, with $325 million in assets. This fund’s objective is to track the S&amp;P 500 Index price return while producing an income return 1.5 times that of the S&amp;P 500. The bank’s chief investment officer (CIO) uses put and call options on S&amp;P 500 stock index futures to adjust the risk exposure of certain client accounts that have an investment in this fund. The portfolio of a 60-year-old widow with a below-average risk tolerance has an investment in this fund, and the CIO has asked his assistant, Janet Ferrell, to propose an options strategy to bring the portfolio’s delta to 0.90.<\/p><p>b Value at Risk: The Index Plus Fund has a value at risk (VaR) of $6.5 million at 5% for one day. Gorver asks Abell to write a brief summary of the portfolio VaR for the report he is preparing on the fund’s risk position.<\/p><p>Combined Bank Risk Exposures<\/p><p>The bank has adopted a new risk policy, which requires forward-looking risk assessments in addition to the measures that look at historical risk characteristics. Management has also become very focused on tail risk since the subprime crisis and is evaluating the bank’s capital allocation to certain higher-risk lines of business. Gorver must determine what additional risk metrics to include in his risk reporting to address the new policy. He asks Abell to draft a section of the risk report that will address the risk measures’ adequacy for capital allocation decisions.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M5-Q5", "rel": [], "los": "PM · ECO Module 5 Q5", "tier": null, "type": "", "stem": "<p>Which of the following statements should not be included in Abell’s report to management regarding the use of risk measures in capital allocation decisions?<\/p>", "options": {"A": "VaR measures capture the increased liquidity risk during stress periods.", "B": "Stress tests and scenario analysis can be used to evaluate the effect of outlier events on each line of business.", "C": "VaR approaches that can accommodate a non-normal distribution are critical to understand relative risk across lines of business."}}]}, {"set": 18, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Halstead Capital Advisors is an investment advisory firm that specializes in taxable fixed-income investing. Its clients consist of medium sized foundations and endowments who select outside managers such as Halstead after having formulated their investment policy and asset allocation targets.<\/p><p>Halstead’s chief investment strategist, Charles Scott, and quantitative analyst, Catherine Bird, are meeting to discuss a research report that Bird is producing. The report will address various fixed-income investing topics, including investment strategies, credit spreads, and yield curve movements.<\/p><p>Bird is evaluating two US Treasury instruments. The first is a newly issued 7.00% coupon bond with a 5-year maturity issued at a price of $101.15 ($100.00 face value) with a yield to maturity of 6.72%. The second is newly issued zero-coupon bond with a 5-year maturity issued at a price of $71.30 ($100.00 face value) with a yield to maturity of 7.00%. Current US Treasury spot rates and extrapolated forward rates are provided in Exhibit 1. Bird expects that the future path of interest rates will follow that which is implied by the forward curve.<\/p><p>Exhibit 1 Spot and Forward Interest Rates<\/p><table><tr><th>Maturity (n)<\/th><th>Spot rate r(n)<\/th><th>One-year forward rate n−1 years forward, f(n−1,1)<\/th><th>(n−1)-year forward rate one year forward, f(1,n−1)<\/th><\/tr><tr><td>1<\/td><td>3.00%<\/td><td>3.00%<\/td><td>3.00%<\/td><\/tr><tr><td>2<\/td><td>4.00%<\/td><td>5.01%<\/td><td>5.01%<\/td><\/tr><tr><td>3<\/td><td>5.00%<\/td><td>7.03%<\/td><td>6.01%<\/td><\/tr><tr><td>4<\/td><td>6.00%<\/td><td>9.06%<\/td><td>7.02%<\/td><\/tr><tr><td>5<\/td><td>7.00%<\/td><td>11.10%<\/td><td>8.02%<\/td><\/tr><\/table><p>Bird proposes to review other credit spread indicators that measure credit and liquidity risk for money market securities, general creditworthiness of individual debt issuers, and counterparty risk. Bird offers the following statements about measures of credit risk:<\/p><p>• Statement 1: The TED spread represents the difference between MRR and overnight bank lending rates.<\/p><p>• Statement 2: The MRR–OIS spread represents the difference between MRR and corporate bond spreads.<\/p><p>• Statement 3: The Z spread represents the constant basis point spread that is added to the implied spot yield curve to measure the price of credit risky bonds.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q75", "rel": [], "los": "FI · ECO Module 1 Q75", "tier": null, "type": "", "stem": "<p>Using the information provided in Exhibit 1 and assuming that Bird’s interest rate expectation materializes, the realized return for an investor who buys and holds to maturity the US Treasury 7.00% coupon bond would most likely be:<\/p>", "options": {"A": "less than the yield to maturity.", "B": "equal to the yield to maturity.", "C": "greater than the yield to maturity."}}]}, {"set": 19, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Susan Miller is an analyst for a global equity mutual fund. The fund is well-diversified and holds both dividend-paying and non-dividend-paying shares. She is evaluating three of the fund&#x27;s holdings.<\/p><p>One holding is Canada-based Aster, a profitable non-dividend-paying company that is viewed by the market as an acquisition target. Miller expects Aster&#x27;s level of corporate debt to change significantly over time. Because Aster reports a number of items through other comprehensive income, its net income does not always fully reflect underlying economic conditions. Miller considers the type of model she should use to value Aster.<\/p><p>A second holding, UK-based Camelia, currently pays an annual dividend of £2.30 per share. Dividends are initially expected to grow at an annual rate of 10%, but then decline linearly during an 8-year period to a final and perpetual annual growth rate of 5%. Camelia&#x27;s required return on equity is 9.25%. Miller uses the H-model to value Camelia.<\/p><p>A third holding, France-based Dahlia, is in a mature growth phase. Dahlia has a dividend payout ratio of 45%, a return on assets of 7.50%, and an equity multiplier of 1.25. Upon further analysis, Miller concludes that Dahlia is over valued.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M2-Q39", "rel": [], "los": "Equity · ECO Module 2 Q39", "tier": null, "type": "", "stem": "<p>Which of the following is the most appropriate model for Miller to use in valuing Aster?<\/p>", "options": {"A": "Residual income", "B": "Free cash flow to equity", "C": "Free cash flow to the firm"}}]}, {"set": 20, "session": 1, "topic": "Economics", "code": "ECO", "vignette": "<p>Sarah Simpson is an economist for an investment firm. She researches the economic growth of several countries. Simpson believes the growth rate of per capita income in developing countries will increase and eventually match that of developed countries.<\/p><p>Country A has a developed, slow-growing economy and a high rate of capital per worker. Exhibit 1 provides the average annual growth rates for selected economic variables in Country A over the most recent five years. Simpson uses this information to determine the contribution of capital deepening to factor productivity.<\/p><p>Exhibit 1<\/p><table><tr><th>Hours worked<\/th><th>0.6%<\/th><\/tr><tr><td>Labor productivity<\/td><td>1.4%<\/td><\/tr><tr><td>Total factor productivity<\/td><td>0.5%<\/td><\/tr><\/table><p>Country B&#x27;s potential GDP currently exceeds its actual GDP. Simpson forecasts that Country B&#x27;s potential GDP growth rate will be higher than the actual GDP growth rate over the next two years. She assesses the implications of her forecast on Country B&#x27;s economy.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q6", "rel": [], "los": "Mock 1 Session 2 Q6", "tier": null, "type": "", "stem": "<p>Which of the following policies would most likely have the greatest impact on economic growth in Country A?<\/p>", "options": {"A": "Encouraging immigration", "B": "Encouraging increased savings and investment", "C": "Loosening credit restraints in the financial sector"}}, {"id": "Mock1:mock1-2-Q7", "rel": [], "los": "Mock 1 Session 2 Q7", "tier": null, "type": "", "stem": "<p>In the most recent five years, the contribution of capital deepening to Country A&#x27;s labor productivity growth was:<\/p>", "options": {"A": "0.3%.", "B": "0.8%.", "C": "0.9%."}}]}, {"set": 21, "session": 1, "topic": "Derivatives", "code": "DER", "vignette": "<p>High Street Investment Management is an investment subadvisory firm partnering with Registered Investment Advisors to provide counsel for options trading strategies. Scott Cummins is High Street&#x27;s CEO and chief investment officer. Phyllis Schwartz leads the client relationship team. David Spelding is a recent college graduate, who just joined the firm as an analyst. Cummins and Schwartz are conducting an introductory training session on options pricing, focusing on the binomial option valuation model (i.e., the binomial model).<\/p><p>Cummins begins the session by listing, in Exhibit 1, variables and values for a binomial model to illustrate an outcome.<\/p><p>Exhibit 1 – Binomial Model Variables and Values<\/p><table><tr><th>Variable<\/th><th>Value<\/th><\/tr><tr><td>Stock price (S)<\/td><td>US$100<\/td><\/tr><tr><td>Exercise price (X)<\/td><td>US$100<\/td><\/tr><tr><td>Up factor (U)<\/td><td>1.35<\/td><\/tr><tr><td>Down factor (D)<\/td><td>0.75<\/td><\/tr><tr><td>Risk-free rate (r)<\/td><td>2.00%<\/td><\/tr><\/table><p>Schwartz states, &quot;The one-period binomial model is based on the no-arbitrage approach in which an investor does not take any risk or use his own money. Based on the information in Exhibit 1, the probability of an up move is 45%. For an investor, the no-arbitrage approach is similar to both the expectations approach and the discounted cash flow approach. Each approach is based on the investor&#x27;s expectation regarding the future course of the underlying stock price.&quot;<\/p><p>Schwartz then introduces the two-period binomial model. She states that the two-period binomial lattice can be viewed as three one-period binomial lattices and that each lattice may be used to value a call option. Schwartz instructs Spelding to use the two-period binomial model and the information in Exhibit 1 to calculate the value of a two-year European-style call option.<\/p><p>Cummins states that long-/short-hedge fund managers seek to identify and exploit any mispricing that may exist between the price of an option and the price of its underlying stock, utilizing a replicating strategy. Cummins asks Spelding to assess the three scenarios outlined in Exhibit 2, based on the information in Exhibit 1 and assuming that the price of a one-year European-style call option is $19.25.<\/p><p>Exhibit 2 – Scenarios and Replicating Strategies<\/p><table><tr><th><\/th><th>Options Trade<\/th><th>Stock Trade<\/th><th>Financing<\/th><\/tr><tr><td>Scenario 1<\/td><td>Sell<\/td><td>Buy<\/td><td>Lend<\/td><\/tr><tr><td>Scenario 2<\/td><td>Sell<\/td><td>Buy<\/td><td>Borrow<\/td><\/tr><tr><td>Scenario 3<\/td><td>Buy<\/td><td>Sell<\/td><td>Lend<\/td><\/tr><\/table><p>Schwartz then asks Spelding to use the information in Exhibit 1 to calculate the no-arbitrage value of a two-year US-style put option, assuming that the option may be exercised in one year.<\/p>", "exhibits": [], "qs": [{"id": "Deriv:ECO-M2-Q22", "rel": [], "los": "Deriv · ECO Module 2 Q22", "tier": null, "type": "", "stem": "<p>Is Schwartz&#x27;s statement about the one-period binomial model most likely correct?<\/p>", "options": {"A": "Yes", "B": "No, she is incorrect about the probability of an up move", "C": "No, she is incorrect about expectations of future stock prices"}}]}, {"set": 22, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "AI:ECO-M4-Q64", "rel": [], "los": "AI · ECO Module 4 Q64", "tier": null, "type": "", "stem": "<p>A fund-of-funds (FoF) invests equal amounts of capital in the following hedge funds, where incentive fees are calculated on returns net of management fees:<\/p><table><tr><th><\/th><th>Gross Annual Return<\/th><th>Management Fee<\/th><th>Incentive Fee<\/th><\/tr><tr><td>Fund 1<\/td><td>4.5%<\/td><td>1.8%<\/td><td>10.0%<\/td><\/tr><tr><td>Fund 2<\/td><td>3.6%<\/td><td>1.2%<\/td><td>10.0%<\/td><\/tr><\/table><p>If the FoF also charges a base fee of 1.0% and an incentive fee of 10.0%, the net annual return to FoF investors is closest to:<\/p>", "options": {"A": "0.93%.", "B": "1.17%.", "C": "3.23%."}}, {"id": "AI:ECO-M4-Q65", "rel": [], "los": "AI · ECO Module 4 Q65", "tier": null, "type": "", "stem": "<p>A manager believes that past price trends can reliably predict future relative price movements and wants to avoid a strategy that is exposed to herding effects. The manager most likely prefers a strategy that employs:<\/p>", "options": {"A": "technical analysis with systematic implementation.", "B": "technical analysis with discretionary implementation.", "C": "fundamental analysis with systematic implementation."}}]}, {"set": 23, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Juan Bolton is a fixed-income analyst at an investment firm. He is analyzing the firm&#x27;s actively managed funds and examining macroeconomic data.<\/p><p>Bolton analyzes two actively managed funds, Fund X and Fund Y. He compiles data regarding the performance of the funds and their benchmark in Exhibit 1. Fund X’s expected active risk is 1.3% and Fund Y’s ex ante information ratio is 0.27. The risk-free rate is 2.3%.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Fund X<\/th><th>Fund Y<\/th><th>Benchmark<\/th><\/tr><tr><td>Expected annual return<\/td><td>6.7%<\/td><td>6.5%<\/td><td>6.2%<\/td><\/tr><tr><td>Standard deviation of returns<\/td><td>8.9%<\/td><td>8.6%<\/td><td>8.3%<\/td><\/tr><\/table><p>Bolton uses the fundamental law of active management to evaluate the performance of the managers of Fund X and Fund Y. He observes that both managers have access to the same set of securities and rebalance their portfolios at the same frequency. Neither manager has any restrictions on implementing their forecasts when constructing portfolios. Bolton also observes that Fund X’s manager has better forecasting skills than Fund Y’s manager.<\/p><p>Next, Bolton examines the macroeconomic data of three countries for potential investment in their fixed-income securities. He collects selected market expectations for these countries, which are at similar stages of economic development, in Exhibit 2.<\/p><p>Exhibit 2<\/p><table><tr><th><\/th><th>Country 1<\/th><th>Country 2<\/th><th>Country 3<\/th><\/tr><tr><td>Real GDP growth (annual)<\/td><td>2.8%<\/td><td>4.2%<\/td><td>4.2%<\/td><\/tr><tr><td>Volatility of real GDP growth<\/td><td>0.5%<\/td><td>0.5%<\/td><td>0.8%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q24", "rel": [], "los": "Mock 1 Session 2 Q24", "tier": null, "type": "", "stem": "<p>Based on the macroeconomic data of the three countries, real short-term default-free interest rates are most likely highest in:<\/p>", "options": {"A": "Country 1.", "B": "Country 2.", "C": "Country 3."}}]}, {"set": 24, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>The credit committee of Thornbury Asset Management is reviewing a possible purchase of a bond issued by Calloway Rail Corporation, a freight railroad rated BBB. The bond is a senior unsecured, option-free, three-year bond with a 5.0% annual coupon that was issued two years ago and currently trades at 102.60 per 100 of par value. Calloway's rating outlook is stable, and the bond's modified duration is 2.73.<\/p>\n<p>Credit analyst Ines Moretti prepares the valuation inputs in Exhibit 1. Thornbury's policy is to value credit-risky bonds using market-implied (risk-neutral) default probabilities, with a constant hazard rate, a recovery rate based on the bond's seniority, and the government benchmark curve for discounting. Moretti computes the credit valuation adjustment (CVA) per 100 of par value, defining the exposure at each date as the value at that date of all remaining payments, including the coupon due on that date. She then calculates the bond's fair value and the credit spread implied by that fair value.<\/p>\n<p>Committee member Daniel Achebe asks how the hazard rate was derived. Moretti explains that it was implied from Calloway's credit default swap spreads using a reduced-form approach, and adds that a structural model could be used as a cross-check. Ache

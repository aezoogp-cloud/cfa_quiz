e CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard.\nBo thus did not violate the Standards based on his statements that he passed the CFA exam in three consecutive years as well as enrolled in the CFA Program to obtain the highest set of credentials in the global investment management industry.\nB is incorrect. Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, if a candidate passes each level of the exam in consecutive years and wants to state that he or she did so, that is not a violation of Standard VII(B) because it is a statement of fact.\nC is incorrect. Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard.", "ko": "3년 연속 합격은 사실이라 OK. 'highest set of credentials'도 목적을 말한 것이라 위반 아님.", "trap": "사실·개인 목표 진술은 허용.", "f": "", "why": {"B": "Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, if a candidate passes each level of the exam in consecutive years and wants to state that he or she did so, that is not a violation of Standard VII(B) because it is a statement of fact.", "C": "Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard."}, "orig": "ECO Module 2 Q91"}, {"id": "ECO-M2-Q92", "src": "풀어볼 문제", "module": 2, "tag": "III(D) Performance Presentation — terminated accounts, composites", "vig": null, "stem": "Lilian Gosh, CFA, a portfolio manager, is preparing a year-end performance review report with a colleague. He makes the following statements to his colleague:\n•\tStatement 1: \"We can exclude terminated accounts from performance history.\"\n•\tStatement 2: \"We can present performance using a weighted composite of similar portfolios.\"\nWhich of the statements is consistent with the Standard relating to performance presentation?", "opts": {"A": "Statement 1 only", "B": "Statement 2 only", "C": "both Statement 1 and Statement 2"}, "ans": "B", "en": "B is correct. Correct because according to Standard III(D), Performance Presentation, members can meet their obligations by presenting the performance of the weighted composite of similar portfolios rather than using a single representative account.\nA is incorrect. Incorrect because members would comply with Standard III(D), Performance Presentation, by including terminated accounts as part of performance history with a clear indication of when the accounts were terminated.\nC is incorrect. Incorrect because only Statement 2 is consistent with Standard III(D) as noted in the other choices.", "ko": "Weighted composite of similar portfolios로 보여 주는 건 OK. Terminated accounts를 빼면 위반.", "trap": "Terminated accounts 제외 = survivorship bias.", "f": "", "why": {"A": "Incorrect because members would comply with Standard III(D), Performance Presentation, by including terminated accounts as part of performance history with a clear indication of when the accounts were terminated.", "C": "Incorrect because only Statement 2 is consistent with Standard III(D) as noted in the other choices."}, "orig": "ECO Module 2 Q92"}, {"id": "ECO-M2-Q93", "src": "풀어볼 문제", "module": 2, "tag": "V(A) Diligence — reviewing others' work", "vig": null, "stem": "Han-seo Kwak, CFA, head of research at an equity fund, assigns Mi-ri Kim, CFA, a new junior analyst, to forecast the growth rate of KLE, a small-cap company. Kim performs a thorough analysis using the firm's model. After a quick review of Kim's analysis, Kwak concludes that KLE is overvalued. Based on Kwak's conclusion, the fund does not invest in KLE. After KLE's stock price rises following positive recommendations from other funds, Kwak performs a more in-depth review and identifies two assumptions in Kim's forecast that caused an overly pessimistic valuation.\nHave the Standards been violated?", "opts": {"A": "No", "B": "Yes, only by Kwak", "C": "Yes, both by Kwak and by Kim"}, "ans": "B", "en": "B is correct. Correct because Kwak violates Standard V(A), Diligence and Reasonable Basis, by doing only a quick review of Kim's work. According to Standard V(A), members and candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. If members and candidates rely on secondary or third-party research, they must make reasonable and diligent efforts to determine such research is sound. As Kim is a new junior analyst, Kwak fails to thoroughly review her forecast before providing a conclusion.\nA is incorrect. Incorrect because Kwak violates Standard V(A), Diligence and Reasonable Basis, by only doing a quick review on Kim's work before reaching a conclusion.\nC is incorrect. Incorrect according to Standard V(A), Diligence and Reasonable Basis, only Kwak violates the Standards. Kim uses the firm's model for the forecast. However, using overly pessimistic assumptions is not a violation of this Standard. Kwak, as head of research, should have thoroughly reviewed the forecast and discussed the assumptions. Therefore, only Kwak is in violation of this Standard.", "ko": "Kim의 분석을 대충 검토하고 결정한 Kwak만 V(A) 위반. Kim은 firm model로 분석했으니 위반 아님.", "trap": "결과적으로 틀린 가정이 있었다고 작성자가 자동으로 위반한 건 아니다.", "f": "", "why": {"A": "Incorrect because Kwak violates Standard V(A), Diligence and Reasonable Basis, by only doing a quick review on Kim's work before reaching a conclusion.", "C": "Incorrect according to Standard V(A), Diligence and Reasonable Basis, only Kwak violates the Standards. Kim uses the firm's model for the forecast. However, using overly pessimistic assumptions is not a violation of this Standard. Kwak, as head of research, should have thoroughly reviewed the forecast and discussed the assumptions. Therefore, only Kwak is in violation of this Standard."}, "orig": "ECO Module 2 Q93"}, {"id": "ECO-M2-Q94", "src": "안 푼 문제", "module": 2, "tag": "V(B) Communication — fee calculation change", "vig": null, "stem": "Anya Harmon, CFA, is an account manager at a wealth management firm. The client fees are calculated based on the average daily balance of assets in each client's account. The firm is switching to a new fee calculation method using end-of-billing-cycle balances, thus reducing fees for most clients. Harmon discloses the new method only to new clients.\nAccording to the Standards, is Harmon required to disclose the new fee calculation method to existing clients?", "opts": {"A": "No", "B": "Yes, to all existing clients", "C": "Yes, but only to existing clients incurring a higher fee"}, "ans": "B", "en": "B is correct. Correct because, according to Standard V(B), Communication with Clients and Prospective Clients, any changes to the fee calculation method that are different from the process agreed to by the clients must be disclosed. Only by thoroughly understanding the nature of the investment product or service can a client determine whether changes to that product or service could materially affect his or her investment objections. Therefore, Harmon should disclose the methodology to all existing clients.\nA is incorrect. Incorrect because, according to Standard V(B), Communication with Clients and Prospective Clients, any changes to the fee calculation methodology that are different from the process agreed to by the clients must be disclosed. Therefore, it is not sufficient to just disclose the new methodology to new clients, Harmon should disclose it to all existing clients as well.\nC is incorrect. Incorrect because, according to Standard V(B), Communication with Clients and Prospective Clients, any changes to the fee calculation methodology that are different from the process agreed to by the clients must be disclosed, which means that Harmon should disclose the methodology to all existing clients and not just the ones incurring higher fees.", "ko": "Fee 계산 방법 변경은 fee가 줄어도 모든 existing client에게 공개해야 한다.", "trap": "Fee가 오르는 client만이 아니다.", "f": "", "why": {"A": "Incorrect because, according to Standard V(B), Communication with Clients and Prospective Clients, any changes to the fee calculation methodology that are different from the process agreed to by the clients must be disclosed. Therefore, it is not sufficient to just disclose the new methodology to new clients, Harmon should disclose it to all existing clients as well.", "C": "Incorrect because, according to Standard V(B), Communication with Clients and Prospective Clients, any changes to the fee calculation methodology that are different from the process agreed to by the clients must be disclosed, which means that Harmon should disclose the methodology to all existing clients and not just the ones incurring higher fees."}, "orig": "ECO Module 2 Q94"}, {"id": "ECO-M2-Q95", "src": "안 푼 문제", "module": 2, "tag": "VI(A) Conflicts — increased commission rates", "vig": null, "stem": "Bala Park, CFA, is an investment adviser at Cristallo Wealth. The firm's clients have the option to invest in both internally managed mutual funds as well as third-party funds. Park invests client assets in the internally managed funds when they align with client needs. Recently, Cristallo Wealth raised the sales commission rates paid to advisers for recommending the internally managed funds. For some of these funds, the rates exceed the industry average.\nTo comply with the Standards, Park must:", "opts": {"A": "disclose to all clients the increase in commission rate.", "B": "refrain from investing in the internally managed funds.", "C": "invest for clients in funds with the lowest commission rates."}, "ans": "A", "en": "A is correct. Correct because according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity. Members and candidates must maintain their objectivity when rendering investment advice or taking investment action. Requiring members and candidates to disclose all matters that reasonably could be expected to impair the member's or candidate's objectivity allows clients and prospective clients to judge motives and possible biases for themselves.\nBecause some of the internally managed funds will now incur a higher commission rate to advisers, Park is required to disclose this potential conflict of interest to his clients.\nB is incorrect. Incorrect because Standard VI(A), Avoid or Disclose Conflicts, does not prohibit members and candidates to invest client assets in in-house products, however, members and candidates must maintain their objectivity when rendering investment advice or taking investment action.\nC is incorrect. Incorrect because according to Standard V(A), Avoid or Disclose Conflicts, members and candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Investing in the funds that pay the lowest commission to the adviser does not meet the due diligence requirements. The objective is to invest in the fund that is the most appropriate for the clients.", "ko": "내부 fund 추천 commission 인상은 conflict이므로 모든 client에게 공개.", "trap": "내부 fund 투자를 그만두거나 최저 commission fund만 고를 필요는 없다.", "f": "", "why": {"B": "Incorrect because Standard VI(A), Avoid or Disclose Conflicts, does not prohibit members and candidates to invest client assets in in-house products, however, members and candidates must maintain their objectivity when rendering investment advice or taking investment action.", "C": "Incorrect because according to Standard V(A), Avoid or Disclose Conflicts, members and candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Investing in the funds that pay the lowest commission to the adviser does not meet the due diligence requirements. The objective is to invest in the fund that is the most appropriate for the clients."}, "orig": "ECO Module 2 Q95"}, {"id": "ECO-M2-Q96", "src": "풀어볼 문제", "module": 2, "tag": "I(C) Misrepresentation — report belongs to firm", "vig": null, "stem": "Barbara Eng, CFA, is an equity research analyst at Minute Research. Eng solely authors an annual automotive sector report. After Minute Research issues the report, Eng leaves Minute Research to become an independent research analyst. Eng intends to reissue the report for distribution to her new clients.\nAccording to the Standards, who has the right to re-issue the report?", "opts": {"A": "Eng only", "B": "Minute Research only", "C": "Both Eng and Minute Research"}, "ans": "B", "en": "B is correct. Correct because, according to Standard I(C), Misrepresentation, the firm retains the right to continue using the work completed after a member or candidate has left the organization. The firm may issue future reports without providing attribution to the prior analysts.\nA is incorrect. Incorrect because, according to Standard I(C), Misrepresentation, as noted in the correct answer, only Minute Research has the right to re-issue the report.\nC is incorrect. Incorrect because, according to Standard I(C), Misrepresentation, as noted in the correct answer, only Minute Research has the right to re-issue the report.", "ko": "재직 중 작성한 report는 firm 소유. Eng은 재발행할 수 없고 Minute Research만 가능.", "trap": "혼자 썼어도 firm 소유.", "f": "", "why": {"A": "Incorrect because, according to Standard I(C), Misrepresentation, as noted in the correct answer, only Minute Research has the right to re-issue the report.", "C": "Incorrect because, according to Standard I(C), Misrepresentation, as noted in the correct answer, only Minute Research has the right to re-issue the report."}, "orig": "ECO Module 2 Q96"}, {"id": "ECO-M2-Q97", "src": "풀어볼 문제", "module": 2, "tag": "V(C) Record Retention — old firm recommendation", "vig": null, "stem": "Barrett White, CFA, leaves his equity analyst job at Barrow Investments (BI) to launch an online investment portal, where he recommends a list of stocks to buy. Last month, while still employed at BI, White issued a buy recommendation for DaBacon Co. based on his expectation that the company's market share would double over the next year. After leaving BI, White recalls his buy recommendation for DaBacon. Because White is confident that his analysis was sound, and no further analysis is required, he decides to include DaBacon in his buy recommendation list on his online investment portal.\nDid White's actions violate the Standards?", "opts": {"A": "No", "B": "Yes, because he issued the buy recommendation without supporting documentation", "C": "Yes, because he recommends the same stock he recommended at his previous employer"}, "ans": "B", "en": "B is correct. Correct because, according to Standard V(C), Record Retention, the member or candidate cannot use historical recommendations or research reports created at the previous firm because the supporting documentation is unavailable. For future use, the member or candidate must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer.\nTherefore, White cannot issue the buy recommendation unless he re-creates the documentation supporting the recommendation.\nA is incorrect. Incorrect because White violates Standard V(C), Record Retention, when he recreates the recommendation from his memory. White must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer.\nC is incorrect. Incorrect because Standard IV(A), Loyalty, does not prohibit experience or knowledge gained at one employer from being used at another employer. White is permitted to recommend the same stock but must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer.", "ko": "전 회사 자료는 supporting documentation이 없으므로 새로 분석·기록을 만들어야 다시 추천할 수 있다.", "trap": "같은 종목 추천 자체는 문제가 아니다. 근거 기록이 없는 게 문제.", "f": "", "why": {"A": "Incorrect because White violates Standard V(C), Record Retention, when he recreates the recommendation from his memory. White must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer.", "C": "Incorrect because Standard IV(A), Loyalty, does not prohibit experience or knowledge gained at one employer from being used at another employer. White is permitted to recommend the same stock but must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer."}, "orig": "ECO Module 2 Q97"}, {"id": "ECO-M2-Q98", "src": "풀어볼 문제", "module": 2, "tag": "IV(C) Supervisors — code vs compliance procedures", "vig": null, "stem": "Beatrix Kang, CFA, is the new chief compliance officer at CV Investments (CVI), a large investment firm. Kang reviews the firm's compliance procedures and believes they are adequate. She does identify the need to update the electronic signature section in these procedures. She assigns Ben Lee, CFA, to review all staff electronic signatures. After Lee's review, Kang provides clear, written guidelines for acceptable electronic signature usage and integrates the updated section into CVI's Code of Ethics.\nAccording to the Standards, Kang should have:", "opts": {"A": "declined in writing to accept supervisory responsibility.", "B": "separated the updated section from the Code of Ethics.", "C": "avoided delegating the review of the electronic signatures to Lee."}, "ans": "B", "en": "B is correct. Correct because, according to the recommended procedures of Standard IV(C), Responsibilities of Supervisors, stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. Mingling compliance procedures in the firm's code of ethics goes against the goal of reinforcing the ethical obligations of employees.\nTherefore, the updated compliance procedure section should not have been incorporated into the Code of Ethics.\nA is incorrect. Incorrect because, according to Standard IV(C), Responsibilities of Supervisors, a member or candidate with supervisory responsibility should bring an inadequate compliance system to the attention of the firm's senior managers and recommend corrective action. If the member or candidate clearly cannot discharge supervisory responsibilities because of the absence of a compliance system or because of an inadequate compliance system, the member or candidate should decline in writing to accept supervisory responsibility until the firm adopts reasonable procedures to allow adequate exercise of supervisory responsibility.\nIn this case, the compliance procedures are adequate and the outdated electronic signature would not have reasonably prevented Kang to discharge supervisory responsibilities, Therefore, Kang does not need to decline in writing to accept supervisory responsibility.\nC is incorrect. Incorrect because, according to Standard IV(C), Responsibilities of Supervisors, the conduct that constitutes reasonable supervision in a particular case depends on the number of employees supervised an the work performed by those employees. Members and candidates with oversight responsibilities for large numbers of employees may not be able to personally evaluate the conduct of these employees on a continuing basis. These members and candidates may delegate supervisory duties to subordinates.\nIn this case, given that CVI is a large firm, it appears reasonable that Kang can delegate the responsibility to Lee.", "ko": "Code of ethics는 plain language의 일반 원칙이어야 하고, 세부 compliance procedures(전자서명 등)와 분리해야 한다.", "trap": "Review 업무 위임은 허용.", "f": "", "why": {"A": "Incorrect because, according to Standard IV(C), Responsibilities of Supervisors, a member or candidate with supervisory responsibility should bring an inadequate compliance system to the attention of the firm's senior managers and recommend corrective action. If the member or candidate clearly cannot discharge supervisory responsibilities because of the absence of a compliance system or because of an inadequate compliance system, the member or candidate should decline in writing to accept supervisory responsibility until the firm adopts reasonable procedures to allow adequate exercise of supervisory responsibility.\nIn this case, the compliance procedures are adequate and the outdated electronic signature would not have reasonably prevented Kang to discharge supervisory responsibilities, Therefore, Kang does not need to decline in writing to accept supervisory responsibility.", "C": "Incorrect because, according to Standard IV(C), Responsibilities of Supervisors, the conduct that constitutes reasonable supervision in a particular case depends on the number of employees supervised an the work performed by those employees. Members and candidates with oversight responsibilities for large numbers of employees may not be able to personally evaluate the conduct of these employees on a continuing basis. These members and candidates may delegate supervisory duties to subordinates.\nIn this case, given that CVI is a large firm, it appears reasonable that Kang can delegate the responsibility to Lee."}, "orig": "ECO Module 2 Q98"}, {"id": "ECO-M2-Q99", "src": "안 푼 문제", "module": 2, "tag": "II(A) MNPI — CEO comments vs news release", "vig": null, "stem": "Benjie Lobo, CFA, a fund manager, plans to issue a report on Neustift Cheese. Lobo visits the manufacturing plant of Neustift and meets with the company's CEO, who discusses a recent news release about the acquisition of production facilities due to forecast increase in orders. The CEO mentions that he is more optimistic than the analysis in the news release. He says that he estimates a 10% reduction in the firm's costs next year. He adds that the company is also considering international expansion through the acquisition of a major competitor, and it will be announced once finalized.\nAccording to the Standards, which information is Lobo permitted to use in his report Neustift Cheese?", "opts": {"A": "The order increase forecast", "B": "The estimated reduction in costs", "C": "The planned international expansion"}, "ans": "A", "en": "A is correct. Correct because, according to Standard II(A), Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information.\nThe news release is public information once the information is disseminated to the market, it is public information that is no longer covered by this standard. Therefore Lobo is allowed to use the information in his report.\nB is incorrect. Incorrect because, according to Standard II(A), Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information. Information is 'nonpublic' until it has been disseminated or is available to the market place in general.\nThe estimated reduction in capital costs is selectively disclosed by the CEO to Lobo. Information that is made available to analysts remains nonpublic until it is made available to investors in general. Therefore, Lobo cannot use this information in his report.\nC is incorrect. Incorrect because, according to Standard II(A), Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information.  Information is 'nonpublic' until it has been disseminated or is available to the market place in general.\nThe international expansion plan has not been announced to the public. Information that is made available to analysts remains nonpublic until it is made available to investors in general. Therefore, Lobo cannot use this information in his report.", "ko": "News release(주문 증가 전망)는 public이라 사용 가능. CEO가 추가로 말한 원가 절감·인수 계획은 MNPI.", "trap": "CEO 발언이 news release를 넘으면 nonpublic.", "f": "", "why": {"B": "Incorrect because, according to Standard II(A), Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information. Information is 'nonpublic' until it has been disseminated or is available to the market place in general.\nThe estimated reduction in capital costs is selectively disclosed by the CEO to Lobo. Information that is made available to analysts remains nonpublic until it is made available to investors in general. Therefore, Lobo cannot use this information in his report.", "C": "Incorrect because, according to Standard II(A), Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information.  Information is 'nonpublic' until it has been disseminated or is available to the market place in general.\nThe international expansion plan has not been announced to the public. Information that is made available to analysts remains nonpublic until it is made available to investors in general. Therefore, Lobo cannot use this information in his report."}, "orig": "ECO Module 2 Q99"}, {"id": "ECO-M2-Q100", "src": "풀어볼 문제", "module": 2, "tag": "IV(B) Additional Compensation — board compensation", "vig": null, "stem": "Bettina Chu, CFA, an investment advisor, recently joined the board of directors of Rabbat Music, an online music platform. As a board member, she is compensated by receiving free access to Rabbat's music library. She recommends Rabbat's stock to her clients when appropriate and she discloses the board position and compensation to the clients.\nAccording to the Standards, Chu must:", "opts": {"A": "decline the music library access.", "B": "exclude Rabbat from her investment universe.", "C": "obtain written consent from her employer regarding the music library access."}, "ans": "C", "en": "C is correct. Correct because, according to Standard IV(B), Additional Compensation Arrangements, members and candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved.\nTherefore, Chu is required to obtain permission from all parties involved, including her employer, before accepting the compensation for the board position.\nA is incorrect. Incorrect because Standard IV(B), Additional Compensation Arrangement, does not require members or candidates to decline compensations when there is a potential conflict of interest. However, Standard IV(B) requires members and candidates to obtain permission from their employer before accepting compensation.\nB is incorrect. Incorrect because Standard IV(B), Additional Compensation Arrangement, does not require members or candidates to exclude the company as an investment option when there is a potential conflict of interest. However, Standard IV(B) requires members and candidates to obtain permission from their employer before accepting compensation.", "ko": "Board 보상(무료 음악 이용)은 employer 이익과 충돌할 수 있어 employer written consent가 필요.", "trap": "Client 공개만으로 부족. Employer 동의가 필요.", "f": "", "why": {"A": "Incorrect because Standard IV(B), Additional Compensation Arrangement, does not require members or candidates to decline compensations when there is a potential conflict of interest. However, Standard IV(B) requires members and candidates to obtain permission from their employer before accepting compensation.", "B": "Incorrect because Standard IV(B), Additional Compensation Arrangement, does not require members or candidates to exclude the company as an investment option when there is a potential conflict of interest. However, Standard IV(B) requires members and candidates to obtain permission from their employer before accepting compensation."}, "orig": "ECO Module 2 Q100"}, {"id": "ECO-M2-Q101", "src": "풀어볼 문제", "module": 2, "tag": "VI(A) Conflicts — beneficiary interest", "vig": null, "stem": "Biju Kassem, CFA, an analyst at a bank, is asked to write a research report on Karajan Coffee. Kassem's best friend works as a coffee taster at Karajan and shares his professional opinion with Kassem about the company's coffee. Kassem's grandmother, who owns €500,000 worth of Karajan stock, tells Kassem that she named him as the beneficiary of the portfolio in her will. Kassem's uncle is a minor Karajan shareholder and a regular fee-paying client of the bank.\nAccording to the Standards, in his report, Kassem must disclose:", "opts": {"A": "his uncle's investment account at the bank.", "B": "that he is the beneficiary of his grandmother's portfolio.", "C": "his best friend's professional opinion about Karajan's coffee."}, "ans": "B", "en": "B is correct. Correct because, according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonable be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients and employer.\nAlthough Kassem does not currently own Karajan stock, he currently has beneficiary ownership of the company's stock through his grandmother's will and should disclose this fact. Sell-side members and candidates should disclose any materially beneficial ownership interest in a security or other investment that the member or candidate is recommending.\nA is incorrect. Incorrect because, according to the Standard VI(A), Avoid or Disclose Conflicts, sell-side members and candidates should disclose any materially beneficial ownership interest in a security or other investment that the member or candidate is recommending. Further, family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship. If a member or candidate has a beneficial ownership in the account, however, the member or candidate may be subject to preclearance or reporting requirements of the employer or applicable law.\nIn this case, although Kassem's uncle is a shareholder, Kassem does not have beneficial ownership interest in his uncle's account.\nC is incorrect. Incorrect because Kassem's best friend does not possess insider information due to his position, but rather provides an opinion. Therefore, there is no potential conflict of interest here.", "ko": "할머니 portfolio의 beneficiary인 것은 material beneficial interest라 report에 공개해야 한다.", "trap": "삼촌 계좌·친구 의견은 공개 대상 아님.", "f": "", "why": {"A": "Incorrect because, according to the Standard VI(A), Avoid or Disclose Conflicts, sell-side members and candidates should disclose any materially beneficial ownership interest in a security or other investment that the member or candidate is recommending. Further, family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship. If a member or candidate has a beneficial ownership in the account, however, the member or candidate may be subject to preclearance or reporting requirements of the employer or applicable law.\nIn this case, although Kassem's uncle is a shareholder, Kassem does not have beneficial ownership interest in his uncle's account.", "C": "Incorrect because Kassem's best friend does not possess insider information due to his position, but rather provides an opinion. Therefore, there is no potential conflict of interest here."}, "orig": "ECO Module 2 Q101"}, {"id": "ECO-M3-Q3", "src": "ECO 오답", "module": 3, "tag": "VI(B) Priority of Transactions — firm proprietary account", "vig": null, "stem": "Derek Buckley, CFA, is a portfolio manager. When allocating oversubscribed IPO shares, Buckley initially allocates shares to his firm’s proprietary account based on his loyalty to his employer. He then allocates shares to his father’s standard fee-paying account at the same time as other clients’ fee-paying accounts.\nDo Buckley's actions violate the Standard related to priority of transactions?", "opts": {"A": "No", "B": "Yes, by initially allocating IPO shares to the firm’s proprietary account", "C": "Yes, by allocating shares to his father’s account at the same time as other clients’ accounts"}, "ans": "B", "en": "B is correct. Correct because Standard VI(B) states that, investment transactions for clients and employers must have priority over investment transactions in which a member or candidate is the beneficial owner. Also, client transactions must take precedence over transactions made on behalf of the member’s or candidate’s firm or personal transactions. Buckley thus violates Standard VI (B) by initially allocating to the firm’s proprietary account before allocating to client accounts.\nA is incorrect. Incorrect because, as noted in the correct answer, Buckley violates Standard VI(B), Priority of Transactions, by initially allocating to his firm’s proprietary account.\nC is incorrect. Incorrect because Buckley does not violate Standard VI (B), Priority of Transactions, by allocating to her father’s fee-paying account concurrently with other clients. Standard VI (B) states that family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship.", "ko": "Client 거래가 firm proprietary account·개인 거래보다 먼저다. 회사 계정에 먼저 배정했으니 위반. 아버지는 standard fee-paying client라 다른 client와 동시에 배정하면 문제없다.", "trap": "'회사에 대한 loyalty'라도 client보다 먼저 할 수 없다. family account도 client account면 똑같이 대우.", "f": "", "why": {"A": "Incorrect because, as noted in the correct answer, Buckley violates Standard VI(B), Priority of Transactions, by initially allocating to his firm’s proprietary account.", "C": "Incorrect because Buckley does not violate Standard VI (B), Priority of Transactions, by allocating to her father’s fee-paying account concurrently with other clients. Standard VI (B) states that family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship."}, "orig": "ECO Module 3 Q3"}, {"id": "ECO-M3-Q6", "src": "ECO 오답", "module": 3, "tag": "III(E) Confidentiality — illegal activities exception", "vig": null, "stem": "Grant Bradley, CFA, is an investment advisor for private clients in a country without applicable laws on information confidentiality. Bradley discovers that Client 1 engages in tax evasion and that Client 2 engages in money laundering activities. After consulting his firm’s legal counsel, he reports Client 1 to the tax authorities. Afterwards, Bradley reports Client 2 to the financial regulator. His reports include confidential client information relevant to the illegal activities.\nDid Bradley's actions violate the Standard relating to preservation of confidentiality?", "opts": {"A": "No", "B": "Yes, by reporting Client 1 to the tax authorities", "C": "Yes, by reporting Client 2 to the financial regulator"}, "ans": "A", "en": "A is correct. Correct because reporting tax evasion and money laundering activities does not violate Standard III(E), Preservation of Confidentiality, as both are illegal activities on the part of the client.\nAccording to Standard III(E), members and candidates must keep information about current, former, and prospective clients confidential unless: 1. The information concerns illegal activities on the part of the client; 2. Disclosure is required by law; or 3. The client or prospective client permits disclosure of the information.\nB is incorrect. Incorrect because, as noted in the correct answer, reporting the illegal activities of tax evasion and money laundering does not violate Standard III(E), Preservation of Confidentiality.\nC is incorrect. Incorrect because, as noted in the correct answer, reporting the illegal activities of tax evasion and money laundering does not violate Standard III(E), Preservation of Confidentiality.", "ko": "Tax evasion·money laundering은 client의 illegal activities라 confidentiality 예외. 관련 법이 없는 나라여도 당국에 보고해도 위반 아님.", "trap": "'confidentiality 법이 없으니 보고하면 위반'이라고 생각하기 쉽다. 예외는 ① illegal activities ② law requires ③ client permits.", "f": "", "why": {"B": "Incorrect because, as noted in the correct answer, reporting the illegal activities of tax evasion and money laundering does not violate Standard III(E), Preservation of Confidentiality.", "C": "Incorrect because, as noted in the correct answer, reporting the illegal activities of tax evasion and money laundering does not violate Standard III(E), Preservation of Confidentiality."}, "orig": "ECO Module 3 Q6"}, {"id": "ECO-M3-Q9", "src": "ECO 오답", "module": 3, "tag": "III(C) Suitability — fund mandate", "vig": null, "stem": "Larry Petrov, CFA, manages a mutual fund with a mandate to invest in the Canadian large-cap financial services sector. The fund's mandate also requires the fund to be fully invested in long positions only. His analysis indicates Canadian bank stocks are generally overvalued. Due to the lack of other suitable stocks within his investment universe, he buys the Canadian bank stock that he believes to be the least overvalued. After thorough analysis, he also buys a Japanese bank stock for the fund due to its attractive dividend yield and expected currency appreciation.\nDid Petrov's actions violate the Standard relating to suitability?", "opts": {"A": "No", "B": "Yes, by buying the Japanese bank stock", "C": "Yes, by buying the Canadian bank stock"}, "ans": "B", "en": "B is correct. Correct because buying the Japanese bank stock goes against the mutual fund's mandate and thus is a violation Standard III(C), Suitability. According to the Standard, when members and candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must make only investment recommendations or take only investment actions that are consistent with the stated objectives and constraints of the portfolio.\nBuying the Japanese bank stock is inconsistent with the mandate of the Canadian large-cap financial services mutual fund. Therefore, Petrov violated Standard III(C).\nA is incorrect. Incorrect because buying the one Japanese bank stock is against the mutual fund's mandate and is a violation Standard III(C), Suitability. When managing to an Index or Mandate, the responsibility of these members and candidates is to invest in a manner consistent with the stated mandate. Buying a Japanese bank stock is inconsistent with the mandate and Petrov violates Standard III(C).\nC is incorrect. Incorrect because Petrov's purchase of a Canadian bank stock, despite his view that the sector is overvalued, is not inconsistent with the mandate and he thus does not violate Standard III(C) with this particular action.", "ko": "Fund 운용은 mandate(Canadian large-cap financials, long-only, fully invested)를 지켜야 한다. Japanese bank stock은 mandate 밖이라 위반. 고평가돼도 universe 안에서 가장 덜 고평가된 종목을 사는 건 OK.", "trap": "좋은 투자 아이디어라도 mandate 밖이면 위반. 고평가 종목을 사는 것 자체는 mandate상 fully invested라 문제없다.", "f": "", "why": {"A": "Incorrect because buying the one Japanese bank stock is against the mutual fund's mandate and is a violation Standard III(C), Suitability. When managing to an Index or Mandate, the responsibility of these members and candidates is to invest in a manner consistent with the stated mandate. Buying a Japanese bank stock is inconsistent with the mandate and Petrov violates Standard III(C).", "C": "Incorrect because Petrov's purchase of a Canadian bank stock, despite his view that the sector is overvalued, is not inconsistent with the mandate and he thus does not violate Standard III(C) with this particular action."}, "orig": "ECO Module 3 Q9"}, {"id": "ECO-M3-Q10", "src": "ECO 오답", "module": 3, "tag": "III(B) Fair Dealing — premium service levels", "vig": null, "stem": "Amy Wynn, CFA, is a research analyst at an investment bank. In an email to all of her clients, she includes a research report with a “buy” recommendation on one of the stocks she covers. Afterwards, she calls her premium fee-paying clients to discuss the report in detail. When her standard fee-paying clients call about the report, she declines the calls and asks her research associate, who co-wrote the report, to return the calls on her behalf.\nDid Wynn's actions violate the Standard related to fair dealing?", "opts": {"A": "No", "B": "Yes, by calling her premium fee-paying clients to discuss the report in detail", "C": "Yes, by declining the calls of standard fee-paying clients and asking her associate to reply"}, "ans": "A", "en": "A is correct. Correct because Wynn did not violate Standard III(B), Fair Dealing. According to the this Standard, members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage. Members and candidates may differentiate their services to clients, but different levels of service must not disadvantage or negatively affect clients.\nTherefore, Wynn has not violated Standard III(B) because she is allowed to provide differentiated service levels to her clients and did not appear to disadvantage or negatively affect other clients.\nB is incorrect. Incorrect because Wynn calling her premium fee-paying clients to discuss the report in detail does not violate Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, calling her premium fee-paying clients to discuss the report in detail is not a violation of Standard III(B).\nC is incorrect. Incorrect because Wynn declining the calls from standard fee-paying clients and asking her research associate who co-wrote the report to return the calls on her behalf is not a violation of Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, declining the calls of her standard fee-paying clients and asking the research associate who co-wrote the report to return the calls is not a violation of Standard III(B).", "ko": "Premium client에게 더 깊은 service를 주는 건 허용(공개돼 있고 다른 client에 불리하지 않으면). 공동 저자인 associate가 standard client 전화에 답하게 하는 것도 OK.", "trap": "'모든 client를 똑같이'가 아니라 'fairly'. 추천을 동시에 배포했으면 서비스 수준 차등은 허용.", "f": "", "why": {"B": "Incorrect because Wynn calling her premium fee-paying clients to discuss the report in detail does not violate Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, calling her premium fee-paying clients to discuss the report in detail is not a violation of Standard III(B).", "C": "Incorrect because Wynn declining the calls from standard fee-paying clients and asking her research associate who co-wrote the report to return the calls on her behalf is not a violation of Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, declining the calls of her standard fee-paying clients and asking the research associate who co-wrote the report to return the calls is not a violation of Standard III(B)."}, "orig": "ECO Module 3 Q10"}, {"id": "ECO-M3-Q11", "src": "ECO 오답", "module": 3, "tag": "III(A) Soft dollars — brokerage for personal benefit", "vig": null, "stem": "James Keith, CFA, manages a fund that replicates the S&P 500 index. He uses two brokers, Broker 1 and Broker 2, to which he pays execution-only commission rates. Broker 1 offers Keith  an all-expenses-paid trip to a biodiversity conference if he generates sufficient soft dollar commissions. Keith is interested in the conference because he is interviewing for ESG fund manager jobs. He then directs all his trades to Broker 1, which results in generate enough soft dollars to attend the conference.\nDid Keith's actions violate the Standards?", "opts": {"A": "No", "B": "Yes, by redirecting all his trades to Broker 1", "C": "Yes, by paying execution-only commission rates"}, "ans": "B", "en": "B is correct. Correct because directing all his trades to Broker 1 and thereby paying higher commissions to attend the conference for his own benefit, violates Standard III(A), Loyalty, Prudence and Care.\nRegarding 'Soft Commission Policies', conflicts may arise when an investment manager uses client brokerage to purchase research services, a practice commonly called 'soft dollars' or 'soft commissions.' A member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client.\nKeith manages a fund that replicates the S&P 500 index, so it is unlikely that his attendance at the biodiversity conference would benefit his clients. His intention of generating soft dollar commissions is for personal benefit, as he was interviewing for ESG fund manager jobs. As his motivation was for his personal benefit, his actions were a violation of Standard III(A).\nA is incorrect. Incorrect because, as noted in the correct answer, directing all his trades to Broker 1, and thereby paying higher commissions to attend the conference for his own benefit, violates Standard III(A), Loyalty, Prudence and Care.\nC is incorrect. Incorrect because paying execution-only commission rate does not violate Standard III(A), Loyalty, Prudence and Care. It is not the action that caused the violation. According to Standard III(A), members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and candidates must act for the benefit of their clients and place their clients’ interests before their employer’s or their own interests.", "ko": "Client brokerage는 client의 자산. 자기 혜택(conference 여행)을 위해 모든 거래를 Broker 1로 몰면 III(A) Loyalty, Prudence, and Care 위반.", "trap": "execution-only commission 지불 자체는 문제가 아니다. 문제는 soft dollar를 client 이익이 아닌 본인 이익에 쓴 것.", "f": "", "why": {"A": "Incorrect because, as noted in the correct answer, directing all his trades to Broker 1, and thereby paying higher commissions to attend the conference for his own benefit, violates Standard III(A), Loyalty, Prudence and Care.", "C": "Incorrect because paying execution-only commission rate does not violate Standard III(A), Loyalty, Prudence and Care. It is not the action that caused the violation. According to Standard III(A), members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and candidates must act for the benefit of their clients and place their clients’ interests before their employer’s or their own interests."}, "orig": "ECO Module 3 Q11"}, {"id": "ECO-M3-Q12", "src": "ECO 오답", "module": 3, "tag": "II(B) Market Manipulation — trading between funds", "vig": null, "stem": "Susan Winter, CFA, manages a small-cap fund and a growth fund. Both funds hold Artificial Intelligence Limited (AIL), an illiquid stock that is suitable for both funds. After a significant increase in AIL's stock price, she decides to sell all AIL stock from the funds despite several analysts expecting further price increases of artificial intelligence stocks. Before selling AIL stock from both funds, to protect the interest of investors in the funds, she trades AIL back and forth between the two funds. This results in large and growing volumes observed by other market participants. Winter then sells all AIL stock from both funds.\nDid Winter violate the Standard relating to market manipulation?", "opts": {"A": "No", "B": "Yes, by trading AIL stock between the two funds", "C": "Yes, by selling AIL stock from both funds despite analysts' price increase expectations"}, "ans": "B", "en": "B is correct. Correct because trading AIL back and forth between the two funds violates Standard II(B), Market Manipulation. Standard II(B) requires that members and candidates uphold market integrity by prohibiting market manipulation. Market manipulation includes practices that distort security prices or trading volume with the intent to deceive people or entities that rely on information in the market.\nIn this case, Winter engaged in transaction-based manipulation, which involves instances where a member or candidate knew or should have known that his or her actions could affect the pricing of a security. Winter’s plan is based on distortion of both trading volume and the price of the AIL stock; therefore, it violates Standard II(B).\nA is incorrect. Incorrect because, as noted in the correct answer, Winter's actions violate Standard II(B), Market Manipulation.\nC is incorrect. Incorrect because selling AIL stock from both funds despite some speculating further price increases does not violate Standard II(B), Market Manipulation. It is not the action that caused the violation. Standard II(B) requires that members and candidates uphold market integrity by prohibiting market manipulation. Market manipulation includes practices that distort security prices or trading volume with the intent to deceive people or entities that rely on information in the market.\nStandard II(B) does not prohibit Winter, the fund manager, from selling AIL stock from both funds despite some speculating further price increases of the stock. Therefore, this is not the action that caused the violation.", "ko": "두 fund 사이에서 같은 종목을 주고받아 거래량을 부풀리면 transaction-based manipulation(II(B) 위반). 다른 analyst 의견과 달리 파는 건 정당한 판단.", "trap": "'투자자 보호 목적'이라고 해도 가격·거래량을 왜곡해 시장을 속이면 위반.", "f": "", "why": {"A": "Incorrect because, as noted in the correct answer, Winter's actions violate Standard II(B), Market Manipulation.", "C": "Incorrect because selling AIL stock from both funds despite some speculating further price increases does not violate Standard II(B), Market Manipulation. It is not the action that caused the violation. Standard II(B) requires that members and candidates uphold market integrity by prohibiting market manipulation. Market manipulation includes practices that distort security prices or trading volume with the intent to deceive people or entities that rely on information in the market.\nStandard II(B) does not prohibit Winter, the fund manager, from selling AIL stock from both funds despite some speculating further price increases of the stock. Therefore, this is not the action that caused the violation."}, "orig": "ECO Module 3 Q12"}, {"id": "VAR-M2-01", "module": 2, "tag": "I(B) Independence — IPO prior approval", "stem": "Under the recommended procedures for Standard I(B), Independence and Objectivity, how should firms handle employee participation in initial public offerings (IPOs)?", "opts": {"A": "Prohibit all personal trading by employees.", "B": "Require prior approval for employees to participate in IPOs.", "C": "Allow participation if employees disclose it after the shares are allocated."}, "ans": "B", "en": "B is correct. The recommended procedures for Standard I(B) include restricting employee investments: firms should require prior approval for employee participation in IPOs and private placements.\nA is incorrect because the Standards do not require a total ban on personal trading.\nC is incorrect because disclosure after the fact does not address the conflict; approval is required in advance.", "ko": "I(B) recommended procedure: 직원의 IPO·private placement 참여는 사전 승인(prior approval)을 받게 한다.", "trap": "사후 공개는 사전 승인을 대신하지 못한다. 전면 금지도 요구 사항이 아니다.", "why": {"A": "Standards don't require a total ban on personal trading; they require prior approval and monitoring.", "C": "Disclosure after allocation is too late. Approval must come before participation."}, "src": "변형", "vig": null, "f": "", "orig": "오답 노트 기반 변형 (Ethics LC note)"}, {"id": "VAR-M2-02", "module": 2, "tag": "VI(C) Referral Fees — timing of disclosure", "stem": "Under Standard VI(C), Referral Fees, when must a member disclose a referral arrangement to a prospective client?", "opts": {"A": "After the client signs the service agreement.", "B": "Before the client enters into any formal agreement for services.", "C": "Only if the client asks whether a referral fee is paid."}, "ans": "B", "en": "B is correct. Standard VI(C) requires members and candidates to disclose to their employer, clients, and prospective clients, as appropriate, any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services, before entry into any formal agreement for services. The disclosure should include the nature and estimated value of the consideration.\nA is incorrect because disclosure after signing is too late.\nC is incorrect because disclosure is required whether or not the client asks.", "ko": "Referral fee는 formal agreement 전에, 성격과 (추정) 금액까지 employer·client·prospect에게 공개한다.", "trap": "서명 직후 공개 = 위반. 묻지 않아도 공개해야 한다.", "why": {"A": "Disclosure must come before any formal agreement; after signing is a violation.", "C": "Disclosure is mandatory, not on request."}, "src": "변형", "vig": null, "f": "", "orig": "오답 노트 기반 변형 (Ethics LC note)"}, {"id": "VAR-M2-03", "module": 2, "tag": "III(E) Confidentiality — illegal activities exception", "stem": "An investment adviser in a country with no laws on client confidentiality learns that a client is laundering money. The adviser reports the client's information to the financial regulator. Under Standard III(E), Preservation of Confidentiality, the adviser:", "opts": {"A": "violated the Standard, because client information must always be kept confidential.", "B": "did not violate the Standard, because the information concerns illegal activities by the client.", "C": "violated the Standard, because disclosure requires the client's permission."}, "ans": "B", "en": "B is correct. Standard III(E) requires members to keep client information confidential unless (1) the information concerns illegal activities on the part of the client, (2) disclosure is required by law, or (3) the client or prospective client permits disclosure. Money laundering is an illegal activity, so reporting it does not violate III(E), even where no confidentiality law exists.\nA is incorrect because confidentiality has exceptions.\nC is incorrect because client permission is only one of three exceptions.", "ko": "III(E) 예외: ① client의 illegal activities ② 법이 요구 ③ client 허락. Money laundering은 ①이라 보고해도 위반 아님.", "trap": "'confidentiality는 절대적'이라거나 'client 허락이 꼭 필요'라고 보면 틀림.", "why": {"A": "Confidentiality is not absolute; illegal activities are an exception.", "C": "Client permission is only one exception; illegal activity is a separate exception."}, "src": "변형", "vig": null, "f": "", "orig": "오답 노트 기반 변형 (Ethics LC note)"}, {"id": "VAR-M2-04", "module": 2, "tag": "I(A) Knowledge of the Law — client illegal activity, first step", "stem": "A portfolio manager has reasonable grounds to believe that a pension plan client's activities are illegal. According to the Standards, the manager's most appropriate first step is to:", "opts": {"A": "immediately report the client to CFA Institute.", "B": "bring the matter to a supervisor or the compliance department to try to stop it, and dissociate if it continues.", "C": "continue managing the account, because the manager is not personally involved in the activity."}, "ans": "B", "en": "B is correct. Under Standard I(A), Knowledge of the Law, a member who has reasonable grounds to believe that client or employer activities are illegal or unethical should first attempt to stop the behavior by bringing it to the attention of the employer through a supervisor or the compliance department. If this does not resolve the matter, the member must dissociate from the activity and may seek legal advice; the member may consider ending the relationship.\nA is incorrect because reporting to CFA Institute is not required (it may be appropriate but is not the first step).\nC is incorrect because continuing could make the member a knowing participant in the violation.", "ko": "Client·employer의 불법을 알면: 먼저 supervisor·compliance에 알려 중단을 시도 → 안 되면 dissociate(필요하면 legal counsel, 관계 종료). CFA Institute 신고는 의무 아님.", "trap": "'바로 CFA Institute에 신고'는 의무가 아니다. 가만히 있으면 knowingly participate가 된다.", "why": {"A": "Reporting to CFA Institute is encouraged but not required, and it is not the first step.", "C": "Staying involved in known illegal activity violates I(A); the member must dissociate."}, "src": "변형", "vig": null, "f": "", "orig": "오답 노트 기반 변형 (Ethics LC note)"}, {"id": "VAR-M2-05", "module": 2, "tag": "III(A) Soft dollars — permitted use", "stem": "A portfolio manager uses client brokerage commissions (soft dollars) to obtain services. Which use is most likely consistent with Standard III(A), Loyalty, Prudence, and Care?", "opts": {"A": "Research that assists the manager's investment decisions for those clients.", "B": "Payment of the firm's office rent.", "C": "Travel to a conference that helps the manager's own job search."}, "ans": "A", "en": "A is correct. Client brokerage is an asset of the client. Under Standard III(A), it may be used only for goods and services that benefit the client, such as research that assists the investment decision-making process.\nB is incorrect because office rent benefits the firm, not the client.\nC is incorrect because personal travel benefits the manager, not the client.", "ko": "Client brokerage는 client 자산. Client에게 이익이 되는 research에만 쓸 수 있다. 회사 경비·개인 혜택에 쓰면 III(A) 위반.", "trap": "'firm이 쓰는 비용'이나 '본인 경력에 도움'은 client 이익이 아니다.", "why": {"B": "Office rent benefits the firm, not the clients who paid the commissions.", "C": "Personal travel benefits the manager, a breach of loyalty to clients."}, "src": "변형", "vig": null, "f": "", "orig": "오답 노트 기반 변형 (Ethics LC note)"}, {"id": "VAR-M2-06", "module": 2, "tag": "III(E) Confidentiality — cooperating with PCP", "stem": "A member under investigation by the CFA Institute Professional Conduct Program (PCP) submits confidential client trade records to support her defense. Under Standard III(E), Preservation of Confidentiality, she:", "opts": {"A": "did not violate the Standard.", "B": "violated the Standard unless the clients consented in advance.", "C": "violated the Standard unless the client names were removed."}, "ans": "A", "en": "A is correct. Information provided to the PCP as evidence in an investigation is kept in the strictest confidence. A member or candidate who submits confidential client information to the PCP is not in violation of Standard III(E).\nB and C are incorrect because neither client consent nor redaction is required when cooperating with the PCP.", "ko": "PCP 조사에 협조하며 client 정보를 제출해도 III(E) 위반 아님(PCP가 비밀 유지).", "trap": "Client 동의나 이름 삭제가 필요하다고 생각하기 쉽다.", "why": {"B": "Client consent is not required for submissions to the PCP.", "C": "Redaction is not required; the PCP keeps the information confidential."}, "src": "변형", "vig": null, "f": "", "orig": "오답 노트 기반 변형 (Ethics LC note)"}], "vignettes": ["Alan Watson is a Level II CFA candidate. In addition to studying the curriculum independently, he and several of his coworkers have formed a study group that uses many of the resources provided by CFA Institute to prepare for the exam. They meet every Monday to review the previous week’s study materials and discuss items needing further clarification. This week’s reading is the CFA Institute Standards of Professional Conduct. After studying the Standards, Watson answers the topic questions offered by CFA Institute. He notes three scenarios he wants to clarify with the group.\nWatson brings up the first scenario and lays out the following facts given: A research analyst makes a presentation to a small group of investors. Prior to the start of the meeting, the analyst chatted with several individuals outside the meeting room. The analyst commented that she had just gotten off the phone with the CFO of a company she follows where they talked about a recently announced merger by a competitor. The analyst starts the presentation and discusses her research process and her published investment recommendations on the companies under her coverage. She mentions her call with the CFO as well as the comments she made during an interview on a major television network relating to the merger.\nIn the second scenario, Watson states, “I'm really struggling to understand the following two recommendations and question if they apply to Standard I(B): Independence and Objectivity:\n•\tRecommendation 1: Firms should require prior approval for employees participating in initial public offerings.\n•\tRecommendation 2: Firms should implement effective supervisory and review procedures to ensure compliance with personal investment policies.”\nThe final scenario he wants to discuss with the group has to do with policy recommendations made by a firm’s chief compliance officer regarding communication with clients and prospective clients. The officer provided her firm’s board the following policies for approval:\n•\tPolicy 1: When discussing earnings estimates, caution should be exercised to avoid overconfidence regarding the accuracy of the earnings model.\n•\tPolicy 2: If a capsule or condensed form of a recommendation is utilized in social media communications, reasonable efforts should be made to notify all clients about the social media post.\n•\tPolicy 3: Significant changes in risk characteristics for either a security or asset strategy should be communicated to all clients.\nDuring their gathering, Watson and his coworkers also discuss how they could unintentionally violate Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate. The group affirms their commitment to the high ethical standards of CFA Institute and talks about how a violation might occur. They make the following pledges to help each other stay in compliance with Standard VII following the exam:\n•\tPledge 1: Abstain from making any comments about the curriculum on social media.\n•\tPledge 2: Refrain from expressing negative comments about the CFA Program.\n•\tPledge 3: Avoid discussing the particulars of the topic areas tested with each other.", "Better Investments, founded by Ardy Sobhani, CFA, five years ago, is an investment adviser serving mostly middle-income clients along with several high-net-worth clients. Sobhani initially worked alone, but because of rapid growth, Better Investments has expanded to 20 employees today. Better Investments continues to add new clients and recently hired a junior analyst, Shigeru Miyagawa.\nMiyagawa is registered for Level I of the CFA exams. He recently learned that Sobhani has been an instructor with a CFA exam prep program for many years, so he asks Sobhani if he can provide any tips on the exam. Sobhani responds, “Our prep course providers looked at the curriculum readings and based on this analysis we do not think you should worry about exotic over-the-counter (OTC) derivatives being tested. Instead focus on the core body of knowledge. CFA Institute has a heavier weighting on equities and fixed-income analysis, and I am sure the exam will always have a similar emphasis.” Miyagawa replies, “when I took the practice exam it seemed to have more weight on alternative investments.”\nIn a meeting with Spencer Purce, a prospective client who recently sold his business for over $100 million, Sobhani learns that Purce plans to quit working. Purce asks for ideas on how to invest his sale proceeds to build wealth within a trust structure so that he can pass capital on to his twin sons, who are 19-year-old students. Sobhani tells Purce:\nConsidering your objectives specifically, I looked at infrastructure projects in developing countries for clients interested in diversifying their portfolios with long-duration projects, consistent cash flow, high operating margins, and a positive correlation to inflation. These types of investments require large up-front cash injections, patience, and the ability to accept a long cash out period. But, there are several benefits to this type of investment that I think are important for you, including diversification, exposure to rapidly growing economies, and returns, which are currently in the 8%–12% range, based on my review of similar investments.\nSobhani advises two clients to diversify their portfolios into real estate. He refers them to a licensed attorney who specializes in real estate investments. Sobhani is paid a referral fee by the attorney, which he fully discloses once a client makes an investment. The attorney offered both clients the opportunity to invest in a loan secured by mortgages on three commercial warehouses. One of the clients buys into the lucrative deal, but Sobhani recommends the other client defer his investment because of liquidity constraints. When the liquidity issues are finally resolved, the investment is no longer available.\nReviewing the firm’s bank account, Sobhani notices several unauthorized credit card payments for thousands of dollars. Janis Wilder, Sobhani’s personal assistant, confesses to obtaining a credit card in Sobhani’s name and using this card to fund her personal travels. Local law requires investment advisors to inform their regulators of any employee theft. But, because Wilder is Sobhani’s cousin, he verbally reprimands her: “From now on I will hold the checkbook, and if you ever do something like this again I will report you to the regulators.”", "The Professional Conduct Program for CFA Institute recently completed an investigation involving Erick Fitzgerald, CFA, a senior research analyst for a large global brokerage firm. Anthony Malone, CFA, the organization’s designated officer (DO), reviewed the investigation’s findings and determined that Fitzgerald’s actions justified a revocation of his charter. He notified Fitzgerald of his recommendation. After reviewing the charges and Malone’s suggested sanction, Fitzgerald rejected the recommendation and requested a hearing in front of the Disciplinary Review Committee (DRC) of CFA Institute.\nElena Sanchez, CFA, a member of the DRC, is scheduled to serve on the hearing panel convened to hear Fitzgerald’s case. Fitzgerald has been charged with multiple violations of the CFA Institute Standards of Professional Conduct. Most of Fitzgerald’s violations centered around two listed companies under his coverage, LeffMarc and HorizonGale. In preparation for the hearing, Sanchez reviews the various documents submitted by both Fitzgerald and the CFA Institute DO. The DO’s report highlighted that Fitzgerald emailed the chief financial officer (CFO) of the two companies a copy of his earnings model applicable to that company. Fitzgerald noted in his response he did this to elicit comments from the CFO prior to publishing his earnings estimates and distributing his recommendations to investors.\nThe DO’s report highlighted Fitzgerald’s handling of his stock recommendations, particularly with regard to HorizonGale. LeffMarc had publicly announced the purchase of a HorizonGale division and hoped to complete the due diligence process in a short amount of time. On several occasions, HorizonGale’s chief executive officer (CEO) had commented to Fitzgerald that he was concerned about the price HorizonGale would ultimately receive for the asset sale and he was becoming increasingly nervous. While on vacation, Fitzgerald emailed several friends and joked that HorizonGale’s CEO was so nervous he might suffer a heart attack. Shortly after he emailed his friends and prior to the conclusion of the due diligence process, Fitzgerald changed his rating on HorizonGale to “Buy” but maintained the stock’s above-average risk rating given the uncertainty surrounding the asset sale.\nFitzgerald’s best friend received the email about the CEO’s nervousness. He had recently gotten married and Fitzgerald was the best man in the wedding. When helping to plan for the occasion, Fitzgerald wanted to do something special for his friend. He knew the CEO of HorizonGale had a personal home in Paris. At the end of a lunch meeting with the CEO to discuss HorizonGale’s outlook after the asset sale, Fitzgerald had inquired if he would be willing to let his friend use the home for his honeymoon. He explained how important his friend was to him and that they had not gone on a honeymoon because they had to pay for all of their wedding expenses.\nWhile reviewing the submissions for the hearing, Sanchez paused to think of ways Fitzgerald’s employer could have discouraged the close relationship between Fitzgerald and HorizonGale’s CEO. She thought the following policies would have been helpful in averting such a relationship and preventing violations of the CFA Institute Standards of Professional Conduct:\n•\tPolicy 1: Maintain a schedule to rotate primary analyst coverage every few years.\n•\tPolicy 2: Require an assistant to accompany the analyst at one-on-one meetings with senior management.\n•\tPolicy 3: Require analysts’ supervisors to review meeting notes with management and conduct quarterly reviews.", "Fiona O’Connor, CFA, who is based in Dublin, runs the asset management firm that manages the assets for the Step Up Social Impact Private Equity Fund (the Fund), which is registered in Ireland. The general partner of the Fund has asked O’Connor to meet with Elise Jensen, CFA, a pension asset consultant, to find out whether Jensen will pitch the Fund to her institutional clients looking for an environmental, social, and governance (ESG) approach. Jensen specializes in working with continental European–based pension funds, many of which are Swiss pension funds required by Swiss pension regulations to undertake an ESG assessment prior to making an investment. In addition, all her clients have a relatively low risk profile, because they are small funds. The few pension funds Jensen works with that do not require an ESG assessment still include the desire for this type of evaluation in their investment mandate.\nDuring an introductory meeting that lasts about an hour, Jensen asks O’Connor to give an overview of the Fund. O’Connor makes the following three statements:\nFirst, as you are aware, the Step Up Fund is a global social impact fund. Therefore, we have allocated 85% of our investment portfolio to education and health care. In addition, some of the companies we invest in offer scholarships or free services to those who cannot afford their services. As a result, our investment returns may not be as high as those of funds that have a strict “for-profit” investment strategy, but we still track our Fund against ESG indexes. We have also developed a set of “social impact” metrics that aim to show the Fund has a positive impact on people’s lives. Details of the investment strategy and how we select investments are clearly and extensively described in our fund prospectus. In addition, investors are notified prior to any changes being made in our investment process.\nSecond, let me explain how we select investments. I’ll give you the prospectus, too, for your further reference, because it contains all the details, and they’re quite extensive. We identify potential investments from around the globe through our own analysts’ research within the education and health care industries. We also use third-party agents to find potential investments. If we make an investment in the companies they present to us, we pay them a finder’s fee. One such agent we use is Make-a-Difference Consultants, an asset consulting firm that has adopted the CFA Institute Code and Standards.\nFinally, I also want to disclose to you the compensation arrangements for the asset management firm’s six investment analysts, all of whom report to me directly. Two of the analysts work part-time, because they made earlier commitments with other asset management firms before I found them. But they do not work for other social impact funds, so I’m OK with this arrangement because we consider them independent contractors. We disclose this and other forms of management compensation to all clients and potential clients. All the analysts are paid monthly and participate in the firm’s year-end bonus program. The value of the bonus pool is determined by how well the company has performed.", "Jacob Kostecka, CFA, is a portfolio manager at Forkson Investment Management, an asset management and research focused organization. After obtaining his CFA charter last month, Kostecka was transferred to the private wealth management division at Forkson.\nDharshi Bope, a private wealth client, was involved in a major motorcycle accident and is in critical condition, fighting for his life. Bope is a single parent with a daughter, Paveen Nathoo, in her mid-twenties. Since the accident, Nathoo has managed her father’s affairs, paying all expenses, including investment advisory fees. In several conversations with Nathoo, Kostecka highlighted Bope’s low risk tolerance and investment goal of capital preservation. Nathoo has indicated her interest in managing the account more aggressively and possibly moving to another management firm. Nathoo recently petitioned the court to appoint her full power of attorney to legally manage Bope’s affairs. Prior to the court decision, Nathoo asks Kostecka to invest her father’s account in the initial public offering (IPO) of Chatterbox, a highly sought after social media company that has yet to generate a profit.\nThe following week, the court approves Nathoo’s request to act on behalf of her father.\nNathoo establishes a non-discretionary investment account at Forkson tied to her newly established business. Shortly thereafter, Kostecka joins the board of Jabbertalk.com, a smaller social media competitor to Chatterbox. Based on his knowledge of Chatterbox, Kostecka believes the stock of Jabbertalk is a good investment, even though it is not yet profitable. Buoyed by his faith in social media, Kostecka ultimately purchases shares of Jabbertalk’s IPO for Nathoo’s account, as well as for all clients he currently manages. When Kostecka informs Nathoo of the purchase, she expresses concern about her legal responsibilities and lack of accounting knowledge in overseeing the account. Kostecka provides Nathoo a list of recommended professionals he has worked with in the past, including attorneys and accountants. When he was in college 10 years earlier, Kostecka was engaged to one of the attorneys but broke off the relationship prior to their wedding, and one of the accountants was Kostecka’s college roommate. Since then, Kostecka has not had any contact with the lawyer and accountant.\nThe Jabbertalk investment is profitable on the first day of trading, doubling from its opening price. Kostecka tells his clients the multifactor valuation model used by Forkson shows Jabbertalk stock is still undervalued. Forkson’s research report, due out the next day, will recommend investors hold their Jabbertalk shares. However, Kostecka tells all his clients simultaneously they should sell their shares because he believes Jabbertalk is overvalued and the stock price will fall soon. Kostecka notes he has followed through on this belief by selling his personal holdings of Jabbertalk shares. Nathoo ignores Kostecka’s recommendation to sell Jabbertalk. Over the next week, the stock declines 75%.\nWatching Jabbertalk’s severe share price decline, Nathoo becomes furious with Kostecka because he did not sell shares of Jabbertalk in her account. She files a complaint with Kostecka’s supervisor, Sally Fang, CFA, claiming she was misled on the value of the IPO in the days immediately after the stock started trading. Kostecka responds to the complaint by telling Fang, “the analyst who wrote the hold recommendation on Jabbertalk has only passed his CFA Level II examination. As a charterholder, I have earned the right to use the CFA designation, so I am more qualified to manage clients’ investments.”", "Jane Pierce, having recently received her undergraduate degree in finance, accepted a job offer to join a large global brokerage firm as a research assistant. To manage training and oversight, all the firm’s research assistants are supervised by a designated individual in the research department. Pierce was hired with the understanding she would register for the CFA Program exam within 90 days and be awarded her CFA designation within four years. Her first two days of work were spent in orientation, with a full day devoted to reviewing the firm’s policies and procedures, including the firm’s code of conduct. During the orientation, the chief compliance officer noted the firm claims compliance with the CFA Institute Code of Ethics and Standards of Professional Conduct. Shortly after Pierce is hired, she is accused of committing a potentially serious ethical violation. She is subsequently cleared of any wrongdoing.\nPierce worked hard getting to know the duties and responsibilities required in her new job. During her first month, the senior analyst she was assigned to work with asked her to distribute an email to a subset of asset management clients he meets with regularly. The email outlined his earnings model for a company under his coverage, his assumptions, the important factors surrounding his analysis, and the risk associated with those earnings. He also highlighted a change in his earnings expectations. Pierce was surprised by the request; in the past, she had emailed reports on behalf of other analysts, but those requests had always come from her supervisor, which was consistent with firm policy.\nLate one afternoon, two of Pierce’s coworkers, who are also research assistants, were gathered around Pierce’s

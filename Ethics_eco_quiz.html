 workspace chatting about the demands of their jobs. The following statements were made:\n•\tResearch Assistant 1: The senior analysts I work with heard from an accountant at one of the companies she follows that they are about to retire a large group of assets. She’s afraid she may lose her job.\n•\tResearch Assistant 2: The senior analysts I work with heard from the receptionist at an independent research firm about the potential purchase of a large block of stock of a company under his coverage. I can’t wait to find out who it involves.\nWithin her first 90 days of work, Pierce enrolled in the CFA Program, as required in her employment agreement. She and several of her colleagues formed a study group and gathered several times a week to review the material or work through practice questions. Following the completion of the exam, her study group decided to meet for dinner with several other candidates they knew to unwind after such a grueling day. During dinner, Pierce read aloud several comments she had found posted on an online chat site regarding the exam:\n•\tComment 1: “Boy, the ethics questions were amazingly tough.”\n•\tComment 2: “Those Learning Outcome Statements were helpful.”\n•\tComment 3: “I hate accounting; it must have been 25% of the exam.\"", "Kyra Johnson, CFA, was recently hired by Sedgwick Investment Management (Sedgwick) as its new chief executive officer. Sedgwick’s parent company owns several subsidiaries in the financial services industry. Although there are currently no outstanding compliance issues, Sedgwick’s employees have a history of unethical behavior and always seem to be on the brink of additional violations. Sedgwick’s board of directors has tasked Johnson with bringing the firm’s policies and procedures into compliance with the CFA Institute Code of Ethics and Standards of Professional Conduct.\nShortly after Johnson was hired, the following announcement appeared in a major financial newspaper:\nThe board of directors of Sedgwick Investment Management is pleased to announce the hiring of Ms. Kyra Johnson, CFA, as the company’s new chief executive officer. She has demonstrated the ability to successfully complete a rigorous and comprehensive study program demanded by the CFA designation. The credibility of her CFA charter and the skills the CFA Program cultivates are key assets Ms. Johnson brings to Sedgwick. As a CFA charterholder, Ms. Johnson has superior qualities to manage our clients’ investments and guide the investment process. We are thrilled to have Ms. Kyra Johnson, CFA, as a member of the Sedgwick Investment Management team.\nOne of the first things Johnson did after arriving at the firm was to meet with Corey Tao, CFA, the firm’s chief compliance officer. Tao had been with the firm only a few months. He told Johnson the previous violations had primarily related to equity research, equity trading, and client confidentiality. After reviewing the summary of violations and the firm’s existing handbook, Johnson and Tao decided to submit the following recommendations regarding the firm’s trade allocation procedures for block trades to the board of directors for approval:\n•\tRecommendation 1: All accounts participating in a block trade should receive the same execution price and pay the same commission rate.\n•\tRecommendation 2: Orders will be executed on a first-in, first-out basis, with consideration given to bundling orders for efficiency.\nDuring the meeting Tao also mentioned to Johnson that the company handbook fails to address an area where he has some concerns and suggested the following policy addition, breaking it down into three points:\n•\tPoint 1: Traders are prohibited from engaging in communication with brokers or dealers that would artificially cause a stock’s price to rise or fall.\n•\tPoint 2: Research analysts are not allowed to communicate unrealistic expectations regarding a company’s results that may affect the market price of a stock.\n•\tPoint 3: Portfolio managers are not allowed to enter into an agreement to promote the stock of any publicly listed company.\nTao later received a call from a news reporter who requested an interview. Tao is one of several people at the firm authorized to speak with the press. The reporter was interested in writing a piece about Johnson and the circumstances behind her joining the firm. They scheduled a time for the call and Tao forwarded to the reporter a copy of the board’s press release. Prior to the interview, Johnson told Tao to address the reporter’s questions truthfully but not to provide any details. When asked during the interview about the firm’s history of unethical behavior, Tao responded, “One of Ms. Johnson’s first acts was to strengthen the firm’s Code of Ethics, and although there had been a few prior incidences of questionable conduct, they were exaggerated in the press and happen in most investment firms.”", "One month ago, Lucas Thorpe, a portfolio manager for an investment management firm and a CFA Program Level II candidate, received a letter from Keiko Okada, CFA, the designated officer for the CFA Institute Professional Conduct Program (PCP). The letter explained that the PCP had received a complaint, accusing him of violating the CFA Institute Code of Ethics and Standards of Professional Conduct. Okada requested Thorpe’s cooperation, asking him to explain why he sold publicly traded Savanna Honey Products (Savanna) shares for both his personal and client accounts. Okada noted the anonymous complaint she received indicated that sales were executed one day after his research visit to Savanna and the day before Savanna released an earnings warning due to an expected significant drop in profit margins.\nIn his defense, Thorpe responded in a letter to Okada as follows: “I arranged the research visit to Savanna as part of my routine review of the company. We’re a small firm, so the portfolio managers do their own analysis. The earnings warning information I received from the chief financial officer (CFO) of Savanna was freely given; I didn’t ask for it. The CFO even stated he had been giving the same information to any analyst who had visited in the last two days. My clients would have been harmed if I had not sold, because other managers would be selling before me. Besides, what I did is not illegal in my market. I treated my clients fairly; I sold Savanna shares for all my clients before I sold my own.”\nConcerned about the strength of his defense and to avoid any additional violations, Thorpe consulted with the firm’s compliance officer. Consequently, to support his claim that he did not violate Standard III(B), Fair Dealing, and without violating his firm’s policies or any applicable local laws, Thorpe provided Okada copies of documents for all the trades executed for his clients, including contact details and the percentage of assets under management (AUM) the trades represented.\nThorpe further stated in his letter to Okada that he received from the CFO six very large gift baskets full of high-end honey products worth USD100 per basket. He explained his firm has a very strict policy about accepting gifts valued at more than USD100 per gift. Thorpe accepted and distributed the gift baskets on behalf of himself and his five colleagues. However, he noted that the gifts in no way influenced his investment decision.\nFollowing Thorpe’s submission to the CFA Institute Professional Conduct Program, Okada informs him he has been found in violation of the CFA Institute Standards of Professional Conduct and will be publicly sanctioned and prohibited from future participation in the CFA Program exams. Thorpe contests the sanction and asks to present his case to a Disciplinary Review Committee Hearing Panel. While presenting his case, Thorpe mentions he regularly collects information he finds in the public domain when determining investment recommendations for his clients’ portfolios. He states that for “fast-moving consumer goods” (FMCG), he collects data by talking to industry experts who are former consultants of competing firms, making his own observations of the number of times grocery store shelves are restocked as well as gathering information from open specialty social media sites.", "Over the last 15 years, Maria Cadler, CFA, was the Director of Research at Voeltz Asset Management, supervising more than 10 research analysts. Her team was responsible for making investment recommendations to the portfolio managers who determined which investment recommendations to implement. Voeltz’s annual investment performance was always in the top quartile when compared to other investment firms managing similar portfolios. However, over the last 6 months, their rolling 12-month performance had dropped to the fourth quartile. Voeltz’s clients were losing money despite the market rising. As a result, she and several others were terminated. To prepare for her employment search, she updates her LinkedIn profile by adding the following statement, “I was part of a team of investment professionals with a successful investment performance track record, with investment returns consistently ranking in the top quartile when compared to similar investment managers. As a result of our success, I was offered and subsequently accepted a board seat for a local charitable organization. Working with them has been so rewarding, despite taking a considerable amount of my time during evenings and weekends.”\nIn preparation for job interviews, Cadler reaches out to Voeltz’s clients, former colleagues, and vendors to ask if they would write her a letter of recommendation. She makes the following requests to:\nAbby: “Each year, you have given my team lots of kudos for our investment research and investment recommendations. I’m wondering if you wouldn’t mind writing a letter of recommendation for me. I can give you the details of my role as team leader so you can include them.”\nRobert: “Since we both find ourselves looking for a job, how about we provide letters of recommendation for each other? I can provide some key points I would like for you to highlight, and you’re welcome to provide points for me to include in my recommendation of you.”\nFredrica: “When I get a new position, I’d love to recommend your services, as I appreciate the independent economic research reports you provided to my team. In the meantime, could you please write me a recommendation that mentions what great equity research reports my team provided to our clients?”\nDuring an interview with a potential employer, Cadler describes a time when quick thinking was rewarded with big returns for her clients: “We did our own extensive research and also received broker-sponsored company research. One time, we had just completed a research report on a large-cap company offering a competing product to one of the small-cap companies in which we had heavily invested. We determined it was time to sell the small-cap company, as it would likely lose considerable market share on its most popular product. In order to execute as quickly as we could before the market made the same determination, we sold 100% of the holdings in the small-cap company and bought the large-cap company for all of our discretionary clients. To expedite the small-cap trades, we utilized a few stockbrokers not yet on our approved broker list because our existing brokers told us they were unable to complete all of the trades requested in a timely manner. We found that it is critical to act fast when trading in small-cap shares. As a result, we were able to obtain incredible returns for most of our clients.”\nThe potential employer stated, “From your description of the large-cap trade, it sounds as if you may not have treated your non-discretionary clients equitably. If you were to work for us, how would you ensure all clients are treated fairly?” Cadler responded, “While I could make multiple recommendations, here are three:\nRecommendation 1:\nMake sure any changes to investment recommendations are communicated equitably to all clients, making sure those clients who acted on any prior recommendations are notified\nRecommendation 2:\nAsk all clients to sign a waiver stating they acknowledge that when trading illiquid shares, fair dealing will not be possible as allocation will be on a first-come, first-served basis. We want to ensure clients have full disclosure of our trade allocation process.\nRecommendation 3:\nProrate trades, both when buying and selling, in those times when 100% of the orders can’t be executed so all clients are able to benefit. To facilitate this, block trading should be utilized when available and company policies should reflect best execution procedures.”", "Brian Patrick, CFA, has recently joined Northside Capital Advisers (Northside) as the firm’s assistant compliance officer. Northside manages individual accounts with conservative mandates for a variety of retirements funds, as well as individual accounts for high-net-worth investors with long investment horizons. Kyle Sang, CFA, is Northside’s chief compliance officer and Patrick’s supervisor. Sang has been with the firm since its inception and wrote the firm’s original Code of Ethics and Compliance Manual. Sang provides Patrick with a copy of both documents and asks Patrick to review them. He instructs Patrick to highlight any areas he feels should be revised or enhanced. Patrick lists the items that need to be addressed.\nThe first item Patrick adds to his list concerns the responsibilities of supervisors. Although the information contained in the Compliance Manual is accurate, he believes it needs to be augmented so the firm’s supervisors have a clear understanding of their responsibilities. He advises adding the following items to the firm’s Compliance Manual, recommending Supervisors should do the following:\n•\tRecommendation 1: Conduct an initial review of the firm’s Policies and Procedures, and review as necessary to ensure they are consistent with applicable laws and regulations.\n•\tRecommendation 2: Incorporate a professional conduct evaluation as part of the employee’s performance review.\n•\tRecommendation 3: Review the actions of all the firm’s employees, and identify violators.\nPatrick believes he needs a better understanding of the investment process before he makes any investment-policy-related recommendations. He meets with Staci Canton, the firm’s chief investment officer. Following his meeting with Canton, Patrick suggests the following enhancements to the firm’s Compliance Manual related to investment research:\n•\tProposal 1: Develop criteria for assessing analysts’ research quality and contribution, including the accuracy and timing of their recommendations.\n•\tProposal 2: Appoint a supervisor to review and approve communication material.\n•\tProposal 3: Develop detailed, written guidance that establishes the due diligence procedures.\nPatrick asks Canton to provide him with a copy of a recent research report that would have been distributed to the firm’s clients. Patrick is provided a copy of the PT Matias (PT) report, written by Amanda Burt, CFA. PT is involved in the manufacture of aluminum cans supplied to the soft drink industry. She mentions that PT has recently gone through a reorganization and is in a turnaround situation, so the potential returns are quite large. The shares were recently purchased for all client portfolios in a block trade. After reviewing the report, Patrick meets with Burt to discuss her approach to researching companies, meeting with company management, and determining earnings estimates. Burt explains to Patrick how carefully she documents her meetings with management and shares her notes with him. He compares the meeting notes with Burt’s recent report and notices she has included management’s guidance for earnings and margins along with her own estimates.\nPatrick’s review of the firm’s Code and Compliance Policies and Procedures is almost complete. The final item to review is how the firm handles employees’ trading. He notices the current Policies and Procedures are lacking. He notes that the firm currently restricts employee participation in IPOs, has a very narrow blackout period for employees trading securities on their buy list, and ensures personal trading policies are kept confidential. Sang tells Patrick of the difficulty he experienced in trying to get more robust personal trading policies and procedures approved. The board has historically been reluctant to put restrictions in place that limit the staff’s ability to invest their personal funds.", "Rebecca Matheson, CFA, is the chief compliance officer for AM&C Partners (AM&C), a midsize investment management firm managing equities. AM&C recently terminated Thorsten LaRue, CFA, for multiple violations of firm policies that included violations of the Standards. Matheson composed an email to file a complaint against LaRue with the Professional Conduct Program (PCP) of CFA Institute. Her email outlines LaRue’s actions with three points:\n1\tLaRue was an assistant trader and worked closely with the firm’s head trader. Together, they executed trades for the firm’s equity portfolios that ranged across the market capitalization spectrum. LaRue specialized in executing trades for the firm’s small-cap products and was instrumental in implementing several technology-based trading platforms. He was excited about his position and often talked with his cousin Brooke Montgomery about his job as well as the companies being researched and trades being executed. AM&C has a company policy to prohibit their employees from discussing trades they are executing.\n2\tLaRue was often involved in new client presentations to explain the different trading technologies utilized by the trading department. During such a meeting, a potential client talked about using a directed brokerage arrangement. They explained they had not yet decided on a broker and asked if the traders had any recommendation. LaRue talked about the advantages and disadvantages of such an arrangement and mentioned how several of AM&C’s clients used Robinson & Robinson (R&R). He also talked about how R&R was committed to professional development, and they had sponsored his full attendance at a three-day conference held at an exclusive winter resort.\n3\tAnother incident was discovered by one of our portfolio managers who is a member of a large online investment club. The manager noticed a new member of the group continually talked about the small-cap stocks AM&C was actively trading and his arguments went against the firm’s recommendations. The manager notified me, and after several weeks of investigation, we determined that LaRue was the individual discussing the companies the firm was trading. After outlining this last item, Matheson drafted the following polices to prevent and detect this type of violation going forward:\nPolicy 1:\nMembership in online investment clubs is permissible but must be reported to the Compliance Department before joining.\nPolicy 2:\nWhen it is discovered that a membership has not been reported, increase supervision on the employee who failed to report.\nPolicy 3:\nSend periodic reminders regarding investment club membership to those employees who failed to report and outline permissible conduct.\nMatheson completed the email and sent it as well as the evidence she had gathered to the appropriate email address at the CFA Institute. She then met with AM&C’s CEO to update him about the complaint and discuss what she should do next. He made the following recommendations:\nRecommendation 1:\nConsult with the firm’s securities attorney.\nRecommendation 2:\nWait for the PCP to provide her with additional information.\nRecommendation 3:\nInform the local CFA Society about the complaint.", "Suzy Mercer, CFA, is currently working as a capital market adviser in a developing country. While attending a regional securities exchange conference, she introduces herself to Terrence Ong, CFA. Ong is one of several partners at Shangri-la Development Associates, a consulting firm specializing in capital market expansion in developing countries. When making her introduction, Mercer states, “I’m an independent adviser working with the government of a developing country to improve its capital market sector. I’ve heard a lot about the work you’ve done. Could we talk about my consulting assignment and a possible role for you?”\nMercer continues, “I’m looking for someone with your background and stellar reputation to help create a strategic plan to develop the asset management industry. The client’s goal is to get the Securities Exchange to be a part of a regional exchange. This will help the locally listed companies gain more exposure. However, given the budget I’ve been given, I can afford to hire only an individual. Ong, would this be of interest to you?”\nMercer continues the conversation by informing Ong that she will also be approaching other industry participants, particularly in the fund management industry, who are attending the conference. Ong responds, “I sure hope you are not talking to Daniel Ngyue, who manages several startup funds. I think he has a drinking problem. There is a rumor his last startup fund was not well received by the investors, likely due to his drinking. As one charterholder to another, please do your due diligence first before you hire anyone. As you have already pointed out, my reputation is stellar. Why don’t we meet tonight for dinner at my ‘members only’ club to discuss your project further? I can introduce you to other influential people who are currently looking for experienced advisers in your field for upcoming assignments. I’m sure if they knew we were working together, it would really go a long way in obtaining future assignments from these industry leaders.”\nMercer informs Ong that she is unfortunately not able to meet him for dinner because of a previous engagement. She subsequently says to Ong, “I’m wondering how you would respond to a situation whereby a regulator chooses not to implement extensive policies and regulations regarding the integrity of capital markets I recommended. They say my suggested policies and regulations related to market manipulation, material nonpublic information, and protecting client interests are too complicated, and they do not have the judicial competency to back them up. Consequently, they have requested I recommend just one primary rule.” Thereafter, Mercer seeks out Daniel Ngyue, a CFA candidate, to ask for his version of what happened with his investors. Ngyue responds, “What actually happened was I got sick in a restaurant after having an adverse reaction to some medication. People uploaded photos to social media and stated I was falling over drunk. Subsequently, I wrote a letter to the investors explaining the situation and assuring them I had found another highly qualified fund manager after several weeks to take over until such time I had fully recovered. When I could, I looked at the fund when I was in the hospital for a week, but the fund needs close supervision, so that’s why I wanted to find another manager. One investor commented, ‘Key-person risk was not identified in the fund’s prospectus.’ Within one week we sent out a revision to the prospectus identifying key-person risk.”", "Trevor Blevin, a CFA candidate and a former employee of Regal Bank (Regal), recently joined Spalding Asset Management as the head of compliance. He is shocked by today’s front-page business news headline: “Regal Depositors Left in the Cold: Central Bank Regulator Places Bank under Statutory Management”. The article mentions the reason for Regal’s closure was the CEO’s illegal behavior, including fraud, as well as money laundering associated with a major client. The discovery occurred one month after the death of Regal’s CEO, Mr. James Antonio. Up until three weeks ago, Blevin headed Regal’s internal audit department and knew nothing of any fraud or client money laundering, despite having recently supervised a major internal audit exercise.\nWanting to get more information, Blevin calls his former colleague, Mira Chaudry, CFA. Chaudry, who works in Regal’s business development department, acts as the investor relations officer and headed the team for Regal’s recent corporate bond issue. The bond issue, approved by the central bank and the capital markets regulator, was hugely successful and oversubscribed. Chaudry tells Blevin she too was shocked by the central bank’s actions. Nothing seemed out of line or suspicious regarding Regal’s financial well-being when the team diligently prepared the bond offering documents. She reminds Blevin, that he, along with Regal’s compliance officer, signed off on all of the public marketing materials used for the bond issue, which included reviewing all of the extensive financial analysis undertaken. Chaudry adds, “In the latest regulatory inspection, all of the anti-money-laundering and lending procedures were reviewed with no queries raised.”\nRegal’s board of directors is concerned that the newspaper’s headline will create panic among depositors and cause a run on Regal if it is allowed to reopen. In an attempt at damage control, the board instructs Chaudry to draft a public press release regarding the central bank’s investigations of fraud by the deceased CEO and the money laundering charges made against one of the bank’s major clients. Chaudry presents the following three draft statements to the board.\n•\tStatement 1: “Regal Bank has been placed under statutory management by the central bank as a result of illegal activity by Mr. Antonio, the deceased CEO, and Wesley Mining Corp, a major client.”\n•\tStatement 2: “The central bank has placed Regal Bank under statutory management pending further investigation into alleged illegal activity by a former senior manager and a bank client.”\n•\tStatement 3: “Regal Bank has been placed under statutory management by the central bank as a result of illegal activity.”\nMeanwhile, Blevin, still reeling from the Regal Bank saga, decides to take another look at Spalding’s compliance policies and procedures to ensure they are fully in line with the CFA Institute Standards of Professional Conduct. While reviewing the firm’s anti-money-laundering policies, he notices lapses with respect to recently implemented laws, and he is afraid the firm may already be in violation. He plans to update the existing policies as soon as possible.\nAfter concluding his review, Blevin recommends to Spalding’s board of directors changes to the firm’s conflicts of interest policies. Blevin is concerned the staff may not be putting clients’ interests ahead of their own when trading for their personal accounts. He asks for the board’s endorsement of revisions in the following two policies:\n•\tPolicy 1: Staff are not allowed to participate in any private placements.\n•\tPolicy 2: Any client accounts that include staff as beneficiaries must trade after all other client accounts.", "Victoria Duffy, CFA, recently left her position as a portfolio manager at DalTex Investment Advisors (DalTex). Her departure was not restricted by a noncompete agreement, and before leaving, she returned the company-owned electronic devices she had been issued. Duffy has started her own investment management firm, Victory Investment Management (Victory). She has talked with several individuals about joining the firm as part of the management team and potentially being an equity owner. Duffy has lunch with Linda Kercheval, CFA, the chief compliance officer at DalTex, as she is interested in offering Kercheval a position at Victory. During their meeting, Duffy shares with Kercheval a presentation that includes the proposed management structure, the investment products to be offered, and a list of potential clients. Kercheval noted several of the names on the list were clients Duffy had frequent contact with while at DalTex.\nAlthough Kercheval is excited about the opportunity to join Duffy, she feels the timing is not quite right so she delays submitting her resignation. A short time later, she sees one of the clients Duffy had noted in her presentation in the DalTex office. She stops to talk with the client who mentioned how much he missed working with Duffy. Kercheval tells the client she had recently seen Duffy and shares her plans to open her own firm. The client gives Kercheval his business card and asks her to have Duffy contact him or to give him the name of her new firm. Kercheval considers what she should do and comes up with the following options:\nOption 1:\nCall Duffy and recount the conversation.\nOption 2:\nDo nothing until she joins Victory and then pass on the card to Duffy.\nOption 3:\nGive the client the name of Duffy’s new firm.\nWhile in her home office Duffy prepares for a video call with Lucy Tilton, CFA. Duffy met Tilton while attending a CFA-sponsored conference. Tilton is a portfolio manager specializing in alternative investments, specifically the use of futures and options to mitigate risk for accounts that allow the use of alternative investments. Duffy is particularly interested in adding someone with this expertise as it is not her strength. Tilton is very interest in working with Duffy, but she feels Victory has not reached an asset management level to support the compensation she requires. They decide on a mutually beneficial arrangement in which Tilton will create a report for Duffy’s use with daily commentary about how she is navigating the market for her firm and their clients. Tilton relishes the idea of working for a smaller firm and hopes to join Duffy in the near future.\nSeveral months later, Victory has gained enough clients to support adding Tilton as an employee. Tilton submits her resignation to her current employer, and although they are disappointed, they are excited for her and her new opportunity. Because they really like her work they ask if she could provide them with a daily commentary about her views regarding the market. Additionally, they are willing to pay her a monthly fee for providing the service. Because it is basically the same report she is currently providing Duffy, she agrees, and they negotiate a contract between the two of them with a quarterly fee paid direct to her. Tilton informs Duffy about the agreement, and Duffy agrees but is only willing to do this for a period of one year. Duffy makes the following recommendations regarding the arrangement:\nRecommendation 1:\nYou need to draft an agreement outlining what you are doing and how much they are paying you over the next year.\nRecommendation 2:\nYou and your former employer need to sign the agreement.\nRecommendation 3:\nWe also need to send a disclosure to all of our clients and potential clients.", "Victoria Novak, CFA, was waiting in line at a coffee shop when she overheard a conversation between two people talking about an individual financial adviser. According to the two, this adviser had received numerous complaints over the past month, including some suspected illegal activity regarding a complex financial transaction. One particular comment caught her attention, “We would not have this case on our hands right now if we had included an industry standard in our new regulations requiring all licensees, who we regard as our clients, to abide by the CFA Code of Ethics and Standards of Professional Conduct.”\nNovak approaches the two and says, “I’m sorry, but I couldn’t help but overhear your conversation. I’m Victoria Novak, a CFA charterholder. Are you charterholders, too?”\nIn response, Abraham Kovi introduces himself and his colleague, Stanley Marin, and says, “We’re both CFA Level 2 Program candidates and work at the Capital Market Regulatory Authority (Regulators).”\nNovak responds, “I’m really passionate about ethics and would love to talk more.”\nAfter the three find a table, Novak asks about their desire to implement the CFA Code and Standards as an industry standard.\nMarin responds, “We regularly check the CFA Institute website to see if anyone in our jurisdiction has been sanctioned for improper behaviors. Those individuals are subject to greater scrutiny because of their past misbehaviors.”\nKovi adds, “For instance, we recently discovered from the CFA Institute website that Mario Jovic, CFA, the owner of a small licensed financial advisory firm in our jurisdiction was subject to a public sanction. Consequently, we have started our own investigation and found several clients had registered complaints with the firm.”\nKovi continues, “We have also received several complaints against another adviser who is running his own firm and is a charterholder. The complaints are related to how the investment management fees were calculated on active management accounts as per their client agreements. The adviser had placed client funds at a commercial bank in fixed-term deposits at above-market rates. Subsequently, the deposits were frozen by the Central Bank as part of a bank restructuring program and reset at lower-than-market rates. Part of the restructuring restricted the withdrawal of any deposits for three years to give the bank time to recover without a threat of a run on the bank. The adviser continues to charge management fees on these deposits based on their anticipated maturity values, despite not being able to manage them as per client mandates. He includes the assets in performance presentations, noting in a footnote they are not available for withdrawal.”\nNovak asks the two, “If you had the Code and Standards in place industry-wide right now, what sanctions would you consider against this adviser?”\nMarin responds, “Three sanctions come to my mind.”\n•\tSanction 1: Require the adviser to pay into an Investor Protection Fund whereby clients can make claims to help recover their losses and to deter future abuses and violations.\n•\tSanction 2: Require the adviser to hire an independent compliance consultant to undertake an assessment and recommend and implement processes and procedures to prevent and detect violations.\n•\tSanction 3: Require the adviser to design a formal training program for existing staff and any new hires to help them understand their responsibilities as required by the Code and Standards", "After spending years employed as a research analyst covering Asian exchanges at an investment management firm based in Singapore and then undertaking further training, Vishram Mehta, CFA, recently launched a new career as an independent asset consultant. His first client is Montfill Tech (“Montfill”), a small software development company with offices in Singapore and India. Montfill is struggling to retain top developers for more than two years. Consequently, the company feels it is not able to fully capitalize on the investments it has made in employee training and development. Montfill is considering introducing a retirement benefit plan to supplement the statutory government-sponsored individual employee defined contribution (DC) plans. It feels the extra benefit designed with no risk to the employee will help with retention. Mehta’s assignment is to design a defined benefit (DB) package that includes an Investment Policy Statement and asset allocation.\nTo begin the assignment, Mehta researches the rules and regulations concerning pension plans in Singapore and India. Mehta initially thinks the pension plan regulations are tougher in India than in Singapore. Given the extensive regulations, however, he realizes he needs some help and thus considers speaking with an expert in global pension plan regulations. Subsequently, during a short conversation with a manager working in the Human Resources (HR) department of a multinational, Mehta asks the manager to outline the prominent features of their pension plan. Mehta contemplates what his next step should be based on the information he has received so far.\nTo start determining an asset allocation for Montfill’s DB plan, Mehta reviews the answers he captured during his initial conversations with management to help him assess Montfill’s investment profile, including return objectives, risk tolerances, previous investment history, and current and projected financial status. He has yet to receive the detailed answers to the questionnaire he sent to Montfill’s HR department about employee demographics. While he is awaiting the questionnaire responses, he drafts an asset allocation based on his understanding of the client’s needs.\nBefore Mehta begins to draft the Investment Policy Statement, he recalls the earlier conversation he had with the HR manager. The HR manager advised him to have a consultation with Risner Employee Benefits Law, a global legal firm with a stellar reputation in over 150 countries. The HR manager also mentioned Mehta might want to offer his services as a pension trustee or consultant to the client given all his years of experience in Asia. Mehta remembers his remarks: “Those are great ideas, particularly as I have direct work experience in all the countries where my client operates. I think I might also recommend that Risner draft the needed legal documents if I find their services are appropriate after my conversation and due diligence. But I’ll work out a referral fee arrangement first and include those details in my recommendation to the client.”\nMehta wants to include the following items in the Investment Policy Statement:\nAs previously disclosed in the contract between us:\n•\tItem 1: In lieu of evaluating new providers of third-party economic research needed to help determine asset class return forecasts, I hired those used by my former employer. The fees I pay them are part of normal operating expenses so are not directly expensed back to the client.\n•\tItem 2: As an independent asset consultant, there may be times when I am working on similar projects concurrently. These assignments may be for clients within the same industry (i.e., competitors). Systems and processes are in place to protect the privacy and data of all clients.\n•\tItem 3: Each assignment is undertaken with the best interests of the client in mind to meet their overall objectives as defined in our contract. It is up to each client to seek outside legal counsel and implement only the recommendations they deem fit."], "modules": {"1": "Code of Ethics and Standards of Professional Conduct", "2": "Guidance for Standards I–VII", "3": "Application of the Code and Standards: Level II"}}</script>

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return "Module "+m+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="안 푼 문제"?"src-rel":s==="풀어볼 문제"?"src-try":s==="Schweser MQ"?"src-sch":"src-var"; }
/* ---------- flag ---------- */
// Flag: 다시 볼 문제로 표시(분류와 별개). FL[id]=true
var FL = store.get(FLAGKEY)||{};
function isFlag(id){ return !!FL[id]; }
function toggleFlag(id){ if(FL[id]) delete FL[id]; else FL[id]=true; store.set(FLAGKEY,FL); if(S){ S.updatedAt=new Date().toISOString(); save(); } }
function flagList(){ return Object.keys(FL).filter(function(id){return BYID[id];}); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":S.mode==="flag"?"Flag 다시 풀기":(S.label||"전체 풀기");
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var CATS=[
    {key:"wrong", label:"틀린 문제", test:function(q){return q.src==="ECO 오답";}, primary:true},
    {key:"try", label:"풀어볼 문제", test:function(q){return q.src==="풀어볼 문제";}},
    {key:"open", label:"안 푼 문제", test:function(q){return q.src==="안 푼 문제";}},
    {key:"flag", label:"🚩 Flag", test:function(q){return isFlag(q.id);}},
    {key:"var", label:"변형 문제", test:function(q){return q.src==="변형";}}
  ];
  function cnt(src){ return Q.filter(function(q){return q.src===src;}).length; }
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+Q.filter(function(q){return String(q.module)===m;}).length+'문제)</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Ethics 오답 퀴즈</h2>'+
   '<p class="muted">ECO에서 <b>틀린 문제</b> '+cnt("ECO 오답")+' · Module 2 뒤쪽(45~101번) 안 푼 문제 중 중요한 <b>풀어볼 문제</b> '+cnt("풀어볼 문제")+' · 나머지 <b>안 푼 문제</b> '+cnt("안 푼 문제")+' · 오답 노트 기반 <b>변형 문제</b> '+cnt("변형")+' (총 '+Q.length+'문제). 범위를 고르고 분류 버튼을 누르세요. 문제 화면의 ⚑ 버튼(F 키)으로 Flag를 켜고 끄면 "🚩 Flag"로 따로 풀 수 있습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 · F Flag</p>'+
   (resume||remote?'<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'</div>':'')+
   '<div class="catbtns">'+CATS.map(function(c){return '<button class="btn'+(c.primary&&!resume?' primary':'')+'" data-cat="'+c.key+'"></button>';}).join("")+'</div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function pool(c){ var m=$("selMod").value; return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && c.test(q); }); }
  function labels(){ CATS.forEach(function(c){ var b=document.querySelector('[data-cat="'+c.key+'"]'), n=pool(c).length; b.textContent=c.label+" 풀기 ("+n+")"; b.disabled=!n; }); }
  CATS.forEach(function(c){ document.querySelector('[data-cat="'+c.key+'"]').onclick=function(){
    var order=pool(c).map(function(q){return q.id;}); if(!order.length) return;
    S=fresh(order,c.key==="flag"?"flag":"all"); S.label=c.label.replace("🚩 ","")+" 풀기"; save(); render();
  }; });
  $("selMod").onchange=labels; labels();
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span>'+(isFlag(id)?'<span class="pill src-flag">🚩 Flag</span>':'')+'<button class="btn flag'+(isFlag(id)?' on':'')+'" id="bFlag" title="Flag (F)">'+(isFlag(id)?'🚩 Flag 해제':'⚑ Flag')+'</button></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  $("bFlag").onclick=function(){ toggleFlag(id); quiz(); };
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  var flagIds=S.order.filter(isFlag);
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":S.mode==="flag"?"Flag 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bFlagRetry" '+(flagIds.length?'':'disabled')+'>🚩 Flag 다시 풀기 ('+flagIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">이번 라운드 남은 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bFlagRetry").onclick=function(){ if(!flagIds.length) return; S.order=flagIds; S.idx=0; S.mode="flag"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, flagged:isFlag(id), selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    flags:flagList(), label:S.label||"",
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- history export ---------- */
// 이 브라우저에 쌓인 문제별 풀이 기록(첫 풀이 포함)과 지금까지 내보낸 결과를 한 파일로 내려받는다.
function exportHistory(){
  var exps=store.get(EXPKEY)||{};
  if((!S||!S.all||!Object.keys(S.all).length) && !Object.keys(exps).length){ alert("이 브라우저에는 풀이 기록이 없습니다."); return; }
  var file={subject:SUBJECT, kind:"history", exportedAt:new Date().toISOString(), device:navigator.userAgent,
    all:(S&&S.all)||{}, exports:exps,
    flags:flagList(),
    state:S?{order:S.order, mode:S.mode, round:S.round, started:S.started, updatedAt:S.updatedAt||""}:null};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_history_"+today()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  if(at.flags){ FL={}; at.flags.forEach(function(id){ if(BYID[id]) FL[id]=true; }); store.set(FLAGKEY,FL); }
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:(at.mode==="review"||at.mode==="flag")?at.mode:"all", label:at.label||"", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
$("bHistory").onclick=exportHistory;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
  else if(k==="F" && !e.metaKey && !e.ctrlKey){ toggleFlag(S.order[S.idx]); quiz(); }
});
render();
loadRemote();
})();
</script>
</body>
</html>

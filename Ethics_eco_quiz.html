onversation with the HR manager, it would also not be considered a thorough or diligent enough research process. Standard V(A): Diligence and Reasonable Basis requires Members and Candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions as well as to have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action.\nA is incorrect. Incorrect. To avoid violating Standard I(A): Knowledge of the Law and Standard V(A): Diligence and Reasonable Basis, Mehta should consult with a legal specialist as per the above justification.\nC is incorrect. Incorrect. To avoid violating Standard I(A): Knowledge of the Law and Standard V(A): Diligence and Reasonable Basis, Mehta should consult with a legal specialist as per the above justification.", "ko": "싱가포르·인도 pension 규정을 아는 legal specialist와 상의해야 한다.", "trap": "Research 범위를 줄이거나 다른 회사 plan을 그대로 베끼는 건 해결이 아니다.", "f": "", "why": {"A": "Incorrect. To avoid violating Standard I(A): Knowledge of the Law and Standard V(A): Diligence and Reasonable Basis, Mehta should consult with a legal specialist as per the above justification.", "C": "Incorrect. To avoid violating Standard I(A): Knowledge of the Law and Standard V(A): Diligence and Reasonable Basis, Mehta should consult with a legal specialist as per the above justification."}, "orig": "ECO Module 2 Q65"}, {"id": "ECO-M2-Q66", "src": "안 푼 문제", "module": 2, "tag": "III(C) Suitability — incomplete client information", "vig": 15, "stem": "Will Mehta’s draft asset allocation recommendation most likely conform to Standard III(C): Suitability?", "opts": {"A": "Yes", "B": "No, with regard to Montfill’s profile", "C": "No, with regard to the HR department request"}, "ans": "C", "en": "C is correct. Correct. Mehta’s draft asset allocation will most likely violate Standard III(C) given he has not received responses to the questionnaire addressing employee demographics. To understand liquidity needs of the funds, it is critical to understand the age profile of the client’s labor force, any planned early retirements due to known medical conditions, etc. Consequently, he is not judging the suitability of his draft asset allocation with the client’s total liquidity needs in mind. Mehta appears to have made a reasonable inquiry into Montfill’s profile, including investment experience, risk and return objectives, and financial constraints prior to making any investment recommendation or taking investment action through the information he has collected and reviewed.\nA is incorrect. Incorrect. Mehta’s draft asset allocation will most likely violate Standard III(C) given he has not received responses to the questionnaire addressing employee demographics. To understand liquidity needs of the funds, it is critical to understand the age profile of the client’s labor force, any planned early retirements due to known medical conditions, etc. Consequently, he is not judging the suitability of his draft asset allocation (investments) in the context of the client’s total liquidity needs. Mehta appears to have made a reasonable inquiry into Montfill’s profile, including investment experience, risk and return objectives, and financial constraints prior to making any investment recommendation or taking investment action through the information he has collected and reviewed.\nB is incorrect. Incorrect. Mehta appears to have made a reasonable inquiry into Montfill’s profile, including investment experience, risk and return objectives, and financial constraints prior to making any investment recommendation or taking investment action through the information he has collected and reviewed as required by Standard III(C): Suitability.", "ko": "직원 연령 분포 등 질문지 답을 받기 전에 asset allocation을 만들면 III(C) 위반.", "trap": "Liquidity needs를 알려면 demographics 정보가 필수.", "f": "", "why": {"A": "Incorrect. Mehta’s draft asset allocation will most likely violate Standard III(C) given he has not received responses to the questionnaire addressing employee demographics. To understand liquidity needs of the funds, it is critical to understand the age profile of the client’s labor force, any planned early retirements due to known medical conditions, etc. Consequently, he is not judging the suitability of his draft asset allocation (investments) in the context of the client’s total liquidity needs. Mehta appears to have made a reasonable inquiry into Montfill’s profile, including investment experience, risk and return objectives, and financial constraints prior to making any investment recommendation or taking investment action through the information he has collected and reviewed.", "B": "Incorrect. Mehta appears to have made a reasonable inquiry into Montfill’s profile, including investment experience, risk and return objectives, and financial constraints prior to making any investment recommendation or taking investment action through the information he has collected and reviewed as required by Standard III(C): Suitability."}, "orig": "ECO Module 2 Q66"}, {"id": "ECO-M2-Q67", "src": "풀어볼 문제", "module": 2, "tag": "VI(C) Referral Fees — disclosed in proposal", "vig": 15, "stem": "If Mehta proposes Risner’s and his services to his client (Montfill), which component of the CFA Institute Standards of Professional Conduct will least likely be violated?", "opts": {"A": "Misconduct", "B": "Referral fees", "C": "Misrepresentation"}, "ans": "B", "en": "B is correct. Correct. Mehta would least likely violate Standard VI(C): Referral Fees as he noted he will include any referral fee arrangements in the proposal to Montfill. Standard VI(C): Referral Fees requires Members and Candidates to disclose to their employer, clients, and prospective clients, as appropriate, any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services. By disclosing the proposed referral fees, Mehta allows the client to determine for themselves if Risner is recommended solely for Mehta’s potential benefit.\nIf Mehta states to the client he has direct experience in all the countries where Montfill operates, he would be dishonest. Mehta has not undertaken related assignments in India prior to this assignment and would thus be violating Standard I(C): Misrepresentation and Standard I(D): Misconduct. Standard I(C): Misrepresentation requires Members and Candidates to not knowingly make any misrepresentations relating to investment analysis, recommendations, actions, or other professional activities.\nInvestment professionals who make false or misleading statements not only harm investors but also reduce the level of investor confidence in the investment profession, which threatens the integrity of capital markets as a whole. Standard I(D): Misconduct states Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or commit any act that reflects adversely on their professional reputation, integrity, or competence.\nA is incorrect. Incorrect. If Mehta states to the client he has direct experience in all the countries where Montfill operates, he is being dishonest. Mehta has not undertaken related assignments in India prior to this client, and he would thus be violating Standard I(C): Misrepresentation and Standard I(D): Misconduct.\nC is incorrect. Incorrect. If Mehta states to the client he has direct experience in all the countries where Montfill operates, he is being dishonest. Mehta has not undertaken related assignments in India prior to this client, and he would thus be violating Standard I(C): Misrepresentation and Standard I(D): Misconduct.", "ko": "Referral fee arrangement를 proposal에 넣겠다고 했으므로 VI(C)는 least likely 위반.", "trap": "사전 공개(제안서 포함)면 VI(C) 충족.", "f": "", "why": {"A": "Incorrect. If Mehta states to the client he has direct experience in all the countries where Montfill operates, he is being dishonest. Mehta has not undertaken related assignments in India prior to this client, and he would thus be violating Standard I(C): Misrepresentation and Standard I(D): Misconduct.", "C": "Incorrect. If Mehta states to the client he has direct experience in all the countries where Montfill operates, he is being dishonest. Mehta has not undertaken related assignments in India prior to this client, and he would thus be violating Standard I(C): Misrepresentation and Standard I(D): Misconduct."}, "orig": "ECO Module 2 Q67"}, {"id": "ECO-M2-Q68", "src": "안 푼 문제", "module": 2, "tag": "I(C)/V(A) — third-party data without due diligence", "vig": 15, "stem": "Which of the items Mehta wants to include in the Investment Policy Statement most likely reflects a violation of the CFA Institute Standards of Professional Conduct?", "opts": {"A": "Item 1", "B": "Item 2", "C": "Item 3"}, "ans": "A", "en": "A is correct. Correct. Item 1 most likely reflects a violation of the CFA Institute Standards of Professional Conduct. Mehta is using economic data from third-party providers to help determine expected asset class returns to formulate his asset class recommendations to clients. While using third-party research is not a violation in and of itself, there is no indication Mehta made efforts to determine whether such research from his former employer’s vendors is sound and current prior to using their research as part of his recommendations to clients. Therefore, Mehta likely violates Standard V(A): Diligence and Reasonable Basis, which requires Members and Candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions as well as having a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action.\nB is incorrect. Incorrect. Mehta plans to disclose he may from time to time work with clients in the same industry who may be direct competitors. As this information was included in the client contract, it does not appear to violate Standard VI(A): Disclosure of Conflicts, which requires Members and Candidates to make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain language, and communicate the relevant information effectively.\nC is incorrect. Incorrect. Mehta indicates in Item 3 that he acts with loyalty, prudence, and care, thus complying with Standard III(A): Loyalty, Prudence, and Care, which states Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and Candidates must act for the benefit of their clients and place their client’s interests before their employer’s or their own interests.", "ko": "Third-party 경제 데이터를 검증 없이 기대 수익 산출에 쓰는 Item 1이 위반.", "trap": "Third-party research는 써도 되지만 reasonableness 확인이 필요.", "f": "", "why": {"B": "Incorrect. Mehta plans to disclose he may from time to time work with clients in the same industry who may be direct competitors. As this information was included in the client contract, it does not appear to violate Standard VI(A): Disclosure of Conflicts, which requires Members and Candidates to make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain language, and communicate the relevant information effectively.", "C": "Incorrect. Mehta indicates in Item 3 that he acts with loyalty, prudence, and care, thus complying with Standard III(A): Loyalty, Prudence, and Care, which states Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and Candidates must act for the benefit of their clients and place their client’s interests before their employer’s or their own interests."}, "orig": "ECO Module 2 Q68"}, {"id": "ECO-M2-Q69", "src": "풀어볼 문제", "module": 2, "tag": "IV(A) Loyalty — taking firm records", "vig": null, "stem": "Jenny Wilkin, CFA, leaves her employer ABC Investment (ABCI) to start her own investment firm. She has no noncompete agreement with ABCI. Wilkin leaves all research records at ABCI, and only takes an internal analysis of ABCI's sales strategy. After leaving ABCI, she uses the internet to look up the clients she served at her former firm. Using the contact data she finds on the internet, she solicits clients and encourages them to switch to her new firm.\nDid Wilkin violate the Standard relating to loyalty?", "opts": {"A": "No", "B": "Yes, by taking an internal analysis of ABCI's sales strategy", "C": "Yes, by soliciting business from ABCI clients to switch to her new firm"}, "ans": "B", "en": "B is correct. Correct because according to Standard IV(A): Loyalty, the member or candidate must not take records or files to a new employer without the written permission of the previous employer. Also, firm records or work performed on behalf of the firm that is stored in paper copy or electronically for the member’s or candidate’s convenience while employed, however, should be erased or returned to the employer unless the firm gives permission to keep those records after employment ends. The internal sales strategy analysis is the property of ABCI, so Wilkin violated the Standards by taking the analysis.\nA is incorrect. Incorrect because, as noted in the correct answer, Wilkin violated the Standard relating to loyalty by taking the internal analysis of ABCI's sales strategy.\nC is incorrect. Incorrect because according to Standard IV(A): Loyalty, a member or candidate who is contemplating seeking other employment must not contact existing clients or potential clients prior to leaving his or her employer for purposes of soliciting their business for the new employer. Also, once an employee has left the firm, the skills and experience that an employee obtained while employed are not “confidential” or “privileged” information. Similarly, simple knowledge of the names and existence of former clients is generally not confidential information unless deemed such by an agreement or by law.\nIn this case, with no noncompete agreement, Wilkins is allowed to solicit clients using simple knowledge using the internet.", "ko": "No noncompete면 이직 후 공개 정보로 전 client를 유치해도 OK. 하지만 회사 내부 sales strategy 분석을 가져가면 위반.", "trap": "Client 유치보다 '기록 반출'이 위반 포인트.", "f": "", "why": {"A": "Incorrect because, as noted in the correct answer, Wilkin violated the Standard relating to loyalty by taking the internal analysis of ABCI's sales strategy.", "C": "Incorrect because according to Standard IV(A): Loyalty, a member or candidate who is contemplating seeking other employment must not contact existing clients or potential clients prior to leaving his or her employer for purposes of soliciting their business for the new employer. Also, once an employee has left the firm, the skills and experience that an employee obtained while employed are not “confidential” or “privileged” information. Similarly, simple knowledge of the names and existence of former clients is generally not confidential information unless deemed such by an agreement or by law.\nIn this case, with no noncompete agreement, Wilkins is allowed to solicit clients using simple knowledge using the internet."}, "orig": "ECO Module 2 Q69"}, {"id": "ECO-M2-Q70", "src": "안 푼 문제", "module": 2, "tag": "I(A) Knowledge of the Law — dissociate", "vig": null, "stem": "Peter Jonas, CFA, works as an analyst on an investment team. Jonas accepts an assignment to collaborate with a colleague to publish an investment recommendation for distribution to clients. During this collaboration, Jonas observes an unethical activity by his colleague. Jonas contacts his supervisor to report the matter but the supervisor says she is unable to investigate due to a lack of firm resources.\nTo comply with the Standards, Jonas must:", "opts": {"A": "disassociate from the activity.", "B": "notify CFA Institute of his colleague's activity.", "C": "continue to work with the colleague to avoid delays in distributing the recommendation to clients."}, "ans": "A", "en": "A is correct. Correct because Standard I(A), Knowledge of the Law, states if a member or candidate has reasonable grounds to believe that imminent or ongoing client or employer activities are illegal or unethical, the member or candidate must dissociate, or separate, from the activity.\nB is incorrect. Incorrect because according to Standard I(A), Knowledge of the Law, while CFA Institute strongly encourages members and candidates to report potential violations of the Code and Standards committed by fellow members and candidates, this is not a requirement of the Standard.\nC is incorrect. Incorrect because according to Standard I(A), Knowledge of the Law, inaction combined with continuing association with those involved in illegal or unethical conduct may be construed as participation or assistance in the illegal or unethical conduct. Instead, if the attempt of bringing the matter to the attention of a supervisor is unsuccessful then members and candidates have a responsibility to step away and dissociate from the activity.", "ko": "비윤리 활동을 알고 supervisor가 조치하지 않으면 그 활동에서 dissociate해야 한다.", "trap": "CFA Institute에 신고할 의무는 없다(권장일 뿐).", "f": "", "why": {"B": "Incorrect because according to Standard I(A), Knowledge of the Law, while CFA Institute strongly encourages members and candidates to report potential violations of the Code and Standards committed by fellow members and candidates, this is not a requirement of the Standard.", "C": "Incorrect because according to Standard I(A), Knowledge of the Law, inaction combined with continuing association with those involved in illegal or unethical conduct may be construed as participation or assistance in the illegal or unethical conduct. Instead, if the attempt of bringing the matter to the attention of a supervisor is unsuccessful then members and candidates have a responsibility to step away and dissociate from the activity."}, "orig": "ECO Module 2 Q70"}, {"id": "ECO-M2-Q71", "src": "풀어볼 문제", "module": 2, "tag": "I(B) Gifts — potential manager", "vig": null, "stem": "Lisa Fourier, CFA, works at an investment firm where she is responsible for hiring outside fund managers. During an overseas visit at the office of a potential fund manager, she is offered expensive tickets to a sporting event as a gift from the fund manager. Fourier knows that offering and accepting gifts is an accepted business practice in the fund manager's country. As required by her firm’s policy, she obtains written approval from all parties involved after accepting the tickets.\nAre Fourier's actions consistent with the Standards?", "opts": {"A": "Yes", "B": "No, because she accepts a gift from a potential manager", "C": "No, because she fails to obtain approval before accepting the tickets"}, "ans": "B", "en": "B is correct. Correct because according to Standard I (B), Independence and Objectivity, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. Further, when serving in a hiring capacity, members and candidates should not solicit gifts, contributions, or other compensation that may affect their independence and objectivity, and should refuse gifts, donations, and other offered compensation that may be perceived to influence their decision-making process.\nTherefore, Fourier's acceptance of the tickets is not consistent with the Standards because the expensive tickets could reasonably be expected to compromise her independence and objectivity when selecting managers.\nA is incorrect. Incorrect because Fourier violates Standard I (B), Independence and Objectivity, by accepting the expensive gift. According to this Standard, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity.\nSince this is an expensive gift, that reasonably could be expected to compromise her independence and objectivity, she must refuse acceptance.\nC is incorrect. Incorrect because according to Standard I (B), Independence and Objectivity, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity.\nDue to the nature of this gift, which is not a modest or token gift, she must refuse acceptance. Irrespective of obtaining written approval from all parties involved, accepting the expensive sporting event tickets from the potential manager represents a potential conflict with the interest of Fourier's employer or her firm's clients and violates this Standard because the expensive tickets could reasonably be expected to compromise her independence and objectivity when selecting managers.", "ko": "Potential fund manager에게서 비싼 티켓을 받는 것은 independence를 해칠 수 있어 위반. 그 나라 관행이어도 마찬가지.", "trap": "사후 승인 문제가 아니라 받는 것 자체가 문제(client 선물과 다름).", "f": "", "why": {"A": "Incorrect because Fourier violates Standard I (B), Independence and Objectivity, by accepting the expensive gift. According to this Standard, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity.\nSince this is an expensive gift, that reasonably could be expected to compromise her independence and objectivity, she must refuse acceptance.", "C": "Incorrect because according to Standard I (B), Independence and Objectivity, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity.\nDue to the nature of this gift, which is not a modest or token gift, she must refuse acceptance. Irrespective of obtaining written approval from all parties involved, accepting the expensive sporting event tickets from the potential manager represents a potential conflict with the interest of Fourier's employer or her firm's clients and violates this Standard because the expensive tickets could reasonably be expected to compromise her independence and objectivity when selecting managers."}, "orig": "ECO Module 2 Q71"}, {"id": "ECO-M2-Q72", "src": "풀어볼 문제", "module": 2, "tag": "I(C) Misrepresentation — cite sources", "vig": null, "stem": "Johanna Mentu, CFA, is an analyst at an investment firm. She prepares a research report for clients and adds the forecast of a central bank economist, as well as the latest statistics from a recognized statistical reporting service, to her report. Mentu also adds a summary of the findings of a third-party newsletter. In her final report sent to clients, Mentu only acknowledges the economist as a source for her report.\nDid Mentu violate the Standard relating to misrepresentation?", "opts": {"A": "No", "B": "Yes, by failing to acknowledge the third-party newsletter as a source in her report", "C": "Yes, by failing to acknowledge the recognized statistical reporting service as a source in her report"}, "ans": "B", "en": "B is correct. Correct because Standard I(C), Misrepresentation, states that a violation of this standard is the preparation of research reports based on multiple sources of information without acknowledging the sources. Further, the recommended procedures clarify that to avoid plagiarism in preparing research reports or conclusions of analysis, members and candidates should attribute to their sources any paraphrases or summaries of material prepared by others.\nTherefore, Mentu must acknowledge the third-party newsletter in the summary of her findings in the report.\nA is incorrect. Incorrect because according to Standard I(C), Misrepresentation, she is required to acknowledge the third-party report as a source for her report because a violation of this standard is the preparation of research reports based on multiple sources of information without acknowledging the sources.\nTherefore, Mentu must acknowledge the third-party newsletter as a source for her report.\nC is incorrect. Incorrect because while Standard I(C), Misrepresentation, states that members and candidates, to avoid plagiarism, members and candidates should attribute to their sources any direct quotations, including projections, tables, statistics, model/product ideas, and new methodologies prepared by persons other than recognized financial and statistical reporting services or similar sources.\nTherefore, Mentu does not violate this Standard by omitting attribution to the recognized statistical reporting service.", "ko": "Third-party newsletter 요약을 출처 없이 씀 → I(C) 위반. Recognized statistical reporting service 자료는 출처 표기 없이 써도 된다.", "trap": "Recognized statistical service는 예외. Newsletter·다른 analyst 자료는 출처 표기.", "f": "", "why": {"A": "Incorrect because according to Standard I(C), Misrepresentation, she is required to acknowledge the third-party report as a source for her report because a violation of this standard is the preparation of research reports based on multiple sources of information without acknowledging the sources.\nTherefore, Mentu must acknowledge the third-party newsletter as a source for her report.", "C": "Incorrect because while Standard I(C), Misrepresentation, states that members and candidates, to avoid plagiarism, members and candidates should attribute to their sources any direct quotations, including projections, tables, statistics, model/product ideas, and new methodologies prepared by persons other than recognized financial and statistical reporting services or similar sources.\nTherefore, Mentu does not violate this Standard by omitting attribution to the recognized statistical reporting service."}, "orig": "ECO Module 2 Q72"}, {"id": "ECO-M2-Q73", "src": "풀어볼 문제", "module": 2, "tag": "I(D) Misconduct — bankruptcy from deceit", "vig": null, "stem": "Margaret Belle, CFA, owns an investment firm. She is found guilty of deceitful business conduct, the circumstances of which lead directly to her personal bankruptcy. Belle is also an activist for climate action. On one particular weekend, Belle attends a public, nonviolent protest as part of a permitted demonstration in her country. After the protest she is arrested by the police for trespassing on a company's property.\nBelle has violated the Standard relating to misconduct by:", "opts": {"A": "attending a public protest.", "B": "filing for personal bankruptcy.", "C": "trespassing on the property of a company."}, "ans": "B", "en": "B is correct. Correct because according to Standard I (D), Misconduct, filing for personal bankruptcy does not always violate the Standards. However, if the circumstances of the bankruptcy involve fraudulent or deceitful business conduct, the bankruptcy may be a violation of this standard. In this case, Belle's bankruptcy circumstances involve deceitful business conduct which represents a violation of this Standard.\nA is incorrect. Incorrect, because Standard I (D), Misconduct, is not meant to cover legal transgressions resulting from acts of civil disobedience in support of personal beliefs because such conduct does not reflect poorly on the member’s or candidate’s professional reputation, integrity, or competence. Therefore, simply attending a permitted protest is not a violation of this Standard.\nC is incorrect. Incorrect, because Standard I (D), Misconduct, is not meant to cover legal transgressions resulting from acts of civil disobedience in support of personal beliefs because such conduct does not reflect poorly on the member’s or candidate’s professional reputation, integrity, or competence. Therefore, being arrested for trespassing during a nonviolent protest is not a violation of this Standard.", "ko": "Deceitful business conduct로 생긴 personal bankruptcy는 I(D) 위반. 합법 시위 참여·체포 자체는 professional conduct 문제 아님.", "trap": "Bankruptcy 자체는 위반이 아니지만 사기·기만이 원인이면 위반.", "f": "", "why": {"A": "Incorrect, because Standard I (D), Misconduct, is not meant to cover legal transgressions resulting from acts of civil disobedience in support of personal beliefs because such conduct does not reflect poorly on the member’s or candidate’s professional reputation, integrity, or competence. Therefore, simply attending a permitted protest is not a violation of this Standard.", "C": "Incorrect, because Standard I (D), Misconduct, is not meant to cover legal transgressions resulting from acts of civil disobedience in support of personal beliefs because such conduct does not reflect poorly on the member’s or candidate’s professional reputation, integrity, or competence. Therefore, being arrested for trespassing during a nonviolent protest is not a violation of this Standard."}, "orig": "ECO Module 2 Q73"}, {"id": "ECO-M2-Q74", "src": "풀어볼 문제", "module": 2, "tag": "II(A) MNPI — passive market making", "vig": null, "stem": "Petra Maybolk, CFA, works for a large investment firm where she oversees a team of market makers. Maybolk's firm has just taken a small issuer public and is a market maker in the issuer's stock. After receiving material nonpublic information about the small issuer, Maybolk instructs her subordinates to continue market-making activities for the small issuer and to take only the contra side of unsolicited customer trades in the stock.\nDid Maybolk's actions violate the Standards?", "opts": {"A": "No", "B": "Yes, because Maybolk instructs her subordinates to continue market-making activities for the small issuer", "C": "Yes, because Maybolk instructs her firm's market maker to only take the contra side of unsolicited customer trades in the small issuer's stock"}, "ans": "A", "en": "A is correct. Correct because according to Standard II(A), Material Nonpublic Information, firms that continue market-making activity while in the possession of material nonpublic information should, however, instruct their market makers to remain passive with respect to the market—that is, to take only the contra side of unsolicited customer trades. Otherwise, and for the case of a firm that has taken a small issuer public with the understanding that the firm will continue to be a market maker in the stock, a withdrawal by the firm from market-making activities would be a clear tip to outsiders.\nB is incorrect. Incorrect because according to Standard II(A), Material Nonpublic Information, for the case of a firm that has taken a small issuer public with the understanding that the firm will continue to be a market maker in the stock, a withdrawal by the firm from market-making activities would be a clear tip to outsiders. Firms that continue market-making activity while in the possession of material nonpublic information should, however, instruct their market makers to remain passive.\nC is incorrect. Incorrect because according to Standard II(A), Material Nonpublic Information, firms that continue market-making activity while in the possession of material nonpublic information should, however, instruct their market makers to remain passive with respect to the market—that is, to take only the contra side of unsolicited customer trades.", "ko": "MNPI가 있어도 market making을 계속할 수 있고, unsolicited 주문의 contra side만 받는 passive 자세면 위반 아님.", "trap": "Market making 중단이 의무는 아니다. Passive면 OK.", "f": "", "why": {"B": "Incorrect because according to Standard II(A), Material Nonpublic Information, for the case of a firm that has taken a small issuer public with the understanding that the firm will continue to be a market maker in the stock, a withdrawal by the firm from market-making activities would be a clear tip to outsiders. Firms that continue market-making activity while in the possession of material nonpublic information should, however, instruct their market makers to remain passive.", "C": "Incorrect because according to Standard II(A), Material Nonpublic Information, firms that continue market-making activity while in the possession of material nonpublic information should, however, instruct their market makers to remain passive with respect to the market—that is, to take only the contra side of unsolicited customer trades."}, "orig": "ECO Module 2 Q74"}, {"id": "ECO-M2-Q75", "src": "안 푼 문제", "module": 2, "tag": "II(B) Market Manipulation — liquidity-motivated trading", "vig": null, "stem": "Julia Anderson, CFA, a trader, notices a decline in liquidity of Stock 1. She starts buying and selling Stock 1 to incentivize market activity in the stock. Anderson also notices that Stock 2 trades at different prices in two different exchanges, and starts buying and selling Stock 2 to exploit the price difference. Anderson has violated the Standard(s) by trading:", "opts": {"A": "Stock 1 only.", "B": "Stock 2 only.", "C": "both Stock 1 and Stock 2."}, "ans": "A", "en": "A is correct. Correct because according to Standard II (B), Market Manipulation, transaction-based manipulation involves transactions that artificially affect prices or volume to give the impression of activity or price movement in a financial instrument. Therefore, trading Stock 1 violates this Standard. Legitimately exploiting price differences in Stock 2 is not a violation of this Standard.\nB is incorrect. Incorrect because Standard II(B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. Legitimately exploiting price differences in Stock 2 is not a violation of this Standard.\nC is incorrect. Incorrect because Standard II(B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. And transaction-based manipulation involves transactions that artificially affect prices or volume to give the impression of activity or price movement in a financial instrument. Legitimately exploiting price differences in Stock 2 is not a violation of this Standard.", "ko": "거래를 활발해 보이게 하려는 매매(Stock 1)는 manipulation. 두 거래소 가격 차이 arbitrage(Stock 2)는 정당.", "trap": "'유동성 제공'이 목적이어도 오해를 주는 거래량 조성은 위반.", "f": "", "why": {"B": "Incorrect because Standard II(B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. Legitimately exploiting price differences in Stock 2 is not a violation of this Standard.", "C": "Incorrect because Standard II(B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. And transaction-based manipulation involves transactions that artificially affect prices or volume to give the impression of activity or price movement in a financial instrument. Legitimately exploiting price differences in Stock 2 is not a violation of this Standard."}, "orig": "ECO Module 2 Q75"}, {"id": "ECO-M2-Q76", "src": "안 푼 문제", "module": 2, "tag": "II(B) Market Manipulation — legitimate strategies", "vig": null, "stem": "John Keen, CFA, concludes through his analysis that Stock 1 is significantly undervalued and buys a large amount of the stock. As a result, Stock 1's price increases significantly. A few days later, Keen sells Stock 1 at a profit. One week later, Keen notices that Stock 2 is trading at different prices in two different exchanges. Keen buys and sells Stock 2 to exploit the difference in prices and makes a profit. Has Keen violated the Standard relating to market manipulation?", "opts": {"A": "No", "B": "Yes, by trading Stock 1", "C": "Yes, by trading Stock 2"}, "ans": "A", "en": "A is correct. Correct because Standard II (B), Market Manipulation, is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Keen used his analysis in trading Stock 1, and an arbitrage opportunity in Stock 2, thus not violating this Standard.\nB is incorrect. Incorrect because Standard II (B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Keen used his analysis in trading Stock 1, thus not violating this Standard.\nC is incorrect. Incorrect because Standard II (B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Keen used an arbitrage opportunity in Stock 2, thus not violating this Standard.", "ko": "저평가 판단 후 대량 매수·arbitrage는 정당한 전략이라 위반 아님. 핵심은 intent.", "trap": "가격이 크게 올랐다는 결과만 보고 위반으로 판단하지 않는다.", "f": "", "why": {"B": "Incorrect because Standard II (B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Keen used his analysis in trading Stock 1, thus not violating this Standard.", "C": "Incorrect because Standard II (B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Keen used an arbitrage opportunity in Stock 2, thus not violating this Standard."}, "orig": "ECO Module 2 Q76"}, {"id": "ECO-M2-Q77", "src": "풀어볼 문제", "module": 2, "tag": "III(A) Loyalty — pension plan beneficiaries", "vig": null, "stem": "The president of a university hires Rose Jay, CFA, to manage the employee pension plan. Jay owes her duty of loyalty to the:", "opts": {"A": "university.", "B": "beneficiaries of the fund.", "C": "president of the university."}, "ans": "B", "en": "B is correct. Correct because according to Standard III(A): Loyalty, Prudence, and Care, when the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries.\nA is incorrect. Incorrect because when the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries.\nC is incorrect. Incorrect because when the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries.", "ko": "Pension plan을 운용하면 duty of loyalty는 고용한 사람이 아니라 plan beneficiaries에게 있다.", "trap": "University나 president는 hiring entity일 뿐.", "f": "", "why": {"A": "Incorrect because when the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries.", "C": "Incorrect because when the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries."}, "orig": "ECO Module 2 Q77"}, {"id": "ECO-M2-Q78", "src": "풀어볼 문제", "module": 2, "tag": "III(B) Fair Dealing — family client delayed", "vig": null, "stem": "Becky Wilkins, CFA, an analyst, prepares a buy recommendation for a stock. The recommendation is also suitable for her sister, a standard fee-paying client. To avoid a conflict of interest, Wilkins sends the recommendation to her sister one day after sending it to all of her other suitable clients. Wilkins then calls all of her premium fee-paying clients to provide further details about the recommendation.\nHas Becky violated the Standard relating to fair dealing?", "opts": {"A": "No", "B": "Yes, by providing further details about the recommendation to her premium fee-paying clients", "C": "Yes, by sending the recommendation to her sister one day after sending it to her other clients"}, "ans": "C", "en": "C is correct. Correct because according to Standard III(B), Fair Dealing, members and candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Her sister is a standard fee-paying client also, so she should treat her equitably with other clients.\nA is incorrect. Incorrect because according to Standard III(B), Fair Dealing, members and candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Her sister is a standard fee-paying client also, so she should treat her equitably with other clients.\nB is incorrect. Incorrect because according to Standard III(B), Fair Dealing, members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage. Providing further details about a recommendation to premium fee-paying clients is not a violation.", "ko": "Standard fee-paying client인 동생에게 하루 늦게 보내면 Fair Dealing 위반. Premium client 추가 설명은 허용.", "trap": "Conflict 피하려고 family client를 불리하게 하는 것도 위반.", "f": "", "why": {"A": "Incorrect because according to Standard III(B), Fair Dealing, members and candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Her sister is a standard fee-paying client also, so she should treat her equitably with other clients.", "B": "Incorrect because according to Standard III(B), Fair Dealing, members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage. Providing further details about a recommendation to premium fee-paying clients is not a violation."}, "orig": "ECO Module 2 Q78"}, {"id": "ECO-M2-Q79", "src": "풀어볼 문제", "module": 2, "tag": "III(B) Fair Dealing — limit people and time", "vig": null, "stem": "Thomas Li, CFA, was recently hired to manage an equity fund. Li reads the following company policies regarding the dissemination of investment recommendations:\n•\tPolicy 1: An analyst should limit the number of people who are privy to the fact that a recommendation is going to be disseminated.\n•\tPolicy 2: An analyst should limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated.\nTo be consistent with the Standard relating to fair dealing, Li should follow:", "opts": {"A": "Policy 1 only.", "B": "Policy 2 only.", "C": "both Policy 1 and Policy 2."}, "ans": "C", "en": "C is correct. Correct because according to the recommended procedures for Standard III(B), Fair Dealing, members should limit the number of people involved and make reasonable efforts to limit the number of people who are privy to the fact that a recommendation is going to be disseminated. Additionally, members and candidates should make reasonable efforts to limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated.\nA is incorrect. Incorrect because according to the recommended procedures for Standard III(B), Fair Dealing, members should limit the number of people involved and make reasonable efforts to limit the number of people who are privy to the fact that a recommendation is going to be disseminated. Additionally, members and candidates should make reasonable efforts to limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated.\nB is incorrect. Incorrect because according to the recommended procedures for Standard III(B), Fair Dealing, members should limit the number of people involved and make reasonable efforts to limit the number of people who are privy to the fact that a recommendation is going to be disseminated. Additionally, members and candidates should make reasonable efforts to limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated.", "ko": "추천 배포 전 아는 사람 수를 줄이고, 결정~배포 사이 시간을 줄이는 것 모두 recommended procedures.", "trap": "둘 중 하나만 고르면 틀림.", "f": "", "why": {"A": "Incorrect because according to the recommended procedures for Standard III(B), Fair Dealing, members should limit the number of people involved and make reasonable efforts to limit the number of people who are privy to the fact that a recommendation is going to be disseminated. Additionally, members and candidates should make reasonable efforts to limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated.", "B": "Incorrect because according to the recommended procedures for Standard III(B), Fair Dealing, members should limit the number of people involved and make reasonable efforts to limit the number of people who are privy to the fact that a recommendation is going to be disseminated. Additionally, members and candidates should make reasonable efforts to limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated."}, "orig": "ECO Module 2 Q79"}, {"id": "ECO-M2-Q80", "src": "안 푼 문제", "module": 2, "tag": "III(C) Suitability — limited client information", "vig": null, "stem": "Jo Atkins, CFA, a portfolio manager, is meeting with a new client, Jay Sanderson. In preparing Sanderson's IPS, Sanderson refuses to fully disclose his holdings to Atkins. As a result, Atkins completes Sanderson's suitability analysis based on limited information. Sanderson has a high tolerance for risk. Having done careful research, Atkins recommends a portfolio of information technology stocks. One of the technology stocks is significantly affected by unexpected changes in market sentiment, which results in a large loss for Sanderson in the first year.\nHas Atkins violated the Standard(s)?", "opts": {"A": "No", "B": "Yes, by failing to prevent a large loss for Sanderson", "C": "Yes, by completing Sanderson's suitability analysis based on limited information"}, "ans": "A", "en": "A is correct. Correct because according to Standard III(C), Suitability, if clients withhold information about their financial portfolios, the suitability analysis conducted by members and candidates cannot be expected to be complete; it must be based on the information provided. In addition, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Finally, according to Standard III(A), Loyalty, Prudence, and Care, members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. In this case, despite having limited client information, Atkins performed appropriate suitability determination about Sanderson's risk profile and careful research into information technology stocks that were appropriate for this risk profile. The loss on Sanderson's investments is thus not a violation of the Standards.\nB is incorrect. Incorrect because Atkins performed a thorough suitability analysis regarding Sanderson's risk profile and thus the loss for Sanderson is not a violation of the Standards.\nC is incorrect. Incorrect because according to Standard III (C), Suitability, if clients withhold information about their financial portfolios, the suitability analysis conducted by members and candidates cannot be expected to be complete; it must be based on the information provided. So, there is no violation of the Standards.", "ko": "Client가 정보를 덜 줬다면 주어진 정보 기준으로 suitability를 판단하면 된다. 손실이 났다고 위반은 아님.", "trap": "결과(손실)로 위반을 판단하지 않는다.", "f": "", "why": {"B": "Incorrect because Atkins performed a thorough suitability analysis regarding Sanderson's risk profile and thus the loss for Sanderson is not a violation of the Standards.", "C": "Incorrect because according to Standard III (C), Suitability, if clients withhold information about their financial portfolios, the suitability analysis conducted by members and candidates cannot be expected to be complete; it must be based on the information provided. So, there is no violation of the Standards."}, "orig": "ECO Module 2 Q80"}, {"id": "ECO-M2-Q81", "src": "안 푼 문제", "module": 2, "tag": "III(C) Suitability — client insists on unsuitable trade", "vig": null, "stem": "Jeremy Bay, CFA, is a wealth manager. His client, Laura Nam, requests that Bay buy a risky stock for her. The risk level of the stock is not consistent with Nam's risk tolerance as documented in her IPS. Bay discusses with Nam his concerns about adding the stock to her portfolio. Nam acknowledges the discussion and insists on the stock purchase regardless. Bay purchases the stock for Nam. One week later, the stock decreases significantly in value.\nHas Bay violated the Standard relating to suitability?", "opts": {"A": "No", "B": "Yes, because the stock's risk level is not appropriate for Nam", "C": "Yes, because Nam suffers a significant loss from the stock purchase"}, "ans": "A", "en": "A is correct. Correct because Bay appropriately discussed suitability concerns with the client, who accepted the risk and insisted on the stock purchase regardless. This was not a violation of the Standard relating to suitability despite the fact that the investment lost money.\nAccording to Standard III(C), Suitability, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Also, in cases of unsolicited trade requests that a member or candidate knows are unsuitable for a client, the member or candidate should refrain from making the trade until he or she discusses the concerns with the client, who should acknowledge the discussion and accept the conditions that make the recommendation unsuitable.\nB is incorrect. Incorrect because according to Standard III(C), Suitability, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Also, in cases of unsolicited trade requests that a member or candidate knows are unsuitable for a client, the member or candidate should refrain from making the trade until he or she discusses the concerns with the client, who should acknowledge the discussion and accept the conditions that make the recommendation unsuitable.\nC is incorrect. Incorrect because according to Standard III(C), Suitability, an appropriate suitability determination will not prevent some investments or investment actions from losing value.", "ko": "부적합성을 설명했고 client가 그래도 원하면 실행 가능(unsolicited). 위반 아님.", "trap": "Client 고집 + 설명 = OK. 큰 영향이면 IPS 갱신 고려.", "f": "", "why": {"B": "Incorrect because according to Standard III(C), Suitability, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Also, in cases of unsolicited trade requests that a member or candidate knows are unsuitable for a client, the member or candidate should refrain from making the trade until he or she discusses the concerns with the client, who should acknowledge the discussion and accept the conditions that make the recommendation unsuitable.", "C": "Incorrect because according to Standard III(C), Suitability, an appropriate suitability determination will not prevent some investments or investment actions from losing value."}, "orig": "ECO Module 2 Q81"}, {"id": "ECO-M2-Q82", "src": "안 푼 문제", "module": 2, "tag": "III(D) Performance Presentation — implying future return", "vig": null, "stem": "Amy Watson, CFA, prepares a presentation about her investment fund. The fund has consistently delivered a return above 6% for the past five years, with volatility of less than 10% in each year. In her presentation she writes:\n•\tStatement 1: \"The fund's past performance indicates a return of at least 5% in the next few years.\"\n•\tStatement 2: \"Monetary policy changes may increase the fund volatility to above 10% in the next few years.\"\nWhich of the statements violates the Standard relating to performance presentation?", "opts": {"A": "Statement 1 only", "B": "Statement 2 only", "C": "Both Statement 1 and Statement 2"}, "ans": "A", "en": "A is correct. Correct because according to Standard III(D), Performance Presentation, members and candidates should not state or imply that clients will obtain or benefit from a rate of return that was generated in the past. In this case, a 6% past return is not a guarantee of any return in the future.\nB is incorrect. Incorrect because according to Standard III(D), Performance Presentation, members and candidates should not state or imply that clients will obtain or benefit from a rate of return that was generated in the past. In this case, Watson warned about higher volatility, rather than giving specific return projections, and thus is not a violation.\nC is incorrect. Incorrect because only Statement 1 was violated, as noted in the other choices.", "ko": "과거 수익을 근거로 '앞으로 최소 5%'라고 하면 위반. 변동성이 커질 수 있다는 경고는 정당.", "trap": "Risk 경고는 위반이 아니라 적절한 disclosure.", "f": "", "why": {"B": "Incorrect because according to Standard III(D), Performance Presentation, members and candidates should not state or imply that clients will obtain or benefit from a rate of return that was generated in the past. In this case, Watson warned about higher volatility, rather than giving specific return projections, and thus is not a violation.", "C": "Incorrect because only Statement 1 was violated, as noted in the other choices."}, "orig": "ECO Module 2 Q82"}, {"id": "ECO-M2-Q83", "src": "풀어볼 문제", "module": 2, "tag": "III(E) Confidentiality — tax fraud investigation", "vig": null, "stem": "Julian Johnson, CFA, receives an inquiry from the country's securities regulator about one of his clients, Samantha Smith, who is suspected of illegal market activities. Johnson shares all requested information about Smith with the securities regulator. The next day, Johnson receives a call from Smith asking not to disclose any information if Johnson gets contacted by anyone. Later that same day, Johnson receives a call from the local tax authority, which is investigating Smith for tax fraud. Johnson sends the requested information to the tax authority.\nHas Johnson violated the Standard relating to preservation of confidentiality?", "opts": {"A": "No", "B": "Yes, by sharing Smith's information with the tax authority", "C": "Yes, by sharing Smith's information with the securities regulator"}, "ans": "A", "en": "A is correct. Correct because according to Standard III(E), Preservation of Confidentiality,\nmembers and candidates must keep information about current, former, and prospective clients confidential unless certain conditions exist, including the information concerns illegal activities on the part of the client. In this case, Johnson shared information with both the securities regulator and the tax authority regarding suspected illegal activities, and thus is not a violation.\nB is incorrect. Incorrect because according to Standard III(E), as noted in the correct answer, sharing information regarding suspected illegal activities is not a violation.\nC is incorrect. Incorrect because according to Standard III(E), as noted in the correct answer, sharing information regarding suspected illegal activities is not a violation.", "ko": "Tax fraud는 client의 illegal activity라 정보 제공해도 위반 아님(client가 비밀을 요청해도).", "trap": "Client의 비공개 요청보다 illegal activities 예외가 우선.", "f": "", "why": {"B": "Incorrect because according to Standard III(E), as noted in the correct answer, sharing information regarding suspected illegal activities is not a violation.", "C": "Incorrect because according to Standard III(E), as noted in the correct answer, sharing information regarding suspected illegal activities is not a violation."}, "orig": "ECO Module 2 Q83"}, {"id": "ECO-M2-Q84", "src": "안 푼 문제", "module": 2, "tag": "IV(A) Loyalty — refusing employer request", "vig": null, "stem": "Julia Stevens, CFA, works for TBL Investments (TBLI). The firm has no employee trading policy. Stevens observes that her colleague bought and sold GLT stock to exploit the difference in prices in different exchanges. Stevens fails to inform her firm's compliance department about her colleague's trading activity. Separately, for all client trades, TBLI requests that Stevens pay higher brokerage fees than she believes is justified to maintain good relationship with their primary broker. Due to a lack of sufficient benefit to clients, Stevens refuses to comply with her employer's request.\nHas Stevens violated the Standard relating to loyalty?", "opts": {"A": "No", "B": "Yes, by failing to comply with her employer's request to pay higher brokerage fees", "C": "Yes, by failing to inform her firm's compliance department about her colleague's activity"}, "ans": "A", "en": "A is correct. Correct because according to Standard IV(A): Loyalty, Members and candidates must always place the interests of clients above the interests of their employer but should also consider the effects of their conduct on the sustainability and integrity of the employer firm. Also, circumstances may arise (e.g., when an employer is engaged in illegal or unethical activity) in which members and candidates must act contrary to their employer’s interests in order to comply with their duties to the market and clients.\nIn this case, higher brokerage fees were not justified and thus Stevens did not violate the Standard relating to loyalty. A member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client.\nAlso, according to Standard II(B): Market Manipulation, is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. Thus, failing to inform the compliance about a legitimate strategy is not a violation.\nB is incorrect. Incorrect because, as noted in the correct answer, did not violate the Standard relating to loyalty by failing to comply with her employer's request to pay higher brokerage fees.\nC is incorrect. Incorrect because, as noted in the correct answer, did not violate the Standard relating to market manipulation by failing to inform her firm's compliance department about her colleague's activity.", "ko": "Client 이익이 없는 높은 brokerage fee를 거부한 건 정당. Colleague 거래를 알리지 않은 것도 Loyalty 위반 아님.", "trap": "Client 이익 > employer 이익.", "f": "", "why": {"B": "Incorrect because, as noted in the correct answer, did not violate the Standard relating to loyalty by failing to comply with her employer's request to pay higher brokerage fees.", "C": "Incorrect because, as noted in the correct answer, did not violate the Standard relating to market manipulation by failing to inform her firm's compliance department about her colleague's activity."}, "orig": "ECO Module 2 Q84"}, {"id": "ECO-M2-Q85", "src": "안 푼 문제", "module": 2, "tag": "VI(A) Conflicts — disclosed relationship", "vig": null, "stem": "Jeremy Seagate, CFA, a portfolio manager, has investments in Company 1 and Company 2 for his clients' portfolios. Seagate has a personal relationship with the CEO of Company 1. He discloses this relationship to his employer. Seagate's sister, a standard fee-paying client of his firm, requests to buy a large position in Company 2. The company, as well as the size of the requested investment, are suitable for Seagate's sister. Seagate buys the requested position in Company 2's stock for her and notifies his employer.\nDid Seagate violate the Standard relating to avoid or disclose conflicts?", "opts": {"A": "No", "B": "Yes, by trading the stock of Company 1", "C": "Yes, by trading the stock of Company 2"}, "ans": "A", "en": "A is correct. Correct because according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. In this case, because Seagate disclosed his relationship with the CEO of Company 1 and his sister is a standard fee-paying client (of which his firm is aware), he did not violate the Standard relating to avoid or disclose conflicts.\nB is incorrect. Incorrect because, as noted in the correct answer, because Seagate disclosed his relationship with the CEO of Company 1, he did not violate the Standard relating to avoid or disclose conflicts by trading the stock of the company.\nC is incorrect. Incorrect because, as noted in the correct answer, because Seagate's sister is a standard fee-paying client (of which his firm is aware), he did not violate the Standard relating to avoid or disclose conflicts by trading the stock of Company 2.", "ko": "관계를 employer에게 공개했고 sister는 standard client라 적합한 거래 실행은 위반 아님.", "trap": "공개 + 공정 대우면 OK.", "f": "", "why": {"B": "Incorrect because, as noted in the correct answer, because Seagate disclosed his relationship with the CEO of Company 1, he did not violate the Standard relating to avoid or disclose conflicts by trading the stock of the company.", "C": "Incorrect because, as noted in the correct answer, because Seagate's sister is a standard fee-paying client (of which his firm is aware), he did not violate the Standard relating to avoid or disclose conflicts by trading the stock of Company 2."}, "orig": "ECO Module 2 Q85"}, {"id": "ECO-M2-Q86", "src": "풀어볼 문제", "module": 2, "tag": "VI(B) Priority — annual holdings disclosure", "vig": null, "stem": "Alina Sokolova, CFA, has been an advisor at BT Investments (BTI) for the past seven years. She has disclosed her private holdings twice since she joined BTI. Sokolova allocates shares of a highly anticipated IPO to her clients on a pro-rata order basis. One of these clients is her sister, who is a regular fee-paying client of BTI.\nAre Sokolova's actions consistent with the Standard relating to priority of transactions?", "opts": {"A": "Yes", "B": "No, because she allocated the IPO to her sister", "C": "No, because she has disclosed her private holdings only twice since she joined the firm"}, "ans": "C", "en": "C is correct. Correct because according to the recommended procedures for compliance with Standard VI(B), Priority of Transactions, disclosure by investment personnel to the firm should be made upon commencement of the employment relationship and at least annually thereafter. Because she has disclosed her private holdings only two times in seven years, her actions are not consistent with the Standards.\nA is incorrect. Incorrect because, as noted in the correct answer, Sokolova has disclosed her private holdings only two times in seven years, which is not consistent with the Standards.\nB is incorrect. Incorrect because while Standard VI(B), Priority of Transactions, encourages limited participation in equity IPOs, Sokolova's sister is a standard-fee paying client so she should be allocated equally to other clients. Thus Sokolova's actions were consistent with the Standards.", "ko": "Investment personnel은 입사 시와 at least annually 보유 내역을 공개해야 한다. 7년에 두 번은 부족.", "trap": "Sister에게 IPO pro-rata 배정은 정상(regular fee-paying client).", "f": "", "why": {"A": "Incorrect because, as noted in the correct answer, Sokolova has disclosed her private holdings only two times in seven years, which is not consistent with the Standards.", "B": "Incorrect because while Standard VI(B), Priority of Transactions, encourages limited participation in equity IPOs, Sokolova's sister is a standard-fee paying client so she should be allocated equally to other clients. Thus Sokolova's actions were consistent with the Standards."}, "orig": "ECO Module 2 Q86"}, {"id": "ECO-M2-Q87", "src": "풀어볼 문제", "module": 2, "tag": "VI(C) Referral Fees — disclose before signing", "vig": null, "stem": "Lisa Peterson, CFA, is a portfolio manager at GHI Investments (GHI). Peterson uses the software of AIQ, an external vendor. She recommends AIQ's software to her clients and receives a referral fee from AIQ when clients subscribe to the software. Peterson informs her employer and all clients about the arrangement with AIQ. Separately, GHI gives existing clients a small discount on the firm's service fees after referring new clients to GHI. Peterson informs all referred clients about this arrangement immediately after they sign GHI's service agreement.\nDid Peterson's actions violate the Standard relating to referral fees?", "opts": {"A": "No", "B": "Yes, by accepting referral fees from AIQ", "C": "Yes, by informing all referred clients about the referral arrangement immediately after they sign GHI's service agreement"}, "ans": "C", "en": "C is correct. Correct because according to Standard VI(C), Referral Fees, members have responsibility to inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients. Furthermore, appropriate disclosure means that members and candidates must advise the client or prospective client, before entry into any formal agreement for services, of any benefit given or received for the recommendation of any services provided by the member or candidate. Referred clients must be informed about the arrangement before entering into an agreement and thus is a violation of the Standards.\nA is incorrect. Incorrect because according to Standard VI(C), Referral Fees, members have responsibility to inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients. Furthermore, appropriate disclosure means that members and candidates must advise the client or prospective client, before entry into any formal agreement for services, of any benefit given or received for the recommendation of any services provided by the member or candidate.\nB is incorrect. Incorrect because according to Standard VI(C), Referral Fees, members have responsibility to inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients. Because Peterson discloses the referral fees from AIQ, she did not violate the Standards.", "ko": "Referral 혜택은 client가 서비스 계약을 맺기 전에 알려야 한다. 서명 직후 알린 것은 위반.", "trap": "Fee 수령 자체는 공개만 하면 OK. Timing이 핵심.", "f": "", "why": {"A": "Incorrect because according to Standard VI(C), Referral Fees, members have responsibility to inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients. Furthermore, appropriate disclosure means that members and candidates must advise the client or prospective client, before entry into any formal agreement for services, of any benefit given or received for the recommendation of any services provided by the member or candidate.", "B": "Incorrect because according to Standard VI(C), Referral Fees, members have responsibility to inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients. Because Peterson discloses the referral fees from AIQ, she did not violate the Standards."}, "orig": "ECO Module 2 Q87"}, {"id": "ECO-M2-Q88", "src": "풀어볼 문제", "module": 2, "tag": "VII(A) Conduct — disclosing untested topics", "vig": null, "stem": "Jenny Lew sits for the Level III exam of the CFA Program. After the exam, she speaks to her friend, Tom Gerkin, who intends to take the Level III exam the next year. Lew does not reveal any exam content, only that fixed income concepts were not tested. Gerkin sets up a study group for the following year's Level III exam. In the group, Gerkin discusses exam questions from a Level III mock exam in detail.\nHave the Standards been violated?", "opts": {"A": "No", "B": "Yes, by Lew", "C": "Yes, by Gerkin"}, "ans": "B", "en": "B is correct. Correct because according to Standard VII(A), Conduct as Participants in CFA Institute Programs, CFA Institute program rules, regulations, and policies prohibit candidates from disclosing confidential material gained during the exam process. Specifically, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical areas and formulas tested or not tested on the exam. In this case, Lew revealed that fixed income concepts were not tested, and thus violated the Standards.\nA is incorrect. Incorrect because according to Standard VII(A), Conduct as Participants in CFA Institute Programs, CFA Institute program rules, regulations, and policies prohibit candidates from disclosing confidential material gained during the exam process. Specifically, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical areas and formulas tested or not tested on the exam. In this case, Lew revealed that fixed income concepts were not tested, and thus violated the Standards.\nC is incorrect. Incorrect because Standard VII (A), Conduct as Participants in CFA Institute Programs, does not prohibit candidates from discussing nonconfidential information or curriculum material with others or in study groups in preparation for the exam.", "ko": "어떤 topic이 출제 안 됐는지 말한 Lew는 위반. Mock exam 문제를 논의한 Gerkin은 위반 아님.", "trap": "'나온/안 나온 topic' 공개도 confidential 정보.", "f": "", "why": {"A": "Incorrect because according to Standard VII(A), Conduct as Participants in CFA Institute Programs, CFA Institute program rules, regulations, and policies prohibit candidates from disclosing confidential material gained during the exam process. Specifically, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical areas and formulas tested or not tested on the exam. In this case, Lew revealed that fixed income concepts were not tested, and thus violated the Standards.", "C": "Incorrect because Standard VII (A), Conduct as Participants in CFA Institute Programs, does not prohibit candidates from discussing nonconfidential information or curriculum material with others or in study groups in preparation for the exam."}, "orig": "ECO Module 2 Q88"}, {"id": "ECO-M2-Q89", "src": "안 푼 문제", "module": 2, "tag": "VII(A) Conduct — soliciting past exam questions", "vig": null, "stem": "John Teff and Julia Pinson recently took the CFA Level III exam and discussed it afterwards. Teff thinks the exam is too difficult and posts on his LinkedIn page: \"The CFA Institute sets the pass rate too low.\" After the exam, Pinson shares with Teff that she solicited past exam questions from her colleague. However, the exam questions provided to Pinson by her colleague did not help her during the Level III exam.\nHave the Standard(s) been violated?", "opts": {"A": "No", "B": "Yes, by Teff", "C": "Yes, by Pinson"}, "ans": "C", "en": "C is correct. Correct because Standard VII(A), Conduct as Participants in CFA Institute Programs, prohibits members from disclosing and/or soliciting confidential material gained prior to or during the exam and grading processes with those outside the CFA exam development process. Pinson has violated this Standard by soliciting and by receiving exam questions from her colleague.\nA is incorrect. Incorrect because Standard VII(A), Conduct as Participants in CFA Institute Programs, prohibits members from disclosing and/or soliciting confidential material gained prior to or during the exam and grading processes with those outside the CFA exam development process.\nB is incorrect. Incorrect because Standard VII(A), Conduct as Participants in CFA Institute Programs, does not cover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute programs. Members and candidates are free to disagree and express their disagreement with CFA Institute on its policies, its procedures, or any advocacy positions taken by the organization.", "ko": "과거 시험 문제를 구한 Pinson은 위반(도움이 안 됐어도). Pass rate에 대한 의견은 위반 아님.", "trap": "결과와 무관하게 soliciting 자체가 위반.", "f": "", "why": {"A": "Incorrect because Standard VII(A), Conduct as Participants in CFA Institute Programs, prohibits members from disclosing and/or soliciting confidential material gained prior to or during the exam and grading processes with those outside the CFA exam development process.", "B": "Incorrect because Standard VII(A), Conduct as Participants in CFA Institute Programs, does not cover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute programs. Members and candidates are free to disagree and express their disagreement with CFA Institute on its policies, its procedures, or any advocacy positions taken by the organization."}, "orig": "ECO Module 2 Q89"}, {"id": "ECO-M2-Q90", "src": "안 푼 문제", "module": 2, "tag": "VII(B) Reference to CFA — superior performance claim", "vig": null, "stem": "James Witt, CFA, chats with his colleague Elsa Otkins, CFA, in a LinkedIn forum about professional credentials. Witt writes to Otkins: \"Passing the CFA exams has given me an edge to deliver superior investment performance compared to others.\" Witt does not make this statement when talking to his clients. Otkins writes: \"I definitely have enhanced my knowledge in economics by studying the CFA curriculum.\" She adds the same sentence to her resume.\nHave the Standards been violated?", "opts": {"A": "No", "B": "Yes, by Witt", "C": "Yes, by Otkins"}, "ans": "B", "en": "B is correct. Correct because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, individuals must not exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program. Furthermore, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard.\nWitt's statement implies his superiority based on passing CFA exams and thus is a violation.\nA is incorrect. Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, individuals must not exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program. Furthermore, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard.\nWitt's statement implies his superiority based on passing CFA exams and thus is a violation.\nC is incorrect. Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, individuals must not exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program. However, Standard VII(B) is not intended to prohibit factual statements related to the positive benefit of earning the CFA designation.\nOtkins' statement about expanding her knowledge of economics by studying the CFA curriculum is not a violation of the Standards.", "ko": "CFA 덕분에 superior performance를 낸다는 말은 위반(client에게 안 해도). 지식이 늘었다는 말은 OK.", "trap": "공개 forum도 대상. Client 상대 여부와 무관.", "f": "", "why": {"A": "Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, individuals must not exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program. Furthermore, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard.\nWitt's statement implies his superiority based on passing CFA exams and thus is a violation.", "C": "Incorrect because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, individuals must not exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program. However, Standard VII(B) is not intended to prohibit factual statements related to the positive benefit of earning the CFA designation.\nOtkins' statement about expanding her knowledge of economics by studying the CFA curriculum is not a violation of the Standards."}, "orig": "ECO Module 2 Q90"}, {"id": "ECO-M2-Q91", "src": "안 푼 문제", "module": 2, "tag": "VII(B) Reference to CFA — factual statements", "vig": null, "stem": "On his LinkedIn profile page, Jeremy Bo, CFA, writes: \"I passed the CFA exam in three consecutive years.\" He also adds: \"I enrolled in the CFA Program to obtain the highest set of credentials in the global investment management industry.”\nDid Bo violate the Standards?", "opts": {"A": "No", "B": "Yes, by stating that he passed the CFA Program exam in three consecutive years", "C": "Yes, by stating that he took the CFA exam to obtain highest set of credentials in the global investment management industry"}, "ans": "A", "en": "A is correct. Correct because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, if a candidate passes each level of the exam in consecutive years and wants to state that he or she did so, that is not a violation of Standard VII(B) because it is a statement of fact. Also, statements referring to CFA Institute, the CFA designation, or th

Voeltz’s clients could be subject to further risk if the unapproved brokers were not able to offer best execution in a timely manner for the small-cap share trades. Standard V(A) requires Members and Candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions as well as have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Cadler’s comments indicate the Voeltz team had a reasonable basis for which to swap out of the small-cap holding into the large-cap shares. There is also no evidence Voeltz abandoned their extensive research process nor solely relied on outside parties when reaching their investment decision, both reflecting their independence.", "C": "Incorrect. Selling the small-cap shares through non-approved brokers shows a lack of diligence in that the brokers had not gone through the firm’s due diligence process to determine the overall appropriateness of utilizing the brokers’ services. In addition, Voeltz’s clients could be subject to further risk if the unapproved brokers were not able to offer best execution in a timely manner for the small-cap share trades. Standard V(A) requires Members and Candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions as well as have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Cadler’s comments indicate the Voeltz team had a reasonable basis for which to swap out of the small-cap holding into the large-cap shares. There is also no evidence Voeltz abandoned their extensive research process nor solely relied on outside parties when reaching their investment decision, both reflecting their independence."}, "orig": "ECO Module 2 Q39"}, {"id": "ECO-M2-Q41", "src": "ECO 오답", "module": 2, "tag": "IV(C) Supervisors — periodic review of procedures", "vig": 9, "stem": "Which of Patrick’s recommendations is most likely insufficient to comply with the Standard relating to responsibilities of supervisors?", "opts": {"A": "Recommendation 1", "B": "Recommendation 2", "C": "Recommendation 3"}, "ans": "A", "en": "A is correct. Correct because Recommendation 1 is insufficient to comply with Standard IV(C), Responsibilities of Supervisors, because it does not meet the requirement to perform periodic reviews. Under Standard IV(C), once a compliance program is in place, supervisors should perform periodic updates of their procedures to ensure the measures are adequate under the law. They should also review and revise their procedures as necessary as new laws and regulations are put in place to ensure the measures are adequate.\nB is incorrect. Incorrect because those recommendations are sufficient under Standard IV(C), Responsibilities of Supervisors, and could be incorporated into Northside’s Policies and Procedures as recommended.\nC is incorrect. Incorrect because those recommendations are sufficient under Standard IV(C), Responsibilities of Supervisors, and could be incorporated into Northside’s Policies and Procedures as recommended.", "ko": "Compliance program은 만든 뒤 주기적으로 review·update해야 한다. Recommendation 1은 이 periodic review가 없어 불충분.", "trap": "절차를 만드는 것만으로 부족. 'periodic review'가 빠졌는지 확인.", "f": "", "why": {"B": "Incorrect because those recommendations are sufficient under Standard IV(C), Responsibilities of Supervisors, and could be incorporated into Northside’s Policies and Procedures as recommended.", "C": "Incorrect because those recommendations are sufficient under Standard IV(C), Responsibilities of Supervisors, and could be incorporated into Northside’s Policies and Procedures as recommended."}, "orig": "ECO Module 2 Q41"}, {"id": "ECO-M2-Q43", "src": "ECO 오답", "module": 2, "tag": "III(C) Suitability — buying for all clients", "vig": 9, "stem": "Which of the following Standards has most likely been violated in relation to the research report and purchase of PT Matias?", "opts": {"A": "Suitability", "B": "Fair Dealing", "C": "Misrepresentation"}, "ans": "A", "en": "A is correct. Correct because Standard III(C), Suitability, has most likely been violated with the purchase of PT Matias since it was purchased for all client portfolios. The standard requires Members and Candidates responsible for managing a portfolio with a specific mandate, strategy, or style to take only investment actions that are consistent with the stated objectives and constraints of the portfolio. Northside manages individual accounts with conservative mandates for a variety of retirements funds. PT Matias most likely was not appropriate for those client accounts since it would be considered high risk because it has gone through a reorganization and is in a turnaround situation.\nB is incorrect. Incorrect because there is no violation of Standard III(B), Fair Dealing, which requires Members and Candidates to deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. In this instance, all the clients were treated fairly because the stock was purchased in block trade.\nC is incorrect. Incorrect because Burt has not violated Standard I(C), Misrepresentation, which requires that Members and Candidates not knowingly make any misrepresentations relating to investment analysis, recommendations, or actions or other professional activities. Burt sited management’s guidance alongside her own; therefore, there is no evidence of plagiarism.", "ko": "개별 mandate가 다른 모든 client portfolio에 PT Matias를 산 것 → III(C) Suitability 위반.", "trap": "같은 시점에 모든 계좌에 사면 Fair Dealing처럼 보이지만 핵심은 계좌별 적합성.", "f": "", "why": {"B": "Incorrect because there is no violation of Standard III(B), Fair Dealing, which requires Members and Candidates to deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. In this instance, all the clients were treated fairly because the stock was purchased in block trade.", "C": "Incorrect because Burt has not violated Standard I(C), Misrepresentation, which requires that Members and Candidates not knowingly make any misrepresentations relating to investment analysis, recommendations, or actions or other professional activities. Burt sited management’s guidance alongside her own; therefore, there is no evidence of plagiarism."}, "orig": "ECO Module 2 Q43"}, {"id": "ECO-M2-Q45", "src": "풀어볼 문제", "module": 2, "tag": "VI(B) Priority — cousin's account not beneficial ownership", "vig": 10, "stem": "As described in point 1 of the email, which Standard has LaRue least likely violated?", "opts": {"A": "Loyalty", "B": "Priority of Transactions", "C": "Preservation of Confidentiality"}, "ans": "B", "en": "B is correct. Correct because LaRue has not violated Standard VI(B), Priority of Transactions. This standard states investment transactions for clients and employers must have priority over investment transactions in which a CFA Institute member or CFA candidate is the beneficial owner. The account in question is owned by Brooke Montgomery, LaRue’s cousin, and there is no evidence that LaRue is a beneficial owner.\nA is incorrect. Incorrect because LaRue has violated Standard IV(A), Loyalty, which states that, in matters related to their employment, Members and Candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer.  By divulging confidential information, LaRue violated Standard IV(A).\nC is incorrect. Incorrect because LaRue has violated Standard III(E), Preservation of Confidentiality, which states that Members and Candidates must keep information about current, former, and prospective clients confidential. By divulging information on what clients are buying and selling, Larue violated Standard III(E).", "ko": "사촌 계좌는 LaRue가 beneficial owner라는 증거가 없어 VI(B) 위반 아님. 거래 정보를 누설해서 IV(A)·III(E)는 위반.", "trap": "'least likely' — beneficial ownership이 있어야 Priority of Transactions 문제가 된다.", "f": "", "why": {"A": "Incorrect because LaRue has violated Standard IV(A), Loyalty, which states that, in matters related to their employment, Members and Candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer.  By divulging confidential information, LaRue violated Standard IV(A).", "C": "Incorrect because LaRue has violated Standard III(E), Preservation of Confidentiality, which states that Members and Candidates must keep information about current, former, and prospective clients confidential. By divulging information on what clients are buying and selling, Larue violated Standard III(E)."}, "orig": "ECO Module 2 Q45"}, {"id": "ECO-M2-Q46", "src": "풀어볼 문제", "module": 2, "tag": "I(B) Independence — broker-sponsored conference", "vig": 10, "stem": "As described in point 2 of the email, are LaRue's actions in the presentation for a new client consistent with the Standards?", "opts": {"A": "Yes", "B": "No, his actions are inconsistent with the Standard relating to disclosure of conflicts", "C": "No, his actions are inconsistent with the Standard relating to independence and objectivity"}, "ans": "C", "en": "C is correct. Correct because LaRue's actions are inconsistent with Standard I(B), Independence and Objectivity, which states that CFA Institute members and CFA candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. Benefits include gifts, invitations to lavish functions, tickets, favors, or job referrals. Allowing R&R to sponsor his full attendance at a three-day conference compromises LaRue’s independence and objectivity. It appears R&R has tried to influence LaRue by sponsoring his attendance. Although modest gifts and entertainment are acceptable, special care must be taken by members and candidates to resist subtle and not-so-subtle pressures to act in conflict with the interests of their clients. Best practice dictates members and candidates reject any offer of gift or entertainment that could be expected to threaten their independence and objectivity.\nA is incorrect. Incorrect because LaRue's actions are inconsistent with Standard I(B), Independence and Objectivity.\nB is incorrect. Incorrect because LaRue's actions are consistent with VI(A), Disclosure of Conflicts, because he disclosed that R&R sponsored his attendance at a three-day conference.", "ko": "Broker(R&R)가 3일 리조트 conference 비용을 대준 것 → independence를 해칠 수 있는 혜택 수용으로 I(B) 위반.", "trap": "Disclosure of Conflicts(VI(A))로 고르기 쉽다. 혜택 수용 자체가 I(B) 문제.", "f": "", "why": {"A": "Incorrect because LaRue's actions are inconsistent with Standard I(B), Independence and Objectivity.", "B": "Incorrect because LaRue's actions are consistent with VI(A), Disclosure of Conflicts, because he disclosed that R&R sponsored his attendance at a three-day conference."}, "orig": "ECO Module 2 Q46"}, {"id": "ECO-M2-Q47", "src": "안 푼 문제", "module": 2, "tag": "IV(C) Supervisors — insufficient policy", "vig": 10, "stem": "In point 3 of the email, which of the policies Matheson drafted is most likely insufficient to prevent a violation of the Standards?", "opts": {"A": "Policy 1", "B": "Policy 2", "C": "Policy 3"}, "ans": "C", "en": "C is correct. Correct because Policy 3, sending periodic reminders regarding investment club membership to those employees who failed to report and outline permissible conduct, is insufficient to prevent a violation of CFA Standards of Professional Conduct. Periodic reminders regarding the investment club requirement and an outline regarding permissible conduct should be sent to all the firm’s employees. Standard IV (C), Responsibilities of Supervisors, states CFA Institute members and CFA candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rules, regulations, and the Code and Standards. Among other items, adequate compliance procedures should outline permissible conduct. Once a program is in place, supervisors should issue periodic reminders of the procedures to appropriate personnel. Once a violation is discovered increased supervision or place appropriate limitations on the wrongdoer pending the outcome of the investigation. Policy 1, membership in online investment clubs is permissible but must be reported to the Compliance Department before joining, and Policy 2, when it is discovered that a membership was not reported, increase supervision on the employee who failed to report, would help to prevent and detect violations of CFA Standards of Professional Conduct.\nA is incorrect. Incorrect because Policy 1, membership in online investment clubs is permissible but must be reported to the Compliance Department before joining, would help to prevent and detect violations of CFA Standards of Professional Conduct.\nB is incorrect. Incorrect because Policy 2, when it is discovered that a membership was not reported, increased supervision on employees who failed to report, would help to prevent and detect violations of CFA Standards of Professional Conduct.", "ko": "보고 안 한 직원에게 주기적 reminder만 보내는 Policy 3은 위반을 막기에 불충분. 모든 직원에게 교육·확인이 필요.", "trap": "Reminder는 detection·prevention 효과가 약하다.", "f": "", "why": {"A": "Incorrect because Policy 1, membership in online investment clubs is permissible but must be reported to the Compliance Department before joining, would help to prevent and detect violations of CFA Standards of Professional Conduct.", "B": "Incorrect because Policy 2, when it is discovered that a membership was not reported, increased supervision on employees who failed to report, would help to prevent and detect violations of CFA Standards of Professional Conduct."}, "orig": "ECO Module 2 Q47"}, {"id": "ECO-M2-Q48", "src": "안 푼 문제", "module": 2, "tag": "I(A) Knowledge of the Law — consult counsel", "vig": 10, "stem": "Which of the CEO’s recommendations regarding what Matheson should do next is her best course of action to be consistent with the Standards?", "opts": {"A": "Recommendation 1", "B": "Recommendation 2", "C": "Recommendation 3"}, "ans": "A", "en": "A is correct. Correct because Recommendation 1 regarding what Matheson should do next, “Consult with the firm’s securities attorney,” would be Matheson’s best course of action. Standard I(A), Knowledge of the Law, requires that CFA Institute members and CFA candidates must not knowingly participate or assist in and must dissociate from any violation of such laws, rules, or regulations. By terminating LaRue, the firm has moved to dissociate from him. The Code and Standards do not compel members and candidates to report violations to their governmental or regulatory organizations unless such disclosure is mandatory under applicable law, but such disclosure may be prudent under certain circumstances. Therefore, given LaRue’s violations, Matheson should consult with their legal and compliance advisers for guidance.\nB is incorrect. Incorrect because Recommendation 2, “Wait for the PCP to provide her with additional information,” would not be her best course of action. Once the complaint is filed, it becomes an issue between LaRue and the CFA Institute. The PCP is unlikely to contact Matheson and would not provide her with any further information.\nC is incorrect. Incorrect because Recommendation 3, “Inform the local CFA Society about the complaint,” would not be her best course of action. Notifying the local society could be considered a breach of confidentiality, and Matheson could be at risk of violating the Standards.", "ko": "다음 행동으로는 firm securities attorney와 상의하는 것이 가장 적절(I(A)).", "trap": "PCP 응답을 기다리거나 local society에 알릴 의무는 없다.", "f": "", "why": {"B": "Incorrect because Recommendation 2, “Wait for the PCP to provide her with additional information,” would not be her best course of action. Once the complaint is filed, it becomes an issue between LaRue and the CFA Institute. The PCP is unlikely to contact Matheson and would not provide her with any further information.", "C": "Incorrect because Recommendation 3, “Inform the local CFA Society about the complaint,” would not be her best course of action. Notifying the local society could be considered a breach of confidentiality, and Matheson could be at risk of violating the Standards."}, "orig": "ECO Module 2 Q48"}, {"id": "ECO-M2-Q49", "src": "안 푼 문제", "module": 2, "tag": "IV Duties to Employers — individual project", "vig": 11, "stem": "To avoid violating any CFA Institute Standards of Professional Conduct, which of the following is Ong’s most appropriate response to Mercer’s question?", "opts": {"A": "“I will need to touch base with my partners.”", "B": "“I’m not able to take on projects as an individual.”", "C": "“I can refer you to another independent adviser.”"}, "ans": "A", "en": "A is correct. Correct. Ong’s most appropriate response is, “I will need to touch base with my Partners.” Ong has a responsibility to protect the interests of his firm and his partners, according to Standard IV: Duty to Employers. If Ong took the assignment as an individual, he would be potentially harming his firm and his fellow partners. The harm would arise by Ong potentially competing against his firm and thus depriving the firm of his time, skills, and potential source of revenue, because the partners may agree to lower their normal fees to accommodate Mercer. The lower fee could be a loss leader for future projects with the government of the developing country. In particular, if Ong took the assignment as an individual, he would be violating Standard IV(A): Loyalty, which requires charterholders to act for the benefit of their employer (in this case, the employer is Ong’s firm and partners) and not deprive their employer of the advantage of their skills and abilities or otherwise cause harm to their employer. He would also be potentially violating Standard IV(B): Additional Compensation Agreements, which requires charterholders to refuse to accept additional compensation resulting from activity that competes with their employer or might reasonably be expected to create a conflict of interest. Ong would also likely be violating Standard IV: Duty to Employers if he referred another adviser to Mercer without first giving his partners the option to lower their fees. He would be eliminating a business opportunity for the firm, thus potentially harming his firm and the partners.\nB is incorrect. Incorrect. Ong’s most appropriate response is, “I will need to touch base with my Partners.” Ong has a responsibility to protect the interests of his firm and his partners, according to Standard IV: Duty to Employers. If Ong took the assignment as an individual, he would be potentially harming his firm and his fellow partners. The harm would arise by Ong potentially competing against his firm and thus depriving the firm of his time, skills, and potential source of revenue, because the partners may agree to lower their normal fees to accommodate Mercer. The lower fee could be a loss leader for future projects with the government of the developing country. In particular, if Ong took the assignment as an individual, he would be violating Standard IV(A): Loyalty, which requires charterholders to act for the benefit of their employer (in this case, the employer is Ong’s firm and partners) and not deprive their employer of the advantage of their skills and abilities or otherwise cause harm to their employer. He would also be potentially violating Standard IV(B): Additional Compensation Agreements, which requires charterholders to refuse to accept additional compensation resulting from activity that competes with their employer or might reasonably be expected to create a conflict of interest. Ong would also likely be violating Standard IV: Duty to Employers if he referred another adviser to Mercer without first giving his partners the option to lower their fees. He would be eliminating a business opportunity for the firm, thus potentially harming his firm and the partners.\nC is incorrect. Incorrect. Ong’s most appropriate response is, “I will need to touch base with my Partners.” Ong has a responsibility to protect the interests of his firm and his partners, according to Standard IV: Duty to Employers. If Ong took the assignment as an individual, he would be potentially harming his firm and his fellow partners. The harm would arise by Ong potentially competing against his firm and thus depriving the firm of his time, skills, and potential source of revenue, because the partners may agree to lower their normal fees to accommodate Mercer. The lower fee could be a loss leader for future projects with the government of the developing country. In particular, if Ong took the assignment as an individual, he would be violating Standard IV(A): Loyalty, which requires charterholders to act for the benefit of their employer (in this case, the employer is Ong’s firm and partners) and not deprive their employer of the advantage of their skills and abilities or otherwise cause harm to their employer. He would also be potentially violating Standard IV(B): Additional Compensation Agreements, which requires charterholders to refuse to accept additional compensation resulting from activity that competes with their employer or might reasonably be expected to create a conflict of interest. Ong would also likely be violating Standard IV: Duty to Employers if he referred another adviser to Mercer without first giving his partners the option to lower their fees. He would be eliminating a business opportunity for the firm, thus potentially harming his firm and the partners.", "ko": "Partner로서 개인적으로 일을 받으면 firm에 해가 될 수 있어 먼저 partner들과 상의해야 한다.", "trap": "다른 adviser 소개·거절보다 '회사에 먼저 확인'이 IV에 맞다.", "f": "", "why": {"B": "Incorrect. Ong’s most appropriate response is, “I will need to touch base with my Partners.” Ong has a responsibility to protect the interests of his firm and his partners, according to Standard IV: Duty to Employers. If Ong took the assignment as an individual, he would be potentially harming his firm and his fellow partners. The harm would arise by Ong potentially competing against his firm and thus depriving the firm of his time, skills, and potential source of revenue, because the partners may agree to lower their normal fees to accommodate Mercer. The lower fee could be a loss leader for future projects with the government of the developing country. In particular, if Ong took the assignment as an individual, he would be violating Standard IV(A): Loyalty, which requires charterholders to act for the benefit of their employer (in this case, the employer is Ong’s firm and partners) and not deprive their employer of the advantage of their skills and abilities or otherwise cause harm to their employer. He would also be potentially violating Standard IV(B): Additional Compensation Agreements, which requires charterholders to refuse to accept additional compensation resulting from activity that competes with their employer or might reasonably be expected to create a conflict of interest. Ong would also likely be violating Standard IV: Duty to Employers if he referred another adviser to Mercer without first giving his partners the option to lower their fees. He would be eliminating a business opportunity for the firm, thus potentially harming his firm and the partners.", "C": "Incorrect. Ong’s most appropriate response is, “I will need to touch base with my Partners.” Ong has a responsibility to protect the interests of his firm and his partners, according to Standard IV: Duty to Employers. If Ong took the assignment as an individual, he would be potentially harming his firm and his fellow partners. The harm would arise by Ong potentially competing against his firm and thus depriving the firm of his time, skills, and potential source of revenue, because the partners may agree to lower their normal fees to accommodate Mercer. The lower fee could be a loss leader for future projects with the government of the developing country. In particular, if Ong took the assignment as an individual, he would be violating Standard IV(A): Loyalty, which requires charterholders to act for the benefit of their employer (in this case, the employer is Ong’s firm and partners) and not deprive their employer of the advantage of their skills and abilities or otherwise cause harm to their employer. He would also be potentially violating Standard IV(B): Additional Compensation Agreements, which requires charterholders to refuse to accept additional compensation resulting from activity that competes with their employer or might reasonably be expected to create a conflict of interest. Ong would also likely be violating Standard IV: Duty to Employers if he referred another adviser to Mercer without first giving his partners the option to lower their fees. He would be eliminating a business opportunity for the firm, thus potentially harming his firm and the partners."}, "orig": "ECO Module 2 Q49"}, {"id": "ECO-M2-Q50", "src": "안 푼 문제", "module": 2, "tag": "I(C) Misrepresentation — reputation claim", "vig": 11, "stem": "In the continued conversation between Mercer and Ong, which sub-standard of Standard I: Professionalism did Ong least likely violate?", "opts": {"A": "Misconduct", "B": "Misrepresentation", "C": "Independence and Objectivity"}, "ans": "B", "en": "B is correct. Correct, because Ong least likely violated Standard I(C): Misrepresentation when stating he had a stellar reputation, since Mercer had previously noted it as one of the reasons why she was talking to him, so it is unlikely he misrepresented himself. Ong, however, did violate Standard I(A): Misconduct by maligning the reputation of Daniel Ngyue on the basis of his speculation about Ngyue’s drinking and a rumor he heard. Members and candidates are not to engage in any professional conduct that reflects adversely on their integrity. He also potentially violated Standard I(B): Independence and Objectivity by stating the influential people he could introduce her to would possibly give her future assignments if they knew they were working together. Ong is trying to influence Mercer’s decision to go with his firm by implying he could possibly increase her potential future income through his contacts rather than appointing the adviser most appropriate for her current assignment.\nA is incorrect. Incorrect, because Ong did most likely violate Standard I(A): Misconduct by maligning the reputation of Daniel Ngyue on the basis of his speculation about Ngyue’s drinking and a rumor he heard. Members and candidates are not to engage in any professional conduct that reflects adversely on their integrity.\nC is incorrect. Incorrect, because Ong most likely violated Standard I(B): Independence and Objectivity by stating the influential people he could introduce her to would possibly give her future assignments if they knew they were working together. Ong is trying to influence Mercer’s decision to go with his firm by implying he could possibly increase her potential future income through his contacts rather than appointing the adviser most appropriate for her current assignment. Members and candidates are not to accept or offer any benefit that could reasonably be expected to compromise their own or other’s independence and objectivity. The introduction to influential people could compromise her independence and objectivity when selecting an adviser to work with her.", "ko": "상대방이 먼저 Ong의 평판을 언급했으니 'stellar reputation' 발언은 misrepresentation 아님. 대신 I(D) Misconduct·I(B)는 위반.", "trap": "'least likely violated' — 상대가 이미 인정한 사실은 과장이 아니다.", "f": "", "why": {"A": "Incorrect, because Ong did most likely violate Standard I(A): Misconduct by maligning the reputation of Daniel Ngyue on the basis of his speculation about Ngyue’s drinking and a rumor he heard. Members and candidates are not to engage in any professional conduct that reflects adversely on their integrity.", "C": "Incorrect, because Ong most likely violated Standard I(B): Independence and Objectivity by stating the influential people he could introduce her to would possibly give her future assignments if they knew they were working together. Ong is trying to influence Mercer’s decision to go with his firm by implying he could possibly increase her potential future income through his contacts rather than appointing the adviser most appropriate for her current assignment. Members and candidates are not to accept or offer any benefit that could reasonably be expected to compromise their own or other’s independence and objectivity. The introduction to influential people could compromise her independence and objectivity when selecting an adviser to work with her."}, "orig": "ECO Module 2 Q50"}, {"id": "ECO-M2-Q51", "src": "안 푼 문제", "module": 2, "tag": "III(A)/IV(A) — investor preference in trading", "vig": 11, "stem": "Which of the following should Ong most likely advise with regard to the regulator’s request?", "opts": {"A": "Ban the “pumping up” of investment prices", "B": "Require material information be made public within 24 hours", "C": "When trading, insist service providers give preference to investors"}, "ans": "C", "en": "C is correct. Correct. Ong should insist service providers give preference to investors when trading. By assuring investor interests are given preference or priority, the regulators would be helping to maintain capital market integrity. This would also comply with Standard IV(A): Loyalty, Prudence, and Care. Standard II(A): Material Nonpublic Information, which prohibits acting or causing others to act on material nonpublic information, and Standard II(B): Market Manipulation, which prohibits practices that distort or artificially inflate trading volumes to mislead market participants, would thus be upheld because both serve to put investors’ interests first.\nA is incorrect. Incorrect, because banning the “pumping up” of investment prices, an information-based manipulation, does not fully ensure protection of investors’ interests. Transaction-based manipulation activities and the trading of material nonpublic information can also harm the interests of investors and the integrity of the capital markets. Standard II(B): Market Manipulation prohibits practices that distort or artificially inflate trading volumes to mislead market participants.\nB is incorrect. Incorrect, because requiring the release of all material information could harm the interests of investors. Not all material information is meant for the public’s knowledge. As such, releasing this type of information, for example, could cause a company to lose its competitive advantage, thus harming investors. Standard II(A): Material Nonpublic Information prohibits acting or causing others to act on material nonpublic information so as to not disadvantage investors who do not have access to the same information.", "ko": "Service provider가 거래할 때 investor 이익을 우선하게 하는 것이 capital market integrity 유지에 맞는 조언.", "trap": "'pumping up 금지'·'24시간 내 공개'는 정답 근거가 약하다.", "f": "", "why": {"A": "Incorrect, because banning the “pumping up” of investment prices, an information-based manipulation, does not fully ensure protection of investors’ interests. Transaction-based manipulation activities and the trading of material nonpublic information can also harm the interests of investors and the integrity of the capital markets. Standard II(B): Market Manipulation prohibits practices that distort or artificially inflate trading volumes to mislead market participants.", "B": "Incorrect, because requiring the release of all material information could harm the interests of investors. Not all material information is meant for the public’s knowledge. As such, releasing this type of information, for example, could cause a company to lose its competitive advantage, thus harming investors. Standard II(A): Material Nonpublic Information prohibits acting or causing others to act on material nonpublic information so as to not disadvantage investors who do not have access to the same information."}, "orig": "ECO Module 2 Q51"}, {"id": "ECO-M2-Q52", "src": "안 푼 문제", "module": 2, "tag": "I(C) + V — key-person risk omission", "vig": 11, "stem": "During the conversation between Ngyue and Mercer, Ngyue revealed he had most likely violated which CFA Institute Standards of Professional Conduct?", "opts": {"A": "Standard I: Professionalism", "B": "Standard V: Investment Analysis, Recommendations, and Actions", "C": "Both Standard I: Professionalism and Standard V: Investment Analysis, Recommendations, and Actions"}, "ans": "C", "en": "C is correct. Correct. It is apparent Ngyue revealed he had violated both Standard I: Professionalism and Standard V: Investment Analysis, Recommendations, and Actions. Specifically, he likely violated Standard I(C): Misrepresentation by making an omission when key-person risk was absent from the fund prospectus. Standard I(C): Misrepresentation requires members and candidates to not knowingly make any misrepresentations relating to investment analysis, recommendations, or actions or other professional activities. Ngyue also violated Standard V(B): Communication with Clients and Prospective Clients in that key-person risk was not initially identified as a significant risk in the prospectus sent to investors. Standard V(B): Communication with Clients and Prospective Clients requires members and candidates to disclose to clients and prospective clients significant limitations and risks associated with the investment process. It appears Ngyue was the only manager, such that another manager needed to be found to replace him while he was recovering from his illness. This type of key-person risk should have been disclosed in the prospectus.\nA is incorrect. Incorrect, because both Standards were violated.\nB is incorrect. Incorrect, because both Standards were violated.", "ko": "Prospectus에서 key-person risk를 빠뜨림 → I(C) Misrepresentation(omission)과 V 모두 위반.", "trap": "Omission도 misrepresentation.", "f": "", "why": {"A": "Incorrect, because both Standards were violated.", "B": "Incorrect, because both Standards were violated."}, "orig": "ECO Module 2 Q52"}, {"id": "ECO-M2-Q53", "src": "안 푼 문제", "module": 2, "tag": "IV(C)/V(A) — no evidence of violation", "vig": 12, "stem": "Based on the information given, are Blevin and/or Chaudry most likely in violation of the Standards regarding their role in Regal’s corporate bond issuance and the subsequent statutory management of Regal Bank?", "opts": {"A": "No.", "B": "Yes, Blevin is likely in violation with regard to Standard IV(C), Responsibilities of Supervisors.", "C": "Yes, both Blevin and Chaudry are likely to be in violation with regard to Standard V(A), Diligence and Reasonable Basis."}, "ans": "A", "en": "A is correct. Correct because here is no evidence to suggest either Blevin and/or Chaudry violated the Standards. Both noted they had not found any suspicious activities, false information, or indications of fraud in their work as the internal auditor or the investor relations officer, despite rigorous undertakings. There are also no indications to imply that either violated their responsibilities as supervisors to make reasonable efforts to detect violations of laws, rules, or regulations.\nB is incorrect. Incorrect because there are no indications to imply that Blevin violated his responsibilities as a supervisor.\nC is incorrect. Incorrect because there is no evidence to suggest either Blevin and/or Chaudry are in violation of the Standards. Both noted they had not found any suspicious activities, false information, or indications of fraud in their work as the internal auditor or the investor relations officer, despite rigorous undertakings.", "ko": "철저히 감사·IR 업무를 했고 의심 활동이 없었다고 했으니 위반 증거 없음.", "trap": "사건이 터졌다고 관련자가 자동으로 위반한 건 아니다.", "f": "", "why": {"B": "Incorrect because there are no indications to imply that Blevin violated his responsibilities as a supervisor.", "C": "Incorrect because there is no evidence to suggest either Blevin and/or Chaudry are in violation of the Standards. Both noted they had not found any suspicious activities, false information, or indications of fraud in their work as the internal auditor or the investor relations officer, despite rigorous undertakings."}, "orig": "ECO Module 2 Q53"}, {"id": "ECO-M2-Q54", "src": "안 푼 문제", "module": 2, "tag": "III(A)/IV(A) — press release before charges", "vig": 12, "stem": "To prevent violating any of the Standards, which statement should Chaudry most likely recommend that the board of directors use for Regal’s press release?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "B is correct. Correct because as a CFA charterholder, Chaudry has the responsibility to be loyal to both her employer (Standard IV(A)) and her employer’s clients (Standard III(A)). Because neither the firm nor the client have been proven guilty or even charged in a court of law at the time of the press release, their names should not be made public and no inference of guilt should be made to avoid possible damage to their reputations and potentially opening the bank to defamation allegations.\nA is incorrect. Incorrect because Chaudry would most likely be in violation of Standard III(A) and Standard IV(A), not having given her loyalty to her employer and the employer’s client for alleged wrongdoings by having named them in the press release.\nC is incorrect. Incorrect because Chaudry would most likely be in violation of Standard III(A) and Standard IV(A), not having given her loyalty to her employer and the employer’s client by inferring guilt of illegal activities.", "ko": "기소·유죄 판결 전이므로 firm과 client 모두에 loyalty를 지키는 Statement 2가 적절.", "trap": "확정되지 않은 혐의를 인정·단정하는 statement는 피한다.", "f": "", "why": {"A": "Incorrect because Chaudry would most likely be in violation of Standard III(A) and Standard IV(A), not having given her loyalty to her employer and the employer’s client for alleged wrongdoings by having named them in the press release.", "C": "Incorrect because Chaudry would most likely be in violation of Standard III(A) and Standard IV(A), not having given her loyalty to her employer and the employer’s client by inferring guilt of illegal activities."}, "orig": "ECO Module 2 Q54"}, {"id": "ECO-M2-Q55", "src": "안 푼 문제", "module": 2, "tag": "I(A) Knowledge of the Law — track new legislation", "vig": 12, "stem": "What action should Blevin most likely take regarding his discovery about Spalding’s anti-money-laundering policies so as to comply with the Standards?", "opts": {"A": "Arrange an annual review of all the firm’s compliance policies", "B": "Set up procedures to obtain timely information regarding any changes in legislation", "C": "Require all client service employees to undergo training regarding the new legislation"}, "ans": "B", "en": "B is correct. Correct because any revisions required by new legislation must be implemented within the time frame given by the government for Spalding to be in compliance with the new laws. Therefore, it is critical that Blevin be made aware of any new legislation to ensure that the firm can implement any required policy changes prior to the law taking effect.\nA is incorrect. Incorrect because if the review is only annual, the firm may not be in compliance if new legislation is implemented before the next review.\nC is incorrect. Incorrect because all employees should undergo training regarding any new legislation to ensure all staff are aware of their legal obligations.", "ko": "새 법 시행 기한 안에 대응하려면 법 변경 정보를 제때 받는 절차를 만드는 것이 핵심.", "trap": "연례 review·교육은 법 변경을 '알게 된 뒤'의 일.", "f": "", "why": {"A": "Incorrect because if the review is only annual, the firm may not be in compliance if new legislation is implemented before the next review.", "C": "Incorrect because all employees should undergo training regarding any new legislation to ensure all staff are aware of their legal obligations."}, "orig": "ECO Module 2 Q55"}, {"id": "ECO-M2-Q56", "src": "풀어볼 문제", "module": 2, "tag": "VI(B) Priority — family accounts as client accounts", "vig": 12, "stem": "Would Blevin’s suggested revisions in Spalding’s conflict of interest policies most likely violate the CFA Institute Standards of Professional Conduct?", "opts": {"A": "No", "B": "Yes, in regard to Policy 1", "C": "Yes, in regard to Policy 2"}, "ans": "C", "en": "C is correct. Correct because not trading for client accounts who have staff members as beneficiaries at the same time as other client accounts would disadvantage those clients and would violate Standard VI(B), Priority of Transactions. Family accounts that are client accounts should be treated like any other firm account and should be neither given special treatment nor disadvantaged because of the family relationship.\nA is incorrect. Incorrect because not trading for client accounts who have staff members as beneficiaries at the same time as other client accounts would disadvantage those clients and would violate Standard VI(B), Priority of Transactions. Family accounts that are client accounts should be treated like any other firm account and should be neither given special treatment nor disadvantaged because of the family relationship.\nB is incorrect. Incorrect because to prevent a violation of Standard VI(B), Priority of Transactions, it is recommended to have strict limits on private placements. A complete prohibition would not violate this Standard.", "ko": "직원이 수익자인 client 계좌를 다른 계좌와 같은 시점에 거래하지 않으면 그 client가 불리해져 VI(B) 위반. Family account도 다른 client와 똑같이 대우.", "trap": "Conflict를 피하려고 family client를 뒤로 미는 것도 위반.", "f": "", "why": {"A": "Incorrect because not trading for client accounts who have staff members as beneficiaries at the same time as other client accounts would disadvantage those clients and would violate Standard VI(B), Priority of Transactions. Family accounts that are client accounts should be treated like any other firm account and should be neither given special treatment nor disadvantaged because of the family relationship.", "B": "Incorrect because to prevent a violation of Standard VI(B), Priority of Transactions, it is recommended to have strict limits on private placements. A complete prohibition would not violate this Standard."}, "orig": "ECO Module 2 Q56"}, {"id": "ECO-M2-Q57", "src": "안 푼 문제", "module": 2, "tag": "IV(A) Loyalty — prospective clients list", "vig": 13, "stem": "Based on the information provided, did Duffy most likely violate any CFA Institute Code of Ethics and Standards of Professional Conduct during her lunch meeting with Kercheval?", "opts": {"A": "No", "B": "Yes, with regards to Standard III, Duties to Clients", "C": "Yes, with regards to Standard IV, Duties to Employers"}, "ans": "A", "en": "A is correct. Correct. Based on the information provided, Duffy has not violated any CFA Institute Code of Ethics and Standards of Professional Conduct during her lunch meeting with Kercheval. Including potential client names in the presentation she shared with Kercheval, several of which are clients of her former employer whom she had frequent contact with, is not a violation. There is no evidence she approached them before leaving DalTex or got their information from a DalTex client list. Standard IV, Duties to Employers, specifically Standard IV(A), Loyalty, states that in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Once an employee has left the firm, the skills and experience an employee obtained while employed are not confidential or privileged information. Similarly, simple knowledge of the names and existence of former clients generally is not considered to be confidential information unless deemed such by a confidentiality agreement or by law. The standard does not prohibit former employees from contacting clients of their previous firm as long as the contact information does not come from the records of the former employer or violate an applicable noncompete agreement. Because there is no evidence Duffy is in possession of client information other than the client’s name, she would also not be in violation of Standard III, Duties to Clients, specifically Standard III(E), Preservation of Confidentiality, which states members and candidates must keep information about current, former, and prospective clients confidential.\nB is incorrect. Incorrect. Duffy has most likely not violated any CFA Institute Code of Ethics and Standards of Professional Conduct during her lunch meeting with Kercheval, including Standard III, Duties to Clients. Because there is no evidence Duffy is in possession of client information other than the client’s name, she would also not be in violation of Standard III, Duties to Clients, specifically Standard III(E), Preservation of Confidentiality, which states members and candidates must keep information about current, former, and prospective clients confidential.\nC is incorrect. Incorrect. Duffy has most likely not violated any CFA Institute Code of Ethics and Standards of Professional Conduct during her lunch meeting with Kercheval, including Standard IV, Duties to Employers. There is no evidence she approached them before leaving DalTex or got their information from a DalTex client list. Standard IV, Duties to Employers, specifically Standard IV(A), Loyalty, states that in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Once an employee has left the firm, the skills and experience an employee obtained while employed are not confidential or privileged information. Similarly, simple knowledge of the names and existence of former clients generally is not considered to be confidential information unless deemed such by a confidentiality agreement or by law. The standard does not prohibit former employees from contacting clients of their previous firm as long as the contact information does not come from the records of the former employer or violate an applicable noncompete agreement.", "ko": "이직 전 새 회사 프레젠테이션에 potential client 이름을 넣은 것은 위반 아님(경쟁 준비 자체는 허용, 기록을 가져가지 않았음).", "trap": "이직 준비 ≠ 위반. 기록 반출·근무 중 고객 유치가 위반.", "f": "", "why": {"B": "Incorrect. Duffy has most likely not violated any CFA Institute Code of Ethics and Standards of Professional Conduct during her lunch meeting with Kercheval, including Standard III, Duties to Clients. Because there is no evidence Duffy is in possession of client information other than the client’s name, she would also not be in violation of Standard III, Duties to Clients, specifically Standard III(E), Preservation of Confidentiality, which states members and candidates must keep information about current, former, and prospective clients confidential.", "C": "Incorrect. Duffy has most likely not violated any CFA Institute Code of Ethics and Standards of Professional Conduct during her lunch meeting with Kercheval, including Standard IV, Duties to Employers. There is no evidence she approached them before leaving DalTex or got their information from a DalTex client list. Standard IV, Duties to Employers, specifically Standard IV(A), Loyalty, states that in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Once an employee has left the firm, the skills and experience an employee obtained while employed are not confidential or privileged information. Similarly, simple knowledge of the names and existence of former clients generally is not considered to be confidential information unless deemed such by a confidentiality agreement or by law. The standard does not prohibit former employees from contacting clients of their previous firm as long as the contact information does not come from the records of the former employer or violate an applicable noncompete agreement."}, "orig": "ECO Module 2 Q57"}, {"id": "ECO-M2-Q58", "src": "안 푼 문제", "module": 2, "tag": "IV(A) Loyalty — referring client to former colleague", "vig": 13, "stem": "Regarding her conversation with DalTex’s client, which option should Kercheval most likely choose to prevent violating CFA Institute Code of Ethics and Standards of Professional Conduct?", "opts": {"A": "Option 1", "B": "Option 2", "C": "Option 3"}, "ans": "C", "en": "C is correct. Correct. Option 3, “Give the client the name of Duffy’s new firm,” most likely will prevent Kercheval from violating CFA Institute Code of Ethics and Standards of Professional Conduct. This action allows her to place the responsibility of the client talking with Duffy in the hands of the client. Option 1, “Call Duffy and give her a recount of the conversation,” and Option 2, “Do nothing until she joins Victory then pass on the card to Duffy,” potentially could result in Kercheval violating CFA Institute Code of Ethics and Standards of Professional Conduct. A conflict exists between Kercheval’s duties to her current employer and her duties to her client. Option 1 presents a conflict with Standard IV(A), Loyalty. Standard IV(A) states in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Passing the information along to Duffy potentially could harm her current employer if the client were to move their assets to Duffy’s new firm. Option 2 presents a conflict with Standard III(A), Loyalty, Prudence, and Care. Standard III(A) states CFA Institute members and CFA candidates must act for the benefit of their clients and place their clients’ interest before their employer’s or their own interests. Therefore, her first duty is to her client. Doing nothing until she joined Victory would conflict with her duty to her client who asked her to pass along the information. Therefore, Option 3 is her best course of action.\nA is incorrect. Incorrect. Option 1 would not prevent Kercheval from violating CFA Institute Code of Ethics and Standards of Professional Conduct. Option 1 presents a conflict with Standard IV(A), Loyalty. Standard IV(A) states in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Passing the information along to Duffy potentially could harm her current employer if the client were to move their assets to Duffy’s new firm.\nB is incorrect. Incorrect. Option 2 would not prevent Kercheval from violating CFA Institute Code of Ethics and Standards of Professional Conduct. Option 2 presents a conflict with Standard III(A), Loyalty, Prudence, and Care. Standard III(A) states CFA Institute members and CFA candidates must act for the benefit of their clients and place their clients’ interest before their employer’s or their own interests. Therefore, her first duty is to her client. Doing nothing until she joined Victory would conflict with her duty to her client who asked her to pass along the information. Therefore, Option 3 is her best course of action.", "ko": "Client에게 Duffy 새 회사 이름만 알려 주고 선택은 client에게 맡기는 Option 3이 적절.", "trap": "Employer client를 직접 넘기면 IV(A) 위반.", "f": "", "why": {"A": "Incorrect. Option 1 would not prevent Kercheval from violating CFA Institute Code of Ethics and Standards of Professional Conduct. Option 1 presents a conflict with Standard IV(A), Loyalty. Standard IV(A) states in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Passing the information along to Duffy potentially could harm her current employer if the client were to move their assets to Duffy’s new firm.", "B": "Incorrect. Option 2 would not prevent Kercheval from violating CFA Institute Code of Ethics and Standards of Professional Conduct. Option 2 presents a conflict with Standard III(A), Loyalty, Prudence, and Care. Standard III(A) states CFA Institute members and CFA candidates must act for the benefit of their clients and place their clients’ interest before their employer’s or their own interests. Therefore, her first duty is to her client. Doing nothing until she joined Victory would conflict with her duty to her client who asked her to pass along the information. Therefore, Option 3 is her best course of action."}, "orig": "ECO Module 2 Q58"}, {"id": "ECO-M2-Q59", "src": "안 푼 문제", "module": 2, "tag": "IV(A) + I(B) — commentary for former colleague", "vig": 13, "stem": "Which CFA Institute Code of Ethics and Standards of Professional Conduct has Tilton most likely violated?", "opts": {"A": "Standard IV(A), Loyalty", "B": "Standard I(B), Independence and Objectivity", "C": "Both Standard IV(A), Loyalty, and Standard I(B), Independence and Objectivity"}, "ans": "C", "en": "C is correct. Correct. Tilton has violated both Standard IV(A), Loyalty, and Standard I(B), Independence and Objectivity. She has violated Standard IV(A), Loyalty, by agreeing to a mutually beneficial arrangement to provide Duffy with a daily commentary about how she is navigating the market for her clients and the firm with the idea that she will be able to join the firm at some later date and become a potential equity owner. Standards IV(A) states that in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Her agreement with Duffy conflicts with the requirements of Standard IV. She is not acting for the sole benefit of her employer, and although she has not deprived them of the advantage of her skills and abilities, she is causing them harm by giving the information she uses in making her decision to another firm. She is also in violation of Standard I(B), Independence and Objectivity, which states that CFA Institute members and CFA candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. She is offering her current employer’s proprietary commentary in the idea that she will be able to join DalTex and become an equity owner. Tilton has most likely violated other CFA Institute Code of Ethics and Standards of Professional Conduct, including but into limited to Standard III, Duties to Clients.\nA is incorrect. Incorrect. Tilton has violated Standard IV, Loyalty, by agreeing to a mutually beneficial arrangement to provide Duffy with a daily commentary about how she is navigating the market for her clients and the firm with the idea that she will be able to join the firm at some later date and become a potential equity owner. Standards IV(A) states that in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Her agreement with Duffy conflicts with the requirements of Standard IV. She is not acting for the sole benefit of her employer, and although she has not deprived them of the advantage of her skills and abilities, she is causing them harm by giving the information she uses in making her decision to another firm.\nB is incorrect. Incorrect. Tilton has violated Standard I(B), Independence and Objectivity, which states that CFA Institute members and CFA candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. She is offering her current employer’s proprietary commentary in the idea that she will be able to join DalTex and become an equity owner.", "ko": "Duffy에게 매일 commentary를 주는 상호 이익 약정 → IV(A) Loyalty와 I(B) Independence 모두 위반.", "trap": "한쪽만 고르면 틀림.", "f": "", "why": {"A": "Incorrect. Tilton has violated Standard IV, Loyalty, by agreeing to a mutually beneficial arrangement to provide Duffy with a daily commentary about how she is navigating the market for her clients and the firm with the idea that she will be able to join the firm at some later date and become a potential equity owner. Standards IV(A) states that in matters related to their employment, CFA Institute members and CFA candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Her agreement with Duffy conflicts with the requirements of Standard IV. She is not acting for the sole benefit of her employer, and although she has not deprived them of the advantage of her skills and abilities, she is causing them harm by giving the information she uses in making her decision to another firm.", "B": "Incorrect. Tilton has violated Standard I(B), Independence and Objectivity, which states that CFA Institute members and CFA candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. She is offering her current employer’s proprietary commentary in the idea that she will be able to join DalTex and become an equity owner."}, "orig": "ECO Module 2 Q59"}, {"id": "ECO-M2-Q60", "src": "풀어볼 문제", "module": 2, "tag": "IV(B) Additional Compensation — consent must be from employer", "vig": 13, "stem": "Which recommendation with regards to Tilton’s agreement is most likely insufficient to prevent a violation of CFA Institute Code of Ethics and Standards of Professional Conduct?", "opts": {"A": "Recommendation 1", "B": "Recommendation 2", "C": "Recommendation 3"}, "ans": "B", "en": "B is correct. Correct. With regards to Tilton’s agreement with her previous employer, Recommendation 2, “You and your former employer need to sign the agreement,” is insufficient to prevent a violation of Standard IV(B), Additional Compensation. Standard IV(B) states that CFA Institute members and CFA candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved. Duffy addresses the requirement for written consent in Recommendation 2, but it is incomplete. To be in compliance, Duffy should also sign the agreement, not just Tilton and her former employer. Recommendation 1, “You need to draft an agreement outlining what you’re doing and how much they are paying you over the next year,” does meet recommended procedures for compliance with Standard IV(B). The written agreement should state the terms, which include the nature of the compensation, the approximate amount of compensation, and the duration of the agreement. Tilton’s agreement creates two different conflicts of interest. One with Duffy’s clients and potential clients and one between Tilton and her new employer. The conflict of interest the agreement creates with Duffy’s clients is covered under Standard VI(A), Disclosure of Conflicts. Duffy addresses the requirements under Standard VI(A) in Recommendation 3, “We will also need to send notification to all our clients and potential clients disclosing the agreement.” Standard VI(A) states that members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. The second conflict of interest created by Tilton’s agreement is under Standard IV(B) and was addressed when Tilton disclosed the conflict to Duffy.\nA is incorrect. Incorrect. Recommendation 1, “You need to draft an agreement outlining what you’re doing and how much they are paying you over the next year,” is necessary to address Tilton’s agreement with her previous employer. The written agreement should state the terms, which include the nature of the compensation, the approximate amount of compensation, and the duration of the agreement. Tilton’s agreement creates two different conflicts of interest. One with Duffy’s clients and potential clients and one between Tilton and her new employer.\nC is incorrect. Incorrect. Recommendation 3, “We will also need to send notification to all our clients and potential clients disclosing the agreement,” is necessary to address Tilton’s agreement with her previous employer. Standard VI(A) states that members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. The second conflict of interest created by Tilton’s agreement is under Standard IV(B) and was addressed when Tilton disclosed the conflict to Duffy.", "ko": "Tilton과 전 employer가 서명하는 것만으로는 부족. 현재 employer의 written consent가 필요.", "trap": "서명 당사자가 'current employer'인지 확인.", "f": "", "why": {"A": "Incorrect. Recommendation 1, “You need to draft an agreement outlining what you’re doing and how much they are paying you over the next year,” is necessary to address Tilton’s agreement with her previous employer. The written agreement should state the terms, which include the nature of the compensation, the approximate amount of compensation, and the duration of the agreement. Tilton’s agreement creates two different conflicts of interest. One with Duffy’s clients and potential clients and one between Tilton and her new employer.", "C": "Incorrect. Recommendation 3, “We will also need to send notification to all our clients and potential clients disclosing the agreement,” is necessary to address Tilton’s agreement with her previous employer. Standard VI(A) states that members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. The second conflict of interest created by Tilton’s agreement is under Standard IV(B) and was addressed when Tilton disclosed the conflict to Duffy."}, "orig": "ECO Module 2 Q60"}, {"id": "ECO-M2-Q61", "src": "안 푼 문제", "module": 2, "tag": "I(A)/IV(C) — regulators can't require Code", "vig": 14, "stem": "Is the comment regarding the requirement for all licensees that Novak overheard while waiting in line at the coffee shop most likely correct?", "opts": {"A": "No.", "B": "Yes, with regards to Standard I(A), Knowledge of Law.", "C": "Yes, with regards to Standard IV(C), Responsibilities of Supervisors."}, "ans": "A", "en": "A is correct. Correct. The comment “We would not have this case on our hands now if we had included an industry standard in our new regulations requiring all licensees to abide by the CFA Code of Ethics and Standards of Professional Conduct,” is not correct with regards to Standard I(A), Knowledge of Law, or Standard IV(C), Responsibilities of Supervisors. Although Standard I(A), Knowledge of Law, requires CFA Institute members and CFA candidates to uphold all laws, rules, regulations, and the CFA Code and Standards, members and candidates are not required to have detailed knowledge of or be experts on all the laws that could potentially govern their activities. As a result, it is unlikely to prevent 100% of all illegal activity or unethical behavior by staff, although the implementation of the Code and Standards should increase compliance. Likewise, abiding by Standard IV(C), Responsibilities of Supervisors, which requires members and candidates to make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rule, regulations, and the Code and Standards, will not ensure 100% compliance, particularly when regulations and operating environments are changing.\nB is incorrect. Incorrect. Standard I(A), Knowledge of Law, requires CFA Institute members and CFA candidates to uphold all laws, rules, regulations, and the CFA Code and Standards, members and candidates are not required to have detailed knowledge of or be experts on all the laws that could potentially govern their activities. As a result, it is unlikely to prevent 100% of all illegal activity or unethical behavior by staff, although the implementation of the Code and Standards should increase compliance.\nC is incorrect. Incorrect. Standard IV(C), Responsibilities of Supervisors, which requires members and candidates to make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rule, regulations, and the Code and Standards, will not ensure 100% compliance, particularly when regulations and operating environments are changing.", "ko": "Licensee 전원이 CFA Code를 지키도록 규제에 넣었다면 막을 수 있었다는 말은 틀림.", "trap": "Code 준수는 법적 의무가 아니라 member·candidate의 의무.", "f": "", "why": {"B": "Incorrect. Standard I(A), Knowledge of Law, requires CFA Institute members and CFA candidates to uphold all laws, rules, regulations, and the CFA Code and Standards, members and candidates are not required to have detailed knowledge of or be experts on all the laws that could potentially govern their activities. As a result, it is unlikely to prevent 100% of all illegal activity or unethical behavior by staff, although the implementation of the Code and Standards should increase compliance.", "C": "Incorrect. Standard IV(C), Responsibilities of Supervisors, which requires members and candidates to make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rule, regulations, and the Code and Standards, will not ensure 100% compliance, particularly when regulations and operating environments are changing."}, "orig": "ECO Module 2 Q61"}, {"id": "ECO-M2-Q62", "src": "풀어볼 문제", "module": 2, "tag": "III(E) Confidentiality — public sanction vs investigation name", "vig": 14, "stem": "After Novak and the two regulators found a table, who most likely violated CFA Standards of Professional Conduct?", "opts": {"A": "Kovi", "B": "Merin", "C": "Novak"}, "ans": "A", "en": "A is correct. Correct. Kovi violated Standard III(E), Preservation of Confidentiality, by citing the name of the individual currently under the regulator’s investigation. Mentioning Jovic’s previous CFA sanction, however, does not violate the standard in that this is public information. Standard III(E) requires CFA Institute members and CFA candidates to keep information about current, former, and prospective clients confidential. This standard is applicable because the regulators regard its licensees as clients. The ethical behavior of Jovic is still under investigation, so his name should not have been revealed by Kovi. Neither Merin or Novak violated the CFA Standards of Professional Conduct. Novak speaking about ethics and the implementation of the Standards is not a violation. Merin mentioned only that the regulator checks the CFA Institute website to see if anyone in their jurisdiction had been sanctioned for improper behaviors. None of these activities of Novak and Merin violate any standards.\nB is incorrect. Incorrect. Merin does not violate any CFA Standards when stating, “We regularly check the CFA Institute website to see if anyone in our jurisdiction has been sanctioned for improper behaviors. Those individuals are subject to greater scrutiny because of their past misbehaviors.” He has not divulged any confidential information.\nC is incorrect. Incorrect. Novak does not violate any CFA Standards by discussing her love of ethics and enquiring about the implementation of CFA Standards of Professional Conduct as an industry standard.", "ko": "조사 중인 개인 이름을 말한 Kovi는 III(E) 위반. 과거 CFA sanction은 public 정보라 언급해도 위반 아님.", "trap": "공개 정보와 비공개 조사 정보를 구분.", "f": "", "why": {"B": "Incorrect. Merin does not violate any CFA Standards when stating, “We regularly check the CFA Institute website to see if anyone in our jurisdiction has been sanctioned for improper behaviors. Those individuals are subject to greater scrutiny because of their past misbehaviors.” He has not divulged any confidential information.", "C": "Incorrect. Novak does not violate any CFA Standards by discussing her love of ethics and enquiring about the implementation of CFA Standards of Professional Conduct as an industry standard."}, "orig": "ECO Module 2 Q62"}, {"id": "ECO-M2-Q63", "src": "안 푼 문제", "module": 2, "tag": "III(A) Loyalty — fees on deposits", "vig": 14, "stem": "To avoid violating CFA Standards of Professional Conduct, which of the following actions is most appropriate for the adviser to address client complaints regarding bank deposits?", "opts": {"A": "Review the client agreement with his largest clients", "B": "Remove the deposits from future performance presentations", "C": "Reimburse past fees charged on deposits and stop future management fees"}, "ans": "C", "en": "C is correct. Correct. To avoid violating CFA Standards of Professional Conduct, reimbursing past fees charged on deposits and stopping future fees would be the adviser’s most appropriate action. As a CFA® charterholder, the adviser has the responsibility to put the interests of his clients before his own or his firm’s as per Standard III(A), Loyalty, Prudence, and Care. By charging fees on assets that are not manageable (i.e., are not available to redeem or restructure into assets earning higher returns) and that may no longer meet the clients’ mandates, he is currently not acting for the benefits of his clients. Although the frozen deposits are not in his control, he could lessen the damage by reimbursing past fees charged and removing these assets from being charged any future fees. Even if the client agreements are legally correct, the adviser would still be in violation of Standard III(A), Loyalty, Prudence, and Care, by not protecting his clients’ interests above his or his firms. By removing the frozen fixed assets from the performance presentation, the adviser would be violating Standard III(D), Performance Presentation, which requires CFA Institute members and CFA candidates to make reasonable efforts to ensure that it is fair, accurate, and complete. These assets still are part of the clients’ portfolio and thus should be included in the performance presentations despite their lower-than-market returns dragging down performance.\nA is incorrect. Incorrect. Although the client agreement may be legally correct, charging asset management fees on assets that cannot be effectively managed nor meet client mandates and are earning below market interest rates does not put the interests of the client ahead of the adviser or his firm. Standard III(A), Loyalty, Prudence, and Care, states that CFA Institute members and CFA candidates have a duty of loyalty to their clients and must place their clients’ interests before their employer’s or their own interests.\nB is incorrect. Incorrect. By removing the frozen fixed assets from the performance presentation, the adviser would be violating Standard III(D), Performance Presentation, which requires CFA Institute members and CFA candidates to make reasonable efforts to ensure that it is fair, accurate, and complete. Removing the value of the assets would distort the accuracy of the portfolio valuation and the allocation of asset types.", "ko": "예금에 management fee를 받은 것을 바로잡으려면 과거 fee 환급·향후 fee 중단이 적절.", "trap": "Performance presentation에서 빼는 건 근본 해결이 아니다.", "f": "", "why": {"A": "Incorrect. Although the client agreement may be legally correct, charging asset management fees on assets that cannot be effectively managed nor meet client mandates and are earning below market interest rates does not put the interests of the client ahead of the adviser or his firm. Standard III(A), Loyalty, Prudence, and Care, states that CFA Institute members and CFA candidates have a duty of loyalty to their clients and must place their clients’ interests before their employer’s or their own interests.", "B": "Incorrect. By removing the frozen fixed assets from the performance presentation, the adviser would be violating Standard III(D), Performance Presentation, which requires CFA Institute members and CFA candidates to make reasonable efforts to ensure that it is fair, accurate, and complete. Removing the value of the assets would distort the accuracy of the portfolio valuation and the allocation of asset types."}, "orig": "ECO Module 2 Q63"}, {"id": "ECO-M2-Q64", "src": "안 푼 문제", "module": 2, "tag": "IV(C) Supervisors — independent compliance consultant", "vig": 14, "stem": "Which proposed sanction against the adviser most likely complies with CFA Standards of Professional Conduct?", "opts": {"A": "Sanction 1", "B": "Sanction 2", "C": "Sanction 3"}, "ans": "B", "en": "B is correct. Correct. Sanction 2, Require the adviser to hire an Independent Compliance Consultant to undertake an assessment, and recommend processes and procedures to prevent and detect violations, most likely complies with CFA Standards of Professional Conduct. Standard IV(C), Responsibilities of Supervisors, requires CFA Institute members and CFA candidates to make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rules, regulations, and the Code and Standards. If the regulator finds the systems and processes of supervision are insufficient at the adviser’s firm, they have the responsibility to appoint an independent compliance officer until such time the firm has implemented corrective action to prevent and detect ethical and legal violations in the future. Paying into an Investor Protection Fund is not sufficient to prevent and detect future violations of applicable laws, rules, regulations, and the Code and Standards as required by Standard IV(C), Responsibilities of Supervisors. The adviser, as the owner of the firm, would be responsible for implementing supervisory processes and procedures to comply with the CFA Code and Standards. The training program would need to be implemented and carried out at least annually or when any new regulations are introduced.\nA is incorrect. Incorrect. Although the adviser’s clients possibly could benefit from him paying into an Investor Protection Fund so claims could be made to recover their losses, it is not sufficient to prevent and detect future violations of applicable laws, rules, regulations, and the Code and Standards as required by Standard IV(C), Responsibilities of Supervisors. The adviser, as the owner of the firm, would be responsible for implementing supervisory processes and procedures to comply with the CFA Code and Standards.\nC is incorrect. Incorrect. Although designing a formal Code and Standard training program for existing staff and any new hires is necessary, it is not enough in itself. To comply with Standard IV(C), Responsibilities of Supervisors, the training program would need to be implemented and be carried out at least annually or when any new regulations are introduced. Training also should be considered if and when the firm introduces any new procedures and products or services to encourage compliance.", "ko": "Independent compliance consultant를 고용해 위반 예방·발견 절차를 만들게 하는 Sanction 2가 IV(C)에 맞다.", "trap": "처벌보다 '예방·발견 시스템'이 IV(C)의 핵심.", "f": "", "why": {"A": "Incorrect. Although the adviser’s clients possibly could benefit from him paying into an Investor Protection Fund so claims could be made to recover their losses, it is not sufficient to prevent and detect future violations of applicable laws, rules, regulations, and the Code and Standards as required by Standard IV(C), Responsibilities of Supervisors. The adviser, as the owner of the firm, would be responsible for implementing supervisory processes and procedures to comply with the CFA Code and Standards.", "C": "Incorrect. Although designing a formal Code and Standard training program for existing staff and any new hires is necessary, it is not enough in itself. To comply with Standard IV(C), Responsibilities of Supervisors, the training program would need to be implemented and be carried out at least annually or when any new regulations are introduced. Training also should be considered if and when the firm introduces any new procedures and products or services to encourage compliance."}, "orig": "ECO Module 2 Q64"}, {"id": "ECO-M2-Q65", "src": "안 푼 문제", "module": 2, "tag": "I(A) Knowledge of the Law — cross-border pension rules", "vig": 15, "stem": "What should Mehta’s next step most likely be to avoid violating the CFA Institute Standards of Professional Conduct?", "opts": {"A": "Limit his research to India.", "B": "Consult with a legal specialist.", "C": "Replicate the multinational firm’s pension plan."}, "ans": "B", "en": "B is correct. Correct. To avoid violating Standard I(A): Knowledge of the Law, Mehta should consult with legal specialists who understand the pension regulations in both Singapore and India. He has recognized he needs help after his initial desktop research. If he limited his desktop research to India, he would likely be violating Standard I(A): Knowledge of the Law in that he would not take into consideration Singaporean regulations. Even if it was eventually determined India did have tougher regulations, Singaporean regulations would still need to be followed by those employees based in Singapore. Standard I(A): Knowledge of the Law requires Members and Candidates to understand and comply with all applicable laws, rules, and regulations (including the CFA Institute Code of Ethics and Standards of Professional Conduct) of any government, regulatory organization, licensing agency, or professional association governing their professional activities and not knowingly assist others in violating any laws, rules, and regulations. In addition, to avoid violating Standard V(A): Diligence and Reasonable Basis, Mehta would likely need to undertake extensive due diligence. The initial research undertaken was likely not sufficient or diligent enough to fully understand the various rules and regulations in both countries. Moreover, if Mehta were to make a recommendation based on his c

<!DOCTYPE html>
<html lang="ko">

<title>Ethics Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.pill.src-try{background:var(--cobalt);color:#fff}
.pill.src-flag{background:var(--bad-soft);color:var(--bad)}
.btn.flag{padding:3px 10px;font-size:13px;margin-left:auto}
.btn.flag.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.catbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q4", "src": "ECO 오답", "module": 1, "tag": "V(B) Communication — disclose changes to investment process", "vig": null, "stem": "Which of the following statements best describes an aspect of the Standards of Professional Conduct? Members and candidates are required to:", "opts": {"A": "ensure a portfolio mandate is suitable for all investors.", "B": "promptly disclose changes that might materially affect investment processes.", "C": "have a reasonable and adequate basis for decisions about client confidentiality."}, "ans": "B", "en": "B is correct. The Standards of Professional Conduct require members and candidates to promptly disclose any changes that might materially affect investment processes.\nA is incorrect because under Standard III(C) Suitability, when members and candidates are responsible for managing a portfolio according to a specific mandate, they must take only investment actions that are consistent with the stated objectives of the portfolio and not be concerned with whether the mandate is suitable for all investors.\nC is incorrect because under Standard III(E) Preservation of Confidentiality, members and candidates must keep information about current clients confidential unless the information concerns illegal activities on the part of the client, disclosure is required by law, or the client permits disclosure. No decisions on confidentiality are required, with the “reasonable and adequate basis” criterion related to Standard V(A) Diligence and Reasonable Basis.", "ko": "Standards는 investment process에 중요한 영향을 줄 수 있는 변경을 promptly disclose하라고 요구한다.", "trap": "'reasonable and adequate basis'는 V(A) Diligence 기준이지 confidentiality 판단 기준이 아니다. Mandate는 모든 투자자에게 맞을 필요 없다.", "f": "", "why": {"A": "A is incorrect because under Standard III(C) Suitability, when members and candidates are responsible for managing a portfolio according to a specific mandate, they must take only investment actions that are consistent with the stated objectives of the portfolio and not be concerned with whether the mandate is suitable for all investors.", "C": "C is incorrect because under Standard III(E) Preservation of Confidentiality, members and candidates must keep information about current clients confidential unless the information concerns illegal activities on the part of the client, disclosure is required by law, or the client permits disclosure. No decisions on confidentiality are required, with the “reasonable and adequate basis” criterion related to Standard V(A) Diligence and Reasonable Basis."}, "orig": "ECO Module 1 Q4"}, {"id": "ECO-M1-Q8", "src": "ECO 오답", "module": 1, "tag": "IV(A) Loyalty — skills and abilities", "vig": null, "stem": "Standard IV: Duties to Employers states that members and candidates must not:", "opts": {"A": "accept any gifts that might compromise their independence and objectivity.", "B": "deprive their employer of their skills and abilities as related to their employment.", "C": "accept compensation competing with their employer’s interest without the written consent of their employer only."}, "ans": "B", "en": "B is correct. Standard IV(A) Loyalty states that members and candidates cannot deprive their employer of the advantage of their skills and abilities in matters related to their employment.\nA is incorrect because accepting gifts that might compromise a member’s or candidate’s independence and objectivity is addressed by Standard I: Professionalism, not Standard IV: Duties to Employers.\nC is incorrect because Standard IV(B) Additional Compensation Arrangements permits members and candidates to accept compensation that competes with their employer’s interest if they obtain written consent from all parties involved.", "ko": "IV(A) Loyalty: 업무와 관련해 employer에게서 자기 skills and abilities의 이점을 빼앗으면 안 된다.", "trap": "Gift 수용은 I(B) Independence and Objectivity. Additional compensation은 employer만이 아니라 'all parties' 서면 동의(IV(B)).", "f": "", "why": {"A": "A is incorrect because accepting gifts that might compromise a member’s or candidate’s independence and objectivity is addressed by Standard I: Professionalism, not Standard IV: Duties to Employers.", "C": "C is incorrect because Standard IV(B) Additional Compensation Arrangements permits members and candidates to accept compensation that competes with their employer’s interest if they obtain written consent from all parties involved."}, "orig": "ECO Module 1 Q8"}, {"id": "ECO-M1-Q11", "src": "ECO 오답", "module": 1, "tag": "I(A) Knowledge of the Law — stricter of law vs Code", "vig": null, "stem": "Jean Dirac, CFA, resides in country MS, where securities laws are more strict than the Code and Standards. Dirac does business with Charles Pauli in country LS, where securities laws are less strict than the Code and Standards. Pauli is a citizen of country LS. The law of country MS applies to their business, but country MS's law states that the client's home country law governs.\nDirac must adhere to the:", "opts": {"A": "laws of country LS.", "B": "laws of country MS.", "C": "Code and Standards."}, "ans": "C", "en": "C is correct. Correct because the client's home country is country LS, whose law governs Dirac's business, and its law is less strict than the Code and Standards. If applicable law is stricter than the requirements of the Code and Standards, members and candidates must adhere to applicable law; otherwise, they must adhere to the Code and Standards. Therefore, Dirac must adhere to the Code and Standards.\nA is incorrect. Incorrect because country MS's law states that the law of the client's home country governs, which is country LS. But since country LS's law is less strict than the Code and Standards, Dirac must adhere to the Code and Standards.\nB is incorrect. Incorrect because country MS's law states that the law of the client's home country governs, which is country LS. Since country LS's law is less strict than the Code and Standards, Dirac must adhere to the Code and Standards.", "ko": "적용되는 법이 client 본국(LS) 법이고 Code보다 느슨하다 → 더 엄격한 Code and Standards를 따른다.", "trap": "거주국(MS) 법이 엄격하다고 MS 법을 고르면 함정. 실제 적용 법을 먼저 찾고, 그 법과 Code 중 더 엄격한 쪽.", "f": "", "why": {"A": "Incorrect because country MS's law states that the law of the client's home country governs, which is country LS. But since country LS's law is less strict than the Code and Standards, Dirac must adhere to the Code and Standards.", "B": "Incorrect because country MS's law states that the law of the client's home country governs, which is country LS. Since country LS's law is less strict than the Code and Standards, Dirac must adhere to the Code and Standards."}, "orig": "ECO Module 1 Q11"}, {"id": "ECO-M1-Q14", "src": "ECO 오답", "module": 1, "tag": "I(B) Independence — manager pressure on rating", "vig": null, "stem": "Jacquie Clemens, CFA, is a securities analyst. Her manager, Samuel Kerouac, currently has a \"buy\" recommendation on Atlas Semiconductors. Kerouac asks Clemens to take over coverage of Atlas, instructing Clemens that under no circumstances should she change the existing buy recommendation. Clemens believes her manager's instructions have compromised her ability to cover Atlas objectively.\nThe action for Clemens that would be most consistent with the Standards is:", "opts": {"A": "telling her manager she cannot cover the company under these constraints.", "B": "escalating her concerns to other supervisors in the firm before performing her own analysis.", "C": "perform her own independent, unbiased analysis and issue her opinion without considering her manager's recommendation."}, "ans": "A", "en": "A is correct. Correct because, according to Standard I(B), Independence and Objectivity, if she believes that her boss’s instructions have compromised her, she has two options: She can tell her boss that she cannot cover the company under these constraints, or she can take over coverage of the company, reach her own independent conclusions, and if they conflict with her boss’s opinion, share the conclusions with her boss or other supervisors in the firm so that they can make appropriate recommendations.\nB is incorrect. Incorrect because If she believes that her boss’s instructions have compromised her, she has two options: She can tell her boss that she cannot cover the company under these constraints, or she can take over coverage of the company, reach her own independent conclusions, and if they conflict with her boss’s opinion, share the conclusions with her boss or other supervisors in the firm so that they can make appropriate recommendations.\nC is incorrect. Incorrect because Clemens should tell her boss that she cannot cover the company under these constraints, or take over coverage of the company, reach her own independent conclusions, and if they conflict with her boss’s opinion, share the conclusions with her boss or other supervisors in the firm so that they can make appropriate recommendations. Clemens must act in accordance with Standard IV(A), Loyalty, which requires members to act for the benefit of their employers. Ignoring her manager's instruction may cause harm to her employer.", "ko": "상사가 rating을 바꾸지 말라고 하면: ① 이 조건에서는 cover할 수 없다고 말하거나 ② 독립 분석 후 결론이 다르면 상사·supervisor와 공유. 보기 중 ①이 정답.", "trap": "분석 전에 먼저 다른 supervisor에게 escalate하는 건 요구 사항이 아니다. 상사 의견을 무시하고 바로 발행하는 것도 아님.", "f": "", "why": {"B": "Incorrect because If she believes that her boss’s instructions have compromised her, she has two options: She can tell her boss that she cannot cover the company under these constraints, or she can take over coverage of the company, reach her own independent conclusions, and if they conflict with her boss’s opinion, share the conclusions with her boss or other supervisors in the firm so that they can make appropriate recommendations.", "C": "Incorrect because Clemens should tell her boss that she cannot cover the company under these constraints, or take over coverage of the company, reach her own independent conclusions, and if they conflict with her boss’s opinion, share the conclusions with her boss or other supervisors in the firm so that they can make appropriate recommendations. Clemens must act in accordance with Standard IV(A), Loyalty, which requires members to act for the benefit of their employers. Ignoring her manager's instruction may cause harm to her employer."}, "orig": "ECO Module 1 Q14"}, {"id": "ECO-M1-Q19", "src": "ECO 오답", "module": 1, "tag": "IV(B) Additional Compensation — written consent from all parties", "vig": null, "stem": "Ralph Schmidt, CFA, is an equity analyst at TriAlpha Securities. Schmidt intends to work several hours on weekends to supplement his income, providing equity analysis consulting services to a client of TriAlpha.\nTo comply with the Standard relating to additional compensation arrangements, Schmidt must:", "opts": {"A": "provide written notice only to TriAlpha before entering into a consulting arrangement with the client.", "B": "obtain written consent only from TriAlpha before entering into a consulting arrangement with the client.", "C": "obtain written consent from both TriAlpha and the client before entering into a consulting arrangement with the client."}, "ans": "C", "en": "C is correct. Correct because Standard IV(B), Additional Compensation Arrangements, states that members must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved.\nSince Schmidt's paid consulting arrangement with TriAlpha's client will likely create a conflict of interest with TriAlpha's interest, Schmidt must obtain consent from all parties involved.\nA is incorrect. Incorrect because there is a likely conflict of interest with TriAlpha's interest in this case, therefore Schmidt must obtain written consent from all parties involved.\nB is incorrect. Incorrect because there is a likely conflict of interest with TriAlpha's interest in this case, therefore Schmidt must obtain written consent from all parties involved.", "ko": "Employer와 경쟁하거나 conflict가 생길 수 있는 보상은 all parties(employer와 client 모두)의 written consent가 필요.", "trap": "'employer 서면 동의만'이 가장 흔한 함정. 여기서는 client도 당사자다.", "f": "", "why": {"A": "Incorrect because there is a likely conflict of interest with TriAlpha's interest in this case, therefore Schmidt must obtain written consent from all parties involved.", "B": "Incorrect because there is a likely conflict of interest with TriAlpha's interest in this case, therefore Schmidt must obtain written consent from all parties involved."}, "orig": "ECO Module 1 Q19"}, {"id": "ECO-M1-Q20", "src": "ECO 오답", "module": 1, "tag": "IV(C) Supervisors — prevent repetition during investigation", "vig": null, "stem": "Hiroshi Kato, CFA, is a supervisor at an investment management firm. Kato learns one of his employees may have violated the Standards. Kato promptly initiates an investigation to determine the extent of the potential wrongdoing and concludes that the employee violated the Standards. Kato then reports the misconduct up the chain of command and warns the employee to cease the activity. While waiting for the outcome of the investigation, Kato takes no further steps to prevent repeated violations.\nAre Kato's actions consistent with the Standard relating to responsibilities of supervisors?", "opts": {"A": "Yes", "B": "No, because Kato should take steps to ensure the violation is not repeated", "C": "No, because Kato should report the violation to the Professional Conduct Program"}, "ans": "B", "en": "B is correct. Correct because according to Standard IV(C), Responsibilities of Supervisors, reporting the misconduct up the chain of command and warning the employee to cease the activity are also not enough. Pending the outcome of the investigation, a supervisor should take steps to ensure that the violation will not be repeated, such as placing limits on the employee’s activities or increasing the monitoring of the employee’s activities.\nA is incorrect. Incorrect because Kato should take steps to ensure the violation is not repeated.\nC is incorrect. Incorrect because Kato should take steps to ensure the violation is not repeated. Standard IV(C), Responsibilities of Supervisors, does not include any recommendation that supervisors report violations to the Professional Conduct Program.", "ko": "Supervisor는 조사·보고·경고만으로 부족하다. 조사 결과가 나올 때까지 활동 제한·monitoring 강화 등으로 재발을 막아야 한다.", "trap": "PCP에 보고할 의무는 없다. 핵심은 'pending investigation 동안 재발 방지'.", "f": "", "why": {"A": "Incorrect because Kato should take steps to ensure the violation is not repeated.", "C": "Incorrect because Kato should take steps to ensure the violation is not repeated. Standard IV(C), Responsibilities of Supervisors, does not include any recommendation that supervisors report violations to the Professional Conduct Program."}, "orig": "ECO Module 1 Q20"}, {"id": "ECO-M1-Q22", "src": "ECO 오답", "module": 1, "tag": "V(A) Diligence — external adviser selection", "vig": null, "stem": "Geoff Carlson, CFA, is responsible for selecting external investment advisors for his asset management firm. Carlson designs a manager selection policy for his firm that specifies a standardized set of criteria for evaluating the adequacy of external advisors. The policy specifies that fund allocations to external advisors should be reviewed every two years.\nIs Carlson's policy consistent with the Standard relating to diligence and reasonable basis?", "opts": {"A": "Yes", "B": "No, because the policy should specify custom criteria for each advisor type", "C": "No, because the policy should specify that allocations of funds to advisers be reviewed at least annually"}, "ans": "A", "en": "A is correct. Correct because Standard V(A), Diligence and Reasonable Basis, states that members should encourage their firms to consider adopting a standardized set of criteria for evaluating the adequacy of external advisers. The policy should include how often and on what basis the allocation of funds to the adviser will be reviewed. Carlson does this and thus is consistent with the Standards.\nB is incorrect. Incorrect because recommended procedures for Standard V(A), Diligence and Reasonable Basis, states that members should encourage their firms to consider adopting a standardized set of criteria for evaluating the adequacy of external advisers.\nC is incorrect. Incorrect because recommended procedures for Standard V(A), Diligence and Reasonable Basis, do not mention a specific period, only that the policy should include how often allocation of funds to the adviser will be reviewed.", "ko": "External adviser 평가는 standardized criteria를 쓰고, 자금 배분을 얼마나 자주·어떤 기준으로 review할지 정하면 된다. 매년이라는 규정은 없다.", "trap": "'최소 annually'처럼 구체적 주기를 요구하는 건 Standards에 없다. Custom criteria도 요구 사항 아님.", "f": "", "why": {"B": "Incorrect because recommended procedures for Standard V(A), Diligence and Reasonable Basis, states that members should encourage their firms to consider adopting a standardized set of criteria for evaluating the adequacy of external advisers.", "C": "Incorrect because recommended procedures for Standard V(A), Diligence and Reasonable Basis, do not mention a specific period, only that the policy should include how often allocation of funds to the adviser will be reviewed."}, "orig": "ECO Module 1 Q22"}, {"id": "ECO-M1-Q27", "src": "ECO 오답", "module": 1, "tag": "I(C) Misrepresentation — research of departed analyst", "vig": null, "stem": "Christina Tam, CFA, and Peter Wolf, CFA, are employed at Hamilton Investments. Tam develops an equity research model and uses it to issue a report on Iron Mining Corp. She also begins a report on Copper Core Inc. Shortly thereafter, Tam leaves the firm and Wolf uses Tam's model to issue a report on Zinc Drilling Ltd. without providing attribution to Tam. Wolf also finishes Tam's work on Copper Core and issues a report solely under his own name without providing attribution to Tam. Wolf later reissues Tam's report on Iron Mining, again solely under his own name.\nWhich of Wolf's actions violates the Standards?", "opts": {"A": "Using Tam's model without providing attribution to her", "B": "Reissuing Tam's report on Iron Mining solely under his own name", "C": "Finishing Tam's work on Copper Core and issuing a report solely under his own name without providing attribution to Tam"}, "ans": "B", "en": "B is correct. Correct because, according to Standard I(C), Misrepresentation, in some situations members may use research conducted by others within the same firm without committing a violation. The most common example relates to the situation in which one of the original analysts is no longer with the firm. Research developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member has left the organization. The firm may issue future reports without providing attribution to the prior analysts. A member or candidate cannot, however, reissue a previously released report solely under his or her name.\"\nSince a report on Iron Mining was previously released, Wolf may not reissue this report solely under his own name.\nA is incorrect. Incorrect because in some situations members may use models developed by others within the same firm without committing a violation. The most common example relates to the situation in which one of the original analysts is no longer with the firm. Models developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member has left the organization.\nThus Wolf may use Tam's model without attribution to her.\nC is incorrect. Incorrect because in some situations members may use research conducted by others within the same firm without committing a violation. The most common example relates to the situation in which one of the original analysts is no longer with the firm. Research developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member has left the organization. The firm may issue future reports without providing attribution to the prior analysts. A member or candidate cannot, however, reissue a previously released report solely under his or her name.\nSince a report on Copper Core was not previously released, Wolf may complete the work done by Tam and issue a report solely under his own name, without providing attribution to Tam.", "ko": "떠난 analyst의 model·미완성 작업은 firm 소유라 attribution 없이 써도 된다. 하지만 이미 발행된 report를 자기 이름만으로 재발행하면 위반.", "trap": "미발행(Copper Core) 완성은 OK, 이미 발행된(Iron Mining) 재발행은 위반.", "f": "", "why": {"A": "Incorrect because in some situations members may use models developed by others within the same firm without committing a violation. The most common example relates to the situation in which one of the original analysts is no longer with the firm. Models developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member has left the organization.\nThus Wolf may use Tam's model without attribution to her.", "C": "Incorrect because in some situations members may use research conducted by others within the same firm without committing a violation. The most common example relates to the situation in which one of the original analysts is no longer with the firm. Research developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member has left the organization. The firm may issue future reports without providing attribution to the prior analysts. A member or candidate cannot, however, reissue a previously released report solely under his or her name.\nSince a report on Copper Core was not previously released, Wolf may complete the work done by Tam and issue a report solely under his own name, without providing attribution to Tam."}, "orig": "ECO Module 1 Q27"}, {"id": "ECO-M2-Q2", "src": "ECO 오답", "module": 2, "tag": "I(B) Independence — IPO prior approval, personal investment", "vig": 0, "stem": "Do the recommendations Watson outlines in the second scenario most likely apply to Standard I(B): Independence and Objectivity?", "opts": {"A": "Yes.", "B": "No, with regard to Recommendation 1.", "C": "No, with regard to Recommendation 2."}, "ans": "A", "en": "A is correct. Correct. Both Recommendation 1 (“Firms should require prior approval for employees participating in initial public offerings.”) and Recommendation 2 (“Firms should implement effective supervisory and review procedures to ensure compliance with personal investment policies.”) apply to Standard I(B): Independence and Objectivity. Standard I(B) states Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. The recommended procedures for compliance suggest investments be restricted and require prior approval for employee participation in IPOs. The recommended procedures also suggest review procedures be implemented to ensure compliance with policies relating to their personal investment activities.\nB is incorrect. Incorrect. Both Recommendation 1 and Recommendation 2 apply to Standard I(B): Independence and Objectivity.\nC is incorrect. Incorrect. Both Recommendation 1 and Recommendation 2 apply to Standard I(B): Independence and Objectivity.", "ko": "IPO 참여 사전 승인, personal investment 정책 감독 절차 모두 I(B) Independence and Objectivity의 recommended procedures.", "trap": "IPO·private placement 사전 승인은 Priority of Transactions만이 아니라 I(B)에도 해당.", "f": "", "why": {"B": "Incorrect. Both Recommendation 1 and Recommendation 2 apply to Standard I(B): Independence and Objectivity.", "C": "Incorrect. Both Recommendation 1 and Recommendation 2 apply to Standard I(B): Independence and Objectivity."}, "orig": "ECO Module 2 Q2"}, {"id": "ECO-M2-Q5", "src": "ECO 오답", "module": 2, "tag": "VII(A) Conduct in CFA Programs — opinion vs exam content", "vig": 1, "stem": "When discussing the CFA examination, did either Sobhani or Miyagawa violate the Standard relating to conduct as participants in CFA Institute Programs?", "opts": {"A": "No", "B": "Yes, Sobhani violated the Standard", "C": "Yes, both Sobhani and Miyagawa violated the Standard"}, "ans": "A", "en": "A is correct. Correct because the information disclosed about the exams by either Sobhani or Miyagawa is not confidential CFA Program information, so they are not in violation of Standard VII(A), Conduct as Participants in CFA Institute Programs. Sobhani’s information was based upon his analysis of the readings and is his opinion, and Miyagawa referenced the practice exam, which does not reflect content in the actual CFA exam.\nB is incorrect. Incorrect because the information disclosed about the exams by either Sobhani or Miyagawa is not confidential program information, so they are not in violation of Standard VII(A).\nC is incorrect. Incorrect because the information disclosed about the exams by either Sobhani or Miyagawa is not confidential program information, so they are not in violation of Standard VII(A).", "ko": "Curriculum 분석에 근거한 개인 의견, practice exam 언급은 confidential exam 정보가 아니라 위반 아님.", "trap": "실제 시험에 나온/안 나온 topic을 말해야 위반. 공개된 curriculum·practice exam 이야기는 OK.", "f": "", "why": {"B": "Incorrect because the information disclosed about the exams by either Sobhani or Miyagawa is not confidential program information, so they are not in violation of Standard VII(A).", "C": "Incorrect because the information disclosed about the exams by either Sobhani or Miyagawa is not confidential program information, so they are not in violation of Standard VII(A)."}, "orig": "ECO Module 2 Q5"}, {"id": "ECO-M2-Q6", "src": "ECO 오답", "module": 2, "tag": "III(D) Performance Presentation — historical returns", "vig": 1, "stem": "Sobhani’s advice to Purce with regards to a potential investment is most consistent with the Standards concerning which of the following?", "opts": {"A": "Suitability", "B": "Performance Presentation", "C": "Diligence and Reasonable Basis"}, "ans": "B", "en": "B is correct. Correct because Sobhani has only stated historical returns for these types of investments based on research of other similar investments. In addition, he has not promised a specific return, so he is not in violation of Standard III(D), Performance Presentation. Sobhani is, however, in violation of Standard III(A), Loyalty, Prudence, and Care, because he is required to identify the actual client, who in this case would be Purce and the trust beneficiaries, the twins. From the information provided, there is no evidence that Sobhani knows or has considered the twins’ investment objectives and constraints and thus is also in violation of Standard III(C), Suitability.\nA is incorrect. Incorrect because there is no evidence that Sobhani knows or has considered the investment objectives and constraints of the twins and therefore is in violation of Standard III(C), Suitability.\nC is incorrect. Incorrect because even though Sobhani has disclosed some of the risks related to this type of investment, he has not discussed any country-related risks such as different accounting standards, different business practices, and unstable governments. Standard V(A), Diligence and Reasonable Basis, requires that the manager should ensure that the client’s objectives and expectations for the performance of the account are realistic and suitable to the client’s circumstance and that the risks involved are appropriate.", "ko": "비슷한 투자의 historical return만 말하고 특정 return을 약속하지 않았으니 Performance Presentation 위반 아님. 대신 actual client(trust beneficiaries) 파악 실패로 III(A)·III(C) 위반.", "trap": "Country risk를 설명하지 않아 V(A) 쪽은 문제. 'most consistent'는 위반하지 않은 standard를 묻는 것.", "f": "", "why": {"A": "Incorrect because there is no evidence that Sobhani knows or has considered the investment objectives and constraints of the twins and therefore is in violation of Standard III(C), Suitability.", "C": "Incorrect because even though Sobhani has disclosed some of the risks related to this type of investment, he has not discussed any country-related risks such as different accounting standards, different business practices, and unstable governments. Standard V(A), Diligence and Reasonable Basis, requires that the manager should ensure that the client’s objectives and expectations for the performance of the account are realistic and suitable to the client’s circumstance and that the risks involved are appropriate."}, "orig": "ECO Module 2 Q6"}, {"id": "ECO-M2-Q7", "src": "ECO 오답", "module": 2, "tag": "VI(C) Referral Fees — disclose before agreement", "vig": 1, "stem": "Concerning his advice related to real estate investments, did Sobhani most likely violate the Standards?", "opts": {"A": "No.", "B": "Yes, with regard to Fair Dealing.", "C": "Yes, with regard to Referral Fees."}, "ans": "C", "en": "C is correct. Correct because Standard VI(C), Referral Fees, requires members and candidates to disclose to their employer, clients, and prospective clients, as appropriate, any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services before entry into any formal agreement for services. In this case, Sobhani advises clients of the referral fee arrangement after the fact, thus violating Standard VI(C).\nA is incorrect. Incorrect because Sobhani violated Standard VI(C), Referral Fees.\nB is incorrect. Incorrect because Sobhani did not violate Standard III(B), Fair Dealing, because he dealt fairly and objectively with his clients, delaying the real estate investment due to liquidity constraints rather than preferential treatment.", "ko": "Referral fee는 formal agreement 전에 employer·client·prospect에게 공개해야 한다. 사후에 알렸으니 위반.", "trap": "사후 공개는 공개가 아니다. 'before entry into any formal agreement'.", "f": "", "why": {"A": "Incorrect because Sobhani violated Standard VI(C), Referral Fees.", "B": "Incorrect because Sobhani did not violate Standard III(B), Fair Dealing, because he dealt fairly and objectively with his clients, delaying the real estate investment due to liquidity constraints rather than preferential treatment."}, "orig": "ECO Module 2 Q7"}, {"id": "ECO-M2-Q13", "src": "ECO 오답", "module": 2, "tag": "V(A)/III(B) — sending earnings model to CFO", "vig": 2, "stem": "Did Fitzgerald most likely violate the CFA Institute Standards of Professional Conduct regarding his emails to the chief financial officers of the two companies under his coverage?", "opts": {"A": "No", "B": "Yes, regarding Standard III(B): Fair Dealing", "C": "Yes, regarding Standard V(A): Diligence and Reasonable Basis"}, "ans": "A", "en": "A is correct. Correct. Fitzgerald most likely did not violate any of the CFA Institute Standards of Professional Conduct by emailing his earnings estimates to the CFOs of the companies under his coverage. He simply sent the CFOs his earnings model for their review and asked for comments. There is no evidence his earnings estimates do not reflect his investment recommendation or opinion about the earnings potential of the companies under his coverage.\nB is incorrect. Incorrect. When Fitzgerald published his earnings estimates and distributed his research report, he most likely did not violate Standard III(B): Fair Dealing. This standard requires members and candidates to deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. There is no evidence he gave preferential treatment to any investor.\nC is incorrect. Incorrect. When Fitzgerald emailed the CEOs of the companies under his coverage, he most likely did not violate Standard V(A): Diligence and Reasonable Basis. This standard requires members and candidates to (1) exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions and (2) have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. He emailed only his model, not his recommendation, to the CEOs to elicit their comments. There is no evidence his earnings estimates do not reflect the earnings potential of the companies under his coverage.", "ko": "CFO에게 earnings model을 보내 검토·의견을 구한 것은 위반 아님(recommendation을 보낸 것이 아니고, 추정치가 의견을 반영하지 않는다는 증거 없음).", "trap": "회사와 model을 확인하는 것 자체는 정상적인 due diligence. 특정 투자자 우대가 없으면 Fair Dealing 위반 아님.", "f": "", "why": {"B": "Incorrect. When Fitzgerald published his earnings estimates and distributed his research report, he most likely did not violate Standard III(B): Fair Dealing. This standard requires members and candidates to deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. There is no evidence he gave preferential treatment to any investor.", "C": "Incorrect. When Fitzgerald emailed the CEOs of the companies under his coverage, he most likely did not violate Standard V(A): Diligence and Reasonable Basis. This standard requires members and candidates to (1) exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions and (2) have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. He emailed only his model, not his recommendation, to the CEOs to elicit their comments. There is no evidence his earnings estimates do not reflect the earnings potential of the companies under his coverage."}, "orig": "ECO Module 2 Q13"}, {"id": "ECO-M2-Q18", "src": "ECO 오답", "module": 2, "tag": "III(A)/V(B) — social impact fund statement", "vig": 3, "stem": "Given O’Connor’s first statement about the asset allocation, expected returns, and strategy of the Step Up Social Impact Private Equity Fund, does O’Connor most likely violate the CFA Institute Standards?", "opts": {"A": "No", "B": "Yes, with regard to Standard III(A): Loyalty, Prudence, and Care", "C": "Yes, with regard to Standard V(B): Communication with Clients and Prospective Clients"}, "ans": "A", "en": "A is correct. Correct because there is no indication O’Connor violated Standard III(A): Loyalty, Prudence, and Care or Standard V(B): Communication with Clients and Prospective Clients. With regard to Standard III(A), investors in this type of social impact fund are likely looking to achieve high levels of social impact as well as to obtain somewhat competitive investment returns. Consequently, returns may not be the primary focus so the Fund can still meet its fiduciary duty to clients. As long as this strategy is clearly indicated in the prospectus prior to entry into the Fund, O’Connor would not be in violation of Standard III(A). In addition, with regard to Standard V(B), since the investment strategy is clearly stated in detail in the prospectus and notifications of changes are sent to clients prior to changes being made, O’Connor, as part of the senior management team, would not be in violation of Standard V(B).\nB is incorrect. Incorrect because there is no indication O’Connor violated Standard III(A): Loyalty, Prudence, and Care.\nC is incorrect. Incorrect because there is no indication the information contained in the prospectus is incorrect or misleading. Therefore, O’Connor, as part of the senior management team, is not in violation of Standard V(B): Communication with Clients and Prospective Clients.", "ko": "Social impact fund 투자자는 수익보다 impact를 중시할 수 있어, 그 전략·기대 수익 설명은 III(A)·V(B) 위반 아님.", "trap": "수익이 시장보다 낮을 수 있다는 설명 = 위반이 아니라 적절한 disclosure.", "f": "", "why": {"B": "Incorrect because there is no indication O’Connor violated Standard III(A): Loyalty, Prudence, and Care.", "C": "Incorrect because there is no indication the information contained in the prospectus is incorrect or misleading. Therefore, O’Connor, as part of the senior management team, is not in violation of Standard V(B): Communication with Clients and Prospective Clients."}, "orig": "ECO Module 2 Q18"}, {"id": "ECO-M2-Q19", "src": "ECO 오답", "module": 2, "tag": "VI(C) Referral Fees — quarterly notification", "vig": 3, "stem": "Given O’Connor’s second statement to Jensen, which further action should O’Connor least likely take to comply with required or recommended procedures for the CFA Institute Standards of Professional Conduct?", "opts": {"A": "Monitor the consultants’ compliance policy execution.", "B": "Disclose the finder’s fee arrangement in the fund prospectus.", "C": "Notify clients of the finder’s fee policy on a semiannual basis."}, "ans": "C", "en": "C is correct. Correct. O’Connor should least likely notify clients of the finder’s fee policy on a semiannual basis. Recommended procedures to implement Standard VI(C): Referral Fees are to notify clients at least quarterly, not semiannually.\nA is incorrect. Incorrect. Make-a-Difference has made claims that it abides by the CFA Institute Code and Standards. O’Connor has a responsibility under Standard I(A): Knowledge of the Law to not knowingly participate or assist others in violating any CFA Institute Standards. Therefore, she must seek assurances that Make-a-Difference Consultants also disclose the receipt of finder’s fees to their clients where applicable as required by Standard VI(C): Referral Fees.\nB is incorrect. Incorrect. O’Connor should ensure that the potential use of paying finder’s fees to Make-a-Difference Consultants or any other third-party agents is disclosed in the prospectus to avoid violating Standard VI(C): Referral Fees.", "ko": "Referral fee recommended procedure: client에게 at least quarterly 알린다. Semiannual은 아님.", "trap": "'least likely' 질문. 숫자(quarterly vs semiannual)를 기억.", "f": "", "why": {"A": "Incorrect. Make-a-Difference has made claims that it abides by the CFA Institute Code and Standards. O’Connor has a responsibility under Standard I(A): Knowledge of the Law to not knowingly participate or assist others in violating any CFA Institute Standards. Therefore, she must seek assurances that Make-a-Difference Consultants also disclose the receipt of finder’s fees to their clients where applicable as required by Standard VI(C): Referral Fees.", "B": "Incorrect. O’Connor should ensure that the potential use of paying finder’s fees to Make-a-Difference Consultants or any other third-party agents is disclosed in the prospectus to avoid violating Standard VI(C): Referral Fees."}, "orig": "ECO Module 2 Q19"}, {"id": "ECO-M2-Q21", "src": "ECO 오답", "module": 2, "tag": "III(A) Loyalty — identify the client", "vig": 4, "stem": "With regard to the investment request made by Nathoo to invest in Chatterbox, Kostecka should most likely:", "opts": {"A": "comply with her request.", "B": "seek advice from the court.", "C": "follow Bope’s investment goals."}, "ans": "C", "en": "C is correct. Correct. The account should be managed according to the client’s investment goal of capital preservation and a low risk tolerance. Under Standard III(A) –Loyalty, Prudence, and Care, the first step for members and candidates in fulfilling their duty of loyalty to clients is to determine the identity of the “client” to whom the duty of loyalty is owed. Only when the daughter is granted legal responsibility over her father’s affairs by the court does she become the client.\nA is incorrect. Incorrect because the account should still be managed as the client requested, an investment goal of capital preservation and a low risk tolerance. An investment in an IPO of an unprofitable social networking company most likely does not meet Bope’s investment goal. Since the daughter has not yet been granted legal responsibility over her father’s affairs by the court, the adviser is not required to follow through on this request.\nB is incorrect. Incorrect because the account should still be managed as the client requested since the daughter has not yet been granted legal responsibility over her father’s affairs by the court. An investment in an IPO of an unprofitable social networking company most likely does not meet the father’s investment goal.", "ko": "Client는 계좌 주인(Bope)이고 목표는 capital preservation·low risk. 딸이 legal authority를 받기 전까지 그녀 요청을 따르지 않는다.", "trap": "가족이 요청해도 법적 권한이 없으면 client가 아니다. 법원 자문까지는 필요 없음.", "f": "", "why": {"A": "Incorrect because the account should still be managed as the client requested, an investment goal of capital preservation and a low risk tolerance. An investment in an IPO of an unprofitable social networking company most likely does not meet Bope’s investment goal. Since the daughter has not yet been granted legal responsibility over her father’s affairs by the court, the adviser is not required to follow through on this request.", "B": "Incorrect because the account should still be managed as the client requested since the daughter has not yet been granted legal responsibility over her father’s affairs by the court. An investment in an IPO of an unprofitable social networking company most likely does not meet the father’s investment goal."}, "orig": "ECO Module 2 Q21"}, {"id": "ECO-M2-Q23", "src": "ECO 오답", "module": 2, "tag": "III(B) Fair Dealing — informing all clients equally", "vig": 4, "stem": "In relation to Kostecka’s handling of the Jabbertalk stock recommendation, which of the following CFA Institute Standards of Professional Conduct did he least likely violate?", "opts": {"A": "Fair Dealing", "B": "Priority of Transactions", "C": "Communication with Clients"}, "ans": "A", "en": "A is correct. Correct. Standard III(B)–Fair Dealing requires members and candidates to deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. When Kostecka informs clients of the upcoming investment recommendation by Forkson, he has treated all clients fairly because this disclosure is provided to all of his current clients.\nB is incorrect. Incorrect because Kostecka has violated Standard VI(B)–Priority of Transactions. There is a potential conflict of interest because the client and the adviser hold the same stock, so the client should be given first priority to trade Jabbertalk.\nC is incorrect. Incorrect because according to Standard V(B)–Communication with Clients and Prospective Clients, Kostecka should have distinguished fact from opinion. In addition, Kostecka should also disclose to clients and prospective clients the basic format and general principles of the investment processes used to analyze investments, select securities, and construct portfolios and must promptly disclose any changes that might materially affect those processes and use reasonable judgment in identifying which factors are important to his investment analyses, recommendations, or actions and include those factors in communications with clients and prospective clients.", "ko": "곧 나올 recommendation을 모든 client에게 동시에 알렸으니 Fair Dealing 위반은 least likely. 다른 standard(priority 등)는 문제.", "trap": "Fair Dealing은 '모두에게 동시에·공평하게'면 충족.", "f": "", "why": {"B": "Incorrect because Kostecka has violated Standard VI(B)–Priority of Transactions. There is a potential conflict of interest because the client and the adviser hold the same stock, so the client should be given first priority to trade Jabbertalk.", "C": "Incorrect because according to Standard V(B)–Communication with Clients and Prospective Clients, Kostecka should have distinguished fact from opinion. In addition, Kostecka should also disclose to clients and prospective clients the basic format and general principles of the investment processes used to analyze investments, select securities, and construct portfolios and must promptly disclose any changes that might materially affect those processes and use reasonable judgment in identifying which factors are important to his investment analyses, recommendations, or actions and include those factors in communications with clients and prospective clients."}, "orig": "ECO Module 2 Q23"}, {"id": "ECO-M2-Q26", "src": "ECO 오답", "module": 2, "tag": "III(E) / IV(A) vs V(B) — distributing analyst email", "vig": 5, "stem": "Which CFA Institute Standard of Professional Conduct would least likely be violated if Pierce distributed the senior analyst’s email as requested?", "opts": {"A": "Standard III: Duties to Clients", "B": "Standard IV: Duties to Employers", "C": "Standard V: Investment Analysis, Recommendations, and Actions"}, "ans": "C", "en": "C is correct. Correct. Standard V: Investment Analysis, Recommendations, and Actions would least likely be violated if Pierce distributed the email. Specifically, Standard V(B): Communication with Clients and Prospective Clients requires members and candidates to (1) disclose to clients and prospective clients the basic format and general principles of the investment processes, (2) disclose to clients and prospective clients limitations and risks, (3) identify which factors are important to their investment analysis, and (4) distinguish between fact and opinion. The email outlined the analyst’s earnings model for a company under his coverage and included his assumptions, the important factors surrounding his analysis, and the risk associated with those earnings. If the email had been distributed, it would have been a violation of Standard III: Duties to Clients—specifically, Standard III(B): Fair Dealings, which requires that members and candidates deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Emailing the change in earnings expectations to a subset of asset management clients failed to deal fairly with all clients. It would also have been a violation of Standard IV: Duties to Employers—specifically, Standard IV(C): Responsibilities of Supervisors, which requires that members and candidates make reasonable efforts to ensure anyone subject to their supervision or authority complies with applicable laws, rules, regulations, and the Code and Standards. Company policy requires reports being emailed to come through Pierce’s supervisor. In this case, the report came directly from the analyst. If it had been emailed, it would have clearly been a violation of company policy and a failure to supervise would have occurred somewhere in the chain of command. However, it is unclear whether this failure occurred with the analyst, the analyst’s supervisor, or Pierce’s supervisor.\nA is incorrect. Incorrect. Standard V: Investment Analysis, Recommendations, and Actions would least likely be violated if Pierce distributed the email. Specifically, Standard V(B): Communication with Clients and Prospective Clients requires members and candidates to (1) disclose to clients and prospective clients the basic format and general principles of the investment processes, (2) disclose to clients and prospective clients limitations and risks, (3) identify which factors are important to their investment analysis, and (4) distinguish between fact and opinion. The email outlined the analyst’s earnings model for a company under his coverage and included his assumptions, the important factors surrounding his analysis, and the risk associated limitations and risks, (3) identify which factors are important to their investment analysis, and (4) distinguish between fact and opinion. The email outlined the analyst’s earnings model for a company under his coverage and included his assumptions, the important factors surrounding his analysis, and the risk associated with those earnings. If the email had been distributed, it would have been a violation of Standard III: Duties to Clients—specifically, Standard III(B): Fair Dealings, which requires that members and candidates deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Emailing the change in earnings expectations to a subset of asset management clients failed to deal fairly with all clients. It would also have been a violation of Standard IV: Duties to Employers—specifically, Standard IV(C): Responsibilities of Supervisors, which requires that members and candidates make reasonable efforts to ensure anyone subject to their supervision or authority complies with applicable laws, rules, regulations, and the Code and Standards. Company policy requires reports being emailed to come through Pierce’s supervisor. In this case, the report came directly from the analyst. If it had been emailed, it would have clearly been a violation of company policy and a failure to supervise would have occurred somewhere in the chain of command. However, it is unclear whether this failure occurred with the analyst, the analyst’s supervisor, or Pierce’s supervisor."}, "orig": "ECO Module 2 Q26"}, {"id": "ECO-M2-Q27", "src": "ECO 오답", "module": 2, "tag": "II(A) MNPI — accountant tip on asset retirement", "vig": 5, "stem": "Are any of the senior analysts discussed by the research assistants when gathered around Pierce’s workspace in possession of information that could most likely lead to a violation of Standard II: Integrity of Capital Markets?", "opts": {"A": "No", "B": "Yes, Research Assistant 1’s senior analyst", "C": "Yes, Research Assistant 2’s senior analyst"}, "ans": "B", "en": "B is correct. Correct. The statement by Research Assistant 1 (“One of the senior analysts I work with heard from an accountant at one of the companies she follows that they are about to retire a large group of assets. She’s afraid she may lose her job.”) indicates the senior analyst is in possession of insider information, which, if acted on, could lead to a violation of Standard II: Integrity of Capital Markets. The retirement of a large group of assets would be considered material. Additionally, the insider is an accountant, which would indicate he or she would be considered reliable. Information is material if its disclosure would probably have an impact on the price of a security or if reasonable investors would want to know the information before making an investment decision. The source or relative reliability of the information is also a determining factor in materiality. The standard recommendation is for the analyst to work with the company to publicly release the material inside information. The statement by Research Assistant 2 is “One of the senior analysts I work with heard from the receptionist at an independent research firm about the potential purchase of a large block of stock of a company under his coverage. I can’t wait to find out who it involves.” While the sale of a large block of stock would be considered material, in this case, the analyst is not given a specific company name and therefore would be unable to verify the information or act on it. The analyst therefore could not violate Standard II: Integrity of Capital Markets. The specificity of the information is a key factor in determining whether a particular piece of information fits the definition of material.\nA is incorrect. Incorrect. The statement by Research Assistant 1 (“One of the senior analysts I work with heard from an accountant at one of nal activities.\nB is incorrect. Incorrect. Recommendation 1, “All accounts participating in a block trade should receive the same execution price and pay the same commission rate,” and Recommendation 2, “Orders will be executed on a first-in, first-out basis, with consideration given to bundling orders for efficiency,” are consistent with the CFA Institute Recommended Procedures for Compliance with Standard III(B): Fair Dealing. This standard states, Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities.\nC is incorrect. Incorrect. Recommendation 1, “All accounts participating in a block trade should receive the same execution price and pay the same commission rate,” and Recommendation 2, “Orders will be executed on a first-in, first-out basis, with consideration given to bundling orders for efficiency,” are consistent with the CFA Institute Recommended Procedures for Compliance with Standard III(B): Fair Dealing. This standard states, Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities.", "ko": "Block trade 참여 계좌에 같은 가격·같은 commission, 주문은 first-in first-out(효율 위해 묶기 가능) 모두 Fair Dealing recommended procedures와 일치.", "trap": "둘 다 맞는 recommendation일 때 하나를 골라 틀렸다고 하기 쉽다.", "f": "", "why": {"B": "Incorrect. Recommendation 1, “All accounts participating in a block trade should receive the same execution price and pay the same commission rate,” and Recommendation 2, “Orders will be executed on a first-in, first-out basis, with consideration given to bundling orders for efficiency,” are consistent with the CFA Institute Recommended Procedures for Compliance with Standard III(B): Fair Dealing. This standard states, Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities.", "C": "Incorrect. Recommendation 1, “All accounts participating in a block trade should receive the same execution price and pay the same commission rate,” and Recommendation 2, “Orders will be executed on a first-in, first-out basis, with consideration given to bundling orders for efficiency,” are consistent with the CFA Institute Recommended Procedures for Compliance with Standard III(B): Fair Dealing. This standard states, Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities."}, "orig": "ECO Module 2 Q30"}, {"id": "ECO-M2-Q32", "src": "ECO 오답", "module": 2, "tag": "I(D) Misconduct — false public statement", "vig": 6, "stem": "Who has most likely violated the CFA Institute Standards of Professional Conduct regarding the newspaper interview?", "opts": {"A": "Tao", "B": "Johnson", "C": "Both Tao and Johnson"}, "ans": "A", "en": "A is correct. Correct. Tao has violated Standard I(D): Misconduct, which states, Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or commit any act that reflects adversely on their professional reputation, integrity, or competence. Tao’s comment downplayed the prior unethical incidents, which alone may not be a violation, because we do not have enough information about those incidents. However, his statement that unethical violations \"happen in most investment firms” is untrue and is a clear violation. Employees of most investment firms are not guilty of committing unethical behavior, nor is he in a position to know such information. His comment to the reporter reflects adversely on his professional reputation, integrity, and competence.\nB is incorrect. Incorrect. Johnson’s comments regarding the newspaper interview have not violated any CFA Institute Standards of Professional Conduct. Johnson has simply instructed Tao to tell the truth but not to provide any details. By instructing him to not provide any details, she is fulfilling her responsibility as Tao’s supervisor to prevent any violation of Standard III(E): Preservation of Confidentiality.\nC is incorrect. Incorrect. Although Tao has violated Standard I(D): Misconduct, Johnson’s comments regarding the newspaper interview did not violate any of the CFA Institute Standards of Professional Conduct.", "ko": "'대부분 회사에서 비윤리 행위가 일어난다'는 사실이 아닌 발언이 professional reputation에 나쁜 영향 → Tao I(D) 위반. Johnson은 진실만 말하고 세부 사항 비공개를 지시했을 뿐.", "trap": "supervisor가 세부 사항을 말하지 말라고 한 것은 confidentiality 보호라 정당.", "f": "", "why": {"B": "Incorrect. Johnson’s comments regarding the newspaper interview have not violated any CFA Institute Standards of Professional Conduct. Johnson has simply instructed Tao to tell the truth but not to provide any details. By instructing him to not provide any details, she is fulfilling her responsibility as Tao’s supervisor to prevent any violation of Standard III(E): Preservation of Confidentiality.", "C": "Incorrect. Although Tao has violated Standard I(D): Misconduct, Johnson’s comments regarding the newspaper interview did not violate any of the CFA Institute Standards of Professional Conduct."}, "orig": "ECO Module 2 Q32"}, {"id": "ECO-M2-Q33", "src": "ECO 오답", "module": 2, "tag": "III(A) Loyalty — what PCP won't investigate", "vig": 7, "stem": "As a result of Thorpe’s admission he traded in Savanna shares, which Standard will Okada least likely investigate for a possible violation?", "opts": {"A": "Knowledge of the Law", "B": "Loyalty, Prudence, and Care", "C": "Material Nonpublic Information"}, "ans": "B", "en": "B is correct. Correct because Okada is least likely to investigate Standard III(A), Loyalty, Prudence, and Care. When trading in Savanna shares, Thorpe likely displayed loyalty, prudence, and care by putting the interests of his clients before his own, as required under this Standard.\nA is incorrect. Incorrect because despite insider trading not being against the law in Thorpe’s jurisdiction, as a CFA candidate, he is required to uphold the CFA Institute Code of Ethics and Standards of Professional Conduct. Because insider trading is a violation of the Standards, he likely violated Standard I(A), Knowledge of the Law, by not upholding the stricter CFA Institute Standards.\nC is incorrect. Incorrect because Thorpe likely violated Standard II(A), Material Nonpublic Information, in that he traded on information that could be considered material, because a lower earnings forecast would likely negatively affect the share price if it were known to the public. The earnings warning was not yet available to the public, so by trading in advance of the notice, Thorpe likely traded on material non-public insider information. Even though insider trading is not illegal in Thorpe’s market, he is required to follow the Standards.", "ko": "Client 주문을 자기 주문보다 먼저 팔아 client 이익을 우선했으므로 III(A)는 least likely 조사 대상. MNPI·Knowledge of the Law는 조사 대상.", "trap": "'내 시장에서는 불법 아님'은 Knowledge of the Law 조사 대상이 된다.", "f": "", "why": {"A": "Incorrect because despite insider trading not being against the law in Thorpe’s jurisdiction, as a CFA candidate, he is required to uphold the CFA Institute Code of Ethics and Standards of Professional Conduct. Because insider trading is a violation of the Standards, he likely violated Standard I(A), Knowledge of the Law, by not upholding the stricter CFA Institute Standards.", "C": "Incorrect because Thorpe likely violated Standard II(A), Material Nonpublic Information, in that he traded on information that could be considered material, because a lower earnings forecast would likely negatively affect the share price if it were known to the public. The earnings warning was not yet available to the public, so by trading in advance of the notice, Thorpe likely traded on material non-public insider information. Even though insider trading is not illegal in Thorpe’s market, he is required to follow the Standards."}, "orig": "ECO Module 2 Q33"}, {"id": "ECO-M2-Q34", "src": "ECO 오답", "module": 2, "tag": "III(E) Confidentiality — submission to PCP", "vig": 7, "stem": "Should Thorpe revise how he submitted his defense of the Standard relating to fair dealing to avoid violating the Standard relating to preservation of confidentiality?", "opts": {"A": "No", "B": "Yes, he must delete the contact details", "C": "Yes, he must remove the AUM percentage details"}, "ans": "A", "en": "A is correct. Correct because it is not necessary for Thorpe to revise the information he submitted to support his claim. Any information provided to the Professional Conduct Program as evidence in an investigation of a member’s or candidate’s professional conduct is kept in the strictest confidence. Therefore, a member or candidate under investigation who submits confidential client information to the PCP is not in violation of Standard III(E), Preservation of Confidentiality.\nB is incorrect. Incorrect because any information submitted to the Professional Conduct Program as evidence in an investigation of a member or candidate’s professional conduct is kept in the strictest confidence.\nC is incorrect. Incorrect because any information submitted to the Professional Conduct Program as evidence in an investigation of a member or candidate’s professional conduct is kept in the strictest confidence.", "ko": "PCP에 제출한 정보는 엄격히 비밀 유지되므로 confidential client 정보를 PCP에 제출해도 III(E) 위반 아님. 수정할 필요 없음.", "trap": "Contact details·AUM 정보를 지워야 한다고 생각하기 쉽다. PCP 협조는 예외.", "f": "", "why": {"B": "Incorrect because any information submitted to the Professional Conduct Program as evidence in an investigation of a member or candidate’s professional conduct is kept in the strictest confidence.", "C": "Incorrect because any information submitted to the Professional Conduct Program as evidence in an investigation of a member or candidate’s professional conduct is kept in the strictest confidence."}, "orig": "ECO Module 2 Q34"}, {"id": "ECO-M2-Q35", "src": "ECO 오답", "module": 2, "tag": "I(B)/I(D) Gifts — firm policy per gift", "vig": 7, "stem": "Did Thorpe most likely violate the Standards by accepting the CFO’s six gift packages?", "opts": {"A": "No", "B": "Yes, he violated the Standard relating to misconduct", "C": "Yes, he violated the Standard relating to independence and objectivity"}, "ans": "A", "en": "A is correct. Correct because accepting the CFO's six gift packages did not violate the Standards, as described further in the Rationales of the two distractors.\nB is incorrect. Incorrect because Standard I(D), Misconduct, requires Thorpe to comply with his firm’s policies so as to not reflect adversely on his professional reputation and integrity. Thorpe was in compliance with his firm’s policy of not accepting a gift valued at more than USD100 per gift; even though the gift baskets’ total value was USD600, the gifts were shared among six people.\nC is incorrect. Incorrect because Standard I(B), Independence and Objectivity, prohibits the acceptance of gifts that would jeopardize a member’s or candidate’s independence and objectivity. Thorpe was unlikely to be influenced by the gift baskets when making the investment decision because his primary interest was to protect his clients and himself and the share price was anticipated to fall after the earnings warning was publicly released.", "ko": "선물 6개(각 USD100)를 6명이 나눴으니 '선물당 USD100' 정책 준수 → I(D) 위반 아님. 투자 판단에 영향 없었으니 I(B)도 위반 아님.", "trap": "총액 USD600만 보고 위반으로 판단하면 함정. 정책 기준은 per gift.", "f": "", "why": {"B": "Incorrect because Standard I(D), Misconduct, requires Thorpe to comply with his firm’s policies so as to not reflect adversely on his professional reputation and integrity. Thorpe was in compliance with his firm’s policy of not accepting a gift valued at more than USD100 per gift; even though the gift baskets’ total value was USD600, the gifts were shared among six people.", "C": "Incorrect because Standard I(B), Independence and Objectivity, prohibits the acceptance of gifts that would jeopardize a member’s or candidate’s independence and objectivity. Thorpe was unlikely to be influenced by the gift baskets when making the investment decision because his primary interest was to protect his clients and himself and the share price was anticipated to fall after the earnings warning was publicly released."}, "orig": "ECO Module 2 Q35"}, {"id": "ECO-M2-Q37", "src": "ECO 오답", "module": 2, "tag": "VI(A) Disclosure of Conflicts — outside board seat", "vig": 8, "stem": "In the initial update of her LinkedIn profile, Cadler most likely complied with which of the Standards?", "opts": {"A": "Misrepresentation", "B": "Disclosure of Conflicts", "C": "Performance Presentation"}, "ans": "B", "en": "B is correct. Correct because Cadler complies with Standard VI(A), Disclosure of Conflicts, by disclosing she has taken a board seat at a charitable organization and that it takes up a considerable amount of time during her evenings and weekends. Standard VI(A), Disclosure of Conflicts, requires Members and Candidates to avoid or make full and fair disclosure of all matters that could reasonably be expected to interfere with respective duties to their clients, prospective clients, and employer. Late nights and weekends spent working with the charitable organization may or may not cause a problem with Cadler’s ability to carry out her duties at a new position. Her disclosure allows a future employer to discuss it with her to make that determination.\nA is incorrect. Incorrect because Cadler violates Standard I(C), Misrepresentation, when she does not disclose or provide accurate information regarding recent underperformance at Voeltz: She selectively mentions only the top quartile performance. Standard I(C), Misrepresentation, states that Members and Candidates must not knowingly make any misrepresentations relating to investment analysis, recommendations, actions, or other professional activities.\nC is incorrect. Incorrect because Cadler violates Standard III(D), Performance Presentation, when she does not disclose or provide accurate information regarding recent underperformance at Voeltz: She selectively mentions only the top quartile performance. Standard III(D), Performance Presentation, states when communicating investment performance information, Members and Candidates must make reasonable efforts to ensure that it is fair, accurate, and complete.", "ko": "자선단체 board seat과 그 시간 부담을 공개 → VI(A) 준수.", "trap": "시간 부담도 업무에 지장을 줄 수 있는 conflict라 공개 대상.", "f": "", "why": {"A": "Incorrect because Cadler violates Standard I(C), Misrepresentation, when she does not disclose or provide accurate information regarding recent underperformance at Voeltz: She selectively mentions only the top quartile performance. Standard I(C), Misrepresentation, states that Members and Candidates must not knowingly make any misrepresentations relating to investment analysis, recommendations, actions, or other professional activities.", "C": "Incorrect because Cadler violates Standard III(D), Performance Presentation, when she does not disclose or provide accurate information regarding recent underperformance at Voeltz: She selectively mentions only the top quartile performance. Standard III(D), Performance Presentation, states when communicating investment performance information, Members and Candidates must make reasonable efforts to ensure that it is fair, accurate, and complete."}, "orig": "ECO Module 2 Q37"}, {"id": "ECO-M2-Q39", "src": "ECO 오답", "module": 2, "tag": "V(A) Diligence — non-approved brokers", "vig": 8, "stem": "Cadler’s quick-thinking action most likely violated Standard V(A): Diligence and Reasonable Basis because:", "opts": {"A": "outside parties influenced their investment action.", "B": "of the timing and execution of the small-cap share trades.", "C": "of an inappropriate swap of small-cap to large-cap shares."}, "ans": "B", "en": "B is correct. Correct. Selling the small-cap shares through non-approved brokers shows a lack of diligence in that the brokers had not gone through the firm’s due diligence process to determine the overall appropriateness of utilizing the brokers’ services. In addition, Voeltz’s clients could be subject to further risk if the unapproved brokers were not able to offer best execution in a timely manner for the small-cap share trades. Standard V(A) requires Members and Candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions as well as have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Cadler’s comments indicate the Voeltz team had a reasonable basis for which to swap out of the small-cap holding into the large-cap shares. There is also no evidence Voeltz abandoned their extensive research process nor solely relied on outside parties when reaching their investment decision, both reflecting their independence.\nA is incorrect. Incorrect. Selling the small-cap shares through non-approved brokers shows a lack of diligence in that the brokers had not gone through the firm’s due diligence process to determine the overall appropriateness of utilizing the brokers’ services. In addition, Voeltz’s clients could be subject to further risk if the unapproved brokers were not able to offer best execution in a timely manner for the small-cap share trades. Standard V(A) requires Members and Candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions as well as have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Cadler’s comments indicate the Voeltz team had a reasonable basis for which to swap out of the small-cap holding into the large-cap shares. There is also no evidence Voeltz abandoned their extensive research process nor solely relied on outside parties when reaching their investment decision, both reflecting their independence.\nC is incorrect. Incorrect. Selling the small-cap shares through non-approved brokers shows a lack of diligence in that the brokers had not gone through the firm’s due diligence process to determine the overall appropriateness of utilizing the brokers’ services. In addition, Voeltz’s clients could be subject to further risk if the unapproved brokers were not able to offer best execution in a timely manner for the small-cap share trades. Standard V(A) requires Members and Candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions as well as have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Cadler’s comments indicate the Voeltz team had a reasonable basis for which to swap out of the small-cap holding into the large-cap shares. There is also no evidence Voeltz abandoned their extensive research process nor solely relied on outside parties when reaching their investment decision, both reflecting their independence.", "ko": "Small-cap 매도를 firm due diligence를 거치지 않은 broker로 실행 → diligence 부족(V(A) 위반). Swap 결정 자체는 reasonable basis가 있었다.", "trap": "무엇이 문제인지 구분: 투자 판단(OK) vs 실행 방식(timing·broker, 위반).", "f": "", "why": {"A": "Incorrect. Selling the small-cap shares through non-approved brokers shows a lack of diligence in that the brokers had not gone through the firm’s due diligence process to determine the overall appropriateness of utilizing the brokers’ services. In addition,

ation for the bond is presented in Exhibit 1. Given no default, the value of the AHM01 bond is 100.46.<\/p><p>Based on her assumptions and the information in Exhibit 1, Wang purchases the AHM01 bond at a price equal to its fair value.<\/p><p>Exhibit 1<\/p><table><tr><th>Year<\/th><th>Expected Exposure<\/th><th>Probability of Default<\/th><th>Discount Factor<\/th><\/tr><tr><td>1<\/td><td>105.49<\/td><td>2.25%<\/td><td>0.9524<\/td><\/tr><tr><td>2<\/td><td>105.00<\/td><td>2.20%<\/td><td>0.9115<\/td><\/tr><\/table><p>Wang’s junior analyst estimates that the recovery rate for the AHM01 bond will be 30%. Holding all else equal, Wang considers how this estimate would affect her valuation of the bond.<\/p><p>Wang purchases protection on the AHM01 bond using a single-name CDS. The counterparty for the transaction is XRM Bank. The CDS has a standard annual coupon of 100 basis points and the current market spread on AHM01 bonds is 150 basis points. The initial value of the CDS contract is set to zero.<\/p><p>Finally, Wang makes the following observations regarding two other investment-grade bonds, Bond X and Bond Y, each of which has a 5-year maturity and is option-free:<\/p><p>Bond X trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.25%.<\/p><p>Bond Y trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.75%.<\/p><p>Believing that the disparity in risk premiums is temporary, Wang considers a basis trade.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q38", "rel": [], "los": "Mock 2 Session 1 Q38", "tier": null, "type": "", "stem": "<p>Based on the recovery rate estimated by the junior analyst, the probability of default of the AHM01 bond would be:<\/p>", "options": {"A": "less than 2.25%.", "B": "equal to 2.25%.", "C": "greater than 2.25%."}}]}, {"set": 46, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M3-Q74", "rel": [], "los": "Equity · ECO Module 3 Q74", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information (in $ millions) from a company&#x27;s financial statements:<\/p><table><tr><th><\/th><th>Year 1<\/th><th>Year 2<\/th><\/tr><tr><td>Net income<\/td><td>300<\/td><td>330<\/td><\/tr><tr><td>Interest expense<\/td><td>40<\/td><td>44<\/td><\/tr><tr><td>Net working capital<\/td><td>500<\/td><td>300<\/td><\/tr><tr><td>Gross fixed assets<\/td><td>6,000<\/td><td>6,800<\/td><\/tr><tr><td>Depreciation expense<\/td><td>300<\/td><td>400<\/td><\/tr><tr><td>Long-term debt<\/td><td>5,000<\/td><td>5,700<\/td><\/tr><\/table><p>If the corporate tax rate is 25%, what is the company&#x27;s FCFF (in $ millions) in Year 2?<\/p>", "options": {"A": "–$237", "B": "$163", "C": "$174"}}]}, {"set": 47, "session": 2, "topic": "Economics", "code": "ECO", "vignette": "<p>Sagara, a resource-abundant West African country, has a developing economy with low capital per worker available. President Benjamin Banantoumou appointed Fatima N&#x27;Diarra, PhD, as Economic Development Secretary to help develop economic policies to promote growth.<\/p><p>N&#x27;Diarra believes that according to the classical growth theory, gains in per capita GDP are temporary because the resulting population explosion will lower per capita GDP to subsistence real wage levels. She considers endogenous growth theory to be more realistic, believing that (1) investments, such as the new tire factory, will increase the rate of per capita output growth until the steady state rate of growth is achieved; and (2) investment in research and development will boost growth even further, thus extending the abnormal growth period before diminishing marginal returns eventually set in.<\/p>", "exhibits": [], "qs": [{"id": "Econ:ECO-M2-Q37", "rel": [], "los": "Econ · ECO Module 2 Q37", "tier": null, "type": "", "stem": "<p>N&#x27;Diarra&#x27;s un const SESS_SEC = DATA.sessSec; // 세션별 시간: 문항당 3분
const OFFICIAL = {ETH:[10,15],QM:[5,10],ECO:[5,10],FSA:[10,15],CI:[10,15],EQ:[10,15],DER:[5,10],FI:[10,15],PM:[5,10],AI:[5,10]};

// ---------- flat question list ----------
const QL = [];
DATA.sets.forEach((s, si) => {
  s.qs.forEach(q => { QL.push({q, si, sess: s.session}); });
});
// 문항 번호는 회차 전체 기준 1–88 (Session 2는 45번부터)
QL.forEach((x, i) => { x.no = i + 1; });
const byId = {}; QL.forEach((x, i) => { byId[x.q.id] = i; });
const setRange = si => { const a = QL.map((x, i) => x.si === si ? i : -1).filter(i => i >= 0); return [a[0], a[a.length - 1]]; };
const sessRange = se => { const a = QL.map((x, i) => x.sess === se ? i : -1).filter(i => i >= 0); return [a[0], a[a.length - 1]]; };

// ---------- state ----------
function fresh() {
  return {phase: "start", cur: 0, rem: {1: SESS_SEC[1], 2: SESS_SEC[2]}, answers: {}, flagged: {}, struck: {},
          time: {}, dispute: {}, hl: {}, unlimited: false, startedAt: null, finishedAt: null, sub: {1: false, 2: false}, last: {}, sview: 0,
          paused: false, pausedAt: null, pauseLog: [], savedAt: null, retry: null};
}
let S = fresh();
let dark = false;
function save() { S.savedAt = new Date().toISOString(); try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const v = localStorage.getItem(SKEY); if (v) return JSON.parse(v); } catch (e) {} return null; }
try { dark = localStorage.getItem("agent-mock-dark") === "1"; } catch (e) {}
function applyDark() { document.body.classList.toggle("dark", dark); }

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = t => { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" : "") + String(m).padStart(h ? 2 : 1, "0") + ":" + String(s).padStart(2, "0"); };
function typeset(el) {
  if (!el || typeof renderMathInElement !== "function") return;
  try {
    renderMathInElement(el, {delimiters: [{left: "$$", right: "$$", display: true}, {left: "\\[", right: "\\]", display: true}, {left: "\\(", right: "\\)", display: false}], throwOnError: false, strict: false});
  } catch (e) {}
}
let secret = null;
function getSecret() {
  if (secret) return secret;
  const bin = atob(SECRET_B64), k = KEYS, u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ k.charCodeAt(i % k.length);
  secret = JSON.parse(new TextDecoder().decode(u));
  return secret;
}
const inSession = () => S.phase === "s1" || S.phase === "s2";
// 채점 화면에 보일 문항: 제출한 세션만 (sview = 1·2면 그 세션, 0이면 제출한 세션 전체)
const inView = x => !!S.sub[x.sess] && (!S.sview || x.sess === S.sview);
const gradedIdx = () => QL.map((x, i) => inView(x) ? i : -1).filter(i => i >= 0);
const curSess = () => (S.phase === "s1" || S.phase === "review1") ? 1 : 2;

// ---------- exam flow ----------
function startSession(se) {
  if (!S.startedAt) S.startedAt = new Date().toISOString();
  const [a, b] = sessRange(se), l = S.last[se];
  S.phase = "s" + se; S.cur = l >= a && l <= b ? l : a; lastTick = Date.now(); $("app").dataset.mode = ""; save(); render();
}
function goto(i) { S.cur = i; save(); renderExam(); }
// 메인 화면으로: 풀이 중이던 위치를 기억하고, 메인에 있는 동안은 시간이 흐르지 않는다
function toHub() { if (inSession()) S.last[curSess()] = S.cur; S.phase = "start"; $("app").dataset.mode = ""; save(); render(); }
function submitSession(se) {
  closeOpenPause();
  S.sub[se] = true; S.last[se] = S.cur;
  if (S.sub[1] && S.sub[2]) S.finishedAt = new Date().toISOString();
  S.phase = "start"; $("app").dataset.mode = ""; save(); render();
}
// 채점·복습 열기: se = 1, 2 또는 0(제출한 세션 전체)
function openGraded(se) {
  S.sview = se; S.phase = "done"; S.study = true; S.sfilt = "wf";
  const l = studyList(); S.cur = l.length ? l[0] : gradedIdx()[0]; $("app").dataset.mode = ""; save(); render();
}
// Session 1이 예전 코드에서 시간 종료로 자동 제출된 경우(rem[1] === 0) 다시 열기
function reopenS1() { S.sub[1] = false; S.finishedAt = null; if (S.sview === 1) S.sview = 0; startSession(1); }

// ---------- pause / wall-clock timer ----------
const r3 = x => Math.round(x * 1000) / 1000;
const pausable = () => inSession() || S.phase === "review1" || S.phase === "review2";
let lastTick = Date.now();
function normalizeState(st) {
  const n = Object.assign(fresh(), st);
  if (!Array.isArray(n.pauseLog)) n.pauseLog = [];
  n.paused = !!n.paused; n.pausedAt = n.pausedAt || null;
  // 예전 저장본(세션 순서 고정)은 단계로 제출 여부를 추정
  if (!st || !st.sub) n.sub = {1: ["break", "s2", "review2", "done"].includes(n.phase), 2: n.phase === "done"};
  n.last = n.last || {};
  if (n.phase === "break") n.phase = "start";
  if (n.sview && !n.sub[n.sview]) n.sview = 0;
  if (n.phase === "done" && !n.sub[1] && !n.sub[2]) n.phase = "start";
  if (n.phase === "retry" && !(n.retry && Array.isArray(n.retry.ids) && n.retry.ids.length)) n.phase = "start";
  return n;
}
function pauseSecOf(e, now) { return e.end ? (e.sec || 0) : Math.max(0, ((now || Date.now()) - Date.parse(e.start)) / 1000); }
function pauseTotal() { const now = Date.now(); return S.pauseLog.reduce((a, e) => a + pauseSecOf(e, now), 0); }
function closeOpenPause(endMs) {
  const e = S.pauseLog[S.pauseLog.length - 1];
  if (e && !e.end) { const t = endMs || Date.now(); e.end = new Date(t).toISOString(); e.sec = r3(Math.max(0, (t - Date.parse(e.start)) / 1000)); }
  S.paused = false; S.pausedAt = null;
}
function pauseExam(reason, startMs) {
  if (!pausable() || S.paused) return;
  const t = startMs || Date.now();
  S.paused = true; S.pausedAt = new Date(t).toISOString();
  S.pauseLog.push({start: S.pausedAt, end: null, sec: 0, reason: reason || "manual"});
  save(); syncOverlay();
}
function resumeExam() {
  if (!S.paused) return;
  closeOpenPause(); lastTick = Date.now(); save(); syncOverlay(); updateTimer();
}
function togglePause() { if (S.paused) resumeExam(); else pauseExam("manual"); }
function locText() {
  const se = curSess();
  if (inSession()) { const x = QL[S.cur]; return `Session ${se} · Set ${DATA.sets[x.si].set} · Q ${x.no}/${QL.length}`; }
  return `Session ${se} · 제출 전 확인`;
}
function remText() {
  const se = curSess();
  if (S.unlimited) { const [a, b] = sessRange(se); let sum = 0; for (let i = a; i <= b; i++) sum += S.time[QL[i].q.id] || 0; return fmt(sum) + " 경과 (무제한)"; }
  return S.rem[se] < 0 ? "+" + fmt(-S.rem[se]) + " 초과" : fmt(S.rem[se]);
}
function updateOverlay() {
  const r = $("pv-rem"), p = $("pv-pause"); if (!r || !p) return;
  r.textContent = remText();
  p.textContent = `일시정지 ${S.pauseLog.length}회 · 총 ${fmt(pauseTotal())}`;
}
function syncOverlay() {
  const ov = $("pauseov"), show = S.paused && pausable();
  $("app").style.visibility = show ? "hidden" : "";
  ov.classList.toggle("show", show);
  if (!show) { ov.innerHTML = ""; return; }
  const last = S.pauseLog[S.pauseLog.length - 1] || {};
  const why = {hidden: "탭이 비활성화되어 자동 일시정지", sleep: "장시간 정지 감지(절전·탭 throttling)로 자동 일시정지", reload: "페이지를 다시 열어 일시정지 상태로 복원", import: "Import 후 일시정지 상태로 복원"}[last.reason] || "";
  ov.innerHTML = `<div class="card"><h2>⏸ 일시정지</h2><p class="mut">${esc(locText())}</p>
    <div class="mut">남은 시간</div><div class="big" id="pv-rem"></div>
    <p class="mut" id="pv-pause"></p>${why ? `<p class="mut">${why}</p>` : ""}
    <p class="mut" style="font-size:13px">문항과 선택지는 일시정지 중 가려집니다.</p>
    <button class="pri" id="resumebtn2">재개 (P)</button></div>`;
  $("resumebtn2").onclick = resumeExam;
  $("resumebtn2").focus();
  updateOverlay();
}
function tick() {
  const now = Date.now(), delta = now - lastTick, prev = lastTick;
  lastTick = now;
  if (!pausable()) return;
  if (S.paused) { updateOverlay(); return; }
  if (delta > 10000) { pauseExam("sleep", prev); return; }
  const d = delta / 1000, se = curSess();
  if (inSession()) { const id = QL[S.cur].q.id; S.time[id] = r3((S.time[id] || 0) + d); }
  if (!S.unlimited) {
    S.rem[se] = r3(S.rem[se] - d);
  }
  updateTimer();
  save();
}
function updateTimer() {
  const t = $("timer"); if (!t) return;
  const se = curSess();
  if (S.unlimited) { const [a, b] = sessRange(se); let sum = 0; for (let i = a; i <= b; i++) sum += S.time[QL[i].q.id] || 0; t.textContent = "⏱ " + fmt(sum) + " (무제한)"; t.classList.remove("low"); }
  else { t.textContent = S.rem[se] < 0 ? "⏰ +" + fmt(-S.rem[se]) + " 초과" : fmt(S.rem[se]); t.classList.toggle("low", S.rem[se] < 600); }
}

// ---------- rendering ----------
function render() {
  applyDark();
  const app = $("app");
  document.body.classList.toggle("live", inSession());
  syncOverlay();
  if (S.phase === "start") return renderStart(app);
  if (S.phase === "done") return S.study !== false ? renderStudy() : renderResults(app);
  if (S.phase === "retry") return renderRetry();
  if (S.phase === "review1" || S.phase === "review2") return renderReview(app);
  renderExam();
}
function darkBtn() { return `<button onclick="toggleDark()">🌓</button>`; }
function toggleDark() { dark = !dark; try { localStorage.setItem("agent-mock-dark", dark ? "1" : "0"); } catch (e) {} applyDark(); }

// 저장본 복원: 세션 중이던 상태는 항상 일시정지로 복원 (자동으로 시간이 흐르지 않게)
function restoreFrom(prev) {
  S = normalizeState(prev);
  if (S.phase === "review1") S.phase = "s1";
  if (S.phase === "review2") S.phase = "s2";
  lastTick = Date.now();
  if (inSession() && !S.paused) pauseExam("reload", S.savedAt ? Date.parse(S.savedAt) : Date.now());
  else save();
  render();
}
function sessUsed(se) { const [a, b] = sessRange(se); let t = 0; for (let i = a; i <= b; i++) t += S.time[QL[i].q.id] || 0; return t; }

    }
    return `<div class="card"><h3>Session ${se}</h3><p class="mut">Set ${DATA.sets[QL[a].si].set}–${DATA.sets[QL[b].si].set} · ${tot}문항 · ${Math.round(SESS_SEC[se] / 60)}분</p><p>${st}</p>${btns}</div>`;
  };
  app.innerHTML = `<div class="center"><div style="text-align:right">${darkBtn()}</div>

  <button id="exphub">💾 저장</button>

  ${S.startedAt ? `<button id="resethub">↺ 처음부터 다시</button>` : ""}</div></div>`;
  $("unl").onchange = e => { S.unlimited = e.target.checked; save(); };

// ---------- 다시 풀기: 채점한 세션의 오답·Flag만 골라 한 문항씩 바로 채점 (시험 답안·점수는 그대로) ----------
const RFILT = {wf: "오답+Flag", wrong: "오답", flag: "Flag", all: "전체"};
const retryLabel = (se, f) => (se ? "Session " + se + " " : "") + (RFILT[f] || "전체");
function retryIds(se, f, rows) {
  rows = rows || grade();
  return rows.filter(r => S.sub[r.sess] && (!se || r.sess === se))
    .filter(r => f === "all" || (f === "wrong" && !r.ok) || (f === "flag" && r.flag) || (f === "wf" && (!r.ok || r.flag))).map(r => r.id);
}
function retryBtns(se, rows) {
  return ["wf", "wrong", "flag"].map(f => { const n = retryIds(se, f, rows).length;
    return `<button data-r="${se}:${f}"${n ? "" : " disabled"}>${se ? "" : "전체 "}${RFILT[f]} 다시 풀기 (${n})</button>`; }).join(" ");
}
function startRetry(ids, label) {
  if (!ids.length) return;
  S.retry = {ids, i: 0, res: {}, label, done: false};
  S.phase = "retry"; $("app").dataset.mode = ""; save(); render();
}
function retryStats() {
  const T = S.retry, sec = getSecret(); let ok = 0, bad = 0;
  T.ids.forEach(id => { const v = T.res[id]; if (v) { if (v === sec[id].a) ok++; else bad++; } });
  return {ok, bad, answered: ok + bad, total: T.ids.length};
}
function retryGo(i) { const T = S.retry; if (i < 0 || i >= T.ids.length) return; T.i = i; T.done = false; save(); renderRetry(); }
function retryAnswer(k) { const T = S.retry, id = T.ids[T.i]; if (T.res[id]) return; T.res[id] = k; save(); renderRetry(); }
// 다음: 안 푼 문제면 패스. 마지막 문제에서 패스하면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로
function retryNext() {
  const T = S.retry;
  if (T.i < T.ids.length - 1) return retryGo(T.i + 1);
  const j = T.ids.findIndex((id, k) => !T.res[id] && k !== T.i);
  if (!T.res[T.ids[T.i]] && j >= 0) return retryGo(j);
  T.done = true; save(); renderRetry();
}
function renderRetry() {
  const T = S.retry, app = $("app");

  if (T.done) return renderRetryResult(app);
  const i = byId[T.ids[T.i]], x = QL[i], q = x.q, s = DATA.sets[x.si], id = q.id, sec = getSecret()[id], ans = sec.a, sel = T.res[id] || null, dl = sec.d || {};

      <div id="main"><div id="left"></div><div id="right"></div></div>
      <div id="bottom"><button id="prev">◀ Prev</button><button id="next"></button><div id="nav"></div></div>`;
    $("rhub").onclick = toHub;

    $("prev").onclick = () => retryGo(S.retry.i - 1);
    $("next").onclick = retryNext;
  }
  const st = retryStats();
  $("qinfo").textContent = `${T.i + 1}/${T.ids.length} · S${x.sess} Q${x.no} · Set ${s.set}`;
  $("rscore").textContent = `정답 ${st.ok} · 오답 ${st.bad} · 남음 ${st.total - st.answered}`;
  $("next").textContent = sel ? (T.i === T.ids.length - 1 ? "결과 보기 ▶" : "Next ▶") : "패스 ▶";
  renderLeft(x, renderRetry);
  const R = $("right");
  R.scrollTop = 0;
  R.innerHTML = (sel ? `<div class="sh"><b class="${sel === ans ? "okc" : "warn"}">${sel === ans ? "정답" : "오답"}</b><span class="mut">고른 답 ${sel} · 정답 ${ans}${S.flagged[id] ? " · ⚑ Flag" : ""}</span><span class="tag">${esc(q.los)}</span></div>` : "") +
    `<div class="mut" style="font-size:13px">Question ${x.no}</div><div class="stem">${q.stem}</div>` +
    Object.keys(q.options).map(k => sel
      ? `<div class="opt ${k === ans ? "right" : (k === sel ? "wrong" : "")}"><span class="l">${k}</span><span class="t">${q.options[k]}${k !== ans && dl[k] ? `<div class="why">${esc(dl[k])}</div>` : ""}</span>${k === sel ? "<span class='tag'>고른 답</span>" : ""}${k === ans ? "<span class='tag'>정답</span>" : ""}</div>`
      : `<div class="opt" data-k="${k}"><span class="l">${k}</span><span class="t">${q.options[k]}</span></div>`).join("") +
    (sel ? `${noteHTML(sec)}<details class="raw"><summary>원문 해설 (출처 포함)</summary><div class="expl">${esc(sec.e)}</div></details>` : "");
  if (!sel) R.querySelectorAll(".opt").forEach(o => o.onclick = () => retryAnswer(o.dataset.k));
  typeset(R);
  const sc = getSecret();
  $("nav").innerHTML = T.ids.map((rid, k) => { const v = T.res[rid];
    return `<button class="nb${v ? (v === sc[rid].a ? " rok" : " nno") : ""}${k === T.i ? " cur" : ""}${S.flagged[rid] ? " fl" : ""}" data-k="${k}" title="S${QL[byId[rid]].sess} Q${QL[byId[rid]].no}">${QL[byId[rid]].no}</button>`; }).join("");

function renderRetryResult(app) {

    <p class="mut">시험 점수·답안은 바뀌지 않습니다.</p></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="pri" id="rwrong"${wrong.length ? "" : " disabled"}>틀린 문제만 다시 풀기 (${wrong.length})</button>
    ${open >= 0 ? `<button id="ropen">안 푼 문제 풀기 (${st.total - st.answered})</button>` : ""}
    <button id="rback">문제로 돌아가기</button><button id="rexp">💾 저장</button></div></div>`;
  $("rhub2").onclick = toHub;
  $("rwrong").onclick = () => startRetry(wrong, T.label.replace(/ · 틀린 문제$/, "") + " · 틀린 문제");
  if ($("ropen")) $("ropen").onclick = () => retryGo(open);
  $("rback").onclick = () => retryGo(T.i);
  $("rexp").onclick = exportJSON;
}

// ---------- grading ----------
function grade() {
  const sec = getSecret();
  const rows = QL.map((x, i) => {
    const q = x.q, id = q.id, sel = S.answers[id] || null, ans = sec[id].a, s = DATA.sets[x.si];
    return {i, id, x, q, set: s.set, sess: x.sess, code: s.code, topic: s.topic, los: q.los, tier: q.tier, sel, ans,
            ok: sel === ans, time: S.time[id] || 0, flag: !!S.flagged[id]};
  });
  return rows;
}
const pct = (n, d) => d ? Math.round(1000 * n / d) / 10 : 0;
const bar = p => `<div class="bar"><i style="width:${p}%"></i></div>`;
function agg(rows, keyf) {
  const m = {};
  rows.forEach(r => { const k = keyf(r); (m[k] = m[k] || {n: 0, c: 0, t: 0}); m[k].n++; m[k].c += r.ok ? 1 : 0; m[k].t += r.time; });
  return m;
}
const pauseLine = () => `일시정지 ${S.pauseLog.length}회 · 총 ${fmt(pauseTotal())}`;
function renderResults(app) {
  app.dataset.mode = "results";
  const rows = grade().filter(r => inView(r.x)), n = rows.length, c = rows.filter(r => r.ok).length;
  app.innerHTML = `<div id="top"><button id="tohub2">◀ 메인</button><b>Mock ${MOCK} — ${S.sview ? "Session " + S.sview + " " : ""}결과</b><span class="grow"></span><button class="pri" id="studybtn">◀ 문제 화면으로 복습</button>${darkBtn()}</div><div class="center" id="res" style="overflow:auto"></div>`;
  $("studybtn").onclick = () => openStudy(S.cur);
  $("tohub2").onclick = toHub;
  const s1 = rows.filter(r => r.sess === 1), s2 = rows.filter(r => r.sess === 2), fl = rows.filter(r => r.flag), m = agg(rows, r => r.code);
  $("res").innerHTML = `<div class="card"><h2>${c} / ${n} (${pct(c, n)}%)</h2>
      <p>${[[1, s1], [2, s2]].filter(z => z[1].length).map(([k, ss]) => `Session ${k}: ${ss.filter(r => r.ok).length}/${ss.length} (${pct(ss.filter(r => r.ok).length, ss.length)}%)`).join(" · ")}</p>
      <p class="mut">비공식 참고선 ~65–70% (CFA Institute는 합격선을 공개하지 않음). ${S.unlimited ? "<b class='warn'>※ 시간 무제한 모드로 응시</b>" : ""}${[1, 2].filter(k => S.rem[k] < 0 && rows.some(r => r.sess === k)).map(k => ` <b class='warn'>※ Session ${k} 시간 초과 +${fmt(-S.rem[k])}</b>`).join("")}</p>
      <p>${pauseLine()}</p>
      <p>미응답 ${rows.filter(r => !r.sel).length}문항 · Flag ${fl.length}문항 (정답률 ${pct(fl.filter(r => r.ok).length, fl.length)}%)</p></div>
    <div class="card"><h3>Topic</h3><table class="r"><tr><th>Topic</th><th class="n">정답/문항</th><th class="n">정답률</th><th></th><th class="n">본 회차 비중</th><th class="n">CFAI 공식 비중</th></tr>` +
      Object.keys(m).sort((a, b) => pct(m[a].c, m[a].n) - pct(m[b].c, m[b].n)).map(k => `<tr><td>${k}</td><td class="n">${m[k].c}/${m[k].n}</td><td class="n">${pct(m[k].c, m[k].n)}%</td><td>${bar(pct(m[k].c, m[k].n))}</td><td class="n">${pct(m[k].n, n)}%</td><td class="n">${OFFICIAL[k] ? OFFICIAL[k][0] + "–" + OFFICIAL[k][1] + "%" : "-"}</td></tr>`).join("") + `</table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="expbtn">Export JSON</button><button id="impbtn2">Import JSON</button><input type="file" id="impfile2" accept=".json" style="display:none"><button id="resetbtn">초기화 후 처음으로</button></div>`;
  $("expbtn").onclick = exportJSON; $("impbtn2").onclick = () => $("impfile2").click();
  $("impfile2").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importJSON(r.result); r.readAsText(f); };
  $("resetbtn").onclick = () => { if (confirm("저장된 진행 상황을 삭제하고 처음으로 돌아갑니다. Export 했는지 확인하세요.")) { S = fresh(); try { localStorage.removeItem(SKEY); } catch (e) {} render(); } };
}
// ---------- export / import ----------
function exportJSON() {
  save();
  // 정답은 제출한 세션 문항만 기록
  const rows = (S.sub[1] || S.sub[2]) ? grade() : null, answers = {};
  QL.forEach(x => { const id = x.q.id; if (S.answers[id] || S.time[id]) answers[id] = {selected: S.answers[id] || null, correct: rows && S.sub[x.sess] ? rows[byId[id]].ans : null, time: S.time[id] || 0}; });
  const answered = Object.keys(S.answers).length, correct = rows ? rows.filter(r => S.sub[r.sess] && r.ok).length : null;
  const ansSub = rows ? rows.filter(r => S.sub[r.sess] && r.sel).length : 0;
  const attempt = {exportedAt: new Date().toISOString(), exportedFrom: "ecoxquiz_" + MOCK + ".html", phase: S.phase,
    totalQuestions: QL.length, answered, correct, wrong: rows ? ansSub - correct : null,
    state: {answers, timeSpentSec: Math.round(Object.values(S.time).reduce((a, b) => a + b, 0)), flagged: S.flagged, struck: S.struck, dispute: S.dispute,
            phase: S.phase, submitted: S.sub, last: S.last, sview: S.sview, unlimited: S.unlimited, remaining: S.rem, cur: S.cur, startedAt: S.startedAt, finishedAt: S.finishedAt,
            paused: S.paused, pausedAt: S.pausedAt, pauseLog: S.pauseLog, pauseSummary: {count: S.pauseLog.length, totalSec: Math.round(pauseTotal())}, retry: S.retry}};
  const d = new Date(), date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const o = {subject: SUBJECT, date, latest: {phase: S.phase, totalQuestions: QL.length, answered, correct, wrong: attempt.wrong}, attempts: [attempt]};
  const blob = new Blob([JSON.stringify(o, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = SUBJECT + "_results_" + date + ".json";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return o;
}
function importJSON(txt, quiet) {
  try {
    let o = typeof txt === "string" ? JSON.parse(txt) : txt;
    if ((o.subject === SUBJECT || o.subject === OLD_SUBJECT) && Array.isArray(o.attempts) && o.attempts.length) o = o.attempts[o.attempts.length - 1];
    else if (o.subject !== "agent-mock-" + MOCK) { if (!quiet) alert("다른 회차의 파일입니다: " + o.subject); return; }
    const st = o.state, n = fresh();
    Object.keys(st.answers || {}).forEach(id => { if (byId[id] !== undefined && st.answers[id].selected) { n.answers[id] = st.answers[id].selected; } n.time[id] = st.answers[id].time || 0; });
    n.flagged = st.flagged || {}; n.struck = st.struck || {}; n.dispute = st.dispute || {};
    n.unlimited = !!st.unlimited; n.rem = st.remaining || n.rem; n.startedAt = st.startedAt || null; n.finishedAt = st.finishedAt || null;
    n.phase = st.phase || "s1"; n.cur = st.cur || 0;
    n.pauseLog = Array.isArray(st.pauseLog) ? st.pauseLog.map(e => Object.assign({}, e)) : [];
    n.sub = st.submitted; n.last = st.last || {}; n.sview = st.sview || 0; n.retry = st.retry || null;
    S = normalizeState(n); lastTick = Date.now();
    // 열려 있던 일시정지는 export 시각에서 닫고, 세션 중이면 지금부터 새 일시정지로 복원
    const open = S.pauseLog[S.pauseLog.length - 1];
    if (open && !open.end) closeOpenPause(Math.max(Date.parse(open.start), Date.parse(o.exportedAt) || 0));
    S.paused = false; S.pausedAt = null;
    if (inSession() || S.phase === "review1" || S.phase === "review2") { if (S.phase === "review1") S.phase = "s1"; if (S.phase === "review2") S.phase = "s2"; pauseExam("import"); }
    save(); render();
  } catch (e) { if (!quiet) alert("Import 실패: " + e.message); }
}
// GitHub의 results/Mock{N}/latest.json이 이 브라우저 저장본보다 최신이면 자동 복원
// 비교는 페이지를 열 때 다시 저장하기 전의 savedAt으로 한다(열자마자 save()가 savedAt을 지금으로 바꾸기 때문)
function loadRemote(localSavedAt) {
  if (!window.fetch) return;
  fetch("results/" + SUBJECT + "/latest.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || d.subject !== SUBJECT || !Array.isArray(d.attempts) || !d.attempts.length) return;
    const at = d.attempts[d.attempts.length - 1];
    if ((at.exportedAt || "") > (localSavedAt || "")) importJSON(d, true);
  }).catch(() => {});
}
// ---------- boot ----------
window.__mock = {get S() { return S; }, pauseExam, resumeExam, pauseTotal, QL, grade, exportJSON, submitSession, startSession, openGraded, render, getSecret};
document.addEventListener("DOMContentLoaded", () => {
  const prev = load();
  if (prev) restoreFrom(prev); else render();
  lastTick = Date.now();
  setInterval(tick, 1000);
  loadRemote(prev && prev.savedAt);
  window.addEventListener("beforeunload", save);
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if ((document.hidden || document.visibilityState === "hidden") && pausable()) pauseExam("hidden"); });
  // 복사 시 KaTeX 수식을 노션 inline LaTeX($...$) 텍스트로 바꿔 넣는다 (display 수식도 inline으로)
  document.addEventListener("copy", e => {
    const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
    const r = sel.getRangeAt(0).cloneRange();
    const mathOf = n => { const el = n.nodeType === 1 ? n : n.parentElement; return el && (el.closest(".katex-display") || el.closest(".katex")); };
    let k;
    if ((k = mathOf(r.startContainer))) r.setStartBefore(k);
    if ((k = mathOf(r.endContainer))) r.setEndAfter(k);
    const box = document.createElement("div"); box.appendChild(r.cloneContents());
    const ms = [...box.querySelectorAll(".katex-display, .katex")];
    if (!ms.length) return;
    // 본문의 통화 기호 $는 수식 구분자로 오인되지 않게 \$로
    const tw = document.createTreeWalker(box, NodeFilter.SHOW_TEXT), tn = [];
    while (tw.nextNode()) if (!tw.currentNode.parentElement?.closest(".katex")) tn.push(tw.currentNode);
    tn.forEach(n => { n.nodeValue = n.nodeValue.replace(/\$/g, "\\$"); });
    ms.forEach(m => { if (!box.contains(m)) return; const a = m.querySelector('annotation[encoding="application/x-tex"]'); m.replaceWith(a ? "$" + a.textContent.trim().replace(/\s+/g, " ") + "$" : m.textContent); });
    box.style.cssText = "position:fixed;left:-99999px;top:0;white-space:pre-wrap";
    document.body.appendChild(box);
    let t = box.innerText; box.remove();
    t = t.replace(/(\$[^$\n]+\$)(?=[가-힣])/g, "$1 ").replace(/([가-힣])(?=\$[^$\n]+\$)/g, "$1 ");
    e.preventDefault(); e.clipboardData.setData("text/plain", t);
  });
  document.addEventListener("keydown", e => {
    if (S.phase === "retry" && S.retry && !S.retry.done && !/TEXTAREA|INPUT/.test(e.target.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === "ArrowRight" || e.key === "Enter") retryNext(); else if (e.key === "ArrowLeft") retryGo(S.retry.i - 1);
      else if ("abcABC".includes(e.key) && e.key.length === 1) retryAnswer(e.key.toUpperCase());
      return;
    }
    if (S.phase === "done" && S.study !== false && !/TEXTAREA|INPUT/.test(e.target.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === "ArrowRight") studyStep(1); else if (e.key === "ArrowLeft") studyStep(-1);
      return;
    }
    if (!pausable() || /TEXTAREA|INPUT/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); return; }
    if (S.paused || !inSession()) return;
    const x = QL[S.cur], [a, b] = sessRange(x.sess);
    if (e.key === "ArrowRight" && S.cur < b) goto(S.cur + 1);
    else if (e.key === "ArrowLeft" && S.cur > a) goto(S.cur - 1);
    else if ("abcABC".includes(e.key) && e.key.length === 1) { S.answers[x.q.id] = e.key.toUpperCase(); save(); renderExam(); }
  });
  window.addEventListener("load", () => { if (S.phase === "done" || S.phase === "retry") { $("app").dataset.mode = ""; render(); } else if (inSession()) typeset($("app")); });
});

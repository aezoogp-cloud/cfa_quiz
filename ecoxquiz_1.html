uity Tier 1 capital. Selected data are shown in Exhibit 1.<\/p>\n<p>For Brackwater, Okonkwo computes underwriting ratios using statutory definitions: the loss and loss adjustment expense ratio is based on net premiums earned, and the underwriting expense ratio is based on net premiums written. Brackwater's data are shown in Exhibit 2.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Corvane Bank — Capital Data<\/caption><thead><tr><th>Item (€ millions), 31 December 2025<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Common stock and additional paid-in capital<\/td><td>380<\/td><\/tr><tr><td>Retained earnings<\/td><td>410<\/td><\/tr><tr><td>Accumulated other comprehensive income<\/td><td>15<\/td><\/tr><tr><td>Goodwill and other intangible assets<\/td><td>95<\/td><\/tr><tr><td>Deferred tax assets<\/td><td>40<\/td><\/tr><tr><td>Non-cumulative perpetual preferred stock (discretionary dividends)<\/td><td>30<\/td><\/tr><tr><td>Subordinated debt issued 2023, original maturity 8 years<\/td><td>290<\/td><\/tr><tr><td>Subordinated debt issued 2024, original maturity 4 years<\/td><td>60<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>12,000<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Brackwater Insurance — Underwriting Data<\/caption><thead><tr><th>€ millions<\/th><th>2024<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Net premiums written<\/td><td>2,560<\/td><td>2,840<\/td><\/tr><tr><td>Net premiums earned<\/td><td>2,480<\/td><td>2,650<\/td><\/tr><tr><td>Losses and loss adjustment expenses<\/td><td>1,560<\/td><td>1,850<\/td><\/tr><tr><td>Underwriting expenses<\/td><td>840<\/td><td>905<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s16-q1", "rel": [], "los": "Agent Mock 1 Q61", "tier": null, "type": "", "stem": "Which of Okonkwo's observations is <i>least likely<\/i> to be fully addressed by a CAMELS analysis of Corvane?", "options": {"A": "Observation 1", "B": "Observation 2", "C": "Observation 3"}}]}, {"set": 23, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>John Smith, an advisor at Godel Securities, is meeting with one of his clients, Client A, to provide advice on fixed income investments. Client A currently has investments in Country 1 and Country 2. Smith first analyzes the fixed income market in Country 1. In Exhibit 1, he gathers spot rates (with annual compounding) for government zero-coupon bonds, as well as swap spreads, for maturities of one, two, and three years. He uses that information to construct a forward curve.<\/p><p>Exhibit 1<\/p><table><tr><th>Maturity (years)<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><td>Government spot rate<\/td><td>3%<\/td><td>5%<\/td><td>8%<\/td><\/tr><tr><td>Swap spread<\/td><td>0.20%<\/td><td>0.25%<\/td><td>0.40%<\/td><\/tr><\/table><p>Smith tells Client A that there are a number of theories that attempt to explain the shape of the yield curve. While the computation of forward rates is straightforward, Smith states that he believes forward rates are upwardly biased predictors of future spot rates.<\/p><p>In Country 2, there is uncertainty about how the government will manage inflation. Smith evaluates the effect on Client A&#x27;s portfolio from changes in the yields on 1-year, 3-year and 10-year securities. Selected key rate durations for the portfolio as well as Smith&#x27;s expected change in interest rates at each key rate are shown in Exhibit 2.<\/p><p>Exhibit 2<\/p><table><tr><th>Security<\/th><th>Key Rate Duration<\/th><th>Expected Key Rate Change<\/th><\/tr><tr><td>1-year<\/td><td>0.50<\/td><td>1.00%<\/td><\/tr><tr><td>3-year<\/td><td>0.75<\/td><td>0.75%<\/td><\/tr><tr><td>10-year<\/td><td>2.50<\/td><td>–0.25%<\/td><\/tr><\/table><p>Smith computes the percentage change in the value of the portfolio. He observes that the average change in the three rates is 0.50%.<\/p><p>Smith also advises Client A on an actively managed corporate bond portfolio in Country 2 using the swap spread as a measure of risk. Smith discusses the implied credit and liquidity risk with Client A using the 5-year swap rate as an example. The 5-year government and corresponding fixed swap rate at selected times over the last 12 months is presented in Exhibit 3.<\/p><p>Exhibit 3<\/p><table><tr><th>Period<\/th><th>Government Bond Yield (%)<\/th><th>Fixed Swap Rate (%)<\/th><\/tr><tr><td>1 month ago<\/td><td>7.48<\/td><td>8.28<\/td><\/tr><tr><td>6 months ago<\/td><td>8.51<\/td><td>8.86<\/td><\/tr><tr><td>12 months ago<\/td><td>8.55<\/td><td>8.84<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q14", "rel": [], "los": "Mock 1 Session 1 Q14", "tier": null, "type": "", "stem": "<p>Which of the following term structure theories of interest rates is most consistent with Smith&#x27;s beliefs?<\/p>", "options": {"A": "Preferred habitat", "B": "Liquidity preference", "C": "Unbiased expectations"}}]}, {"set": 24, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Ryan Leigh is preparing a presentation that analyzes the valuation of the common stock of two companies under consideration as additions to his firm’s recommended list, Emerald Corporation and Holt Corporation. Leigh has prepared preliminary valuations of both companies using an FCFE model and is also preparing a value estimate for Emerald using a dividend discount model. Holt’s 2019 and 2020 financial statements, contained in Exhibit 1 and Exhibit 2, are prepared in accordance with US GAAP.<\/p><p>Exhibit 1<\/p><p>Holt Corporation Consolidated Balance Sheets (US$ Millions)<\/p><table><tr><th><\/th><th><\/th><th><\/th><th>As of 31 December<\/th><th><\/th><th><\/th><th><\/th><th><\/th><\/tr><tr><td><\/td><td><\/td><td><\/td><td>2020<\/td><td><\/td><td><\/td><td><\/td><td>2019<\/td><\/tr><\/table><p>Assets<\/p><p>Current assets<\/p><table><tr><th>Cash and cash equivalents<\/th><th><\/th><th><\/th><th>$ 372<\/th><th><\/th><th><\/th><th><\/th><th>$ 315<\/th><\/tr><tr><td>Accounts receivable<\/td><td><\/td><td><\/td><td>770<\/td><td><\/td><td><\/td><td><\/td><td>711<\/td><\/tr><tr><td>Inventories<\/td><td><\/td><td><\/td><td>846<\/td><td><\/td><td><\/td><td><\/td><td>780<\/td><\/tr><tr><td>Total current assets<\/td><td><\/td><td><\/td><td>1,988<\/td><td><\/td><td><\/td><td><\/td><td>1,806<\/td><\/tr><tr><td>Gross fixed assets<\/td><td>4,275<\/td><td><\/td><td><\/td><td><\/td><td>3,752<\/td><td><\/td><td><\/td><\/tr><tr><td>Less: Accumulated depreciation<\/td><td>1,176<\/td><td><\/td><td>3,099<\/td><td><\/td><td>906<\/td><td><\/td><td>2,846<\/td><\/tr><tr><td>Total assets<\/td><td><\/td><td><\/td><td>$5,087<\/td><td><\/td><td><\/td><td><\/td><td>$4,652<\/td><\/tr><\/table><p>Liabilities and shareholders’ equity<\/p><p>Current liabilities<\/p><table><tr><th>Accounts payable<\/th><th><\/th><th><\/th><th>$ 476<\/th><th><\/th><th><\/th><th><\/th><th>$ 443<\/th><\/tr><tr><td>Accrued taxes and expenses<\/td><td><\/td><td><\/td><td>149<\/td><td><\/td><td><\/td><td><\/td><td>114<\/td><\/tr><tr><td>Notes payable<\/td><td><\/td><td><\/td><td>465<\/td><td><\/td><td><\/td><td><\/td><td>450<\/td><\/tr><tr><td>Total current liabilities<\/td><td><\/td><td><\/td><td>1,090<\/td><td><\/td><td><\/td><td><\/td><td>1,007<\/td><\/tr><tr><td>Long-term debt<\/td><td><\/td><td><\/td><td>1,575<\/td><td><\/td><td><\/td><td><\/td><td>1,515<\/td><\/tr><tr><td>Common stock<\/td><td><\/td><td><\/td><td>525<\/td><td><\/td><td><\/td><td><\/td><td>525<\/td><\/tr><tr><td>Retained earnings<\/td><td><\/td><td><\/td><td>1,897<\/td><td><\/td><td><\/td><td><\/td><td>1,605<\/td><\/tr><tr><td>Total liabilities and shareholders’ equity<\/td><td><\/td><td><\/td><td>$5,087<\/td><td><\/td><td><\/td><td><\/td><td>$4,652<\/td><\/tr><\/table><p>Exhibit 2<\/p><p>Holt Corporation Consolidated Income Statement for the Year Ended 31 December 2020 (US$ Millions)<\/p><table><tr><th>Total revenues<\/th><th>$3,323<\/th><\/tr><tr><td>Cost of goods sold<\/td><td>1,287<\/td><\/tr><tr><td>Selling, general, and administrative expenses<\/td><td>858<\/td><\/tr><tr><td>Earnings before interest, taxes, depreciation, and amortization (EBITDA)<\/td><td>1,178<\/td><\/tr><tr><td>Depreciation expense<\/td><td>270<\/td><\/tr><tr><td>Operating income<\/td><td>908<\/td><\/tr><tr><td>Interest expense<\/td><td>195<\/td><\/tr><tr><td>Pretax income<\/td><td>713<\/td><\/tr><tr><td>Income tax (at 32%)<\/td><td>228<\/td><\/tr><tr><td>Net income<\/td><td>$ 485<\/td><\/tr><\/table><p>Leigh presents his valuations of the common stock of Emerald and Holt to his supervisor, Alice Smith. Smith has the following questions and comments:<\/p><p>“I estimate that Emerald’s long-term expected dividend payout rate is 20% and its return on equity is 10% over the long term.”<\/p><p>“Why did you use an FCFE model to value Holt’s common stock? Can you use a DDM instead?”<\/p><p>“How did Holt’s FCFE for 2008 compare with its FCFF for the same year? I recommend you use an FCFF model to value Holt’s common stock instead of using an FCFE model because Holt has had a history of leverage changes in the past.”<\/p><p>“In the last three years, about 5% of Holt’s growth in FCFE has come from decreases in inventory.”<\/p><p>Leigh responds to each of Smith’s points as follows:<\/p><p>“I will use your estimates and calculate Emerald’s long-term, sustainable dividend growth rate.”<\/p><p>“There are two reasons why I used the FCFE model to value Holt’s common stock instead of using a DDM. The first reason is that Holt’s dividends have differed significantly from its capacity to pay dividends. The second reason is that Holt is a takeover target and once the company is taken over, the new owners will have discretion over the uses of free cash flow.”<\/p><p>“I will calculate Holt’s FCFF for 2020 and estimate the value of Holt’s common stock using an FCFF model.”<\/p><p>“Holt is a growing company. In forecasting either Holt’s FCFE or FCFF growth rates, I will not consider decreases in inventory to be a long-term source of growth.”<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M3-Q27", "rel": [], "los": "Equity · ECO Module 3 Q27", "tier": null, "type": "", "stem": "<p>Leigh’s comment about not considering decreases in inventory to be a source of long-term growth in free cash flow for Holt is:<\/p>", "options": {"A": "inconsistent with a forecasting perspective.", "B": "mistaken because decreases in inventory are a use rather than a source of cash.", "C": "consistent with a forecasting perspective because inventory reduction has a limit, particularly for a growing firm."}}]}, {"set": 25, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Minneapolis Viking Arbitrageurs, LLC (MVA), is a fledgling US-based hedge fund having slightly more than $50 million in assets under management. MVA specializes in owning and managing small-sized properties in agriculture, forestry, and mining.<\/p><p>Jim Hester, MVA’s merger and acquisition (M&amp;A) analyst is evaluating Fargo Durum Farms, Inc. (FDF) for a potential acquisition. FDF owns 1,500 acres of fertile land, farm buildings, machinery, residential quarters, livestock, cattle feed, seeds, grain, significant amounts of intangible assets, and so on. Selected data from FDF’s income statement for the previous year ended and additional estimates compiled by Hester are presented in Exhibits 1 and 2.<\/p><p>Exhibit 1 FDF’s Select Financial Data for the Previous Year Ended<\/p><table><tr><th>Gross revenues from crops, livestock, feed, and so on<\/th><th>$2,500,000<\/th><\/tr><tr><td>Cost of goods sold<\/td><td>1,000,000<\/td><\/tr><tr><td>Selling, general, and administrative expenses (SG&amp;A)<\/td><td>900,000<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><p>Notes:<\/p><p>1) FDF carries debt in the amount of $750,000 at an interest rate of 8%, and it comprises 30% of total assets on a book value basis. Debt will be a part of the acquisition transaction.<\/p><p>2) FDF holds $200,000 in cash and short-term investments, but it will not be a part of the assets under acquisition transaction.<\/p><p>Exhibit 2 Additional Data and Hester’s Estimates for Normalization<\/p><table><tr><th>1.<\/th><th>The cost of goods sold ratio should be higher at 45%.<\/th><\/tr><tr><td>2.<\/td><td>SG&amp;A includes $400,000 in owners’ compensation. According to Hester’s research, owners’ compensation expense for similar sized farms is $200,000.<\/td><\/tr><tr><td>3.<\/td><td>A ranch and living quarters are not required for the farm’s core operations. The reported SG&amp;A expenses include $100,000 for operating expenses relating to those properties. The ranch and living quarters will be kept by the current owners and are not a part of FDF’s farming operations being considered for purchase by the hedge fund.<\/td><\/tr><tr><td>4.<\/td><td>For pro forma estimations, Hester will consider depreciation and amortization at 10% of gross revenues. He thinks the current tax rate of 30% is reasonable.<\/td><\/tr><\/table><p>First, Hester assesses FDF’s normalized operating income after tax. Next, Hester values FDF’s equity starting with the free cash flow to the firm (FCFF) with the data and assumptions in Exhibit 3.<\/p><p>Exhibit 3 FDF’s Data and Estimates for Valuing Its Equity<\/p><table><tr><th>FCFF for Current Year<\/th><th>$336,250<\/th><\/tr><tr><td>FCFF annual growth rate for the foreseeable future<\/td><td>5%<\/td><\/tr><tr><td>FDF’s debt holding at an interest rate of 8.0% per year<\/td><td>$750,000<\/td><\/tr><tr><td>FDF’s weighted average cost of capital (WACC)<\/td><td>11.50%<\/td><\/tr><tr><td>FDF’s cost of equity<\/td><td>14.00%<\/td><\/tr><\/table><p>Hester presents his initial assessment and valuation of FDF to MVA’s investment committee. The following are comments and suggestions from some members on the committee.<\/p><p>Xavier Moreno, commodities analyst, suggests the use of the excess earnings method (EEM) for valuing FDF and makes the following three statements in support of his preference:<\/p><p>Statement 1: EEM involves estimating the earnings remaining before deducting amounts that reflect the required returns to the tangible assets.<\/p><p>Statement 2: EEM is a widely-used method for valuing entire private businesses similar to FDF.<\/p><p>Statement 3: EEM is especially useful for valuing FDF because it allows for valuing working capital, fixed assets, and intangibles using different discount rates.<\/p><p>Jamal Bahrami, the external consultant on the committee, differs from Hester and prefers the use of the free cash flow to equity (FCFE) model. Furthermore, he develops his own estimates for valuing FDF&#x27;s equity, shown in Exhibit 4.<\/p><p>Exhibit 4 Bahrami’s Estimates for Valuing FDF’s Equity<\/p><table><tr><th>1.<\/th><th>In current year, FDF will:<\/th><\/tr><\/table><p>realize $1,000,000 in cash flow from operations.<\/p><p>require $400,000 in new capital investment.<\/p><p>need additional borrowing in the amount of $250,000 at an interest cost of 8%.<\/p><table><tr><th>2.<\/th><th>Because of the continued strength in the global demand for wheat, FDF will experience a higher annual growth rate of 10% for the following year; thereafter, it will grow at a constant rate of 6% per year.<\/th><\/tr><tr><td>3.<\/td><td>Because of illiquidity and small-firm risk premiums, the appropriate WACC and required return on equity will be higher at 12.9% and 16%, respectively.<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Equity:ECO-M3-Q63", "rel": [], "los": "Equity · ECO Module 3 Q63", "tier": null, "type": "", "stem": "<p>According to the approach preferred by Bahrami and using the estimates developed by him in Exhibit 4, the value of FDF’s equity as of the previous year end is closest to:<\/p>", "options": {"A": "$8,554,891.", "B": "$8,793,104.", "C": "$12,755,292."}}, {"id": "Equity:ECO-M6-Q26", "rel": [], "los": "Equity · ECO Module 6 Q26", "tier": null, "type": "", "stem": "<p>Using the company’s data and Hester’s assessments and estimates in Exhibits 1 and 2, FDF’s normalized operating income after taxes for the previous year is closest to:<\/p>", "options": {"A": "$325,500.", "B": "$367,500.", "C": "$402,500."}}, {"id": "Equity:ECO-M6-Q27", "rel": [], "los": "Equity · ECO Module 6 Q27", "tier": null, "type": "", "stem": "<p>Using the data and assumptions in Exhibit 3 compiled by Hester, FDF’s value of equity as at the end of the previous year is closest to:<\/p>", "options": {"A": "$2,986,111.", "B": "$4,423,077.", "C": "$4,681,731."}}]}, {"set": 26, "session": 2, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Corvane Asset Management is a mid-sized investment adviser that manages separate accounts for institutions and wealthy families. Nikolai Brandt, CFA, has managed Corvane's small-cap equity strategy for six years. Brandt reports to Sofia Marchetti, CFA, Corvane's head of equities, who supervises the firm's eight portfolio managers and analysts.<\/p>\n<p>In early March, Brandt accepts an offer to join Tessaro Capital, a competitor, and gives Corvane the four weeks' notice required by his employment contract. During the notice period, Brandt continues to manage his portfolios. In the evenings, he signs a lease for a home office and registers with Tessaro's regulator, which he must do before starting his new job. He also uses his personal mobile phone to call three of his largest clients. He tells them he is moving to Tessaro and that \"the strategy will come with me, so it would be easy to move your accounts over once I start.\" On his last week at Corvane, he copies the spreadsheet containing the stock-screening model he built while at Corvane onto a personal USB drive. Corvane's employment contract states that all work product created by employees belongs to the firm.<\/p>\n<p>Two weeks before Brandt's departure date, one of these clients calls Marchetti to ask whether Corvane would charge a fee for transferring the account. That is how Marchetti learns of Brandt's calls. Corvane's compliance manual is reviewed every year and covers personal trading, gifts, and trade allocation, but it contains no procedures for employees who resign, such as restricting system access or reviewing their client contacts.<\/p>\n<p>Brandt's portfolios will be taken over by Daniel Osei, CFA, a senior analyst. Osei has been studying Verdana Foods, a small-cap holding. He combines shipment data purchased from a commercial data vendor, his own counts of Verdana products on the shelves of 40 grocery stores, and the public financial statements of Verdana's largest packaging supplier. During a routine call, Verdana's investor relations officer tells him that \"the new plant is running on schedule,\" a comment that adds little to what the company said publicly at its last results. From all of this, Osei concludes that Verdana's quarterly earnings will be well above consensus, and he buys Verdana shares for the small-cap accounts.<\/p>\n<p>Ana Ruiz, a research associate on Osei's team, took the CFA Level II exam the previous weekend. On her public social media profile, she posts: \"So glad I spent extra hours on swap valuation; it paid off on exam day! Still think the testing window is too short, though.\"<\/p>", "exhibits": [], "qs": [{"id": "cMock1:m1-s22-q4", "rel": [], "los": "Agent Mock 1 Q88", "tier": null, "type": "", "stem": "Does Ruiz's social media post violate Standard VII(A) Conduct as Participants in CFA Institute Programs?", "options": {"A": "Yes, because it reveals a topic that was tested on the exam.", "B": "Yes, because it publicly criticizes a CFA Institute exam policy.", "C": "No, because it does not disclose any specific exam question."}}]}, {"set": 27, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Terra Mercado is a retailer that compensates employees with a DB pension plan and stock options in addition to short-term benefits and a DC plan. Terra Mercado prepares its financial statements in accordance with US GAAP and reports in BRL.<\/p><p>Peter Friedland, CFA, is an equity analyst concerned with earnings quality. He is particularly interested in whether the discretionary assumptions the company is making regarding compensation plans are contributing to the recent earnings growth at Terra Mercado. He gathers information from the company’s regulatory filings regarding the pension plan assumptions and assumptions related to option valuation for the three years ended 31 December 20X3.<\/p><p>Assumptions Used for Terra Mercado DB Plan<\/p><table><tr><th><\/th><th>20X3<\/th><th>20X2<\/th><th>20X1<\/th><\/tr><tr><td>Expected long-term rate of return on plan assets<\/td><td>6.06%<\/td><td>6.14%<\/td><td>6.79%<\/td><\/tr><tr><td>Discount rate used to estimate pension obligation at beginning of year<\/td><td>4.85%<\/td><td>4.94%<\/td><td>5.38%<\/td><\/tr><tr><td>Estimated salary growth rate<\/td><td>4.00%<\/td><td>4.44%<\/td><td>4.25%<\/td><\/tr><tr><td>Estimated inflation rate<\/td><td>3.00%<\/td><td>2.72%<\/td><td>2.45%<\/td><\/tr><\/table><p>Assumptions Used for Terra Mercado Option Grants<\/p><table><tr><th><\/th><th>20X3<\/th><th>20X2<\/th><th>20X1<\/th><\/tr><tr><td>Risk-free rate<\/td><td>4.6%<\/td><td>3.8%<\/td><td>2.4%<\/td><\/tr><tr><td>Expected life<\/td><td>5.0 yrs<\/td><td>4.5 yrs<\/td><td>5.0 yrs<\/td><\/tr><tr><td>Dividend yield<\/td><td>1.0%<\/td><td>0.0%<\/td><td>0.0%<\/td><\/tr><tr><td>Expected volatility<\/td><td>29%<\/td><td>31%<\/td><td>35%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "FSA:ECO-M2-Q20", "rel": [], "los": "FSA · ECO Module 2 Q20", "tier": null, "type": "", "stem": "<p>Compared to the 20X3 reported financial statements, if Terra Mercado had used the same expected long-term rate of return on plan assets assumption in 20X3 as it used in 20X1, its year-end 20X3 pension obligation would most likely have been:<\/p>", "options": {"A": "lower.", "B": "higher.", "C": "the same."}}, {"id": "FSA:ECO-M2-Q21", "rel": [], "los": "FSA · ECO Module 2 Q21", "tier": null, "type": "", "stem": "<p>Compared to the reported 20X3 financial statements, if Terra Mercado had used the same discount rate it used in 20X1, it would have most likely reported lower:<\/p>", "options": {"A": "net income.", "B": "total liabilities.", "C": "cash flow from operating activities."}}, {"id": "FSA:ECO-M2-Q24", "rel": [], "los": "FSA · ECO Module 2 Q24", "tier": null, "type": "", "stem": "<p>Compared to the reported 20X3 financial statements, if Terra Mercado had used the 20X1 volatility assumption to value its employee stock option grants, it would have most likely reported higher:<\/p>", "options": {"A": "net income.", "B": "operating expense.", "C": "accrued compensation liability."}}, {"id": "FSA:ECO-M2-Q25", "rel": [], "los": "FSA · ECO Module 2 Q25", "tier": null, "type": "", "stem": "<p>Compared to the assumptions Terra Mercado used to value stock options in 20X2, earnings in 20X3 were most favorably affected by the change in the:<\/p>", "options": {"A": "expected life.", "B": "risk-free rate.", "C": "dividend yield."}}]}, {"set": 28, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Halvorsen Quantitative Partners is building a systematic global equity strategy, the Halvorsen Multifactor Strategy (HMS), which will be benchmarked against a broad developed-market equity index. The research team is led by Ingrid Halvorsen, CFA. Before presenting the strategy to the firm's investment committee, she asks two analysts, Rahul Mendes and Chiara Lotti, to estimate the strategy's expected return, analyze its active risk, and backtest it.<\/p>\n<p>Mendes uses a four-factor model (market, size, value, and momentum). The size factor is defined as small-cap minus large-cap returns, so the HMS portfolio's negative size sensitivity reflects its large-cap tilt. The annual risk-free rate is 3.0%. Factor sensitivities and risk premiums are shown in Exhibit 1. Mendes notes that the value factor has had a poor year and suggests that \"the last twelve months tell us more about the coming year than any long-run premium.\"<\/p>\n<p>Lotti runs a rolling-window backtest using monthly data from January 2014 to December 2025. To save time, she builds the stock universe from the current constituents of the benchmark index. Each stock's earnings yield is computed from quarterly accounting data dated at the fiscal quarter-end, and portfolios are rebalanced on that same date. Lotti also tests 36 combinations of factor weights and look-back windows, and she keeps the combination with the highest t-statistic of mean active return (2.4). Summary results for that combination are given in Exhibit 2.<\/p>\n<p>In reviewing the results, Halvorsen makes three comments:<\/p>\n<p>Comment 1: \"Building the universe from current index members creates look-ahead bias; adding a three-month reporting lag to the accounting data will remove it.\"<\/p>\n<p>Comment 2: \"Choosing the best of 36 specifications risks a false positive. We should require a t-statistic of at least 3.0 and test the chosen combination on data that was not used to select it.\"<\/p>\n<p>Comment 3: \"Because the earnings data are used on the fiscal quarter-end date, the backtest suffers from survivorship bias, which we can fix by adding delisted stocks.\"<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Four-Factor Model Inputs for the HMS Portfolio<\/caption><thead><tr><th>Factor<\/th><th>HMS sensitivity<\/th><th>Benchmark sensitivity<\/th><th>Expected annual risk premium<\/th><th>Realized factor return, last 12 months<\/th><\/tr><\/thead><tbody><tr><td>Market<\/td><td>0.95<\/td><td>1.00<\/td><td>5.0%<\/td><td>2.0%<\/td><\/tr><tr><td>Size (small − large)<\/td><td>−0.15<\/td><td>0.00<\/td><td>2.0%<\/td><td>−1.0%<\/td><\/tr><tr><td>Value<\/td><td>0.30<\/td><td>0.05<\/td><td>3.0%<\/td><td>−2.5%<\/td><\/tr><tr><td>Momentum<\/td><td>0.20<\/td><td>0.00<\/td><td>4.0%<\/td><td>6.0%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: HMS Backtest Summary<\/caption><thead><tr><th>Statistic (backtest, Jan 2014–Dec 2025)<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Mean monthly return<\/td><td>0.90%<\/td><\/tr><tr><td>Standard deviation of monthly returns<\/td><td>3.20%<\/td><\/tr><tr><td>Mean monthly risk-free rate<\/td><td>0.25%<\/td><\/tr><tr><td>Annualized mean active return<\/td><td>2.40%<\/td><\/tr><tr><td>Information ratio (annualized)<\/td><td>0.60<\/td><\/tr><tr><td>Active specific risk (annualized standard deviation)<\/td><td>2.20%<\/td><\/tr><tr><td>Share of active factor risk: market / size / value / momentum<\/td><td>12% / 18% / 44% / 26%<\/td><\/tr><tr><td>Skewness of monthly returns<\/td><td>−0.85<\/td><\/tr><tr><td>Excess kurtosis of monthly returns<\/td><td>3.10<\/td><\/tr><tr><td>Wealth index (Jan 2014 = 100): peak, Jun 2018<\/td><td>168.0<\/td><\/tr><tr><td>Wealth index: lowest value after Jun 2018 peak, Mar 2020<\/td><td>126.0<\/td><\/tr><tr><td>Wealth index: peak, Nov 2021<\/td><td>190.0<\/td><\/tr><tr><td>Wealth index: lowest value after Nov 2021 peak, Oct 2022<\/td><td>171.0<\/td><\/tr><tr><td>Wealth index: Dec 2025<\/td><td>205.0<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s21-q1", "rel": [], "los": "Agent Mock 1 Q81", "tier": null, "type": "", "stem": "Based on Exhibit 1, the expected annual return of the HMS portfolio is <i>closest<\/i> to:", "options": {"A": "5.50%.", "B": "6.15%.", "C": "9.15%."}}, {"id": "cMock1:m1-s21-q2", "rel": [], "los": "Agent Mock 1 Q82", "tier": null, "type": "", "stem": "Based on Exhibit 2, the proportion of the HMS strategy's active risk squared attributable to its value factor exposure is <i>closest<\/i> to:", "options": {"A": "19.8%.", "B": "30.7%.", "C": "44.0%."}}, {"id": "cMock1:m1-s21-q3", "rel": [], "los": "Agent Mock 1 Q83", "tier": null, "type": "", "stem": "Which of Halvorsen's comments is <i>most<\/i> accurate?", "options": {"A": "Comment 1", "B": "Comment 2", "C": "Comment 3"}}]}, {"set": 29, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Percy Byron, CFA, is an equity analyst with a UK-based investment firm. One firm Byron follows is NinMount PLC, a UK-based company. On 31 December 2018, NinMount paid £320 million to purchase a 50 percent stake in Boswell Company. The excess of the purchase price over the fair value of Boswell’s net assets was attributable to previously unrecorded licenses. These licenses were estimated to have an economic life of six years. The fair value of Boswell’s assets and liabilities other than licenses was equal to their recorded book values. NinMount and Boswell both use the pound sterling as their reporting currency and prepare their financial statements in accordance with IFRS.<\/p><p>Byron is concerned whether the investment should affect his “buy” rating on NinMount common stock. He knows NinMount could choose one of several accounting methods to report the results of its investment, but NinMount has not announced which method it will use. Byron forecasts that both companies’ 2019 financial results (excluding any merger accounting adjustments) will be identical to those of 2018.<\/p><p>NinMount’s and Boswell’s condensed income statements for the year ended 31 December 2018, and condensed balance sheets at 31 December 2018, are presented in Exhibits 1 and 2, respectively.<\/p><p>Exhibit 1<\/p><p>NinMount PLC and Boswell Company Income Statements for the Year Ended 31 December 2018 (£ millions)<\/p><table><tr><th><\/th><th>NinMount<\/th><th><\/th><th>Boswell<\/th><\/tr><tr><td>Net sales<\/td><td>950<\/td><td><\/td><td>510<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>(495)<\/td><td><\/td><td>(305)<\/td><\/tr><tr><td>Selling expenses<\/td><td>(50)<\/td><td><\/td><td>(15)<\/td><\/tr><tr><td>Administrative expenses<\/td><td>(136)<\/td><td><\/td><td>(49)<\/td><\/tr><tr><td>Depreciation &amp; amortization expense<\/td><td>(102)<\/td><td><\/td><td>(92)<\/td><\/tr><tr><td>Interest expense<\/td><td>(42)<\/td><td><\/td><td>(32)<\/td><\/tr><tr><td>Income before taxes<\/td><td>125<\/td><td><\/td><td>17<\/td><\/tr><tr><td>Income tax expense<\/td><td>(50)<\/td><td><\/td><td>(7)<\/td><\/tr><tr><td>Net income<\/td><td>75<\/td><td><\/td><td>10<\/td><\/tr><\/table><p>Exhibit 2<\/p><p>NinMount PLC and Boswell Company Balance Sheets at 31 December 2018 (£ millions)<\/p><table><tr><th><\/th><th>NinMount<\/th><th><\/th><th>Boswell<\/th><\/tr><tr><td>Cash<\/td><td>50<\/td><td><\/td><td>20<\/td><\/tr><tr><td>Receivables—net<\/td><td>70<\/td><td><\/td><td>45<\/td><\/tr><tr><td>Inventory<\/td><td>130<\/td><td><\/td><td>75<\/td><\/tr><tr><td>Total current assets<\/td><td>250<\/td><td><\/td><td>140<\/td><\/tr><tr><td>Property, plant, &amp; equipment—net<\/td><td>1,570<\/td><td><\/td><td>930<\/td><\/tr><tr><td>Investment in Boswell<\/td><td>320<\/td><td><\/td><td>—<\/td><\/tr><tr><td>Total assets<\/td><td>2,140<\/td><td><\/td><td>1,070<\/td><\/tr><tr><td>Current liabilities<\/td><td>110<\/td><td><\/td><td>90<\/td><\/tr><tr><td>Long-term debt<\/td><td>600<\/td><td><\/td><td>400<\/td><\/tr><tr><td>Total liabilities<\/td><td>710<\/td><td><\/td><td>490<\/td><\/tr><tr><td>Common stock<\/td><td>850<\/td><td><\/td><td>535<\/td><\/tr><tr><td>Retained earnings<\/td><td>580<\/td><td><\/td><td>45<\/td><\/tr><tr><td>Total equity<\/td><td>1,430<\/td><td><\/td><td>580<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>2,140<\/td><td><\/td><td>1,070<\/td><\/tr><\/table><p>Note: Balance sheets reflect the purchase price paid by NinMount, but do not yet consider the impact of the accounting method choice.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q30", "rel": [], "los": "FSA · ECO Module 1 Q30", "tier": null, "type": "", "stem": "<p>NinMount’s long-term debt to equity ratio on 31 December 2018 most likely will be lowest if the results of the acquisition are reported using:<\/p>", "options": {"A": "the equity method.", "B": "consolidation with full goodwill.", "C": "consolidation with partial goodwill."}}, {"id": "FSA:ECO-M1-Q33", "rel": [], "los": "FSA · ECO Module 1 Q33", "tier": null, "type": "", "stem": "<p>Based on Byron’s forecast, NinMount’s 2019 return on beginning equity most likely will be the same under:<\/p>", "options": {"A": "either of the consolidations, but different under the equity method.", "B": "the equity method, consolidation with full goodwill, and consolidation with partial goodwill.", "C": "none of the equity method, consolidation with full goodwill, or consolidation with partial goodwill."}}, {"id": "FSA:ECO-M1-Q34", "rel": [], "los": "FSA · ECO Module 1 Q34", "tier": null, "type": "", "stem": "<p>Based on Byron’s forecast, NinMount’s 2019 total asset turnover ratio on beginning assets under the equity method is most likely:<\/p>", "options": {"A": "lower than if the results are reported using consolidation.", "B": "the same as if the results are reported using consolidation.", "C": "higher than if the results are reported using consolidation."}}]}, {"set": 30, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Liz Tyo is a fund manager for an actively managed global fixed-income fund that buys bonds issued in Countries A, B, and C. She and her assistant are preparing the quarterly markets update. Tyo begins the meeting by distributing the daily rates sheet, which includes the current government spot rates for Countries A, B, and C as shown in Exhibit 1<\/p><p>Exhibit 1<\/p><p>Today’s Government Spot Rates<\/p><table><tr><th>Maturity<\/th><th>Country A<\/th><th>Country B<\/th><th>Country C<\/th><\/tr><tr><td>One year<\/td><td>0.40%<\/td><td>–0.22%<\/td><td>14.00%<\/td><\/tr><tr><td>Two years<\/td><td>0.70<\/td><td>–0.20<\/td><td>12.40<\/td><\/tr><tr><td>Three years<\/td><td>1.00<\/td><td>–0.12<\/td><td>11.80<\/td><\/tr><tr><td>Four years<\/td><td>1.30<\/td><td>–0.02<\/td><td>11.00<\/td><\/tr><tr><td>Five years<\/td><td>1.50<\/td><td>0.13<\/td><td>10.70<\/td><\/tr><\/table><p>Tyo asks her assistant how these spot rates were obtained. The assistant replies, “Spot rates are determined through the process of bootstrapping. It entails backward substitution using par yields to solve for zero-coupon rates one by one, in order from latest to earliest maturities.”<\/p><p>Tyo then provides a review of the fund’s performance during the last year and comments, “The choice of an appropriate benchmark depends on the country’s characteristics. For example, although Countries A and B have both an active government bond market and a swap market, Country C’s private sector is much bigger than its public sector, and its government bond market lacks liquidity.”<\/p><p>Tyo further points out, “The fund’s results were mixed; returns did not benefit from taking on additional risk. We are especially monitoring the riskiness of the corporate bond holdings. For example, our largest holdings consist of three four-year corporate bonds (Bonds 1, 2, and 3) with identical maturities, coupon rates, and other contract terms. These bonds have Z-spreads of 0.55%, 1.52%, and 1.76%, respectively.”<\/p><p>Tyo continues, “We also look at risk in terms of the swap spread. We considered historical three-year swap spreads for Country B, which reflect that market’s credit and liquidity risks, at three different points in time.” Tyo provides the information in Exhibit 2.<\/p><p>Exhibit 2<\/p><p>Selected Historical Three-Year Rates for Country B<\/p><table><tr><th>Period<\/th><th>Government Bond Yield (%)<\/th><th>Fixed-for-Floating MRR Swap (%)<\/th><\/tr><tr><td>1 month ago<\/td><td>–0.10<\/td><td>0.16<\/td><\/tr><tr><td>6 months ago<\/td><td>–0.08<\/td><td>0.01<\/td><\/tr><tr><td>12 months ago<\/td><td>–0.07<\/td><td>0.71<\/td><\/tr><\/table><p>Tyo then suggests that the firm was able to add return by riding the yield curve. The fund plans to continue to use this strategy but only in markets with an attractive yield curve for this strategy.<\/p><p>She moves on to present her market views on the respective yield curves for a five-year investment horizon.<\/p><p>Country A: “The government yield curve has changed little in terms of its level and shape during the last few years, and I expect this trend to continue. We assume that future spot rates reflect the current forward curve for all maturities.”<\/p><p>Country B: “Because of recent economic trends, I expect a reversal in the slope of the current yield curve. We assume that future spot rates will be higher than current forward rates for all maturities.”<\/p><p>Country C: “To improve liquidity,Country C’s central bank is expected to intervene, leading to a reversal in the slope of the existing yield curve. We assume that future spot rates will be lower than today’s forward rates for all maturities.”<\/p><p>Tyo’s assistant asks, “Assuming investors require liquidity premiums, how can a yield curve slope downward? What does this imply about forward rates?”<\/p><p>Tyo answers, “Even if investors require compensation for holding longer-term bonds, the yield curve can slope downward—for example, if there is an expectation of severe deflation. Regarding forward rates, it can be helpful to understand yield curve dynamics by calculating implied forward rates. To see what I mean, we can use Exhibit 1 to calculate the forward rate for a two-year Country C loan beginning in three years.”<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q32", "rel": [], "los": "FI · ECO Module 1 Q32", "tier": null, "type": "", "stem": "<p>Based on Exhibit 2, the implied credit and liquidity risks as indicated by the historical three-year swap spreads for Country B were the lowest:<\/p>", "options": {"A": "1 month ago.", "B": "6 months ago.", "C": "12 months ago."}}, {"id": "FI:ECO-M1-Q36", "rel": [], "los": "FI · ECO Module 1 Q36", "tier": null, "type": "", "stem": "<p>With respect to their discussion of yield curves, Tyo and her assistant are most likely discussing which term structure theory?<\/p>", "options": {"A": "Pure expectations theory", "B": "Local expectations theory", "C": "Liquidity preference theory"}}]}, {"set": 31, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>XYZ SA is a fictional company that uses a DB pension plan and stock option grants as part of its compensation to qualified employees. XYZ SA prepares its financial statements under IFRS.<\/p><p>Information on XYZ’s DB plan and volatility assumptions used to value stock option grants were as follows:<\/p><p>XYZ SA Defined BP Information, Fiscal Year 2024<\/p><table><tr><th>Employer contributions<\/th><th>1,000<\/th><\/tr><tr><td>Current service costs<\/td><td>200<\/td><\/tr><tr><td>Past service costs<\/td><td>120<\/td><\/tr><tr><td>Discount rate used to estimate plan liabilities at beginning of year<\/td><td>7.00%<\/td><\/tr><tr><td>Benefit obligation at beginning of year<\/td><td>42,000<\/td><\/tr><tr><td>Benefit obligation at end of year<\/td><td>41,720<\/td><\/tr><tr><td>Actuarial loss due to increase in plan obligation<\/td><td>460<\/td><\/tr><tr><td>Plan assets at beginning of year<\/td><td>39,000<\/td><\/tr><tr><td>Plan assets at end of year<\/td><td>38,700<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>2,700<\/td><\/tr><tr><td>Expected rate of return on plan assets<\/td><td>8.00%<\/td><\/tr><tr><td>Grant Year<\/td><td>Weighted Average Expected Volatility<\/td><\/tr><tr><td>2024 Valuation Assumptions<\/td><td><\/td><\/tr><tr><td>2020–2024<\/td><td>21.50%<\/td><\/tr><tr><td>2023 Valuation Assumptions<\/td><td><\/td><\/tr><tr><td>2019–2023<\/td><td>23.00%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "FSA:ECO-M2-Q8", "rel": [], "los": "FSA · ECO Module 2 Q8", "tier": null, "type": "", "stem": "<p>The amount recognized by XYZ as operating expense on the income statement related to its DB plan for fiscal year 2024 is closest to:<\/p>", "options": {"A": "200.", "B": "320.", "C": "1,000."}}, {"id": "FSA:ECO-M2-Q12", "rel": [], "los": "FSA · ECO Module 2 Q12", "tier": null, "type": "", "stem": "<p>If XYZ SA also granted RSUs to employees in fiscal 2024, the decrease in XYZ SA’s share price volatility assumption would:<\/p>", "options": {"A": "increase the grant-date fair value of the RSUs.", "B": "decrease the grant-date fair value of the RSUs.", "C": "not affect the grant-date fair value of the RSUs."}}]}, {"set": 32, "session": 2, "topic": "Derivatives", "code": "DER", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "Deriv:ECO-M2-Q50", "rel": [], "los": "Deriv · ECO Module 2 Q50", "tier": null, "type": "", "stem": "<p>An analyst values a 2-year, European-style call option on a 1-year spot rate. The notional value of the option is $10,000,000, and the exercise rate is 3.50% of par. The risk-neutral probability of an up move is 0.50. Annually compounded 1-year interest rates, along with the corresponding zero-coupon bond values, are shown below.<\/p><table><tr><th>Node<\/th><th>1-year rate<\/th><th>1-year zero value<\/th><\/tr><tr><td>t=0<\/td><td>4%<\/td><td>0.961538<\/td><\/tr><tr><td>t=1 up<\/td><td>5%<\/td><td>0.952381<\/td><\/tr><tr><td>t=1 down<\/td><td>3%<\/td><td>0.970874<\/td><\/tr><tr><td>t=2 up-up<\/td><td>6%<\/td><td>0.943396<\/td><\/tr><tr><td>t=2 up-down<\/td><td>4%<\/td><td>0.961538<\/td><\/tr><tr><td>t=2 down-down<\/td><td>2%<\/td><td>0.980392<\/td><\/tr><\/table><p>The value of the interest rate option is closest to:<\/p>", "options": {"A": "$34,118.", "B": "$45,343.", "C": "$80,350."}}, {"id": "Deriv:ECO-M2-Q59", "rel": [], "los": "Deriv · ECO Module 2 Q59", "tier": null, "type": "", "stem": "<p>An investor is short at-the-money call options with a delta of 0.607 on 500,000 shares of stock. At-the-money put options with the same maturity have a delta of –0.434. Assuming an option contract is for 100 shares, the most appropriate action to achieve a delta neutral position is to:<\/p>", "options": {"A": "sell 303,500 shares.", "B": "sell 6,993 put option contracts.", "C": "purchase 6,993 put option contracts."}}, {"id": "Deriv:ECO-M2-Q75", "rel": [], "los": "Deriv · ECO Module 2 Q75", "tier": null, "type": "", "stem": "<p>An analyst values a 2-year, European-style put option on a 1-year spot rate. The notional value of the option is $2,000,000, and the exercise rate is 2.50% of par. The risk-neutral probability of an up move is 0.50. Annually compounded 1-year interest rates, along with the corresponding zero-coupon bond values, are shown below.<\/p><table><tr><th>Node<\/th><th>1-year rate<\/th><th>1-year zero value<\/th><\/tr><tr><td>t=0<\/td><td>3%<\/td><td>0.970874<\/td><\/tr><tr><td>t=1 up<\/td><td>4%<\/td><td>0.961538<\/td><\/tr><tr><td>t=1 down<\/td><td>2%<\/td><td>0.980392<\/td><\/tr><tr><td>t=2 up-up<\/td><td>5%<\/td><td>0.952381<\/td><\/tr><tr><td>t=2 up-down<\/td><td>3%<\/td><td>0.970874<\/td><\/tr><tr><td>t=2 down-down<\/td><td>1%<\/td><td>0.990099<\/td><\/tr><\/table><p>The value of the interest rate option is closest to:<\/p>", "options": {"A": "$7,139.", "B": "$14,706.", "C": "$16,383."}}, {"id": "Deriv:ECO-M2-Q80", "rel": [], "los": "Deriv · ECO Module 2 Q80", "tier": null, "type": "", "stem": "<p>Market participants use the term volatility smile to describe the implied volatility of a stock option with respect to the:<\/p>", "options": {"A": "dividend yield.", "B": "exercise price.", "C": "time to expiration."}}]}, {"set": 33, "session": 2, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Michael Tang, the chief investment officer of Delphinus Brothers, asks an analyst at the firm, Amanda Rodriguez, to focus her analysis on the 100,000 square foot office property in New York City (introduced in the previous question set). Tang believes that Delphinus can purchase the property for USD50 million.<\/p><p>Rodriguez begins her analysis by assembling the data shown in Exhibit 1.<\/p><p>Exhibit 1: Six-Year NOI and DCF Assumptions for New York City Office Property<\/p><table><tr><th><\/th><th>Year 1<\/th><th>Year 2<\/th><th>Year 3<\/th><th>Year 4<\/th><th>Year 5<\/th><th>Year 6<\/th><\/tr><tr><td>NOI<\/td><td>$3,250,840<\/td><td>$3,185,823<\/td><td>$3,217,681<\/td><td>$3,265,947<\/td><td>$3,339,430<\/td><td>$3,439,613<\/td><\/tr><tr><td>DCF assumptions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Investment holding period<\/td><td>5 years<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Going-in cap rate<\/td><td>6.50%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Terminal cap rate<\/td><td>6.00%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Discount rate<\/td><td>9.00%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><p>Using the data from Exhibit 1, Rodriguez is able to compute a value of USD49.9 million for this property using the DCF method. After Rodriguez presents this valuation to Tang, Tang is surprised that the analysis does not demonstrate that the property is underpriced. Tang asks Rodriguez to value the property using the sales comparison method, and she compiles the data shown in Exhibit 2.<\/p><p>Exhibit 2: Sales Comparison Data for Comparable Office Properties<\/p><table><tr><th>Variable<\/th><th>NYC Office<\/th><th>Sales Comp A<\/th><th>Sales Comp B<\/th><th>Sales Comp C<\/th><\/tr><tr><td>Age (years)<\/td><td>10<\/td><td>5<\/td><td>12<\/td><td>25<\/td><\/tr><tr><td>Condition<\/td><td>Good<\/td><td>Excellent<\/td><td>Good<\/td><td>Average<\/td><\/tr><tr><td>Location<\/td><td>Prime<\/td><td>Secondary<\/td><td>Secondary<\/td><td>Prime<\/td><\/tr><tr><td>Sale price (per ft2)<\/td><td><\/td><td>$415/ft2<\/td><td>$395/ft2<\/td><td>$400/ft2<\/td><\/tr><tr><td>Adjustment: Age<\/td><td><\/td><td>–10%<\/td><td>2%<\/td><td>10%<\/td><\/tr><tr><td>Adjustment: Condition<\/td><td><\/td><td>–10%<\/td><td>0%<\/td><td>10%<\/td><\/tr><tr><td>Adjustment: Location<\/td><td><\/td><td>15%<\/td><td>15%<\/td><td>0%<\/td><\/tr><tr><td>Total adjustments<\/td><td><\/td><td>–5%<\/td><td>17%<\/td><td>20%<\/td><\/tr><\/table><p>To conclude her valuation work on the office property, Rodriguez compiles detailed data on the replacement costs of the office building, its land value, and the total depreciation. She finds that the cost of constructing a building identical to the subject property is USD57 million. The land value is USD7 million, and the total depreciation is USD5 million. From these data, she calculates a value of the property using the cost approach.<\/p><p>Rodriguez presents her valuation findings to Tang. After a thorough review of the valuation including consideration of a variety of scenarios, Tang decides to proceed with plans to purchase the office property in New York City. He contacts several potential lenders, ultimately deciding to contract with Rich Life Insurance, a publicly traded company with extensive investments in commercial real estate, to discuss terms on arranging a loan of USD35 million.<\/p>", "exhibits": [], "qs": [{"id": "AI:ECO-M2-Q11", "rel": [], "los": "AI · ECO Module 2 Q11", "tier": null, "type": "", "stem": "<p>Which of the following amounts is closest to the undiscounted terminal value of the New York City office property at the end of the five-year investment holding period?<\/p>", "options": {"A": "USD57.3 million", "B": "USD52.9 million", "C": "USD55.7 million"}}, {"id": "AI:ECO-M2-Q15", "rel": [], "los": "AI · ECO Module 2 Q15", "tier": null, "type": "", "stem": "<p>If Tang purchases the office property in New York City, what are the forms of real estate investment taken by Delphinus Brothers and Rich Life Insurance?<\/p>", "options": {"A": "Delphinus invests in public real estate equity and Rich invests in public real estate debt.", "B": "Delphinus invests in private real estate equity and Rich invests in private real estate debt.", "C": "Delphinus invests in private real estate equity and Rich invests in public real estate debt."}}]}, {"set": 34, "session": 2, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>James Quinn is the founder and CEO of GoogolMining Inc. (GMI), which applies data science and machine learning to assist lenders in predicting the credit risk of their customers. Quinn is meeting with Judy Wu, the chief lending officer at onLineLoans.com.<\/p><p>Wu tells Quinn that she recalls that text preparation must be carried out by removing such items as HTML tags, punctuation, numbers, and stop words and eliminating the distinction between uppercase and lowercase words by lowercasing them all.<\/p><p>Quinn uses logistic regression to train the model: Defaulting loans are classified as Class 1, and non-defaulting loans are classified as Class 0. After tuning, the threshold p-value of 0.60 (for Class 1) is used to predict the outcome for each loan application in the test data. Exhibit 2 indicates the result for one of those applications.<\/p><p>Exhibit 2 – Result for a Selected Credit Applicant in Test Data<\/p><table><tr><th>Actual Outcome<\/th><th>p<\/th><\/tr><tr><td>Defaulted (Class 1)<\/td><td>0.41<\/td><\/tr><\/table><p>After running his model on the test set, Quinn produces a confusion matrix (Exhibit 3). He reminds Wu that since the number of defaults in the dataset is likely much smaller than the number of non-defaults, this needs to be considered in evaluating model performance.<\/p><p>Exhibit 3 – Confusion Matrix (Threshold p-Value = 0.60)<\/p><table><tr><th><\/th><th>Actual Class 1<\/th><th>Actual Class 0<\/th><\/tr><tr><td>Predicted Class 1<\/td><td>TP = 118<\/td><td>FP = 32<\/td><\/tr><tr><td>Predicted Class 0<\/td><td>FN = 8<\/td><td>TN = 320<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Quant:ECO-M7-Q32", "rel": [], "los": "Quant · ECO Module 7 Q32", "tier": null, "type": "", "stem": "<p>Wu&#x27;s recollection about the preparation of the textual data is most accurate with respect to:<\/p>", "options": {"A": "numbers.", "B": "stop words.", "C": "lowercasing."}}, {"id": "Quant:ECO-M7-Q34", "rel": [], "los": "Quant · ECO Module 7 Q34", "tier": null, "type": "", "stem": "<p>Based on Exhibit 2, the most appropriate statement about the model&#x27;s performance for the selected credit applicant is that it results in:<\/p>", "options": {"A": "a Type I error.", "B": "a Type II error.", "C": "the correct classification."}}, {"id": "Quant:ECO-M7-Q35", "rel": [], "los": "Quant · ECO Module 7 Q35", "tier": null, "type": "", "stem": "<p>Using Exhibit 3 and Quinn&#x27;s reminder, the most appropriate measure of the accuracy of the model is:<\/p>", "options": {"A": "0.79.", "B": "0.86.", "C": "0.92."}}]}, {"set": 35, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Hoskins Bank Corporation (HB) is a US bank holding company with lines of business in corporate banking, retail banking, capital markets, and private wealth management.<\/p><p>HB’s annual risk assessment meeting with its external regulator will be in 90 days. In preparation for this meeting, Richard Hextall, CEO, and Alice Klink, chief risk officer, are meeting with independent risk consultant David Donovan, a principal of Donovan and MacNab Risk Advisory LLC.<\/p><p>Hextall asks Klink to review HB’s primary risk exposures. Klink begins by suggesting that the liquidity gap is a primary risk exposure for retail banking, stating that “with a 99% level of confidence, we expect our ratio of interest-earning assets to interest-paying liabilities will range between 90% and 110%.” For corporate banking, Klink believes that credit deterioration is a primary risk exposure and states that “over any 1-month period, there is a 1% probability of incurring a single-name loan loss for an amount that is not greater than 0.55% of the loan portfolio.” Klink believes that market risk is a primary risk exposure for capital markets, stating that “there is a 1% chance of HB losing at least 1.30% of its Tier 1 capital over a 1-day period.”<\/p><p>During last year’s review, the regulator expressed concern that HB did not have an effective risk management process in place for its short-term, investment-grade bond portfolio. Donovan asks about the bank’s progress in addressing this concern. Hextall explains that HB has implemented a value at risk (VaR) approach and notes that there are three distinct methods to estimate VaR. The parametric method assumes that the distribution of returns on the risk factors is normal, and it is considered to be a straightforward approach. The historical simulation method also relies on the normal distribution assumption. The Monte Carlo simulation method relies on neither a normal distribution nor past returns and, as a result, is able to accommodate bonds that may contain embedded options.<\/p><p>Donovan cautions Hextall that VaR may not capture information related to large losses, portfolio composition, and performance. He states that these limitations may be addressed by variations, or extensions, to VaR. For example, CVaR captures the potential loss if VaR is exceeded. IVaR measures ex ante tracking error. Relative VaR is used to determine the effect on VaR from any changes in portfolio composition.<\/p><p>Recalling the financial crisis, Hextall asks Klink about HB’s potential exposure to any future adverse, extreme events. Klink replies that HB’s investment portfolio currently holds short-duration, high-investment-grade bonds but does not hold any equity securities or derivative instruments. Klink adds that the illiquidity conditions that were prevalent during the financial crisis continue to exist, according to a reverse stress test she conducted on ten plausible independent risk factors.<\/p><p>Donovan transitions the discussion to the private wealth division by asking Hextall to discuss the differences in risk measurement for banks in comparison to traditional asset managers, such as HB’s private wealth division. Hextall states that risk measures for banks typically consider liquidity, solvency, and capital sufficiency, whereas risk measures for traditional asset managers typically are focused on investment performance. Hextall provides an example, stating that “HB, for its private wealth clients, calculates active share for each client and uses ex ante tracking error to measure the degree to which clients’ current portfolios might underperform their benchmarks in the future. For equity-only portfolios, forward-looking beta is used to measure sensitivity to the broad equity market.”<\/p><p>Hextall asks Klink to review the constraints used in the context of measuring the risk of the corporate banking division. Klink responds by stating that the corporate banking division’s capital allocation is $2,800 million. This amount considers market risk, credit risk, and operational risk for which the minimum required return is 11%. Capital limits, position limits, and stop-loss limits are assigned to manage both overall exposure and exposure to single-name event risk. The market risk management constraints for each of the corporate banking division’s lending groups are summarized in Exhibit 1.<\/p><p>Exhibit 1 Market Risk Management Constraints for Corporate Banking Lending Groups ($ Millions)<\/p><table><tr><th>Lending Group<\/th><th>Return<\/th><th>Capital Limit<\/th><th>Position Limit<\/th><th>Stop-Loss Limit<\/th><\/tr><tr><td>Secured<\/td><td>120<\/td><td>800<\/td><td>32<\/td><td>80<\/td><\/tr><tr><td>Cash Flow<\/td><td>120<\/td><td>1,200<\/td><td>24<\/td><td>60<\/td><\/tr><tr><td>Real Estate<\/td><td>120<\/td><td>1,000<\/td><td>10<\/td><td>70<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "PM:ECO-M5-Q48", "rel": [], "los": "PM · ECO Module 5 Q48", "tier": null, "type": "", "stem": "<p>With respect to capital allocation, which lending group listed in Exhibit 1 is least likely attractive?<\/p>", "options": {"A": "Secured", "B": "Cash Flow", "C": "Real Estate"}}]}, {"set": 36, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Javier Casado, an analyst who manages funds for high-net-worth investors, is evaluating Bardem S.A. (Bardem) as a possible addition to a large investment portfolio. Bardem, based in Madrid, Spain, is a manufacturing firm that specializes in packaging materials. The company reports using IFRS, and its reporting currency is the Euro.<\/p><p>Casado learns that Bardem acquired a 25% stake in Ariana Shipping S.A. (Ariana) on 1 January 2020. Ariana, which is based in Greece, has bought packaging supplies from Bardem in the past based on catalog prices. Casado believes that the purchase will change the relationship between the two companies and will also affect Bardem’s financial reporting. He mentions to a coworker, Ana Domingues, that the price paid by Bardem for the Ariana shares was €80 million.<\/p><p>Domingues tells Casado that Bardem’s purchase of Ariana’s equity will likely allow Bardem to influence Ariana’s financial and operating performance. As a result, she states, Bardem will be required to use the equity method of accounting for this investment. Casado replies that the equity method of accounting is only required under IFRS for joint ventures or when the investee holds a seat on the associate’s board of directors.<\/p><p>Bardem prepares the following table to examine the purchase more closely.<\/p><p>Exhibit 1 Book Values and Fair Values of Ariana Shipping Assets and Liabilities as of 31 December 2019 (€ millions)<\/p><table><tr><th><\/th><th>Book Value<\/th><th>Fair Value<\/th><\/tr><tr><td>Current assets<\/td><td>15<\/td><td>15<\/td><\/tr><tr><td>Plant and equipment<\/td><td>230<\/td><td>275<\/td><\/tr><tr><td>Land<\/td><td>100<\/td><td>115<\/td><\/tr><tr><td><\/td><td>345<\/td><td>405<\/td><\/tr><tr><td>Liabilities<\/td><td>110<\/td><td>110<\/td><\/tr><tr><td>Net assets<\/td><td>235<\/td><td>295<\/td><\/tr><\/table><p>Domingues says that she is concerned that Bardem didn’t sufficiently investigate Ariana before the purchase, given economic uncertainty surrounding Greek companies. She asks Casado what will happen to Bardem’s financial statements if the value of Ariana is permanently impaired due to business losses or other demonstrable events. Casado replies that if the equity method is not required, then there will be no impact. However, if the equity method is used, he states:<\/p><p>Goodwill must be separately tested for impairment.<\/p><p>Impairment losses should be recognized on the income statement.<\/p><p>Impairment losses exceeding the goodwill value are allocated pro-rata to the unit’s non-cash assets.<\/p><p>Domingues informs Casado of a final piece of information relevant to his evaluation. To increase liquidity, Bardem is considering borrowing €70M against accounts receivable. As an alternative to borrowing, they could securitize the receivables by creating a special purpose entity (SPE) over which they would exercise control. To do so, they would invest €5M in the SPE. The SPE would then borrow €70M, and would buy €75M in receivables from Bardem. Domingues comments that securitization using an SPE would impact Bardem’s reported financial condition in three ways. It would:<\/p><p>reduce the cost of borrowing.<\/p><p>increase the level of current assets.<\/p><p>improve balance sheet ratios.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q41", "rel": [], "los": "FSA · ECO Module 1 Q41", "tier": null, "type": "", "stem": "<p>Which of Casado’s three statements regarding the potential impairment of the investment in Ariana is most accurate? Statement:<\/p>", "options": {"A": "1", "B": "2", "C": "3"}}]}, {"set": 37, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Marcos Pereira is a credit analyst with Tundra Partners, a hedge fund manager. Tundra enters into single-name CDS for speculative purposes.  Pereira compiles information about Tundra’s CDS portfolio in Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Position<\/th><th>Coupon<\/th><th>Origination Credit Spread<\/th><th>Current Credit Spread<\/th><\/tr><tr><td>CDS 1<\/td><td>Protection Buyer<\/td><td>1.0%<\/td><td>75 bps<\/td><td>100 bps<\/td><\/tr><tr><td>CDS 2<\/td><td>Protection Seller<\/td><td>1.0%<\/td><td>100 bps<\/td><td>200 bps<\/td><\/tr><tr><td>CDS 3<\/td><td>Protection Seller<\/td><td>5.0%<\/td><td>650 bps<\/td><td>600 bps<\/td><\/tr><tr><td>CDS 4<\/td><td>Protection Seller<\/td><td>5.0%<\/td><td>450 bps<\/td><td>In default<\/td><\/tr><\/table><p>CDS 1 and 2 relate to the same reference entity, and were entered into by Tundra on the same date. CDS 1 and 2 have a remaining time to maturity of 2 and 5 years respectively.<\/p><p>Exhibit 2<\/p><table><tr><th><\/th><th>Maturity<\/th><th>Trading Price<\/th><\/tr><tr><td>Senior unsecured bond<\/td><td>3 years<\/td><td>30% of par<\/td><\/tr><tr><td>Senior unsecured bond<\/td><td>5 years<\/td><td>35% of par<\/td><\/tr><tr><td>Subordinated unsecured bond<\/td><td>8 years<\/td><td>20% of par<\/td><\/tr><\/table><p>Pereira also whether Tundra should invest in CDS 5. He calculates that CDS 5’s reference entity has a hazard rate of 1.35% and 2.35% in each of the next 2 years.<\/p><p>Pereira notices that the market expects a local company to be the target of a leveraged buyout (LBO), whereby it will issue large amounts of debt and use the proceeds to repurchase its publicly traded equity. As a result, the credit spread of the company&#x27;s senior unsecured bonds with 5 years until maturity has increased to 450 bps. A comparable 5-year CDS currently trades at a spread of 400 bps. Pereira believes that credit spreads in both markets should soon converge.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M5-Q20", "rel": [], "los": "FI · ECO Module 5 Q20", "tier": null, "type": "", "stem": "<p>If Tundra closes its position in CDS 3 today, it will:<\/p>", "options": {"A": "pay an upfront premium and monetize a loss.", "B": "pay an upfront premium and monetize a gain.", "C": "receive an upfront premium and monetize a gain."}}, {"id": "FI:ECO-M5-Q22", "rel": [], "los": "FI · ECO Module 5 Q22", "tier": null, "type": "", "stem": "<p>Which of the following trades is consistent with Pereira&#x27;s belief about the local company&#x27;s credit spread convergence?<\/p>", "options": {"A": "Buy bonds and sell CDS credit protection", "B": "Buy bonds and buy CDS credit protection", "C": "Sell bonds and buy CDS credit protection"}}]}, {"set": 38, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Victoria Lazslo is an analyst valuing three firms held in client portfolios.<\/p><p>Firm A owns a chain of regional dental offices and has no debt. Lazslo initially selects a single-stage residual income model to estimate the intrinsic value of Firm A’s stock and compiles the data in Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th>Constant long-term growth rate<\/th><th>9.6%<\/th><\/tr><tr><td>Constant long-term ROE<\/td><td>16.0%<\/td><\/tr><tr><td>Market price per share<\/td><td>$220.00<\/td><\/tr><tr><td>Book value per share<\/td><td>$166.00<\/td><\/tr><tr><td>Cost of equity<\/td><td>12.5%<\/td><\/tr><\/table><p>Lazslo also considers the possibility that after Year 10 Firm A’s ROE will exhibit mean reversion. She uses a multistage residual income model to value Firm A’s stock and estimates residual income in Year 10 to be $8.38 per share, with a persistence factor of 0.7.<\/p><p>Firm B is a distributor of building supplies. Firm B’s year-end (Year 0) book value of equity is $111 per share and its cost of equity is 12%. Lazslo forecasts financial data for the next two years in Exhibit 2.<\/p><p>Exhibit 2<\/p><table><tr><th><\/th><th>Year 1<\/th><th>Year 2<\/th><\/tr><tr><td>Net income<\/td><td>$26.25<\/td><td>$31.56<\/td><\/tr><tr><td>Dividends<\/td><td>$3.80<\/td><td>$4.57<\/td><\/tr><tr><td>Other comprehensive income<\/td><td>$0.00<\/td><td>$2.75<\/td><\/tr><\/table><p>Firm C is an international carbon capture firm that reported EPS of $3.75 last year. Lazslo forecasts earnings growth of 7%, a required return on equity of 12%, and a dividend payout ratio of 45% for the foreseeable future. She selects the Gordon growth model to value Firm C&#x27;s stock.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q3", "rel": [], "los": "Mock 1 Session 2 Q3", "tier": null, "type": "", "stem": "<p>Firm B’s per-share residual income for Year 2 is closest to:<\/p>", "options": {"A": "$14.73.", "B": "$15.55.", "C": "$18.30."}}, {"id": "Mock1:mock1-2-Q4", "rel": [], "los": "Mock 1 Session 2 Q4", "tier": null, "type": "", "stem": "<p>Based on the Gordon growth model, the per-share value of Firm C’s stock is closest to:<\/p>", "options": {"A": "$34.", "B": "$36.", "C": "$44."}}]}, {"set": 39, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M1-Q60", "rel": [], "los": "PM · ECO Module 1 Q60", "tier": null, "type": "", "stem": "<p>The real default-free interest rate in an economy is most likely positively related to:<\/p>", "options": {"A": "the expected growth rate of GDP only.", "B": "the expected volatility of GDP growth only.", "C": "both the expected growth rate of GDP and the expected volatility of GDP growth."}}]}, {"set": 40, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Claus Petersen, a pension fund equity analyst, is preparing an analysis of Rhine AG for the upcoming quarterly fund meeting. Rhine is a Germany-based manufacturer that operates three distinct divisions: children’s products (infant car seats, strollers, cribs, etc.), recreational products (bicycles, bicycle trailers, etc.), and home furnishings (contemporary furniture). All three divisions sell through retail outlets around the world.<\/p><p>The company has been pursuing an aggressive growth strategy, achieved through both foreign acquisitions and organic growth. Petersen is interested in determining how well Rhine is allocating its resources between the three divisions and the effects of the foreign acquisitions on overall performance. Exhibit 1 summarizes selected divisional and corporate data for the current year and the prior year.<\/p><p>Exhibit 1 Rhine AG Selected Divisional and Corporate Data (€ millions)<\/p><table><tr><th><\/th><th>Total for Three Divisions<\/th><th><\/th><th>Children&#x27;s Products<\/th><th><\/th><th>Recreational Products<\/th><th><\/th><th>Home Furnishings<\/th><th><\/th><\/tr><tr><td><\/td><td>Current Year<\/td><td>Prior Year<\/td><td>Current Year<\/td><td>Prior Year<\/td><td>Current Year<\/td><td>Prior Year<\/td><td>Current Year<\/td><td>Prior Year<\/td><\/tr><tr><td>Revenues<\/td><td>2,837.1<\/td><td>2,775.5<\/td><td>1,176.2<\/td><td>1,236.2<\/td><td>1,034.1<\/td><td>930.0<\/td><td>626.8<\/td><td>609.3<\/td><\/tr><tr><td>Gross profit<\/td><td>621.4<\/td><td>640.8<\/td><td>296.6<\/td><td>337.6<\/td><td>246.0<\/td><td>220.3<\/td><td>78.8<\/td><td>82.9<\/td><\/tr><tr><td>Operating profit<\/td><td>172.7<\/td><td>219.4<\/td><td>64.7<\/td><td>115.7<\/td><td>72.9<\/td><td>62.2<\/td><td>35.1<\/td><td>41.5<\/td><\/tr><tr><td>Earnings before taxes (EBT)<\/td><td>136.6<\/td><td>170.0<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><\/tr><tr><td>Net earnings after tax<\/td><td>109.9<\/td><td>132.3<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>---<\/td><\/tr><tr><td>Total assets<\/td><td>2,498.0<\/td><td>2,479.5<\/td><td>1,270.9<\/td><td>1,249.6<\/td><td>961.5<\/td><td>948.5<\/td><td>265.6<\/td><td>281.4<\/td><\/tr><tr><td>Capital expenditures<\/td><td>32.7<\/td><td>42.3<\/td><td>22.1<\/td><td>30.0<\/td><td>6.7<\/td><td>8.6<\/td><td>3.9<\/td><td>3.7<\/td><\/tr><tr><td>Proportion of capital expenditures<\/td><td>100%<\/td><td>100%<\/td><td>67.6%<\/td><td>70.9%<\/td><td>20.5%<\/td><td>20.3%<\/td><td>11.9%<\/td><td>8.7%<\/td><\/tr><tr><td>Proportion of total assets<\/td><td>100%<\/td><td>100%<\/td><td>50.9%<\/td><td>50.4%<\/td><td>38.5%<\/td><td>38.3%<\/td><td>10.6%<\/td><td>11.3%<\/td><\/tr><\/table><p>Petersen’s preferred method to determine which division is becoming less significant over time is to review the relationship between capital expenditures and total assets by operating division. He plans to base his conclusion on the assumption that the current year&#x27;s investment behavior is representative of future investment patterns.<\/p><p>Petersen knows that revenues in the children’s products division have suffered because of declining birth rates in Europe and North America, but he believes that if Rhine can maintain the operating margin for this division then overall company profitability should not be affected.<\/p><p>Corinna Berg, another analyst with the fund, reminds Petersen that during the current year, the US dollar weakened against the euro by 4% and that 50% of the sales in the recreational products division are sold in the United States.<\/p><p>Petersen recalls that some of the recent global expansion was aimed at establishing operations in Ireland because its statutory corporate tax rate is lower than the German rate of 29.8%. If Petersen assumes that other tax credits were the same in the current year as the prior year, he can analyze changes in Rhine’s effective tax rate to determine whether the geographic mix of the company’s profits has changed in the current year.<\/p><p>Petersen finally examines the company’s liquidity ratios, which are shown in Exhibit 2. Even though the company’s current and quick ratio have improved, his interpretation of the changes in the company’s cash conversion cycle is that the company’s liquidity position has deteriorated.<\/p><p>Exhibit 2 Rhine AG Selected Ratios<\/p><table><tr><th>Ratio<\/th><th>Current Year<\/th><th>Prior Year<\/th><th>2 Years Prior<\/th><\/tr><tr><td>Current ratio<\/td><td>2.31<\/td><td>2.17<\/td><td>1.16<\/td><\/tr><tr><td>Quick ratio<\/td><td>1.06<\/td><td>0.89<\/td><td>0.53<\/td><\/tr><tr><td>Accounts receivable turnover<\/td><td>5.82<\/td><td>6.08<\/td><td>6.11<\/td><\/tr><tr><td>Inventory turnover<\/td><td>3.78<\/td><td>3.91<\/td><td>4.09<\/td><\/tr><tr><td>Accounts payable turnover<\/td><td>5.71<\/td><td>5.78<\/td><td>5.60<\/td><\/tr><tr><td>Cash conversion cycle<\/td><td>95 days<\/td><td>90 days<\/td><td>84 days<\/td><\/tr><\/table><p>Worried that the balance sheet–based and cash flow–based accruals ratios (not shown) raise some concerns about the possible use of accruals to manage earnings, Petersen asks Berg for advice on what further type of analysis he should do as a follow-up on this issue.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q52", "rel": [], "los": "FSA · ECO Module 3 Q52", "tier": null, "type": "", "stem": "<p>Which of the following is the most appropriate use of Berg’s reminder about the US dollar versus euro exchange rate in the current year? Peterson should use the information:<\/p>", "options": {"A": "when evaluating management’s historical performance.", "B": "to confirm that the division’s organic growth was less than 11.2%.", "C": "to determine the exchange gains or losses included in net income."}}]}, {"set": 41, "session": 2, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "CI:ECO-M1-Q64", "rel": [], "los": "CI · ECO Module 1 Q64", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information about a company:<\/p><table><tr><th>Pretax income<\/th><th>$1,000,000<\/th><\/tr><tr><td>Corporate tax rate<\/td><td>30%<\/td><\/tr><tr><td>Dividend payout<\/td><td>100%<\/td><\/tr><\/table><p>The shareholder&#x27;s marginal tax rate is 22%. Under the dividend imputation tax system, the effective tax rate on dividends is:<\/p>", "options": {"A": "22.0%.", "B": "30.0%.", "C": "45.4%."}}]}, {"set": 42, "session": 2, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>The Lindqvist Family Foundation manages a $1.4 billion portfolio, of which 65% is invested in public equities and the remainder in bonds and cash. The board has approved a 10% allocation to office real estate and has hired consultant Mateus Corrêa, CFA, to compare two ways of implementing it: buying Harbourline Plaza, a multi-tenant office building, directly, or buying shares of Fennick Office REIT, a listed equity REIT that owns 41 office properties.<\/p>\n<p>At the board meeting, the chair summarizes three objectives for the allocation:<\/p>\n<ul><li>Objective 1: The foundation must be able to reduce the allocation within a few days if grant commitments rise unexpectedly.<\/li>\n<li>Objective 2: The main purpose of the allocation is to lower the volatility of the total portfolio, so the board wants real estate returns that move as little as possible with the foundation's existing equity holdings.<\/li>\n<li>Objective 3: The foundation has no staff with property management experience and does not intend to hire any.<\/li><\/ul>\n<p>Corrêa gathers data on Harbourline Plaza (Exhibit 1) and on Fennick (Exhibit 2). Fennick's leases include contractual rent step-ups, so its reported rental revenue exceeds the cash rent it collects. Fennick acquired an office tower on 1 September 2025; its NOI for the 12 months ended 31 December 2025 includes four months of the tower's NOI, which totaled $3.6 million. Corrêa expects Fennick's cash NOI to grow 2.0% over the next 12 months, and recent sales of comparable office properties imply a capitalization rate of 6.25%. He assumes that the market value of Fennick's debt approximates its book value.<\/p>\n<p>Corrêa also compares Fennick with five other listed office REITs. The six REITs use very different amounts of debt, and the analysts covering them publish AFFO estimates based on differing assumptions about maintenance capital expenditures. The board asks him to rank the six REITs using a single price multiple that (1) is based on a standardized, widely reported earnings measure so that the figures are comparable across companies, and (2) relates the share price to an income measure available to shareholders after interest expense, so that the multiple reflects each REIT's leverage.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Direct Property Option<\/caption><thead><tr><th>Item<\/th><th>Harbourline Plaza<\/th><\/tr><\/thead><tbody><tr><td>Asking price<\/td><td>$138 million<\/td><\/tr><tr><td>Expected first-year NOI<\/td><td>$8.1 million<\/td><\/tr><tr><td>Occupancy<\/td><td>91%<\/td><\/tr><tr><td>Weighted average remaining lease term<\/td><td>6.2 years<\/td><\/tr><tr><td>Lease type<\/td><td>Gross leases (owner pays operating expenses)<\/td><\/tr><tr><td>Available mortgage financing<\/td><td>Up to 60% LTV; minimum DSCR 1.40×<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Fennick Office REIT — Selected Financial Data<\/caption><thead><tr><th>Item (fiscal year 2025 / 31 December 2025)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Net income<\/td><td>$142.9 million<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$88.4 million<\/td><\/tr><tr><td>Gain on sale of office properties<\/td><td>$21.5 million<\/td><\/tr><tr><td>Interest expense<\/td><td>$64.3 million<\/td><\/tr><tr><td>Non-cash (straight-line) rent<\/td><td>$9.8 million<\/td><\/tr><tr><td>Recurring maintenance-type capital expenditures and leasing commissions<\/td><td>$34.2 million<\/td><\/tr><tr><td>Net operating income, last 12 months<\/td><td>$236.0 million<\/td><\/tr><tr><td>Cash and equivalents<\/td><td>$42.5 million<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$31.0 million<\/td><\/tr><tr><td>Land held for future development<\/td><td>$58.0 million<\/td><\/tr><tr><td>Prepaid expenses<\/td><td>$12.5 million<\/td><\/tr><tr><td>Goodwill<\/td><td>$40.0 million<\/td><\/tr><tr><td>Deferred financing costs<\/td><td>$4.0 million<\/td><\/tr><tr><td>Total debt<\/td><td>$1,620.0 million<\/td><\/tr><tr><td>Other liabilities<\/td><td>$95.0 million<\/td><\/tr><tr><td>Shares outstanding<\/td><td>48.0 million<\/td><\/tr><tr><td>Share price<\/td><td>$41.80<\/td><\/tr><tr><td>Dividends per share<\/td><td>$2.90<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s18-q3", "rel": [], "los": "Agent Mock 1 Q71", "tier": null, "type": "", "stem": "Corrêa's estimate of Fennick's net asset value per share (NAVPS) is <i>closest<\/i> to:", "options": {"A": "$45.07.", "B": "$46.63.", "C": "$47.54."}}, {"id": "cMock1:m1-s18-q4", "rel": [], "los": "Agent Mock 1 Q72", "tier": null, "type": "", "stem": "Which price multiple <i>best<\/i> meets the board's two criteria for ranking the six REITs?", "options": {"A": "Price-to-AFFO", "B": "Price-to-FFO", "C": "Enterprise value-to-EBITDA"}}]}, {"set": 43, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M3-Q16", "rel": [], "los": "PM · ECO Module 3 Q16", "tier": null, "type": "", "stem": "<p>Which of the following statements regarding distributions made by ETFs is correct?<\/p>", "options": {"A": "Return-of-capital (ROC) distributions are generally not taxable.", "B": "ETFs generally reinvest any dividends received back into the ETF’s holdings.", "C": "A dividend distribution is a distribution paid to investors in excess of an ETF’s earnings."}}]}, {"set": 44, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Dora Kriser, a financial analyst, is currently evaluating the intercompany investments and earnings quality of Delphine Industries, a large diversified consumer products company that reports under IFRS.<\/p><p>Delphine recently announced that it would be increasing its ownership interest in Company A from 35% to 50%. Delphine and Company A are both profitable. Kriser considers how Delphine&#x27;s net profit margin might be affected after the increase in ownership under the following scenarios:<\/p><p>Scenario 1: Delphine exercises significant influence, but not control, over Company A.<\/p><p>Scenario 2: Delphine exercises control over Company A.<\/p><p>Kriser is concerned that recent industry changes may negatively affect one of Delphine&#x27;s cash-generating units. She evaluates the following projections to determine the expected impairment loss under IFRS:<\/p><p>Carrying value of cash-generating unit: €18,200,000<\/p><p>Recoverable amount of cash-generating unit: €17,700,000<\/p><p>Goodwill allocated to cash-generating unit: €300,000<\/p><p>Next, Kriser analyzes Delphine&#x27;s earnings quality. She begins by examining the cash component and accrual component of Delphine&#x27;s recurring earnings. Based on this examination, she expects Delphine to continue to exhibit a high degree of earnings persistence.<\/p><p>Finally, Kriser examines Delphine&#x27;s statement of cash flows and observes that interest paid is classified as an operating activity and interest received is classified as an investing activity. She considers whether these cash flow classifications could affect comparisons with competitors that report under US GAAP.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q22", "rel": [], "los": "Mock 2 Session 1 Q22", "tier": null, "type": "", "stem": "<p>Based on Kriser&#x27;s projections, the expected impairment loss for Delphine&#x27;s cash-generating unit is:<\/p>", "options": {"A": "€200,000.", "B": "€300,000.", "C": "€500,000."}}]}, {"set": 45, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Liying Wang manages her firm&#x27;s investment-grade bond portfolio. She considers purchasing a senior unsecured bond issued by AHM Manufacturing (the AHM01 bond) for the portfolio. This bond is rated BBB, has a 2-year maturity, and has a 5% annual coupon. Wang assumes a recovery rate of 40% and uses a government yield binomial interest rate model to estimate the fair value of the AHM01 bond. Selected inform

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ECOx Mock 1 — CFA Level II</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1d2330;--mut:#5d6677;--bd:#d5d9e0;--acc:#1f5fbf;--accbg:#e6efff;--ok:#1b7f45;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fbe9e7;--flag:#c77700;--flagbg:#fff1d6;--hl:#fff176}
body.dark{--bg:#14171d;--panel:#1d222b;--fg:#e4e8ef;--mut:#9aa3b2;--bd:#343b48;--acc:#6ea8ff;--accbg:#22314d;--ok:#5fd18b;--okbg:#17332379;--bad:#ff8a80;--badbg:#3d1f1c;--flag:#ffb74d;--flagbg:#3d2f14;--hl:#6b5f00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
textarea{width:100%;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px}
#top{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--bd);flex:none;flex-wrap:wrap}
#top .grow{flex:1}
#timer{font:600 20px/1 ui-monospace,Menlo,monospace}
#timer.low{color:var(--bad)}
#main{flex:1;min-height:0;display:flex}
#left,#right{overflow:auto;padding:14px 18px}
#left{flex:1 1 50%;border-right:1px solid var(--bd);background:var(--panel)}
#right{flex:1 1 50%}
#bottom{flex:none;background:var(--panel);border-top:1px solid var(--bd);padding:6px 14px;display:flex;gap:10px;align-items:center}
#nav{display:flex;flex-wrap:wrap;gap:3px;flex:1;max-height:96px;overflow:auto}
.nb{width:30px;height:26px;padding:0;font-size:12px;position:relative}
.nb.ans{background:var(--accbg);border-color:var(--acc)}
.nb.cur{outline:2px solid var(--acc);outline-offset:1px;font-weight:700}
.nb.fl::after{content:"";position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:var(--flag);border-right-color:var(--flag)}
.nb.setstart{margin-left:8px}
#left table{border-collapse:collapse;margin:10px 0;font-size:14px}
#left th,#left td{border:1px solid var(--bd);padding:3px 9px}
#left th{background:var(--bg)}
#left caption{font-weight:600;text-align:left;padding-bottom:4px}
.vh{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;gap:8px;align-items:center}
mark{background:var(--hl);color:inherit}
.vb{transition:opacity .15s}
.vb.dim{opacity:.35}
#relbtn.on{background:var(--accbg);border-color:var(--acc)}
.nb.nno{color:var(--bad);border-color:var(--bad)}
.nb.out{opacity:.35}
.nb.rok{color:var(--ok);border-color:var(--ok)}
.nb.rvd::before{content:"✓";position:absolute;left:2px;bottom:-1px;font-size:9px;color:var(--ok)}
.sl{font-size:11px;color:var(--mut);align-self:center;margin:0 2px 0 8px}
.why{font-size:13px;color:var(--mut);margin-top:4px}
.note{display:grid;grid-template-columns:40px 1fr;gap:10px 12px;font-size:14px;line-height:1.65;border-top:1px solid var(--bd);margin-top:16px;padding-top:14px}
.nl{font-size:12px;font-weight:600;color:var(--mut);padding-top:2px}
.raw{margin-top:10px;font-size:13px;color:var(--mut)}
.raw .expl{color:var(--fg)}
.sh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#doneb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.stem{font-size:16px;margin:4px 0 14px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin:8px 0;background:var(--panel);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.sel{background:var(--accbg);border-color:var(--acc)}
.opt .l{font-weight:700;min-width:20px}
.opt .t{flex:1}
.opt.strike .t{text-decoration:line-through;opacity:.5}
.opt .x{padding:0 6px;font-size:12px;color:var(--mut)}
.flagbtn.on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.center{max-width:860px;margin:0 auto;padding:22px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px 20px;margin:12px 0}
h1,h2,h3{margin:.4em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
table.r{border-collapse:collapse;width:100%;font-size:14px}
table.r th,table.r td{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left}
table.r td.n,table.r th.n{text-align:right}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.opt{cursor:default}
body.live .opt{cursor:pointer}
.expl{white-space:pre-wrap;font-size:14px;border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;color:var(--mut)}
.warn{color:var(--bad)}.okc{color:var(--ok)}.mut{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:520px;margin:0}
#pauseov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center}
#pauseov.show{display:flex}
#pauseov .card{max-width:440px;text-align:center;margin:0}
#pauseov .big{font:600 44px/1.2 ui-monospace,Menlo,monospace}
@media (max-width:900px){#main{flex-direction:column}#left{border-right:0;border-bottom:1px solid var(--bd);flex:1 1 0;min-height:0}#right{flex:0 0 auto;max-height:45%;padding:8px 18px}#nav{display:none}#bottom{justify-content:center}}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100%"></div>
<div id="pauseov" role="dialog" aria-modal="true" aria-label="일시정지"></div>
<script>
"use strict";
const DATA = {"mock": 1, "sets": [{"set": 1, "session": 1, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>Aaliyah Schultz is a fixed-income portfolio manager at Aries Investments. She supervises Ameris Steele, a junior analyst, who begins building a model that combines structured financial data and sentiment data. Exhibit 1 presents a small sample of the raw dataset before cleansing.<\/p><p>Exhibit 1 – Sample of Raw Structured Data Before Cleansing<\/p><table><tr><th>ID<\/th><th>Ticker<\/th><th>IPO Date<\/th><th>Industry (NAICS)<\/th><th>EBIT<\/th><th>Interest Expense<\/th><th>Total Debt<\/th><\/tr><tr><td>1<\/td><td>ABC<\/td><td>4/6/17<\/td><td>44<\/td><td>9.4<\/td><td>0.6<\/td><td>10.1<\/td><\/tr><tr><td>2<\/td><td>BCD<\/td><td>November 15, 2004<\/td><td>52<\/td><td>5.5<\/td><td>0.4<\/td><td>6.2<\/td><\/tr><tr><td>3<\/td><td>HIJ<\/td><td>26-Jun-74<\/td><td>54<\/td><td>8.9<\/td><td>1.2<\/td><td>15.8<\/td><\/tr><tr><td>4<\/td><td>KLM<\/td><td>14-Mar-15<\/td><td>72<\/td><td>5.7<\/td><td>1.5<\/td><td>0.0<\/td><\/tr><\/table><p>After cleansing the data, Steele preprocesses the dataset. She creates two new variables: an &quot;Age&quot; variable based on the firm&#x27;s IPO date and an &quot;Interest Coverage Ratio&quot; variable equal to EBIT divided by interest expense. She also deletes the &quot;IPO Date&quot; variable from the dataset. After applying these transformations, Steele scales the financial data using normalization. She notes that over the full sample dataset, the &quot;Interest Expense&quot; variable ranges from a minimum of 0.2 and a maximum of 12.2, with a mean of 1.1 and a standard deviation of 0.4.<\/p><p>After properly cleansing and preprocessing the raw text data, Steele performs exploratory data analysis. To assist in feature selection, she wants to create a visualization that shows the most informative words in the dataset based on their term frequency (TF) values.<\/p>", "exhibits": [], "qs": [{"id": "Quant:ECO-M7-Q10", "rel": [], "los": "Quant · ECO Module 7 Q10", "tier": null, "type": "", "stem": "<p>Given her objective, the visualization that Steele should create in the exploratory data analysis step is a:<\/p>", "options": {"A": "scatter plot.", "B": "word cloud.", "C": "document term matrix."}}]}, {"set": 2, "session": 1, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Carl Hirayo, CFA, recently joined Summit Investments as a portfolio manager. Hirayo plans to participate in Tarragon Petroleum’s IPO for both his personal account and his clients&#x27; accounts. He obtains preclearance for his own participation because the IPO is not fully subscribed at that time. The offering turns out to be fully subscribed at the time of issue and Summit receives all requested shares. Hirayo allocates these shares on a pro rata basis among his subscribing clients and his own account.<\/p><p>While meeting with a client at a restaurant, Hirayo overhears two brokers talking about ION, an electronic manufacturing company. The brokers discuss a report that was released online earlier in the morning by a leading analyst. The report included a merger rumor about ION and the analyst placed a strong buy recommendation on the stock. Hirayo calls his broker to buy 4,000 shares of ION for his personal account.<\/p><p>Hirayo will receive a $60,000 performance bonus from Summit if his monthly portfolio performance exceeds that of Summit&#x27;s other portfolios. He discloses the bonus arrangement to his existing clients but not to prospective clients. Separately, Hirayo will receive a $12,000 reward from Summit after he successfully brought in 20 clients from his previous employer. This reward is paid by Summit and is not charged to clients. Hirayo does not disclose this reward arrangement to the clients that he brought over.<\/p><p>Summit&#x27;s management team decides to further strengthen its record retention policy. The current policy has the following notable provisions:<\/p><p>Provision 1: Client meeting notes must be preserved in electronic form; hence, any hard copies must be digitized.<\/p><p>Provision 2: Informal blog posts and short message form posts sourced from the internet do not need to be preserved.<\/p><p>Provision 3: Research reports and all supporting documents have a retention period of three years.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q41", "rel": [], "los": "Mock 1 Session 2 Q41", "tier": null, "type": "", "stem": "<p>With respect to the IPO, does Hirayo violate the Standard relating to priority of transactions?<\/p>", "options": {"A": "No", "B": "Yes, because he allocates shares to himself", "C": "Yes, because he applied for the IPO for his personal account"}}, {"id": "Mock1:mock1-2-Q42", "rel": [], "los": "Mock 1 Session 2 Q42", "tier": null, "type": "", "stem": "<p>When purchasing ION shares, does Hirayo violate the Standards?<\/p>", "options": {"A": "No", "B": "Yes, because he acts on material nonpublic information", "C": "Yes, because he does not have a reasonable basis for buying the shares"}}, {"id": "Mock1:mock1-2-Q43", "rel": [], "los": "Mock 1 Session 2 Q43", "tier": null, "type": "", "stem": "<p>In relation to his compensation, Hirayo violates the Standards when he fails to disclose:<\/p>", "options": {"A": "the $60,000 bonus only.", "B": "the $12,000 reward only.", "C": "both the $60,000 bonus and the $12,000 reward."}}, {"id": "Mock1:mock1-2-Q44", "rel": [], "los": "Mock 1 Session 2 Q44", "tier": null, "type": "", "stem": "<p>To comply with the Standards, which provision in Summit’s record retention policy should be amended?<\/p>", "options": {"A": "Provision 1", "B": "Provision 2", "C": "Provision 3"}}]}, {"set": 3, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Adrienne Yu is an analyst with an international bank. She analyzes Ambleu S.A. (“Ambleu”), a multinational corporation, for a client presentation. Ambleu complies with IFRS, and its presentation currency is the Norvoltian krone (NVK). Ambleu’s two subsidiaries, Ngcorp and Cendaró, have different functional currencies: Ngcorp uses the Bindiar franc (₣B) and Cendaró uses the Crenland guinea (CRG).<\/p><p>Yu first analyzes the following three transactions to assess foreign currency transaction exposure:<\/p><p>Transaction 1:<\/p><p>Cendaró sells goods to a non-domestic customer that pays in dollars on the purchase date.<\/p><p>Transaction 2:<\/p><p>Ngcorp obtains a loan in Bindiar francs on 1 June 2016 from a European bank with the Norvoltian krone as its presentation currency.<\/p><p>Transaction 3:<\/p><p>Ambleu imports inventory from Bindiar under 45-day credit terms, and the payment is to be denominated in Bindiar francs.<\/p><p>Yu then reviews Transactions 2 and 3. She determines the method that Ambleu would use to translate Transaction 2 into its 31 December 2016 consolidated financial statements. While analyzing Transaction 3, Yu notes that Ambleu purchased inventory on 1 June 2016 for ₣B27,000/ton. Ambleu pays for the inventory on 15 July 2016. Exhibit 1 presents selected economic data for Bindiar and Crenland.<\/p><p>Exhibit 1<\/p><p>Selected Economic Data for Bindiar and Crenland<\/p><table><tr><th>Date<\/th><th>Spot ₣B/NVK Exchange Rate<\/th><th>Bindiar Inflation Rate (%)<\/th><th>Spot CRG/NVK Exchange Rate<\/th><th>Crenland Inflation Rate (%)<\/th><th>Crenland GPI<\/th><\/tr><tr><td>31 Dec 2015<\/td><td>—<\/td><td>—<\/td><td>5.6780<\/td><td>—<\/td><td>100.0<\/td><\/tr><tr><td>1 Jun 2016<\/td><td>4.1779<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>15 Jul 2016<\/td><td>4.1790<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>31 Dec 2016<\/td><td>4.2374<\/td><td>3.1<\/td><td>8.6702<\/td><td>40.6<\/td><td>140.6<\/td><\/tr><tr><td>Average 2016<\/td><td>4.3450<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>31 Dec 2017<\/td><td>4.3729<\/td><td>2.1<\/td><td>14.4810<\/td><td>62.3<\/td><td>228.2<\/td><\/tr><tr><td>Average 2017<\/td><td>4.3618<\/td><td>—<\/td><td>11.5823<\/td><td>—<\/td><td>186.2<\/td><\/tr><\/table><p>Prior to reviewing the 2016 and 2017 consolidated financial statements of Ambleu, Yu meets with her supervisor, who asks Yu the following two questions:<\/p><p>Question 1:<\/p><p>Would a foreign currency translation loss reduce Ambleu’s net sales growth?<\/p><p>Question 2:<\/p><p>According to IFRS, what disclosures should be included relating to Ambleu’s treatment of foreign currency translation for Ngcorp?<\/p><p>To complete her assignment, Yu analyzes selected information and notes from Ambleu’s 2016 and 2017 consolidated financial statements, presented in Exhibit 2.<\/p><p>Exhibit 2<\/p><p>Selected Information and Notes from Consolidated Financial Statements of Ambleu S.A. (in NVK millions)<\/p><table><tr><th>Income Statement<\/th><th>2017<\/th><th>2016<\/th><th><\/th><th>Balance Sheet<\/th><th>2017<\/th><th>2016<\/th><\/tr><tr><td>Revenue (1)<\/td><td>1,069<\/td><td>1,034<\/td><td><\/td><td>Cash(3)<\/td><td>467<\/td><td>425<\/td><\/tr><tr><td>Profit before tax<\/td><td>294<\/td><td>269<\/td><td><\/td><td>Intangibles (4)<\/td><td>575<\/td><td>570<\/td><\/tr><tr><td>Income tax expense (2)<\/td><td>−96<\/td><td>−94<\/td><td><\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>Net profit<\/td><td>198<\/td><td>175<\/td><td><\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><\/table><p>Note 1: Cendaro’s revenue for 2017 is CRG125.23 million.<\/p><p>Note 2: Ambleu’s consolidated income tax rate decreases by 2.29%, from 34.94% (=94/269) in 2016 to 32.65% (=96/294) in 2017. The largest component of the decrease stems from the 1.42% change in the effect of tax rates in non-domestic jurisdictions, which lowers Ambleu’s consolidated income tax rate in 2016 by 3.34% (=9/269) and in 2017 by 4.76% (=14/294).<\/p><p>Reconciliation of Income Tax Expense (in NVK millions)<\/p><table><tr><th><\/th><th>2017<\/th><th>2016<\/th><\/tr><tr><td>Income tax at Ambleu’s domestic tax rate<\/td><td>102<\/td><td>92<\/td><\/tr><tr><td>Effect of tax rates on non-domestic jurisdictions<\/td><td>−14<\/td><td>−9<\/td><\/tr><tr><td>Unrecognized current year tax losses<\/td><td>8<\/td><td>11<\/td><\/tr><tr><td>Income tax expense<\/td><td>96<\/td><td>94<\/td><\/tr><\/table><p>Note 3: The parent company transferred NVK15 million to Cendaró on 1 January 2016 to purchase a patent from a competitor for CRG85.17 million.<\/p><p>Note 4: The 2016 consolidated balance sheet includes Ngcorp’s total intangible assets of NVK3 million, which were added to Ngcorp’s balance sheet on 15 July 2016.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q1", "rel": [], "los": "FSA · ECO Module 3 Q1", "tier": null, "type": "", "stem": "<p>Which transaction would generate foreign currency transaction exposure for Ambleu?<\/p>", "options": {"A": "Transaction 1", "B": "Transaction 2", "C": "Transaction 3"}}, {"id": "FSA:ECO-M3-Q2", "rel": [], "los": "FSA · ECO Module 3 Q2", "tier": null, "type": "", "stem": "<p>Yu’s determination regarding Transaction 2 should be based on the currency of the:<\/p>", "options": {"A": "loan.", "B": "bank.", "C": "borrower."}}, {"id": "FSA:ECO-M3-Q3", "rel": [], "los": "FSA · ECO Module 3 Q3", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, what is the foreign exchange gain resulting from Transaction 3 on the 31 December 2016 financial statements?<\/p>", "options": {"A": "NVK1.70 per ton", "B": "NVK90.75 per ton", "C": "NVK248.54 per ton"}}, {"id": "FSA:ECO-M3-Q4", "rel": [], "los": "FSA · ECO Module 3 Q4", "tier": null, "type": "", "stem": "<p>What is the best response to Question 1?<\/p>", "options": {"A": "Yes", "B": "No, because it would reduce organic sales growth", "C": "No, because it would reduce net price realization and mix"}}, {"id": "FSA:ECO-M3-Q7", "rel": [], "los": "FSA · ECO Module 3 Q7", "tier": null, "type": "", "stem": "<p>Based on Exhibit 2 and Note 2, the change in Ambleu’s consolidated income tax rate from 2016 to 2017 most likely resulted from a:<\/p>", "options": {"A": "decrease in Ambleu’s domestic tax rate.", "B": "more profitable business mix in its subsidiaries.", "C": "stronger Norvoltian krone relative to the currencies of its subsidiaries."}}]}, {"set": 4, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Hiram Life (Hiram), a large multinational insurer located in Canada, has received permission to increase its ownership in an India-based life insurance company, LICIA, from 26% to 49%. Before completing this transaction, Hiram wants to complete a risk assessment of LICIA’s investment portfolio. Judith Hamilton, Hiram’s chief financial officer, has been asked to brief the management committee on investment risk in its India-based insurance operations.<\/p><p>LICIA’s portfolio, which has a market value of CAD260 million, is currently structured as shown in Exhibit 1. Despite its more than 1,000 individual holdings, the portfolio is invested predominantly in India. The Indian government bond market is highly liquid, but the country’s mortgage and infrastructure loan markets, as well as the corporate bond market, are relatively illiquid. Individual mortgage and corporate bond positions are large relative to the normal trading volumes in these securities. Given the elevated current and fiscal account deficits, Indian investments are also subject to above-average economic risk.<\/p><p>Hamilton begins with a summary of the India-based portfolio. Exhibit 1 presents the current portfolio composition and the risk and return assumptions used to estimate value at risk (VaR).<\/p><p>Exhibit 1<\/p><p>Selected Assumptions for LICIA’s Investment Portfolio<\/p><table><tr><th><\/th><th>Allocation<\/th><th>Average Daily Return<\/th><th>Daily Standard Deviation<\/th><\/tr><tr><td>India government securities<\/td><td>50%<\/td><td>0.015%<\/td><td>0.206%<\/td><\/tr><tr><td>India mortgage/infrastructure loans<\/td><td>25%<\/td><td>0.045%<\/td><td>0.710%<\/td><\/tr><tr><td>India corporate bonds<\/td><td>15%<\/td><td>0.025%<\/td><td>0.324%<\/td><\/tr><tr><td>India equity<\/td><td>10%<\/td><td>0.035%<\/td><td>0.996%<\/td><\/tr><\/table><p>Infrastructure is a rapidly growing asset class with limited return history; the first infrastructure loans were issued just 10 years ago.<\/p><p>Hamilton’s report to the management committee must outline her assumptions and provide support for the methods she used in her risk assessment. If needed, she will also make recommendations for rebalancing the portfolio to ensure its risk profile is aligned with that of Hiram.<\/p><p>Hamilton develops the assumptions shown in Exhibit 2, which will be used for estimating the portfolio VaR.<\/p><p>Exhibit 2<\/p><p>VaR Input Assumptions for Proposed CAD260 Million Portfolio<\/p><table><tr><th>Method<\/th><th>Average Return Assumption<\/th><th>Standard Deviation Assumption<\/th><\/tr><tr><td>Monte Carlo simulation<\/td><td>0.026%<\/td><td>0.501%<\/td><\/tr><tr><td>Parametric approach<\/td><td>0.026%<\/td><td>0.501%<\/td><\/tr><tr><td>Historical simulation<\/td><td>0.023%<\/td><td>0.490%<\/td><\/tr><\/table><p>Hamilton elects to apply a one-day, 5% VaR limit of CAD2 million in her risk assessment of LICIA’s portfolio. This limit is consistent with the risk tolerance the committee has specified for the Hiram portfolio.<\/p><p>The markets’ volatility during the last 12 months has been significantly higher than the historical norm, with increased frequency of large daily losses, and Hamilton expects the next 12 months to be equally volatile.<\/p><p>She estimates the one-day 5% portfolio VaR for LICIA’s portfolio using three different approaches:<\/p><p>Exhibit 3<\/p><p>VaR Results over a One-Day Period for Proposed Portfolio<\/p><table><tr><th>Method<\/th><th>5% VaR<\/th><\/tr><tr><td>Monte Carlo simulation<\/td><td>CAD2,095,565<\/td><\/tr><tr><td>Parametric approach<\/td><td>CAD2,083,610<\/td><\/tr><tr><td>Historical simulation<\/td><td>CAD1,938,874<\/td><\/tr><\/table><p>The committee is likely to have questions in a number of key areas—the limitations of the VaR report, potential losses in an extreme adverse event, and the reliability of the VaR numbers if the market continues to exhibit higher-than-normal volatility. Hamilton wants to be certain that she has thoroughly evaluated the risks inherent in the LICIA portfolio and compares them with the risks in Hiram’s present portfolio.<\/p><p>Hamilton believes the possibility of a ratings downgrade on Indian sovereign debt is high and not yet fully reflected in securities prices. If the rating is lowered, many of the portfolio’s holdings will no longer meet Hiram’s minimum ratings requirement. A downgrade’s effect is unlikely to be limited to the government bond portfolio. All asset classes can be expected to be affected to some degree. Hamilton plans to include a scenario analysis that reflects this possibility to ensure that management has the broadest possible view of the risk exposures in the India portfolio.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M5-Q26", "rel": [], "los": "PM · ECO Module 5 Q26", "tier": null, "type": "", "stem": "<p>What additional risk measures would be most appropriate to add to Hamilton’s risk assessment?<\/p>", "options": {"A": "Delta", "B": "Duration", "C": "Tracking error"}}]}, {"set": 5, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Anita Daani, a research analyst, is evaluating the financial institutions in her coverage universe. She begins with an analysis of KTR Insurance, a property and casualty (P&amp;C) insurance company. KTR reports under IFRS with a fiscal year end of 31 December. The company has two employee compensation plans:<\/p><p>Plan A - a defined benefit pension plan<\/p><p>Plan B - a share-based compensation plan which grants restricted stock units (RSUs)<\/p><p>For the most recent year, Daani calculates the amount recognized by KTR as an operating expense in its income statement related to Plan A. She observes that Plan A had a current service cost of $10 million and a past service cost of $2 million for the most recent year.<\/p><p>Daani next assesses the dilutive effect of the share-based compensation plan on KTR&#x27;s financial statements. She uses the treasury stock method and the data for the most recent year for Plan B in Exhibit 1. Daani assumes that KTR has no other potentially dilutive securities outstanding besides the RSUs granted under Plan B.<\/p><p>Exhibit 1<\/p><table><tr><th>Basic shares outstanding at end of year<\/th><th>2,700 million<\/th><\/tr><tr><td>Number of unvested RSUs at end of year<\/td><td>150 million<\/td><\/tr><tr><td>Average unrecognized share-based compensation expense<\/td><td>$840 million<\/td><\/tr><tr><td>Average share price during the most recent year<\/td><td>$7<\/td><\/tr><\/table><p>On 1 January of the current year, KTR grants 2 million new RSUs to employees under Plan B. The share price on the grant date was $8 and the vesting period is 4 years. Daani calculates the effect of the new RSU grants under Plan B on KTR&#x27;s financial statements for the current year.<\/p><p>Daani next analyzes KTR&#x27;s competitive position in the P&amp;C insurance industry. She uses data in Exhibit 2 to compare KTR and its peers in their efficiency of obtaining new premiums.<\/p><p>Exhibit 2<\/p><table><tr><th><\/th><th>KTR<\/th><th>Peer Company 1<\/th><th>Peer Company 2<\/th><\/tr><tr><td>Loss and loss adjustment expense ratio<\/td><td>59.5%<\/td><td>65.4%<\/td><td>61.9%<\/td><\/tr><tr><td>Underwriting expense ratio<\/td><td>38.1%<\/td><td>30.7%<\/td><td>33.2%<\/td><\/tr><tr><td>Combined ratio<\/td><td>97.6%<\/td><td>96.1%<\/td><td>95.1%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q21", "rel": [], "los": "Mock 1 Session 1 Q21", "tier": null, "type": "", "stem": "<p>For the most recent year, KTR&#x27;s operating expense (in $ millions) related to Plan A was:<\/p>", "options": {"A": "8.", "B": "10.", "C": "12."}}, {"id": "Mock1:mock1-1-Q22", "rel": [], "los": "Mock 1 Session 1 Q22", "tier": null, "type": "", "stem": "<p>Using the treasury stock method, KTR&#x27;s number of diluted shares outstanding at the end of the most recent year (in millions) is closest to:<\/p>", "options": {"A": "2,730.", "B": "2,850.", "C": "2,970."}}, {"id": "Mock1:mock1-1-Q23", "rel": [], "los": "Mock 1 Session 1 Q23", "tier": null, "type": "", "stem": "<p>In KTR&#x27;s current year financial statements, which of the following would result from its new RSU grants under Plan B?<\/p>", "options": {"A": "$4 million increase in compensation expense", "B": "$4 million increase in cash flow from financing activities", "C": "$16 million increase in share-based compensation reserve"}}]}, {"set": 6, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M1-Q11", "rel": [], "los": "PM · ECO Module 1 Q11", "tier": null, "type": "", "stem": "<p>Default-free real interest rates tend to be relatively high in countries with high expected economic growth because investors:<\/p>", "options": {"A": "increase current borrowing.", "B": "have high inter-temporal rates of substitution.", "C": "have high uncertainty about levels of future consumption."}}, {"id": "PM:ECO-M1-Q16", "rel": [], "los": "PM · ECO Module 1 Q16", "tier": null, "type": "", "stem": "<p>One interpretation of an upward sloping yield curve is that the returns to short-dated bonds are:<\/p>", "options": {"A": "uncorrelated with bad times.", "B": "more positively correlated with bad times than are returns to long-dated bonds.", "C": "more negatively correlated with bad times than are returns to long-dated bonds."}}, {"id": "PM:ECO-M1-Q28", "rel": [], "los": "PM · ECO Module 1 Q28", "tier": null, "type": "", "stem": "<p>Which of the following statements relating to commercial real estate is correct?<\/p>", "options": {"A": "Rental income from commercial real estate is generally unstable across business cycles.", "B": "Commercial real estate investments generally offer a good hedge against bad consumption outcomes.", "C": "The key difference in the discount rates applied to the cash flows of equity investments and commercial real estate investments relates to liquidity."}}, {"id": "PM:ECO-M1-Q54", "rel": [], "los": "PM · ECO Module 1 Q54", "tier": null, "type": "", "stem": "<p>Recovery rates on corporate bonds tend to be higher when the economy is expanding because:<\/p>", "options": {"A": "credit spreads are higher.", "B": "default probabilities are lower.", "C": "any secured assets are likely to be sold at a higher price."}}]}, {"set": 7, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>BetterCare Hospitals, Inc. operates a chain of hospitals throughout the United States. The company has been expanding by acquiring local hospitals. Its largest acquisition, that of Statewide Medical, was made in 2001 under the pooling of interests method. BetterCare complies with US GAAP.<\/p><p>BetterCare is currently forming a 50/50 joint venture with Supreme Healthcare under which the companies will share control of several hospitals. BetterCare plans to use the equity method to account for the joint venture. Supreme Healthcare complies with IFRS and will use the proportionate consolidation method to account for the joint venture.<\/p><p>Erik Ohalin is an equity analyst who covers both companies. He has estimated the joint venture’s financial information for 2018 in order to prepare his estimates of each company’s earnings and financial performance. This information is presented in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Selected Financial Statement Forecasts for Joint Venture ($ Millions)<\/p><table><tr><th>Year ending 31 December<\/th><th>2018<\/th><\/tr><tr><td>Revenue<\/td><td>1,430<\/td><\/tr><tr><td>Operating income<\/td><td>128<\/td><\/tr><tr><td>Net income<\/td><td>62<\/td><\/tr><tr><td>31 December<\/td><td>2018<\/td><\/tr><tr><td>Total assets<\/td><td>1,500<\/td><\/tr><tr><td>Shareholders’ equity<\/td><td>740<\/td><\/tr><\/table><p>Supreme Healthcare recently announced it had formed a special purpose entity through which it plans to sell up to $100 million of its accounts receivable. Supreme Healthcare has no voting interest in the SPE, but it is expected to absorb any losses that it may incur. Ohalin wants to estimate the impact this will have on Supreme Healthcare’s consolidated financial statements.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q17", "rel": [], "los": "FSA · ECO Module 1 Q17", "tier": null, "type": "", "stem": "<p>Based on Ohalin’s estimates, the amount of joint venture revenue (in $ millions) included on BetterCare’s consolidated 2018 financial statements should be closest to:<\/p>", "options": {"A": "$0.", "B": "$715.", "C": "$1,430."}}]}, {"set": 8, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Nathan Moffet is a fixed-income portfolio manager analyzing the credit risk within a corporate bond portfolio.<\/p><p>Moffet purchases a senior unsecured bond issued by Company A at a price of $105.35. The bond has the following characteristics:<\/p><p>An 8% annual-pay coupon, a face value of $100, and no embedded options<\/p><p>Three years remain to maturity and a coupon has just been paid<\/p><p>Moffet collects information on the bond in Exhibit 1, which provides end-of-period data. He uses the information to consider a base case scenario where the bond defaults at the end of Year 3.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Exposure<\/th><th>Recovery<\/th><th>Loss Given Default<\/th><th>Probability of Default<\/th><th>Expected Loss<\/th><th>Discount Factor<\/th><th>Present Value (PV) of Expected Loss<\/th><\/tr><tr><td>Year 1<\/td><td>$117.57<\/td><td>$47.03<\/td><td>$70.54<\/td><td>5.00%<\/td><td>$3.53<\/td><td>0.9709<\/td><td>$3.43<\/td><\/tr><tr><td>Year 2<\/td><td>$112.85<\/td><td>$45.14<\/td><td>$67.71<\/td><td>4.75%<\/td><td>$3.22<\/td><td>0.9426<\/td><td>$3.04<\/td><\/tr><tr><td>Year 3<\/td><td>$108.00<\/td><td>$43.20<\/td><td>$64.80<\/td><td>4.51%<\/td><td>$2.92<\/td><td>0.9151<\/td><td>$2.67<\/td><\/tr><tr><td>Sum<\/td><td>---<\/td><td>---<\/td><td>---<\/td><td>14.26%<\/td><td>$9.67<\/td><td>---<\/td><td>$9.14<\/td><\/tr><\/table><p>Moffet learns that Company B plans to issue a covered bond. He considers the benefits of covered bonds from the perspective of the company.<\/p><p>Moffet owns $10 million of Bond 1, a 5-year senior unsecured bond issued by Company C. He recently bought credit protection on Company C using a $10 million notional value CDS. The CDS can be settled by physical or cash settlement and its reference obligation is Bond 1. Company C recently filed for bankruptcy and Moffet gathers the information in Exhibit 2 on its outstanding debt obligations.<\/p><p>Exhibit 2<\/p><table><tr><th><\/th><th>Seniority<\/th><th>Tenor<\/th><th>Par Value<\/th><th>Current Price<\/th><\/tr><tr><td>Bond 1<\/td><td>Senior unsecured<\/td><td>5 years<\/td><td>$100<\/td><td>$40<\/td><\/tr><tr><td>Bond 2<\/td><td>Senior unsecured<\/td><td>4 years<\/td><td>$100<\/td><td>$35<\/td><\/tr><\/table><p>Moffet is considering buying CDS protection on Company D. He does not own any of the company&#x27;s debt. He gathers the following information for a 3-year CDS on Company D:<\/p><p>The credit spread is 550 bps<\/p><p>The effective duration is 2.8<\/p><p>The coupon rate is 5.0%<\/p><p>Moffet estimates the upfront premium needed to buy the CDS protection.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q9", "rel": [], "los": "Mock 1 Session 2 Q9", "tier": null, "type": "", "stem": "<p>Under his base case scenario, the annualized return on Moffet&#x27;s Company A bond investment would be closest to:<\/p>", "options": {"A": "–19.57%.", "B": "–15.45%.", "C": "–9.29%."}}, {"id": "Mock1:mock1-2-Q11", "rel": [], "los": "Mock 1 Session 2 Q11", "tier": null, "type": "", "stem": "<p>Would the two settlement methods for the CDS on Company C result in the same total proceeds for Moffet?<\/p>", "options": {"A": "Yes", "B": "No, cash settlement would result in higher total proceeds", "C": "No, physical settlement would result in higher total proceeds"}}, {"id": "Mock1:mock1-2-Q12", "rel": [], "los": "Mock 1 Session 2 Q12", "tier": null, "type": "", "stem": "<p>As a percentage of the notional amount, the estimated upfront premium for the CDS on Company D is closest to:<\/p>", "options": {"A": "1.0%.", "B": "1.4%.", "C": "1.5%."}}]}, {"set": 9, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Dong Tian is an equity analyst whose required ROE is 10%. He evaluates the stocks of several companies.<\/p><p>Company A<\/p><p>Tian wants to value Company A using a suitable DCF model. His forecasts on Company A are presented in Exhibit 1. Tian assumes that there are no capital issuances or repayments during his forecast period.<\/p><p>Exhibit 1<\/p><table><tr><th>Year<\/th><th>Dividend Payout Ratio<\/th><th>Earnings ($ millions)<\/th><th>Operating Cash Flow ($ millions)<\/th><th>Capital Expenditure ($ millions)<\/th><\/tr><tr><td>1<\/td><td>30%<\/td><td>81.90<\/td><td>125.00<\/td><td>100.00<\/td><\/tr><tr><td>2<\/td><td>25%<\/td><td>83.76<\/td><td>131.25<\/td><td>120.00<\/td><\/tr><tr><td>3<\/td><td>20%<\/td><td>85.32<\/td><td>137.81<\/td><td>144.00<\/td><\/tr><tr><td>4<\/td><td>15%<\/td><td>86.52<\/td><td>144.70<\/td><td>172.80<\/td><\/tr><tr><td>5<\/td><td>5%<\/td><td>87.23<\/td><td>151.94<\/td><td>207.36<\/td><\/tr><\/table><p>Company C<\/p><p>Company C has just paid out an annual dividend of $2 per share. Tian expects dividends from Company C to grow at 5% annually in perpetuity and calculates the fair value of the stock of Company C using the Gordon growth model.<\/p><p>Company D<\/p><p>Company D just ended the year with earnings per share of $3 and its stock trades at $40 per share. Tian expects Company D&#x27;s earnings to grow at 10% next year and calculates the present value of growth opportunities reflected in its share price.<\/p><p>Company E<\/p><p>Company E has just declared an annual dividend of $1 per share. Tian expects the company to have a dividend growth rate of 20% every year for the next 10 years and thereafter grow dividends at 8% per year in perpetuity. He calculates the fair value of Company E&#x27;s stock using the H-model.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M2-Q43", "rel": [], "los": "Equity · ECO Module 2 Q43", "tier": null, "type": "", "stem": "<p>For company A, the most suitable forecast input to a DCF model is:<\/p>", "options": {"A": "dividends.", "B": "free cash flow.", "C": "residual income."}}, {"id": "Equity:ECO-M2-Q44", "rel": [], "los": "Equity · ECO Module 2 Q44", "tier": null, "type": "", "stem": "<p>The fair value of Company C&#x27;s stock for Tian is closest to:<\/p>", "options": {"A": "$21.", "B": "$40.", "C": "$42."}}]}, {"set": 10, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>John Thronen is an analyst in the research department of an international securities firm. Thronen is preparing a research report on Topmaker, Inc., a publicly-traded company that complies with IFRS. Thronen reviews two of Topmaker’s recent transactions relating to investments in Blanco Co. and Rainer Co.<\/p><p>Investment in Blanca Co.<\/p><p>On 1 January 2016, Topmaker invested $11 million in Blanca Co. debt securities (with a 5.0% stated coupon rate on par value, payable each 31 December). The par value of the securities is $10 million, and the market interest rate in effect when the bonds were purchased was 4.0%. Topmaker designates the investment as held-to-maturity. On 31 December 2016, the fair value of the securities was $12 million.<\/p><p>Blanca Co. plans to raise $40 million in capital by borrowing against its financial receivables. Blanca plans to create a special purpose entity (SPE), invest $10 million in the SPE, have the SPE borrow $40 million, and then use the total funds to purchase $50 million of receivables from Blanca. Blanca meets the definition of control and plans to consolidate the SPE. Blanca’s current balance sheet is presented in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Blanca Co. Balance Sheet at 31 December 2016 ($ millions)<\/p><table><tr><th>Cash<\/th><th>20<\/th><th><\/th><th>Current liabilities<\/th><th>25<\/th><\/tr><tr><td>Accounts receivable<\/td><td>50<\/td><td><\/td><td>Noncurrent liabilities<\/td><td>30<\/td><\/tr><tr><td>Other assets<\/td><td>30<\/td><td><\/td><td>Shareholders’ equity<\/td><td>45<\/td><\/tr><tr><td>Total assets<\/td><td>100<\/td><td><\/td><td>Total liabilities and equity<\/td><td>100<\/td><\/tr><\/table><p>Investment in Rainer Co.<\/p><p>On 1 January 2016, Topmaker acquired a 15% equity interest with voting power in Rainer Co. for $300 million. Exhibit 2 presents selected financial information for Rainer on the acquisition date. Thronen notes that the plant and equipment are depreciated on a straight-line basis and have 10 years of remaining life. Topmaker has representation on Rainer’s board of directors and participates in the associate’s policy-making process.<\/p><p>Exhibit 2<\/p><p>Selected Financial Data for Rainer Co., 1 January 2016 (Acquisition Date) ($ millions)<\/p><table><tr><th><\/th><th>Book Value<\/th><th>Fair Value<\/th><\/tr><tr><td>Current assets<\/td><td>270<\/td><td>270<\/td><\/tr><tr><td>Plant and equipment<\/td><td>2,900<\/td><td>3,160<\/td><\/tr><tr><td>Total assets<\/td><td>3,170<\/td><td>3,430<\/td><\/tr><tr><td>Liabilities<\/td><td>1,830<\/td><td>1,830<\/td><\/tr><tr><td>Net assets<\/td><td>1,340<\/td><td>1,600<\/td><\/tr><\/table><p>Thronen notes that, for fiscal year 2016, Rainer reported total revenue of $1,740 million and net income of $360 million, and paid dividends of $220 million.<\/p><p>Thronen is concerned about possible goodwill impairment for Topmaker due to expected changes in the industry effective at the end of 2017. He calculates the impairment loss based on selected data from the projected consolidated balance sheet data presented in Exhibit 3, assuming that the cash-generating unit and reporting unit of Topmaker are the same.<\/p><p>Exhibit 3<\/p><p>Selected Financial Data for Topmaker, Inc., Estimated Year Ending 31 December 2017 ($ millions)<\/p><table><tr><th>Carrying value of cash-generating unit/reporting unit<\/th><th>15,200<\/th><\/tr><tr><td>Recoverable amount of cash-generating unit/reporting unit<\/td><td>14,900<\/td><\/tr><tr><td>Fair value of reporting unit<\/td><td>14,800<\/td><\/tr><tr><td>Identifiable net assets<\/td><td>14,400<\/td><\/tr><tr><td>Goodwill<\/td><td>520<\/td><\/tr><\/table><p>Finally, Topmaker announces its plan to increase its ownership interest in Rainer to 80% effective 1 January 2018 and will account for the investment in Rainer using the partial goodwill method. Thronen estimates that the fair market value of the Rainer’s shares on the expected date of exchange is $2 billion with the identifiable assets valued at $1.5 billion.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q26", "rel": [], "los": "FSA · ECO Module 1 Q26", "tier": null, "type": "", "stem": "<p>Using only the information from Exhibit 2, the carrying value of Topmaker’s investment in Rainer at the end of 2016 is closest to:<\/p>", "options": {"A": "$282 million.", "B": "$317 million.", "C": "$321 million."}}]}, {"set": 11, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Jane Lee is the new chief investment officer of the Eastland University Endowment Fund (the Fund). Historically, the Fund has invested based on a 60% equity/40% fixed-income allocation. However, Lee is looking to change the fund’s allocation to include real estate assets after incorporating data from the appraisal-based Global Real Estate Fund Index. GREFI returns and volatilities imply strong risk-adjusted performance from real estate assets with low correlation with stocks and bonds. Lee is considering the following two asset allocations:<\/p><p>Allocation 1: 50% equity/35% fixed income/15% real estate<\/p><p>Allocation 2: 55% equity/35% fixed income/10% real estate<\/p><p>Allocation 1 is based on an allocation model incorporating the GREFI data, while Allocation 2 assumes a higher correlation between real estate and other asset classes in an attempt to adjust for smoothing and therefore has a lower real estate market allocation.<\/p><p>Lee recently hired Jon Tarrow as the Fund’s new head of real estate. During a recent meeting, Tarrow and Lee concluded that the initial real estate investment strategy would be to acquire stabilized office buildings located in primary markets. Tarrow has been working on the potential acquisition of a 100% occupied Class A office building located in New York City. Tarrow and his junior analyst will conduct a thorough due diligence process for the property. Tarrow has also hired an appraiser to value the building and provide valuation support. The appraiser will use three different approaches to estimate the building’s value but will place emphasis on both the direct capitalization and the discounted cash flow methods.<\/p><p>During an internal meeting, the junior analyst makes the following three statements about the appraiser’s two primary valuation methods:<\/p><p>Statement 1: The direct capitalization method requires an estimation of a terminal value.<\/p><p>Statement 2: Properties expected to generate faster growth will require a capitalization rate that results in a higher value.<\/p><p>Statement 3: The direct capitalization and discounted cash flow methods both consider growth and property quality.<\/p><p>The appraiser has concluded that net operating income for the New York City office building is expected to be USD15.6 million for the first year, and after that, NOI is expected to increase at 0.50% annually for the foreseeable future. The building’s value is also expected to increase by 0.50% annually, and investors expect to achieve a 5.75% required rate of return given the level of risk.<\/p><p>After considering the appraiser’s valuation, Lee then tells Tarrow that she can negotiate a purchase price of USD283 million for the building. Furthermore, she can procure a loan with an interest-only 5.25% coupon provided that the loan-to-value ratio does not exceed 65% and the debt service coverage ratio is at least 1.65×, with the loan balance due after 10 years.<\/p>", "exhibits": [], "qs": [{"id": "AI:ECO-M2-Q3", "rel": [], "los": "AI · ECO Module 2 Q3", "tier": null, "type": "", "stem": "<p>Which of the following phases of the due diligence process is most likely to ensure that the building’s NOI projection for the next year is correct?<\/p>", "options": {"A": "Documentation review", "B": "Current lease review", "C": "Future lease outlook"}}, {"id": "AI:ECO-M2-Q5", "rel": [], "los": "AI · ECO Module 2 Q5", "tier": null, "type": "", "stem": "<p>The maximum loan amount that the Fund can obtain on the New York City office building is closest to:<\/p>", "options": {"A": "USD111.5 million.", "B": "USD180.1 million.", "C": "USD184 million."}}]}, {"set": 12, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Triofind, Inc. (Triofind), based in the country of Norvolt, provides wireless services to various countries, including Norvolt, Borliand, Abuelio, and Certait. The company’s presentation currency is the Norvolt euro (NER), and Triofind complies with IFRS. Triofind has two wholly owned subsidiaries, located in Borliand and Abuelio. The Borliand subsidiary (Triofind-B) was established on 30 June 2016, by Triofind both investing NER1,000,000, which was converted into Borliand dollars (BRD), and borrowing an additional BRD500,000.<\/p><p>Marie Janssen, a financial analyst in Triofind’s Norvolt headquarters office, translates Triofind-B’s financial statements using the temporal method. Non-monetary assets are measured at cost under the lower of cost or market rule. Spot BRD/NER exchange rates are presented in Exhibit 1, and the balance sheet for Triofind-B is presented in Exhibit 2.<\/p><p>Exhibit 1<\/p><p>Spot BRD/NER Exchange Rates<\/p><table><tr><th>Date<\/th><th>BRD per NER<\/th><\/tr><tr><td>30 June 2016<\/td><td>1.15<\/td><\/tr><tr><td>Weighted-average rate when inventory was acquired (2016)<\/td><td>1.19<\/td><\/tr><tr><td>31 December 2016<\/td><td>1.20<\/td><\/tr><tr><td>Weighted-average rate when inventory was acquired (2017)<\/td><td>1.18<\/td><\/tr><tr><td>30 June 2017<\/td><td>1.17<\/td><\/tr><\/table><p>Exhibit 2<\/p><p>Triofind-B Balance Sheet for 2016 and 2017 (BRD)<\/p><table><tr><th>Assets<\/th><th>31 December 2016<\/th><th>30 June 2017<\/th><th>Liabilities and Stockholders’ Equity<\/th><th>31 December 2016<\/th><th>30 June 2017<\/th><\/tr><tr><td>Cash<\/td><td>900,000<\/td><td>1,350,000<\/td><td>Notes payable<\/td><td>500,000<\/td><td>500,000<\/td><\/tr><tr><td>Inventory<\/td><td>750,000<\/td><td>500,000<\/td><td>Common stock<\/td><td>1,150,000<\/td><td>1,150,000<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td>Retained earnings<\/td><td><\/td><td>200,000<\/td><\/tr><tr><td>Total<\/td><td>1,650,000<\/td><td>1,850,000<\/td><td>Total<\/td><td>1,650,000<\/td><td>1,850,000<\/td><\/tr><\/table><p>Janssen next analyzes Triofind’s Abuelio subsidiary (Triofind-A), which uses the current rate method to translate its results into Norvolt euros. Triofind-A, which prices its goods in Abuelio pesos (ABP), sells mobile phones to a customer in Certait on 31 May 2017 and receives payment of 1 million Certait rand (CRD) on 31 July 2017.<\/p><p>On 31 May 2017, Triofind-A also received NER50,000 from Triofind and used the funds to purchase a new warehouse in Abuelio. Janssen translates the financial statements of Triofind-A as of 31 July 2017 and must determine the appropriate value for the warehouse in Triofind’s presentation currency. She observes that the cumulative Abuelio inflation rate exceeded 100% from 2015 to 2017. Spot exchange rates and inflation data are presented in Exhibit 3.<\/p><p>Exhibit 3<\/p><p>Spot Exchange Rates and Inflation Data for Triofind-A<\/p><table><tr><th>Date<\/th><th>NER per CRD<\/th><th>NER per ABP<\/th><th>Abuelio Monthly Inflation Rate (%)<\/th><\/tr><tr><td>31 May 2017<\/td><td>0.2667<\/td><td>0.0496<\/td><td>—<\/td><\/tr><tr><td>30 June 2017<\/td><td>0.2703<\/td><td>0.0388<\/td><td>25<\/td><\/tr><tr><td>31 July 2017<\/td><td>0.2632<\/td><td>0.0312<\/td><td>22<\/td><\/tr><\/table><p>Janssen gathers corporate tax rate data and company disclosure information to include in Triofind’s annual report. She determines that the corporate tax rates for Abuelio, Norvolt, and Borliand are 35%, 34%, and 0%, respectively, and that Norvolt exempts the non-domestic income of multinationals from taxation. Triofind-B constitutes 25% of Triofind’s net income, and Triofind-A constitutes 15%. Janssen also gathers data on components of net sales growth in different countries, presented in Exhibit 4.<\/p><p>Exhibit 4<\/p><p>Components of Net Sales Growth (%) Fiscal Year 2017<\/p><table><tr><th>Country<\/th><th>Contribution from Volume Growth<\/th><th>Contribution from Price Growth<\/th><th>Foreign Currency Exchange<\/th><th>Net Sales Growth<\/th><\/tr><tr><td>Abuelio<\/td><td>7<\/td><td>6<\/td><td>−2<\/td><td>11<\/td><\/tr><tr><td>Borliand<\/td><td>4<\/td><td>5<\/td><td>4<\/td><td>13<\/td><\/tr><tr><td>Norvolt<\/td><td>7<\/td><td>3<\/td><td>—<\/td><td>10<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q12", "rel": [], "los": "FSA · ECO Module 3 Q12", "tier": null, "type": "", "stem": "<p>Based on Exhibits 1 and 2 and Janssen’s translation method, retained earnings for Triofind-B translated into Triofind’s presentation currency as of 30 June 2017 are closest to:<\/p>", "options": {"A": "NER150,225.", "B": "NER170,940.", "C": "NER172,414."}}]}, {"set": 13, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Rila Rakia &amp; Beer Ltd. (RRBL), a small privately owned company, produces high quality rakia (a high-potency hard liquor), vino (wine), and bira (beer) in Bulgaria. After Bulgaria joined the European Union in 2007, international demand for the country’s liquor, wine, and beer increased substantially. Most firms in the industry, including RRBL, have been reporting double-digit sales growth on a year-over-year basis.<\/p><p>Metiu Metev, a portfolio strategist at a major German investment consulting firm, inherited RRBL from his grandparents. Frankfurter Destillerie &amp; LiqueurFabrik (FDLF), a German distillery interested in entering the Bulgarian market, has made a cash offer of BGN900 million for the company’s equity (BGN = Bulgarian Lev; EUR1 = BGN1.95586, pegged rate). FDLF will assume RRBL’s entire outstanding debt, including both current liabilities and long-term debt. If Metev does not want to sell a controlling interest, FDLF’s minimum equity stake will be 40%, with an appropriate discount for lack of control.<\/p><p>Metev starts by evaluating the company himself using the capitalized cash flow method (CCM) and taking the following steps:<\/p><p>Using the build-up method to estimate the required rate of return on equity<\/p><p>Computing the firm’s weighted average cost of capital (WACC) using the book values of debt and considering the current weight of total debt in capital structure to be optimal<\/p><p>Exhibits 1A, 1B, 2, and 3 contain RRBL’s financial data and other inputs that Metev uses.<\/p><p>Before responding to FDLF’s offer, however, Metev meets with Vasil Nenkov, his colleague and a senior equity analyst covering the wine and beer industry in the Balkan region. After reviewing the data and Metev’s valuation analysis, Nenkov suggests that 11% would be a more reasonable estimate of RRBL’s WACC based on an analysis of industry peers. Metev decides to use this rate to calculate the value of RRBL’s equity.<\/p><p>Nenkov also makes the following comments:<\/p><p>Comment 1: CCM is most often used for the valuation of large public companies, and it is less valid for valuing private companies such as RRBL.<\/p><p>Comment 2: The excess earnings method is preferable because it provides an estimate of the value of intangible assets by capitalizing future earnings in excess of the estimated return requirements associated with working capital and fixed assets.<\/p><p>Nenkov also suggests that the enterprise value (EV) multiple approach should work well for valuing RRBL. After searching his database, Nenkov finds that Rhodopi Wineries PLC, a publicly traded company and a close competitor of RRBL, is currently valued at an EV/EBITDA (earnings before interest, taxes, depreciation, and amortization) multiple of 7.2. Nenkov further suggests two adjustments:<\/p><p>Adjustment 1: RRBL should command an upward adjustment of 25% in the EV/EBITDA multiple reflecting its lower risk and higher growth relative to Rhodopi Wineries.<\/p><p>Adjustment 2: Forward-looking EBITDA should be used to determine RRBL’s value.<\/p><p>On a cautionary note, Nenkov makes two statements regarding the use of EV/EBITDA approach to valuation.<\/p><p>Statement 1: It is more appropriate than the P/E for comparing companies with different financial leverage.<\/p><p>Statement 2: EBITDA underestimates cash flow from operations if working capital is growing.<\/p><p>Finally, Metev recalls FDLF’s willingness to purchase a non-controlling ownership interest at a discount for lack of control. Nenkov responds by saying that a control premium of 30% is typically applied for purchase transactions of small privately owned firms similar to RRBL and that proper adjustment for lack of control should be made if the transaction involves a non-controlling interest. Metev thanks Nenkov for his help and goes back to his desk to revise his valuations.<\/p><p>Exhibit 1A RRBL EBITDA and Other Data (BGN millions)<\/p><table><tr><th><\/th><th>FY2012 (Actual)<\/th><th>FY2013 (Pro Forma)<\/th><\/tr><tr><td>Revenues<\/td><td>248.5<\/td><td>300.6<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>–132.3<\/td><td>–172.5<\/td><\/tr><tr><td>Gross profit<\/td><td>116.2<\/td><td>128.1<\/td><\/tr><tr><td>Selling, general, and administrative expenses<\/td><td>–19.2<\/td><td>–23.0<\/td><\/tr><tr><td>EBITDA<\/td><td>97<\/td><td>105.1<\/td><\/tr><\/table><p>Other Data<\/p><table><tr><th>Capital expenditures<\/th><th>2.5<\/th><th>4<\/th><\/tr><tr><td>Interest expense<\/td><td>2.7<\/td><td>3.6<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>5<\/td><td>6.4<\/td><\/tr><tr><td>Increase in working capital<\/td><td>0.8<\/td><td>1<\/td><\/tr><\/table><p>Exhibit 1B Additional Information for RRBL<\/p><table><tr><th>Pre-tax cost of debt<\/th><th>10.00%<\/th><\/tr><tr><td>Weight of total debt in capital structure<\/td><td>30%<\/td><\/tr><tr><td>Tax rate<\/td><td>25%<\/td><\/tr><\/table><p>Exhibit 2 RRBL Balance Sheet for FY2012 (BGN millions)<\/p><table><tr><th>Assets<\/th><th><\/th><th>Liabilities and Equity<\/th><th><\/th><\/tr><tr><td>Cash and short-term investment<\/td><td>50<\/td><td>Accounts payable<\/td><td>10<\/td><\/tr><tr><td>Receivables and inventory<\/td><td>40<\/td><td>Notes payable<\/td><td>8<\/td><\/tr><tr><td>Net fixed assets<\/td><td>50<\/td><td>Long-term debt<\/td><td>30<\/td><\/tr><tr><td>Patents and trademarks<\/td><td>20<\/td><td>Common equity<\/td><td>112<\/td><\/tr><tr><td>Total assets<\/td><td>100<\/td><td>Total liabilities and equity<\/td><td>160<\/td><\/tr><\/table><p>Exhibit 3 Other Data and Inputs<\/p><table><tr><th>Bulgarian government’s 10-year bond yield<\/th><th>3.90%<\/th><\/tr><tr><td>Beta of publicly traded firms in the industry<\/td><td>0.75<\/td><\/tr><tr><td>Equity risk premium<\/td><td>6.00%<\/td><\/tr><tr><td>Small stock risk premium<\/td><td>2.50%<\/td><\/tr><tr><td>Industry risk premium<\/td><td>0.00%<\/td><\/tr><tr><td>RRBL’s company-specific risk premium<\/td><td>1.50%<\/td><\/tr><tr><td>Long-term growth rate beyond FY2013<\/td><td>5.00%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Equity:ECO-M6-Q29", "rel": [], "los": "Equity · ECO Module 6 Q29", "tier": null, "type": "", "stem": "<p>According to the method used by Metev for computing the cost of equity and data in Exhibits 1B and 3, RRBL’s WACC is closest to:<\/p>", "options": {"A": "9.2%.", "B": "10.9%.", "C": "12.0%."}}, {"id": "Equity:ECO-M6-Q30", "rel": [], "los": "Equity · ECO Module 6 Q30", "tier": null, "type": "", "stem": "<p>According to the revised method used by Metev, the WACC suggested by Nenkov, and the data provided in Exhibit 3, RRBL’s capitalization rate is closest to:<\/p>", "options": {"A": "6.0%.", "B": "8.5%.", "C": "11.0%."}}]}, {"set": 14, "session": 1, "topic": "Economics", "code": "ECO", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "Econ:ECO-M2-Q44", "rel": [], "los": "Econ · ECO Module 2 Q44", "tier": null, "type": "", "stem": "<p>Based on the Grinold–Kroner model, which of the following factors is the primary channel through which economic growth can impact equity returns?<\/p>", "options": {"A": "Dividend yield", "B": "Earnings growth per share", "C": "Expected repricing term of the market&#x27;s P/E ratio"}}, {"id": "Econ:ECO-M2-Q51", "rel": [], "los": "Econ · ECO Module 2 Q51", "tier": null, "type": "", "stem": "<p>Which of the following growth theories assumes that technological progress translates into higher population growth?<\/p>", "options": {"A": "Classical model", "B": "Neoclassical model", "C": "Endogenous growth model"}}, {"id": "Econ:ECO-M2-Q68", "rel": [], "los": "Econ · ECO Module 2 Q68", "tier": null, "type": "", "stem": "<p>Which of the following statements regarding factors of economic growth is most accurate?<\/p>", "options": {"A": "Developing countries would not benefit from removing restrictions on foreign direct and indirect investment", "B": "Tax policies discouraging entrepreneurship tend to be more prevalent in developing countries compared to developed countries", "C": "Incremental spending on primary and secondary education has a significant impact on innovation and growth in developed countries"}}]}, {"set": 15, "session": 1, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p>Corvane Instruments is a listed, mid-sized manufacturer of laboratory analysers. Its chief executive, Ingrid Hallström, has agreed terms to acquire all of the shares of Pellis Diagnostics, a privately controlled maker of point-of-care test kits. Hallström tells the board, \"Pellis gives us immediate access to the fast-growing point-of-care market, which would take us at least five years to build organically.\"<\/p>\n<p>The acquisition will be financed entirely with new Corvane shares: each Pellis shareholder will receive 0.75 Corvane shares per Pellis share. Corvane's shares trade at &euro;56.00. Before rumours of the deal, Pellis shares last changed hands in a private transaction at &euro;30.00. Corvane will assume Pellis's debt.<\/p>\n<p>Corvane's corporate development analyst, Mateo Ferreira, values Pellis using comparable transaction analysis based on the median EV/EBITDA multiple of recent acquisitions of diagnostics companies, and he also gathers trading multiples of listed diagnostics peers (Exhibit 1). For the first full year after closing, he projects pre-tax cost synergies of &euro;20 million and amortization of acquired intangible assets of &euro;8 million. He assumes that the standalone results of both companies remain at their 2025 levels and that all pre-tax items are taxed at 25%.<\/p>\n<p>Hallström has also proposed two further actions. First, Corvane would sell its headquarters campus to an insurance company and lease it back for 15 years; the insurer can finance the property at a lower cost than Corvane. Second, Corvane would divest its non-core industrial weighing division. The board wants this divestment to raise cash to repay the debt assumed from Pellis and to end Corvane's exposure to the weighing business entirely. Three industrial companies have approached Corvane about buying the division.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Selected Data for Corvane and Pellis<\/caption><thead><tr><th>(&euro; millions, except per share and multiples)<\/th><th>Corvane<\/th><th>Pellis<\/th><\/tr><\/thead><tbody><tr><td>Net income, 2025<\/td><td>180.0<\/td><td>&mdash;<\/td><\/tr><tr><td>Income before tax, 2025<\/td><td>&mdash;<\/td><td>50.0<\/td><\/tr><tr><td>EBITDA, 2025<\/td><td>&mdash;<\/td><td>84.0<\/td><\/tr><tr><td>Total debt / cash, 31 December 2025<\/td><td>&mdash;<\/td><td>120.0 / 30.0<\/td><\/tr><tr><td>Shares outstanding (millions)<\/td><td>60.0<\/td><td>20.0<\/td><\/tr><tr><td>Median EV/EBITDA, recent acquisitions of diagnostics companies<\/td><td>&mdash;<\/td><td>12.0&times;<\/td><\/tr><tr><td>Median EV/EBITDA, listed diagnostics peers (trading)<\/td><td>&mdash;<\/td><td>9.5&times;<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s07-q2", "rel": [], "los": "Agent Mock 1 Q26", "tier": null, "type": "", "stem": "Using Ferreira's assumptions, Corvane's pro forma EPS for the first full year after the acquisition is <i>closest<\/i> to:", "options": {"A": "&euro;2.83.", "B": "&euro;2.90.", "C": "&euro;3.02."}}]}, {"set": 16, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Herbert Erikson is examining the multinational operations of Obsidian AG, a eurozone company that reports under IFRS.<\/p><p>During the most recent year, Obsidian made unhedged export sales to customers located in non-eurozone countries. On 31 December, the end of the most recent year, USD 1 million of accounts receivable remained outstanding. At the time of sale, the EUR/USD (amount of EUR per 1 USD) exchange rate was 0.950. On 31 December, the EUR/USD exchange rate was 0.965.<\/p><p>On 1 January of the most recent year, Obsidian formed two new subsidiaries: Ametrine, a UK-based company, and Citrine, a Poland-based company. Ametrine was consolidated using the current rate method, while Citrine was consolidated using the temporal method. The GBP and the Polish zloty (PLN) steadily strengthened against the EUR throughout the year. All of the combined PP&amp;E, and a major portion of the inventory that was sold during the year, were acquired when the companies were formed. Both companies were profitable and had positive shareholders&#x27; equity in their first year of operations.<\/p><p>Kunzite is a wholly owned subsidiary that Obsidian acquired six years ago. Erikson is concerned that Kunzite is based in a country that may soon become hyperinflationary, and considers the appropriate accounting treatment when Obsidian consolidates Kunzite.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q18", "rel": [], "los": "Mock 1 Session 2 Q18", "tier": null, "type": "", "stem": "<p>On 31 December of the most recent year, after translating Ametrine, Obsidian should have reported a:<\/p>", "options": {"A": "foreign exchange loss on its consolidated income statement.", "B": "positive translation adjustment on its consolidated balance sheet.", "C": "negative translation adjustment on its consolidated balance sheet."}}]}, {"set": 17, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>SCAI is a registered investment adviser based in Nashville, Tennessee, providing investment and private wealth management advice to endowments, retirement plans, and corporations. Dieter Klopp, a portfolio manager, is meeting with analysts Nabil Salah and Lisa Suarez to discuss fixed-income investment opportunities and portfolio management strategies. Klopp presents the group with the information on spot rates shown in Exhibit 1:<\/p><p>Exhibit 1 Spot Rates for Zero-Coupon Bonds<\/p><table><tr><th>Maturity (Years)<\/th><th>Spot Rate<\/th><\/tr><tr><td>1<\/td><td>2.041%<\/td><\/tr><tr><td>2<\/td><td>2.598%<\/td><\/tr><tr><td>3<\/td><td>2.818%<\/td><\/tr><tr><td>4<\/td><td>2.956%<\/td><\/tr><tr><td>5<\/td><td>3.304%<\/td><\/tr><\/table><p>Salah is currently evaluating a corporate bond and makes the following statements:<\/p><p>• Statement 1: “The value of a bond calculated by discounting its future cash flows by their corresponding spot rates will be the same as the value obtained by discounting future cash flows by the yield-to-maturity of a bond, as long as the yield-to-maturity is some weighted average of the spot rates.”<\/p><p>• Statement 2: “Yield-to-maturity is a good estimate of the expected return on a bond assuming coupons are reinvested at the prevailing spot rates.”<\/p><p>• Statement 3: “If the yield curve remains flat during the holding period, the realized rate of return on a bond will be the same as the expected rate of return.”<\/p><p>Salah asks Klopp to explain the spot curve in Exhibit 1. Klopp responds that the spot rate curve in Exhibit 1 is derived from the par curve using a process called bootstrapping. The par rates are yields-to-maturity, at various maturities, for on-the-run, coupon-paying government bonds priced at par. Bootstrapping is a process of forward substitution, where successive spot rates are derived from par rates one at a time. The process begins with recognizing that the one-year spot rate is the same as the one-year par rate. The two-year spot rate, r(2), is then calculated by solving the following equation:<\/p><p>Par Value= 2-year Par coupon(1+2)+2-year Par coupon+Par value(1+r(2))2.<\/p><p>This process continues until all spot rates are derived.<\/p><p>Klopp then asks Suarez how the spot curve can be used in fixed-income analysis. Suarez responds, “Our expectations regarding the evolution of future spot rates compared to the forward curve allow for an evaluation of the relative value of a bond and the identification of appropriate bond trading strategies. Interest rate scenarios and corresponding appropriate strategies are outlined here”:<\/p><p>• Scenario 1: If we expect future spot rates to be lower than current forward rates, then we should short the bond since it is likely to be overvalued.<\/p><p>• Scenario 2: If the spot curve is expected to be above the forward curve and our expectations turn out to be correct, the bond should be purchased since the one-year return will be more than the one-year risk-free rate.<\/p><p>• Scenario 3: If the yield curve is upward sloping and we expect it to remain static, then a strategy of buying bonds with maturities longer than the investment holding period will allow us to earn a return greater than a maturity matching strategy.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q69", "rel": [], "los": "FI · ECO Module 1 Q69", "tier": null, "type": "", "stem": "<p>Is Klopp’s statement on par rates and bootstrapping most likely correct?<\/p>", "options": {"A": "Yes.", "B": "No, he is incorrect about par rates.", "C": "No, he is incorrect about bootstrapping."}}]}, {"set": 18, "session": 1, "topic": "Derivatives", "code": "DER", "vignette": "<p>Athena Advisors Inc. offers portfolio replication services to pension funds and insurance companies through the use of options. Clients are typically able to replicate market exposures with smaller than normal investments of funds. Athena manages exposures for its client Wertfin Insurance Company related to annuities indexed to the German Blue Chip Equity Index. Athena portfolio manager Hannes Messer is meeting with Wertfin&#x27;s risk manager, Jens Szillat, who has asked to learn more about the principles behind the option strategies being employed.<\/p><p>Szillat tells Messer, &quot;I am somewhat familiar with option valuation models; however, I would like to learn more about Athena&#x27;s methodologies with respect to the index options you are managing for our portfolio.&quot;<\/p><p>Messer replies, &quot;The binomial valuation model can be applied to the two-year European style index call options we purchased one year ago. The applicable underlying instrument is the German Blue Chip Equity price index, which excludes dividends. Exhibit 1 shows the option&#x27;s characteristics at the time of purchase.&quot;<\/p><p>Exhibit 1 – Binomial Model Variables<\/p><table><tr><th>u<\/th><th>1.15<\/th><\/tr><tr><td>d<\/td><td>0.90<\/td><\/tr><tr><td>π<\/td><td>0.52<\/td><\/tr><tr><td>Index price<\/td><td>EUR 720<\/td><\/tr><tr><td>Strike price<\/td><td>EUR 750<\/td><\/tr><tr><td>Hedge ratio<\/td><td>0.5697<\/td><\/tr><tr><td>1-year interest rate<\/td><td>3%<\/td><\/tr><tr><td>S–<\/td><td>648<\/td><\/tr><tr><td>C–<\/td><td>0<\/td><\/tr><\/table><p>Messer explains, &quot;Of course, with the index moving down 10% in the last 12 months, the payoffs with these options could have been replicated without using options.&quot; Szillat responds, &quot;My understanding is that the payoff would have been the same as the call option if you had purchased 0.5697 index units and lent EUR 356.79 at the one-year interest rate.&quot;<\/p><p>Messer continues, &quot;Twelve months ago, I noted that two-year puts with a strike price of EUR750 cost EUR38.48. Using the information in Exhibit 1 and today&#x27;s index value, the binomial valuation model calculates the current price of the put as EUR80.15. It is actually trading now above that price at EUR92.&quot;<\/p><p>Szillat responds, &quot;I am curious whether you also use the Black–Scholes–Merton (BSM) model for valuation. I understand the BSM and binomial models both have the following three assumptions in common.<\/p><p>• Assumption 1: Trading is possible at every instant.<\/p><p>• Assumption 2: Volatility can be predicted with certainty.<\/p><p>• Assumption 3: The annualized returns on the underlying follow a normal distribution.&quot;<\/p><p>Szillat then asks, &quot;How do you utilize the BSM model?&quot;<\/p><p>Messer answers, &quot;We use the BSM model to calculate estimates on a wide array of comparative option variables, such as how much the option value will change for a change in a particular parameter. For example, we can estimate how the rate of change of an option price speeds up or slows down for a given change in the price of the underlying index.&quot;<\/p><p>Messer concludes, &quot;We also use the BSM model to calculate the implied volatility. The implied volatilities of the index options expiring in one year are shown in Exhibit 2.&quot;<\/p><p>Exhibit 2 – Implied Volatility Curve<\/p><table><tr><th>Strike Price<\/th><th>Implied Volatility<\/th><\/tr><tr><td>700<\/td><td>18.70<\/td><\/tr><tr><td>710<\/td><td>17.98<\/td><\/tr><tr><td>720<\/td><td>17.38<\/td><\/tr><tr><td>730<\/td><td>16.69<\/td><\/tr><tr><td>740<\/td><td>15.83<\/td><\/tr><tr><td>750<\/td><td>15.40<\/td><\/tr><tr><td>760<\/td><td>14.50<\/td><\/tr><tr><td>770<\/td><td>14.03<\/td><\/tr><tr><td>780<\/td><td>13.21<\/td><\/tr><tr><td>790<\/td><td>12.11<\/td><\/tr><tr><td>800<\/td><td>11.09<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Deriv:ECO-M2-Q34", "rel": [], "los": "Deriv · ECO Module 2 Q34", "tier": null, "type": "", "stem": "<p>Using the binomial valuation method and the data in Exhibit 1, the price Messer paid one year ago for the call option with a strike price of EUR750 is closest to:<\/p>", "options": {"A": "EUR47.57.", "B": "EUR51.54.", "C": "EUR102.08."}}, {"id": "Deriv:ECO-M2-Q38", "rel": [], "los": "Deriv · ECO Module 2 Q38", "tier": null, "type": "", "stem": "<p>In describing how call option prices change, Messer is most likely referring to:<\/p>", "options": {"A": "vega.", "B": "delta.", "C": "gamma."}}]}, {"set": 19, "session": 1, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "CI:ECO-M4-Q13", "rel": [], "los": "CI · ECO Module 4 Q13", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information in conducting comparable transaction analysis of an acquisition. For her analysis, she uses the median of valuation ratios from three recently closed comparable acquisitions.<\/p><table><tr><th>Valuation Variable<\/th><th>Acquired Company 1<\/th><th>Acquired Company 2<\/th><th>Acquired Company 3<\/th><\/tr><tr><td>Acquisition share price<\/td><td>$30<\/td><td>$40<\/td><td>$50<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$2.20<\/td><td>$3.00<\/td><\/tr><\/table><p>If the target company had an EPS of $2.50 and was acquired at a price of $40 per share, the analyst should conclude that the acquirer:<\/p>", "options": {"A": "underpaid for this transaction.", "B": "paid fair value for this transaction.", "C": "overpaid for this transaction."}}, {"id": "CI:ECO-M4-Q16", "rel": [], "los": "CI · ECO Module 4 Q16", "tier": null, "type": "", "stem": "<p>A company has $189 million in sales and $17 million of EBIT. All else equal, if the company restructures its operations to achieve an EBIT margin of 20%, the required percentage reduction in its operating expenses is closest to:<\/p>", "options": {"A": "9.9%.", "B": "11.0%.", "C": "12.1%."}}]}, {"set": 20, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Ross Wyman is a portfolio manager for a family office. He plans to add commodities to his client&#x27;s holdings and meets with Tina Becker, a commodity advisor.<\/p><p>Wyman and Becker discuss the current market prices for three commodities, summarized in Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Commodity 1<\/th><th>Commodity 2<\/th><th>Commodity 3<\/th><\/tr><tr><td>Spot price<\/td><td>$1,688<\/td><td>$830<\/td><td>$87.20<\/td><\/tr><tr><td>Near-term futures price<\/td><td>$1,688<\/td><td>$835<\/td><td>$85.90<\/td><\/tr><tr><td>Farther-term futures price<\/td><td>$1,707<\/td><td>$835<\/td><td>$84.60<\/td><\/tr><\/table><p>Becker provides additional information about Commodity 3. She notes that hedging demand by consumers currently exceeds hedging demand by producers and that the convenience yield exceeds direct storage costs.<\/p><p>Wyman takes a fully collateralized long futures position in Commodity 3 at a price of $84.60. Two months later, he rolls the entire position from the near-term futures contract into the farther-term futures contract. At that point, the near-term futures price is $85.50 and the farther-term futures price is $84.10. The collateral earned an annualized return of 1.2% during the two months.<\/p><p>Wyman also considers investing in a commodity index. His objective is to select the index that provides the largest contribution to performance based on the following two expectations:<\/p><p>trending commodity markets, where outperforming assets continue to go up in price and underperforming assets continue to drift lower;<\/p><p>no changes in the shapes of forward curves, with some markets currently in backwardation and others in contango.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q14", "rel": [], "los": "Mock 2 Session 1 Q14", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1 and Becker&#x27;s additional information, the shape of the futures price curve of Commodity 3 is most consistent with the:<\/p>", "options": {"A": "insurance theory.", "B": "theory of storage.", "C": "hedging pressure hypothesis."}}, {"id": "Mock2:mock2-Q16", "rel": [], "los": "Mock 2 Session 1 Q16", "tier": null, "type": "", "stem": "<p>Based on his objective regarding the commodity index investment, Wyman should select an index that:<\/p>", "options": {"A": "rebalances frequently and contains a large percentage of constituents in backwardation.", "B": "rebalances frequently and contains a small percentage of constituents in backwardation.", "C": "rebalances infrequently and contains a large percentage of constituents in backwardation."}}]}, {"set": 21, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M2-Q1", "rel": [], "los": "PM · ECO Module 2 Q1", "tier": null, "type": "", "stem": "<p>Wei Liu makes two statements about active portfolio management:<\/p><p>Statement 1: The “active return” of an actively managed portfolio is the difference between the portfolio’s return and the return on the benchmark portfolio, and it is equal to the managed portfolio’s alpha.<\/p><p>Statement 2: The active weights are the differences in the managed portfolio’s weights and the benchmark’s weights.<\/p><p>Are Liu’s statements correct?<\/p>", "options": {"A": "Only Statement 1 is correct.", "B": "Only Statement 2 is correct.", "C": "Both statements are correct."}}]}, {"set": 22, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Hana Okonkwo is a credit analyst at Ridgeline Bond Fund. She is reviewing two issuers whose bonds the fund holds: Corvane Bank, a regional bank, and Brackwater Insurance, a property and casualty (P&amp;C) insurer.<\/p>\n<p>Corvane was founded as a state development bank to finance farming and food processing in its home region, and most of its loans are still made to borrowers in that region. The national government had owned 51% of Corvane since its founding, as part of a long-standing policy of owning strategically important lenders. In 2025, as part of a broad privatization program, the government sold its entire stake to private investors.<\/p>\n<p>Okonkwo's notes on Corvane include the following observations:<\/p>\n<p>Observation 1: Corvane has issued €1.4 billion of standby letters of credit and unfunded loan commitments to commercial property developers. These are not recognized on its balance sheet.<br>\nObservation 2: Corvane's allowance for loan losses fell from 1.6 times to 1.1 times its non-performing loans during 2025.<br>\nObservation 3: Net interest income rose to 85% of Corvane's operating revenue, and trading income fell to 2%.<\/p>\n<p>Corvane's regulator applies the Basel III minimum capital ratios. Under its rules, goodwill and other intangible assets and all deferred tax assets are deducted in computing Common Eq

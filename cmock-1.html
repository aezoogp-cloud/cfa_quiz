<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent Mock 1 — CFA Level II</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1d2330;--mut:#5d6677;--bd:#d5d9e0;--acc:#1f5fbf;--accbg:#e6efff;--ok:#1b7f45;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fbe9e7;--flag:#c77700;--flagbg:#fff1d6;--hl:#fff176}
body.dark{--bg:#14171d;--panel:#1d222b;--fg:#e4e8ef;--mut:#9aa3b2;--bd:#343b48;--acc:#6ea8ff;--accbg:#22314d;--ok:#5fd18b;--okbg:#17332379;--bad:#ff8a80;--badbg:#3d1f1c;--flag:#ffb74d;--flagbg:#3d2f14;--hl:#6b5f00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
textarea{width:100%;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px}
#top{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--bd);flex:none;flex-wrap:wrap}
#top .grow{flex:1}
#timer{font:600 20px/1 ui-monospace,Menlo,monospace}
#timer.low{color:var(--bad)}
#main{flex:1;min-height:0;display:flex}
#left,#right{overflow:auto;padding:14px 18px}
#left{flex:1 1 50%;border-right:1px solid var(--bd);background:var(--panel)}
#right{flex:1 1 50%}
#bottom{flex:none;background:var(--panel);border-top:1px solid var(--bd);padding:6px 14px;display:flex;gap:10px;align-items:center}
#nav{display:flex;flex-wrap:wrap;gap:3px;flex:1;max-height:96px;overflow:auto}
.nb{width:30px;height:26px;padding:0;font-size:12px;position:relative}
.nb.ans{background:var(--accbg);border-color:var(--acc)}
.nb.cur{outline:2px solid var(--acc);outline-offset:1px;font-weight:700}
.nb.fl::after{content:"";position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:var(--flag);border-right-color:var(--flag)}
.nb.setstart{margin-left:8px}
#left table{border-collapse:collapse;margin:10px 0;font-size:14px}
#left th,#left td{border:1px solid var(--bd);padding:3px 9px}
#left th{background:var(--bg)}
#left caption{font-weight:600;text-align:left;padding-bottom:4px}
.vh{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;gap:8px;align-items:center}
mark{background:var(--hl);color:inherit}
.vb{transition:opacity .15s}
.vb.dim{opacity:.35}
#relbtn.on{background:var(--accbg);border-color:var(--acc)}
.nb.nno{color:var(--bad);border-color:var(--bad)}
.nb.out{opacity:.35}
.nb.rvd::before{content:"✓";position:absolute;left:2px;bottom:-1px;font-size:9px;color:var(--ok)}
.sl{font-size:11px;color:var(--mut);align-self:center;margin:0 2px 0 8px}
.why{font-size:13px;color:var(--mut);margin-top:4px}
.note{display:grid;grid-template-columns:40px 1fr;gap:10px 12px;font-size:14px;line-height:1.65;border-top:1px solid var(--bd);margin-top:16px;padding-top:14px}
.nl{font-size:12px;font-weight:600;color:var(--mut);padding-top:2px}
.raw{margin-top:10px;font-size:13px;color:var(--mut)}
.raw .expl{color:var(--fg)}
.sh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#doneb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.stem{font-size:16px;margin:4px 0 14px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin:8px 0;background:var(--panel);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.sel{background:var(--accbg);border-color:var(--acc)}
.opt .l{font-weight:700;min-width:20px}
.opt .t{flex:1}
.opt.strike .t{text-decoration:line-through;opacity:.5}
.opt .x{padding:0 6px;font-size:12px;color:var(--mut)}
.flagbtn.on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.center{max-width:860px;margin:0 auto;padding:22px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px 20px;margin:12px 0}
h1,h2,h3{margin:.4em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
table.r{border-collapse:collapse;width:100%;font-size:14px}
table.r th,table.r td{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left}
table.r td.n,table.r th.n{text-align:right}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.opt{cursor:default}
body.live .opt{cursor:pointer}
.expl{white-space:pre-wrap;font-size:14px;border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;color:var(--mut)}
.warn{color:var(--bad)}.okc{color:var(--ok)}.mut{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:520px;margin:0}
#pauseov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center}
#pauseov.show{display:flex}
#pauseov .card{max-width:440px;text-align:center;margin:0}
#pauseov .big{font:600 44px/1.2 ui-monospace,Menlo,monospace}
@media (max-width:900px){#main{flex-direction:column}#left{border-right:0;border-bottom:1px solid var(--bd);flex:1 1 0;min-height:0}#right{flex:0 0 auto;max-height:45%;padding:8px 18px}#nav{display:none}#bottom{justify-content:center}}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100%"></div>
<div id="pauseov" role="dialog" aria-modal="true" aria-label="일시정지"></div>
<script>
"use strict";
const DATA = {"mock": 1, "sets": [{"set": 1, "session": 1, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>Marta Kowalski, CFA, is a quantitative analyst at Northline Grocers, a regional supermarket chain that operates 64 stores. Management is considering a new store in the town of Halden and has asked Kowalski for a sales estimate before the site committee meets.<\/p>\n<p>Kowalski regresses annual store sales (SALES, in $ millions) for all 64 stores on five independent variables:<\/p>\n<ul><li>LNPOP = natural logarithm of the catchment population, measured in thousands<\/li>\n<li>SQFT = selling area, in thousands of square feet<\/li>\n<li>PARK = 1 if the store has a dedicated parking lot, 0 otherwise<\/li>\n<li>COMP = number of competing supermarkets within 3 km<\/li>\n<li>AGE = number of years since the store opened<\/li><\/ul>\n<p>The estimated coefficients of this unrestricted model are shown in Exhibit 1. Kowalski also estimates a restricted model that excludes COMP and AGE; fit statistics for both models are in Exhibit 2. Her colleague Dev Anand comments: \"Neither COMP nor AGE is individually significant at the 5% level, so we can drop both without losing anything.\" Kowalski decides to test that claim formally. The critical F-values for 2 and 58 degrees of freedom are 3.16 at the 5% level and 4.99 at the 1% level.<\/p>\n<p>The proposed Halden store would have a catchment population of 150,000, a selling area of 42,000 square feet, a dedicated parking lot, and three competing supermarkets within 3 km. The chain's average store has been open for 11 years.<\/p>\n<p>When Kowalski plots the residuals of the unrestricted model against SQFT, the spread of the residuals widens steadily as selling area increases. A plot of the residuals against store opening order shows no discernible pattern.<\/p>\n<p>Anand is puzzled that the overall F-statistic is highly significant while COMP, which he considers an important driver, has a t-statistic of only &minus;1.62. The pairwise correlation between COMP and LNPOP is 0.64. Kowalski regresses COMP on the other four independent variables and obtains an R<sup>2<\/sup> of 0.93.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Unrestricted Model — Dependent Variable SALES ($ millions), n = 64<\/caption><thead><tr><th>Variable<\/th><th>Coefficient<\/th><th>Standard Error<\/th><th>t-Statistic<\/th><\/tr><\/thead><tbody><tr><td>Intercept<\/td><td>-4.2<\/td><td>1.58<\/td><td>&minus;2.66<\/td><\/tr><tr><td>LNPOP<\/td><td>1.85<\/td><td>0.38<\/td><td>4.87<\/td><\/tr><tr><td>SQFT<\/td><td>0.142<\/td><td>0.036<\/td><td>3.94<\/td><\/tr><tr><td>PARK<\/td><td>1.1<\/td><td>0.46<\/td><td>2.39<\/td><\/tr><tr><td>COMP<\/td><td>-0.21<\/td><td>0.13<\/td><td>&minus;1.62<\/td><\/tr><tr><td>AGE<\/td><td>0.018<\/td><td>0.021<\/td><td>0.86<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Fit Statistics<\/caption><thead><tr><th>Statistic<\/th><th>Unrestricted (5 variables)<\/th><th>Restricted (LNPOP, SQFT, PARK)<\/th><\/tr><\/thead><tbody><tr><td>R<sup>2<\/sup><\/td><td>0.710<\/td><td>0.676<\/td><\/tr><tr><td>Adjusted R<sup>2<\/sup><\/td><td>0.685<\/td><td>0.660<\/td><\/tr><tr><td>Sum of squared errors (SSE)<\/td><td>182.6<\/td><td>204.0<\/td><\/tr><tr><td>F-statistic (overall)<\/td><td>28.4<\/td><td>41.7<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s01-q1", "rel": [2, 4, 7], "los": "QM-R2-L3", "tier": 1, "type": "calc", "stem": "Based on Exhibit 1, the predicted annual sales for the Halden store are <i>closest<\/i> to:", "options": {"A": "$10.40 million.", "B": "$11.50 million.", "C": "$12.13 million."}}, {"id": "m1-s01-q2", "rel": [1, 3, 8], "los": "QM-R2-L2", "tier": 2, "type": "calc", "stem": "Based on Exhibit 2, the F-statistic for Kowalski's test of Anand's claim and the <i>most appropriate<\/i> conclusion are:", "options": {"A": "6.80; reject the null hypothesis at both the 5% and 1% levels.", "B": "3.15; fail to reject the null hypothesis at the 5% level.", "C": "3.40; reject the null hypothesis at the 5% level but not at the 1% level."}}, {"id": "m1-s01-q3", "rel": [5], "los": "QM-R3-L2", "tier": 1, "type": "concept", "stem": "Kowalski's residual plots <i>most likely<\/i> indicate that the unrestricted model suffers from:", "options": {"A": "conditional heteroskedasticity, so the t-statistics should be recalculated using robust (White-corrected) standard errors.", "B": "unconditional heteroskedasticity, so the coefficient estimates are biased and SQFT should be removed from the model.", "C": "conditional heteroskedasticity, which overstates the standard errors, so coefficients already found significant remain reliable."}}, {"id": "m1-s01-q4", "rel": [6], "los": "QM-R3-L4", "tier": 1, "type": "concept", "stem": "Based on Kowalski's auxiliary regression, the variance inflation factor (VIF) for COMP and the <i>most appropriate<\/i> conclusion are:", "options": {"A": "1.08; with a pairwise correlation of only 0.64, multicollinearity is not a concern.", "B": "14.3; multicollinearity warrants further investigation but is not yet severe.", "C": "14.3; serious multicollinearity is present, consistent with a significant F-statistic alongside COMP's insignificant t-statistic."}}]}, {"set": 2, "session": 1, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Halvorsen Ridge Capital is a boutique asset manager with 140 discretionary client accounts. Ingrid Solberg, CFA, the firm's chief investment officer, is preparing to launch a private-credit sleeve that will lend directly to mid-sized companies. Loans in the sleeve have maturities of four to six years, and investors may redeem only after a five-year lock-up. Tomas Reyes, a Level III CFA candidate, is the portfolio manager responsible for the firm's balanced accounts.<\/p>\n<p>Solberg proposes moving 15% of every balanced account into the sleeve, arguing that \"private credit lowers the volatility of the overall portfolio, so it is appropriate for every balanced client.\" One of Reyes's balanced clients is the Mertens Trust. The trust's investment policy statement (IPS), last updated four years ago, limits holdings to publicly traded securities and notes that the trust pays its beneficiaries a fixed distribution every January. The trustee has not been contacted about the sleeve.<\/p>\n<p>While the sleeve is being organized, Reyes receives 24,000 shares of the oversubscribed initial public offering of Norvik Energy. The issue is suitable for three of his accounts, which submitted indications of interest before the offering: the Calder Foundation (30,000 shares), the Albrecht Family Office (20,000 shares), and an account owned by Reyes's brother-in-law, Jens Lund (10,000 shares). Lund's account pays the firm's standard advisory fee. Reyes also entered an order for 5,000 shares for his personal account. Halvorsen Ridge's written policy states that employees may not participate in oversubscribed offerings and that IPO shares are allocated to client accounts in proportion to their indications of interest.<\/p>\n<p>To market the sleeve, Solberg drafts a presentation built around the firm's Direct Lending Composite, which reports an annualized five-year return of 9.8%. Two accounts that terminated in the third year after suffering loan losses are not included anywhere in the composite's history; including them would reduce the five-year return to 8.1%. A footnote states that all returns are shown gross of management fees and that net-of-fee returns are available on request.<\/p>\n<p>Seeking anchor investors, Reyes e-mails the Albrecht Family Office's current holdings and its projected liquidity needs to Kestrel Fund Services, an outside fund administrator that maintains a list of potential co-investors. Kestrel signed a non-disclosure agreement with Halvorsen Ridge. Reyes did not ask the family office before sending the information, but he informed Solberg afterward.<\/p>", "exhibits": [], "qs": [{"id": "m1-s02-q1", "rel": [0, 1], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Before investing any of the Mertens Trust's assets in the private-credit sleeve, Reyes should <i>most appropriately<\/i>:", "options": {"A": "inform the trustee of the sleeve's illiquidity and lock-up and obtain written acknowledgment of the risks.", "B": "reassess the trust's objectives and constraints with the trustee and update the IPS, judging suitability in the context of the trust's total portfolio.", "C": "proceed with the 15% allocation, because the sleeve reduces the volatility of the trust's total portfolio."}}, {"id": "m1-s02-q2", "rel": [2], "los": "ETH-R2-L2", "tier": 1, "type": "concept", "stem": "Under a fair allocation procedure, the number of Norvik Energy shares Reyes should allocate to the Lund account is <i>closest<\/i> to:", "options": {"A": "0.", "B": "4,000.", "C": "8,000."}}, {"id": "m1-s02-q3", "rel": [3], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Does Solberg's draft presentation comply with Standard III(D) Performance Presentation?", "options": {"A": "No, because the terminated accounts are excluded from the composite's history.", "B": "No, because performance must be presented net of management fees.", "C": "Yes, because the gross-of-fees basis is disclosed and net returns are available on request."}}, {"id": "m1-s02-q4", "rel": [4], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "By sending the Albrecht Family Office's information to Kestrel, did Reyes violate the CFA Institute Standards of Professional Conduct?", "options": {"A": "No, because Kestrel is bound by a non-disclosure agreement.", "B": "Yes, because he disclosed client information without the client's permission.", "C": "Yes, because he did not inform his employer before sending the information."}}]}, {"set": 3, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Valtek Industrial Holdings, a manufacturer of packaging machinery, prepares its financial statements under IFRS. Valtek is not a venture capital organization, mutual fund, or similar entity. On 1 January 2025, Valtek completed two transactions.<\/p>\n<p>First, it paid &euro;84 million for 35% of the voting shares of Orsa Components, a supplier of precision bearings. Valtek appointed two of Orsa's seven directors and accounts for the investment using the equity method. At the acquisition date, the fair values of Orsa's assets and liabilities equaled their book values except for plant and equipment, as shown in Exhibit 1.<\/p>\n<p>Second, Valtek paid &euro;240 million in cash for 80% of Brenna Systems, a maker of food-grade conveyor belts. Valtek controls Brenna and accounts for the business combination using the acquisition method. Brenna holds an operating licence for food-contact manufacturing that Brenna developed internally; the licence is not recorded on Brenna's balance sheet but can be sold separately, and an independent appraiser valued it at &euro;40 million. Valtek's CFO, Paulina Rademacher, elects the full goodwill method and estimates the fair value of the noncontrolling interest using the price Valtek paid per share.<\/p>\n<p>Rademacher is preparing a presentation for analysts. Lukas Engel, a junior analyst, asks how Valtek's ratios would have differed had Brenna been accounted for using the equity method instead of being consolidated. Engel also asks how the Orsa investment would have been reported if Valtek prepared its statements under US GAAP.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Selected Data for Orsa Components<\/caption><thead><tr><th>Orsa Components (&euro; millions)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Book value of net assets, 1 Jan 2025<\/td><td>180<\/td><\/tr><tr><td>Plant and equipment: book value / fair value, 1 Jan 2025<\/td><td>95 / 135<\/td><\/tr><tr><td>Remaining useful life of plant and equipment (straight-line, no salvage)<\/td><td>7 years<\/td><\/tr><tr><td>Net income, 2025<\/td><td>30<\/td><\/tr><tr><td>Dividends paid, 2025<\/td><td>12<\/td><\/tr><tr><td>Market value of 100% of Orsa's shares, 31 Dec 2025<\/td><td>262<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Selected Data for Brenna Systems<\/caption><thead><tr><th>Brenna Systems (&euro; millions)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Book value of identifiable net assets, 1 Jan 2025<\/td><td>190<\/td><\/tr><tr><td>Fair value of property, plant and equipment in excess of book value<\/td><td>20<\/td><\/tr><tr><td>Fair value of operating licence (not on Brenna's balance sheet)<\/td><td>40<\/td><\/tr><tr><td>Revenue, 2025<\/td><td>310<\/td><\/tr><tr><td>Net income, 2025<\/td><td>26<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s03-q1", "rel": [1, 4], "los": "FSA-R1-L1", "tier": 1, "type": "calc", "stem": "The carrying value of Valtek's investment in Orsa on 31 December 2025 is <i>closest<\/i> to:", "options": {"A": "&euro;84.59 million.", "B": "&euro;87.30 million.", "C": "&euro;88.30 million."}}, {"id": "m1-s03-q2", "rel": [2, 5], "los": "FSA-R1-L1", "tier": 1, "type": "calc", "stem": "At the acquisition date, the goodwill and the noncontrolling interest that Valtek reports for Brenna are <i>closest<\/i> to:", "options": {"A": "Goodwill &euro;40 million; noncontrolling interest &euro;50 million.", "B": "Goodwill &euro;50 million; noncontrolling interest &euro;60 million.", "C": "Goodwill &euro;90 million; noncontrolling interest &euro;60 million."}}, {"id": "m1-s03-q3", "rel": [2, 3, 5], "los": "FSA-R1-L3", "tier": 1, "type": "concept", "stem": "In response to Engel's question about Brenna, compared with the equity method, consolidating Brenna <i>most likely<\/i> results in Valtek reporting a:", "options": {"A": "lower net profit margin.", "B": "higher net income attributable to Valtek's shareholders.", "C": "lower total equity."}}, {"id": "m1-s03-q4", "rel": [0, 1, 3], "los": "FSA-R1-L2", "tier": 2, "type": "concept", "stem": "Regarding Engel's question about the Orsa investment, which statement is <i>most accurate<\/i>? Under US GAAP, Valtek:", "options": {"A": "would account for Orsa using proportionate consolidation.", "B": "could reverse a previously recognized impairment loss on Orsa if its value recovers.", "C": "could elect to measure the Orsa investment at fair value, with changes in value recognized in the income statement."}}]}, {"set": 4, "session": 1, "topic": "Economics", "code": "ECO", "vignette": "<p>Amara Okafor is a currency strategist at Lindqvist Partners, a Zurich-based fund manager that reports in Swiss francs (CHF). She is reviewing the fund's exposure to Tavaria, an emerging market whose currency is the Tavarian lira (TVL). Exchange rates are quoted as TVL/CHF (the number of TVL per CHF). Current money market rates are shown in Exhibit 1, and today's dealer quotes are shown in Exhibit 2.<\/p>\n<p>Okafor is considering a new 180-day TVL deposit for the fund that would be fully hedged back into CHF with a forward contract. A junior analyst remarks that \"a hedged TVL deposit lets us earn the 9.20% Tavarian rate without currency risk.\"<\/p>\n<p>Ninety days ago, to hedge existing Tavarian bond holdings, the fund entered into a 180-day forward contract to buy CHF 10,000,000 against TVL at a forward rate of 21.4800. Okafor wants to report the contract's current mark-to-market value.<\/p>\n<p>Okafor's colleague, Henrik Sjöberg, proposes a leveraged carry trade: borrowing CHF for 90 days and investing the proceeds in TVL deposits. Sjöberg notes that the TVL has been stable for the past 18 months and that implied volatility in TVL/CHF is near a five-year low.<\/p>\n<p>Okafor is also tracking policy developments. Tavaria maintains capital controls that sharply restrict cross-border portfolio flows. Its newly elected government has announced a large increase in infrastructure spending financed by borrowing, and the Tavarian central bank, under pressure to support growth, has cut its policy rate by 100 basis points. Meanwhile, the Swiss National Bank has left its policy rate unchanged.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Annualized Money Market Rates (actual/360)<\/caption><thead><tr><th>Currency<\/th><th>90-day rate<\/th><th>180-day rate<\/th><\/tr><\/thead><tbody><tr><td>CHF<\/td><td>1.00%<\/td><td>1.10%<\/td><\/tr><tr><td>TVL<\/td><td>9.00%<\/td><td>9.20%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Dealer Quotes Today (forward points are scaled by 10,000)<\/caption><thead><tr><th>Quote<\/th><th>Bid<\/th><th>Ask<\/th><\/tr><\/thead><tbody><tr><td>Spot TVL/CHF<\/td><td>21.1500<\/td><td>21.1600<\/td><\/tr><tr><td>90-day forward points<\/td><td>+4,210<\/td><td>+4,230<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s04-q1", "rel": [0, 1, 5, 6], "los": "ECO-R1-L5", "tier": 1, "type": "calc", "stem": "Using the mid-market spot rate, the 180-day TVL/CHF forward rate consistent with covered interest rate parity is <i>closest<\/i> to:", "options": {"A": "20.3359.", "B": "22.0071.", "C": "22.8499."}}, {"id": "m1-s04-q2", "rel": [0, 2, 5, 6], "los": "ECO-R1-L4", "tier": 2, "type": "calc", "stem": "The current mark-to-market value of the fund's existing forward contract is <i>closest<\/i> to:", "options": {"A": "TVL 889,976.", "B": "TVL 907,731.", "C": "TVL 1,007,335."}}, {"id": "m1-s04-q3", "rel": [3, 5], "los": "ECO-R1-L9", "tier": 2, "type": "concept", "stem": "Regarding Sjöberg's proposed carry trade, which statement is <i>most accurate<\/i>?", "options": {"A": "The trade earns excess profits only if uncovered interest rate parity holds over the 90 days.", "B": "Because the TVL has been stable and volatility is low, the trade's return distribution is approximately normal with limited downside.", "C": "The trade profits if the TVL depreciates against the CHF by less than the interest rate differential, but it is exposed to crash risk if leveraged positions unwind."}}, {"id": "m1-s04-q4", "rel": [4], "los": "ECO-R1-L11", "tier": 1, "type": "concept", "stem": "According to the Mundell–Fleming model, the policy changes in Tavaria will <i>most likely<\/i> cause the TVL to:", "options": {"A": "appreciate, because higher government borrowing raises real interest rates and attracts capital inflows.", "B": "depreciate, because the increase in net imports dominates the effect on the exchange rate.", "C": "move in an ambiguous direction, because the monetary and fiscal policy effects offset each other."}}]}, {"set": 5, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Imogen Varga is an equity analyst at Lindqvist Kapital, a Stockholm-based asset manager. She is updating her valuation of Brekkan Home Care, a maker of household cleaning and laundry products that sells mainly through supermarket chains in Northern Europe. Brekkan's markets are mature, and its management has kept the dividend payout ratio constant for several years.<\/p>\n<p>Varga estimates Brekkan's near-term dividend growth rate as its sustainable growth rate. She assumes that Brekkan will not issue new shares, will keep its capital structure unchanged, and will maintain its 2025 profitability, efficiency, leverage and payout ratios in the near term. Following her firm's convention, she computes all ratios that combine income statement and balance sheet items using beginning-of-year balance sheet values. Selected data are shown in Exhibit 1.<\/p>\n<p>Varga expects competition from private-label products to erode Brekkan's growth gradually. She models the dividend growth rate as declining linearly from the sustainable growth rate to a long-term rate over the next eight years and uses the H-model. Her other valuation inputs are in Exhibit 2.<\/p>\n<p>Varga's colleague, Henrik Aalto, notes that Brekkan's shares currently trade at &euro;24.00. He suggests that Varga back out the required return that the market is implicitly using, with the same dividend and growth assumptions, and compare it with her own estimate before she issues a recommendation. Aalto states, \"If we solve the H-model for the discount rate that equates value with the market price, the share is by construction fairly priced at that rate, so the comparison tells us nothing.\"<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Selected Financial Data for Brekkan Home Care<\/caption><thead><tr><th>Brekkan Home Care (&euro; millions, except per share)<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Revenue<\/td><td>4,800<\/td><\/tr><tr><td>Net income<\/td><td>240<\/td><\/tr><tr><td>Dividends paid<\/td><td>132<\/td><\/tr><tr><td>Total assets, beginning of year / end of year<\/td><td>3,000 / 3,200<\/td><\/tr><tr><td>Shareholders' equity, beginning of year / end of year<\/td><td>1,500 / 1,608<\/td><\/tr><tr><td>Shares outstanding (millions, unchanged during 2025)<\/td><td>120<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Varga's Valuation Inputs<\/caption><thead><tr><th>Valuation input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Length of period over which growth declines linearly<\/td><td>8 years<\/td><\/tr><tr><td>Long-term (stable) dividend growth rate<\/td><td>3.0%<\/td><\/tr><tr><td>Varga's estimate of the required return on equity<\/td><td>8.0%<\/td><\/tr><tr><td>Current share price<\/td><td>&euro;24.00<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s05-q1", "rel": [1, 4], "los": "EQ-R2-L16", "tier": 1, "type": "calc", "stem": "Based on Exhibit 1 and Varga's assumptions, Brekkan's sustainable growth rate is <i>closest<\/i> to:", "options": {"A": "3.60%.", "B": "6.72%.", "C": "7.20%."}}, {"id": "m1-s05-q2", "rel": [1, 2, 4, 5], "los": "EQ-R2-L14", "tier": 1, "type": "calc", "stem": "Using the H-model and Varga's assumptions, the value of a Brekkan share is <i>closest<\/i> to:", "options": {"A": "&euro;22.66.", "B": "&euro;25.93.", "C": "&euro;26.36."}}, {"id": "m1-s05-q3", "rel": [2, 3, 4, 5], "los": "EQ-R2-L9", "tier": 1, "type": "calc", "stem": "Following Aalto's suggestion, the required return implied by Brekkan's current share price using the H-model is <i>closest<\/i> to:", "options": {"A": "7.72%.", "B": "8.35%.", "C": "8.49%."}}, {"id": "m1-s05-q4", "rel": [3, 5], "los": "EQ-R2-L10", "tier": 1, "type": "concept", "stem": "Based on the required return implied by the market price and Varga's estimate of the required return, Brekkan's shares are <i>most likely<\/i>:", "options": {"A": "overvalued, because the market is discounting Brekkan's dividends at a rate higher than Varga's required return.", "B": "undervalued, because the expected return implied by the market price exceeds Varga's required return.", "C": "fairly valued, because at the implied required return the H-model value equals the market price, as Aalto states."}}]}, {"set": 6, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Dagny Solberg is chief investment officer of the Harrowgate Teachers' Pension Fund. She meets with Rafael Quintero, who manages the fund's government bond portfolio, to review positioning. The government spot curve is upward sloping (Exhibit 1). All rates are annual-compounding, and all government bonds are assumed to be default-free.<\/p>\n<p>The fund will receive a &euro;150 million lump-sum contribution from a participating school district in exactly three years. Solberg wants to invest the contribution for two years from the date it is received and asks Quintero for the rate the fund could lock in today for that future investment.<\/p>\n<p>Separately, the fund has &euro;400 million of cash that it must hold in government bonds for exactly two years. Quintero proposes buying five-year zero-coupon government bonds and selling them after two years rather than buying two-year zero-coupon government bonds and holding them to maturity. Solberg comments, \"My base case is that the spot curve two years from now will have the same level and shape as today's curve.\"<\/p>\n<p>Quintero then shares his own interest rate view: he expects the two-year spot rate three years from now to be 4.20%. He explains that the fund could act on this view using forward contracts on two-year zero-coupon government bonds for settlement in three years.<\/p>\n<p>Finally, Solberg reviews the relative value of a five-year bond issued by a AA-rated European utility that the fund holds in a separate credit mandate. She asks Quintero to report the five-year swap spread using the market data in Exhibit 2.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Government Spot Rates<\/caption><thead><tr><th>Maturity (years)<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td>Government spot rate<\/td><td>2.40%<\/td><td>2.90%<\/td><td>3.30%<\/td><td>3.60%<\/td><td>3.85%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Five-Year Market Rates<\/caption><thead><tr><th>Five-year instrument<\/th><th>Rate<\/th><\/tr><\/thead><tbody><tr><td>Yield to maturity of on-the-run five-year government bond (trading at par)<\/td><td>3.80%<\/td><\/tr><tr><td>Five-year fixed-for-floating interest rate swap rate<\/td><td>4.25%<\/td><\/tr><tr><td>Yield to maturity of AA-rated utility bond<\/td><td>4.53%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s06-q1", "rel": [0, 1, 5], "los": "FI-R1-L1", "tier": 1, "type": "calc", "stem": "The annualized rate the fund can lock in today for investing the school district's contribution is <i>closest<\/i> to:", "options": {"A": "3.85%.", "B": "4.49%.", "C": "4.68%."}}, {"id": "m1-s06-q2", "rel": [0, 2, 5], "los": "FI-R1-L4", "tier": 2, "type": "concept", "stem": "If Solberg's base case is correct, the two-year return on Quintero's proposed strategy for the &euro;400 million, compared with buying and holding two-year zero-coupon bonds, will <i>most likely<\/i> be:", "options": {"A": "higher, because the five-year bonds will be valued at lower yields as they approach maturity.", "B": "the same, because every government zero-coupon bond earns the two-year spot rate over a two-year horizon.", "C": "lower, because the five-year bonds carry more interest rate risk over the two-year horizon."}}, {"id": "m1-s06-q3", "rel": [3, 5], "los": "FI-R1-L3", "tier": 2, "type": "concept", "stem": "Given Quintero's interest rate view, the <i>most appropriate<\/i> action for him to recommend is to:", "options": {"A": "buy forward contracts on two-year zero-coupon bonds, because the forward price is lower than the price implied by his expected spot rate.", "B": "sell forward contracts on two-year zero-coupon bonds, because the forward price will decline as rates converge to his expected spot rate.", "C": "take no position, because forward rates are unbiased predictors of future spot rates."}}, {"id": "m1-s06-q4", "rel": [4, 6], "los": "FI-R1-L6", "tier": 2, "type": "calc", "stem": "The five-year swap spread that Quintero reports is <i>closest<\/i> to:", "options": {"A": "28 basis points.", "B": "40 basis points.", "C": "45 basis points."}}]}, {"set": 7, "session": 1, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p>Corvane Instruments is a listed, mid-sized manufacturer of laboratory analysers. Its chief executive, Ingrid Hallström, has agreed terms to acquire all of the shares of Pellis Diagnostics, a privately controlled maker of point-of-care test kits. Hallström tells the board, \"Pellis gives us immediate access to the fast-growing point-of-care market, which would take us at least five years to build organically.\"<\/p>\n<p>The acquisition will be financed entirely with new Corvane shares: each Pellis shareholder will receive 0.75 Corvane shares per Pellis share. Corvane's shares trade at &euro;56.00. Before rumours of the deal, Pellis shares last changed hands in a private transaction at &euro;30.00. Corvane will assume Pellis's debt.<\/p>\n<p>Corvane's corporate development analyst, Mateo Ferreira, values Pellis using comparable transaction analysis based on the median EV/EBITDA multiple of recent acquisitions of diagnostics companies, and he also gathers trading multiples of listed diagnostics peers (Exhibit 1). For the first full year after closing, he projects pre-tax cost synergies of &euro;20 million and amortization of acquired intangible assets of &euro;8 million. He assumes that the standalone results of both companies remain at their 2025 levels and that all pre-tax items are taxed at 25%.<\/p>\n<p>Hallström has also proposed two further actions. First, Corvane would sell its headquarters campus to an insurance company and lease it back for 15 years; the insurer can finance the property at a lower cost than Corvane. Second, Corvane would divest its non-core industrial weighing division. The board wants this divestment to raise cash to repay the debt assumed from Pellis and to end Corvane's exposure to the weighing business entirely. Three industrial companies have approached Corvane about buying the division.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Selected Data for Corvane and Pellis<\/caption><thead><tr><th>(&euro; millions, except per share and multiples)<\/th><th>Corvane<\/th><th>Pellis<\/th><\/tr><\/thead><tbody><tr><td>Net income, 2025<\/td><td>180.0<\/td><td>&mdash;<\/td><\/tr><tr><td>Income before tax, 2025<\/td><td>&mdash;<\/td><td>50.0<\/td><\/tr><tr><td>EBITDA, 2025<\/td><td>&mdash;<\/td><td>84.0<\/td><\/tr><tr><td>Total debt / cash, 31 December 2025<\/td><td>&mdash;<\/td><td>120.0 / 30.0<\/td><\/tr><tr><td>Shares outstanding (millions)<\/td><td>60.0<\/td><td>20.0<\/td><\/tr><tr><td>Median EV/EBITDA, recent acquisitions of diagnostics companies<\/td><td>&mdash;<\/td><td>12.0&times;<\/td><\/tr><tr><td>Median EV/EBITDA, listed diagnostics peers (trading)<\/td><td>&mdash;<\/td><td>9.5&times;<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s07-q1", "rel": [1, 2, 4], "los": "CI-R4-L3", "tier": 1, "type": "calc", "stem": "Based on Ferreira's comparable transaction analysis, the fair takeover value per Pellis share is <i>closest<\/i> to:", "options": {"A": "&euro;35.40.", "B": "&euro;44.40.", "C": "&euro;45.90."}}, {"id": "m1-s07-q2", "rel": [1, 2, 4], "los": "CI-R4-L4", "tier": 1, "type": "calc", "stem": "Using Ferreira's assumptions, Corvane's pro forma EPS for the first full year after the acquisition is <i>closest<\/i> to:", "options": {"A": "&euro;2.83.", "B": "&euro;2.90.", "C": "&euro;3.02."}}, {"id": "m1-s07-q3", "rel": [3], "los": "CI-R4-L1", "tier": 1, "type": "concept", "stem": "The proposed transaction involving Corvane's headquarters campus is <i>best<\/i> described as:", "options": {"A": "an investment action, motivated by gaining access to the insurer's real estate expertise.", "B": "a restructuring action, motivated by obtaining an immediate cash infusion at a financing cost lower than Corvane's own.", "C": "a divestment action, motivated by refocusing Corvane on its core competencies."}}, {"id": "m1-s07-q4", "rel": [3], "los": "CI-R4-L6", "tier": 2, "type": "concept", "stem": "Given the board's objectives, the <i>most appropriate<\/i> course of action for the industrial weighing division is to:", "options": {"A": "spin off the division, because a spin-off would provide funds to repay the assumed debt while shareholders keep exposure to the business.", "B": "sell the division, because a sale generates proceeds, ends Corvane's exposure to the business, and interest from several buyers supports a high price.", "C": "retain the division, because divesting a non-core business would widen any conglomerate discount on Corvane's shares."}}]}, {"set": 8, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>The investment committee of the Calder Valley Firefighters' Pension Plan is reviewing the plan's active equity managers. The plan's consultant, Priya Nandakumar, CFA, has prepared ex ante estimates for three managers, each benchmarked to the same global equity index (Exhibit 1). All three managers have a beta of 1.0 relative to the index. The benchmark has an expected Sharpe ratio of 0.40 and expected volatility of 16%.<\/p>\n<p>Kestrel Partners runs a long-only quantitative strategy. It covers 98 stocks and rebalances twice a year, and Nandakumar judges its forecasts to be independent across stocks and across rebalancing dates. The long-only constraint keeps Kestrel's transfer coefficient at 0.50. Kestrel has offered the plan a separately managed account without the long-only constraint, which Nandakumar estimates would raise the transfer coefficient to 0.85 with no change in Kestrel's information coefficient or active risk.<\/p>\n<p>Rowan Capital has proposed holding 15% of its portfolio in cash as a liquidity buffer. A committee member, Gareth Pryce, comments: \"Holding cash dilutes both Rowan's excess return over the risk-free rate and its return relative to the benchmark, so the cash buffer will lower both Rowan's Sharpe ratio and its information ratio.\"<\/p>\n<p>The committee has set an active risk budget of 3.0% for the equity allocation and wants to hire one manager. Pryce favours Rowan \"because its active risk already matches our 3.0% budget, while Lumen's 6.0% active risk is too high for us.\"<\/p>\n<p>Finally, Nandakumar reports on last year's results for the plan's total portfolio (Exhibit 2). The plan's policy portfolio is 60% equities and 40% bonds.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Ex Ante Estimates for Active Equity Managers (excluding Rowan's cash proposal)<\/caption><thead><tr><th>Ex ante estimate<\/th><th>Kestrel<\/th><th>Lumen<\/th><th>Rowan<\/th><\/tr><\/thead><tbody><tr><td>Information coefficient (IC)<\/td><td>0.05<\/td><td>&mdash;<\/td><td>&mdash;<\/td><\/tr><tr><td>Transfer coefficient (TC), current mandate<\/td><td>0.50<\/td><td>&mdash;<\/td><td>&mdash;<\/td><\/tr><tr><td>Information ratio<\/td><td>&mdash;<\/td><td>0.42<\/td><td>0.35<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>6.0%<\/td><td>3.0%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Calder Valley Pension Plan, Last Year<\/caption><thead><tr><th>Asset class<\/th><th>Actual weight<\/th><th>Policy weight<\/th><th>Portfolio return<\/th><th>Benchmark return<\/th><\/tr><\/thead><tbody><tr><td>Equities<\/td><td>65%<\/td><td>60%<\/td><td>10.2%<\/td><td>9.0%<\/td><\/tr><tr><td>Bonds<\/td><td>35%<\/td><td>40%<\/td><td>2.8%<\/td><td>3.0%<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s08-q1", "rel": [1, 5], "los": "PM-R2-L3", "tier": 1, "type": "calc", "stem": "If the plan accepts Kestrel's offer of an unconstrained account, Kestrel's expected active return is <i>closest<\/i> to:", "options": {"A": "2.98%.", "B": "3.50%.", "C": "4.21%."}}, {"id": "m1-s08-q2", "rel": [2], "los": "PM-R2-L2", "tier": 1, "type": "concept", "stem": "Regarding Pryce's comment on Rowan's cash buffer, the <i>most likely<\/i> effect of the cash buffer is that Rowan's:", "options": {"A": "Sharpe ratio and information ratio are both unchanged.", "B": "Sharpe ratio decreases and its information ratio is unchanged.", "C": "Sharpe ratio is unchanged and its information ratio decreases."}}, {"id": "m1-s08-q3", "rel": [0, 3, 5], "los": "PM-R2-L4", "tier": 1, "type": "concept", "stem": "Regarding the choice between Lumen and Rowan given the 3.0% active risk budget, the committee should <i>most appropriately<\/i> hire:", "options": {"A": "Rowan, because a manager whose active risk equals the budget produces the highest Sharpe ratio for the plan.", "B": "Lumen, investing the entire equity allocation with Lumen, because combining Lumen with the benchmark would reduce its information ratio.", "C": "Lumen, investing half of the equity allocation with Lumen and half in the benchmark, because the combination keeps Lumen's information ratio of 0.42."}}, {"id": "m1-s08-q4", "rel": [4, 6], "los": "PM-R2-L1", "tier": 1, "type": "calc", "stem": "Based on Exhibit 2, the value added by security selection in the plan's total portfolio last year is <i>closest<\/i> to:", "options": {"A": "0.30%.", "B": "0.64%.", "C": "0.71%."}}]}, {"set": 9, "session": 1, "topic": "Derivatives", "code": "DER", "vignette": "<p>Annika Ressler is treasurer of Vellmark Industrie AG, a German manufacturer of industrial pumps. She is preparing the quarterly derivatives report with Tomas Brandt, a treasury analyst. All interest rates are annualized; market reference rates (MRR) use a 30/360 add-on convention, and all other rates use annual compounding.<\/p>\n<p><b>Interest rate swap.<\/b> One year ago, Vellmark entered a three-year, &euro;250 million notional interest rate swap with semiannual settlements under which it pays a fixed rate of 2.40% and receives six-month MRR. The swap has just made its second settlement payment. Current MRR spot rates are shown in Exhibit 1. Ressler asks Brandt to report the swap's current value to Vellmark and whether it should be recorded as an asset or a liability.<\/p>\n<p><b>Equity forward.<\/b> Three months ago, Vellmark entered a nine-month forward contract to sell 1.5 million shares of Danholt Systems, a listed supplier in which it holds a non-strategic stake, at a forward price of &euro;50.00 per share. Danholt shares now trade at &euro;46.20. Danholt is expected to pay a dividend of &euro;0.80 per share in four months, before the forward contract expires. The risk-free rate is 3.50% for all maturities.<\/p>\n<p><b>Bond futures.<\/b> Vellmark plans to issue bonds in four months and is considering selling government bond futures that expire in four months as a hedge. Information on the cheapest-to-deliver bond is given in Exhibit 2. The four-month risk-free rate is 2.80%.<\/p>\n<p><b>Dealer quote.<\/b> Finally, Brandt shows Ressler a dealer quote for a three-month forward contract on a zero-coupon government note. The note trades at 97.10, the three-month risk-free rate is 2.80%, and the dealer's forward price is 97.45. Brandt asks whether an arbitrage opportunity exists and which trades would capture it.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Current MRR Spot Rates (30/360, add-on)<\/caption><thead><tr><th>Days to maturity<\/th><th>180<\/th><th>360<\/th><th>540<\/th><th>720<\/th><\/tr><\/thead><tbody><tr><td>MRR spot rate<\/td><td>2.90%<\/td><td>3.10%<\/td><td>3.25%<\/td><td>3.40%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Cheapest-to-Deliver Bond<\/caption><thead><tr><th>Item<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Annual coupon rate (paid annually, 30/360)<\/td><td>5.00%<\/td><\/tr><tr><td>Quoted (clean) price per 100 par<\/td><td>104.20<\/td><\/tr><tr><td>Days since last coupon payment<\/td><td>75<\/td><\/tr><tr><td>Conversion factor<\/td><td>1.0850<\/td><\/tr><tr><td>Coupon payments before futures expiration<\/td><td>None<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s09-q1", "rel": [0, 1, 5], "los": "DER-R1-L5", "tier": 1, "type": "calc", "stem": "The current value of the interest rate swap to Vellmark is <i>closest<\/i> to:", "options": {"A": "&euro;4.38 million, an asset.", "B": "&euro;4.38 million, a liability.", "C": "&euro;8.76 million, an asset."}}, {"id": "m1-s09-q2", "rel": [0, 2], "los": "DER-R1-L1", "tier": 2, "type": "calc", "stem": "The current value of the Danholt forward contract to Vellmark is <i>closest<\/i> to:", "options": {"A": "&euro;4.42 million.", "B": "&euro;4.98 million.", "C": "&euro;5.61 million."}}, {"id": "m1-s09-q3", "rel": [0, 3, 6], "los": "DER-R1-L4", "tier": 2, "type": "calc", "stem": "The equilibrium quoted price of the government bond futures contract is <i>closest<\/i> to:", "options": {"A": "95.40.", "B": "97.89.", "C": "103.51."}}, {"id": "m1-s09-q4", "rel": [0, 4], "los": "DER-R1-L2", "tier": 2, "type": "concept", "stem": "Regarding the dealer quote, Brandt should conclude that the <i>most appropriate<\/i> trades are to:", "options": {"A": "sell the note short, invest the proceeds at the risk-free rate, and buy the forward (reverse carry arbitrage).", "B": "borrow at the risk-free rate, buy the note, and sell the forward (carry arbitrage).", "C": "do nothing, because the forward price exceeds the current price of the note."}}]}, {"set": 10, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Halvern Foods Inc. is a US-based packaged-food company that prepares its financial statements under US GAAP in US dollars. Priya Natarajan, an equity analyst, is reviewing Halvern's Brazilian subsidiary, Halvern Alimentos Ltda., which Halvern formed on 1 January 2024 by contributing BRL300 million of capital.<\/p>\n<p>Alimentos sells canned vegetables to Brazilian supermarket chains. Its selling prices are set in Brazilian reais (BRL) and are driven mainly by competition from local producers and by Brazilian food-pricing regulations. Nearly all of its labor and raw materials are sourced in Brazil and paid in reais, and its long-term debt is a BRL-denominated loan from a Brazilian bank. Alimentos retains its operating cash in reais. Each year it pays a dividend to Halvern, which converts the dividend into dollars, and it occasionally imports packaging machinery from the United States. Brazil is not considered a hyperinflationary economy.<\/p>\n<p>Alimentos reported net income of BRL70 million in 2024 and BRL110 million in 2025. It paid no dividend in 2024 and declared a BRL30 million dividend in 2025. Its condensed balance sheet and relevant exchange rates are shown in Exhibits 1 and 2. The real depreciated steadily against the dollar during 2025. Alimentos uses the FIFO inventory method, and its inventory turns over about every four months.<\/p>\n<p>Natarajan also notes that on 20 November 2025, Halvern's US operations sold goods to a German retailer for &euro;12 million, with payment due in euros on 20 February 2026. The euro weakened against the US dollar between 20 November and 31 December 2025.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Halvern Alimentos Ltda. Balance Sheet, 31 December 2025<\/caption><thead><tr><th>Assets<\/th><th>BRL millions<\/th><th>Liabilities and equity<\/th><th>BRL millions<\/th><\/tr><\/thead><tbody><tr><td>Cash<\/td><td>80<\/td><td>Accounts payable<\/td><td>90<\/td><\/tr><tr><td>Accounts receivable<\/td><td>120<\/td><td>Long-term debt<\/td><td>260<\/td><\/tr><tr><td>Inventory<\/td><td>150<\/td><td>Common stock<\/td><td>300<\/td><\/tr><tr><td>Property, plant, and equipment (net)<\/td><td>450<\/td><td>Retained earnings<\/td><td>150<\/td><\/tr><tr><td><b>Total assets<\/b><\/td><td><b>800<\/b><\/td><td><b>Total liabilities and equity<\/b><\/td><td><b>800<\/b><\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Exchange Rates<\/caption><thead><tr><th>Date or period<\/th><th>USD per BRL<\/th><\/tr><\/thead><tbody><tr><td>1 January 2024 (capital contributed)<\/td><td>0.2000<\/td><\/tr><tr><td>Average 2024<\/td><td>0.1920<\/td><\/tr><tr><td>31 December 2024<\/td><td>0.1880<\/td><\/tr><tr><td>Average 2025<\/td><td>0.1840<\/td><\/tr><tr><td>2025 dividend declaration date<\/td><td>0.1820<\/td><\/tr><tr><td>31 December 2025<\/td><td>0.1800<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s10-q1", "rel": [0, 1], "los": "FSA-R3-L4", "tier": 1, "type": "concept", "stem": "Alimentos's functional currency and the method Halvern should use to bring Alimentos's financial statements into its consolidated statements are <i>most likely<\/i>:", "options": {"A": "the US dollar and the temporal method.", "B": "the Brazilian real and the temporal method.", "C": "the Brazilian real and the current rate method."}}, {"id": "m1-s10-q2", "rel": [0, 2, 4, 5], "los": "FSA-R3-L5", "tier": 1, "type": "calc", "stem": "Under the method that Halvern should use, the cumulative translation adjustment for Alimentos at 31 December 2025 is <i>closest<\/i> to:", "options": {"A": "&minus;$7.22 million.", "B": "&minus;$6.00 million.", "C": "$7.22 million."}}, {"id": "m1-s10-q3", "rel": [2, 5], "los": "FSA-R3-L6", "tier": 1, "type": "concept", "stem": "If the US dollar had instead been Alimentos's functional currency, Alimentos's 2025 gross profit margin expressed in US dollars would <i>most likely<\/i> have been:", "options": {"A": "lower than under the current rate method.", "B": "higher than under the current rate method.", "C": "the same as under the current rate method."}}, {"id": "m1-s10-q4", "rel": [3], "los": "FSA-R3-L2", "tier": 1, "type": "concept", "stem": "In its 2025 financial statements, Halvern should <i>most likely<\/i> report the effect of the euro's movement on the German receivable as:", "options": {"A": "an unrealized foreign currency transaction loss in net income.", "B": "no gain or loss until the receivable is collected in 2026.", "C": "a loss in other comprehensive income as part of the cumulative translation adjustment."}}]}, {"set": 11, "session": 1, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Lena Okafor, CFA, is a senior equity analyst at Brightwater Securities, a broker-dealer with research, trading, and investment-banking divisions. She covers medical-device companies, including Torvane Medical, on which she has had a Buy rating for two years. Brightwater's investment-banking division is competing to be lead underwriter of a secondary share offering that Torvane expects to announce in about two months. Under Brightwater's policy, a company is placed on the firm's restricted list only once an offering is formally announced; Torvane is not on the list.<\/p>\n<p>Okafor is preparing an update report on Torvane with Marcus Hale, a research associate and CFA Level II candidate. Hale proposes building the report's revenue model on a five-year global demand forecast for cardiac stents published by Medlytics, an independent consultancy. \"Brightwater has bought Medlytics forecasts for years,\" Hale says, \"so we can drop the numbers straight into the model.\" Brightwater has no formal process for reviewing purchased research, and neither Hale nor Okafor has examined how Medlytics built the forecast.<\/p>\n<p>For the update, Okafor replaces her discounted cash flow model with a valuation based on peer EV/EBITDA multiples, because Torvane's new product cycle makes long-range cash flows hard to estimate. The draft report states the change of method and the reason for it in its first paragraph. The draft's summary also says, \"Torvane's new drug-coated stent will capture 20% of the European market by 2028.\" That figure is Okafor's own projection, but the draft does not identify it as an estimate.<\/p>\n<p>Okafor's revised analysis supports a Hold rating, and she tells colleagues that she plans to downgrade the stock. The next day, Victor Stanhope, head of investment banking, emails her: \"Torvane's CFO has heard about a possible downgrade, and we are close to winning the mandate. Please keep the Buy rating until after the offering. You can always revisit it later.\"<\/p>\n<p>Before the report is issued, Okafor reviews her potential conflicts. She owns 1,200 Torvane shares that she bought four years ago; the purchase was pre-cleared by Brightwater's compliance department under the firm's personal-trading policy. Last month she attended Torvane's annual investor day, where the company provided a buffet lunch to all attending analysts; Okafor paid for her own travel and hotel. Brightwater has disclosed its pursuit of the underwriting mandate to compliance, but the draft report contains no disclosures.<\/p>", "exhibits": [], "qs": [{"id": "m1-s11-q1", "rel": [1], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Before using the Medlytics forecast in the Torvane report, Hale should <i>most appropriately<\/i>:", "options": {"A": "use the forecast without further work, because Brightwater has purchased Medlytics research for many years.", "B": "review the forecast's assumptions, the rigor of its analysis, its timeliness, and the objectivity of its conclusions.", "C": "replace the forecast with his own estimates, because the Standards do not permit reliance on third-party research in a research report."}}, {"id": "m1-s11-q2", "rel": [2], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Does Okafor's draft report comply with Standard V(B) Communication with Clients and Prospective Clients?", "options": {"A": "No, because it presents a projection as if it were a fact.", "B": "No, because an analyst may not change the valuation method used for a covered company between reports.", "C": "Yes."}}, {"id": "m1-s11-q3", "rel": [0, 3], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "In response to Stanhope's email, Okafor should <i>most appropriately<\/i>:", "options": {"A": "keep the Buy rating until the offering is completed, provided the report discloses that Brightwater is seeking an underwriting mandate from Torvane.", "B": "issue the Hold rating supported by her analysis.", "C": "keep the Buy rating but stop publishing research on Torvane until the offering is completed."}}, {"id": "m1-s11-q4", "rel": [0, 4], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Which of the following matters is Okafor required to disclose in the Torvane report?", "options": {"A": "Brightwater's pursuit of the underwriting mandate only.", "B": "Her ownership of Torvane shares and Brightwater's pursuit of the underwriting mandate.", "C": "Her ownership of Torvane shares, Brightwater's pursuit of the underwriting mandate, and the lunch provided at the investor day."}}]}, {"set": 12, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Quellis Systems Inc. designs and manufactures data-storage hardware and reports under US GAAP, under which interest paid is classified as an operating cash flow. Rosa Lindqvist, an equity analyst at Marrow Peak Advisors, is updating her valuation of Quellis's common shares. Quellis sells mainly to cloud-service providers and enterprise data centers, and its revenue growth has slowed as its flagship product line matures and capital spending needs decline.<\/p>\n<p>Quellis's board has approved a recapitalization plan. In 2026, Quellis will issue $600 million of new long-term debt and use the proceeds to repurchase shares, moving the company toward a long-term target capital structure of 30% debt and 70% equity at market values. Quellis pays a small, stable dividend that is unrelated to its free cash flow and returns most of its excess cash through share repurchases.<\/p>\n<p>Lindqvist first computes Quellis's free cash flows for 2025 using the data in Exhibit 1. During 2025, Quellis repaid $90 million of a term loan and issued $50 million of notes.<\/p>\n<p>Her colleague Owen Pratt suggests that she value the equity by discounting forecast FCFE at a cost of equity estimated from Quellis's current beta, \"because FCFE values the shares directly.\" Lindqvist prefers a two-stage model. Her forecasts and valuation inputs, which reflect the target capital structure, are shown in Exhibit 2. She assumes that FCFF will grow at a constant rate after 2028.<\/p>\n<p>Pratt also asks how the planned debt-financed repurchase will affect Quellis's free cash flows in 2026.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Quellis Systems Selected 2025 Data<\/caption><thead><tr><th>Item ($ millions)<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Cash flow from operations<\/td><td>612<\/td><\/tr><tr><td>Interest expense<\/td><td>48<\/td><\/tr><tr><td>Capital expenditures (fixed capital investment)<\/td><td>285<\/td><\/tr><tr><td>Income tax rate<\/td><td>25%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Forecasts and Valuation Inputs (end of 2025)<\/caption><thead><tr><th>Input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Forecast FCFF, 2026 / 2027 / 2028 ($ millions)<\/td><td>390 / 420 / 450<\/td><\/tr><tr><td>Long-term FCFF growth rate after 2028<\/td><td>3.0%<\/td><\/tr><tr><td>Target weights: debt / equity<\/td><td>30% / 70%<\/td><\/tr><tr><td>Before-tax cost of debt<\/td><td>5.6%<\/td><\/tr><tr><td>Cost of equity<\/td><td>10.4%<\/td><\/tr><tr><td>Tax rate<\/td><td>25%<\/td><\/tr><tr><td>Current market value of debt ($ millions)<\/td><td>1,200<\/td><\/tr><tr><td>Shares outstanding (millions)<\/td><td>150<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s12-q1", "rel": [0, 2, 5], "los": "EQ-R3-L4", "tier": 1, "type": "calc", "stem": "Quellis's 2025 FCFE is <i>closest<\/i> to:", "options": {"A": "$287 million.", "B": "$327 million.", "C": "$363 million."}}, {"id": "m1-s12-q2", "rel": [3, 6], "los": "EQ-R3-L11", "tier": 1, "type": "calc", "stem": "Using Lindqvist's two-stage model, the intrinsic value per share of Quellis's common stock is <i>closest<\/i> to:", "options": {"A": "$42.74.", "B": "$46.46.", "C": "$50.74."}}, {"id": "m1-s12-q3", "rel": [1, 3], "los": "EQ-R3-L1", "tier": 1, "type": "concept", "stem": "Given Quellis's circumstances, the <i>most appropriate<\/i> approach to valuing its common stock is to:", "options": {"A": "discount FCFF at the WACC and subtract the market value of debt.", "B": "discount FCFE at a cost of equity estimated from Quellis's current beta, as Pratt suggests.", "C": "discount expected dividends at the cost of equity, because Quellis's dividend has been stable."}}, {"id": "m1-s12-q4", "rel": [1, 4], "los": "EQ-R3-L6", "tier": 1, "type": "concept", "stem": "In 2026, the year the new debt is issued and the shares are repurchased, the recapitalization will <i>most likely<\/i>:", "options": {"A": "increase both FCFF and FCFE.", "B": "increase FCFE and have no effect on FCFF.", "C": "decrease FCFE because of the share repurchase and have no effect on FCFF."}}]}, {"set": 13, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Ingrid Solberg manages a government-related bond portfolio at Brantwood Pension Trust. She is considering three newly issued bonds from Norvik Development Bank, a AAA-rated supranational whose bonds are treated as free of credit risk. The three bonds have the same three-year maturity and the same 3.90% annual coupon, and they differ only in their embedded options (Exhibit 2).<\/p>\n<p>Solberg's analyst, Tomás Reyes, has built the one-year binomial interest rate tree in Exhibit 1. He uses a lognormal model with 18% interest rate volatility and has calibrated the tree to the current benchmark par curve: 1.80% for one year, 2.60% for two years, and 3.20% for three years. Reyes values each bond by backward induction, assuming that an up move and a down move are equally likely. At each node, the value he reports for a bond excludes the coupon paid at that node. He also assumes that an option is exercised at a node only when doing so benefits the option holder.<\/p>\n<p>Solberg expects that a slowing economy will lead central banks to cut policy rates. Reyes adds that implied volatility in the swaption market has risen recently and that he is considering raising the volatility assumption in his tree from 18% to 22%.<\/p>\n<p>Solberg asks Reyes to (1) report the values of the bonds at selected nodes, (2) explain how the bonds' effective durations would differ if benchmark rates fell by 150 basis points, and (3) explain how a higher volatility assumption would change the bond values.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Binomial Interest Rate Tree (one-year forward rates, 18% volatility)<\/caption><thead><tr><th>Year 0<\/th><th>Year 1<\/th><th>Year 2<\/th><\/tr><\/thead><tbody><tr><td><\/td><td><\/td><td>6.2347%<\/td><\/tr><tr><td><\/td><td>4.0420%<\/td><td><\/td><\/tr><tr><td>1.8000%<\/td><td><\/td><td>4.3498%<\/td><\/tr><tr><td><\/td><td>2.8200%<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td>3.0348%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Norvik Development Bank Bonds (par = 100)<\/caption><thead><tr><th>Bond<\/th><th>Coupon (annual)<\/th><th>Maturity<\/th><th>Embedded option<\/th><\/tr><\/thead><tbody><tr><td>Bond S<\/td><td>3.90%<\/td><td>3 years<\/td><td>None (option-free)<\/td><\/tr><tr><td>Bond C<\/td><td>3.90%<\/td><td>3 years<\/td><td>Callable at 100.50 at Year 1 and at 100.00 at Year 2<\/td><\/tr><tr><td>Bond P<\/td><td>3.90%<\/td><td>3 years<\/td><td>Putable at 100.00 at Year 1 and at Year 2<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s13-q1", "rel": [0, 1, 4, 5], "los": "FI-R2-L5", "tier": 1, "type": "calc", "stem": "The value of Bond S at the lower node at Year 1 is <i>closest<\/i> to:", "options": {"A": "98.600.", "B": "100.631.", "C": "101.249."}}, {"id": "m1-s13-q2", "rel": [1, 4, 5], "los": "FI-R3-L6", "tier": 1, "type": "calc", "stem": "The value of Bond C today is <i>closest<\/i> to:", "options": {"A": "101.375.", "B": "101.621.", "C": "101.989."}}, {"id": "m1-s13-q3", "rel": [2, 3, 5], "los": "FI-R3-L10", "tier": 1, "type": "concept", "stem": "If benchmark rates fall by 150 basis points, as Solberg expects, which bond will <i>most likely<\/i> have the lowest effective duration?", "options": {"A": "Bond S", "B": "Bond P", "C": "Bond C"}}, {"id": "m1-s13-q4", "rel": [2, 3, 5], "los": "FI-R3-L4", "tier": 2, "type": "concept", "stem": "If Reyes raises the volatility assumption from 18% to 22%, the values of Bond C and Bond P will <i>most likely<\/i>:", "options": {"A": "both increase.", "B": "decrease for Bond C and increase for Bond P.", "C": "increase for Bond C and decrease for Bond P."}}]}, {"set": 14, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>The risk committee of Harrowgate Multi-Asset Fund meets each month to review the fund's market risk. The fund has net assets of €480 million, invested in global equities, investment-grade bonds, and a €60 million commodity sleeve, and its performance is measured against a 60/40 global equity/bond reference benchmark. Part of the commodity sleeve consists of thinly traded futures on regional power and agricultural contracts, which have been difficult to sell quickly during past market sell-offs.<\/p>\n<p>Jonas Pihl, the fund's risk officer, prepares the risk report. He estimates VaR with the parametric method and assumes that daily returns are normally and independently distributed with a constant mean and variance. His daily estimates are shown in Exhibit 1. The committee's risk policy is stated in terms of a 1% VaR over a one-month horizon of 20 trading days.<\/p>\n<p>At the meeting, three committee members raise the concerns summarized in Exhibit 2. Pihl replies that a single VaR figure \"cannot answer every question\" and that he will add other measures to the report before the next quarterly review.<\/p>\n<p>Committee chair Elena Varga makes a further request: she wants to know how much the fund would lose if the combination of large equity, interest rate, and commodity price moves seen during a past crisis were to occur again. Pihl suggests instead reporting the fund's equity beta and bond duration, saying that these sensitivity measures \"provide the same information as VaR, including how likely a loss is.\"<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Harrowgate Fund — Daily Return Estimates<\/caption><thead><tr><th>Input<\/th><th>Estimate<\/th><\/tr><\/thead><tbody><tr><td>Expected daily return<\/td><td>0.030%<\/td><\/tr><tr><td>Standard deviation of daily returns<\/td><td>0.85%<\/td><\/tr><tr><td>Fund net assets<\/td><td>€480 million<\/td><\/tr><tr><td>Trading days per month<\/td><td>20<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Committee Members' Concerns<\/caption><thead><tr><th>Member<\/th><th>Concern<\/th><\/tr><\/thead><tbody><tr><td>Varga<\/td><td>“In the worst 1% of months, how much should we expect to lose on average?”<\/td><\/tr><tr><td>Okafor<\/td><td>“What would happen to the fund's VaR if we sold the entire commodity sleeve and held the proceeds in cash?”<\/td><\/tr><tr><td>Lind<\/td><td>“How far could the fund underperform its 60/40 reference benchmark?”<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s14-q1", "rel": [1, 4], "los": "PM-R5-L3", "tier": 1, "type": "calc", "stem": "Under the committee's risk policy, the fund's VaR is <i>closest<\/i> to:", "options": {"A": "€27.23 million.", "B": "€39.63 million.", "C": "€42.51 million."}}, {"id": "m1-s14-q2", "rel": [0, 5], "los": "PM-R5-L5", "tier": 1, "type": "concept", "stem": "The VaR extension that <i>best<\/i> addresses Okafor's concern is:", "options": {"A": "marginal VaR.", "B": "conditional VaR.", "C": "incremental VaR."}}, {"id": "m1-s14-q3", "rel": [0], "los": "PM-R5-L4", "tier": 2, "type": "concept", "stem": "The limitation of VaR that is <i>most<\/i> relevant to the fund's commodity sleeve is that VaR:", "options": {"A": "may understate losses because it does not account for the fall in liquidity when prices decline.", "B": "cannot be compared across asset classes such as commodities, equities, and bonds.", "C": "cannot be checked for reliability by backtesting."}}, {"id": "m1-s14-q4", "rel": [3], "los": "PM-R5-L6", "tier": 2, "type": "concept", "stem": "The measure that <i>most<\/i> appropriately addresses Varga's further request is:", "options": {"A": "the fund's equity beta and bond duration, because, like VaR, they indicate the probability of a given loss.", "B": "parametric VaR, because it estimates the loss associated with the stated crisis.", "C": "a historical scenario analysis, because it applies a set of large changes in several risk factors that actually occurred."}}]}, {"set": 15, "session": 2, "topic": "Economics", "code": "ECO", "vignette": "<p>Mirela Dragan is a sovereign credit analyst at Eastbrook Ratings. She is comparing the long-term growth prospects of three economies: Valmora, a high-income economy with a large stock of capital per worker; Tessaly, a fast-growing middle-income economy; and Ondra, a lower-income economy that has invested heavily in infrastructure over the past decade.<\/p>\n<p>Dragan forecasts potential GDP growth for the next ten years using the Solow growth accounting equation. Her trend forecasts of the inputs, together with each economy's historical labor productivity growth, are shown in Exhibit 1. To understand the sources of Ondra's past productivity gains, she also gathers the realized data for 2015–2025 in Exhibit 2.<\/p>\n<p>Valmora's finance ministry has announced tax incentives to raise the national saving rate and to expand private spending on research and education. The ministry's report states: \"Because knowledge created by private R&D spills over to other firms, returns to capital do not diminish for the economy as a whole. A permanently higher saving and investment rate will therefore permanently raise Valmora's growth rate.\"<\/p>\n<p>Dragan's colleague, Piotr Halas, comments on the outlook for the three economies: \"Tessaly's saving rate, population growth, and access to technology are now very similar to Valmora's, so I expect Tessaly's per capita income to converge to Valmora's level over time. Ondra's saving rate is much lower, so even if it grows faster for a while, its per capita income should converge to a lower level.\"<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Trend Forecasts of Growth Inputs, 2026–2035<\/caption><thead><tr><th>Forecast input (annual)<\/th><th>Valmora<\/th><th>Tessaly<\/th><th>Ondra<\/th><\/tr><\/thead><tbody><tr><td>Labor share of national income<\/td><td>0.65<\/td><td>0.55<\/td><td>0.60<\/td><\/tr><tr><td>Growth in total factor productivity<\/td><td>1.0%<\/td><td>1.2%<\/td><td>1.1%<\/td><\/tr><tr><td>Growth in capital stock<\/td><td>2.0%<\/td><td>4.0%<\/td><td>6.0%<\/td><\/tr><tr><td>Growth in labor force<\/td><td>0.2%<\/td><td>0.8%<\/td><td>1.8%<\/td><\/tr><tr><td>Historical labor productivity growth, 2015–2025<\/td><td>1.3%<\/td><td>3.1%<\/td><td>3.6%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Ondra — Realized Growth Data<\/caption><thead><tr><th>Realized annual average, 2015–2025<\/th><th>Ondra<\/th><\/tr><\/thead><tbody><tr><td>Real GDP growth<\/td><td>5.6%<\/td><\/tr><tr><td>Growth in capital stock<\/td><td>7.5%<\/td><\/tr><tr><td>Growth in labor force<\/td><td>2.0%<\/td><\/tr><tr><td>Labor share of national income<\/td><td>0.60<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s15-q1", "rel": [1, 4], "los": "ECO-R2-L5", "tier": 1, "type": "calc", "stem": "Using Dragan's method, Tessaly's forecast potential GDP growth rate is <i>closest<\/i> to:", "options": {"A": "3.44%.", "B": "3.76%.", "C": "3.90%."}}, {"id": "m1-s15-q2", "rel": [1, 5], "los": "ECO-R2-L4", "tier": 1, "type": "calc", "stem": "Based on Exhibit 2, the proportion of Ondra's 2015–2025 labor productivity growth that came from capital deepening is <i>closest<\/i> to:", "options": {"A": "61%.", "B": "83%.", "C": "92%."}}, {"id": "m1-s15-q3", "rel": [2], "los": "ECO-R2-L9", "tier": 1, "type": "concept", "stem": "The finance ministry's view of the effect of a higher saving rate is <i>most<\/i> consistent with:", "options": {"A": "classical growth theory.", "B": "neoclassical growth theory.", "C": "endogenous growth theory."}}, {"id": "m1-s15-q4", "rel": [0, 3], "los": "ECO-R2-L10", "tier": 2, "type": "concept", "stem": "Halas's comments on the outlook for Tessaly and Ondra are <i>best<\/i> described by the:", "options": {"A": "absolute convergence hypothesis.", "B": "conditional convergence hypothesis.", "C": "club convergence hypothesis."}}]}, {"set": 16, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Hana Okonkwo is a credit analyst at Ridgeline Bond Fund. She is reviewing two issuers whose bonds the fund holds: Corvane Bank, a regional bank, and Brackwater Insurance, a property and casualty (P&amp;C) insurer.<\/p>\n<p>Corvane was founded as a state development bank to finance farming and food processing in its home region, and most of its loans are still made to borrowers in that region. The national government had owned 51% of Corvane since its founding, as part of a long-standing policy of owning strategically important lenders. In 2025, as part of a broad privatization program, the government sold its entire stake to private investors.<\/p>\n<p>Okonkwo's notes on Corvane include the following observations:<\/p>\n<p>Observation 1: Corvane has issued €1.4 billion of standby letters of credit and unfunded loan commitments to commercial property developers. These are not recognized on its balance sheet.<br>\nObservation 2: Corvane's allowance for loan losses fell from 1.6 times to 1.1 times its non-performing loans during 2025.<br>\nObservation 3: Net interest income rose to 85% of Corvane's operating revenue, and trading income fell to 2%.<\/p>\n<p>Corvane's regulator applies the Basel III minimum capital ratios. Under its rules, goodwill and other intangible assets and all deferred tax assets are deducted in computing Common Equity Tier 1 capital. Selected data are shown in Exhibit 1.<\/p>\n<p>For Brackwater, Okonkwo computes underwriting ratios using statutory definitions: the loss and loss adjustment expense ratio is based on net premiums earned, and the underwriting expense ratio is based on net premiums written. Brackwater's data are shown in Exhibit 2.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Corvane Bank — Capital Data<\/caption><thead><tr><th>Item (€ millions), 31 December 2025<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Common stock and additional paid-in capital<\/td><td>380<\/td><\/tr><tr><td>Retained earnings<\/td><td>410<\/td><\/tr><tr><td>Accumulated other comprehensive income<\/td><td>15<\/td><\/tr><tr><td>Goodwill and other intangible assets<\/td><td>95<\/td><\/tr><tr><td>Deferred tax assets<\/td><td>40<\/td><\/tr><tr><td>Non-cumulative perpetual preferred stock (discretionary dividends)<\/td><td>30<\/td><\/tr><tr><td>Subordinated debt issued 2023, original maturity 8 years<\/td><td>290<\/td><\/tr><tr><td>Subordinated debt issued 2024, original maturity 4 years<\/td><td>60<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>12,000<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Brackwater Insurance — Underwriting Data<\/caption><thead><tr><th>€ millions<\/th><th>2024<\/th><th>2025<\/th><\/tr><\/thead><tbody><tr><td>Net premiums written<\/td><td>2,560<\/td><td>2,840<\/td><\/tr><tr><td>Net premiums earned<\/td><td>2,480<\/td><td>2,650<\/td><\/tr><tr><td>Losses and loss adjustment expenses<\/td><td>1,560<\/td><td>1,850<\/td><\/tr><tr><td>Underwriting expenses<\/td><td>840<\/td><td>905<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s16-q1", "rel": [3], "los": "FSA-R4-L3", "tier": 1, "type": "concept", "stem": "Which of Okonkwo's observations is <i>least likely<\/i> to be fully addressed by a CAMELS analysis of Corvane?", "options": {"A": "Observation 1", "B": "Observation 2", "C": "Observation 3"}}, {"id": "m1-s16-q2", "rel": [4, 6], "los": "FSA-R4-L2", "tier": 1, "type": "calc", "stem": "Corvane's Tier 1 capital ratio at the end of 2025 and its compliance with the Basel III minimum are <i>best<\/i> described as:", "options": {"A": "5.58%, below the minimum.", "B": "5.83%, below the minimum.", "C": "6.96%, above the minimum."}}, {"id": "m1-s16-q3", "rel": [5, 7], "los": "FSA-R4-L6", "tier": 1, "type": "calc", "stem": "Brackwater's combined ratio for 2025 is <i>closest<\/i> to, and indicates:", "options": {"A": "97.0%, an underwriting profit.", "B": "101.7%, an underwriting loss.", "C": "104.0%, an underwriting loss."}}, {"id": "m1-s16-q4", "rel": [1], "los": "FSA-R4-L5", "tier": 2, "type": "concept", "stem": "The government's 2025 sale of its stake in Corvane will <i>most likely<\/i>:", "options": {"A": "reduce the level of implicit government support that investors can expect for Corvane.", "B": "have no effect on Corvane's credit profile, because ownership is captured by the CAMELS capital adequacy component.", "C": "change Corvane's bank mission from regional development lending to diversified global lending."}}]}, {"set": 17, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Selma Achterberg, CFA, is an equity analyst covering Marrowfield Home &amp; Garden, a US specialty retailer of gardening, outdoor furniture, and home-improvement products. Marrowfield reports under US GAAP and values its inventory using the LIFO method. Because Marrowfield pays a small dividend and has volatile free cash flow from its store-opening program, Achterberg uses residual income models.<\/p>\n<p>Achterberg first evaluates management's performance for fiscal year 2025 using economic value added. Her firm's policy is to make one adjustment for LIFO retailers: the beginning-of-year LIFO reserve is added to beginning invested capital, and the <i>after-tax<\/i> increase in the LIFO reserve during the year is added to NOPAT. Selected data are shown in Exhibit 1.<\/p>\n<p>Achterberg then values Marrowfield's shares with a multistage residual income model, using the per-share forecasts in Exhibit 2. She expects residual income to fade after 2028 as competitors copy Marrowfield's store formats and assumes a persistence factor of 0.60 for residual income beyond the forecast horizon.<\/p>\n<p>Her colleague Pieter Nyberg argues that 0.60 is too low and that a persistence factor closer to 0.80 is justified. In discussing the stock, the two analysts note the following about Marrowfield:<\/p>\n<ul><li>Its ROE of about 14% is well above the 9.5% average of its peers.<\/li>\n<li>Its 2025 earnings include a large one-time gain on the sale of a distribution center

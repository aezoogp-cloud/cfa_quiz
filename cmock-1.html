.<\/li>\n<li>Established specialty retailers have historically sustained positive residual income for long periods.<\/li><\/ul>\n<p>Finally, Achterberg reviews items in Marrowfield's 2025 annual report: a write-down of slow-moving inventory, a restructuring charge for closing 14 stores, and an unrealized gain on available-for-sale debt securities held by its captive insurance subsidiary.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Marrowfield — EVA Inputs<\/caption><thead><tr><th>Item (fiscal year 2025)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>EBIT<\/td><td>$412 million<\/td><\/tr><tr><td>Tax rate<\/td><td>25%<\/td><\/tr><tr><td>Invested capital, beginning of year (reported)<\/td><td>$2,450 million<\/td><\/tr><tr><td>LIFO reserve, beginning of year<\/td><td>$96 million<\/td><\/tr><tr><td>LIFO reserve, end of year<\/td><td>$120 million<\/td><\/tr><tr><td>Weighted average cost of capital<\/td><td>8.6%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Marrowfield — Per-Share Forecasts (book value per share at the start of 2026: $30.00; cost of equity: 9.0%)<\/caption><thead><tr><th><\/th><th>2026<\/th><th>2027<\/th><th>2028<\/th><\/tr><\/thead><tbody><tr><td>Earnings per share<\/td><td>$4.20<\/td><td>$4.50<\/td><td>$4.70<\/td><\/tr><tr><td>Dividends per share<\/td><td>$1.20<\/td><td>$1.40<\/td><td>$1.60<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s17-q1", "rel": [1, 6], "los": "EQ-R5-L1", "tier": 1, "type": "calc", "stem": "Marrowfield's economic value added for fiscal year 2025 is <i>closest<\/i> to:", "options": {"A": "$108.04 million.", "B": "$114.04 million.", "C": "$116.30 million."}}, {"id": "m1-s17-q2", "rel": [2, 7], "los": "EQ-R5-L6", "tier": 1, "type": "calc", "stem": "Using Achterberg's assumptions, the intrinsic value per share of Marrowfield at the start of 2026 is <i>closest<\/i> to:", "options": {"A": "$33.78.", "B": "$34.95.", "C": "$35.16."}}, {"id": "m1-s17-q3", "rel": [3, 4], "los": "EQ-R5-L8", "tier": 1, "type": "concept", "stem": "Which of the characteristics noted by the two analysts <i>best<\/i> supports Nyberg's view on the persistence factor?", "options": {"A": "Marrowfield's ROE well above the peer average", "B": "The history of sustained residual income among established specialty retailers", "C": "The one-time gain included in Marrowfield's 2025 earnings"}}, {"id": "m1-s17-q4", "rel": [0, 5], "los": "EQ-R5-L11", "tier": 1, "type": "concept", "stem": "Which of the items Achterberg reviews in the 2025 annual report <i>most likely<\/i> results in a violation of the clean surplus relation?", "options": {"A": "The inventory write-down", "B": "The restructuring charge", "C": "The unrealized gain on available-for-sale debt securities"}}]}, {"set": 18, "session": 2, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>The Lindqvist Family Foundation manages a $1.4 billion portfolio, of which 65% is invested in public equities and the remainder in bonds and cash. The board has approved a 10% allocation to office real estate and has hired consultant Mateus Corrêa, CFA, to compare two ways of implementing it: buying Harbourline Plaza, a multi-tenant office building, directly, or buying shares of Fennick Office REIT, a listed equity REIT that owns 41 office properties.<\/p>\n<p>At the board meeting, the chair summarizes three objectives for the allocation:<\/p>\n<ul><li>Objective 1: The foundation must be able to reduce the allocation within a few days if grant commitments rise unexpectedly.<\/li>\n<li>Objective 2: The main purpose of the allocation is to lower the volatility of the total portfolio, so the board wants real estate returns that move as little as possible with the foundation's existing equity holdings.<\/li>\n<li>Objective 3: The foundation has no staff with property management experience and does not intend to hire any.<\/li><\/ul>\n<p>Corrêa gathers data on Harbourline Plaza (Exhibit 1) and on Fennick (Exhibit 2). Fennick's leases include contractual rent step-ups, so its reported rental revenue exceeds the cash rent it collects. Fennick acquired an office tower on 1 September 2025; its NOI for the 12 months ended 31 December 2025 includes four months of the tower's NOI, which totaled $3.6 million. Corrêa expects Fennick's cash NOI to grow 2.0% over the next 12 months, and recent sales of comparable office properties imply a capitalization rate of 6.25%. He assumes that the market value of Fennick's debt approximates its book value.<\/p>\n<p>Corrêa also compares Fennick with five other listed office REITs. The six REITs use very different amounts of debt, and the analysts covering them publish AFFO estimates based on differing assumptions about maintenance capital expenditures. The board asks him to rank the six REITs using a single price multiple that (1) is based on a standardized, widely reported earnings measure so that the figures are comparable across companies, and (2) relates the share price to an income measure available to shareholders after interest expense, so that the multiple reflects each REIT's leverage.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Direct Property Option<\/caption><thead><tr><th>Item<\/th><th>Harbourline Plaza<\/th><\/tr><\/thead><tbody><tr><td>Asking price<\/td><td>$138 million<\/td><\/tr><tr><td>Expected first-year NOI<\/td><td>$8.1 million<\/td><\/tr><tr><td>Occupancy<\/td><td>91%<\/td><\/tr><tr><td>Weighted average remaining lease term<\/td><td>6.2 years<\/td><\/tr><tr><td>Lease type<\/td><td>Gross leases (owner pays operating expenses)<\/td><\/tr><tr><td>Available mortgage financing<\/td><td>Up to 60% LTV; minimum DSCR 1.40×<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: Fennick Office REIT — Selected Financial Data<\/caption><thead><tr><th>Item (fiscal year 2025 / 31 December 2025)<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td>Net income<\/td><td>$142.9 million<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$88.4 million<\/td><\/tr><tr><td>Gain on sale of office properties<\/td><td>$21.5 million<\/td><\/tr><tr><td>Interest expense<\/td><td>$64.3 million<\/td><\/tr><tr><td>Non-cash (straight-line) rent<\/td><td>$9.8 million<\/td><\/tr><tr><td>Recurring maintenance-type capital expenditures and leasing commissions<\/td><td>$34.2 million<\/td><\/tr><tr><td>Net operating income, last 12 months<\/td><td>$236.0 million<\/td><\/tr><tr><td>Cash and equivalents<\/td><td>$42.5 million<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$31.0 million<\/td><\/tr><tr><td>Land held for future development<\/td><td>$58.0 million<\/td><\/tr><tr><td>Prepaid expenses<\/td><td>$12.5 million<\/td><\/tr><tr><td>Goodwill<\/td><td>$40.0 million<\/td><\/tr><tr><td>Deferred financing costs<\/td><td>$4.0 million<\/td><\/tr><tr><td>Total debt<\/td><td>$1,620.0 million<\/td><\/tr><tr><td>Other liabilities<\/td><td>$95.0 million<\/td><\/tr><tr><td>Shares outstanding<\/td><td>48.0 million<\/td><\/tr><tr><td>Share price<\/td><td>$41.80<\/td><\/tr><tr><td>Dividends per share<\/td><td>$2.90<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s18-q1", "rel": [0, 2], "los": "AI-R2-L1", "tier": 1, "type": "concept", "stem": "Compared with buying shares of Fennick, buying Harbourline Plaza directly is <i>most likely<\/i> better suited to meeting:", "options": {"A": "Objective 1.", "B": "Objective 2.", "C": "Objective 3."}}, {"id": "m1-s18-q2", "rel": [6], "los": "AI-R3-L3", "tier": 1, "type": "calc", "stem": "Fennick's adjusted funds from operations (AFFO) per share for fiscal year 2025 is <i>closest<\/i> to:", "options": {"A": "$3.45.", "B": "$3.90.", "C": "$4.37."}}, {"id": "m1-s18-q3", "rel": [3, 6], "los": "AI-R3-L2", "tier": 1, "type": "calc", "stem": "Corrêa's estimate of Fennick's net asset value per share (NAVPS) is <i>closest<\/i> to:", "options": {"A": "$45.07.", "B": "$46.63.", "C": "$47.54."}}, {"id": "m1-s18-q4", "rel": [4], "los": "AI-R3-L4", "tier": 1, "type": "concept", "stem": "Which price multiple <i>best<\/i> meets the board's two criteria for ranking the six REITs?", "options": {"A": "Price-to-AFFO", "B": "Price-to-FFO", "C": "Enterprise value-to-EBITDA"}}]}, {"set": 19, "session": 2, "topic": "Derivatives", "code": "DER", "vignette": "<p>Hanna Okonkwo-Reyes is head of the equity and rates options desk at Brightwater Securities. She reviews four client requests with trainee Lukas Vieira.<\/p>\n<p><b>Request 1: American-style put<\/b><\/p>\n<p>A pension fund client holding shares of Torvane Industries, a non-dividend-paying stock, asks for a quote on a two-year American-style put option with an exercise price of $78.00. Okonkwo-Reyes uses the two-period binomial model with the inputs in Exhibit 1. Vieira suggests that because the stock pays no dividends, early exercise can be ignored, as it would be for a call.<\/p>\n<p><b>Request 2: Forward-starting swap<\/b><\/p>\n<p>The treasurer of Velden Logistics plans to borrow on a floating-rate basis for three years beginning one year from today and expects interest rates to rise before then. She is considering a one-year forward-starting, three-year swap in which Velden pays fixed. The current forward swap rate for that swap is 3.20%. Rather than enter the swap now, the treasurer asks whether Velden could create the same exposure with swaptions that expire in one year on the three-year swap, each with an exercise rate of 3.20%.<\/p>\n<p><b>Request 3: Delta-hedged straddle<\/b><\/p>\n<p>The desk holds a long position in at-the-money calls and puts on the Kestrel 100 Index, with the same exercise price and three weeks to expiration, and keeps the position delta-neutral by trading index futures. For the next week, the desk economist forecasts the following:<\/p>\n<ul><li>The index will trade in a very narrow range, so realized volatility will be far below the options' implied volatility.<\/li>\n<li>Implied volatility on Kestrel 100 options will remain unchanged or rise slightly.<\/li>\n<li>The central bank will cut its policy rate by 25 basis points.<\/li><\/ul>\n<p><b>Request 4: BSM components<\/b><\/p>\n<p>A hedge fund client asks how to interpret the Black–Scholes–Merton (BSM) output for a six-month European call option on Arlo Systems shares, shown in Exhibit 2. Vieira prepares three statements for the client.<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Binomial Model Inputs for the Torvane Put<\/caption><thead><tr><th>Input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Current price of Torvane shares<\/td><td>$75.00<\/td><\/tr><tr><td>Up factor per period (u)<\/td><td>1.14<\/td><\/tr><tr><td>Down factor per period (d)<\/td><td>0.89<\/td><\/tr><tr><td>Risk-free rate per period<\/td><td>3.0%<\/td><\/tr><tr><td>Number of periods (one year each)<\/td><td>2<\/td><\/tr><tr><td>Exercise price<\/td><td>$78.00<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: BSM Output for the Arlo Systems Call<\/caption><thead><tr><th>BSM input / output<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Share price<\/td><td>$46.00<\/td><\/tr><tr><td>Exercise price<\/td><td>$45.00<\/td><\/tr><tr><td>Time to expiration<\/td><td>0.5 years<\/td><\/tr><tr><td>Continuously compounded risk-free rate<\/td><td>3.0%<\/td><\/tr><tr><td>Volatility<\/td><td>28%<\/td><\/tr><tr><td>N(d<sub>1<\/sub>)<\/td><td>0.6125<\/td><\/tr><tr><td>N(d<sub>2<\/sub>)<\/td><td>0.5350<\/td><\/tr><tr><td>PV of exercise price × N(d<sub>2<\/sub>)<\/td><td>$23.72<\/td><\/tr><tr><td>Call value<\/td><td>$4.46<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s19-q1", "rel": [2, 10], "los": "DER-R2-L4", "tier": 2, "type": "calc", "stem": "The value of the American-style put option on Torvane shares requested in Request 1 is <i>closest<\/i> to:", "options": {"A": "$5.25.", "B": "$5.41.", "C": "$6.56."}}, {"id": "m1-s19-q2", "rel": [4], "los": "DER-R2-L10", "tier": 1, "type": "concept", "stem": "Which of the following swaption positions <i>best<\/i> replicates the forward-starting swap Velden is considering in Request 2?", "options": {"A": "Buy a receiver swaption and sell a payer swaption; the net premium is zero.", "B": "Buy a payer swaption and sell a receiver swaption; the net premium is zero.", "C": "Buy a payer swaption and sell a receiver swaption; Velden pays a net premium because rates are expected to rise."}}, {"id": "m1-s19-q3", "rel": [6, 7], "los": "DER-R2-L11", "tier": 2, "type": "concept", "stem": "If the economist's forecasts in Request 3 are correct, the delta-neutral straddle position is <i>most likely<\/i> to lose value over the next week because of its exposure to:", "options": {"A": "vega.", "B": "theta.", "C": "rho."}}, {"id": "m1-s19-q4", "rel": [9, 11], "los": "DER-R2-L7", "tier": 2, "type": "concept", "stem": "Which of Vieira's statements about the Arlo Systems call in Exhibit 2 is <i>most<\/i> accurate?", "options": {"A": "The risk-neutral probability that the call expires in the money is 0.5350.", "B": "The risk-neutral probability that the call expires in the money is 0.6125.", "C": "The call can be replicated by buying 0.6125 shares and investing $23.72 in risk-free bonds."}}]}, {"set": 20, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>The credit committee of Thornbury Asset Management is reviewing a possible purchase of a bond issued by Calloway Rail Corporation, a freight railroad rated BBB. The bond is a senior unsecured, option-free, three-year bond with a 5.0% annual coupon that was issued two years ago and currently trades at 102.60 per 100 of par value. Calloway's rating outlook is stable, and the bond's modified duration is 2.73.<\/p>\n<p>Credit analyst Ines Moretti prepares the valuation inputs in Exhibit 1. Thornbury's policy is to value credit-risky bonds using market-implied (risk-neutral) default probabilities, with a constant hazard rate, a recovery rate based on the bond's seniority, and the government benchmark curve for discounting. Moretti computes the credit valuation adjustment (CVA) per 100 of par value, defining the exposure at each date as the value at that date of all remaining payments, including the coupon due on that date. She then calculates the bond's fair value and the credit spread implied by that fair value.<\/p>\n<p>Committee member Daniel Achebe asks how the hazard rate was derived. Moretti explains that it was implied from Calloway's credit default swap spreads using a reduced-form approach, and adds that a structural model could be used as a cross-check. Achebe is skeptical of the structural approach because Calloway has substantial operating lease commitments and pension obligations.<\/p>\n<p>Finally, the committee discusses how Calloway's spread could change. Three members make the following comments:<\/p>\n<ul><li>Comment 1: \"If the economy moves toward recession, Calloway's credit spread should widen because default probabilities would rise and expected recovery rates would fall.\"<\/li>\n<li>Comment 2: \"If uncertainty about future inflation increases, Calloway's credit spread over the government benchmark should widen.\"<\/li>\n<li>Comment 3: \"If we raised our recovery rate assumption from 35% to 45% and left the hazard rate unchanged, the bond's fair value would fall and its credit spread would widen.\"<\/li><\/ul>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Calloway Rail Corporation Bond — Credit Valuation Inputs<\/caption><thead><tr><th>Input<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Government benchmark yield curve<\/td><td>Flat at 3.0% (annual compounding)<\/td><\/tr><tr><td>Risk-neutral hazard rate (from CDS spreads), per year<\/td><td>1.8%<\/td><\/tr><tr><td>Historical average annual default rate, BBB issuers<\/td><td>0.8%<\/td><\/tr><tr><td>Recovery rate, senior unsecured<\/td><td>35%<\/td><\/tr><tr><td>Recovery rate, subordinated<\/td><td>20%<\/td><\/tr><tr><td>Coupon / remaining maturity<\/td><td>5.0% annual / 3 years<\/td><\/tr><tr><td>Market price<\/td><td>102.60<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s20-q1", "rel": [0, 1, 5], "los": "FI-R4-L1", "tier": 1, "type": "calc", "stem": "The CVA per 100 of par value that Moretti calculates is <i>closest<\/i> to:", "options": {"A": "2.28.", "B": "3.48.", "C": "3.69."}}, {"id": "m1-s20-q2", "rel": [0, 1, 5], "los": "FI-R4-L5", "tier": 1, "type": "calc", "stem": "The credit spread implied by Moretti's fair value of the Calloway bond is <i>closest<\/i> to:", "options": {"A": "0.54%.", "B": "1.06%.", "C": "1.21%."}}, {"id": "m1-s20-q3", "rel": [2], "los": "FI-R4-L4", "tier": 1, "type": "concept", "stem": "Which of the following statements about the credit models discussed by Moretti and Achebe is <i>most<\/i> accurate?", "options": {"A": "Under a structural model, Calloway's bondholders are effectively long a risk-free bond and long a put option on Calloway's assets.", "B": "The reduced-form model's main advantage is that it explains why default occurs: the value of the company's assets falls below the face value of its debt.", "C": "The reduced-form model does not assume that Calloway's assets trade, and its default intensity can vary with company-specific and macroeconomic variables."}}, {"id": "m1-s20-q4", "rel": [3, 4], "los": "FI-R4-L6", "tier": 1, "type": "concept", "stem": "Which of the committee members' comments about changes in Calloway's credit spread is <i>most<\/i> accurate?", "options": {"A": "Comment 1", "B": "Comment 2", "C": "Comment 3"}}]}, {"set": 21, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Halvorsen Quantitative Partners is building a systematic global equity strategy, the Halvorsen Multifactor Strategy (HMS), which will be benchmarked against a broad developed-market equity index. The research team is led by Ingrid Halvorsen, CFA. Before presenting the strategy to the firm's investment committee, she asks two analysts, Rahul Mendes and Chiara Lotti, to estimate the strategy's expected return, analyze its active risk, and backtest it.<\/p>\n<p>Mendes uses a four-factor model (market, size, value, and momentum). The size factor is defined as small-cap minus large-cap returns, so the HMS portfolio's negative size sensitivity reflects its large-cap tilt. The annual risk-free rate is 3.0%. Factor sensitivities and risk premiums are shown in Exhibit 1. Mendes notes that the value factor has had a poor year and suggests that \"the last twelve months tell us more about the coming year than any long-run premium.\"<\/p>\n<p>Lotti runs a rolling-window backtest using monthly data from January 2014 to December 2025. To save time, she builds the stock universe from the current constituents of the benchmark index. Each stock's earnings yield is computed from quarterly accounting data dated at the fiscal quarter-end, and portfolios are rebalanced on that same date. Lotti also tests 36 combinations of factor weights and look-back windows, and she keeps the combination with the highest t-statistic of mean active return (2.4). Summary results for that combination are given in Exhibit 2.<\/p>\n<p>In reviewing the results, Halvorsen makes three comments:<\/p>\n<p>Comment 1: \"Building the universe from current index members creates look-ahead bias; adding a three-month reporting lag to the accounting data will remove it.\"<\/p>\n<p>Comment 2: \"Choosing the best of 36 specifications risks a false positive. We should require a t-statistic of at least 3.0 and test the chosen combination on data that was not used to select it.\"<\/p>\n<p>Comment 3: \"Because the earnings data are used on the fiscal quarter-end date, the backtest suffers from survivorship bias, which we can fix by adding delisted stocks.\"<\/p>", "exhibits": [{"id": "Exhibit 1", "html": "<table><caption>Exhibit 1: Four-Factor Model Inputs for the HMS Portfolio<\/caption><thead><tr><th>Factor<\/th><th>HMS sensitivity<\/th><th>Benchmark sensitivity<\/th><th>Expected annual risk premium<\/th><th>Realized factor return, last 12 months<\/th><\/tr><\/thead><tbody><tr><td>Market<\/td><td>0.95<\/td><td>1.00<\/td><td>5.0%<\/td><td>2.0%<\/td><\/tr><tr><td>Size (small − large)<\/td><td>−0.15<\/td><td>0.00<\/td><td>2.0%<\/td><td>−1.0%<\/td><\/tr><tr><td>Value<\/td><td>0.30<\/td><td>0.05<\/td><td>3.0%<\/td><td>−2.5%<\/td><\/tr><tr><td>Momentum<\/td><td>0.20<\/td><td>0.00<\/td><td>4.0%<\/td><td>6.0%<\/td><\/tr><\/tbody><\/table>"}, {"id": "Exhibit 2", "html": "<table><caption>Exhibit 2: HMS Backtest Summary<\/caption><thead><tr><th>Statistic (backtest, Jan 2014–Dec 2025)<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Mean monthly return<\/td><td>0.90%<\/td><\/tr><tr><td>Standard deviation of monthly returns<\/td><td>3.20%<\/td><\/tr><tr><td>Mean monthly risk-free rate<\/td><td>0.25%<\/td><\/tr><tr><td>Annualized mean active return<\/td><td>2.40%<\/td><\/tr><tr><td>Information ratio (annualized)<\/td><td>0.60<\/td><\/tr><tr><td>Active specific risk (annualized standard deviation)<\/td><td>2.20%<\/td><\/tr><tr><td>Share of active factor risk: market / size / value / momentum<\/td><td>12% / 18% / 44% / 26%<\/td><\/tr><tr><td>Skewness of monthly returns<\/td><td>−0.85<\/td><\/tr><tr><td>Excess kurtosis of monthly returns<\/td><td>3.10<\/td><\/tr><tr><td>Wealth index (Jan 2014 = 100): peak, Jun 2018<\/td><td>168.0<\/td><\/tr><tr><td>Wealth index: lowest value after Jun 2018 peak, Mar 2020<\/td><td>126.0<\/td><\/tr><tr><td>Wealth index: peak, Nov 2021<\/td><td>190.0<\/td><\/tr><tr><td>Wealth index: lowest value after Nov 2021 peak, Oct 2022<\/td><td>171.0<\/td><\/tr><tr><td>Wealth index: Dec 2025<\/td><td>205.0<\/td><\/tr><\/tbody><\/table>"}], "qs": [{"id": "m1-s21-q1", "rel": [1, 7], "los": "PM-R4-L3", "tier": 1, "type": "calc", "stem": "Based on Exhibit 1, the expected annual return of the HMS portfolio is <i>closest<\/i> to:", "options": {"A": "5.50%.", "B": "6.15%.", "C": "9.15%."}}, {"id": "m1-s21-q2", "rel": [8], "los": "PM-R4-L7", "tier": 1, "type": "calc", "stem": "Based on Exhibit 2, the proportion of the HMS strategy's active risk squared attributable to its value factor exposure is <i>closest<\/i> to:", "options": {"A": "19.8%.", "B": "30.7%.", "C": "44.0%."}}, {"id": "m1-s21-q3", "rel": [2, 3, 4, 5, 6], "los": "PM-R6-L4", "tier": 1, "type": "concept", "stem": "Which of Halvorsen's comments is <i>most<\/i> accurate?", "options": {"A": "Comment 1", "B": "Comment 2", "C": "Comment 3"}}, {"id": "m1-s21-q4", "rel": [8], "los": "PM-R6-L3", "tier": 2, "type": "calc", "stem": "Based on Exhibit 2, the HMS backtest's annualized Sharpe ratio and maximum drawdown are <i>closest<\/i> to:", "options": {"A": "Sharpe ratio 0.20; maximum drawdown 25.0%.", "B": "Sharpe ratio 0.70; maximum drawdown 10.0%.", "C": "Sharpe ratio 0.70; maximum drawdown 25.0%."}}]}, {"set": 22, "session": 2, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Corvane Asset Management is a mid-sized investment adviser that manages separate accounts for institutions and wealthy families. Nikolai Brandt, CFA, has managed Corvane's small-cap equity strategy for six years. Brandt reports to Sofia Marchetti, CFA, Corvane's head of equities, who supervises the firm's eight portfolio managers and analysts.<\/p>\n<p>In early March, Brandt accepts an offer to join Tessaro Capital, a competitor, and gives Corvane the four weeks' notice required by his employment contract. During the notice period, Brandt continues to manage his portfolios. In the evenings, he signs a lease for a home office and registers with Tessaro's regulator, which he must do before starting his new job. He also uses his personal mobile phone to call three of his largest clients. He tells them he is moving to Tessaro and that \"the strategy will come with me, so it would be easy to move your accounts over once I start.\" On his last week at Corvane, he copies the spreadsheet containing the stock-screening model he built while at Corvane onto a personal USB drive. Corvane's employment contract states that all work product created by employees belongs to the firm.<\/p>\n<p>Two weeks before Brandt's departure date, one of these clients calls Marchetti to ask whether Corvane would charge a fee for transferring the account. That is how Marchetti learns of Brandt's calls. Corvane's compliance manual is reviewed every year and covers personal trading, gifts, and trade allocation, but it contains no procedures for employees who resign, such as restricting system access or reviewing their client contacts.<\/p>\n<p>Brandt's portfolios will be taken over by Daniel Osei, CFA, a senior analyst. Osei has been studying Verdana Foods, a small-cap holding. He combines shipment data purchased from a commercial data vendor, his own counts of Verdana products on the shelves of 40 grocery stores, and the public financial statements of Verdana's largest packaging supplier. During a routine call, Verdana's investor relations officer tells him that \"the new plant is running on schedule,\" a comment that adds little to what the company said publicly at its last results. From all of this, Osei concludes that Verdana's quarterly earnings will be well above consensus, and he buys Verdana shares for the small-cap accounts.<\/p>\n<p>Ana Ruiz, a research associate on Osei's team, took the CFA Level II exam the previous weekend. On her public social media profile, she posts: \"So glad I spent extra hours on swap valuation; it paid off on exam day! Still think the testing window is too short, though.\"<\/p>", "exhibits": [], "qs": [{"id": "m1-s22-q1", "rel": [1], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Did Brandt violate Standard IV(A) Loyalty during his notice period?", "options": {"A": "Yes, by soliciting clients and taking the screening model before leaving Corvane.", "B": "Yes, but only by taking the screening model; the client calls were made from his personal phone outside working hours.", "C": "No, because he built the screening model himself and clients are free to choose their manager."}}, {"id": "m1-s22-q2", "rel": [0, 2], "los": "ETH-R2-L2", "tier": 2, "type": "concept", "stem": "After learning of Brandt's calls, Marchetti should <i>most appropriately<\/i>:", "options": {"A": "promptly investigate, limit Brandt's client contact and system access while she does so, and recommend to management that procedures for departing employees be added to the compliance manual.", "B": "report Brandt to CFA Institute's Professional Conduct Program and take no further action, because Brandt will soon leave Corvane.", "C": "decline in writing all supervisory responsibility until Corvane rewrites its compliance manual, and leave any investigation to Tessaro after Brandt joins it."}}, {"id": "m1-s22-q3", "rel": [3], "los": "ETH-R3-L1", "tier": 2, "type": "concept", "stem": "By buying Verdana shares for the small-cap accounts, Osei:", "options": {"A": "violated Standard II(A), because his conclusion that earnings will beat consensus is material information that the market does not have.", "B": "violated Standard II(A), because the investor relations officer's comment was nonpublic information.", "C": "did not violate Standard II(A)."}}, {"id": "m1-s22-q4", "rel": [4], "los": "ETH-R3-L1", "tier": 1, "type": "concept", "stem": "Does Ruiz's social media post violate Standard VII(A) Conduct as Participants in CFA Institute Programs?", "options": {"A": "Yes, because it reveals a topic that was tested on the exam.", "B": "Yes, because it publicly criticizes a CFA Institute exam policy.", "C": "No, because it does not disclose any specific exam question."}}]}]};

const inSession = () => S.phase === "s1" || S.phase === "s2";

const inView = x => !!S.sub[x.sess] && (!S.sview || x.sess === S.sview);

// ---------- exam flow ----------
function startSession(se) {
  if (!S.startedAt) S.startedAt = new Date().toISOString();
  const [a, b] = sessRange(se), l = S.last[se];

}

// 메인 화면으로: 풀이 중이던 위치를 기억하고, 메인에 있는 동안은 시간이 흐르지 않는다

function updateTimer() {
  const t = $("timer"); if (!t) return;
  const se = curSess();
  if (S.unlimited) { const [a, b] = sessRange(se); let sum = 0; for (let i = a; i <= b; i++) sum += S.time[QL[i].q.id] || 0; t.textContent = "⏱ " + fmt(sum) + " (무제한)"; t.classList.remove("low"); }
  else { t.textContent = S.rem[se] < 0 ? "⏰ +" + fmt(-S.rem[se]) + " 초과" : fmt(S.rem[se]); t.classList.toggle("low", S.rem[se] < 600); }
}

// ---------- rendering ----------
function render() {
  applyDark();
  const app = $("app");
  document.body.classList.toggle("live", inSession());
  syncOverlay();
  if (S.phase === "start") return renderStart(app);
  if (S.phase === "done") return S.study !== false ? renderStudy() : renderResults(app);
  if (S.phase === "review1" || S.phase === "review2") return renderReview(app);
  renderExam();
}
function darkBtn() { return `<button onclick="toggleDark()">🌓</button>`; }
function toggleDark() { dark = !dark; try { localStorage.setItem("agent-mock-dark", dark ? "1" : "0"); } catch (e) {} applyDark(); }

// 저장본 복원: 세션 중이던 상태는 항상 일시정지로 복원 (자동으로 시간이 흐르지 않게)
function restoreFrom(prev) {
  S = normalizeState(prev);
  if (S.phase === "review1") S.phase = "s1";
  if (S.phase === "review2") S.phase = "s2";
  lastTick = Date.now();
  if (inSession() && !S.paused) pauseExam("reload", S.savedAt ? Date.parse(S.savedAt) : Date.now());
  else save();
  render();
}
function sessUsed(se) { const [a, b] = sessRange(se); let t = 0; for (let i = a; i <= b; i++) t += S.time[QL[i].q.id] || 0; return t; }
function renderStart(app) {
  app.dataset.mode = "hub";
  const rows = (S.sub[1] || S.sub[2]) ? grade() : null;
  const card = se => {
    const [a, b] = sessRange(se), tot = b - a + 1;
    let n = 0; for (let i = a; i <= b; i++) if (S.answers[QL[i].q.id]) n++;
    let st, btns;
    if (S.sub[se]) {
      const c = rows.slice(a, b + 1).filter(r => r.ok).length;
      st = `<b class="okc">제출 완료</b> · ${c}/${tot} (${pct(c, tot)}%)`;
      btns = `<button class="pri" data-g="${se}">채점 결과·오답 보기</button>` + (se === 1 && S.rem[1] === 0 ? ` <button id="s1back">Session 1로 돌아가 이어 풀기</button><p class="mut">시간 종료로 자동 제출된 경우에만 보입니다.</p>` : "");
    } else {
      const go = n > 0 || sessUsed(se) > 0;
      const t = S.unlimited ? fmt(sessUsed(se)) + " 경과" : (S.rem[se] < 0 ? "+" + fmt(-S.rem[se]) + " 초과" : "남은 시간 " + fmt(S.rem[se]));
      st = go ? `풀이 중 · ${n}/${tot} 응답 · ${t}` : "시작 전";
      btns = `<button class="pri" data-s="${se}">Session ${se} ${go ? "이어 풀기" : "시작"}</button>`;
    }
    return `<div class="card"><h3>Session ${se}</h3><p class="mut">Set ${DATA.sets[QL[a].si].set}–${DATA.sets[QL[b].si].set} · ${tot}문항 · 132분</p><p>${st}</p>${btns}</div>`;
  };
  app.innerHTML = `<div class="center"><div style="text-align:right">${darkBtn()}</div>
  <h1>Agent Mock ${MOCK} — CFA Level II</h1>
  <div class="card"><p>Session 1과 Session 2를 따로 시작합니다. 세션을 제출하면 그 세션만 바로 채점·오답 복습을 할 수 있고, 다른 세션은 나중에 풀어도 됩니다.</p>
  <ul><li>제출한 세션은 다시 풀 수 없습니다. 시간이 끝나도 자동 제출되지 않고, 초과 시간이 기록됩니다.</li>
  <li>풀이 중 ◀ 메인으로 나오면 그 세션의 시간이 멈추고, 이어 풀기로 다시 들어갈 수 있습니다.</li>
  <li>플래그(⚑), 오답 지우기(✕), vignette 하이라이트, 관련 지문 강조 기능을 쓸 수 있습니다.</li>
  <li>진행 상황은 브라우저 localStorage에 자동 저장되며, 💾 저장 버튼으로 <code>Mock${MOCK}_results_날짜.json</code>을 받을 수 있습니다. GitHub의 <code>results/Mock${MOCK}/latest.json</code>이 더 최신이면 열 때 자동으로 불러옵니다(일시정지 상태).</li>
  <li>합격선은 CFA Institute가 공개하지 않습니다. 리포트의 65–70%는 비공식 참고선일 뿐입니다.</li></ul>
  <label><input type="checkbox" id="unl"${S.unlimited ? " checked" : ""}${S.startedAt ? " disabled" : ""}> 시간 무제한 (연습용 — 결과에 표기됨${S.startedAt ? ", 시작 후에는 바꿀 수 없음" : ""})</label></div>
  <div class="grid">${card(1)}${card(2)}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
  ${S.sub[1] && S.sub[2] ? `<button class="pri" id="allbtn">전체 결과 (88문항)</button>` : ""}
  <button id="exphub">💾 저장</button>
  <button id="impbtn">Import JSON</button><input type="file" id="impfile" accept=".json" style="display:none">
  ${S.startedAt ? `<button id="resethub">↺ 처음부터 다시</button>` : ""}</div></div>`;
  $("unl").onchange = e => { S.unlimited = e.target.checked; save(); };
  app.querySelectorAll("[data-s]").forEach(bt => bt.onclick = () => startSession(+bt.dataset.s));
  app.querySelectorAll("[data-g]").forEach(bt => bt.onclick = () => openGraded(+bt.dataset.g));
  if ($("allbtn")) $("allbtn").onclick = () => openGraded(0);
  if ($("s1back")) $("s1back").onclick = () => { if (confirm("Session 1 제출을 취소하고 이어 풉니다. 계속할까요?")) reopenS1(); };
  $("exphub").onclick = exportJSON;
  if ($("resethub")) $("resethub").onclick = () => { if (confirm("모든 답안·시간·진행 상황을 삭제하고 처음으로 돌아갑니다. 💾 저장했는지 확인하세요. 계속할까요?")) { S = fresh(); try { localStorage.removeItem(SKEY); } catch (e) {} render(); } };
  $("impbtn").onclick = () => $("impfile").click();
  $("impfile").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importJSON(r.result); r.readAsText(f); };
}

function renderExam() {
  const app = $("app");
  const x = QL[S.cur], q = x.q, s = DATA.sets[x.si], se = x.sess;
  const [a, b] = sessRange(se);
  if (!$("left") || app.dataset.mode !== "exam") {
    app.dataset.mode = "exam";
    app.innerHTML = `<div id="top"><button id="hubq" title="메인 화면으로 (이 세션 시간 멈춤)">◀ 메인</button><b>Mock ${MOCK} · Session ${se}</b><span id="qinfo"></span><span class="grow"></span>
      <button id="resetq" title="모든 진행 상황 삭제 후 처음으로">↺ Reset</button><button id="expq" title="지금까지 진행 상황을 JSON으로 내보내기">💾 저장</button><button class="flagbtn" id="flagbtn"></button><span id="timer"></span><button id="pausebtn" title="일시정지 (P)">⏸ 일시정지</button>${darkBtn()}
      <button id="endbtn">Session ${se} 종료…</button></div>
      <div id="main"><div id="left"></div><div id="right"></div></div>
      <div id="bottom"><button id="prev">◀ Prev</button><button id="next">Next ▶</button><div id="nav"></div></div>`;
    $("prev").onclick = () => { if (S.cur > a) goto(S.cur - 1); };
    $("next").onclick = () => { if (S.cur < b) goto(S.cur + 1); };
    $("pausebtn").onclick = () => pauseExam("manual");
    $("expq").onclick = exportJSON;
    $("endbtn").onclick = () => { S.phase = "review" + se; save(); render(); };
    $("hubq").onclick = toHub;
    $("resetq").onclick = () => { if (confirm("모든 답안·시간·진행 상황을 삭제하고 처음으로 돌아갑니다. 계속할까요?")) { S = fresh(); try { localStorage.removeItem(SKEY); } catch (e) {} render(); } };
    $("flagbtn").onclick = () => { const id = QL[S.cur].q.id; if (S.flagged[id]) delete S.flagged[id]; else S.flagged[id] = 1; save(); renderExam(); };
  }
  $("qinfo").textContent = `Q ${x.no}/88 · Set ${s.set}`;
  const id = q.id;
  $("flagbtn").className = "flagbtn" + (S.flagged[id] ? " on" : "");
  $("flagbtn").textContent = S.flagged[id] ? "⚑ Flagged" : "⚐ Flag";
  renderLeft(x, renderExam);
  const R = $("right");
  R.scrollTop = 0;
  const st = S.struck[id] || [];
  R.innerHTML = `<div class="mut" style="font-size:13px">Question ${x.no}</div><div class="stem">${q.stem}</div>` +
    Object.keys(q.options).map(k => `<div class="opt${S.answers[id] === k ? " sel" : ""}${st.includes(k) ? " strike" : ""}" data-k="${k}">
      <span class="l">${k}</span><span class="t">${q.options[k]}</span><button class="x" data-x="${k}" title="오답 지우기">✕</button></div>`).join("");
  R.querySelectorAll(".opt").forEach(o => o.onclick = e => {
    const k = o.dataset.k;
    if (e.target.closest(".x")) { const arr = (S.struck[id] = S.struck[id] || []); const i = arr.indexOf(k); if (i >= 0) arr.splice(i, 1); else arr.push(k); }
    else { if (S.answers[id] === k) delete S.answers[id]; else S.answers[id] = k; }
    save(); renderExam();
  });
  typeset(R);
  renderNav(a, b);
  updateTimer();
}
// left pane: re-render only when set changes
function renderLeft(x, rerender) {
  const L = $("left"), s = DATA.sets[x.si];
  if (L.dataset.si !== String(x.si)) {
    L.dataset.si = x.si;
    const hl = S.hl[s.set];
    L.innerHTML = `<div class="vh"><b>Set ${s.set} · ${esc(s.topic)}</b><button id="hlbtn">하이라이트</button><button id="hlclr">지우기</button><button id="relbtn" title="이 문항 풀이에 필요한 지문만 강조하고 나머지는 흐리게">관련 지문 강조</button></div><div id="vig">${hl || blockize(s)}</div>`;
    $("relbtn").onclick = () => { S.relOn = S.relOn === false; save(); applyRel(); };
    $("hlbtn").onclick = () => highlightSel(s.set);
    $("hlclr").onclick = () => { delete S.hl[s.set]; save(); L.dataset.si = ""; rerender(); };
    typeset(L);
  }
  applyRel();
}
function blockize(s) {
  const t = document.createElement("template"); t.innerHTML = s.vignette;
  let i = 0;
  return [...t.content.children].map(c => `<div class="vb" data-b="${i++}">${c.outerHTML}</div>`).join("") +
    s.exhibits.map(e => `<div class="vb" data-b="${i++}">${e.html}</div>`).join("");
}
function applyRel() {
  const v = $("vig"); if (!v) return;
  const rel = QL[S.cur].q.rel || [], on = S.relOn !== false && rel.length > 0;
  v.querySelectorAll(".vb").forEach(b => { const r = rel.includes(+b.dataset.b); b.classList.toggle("rel", on && r); b.classList.toggle("dim", on && !r); });
  $("relbtn").classList.toggle("on", S.relOn !== false);
}
function renderNav(a, b) {
  let h = "";
  for (let i = a; i <= b; i++) {
    const x = QL[i], id = x.q.id, first = i === a || QL[i - 1].si !== x.si;
    h += `<button class="nb${S.answers[id] ? " ans" : ""}${i === S.cur ? " cur" : ""}${S.flagged[id] ? " fl" : ""}${first ? " setstart" : ""}" data-i="${i}" title="Set ${DATA.sets[x.si].set}">${x.no}</button>`;
  }
  $("nav").innerHTML = h;
  $("nav").querySelectorAll("button").forEach(bt => bt.onclick = () => goto(+bt.dataset.i));
}
function highlightSel(setNo) {
  const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0), v = $("vig");
  if (!v.contains(r.commonAncestorContainer)) return;
  try { const m = document.createElement("mark"); m.appendChild(r.extractContents()); r.insertNode(m); } catch (e) { return; }
  sel.removeAllRanges(); S.hl[setNo] = v.innerHTML; save();
}

function renderReview(app) {
  app.dataset.mode = "review";
  const se = curSess(), [a, b] = sessRange(se);
  let un = [], fl = [];
  for (let i = a; i <= b; i++) { const id = QL[i].q.id; if (!S.answers[id]) un.push(i); if (S.flagged[id]) fl.push(i); }
  const chip = i => `<button class="nb ${S.answers[QL[i].q.id] ? "ans" : ""} ${S.flagged[QL[i].q.id] ? "fl" : ""}" data-i="${i}">${QL[i].no}</button>`;
  app.innerHTML = `<div id="top"><b>Session ${se} — 제출 전 확인</b><span class="grow"></span><span id="timer"></span><button id="pausebtn" title="일시정지 (P)">⏸ 일시정지</button>${darkBtn()}</div>
  <div class="center"><div class="card"><h3>미응답 ${un.length}문항</h3><div style="display:flex;flex-wrap:wrap;gap:3px">${un.map(chip).join("") || "<span class='mut'>없음</span>"}</div></div>
  <div class="card"><h3>Flag ${fl.length}문항</h3><div style="display:flex;flex-wrap:wrap;gap:3px">${fl.map(chip).join("") || "<span class='mut'>없음</span>"}</div></div>
  <div style="display:flex;gap:10px"><button id="back">돌아가기</button><button class="pri" id="sub">Session ${se} 제출 및 채점</button></div></div>`;
  app.querySelectorAll(".nb").forEach(bt => bt.onclick = () => { S.phase = "s" + se; S.cur = +bt.dataset.i; save(); render(); });
  $("pausebtn").onclick = () => pauseExam("manual");
  $("back").onclick = () => { S.phase = "s" + se; save(); render(); };
  $("sub").onclick = () => { if (confirm("제출하면 이 세션은 다시 풀 수 없습니다. 제출 후 메인 화면에서 이 세션의 채점 결과·오답을 볼 수 있습니다. 제출할까요?")) submitSession(se); };
  updateTimer();
}

// ---------- 복습: 채점 후 시험 화면 그대로 한 문항씩 ----------
const SFILT = [["wf", "오답+Flag"], ["wrong", "오답"], ["flag", "Flag"], ["all", "전체"]];
function studyList(f, rows) {
  f = f || S.sfilt || "wf"; rows = rows || grade();
  return rows.filter(r => inView(r.x)).filter(r => f === "all" || (f === "wrong" && !r.ok) || (f === "flag" && r.flag) || (f === "wf" && (!r.ok || r.flag))).map(r => r.i);
}
function openStudy(i) {
  S.study = true; S.sfilt = S.sfilt || "wf";
  if (i === undefined || !inView(QL[i])) { const l = studyList(); i = l.length ? l[0] : gradedIdx()[0]; }
  S.cur = i; $("app").dataset.mode = ""; save(); render();
}
function closeStudy() { S.study = false; save(); render(); }
function studyGo(i) { S.cur = i; save(); renderStudy(); }
function studyStep(dir) {
  const l = studyList(), p = l.indexOf(S.cur);
  const j = p >= 0 ? l[p + dir] : (dir > 0 ? l.find(i => i > S.cur) : l.slice().reverse().find(i => i < S.cur));
  if (j !== undefined) studyGo(j);
}
// 간결 오답노트: 핵심 · 공식 · 풀이 · 함정 (선지별 오답 사유는 각 선지 아래에)
function noteHTML(sec) {
  const n = sec.n || {k: sec.e, s: [], t: ""};
  const row = (l, v) => v ? `<div class="nl">${l}</div><div>${v}</div>` : "";
  return `<div class="note">${row("핵심", esc(n.k))}${row("공식", sec.f ? esc(sec.f) : "")}${row("풀이", n.s.map(esc).join("<br>"))}${row("함정", esc(n.t))}</div>`;
}
function renderStudy() {
  if (!inView(QL[S.cur])) { const g = gradedIdx(); if (!g.length) { S.phase = "start"; return render(); } S.cur = g[0]; }
  const app = $("app"), rows = grade(), r = rows[S.cur], x = r.x, q = r.q, s = DATA.sets[x.si], sec = getSecret()[r.id];
  S.reviewed = S.reviewed || {};
  if (!$("left") || app.dataset.mode !== "study") {
    app.dataset.mode = "study";
    app.innerHTML = `<div id="top"><button id="tohub">◀ 메인</button><b>Mock ${MOCK} · ${S.sview ? "Session " + S.sview + " " : ""}복습</b><span id="qinfo"></span><span class="grow"></span>
      <span class="tabs" id="sfilt" style="margin:0"></span><button id="doneb" title="복습 완료 표시 (하단 번호에 ✓)"></button>${darkBtn()}<button id="tores">결과 화면</button></div>
      <div id="main"><div id="left"></div><div id="right"></div></div>
      <div id="bottom"><button id="prev">◀ Prev</button><button id="next">Next ▶</button><div id="nav"></div></div>`;
    $("prev").onclick = () => studyStep(-1);
    $("next").onclick = () => studyStep(1);
    $("tores").onclick = closeStudy;
    $("tohub").onclick = toHub;
    $("doneb").onclick = () => { const id = QL[S.cur].q.id; if (S.reviewed[id]) delete S.reviewed[id]; else S.reviewed[id] = 1; save(); renderStudy(); };
  }
  const l = studyList(null, rows), p = l.indexOf(S.cur);
  $("qinfo").textContent = `S${x.sess} Q${x.no} · Set ${s.set}` + (p >= 0 ? ` · ${p + 1}/${l.length}` : " · 목록 밖");
  $("sfilt").innerHTML = SFILT.map(f => `<button data-f="${f[0]}" class="${S.sfilt === f[0] ? "on" : ""}">${f[1]} ${studyList(f[0], rows).length}</button>`).join("");
  $("sfilt").querySelectorAll("button").forEach(bt => bt.onclick = () => {
    S.sfilt = bt.dataset.f; const nl = studyList(null, rows);
    if (nl.length && !nl.includes(S.cur)) S.cur = nl.find(i => i > S.cur) ?? nl[0];
    save(); renderStudy();
  });
  $("doneb").className = S.reviewed[r.id] ? "on" : "";
  $("doneb").textContent = S.reviewed[r.id] ? "✓ 복습 완료" : "복습 완료";
  renderLeft(x, renderStudy);
  const R = $("right"), dl = sec.d || {};
  R.scrollTop = 0;
  R.innerHTML = `<div class="sh"><b class="${r.ok ? "okc" : "warn"}">${r.ok ? "정답" : r.sel ? "오답" : "미응답"}</b><span class="mut">내 답 ${r.sel || "-"} · 정답 ${r.ans} · ${fmt(r.time)}${r.flag ? " · ⚑ Flag" : ""}</span><span class="tag">${esc(r.los)}</span><span class="tag">Tier ${r.tier}</span></div>
    <div class="mut" style="font-size:13px">Question ${x.no}</div><div class="stem">${q.stem}</div>` +
    Object.keys(q.options).map(k => `<div class="opt ${k === r.ans ? "right" : (k === r.sel ? "wrong" : "")}"><span class="l">${k}</span><span class="t">${q.options[k]}${k !== r.ans && dl[k] ? `<div class="why">${esc(dl[k])}</div>` : ""}</span>${k === r.sel ? "<span class='tag'>내 답</span>" : ""}${k === r.ans ? "<span class='tag'>정답</span>" : ""}</div>`).join("") +
    `${noteHTML(sec)}<details class="raw"><summary>원문 해설 (출처 포함)</summary><div class="expl">${esc(sec.e)}</div></details>
    <details class="raw"><summary>문항 이의</summary><textarea class="dsp" data-id="${r.id}" rows="2" placeholder="결함이 의심되는 이유…">${esc(S.dispute[r.id] || "")}</textarea></details>`;
  R.querySelectorAll(".dsp").forEach(t => t.onchange = () => { if (t.value.trim()) S.dispute[t.dataset.id] = t.value.trim(); else delete S.dispute[t.dataset.id]; save(); });
  typeset(R);
  const inl = new Set(l);
  let pv = null;
  $("nav").innerHTML = QL.map((y, i) => {
    if (!inView(y)) return "";
    const rr = rows[i], ss = !pv || pv.sess !== y.sess, first = ss || pv.si !== y.si; pv = y;
    return `${ss ? `<span class="sl">S${y.sess}</span>` : ""}<button class="nb ${rr.ok ? "nok" : "nno"}${i === S.cur ? " cur" : ""}${rr.flag ? " fl" : ""}${first && !ss ? " setstart" : ""}${inl.has(i) ? "" : " out"}${S.reviewed[rr.id] ? " rvd" : ""}" data-i="${i}" title="Set ${DATA.sets[y.si].set}">${y.no}</button>`;
  }).join("");
  $("nav").querySelectorAll("button").forEach(bt => bt.onclick = () => studyGo(+bt.dataset.i));
}

// ---------- grading ----------
function grade() {
  const sec = getSecret();
  const rows = QL.map((x, i) => {
    const q = x.q, id = q.id, sel = S.answers[id] || null, ans = sec[id].a, s = DATA.sets[x.si];

const pauseLine = () => `일시정지 ${S.pauseLog.length}회 · 총 ${fmt(pauseTotal())}`;

      <p class="mut">비공식 참고선 ~65–70% (CFA Institute는 합격선을 공개하지 않음). ${S.unlimited ? "<b class='warn'>※ 시간 무제한 모드로 응시</b>" : ""}${[1, 2].filter(k => S.rem[k] < 0 && rows.some(r => r.sess === k)).map(k => ` <b class='warn'>※ Session ${k} 시간 초과 +${fmt(-S.rem[k])}</b>`).join("")}</p>

}
// ---------- export / import ----------
function exportJSON() {
  save();
  // 정답은 제출한 세션 문항만 기록
  const rows = (S.sub[1] || S.sub[2]) ? grade() : null, answers = {};
  QL.forEach(x => { const id = x.q.id; if (S.answers[id] || S.time[id]) answers[id] = {selected: S.answers[id] || null, correct: rows && S.sub[x.sess] ? rows[byId[id]].ans : null, time: S.time[id] || 0}; });
  const answered = Object.keys(S.answers).length, correct = rows ? rows.filter(r => S.sub[r.sess] && r.ok).length : null;
  const ansSub = rows ? rows.filter(r => S.sub[r.sess] && r.sel).length : 0;
  const attempt = {exportedAt: new Date().toISOString(), exportedFrom: "cmock-" + MOCK + ".html", phase: S.phase,
    totalQuestions: QL.length, answered, correct, wrong: rows ? ansSub - correct : null,
    state: {answers, timeSpentSec: Math.round(Object.values(S.time).reduce((a, b) => a + b, 0)), flagged: S.flagged, struck: S.struck, dispute: S.dispute,
            phase: S.phase, submitted: S.sub, last: S.last, sview: S.sview, unlimited: S.unlimited, remaining: S.rem, cur: S.cur, startedAt: S.startedAt, finishedAt: S.finishedAt,
            paused: S.paused, pausedAt: S.pausedAt, pauseLog: S.pauseLog, pauseSummary: {count: S.pauseLog.length, totalSec: Math.round(pauseTotal())}}};
  const d = new Date(), date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const o = {subject: SUBJECT, date, latest: {phase: S.phase, totalQuestions: QL.length, answered, correct, wrong: attempt.wrong}, attempts: [attempt]};
  const blob = new Blob([JSON.stringify(o, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = SUBJECT + "_results_" + date + ".json";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return o;
}
function importJSON(txt, quiet) {
  try {
    let o = typeof txt === "string" ? JSON.parse(txt) : txt;
    if (o.subject === SUBJECT && Array.isArray(o.attempts) && o.attempts.length) o = o.attempts[o.attempts.length - 1];
    else if (o.subject !== "agent-mock-" + MOCK) { if (!quiet) alert("다른 회차의 파일입니다: " + o.subject); return; }
    const st = o.state, n = fresh();
    Object.keys(st.answers || {}).forEach(id => { if (byId[id] !== undefined && st.answers[id].selected) { n.answers[id] = st.answers[id].selected; } n.time[id] = st.answers[id].time || 0; });
    n.flagged = st.flagged || {}; n.struck = st.struck || {}; n.dispute = st.dispute || {};
    n.unlimited = !!st.unlimited; n.rem = st.remaining || n.rem; n.startedAt = st.startedAt || null; n.finishedAt = st.finishedAt || null;
    n.phase = st.phase || "s1"; n.cur = st.cur || 0;
    n.pauseLog = Array.isArray(st.pauseLog) ? st.pauseLog.map(e => Object.assign({}, e)) : [];
    n.sub = st.submitted; n.last = st.last || {}; n.sview = st.sview || 0;
    S = normalizeState(n); lastTick = Date.now();
    // 열려 있던 일시정지는 export 시각에서 닫고, 세션 중이면 지금부터 새 일시정지로 복원
    const open = S.pauseLog[S.pauseLog.length - 1];
    if (open && !open.end) closeOpenPause(Math.max(Date.parse(open.start), Date.parse(o.exportedAt) || 0));
    S.paused = false; S.pausedAt = null;
    if (inSession() || S.phase === "review1" || S.phase === "review2") { if (S.phase === "review1") S.phase = "s1"; if (S.phase === "review2") S.phase = "s2"; pauseExam("import"); }
    save(); render();
  } catch (e) { if (!quiet) alert("Import 실패: " + e.message); }
}
// GitHub의 results/Mock{N}/latest.json이 이 브라우저 저장본보다 최신이면 자동 복원
// 비교는 페이지를 열 때 다시 저장하기 전의 savedAt으로 한다(열자마자 save()가 savedAt을 지금으로 바꾸기 때문)
function loadRemote(localSavedAt) {
  if (!window.fetch) return;
  fetch("results/" + SUBJECT + "/latest.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(d => {

document.addEventListener("DOMContentLoaded", () => {

rnings to reinvest in property acquisitions. Therefore, Perpetua will most likely have a higher dividend payout ratio.\nC. greater flexibility to retain earnings. — Incorrect\nIncorrect because Perpetua is a REIT and thus must meet a number of requirements to qualify as a REIT. REITs are restricted to primarily owning and operating rental properties and are required to distribute 90-100% of their taxable earnings to investors to avoid paying corporate income tax. REITs have little retained earnings to invest in growth. REOCs are taxable corporations that operate and manage commercial real estate with few corporate-structure restrictions and no requirement to distribute their income. Hence, REOCs can retain their earnings to invest in growth and acquisition of new properties.", "ko": "REIT(Perpetua): tax-advantaged 구조. 조건으로 taxable income의 90–100%를 dividend로 지급해야 하고, 그 dividend를 소득에서 공제하므로 corporate income tax를 사실상 내지 않는다. 대신 retained earnings가 거의 없어 성장하려면 외부에서 equity·debt를 조달해야 한다. 사업도 rental property 보유·운영 중심으로 제한.\nREOC(Rainfall): 일반 taxable corporation. dividend 지급 의무가 없어 earnings를 retain해 property 취득·개발에 재투자할 수 있고 사업 제한도 적다. 대신 corporate tax를 낸다.\n→ REIT인 Perpetua는 higher dividend payout ratio, lower effective tax rate, less flexibility to retain earnings.", "trap": "지문의 '두 회사 모두 portfolio를 크게 키울 계획'은 REOC가 유리한 지점(retained earnings 활용)을 떠올리게 하는 장치다. REIT는 payout이 높아 retain이 어렵다.", "f": "", "why": {"A": "REIT는 dividend를 공제받아 corporate income tax가 사실상 면제된다 → effective tax rate가 더 낮다.", "C": "earnings를 retain할 유연성은 REOC 쪽이 크다. REIT는 90–100%를 dividend로 지급해야 한다."}, "orig": "Mock 6 Session 2 Q38", "conf": false}, {"id": "mock6-Q83", "src": "정답", "module": "AI", "tag": "FFO vs AFFO: dividend-paying capacity", "vig": 20, "stem": "Which of the following measures of income would best meet Friso's key objective in her analysis of Perpetua Properties?", "opts": {"A": "FFO", "B": "AFFO", "C": "Net income"}, "ans": "B", "en": "A. FFO — Incorrect\nIncorrect because FFO is not a measure of cash flow. It does not include investment and spending necessary to sustain cash flow growth or cash flow related to financing activities.\nB. AFFO — Correct\nCorrect because AFFO, also referred to as funds available for distribution or cash available for distribution, is a more accurate measure of current economic income than FFO or net income. AFFO is a more tangible, cash-focused measure of sustainable economic income that reduces reliance on non-cash accounting estimates and excludes non-economic, non-cash charges. AFFO considers the capital expenditures necessary to maintain the economic income of a property portfolio. AFFO is also more reflective of a REIT's dividend-paying ability than FFO.\nC. Net income — Incorrect\nIncorrect because net income is not a good measure of a REIT's dividend-paying capacity as it includes many non-cash charges and non-cash accounting estimates. It needs to be adjusted for non-cash charges to arrive to a more tangible, cash-focused measure of sustainable economic income.", "ko": "세 measure의 관계:\nnet income → (+ real estate depreciation & amortization, − gains on property sales, + losses) → FFO → (− non-cash rent[straight-line rent adjustment], − recurring maintenance-type capital expenditures와 leasing commissions) → AFFO.\n· net income: depreciation 같은 non-cash charge와 accounting estimate가 많이 섞여 있어 dividend-paying capacity를 잘 못 보여 준다.\n· FFO: depreciation은 되돌렸지만 property의 수익을 유지하는 데 필요한 capex를 빼지 않았다 → cash flow measure가 아니다.\n· AFFO(= funds/cash available for distribution): 유지에 필요한 capex까지 뺀 cash 중심의 sustainable economic income → dividend-paying capacity를 가장 잘 반영.\n목표가 'sustainable dividend-paying capacity' → AFFO.", "trap": "FFO가 더 널리 쓰이는 지표지만 'dividend-paying capacity'를 물으면 AFFO다.", "f": "FFO = NI + D&A − gains on sale (+ losses); AFFO = FFO − non-cash rent − maintenance capex & leasing costs", "why": {"A": "FFO는 portfolio를 유지하는 데 필요한 capital expenditures를 반영하지 않는다.", "C": "net income은 non-cash charges(depreciation 등)가 많아 dividend-paying capacity의 지표로 부적합."}, "orig": "Mock 6 Session 2 Q39", "conf": false}, {"id": "mock6-Q84", "src": "정답", "module": "AI", "tag": "REIT NAV per share", "vig": 20, "stem": "The NAV per share of Perpetua Properties is closest to:", "opts": {"A": "$16.00.", "B": "$20.70.", "C": "$33.20."}, "ans": "B", "en": "A. $16.00. — Incorrect\nIncorrect because it fails to add cash and equivalents and land held for development:\nAppraised value of operating properties\t$2,850 million\nMinus: Total debt\t$1,250 million\nNAV\t$1,600 million\nShares outstanding\t100 million\nNAVPS\t16.00\nB. $20.70. — Correct\nCorrect because net asset value per share (NAVPS) is calculated as follows:\nAppraised value of operating properties\t$2,850 million\nPlus: Cash and equivalents\t$120 million\nPlus: Land held for development\t$350 million\nMinus: Total debt\t$1,250 million\nNAV\t$2,070 million\nShares outstanding\t100 million\nNAVPS\t20.70\nC. $33.20. — Incorrect\nIncorrect because it fails to subtract total debt:\nAppraised value of operating properties\t$2,850 million\nPlus: Cash and equivalents\t$120 million\nPlus: Land held for development\t$350 million\nNAV\t$3,320 million\nShares outstanding\t100 million\nNAVPS\t33.20", "ko": "NAV = 자산의 market(appraised) value 합계 − liabilities.\n자산: operating properties 2,850 + cash and equivalents 120 + land held for development 350 = 3,320\nNAV = 3,320 − total debt 1,250 = 2,070 ($ millions)\nNAVPS = 2,070 / 100 million shares = $20.70.\n(operating properties 값이 주어지지 않으면 NOI / cap rate로 추정한다. 이 문제는 appraised value를 직접 주었다.)", "trap": "operating properties 외의 자산(cash, land held for development)을 더하고 debt를 빼는 두 단계를 모두 해야 한다.", "f": "NAVPS = (Value of operating real estate + cash + land & other assets − debt & other liabilities) / shares", "why": {"A": "(2,850 − 1,250) / 100 = 16.00: cash와 land held for development를 더하지 않았다.", "C": "3,320 / 100 = 33.20: total debt를 빼지 않았다."}, "orig": "Mock 6 Session 2 Q40", "conf": false}, {"id": "mock6-Q85", "src": "정답", "module": "ETH", "tag": "Standard III(A): client-directed brokerage와 proxy voting policy", "vig": 21, "stem": "Does Dines violate the Standards in the initial meeting with Kagan?", "opts": {"A": "No", "B": "Yes, regarding her proxy voting policy", "C": "Yes, regarding the broker for Kagan's account"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Dines has violated Standard III(A) Loyalty, Prudence, and Care by not acting in the best interest of the client.\nWhile Dines does not violate regarding her proxy voting policy, she violates the Standards by not informing the client that he may not be getting the best execution services by using his preferred brokerage. It is Dines' duty to make the client aware of this. By not doing so, she failed to comply with the Standards.\nB. Yes, regarding her proxy voting policy — Incorrect\nIncorrect because Dines did not violate the Standards regarding her proxy voting policy.\nAs per Standard III(A): Duties to Clients - Loyalty, Prudence, and Care, part of a member's duty of loyalty includes voting proxies in an informed and responsible manner, voting of proxies is an integral part of the management of investments. A cost–benefit analysis may show that voting all proxies may not benefit the client, so voting proxies may not be necessary in all instances. Members and candidates should disclose to clients their proxy voting policies. Dines has done all of this and hence complies with the Standards.\nC. Yes, regarding the broker for Kagan's account — Correct\nCorrect because Dines has violated Standard III(A) Loyalty, Prudence, and Care, which states that Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and Candidates must act for the benefit of their clients and place their clients’ interests before their employer’s or their own interests.\nKagan has a preferred brokerage which is clearly not the best execution option. In a directed brokerage situation, the investment manager should inform the client that they may not be getting the best execution possible, which Dines did not do.\n'Best execution' refers to a trading process that seeks to maximize the value of the client’s portfolio within the client’s stated investment objectives and constraints. In addition, the member or candidate should disclose to the client that the client may not be getting best execution from the directed brokerage.", "ko": "첫 미팅의 두 행동을 따로 본다.\n① broker: Kagan이 친구 소유의 broker를 쓰겠다고 했다(client-directed brokerage). brokerage는 client의 자산이므로 client의 지시를 따르는 것 자체는 허용된다. 하지만 Dines는 Prism의 preferred broker가 better execution을 준다는 것을 알면서 'without further discussion' 그냥 동의했다. directed brokerage에서는 client에게 best execution을 받지 못할 수 있다는 점을 disclose해야 한다 → 이를 하지 않아 Standard III(A) Loyalty, Prudence, and Care 위반.\n② proxy voting: 'cost-benefit analysis상 Kagan의 account에 이익이 되지 않는 proxy는 vote하지 않겠다'고 설명했다. 모든 proxy를 vote할 의무는 없고(cost–benefit analysis로 판단 가능), proxy voting policy를 client에게 disclose하면 된다 → Dines는 그렇게 했으므로 위반 아님.", "trap": "client 지시를 따랐으니 문제없다고 보면 틀린다. 따르되 '알리고' 따라야 한다. 반대로 proxy를 일부 vote하지 않는 정책은 disclose하면 허용된다.", "f": "", "why": {"A": "better execution을 받지 못할 수 있음을 Kagan에게 알리지 않고 그의 broker를 쓴 것은 위반이다.", "B": "cost–benefit analysis에 따른 proxy voting policy를 client에게 설명했으므로 Standards에 부합한다."}, "orig": "Mock 6 Session 2 Q41", "conf": true}, {"id": "mock6-Q86", "src": "정답", "module": "ETH", "tag": "Standard III(B) Fair Dealing: premium service와 추천 변경 고지", "vig": 21, "stem": "Does Dines violate the Standards in her actions related to Cromwell?", "opts": {"A": "No", "B": "Yes, because of her actions related to the buy order for Kagan's account", "C": "Yes, because of her actions related to setting up calls with the senior analyst"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because Dines violated Standard III(B) Fair Dealing.\nWhile she is not required to treat all clients equally, she did not violate Standard III(B) by setting up calls only for her premium clients because they pay an extra fee for this service. Dines acted correctly by waiting until after the report was published to set up the detailed discussions with the senior analyst who authored the report.\nHowever, Dines did violate the Standards when she did not inform Kagan regarding the changed recommendation for Cromwell when he placed a buy order. To be compliant with the Standards, Dines should have informed Kagan regarding this change before executing the buy order.\nB. Yes, because of her actions related to the buy order for Kagan's account — Correct\nCorrect because as per Standard III(B): Duties to Clients: Fair Dealing, it is recommended that if clients place orders contrary to a current recommendation, they should be advised of the changed recommendation before the order is accepted.\nIn this instance, Dines assumes that because Kagan is an expert in the cybersecurity sector he may have decided to initiate a position in the security. However, as per the Standards, it is advised that when a client places an order contrary to a current recommendation, they should be advised of the changed recommendation before the order is accepted. Because Prism recently changed its rating on the stock to a sell, Kagan should be informed as such before his buy order is executed by Dines. By failing to do so, Dines violated the Standards.\nC. Yes, because of her actions related to setting up calls with the senior analyst — Incorrect\nIncorrect because Dines is not obligated to offer premium services to all clients and is not permitted to provide advance information to any clients.\nStandard III(B) Fair Dealing states that members must deal fairly and objectively with all clients when making investment recommendations, which does not mean equally. Dines is allowed to set up calls for her premium clients as they pay an extra fee for the service, which Kagan does not. She waited until after the report was published to set up the detailed discussions with the senior analyst who authored the report. As long as she provides all clients with the same opportunity to act on the recommendation and does not provide any advance information, she is in compliance with the Standards.", "ko": "① premium clients만 senior analyst와 통화: fair dealing은 'equally'가 아니라 'fairly'다. 추가 비용을 내는 고객에게 더 높은 수준의 service를 주는 것은 허용된다. 조건은 (a) 그 service가 모든 client에게 제공 가능하도록 안내되어 있을 것(Dines는 Kagan에게 premium service를 설명했고 Kagan이 거절함), (b) 누구에게도 advance information을 주지 않을 것(통화는 report 'publication 이후'에 잡음) → 위반 아님.\n② Kagan의 buy order: Prism이 Cromwell을 sell로 바꾼 직후 Kagan이 매수를 요청했다. client가 현재 recommendation과 반대되는 주문을 내면, 주문을 받기 전에 바뀐 recommendation을 알려야 한다. Dines는 Kagan이 cybersecurity 전문가라는 이유로 알리지 않고 주문을 냈다 → Standard III(B) 위반. client의 전문성은 고지 의무를 없애지 않는다.", "trap": "차별처럼 보이는 premium call은 문제가 없고, 사소해 보이는 '말 안 하고 주문 실행'이 위반이다. discretionary account라도 client가 직접 낸 주문이 firm recommendation과 반대면 알려야 한다.", "f": "", "why": {"A": "sell로 바뀐 recommendation을 알리지 않고 Kagan의 buy order를 실행한 것은 위반이다.", "C": "premium clients는 추가 fee를 내고, 통화는 report 공개 후에 이뤄졌다. 다른 service level은 허용된다."}, "orig": "Mock 6 Session 2 Q42", "conf": false}, {"id": "mock6-Q87", "src": "정답", "module": "ETH", "tag": "Standard III(D) Performance Presentation: 표본 선택과 disclosure", "vig": 21, "stem": "Dines violates the Standards in her performance presentation for Kagan with regard to:", "opts": {"A": "the account sample only.", "B": "the disclosure of taxes and fees only.", "C": "both the account sample and the disclosure of taxes and fees."}, "ans": "A", "en": "A. the account sample only. — Correct\nCorrect because Dines violated Standard III(D): Performance Presentation which states that when communicating investment performance information, members must make reasonable efforts to ensure that it is fair, accurate, and complete.\nBy only presenting two deciles of client portfolios (top and bottom decile performing), the performance presentation represents an inaccurate and incomplete picture of the overall performance of the strategy. Instead, Standard III(D) recommends presenting a weighted average composite of the portfolios with a similar strategy. Using a single representative account is a violation of the Standard; in this case, two specific deciles of accounts are used to demonstrate performance, which is also not in compliance with the Standards.\nB. the disclosure of taxes and fees only. — Incorrect\nIncorrect because the disclosure is in compliance with Standard III(D): Performance Presentation as it fully explains the performance being reported.\nThe disclosure should fully explain the performance results being reported (for example clearly indicating when the performance record is that of a prior entity, or disclosing whether the performance is gross of fees, net of fees, or after tax). In this case, the disclosure correctly explains that the performance is gross of fees and before taxes, which is not a violation. Depending on each clients' fees and tax status, their net returns would have been different.\nC. both the account sample and the disclosure of taxes and fees. — Incorrect\nIncorrect because Dines violated Standard III(D): Performance Presentation by not presenting the performance of a weighted composite of similar portfolios, but instead using the performance of only two specific deciles (top and bottom) of client portfolios. She did not violate Standard III(D) with respect to the tax/fee disclosure though.", "ko": "Kagan은 같은 strategy로 운용되는 다른 account들과 비교한 성과를 물었다. Dines의 자료:\n① 표본: 같은 strategy의 Prism account 중 top decile과 bottom decile의 5년 return만 제시 → 전체 성과의 fair, accurate, complete한 그림이 아니다. Standard III(D)는 비슷한 strategy의 portfolio 전체를 묶은 weighted composite 제시를 권장한다. 일부 구간만 골라 보여 주는 것은 single representative account를 쓰는 것과 같은 문제 → 위반.\n② disclosure: 'before taxes, gross of fees'라고 명시 → 성과가 어떤 기준인지 충분히 설명한 것 → 위반 아님. gross-of-fees 제시 자체는 disclose하면 허용된다.\n→ account sample만 위반.", "trap": "gross of fees가 위반처럼 느껴질 수 있지만, 문제는 기준을 숨기는 것이지 gross로 보여 주는 것이 아니다. 최고·최저 decile을 '둘 다' 보여 줘 균형 잡힌 듯해도 전체(composite)가 아니므로 incomplete다.", "f": "", "why": {"B": "gross of fees·before taxes라는 disclosure는 적절하다. 위반은 표본 쪽이다.", "C": "disclosure는 위반이 아니다. top·bottom decile만 보여 준 표본 선택만 위반."}, "orig": "Mock 6 Session 2 Q43", "conf": false}, {"id": "mock6-Q88", "src": "정답", "module": "ETH", "tag": "Standard IV(B) Additional Compensation Arrangements: bonus와 yacht", "vig": 21, "stem": "Does Dines violate the Standards with respect to either Kagan's bonus offer or the use of his yacht?", "opts": {"A": "No", "B": "Yes, with respect to Kagan's bonus offer", "C": "Yes, with respect to the use of Kagan's yacht"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Dines violates Standard IV(B) Additional Compensation Arrangements by not disclosing the arrangement for the usage of yacht. This additional compensation arrangement, even though not monetary, can create a conflict of interest for Dines to favor Kagan over other clients.\nDines does not violate the Standards with respect to the profit share though, as she informs her employer and obtains their permission for the additional compensation.\nB. Yes, with respect to Kagan's bonus offer — Incorrect\nIncorrect because Dines does not violate Standard IV(B) Additional Compensation Arrangements by accepting the share of profits from the client.\nStandard IV(B) states that members should obtain written permission from their employer before accepting compensation or other benefits from third parties or clients for services rendered that might create a conflict with their employer’s interest. As long as the arrangement is disclosed and approved by the employer, it is in compliance with the Standards even if it is a direct share of client profits. Dines obtains the required permission and hence is not in violation of Standard IV(B).\nC. Yes, with respect to the use of Kagan's yacht — Correct\nCorrect because Dines has violated Standard IV(B) Additional Compensation Arrangements which states that members must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved.\nAlthough the use of Kagan's luxury yacht is not monetary compensation, it can create a conflict of interest for Dines to favor Kagan over other clients of Prism. It should therefore have been reported to her employer and their consent obtained before accepting the offer. By not informing her employer, Dines violates Standard IV(B). Even though the offer to use the yacht is not related to portfolio performance, it needs to be reported and approved by her employer.", "ko": "① bonus: Kagan이 annual return target 12%를 넘는 profit의 1%를 주겠다고 제안. client가 주는 성과 연동 보상은 employer와의 conflict of interest를 만들 수 있지만(다른 client보다 Kagan을 우대할 유인), Dines는 written permission을 받은 뒤 수락했다 → Standard IV(B) 충족, 위반 아님.\n② yacht: Kagan이 주말에 luxury yacht를 쓰게 해 주었고 Dines는 '성과 target과 관련이 없다'는 이유로 employer에게 알리지 않고 사용했다. 금전이 아니어도, 성과와 연동되지 않아도, client가 주는 benefit은 Kagan을 우대할 conflict of interest를 만들 수 있다 → employer에게 보고하고 written consent를 받아야 했다 → 위반.\n기준: client에게서 받는 compensation·gifts·benefits는 형태와 무관하게 employer에게 disclose하고 동의를 받는다.", "trap": "성과 연동 profit share가 더 문제처럼 보이지만 written permission을 받았으므로 괜찮다. 위반은 '보고하지 않은' yacht다. 비금전·비성과 연동이라는 것은 면책 사유가 아니다.", "f": "", "why": {"A": "yacht 사용을 employer에게 알리지 않은 것은 Standard IV(B) 위반이다.", "B": "bonus는 written permission을 받고 수락했으므로 위반이 아니다."}, "orig": "Mock 6 Session 2 Q44", "conf": false}], "vignettes": ["Pinku Singh is the chief financial officer (CFO) of Axiom, a publicly traded conglomerate that is split into three divisions. Singh wants to optimize the corporate and financing structure of the company and begins by determining which division has the lowest cost of capital based on the asset profiles presented in Exhibit 1.\nExhibit 1\n\tDivision A\tDivision B\tDivision C\nNature of assets\tMostly tangible\tMostly tangible\tMostly intangible\nFungibility of assets\tNon-fungible\tFungible\tNon-fungible\nSingh employs the build-up approach to estimate the specific-company risk premium (SCRP) for Axiom. The firm's cost of equity is 13.5%. Singh estimates the market equity risk premium to be 7.0%, the industry risk premium to be 0.0% and the size premium for Axiom to be 1.2%. The risk-free rate is 3.0% and Axiom has a beta of 1.5.\nSingh would like to take advantage of the under-leveraged balance sheet of Axiom while ensuring that the company's current shareholders retain control. Singh considers what corporate actions could achieve these objectives.\nDivision B generated an EBITDA of $10.8 million last year and is valued at 6.0x EV/EBITDA. Division B has two segments:\nA wholesale segment which contributed 20% to the division's EBITDA. Comparable wholesale retailers are valued at 7.0x EV/EBITDA.\nA consumer segment which contributed 80% to the division's EBITDA. Comparable consumer retailers are valued at 5.1x EV/EBITDA.\nSingh evaluates if spinning off Division B's wholesale segment would have a material impact on shareholder value, which she defines as a change in shareholder value of greater than 5%.", "Jules Clerc is an equity analyst at an asset management firm. Clerc is evaluating Lonza Credit Inc., a bank that prepares its financial statements under IFRS and has a 31 December year end. The bank is subject to the Basel III regulatory framework.\nLonza offers a defined benefit pension plan to its employees. To evaluate the pension plan, Clerc uses the data (in EUR millions) for the most recent year in Exhibit 1.\nExhibit 1\nBenefit obligations at beginning of year\t1,415\nBenefit obligations at end of year\t1,440\nFair value of plan assets at beginning of year\t1,470\nFair value of plan assets at end of year\t1,480\nBased on the data from Exhibit 1, Clerc calculates the pension plan's funded status for the most recent year as part of her valuation of Lonza.\nOn 1 January of the current year, Lonza granted 4 million stock options to employees. The options vest 3 years after the grant date and expire 6 years after the grant date. The fair value per option was EUR 1.8 on the grant date.\nLonza is planning to issue 5 million restricted stock units (RSUs) to its employees. The RSUs will vest two years after issuance. Clerc uses a profitability measure – free cash flow as a percentage of revenues – to analyze Lonza. He considers how this measure would be affected immediately after the issuance of the RSUs.\nClerc uses the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach to evaluate Lonza. Clerc gathers Lonza's liquidity ratios over the past two years in Exhibit 2.\nExhibit 2\n\tMost Recent Year\tPrior Year\nLiquidity Coverage Ratio\t95%\t110%\nNet Stable Funding Ratio\t95%\t90%", "Aaron Grap is an investment manager at a hedge fund. He is assessing a new absolute return trading strategy that combines ten different investment factors and is to be used by an equity market-neutral fund.\nGrap backtests the strategy using a model with the following parameters:\n• Investment universe: the TOP100 Index, which includes the 100 largest listed companies in the country;\n• Backtesting period: the past ten years;\n• Rebalancing frequency: monthly (simulated using rolling windows);\n• Formation of factor portfolios: for each factor, buy the top 20% of stocks and sell the bottom 20% of stocks ranked by the factor over the previous 12 months;\n• Weighting of factor portfolios: risk parity.\nThe TOP100 Index is updated regularly and, as a result, its composition has significantly changed over the 10-year backtesting period. Grap wants to ensure that survivorship bias is mitigated and compares three alternative methods to form factor portfolios in each rolling window:\n• Method A only uses the companies that were in the TOP100 Index at any given point in time t.\n• Method B only uses the companies that were in the TOP100 Index at the end of the 10-year period.\n• Method C only uses the companies that have been in the TOP100 Index for the entire 10-year period.\nBased on the backtesting analysis, Grap estimates that the absolute return trading strategy has a mean monthly return of 0.5% and a standard deviation of monthly returns of 7.1%. Grap assumes the statistical properties of the return distribution are constant over the year and calculates the annual 5% parametric VaR of the strategy, which is 1.65 standard deviations below the expected value.\nGrap performs a complementary risk analysis using a risk measure that can give him a better understanding of the downside risk of the absolute return trading strategy to be employed by the equity market-neutral fund. The strategy is benchmarked against cash.", "Julia Kassam is a portfolio manager who is reviewing public and private equity investments for her clients.\nErebor Limited\nKassam values a manufacturing company, Erebor, using the EV/EBIDTA ratio. The company's last reported EBIDTA is $90 million. Kassam collects relevant financial information (in $ millions) in Exhibit 1.\nExhibit 1\n\tDebt\tCommon Stock\tPreferred Stock\tCash and Cash Equivalents\nMarket Value\t880\t550\t210\t375\nBook Value\t630\t280\t270\t375\nBiotechnology Sector\nOne of Kassam’s clients wants to increase their exposure to growth stocks in the biotechnology sector. The sector currently has a median P/E ratio of 10.7 and is expected to grow at 7%. Kassam uses the PEG ratio to identify overvalued stocks from her list of three selected biotechnology stocks in Exhibit 2.\nExhibit 2\n\tPrice per Share\tEarnings per Share\tAnnual Growth Rate\nCompany A\t$49.75\t$5.42\t6.00%\nCompany B\t$12.63\t$1.71\t8.24%\nCompany C\t$31.28\t$2.93\t4.50%\nAltair Corp.\nKassam evaluates the stock of Altair, which is a recently listed, high growth, biotechnology company. She is considering a stable market-based multiple to value the stock and does not want to make any adjustments to the reported financial statements. After reviewing recent analyst reports, Kassam notices that Altair has internally generated brands that are not shown as intangible assets on Altair's balance sheet. Further, she notes that certain discretionary accounting decisions about expenses have led to an inaccurate representation of Altair's economic performance.\nBecq Inc.\nKassam values Becq, a small private company, using the excess earnings method. Relevant financial information is shown in Exhibit 3.\nExhibit 3\nFixed assets\t$725,000\nWorking capital\t$315,000\nLast reported earnings\t$191,290\nResidual income growth rate\t2.50%\nRequired return on fixed assets\t8.50%\nRequired return on working capital\t3.25%\nDiscount rate\t11.25%", "Sandra Plessinger is evaluating several bonds for the fixed-income portfolios she manages.\nShe first considers the following 2-year, default-free bonds with embedded options:\nBond A is a 5% annual pay coupon bond and is callable at par ($100) at the end of year 1.\nBond B is a 5% annual pay coupon bond and is putable at par ($100) at the end of year 1.\nTo analyze these bonds, Plessinger creates a binomial interest rate tree using the rates in Exhibit 1, assuming an interest rate volatility of 20%, with branching from each node to a high state and a low state occurring with equal probability. Plessinger also considers the effective convexity of Bond B.\n[IMAGE: CFA-IS-2022.11-FIIN-DeFusco+1_5010P1786423.png]\nYear zero: 2 point zero zero percent. Arrow upward to: Year 1: 6 point zero 9 percent. Arrow downward to Year 1, 4 point zero 8 percent. From the top box in year 1, arrow upward to Year 2: 7 point 3 2 percent. Arrow downward to 4 point 9 1 percent. From the bottom box, arrow upward to the Year 2, 4 point 9 1 percent box. Arrow downward to 3 point 2 9 percent.\nPlessinger next evaluates a 3-year maturity, callable investment-grade corporate bond. She computes an OAS of 51 bps using the same binomial interest rate tree in Exhibit 1. Plessinger considers the impact on the bond's OAS under a scenario where the bond's price is unchanged and interest rate volatility increases from 20% to 25%.\nFinally, still using the binomial interest rate tree in Exhibit 1, Plessinger analyzes a 3-year, default-free capped floating rate bond with a par value of $100. The bond pays an annual coupon equal to the 1-year reference rate, is set in arrears, and is capped at 5.0%.", "Sophia Chang is the head of alternative investments at a defined benefit pension plan. Chang is considering an investment in liquid alternatives and identifies two requirements the investment must meet:\nRequirement 1: Have a lower incentive fee than the industry average for traditional hedge funds\nRequirement 2: Allow more frequent redemptions than traditional hedge funds\nChang is also evaluating hedge funds as potential additions to the portfolio. She identifies the following strategies and considers their returns, leverage, and liquidity:\nStrategy 1: Multi-strategy funds\nStrategy 2: Fund of funds\nStrategy 3: Long/short equity funds\nChang identifies a skillful manager who deploys Strategy 3. She determines which of the following factors is likely the primary source of outperformance for this manager: market timing, stock selection, or use of leverage.\nThe pension plan has an objective to limit drawdowns. Chang considers what individual hedge fund strategy would best meet that objective when combined with the pension plan's stock and bond portfolio.", "Sebastian Moreno is an analyst at an asset management firm. He is analyzing the probabilities of default for bond issuers and the drivers of ROE for selected companies.\nMoreno is tasked with a new project that looks to classify bond issuers based on their probability of default within the next 12 months. He gathers a large sample of financial and accounting metrics for 1,000 issuers and observes that the issuers are not linearly separable. He compares non-linear support vector machine (SVM), unconstrained classification and regression tree (CART), and SVM with soft margin classification. He wants to use a machine-learning algorithm that addresses non-linear separability and is not prone to overfitting.\nMoreno also creates Model 1, a logistic regression model that uses two factors, profit margin (PROFIT) and leverage ratio (LEVER), to predict the probability of default. The binary dependent variable is 1 for companies that defaulted within the subsequent 12 months and 0 otherwise. Using the regression results in Exhibit 1, Moreno calculates the predicted probability of default for the average distressed company, which has PROFIT = –2.0 and LEVER = 3.0.\nExhibit 1\n\tCoefficient\nIntercept\t–1.7878\nPROFIT\t–0.0185\nLEVER\t0.3876\nTo analyze the drivers of ROE for software companies, Moreno collects fundamental data and compares two linear regression models. Model 2 uses profit margin (PROFIT) and interest coverage (COVER). Model 3 extends Model 2 by adding a third factor, the quick ratio (QUICK).\nModel 2: ROEi = b0 + b1PROFITi + b2COVERi + εi\nModel 3: ROEi = b0 + b1PROFITi + b2COVERi + b3QUICKi + εi\nMoreno compares the R-squared and adjusted R-squared measures of the two models. The regression results for Model 3 are given in Exhibit 2.\nExhibit 2\n\tCoefficient\tt-Statistic\tp-Value\nIntercept\t–1.4411\t–3.4888\t0.0000\nPROFIT\t0.4840\t49.5319\t0.0000\nCOVER\t0.7487\t27.9215\t0.0000\nQUICK\t0.0919\t1.9204\t0.0558\nFinally, Moreno wants to test if last-12-month sales (SALES) are a good predictor of ROE. He runs Model 4, which has the following specification:\nModel 4: ROEi = b0 + b1SALESi + εi\nA plot of the regression residuals against SALES is presented in Exhibit 3.\nExhibit 3\n[IMAGE: KL3.png]", "Terry McCormick is a US-equity analyst working for a large wealth management firm. He is currently working on DCF valuations of various publicly traded firms, which report under the US GAAP.\nFirm A\nMcCormick wants to identify the most appropriate approach to value Firm A, which consistently had positive FCFE during the past decade. Management is about to start an aggressive growth strategy primarily financed with debt. McCormick expects highly fluctuating amounts of net borrowing for the next three years. McCormick also expects annual earnings growth rate to fluctuate between 25% and 35% during the next three years before it gradually declines to long-run sustainable rate of 2%.\nFirm B\nMcCormick calculates FCFE for the most recent fiscal year and gathers the selected financial information in Exhibit 1 (in $ millions).\nExhibit 1\nCFO\t535\nInvestment in fixed capital\t110\nInterest expense\t70\nNet borrowing\t65\nTax rate\t30%\nFirm C\nMcCormick reviews his FCFE valuation model for Firm C. Firm C's management has just announced that they will issue new common stock during the next year. McCormick evaluates the potential effect of this change on next year's FCFE forecast.\nFirm D\nMcCormick estimates the intrinsic value of Firm E's common equity using the FCFF approach. McCormick calculates the present value of the firm's future FCFF as $800 million. McCormick estimates that $75 million of the firm's cash holdings is not necessary to generate operating cash flows. Current market values of the firm's debt and preferred stock are $250 million and $150 million respectively.", "Martin Chu is a portfolio manager for actively managed, long-only fixed-income accounts.\nChu examines the potential impact of GDP growth and inflation on the yields of default-free government bonds in Countries A, B, and C. Chu uses her forecasts in Exhibit 1 to identify the bond market with the largest expected increase in real yields.\nExhibit 1\nCountry\tForecast Change in Nominal GDP Growth Rate\tForecast Change in Inflation Rate\nA\t+50 bps\t+10 bps\nB\t+65 bps\t+30 bps\nC\t–40 bps\t+12 bps\nIn Country D, the YTM of zero-coupon, inflation-protected government bonds is 0.8% for the 1-year maturity and 1.0% for the 2-year maturity. In the same market, the YTM of a 2-year zero-coupon nominal government bond is 3.0%. Chu calculates the expected 2-year average inflation rate in Country D.\nChu reviews a diversified US bond portfolio, Portfolio A. His objective is to determine which of the following three sectors' spreads can be expected to narrow the most if the economy recovers from a business downturn.\nSector A: Investment grade consumer cyclical\nSector B: Speculative grade consumer cyclical\nSector C: Speculative grade consumer noncyclical\nFor Portfolio B, in addition to the long-only constraint, the client proposes adding a second constraint specifying maximum overweights and underweights of 10% relative to the portfolio's benchmark. Chu and the client discuss whether this policy change would impact the portfolio's optimal level of active risk.", "Theodore Silva, CFA, manages equity funds at Tritium Asset Management, which recently adopted the Standards. Silva is reviewing some of the firm's policies and procedures to determine if they are in compliance with the Standards.\nSilva has a referral arrangement with Sterling Group, a large brokerage and research firm. In return for referring institutional clients to Silva, Sterling Group is allowed to advertise at Tritium's annual equity conference without paying a fee. Silva does not disclose this arrangement to referred clients because he does not pay Sterling Group for any referrals. Silva directs trade execution to Sterling for the referred clients because Sterling is an approved broker that provides best execution. Silva does not use Sterling's research.\nSilva conducts due diligence on a mid-cap packaging company whose stock is actively traded. He determines the company's fundamentals are strong and buys its stock for one of the equity funds he manages. Silva provides commentary on the company's prospects in his monthly client newsletter. Silva has owned the company's stock in his personal portfolio for many years and has disclosed this in the fund's communications to clients. A few weeks after releasing the newsletter, Silva sells some of his personal position in the stock as part of rebalancing his personal portfolio. He earns a substantial profit from this sale.\nSilva plays golf with the chief financial officer (CFO) of a small fintech company, RizenPay. During the round of golf, the CFO tells Silva that the last few weeks have been very busy for him. He adds that the company is growing fast and doing well financially. The next day, Silva purchases the latest fintech report prepared by an industry expert. The report is not available publicly and can only be purchased for a fee. The report is well-researched and projects that RizenPay will take market share from its competitors. A day later, Silva buys RizenPay stock for his funds.\nTritium's recommended policy for record retention is to maintain records of investment actions and client communications in electronic format. Silva is accustomed to retaining all of his and his clients' relevant files in hard copy form. He does not store any of the records in electronic format. He saves his records for 5 years, after which they are destroyed. Local regulations require record retention for 5 years.", "Owen Murphy, CFA, is a sell-side analyst covering the technology industry for Crozet Investments, a financial advisory firm. He prepares a research report on Company A and gathers forecasts from multiple external data providers. Murphy combines this information with a quantitative model developed by Jane Jones while she was an analyst at Crozet. Jones is no longer with Crozet.\nSharon Gaskill, CFA, is the CEO of Company B, a small, publicly traded fintech firm. Crozet Investments has recently initiated coverage of Company B, and Murphy has been assigned as the analyst. In an effort to increase attention to Company B, Gaskill participates in several interviews with the local press and accepts speaking engagements at industry conferences. Investors who hear her enthusiasm are convinced that Company B offers promising growth, and they buy shares of it. The increased demand for the shares leads to an increase in Company B's share price.\nCrozet Investments is located in a city where many movies are filmed. Several famous actors are clients of James Bass, CFA, one of Crozet's financial advisors. At a family picnic, Bass describes the profile of his current clients as high-net-worth individuals in the movie business. One of the family members recalls a story about an actor who filed for bankruptcy. Bass confirms this actor is a former client.\nMurphy's supervisor manages a large research department and, as a result, is not able to personally evaluate the conduct of all the employees in the department. The supervisor hires a deputy manager to oversee several employees and ensures the deputy manager is properly trained. The supervisor establishes the following policies to assist with compliance:\nPolicy 1: A monetary incentive will be offered as a reward for ethical behavior.\nPolicy 2: The deputy manager will be responsible for evaluating the ethical conduct of department members.", "Alex Tay is an analyst researching Buttery Ranch International. Buttery is a Hong Kong SAR-based retail company reporting under IFRS. Buttery and its subsidiaries have fiscal years ending on 31 December. Buttery's functional and presentation currency is the USD.\nTay collects components of Buttery's net sales growth from various markets of the most recent year in Exhibit 1.\nExhibit 1\nMarket\tVolume Growth\tPrice Growth\tForeign Currency Exchange\nThailand\t5%\t0%\t4%\nMalaysia\t4%\t5%\t–4%\nHong Kong SAR\t–4%\t8%\t0%\nCreamy Meadows is a subsidiary of Buttery. Creamy began operations in Indonesia on 1 January of the most recent year and uses the Indonesian Rupiah (IDR) as its functional currency. Buttery uses the temporal method to translate Creamy's financial results. For the most recent year, Creamy had a net monetary liability and the IDR strengthened against the USD. Tay believes that the translation method may distort the financial and operating measures of the international subsidiary. To verify this, Tay compares Creamy's translated ratios to the ratios calculated under the local currency by using the exchange rates of the most recent year in Exhibit 2\nExhibit 2\nDate\tIDR per USD (Amount of IDR per 1 USD)\n1 January of the most recent year\t15,000\nAverage for the most recent year\t14,700\nWeighted average rate when inventory was purchased\t14,700\n31 December of the most recent year\t14,000\nFinally, Tay analyzes another subsidiary of Buttery, Dairy Barn. Dairy uses the local currency of its home market as its functional currency. Buttery used the current rate method to translate Dairy's financial statements in the most recent year. Dairy's home market has been experiencing high inflation and Tay expects it to be classified as a hyperinflationary economy beginning in the current year.", "Danny Aoun is an equity portfolio manager at Betterflow Investments. He is developing sentiment indicators for forecasting stock price movements. Aoun gathers textual data from the internet to build machine-learning models. He extracts raw content from a variety of online sources and then trains the models for sentiment prediction. Each text item is labelled as either positive sentiment or negative sentiment. Aoun is more concerned about the models producing false negatives than false positives. He computes selected performance metrics for three models using confusion matrices and presents the metrics in Exhibit 1.\nExhibit 1\nModel\tPrecision\tRecall\tF1 Score\tAccuracy\nX\t0.87\t0.94\t0.90\t0.88\nY\t0.93\t0.90\t0.91\t0.92\nZ\t0.96\t0.82\t0.88\t0.86\nAoun then applies his models to determine investor sentiment towards two semiconductor company stocks, Bytewave and Circuitcraft. He also attempts to predict their stock prices using historical data in a regression model.\nFor Bytewave, Aoun estimates a first-order autoregressive model (AR(1)) on the stock price. From the results, he concludes that the time-series model exhibits autoregressive conditional heteroskedasticity and has ARCH(1) errors.\nFor Circuitcraft, Aoun considers company fundamentals and predicts the growth in quarterly sales. He gathers quarterly sales data for the past 13 years and runs a regression using the first difference of quarterly sales growth in an AR(2) model. After reviewing the first-differenced time-series data, Aoun determines that the mean and the variance are constant over time. Aoun concludes that the time series does not have a unit root. Circuitcraft's historical quarterly sales growth for the most recent quarters has been as follows: Sales Growth50 = 18.9%, Sales Growth49 = 2.0%, and Sales Growth48 = –11.5%. The critical value for the t-statistic in this model is 2.0 at the 5% significance level. Exhibit 2 shows the results from this regression model.\nExhibit 2\nRegression Statistics\t\t\t\nR^2\t0.2951\t\t\nStandard error\t0.1270\t\t\nObservations\t50\t\t\nDurbin–Watson statistic\t2.2887\t\t\n\tCoefficient\tStandard Error\tt-Statistic\nIntercept\t0.0024\t0.0180\t0.1325\nSales Growtht–1 – Sales Growtht–2\t–0.2021\t0.1229\t–1.6443\nSales Growtht–2 – Sales Growtht–3\t–0.5272\t0.1215\t–4.3411\nAutocorrelations of the Residual\t\t\t\nLag\tAutocorrelation\tStandard Error\tt-Statistic\n1\t–0.1825\t0.1414\t–1.2907\n2\t–0.0716\t0.1414\t–0.5061\n3\t–0.2606\t0.1414\t–1.8424\n4\t0.0609\t0.1414\t0.4306", "Richard Smith is the chief economist at BMT Consulting and is conducting a training program devoted to economic growth. New analysts are organized into teams to analyze various issues regarding the topic. Each team is then required to provide a short presentation of the key points resulting from their discussions.\nSmith begins with a framework for explaining the percentage change in stock market value as the sum of three factors: the percentage change in GDP, the percentage change in the ratio of earnings to GDP, and the percentage change in the price-to-earnings multiple.\nSmith shows that the growth accounting equation decomposes the percentage change in output into components attributable to capital, labor, and technology. Team Blue is asked to calculate the economy's potential growth rate using the growth accounting method, based on the following information.\nGrowth rate of capital = 2.0%\nGrowth rate of labor = 0.5%\nGrowth rate of total factor productivity = 1.0%\nShare of capital in GDP = 30%\nTeam Green is asked to discuss how investment in physical capital, human capital, and technological development affects economic growth. As a summary of the discussion, Team Green presents a number of points including the following three:\nPoint 1: Since technology results in an upward shift in the production function, the relationship between economic growth and R&D spending is positive in the short run.\nPoint 2: Total factor productivity reflects the state of technology, and can be measured by the contribution of capital deepening plus the growth rates of labor productivity.\nPoint 3: Although long-term sustainable growth cannot rely on pure capital deepening, the impact of investment spending on available capital depends on the existing physical capital stock.\nSmith introduces three main paradigms with respect to per capita growth in an economy: the classical, neoclassical, and endogenous growth models. Comparing those models, Smith emphasizes that the factors that drive long-term economic growth are the subject of much debate. Team Yellow is asked to analyze the impact of the various parameters on the steady state in the neoclassical growth model. Team Yellow reports that the following factors permanently change the growth rate of output per worker.\nFactor 1: Growth rate of labor force\nFactor 2: Growth rate of total factor productivity\nTeam Purple is asked to investigate whether the per capita income of a developing country should converge toward that of developed countries over time. Team Purple reviews various determinants of per capital incomes: saving rate, population growth rate, the shape of production function, and the externalities associated with human capital. After a debate among team members, Team Purple concludes that the externalities associated with human capital is the most important determinant in predicting the occurrence of convergence.\nSmith presents the expected impact of removing trade barriers to economic growth. Referring to the neoclassical growth model, Smith concludes that opening up the economy should increase the rate at which countries' capital-to-labor ratios converge. Team Orange is asked to describe the dynamic adjustment process consistent with Smith’s conclusion. Team Orange provides the following descriptions:\nDescription 1: The growth in the capital-exporting countries will be above the steady state.\nDescription 2: Developed countries will tend to run trade deficits as they export capital.\nDescription 3: The rate of return on investments will be lower in countries with high capital-to-labor ratios.", "Li Guoqing is a fund manager who is reviewing four similar ETFs. He calculates the expected 1-year holding period cost for ETF 1 based on the information in Exhibit 1.\nExhibit 1\n\tETF 1\nAnnual management fee\t0.50%\nOne-way trading commission\t0.10%\nBid–ask spread on purchase and sale\t0.20%\nLi believes that the four ETFs share the same factor. He believes that there are arbitrage opportunities among the four ETFs, based on the data in Exhibit 2.\nExhibit 2\n\tETF 1\tETF 2\tETF 3\tETF 4\nExpected return\t2.60%\t3.00%\t3.50%\t4.00%\nFactor sensitivity\t0.6\t1.0\t1.6\t2.0\nUsing arbitrage pricing theory (APT), Li considers the following trading strategies to exploit the arbitrage opportunity:\nStrategy 1: Sell short $6 million of ETF 1 and $4 million of ETF 3; buy $10 million of ETF 2.\nStrategy 2: Sell short $6 million of ETF 2 and $4 million of ETF 4; buy $10 million of ETF 3.\nStrategy 3: Buy $4 million of ETF 2 and $6 million of ETF 4; sell short $10 million of ETF 3.\nLi uses a two-factor model to analyze the returns of one of the equity portfolios in his fund. He examines how fund returns, RP, are related to surprises in inflation, FINFL, and GDP growth, FGDP, as shown below:\nRP = aP + bP1FINFL + bP2FGDP + εP\nLi estimates the expected return of the portfolio to be 1.8% and uses an error term of 0.2%. The actual and expected values of inflation and GDP growth, as well as the estimated portfolio's sensitivities to these factors, are presented in Exhibit 3.\nExhibit 3\nVariable\tActual Value (%)\tPredicted Value (%)\tFactor Sensitivity\nInflation\t1.2\t0.8\t3.0\nGDP growth\t–3.5\t–4.0\t0.8", "Xiao Li is a private wealth manager who focuses on fixed income markets.\nHe is reviewing the term structure of interest rates for his domestic market. Li observes that lender and borrower preferences strongly influence yield curve shape, especially for longer-term maturities. For example, Li has detected that the curve has a persistent dip at the 10-year maturity, and that investors in 10-year bonds are not willing to shift to 8- or 12-year bonds even when yields in those maturities are relatively high.\nLi reviews Exhibit 1, which contains current shorter-term government bond spot rates.\nExhibit 1\nMaturity\tSpot Rate\n1-year\t2.02%\n2-year\t2.20%\n3-year\t2.38%\n4-year\t2.52%\n5-year\t2.64%\nUsing the spot curve, Li computes forward rates. He then forecasts that in three years the 2-year spot rate will equal 2.20%, the current 2-year spot rate, but that the remainder of the spot rate curve will be consistent with current forward rates. Li evaluates what his forecast implies about the valuation of a 5-year zero-coupon bond today.\nLi is assisting Client A to select an appropriate investment strategy, who has a 2-year investment horizon. The client expects the yield curve to remain unchanged over the 2-year horizon. Li recommends implementing a ride the yield curve strategy using government bonds for Client A.\nLi studies the characteristics and effects of yield curve volatility. He uses the 3.25% monthly standard deviation of the 15-year government-bond yield to estimate an annual yield volatility of 11.26%. Li also calculates key rate durations for various maturities. He concludes that the higher key rate durations associated with longer-term rates leads to higher long-term annualized term structure volatility.", "Carol McAndrew, an equity analyst, specializes in evaluating manufacturing companies. McAndrew is currently evaluating Acme Industries, a large, diversified manufacturing company that reports under IFRS.\nDuring a recent conference call, Acme management disclosed its intent to raise EUR 40 million to fund new investments by borrowing against Acme's EUR 50 million of receivables. Management indicated that it is evaluating two different options to accomplish this objective:\nOption 1: Borrow directly against the receivables of EUR 50 million;\nOption 2: Create a special purpose entity (SPE), invest EUR 10 million in the SPE, have the SPE borrow EUR 40 million, and then use the funds to purchase EUR 50 million of receivables from Acme.\nMcAndrew considers the potential impact of these options on Acme's consolidated debt-to-assets ratio, assuming that Acme will be able to influence the financial and operating policy of the SPE, and will be expected to absorb any losses that the SPE may incur.\nNext, McAndrew examines whether there are any accounting warning signs related to the overstatement of Acme's net income. After reviewing Acme's financial reports and industry data for the most recent year, McAndrew makes the following observations:\nObservation 1: Receivables growth is lower than revenue growth.\nObservation 2: Management compensation is largely tied to financial results.\nObservation 3: Depreciable lives of Acme's fixed assets are shorter than those of industry peers.\nMcAndrew also reviews Acme's Beneish M-scores and Altman Z-scores for the past three years and notes that both scores have steadily declined during this time.\nFinally, after making any necessary adjustments, McAndrew uses the following data (in EUR millions) to compute Acme's cash-flow-based accruals ratio for the most recent year:\nNet income: 7,050\nOperating cash flow: 9,826\nInvesting cash flow: –8,410\nFinancing cash flow: 5,390\nAverage net operating assets: 45,894", "Ulu Bala, an analyst for ValEwe Consulting, has been hired to provide valuations for several firm clients.\nFirm A is a rapidly growing automotive parts distributor that has asked Bala to provide an estimated fair value of its common stock. Bala selects the appropriate valuation model based on the following information about Firm A:\nThe firm's dividend payout ratio has been stable over the last 10 years and is expected to remain stable, regardless of future profitability.\nPlanned expansion into new markets will require significant annual capital expenditures, which will result in dividends exceeding free cash flow to equity.\nCompared with peers, the firm has an aggressive policy with respect to reported earnings, as well as a lower quality of accounting disclosure.\nFirm B is a regional utilities provider. Firm B’s current stock price is $19.00 and Bala uses the dividend discount model to value the stock. In Exhibit 1, Bala forecasts Firm B’s earnings for the next three years. He assumes a required return on equity of 8% and a 60% retention ratio. By the end of Year 3, Bala expects Firm B’s stock price to be $21.50. ValEwe's approach is to consider a stock to be fairly valued if its price is within 2% of its estimated fair value.\nExhibit 1\n\tYear 1\tYear 2\tYear 3\nForecasted EPS\t$1.27\t$1.62\t$1.91\nFirm C is a power generation company. Bala forecasts that Firm C's earnings will grow by 8% per year and the cost of equity will remain at 11% for the foreseeable future. Using the DuPont model and the information in Exhibit 2, Bala estimates Firm C's sustainable growth rate.\nExhibit 2\nLast year’s EPS\t$3.20\nDividend payout ratio\t45.0%\nNet profit margin\t11.5%\nTotal assets/equity\t2.25\nTotal asset turnover\t0.65\nBala then values Firm C's stock using the Gordon growth model. He evaluates the sensitivity of the stock price from the model under a scenario where both the forecasted cost of equity and the earnings growth rate increase by 50 bps.", "Cathryn Kehoe is the senior credit analyst for the State Teachers' Pension Fund. She is conducting credit analysis of an ABS held in the fund's portfolio. The ABS is backed by a large number of short-term credit card receivables that are homogeneous. Each receivable is small relative to the total value of the pool.\nKehoe proposes purchasing a 3-year corporate bond issued by Valisker, Inc. The YTM on the Valisker bond is 2.60%. The bond has a credit rating of AA and a modified duration of 2.82. The relevant portion of a 1-year corporate transition matrix, along with corresponding credit spreads, is presented in Exhibit 1. In the matrix, for example, the probability of an AAA-rated bond becoming an A-rated bond at the end of the year is 1.2%.\nExhibit 1\nFrom/To (Entries are in %)\tAAA\tAA\tA\tBBB\tBB\nAAA\t90.0\t8.6\t1.2\t0.2\t0.0\nAA\t2.0\t88.0\t8.0\t1.4\t0.6\nA\t0.1\t1.5\t87.5\t7.5\t1.0\nBBB\t0.0\t0.5\t4.5\t85.0\t7.0\nBB\t0.0\t0.0\t0.2\t7.7\t80.0\nCredit spread\t0.65%\t0.95%\t1.20%\t1.80%\t3.60%\nThe fund owns $5 million of a 7-year senior unsecured bond issued by Gonk Industries. Kehoe recommends the fund buy $5 million of credit protection on Gonk using a 5-year CDS. The CDS has a 5-year senior unsecured bond as its reference obligation. Summary data for the CDS are presented in Exhibit 2.\nExhibit 2\nCredit spread\t4.0%\nDuration\t4.5 years\nCoupon rate\t5.0%\nTwo months later, a major accounting scandal is uncovered at Gonk and the firm quickly files for bankruptcy. Gonk has three series of bonds outstanding:\n3-year subordinated unsecured bonds trading at 20% of par value\n5-year senior unsecured bonds trading at 40% of par value\n7-year senior unsecured bonds trading at 30% of par value", "Ondrej Knizek is a portfolio manager at a European asset management firm. His portfolio includes fixed income and currency derivatives.\nKnizek believes that the market is underestimating the potential for interest rate hikes in Hungary. He is considering buying a 2-year European-style call option on the periodically compounded one-year Hungarian forint (HUF) spot interest rate. He uses the binomial model to calculate the value of the desired call option position. Exhibit 1 shows the 1-year discount factor and the fair value of the options for the respective up and down moves at Time Step 1 (c^(+)and c^(-)), assuming a risk-neutral probability of 50%.\nExhibit 1\nc^(+) fair value (in HUF)\t4,152,800\nc^(-) fair value (in HUF)\t214,800\n1-year discount factor\t0.99108\nKnizek holds US Treasuries which mature in one month. He wants to use a forward rate agreement (FRA) to lock in the 6-month US interest rate at the time the bonds mature. Knizek refers to the US annualized reference interest rates in Exhibit 2 to calculate the no-arbitrage fixed rate of the FRA.\nExhibit 2\n1-month rate\t0.60%\n6-month rate\t0.81%\n7-month rate\t0.87%\nNext Knizek observes an arbitrage opportunity in a Polish government bond. He determines that the bond's 6-month forward price is currently below its fair value. For the first step of the arbitrage trade, he establishes a forward position on the government bonds by purchasing 100 bond forward contracts at a price of 109.30 (percentage of par). Each contract has a notional value of 100,000 Polish zloty (PLN).\nThree months later, Knizek calculates the fair value of the forward position. The current forward contract bid price is 108.15 and the annualized three-month interest rate is 0.65%.", "Martina Friso is a portfolio manager at a pension fund. The fund currently invests in domestic equities and bonds. Friso considers adding real estate to the fund's portfolio.\nFriso uses mean–variance optimization to determine the appropriate portfolio allocation to real estate. She considers using either a transaction-based or an appraisal-based real estate index to assess the volatility of real estate returns, the estimation of the Sharpe ratio, and the correlation of returns with the existing portfolio. After considering both index types, Friso chooses the appraisal-based index.\nFriso compares two publicly traded real estate companies operating in the retail sector, Perpetua Properties, a REIT, and Rainfall Real Estate, a real estate operating company (REOC). Both companies manage portfolios of retail shopping centers and plan to significantly grow their property portfolios by acquiring undervalued assets.\nThe key objective of Friso's analysis of Perpetua Properties is to evaluate its sustainable dividend-paying capacity. She considers the following measures of income: FFO, adjusted FFO (AFFO), and net income.\nFinally, Friso assesses Perpetua Properties' NAV per share based on the data (in $ millions) in Exhibit 1. Perpetua Properties has 100 million shares outstanding.\nExhibit 1\nAppraised value of operating properties\t2,850\nCash and equivalents\t120\nLand held for development\t350\nTotal debt\t1,250", "Mary Dines, CFA, is a senior portfolio manager at Prism Wealth Management, a private wealth management firm. Dines was recently hired by Jerry Kagan, a successful software entrepreneur, to manage his investment portfolio on a discretionary basis.\nDuring their initial meeting to set up Kagan's account, Dines proposes using Prism's preferred broker to execute trades. Kagan informs Dines that he wishes to trade through another broker that is owned by a friend. Although Dines knows that Prism's preferred broker would provide better execution, without further discussion she agrees to follow Kagan's wishes and use his broker. Additionally, Dines explains that she will not vote any proxies that would not benefit Kagan's account based on a cost-benefit analysis.\nAt a subsequent meeting, Dines informs Kagan of the premium services offered by her firm at an additional cost, which include direct access to senior research professionals. Kagan decides not to purchase the premium services. A few days later Prism publishes a report changing its recommendation on Cromwell Inc., a cybersecurity company, to a sell. Shortly after publication Dines sets up calls for her premium clients to have detailed discussions with the senior analyst who authored the report, but she does not set up such a call for Kagan. The next day, Kagan calls Dines and asks her to buy Cromwell shares for his account. Dines knows that Kagan is an expert in the cybersecurity sector from their previous interactions. She proceeds to place the order, without informing him of the firm's recent recommendation change.\nSeveral months later, Kagan meets with Dines to discuss how his account has performed relative to other accounts managed with the same strategy. Dines creates a performance presentation that shows the past five years of return data for the top and bottom deciles of all Prism accounts managed with the same strategy. The presentation also includes a disclosure stating that the performance is shown before taxes and gross of fees.\nKagan is pleased with the performance of his account and decides to offer Dines a bonus equal to 1% of any profits above the 12% annual return target. Dines obtains written permission to enter into this arrangement and then accepts the offer. Additionally, to begin their business relationship on a positive note Kagan offers Dines the use of his luxury yacht over the coming weekend. Dines uses the yacht but does not inform her employer as the offer is not related to the return target."], "modules": { <script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules, IMG = DATA.images || {};
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = DATA.meta.subject, KEY = SUBJECT+"_quiz_state_v1", EXPKEY = SUBJECT+"_quiz_exports_v1", CONFKEY = SUBJECT+"_confused_v1", UIKEY = SUBJECT+"_ui_v1", FLAGKEY = SUBJECT+"_flag_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
// 헷갈림: 원본 txt의 "헷갈림:" 번호가 기본값, 화면에서 켜고 끈 것은 CONF.ids에 덮어씀
var CONF = store.get(CONFKEY) || {ids:{}, at:""};
// 학습 화면(문제+정답+해설) 상태는 풀이 기록(S)과 따로 둔다
var UI = store.get(UIKEY) || {view:null};
// Flag: 중요하다고 표시한 문제(헷갈림과 별개). ids[id]=true
var FLAG = store.get(FLAGKEY) || {ids:{}, at:""};
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }
function saveUI(){ store.set(UIKEY,UI); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables + [IMAGE: 파일명]
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], im=/^\[IMAGE: (.+)\]$/.exec(l.trim());
    if(im){ flush(); if(IMG[im[1]]) html+='<p><img class="exh" src="'+IMG[im[1]]+'" alt="'+esc(im[1])+'"></p>'; continue; }
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]||m; }
function srcClass(s){ return s==="오답"?"src-wrong":"src-rel"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }
function isWrong(q){ return q.src==="오답"; }
function isConf(q){ var v=CONF.ids[q.id]; return v===undefined ? !!q.conf : !!v; }
function toggleConf(id){
  var q=BYID[id]; CONF.ids[id]=!isConf(q);
  if(CONF.ids[id]===!!q.conf) delete CONF.ids[id]; // 원래 값으로 돌아오면 덮어쓴 기록 삭제
  CONF.at=new Date().toISOString(); store.set(CONFKEY,CONF);
}
function isFlag(q){ return !!FLAG.ids[q.id]; }
function toggleFlag(id){
  if(FLAG.ids[id]) delete FLAG.ids[id]; else FLAG.ids[id]=true;
  FLAG.at=new Date().toISOString(); store.set(FLAGKEY,FLAG);
}
function flagBtn(q){ return '<button class="btn flag'+(isFlag(q)?' on':'')+'" id="bFlag" title="중요 문제로 Flag 표시/해제 (F 키)">'+(isFlag(q)?'🚩 Flag':'⚑ Flag')+'</button>'; }
function confBtn(q){ return '<button class="btn conf'+(isConf(q)?' on':'')+'" id="bConf" title="헷갈린 문제로 표시/해제">'+(isConf(q)?'★ 헷갈림':'☆ 헷갈림')+'</button>'; }
function metaHtml(q, no, showMy){
  return '<div class="meta"><span class="qno">'+no+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+(showMy && q.my ? ' · 내 답 '+esc(q.my) : '')+'</span>'+
    (isConf(q)?'<span class="pill src-var">헷갈림</span>':'')+(isFlag(q)?'<span class="pill src-flag">🚩 Flag</span>':'')+'<span class="tagline">'+esc(q.tag)+'</span><span style="flex:1"></span>'+flagBtn(q)+confBtn(q)+'</div>';
}
// 범위: wrong = 오답만, wc = 오답+헷갈림, all = 전체
var FILT = {wrong:"오답만", wc:"오답+헷갈림", flag:"🚩 Flag만", all:"전체"};
function pick(f, m){
  return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (f==="all" || (f==="flag" ? isFlag(q) : (isWrong(q) || (f==="wc" && isConf(q))))); }).map(function(q){return q.id;});
}

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
var MODE = {all:"전체 풀기", list:"학습한 목록 풀기", wrong:"오답만 풀기", wc:"오답+헷갈림 풀기", review:"틀린 문제 다시 풀기", rwc:"틀린+헷갈림 다시 풀기", flag:"Flag만 풀기", rflag:"Flag 다시 풀기"};
function header(){
  if(UI.view==="study"){ var T=UI.study; $("nOk").textContent="-"; $("nBad").textContent="-"; $("pbar").style.width=((T.i+1)/T.ids.length*100)+"%"; $("ptxt").textContent=(T.i+1)+" / "+T.ids.length; $("pmode").textContent="해설 보며 학습 · "+T.label; return; }
  if(!S || !S.order){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=MODE[S.mode]||"";
}

/* ---------- setup screen ---------- */

  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';

   '<label>토픽 <select id="selMod">'+opts+'</select></label>'+
   '<div class="seg" id="segF">'+Object.keys(FILT).map(function(k){return '<button class="btn'+(k===f?' on':'')+'" data-f="'+k+'">'+FILT[k]+' <span id="n_'+k+'"></span></button>';}).join("")+'</div>'+
   '<p class="kbd">풀기: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 / 학습: ← → 이동 / F: Flag</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">풀기</button> <button class="btn" id="bStudy">해설 보며 학습</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function labels(){
    var m=$("selMod").value;
    Object.keys(FILT).forEach(function(k){ $("n_"+k).textContent="("+pick(k,m).length+")"; });
    var n=pick(f,m).length; $("bStart").textContent=FILT[f]+" 풀기 ("+n+")"; $("bStudy").textContent=FILT[f]+" 해설 보며 학습 ("+n+")";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(b){ b.onclick=function(){
    f=b.getAttribute("data-f"); UI.filt=f; saveUI();
    Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(x){ x.classList.toggle("on", x===b); }); labels(); }; });
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){
    var order=pick(f,$("selMod").value); if(!order.length){ alert("이 범위에는 문제가 없습니다."); return; }
    S=fresh(order,f); save(); render();
  };
  $("bStudy").onclick=function(){
    var m=$("selMod").value, ids=pick(f,m); if(!ids.length){ alert("이 범위에는 문제가 없습니다."); return; }

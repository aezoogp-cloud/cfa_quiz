<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 6 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.jump{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.jump select,.jump input{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:inherit}
.jump select{flex:1;min-width:0;max-width:100%}
.jump input{width:72px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.btn.flag{padding:3px 10px;font-size:13px}
.btn.flag.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.pill.src-flag{background:var(--bad-soft);color:var(--bad)}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
/* 지문 왼쪽 · 문제/해설 오른쪽 (cmock처럼) */
body.wide .wrap{max-width:1440px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
.split .card{margin-top:0}
.vpane{position:sticky;top:104px;max-height:calc(100vh - 116px);overflow:auto;background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:12px;padding:12px 18px 16px;font-size:14.5px}
.vpane .vhead{font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:4px}
.vpane p{margin:.5em 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.vpane{position:static;max-height:42vh}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Mock 6 오답 퀴즈<span>CFA Level II, CFA Institute 모의고사</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>

</div></header>

</main>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock6", "title": "Mock 6"}, "questions": [{"id": "mock6-Q1", "src": "정답", "module": "CI", "tag": "asset 특성과 cost of capital (tangible·fungible)", "vig": 0, "stem": "Based on their asset profiles, which of Axiom's divisions most likely has the lowest cost of capital?", "opts": {"A": "Division A", "B": "Division B", "C": "Division C"}, "ans": "B", "en": "A. Division A — Incorrect\nIncorrect because, while Division A's assets are mostly tangible, they are non-fungible. So, based only on the lower fungibility of assets, the cost of capital is expected to be relatively higher for Division A than for Division B.\nB. Division B — Correct\nCorrect because Division B's assets are mostly tangible. These assets are also fungible. In general, companies with primarily tangible assets are likely to be able to access debt capital at lower cost than companies with a high proportion of intangible assets because they have the ability to pledge these assets as collateral. Companies with primarily fungible, (i.e., interchangeable into other units of the same identity) and highly liquid assets, such as cash and marketable securities, are likely to have access to lower-cost capital than companies with mostly non-fungible, illiquid assets such as specialized property, plant, and equipment. So, based only on the tangible nature and higher fungibility of assets, the cost of capital is expected to be relatively lower for Division B than for Division A and Division C.\nC. Division C — Incorrect\nIncorrect because Division C's assets are mostly intangible. The assets are also non-fungible. So, based only on the intangible nature and lower fungibility of assets, the cost of capital is expected to be relatively higher for Division C than for Division A and Division B.", "ko": "cost of capital은 자산을 collateral로 쓸 수 있을수록 낮아진다. 기준 두 개만 보면 된다.\n① tangible vs intangible: tangible assets는 collateral로 pledge할 수 있어 debt를 싸게 조달 → cost of capital ↓.\n② fungible vs non-fungible: fungible(같은 종류끼리 바꿔 쓸 수 있고 liquid한 자산, 예: cash, marketable securities)일수록 collateral 가치가 확실 → cost of capital ↓. non-fungible(specialized PP&E 등)은 illiquid라 ↑.\nDivision B = tangible + fungible → 두 기준 모두 유리 → lowest cost of capital.\nDivision A = tangible이지만 non-fungible, Division C = intangible + non-fungible(가장 높음).", "trap": "Division A도 'mostly tangible'이라 헷갈리지만 non-fungible이라 B보다 불리하다. 두 기준을 모두 봐야 한다.", "f": "", "why": {"A": "tangible이지만 non-fungible → B보다 cost of capital이 높다.", "C": "intangible + non-fungible → collateral 가치가 가장 낮아 cost of capital이 가장 높다."}, "orig": "Mock 6 Session 1 Q1", "conf": false}, {"id": "mock6-Q2", "src": "정답", "module": "CI", "tag": "build-up approach로 specific-company risk premium", "vig": 0, "stem": "Based on the build-up approach, the SCRP for Axiom is:", "opts": {"A": "2.3%.", "B": "3.0%.", "C": "3.5%."}, "ans": "A", "en": "A. 2.3%. — Correct\nCorrect because, as per the build-up approach,\nre = rf + ERP + SP + SRCP,\nwhere\nre is the cost of equity = 13.5%,\nrf is the risk-free rate = 3.0%,\nERP is the market equity risk premium = 7.0%,\nSP is the size premium = 1.2%,\nSCRP is the specific-company risk premium.\nSo, SCRP = re – (rf + ERP + SP) = 13.5% – (3.0% + 7.0% + 1.2%) = 2.3%.\nB. 3.0%. — Incorrect\nIncorrect because the SCRP using the build-up approach is wrongly calculated as:\nSCRP = re – Beta × ERP,\nwhere re is the cost of equity and ERP is the market equity risk premium.\nSo, SCRP = 13.5% – 1.5 × 7.0% = 3.0%.\nC. 3.5%. — Incorrect\nIncorrect because the build-up approach calculation is missing the size premium (SP) as per below:\nre = rf + ERP + SCRP,\nwhere re is the cost of equity, rf is the risk-free rate, and ERP is the market equity risk premium.\nSo, SCRP = re – (rf + ERP) = 13.5% – (3.0% + 7.0%) = 3.5%.", "ko": "build-up approach는 beta를 쓰지 않고 premium을 차례로 더한다.\nre = rf + ERP + size premium + industry premium + SCRP\n13.5% = 3.0% + 7.0% + 1.2% + 0.0% + SCRP\nSCRP = 13.5% − 11.2% = 2.3%.\n지문의 beta 1.5는 CAPM용 숫자라 build-up에서는 쓰지 않는다(distractor).", "trap": "beta 1.5가 주어져도 build-up approach에는 beta가 들어가지 않는다. size premium을 빼먹지 말 것.", "f": "re = rf + ERP + SP + IP + SCRP → SCRP = re − (rf + ERP + SP + IP)", "why": {"B": "13.5% − 1.5 × 7.0% = 3.0%: beta를 곱한 CAPM식 계산이고 rf·size premium도 빠졌다.", "C": "13.5% − (3.0% + 7.0%) = 3.5%: size premium 1.2%를 빼먹었다."}, "orig": "Mock 6 Session 1 Q2", "conf": true}, {"id": "mock6-Q3", "src": "오답", "module": "CI", "tag": "dividend recapitalization vs LBO vs reorganization", "vig": 0, "stem": "Which of the following corporate actions would best meet Singh's objectives?", "opts": {"A": "Reorganization", "B": "Leveraged buyout", "C": "Dividend recapitalization"}, "ans": "C", "en": "A. Reorganization — Incorrect\nIncorrect because, in a reorganization, a court-supervised restructuring process available in some jurisdictions for companies facing insolvency, a bankruptcy court assumes control of the company and oversees an orderly negotiation process between the company and its creditors for asset sales, conversion of debt to equity, refinancing, and so on. This is not the case for Axiom, rather it is under-leveraged and Singh’s objective is to increase debt for the firm to replace the more expensive equity.\nB. Leveraged buyout — Incorrect\nIncorrect because a special case of corporate restructuring is a leveraged buyout (LBO), a series of actions that include investment, divestment, and restructuring. In an LBO, an acquirer uses a significant amount of debt to finance the acquisition of a target and then pursues restructuring actions, with the goal of exiting the target with a sale or public listing. This is not the case for Axiom, as Singh’s objective is for the current shareholders to retain control. An LBO is an acquirer-led strategy, rather than an internal CFO-led strategy.\nC. Dividend recapitalization — Correct\nCorrect because, in a dividend recapitalization, the corporate issuer restructures the mix of debt and equity, typically from equity to debt through debt-financed dividends or share repurchases. The objective is to reduce the issuer’s weighted average cost of capital by replacing expensive equity with cheaper debt. Because this recapitalization reduces the number of outstanding shares and the value of the corporation does not change, these transactions can increase the value to shareholders. This is exactly the case for Axiom. In addition, in a dividend recapitalization, the shareholders' stakes are not diluted. Therefore, a dividend recapitalization should be the most suitable strategy to meet Singh’s objectives.", "ko": "Singh의 목표는 두 가지: ① under-leveraged balance sheet 활용(= debt를 늘려 비싼 equity를 대체, WACC ↓) ② 현재 shareholders가 control 유지.\ndividend recapitalization: 회사가 debt를 새로 발행해 그 돈으로 dividend 지급 또는 share repurchase → equity가 debt로 바뀜(leverage ↑). 새 주주가 들어오지 않아 기존 주주 지분이 dilute되지 않고 control이 그대로다 → 두 목표 모두 충족.\nLBO: 외부 acquirer가 큰 debt로 회사를 인수 → leverage는 늘지만 control이 acquirer에게 넘어간다.\nreorganization: insolvency에 처한 회사가 bankruptcy court 감독 아래 creditors와 협상하는 절차(asset sale, debt-to-equity conversion 등). Axiom은 부실이 아니라 오히려 debt가 너무 적은 회사다.", "trap": "reorganization은 일반적인 '구조 개편'이 아니라 court-supervised bankruptcy 절차를 뜻하는 용어다. 이름만 보고 고르면 틀린다.", "f": "", "why": {"A": "reorganization은 insolvency 회사의 court-supervised 절차다. Axiom은 under-leveraged라 해당 없음.", "B": "LBO는 acquirer가 주도해 control이 넘어간다 → '현재 shareholders가 control 유지' 조건에 어긋난다."}, "orig": "Mock 6 Session 1 Q3", "conf": true, "my": "A"}, {"id": "mock6-Q4", "src": "정답", "module": "CI", "tag": "spin-off와 sum-of-the-parts valuation", "vig": 0, "stem": "Based on Singh's analysis, spinning off the wholesale segment for Division B would lead to:", "opts": {"A": "a material decrease in shareholder wealth.", "B": "no material impact on shareholder wealth.", "C": "a material increase in shareholder wealth."}, "ans": "A", "en": "A. a material decrease in shareholder wealth. — Correct\nCorrect because multiplying the EBITDA of each segment of Division B with the relevant EV/EBITDA multiple of comparable independent companies and adding them provides a sum-of-the-parts EV/EBITDA of Division B post spin-off. Comparing this with the value of the combined Division B's EV/EBITDA tells us about the impact on shareholder wealth.\nCalculations (in millions for $ values):\nEV/EBITDAwholesale× EBITDA Contributionwholesale × EBITDADivision B = 7.0 × 20% × $10.8 = $15.120\nEV/EBITDAconsumer× EBITDA Contributionconsumer × EBITDADivision B = 5.1 × 80% × $10.8 = $44.064\nSum-of-the-parts EVwholesale+consumer = $15.120 + $44.064 = $59.184\nSingh's estimate of EV of Division B = EV/EBITDADivision B × EBITDADivision B = 6 × $10.8 = $64.800\nComparing the sum-of-the-parts EV to the EV of Division B = ($59.184 – $64.800) / $64.800 = –8.7%\nBased on this result, the market is assigning a positive value to synergies between the wholesale and consumer segments and there would be a material decrease of 8.7% in shareholder wealth post spin-off.\nB. no material impact on shareholder wealth. — Incorrect\nIncorrect because the calculation mistakenly takes an average of the comparable EV/EBITDA multiples.\nCalculations (in millions for $ values):\nAverage (EV/EBITDAwholesale and EV/EBITDAconsumer) = (7.0 + 5.1)/2 = 6.05\nSum-of-the-parts EVwholesale+consumer = 6.05 × $10.8 = $65.340\nSingh's estimate of EV of Division B = EV/EBITDADivision B × EBITDADivision B = 6 × $10.8 = $64.800\nComparing the sum-of-the-parts EV to the EV of Division B = ($65.340 – $64.800) / $64.800 = 0.8%\nBased on this result, the market is fairly valuing Division B and there would be no material impact (less than a 5% change) on shareholder wealth post spin-off.\nC. a material increase in shareholder wealth. — Incorrect\nIncorrect because the calculation mistakenly interchanges the comparable EV/EBITDA multiples.\nCalculations (in millions for $ values):\nEV/EBITDAB2C × EBITDA Contributionwholesale × EBITDADivision B = 5.1 × 20% × $10.8 = $11.016\nEV/EBITDAwholesale × EBITDA Contributionconsumer × EBITDADivision B = 7.0 × 80% × $10.8 = $60.480\nSum-of-the-parts EVwholesale+consumer = $11.016 + $60.480 = $71.496\nSingh's estimate of EV of Division B = EV/EBITDADivision B × EBITDADivision B = 6 × $10.8 = $64.800\nComparing the sum-of-the-parts EV to the EV of Division B = ($71.496 – $64.800) / $64.800 = 10.3%\nBased on this result, the market is applying a conglomerate discount to Division B and there would be a material increase of 10.3% in shareholder wealth post spin-off.", "ko": "spin-off 후 가치는 segment별 EBITDA × comparable EV/EBITDA의 합(sum-of-the-parts)이다. 이를 현재 Division B 가치와 비교한다. (단위 $ million)\nwholesale: 7.0 × (20% × 10.8) = 7.0 × 2.16 = 15.12\nconsumer: 5.1 × (80% × 10.8) = 5.1 × 8.64 = 44.064\nsum-of-the-parts EV = 59.184\n현재 EV = 6.0 × 10.8 = 64.8\n변화율 = (59.184 − 64.8) / 64.8 = −8.7% → 5% 기준을 넘는 material decrease.\n해석: 합쳐 있을 때 가치가 더 크다 = 시장이 두 segment 사이의 synergies에 가치를 주고 있다(conglomerate discount의 반대). 쪼개면 손해.", "trap": "multiple을 EBITDA 비중으로 가중해야 한다. 단순 평균(6.05x)을 쓰거나 두 multiple을 서로 바꿔 곱하면 결론이 반대로 나온다.", "f": "SOTP EV = Σ (segment EBITDA × comparable EV/EBITDA); 변화율 = (SOTP EV − 현재 EV) / 현재 EV", "why": {"B": "multiple을 단순 평균 (7.0 + 5.1)/2 = 6.05x로 쓰면 +0.8%가 나온다. EBITDA 비중(20/80)을 무시한 계산.", "C": "multiple을 서로 바꿔(5.1x를 wholesale, 7.0x를 consumer에) 곱하면 +10.3%가 나온다."}, "orig": "Mock 6 Session 1 Q4", "conf": true}, {"id": "mock6-Q5", "src": "정답", "module": "FSA", "tag": "defined benefit plan의 funded status", "vig": 1, "stem": "What is the funded status of Lonza's pension plan at the end of the most recent year?", "opts": {"A": "Underfunded by EUR 15 million", "B": "Overfunded by EUR 10 million", "C": "Overfunded by EUR 40 million"}, "ans": "C", "en": "A. Underfunded by EUR 15 million — Incorrect\nIncorrect because this is the change in the funded status of the pension plan from the beginning of year to the end of year.\nFunded status at the beginning of year = Fair value of plan assets at the beginning of year – Benefit obligations at the beginning of year = EUR 1,470 million – EUR 1,415 million = EUR 55 million\nFunded status at the end of the year = Fair value of plan assets at the end of year – Benefit obligations at the end of year = EUR 1,480 million – EUR 1,440 million = EUR 40 million\nChange in funded status of Plan A during the year = Funded status at the end of the year – Funded status at the beginning of year = EUR 40 million – EUR 55 million = – EUR 15 million.\nB. Overfunded by EUR 10 million — Incorrect\nIncorrect because this is the increase in the pension plan assets during the year.\nChange in the pension plan assets = Fair value of plan assets at the end of year – Fair value of plan assets at the beginning of year = EUR 1,480 million – EUR 1,470 million = EUR 10 million\nC. Overfunded by EUR 40 million — Correct\nCorrect because funded status of a defined benefit pension plan can be calculated as Funded status = Fair value of plan assets – Pension obligation\nFunded status at the end of the year = Fair value of plan assets at the end of year – Benefit obligations at the end of year = EUR 1,480 million – EUR 1,440 million = EUR 40 million.", "ko": "funded status = fair value of plan assets − pension obligation(PBO), 시점은 묻는 시점(year-end) 숫자를 쓴다.\nyear-end: 1,480 − 1,440 = +40 → assets가 더 많으므로 overfunded by EUR 40 million.\n참고: beginning funded status = 1,470 − 1,415 = +55. 1년 동안 15 줄었지만 여전히 overfunded다.", "trap": "funded status의 '변화'(−15)나 plan assets의 '변화'(+10)가 보기로 나온다. 묻는 것은 year-end의 level이다.", "f": "Funded status = FV of plan assets − Benefit obligation (양수 = overfunded, 음수 = underfunded)", "why": {"A": "−15는 funded status의 1년 변화(40 − 55)다. level이 아니고, 줄었다고 underfunded가 되는 것도 아니다.", "B": "+10은 plan assets의 증가분(1,480 − 1,470)일 뿐이다."}, "orig": "Mock 6 Session 1 Q5", "conf": true}, {"id": "mock6-Q6", "src": "정답", "module": "FSA", "tag": "stock options compensation expense (vesting period 배분)", "vig": 1, "stem": "For the current year, Lonza's compensation expense related to its stock options will be:", "opts": {"A": "EUR 1.2 million.", "B": "EUR 2.4 million.", "C": "EUR 7.2 million."}, "ans": "B", "en": "A. EUR 1.2 million. — Incorrect\nIncorrect because compensation expense is incorrectly calculated by dividing the fair value of the options granted by the term to expiry as follows:\nCompensation expense (incorrect) = (Number of options granted x Fair value of options at grant date) / Term to expiry= (4 million x EUR 1.8 per option) / 6 = EUR 7.2 million / 6 = EUR 1.2.\nB. EUR 2.4 million. — Correct\nCorrect because the amount of compensation expense that Lonza will recognize on its income statement in the most recent year is calculated as follows:\nCompensation expense = (Number of options granted x Fair value of options at grant date) / Number of years in vesting period = (4 million x EUR 1.8 per option) / 3 = EUR 7.2 million / 3 = EUR 2.4 million.\nC. EUR 7.2 million. — Incorrect\nIncorrect because compensation expense for the year just ended related to the stock options granted on 1 January of the year just ended is calculated without dividing the fair value of the options granted by the vesting period as follows:\nCompensation expense (incorrect) = (Number of options granted x Fair value of options at grant date) = 4 million x EUR 1.8 per option = EUR 7.2 million.", "ko": "stock option 비용은 grant date의 fair value를 고정해 두고 vesting period(= service period)에 걸쳐 straight-line으로 나눈다. expiry까지의 기간은 상관없다.\n총 fair value = 4 million × EUR 1.8 = EUR 7.2 million\nvesting period = 3년 → 연간 expense = 7.2 / 3 = EUR 2.4 million.", "trap": "나누는 기간은 expiry(6년)가 아니라 vesting period(3년)다.", "f": "연간 compensation expense = (옵션 수 × grant-date fair value) / vesting period(년)", "why": {"A": "7.2 / 6 = 1.2: term to expiry(6년)로 나눈 계산.", "C": "7.2 전액을 grant한 해에 한 번에 비용 처리한 계산. vesting period에 나눠야 한다."}, "orig": "Mock 6 Session 1 Q6", "conf": false}, {"id": "mock6-Q7", "src": "정답", "module": "FSA", "tag": "RSU 발행과 free cash flow / revenue", "vig": 1, "stem": "After the issuance of Lonza's RSUs, the profitability measure used by Clerc would:", "opts": {"A": "decrease.", "B": "remain the same.", "C": "increase."}, "ans": "B", "en": "A. decrease. — Incorrect\nIncorrect because the issuance of RSUs is a non-cash event that does not affect free cash flow nor revenues. The ratio of free cash flow to revenues would have decreased if the RSU were assumed to be a cash event.\nB. remain the same. — Correct\nCorrect because the issuance of RSUs has no effect on cash flows and has no impact on revenues. As a result, the ratio of free cash flows to revenues will be unchanged immediately after the RSU issuance.\nC. increase. — Incorrect\nIncorrect because both free cash flow and revenues are not affected by the RSU issuance.", "ko": "Clerc의 measure = free cash flow / revenues.\nRSU issuance는 non-cash event다. cash가 나가지 않으므로 free cash flow 불변, revenue와도 무관하므로 revenues 불변 → 비율 그대로.\n(share-based compensation expense는 net income을 줄이지만 non-cash라 CFO 계산 때 다시 더해진다. 그래서 cash flow 기준 measure는 영향이 없다. 분석할 때 이 점 때문에 FCF가 실제 경제적 비용보다 좋아 보일 수 있다는 것이 포인트.)", "trap": "'compensation이니 비용 → 수익성 하락'으로 생각하기 쉽다. 묻는 measure가 net income이 아니라 free cash flow 기준이다.", "f": "", "why": {"A": "RSU를 cash 지급으로 가정했을 때의 결과다. RSU는 non-cash라 FCF가 줄지 않는다.", "C": "FCF도 revenues도 변하지 않으므로 오를 이유가 없다."}, "orig": "Mock 6 Session 1 Q7", "conf": false}, {"id": "mock6-Q8", "src": "정답", "module": "FSA", "tag": "Basel III liquidity: LCR과 NSFR 해석", "vig": 1, "stem": "Based on Lonza's liquidity ratios at the end of the most recent year, which of the following is correct?", "opts": {"A": "Lonza's Net Stable Funding Ratio has deteriorated from the prior year", "B": "Lonza's required stable funding is higher than its available stable funding", "C": "Lonza can withstand cash outflows 5% higher than its 30-day liquidity needs in a stress scenario"}, "ans": "B", "en": "A. Lonza's Net Stable Funding Ratio has deteriorated from the prior year — Incorrect\nIncorrect because a higher Net Stable Funding ratio indicated improvement, i.e. it indicates that an institution has a higher amount of available net stable funding compared with required net stable funding. In Lonza's case, the ratio has increased from 90% to 95% and has therefore improved, not deteriorated.\nB. Lonza's required stable funding is higher than its available stable funding — Correct\nCorrect because the Net Stable Funding ratio is below 100%, which indicates that required stable funding is higher than available stable funding at the end of the most recent year. The Net Stable Funding Ratio is defined as the ratio of Available Stable Funding (numerator) over Required Stable Funding (denominator).\nC. Lonza can withstand cash outflows 5% higher than its 30-day liquidity needs in a stress scenario — Incorrect\nIncorrect because at the end of the most recent year, Lonza's Liquidity Coverage ratio is 95%, which indicates that it can only withstand cash flows that are 5% below (not above) its 30-day liquidity needs in a stress scenario.", "ko": "두 비율 모두 100% 이상이 기준이고 높을수록 좋다.\nNSFR = available stable funding / required stable funding. 95% < 100% → available < required, 즉 required stable funding이 더 크다 → B가 맞다. 다만 90% → 95%로 오른 것은 개선(improved)이다.\nLCR = highly liquid assets / expected 30-day cash outflows(stress scenario). 95% → 30일 stress outflows의 95%만 감당 가능, 즉 필요액보다 5% 부족하다. 110%였던 prior year에는 10% 여유가 있었다.", "trap": "NSFR은 '수준'(100% 미만 → 부족)과 '방향'(90% → 95% 개선)을 따로 봐야 한다. LCR 95%는 5% 초과가 아니라 5% 부족이다.", "f": "LCR = Highly liquid assets / Expected 30-day net cash outflows; NSFR = Available stable funding / Required stable funding", "why": {"A": "NSFR이 90% → 95%로 올랐으므로 deteriorated가 아니라 improved.", "C": "LCR 95%는 30-day liquidity needs보다 5% 모자란다는 뜻이다. 5% 더 견딜 수 있으려면 105%여야 한다."}, "orig": "Mock 6 Session 1 Q8", "conf": true}, {"id": "mock6-Q9", "src": "오답", "module": "PM", "tag": "backtesting: rolling window 절차와 risk parity의 두 번째 iteration", "vig": 2, "stem": "Which of the following will Grap's backtesting model require?", "opts": {"A": "Non-overlapping rolling windows", "B": "Two iterations of the rolling-window procedure", "C": "A 13-month in-sample period for each rolling window"}, "ans": "B", "en": "A. Non-overlapping rolling windows — Incorrect\nIncorrect because the rolling-window procedure will require overlapping rolling windows. Grap's backtesting model simulates monthly rebalancing using rolling windows in which portfolios are formed based on factor ranks over the previous 12 months. The process is repeated each month and the portfolio is rebalanced based on refreshed trailing 12-month data. This means that each rolling window has a 1-month out-of-sample-period and a 12-month in-sample period, 11 months of which overlap with the in-sample period of the previous rolling window.\nThis approach replicates the live investing process, because investment managers adjust their positions as new information arrives. For example, assume we backtest a value strategy by measuring its performance each month from December 2011 to May 2012. The process begins on 30 November 2011 by compiling every stock’s trailing 12-month earnings yield using EPS reported in the previous 12 months (i.e., from December 2010 to November 2011, the in-sample months) divided by stock prices as of 30 November 2011. We then execute the investment strategy—for example, buying stocks with high earnings yields and shorting stocks with low earnings yields—as of that date. Then, we record the investment results for the month of December (i.e., the out-of-sample, OOS, month). The process is repeated at the end of each subsequent month, by rebalancing the portfolio with refreshed trailing 12-month earnings yield data and measuring the results over the ensuing (OOS) month.\nB. Two iterations of the rolling-window procedure — Correct\nCorrect because Grap's backtesting model will require two iterations of the rolling-window procedure, one for each layer of the model: construction of factor portfolios and risk parity weighting.\nThe first iteration constructs the factor portfolios. To simulate rebalancing, analysts typically use rolling windows, in which a portfolio or strategy is constituted at the beginning of a period using data from a historical in-sample period, followed by testing on a subsequent, out-of-sample period.\nA second iteration is needed to calculate the risk parity weighting. A second rolling-window procedure over the same time span is required to avoid look-ahead bias. At each month end, the previous (10) years of monthly data are used to estimate the variance–covariance matrix for the (10) factor portfolios. This is the most important ingredient to form the risk parity portfolio. Once the covariance matrix is estimated, we can optimize and compute the weights (i.e., weights for equal risk contribution) for each of the (10) factor portfolios and then form the risk parity portfolio.\nC. A 13-month in-sample period for each rolling window — Incorrect\nIncorrect because Grap's backtesting will require a 12-month, not a 13-month, in-sample period for each rolling window. The backtesting simulates monthly rebalancing using rolling windows in which portfolios are formed based on factor ranks over the previous 12 months. The process is repeated each month and the portfolio is rebalanced based on refreshed trailing 12-month data. This means that each rolling window has a 1-month out-of-sample-period and a 12-month in-sample period.", "ko": "이 model은 층이 두 개다: ① factor마다 long/short factor portfolio 구성 ② 10개 factor portfolio를 risk parity로 weighting.\n→ rolling-window 절차도 두 번 필요하다.\n1st iteration: 매달 직전 12개월 factor rank로 top 20% buy / bottom 20% sell → 다음 1개월(out-of-sample) return 기록.\n2nd iteration: 매 month-end에 그 시점까지의 factor portfolio return으로 variance–covariance matrix를 추정해 equal risk contribution weights 계산. 전체 기간 covariance를 한 번에 쓰면 미래 정보를 쓰는 look-ahead bias가 생기므로 이것도 rolling으로 해야 한다.\nin-sample period는 지문 그대로 12개월(13개월 아님), out-of-sample은 1개월. 매달 한 달씩 밀리므로 연속한 window의 in-sample은 11개월이 겹친다 → overlapping.", "trap": "12개월 in-sample + 1개월 out-of-sample = 13개월로 더해서 C를 고르기 쉽다. in-sample period 자체는 12개월이다. weighting scheme(risk parity)에도 별도 rolling window가 필요하다는 점이 핵심.", "f": "", "why": {"A": "monthly rebalancing + trailing 12개월이므로 window끼리 11개월이 겹친다 → overlapping이다.", "C": "in-sample은 'previous 12 months' = 12개월이다. 13개월은 out-of-sample 1개월을 더한 window 전체 길이."}, "orig": "Mock 6 Session 1 Q9", "conf": true, "my": "C"}, {"id": "mock6-Q10", "src": "정답", "module": "PM", "tag": "survivorship bias와 point-in-time data", "vig": 2, "stem": "To mitigate survivorship bias, which method should Grap use when forming factor portfolios?", "opts": {"A": "Method A", "B": "Method B", "C": "Method C"}, "ans": "A", "en": "A. Method A — Correct\nCorrect because, to mitigate survivorship bias, Grap should use point-in-time data. The TOP100 Index is updated regularly, and in each rolling window Grap should form factor portfolios using only the companies that were in the TOP100 Index at that point in time. Survivorship bias refers to deriving conclusions from data that reflects only those entities that have survived to that date. The problem is that in the past, one could not know which companies would survive in the future, which companies would disappear, and which companies would be created and become successful enough to be added to the index. Although it is straightforward (but definitely not recommended) to backtest an investment strategy using only the survivors, tracking all companies that have ever existed in a correct point-in-time fashion (i.e., the casualties as well as the survivors) is strongly recommended.\nB. Method B — Incorrect\nIncorrect because a sample including only the companies that are in the TOP100 Index at the end of the period would result in survivorship bias. The problem is, however, that in the past, one could not know which companies would survive in the future, which companies would disappear, and which companies would be created and become successful enough to be added to the index.\nC. Method C — Incorrect\nIncorrect because including only those companies that have been in the TOP100 Index throughout the entire 10-year period would result in survivorship bias.\nAlthough it is straightforward (but definitely not recommended) to backtest an investment strategy using only the survivors, tracking all companies that have ever existed in a correct point-in-time fashion (i.e., the casualties as well as the survivors) is strongly recommended, especially as such data becomes more available from data vendors.", "ko": "survivorship bias = 끝까지 살아남은 종목만으로 backtest해서 성과가 부풀려지는 것. 과거 시점에는 어느 회사가 살아남고 어느 회사가 index에서 빠질지 알 수 없었다.\n해결책은 point-in-time data: 각 rolling window에서 '그 시점 t에 실제로 index에 있던' 종목만 쓴다(나중에 탈락한 종목 포함) → Method A.\nMethod B(기간 말 구성 종목)와 Method C(10년 내내 있던 종목)는 둘 다 결과를 알고 나서 생존 종목만 고르는 것이라 survivorship bias가 그대로다.", "trap": "Method C는 '일관된 표본'처럼 보이지만 10년간 한 번도 탈락하지 않은 종목만 남기므로 가장 강한 survivorship bias다.", "f": "", "why": {"B": "기간 말 구성 종목만 사용 = 살아남은 종목만 사용 → survivorship bias.", "C": "10년 내내 index에 있던 종목만 사용 → 탈락·신규 편입 종목이 모두 빠져 survivorship bias."}, "orig": "Mock 6 Session 1 Q10", "conf": false}, {"id": "mock6-Q11", "src": "정답", "module": "PM", "tag": "parametric VaR 연율화", "vig": 2, "stem": "The annual 5% parametric VaR of the absolute return trading strategy is closest to:", "opts": {"A": "11.2%.", "B": "34.6%.", "C": "38.8%."}, "ans": "B", "en": "A. 11.2%. — Incorrect\nIncorrect because this is the monthly (not annual) 5% parametric VaR, calculated as follows:\nMonthly parametric VaR: –[0.5% – 1.65 × 7.1%] = 11.2%\nB. 34.6%. — Correct\nCorrect because the annual 5% parametric VaR is calculated as follows: –[E(Rp) − 1.65 × σp], where E(Rp) is the expected return of the strategy and σp is its standard deviation.\nStep 1: Calculate the annualized expected return and standard deviation of return:\nE(Rp) = 12 × mean monthly return of 0.5% = 6.0%\nσp = √(12) × monthly standard deviation of 7.1% = 24.6%\nStep 2: Multiply the standard deviation by 1.65: 1.65 × 24.6% = 40.6%\nStep 3: Calculate VaR: –[E(Rp) − 1.65 × σp] = –[6.0% − 40.6%] = 34.6%\nC. 38.8%. — Incorrect\nIncorrect because this is the monthly parametric VaR which is incorrectly annualized by multiplying it by the square root of 12 as follows:\nCalculate monthly parametric VaR: –[0.5% – 1.65 × 7.1%] = 11.2%\nMultiply by the square root of 12: √(12) × 11.2% = 38.8%", "ko": "return과 standard deviation을 먼저 각각 연율화한 뒤 VaR를 계산한다. mean은 기간에 비례(× 12), standard deviation은 √기간에 비례(× √12).\nE(R) = 12 × 0.5% = 6.0%\nσ = √12 × 7.1% = 24.6%\n5% VaR = −[E(R) − 1.65σ] = −[6.0% − 1.65 × 24.6%] = −[6.0% − 40.6%] = 34.6%.", "trap": "monthly VaR(11.2%)에 √12를 곱하면 38.8%가 나오는데 틀린다. mean은 12배, σ는 √12배로 늘어나는 속도가 달라서 VaR 전체에 √12를 곱할 수 없다.", "f": "VaR = −[E(Rp) − z × σp]; E(R)annual = 12 × E(R)monthly; σannual = √12 × σmonthly", "why": {"A": "−[0.5% − 1.65 × 7.1%] = 11.2%는 monthly VaR. 문제는 annual을 묻는다.", "C": "monthly VaR 11.2% × √12 = 38.8%: mean까지 √12로 키운 잘못된 연율화."}, "orig": "Mock 6 Session 1 Q11", "conf": false}, {"id": "mock6-Q12", "src": "정답", "module": "PM", "tag": "market-neutral 전략의 downside risk: maximum drawdown", "vig": 2, "stem": "For his complementary risk analysis, which of the following risk measures should Grap use?", "opts": {"A": "Relative VaR", "B": "Surplus at risk", "C": "Maximum drawdown"}, "ans": "C", "en": "A. Relative VaR — Incorrect\nIncorrect because relative VaR (or ex ante tracking error) will not provide any additional information to Grap's risk analysis and will not provide a better understanding of downside risk. The trading strategy is an absolute return strategy benchmarked against cash, which means that its relative VaR is the same as its VaR, which Grap has already considered in his analysis.\nFor absolute return strategies, the benchmark is typically cash or a cash-like hurdle rate. When cash is the benchmark, VaR and ex ante tracking error will be effectively the same if measured using the same holding period and confidence interval. (Cash has no volatility, so adding a cash benchmark into a relative VaR calculation does not affect the calculation because its zero volatility cancels out its impact; thus, the resulting calculation is the same as the VaR of the portfolio.)\nB. Surplus at risk — Incorrect\nIncorrect because surplus at risk is a measure that is relevant for pension funds, not for asset managers (and specifically not for hedge funds as in this case). Surplus at risk is an application of VaR. It is computed by entering the assets in the portfolio into a VaR model as long positions and the pension liabilities as short fixed-income positions. The more volatile the investments in the pension fund and the less well correlated these assets are with the liabilities, the higher the surplus at risk.\nC. Maximum drawdown — Correct\nCorrect because Grap is evaluating an absolute return trading strategy for an equity market-neutral hedge fund, and maximum drawdown is a risk measure that is useful to understand downside risk in this case. For equity market-neutral strategies, any historical standard deviation or historical beta measures should be supplemented by a measure of what has been the maximum drawdown, often defined as the worst-returning month or quarter for the portfolio or the worst peak-to-trough decline in a portfolio’s returns.", "ko": "equity market-neutral fund는 beta가 0에 가깝고 수익 분포가 정규분포와 다를 수 있어, standard deviation·beta·VaR만으로는 downside risk가 잘 안 보인다. 그래서 maximum drawdown(worst month/quarter 또는 worst peak-to-trough decline)으로 보완한다 → C.\nrelative VaR(= ex ante tracking error)는 benchmark 대비 VaR인데, benchmark가 cash면 cash의 volatility가 0이라 relative VaR = 일반 VaR. 이미 계산한 VaR와 같아 새 정보가 없다.\nsurplus at risk는 pension fund용 지표다(assets를 long, liabilities를 short fixed-income position으로 넣은 VaR). hedge fund에는 liabilities가 없어 해당 없음.", "trap": "'benchmarked against cash'는 relative VaR를 쓰라는 신호가 아니라, relative VaR가 VaR와 똑같아져 쓸모없다는 신호다.", "f": "", "why": {"A": "benchmark가 cash(volatility 0)라 relative VaR = VaR. 추가 정보가 없다.", "B": "surplus at risk는 liabilities가 있는 pension fund용 VaR 응용 지표다."}, "orig": "Mock 6 Session 1 Q12", "conf": true}, {"id": "mock6-Q13", "src": "정답", "module": "EQ", "tag": "EV/EBITDA 계산 (market value, cash 차감)", "vig": 3, "stem": "Erebor's EV/EBIDTA ratio is closest to:", "opts": {"A": "9.", "B": "14.", "C": "22."}, "ans": "B", "en": "A. 9. — Incorrect\nIncorrect because it uses the book values instead of the market values to calculate the enterprise value\nEnterprise Value = Market value of common equity + Market value of preferred stock + Market value of debt – cash and investments (specifically, cash, cash equivalents, and short-term investments).\nEV = (280 + 270 + 630 – 375) = 805. EV/EBIDTA = 805/90 = 8.944 ≈ 9.\nB. 14. — Correct\nEnterprise Value = Market value of common equity + Market value of preferred stock + Market value of debt – cash and investments (specifically, cash, cash equivalents, and short-term investments).\nEV = (550 + 210 + 880 – 375) = 1,265. EV/EBIDTA = 1,265/90 = 14.056 ≈ 14.\nC. 22. — Incorrect\nIncorrect because cash and cash equivalents are added instead of being subtracted in the calculation of the enterprise value.\nEnterprise Value = Market value of common equity + Market value of preferred stock + Market value of debt – cash and investments (specifically, cash, cash equivalents, and short-term investments).\nEV= (550 + 210 + 880 + 375) = 2,015. EV/EBIDTA = 2,015/90 = 22.389 ≈ 22.", "ko": "Enterprise value는 market value 기준이고 cash를 뺀다.\nEV = MV of common equity + MV of preferred stock + MV of debt − cash and equivalents(및 short-term investments)\n= 550 + 210 + 880 − 375 = 1,265\nEV/EBITDA = 1,265 / 90 = 14.06 ≈ 14.\npreferred stock도 EV에 포함된다는 점, book value 줄은 distractor라는 점만 기억.", "trap": "book value 줄(630, 280, 270)을 쓰거나 cash를 더하면 보기 A, C가 나온다.", "f": "EV = MV common equity + MV preferred + MV debt − cash & short-term investments", "why": {"A": "book value 사용: (280 + 270 + 630 − 375) / 90 = 8.9.", "C": "cash를 빼지 않고 더함: (550 + 210 + 880 + 375) / 90 = 22.4."}, "orig": "Mock 6 Session 1 Q13", "conf": false}, {"id": "mock6-Q14", "src": "정답", "module": "EQ", "tag": "PEG ratio로 상대 valuation", "vig": 3, "stem": "Based on the PEG ratio, which company is overvalued compared to the industry?", "opts": {"A": "Company A", "B": "Company B", "C": "Company C"}, "ans": "C", "en": "A. Company A — Incorrect\nIncorrect because Company A's P/E ratio will be 9.18 (49.75/5.42) and the PEG ratio will be 1.53 (9.18/6.00). Hence, the stock is fairly valued on the basis of the PEG ratio of 1.53 when compared to the sector median of 1.53 (10.7/7).\nB. Company B — Incorrect\nIncorrect because Company B's P/E ratio will be 7.39 (12.63/1.71) and the PEG ratio will be 0.90 (7.39/8.24). Hence, Company B is undervalued on the basis of the PEG ratio of 0.90 when compared to the sector median of 1.53 (10.7/7). Stocks with lower PEG ratios are more attractive than stocks with higher PEG ratios, all else being equal.\nC. Company C — Correct\nCorrect because the P/E ratio will be 10.7 (31.28/2.93) and the PEG ratio will be 2.37 (10.7/4.50). Company C is overvalued based on the PEG ratio stock of 2.37 when compared to the sector median of 1.53 (10.7/7).", "ko": "PEG = (P/E) / expected earnings growth(%). 낮을수록 성장 대비 싸다. 기준은 sector PEG = 10.7 / 7 = 1.53.\nCompany A: P/E = 49.75 / 5.42 = 9.18 → PEG = 9.18 / 6.00 = 1.53 → sector와 같음(fairly valued)\nCompany B: P/E = 12.63 / 1.71 = 7.39 → PEG = 7.39 / 8.24 = 0.90 → undervalued\nCompany C: P/E = 31.28 / 2.93 = 10.68 → PEG = 10.68 / 4.50 = 2.37 → sector 1.53보다 높음 → overvalued.\nCompany C는 P/E가 sector median과 거의 같은데 growth가 4.5%로 낮아서 PEG가 높아진다.", "trap": "P/E만 보면 C는 sector와 같아 fairly valued처럼 보인다. growth로 나눠야 한다.", "f": "PEG = (P/E) / g(%); PEG가 benchmark보다 높으면 overvalued", "why": {"A": "PEG 1.53 = sector PEG 1.53 → fairly valued.", "B": "PEG 0.90 < 1.53 → undervalued(더 매력적)."}, "orig": "Mock 6 Session 1 Q14", "conf": false}, {"id": "mock6-Q15", "src": "정답", "module": "EQ", "tag": "multiple 선택: P/S의 장점", "vig": 3, "stem": "Which of the following valuation ratios is most suitable for Kassam to value Altair?", "opts": {"A": "Price-to-book ratio", "B": "Price-to-sales ratio", "C": "Price-to-earnings ratio"}, "ans": "B", "en": "A. Price-to-book ratio — Incorrect\nIncorrect because one of the possible drawbacks of the P/B is its inability to capture critical operating assets required in addition to those recognized in financial statements. Intangible assets that are generated internally (as opposed to being acquired) are not shown as assets on a company’s balance sheet. For example, companies account for advertising and marketing as expenses, so the value of internally generated brands, which are created and maintained by advertising and marketing activities, do not appear as assets on a company’s balance sheet under IFRS or US GAAP. Accounting effects such as these may impair the comparability of P/B among companies unless appropriate analyst adjustments are made – hence, it will not be the most suitable indicator for Kassam to use.\nB. Price-to-sales ratio — Correct\nCorrect because Kassam wants to use a stable multiple without making any considerable adjustments to reported financials, P/S is a suitable multiple. Sales are generally less subject to distortion or manipulation than are other fundamentals, such as EPS or book value and because sales are generally more stable than EPS, which reflects operating and financial leverage, P/S is generally more stable than P/E.\nC. Price-to-earnings ratio — Incorrect\nIncorrect because earnings are more prone to manipulation due to discretionary accounting decision about expenses which can distort EPS as a reflection of economic performance. Hence, such distortions may affect the comparability of P/Es among companies and will not be the most suitable indicator for Kassam to use without making any adjustments.", "ko": "조건 세 가지를 지문에서 찾는다: ① stable한 multiple ② reported financials에 adjustment를 하지 않음 ③ Altair의 문제점 두 개.\n문제점 1: internally generated brands가 balance sheet에 없다 → book value가 실제 자산을 반영하지 못함 → P/B 부적합(adjustment 없이는 비교 불가).\n문제점 2: expenses에 대한 discretionary accounting decisions로 earnings가 왜곡 → P/E 부적합.\nP/S: sales는 EPS·book value보다 distortion/manipulation이 어렵고, operating·financial leverage의 영향을 받는 EPS보다 안정적이다 → 조건 모두 충족. 또 recently listed, high growth 회사는 earnings가 작거나 음수일 수 있어 P/S가 흔히 쓰인다.", "trap": "지문의 두 문장이 각각 P/B와 P/E를 탈락시키는 근거다. 남는 것이 P/S.", "f": "", "why": {"A": "internally generated brands는 book value에 잡히지 않는다 → P/B는 adjustment 없이는 부적합.", "C": "expenses의 discretionary accounting으로 EPS가 왜곡 → P/E는 adjustment 없이는 부적합."}, "orig": "Mock 6 Session 1 Q15", "conf": false}, {"id": "mock6-Q16", "src": "오답", "module": "EQ", "tag": "private company valuation: excess earnings method", "vig": 3, "stem": "Based on Exhibit 3, the value of Becq using the excess earnings method is closest to:", "opts": {"A": "$1,400,000.", "B": "$2,440,000.", "C": "$3,080,000."}, "ans": "B", "en": "A. $1,400,000. — Incorrect\nIncorrect because the valuation using the excess earnings method involves estimating earnings remaining after deducting amounts that reflect the required returns on working capital and fixed assets (i.e., the tangible assets). This residual amount of earnings (i.e., “excess earnings”) is capitalized by using the growing perpetuity formula from the CCM to obtain an estimate of the value of intangible assets. For valuing the entire business, the values of working capital and fixed assets are added to the capitalized value of intangibles. However, in this case only the value of intangibles is calculated.\nRequired return on working capital\t(315,000 × 3.25%) = 10,237.50\nRequired return on fixed assets\t(725,000 × 8.50%) = 61,625.00\nResidual earnings\t(191,290 – 10,237.50 – 61,625) = 119,427.50\nValue of intangible assets\t119,427.50 × (1 + 2.50%)/(11.25% – 2.50%) = 1,399,008 (closest to 1,400,000)\nB. $2,440,000. — Correct\nCorrect because the valuation using the excess earnings method involves estimating earnings remaining after deducting amounts that reflect the required returns on working capital and fixed assets (i.e., the tangible assets). This residual amount of earnings (i.e., “excess earnings”) is capitalized by using the growing perpetuity formula from the CCM to obtain an estimate of the value of intangible assets. For valuing the entire business, the values of working capital and fixed assets are added to the capitalized value of intangibles.\nRequired return on working capital\t(315,000 × 3.25%) = 10,237.50\nRequired return on fixed assets\t(725,000 × 8.50%) = 61,625.00\nResidual earnings\t(191,290 – 10,237.50 – 61,625) = 119,427.50\nValue of intangible assets\t119,427.50 × (1 + 2.50%)/(11.25% – 2.50%) = 1,399,008\nTotal value of the company\t(1,399,008 + 315,000 + 725,000) = 2,439,007.86 (closest to 2,440,000)\nC. $3,080,000. — Incorrect\nIncorrect because the valuation using the excess earnings method involves estimating the earnings remaining after deducting amounts that reflect the required returns on working capital and fixed assets (i.e., the tangible assets). This residual amount of earnings (i.e., “excess earnings”) is capitalized by using the growing perpetuity formula from the CCM to obtain an estimate of the value of intangible assets. For valuing the entire business, the values of working capital and fixed assets are added to the capitalized value of intangibles. However, in this case the required return on fixed assets is used as the capitalization rate for valuing the intangible assets instead of the discount rate.\nRequired return on working capital\t(315,000 × 3.25%) = 10,237.50\nRequired return on fixed assets\t(725,000 × 8.50%) = 61,625.00\nResidual earnings\t(191,290 – 10,237.50 – 61,625) = 119,427.50\nValue of intangible assets\t119,427.50 × (1 + 2.50%)/(8.50% – 2.50%) = 2,040,219.79\nTotal value of the company\t(2,040,219.79 + 315,000 + 725,000) = 3,080,219.79 (closest to 3,080,000)", "ko": "excess earnings method(EEM) 4단계:\n① tangible assets의 required return을 earnings에서 뺀다.\nworking capital: 315,000 × 3.25% = 10,237.50\nfixed assets: 725,000 × 8.50% = 61,625.00\nresidual(excess) earnings = 191,290 − 10,237.50 − 61,625 = 119,427.50\n② excess earnings를 한 기 성장시킨다: 119,427.50 × 1.025 = 122,413.19\n③ intangible assets의 discount rate로 capitalize(growing perpetuity): 122,413.19 / (11.25% − 2.50%) = 1,399,008 = value of intangible assets\n④ 회사 전체 가치 = intangibles + working capital + fixed assets = 1,399,008 + 315,000 + 725,000 = 2,439,008 ≈ $2,440,000.\n지문의 'Discount rate 11.25%'가 intangibles(excess earnings)에 쓰는 rate다. 8.50%와 3.25%는 ①에서 차감액을 구할 때만 쓴다.", "trap": "capitalization rate에 fixed assets의 required return(8.50%)을 쓰면 $3,080,000(내가 고른 답)이 된다. intangibles는 가장 위험한 자산이라 가장 높은 discount rate(11.25%)를 쓴다. 또 intangibles 값(1.4M)에서 멈추지 말고 tangible assets를 더해야 한다.", "f": "Excess earnings = Earnings − (WC × r_WC) − (FA × r_FA); V_intangibles = EE × (1 + g) / (r − g); Firm value = V_intangibles + WC + FA", "why": {"A": "$1,399,008은 intangible assets의 가치만이다. working capital과 fixed assets를 더하지 않았다.", "C": "capitalization rate로 8.50%(fixed assets required return)를 사용: 122,413 / (8.5% − 2.5%) = 2,040,220 → 합계 3,080,220. discount rate 11.25%를 써야 한다."}, "orig": "Mock 6 Session 1 Q16", "conf": true, "my": "C"}, {"id": "mock6-Q17", "src": "정답", "module": "FI", "tag": "callable bond를 binomial tree로 valuation", "vig": 4, "stem": "Based on the binomial interest rate tree, the value of Bond A is closest to:", "opts": {"A": "$102.44.", "B": "$102.87.", "C": "$103.37."}, "ans": "A", "en": "A. $102.44. — Correct\nCorrect because we start at the end of the tree and work backwards to determine the value at each node recognizing that if the value is greater than 100, it is optimal to call the bond at par (i.e., it is optimal to call the bond at par if the future 1-year rate is less than the coupon of 5%). Because this is a 2-year bond, the relevant rates to use are the Year 0 (2%) and Year 1 rates (4.08% and 6.09%).\nWe start at the end of the interest rate tree, where the bond makes a payment of 105 (principal plus coupon). Interest rates at Year 1 are 6.09% and 4.08% and Year 1 values are computed as follows:\nAt a rate of 6.09%, the bond value is 105/1.0609 = 98.97.\nAt a rate of 4.08%, the value would be 105/1.0408 = 100.88 and the bond would be called at its par value of 100.\nYear 1 values are then 98.97 and 100.\nWorking backwards to Year 0, with a rate of 2%, we discount the Year 1 values (plus the $5 coupon) to arrive at two values:\n(100 + 5)/1.02 = 102.9412\n(98.97 + 5)/1.02 = 101.9339\nWith equal probabilities, the value at Year 0 is then the equally weighted average which is 102.4375 or 102.44.\nB. $102.87. — Incorrect\nIncorrect because the value is computed using the binomial tree without the bond being called as follows:\nWe start at the end of the interest rate tree, where the bond makes a payment of 105 (principal plus coupon). Interest rates at Year 1 (from Exhibit 2) are 6.09% and 4.08% and Year 1 values are computed as follows:\nAt a rate of 6.09%, the bond value is 105/1.0609 = 98.97.\nAt a rate of 4.08%, the value would be 105/1.0408 = 100.88 and we forget to call the Year 1 values are then 98.97 and 100.88.\nWorking backwards to Year 0, with a rate of 2%, we discount the Year 1 values (plus the $5 coupon) to arrive at 2 values at Year 0 as follows:\n(100.88 + 5)/1.02 = 103.8039\n(98.97 + 5)/1.02 = 101.9339\nWith equal probabilities, the value at Year 0 is then the equally weighted average which is 102.8689.\nAlternatively, you could directly value the bond (as non-callable) using the spot rates in Exhibit 1. Using the spot rates in Exhibit 1, the bond value is (where 2% and 3.53% are the 1- and 2-yr spot rates from Exhibit 1):\n5/1.02^1 + 105/1.0353^2 = 102.8638\nand the difference is due to rounding of the rates that are presented in the binomial tree.\nC. $103.37. — Incorrect\nIncorrect because we treat this option as a put rather than as a call. We start at the end of the tree and work backwards to determine the value at each node recognizing that if the value is less than 100, it is optimal to put the bond at par (i.e., it is optimal to put the bond at par if the future 1-year rate is more than the coupon of 5%). Because this is a 2-year bond, the relevant rates to use from Exhibit 2 are the Year 0 (2%) and Year 1 rates (4.08% and 6.09%).\nWe start at the end of the interest rate tree, where the bond makes a payment of 105 (principal plus coupon). Interest rates at Year 1 (from Exhibit 2) are 6.09% and 4.08% and Year 1 values are computed as follows:\nAt a rate of 6.09%, the bond value is 105/1.0609 = 98.97 and the bond would be put to the issuer at its par value of 100.\nAt a rate of 4.08%, the value would be 105/1.0408 = 100.88 (put option not exercised)\nYear 1 values are then 100 and 100.88.\nWorking backwards to Year 0, with a rate of 2%, we discount the Year 1 values (plus the $5 coupon) to arrive at 2 values at Year 0 as follows:\n(100.88 + 5)/1.02 = 103.80\n(100 + 5)/1.02 = 102.94\nWith equal probabilities, the value at Year 0 is then the equally weighted average which is 103.3745.", "ko": "backward induction, 각 node에서 call rule 적용: 값이 call price(100)보다 크면 issuer가 call → min(값, 100).\n2-year bond라 Year 0(2%)와 Year 1(6.09%, 4.08%) rate만 쓴다.\nYear 1 node:\n· 6.09%: 105 / 1.0609 = 98.97 → call 안 함\n· 4.08%: 105 / 1.0408 = 100.88 > 100 → call → 100\nYear 0: 각 값에 coupon 5를 더해 2%로 할인 후 평균\n· (98.97 + 5) / 1.02 = 101.93\n· (100 + 5) / 1.02 = 102.94\n· 평균 = 102.44.\ncall 여부는 coupon을 더하기 전의 값(ex-coupon)으로 판단한다.", "trap": "call을 적용하지 않으면 102.87(straight bond 값), put으로 처리하면 103.37이 된다. callable ≤ straight ≤ putable 순서로 값이 나오는지 확인하면 검산이 된다.", "f": "Node value = [0.5 × (V_up + V_down) + coupon] / (1 + r); callable: V = min(V, call price)", "why": {"B": "4.08% node에서 call을 적용하지 않은 값(100.88 그대로) → straight bond 가치 102.87.", "C": "option을 put으로 처리(6.09% node를 100으로 올림) → Bond B(putable)의 가치 103.37."}, "orig": "Mock 6 Session 1 Q17", "conf": false}, {"id": "mock6-Q18", "src": "정답", "module": "FI", "tag": "putable bond의 effective convexity", "vig": 4, "stem": "The effective convexity of Bond B:", "opts": {"A": "cannot be negative.", "B": "will become negative if the rate in Year 1 is less than the bond's coupon.", "C": "will become negative if the rate in Year 1 is greater than the bond's coupon."}, "ans": "A", "en": "A. cannot be negative. — Correct\nCorrect because an option-free bond has positive convexity, and the addition of the right to put the bond back to the issuing firm reinforces this. Consequently, the convexity of Bond B which is a putable bond cannot be negative.\nB. will become negative if the rate in Year 1 is less than the bond's coupon. — Incorrect\nIncorrect because unlike a callable bond, the putable bond B cannot have an effective convexity that is negative. If the Year 1 rate is less than the coupon, the bond would sell at a premium and the put option would not be exercised, effectively making the bond behave like a straight bond (that would have positive convexity).\nC. will become negative if the rate in Year 1 is greater than the bond's coupon. — Incorrect\nIncorrect because unlike a callable bond, the putable bond B cannot have an effective convexity that is negative. If the Year 1 rate is greater than the coupon, the put option would be in the money and simply provides a floor for its price without affecting the upside price appreciation.", "ko": "option-free bond는 항상 positive convexity. putable bond는 여기에 investor의 put이 더해진 것이다.\n· rate ↑ (put in the money): put이 가격 하락을 막는 floor 역할 → 가격이 덜 떨어짐 → convexity가 오히려 더 커진다.\n· rate ↓ (put out of the money): straight bond처럼 움직임 → positive convexity.\n어느 쪽이든 negative가 될 수 없다.\nnegative convexity는 callable bond에서만 생긴다: rate ↓일 때 call price가 가격 상승을 막는 cap이 되기 때문(price compression).", "trap": "negative convexity는 callable bond의 특징이다. putable bond에 적용하지 말 것.", "f": "", "why": {"B": "rate < coupon이면 put은 행사되지 않고 straight bond처럼 움직인다 → positive convexity.", "C": "rate > coupon이면 put이 가격의 floor가 될 뿐 upside를 제한하지 않는다 → convexity가 negative가 되지 않는다."}, "orig": "Mock 6 Session 1 Q18", "conf": false}, {"id": "mock6-Q19", "src": "오답", "module": "FI", "tag": "interest rate volatility와 callable bond의 OAS", "vig": 4, "stem": "Under Plessinger's scenario, the OAS of the corporate bond will:", "opts": {"A": "decrease.", "B": "not change.", "C": "increase."}, "ans": "A", "en": "A. decrease. — Correct\nCorrect because under her scenario Plessinger assumes an increase in interest rate volatility (from 20% to 25%) which will lead to a decrease in the callable bond's OAS.\nWe can see this by examining the bond's Z-spread. At zero volatility, the OAS is the Z-spread. For a bond with an embedded option, the Z-spread will capture differences in credit risk, liquidity and optionality relative to the benchmark curve. Increasing the interest rate volatility will increase the value of the embedded option and since we keep the bond price fixed (Z-spread is fixed too), the remaining spread (i.e., the OAS) must decline since Z-Spread = OAS + option cost. The OAS is the spread remaining adjusted for the cost of the option.\nB. not change. — Incorrect\nIncorrect because an increase in the assumed interest rate volatility leads to a decrease in the OAS for the callable bond.\nC. increase. — Incorrect\nIncorrect because an increase in the assumed interest rate volatility leads to a decrease in the OAS for the callable bond.", "ko": "핵심 식: Z-spread = OAS + option cost (callable bond).\n가격이 그대로면 Z-spread도 그대로다(Z-spread는 volatility와 무관하게 가격만으로 정해짐). volatility가 20% → 25%로 오르면 call option의 가치(option cost)가 커진다 → 남는 OAS는 줄어든다.\n다른 설명: volatility ↑ → model이 계산한 callable bond 가치 ↓(call value ↑). 그 낮아진 model 가치를 같은 market price에 맞추려면 더하는 spread(OAS)가 더 작아야 한다.\n정리: 가격 고정 시 volatility ↑ → callable bond OAS ↓, putable bond OAS ↑. (반대로 volatility를 낮게 가정하면 callable bond의 OAS가 커져 싸 보인다.)", "trap": "'volatility ↑ → 위험 ↑ → spread ↑'로 생각하면 틀린다(내가 고른 답 C). OAS는 option 가치를 뺀 나머지 spread라서, option이 비싸질수록 callable bond의 OAS는 줄어든다. 증가하는 것은 putable bond 쪽이다.", "f": "Z-spread = OAS + option cost (callable); volatility ↑ → option cost ↑ → OAS ↓ (price 고정)", "why": {"B": "OAS 계산에는 volatility 가정이 들어간다. volatility가 바뀌면 option cost가 바뀌어 OAS도 바뀐다.", "C": "volatility ↑로 OAS가 커지는 것은 putable bond다. callable bond는 option cost가 커져 OAS가 줄어든다."}, "orig": "Mock 6 Session 1 Q19", "conf": true, "my": "C"}, {"id": "mock6-Q20", "src": "오답", "module": "FI", "tag": "capped floater valuation", "vig": 4, "stem": "The value of the capped floating rate bond analyzed by Plessinger is:", "opts": {"A": "less than its par value.", "B": "equal to its par value.", "C": "greater than its par value."}, "ans": "A", "en": "A. less than its par value. — Correct\nCorrect because the capped floater will have its rate limited to 5% and there are instances where the rate could be greater than 5%. The case text states the following:\nThe floater's coupon pays the one-year reference rate annually, set in arrears, and is capped at 5.0%.\nTo evaluate the default-free capped floater we must look at the exhibit that shows the evolution of 1-year rates based on a volatility of 20% and the spot rates from the exhibit.\nThere are two instances where the cap would be in force; in Year 1 if rates are 6.09% and in Year 2 if rates are 7.32%. In both of these instances the floating rate bond will have a value less than its par value of 100. Working backwards, we will arrive at a value less than 100. In the absence of the cap, the floating rate bond would sell at par at each annual reset date.\nB. equal to its par value. — Incorrect\nIncorrect because there are cases where the cap will be in effect and as a result the floating rate bond will sell for less than its par value. While the spot rates in the exhibit are all less than the 5% cap, it is the evolution of 1-year rates in the binomial interest rate tree that is used to evaluate the cap and in this case there are rates which exceed the cap.\nC. greater than its par value. — Incorrect\nIncorrect because in this case, the capped floating rate bond cannot sell for more than its par value. With the presence of the 5% cap, the capped floater will sell for less than its par value.", "ko": "cap이 없는 floater는 매 reset date에 par(100)이다. cap이 있으면 investor가 issuer에게 cap을 판 셈이라: capped floater 가치 = straight floater(100) − cap 가치 ≤ 100.\ncap이 실제로 걸리는지는 spot rate가 아니라 tree의 1-year rate로 판단한다. Year 1의 6.09%, Year 2의 7.32%가 5%를 넘는다 → 그 node에서는 coupon이 5로 묶여 가치가 100 아래 → backward induction하면 Year 0 가치 < 100.\n확인 계산(set in arrears: 기초 rate로 정해진 coupon을 기말에 지급):\nYear 2 node: 7.32% → 105 / 1.0732 = 97.84, 4.91%와 3.29% → 100\nYear 1 node: 6.09% → [0.5 × (97.84 + 100) + 5] / 1.0609 = 97.96, 4.08% → 100\nYear 0: [0.5 × (97.96 + 100) + 2] / 1.02 ≈ 99.0 < 100.", "trap": "'floater = par'라는 공식만 떠올리면 B(내가 고른 답)를 고른다. spot rate가 모두 5% 아래여도 tree에는 5%를 넘는 path가 있어 cap에 가치가 생긴다 → par보다 작다.", "f": "Capped floater = Straight floater − Embedded cap; coupon = min(reference rate, cap)", "why": {"B": "tree의 6.09%, 7.32% node에서 cap이 걸려 coupon이 시장 rate보다 낮다 → par가 될 수 없다.", "C": "cap은 investor에게 불리한 조건뿐이다(upside만 제한). par를 넘을 수 없다."}, "orig": "Mock 6 Session 1 Q20", "conf": true, "my": "B"}, {"id": "mock6-Q21", "src": "정답", "module": "AI", "tag": "liquid alternatives vs traditional hedge funds", "vig": 5, "stem": "Do liquid alternative investments most likely meet Chang's requirements?", "opts": {"A": "Yes", "B": "No, they fail to meet Requirement 1", "C": "No, they fail to meet Requirement 2"}, "ans": "A", "en": "A. Yes — Correct\nCorrect because liquid alternatives most likely meet both requirements. Liquid alts do not typically have incentive fees and have daily redemption rights, offering greater liquidity than traditional hedge funds. Traditional hedge funds typically involve both a management fee and an incentive fee; however, liquid alts in most countries are prohibited from charging an incentive fee. Whereas traditional hedge funds typically offer only limited periodic liquidity, liquid alts funds may be redeemed by investors on a daily basis.\nB. No, they fail to meet Requirement 1 — Incorrect\nIncorrect because liquid alternatives do not typically have incentive fees and therefore meet Requirement 1. Traditional hedge funds typically involve both a management fee and an incentive fee; however, liquid alts in most countries are prohibited from charging an incentive fee.\nC. No, they fail to meet Requirement 2 — Incorrect\nIncorrect because liquid alternatives have daily redemption rights, offering greater liquidity than traditional hedge funds, and therefore meet Requirement 2. Whereas traditional hedge funds typically offer only limited periodic liquidity, liquid alts funds may be redeemed by investors on a daily basis.", "ko": "liquid alternatives(liquid alts) = hedge fund 전략을 mutual fund 같은 regulated 구조로 담은 상품.\nRequirement 1(낮은 incentive fee): liquid alts는 대부분의 나라에서 incentive fee 부과가 금지되어 management fee만 받는다 → 충족.\nRequirement 2(더 잦은 redemption): traditional hedge funds는 lock-up과 제한된 periodic liquidity(quarterly 등)인데 liquid alts는 daily redemption 가능 → 충족.\n둘 다 충족 → Yes. (대신 liquid alts는 leverage·illiquid 자산 제한 때문에 같은 전략의 hedge fund보다 성과가 낮은 경향이 있다.)", "trap": "두 requirement를 따로 확인. 둘 다 liquid alts의 대표 특징이다.", "f": "", "why": {"B": "liquid alts는 보통 incentive fee가 없다 → Requirement 1 충족.", "C": "liquid alts는 daily redemption → Requirement 2 충족."}, "orig": "Mock 6 Session 1 Q21", "conf": true}, {"id": "mock6-Q22", "src": "오답", "module": "AI", "tag": "multi-strategy funds vs fund of funds", "vig": 5, "stem": "Compared to Strategy 2, Strategy 1 most likely has:", "opts": {"A": "higher returns.", "B": "lower leverage.", "C": "fewer gates on redemptions."}, "ans": "A", "en": "A. higher returns. — Correct\nCorrect because multi-strategy funds (Strategy 1) have generally outperformed FoFs (Strategy 2) but with more variance and occasional large losses often related to their higher leverage. Further, this outperformance may be because of such key advantages as their enhanced flexibility and the fast pace of tactical asset allocation (important in dynamic, volatile markets) given that the different strategies are executed within the same fund structure.\nB. lower leverage. — Incorrect\nIncorrect because multi-strategy funds (Strategy 1) tend to use significantly more leverage than most FoFs (Strategy 2), which gravitate to modest leverage usage. Further, multi-strategy funds tend to use relatively high leverage, which may increase the variance of returns. The main advantages of FoFs are that they offer a potentially more diverse strategy mix with lower leverage (and somewhat less return variance).\nC. fewer gates on redemptions. — Incorrect\nIncorrect because unlike FoFs (Strategy 2), (multi-strategy funds/Strategy 1) often impose investor-level or fund-level gates on maximum quarterly redemptions, even though both groups typically have similar initial lock-up and redemption periods.", "ko": "multi-strategy funds(Strategy 1) vs fund of funds(Strategy 2) 비교표를 외운다.\n· returns: multi-strategy가 더 높았다. 한 fund 안에서 전략 간 capital을 빠르게 옮길 수 있고(fast tactical allocation), fee 구조도 유리(FoF는 double layer of fees, multi-strategy는 전략 간 netting risk를 manager가 흡수).\n· leverage: multi-strategy가 훨씬 높다 → return variance도 크고 가끔 large losses. FoF는 modest leverage.\n· liquidity: lock-up·redemption period는 비슷하지만, multi-strategy가 investor-level/fund-level gates를 더 자주 건다.\n따라서 Strategy 1은 higher returns, higher leverage, more gates.", "trap": "multi-strategy가 '한 fund라 더 유연 → redemption도 쉬움'으로 생각하기 쉽지만(내가 고른 답 C), 유연한 것은 manager의 capital allocation이지 investor의 환매가 아니다. gates는 multi-strategy 쪽이 더 많다.", "f": "", "why": {"B": "multi-strategy funds는 FoF보다 leverage를 훨씬 많이 쓴다.", "C": "multi-strategy funds가 quarterly redemption에 gates를 더 자주 건다. fewer가 아니라 more."}, "orig": "Mock 6 Session 1 Q22", "conf": true, "my": "C"}, {"id": "mock6-Q23", "src": "정답", "module": "AI", "tag": "long/short equity manager의 alpha 원천", "vig": 5, "stem": "Which factor is most likely the primary source of outperformance for the Strategy 3 manager?", "opts": {"A": "Market timing", "B": "Stock selection", "C": "Use of leverage"}, "ans": "B", "en": "A. Market timing — Incorrect\nIncorrect because, while some managers are able to add alpha via market timing of portfolio beta tilt, evidence suggests that most L/S managers do this poorly. Further, although market timing using 'beta tilts' can play a factor in manager performance, studies have shown that most fundamental long/short equity managers offer little added alpha from such adjustments. They are typically either too net long at market highs or not net long enough at market lows. Most L/S equity managers are not known for their portfolio-level market-timing abilities.\nB. Stock selection — Correct\nCorrect because stock selection defines manager skill for most L/S equity managers—with market-timing ability being an additive, but generally secondary, consideration. Therefore, manager skill derives mainly from stock selection.\nC. Use of leverage — Incorrect\nIncorrect because L/S equity managers can readily apply leverage to increase these positions (although higher levels of leverage are used mostly by quantitatively-oriented managers, not fundamental managers). As a result, stock selection defines manager skill for most L/S equity managers.", "ko": "long/short equity manager의 skill은 주로 stock selection에서 나온다(싼 종목 long, 비싼 종목 short).\nmarket timing(net exposure를 조절하는 beta tilt)은 부가적 요소일 뿐이고, 실증적으로 대부분의 L/S manager는 이를 못한다: 시장 고점에서 너무 net long, 저점에서는 net long이 부족.\nleverage는 수익을 키우는 도구이지 skill의 원천이 아니다. 높은 leverage는 주로 quantitative manager가 쓴다.", "trap": "L/S equity는 보통 net long(40–60%)이라 market timing이 중요해 보이지만, curriculum의 결론은 'stock selection이 skill을 정의한다'이다.", "f": "", "why": {"A": "대부분의 L/S manager는 beta tilt로 alpha를 거의 더하지 못한다(market timing은 secondary).", "C": "leverage는 position을 키울 뿐 outperformance의 primary source가 아니다."}, "orig": "Mock 6 Session 1 Q23", "conf": true}, {"id": "mock6-Q24", "src": "오답", "module": "AI", "tag": "hedge fund 전략을 traditional portfolio에 더했을 때 drawdown", "vig": 5, "stem": "Which of the following hedge fund strategies is best suited to meet the plan’s drawdown objective?", "opts": {"A": "Event-driven", "B": "Global macro", "C": "Relative value"}, "ans": "B", "en": "A. Event-driven — Incorrect\nIncorrect because L/S equity strategies, event-driven/distressed securities strategies, and relative value/convertible arbitrage strategies show high maximum drawdowns when combined with the traditional portfolio. Further, it is evident that standard deviations are relatively high for combined portfolios with event-driven/distressed securities and relative value/convertible arbitrage strategies, indicating they provide little in the way of risk-reduction benefits.\nB. Global macro — Correct\nCorrect because when combined with the traditional stock and bond portfolio, the hedge fund strategy portfolios that generate the smallest maximum drawdowns are the opportunistic strategies—specifically, global macro and systematic futures as well as merger arbitrage and equity market-neutral strategies. In addition, they also tend to be the strategies with the lowest serial autocorrelation, signaling good liquidity. This suggests that these types of strategies provide risk mitigation for traditional assets because they are not exposed to the same risks, are relatively opportunistic, and are liquid even during periods of market stress.\nC. Relative value — Incorrect\nIncorrect because L/S equity strategies, event-driven/distressed securities strategies, and relative value/convertible arbitrage strategies show high maximum drawdowns when combined with the traditional portfolio. Further, it is evident that standard deviations are relatively high for combined portfolios with event-driven/distressed securities and relative value/convertible arbitrage strategies, indicating they provide little in the way of risk-reduction benefits.", "ko": "stock/bond portfolio에 더했을 때 maximum drawdown이 가장 작아지는 전략: opportunistic 전략(global macro, systematic futures/managed futures) + merger arbitrage, equity market-neutral.\n이유: equity·credit risk와 다른 risk에 노출되고, 기회에 따라 long·short를 자유롭게 바꾸며, serial autocorrelation이 낮아(= liquidity가 좋음) market stress 때도 liquid하다 → risk mitigation.\n반대로 drawdown이 큰 전략: long/short equity, event-driven/distressed securities, relative value/convertible arbitrage. 이들은 equity·credit beta와 illiquidity를 갖고 있어 위기 때 traditional assets와 같이 떨어진다(short volatility 성격).", "trap": "relative value는 'market-neutral에 가깝고 안정적'처럼 보이지만(내가 고른 답 C), convertible arbitrage 같은 relative value 전략은 위기 때 liquidity가 마르고 credit spread가 벌어져 loss가 크다. drawdown 방어는 global macro·managed futures.", "f": "", "why": {"A": "event-driven/distressed는 traditional portfolio와 합쳤을 때 maximum drawdown과 standard deviation이 높다.", "C": "relative value/convertible arbitrage도 maximum drawdown이 높고 risk-reduction 효과가 작다."}, "orig": "Mock 6 Session 1 Q24", "conf": true, "my": "C"}, {"id": "mock6-Q25", "src": "정답", "module": "QM", "tag": "SVM soft margin classification vs non-linear SVM vs CART", "vig": 6, "stem": "Which of the following machine-learning algorithms is most suitable for Moreno's bond issuer classification model?", "opts": {"A": "Non-linear SVM", "B": "Unconstrained CART", "C": "SVM with soft margin classification"}, "ans": "C", "en": "A. Non-linear SVM — Incorrect\nIncorrect because non-linear SVM is prone to overfitting and complex. A non-linear SVM algorithm can be run by introducing more advanced, non-linear separation boundaries. These algorithms may reduce the number of misclassified instances in the training datasets but are more complex and, so, are prone to overfitting.\nB. Unconstrained CART — Incorrect\nIncorrect because decision trees are prone to overfitting and can become complex with large datasets. CART makes no assumptions about the characteristics of the training data, so if left unconstrained, it potentially can perfectly learn the training data. To avoid such overfitting, regularization parameters can be added, such as the maximum depth of the tree, the minimum population at a node, or the maximum number of decision nodes.\nC. SVM with soft margin classification — Correct\nCorrect because the SVM algorithm handles this non-linear separability problem by an adaptation called soft margin classification, which adds a penalty to the objective function for observations in the training set that are misclassified. In essence, the SVM algorithm will choose a discriminant boundary that optimizes the trade-off between a wider margin and a lower total error penalty.", "ko": "조건 두 개: ① non-linear separability 처리 ② overfitting에 취약하지 않을 것.\nSVM with soft margin classification: 잘못 분류된 training observation에 penalty를 objective function에 더한다. 넓은 margin과 낮은 error penalty 사이의 trade-off를 최적화하므로, 완벽히 분리되지 않는 data도 단순한 경계로 처리 → 두 조건 충족.\nnon-linear SVM: 더 복잡한 non-linear boundary를 쓴다. training set의 오분류는 줄지만 model이 복잡해져 overfitting 위험.\nunconstrained CART: training data에 대한 가정이 없어 제약이 없으면 training data를 완벽히 외운다 → overfitting. 막으려면 maximum depth, minimum population at a node 같은 regularization(또는 pruning)이 필요한데 'unconstrained'라 그것이 없다.", "trap": "'non-linear 문제니까 non-linear SVM'이 아니다. 문제의 두 번째 조건(overfitting 회피)이 A와 B를 탈락시킨다.", "f": "", "why": {"A": "non-linear SVM은 복잡한 boundary 때문에 overfitting에 취약하다.", "B": "unconstrained CART는 regularization이 없어 training data를 완벽히 학습 → overfitting."}, "orig": "Mock 6 Session 1 Q25", "conf": false}, {"id": "mock6-Q26", "src": "정답", "module": "QM", "tag": "logistic regression으로 probability 계산", "vig": 6, "stem": "For the average distressed company, the probability of default predicted by Model 1 is closest to:", "opts": {"A": "36%.", "B": "56%.", "C": "77%."}, "ans": "A", "en": "A. 36%. — Correct\nCorrect because, using the values of the coefficients from the logistic regression results and the average values of the independent variables given in the vignette, the predicted probability of default is calculated as follows:\nP = 1/[1 + exp(–(b0 + b1PROFITi + b2LEVERi))]\n= 1/[1 + exp(–(–1.7878 – 0.0185 × (–2.00) + 0.3876 × 3.00))]\n= 1/(1 + 1.8004) = 0.3571 ≈ 0.36 or 36%\nB. 56%. — Incorrect\nIncorrect because it is the average log odds of the probability of default, calculated as exp(b0 + b1PROFITi + b2LEVERi) = exp(–1.7878 – 0.0185 × (–2.00) + 0.3876 × 3.00) = exp(–0.5880) = 0.5554 ≈ 0.56 or 56%.\nLogistic regression (logit) uses the logistic transformation of the event probability (P) into the log odds, ln[P/(1 − P)], as the dependent variable.\nC. 77%. — Incorrect\nIncorrect because it is the probability of default if the intercept is omitted.\nP = 1/[1 + exp(–(b1PROFITi + b2LEVERi))] = 1/[1 + exp(–(–0.0185 × (–2.00) + 0.3876 × 3.00))] = 1/(1 + 0.3013) = 0.7685 ≈ 0.77 or 77%", "ko": "logistic regression의 종속변수는 log odds = ln[P / (1 − P)]이다. 확률로 되돌리는 2단계:\n① log odds: z = −1.7878 + (−0.0185)(−2.0) + 0.3876(3.0) = −1.7878 + 0.0370 + 1.1628 = −0.5880\n② P = 1 / (1 + e^(−z)) = 1 / (1 + e^0.5880) = 1 / (1 + 1.8004) = 0.357 ≈ 36%.\n같은 식: odds = e^z = 0.5554, P = odds / (1 + odds) = 0.5554 / 1.5554 = 0.357.", "trap": "e^z = 0.5554는 odds이지 probability가 아니다. odds / (1 + odds)까지 해야 한다. PROFIT이 −2.0이라 부호(−0.0185 × −2.0 = +0.037)도 주의.", "f": "z = b0 + b1X1 + b2X2; P = 1 / (1 + e^(−z)) = e^z / (1 + e^z)", "why": {"B": "56%는 e^(−0.5880) = 0.5554, 즉 odds다. probability로 변환하지 않았다.", "C": "intercept(−1.7878)를 빼먹으면 1 / (1 + e^(−1.1998)) = 77%."}, "orig": "Mock 6 Session 1 Q26", "conf": false}, {"id": "mock6-Q27", "src": "오답", "module": "QM", "tag": "변수 추가 시 R-squared와 adjusted R-squared", "vig": 6, "stem": "Compared to Model 2, Model 3 most likely has a:", "opts": {"A": "lower R-squ

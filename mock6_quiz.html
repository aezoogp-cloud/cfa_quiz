ed nature such as creative destruction, the relationship between economic growth and R&D spending is not clear-cut.\nIt should also be noted that the relationship between economic growth and R&D spending is not clear-cut. Although technological innovation resulting from high R&D spending raises output and productivity in the long run, it may result in a cyclical slowing of growth as companies and workers are displaced by the new technologies. This is the Schumpeterian concept of creative destruction, which captures the double-edged nature of technological innovation.\nB. Point 2 — Incorrect\nIncorrect because Point 2 (total factor productivity reflects the state of technology, and can be measured by the contribution of capital deepening plus the growth rates of labor productivity) is not properly stated. The growth rates of labor productivity is equal to the contribution of capital deepening plus total factor productivity.\nLabor productivity growth depends on both capital deepening and technological progress. The contribution of capital deepening can be measured as the difference between the growth rates of labor productivity and total factor productivity. The larger the difference between the productivity growth measures, the more important capital deepening is as a source of economic growth.\nC. Point 3 — Correct\nCorrect because Point 3 (although long-term sustainable growth cannot rely on pure capital deepening, the impact of investment spending on available capital depends on the existing physical capital stock) is properly stated. Since the impact of investment spending on available capital depends on the existing physical capital stock, investment spending has the strong correlation with economic growth across countries while long-term sustainable growth cannot rely on pure capital deepening.\nAs we discussed earlier, long-term sustainable growth cannot rely on pure capital deepening. How can we reconcile this notion with the strong correlation between investment spending and economic growth across countries? A second, and closely related, explanation is that the impact of investment spending on available capital depends on the existing physical capital stock. The wide difference in physical capital per worker suggests that the positive impact of changes in the physical capital stock on growth is very significant in developing countries. For the developed countries, a sustained high level of investment over many years is required to have a meaningful relative impact on the physical capital stock even though the absolute size of the increase in any given year is still larger than in the developing countries.", "ko": "Point 1(틀림): R&D와 growth의 관계는 단기에 'positive'라고 단정할 수 없다. 기술 혁신은 장기적으로 output·productivity를 올리지만, 단기에는 새 기술이 기존 기업과 노동자를 밀어내 경기적으로 growth가 느려질 수 있다 = Schumpeter의 creative destruction(기술 혁신의 double-edged nature). 관계는 'not clear-cut'.\nPoint 2(틀림): 식의 좌우가 뒤바뀌었다. 올바른 식은\nlabor productivity growth = capital deepening + TFP growth\n→ TFP growth = labor productivity growth − capital deepening. TFP는 직접 관측되지 않는 residual이다.\nPoint 3(맞음): pure capital deepening은 diminishing marginal returns 때문에 장기 sustainable growth를 만들지 못한다. 그런데도 국가 간에 investment와 growth의 상관이 강한 이유 중 하나가, investment가 available capital에 주는 영향이 기존 physical capital stock에 달려 있기 때문이다. capital per worker가 낮은 developing countries는 같은 투자로 capital stock이 크게(비율로) 늘어 growth 효과가 크고, developed countries는 높은 투자를 오래 지속해야 의미 있는 변화가 생긴다.", "trap": "Point 1은 앞부분(technology → production function의 upward shift)이 맞는 말이라 속기 쉽다(내가 고른 답 A). 틀린 곳은 뒷부분 'positive in the short run'이다. 단기에는 creative destruction으로 오히려 둔화될 수 있다.", "f": "Labor productivity growth = Capital deepening + TFP growth", "why": {"A": "R&D spending과 growth의 관계는 clear-cut하지 않다. 단기에는 creative destruction으로 growth가 느려질 수 있다.", "B": "labor productivity growth = capital deepening + TFP growth다. TFP를 capital deepening + labor productivity growth로 쓴 것은 식이 뒤바뀐 것."}, "orig": "Mock 6 Session 2 Q10", "conf": true, "my": "A"}, {"id": "mock6-Q55", "src": "오답", "module": "ECO", "tag": "convergence 가설과 endogenous growth (human capital externalities)", "vig": 13, "stem": "Which of the following convergence concepts is most compatible with Team Purple’s conclusion?", "opts": {"A": "Non-convergence", "B": "Absolute convergence", "C": "Conditional convergence"}, "ans": "A", "en": "A. Non-convergence — Correct\nCorrect because Team Purple’s conclusion (the externalities associated with human capital is the most important determinant in predicting the occurrence of convergence) implies that the production function is a straight line, and is compatible with non-convergence. The concept does not support a prediction that convergence should occur.\nIn contrast to the neoclassical model, the endogenous growth model makes no prediction that convergence should occur. This model allows for countries that start with high per capita income and more capital to grow faster and stay ahead of the developing countries. If the externalities associated with knowledge and human capital are large, the higher-income country can maintain its lead through high rates of investment in these capital inputs.\nB. Absolute convergence — Incorrect\nIncorrect because absolute convergence assumes diminishing marginal returns to capital, and is not compatible with the externalities associated with human capital. The concept means that developing countries will eventually catch up with the developed countries, regardless of their particular characteristics.\nAbsolute convergence means that developing countries, regardless of their particular characteristics, will eventually catch up with the developed countries and match them in per capita output. The neoclassical model assumes that all countries have access to the same technology. As a result, per capita income in all countries should eventually grow at the same rate. Thus, the model implies convergence of per capita growth rates among all countries.\nC. Conditional convergence — Incorrect\nIncorrect because conditional convergence assumes diminishing marginal returns to capital, and is not compatible with the externalities associated with human capital. The concept means that convergence is conditional on the countries having the same saving rate, population growth rate, and production function.\nConditional convergence means that convergence is conditional on the countries having the same saving rate, population growth rate, and production function. If these conditions hold, the neoclassical model implies convergence to the same level of per capita output as well as the same steady-state growth rate.", "ko": "어느 growth model의 주장인지부터 가린다.\n· neoclassical model: capital에 diminishing marginal returns → 가난한 나라가 더 빨리 성장 → convergence 예측.\n  - absolute convergence: 특성과 무관하게 모든 나라의 per capita growth rate가 수렴(같은 technology 가정).\n  - conditional convergence: saving rate, population growth rate, production function이 같은 나라끼리만 같은 level·growth rate로 수렴.\n· endogenous growth model: knowledge·human capital의 externalities 때문에 경제 전체로는 capital의 returns가 줄지 않는다(production function이 직선, Y = AK) → 이미 부유하고 capital이 많은 나라가 계속 높은 투자로 앞서 나갈 수 있다 → convergence를 예측하지 않음.\nTeam Purple은 'human capital externalities가 가장 중요한 결정 요인'이라고 결론 → endogenous growth의 논리 → non-convergence와 가장 잘 맞는다.", "trap": "'조건(human capital)에 따라 달라진다'는 말처럼 들려 conditional convergence를 고르기 쉽다(내가 고른 답 C). conditional convergence의 조건은 saving rate·population growth·production function이고, 여전히 diminishing returns(neoclassical)를 전제한다. externalities는 endogenous growth의 키워드다.", "f": "", "why": {"B": "absolute convergence는 neoclassical model(diminishing marginal returns) 기반이다. externalities 논리와 맞지 않는다.", "C": "conditional convergence도 diminishing marginal returns를 가정한다. 조건은 saving rate·population growth rate·production function이지 human capital externalities가 아니다."}, "orig": "Mock 6 Session 2 Q11", "conf": false, "my": "C"}, {"id": "mock6-Q56", "src": "정답", "module": "ECO", "tag": "open economy와 neoclassical model: capital flow의 조정 과정", "vig": 13, "stem": "Which of the following descriptions provided by Team Orange is consistent with Smith's conclusion?", "opts": {"A": "Description 1", "B": "Description 2", "C": "Description 3"}, "ans": "C", "en": "A. Description 1 — Incorrect\nIncorrect because Description 1 (the growth in the capital-exporting countries will be above the steady state) is not consistent with Smith’s conclusion. While opening up the economy increases the rate at which countries' capital-to-labor ratios converge, the growth in the capital-exporting countries will be below (not above) the steady state.\nDuring the transition to the new steady state, the inflows of capital will temporarily raise the rate of growth in the capital-poor country above the steady-state rate of growth. At the same time, growth in the capital-exporting countries will be below the steady state.\nB. Description 2 — Incorrect\nIncorrect because Description 2 (the developed countries will tend to run trade deficits as they export capital) is not consistent with Smith’s conclusion. While opening up the economy increases the rate at which countries' capital-to-labor ratios converge, the developed countries will tend to run trade surpluses (not deficits) as they export capital.\nBecause capital flows must be matched by offsetting trade flows, capital-poor countries will tend to run a trade deficit as they borrow globally to finance domestic investment. In contrast, the developed countries will tend to run trade surpluses as they export capital.\nC. Description 3 — Correct\nCorrect because Description 3 (the rate of return on investments should be lower in countries with high capital-to-labor ratios) is consistent with Smith’s conclusion. While opening up the economy increases the rate at which countries' capital-to-labor ratios converge, the rate of return on investments will be lower in countries with high capital-to-labor ratios\nDeveloping countries have less capital per worker, and as a result, the marginal product of capital is higher. Thus, the rate of return on investments should be higher in countries with low capital-to-labor ratios and lower in countries with high capital-to-labor ratios.", "ko": "trade barrier를 없애면 capital이 return이 높은 곳으로 움직인다.\n· capital-to-labor ratio가 높은 나라(developed) → marginal product of capital 낮음 → rate of return 낮음. 낮은 나라(developing) → return 높음. → Description 3이 맞다.\n· 그래서 capital은 developed → developing으로 흐른다.\n· 전환기 동안: capital을 받는 capital-poor country의 growth는 steady state보다 위, capital을 내보내는 country의 growth는 steady state보다 아래 → Description 1은 반대.\n· capital flow는 반대 방향의 trade flow와 짝을 이룬다: capital을 빌려 오는 developing countries는 trade deficit, capital을 수출하는 developed countries는 trade surplus → Description 2는 반대.\n· 장기적으로 모든 나라의 growth는 steady-state rate로 수렴한다(neoclassical).", "trap": "capital exporter = trade surplus(capital account deficit ↔ current account surplus). 'capital을 내보내니 deficit'으로 헷갈리지 말 것.", "f": "", "why": {"A": "capital-exporting countries의 growth는 전환기 동안 steady state보다 아래다.", "B": "developed countries는 capital을 수출하면서 trade surplus를 낸다. deficit은 capital을 들여오는 developing countries."}, "orig": "Mock 6 Session 2 Q12", "conf": true}, {"id": "mock6-Q57", "src": "정답", "module": "PM", "tag": "ETF holding period cost", "vig": 14, "stem": "Excluding any compounding effects, the expected 1-year holding period cost for investing in ETF 1 is:", "opts": {"A": "0.80%.", "B": "0.90%.", "C": "1.10%."}, "ans": "B", "en": "A. 0.80%. — Incorrect\nIncorrect because one-way commission is assumed instead of round-trip commission.\nConsequently, Round-trip trading cost (%)\n= (One-way commission %) + (½ Bid–ask spread % × 2)\n= 0.10% + (½ × 0.20% × 2) = 0.10% + 0.20% = 0.30%\nHolding period cost (%) = Round-trip trade cost (%) + Management fee for period (%)\n12-month holding period cost (%) = 0.30% + 12/12 × 0.50% = 0.30% + 0.50% = 0.80%\nB. 0.90%. — Correct\nCorrect because Holding period cost (%) = Round-trip trade cost (%) + Management fee for period (%). Round-trip trading cost (%)\n= (One-way commission % × 2) + (½ Bid–ask spread % × 2)\n= (0.10% × 2) + (½ × 0.20% × 2) = 0.20% + 0.20% = 0.40%\n12-month holding period cost (%) = 0.40% + 12/12 × 0.50% = 0.40% + 0.50% = 0.90%\nC. 1.10%. — Incorrect\nIncorrect because the bid-ask spread is mistakenly multiplied by two instead of half of the bid-ask spread. Consequently, Round-trip trading cost (%)\n= (One-way commission % × 2) + (Bid–ask spread % × 2)\n= (0.10% × 2) + (0.20% × 2) = 0.20% + 0.40% = 0.60%\nHolding period cost (%) = Round-trip trade cost (%) + Management fee for period (%)\n12-month holding period cost (%) = 0.60% + 12/12 × 0.50% = 0.60% + 0.50% = 1.10%", "ko": "holding period cost = round-trip trading cost + holding 기간의 management fee.\nround-trip trading cost = (one-way commission × 2) + (½ bid–ask spread × 2)\n= (0.10% × 2) + (½ × 0.20% × 2) = 0.20% + 0.20% = 0.40%\n· commission은 살 때와 팔 때 각각 낸다 → × 2.\n· bid–ask spread는 한 번 거래할 때 절반만 부담한다(살 때 mid보다 반 spread 비싸게, 팔 때 반 spread 싸게) → round trip이면 spread 전체 한 번 = 0.20%.\n1년 cost = 0.40% + (12/12) × 0.50% = 0.90%.\n(보유 기간이 짧을수록 trading cost 비중이 커지고, 길수록 management fee 비중이 커진다.)", "trap": "commission은 2번, spread는 round trip에 1번(반 + 반)이다.", "f": "Holding period cost = (commission × 2) + (½ spread × 2) + (기간/12) × annual management fee", "why": {"A": "commission을 one-way 한 번만 넣음: 0.10% + 0.20% + 0.50% = 0.80%.", "C": "spread 전체를 두 번 넣음: 0.20% + 0.40% + 0.50% = 1.10%."}, "orig": "Mock 6 Session 2 Q13", "conf": false}, {"id": "mock6-Q58", "src": "정답", "module": "PM", "tag": "APT arbitrage portfolio (factor risk 0, 순투자 0)", "vig": 14, "stem": "The most profitable strategy to exploit the arbitrage opportunities is:", "opts": {"A": "Strategy 1.", "B": "Strategy 2.", "C": "Strategy 3."}, "ans": "C", "en": "A. Strategy 1. — Incorrect\nIncorrect because Strategy 3 has the highest return of $10,000 with 0 factor risk. The returns and factor risks of the strategies are summarized in the table below:\n\tStrategy 1\tStrategy 2\tStrategy 3\nExpected return\t$4,000\t$10,000\t$10,000\nFactor risk\t0\t0.2\t0\nExpected return of Strategy 1\n= –($6m × 2.6% + $4m × 3.5%) + $10m × 3.0%\n= –($0.156m + $0.14m) + $0.30m = $0.004m\nFactor risk of Strategy 1\n= –[6 / (6 + 4) × 0.6 + 4 / (6 + 4) × 1.6] + 10 / 10 × 1.0\n= –(0.36 + 0.64) + 1.0 = 0\nExpected return of Strategy 2\n= –($6m × 3.0% + $4m × 4.0%) + $10m × 3.5%\n= –($0.18m + $0.16m) + $0.35m = $0.01m\nFactor risk of Strategy 2\n= –[6 / (6 + 4) × 1.0 + 4 / (6 + 4) × 2.0] + 10 / 10 × 1.6\n= –(0.6 + 0.8) + 1.6 = 0.2\nExpected return of Strategy 3\n= $4m × 3.0% + $6m × 4.0% – $10m × 3.5%\n= $0.12m + $0.24m – $0.35m = $0.01m\nFactor risk of Strategy 3\n= 4 / (4 + 6) × 1.0 + 6 / (4 + 6) × 2.0 – 10 / 10 × 1.6\n= 0.4 + 1.2 – 1.6 = 0\nNote that although Strategies 2 and 3 share the same return of $10,000, Strategy 2 fails to neutralize its factor risk. It has a residual factor risk of 0.2, and is therefore not an arbitrage.\nB. Strategy 2. — Incorrect\nIncorrect because Strategy 3 has the highest return of $10,000 with 0 factor risk. The returns and factor risks of the strategies are summarized in the table below:\n\tStrategy 1\tStrategy 2\tStrategy 3\nExpected return\t$4,000\t$10,000\t$10,000\nFactor risk\t0\t0.2\t0\nExpected return of Strategy 1\n= –($6m × 2.6% + $4m × 3.5%) + $10m × 3.0%\n= –($0.156m + $0.14m) + $0.30m = $0.004m\nFactor risk of Strategy 1\n= –[6 / (6 + 4) × 0.6 + 4 / (6 + 4) × 1.6] + 10 / 10 × 1.0\n= –(0.36 + 0.64) + 1.0 = 0\nExpected return of Strategy 2\n= –($6m × 3.0% + $4m × 4.0%) + $10m × 3.5%\n= –($0.18m + $0.16m) + $0.35m = $0.01m\nFactor risk of Strategy 2\n= –[6 / (6 + 4) × 1.0 + 4 / (6 + 4) × 2.0] + 10 / 10 × 1.6\n= –(0.6 + 0.8) + 1.6 = 0.2\nExpected return of Strategy 3\n= $4m × 3.0% + $6m × 4.0% – $10m × 3.5%\n= $0.12m + $0.24m – $0.35m = $0.01m\nFactor risk of Strategy 3\n= 4 / (4 + 6) × 1.0 + 6 / (4 + 6) × 2.0 – 10 / 10 × 1.6\n= 0.4 + 1.2 – 1.6 = 0\nNote that although Strategies 2 and 3 share the same return of $10,000, Strategy 2 fails to neutralize its factor risk. It has a residual factor risk of 0.2, and is therefore not an arbitrage.\nC. Strategy 3. — Correct\nCorrect because Strategy 3 has the highest return of $10,000 with 0 factor risk. The returns and factor risks of the strategies are summarized in the table below:\n\tStrategy 1\tStrategy 2\tStrategy 3\nExpected return\t$4,000\t$10,000\t$10,000\nFactor risk\t0\t0.2\t0\nExpected return of Strategy 1\n= –($6m × 2.6% + $4m × 3.5%) + $10m × 3.0%\n= –($0.156m + $0.14m) + $0.30m = $0.004m\nFactor risk of Strategy 1\n= –[6 / (6 + 4) × 0.6 + 4 / (6 + 4) × 1.6] + 10 / 10 × 1.0\n= –(0.36 + 0.64) + 1.0 = 0\nExpected return of Strategy 2\n= –($6m × 3.0% + $4m × 4.0%) + $10m × 3.5%\n= –($0.18m + $0.16m) + $0.35m = $0.01m\nFactor risk of Strategy 2\n= –[6 / (6 + 4) × 1.0 + 4 / (6 + 4) × 2.0] + 10 / 10 × 1.6\n= –(0.6 + 0.8) + 1.6 = 0.2\nExpected return of Strategy 3\n= $4m × 3.0% + $6m × 4.0% – $10m × 3.5%\n= $0.12m + $0.24m – $0.35m = $0.01m\nFactor risk of Strategy 3\n= 4 / (4 + 6) × 1.0 + 6 / (4 + 6) × 2.0 – 10 / 10 × 1.6\n= 0.4 + 1.2 – 1.6 = 0\nNote that although Strategies 2 and 3 share the same return of $10,000, Strategy 2 fails to neutralize its factor risk. It has a residual factor risk of 0.2, and is therefore not an arbitrage.", "ko": "arbitrage 조건 세 가지: 순투자 0(long 금액 = short 금액), factor sensitivity 0, expected return > 0.\nStrategy 1: short ETF 1 $6m + ETF 3 $4m, long ETF 2 $10m\n· return = 10 × 3.0% − (6 × 2.6% + 4 × 3.5%) = 0.300 − 0.296 = +$0.004m = $4,000\n· factor = 1.0 − (0.6 × 0.6 + 0.4 × 1.6) = 1.0 − 1.0 = 0 → arbitrage이지만 profit이 작다.\nStrategy 2: short ETF 2 $6m + ETF 4 $4m, long ETF 3 $10m\n· return = 10 × 3.5% − (6 × 3.0% + 4 × 4.0%) = 0.350 − 0.340 = +$10,000\n· factor = 1.6 − (0.6 × 1.0 + 0.4 × 2.0) = 1.6 − 1.4 = +0.2 → factor risk가 남아 arbitrage가 아니다.\nStrategy 3: long ETF 2 $4m + ETF 4 $6m, short ETF 3 $10m\n· return = (4 × 3.0% + 6 × 4.0%) − 10 × 3.5% = 0.360 − 0.350 = +$10,000\n· factor = (0.4 × 1.0 + 0.6 × 2.0) − 1.6 = 1.6 − 1.6 = 0 → arbitrage, profit 최대.\n→ Strategy 3.", "trap": "Strategy 2와 3은 profit이 똑같이 $10,000이다. factor sensitivity까지 계산해야 2가 risk-free가 아니라는 것이 보인다. Strategy 2는 Strategy 3과 같은 ETF를 쓰되 비중(6:4)을 뒤바꿔 놓은 것.", "f": "Arbitrage portfolio: Σw = 0, Σw·β = 0, Σw·E(R) > 0", "why": {"A": "factor risk는 0이지만 expected return이 $4,000으로 Strategy 3($10,000)보다 작다.", "B": "return은 $10,000이지만 factor sensitivity가 0.2 남는다 → risk-free arbitrage가 아니다."}, "orig": "Mock 6 Session 2 Q14", "conf": false}, {"id": "mock6-Q59", "src": "정답", "module": "PM", "tag": "multifactor model 종류: macroeconomic factor model", "vig": 14, "stem": "Li's two-factor model is best categorized as a:", "opts": {"A": "statistical factor model.", "B": "fundamental factor model.", "C": "macroeconomic factor model."}, "ans": "C", "en": "A. statistical factor model. — Incorrect\nIncorrect because in a statistical factor model, statistical methods are applied to historical returns of a group of securities to extract factors that can explain the observed returns of securities in the group. In statistical factor models, the factors are actually portfolios of the securities in the group under study and are therefore defined by portfolio weights. Two major types of factor models are factor analysis models and principal components models. In factor analysis models, the factors are the portfolios of securities that best explain (reproduce) historical return covariances. In principal components models, the factors are portfolios of securities that best explain (reproduce) the historical return variances. In a macroeconomic factor model, the factors are surprises in macroeconomic variables, such as inflation risk and GDP growth, that significantly explain returns.\nB. fundamental factor model. — Incorrect\nIncorrect because in a fundamental factor model, the factors are attributes of stocks or companies that are important in explaining cross-sectional differences in stock prices. Among the fundamental factors that have been used are the book-value-to-price ratio, market capitalization, the price-to-earnings ratio, and financial leverage.\nIn a macroeconomic factor model, the factors are surprises in macroeconomic variables, such as inflation risk and GDP growth, that significantly explain returns.\nBoth the fundamental factor model and macroeconomic factor model use factor sensitivities, but in a different way. A distinction between macroeconomic multifactor models and fundamental factor models is that with the former, the factor (surprise) series is developed first and then the factor sensitivities are estimated through regressions. With the latter, the factor sensitivities (attributes) are specified first and then factor returns estimated through regressions.\nC. macroeconomic factor model. — Correct\nCorrect because in a macroeconomic factor model, the factors are surprises in macroeconomic variables that significantly explain returns. In the example of equities, the factors can be understood as affecting either the expected future cash flows of companies or the interest rate used to discount these cash flows back to the present. Among macroeconomic factors that have been used are interest rates, inflation risk, business cycle risk, and credit spreads.", "ko": "세 종류를 factor의 정체로 구분한다.\n· macroeconomic factor model: factor = macro 변수의 surprise(actual − predicted). 예: inflation, GDP growth, interest rates, credit spreads. intercept = expected return. factor series를 먼저 만들고 sensitivities를 regression으로 추정.\n· fundamental factor model: factor = 회사·stock의 attributes(book-to-price, market cap, P/E, leverage)에 대한 return. sensitivities(표준화된 attributes)를 먼저 정하고 factor returns를 cross-sectional regression으로 추정. intercept는 expected return이 아니다.\n· statistical factor model: 과거 return에 factor analysis(covariances 설명)나 principal components(variances 설명)를 적용해 factor를 뽑는다. factor는 증권들의 portfolio이고 경제적 해석이 어렵다.\nLi의 model은 inflation과 GDP growth의 'surprises'를 factor로 쓴다 → macroeconomic factor model.", "trap": "키워드 'surprises in inflation / GDP growth' = macroeconomic. 'attributes' = fundamental, 'principal components / factor analysis' = statistical.", "f": "", "why": {"A": "statistical factor model의 factor는 통계 기법으로 뽑은 portfolio다. macro 변수의 surprise가 아니다.", "B": "fundamental factor model의 factor는 회사 attributes(P/B, size 등)에 기반한다."}, "orig": "Mock 6 Session 2 Q15", "conf": false}, {"id": "mock6-Q60", "src": "정답", "module": "PM", "tag": "macroeconomic factor model로 return 계산 (surprise 사용)", "vig": 14, "stem": "Based on the two-factor model, the return on Li's portfolio is:", "opts": {"A": "1.8%.", "B": "2.8%.", "C": "3.6%."}, "ans": "C", "en": "A. 1.8%. — Incorrect\nIncorrect because the expected return is omitted, consequently:\nRP = aP + 3.0FINFL + 0.8FGDP + εP\n= 3.0FINFL + 0.8FGDP + 0.2% = 3.0 × (1.2% – 0.8%) + 0.8 × [(–3.5%) – (–4.0%)] + 0.2%\n= 3.0 × 0.4% + 0.8 × 0.5% + 0.2% = 1.2% + 0.4% + 0.2% = 1.8%\nB. 2.8%. — Incorrect\nIncorrect because actual values of inflation and GDP growth, are used in the calculation instead of surprises, consequently:\nRP = aP + 3.0FINFL + 0.8FGDP + εP\n= 1.8% + 3.0FINFL + 0.8FGDP + 0.2% = 1.8% + 3.0 × 1.2% + 0.8 × (–3.5%) + 0.2%\n= 1.8% + 3.6% + (–2.8%) + 0.2% = 2.8%\nC. 3.6%. — Correct\nCorrect because Li‘s model is defined by:\nRP = aP + bP1FINFL + bP2FGDP + εP\nwhere FINFL and FGDP represent surprises in inflation and surprises in GDP growth respectively, aP represents the expected return of the portfolio, and εP represents the error term.\nRP = aP + 3.0FINFL + 0.8FGDP + εP\n= 1.8% + 3.0FINFL + 0.8FGDP + 0.2%\n= 1.8% + 3.0 × (1.2% – 0.8%) + 0.8 × [(–3.5%) – (–4.0%)] + 0.2%\n= 1.8% + 3.0 × 0.4% + 0.8 × 0.5% + 0.2% = 1.8% + 1.2% + 0.4% + 0.2% = 3.6%", "ko": "R = expected return + Σ sensitivity × surprise + error, surprise = actual − predicted.\ninflation surprise = 1.2% − 0.8% = +0.4%\nGDP growth surprise = −3.5% − (−4.0%) = +0.5% (둘 다 음수지만 예상보다 덜 나빴으므로 positive surprise)\nR = 1.8% + 3.0 × 0.4% + 0.8 × 0.5% + 0.2% = 1.8% + 1.2% + 0.4% + 0.2% = 3.6%.", "trap": "factor에 actual 값이 아니라 surprise를 넣는다. GDP growth의 부호: −3.5 − (−4.0) = +0.5.", "f": "R = a + b1(F1 actual − F1 predicted) + b2(F2 actual − F2 predicted) + ε", "why": {"A": "expected return 1.8%(intercept)를 빼먹음: 1.2% + 0.4% + 0.2% = 1.8%.", "B": "surprise 대신 actual 값을 넣음: 1.8% + 3.0 × 1.2% + 0.8 × (−3.5%) + 0.2% = 2.8%."}, "orig": "Mock 6 Session 2 Q16", "conf": false}, {"id": "mock6-Q61", "src": "정답", "module": "FI", "tag": "term structure theories: segmented markets vs preferred habitat", "vig": 15, "stem": "Li's observations about the shape of the yield curve are most consistent with the:", "opts": {"A": "preferred habitat theory.", "B": "liquidity preference theory.", "C": "segmented markets theory."}, "ans": "C", "en": "A. preferred habitat theory. — Incorrect\nIncorrect because Li’s view of the market is not supported by the preferred habitat theory. Under the preferred habitat theory, investors will strongly prefer to transact within a defined maturity range, but if yields are sufficiently attractive outside that range, they will migrate to the alternative maturities.\nB. liquidity preference theory. — Incorrect\nIncorrect because Li’s view of the market is not supported by the liquidity preference theory. Under the liquidity preference theory, forward rates are not unbiased estimates of future spot rates, because investors expect to earn a liquidity premium that increases the farther out on the yield curve they go. The liquidity preference theory is inconsistent with borrower and lender preferences influencing the shape of the yield curve.\nC. segmented markets theory. — Correct\nCorrect because Li’s view of the market is supported by the segmented markets theory. This theory assumes that investors access the bond market only in specific maturity ranges, and will not move outside those ranges even if yields become more attractive in alternative maturities.", "ko": "지문의 결정적 문장: 10-year 투자자들은 8- or 12-year bond의 yield가 상대적으로 높아도 '옮겨 가지 않는다'.\n· segmented markets theory: 투자자·발행자는 정해진 maturity 구간 안에서만 거래하고, 다른 구간의 yield가 아무리 매력적이어도 움직이지 않는다. 각 maturity의 yield는 그 구간의 supply·demand만으로 정해진다 → 지문과 일치.\n· preferred habitat theory: 선호하는 maturity 구간(habitat)이 있지만, 다른 구간의 premium이 충분히 크면 옮겨 간다.\n· liquidity preference theory: maturity가 길수록 커지는 liquidity premium 때문에 forward rate가 future spot rate의 upward-biased 추정치가 된다. lender·borrower의 maturity 선호와는 무관한 이론.\n· (pure/unbiased) expectations theory: forward rate = expected future spot rate, risk premium 없음.", "trap": "segmented markets와 preferred habitat의 차이는 딱 하나: yield가 충분히 매력적일 때 옮겨 가는가. '안 옮긴다' = segmented, '옮긴다' = preferred habitat.", "f": "", "why": {"A": "preferred habitat theory에서는 yield가 충분히 높으면 다른 maturity로 옮겨 간다. 지문의 투자자들은 옮기지 않는다.", "B": "liquidity preference theory는 maturity에 따라 커지는 liquidity premium을 말할 뿐, 특정 maturity 선호로 curve 모양을 설명하지 않는다."}, "orig": "Mock 6 Session 2 Q17", "conf": false}, {"id": "mock6-Q62", "src": "정답", "module": "FI", "tag": "forward rate vs 예상 future spot rate로 bond 가치 판단", "vig": 15, "stem": "Given his forecast, Li should consider a 5-year zero-coupon bond today to be:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "A", "en": "A. undervalued. — Correct\nCorrect because if Li’s forecast is correct, bond cash flows are currently being discounted at higher rates than the rates that will be used to discount them in the future, so 5-year bonds are currently undervalued. The current bond value is based on the implied forward rate observed for those final two years, and the bond's value will be higher if that two-year rate is lower in the future.\nB. fairly valued. — Incorrect\nIncorrect because a bond will be fairly valued today only if future spot rates equal implied forward rates calculated using today's yield curve. In this case, future spot rates are forecasted to be lower than implied forward rates, which means bond cash flows are presently being discounted at too high a rate, producing a price that is low relative to fair value.\nC. overvalued. — Incorrect\nIncorrect because a bond will be overvalued today only if future spot rates exceed implied forward rates calculated using today's yield curve. In this case, future spot rates are forecasted to be lower than implied forward rates, which means bond cash flows are presently being discounted at too high a rate, producing a price that is low relative to fair value.", "ko": "원칙: 오늘의 bond 가격은 implied forward rates로 할인한 값이다. 내가 예상하는 future spot rate가 forward rate보다 낮으면 → 시장이 너무 높은 rate로 할인하고 있다 → 오늘 가격이 싸다(undervalued). 높으면 overvalued.\n5-year zero의 마지막 2년에 해당하는 forward rate f(3,2):\n(1 + f)² = (1.0264)^5 / (1.0238)^3 = 1.1392 / 1.0731 = 1.0616 → f(3,2) ≈ 3.03%.\nLi의 forecast: 3년 뒤 2-year spot rate = 2.20% < 3.03%.\n→ 3년 뒤 이 bond(잔존 2년)는 forward rate가 내포한 것보다 낮은 rate로 할인되어 더 비싸진다 → 오늘의 5-year zero는 undervalued → 사야 한다.", "trap": "2.20%가 '현재 2-year spot과 같다'는 말에 속지 말 것. 비교 대상은 현재 spot이 아니라 forward rate f(3,2) ≈ 3.03%다. upward-sloping curve에서는 forward가 spot보다 높다.", "f": "[1 + f(3,2)]² = (1 + z5)^5 / (1 + z3)^3; 예상 future spot < forward → undervalued", "why": {"B": "fairly valued는 future spot rate가 forward rate와 같을 때다. 2.20% ≠ 3.03%.", "C": "overvalued는 future spot rate가 forward rate보다 높을 때다. 여기는 더 낮다."}, "orig": "Mock 6 Session 2 Q18", "conf": true}, {"id": "mock6-Q63", "src": "정답", "module": "FI", "tag": "riding the yield curve", "vig": 15, "stem": "To implement the strategy for Client A, Li should buy a:", "opts": {"A": "1-year government bond.", "B": "2-year government bond.", "C": "3-year government bond."}, "ans": "C", "en": "A. 1-year government bond. — Incorrect\nIncorrect because riding the yield curve involves buying securities with maturities that are greater than the investor’s investment horizon. In this case, the investment horizon is two years, so buying a one-year security would not be correct.\nB. 2-year government bond. — Incorrect\nIncorrect because riding the yield curve involves buying securities with maturities that are greater than the investor’s investment horizon. In this case, the investment horizon is two years, so buying a two-year security would not be correct.\nC. 3-year government bond. — Correct\nCorrect because riding the yield curve involves buying securities with maturities that are greater than the investor’s investment horizon. In this case, the investment horizon is two years, and the correct security to purchase has a three-year maturity. When the yield curve is upward sloping (as in Exhibit 1) and the investor does not expect a change in its level or shape, conditions are favorable for this strategy. The investor buys a security with a longer maturity than the investment horizon, and sells when the investment horizon date is reached. Assuming an upward-sloping yield curve, the passage of time causes the yield on the bond to decrease, which provides extra return to the investor.", "ko": "riding the yield curve(rolling down the yield curve): yield curve가 upward-sloping이고 그 모양·수준이 유지될 것으로 예상할 때, investment horizon보다 maturity가 긴 bond를 사서 horizon 시점에 판다.\n시간이 지나면 bond의 잔존 maturity가 짧아지면서 더 낮은 yield로 평가된다 → 가격 상승분이 추가 수익(maturity matching보다 높은 return).\nClient A의 horizon = 2년 → maturity가 2년보다 긴 3-year government bond를 사서 2년 뒤(잔존 1년, yield 2.02%)에 판다.\n조건 확인: Exhibit 1의 spot curve는 upward-sloping(2.02% → 2.64%)이고 client는 curve가 unchanged라고 예상 → 전략에 유리한 조건.", "trap": "maturity가 horizon과 같은 2-year bond는 그냥 maturity matching(buy-and-hold)이다. riding은 반드시 horizon보다 긴 maturity.", "f": "", "why": {"A": "1-year bond는 horizon(2년)보다 짧다. maturity 후 재투자해야 하고 roll-down 수익이 없다.", "B": "2-year bond는 horizon과 같아 hold-to-maturity가 된다. riding the yield curve가 아니다."}, "orig": "Mock 6 Session 2 Q19", "conf": false}, {"id": "mock6-Q64", "src": "오답", "module": "FI", "tag": "yield volatility 연율화와 key rate duration", "vig": 15, "stem": "Are Li's calculation and conclusion related to key rate duration and term structure volatility correct?", "opts": {"A": "Yes", "B": "No, only his annualized volatility estimate is correct", "C": "No, only his conclusion related to key rate duration and term structure volatility is correct"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because although the annualized volatility estimate is calculated correctly, the statement about key rate duration and yield curve volatility is incorrect.\nB. No, only his annualized volatility estimate is correct — Correct\nCorrect because the monthly standard deviation of yield curve volatility can be annualized by multiplying it by the square root of 12. So, 3.25% ×12^(1/2) ≈11.26%.\nC. No, only his conclusion related to key rate duration and term structure volatility is correct — Incorrect\nIncorrect because while it is true that longer-term securities have higher key rate durations, the volatility term structure typically shows that short-term rates are more volatile than long-term rates. Key rate duration measures the effect on a bond's price of a change in yield at a particular point on the yield curve. However, key rate duration does not measure the propensity of rates at different maturities to be volatile.", "ko": "두 주장을 따로 판정한다.\n① 계산(맞음): volatility는 √시간에 비례한다. annual = monthly × √12 = 3.25% × 3.464 = 11.26%.\n② 결론(틀림): 'longer-term rates의 key rate duration이 높아서 long-term volatility가 높다'.\n· key rate duration은 특정 maturity의 rate가 변할 때 bond 가격이 얼마나 변하는지(가격 민감도)를 재는 것이지, 그 rate가 얼마나 잘 변하는지(volatility)를 재는 것이 아니다. 인과관계가 없다.\n· 사실관계도 반대다: term structure of volatility는 보통 short-term rates가 long-term rates보다 더 volatile하다(short-term은 monetary policy 불확실성, long-term은 real economy·inflation 불확실성과 연결).\n→ 계산만 맞다 → B.", "trap": "계산이 맞아서 결론까지 맞다고 넘어가면 A(내가 고른 답)를 고른다. duration(민감도)과 volatility(rate 자체가 얼마나 변하는지)는 다른 개념이고, volatility는 short-term 쪽이 더 높다.", "f": "σ(annual) = σ(monthly) × √12", "why": {"A": "연율화 계산은 맞지만 key rate duration과 volatility를 연결한 결론이 틀렸다.", "C": "틀린 쪽이 결론이다. key rate duration은 rate의 volatility를 재지 않고, 보통 short-term rates가 더 volatile하다."}, "orig": "Mock 6 Session 2 Q20", "conf": false, "my": "A"}, {"id": "mock6-Q65", "src": "오답", "module": "FSA", "tag": "SPE consolidation (IFRS 10)과 debt-to-assets", "vig": 16, "stem": "Acme's consolidated debt-to-assets ratio would most likely be:", "opts": {"A": "lower under Option 1 compared to Option 2.", "B": "the same under either Option 1 or Option 2.", "C": "higher under Option 1 compared to Option 2."}, "ans": "B", "en": "A. lower under Option 1 compared to Option 2. — Incorrect\nIncorrect because Acme has the ability to influence the financial and operating policy of the SPE and will absorb any losses the SPE may incur, and is thus exposed to variable returns from the SPE. Therefore, the consolidated balance sheet (of Acme) would look exactly the same as if it borrowed directly against the receivables.\nB. the same under either Option 1 or Option 2. — Correct\nCorrect because IFRS require consolidation if the substance of the relationship indicates control by the sponsor. Under IFRS 10, Consolidated Financial Statements and SIC-12, Consolidation-Special Purpose Entities, the definition of control extends to a broad range of activities. The control concept requires judgment and evaluation of relevant factors to determine whether control exists. Control is present when 1) the investor has the ability to exert influence on the financial and operating policy of the entity; and 2) is exposed, or has rights, to variable returns from its involvement with the investee.\nAcme has the ability to influence the financial and operating policy of the SPE and will absorb any losses the SPE may incur, and is thus exposed to variable returns from the SPE. Therefore, the consolidated balance sheet (of Acme) would look exactly the same as if it borrowed directly against the receivables.\nC. higher under Option 1 compared to Option 2. — Incorrect\nIncorrect because IFRS require consolidation if the substance of the relationship indicates control by the sponsor. Acme has the ability to influence the financial and operating policy of the SPE and will absorb any losses the SPE may incur, and is thus exposed to variable returns from the SPE. Therefore, the consolidated balance sheet (of Acme) would look exactly the same as if it borrowed directly against the receivables.", "ko": "핵심 가정: Acme는 SPE의 financial and operating policy에 영향을 줄 수 있고, SPE의 loss를 흡수한다(= variable returns에 노출) → IFRS 10의 control 요건 충족 → SPE를 consolidate해야 한다.\nconsolidate하면 SPE의 receivables EUR 50m과 borrowing EUR 40m이 그대로 Acme의 consolidated balance sheet에 올라오고, Acme의 SPE 투자 10m과 SPE의 equity 10m은 서로 상계된다.\n→ Option 2의 consolidated balance sheet = Option 1(receivables를 collateral로 직접 40m borrowing)과 똑같다: assets에 cash +40, liabilities에 debt +40 → debt-to-assets ratio 동일.\nSPE로 debt를 balance sheet 밖으로 빼려면 control이 없어 consolidate하지 않아야 하는데, 이 문제는 그 길을 막아 놓았다.", "trap": "'SPE에 receivables를 팔았으니 debt가 balance sheet에서 빠진다(off-balance-sheet)'로 생각하면 C(내가 고른 답)를 고른다. 질문이 'consolidated' ratio이고 control이 있다고 가정했으므로 SPE의 debt가 그대로 합쳐진다. 지문의 control 조건 문장을 반드시 확인.", "f": "", "why": {"A": "consolidation 후에는 두 option의 balance sheet가 같다. Option 1이 낮을 이유가 없다.", "C": "SPE를 consolidate하므로 Option 2에서도 40m의 debt가 그대로 잡힌다. Option 1만 높아지지 않는다."}, "orig": "Mock 6 Session 2 Q21", "conf": true, "my": "C"}, {"id": "mock6-Q66", "src": "정답", "module": "FSA", "tag": "net income 과대계상의 accounting warning signs", "vig": 16, "stem": "Which observation is most likely a potential accounting warning sign related to the overstatement of net income?", "opts": {"A": "Observation 1", "B": "Observation 2", "C": "Observation 3"}, "ans": "B", "en": "A. Observation 1 — Incorrect\nIncorrect because a higher (not lower) growth rate in receivables compared to revenue is a potential accounting warning sign of overstated or accelerated revenue recognition, which would lead to overstatement of net income.\nB. Observation 2 — Correct\nCorrect because management compensation that is largely tied to financial results is a potential accounting warning sign related to overstated net income.\nC. Observation 3 — Incorrect\nIncorrect because longer (not shorter) depreciable lives would be a potential accounting warning sign related to overstated net income.", "ko": "각 observation이 'net income overstatement' 방향의 신호인지 본다.\nObservation 1: receivables growth < revenue growth → 정상. warning sign은 반대(receivables가 revenue보다 빨리 증가 = 공격적·가속된 revenue recognition, 회수 안 되는 revenue).\nObservation 2: management compensation이 financial results에 크게 연동 → net income을 부풀릴 incentive(motivation) → warning sign. (fraud triangle의 incentive/pressure 요소)\nObservation 3: depreciable lives가 peers보다 짧다 → depreciation expense가 더 커서 net income이 낮게 나오는 conservative한 처리. warning sign은 반대(더 긴 lives → expense ↓ → income ↑).", "trap": "Observation 1과 3은 warning sign의 방향을 뒤집어 놓은 것이다. 'peers와 다르다'는 것만으로 warning sign이 아니라 net income을 키우는 방향인지 봐야 한다.", "f": "", "why": {"A": "warning sign은 receivables growth가 revenue growth보다 높을 때다. 낮은 것은 문제가 아니다.", "C": "짧은 depreciable lives는 expense를 키워 net income을 낮춘다(conservative). 과대계상 신호는 긴 lives."}, "orig": "Mock 6 Session 2 Q22", "conf": true}, {"id": "mock6-Q67", "src": "정답", "module": "FSA", "tag": "Beneish M-score와 Altman Z-score 해석", "vig": 16, "stem": "The trend in Beneish M-scores and Altman Z-scores most likely indicates that:", "opts": {"A": "the likelihood of misreporting and the likelihood of bankruptcy have both increased.", "B": "the likelihood of misreporting has increased, but the likelihood of bankruptcy has decreased.", "C": "the likelihood of misreporting has decreased, but the likelihood of bankruptcy has increased."}, "ans": "C", "en": "A. the likelihood of misreporting and the likelihood of bankruptcy have both increased. — Incorrect\nIncorrect because higher M-scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation and a higher Z-score is better. Acme's M-scores and Z-scores have both declined steadily. A decline in both M-scores and Z-scores would most likely indicate that the likelihood of misreporting (M-score) has decreased, but the likelihood of bankruptcy (Z-score) has increased.\nB. the likelihood of misreporting has increased, but the likelihood of bankruptcy has decreased. — Incorrect\nIncorrect because higher M-scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation and a higher Z-score is better. Acme's M-scores and Z-scores have both declined steadily. A decline in both M-scores and Z-scores would most likely indicate that the likelihood of misreporting (M-score) has decreased, but the likelihood of bankruptcy (Z-score) has increased.\nC. the likelihood of misreporting has decreased, but the likelihood of bankruptcy has increased. — Correct\nCorrect because higher M-scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation and a higher Z-score is better. A decline in both M-scores and Z-scores would most likely indicate that the likelihood of misreporting (M-score) has decreased, but the likelihood of bankruptcy (Z-score) has increased.", "ko": "두 score는 방향이 반대라 따로 외운다.\n· Beneish M-score: earnings manipulation 확률. 높을수록(덜 음수일수록) manipulation 가능성 ↑. 기준 −1.78: 이보다 크면 manipulator 가능성이 높다. → 내려갔다 = misreporting 가능성 ↓.\n· Altman Z-score: bankruptcy 예측. 높을수록 안전, 낮을수록 bankruptcy 가능성 ↑(1.81 미만 = 위험, 3.00 초과 = 안전). → 내려갔다 = bankruptcy 가능성 ↑.\n둘 다 꾸준히 하락 → misreporting 가능성은 줄었지만 bankruptcy 가능성은 늘었다.", "trap": "두 score 모두 '낮으면 나쁘다'고 생각하면 A를 고른다. M-score는 높은 것이 나쁘다.", "f": "M-score ↑ → manipulation 확률 ↑ (cutoff −1.78); Z-score ↓ → bankruptcy 확률 ↑", "why": {"A": "M-score 하락은 misreporting 가능성 감소다. 둘 다 증가가 아니다.", "B": "정반대다. M-score ↓ = misreporting ↓, Z-score ↓ = bankruptcy ↑."}, "orig": "Mock 6 Session 2 Q23", "conf": true}, {"id": "mock6-Q68", "src": "정답", "module": "FSA", "tag": "cash-flow-based accruals ratio", "vig": 16, "stem": "Acme's cash-flow-based accruals ratio for the most recent year is closest to:", "opts": {"A": "12.3%.", "B": "14.8%.", "C": "18.4%."}, "ans": "A", "en": "A. 12.3%. — Correct\nCorrect because the cash-flow-based accruals ratio is computed using the following equation: [NI – (CFO + CFI)]/Average NOA\nwhere:\nNI = net income\nCFO = operating cash flow\nCFI = investing cash flow\nNOA = average net operating assets\nAcme's cash-flow-based accruals ratio = [7,050 – (9,826 – 8,410)]/45,894 ≈ 0.1228 ≈ 12.3%.\nB. 14.8%. — Incorrect\nIncorrect because net income is omitted and all cash flow items are netted together in the numerator: [9,826 – 8,410 + 5,390)]/45,894 ≈ 0.1483 ≈ 14.8%.\nC. 18.4%. — Incorrect\nIncorrect because the net cash flow terms are added to, instead of subtracted from, the net income in the numerator: [7,050 + (9,826 – 8,410)]/45,894 ≈ 0.18447 ≈ 18.4%.", "ko": "accruals = earnings 중 cash로 뒷받침되지 않은 부분.\ncash-flow-based accruals ratio = [NI − (CFO + CFI)] / average NOA\n= [7,050 − (9,826 − 8,410)] / 45,894 = (7,050 − 1,416) / 45,894 = 5,634 / 45,894 = 12.3%.\nCFI는 음수 그대로 넣는다(CFO + CFI = 1,416). financing cash flow(5,390)는 쓰지 않는다.\n해석: ratio가 높을수록 earnings quality가 낮다(accruals 비중이 큼, earnings의 persistence ↓).\n참고: balance-sheet-based accruals ratio = (NOA end − NOA beginning) / average NOA.", "trap": "CFF는 distractor다. CFO와 CFI만 쓰고, 둘을 더한 뒤 NI에서 뺀다.", "f": "Accruals ratio (CF) = [NI − (CFO + CFI)] / Average NOA", "why": {"B": "NI를 빼먹고 CFO + CFI + CFF를 분자로 씀: 6,806 / 45,894 = 14.8%.", "C": "(CFO + CFI)를 빼지 않고 더함: (7,050 + 1,416) / 45,894 = 18.4%."}, "orig": "Mock 6 Session 2 Q24", "conf": false}, {"id": "mock6-Q69", "src": "오답", "module": "EQ", "tag": "valuation model 선택: DDM vs FCF vs residual income", "vig": 17, "stem": "Which of the following valuation models is most appropriate for Firm A?", "opts": {"A": "Free cash flow model", "B": "Residual income model", "C": "Dividend discount model"}, "ans": "A", "en": "A. Free cash flow model — Correct\nCorrect because Firm A is planning significant expansion, which will result in dividends exceeding free cash flow to equity. Generally, defining returns as free cash flow and using the FCFE (and FCFF) models are most suitable when the company is dividend-paying but dividends significantly exceed or fall short of free cash flow to equity.\nB. Residual income model — Incorrect\nIncorrect because the residual income model relies on the quality of accounting to be good, so that an analyst can appropriately adjust net income and book value. If the quality of accounting disclosure is good, the analyst may be able to calculate residual income by making appropriate adjustments (to reported net income and book value, in particular). In some cases, the degree of distortion and the quality of accounting disclosure can be such that the application of the residual income model is error-prone.\nC. Dividend discount model — Incorrect\nIncorrect because Firm A is planning to maintain dividend payments at pre-expansion levels, regardless of future profitability. The DDM is most suitable when the board of directors has established a dividend policy that bears an understandable and consistent relationship to the company’s profitability. The fact that the dividend payout ratio has been stable for the last 10 years is not relevant going forward.", "ko": "model별 적합 조건을 지문의 세 문장에 대입한다.\n· DDM이 적합한 경우: dividend를 주고, dividend policy가 profitability와 이해 가능하고 일관된 관계를 가지며, 투자자가 non-control 관점일 때.\n  → Firm A는 payout이 'regardless of future profitability'로 유지된다 = dividend가 profitability와 연결되지 않는다. 게다가 dividend가 FCFE를 초과한다(지급 능력 이상으로 주는 중) → DDM 부적합.\n· FCF model이 적합한 경우: dividend가 없거나, dividend가 FCFE와 크게 다를 때(초과 또는 미달), control 관점일 때.\n  → 'dividends exceeding free cash flow to equity' = 교과서 그대로의 조건 → FCF model.\n· residual income model이 적합한 경우: dividend가 없거나 FCF가 음수일 때. 단 accounting disclosure의 quality가 좋아 net income·book value를 조정할 수 있어야 한다.\n  → aggressive한 earnings 정책 + 낮은 disclosure quality → RI model은 error-prone.\n남는 것은 free cash flow model.", "trap": "첫 문장 'payout ratio가 10년간 stable'은 DDM을 고르게 하는 미끼다(내가 고른 답 C). 결정적 조건은 둘째 문장(dividend > FCFE)이고, 첫 문장의 'regardless of future profitability'는 오히려 DDM에 불리한 표현이다.", "f": "", "why": {"B": "aggressive accounting과 낮은 disclosure quality 때문에 residual income(net income·book value 기반)은 신뢰하기 어렵다.", "C": "dividend가 profitability와 무관하게 유지되고 FCFE를 초과한다 → dividend가 회사의 실제 지급 능력을 반영하지 못해 DDM이 부적합."}, "orig": "Mock 6 Session 2 Q25", "conf": true, "my": "C"}, {"id": "mock6-Q70", "src": "정답", "module": "EQ", "tag": "multi-period DDM으로 fair value와 판정", "vig": 17, "stem": "Based on the dividend discount model, Bala should consider Firm B’s common stock to be:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "B", "en": "A. undervalued. — Incorrect\nIncorrect because the current share price of $19.00 is only 1.6% above the fair value of $18.70. Given ValEwe's valuation policy of considering a stock to be fairly valued if its price is within 2% of its estimated fair value, Firm B should be considered fairly valued.\nB. fairly valued. — Correct\nCorrect because the value of Firm B’s stock is the present value of the expected dividends for the next three years plus the present value of the expected price at the end of Year 3.\nV0 = D1/(1 + r)^1 + D2/(1 + r)^2 + D3/(1 + r)^3 + P3/(1 + r)^3\nwhere:\nD1 = expected dividend received at the end of Year 1\nD2 = expected dividend received at the end of Year 2\nD3 = expected dividend received at the end of Year 3\nP3 = expected price at the end of Year 3 = $21.50\nr = required return on equity = 8.0%\nGiven a dividend payout ratio of 40% (= 1 – retention ratio = 1 – 60%),\nD1 = EPS1 × dividend payout ratio = $1.27 × 40% = $0.51\nD2 = EPS2 × dividend payout ratio = $1.62 × 40% = $0.65\nD3 = EPS3 × dividend payout ratio = $1.91 × 40% = $0.76\nV0 = $0.51/(1.08)^1 + $0.65/(1.08)^2 + $0.76/(1.08)^3 + $21.50/(1.08)^3 = $18.70\nThe current share price of $19.00 is only 1.6% above this estimate of $18.70. Given ValEwe's valuation policy of considering a stock to be fairly valued if its price is within 2% of its estimated fair value, Firm B should be considered fairly valued.\nC. overvalued. — Incorrect\nIncorrect because the current price of $19.00 is only 1.6% above the fair value of $18.70. Given ValEwe's valuation policy of considering a stock to be fairly valued if its price is within 2% of its estimated fair value, Firm B should be considered fairly valued.", "ko": "payout ratio = 1 − retention ratio = 1 − 0.60 = 0.40.\nD1 = 1.27 × 0.4 = 0.508, D2 = 1.62 × 0.4 = 0.648, D3 = 1.91 × 0.4 = 0.764\nV0 = 0.508/1.08 + 0.648/1.08² + (0.764 + 21.50)/1.08³\n= 0.470 + 0.556 + 17.674 = $18.70.\n판정: price $19.00은 value $18.70보다 1.6% 높다(19.00/18.70 − 1). firm의 기준은 ±2% 이내면 fairly valued → fairly valued.\n(기준이 없었다면 price > value이므로 overvalued 쪽이다.)", "trap": "두 가지: (1) 60%는 retention ratio다. dividend는 40%. (2) 지문의 '2% 이내면 fairly valued' 규칙을 적용해야 한다.", "f": "V0 = Σ Dt/(1 + r)^t + Pn/(1 + r)^n; Dt = EPSt × (1 − retention ratio)", "why": {"A": "price(19.00)가 value(18.70)보다 높으므로 undervalued일 수 없고, 차이도 2% 이내다.", "C": "price가 1.6% 높지만 2% 기준 안이라 fairly valued로 본다."}, "orig": "Mock 6 Session 2 Q26", "conf": true}, {"id": "mock6-Q71", "src": "정답", "module": "EQ", "tag": "DuPont으로 sustainable growth rate", "vig": 17, "stem": "Based on the DuPont model, the sustainable growth rate for Firm C is closest to:", "opts": {"A": "5.14%.", "B": "7.57%.", "C": "9.25%."}, "ans": "C", "en": "A. 5.14%. — Incorrect\nIncorrect because this calculation uses the Debt/Equity ratio (= 2.25 – 1 = 1.25) instead of the Total Assets/Equity ratio:\ng = (1 – 45%) × 11.5% × 0.65 × 1.25 = 5.14%\nB. 7.57%. — Incorrect\nIncorrect because this calculation uses the dividend payout ratio instead of the retention ratio (= 1 – dividend payout ratio):\ng = 45% × 11.5% × 0.65 × 2.25 = 7.57%\nC. 9.25%. — Correct\nCorrect because the sustainable growth rate is the rate of dividend (and earnings) growth that can be sustained for a given level of return on equity, assuming that the capital structure is constant through time and that additional common stock is not issued. Based on the DuPont model, the sustainable growth rate can be expressed as a function of profit margin, retention rate, asset turnover, and financial leverage:\ng = (1 – Dividend Payout Ratio) × Net Profit Margin × Total Asset Turnover × (Total Assets/Equity)\nFor Firm C, g = (1 – 45%) × 11.5% × 0.65 × 2.25 = 9.25%", "ko": "g = b × ROE, ROE = net profit margin × total asset turnover × financial leverage(total assets/equity).\nROE = 11.5% × 0.65 × 2.25 = 16.82%\nb(retention ratio) = 1 − 0.45 = 0.55\ng = 0.55 × 16.82% = 9.25%.\n(PRAT: Profit margin × Retention × Asset turnover × leverage T)\nEPS $3.20과 forecast growth 8%는 이 문제에 필요 없다.", "trap": "payout(45%)이 아니라 retention(55%)을 곱한다. leverage는 debt/equity(1.25)가 아니라 assets/equity(2.25).", "f": "g = (1 − payout) × (NI/Sales) × (Sales/Assets) × (Assets/Equity)", "why": {"A": "leverage에 debt/equity = 1.25를 사용: 0.55 × 11.5% × 0.65 × 1.25 = 5.14%.", "B": "retention 대신 payout 45%를 사용: 0.45 × 11.5% × 0.65 × 2.25 = 7.57%."}, "orig": "Mock 6 Session 2 Q27", "conf": false}, {"id": "mock6-Q72", "src": "오답", "module": "EQ", "tag": "Gordon growth model의 민감도: r과 g가 같이 오를 때", "vig": 17, "stem": "Under Bala's sensitivity scenario, Firm C's estimated share price is expected to:", "opts": {"A": "decrease.", "B": "stay the same.", "C": "increase."}, "ans": "C", "en": "A. decrease. — Incorrect\nIncorrect because, although the spread between the cost of equity and the earnings growth rate remains constant, next year’s dividend will increase, thereby resulting in a higher estimated stock price.\nB. stay the same. — Incorrect\nIncorrect because, although the spread between the cost of equity and the earnings growth rate remains constant, next year’s dividend will increase, thereby resulting in a higher estimated stock price.\nC. increase. — Correct\nCorrect because the formula for valuing a firm's common stock with the Gordon growth model is V0 = D0 × (1 + g) / (r – g), where\nD0 = dividend just paid\ng = expected constant growth rate in dividends (or earnings)\nr = cost of equity\nSo, if the numerator goes up (g increases) while the denominator stays the same (both r and g increase by the same amount), V0 increases.", "ko": "V0 = D0 × (1 + g) / (r − g).\nr과 g가 똑같이 50 bps 오르면 분모 (r − g)는 그대로다: 11.5% − 8.5% = 3%.\n하지만 분자 D1 = D0 × (1 + g)는 g가 커진 만큼 커진다 → V0 증가.\n숫자로: D0 = 3.20 × 0.45 = 1.44\n기존: 1.44 × 1.08 / 0.03 = $51.84\n변경: 1.44 × 1.085 / 0.03 = $52.08 → 소폭 상승.", "trap": "'spread (r − g)가 그대로니 가격도 그대로'가 내가 고른 답 B다. g는 분모뿐 아니라 분자(D1 = D0(1 + g))에도 들어간다는 점을 놓쳤다. 문제가 D1을 고정해 준 것이 아니라 D0에서 출발한다.", "f": "V0 = D0(1 + g) / (r − g)", "why": {"A": "분모는 변하지 않고 분자가 커지므로 가격이 내려갈 수 없다.", "B": "(r − g)는 같지만 D1 = D0(1 + g)가 커진다 → 가격은 오른다."}, "orig": "Mock 6 Session 2 Q28", "conf": false, "my": "B"}, {"id": "mock6-Q73", "src": "정답", "module": "FI", "tag": "ABS credit analysis 접근법", "vig": 18, "stem": "Based on the characteristics of the receivables backing the ABS, which credit analysis approach is most appropriate?", "opts": {"A": "Loan-by-loan", "B": "Portfolio-based", "C": "Statistics-based"}, "ans": "C", "en": "A. Loan-by-loan — Incorrect\nIncorrect because a loan-by-loan approach is more appropriate for non-granular, heterogeneous portfolios. The ABS in the fund portfolio is homogeneous and granular because there are many relatively small receivables in the pool. A loan-by-loan approach would be inefficient because of the large number of basically similar loans.\nB. Portfolio-based — Incorrect\nIncorrect because short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans. If the risk horizon were medium-term, a portfolio-based approach would be more appropriate because the portfolio is not static but changes over time.\nC. Statistics-based — Correct\nCorrect because short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans. The credit card ABS is granular, with many small loans relative to the size of the total portfolio. The credit card receivables are also homogeneous, and the risk horizon is short-term. Investors in this type of ABS will base their probability of default on the mean default probability, recovery rate, and variance of a portfolio of borrowers reflecting the distribution of FICO scores within the pool rather than conducting an analysis of individual borrowers. These statistics are sufficient to gauge the key credit metrics of the loan pool and therefore point to a statistics-based approach for credit analysis.", "ko": "pool의 성격 두 가지(granularity, homogeneity)와 horizon으로 접근법을 고른다.\n· statistics-based: granular(작은 receivable이 아주 많음) + homogeneous + short-term → 개별 차주를 보지 않고 pool의 평균 default probability, recovery rate, variance 같은 통계로 분석. 예: credit card receivables(FICO score 분포 사용).\n· portfolio-based: granular·homogeneous하지만 medium-term이라 pool이 static하지 않고 시간에 따라 바뀔 때. 예: auto loan ABS.\n· loan-by-loan: non-granular(discrete), heterogeneous → 대출 하나하나 분석. 예: CMBS, 소수의 큰 대출.\n지문: 다수의 short-term credit card receivables, homogeneous, 각각이 pool 대비 작음 → statistics-based.", "trap": "statistics-based와 portfolio-based를 가르는 것은 horizon이다. short-term = statistics-based, medium-term(변하는 pool) = portfolio-based.", "f": "", "why": {"A": "loan-by-loan은 non-granular·heterogeneous pool용이다. 비슷한 소액 receivable이 많은 pool에는 비효율적.", "B": "portfolio-based는 medium-term으로 pool 구성이 변할 때다. 여기는 short-term receivables."}, "orig": "Mock 6 Session 2 Q29", "conf": false}, {"id": "mock6-Q74", "src": "정답", "module": "FI", "tag": "credit transition matrix로 expected return", "vig": 18, "stem": "Based on the 1-year corporate transition matrix, the expected 1-year total return on the Valisker bond is closest to:", "opts": {"A": "2.48%.", "B": "2.56%.", "C": "2.65%."}, "ans": "A", "en": "A. 2.48%. — Correct\nCorrect because the expected return on the bond over the next year is its YTM minus the expected percentage change in the bond value over the year. First, we must calculate the expected percentage price change for each possible transition as the product of the modified duration and the change in the spread:\nFrom AA to AAA: –2.82 × (0.65% – 0.95%) = +0.846%\nFrom AA to A: –2.82 × (1.20% – 0.95%) = –0.705%\nFrom AA to BBB: –2.82 × (1.80% – 0.95%) = –2.397%\nFrom AA to BB: –2.82 × (3.60% – 0.95%) = –7.473%\nThe probabilities of migration can now be used to calculate the expected percentage change in the bond value over the year. The expected percentage change in bond value for an AA-rated corporate bond is found by multiplying each expected percentage price change by its respective credit transition probability found in the row associated with the AA rating and summing the products:\n(0.02 × 0.846%) + (0.88 × 0%) + (0.08 × –0.705%) + (0.014 × –2.397%) + (0.006 × –7.473%) = –0.11788%\nTherefore, the expected return on the bond over the next year is its YTM minus 0.11788%:\n2.60% – 0.11788% = 2.48212% ~ 2.48%\nB. 2.56%. — Incorrect\nIncorrect because this fails to incorporate the modified duration into the equation. The expected return on the bond over the next year is its YTM minus the expected percentage change in the bond value over the year. First, we must calculate the expected percentage price change for each possible transition as the product of the modified duration and the change in the spread, but this answer only takes into account the change in spread:\nFrom AA to AAA: –(0.65% – 0.95%) = +0.30%\nFrom AA to A: –(1.20% – 0.95%) = –0.25%\nFrom AA to BBB: –(1.80% – 0.95%) = –0.85%\nFrom AA to BB: –(3.60% – 0.95%) = –2.65%\nThe probabilities of migration can now be used to calculate the expected percentage change in the bond value over the year. The expected percentage change in bond value for an AA-rated corporate bond is found by multiplying each expected percentage price change by its respective credit transition probability found in the row associated with the AA rating and summing the products:\n(0.02 × 0.30%) + (0.88 × 0%) + (0.08 × –0.25%) + (0.014 × –0.85%) + (0.006 × –2.65%) = –0.0418%\nTherefore, the expected return on the bond over the next year is its YTM minus 0.0418%:\n2.60% – 0.0418% = 2.5582% ~ 2.56%\nC. 2.65%. — Incorrect\nIncorrect because this uses the probabilities from the AA column in the matrix when it should use the probabilities from the AA row. The expected return on the bond over the next year is its YTM minus the expected percentage change in the bond value over the year. First, we must calculate the expected percentage price change for each possible transition as the product of the modified duration and the change in the spread:\nFrom AA to AAA: –2.82 × (0.65% – 0.95%) = +0.846%\nFrom AA to A: –2.82 × (1.20% – 0.95%) = –0.705%\nFrom AA to BBB: –2.82 × (1.80% – 0.95%) = –2.397%\nFrom AA to BB: –2.82 × (3.60% – 0.95%) = –7.473%\nThe probabilities of migration can now be used to calculate the expected percentage change in the bond value over the year. The expected percentage change in bond value for an AA-rated corporate bond is found by multiplying each expected percentage price change by its respective credit transition probability and summing the products. This incorrectly uses the probabilities found in the column associated with the AA rating, rather than the row:\n(0.086 × 0.846%) + (0.88 × 0%) + (0.015 × –0.705%) + (0.005 × –2.397%) + (0.000 × –7.473%) = 0.0502%\nTherefore, the expected return on the bond over the next year would be its YTM plus 0.0502%:\n2.60% + 0.0502% = 2.6502% ~ 2.65%", "ko": "expected return ≈ YTM + Σ 확률 × (−ModDur × Δspread). 확률은 'From AA' 행(row)에서 가져온다.\nspread 변화(AA 0.95% 기준)와 가격 변화:\n→ AAA: −2.82 × (0.65% − 0.95%) = +0.846%, 확률 2.0%\n→ AA: 0, 확률 88.0%\n→ A: −2.82 × (1.20% − 0.95%) = −0.705%, 확률 8.0%\n→ BBB: −2.82 × (1.80% − 0.95%) = −2.397%, 확률 1.4%\n→ BB: −2.82 × (3.60% − 0.95%) = −7.473%, 확률 0.6%\n기대 가격 변화 = 0.02 × 0.846 + 0.08 × (−0.705) + 0.014 × (−2.397) + 0.006 × (−7.473) = 0.0169 − 0.0564 − 0.0336 − 0.0448 = −0.118%\nexpected return = 2.60% − 0.118% = 2.48%.\ndowngrade 쪽 spread 변화가 upgrade보다 훨씬 커서(비대칭) 기대 return은 YTM보다 낮아진다.", "trap": "확률은 열(column)이 아니라 행(row, 'From AA')에서 읽는다. modified duration을 곱하는 것도 잊지 말 것.", "f": "E(R) ≈ YTM + Σ P(i) × [−ModDur × (spread_i − spread_current)]", "why": {"B": "modified duration을 곱하지 않고 spread 변화만 가중평균: 2.60% − 0.042% = 2.56%.", "C": "AA 열(column)의 확률(8.6%, 1.5%, 0.5%, 0%)을 사용: 2.60% + 0.050% = 2.65%."}, "orig": "Mock 6 Session 2 Q30", "conf": false}, {"id": "mock6-Q75", "src": "정답", "module": "FI", "tag": "CDS upfront premium", "vig": 18, "stem": "The upfront premium the fund would receive for purchasing the CDS protection on Gonk Industries is closest to:", "opts": {"A": "$200,000.", "B": "$225,000.", "C": "$250,000."}, "ans": "B", "en": "A. $200,000. — Incorrect\nIncorrect because this calculates the upfront premium by multiplying the credit spread by the notional value:\nUpfront premium = 4.0% × $5,000,000 = $200,000\nB. $225,000. — Correct\nCorrect because an approximation for the upfront premium is (Credit spread – Fixed coupon rate) × Duration of the CDS. To buy 5-year CDS protection, an investor would have to pay a 500 bps coupon plus the present value of the difference between that coupon and the current market spread (400 bps). In this case, the upfront premium is approximately:\nUpfront premium % ≈ (Credit spread – Fixed coupon) × Duration = (4.0% – 5.0%) × 4.5 = –4.5%\nThe upfront premium is then converted to a dollar value:\nUpfront premium % × Notional = –4.5% × $5,000,000 = –$225,000\nBecause the company’s credit spread is less than the fixed coupon, the protection seller must pay the upfront premium to the protection buyer.\nC. $250,000. — Incorrect\nIncorrect because this calculates the upfront premium using maturity instead of duration. An approximation for the upfront premium is (Credit spread – Fixed coupon rate) × Duration of the CDS. To buy 5-year CDS protection, an investor would have to pay a 500 bps coupon plus the present value of the difference between that coupon and the current market spread (400 bps). In this case, the approximate upfront premium is incorrectly calculated using maturity instead of duration:\nUpfront premium % ≈ (Credit spread – Fixed coupon) × Maturity = (4.0% – 5.0%) × 5.0 = –5.0%\nThe upfront premium is then converted to a dollar value:\nUpfront premium % × Notional = –5.0% × $5,000,000 = –$250,000", "ko": "upfront premium(%) ≈ (credit spread − fixed coupon) × duration\n= (4.0% − 5.0%) × 4.5 = −4.5%\n금액 = −4.5% × $5,000,000 = −$225,000.\n부호 해석: protection buyer는 표준 coupon 5%를 내는데 실제 공정한 spread는 4%다 → 매년 1%씩 더 내는 셈 → 그 PV(1% × duration 4.5)를 seller가 buyer에게 upfront로 돌려준다. 그래서 buyer인 fund가 $225,000를 '받는다'.\n반대로 spread > coupon이면 buyer가 upfront를 낸다.\n같은 내용: CDS price ≈ 100 + (coupon − spread) × duration = 104.5 per 100.", "trap": "곱하는 것은 maturity(5년)가 아니라 duration(4.5)이다. spread < coupon이면 buyer가 받는 쪽이다.", "f": "Upfront premium ≈ (Credit spread − Fixed coupon) × Duration × Notional", "why": {"A": "4.0% × $5m = $200,000: credit spread를 notional에 그냥 곱했다.", "C": "duration 대신 maturity 5년 사용: 1% × 5 × $5m = $250,000."}, "orig": "Mock 6 Session 2 Q31", "conf": false}, {"id": "mock6-Q76", "src": "정답", "module": "FI", "tag": "CDS payout과 cheapest-to-deliver", "vig": 18, "stem": "The cash settlement amount for the fund from the Gonk Industries CDS is closest to:", "opts": {"A": "$3,000,000.", "B": "$3,500,000.", "C": "$4,000,000."}, "ans": "B", "en": "A. $3,000,000. — Incorrect\nIncorrect because the 5-year senior unsecured bond is not the cheapest-to-deliver and therefore will not be used to determine the recovery rate and subsequent payout amount. The payoff of the CDS is determined by the cheapest-to-deliver obligation, which is the debt instrument that can be purchased and delivered at the lowest cost but has the same seniority as the reference obligation. This response incorrectly assumes that the reference bond for the CDS, which is the 5-year bond, must be used to calculate the payout amount.\nLoss given default (LGD) = 1 – Recovery rate (%) = 1 – 40% = 60%\nPayout amount = LGD × Notional = 60% × $5,000,000 = $3,000,000\nB. $3,500,000. — Correct\nCorrect because the cheapest-to-deliver, or lowest-priced, instrument is the 7-year senior unsecured bond trading at 30% of par. Although the 3-year bond trades at a lower price, it is subordinated and, therefore, does not qualify for coverage under the CDS. Note that, even though the reference bond for the CDS is the 5-year bond, the fund will receive payment on the CDS based on the cheapest-to-deliver obligation regardless of maturity. Any debt obligation issued by the borrower that is ranked equal to or higher than the reference obligation with respect to the priority of claims is covered.\nLoss given default (LGD) = 1 – Recovery rate (%) = 1 – 30% = 70%\nPayout amount = LGD × Notional = 70% × $5,000,000 = $3,500,000\nC. $4,000,000. — Incorrect\nIncorrect because, although the 3-year bond trades at a lower price relative to par, it is subordinated and, therefore, does not qualify for coverage under the CDS. The payoff of the CDS is determined by the cheapest-to-deliver obligation, which is the debt instrument that can be purchased and delivered at the lowest cost but has the same seniority as the reference obligation. This response incorrectly assumes the cheapest-to-deliver bond is the lowest-priced obligation regardless of seniority.\nLoss given default (LGD) = 1 – Recovery rate (%) = 1 – 20% = 80%\nPayout amount = LGD × Notional = 80% × $5,000,000 = $4,000,000", "ko": "CDS payout은 reference obligation 자체가 아니라 cheapest-to-deliver(CTD) obligation의 가격으로 정해진다. CTD = reference obligation과 같은 seniority(pari passu) 이상인 채무 중 가장 싼 것. maturity는 상관없다.\nreference obligation = 5-year senior unsecured. 후보:\n· 3-year subordinated(20%): seniority가 낮아 대상 아님\n· 5-year senior unsecured(40%)\n· 7-year senior unsecured(30%) ← 같은 seniority 중 가장 쌈 = CTD\nrecovery rate = 30% → payout ratio = 1 − 30% = 70%\npayout = 70% × $5,000,000 = $3,500,000.\n참고: fund가 실제 보유한 것도 7-year bond(30%)라 loss 70%가 정확히 hedge된다.", "trap": "두 가지 함정: reference obligation(5-year, 40%)을 그대로 쓰는 것, 가장 싼 bond(3-year subordinated, 20%)를 seniority 확인 없이 쓰는 것.", "f": "Payout = (1 − recovery rate of CTD) × Notional", "why": {"A": "reference obligation인 5-year bond(40%)로 계산: 60% × $5m. CTD는 더 싼 7-year senior bond다.", "C": "3-year bond(20%)는 subordinated라 CDS 대상이 아니다. 80% × $5m는 틀린 계산."}, "orig": "Mock 6 Session 2 Q32", "conf": false}, {"id": "mock6-Q77", "src": "정답", "module": "DER", "tag": "binomial model로 interest rate call option 가치 (expectations approach)", "vig": 19, "stem": "The value (in HUF) of the interest rate call option position is closest to:", "opts": {"A": "1,951,000.", "B": "2,164,000.", "C": "4,330,000."}, "ans": "B", "en": "A. 1,951,000. — Incorrect\nIncorrect because the c^(–) value is mistakenly subtracted instead of added in the calculation of the value of the interest rate call option position.\nIncorrect c = PV[πc^(+) – (1 – π)c^(–)]\nIncorrect c = 0.99108 [0.50 × 4,152,800 – 0.50 × 214,800] = 1,951,436.52 ≈ 1,951,000\nB. 2,164,000. — Correct\nCorrect because the value of the interest rate call option position is HUF2,164,000. This is done using the two-period binomial model by calculating the call value at each of the nodes using the expectations approach starting from time step 2 and moving backwards until time 0. Note: The values of c^(+) and c^(–) (fair call option value when an up move and when down move occur) at time step 1 is provided.\nc = PV[πc^(+) + (1 – π)c^(–)]\nwhere:\nPV = present value calculated using the 1-year discount factor 0.99108\nπ = risk-neutral probability of an up move = 50%\nc^(+) = fair value of call option value measured at Time 1 when an up move occurs = 4,152,800\nc^(–) = fair value of call option value measured at Time 1 when a down move occurs = 214,800\nc = 0.99108[0.50 × 4,152,800 + 0.50 × 214,800] = 2,164,320.50 ≈ 2,164,000\nC. 4,330,000. — Incorrect\nIncorrect because the risk-neutral probability is not applied to the c^(+) and c^(–) values in the calculation of the value of the interest rate call option position.\nIncorrect c = PV[c^(+) + c^(–)]\nIncorrect c = 0.99108[4,152,800 + 214,800] = 4,328,641.008 ≈ 4,330,000", "ko": "expectations approach: 오늘 가치 = PV[risk-neutral 확률로 가중한 다음 node 가치].\nc = PV[π × c(+) + (1 − π) × c(−)]\n= 0.99108 × [0.5 × 4,152,800 + 0.5 × 214,800]\n= 0.99108 × 2,183,800 = HUF 2,164,321 ≈ 2,164,000.\nTime 1의 두 node 가치(c+, c−)가 이미 주어졌으므로 마지막 한 단계만 하면 된다. 할인은 1-year discount factor를 곱한다(rate로 나누는 것과 같음).\ninterest rate option에서는 risk-neutral probability를 보통 50%로 고정하고, 대신 node마다 rate가 다르다.", "trap": "두 node 값을 확률(0.5)로 가중해 '더한다'. 빼거나 가중 없이 더하면 보기 A, C가 나온다.", "f": "c = DF × [π c(+) + (1 − π) c(−)]", "why": {"A": "c(−)를 더하지 않고 뺌: 0.99108 × (2,076,400 − 107,400) = 1,951,000.", "C": "확률 0.5를 곱하지 않고 두 값을 그대로 더함: 0.99108 × 4,367,600 = 4,330,000."}, "orig": "Mock 6 Session 2 Q33", "conf": false}, {"id": "mock6-Q78", "src": "정답", "module": "DER", "tag": "FRA no-arbitrage fixed rate (1 × 7)", "vig": 19, "stem": "The no-arbitrage fixed rate on Knizek's US interest rate FRA is closest to:", "opts": {"A": "0.71%.", "B": "0.91%.", "C": "1.12%."}, "ans": "B", "en": "A. 0.71%. — Incorrect\nIncorrect because the calculation is mistakenly based on the 6-month reference rate instead of the 7-month reference rate.\nFRA0 = {[1 + LTtT]/[1 + Lhth] – 1}/tm\nFRA0 = {[1 + 0.0081*(180/360)]/[1 + 0.0060*(30/360)] – 1}/(180/360)\nFRA0 =([1.00405/1.0005]-1)/(180/360)\nFRA0 = 0.007096 ≈ 0.0071 ≈ 0.71%\nB. 0.91%. — Correct\nCorrect because Knizek needs to be short a 1 x 7 FRA, which is calculated using the 1-month and 7-month reference rates as follows:\nFRA0 = {[1 + LTtT]/[1 + Lhth] – 1}/tm\nwhere;\nFRA0 = fixed 1 × 7 FRA rate\nLT = L(210) = benchmark spot rate until underlying matures = 0.87%\ntT = period until underlying maturity = 210/360\nLh = L(30) = benchmark spot rate until FRA expiration = 0.60%\nth = period until FRA expiration = 30/360\ntm = contract period of the FRA = 180/360\nFRA0 = {[1 + 0.0087*(210/360)]/[1 + 0.0060*(30/360)] – 1}/(180/360)\nFRA0 =([1.005075/1.0005]-1)/(180/360)\nFRA0 = 0.009145 ≈ 0.0091 ≈ 0.91%\nC. 1.12%. — Incorrect\nIncorrect because the reference rates are mistakenly multiplied instead of divided.\nFRA0 = {[1 + LTtT]×[1 + Lhth] – 1}/tm\nFRA0 = {[1 + 0.0087*(210/360)]×[1 + 0.0060*(30/360)] – 1}/(180/360)\nFRA0 =([1.005075×1.0005]-1)/(180/360)\nFRA0 = 0.011155 ≈ 0.0112 ≈ 1.12%", "ko": "① 어떤 FRA인가: 1개월 뒤에 시작하는 6-month rate를 고정 → 1 × 7 FRA(expiry 30일, underlying 종료 210일). 필요한 rate는 1-month(0.60%)와 7-month(0.87%)다. 6-month rate(0.81%)는 distractor.\n② 식(단리, 360일 기준): 7개월 투자 = 1개월 투자 후 FRA rate로 6개월 재투자.\nFRA = {[1 + L(210) × 210/360] / [1 + L(30) × 30/360] − 1} × (360/180)\n= {[1 + 0.0087 × 0.5833] / [1 + 0.0060 × 0.0833] − 1} × 2\n= (1.005075 / 1.0005 − 1) × 2 = 0.004573 × 2 = 0.91%.\n방향: Knizek은 1개월 뒤 받은 돈을 6개월간 투자(lend)할 예정이라 rate 하락이 위험 → FRA에서 fixed를 받는 쪽(short FRA, receive-fixed).", "trap": "'6-month rate를 lock in'한다고 표의 6-month rate(0.81%)를 쓰면 안 된다. 긴 쪽은 expiry + 6개월 = 7-month rate다.", "f": "FRA(h × T) = {[1 + L_T × t_T] / [1 + L_h × t_h] − 1} / t_m", "why": {"A": "긴 쪽에 7-month 대신 6-month rate(0.81%, 180일)를 사용 → 0.71%.", "C": "두 항을 나누지 않고 곱함: (1.005075 × 1.0005 − 1) × 2 = 1.12%."}, "orig": "Mock 6 Session 2 Q34", "conf": true}, {"id": "mock6-Q79", "src": "정답", "module": "DER", "tag": "reverse carry arbitrage (forward price가 낮을 때)", "vig": 19, "stem": "To exploit the arbitrage opportunity on the Polish government bond, in addition to the first step, Knizek should:", "opts": {"A": "borrow at the risk-free rate and buy the underlying bond.", "B": "borrow at the risk-free rate and short sell the underlying bond.", "C": "short sell the underlying bond and invest the proceeds at the risk-free rate."}, "ans": "C", "en": "A. borrow at the risk-free rate and buy the underlying bond. — Incorrect\nIncorrect because the arbitrage transactions when the forward price is too low involve short selling (not buying) the underlying bond and investing (not borrowing) the proceeds at the risk-free rate.\nB. borrow at the risk-free rate and short sell the underlying bond. — Incorrect\nIncorrect because short selling of the underlying bond is a necessary step in the reverse carry arbitrage strategy (when the forward price is below its no arbitrage value), but the proceeds should be invested not borrowed.\nC. short sell the underlying bond and invest the proceeds at the risk-free rate. — Correct\nCorrect because as the forward price is below its no-arbitrage value, Knizek can implement a reverse carry arbitrage strategy to obtain a risk-free profit. The arbitrage transactions when the forward price is too low—that is, F0 < FV(S0)—involve the following three steps:\nStep 1: Buy the forward contract on the underlying\nStep 2: Sell the underlying short\nStep 3: Lend the short sale proceeds", "ko": "forward price가 no-arbitrage 값보다 낮다(F0 < FV(S0)) → forward가 싸다 → 싼 것을 사고 비싼 것을 판다 = reverse carry arbitrage.\nStep 1: forward를 산다(long forward) ← 이미 한 '첫 단계'\nStep 2: underlying bond를 short sell\nStep 3: short sale 대금을 risk-free rate로 invest(lend)\nexpiration에 forward로 bond를 싸게 인수해 short position을 갚고, 투자 원리금과의 차액이 risk-free profit.\n반대 경우(F0가 너무 높음) = carry arbitrage: forward를 팔고, borrow해서 underlying을 사서 보유.", "trap": "short sell을 하면 cash가 '들어온다'. 그 돈은 빌리는 것이 아니라 invest한다. borrow는 underlying을 사는 carry arbitrage 쪽이다.", "f": "", "why": {"A": "borrow + buy underlying은 forward가 비쌀 때(short forward와 짝)의 carry arbitrage다.", "B": "short sell은 맞지만 그 대금은 borrow가 아니라 risk-free rate로 invest해야 한다."}, "orig": "Mock 6 Session 2 Q35", "conf": false}, {"id": "mock6-Q80", "src": "정답", "module": "DER", "tag": "forward contract의 중간 시점 가치", "vig": 19, "stem": "The fair value (in PLN) of Knizek's government bond forward position after three months is closest to:", "opts": {"A": "–114,800.", "B": "–105,200.", "C": "+114,800."}, "ans": "A", "en": "A. –114,800. — Correct\nCorrect because the fair value of a bond forward from Knizek's perspective is the present value of the difference between the two forward prices calculated as follows:\nVt = PV[Ft – F0]\nWhere;\nVt = fair value at time t (three months till expiry)\nPV = present value\nFt = forward value at time t = 108.15\nF0 = original forward value = 109.30\nVt = [108.15 – 109.30]/(1+0.0065)^((3/12)) = – 1.148139\nBecause forward price is quoted as percentage of par – 1.148139 is given per 100 PLN.\nThus the next step is to multiply – 0.01148139 by 100,000 PLN and by 100 contracts = –114,813.90 ≈ –114,800\nB. –105,200. — Incorrect\nIncorrect because the new price is mistakenly divided by the original price and multiplied by contract value and by the number of contracts.\nIncorrect Vt = Ft/F0 – 1 = 108.15 / 109.3 – 1 = – 0.0105215\n– 0.0105215 × 100,000 x 100 = – 105,215.00 ≈ –105,200\nC. +114,800. — Incorrect\nIncorrect because the the forward value at time t is mistakenly subtracted from original forward value in the formula.\nIncorrect Vt = PV[F0 – Ft ] = [109.30 – 108.15]/(1+0.0065)^(3/12) = +1.148139\n1.148139 × 100,000 x 100 = +114,813.90 PLN ≈ +114,800.00 PLN", "ko": "long forward의 가치(expiration 전) = PV[현재 forward price − 처음 계약한 forward price].\nV = (Ft − F0) / (1 + r)^(잔존 기간)\n= (108.15 − 109.30) / (1.0065)^(3/12) = −1.15 / 1.00162 = −1.1481 (par 100당)\n금액: −1.1481% × PLN 100,000 × 100 contracts = −PLN 114,814 ≈ −114,800.\nKnizek은 109.30에 사기로 했는데 지금 새로 계약하면 108.15에 살 수 있다 → long에게 loss.\n잔존 기간은 6개월 − 3개월 = 3개월이라 3-month rate(0.65%)로 할인한다. long position을 청산하려면 팔아야 하므로 bid price(108.15)를 쓴다.", "trap": "부호(long이므로 Ft − F0)와 할인(남은 3개월)을 둘 다 챙긴다. 가격 비율(Ft/F0 − 1)로 계산하지 않는다.", "f": "V_t(long) = (F_t − F_0) / (1 + r)^(T − t)", "why": {"B": "108.15 / 109.30 − 1 = −1.052%로 비율 계산을 하고 할인도 하지 않았다.", "C": "F0 − Ft로 순서를 뒤집었다. +114,800은 short position의 가치."}, "orig": "Mock 6 Session 2 Q36", "conf": false}, {"id": "mock6-Q81", "src": "정답", "module": "AI", "tag": "appraisal-based real estate index의 문제 (appraisal lag)", "vig": 20, "stem": "Friso's choice of real estate index will most likely result in:", "opts": {"A": "understated volatility of returns.", "B": "an underestimated Sharpe ratio.", "C": "higher correlation of returns with the rest of the portfolio."}, "ans": "A", "en": "A. understated volatility of returns. — Correct\nCorrect because an appraisal-based index tends to smooth returns and hence understate volatility as a result of the appraisal lag. The appraisal lag is due to the fact that many properties are not appraised every quarter, so some of the information in the index is out of date. This lag is particularly pronounced during sudden shifts in the market. If the purpose of the index is for comparison with other asset classes that are publicly traded, however, appraisal lag is more of an issue. Appraisal lag tends to smooth the index, meaning that it has less volatility. Thus, appraisal-based indexes may underestimate the volatility of real estate returns.\nB. an underestimated Sharpe ratio. — Incorrect\nIncorrect because the smoothing effect of the appraisal lag results in lower volatility and therefore an overestimated Sharpe ratio.\nThe smoothing effect will also overstate Sharpe ratios, which is problematic if the index is used in asset allocation models to determine how much of a portfolio should be allocated to real estate versus other asset classes.\nC. higher correlation of returns with the rest of the portfolio. — Incorrect\nIncorrect because the use of the appraisal-based index will lead to lower correlation of returns. An appraisal-based index relies on appraisals to estimate how the value of a portfolio's properties or the real estate market in general is changing over time. As a result, it suffers from the appraisal lag, when appraised values tend to lag during sudden shifts in the market or because all properties in the index may not be appraised every quarter. Appraisal lag tends to smooth the index, meaning that it has less volatility. Because of the lag in appraisal-based real estate indexes, they will also tend to have a lower correlation with other asset classes.", "ko": "appraisal-based index는 실제 거래가 아니라 감정평가 값을 쓴다. 모든 property를 매 분기 평가하지 않고 평가 자체도 시장 변화를 늦게 반영한다(appraisal lag) → return이 smoothing된다.\nsmoothing의 세 가지 결과:\n① volatility가 understated → A가 맞다.\n② Sharpe ratio는 분모(volatility)가 작아져 overstated.\n③ 다른 asset class와의 correlation이 실제보다 낮게 나온다(시차 때문에 같이 움직이지 않는 것처럼 보임).\n→ mean–variance optimization에 넣으면 real estate가 '저위험·저상관'으로 보여 allocation이 과다해진다. 해결: index를 unsmooth하거나 transaction-based index(repeat sales index, hedonic index)를 사용.", "trap": "세 결과의 방향을 한 묶음으로 외운다: volatility ↓, Sharpe ratio ↑, correlation ↓. 보기 B, C는 방향이 반대다.", "f": "", "why": {"B": "volatility가 과소 추정되므로 Sharpe ratio는 overestimated된다.", "C": "appraisal lag 때문에 다른 asset class와의 correlation은 더 낮게 나온다."}, "orig": "Mock 6 Session 2 Q37", "conf": false}, {"id": "mock6-Q82", "src": "정답", "module": "AI", "tag": "REIT vs REOC", "vig": 20, "stem": "Compared to Rainfall Real Estate, Perpetua Properties most likely has:", "opts": {"A": "a higher effective tax rate.", "B": "a higher dividend payout ratio.", "C": "greater flexibility to retain earnings."}, "ans": "B", "en": "A. a higher effective tax rate. — Incorrect\nIncorrect because Perpetua is a REIT and these vehicles benefit from tax exemptions and are allowed to deduct dividends paid from income, which effectively exempts REITs from corporate income tax in many countries.\nB. a higher dividend payout ratio. — Correct\nCorrect because Perpetua is a REIT, which is required to distribute 90-100% of their taxable income to shareholders as opposed to REOCs, which can retain ea

ared and a higher adjusted R-squared.", "B": "higher R-squared and a lower adjusted R-squared.", "C": "higher R-squared and a higher adjusted R-squared."}, "ans": "C", "en": "A. lower R-squared and a higher adjusted R-squared. — Incorrect\nIncorrect because as independent variables are added to the model, R^2 will increase or will stay the same, but it will not decrease.\nAlso, the following are two key observations about [adjusted] R^2 when adding a new variable to a regression:\n■ If the coefficient’s t-statistic > |1.0|, then [adjusted] R^2 increases.\n■ If the coefficient’s t-statistic < |1.0|, then [adjusted] R^2 decreases.\nThe t-statistic for QUICK is 1.9204, therefore the adjusted R^2for Model 3 will be higher than the respective metric for Model 2, although the p-value for QUICK is > 0.05, indicating that QUICK is not significant at the 5% level.\nB. higher R-squared and a lower adjusted R-squared. — Incorrect\nIncorrect because as independent variables are added to the model, R^2 will increase or will stay the same, but it will not decrease.\nAlso, the following are two key observations about [adjusted] R^2 when adding a new variable to a regression:\n■ If the coefficient’s t-statistic > |1.0|, then [adjusted] R^2 increases.\n■ If the coefficient’s t-statistic < |1.0|, then [adjusted] R^2 decreases.\nThe t-statistic for QUICK is 1.9204, therefore the adjusted R^2for Model 3 will be higher than the respective metric for Model 2, although the p-value for QUICK is > 0.05, indicating that QUICK is not significant at the 5% level.\nC. higher R-squared and a higher adjusted R-squared. — Correct\nCorrect because as independent variables are added to the model, R^2 will increase or will stay the same, but it will not decrease.\nAlso, the following are two key observations about [adjusted] R^2 when adding a new variable to a regression:\n■ If the coefficient’s t-statistic > |1.0|, then [adjusted] R^2 increases.\n■ If the coefficient’s t-statistic < |1.0|, then [adjusted] R^2 decreases.\nThe t-statistic for QUICK is 1.9204, therefore the adjusted R^2for Model 3 will be higher than the respective metric for Model 2.", "ko": "① R-squared: independent variable을 추가하면 올라가거나 그대로이고 절대 내려가지 않는다 → Model 3가 더 높다.\n② adjusted R-squared: 추가한 변수의 |t-statistic|이 1보다 크면 올라가고, 1보다 작으면 내려간다. 기준은 통계적 유의성(p < 0.05)이 아니라 |t| > 1이다.\nQUICK의 t-statistic = 1.9204 > 1 → adjusted R-squared도 올라간다.\np-value 0.0558 > 0.05라 QUICK은 5% 수준에서 유의하지 않지만, 그것과 adjusted R-squared의 방향은 별개다.", "trap": "'p-value 0.0558 → 유의하지 않음 → adjusted R-squared ↓'로 생각하면 B(내가 고른 답)를 고른다. adjusted R-squared의 기준선은 |t| = 1이지 critical value(약 1.96)가 아니다.", "f": "Adjusted R² = 1 − [(n − 1) / (n − k − 1)] × (1 − R²); 추가 변수의 |t| > 1 → adjusted R² ↑", "why": {"A": "변수를 추가하면 R-squared는 낮아질 수 없다.", "B": "QUICK의 t = 1.92 > 1이므로 adjusted R-squared는 올라간다. 유의하지 않아도(p = 0.0558) 올라갈 수 있다."}, "orig": "Mock 6 Session 1 Q27", "conf": true, "my": "B"}, {"id": "mock6-Q28", "src": "오답", "module": "QM", "tag": "residual plot: conditional heteroskedasticity와 F-test", "vig": 6, "stem": "The most appropriate conclusion to draw from the residual plot for Model 4 is that:", "opts": {"A": "the model suffers from unconditional heteroskedasticity.", "B": "there is a non-linear relationship between ROE and SALES.", "C": "the F-test for the overall regression significance is unreliable."}, "ans": "C", "en": "A. the model suffers from unconditional heteroskedasticity. — Incorrect\nIncorrect because unconditional heteroskedasticity occurs when the error variance is not correlated with the regression’s independent variables. Although it violates a linear regression assumption, this form of heteroskedasticity creates no major problems for statistical inference. From the residual plot it is clear that the variance of residuals increases as SALES increase. Therefore, the error variance is correlated with the regression's independent variable and the model suffers from conditional, not unconditional, heteroskedasticity.\nB. there is a non-linear relationship between ROE and SALES. — Incorrect\nIncorrect because the plot of regression residuals against a feature does not indicate the nature of the relationship between the target and the feature. We want residuals to behave in an independent manner compared to what the model predicts. Assumptions of multiple regression include Homoskedasticity: The variance of the regression residuals is the same for all observations and Independence of errors: The observations are independent of one another. This implies the regression residuals are uncorrelated across observations.\nC. the F-test for the overall regression significance is unreliable. — Correct\nCorrect because from the residual plot it is clear that the variance of residuals increases as SALES increase. When the error variance is correlated with (conditional on) the values of the independent variables, there is conditional heteroskedasticity. When errors are conditional heteroskedastic, the F-test for the overall regression significance is unreliable because the MSE becomes a biased estimator of the true population variance. Conditional heteroskedasticity is problematic for statistical inference—when the error variance is correlated with (conditional on) the values of the independent variables. If there is conditional heteroskedasticity in the estimated model, we tend to find significant relationships where none actually exist and commit more Type I errors (rejecting the null hypothesis when it is actually true).", "ko": "residual plot에서 SALES가 커질수록 residuals의 퍼짐(variance)이 커진다 → error variance가 independent variable과 상관 → conditional heteroskedasticity.\n결과: coefficient 추정치 자체는 unbiased지만 standard errors가 틀린다(보통 과소 추정) → t-statistics가 부풀려져 Type I error ↑. 또 MSE가 true variance의 biased estimator가 되어 F-test(overall significance)도 unreliable → C.\nunconditional heteroskedasticity는 error variance가 변하긴 하지만 independent variable과 상관이 없는 경우로, inference에 큰 문제가 없다. plot에서는 variance가 SALES에 따라 체계적으로 커지므로 conditional이다.\n검정은 Breusch–Pagan test, 교정은 robust(White-corrected) standard errors.", "trap": "heteroskedasticity라는 단어만 보고 A(내가 고른 답)를 고르면 틀린다. X에 따라 variance가 달라지면 'conditional', X와 무관하면 'unconditional'이다. 깔때기(funnel) 모양 = conditional.", "f": "", "why": {"A": "residual variance가 SALES와 함께 커진다 = independent variable에 conditional한 heteroskedasticity다. unconditional은 X와 상관이 없을 때.", "B": "residuals의 평균이 곡선을 그리는 것이 아니라 퍼짐만 커진다. 이 plot은 non-linearity가 아니라 variance 문제를 보여 준다."}, "orig": "Mock 6 Session 1 Q28", "conf": true, "my": "A"}, {"id": "mock6-Q29", "src": "오답", "module": "EQ", "tag": "FCFF vs FCFE 선택, 몇 stage model인지", "vig": 7, "stem": "Which of the following is the most appropriate approach to use for valuing Firm A?", "opts": {"A": "Two-stage FCFE model", "B": "Three-stage FCFE model", "C": "Three-stage FCFF model"}, "ans": "C", "en": "A. Two-stage FCFE model — Incorrect\nIncorrect because earnings growth follows a three-stage model and FCFF is preferred over FCFE when capital structure is expected to change.\nThree stages: Since Firm A's earnings will go through a period of gradual decline between the high growth phase and stable growth phase, the overall growth regime is best characterized with three stages.\nFCFF: FCFE is not appropriate when capital structure is expected to change. For Firm A, highly fluctuating amounts of net borrowing is expected due to primarily debt-financed aggressive growth strategy. Therefore, FCFF is more appropriate than FCFE.\nB. Three-stage FCFE model — Incorrect\nIncorrect because FCFE is not appropriate when capital structure is expected to change. For Firm A, highly fluctuating amounts of net borrowing is expected due to primarily debt-financed aggressive growth strategy. Therefore, FCFF is more appropriate than FCFE.\nC. Three-stage FCFF model — Correct\nCorrect because earnings growth follows a three-stage model and FCFF is preferred over FCFE when capital structure is expected to change.\nThree stages: A common model is a three-stage model with constant growth rates in Stages 1 and 3 and a declining growth rate in Stage 2. Since Firm A's earnings will go through a period of gradual decline between the high growth phase and stable growth phase, the overall growth regime is best characterized with three stages.\n1) Stage 1 (high growth stage): Next three years characterized 25%-35% annual growth\n2) Stage 2 (declining growth stage): Period where annual growth rate declines to stable growth level of 2%\n3) Stage 3 (stable growth stage): Time period where annual growth rate is stabilized at the long-term sustainable rate of 2%.\nIn addition, three-stage models are often considered to be good approximations for cash flow streams that, in reality, fluctuate from year to year. Consistently, McCormick's expectations suggest that Firm A's earnings are expected to fluctuate due to the management's aggressive growth strategy.\nFCFF: Finally, if a company’s capital structure is relatively stable, using FCFE to value equity is more direct and simpler than using FCFF. The FCFF model is often chosen, however, in two other cases: [1] A levered company with negative FCFE and [2] A levered company with a changing capital structure. For Firm A, highly fluctuating amounts of net borrowing is expected due to primarily debt-financed aggressive growth strategy. Therefore, FCFF is more appropriate than FCFE.", "ko": "두 가지를 따로 판단한다.\n① FCFF냐 FCFE냐: capital structure가 안정적이면 FCFE가 더 직접적이다. FCFF를 쓰는 두 경우는 [1] levered company with negative FCFE, [2] levered company with a changing capital structure. Firm A는 debt로 조달하는 aggressive growth strategy로 net borrowing이 3년간 크게 출렁인다 → capital structure 변화 → FCFE는 net borrowing 때문에 매년 왜곡되고 cost of equity도 leverage에 따라 계속 변한다 → FCFF.\n② 몇 stage냐: 성장 경로가 high growth(3년, 25–35%) → 'gradually declines'(전환기) → stable 2%. 중간에 점진적 하락 구간이 있으므로 three-stage.\n따라서 three-stage FCFF model.", "trap": "'과거 10년간 FCFE가 계속 양수'라는 문장은 FCFE를 고르게 하는 함정이다(내가 고른 답 B). 과거 FCFE가 양수여도 앞으로 capital structure가 변하면 FCFF를 쓴다. stage 수는 맞혔으니 FCFF/FCFE 기준만 다시 기억.", "f": "", "why": {"A": "stage 수(gradual decline 구간이 있어 three-stage)와 cash flow 종류(FCFF) 둘 다 틀렸다.", "B": "three-stage는 맞지만 net borrowing이 크게 변하는(capital structure가 변하는) 회사에는 FCFE가 부적합하다."}, "orig": "Mock 6 Session 1 Q29", "conf": true, "my": "B"}, {"id": "mock6-Q30", "src": "정답", "module": "EQ", "tag": "CFO에서 FCFE 계산", "vig": 7, "stem": "Firm B's FCFE (in $ millions) is closest to:", "opts": {"A": "425.", "B": "474.", "C": "490."}, "ans": "C", "en": "A. 425. — Incorrect\nIncorrect because this is an approximation for FCFF, not FCFE.\nFCFF = CFO – FCInv\nwhere,\nCFO: Cash flow from operations = 535\nFCInv: Investment in fixed capital = 110\nFCFF = 535 – 110 = 425\nB. 474. — Incorrect\nIncorrect because this is FCFF, not FCFE.\nFCFF = CFO + Interest expense (1 – Tax rate) – FCInv\nwhere,\nCFO: Cash flow from operations = 535\nInterest expense = 70\nTax rate = 30%\nFCInv: Investment in fixed capital = 110\nFCFF = 535 + 70 × (1 – 30%) – 110 = 474\nC. 490. — Correct\nCorrect because Free cash flow to equity (FCFE) can be calculated starting from cash flow from operations (CFO).\nFCFE = CFO – FCInv + Net borrowing\nwhere,\nCFO: Cash flow from operations = 535\nFCInv: Investment in fixed capital = 110\nNet borrowing = 65\nFCFE = 535 – 110 + 65 = 490", "ko": "CFO에서 출발하는 식:\nFCFE = CFO − FCInv + net borrowing = 535 − 110 + 65 = 490.\nFCFF = CFO + Int(1 − t) − FCInv = 535 + 70 × 0.7 − 110 = 474.\n두 식의 관계: FCFE = FCFF − Int(1 − t) + net borrowing = 474 − 49 + 65 = 490(검산).\nUS GAAP에서 CFO는 이미 interest를 뺀 금액이라, FCFE를 구할 때는 interest를 다시 건드리지 않는다. interest expense와 tax rate는 FCFF용 숫자다.", "trap": "interest expense·tax rate가 주어졌다고 FCFE 계산에 넣지 말 것. after-tax interest를 더하는 것은 FCFF다.", "f": "FCFE = CFO − FCInv + Net borrowing; FCFF = CFO + Int(1 − t) − FCInv", "why": {"A": "535 − 110 = 425: net borrowing을 더하지 않았다(FCFF의 근사치에 가깝다).", "B": "535 + 70 × 0.7 − 110 = 474는 FCFF다."}, "orig": "Mock 6 Session 1 Q30", "conf": false}, {"id": "mock6-Q31", "src": "정답", "module": "EQ", "tag": "주주와의 거래와 FCFE", "vig": 7, "stem": "Given Firm C's announced change, next year's FCFE forecast will most likely:", "opts": {"A": "decrease.", "B": "remain unchanged.", "C": "increase."}, "ans": "B", "en": "A. decrease. — Incorrect\nIncorrect because next year's FCFE will not be affected by the common stock issuance. This is because transactions between the company and its shareholders (through cash dividends, share repurchases, and share issuances) do not affect free cash flow.\nB. remain unchanged. — Correct\nCorrect because transactions between the company and its shareholders (through cash dividends, share repurchases, and share issuances) do not affect free cash flow. Transactions that involve exchanging cash flows between the firm and shareholders represent the use of FCFE whereas FCFE represents cash flows available to stockholders and is irrelevant to how firm uses its FCFE.\nC. increase. — Incorrect\nIncorrect because next year's FCFE will not be affected by the common stock issuance. This is because transactions between the company and its shareholders (through cash dividends, share repurchases, and share issuances) do not affect free cash flow.", "ko": "FCFE는 '주주에게 줄 수 있는 cash flow'이고, 회사와 shareholders 사이의 거래(cash dividends, share repurchases, share issuances)는 그 FCFE를 어떻게 쓰느냐(또는 주주에게서 받느냐)의 문제라 FCFE 자체를 바꾸지 않는다 → new common stock issuance로 FCFE forecast는 unchanged.\n대비: debt 쪽 거래는 영향을 준다. net borrowing ↑ → FCFE ↑(FCFE = CFO − FCInv + net borrowing).", "trap": "stock 발행으로 cash가 들어오니 FCFE가 늘 것 같지만, equity 거래는 FCFE 식에 없다. FCFE를 바꾸는 financing 항목은 net borrowing뿐이다.", "f": "", "why": {"A": "share issuance는 FCFE를 줄이지 않는다(주주와의 거래는 free cash flow에 영향 없음).", "C": "share issuance로 들어온 cash는 FCFE에 포함되지 않는다."}, "orig": "Mock 6 Session 1 Q31", "conf": false}, {"id": "mock6-Q32", "src": "정답", "module": "EQ", "tag": "FCFF approach에서 equity value 구하기", "vig": 7, "stem": "The intrinsic value of Firm D's equity based on FCFF approach is closest to:", "opts": {"A": "$400 million.", "B": "$475 million.", "C": "$550 million."}, "ans": "B", "en": "A. $400 million. — Incorrect\nIncorrect because the value of non-operating assets ($75 million) is mistakenly not included in the calculation:\nIntrinsic value of the equity = Value of operating assets – Market value of debt – Market value of preferred stock\nwhere,\nValue of operating assets = present value of future FCFF = $800 million\nMarket value of debt = $250 million\nMarket value of preferred stock = $150 million\nIntrinsic value of the equity = 800 – 250 – 150 = $400 million\nB. $475 million. — Correct\nCorrect because the intrinsic value of Firm D's equity based on the FCFF approach can be calculated as:\nIntrinsic value of the equity = Value of operating assets + Value of non-operating assets – Market value of debt – Market value of preferred stock\nwhere,\nValue of operating assets = present value of future FCFF = $800 million\nValue of non-operating assets = $75 million\nMarket value of debt = $250 million\nMarket value of preferred stock = $150 million\nIntrinsic value of the equity = 800 + 75 – 250 – 150 = $475 million\nC. $550 million. — Incorrect\nIncorrect because the value of non-operating assets ($75 million) and the market value of preferred stock ($150 million) are both mistakenly not included in the calculation:\nValue of operating assets – Market value of debt\nwhere,\nValue of operating assets = present value of future FCFF = $800 million\nMarket value of debt = $250 million\nIntrinsic value of the equity = 800 – 250 = $550 million", "ko": "PV of FCFF는 operating assets의 가치만 준다. 여기서 equity까지 가는 길:\nEquity value = PV(FCFF) + non-operating assets − MV of debt − MV of preferred stock\n= 800 + 75 − 250 − 150 = $475 million.\n· excess cash(영업에 필요 없는 cash 75)는 FCFF를 만들지 않는 자산이라 따로 더한다.\n· preferred stock도 common equity보다 선순위 claim이므로 뺀다.\n(지문에 Firm D/Firm E가 섞여 있지만 같은 회사다.)", "trap": "non-operating assets 더하기와 preferred stock 빼기 중 하나를 빠뜨리면 보기 A, C가 나온다.", "f": "Equity = PV(FCFF) + Non-operating assets − MV debt − MV preferred", "why": {"A": "800 − 250 − 150 = 400: non-operating assets 75를 더하지 않았다.", "C": "800 − 250 = 550: non-operating assets도 더하지 않고 preferred stock도 빼지 않았다."}, "orig": "Mock 6 Session 1 Q32", "conf": true}, {"id": "mock6-Q33", "src": "오답", "module": "PM", "tag": "real GDP growth와 real default-free yield", "vig": 8, "stem": "Based on Chu's forecasts, which of the following bond markets should experience the largest increase in real yields?", "opts": {"A": "Country A", "B": "Country B", "C": "Country C"}, "ans": "A", "en": "A. Country A — Correct\nCorrect because Chu expects Country A to experience a 50 bps – 10 bps = 40 bps increase in its real GDP growth rate, which is larger than the +35 bps and –52 bps changes expected for Country B and Country C. An increase in real GDP growth should lead to an increase in the real default-free rate of interest because more goods and services will be available in the future relative to today. The result is that investors’ willingness to substitute over time will fall, resulting in less saving and more borrowing, so that the real default-free interest rate increases.\nB. Country B — Incorrect\nIncorrect because the real GDP growth rate increase in Country B of 65 bps – 30 bps = 35 bps is 5 bps smaller than the increase forecast for Country A. The fact that the forecast change in the nominal GDP growth rate is larger for Country B than for Country A is not relevant.\nC. Country C — Incorrect\nIncorrect because the forecast is for a 52 bps decrease in the real GDP growth rate in Country C (–40 bps – 12 bps = –52 bps), which implies a decrease rather than an increase in its real interest rate.", "ko": "real yield(real default-free rate)를 움직이는 것은 real GDP growth다. 표는 nominal GDP growth 변화를 주므로 inflation 변화를 빼서 real로 바꾼다.\nA: +50 − 10 = +40 bps\nB: +65 − 30 = +35 bps\nC: −40 − 12 = −52 bps\nreal growth 증가폭이 가장 큰 A의 real yield가 가장 많이 오른다.\n원리: real GDP growth ↑ → 미래에 goods and services가 더 많아진다 → 지금 저축해 미래로 소비를 옮길 유인(willingness to substitute over time) ↓ → saving ↓, borrowing ↑ → real rate ↑.", "trap": "nominal 변화가 가장 큰 B(+65 bps)를 고르면 틀린다(내가 고른 답). 질문이 'real' yields다 → inflation을 빼고 비교. inflation은 nominal yield에만 들어간다.", "f": "Δ real GDP growth ≈ Δ nominal GDP growth − Δ inflation", "why": {"B": "real 기준으로는 65 − 30 = +35 bps로 A(+40 bps)보다 작다. nominal 증가폭이 큰 것은 상관없다.", "C": "real growth가 −52 bps → real yield는 오히려 내려간다."}, "orig": "Mock 6 Session 1 Q33", "conf": false, "my": "B"}, {"id": "mock6-Q34", "src": "정답", "module": "PM", "tag": "break-even inflation과 inflation risk premium", "vig": 8, "stem": "The expected 2-year average inflation rate in Country D is most likely:", "opts": {"A": "less than 2%.", "B": "equal to 2%.", "C": "greater than 2%."}, "ans": "A", "en": "A. less than 2%. — Correct\nCorrect because the yield-to-maturity of the 2-year nominal bond should reflect a positive risk premium for inflation uncertainty. Thus, the calculation 3% – 1% = 2% (breakeven inflation) overestimates the 2-year average inflation rate expected by investors. The difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate. This break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon of the two bonds, θt,s, plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation.\nB. equal to 2%. — Incorrect\nIncorrect because the calculation 3% – 1% = 2% for the breakeven inflation rate ignores the positive inflation uncertainty risk premium and is thus too high.\nC. greater than 2%. — Incorrect\nIncorrect because the estimate is too high as investors' expected average inflation rate should be less than the breakeven inflation rate of 2%. A mistake is to use the average 0.9% of the 1-year and 2-year YTMs of the inflation-protected bonds, resulting in 3% – 0.9% = 2.1%.", "ko": "break-even inflation(BEI) = 같은 maturity의 nominal yield − real yield = 3.0% − 1.0% = 2.0% (2-year끼리 비교, 1-year 0.8%는 쓰지 않음).\n하지만 BEI = expected inflation + inflation uncertainty에 대한 risk premium이다. nominal bond 투자자는 inflation이 예상보다 높을 위험을 지므로 premium(> 0)을 요구한다.\n→ expected inflation = 2.0% − risk premium < 2%.", "trap": "3% − 1% = 2%로 계산은 맞지만 'equal to 2%'가 답이 아니다. BEI는 expected inflation보다 risk premium만큼 크다.", "f": "BEI = nominal yield − real yield = expected inflation (θ) + inflation risk premium (π)", "why": {"B": "2%는 BEI다. inflation risk premium을 무시했다.", "C": "expected inflation은 BEI보다 작다. 1-year와 2-year real yield를 평균(0.9%)해서 3% − 0.9% = 2.1%로 계산한 실수."}, "orig": "Mock 6 Session 1 Q34", "conf": true}, {"id": "mock6-Q35", "src": "정답", "module": "PM", "tag": "business cycle과 credit spread (rating·sector)", "vig": 8, "stem": "For Portfolio A, which of the following sectors most likely satisfies Chu's objective concerning credit spreads?", "opts": {"A": "Sector A", "B": "Sector B", "C": "Sector C"}, "ans": "B", "en": "A. Sector A — Incorrect\nIncorrect because credit spreads in Sector B should narrow more than spreads in Sector A. Sector A and Sector B are both consumer cyclical, which is sensitive to the business cycle, so their credit spreads (i.e., the extra yield compared to same-maturity government bonds) should narrow. However, speculative grade bonds are more business-cycle sensitive than investment grade bonds, so Sector B's spread narrowing should be greater than Sector A's.\nCorporate bond spreads will be driven over time by the business cycle, but the impact of the economic environment on spreads will depend on issuers’ industrial sector and rating. When spreads widen, the spreads on bonds issued by corporations with a low credit rating and/or that are part of a cyclical sector will tend to widen the most.\nThe US recession periods shaded grey in the chart indicate that both low- and higher-grade corporate bond spreads do tend to rise in the lead-up to and during a recession and to decline once the economy comes out of recession.\nB. Sector B — Correct\nCorrect because Sector B (both speculative grade and cyclical) would be expected to be more sensitive to improvement in economic conditions than Sector A, which is cyclical but investment grade, or Sector C, which is speculative grade but noncyclical.\nCorporate bond spreads will be driven over time by the business cycle, but the impact of the economic environment on spreads will depend on issuers’ industrial sector and rating. When spreads widen, the spreads on bonds issued by corporations with a low credit rating and/or that are part of a cyclical sector will tend to widen the most.\nThe US recession periods shaded grey in the chart indicate that both low- and higher-grade corporate bond spreads do tend to rise in the lead-up to and during a recession and to decline once the economy comes out of recession.\nC. Sector C — Incorrect\nIncorrect because Sector B is more likely to experience a larger compression in credit spreads than Sector C. Sector C and Sector B are both speculative grade, so equally business-cycle sensitive considering credit rating alone, but Sector B is cyclical while Sector C is noncyclical. So Sector B's spread compression should be greater than Sector C's.\nCorporate bond spreads will be driven over time by the business cycle, but the impact of the economic environment on spreads will depend on issuers’ industrial sector and rating. When spreads widen, the spreads on bonds issued by corporations with a low credit rating and/or that are part of a cyclical sector will tend to widen the most.\nThe US recession periods shaded grey in the chart indicate that both low- and higher-grade corporate bond spreads do tend to rise in the lead-up to and during a recession and to decline once the economy comes out of recession.", "ko": "credit spread는 경기에 따라 움직이고, 민감도는 두 가지로 커진다: ① rating이 낮을수록(speculative grade > investment grade) ② cyclical sector일수록(cyclical > noncyclical).\ndownturn에서 가장 많이 벌어진 spread가 recovery에서 가장 많이 좁혀진다.\nSector B = speculative grade + consumer cyclical → 두 요인 모두 해당 → 가장 많이 narrow.\nSector A는 cyclical이지만 investment grade, Sector C는 speculative grade지만 noncyclical.", "trap": "두 요인을 하나씩만 가진 A, C와 둘 다 가진 B를 비교하는 문제.", "f": "", "why": {"A": "cyclical이지만 investment grade → speculative grade인 B보다 경기 민감도가 낮다.", "C": "speculative grade지만 noncyclical → cyclical인 B보다 spread 변화가 작다."}, "orig": "Mock 6 Session 1 Q35", "conf": false}, {"id": "mock6-Q36", "src": "정답", "module": "PM", "tag": "constraint 추가와 optimal active risk (transfer coefficient)", "vig": 8, "stem": "If the client's proposal regarding Portfolio B's constraints is implemented, the portfolio's optimal level of active risk would most likely:", "opts": {"A": "decrease.", "B": "remain the same.", "C": "increase."}, "ans": "A", "en": "A. decrease. — Correct\nCorrect because the additional constraint would lower the expected information ratio (IR) of the strategy by reducing the transfer coefficient (TC). Thus, the optimal level of aggressiveness (active risk) decreases. This consequence follows from the following equation for the optimal level of active risk (where IR* is the information ratio of an otherwise unconstrained portfolio, i.e. a portfolio with TC = 1):\nσA = TC × (IR^(∗) / SRB) × σB\nThe IR for a constrained portfolio generally decreases with the aggressiveness of the strategy because portfolio constraints reduce the transfer of active return forecasts into active weights. The addition of portfolio constraints reduces the TC, thus also reducing the optimal active risk.\nB. remain the same. — Incorrect\nIncorrect because the added constraint reduces the transfer coefficient. If the active risk level were left unchanged, the decrease in the TC would need to be offset by a proportional increase in the IR, but skill (and other factors) are being held constant.\nC. increase. — Incorrect\nIncorrect because the added constraint reduces the transfer coefficient and so lowers the optimal level of active risk.", "ko": "constraint가 늘면 forecast를 active weights로 옮기는 정도인 transfer coefficient(TC)가 낮아진다.\nconstrained portfolio의 optimal active risk:\nσA = TC × (IR* / SR_B) × σB (IR*는 TC = 1일 때의 information ratio)\nlong-only에 ±10% overweight/underweight 한도가 더해지면 TC ↓ → IR = TC × IC × √BR ↓ → optimal active risk ↓.\n직관: 같은 skill인데 forecast를 덜 반영할 수 있으면 active risk 한 단위당 보상(IR)이 줄어든다 → 덜 공격적으로 운용하는 것이 최적.", "trap": "constraint는 skill(IC)이나 breadth를 바꾸지 않고 TC만 낮춘다. TC가 optimal active risk 식에 직접 곱해진다는 점을 기억.", "f": "σA* = TC × (IR* / SR_B) × σB; IR = TC × IC × √BR", "why": {"B": "active risk를 유지하려면 TC 하락을 IR 상승이 상쇄해야 하는데 skill은 그대로다.", "C": "constraint는 TC를 낮추므로 optimal active risk는 줄어든다."}, "orig": "Mock 6 Session 1 Q36", "conf": false}, {"id": "mock6-Q37", "src": "정답", "module": "ETH", "tag": "Standard VI(C) Referral Fees: non-cash 보상도 disclosure", "vig": 9, "stem": "Does Silva violate the Standards in his dealings with Sterling Group?", "opts": {"A": "No", "B": "Yes, by not disclosing the conference arrangement with Sterling to clients", "C": "Yes, by using Sterling's brokerage for trade execution without using its other services"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because Silva violated the Standard VI(C) - Conflicts of Interest - Referral Fees by not disclosing the referral arrangement.\nEven though the referral arrangement did not involve a cash payment, Silva benefited from the client referrals from Sterling and in exchange provided them free access to advertising at Tritium's equity conference. As he stood to benefit from this arrangement, the Standards require this to be disclosed to clients.\nB. Yes, by not disclosing the conference arrangement with Sterling to clients — Correct\nCorrect because Silva should disclose the referral arrangement with Sterling to be in compliance with Standard VI(C) - Conflicts of Interest - Referral Fees.\nMembers and candidates must disclose when they pay a fee or provide compensation to others who have referred prospective clients to the member or candidate.\nEven though Tritium and Silva do not make any payment to Sterling, they benefit from the additional clients referred to them by Sterling. In lieu of a payment, Tritium allows Sterling to advertise their firm at Tritium's annual equity conference, which has a monetary value. The Standards require that such an arrangement be disclosed to clients so they can decide where Tritium's incentives lie and what benefits Tritium receives by engaging with outside firms. By not disclosing the arrangement, Silva violated the Standards.\nC. Yes, by using Sterling's brokerage for trade execution without using its other services — Incorrect\nIncorrect because the Standards require best trade execution but do not mandate the use of research from a broker.\nThe Standards require that members use the broker with best execution capabilities, irrespective of the quality of research provided by the broker. By using Sterling for some of the trade execution, Silva does not violate the Standards as Sterling is one of the brokers that provides the best trade execution.", "ko": "Silva는 Sterling Group에서 institutional clients를 소개받고, 그 대가로 Sterling이 Tritium의 annual equity conference에서 무료로 advertise하게 해 준다. cash는 오가지 않지만 무료 광고는 monetary value가 있는 compensation이다.\nStandard VI(C) Referral Fees: 소개와 관련해 주거나 받는 모든 compensation, consideration, benefit을 client에게 disclose해야 한다(cash·soft dollar·in-kind 모두). client가 소개의 실제 비용과 Tritium의 incentive를 판단할 수 있어야 하기 때문.\nSilva는 '돈을 주지 않으니 disclose할 필요 없다'고 보고 referred clients에게 알리지 않았다 → 위반.\nSterling을 execution에 쓰는 것은 문제없다: approved broker이고 best execution을 제공한다. broker의 research를 반드시 써야 한다는 규정은 없다.", "trap": "'pay하지 않으니 referral fee가 아니다'가 함정. benefit의 형태가 무엇이든 disclose 대상이다.", "f": "", "why": {"A": "무료 advertising도 referral에 대한 compensation이다. disclose하지 않았으므로 위반.", "C": "Standards는 best execution을 요구할 뿐 broker의 research 사용을 요구하지 않는다. Sterling은 best execution을 제공하는 approved broker다."}, "orig": "Mock 6 Session 1 Q37", "conf": false}, {"id": "mock6-Q38", "src": "오답", "module": "ETH", "tag": "Standard VI(B) Priority of Transactions: 개인 매도", "vig": 9, "stem": "Did Silva violate the Standards when selling his personal stake in the packaging company?", "opts": {"A": "No", "B": "Yes, because he sold the shares at a profit", "C": "Yes, by acting against his own recommendation"}, "ans": "A", "en": "A. No — Correct\nCorrect because Silva did not violate Standard VI(B) - Conflicts of Interest - Priority of Transactions by selling stock of the packaging company from his personal portfolio.\nStandard VI(B) states that transactions for clients and employers must have priority over transactions in securities or other investments for which a member or candidate is the beneficial owner. The objective of the standard is to prevent personal transactions from adversely affecting the interests of clients or employers and personal investment positions or transactions of members or candidates or their firm should never, however, adversely affect client investments.\nBy selling an actively traded stock in his personal portfolio, even though at a profit, Silva did not disadvantage the investors in his fund. The fund in which investors are invested got the priority to purchase the stock in the market after which Silva decides to sell his position. Silva did not violate the Standards by giving the funds priority to trade and also did not harm the interests of his clients.\nB. Yes, because he sold the shares at a profit — Incorrect\nIncorrect because Standard VI(B) states that transactions for clients and employers must have priority over transactions in securities or other investments for which a member or candidate is the beneficial owner.\nAs long as the sale does not disadvantage clients, the Standard does not limit transactions from members in their personal portfolio. Members are allowed to sell their personal holdings as long as it does not harm clients. Silva made the buy transactions in the equity fund before he transacted personally and did not harm the interests of the clients. The fact that he sold the shares for a profit does not mean that he violated the Standards, as long as he does not benefit at the expense of his investors.\nC. Yes, by acting against his own recommendation — Incorrect\nIncorrect because the Standard VI(B)–Priority of Transactions does not limit transactions of company employees that differ from current recommendations as long as the sale does not disadvantage current clients.\nSilva did not violate the Standards by taking the opposite side of his own trade in the equity fund. Members are allowed to do so as long as the clients are not harmed.", "ko": "사실관계: Silva는 packaging company stock을 fund에 먼저 매수했고, newsletter에 전망을 썼으며, 개인 보유 사실은 이미 client에게 disclose했다. 몇 주 뒤 personal portfolio rebalancing으로 개인 보유분 일부를 팔아 큰 profit을 냈다.\nStandard VI(B)의 기준은 하나다: client·employer의 거래가 개인 거래보다 우선하고, 개인 거래가 client에게 불리하게 작용하지 않을 것.\n· fund 매수가 먼저 끝났고, 개인 매도는 그 몇 주 뒤다 → client 우선 충족.\n· actively traded stock이라 개인 매도가 가격에 영향을 주어 fund를 해치지 않는다.\n· 개인 보유는 disclose되어 있다.\n→ 위반 아님. profit을 냈다는 것, 추천과 반대 방향으로 거래했다는 것 자체는 위반 요건이 아니다. (Handbook도 개인 사정에 따른 contrary transaction은 client를 해치지 않으면 허용한다. 여기서는 rebalancing이라는 정당한 이유가 있다.)", "trap": "'자기가 추천한 종목을 팔았다 = 위반'으로 보면 틀린다(내가 고른 답 C). VI(B)는 거래 방향이 아니라 순서(client first)와 client 피해 여부를 본다. front-running이나 client 거래 직전·직후의 불리한 거래가 문제다.", "f": "", "why": {"B": "profit 실현은 위반 요건이 아니다. client를 희생시켜 얻은 profit일 때만 문제다.", "C": "추천과 반대 방향의 개인 거래도 client에게 불리하지 않으면 허용된다. fund 거래가 먼저였고 종목은 actively traded다."}, "orig": "Mock 6 Session 1 Q38", "conf": true, "my": "C"}, {"id": "mock6-Q39", "src": "정답", "module": "ETH", "tag": "Standard II(A) MNPI와 mosaic theory", "vig": 9, "stem": "Did Silva violate the Standard relating to material nonpublic information by buying RizenPay's stock?", "opts": {"A": "No", "B": "Yes, by trading on the information shared by the CFO", "C": "Yes, by trading on the information shared in the industry report"}, "ans": "A", "en": "A. No — Correct\nCorrect because Silva did not violate the Standard II(A) - Integrity of Capital Markets - Material Nonpublic Information by buying RizenPay stock.\nThe information provided by the CFO was nonpublic but non-material. It did not indicate anything which was material and which could have benefited Silva. Silva used the mosaic theory to understand RizenPay's market positioning by using the report published by the industry expert. Under the 'mosaic theory', financial analysts are free to act on this collection, or mosaic, of information without risking violation.\nSilva confirms his understanding of RizenPay by analyzing the information from the expert's industry report, non-material information provided by the CFO and then purchases the stock of the company, which is not a violation of the Standard.\nB. Yes, by trading on the information shared by the CFO — Incorrect\nIncorrect because Silva did not violate the Standards as the information shared by the CFO is non-material and nonpublic and Silva does not trade solely based on this.\nAs per the Standard, Information is 'material' if its disclosure would probably have an impact on the price of a security or if reasonable investors would want to know the information before making an investment decision and information is 'nonpublic' until it has been disseminated or is available to the marketplace in general (as opposed to a select group of investors).\nThe information shared by the CFO is nonpublic. However, it is not material as it would not affect the company's stock price but is rather a general statement about the financial condition of the company. Silva confirms his thesis about the company through research and the industry expert's report, which is not a violation.\nC. Yes, by trading on the information shared in the industry report — Incorrect\nIncorrect because Silva did not violate Standard II(A) - Integrity of Capital Markets - Material Nonpublic Information by using the information shared by the industry expert.\nMembers and candidates may provide compensation to individuals for their insights without violating this standard. Moreover, the nature of information shared by the industry expert is not material nonpublic. Anyone who pays for the report can get access to the information and the report is based on point-of-sale data which is not nonpublic.", "ko": "정보 두 개를 따로 판정한다. MNPI가 되려면 material과 nonpublic 둘 다여야 한다.\n① CFO의 말(골프 중): '최근 몇 주가 바빴다, 회사가 빨리 성장하고 재무적으로 잘하고 있다' → nonpublic이지만 구체적 숫자·사건이 없는 일반적 발언이라 non-material(공개돼도 stock price에 영향을 줄 정도가 아님).\n② industry expert report: 돈을 내면 누구나 살 수 있다 → 유료라고 nonpublic이 되는 것이 아니다. 전문가에게 대가를 주고 insight를 얻는 것은 허용된다.\nSilva는 non-material nonpublic 정보 + public 정보(report)를 조합해 결론을 냈다 = mosaic theory → Standard II(A) 위반 아님.", "trap": "CFO에게서 직접 들었다는 사실만으로 MNPI가 되지 않는다. materiality(구체성, stock price 영향)를 따져야 한다. 유료 report도 'available for purchase'면 public으로 본다.", "f": "", "why": {"B": "CFO 발언은 nonpublic이지만 non-material이다. Silva는 이것만으로 거래한 것도 아니다.", "C": "report는 비용을 내면 누구나 구할 수 있어 nonpublic이 아니다. 유료 research 구입은 허용된다."}, "orig": "Mock 6 Session 1 Q39", "conf": false}, {"id": "mock6-Q40", "src": "오답", "module": "ETH", "tag": "Standard V(C) Record Retention: 형식과 기간", "vig": 9, "stem": "Does Silva violate the Standards with respect to record retention?", "opts": {"A": "No", "B": "Yes, because of the format in which the records are kept", "C": "Yes, because records must be retained for a minimum period of 7 years"}, "ans": "A", "en": "A. No — Correct\nCorrect because Silva did not violate Standard V(C) - Investment Analysis, Recommendations and Actions - Record Retention by retaining the records in paper format for 5 years.\nRecords may be maintained either in hard copy or electronic form and firms may also implement policies detailing the applicable time frame for retaining research and client communication records. Fulfilling such regulatory and firm requirements satisfies the requirements of Standard V(C). In the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years.\nThe Standards allow members to retain records either in the hard copy or digital format. In addition, if the time period to retain the records is less than seven years but is in compliance with regulatory requirements, it is not a violation of the Standards. As the regulatory requirement is to retain records for 5 years, Silva does not violate the Standards by destroying the records after that period.\nB. Yes, because of the format in which the records are kept — Incorrect\nIncorrect because the Standard V(C) - Investment Analysis, Recommendations and Actions - Record Retention does not require records to be retained in a specified format. They can be saved in hard copy or digital format.\nC. Yes, because records must be retained for a minimum period of 7 years — Incorrect\nIncorrect because the Standard V(C) - Investment Analysis, Recommendations and Actions - Record Retention does not require records to be retained for 7 years. As long as records are retained for the minimum stipulated time period as required by regulatory requirements, it is not a violation of the Standards. In the absence of such guidelines, the Standards require record retention for a minimum of 7 years. Silva does not violate the Standard as he retains the records for a minimum of 5 years, as required by the local regulations.", "ko": "Standard V(C)의 요구는 investment actions와 client communications를 뒷받침하는 records를 '유지'하는 것이다.\n· 형식: hard copy든 electronic이든 상관없다. Tritium의 electronic format은 'recommended' policy(권고)일 뿐이고 Standards가 형식을 정하지 않는다 → Silva의 hard copy 보관은 Standards 위반이 아니다.\n· 기간: regulation이나 firm policy가 정한 기간이 있으면 그것을 따르면 충족된다. local regulations = 5년, Silva = 5년 보관 후 폐기 → 충족.\n· CFA Institute의 '최소 7년'은 regulatory guidance도 firm policy도 없을 때만 적용되는 recommendation이다.", "trap": "firm의 권고 형식(electronic)을 따르지 않았다고 Standards 위반으로 본 것이 내가 고른 답 B. 문제는 'violate the Standards?'이고 Standards는 형식을 요구하지 않으며, 지문도 'recommended policy'라고 썼다. 7년도 기본값일 뿐 의무가 아니다.", "f": "", "why": {"B": "Standard V(C)는 보관 형식을 정하지 않는다. hard copy도 된다.", "C": "7년은 규제·firm 기준이 없을 때의 recommendation이다. local regulations가 5년이므로 5년이면 충족."}, "orig": "Mock 6 Session 1 Q40", "conf": false, "my": "B"}, {"id": "mock6-Q41", "src": "정답", "module": "ETH", "tag": "Standard I(C) Misrepresentation: 출처 표시(plagiarism)", "vig": 10, "stem": "To comply with the Standards in his research on Company A, Murphy must cite:", "opts": {"A": "Jones only.", "B": "the data providers only.", "C": "both Jones and the data providers."}, "ans": "B", "en": "A. Jones only. — Incorrect\nIncorrect because, to avoid violating Standard I(C) Misrepresentation, Murphy must cite the data providers but is not required to cite Jones, who is no longer with the firm.\nResearch and models developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member or candidate has left the organization. The firm may issue future reports without providing attribution to the prior analysts.\nB. the data providers only. — Correct\nCorrect because, to avoid violating Standard I(C) Misrepresentation, Murphy must cite the data providers but is not required to cite Jones, who is no longer with the firm.\nOne of the most egregious practices in violation of this standard is the preparation of research reports based on multiple sources of information without acknowledging the sources. Examples of information from such sources include ideas, statistical compilations, and forecasts combined to give the appearance of original work. Although there is no monopoly on ideas, members and candidates must give credit where it is clearly due. Analysts should not use undocumented forecasts, earnings projections, asset values, and so on. Sources must be revealed to bring the responsibility directly back to the author of the report or the firm involved.\nC. both Jones and the data providers. — Incorrect\nIncorrect because, to comply with Standard I(C) Misrepresentation, Murphy must cite the data providers but is not required to cite Jones, who is no longer with the firm.\nOne of the most egregious practices in violation of this standard is the preparation of research reports based on multiple sources of information without acknowledging the sources. Examples of information from such sources include ideas, statistical compilations, and forecasts combined to give the appearance of original work. Although there is no monopoly on ideas, members and candidates must give credit where it is clearly due. Analysts should not use undocumented forecasts, earnings projections, asset values, and so on. Sources must be revealed to bring the responsibility directly back to the author of the report or the firm involved.\nResearch and models developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member or candidate has left the organization. The firm may issue future reports without providing attribution to the prior analysts.", "ko": "Murphy는 report에 ① external data providers의 forecasts ② 전 직원 Jane Jones가 Crozet 재직 중 만든 quantitative model을 썼다.\n① 외부 출처의 forecasts, statistical compilations, ideas는 반드시 cite해야 한다. 출처 없이 쓰면 자기 것처럼 보이게 하는 plagiarism → Standard I(C) 위반.\n② 직원이 재직 중 만든 research·model은 firm의 재산이다. 그 직원이 떠난 뒤에도 firm은 attribution 없이 계속 쓸 수 있다 → Jones를 cite할 의무 없음.\n따라서 data providers only.", "trap": "'남이 만든 model이니 cite'가 아니다. firm 내부에서 만들어진 work product는 firm 소유라 전 직원 이름을 밝힐 필요가 없다.", "f": "", "why": {"A": "Jones의 model은 firm 소유라 cite 의무가 없고, 정작 필요한 data providers 출처가 빠졌다.", "C": "data providers는 cite해야 하지만 Jones는 cite할 필요가 없다."}, "orig": "Mock 6 Session 1 Q41", "conf": false}, {"id": "mock6-Q42", "src": "정답", "module": "ETH", "tag": "Standard II(B) Market Manipulation: intent와 false information", "vig": 10, "stem": "Does Gaskill violate the Standard relating to market manipulation with her interviews and speaking engagements?", "opts": {"A": "No", "B": "Yes, by engaging in information-based manipulation", "C": "Yes, by engaging in transaction-based manipulation"}, "ans": "A", "en": "A. No — Correct\nCorrect because Gaskill does not violate Standard II(B) Market Manipulation.\nMarket manipulation includes (1) the dissemination of false or misleading information and (2) transactions that deceive or would be likely to mislead market participants by distorting the price-setting mechanism of financial instruments.\nStandard II(B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard.\nIn this case, there is no evidence that Gaskill is spreading false information or that the trades are intended to distort market prices.\nB. Yes, by engaging in information-based manipulation — Incorrect\nIncorrect because Gaskill does not violate Standard II(B) Market Manipulation.\nMarket manipulation includes the dissemination of false or misleading information.\nThe intent of the action is critical to determining whether it is a violation of this standard.\nIn this case, there is no evidence that Gaskill is spreading false information.\nC. Yes, by engaging in transaction-based manipulation — Incorrect\nIncorrect because Gaskill does not violate Standard II(B) Market Manipulation.\nMarket manipulation includes transactions that deceive or would be likely to mislead market participants by distorting the price-setting mechanism of financial instruments.\nStandard II(B) is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard.\nIn this case, there is no evidence that the trades are intended to distort market prices.", "ko": "market manipulation의 두 유형:\n① information-based: false or misleading information을 퍼뜨려 가격을 움직임\n② transaction-based: 가격 형성(price-setting mechanism)을 왜곡하거나 시장 참여자를 속이려는 거래\nGaskill(Company B의 CEO)은 언론 인터뷰와 conference 연설로 회사를 알렸고, 그 열정을 들은 투자자들이 stock을 사서 stock price가 올랐다. 하지만 그녀가 거짓·오도 정보를 말했다는 내용이 없고(①에 해당 안 됨), 그녀가 거래를 했다는 내용도 없다(②에 해당 안 됨). stock price 상승은 투자자들의 정상적인 매수 결과다.\n위반 여부는 intent와 정보의 진실성으로 판단한다 → 위반 아님.", "trap": "'stock price를 올리려는 의도로 홍보 → stock price 상승'만 보고 manipulation이라고 하면 안 된다. 사실에 근거한 정당한 홍보는 허용된다. false/misleading이어야 한다.", "f": "", "why": {"B": "information-based manipulation은 false or misleading information이 있어야 한다. 그런 증거가 없다.", "C": "transaction-based manipulation은 가격을 왜곡하려는 거래가 있어야 한다. Gaskill은 거래하지 않았다."}, "orig": "Mock 6 Session 1 Q42", "conf": false}, {"id": "mock6-Q43", "src": "오답", "module": "ETH", "tag": "Standard III(E) Preservation of Confidentiality: former client", "vig": 10, "stem": "Does Bass violate the Standard relating to preservation of confidentiality at the family picnic?", "opts": {"A": "No", "B": "Yes, in relation to his former client only", "C": "Yes, in relation to both his current clients and his former client"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because Bass violates Standard III(E) Preservation of Confidentiality by naming his former client.\nStandard III(E) requires that members and candidates preserve the confidentiality of information communicated to them by their clients, prospective clients, and former clients. This standard is applicable when (1) the member or candidate receives information because of his or her special ability to conduct a portion of the client’s business or personal affairs and (2) the member or candidate receives information that arises from or is relevant to that portion of the client’s business that is the subject of the special or confidential relationship.\nMore specifically, this standard protects the confidentiality of client information even if the person or entity is no longer a client of the member or candidate. Therefore, members and candidates must continue to maintain the confidentiality of client records even after the client relationship has ended.\nB. Yes, in relation to his former client only — Correct\nCorrect because Bass violates Standard III(E) Preservation of Confidentiality by naming his former client.\nStandard III(E) requires that members and candidates preserve the confidentiality of information communicated to them by their clients, prospective clients, and former clients. This standard is applicable when (1) the member or candidate receives information because of his or her special ability to conduct a portion of the client’s business or personal affairs and (2) the member or candidate receives information that arises from or is relevant to that portion of the client’s business that is the subject of the special or confidential relationship.\nMore specifically, this standard protects the confidentiality of client information even if the person or entity is no longer a client of the member or candidate. Therefore, members and candidates must continue to maintain the confidentiality of client records even after the client relationship has ended.\nC. Yes, in relation to both his current clients and his former client — Incorrect\nIncorrect because, while Bass does name his former client, he does not name his current clients or discuss their finances. Therefore, he violates Standard III(E) Preservation of Confidentiality with respect to his former client but not by saying what types of clients he covers.\nStandard III(E) requires that members and candidates preserve the confidentiality of information communicated to them by their clients, prospective clients, and former clients. This standard is applicable when (1) the member or candidate receives information because of his or her special ability to conduct a portion of the client’s business or personal affairs and (2) the member or candidate receives information that arises from or is relevant to that portion of the client’s business that is the subject of the special or confidential relationship.", "ko": "Bass의 두 행동을 따로 본다.\n① current clients: '영화 업계의 high-net-worth individuals'라고 고객층의 profile만 말했다. 이름도 재무 정보도 없다 → 특정인을 식별할 수 없으므로 confidentiality 위반 아님.\n② former client: 가족이 파산한 배우 이야기를 꺼내자 '그 배우는 예전 내 client였다'고 확인해 주었다 → 특정인이 client였다는 사실을 밝힘 → 위반.\nStandard III(E)는 current, prospective, former clients 모두에게 적용된다. 관계가 끝난 뒤에도 confidentiality는 계속된다. client 관계가 있었다는 사실 자체도 보호 대상이다.", "trap": "current clients 부분까지 위반으로 본 것이 내가 고른 답 C. 일반적인 고객층 설명(이름·재무 내용 없음)은 위반이 아니다. 위반은 특정 인물을 확인해 준 former client 부분뿐.", "f": "", "why": {"A": "former client라고 확인해 준 것은 위반이다. 관계가 끝나도 confidentiality 의무는 남는다.", "C": "current clients는 이름이나 재무 정보를 말하지 않고 고객 유형만 말했으므로 위반이 아니다."}, "orig": "Mock 6 Session 1 Q43", "conf": false, "my": "C"}, {"id": "mock6-Q44", "src": "정답", "module": "ETH", "tag": "Standard IV(C) Responsibilities of Supervisors: delegation과 incentive", "vig": 10, "stem": "Does Murphy's supervisor violate the Standards in his oversight of the department?", "opts": {"A": "No", "B": "Yes, by establishing Policy 1", "C": "Yes, by establishing Policy 2"}, "ans": "A", "en": "A. No — Correct\nCorrect because neither policy violates Standard IV(C) Responsibilities of Supervisors.\nEstablishing incentives—monetary or otherwise—for employees not only to meet business goals but also to reward ethical behavior offers supervisors another way to assist employees in complying with their legal and ethical obligations.\nThe conduct that constitutes reasonable supervision in a particular case depends on the number of employees supervised and the work performed by those employees. Members and candidates with oversight responsibilities for large numbers of employees may not be able to personally evaluate the conduct of these employees on a continuing basis. These members and candidates may delegate supervisory duties to subordinates who directly oversee the other employees.\nB. Yes, by establishing Policy 1 — Incorrect\nIncorrect because monetary incentives to reward ethical behavior do not violate Standard IV(C).\nEstablishing incentives—monetary or otherwise—for employees not only to meet business goals but also to reward ethical behavior offers supervisors another way to assist employees in complying with their legal and ethical obligations.\nC. Yes, by establishing Policy 2 — Incorrect\nIncorrect because delegating supervisory responsibility is not a violation of Standard IV(C).\nThe conduct that constitutes reasonable supervision in a particular case depends on the number of employees supervised and the work performed by those employees. Members and candidates with oversight responsibilities for large numbers of employees may not be able to personally evaluate the conduct of these employees on a continuing basis. These members and candidates may delegate supervisory duties to subordinates who directly oversee the other employees.", "ko": "Policy 1(ethical behavior에 monetary incentive): 허용되고 오히려 권장된다. business goal뿐 아니라 ethical behavior를 보상하는 incentive 구조는 compliance를 돕는 수단이다.\nPolicy 2(deputy manager가 ethical conduct를 평가): 직원이 많아 supervisor가 모두를 직접 평가할 수 없으면 supervisory duties를 subordinate에게 delegate할 수 있다. supervisor는 deputy manager를 뽑아 제대로 train시켰다 → reasonable supervision.\n단, delegation을 해도 최종 supervisory responsibility는 supervisor에게 남는다(책임까지 넘어가지는 않음). 여기서는 적절한 절차를 갖췄으므로 위반 아님.", "trap": "delegation 자체는 위반이 아니다. 위반이 되는 경우는 delegate한 뒤 적절한 training·절차 없이 방치할 때다.", "f": "", "why": {"B": "ethical behavior에 대한 monetary incentive는 Standard IV(C)가 권장하는 방법이다.", "C": "large department에서는 supervisory duties를 delegate할 수 있다. 적절히 train된 deputy manager에게 맡겼다."}, "orig": "Mock 6 Session 1 Q44", "conf": false}, {"id": "mock6-Q45", "src": "정답", "module": "FSA", "tag": "sustainable(organic) sales growth: volume + price", "vig": 11, "stem": "The market with the highest sustainable sales growth rate is:", "opts": {"A": "Thailand.", "B": "Malaysia.", "C": "Hong Kong SAR."}, "ans": "B", "en": "A. Thailand. — Incorrect\nIncorrect because growth in sales from volume was only 5 percent and price was 0 percent. Growth in net sales was strongly contributed by changes in exchange rate (4 percent). Growth in sales that comes from changes in volume or price is arguably more sustainable than growth in sales that comes from changes in exchange rates.\nB. Malaysia. — Correct\nCorrect because the growth in sales for Malaysia came from change in volume and price. At 4 + 5 = 9 percent, the organic sales growth was the greatest compared to Thailand (5 + 0 = 5) or Hong Kong SAR (–4 + 8 = 4). Growth in sales that comes from changes in volume or price is arguably more sustainable than growth in sales that comes from changes in exchange rates.\nC. Hong Kong SAR. — Incorrect\nIncorrect because overall sustainable sales growth was 4 percent. Growth in price was the highest at 8 percent, while growth in sales from volume was –4 percent. Thus, overall sustainable sales growth was 8 – 4 = 4 percent. This is lower than the 9 percent reported in Malaysia.", "ko": "sales growth의 세 원천 중 volume과 price에서 온 성장(organic growth)이 sustainable하고, foreign currency exchange에서 온 성장은 회사가 통제할 수 없어 sustainable하지 않다. 따라서 FX 열을 빼고 비교한다.\nThailand: 5% + 0% = 5%\nMalaysia: 4% + 5% = 9%\nHong Kong SAR: −4% + 8% = 4%\n→ Malaysia가 가장 높다.\n(총 성장률로 보면 Thailand 9%, Malaysia 5%, Hong Kong 4%라 순위가 바뀐다.)", "trap": "세 열을 다 더하면 Thailand(9%)가 1등이 된다. FX 효과는 빼야 한다.", "f": "Organic growth = volume growth + price growth (FX 효과 제외)", "why": {"A": "Thailand의 9% 중 4%는 FX 효과다. organic growth는 5%뿐.", "C": "Hong Kong SAR의 organic growth는 −4% + 8% = 4%로 Malaysia의 9%보다 낮다."}, "orig": "Mock 6 Session 2 Q1", "conf": false}, {"id": "mock6-Q46", "src": "정답", "module": "FSA", "tag": "temporal method: net monetary liability와 통화 강세", "vig": 11, "stem": "For the most recent year, as a result of consolidating Creamy's results, Buttery would recognize a:", "opts": {"A": "translation loss in the income statement.", "B": "translation gain in the income statement.", "C": "negative translation adjustment in the balance sheet."}, "ans": "A", "en": "A. translation loss in the income statement. — Correct\nCorrect because Creamy had a net monetary liability position and the IDR strengthened against the USD. Using the temporal method, a foreign currency translation loss is recognized in the income statement under these conditions.\nB. translation gain in the income statement. — Incorrect\nIncorrect because Creamy had a net monetary liability position and the IDR strengthened against the USD. Using the temporal method, a foreign currency translation loss, not gain, is recognized in the income statement under these conditions.\nC. negative translation adjustment in the balance sheet. — Incorrect\nIncorrect because Creamy had a net monetary liability position and the IDR strengthened against the USD. Using the temporal method, a foreign currency translation loss is recognized in the income statement, not a negative translation adjustment in the balance sheet under these conditions.", "ko": "① 어디에 인식되나: temporal method의 translation(remeasurement) gain/loss는 income statement에. current rate method의 translation adjustment만 equity(CTA, balance sheet)로 간다.\n② gain이냐 loss냐: temporal method의 exposure는 net monetary assets/liabilities다. Creamy는 net monetary liability, IDR(foreign currency)이 강세.\n· liability를 가진 통화가 강세 → USD로 환산한 liability가 커진다 → loss.\n요약표(temporal): net monetary asset + FC 강세 = gain / FC 약세 = loss; net monetary liability + FC 강세 = loss / FC 약세 = gain.\nexchange rate 확인: IDR per USD가 15,000 → 14,000으로 내려감 = 1 USD로 사는 IDR이 줄어듦 = IDR 강세.\n참고: 지문은 functional currency가 IDR이라고 하면서 temporal method를 쓴다고 했지만, 문제는 지문이 준 method(temporal) 그대로 푼다.", "trap": "두 단계(위치, 부호)를 섞지 말 것. temporal = income statement, exposure = net monetary position.", "f": "", "why": {"B": "net monetary liability 상태에서 foreign currency가 강세면 gain이 아니라 loss다.", "C": "balance sheet(equity)의 translation adjustment는 current rate method다. temporal method는 income statement에 인식."}, "orig": "Mock 6 Session 2 Q2", "conf": false}, {"id": "mock6-Q47", "src": "정답", "module": "FSA", "tag": "temporal method에서 변하지 않는 ratio", "vig": 11, "stem": "Which of the following ratios for Creamy most likely remains unchanged after translation for the most recent year?", "opts": {"A": "Current ratio", "B": "COGS to sales ratio", "C": "Sales to receivables ratio"}, "ans": "B", "en": "A. Current ratio — Incorrect\nIncorrect because current ratio = current assets / current liabilities and the numerator and denominator are translated using different exchange rates.\nCurrent assets comprise both monetary assets (cash, receivables) and non-monetary assets (inventory) and current liabilities tend to be monetary in nature. Most liabilities are monetary liabilities. Under the temporal method, monetary assets and liabilities are translated at the year end rate of 14,000. Inventory is a non-monetary asset and it is translated using the weighted average historical exchange rate when purchased or 14,700. This changes the numerator after translation. The denominator which is current liabilities are mostly monetary and translated at the year end rate of 14,000. Accordingly, the current ratio after translation changes.\nInventory is translated at the historical exchange rate under the temporal method.\nB. COGS to sales ratio — Correct\nCorrect because both the numerator and denominator are translated at the same rate resulting in the translated ratio being the same as the ratio in local currency. Under the temporal method, sales is translated using the average rate and COGS is translated at the historical exchange rate that inventory was purchased. Both the average rate and the weighted average historical rate when inventory was purchased rate are 14,700. The numerator and denominator are translated at the same rate. Accordingly, the translated ratio is the same as the ratio calculated using the local currency.\nCost of goods sold is translated using the exchange rates that existed when the inventory items assumed to have been sold during the year were acquired.\nC. Sales to receivables ratio — Incorrect\nIncorrect because the numerator and denominator are translated using different exchange rates. Under the temporal method, sales (the numerator) is translated using the average rate of 14,700. Receivables (the denominator) are monetary assets and translated at the year end rate of 14,000. Accordingly, the ratio after translation changes and is different from the ratio calculated using the local currency.", "ko": "ratio가 translation 후에도 local currency 때와 같으려면 분자와 분모가 같은 exchange rate로 환산되어야 한다. temporal method의 exchange rate:\n· monetary items(cash, receivables, payables): current rate = 14,000\n· non-monetary items(inventory, PP&E): historical rate (inventory = 14,700)\n· sales: average rate = 14,700\n· COGS: inventory를 살 때의 historical rate = 14,700\nCOGS/sales: 둘 다 14,700 → 그대로 유지. (보통은 COGS의 historical rate와 average rate가 달라 변하지만, 이 문제는 두 exchange rate를 같게 주었다.)\ncurrent ratio: 분자에 inventory(14,700)와 monetary assets(14,000)가 섞이고 분모는 14,000 → 변함.\nsales/receivables: sales 14,700 vs receivables 14,000 → 변함.", "trap": "Exhibit 2에서 'average = 14,700'과 'inventory 매입 시 weighted average = 14,700'이 같다는 것이 힌트다. current rate method였다면 pure balance sheet ratio(current ratio)와 pure income statement ratio가 유지되지만 여기는 temporal method다.", "f": "", "why": {"A": "inventory는 historical rate(14,700), 나머지 current assets와 current liabilities는 current rate(14,000) → 분자·분모 exchange rate가 달라 변한다.", "C": "sales는 average rate(14,700), receivables는 current rate(14,000) → 변한다."}, "orig": "Mock 6 Session 2 Q3", "conf": false}, {"id": "mock6-Q48", "src": "정답", "module": "FSA", "tag": "IFRS hyperinflation (IAS 29): restate 대상", "vig": 11, "stem": "If Tay's expectation is correct, when translating Dairy's current year financial statements, Buttery is required to restate Dairy's:", "opts": {"A": "inventory.", "B": "accounts payable.", "C": "accounts receivable."}, "ans": "A", "en": "A. inventory. — Correct\nCorrect because non-monetary assets are restated for changes in the general purchasing power of the monetary unit and then the inflation adjusted statements are translated using the current exchange rate.\nIFRS require the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29.\nThe restated cost is determined by applying to the historical cost the change in the general price index from the date of acquisition to the balance sheet date.\nSince inventory is carried at historical cost, the restated cost is determined by applying to the historical cost the change in the general price index from the date of acquisition to the balance sheet date before translation.\nB. accounts payable. — Incorrect\nIncorrect because under IAS 29, monetary items (such as cash, accounts receivable and accounts payable) are not restated because they are already expressed in terms of the monetary unit current at the balance sheet date.\nC. accounts receivable. — Incorrect\nIncorrect because under IAS 29, monetary items (such as cash, accounts receivables and accounts payable) are not restated because they are already expressed in terms of the monetary unit current at the balance sheet date.", "ko": "IFRS에서 subsidiary가 hyperinflationary economy에 있으면 2단계로 처리한다:\n① 먼저 local currency 재무제표를 inflation에 맞춰 restate(IAS 29) ② 그다음 전체를 current exchange rate로 translate.\n①에서 restate하는 것은 non-monetary items(inventory, PP&E 등 historical cost로 적힌 항목)와 equity다: historical cost × (balance sheet date의 general price index / 취득일의 index).\nmonetary items(cash, accounts receivable, accounts payable)는 이미 balance sheet date의 화폐 단위로 표시되어 있어 restate하지 않는다. 대신 net monetary position을 들고 있어서 생기는 purchasing power gain/loss를 income statement에 인식한다(net monetary liability면 gain).\n→ inventory만 restate 대상.\n대비: US GAAP은 restate하지 않고 temporal method를 쓴다(functional currency = parent의 currency로 봄).", "trap": "IFRS(restate 후 current rate) vs US GAAP(temporal method)을 구분. restate 대상은 non-monetary items뿐이다.", "f": "", "why": {"B": "accounts payable은 monetary item → 이미 현재 화폐 단위라 restate하지 않는다.", "C": "accounts receivable도 monetary item → restate하지 않는다."}, "orig": "Mock 6 Session 2 Q4", "conf": true}, {"id": "mock6-Q49", "src": "정답", "module": "QM", "tag": "confusion matrix 지표: recall과 false negatives", "vig": 12, "stem": "Which machine-learning model should Aoun choose given his concern about false negatives?", "opts": {"A": "Model X", "B": "Model Y", "C": "Model Z"}, "ans": "A", "en": "A. Model X — Correct\nCorrect because recall is the ratio of correctly predicted positive classes to all actual positive classes and is useful in situations where the cost of false negatives, or Type II errors, is high. Aoun is more concerned with the cost of false negatives than false positives and hence he would choose the model that has the highest value for recall. The Model X recall score of 0.94 is higher than the Model Y score of 0.90 and the Model Z score of 0.82. Model X has the highest recall score and therefore demonstrates the most favorable value of the performance metric that best addresses Aoun's concern.\nB. Model Y — Incorrect\nIncorrect because recall, not accuracy or F1 score, is the correct performance metric that directly addresses Aoun's concern with the high cost of false negatives. Accuracy and F1 score are overall performance measures that give equal weight to false positives and false negatives. Accuracy is considered an appropriate performance measure for balanced datasets, where the number of \"1\" and \"0\" classes are equal. F1 score is considered more appropriate than accuracy when there is unequal class distribution in the dataset and it is necessary to measure the equilibrium of precision and recall. Model Y has the highest accuracy and F1 score and would have been the most favorable choice if Aoun was equally concerned about false positives and false negatives.\nC. Model Z — Incorrect\nIncorrect because precision is the ratio of correctly predicted positive classes to all predicted positive classes and is useful in situations where the cost of false positives or Type I errors is high. Model Z has the highest precision score and would have been the most favorable choice if Aoun was more concerned with false positives instead of false negatives.", "ko": "지표와 error 종류를 짝지어 외운다.\n· Precision = TP / (TP + FP) → false positive(Type I error)의 비용이 클 때 본다.\n· Recall(sensitivity) = TP / (TP + FN) → false negative(Type II error)의 비용이 클 때 본다.\n· Accuracy = (TP + TN) / 전체, F1 = 2 × P × R / (P + R) → FP와 FN을 똑같이 취급하는 전체 성과 지표. F1은 class 분포가 불균형일 때 accuracy보다 적합.\nAoun은 false negatives가 더 걱정 → recall이 가장 높은 model: X(0.94) > Y(0.90) > Z(0.82) → Model X.", "trap": "Model Y는 F1과 accuracy가 가장 높아 '전체적으로 최고'로 보이지만, 질문은 false negative에 초점 → recall만 본다.", "f": "Precision = TP/(TP+FP); Recall = TP/(TP+FN); F1 = 2PR/(P+R); Accuracy = (TP+TN)/(TP+FP+TN+FN)", "why": {"B": "Model Y는 accuracy·F1이 최고지만 이 지표들은 FP와 FN에 같은 무게를 준다. recall은 X가 더 높다.", "C": "Model Z는 precision이 최고다. precision은 false positives가 걱정일 때의 지표."}, "orig": "Mock 6 Session 2 Q5", "conf": true}, {"id": "mock6-Q50", "src": "오답", "module": "QM", "tag": "ARCH(1): error variance는 변하지만 예측 가능", "vig": 12, "stem": "Based on Aoun's conclusion regarding the time-series model for Bytewave, the variance of the error term is:", "opts": {"A": "not constant but predictable.", "B": "both constant and predictable.", "C": "neither constant nor predictable."}, "ans": "A", "en": "A. not constant but predictable. — Correct\nCorrect because Bytewave's time-series model contains ARCH(1) errors and, by definition, if a time-series model has ARCH(1) errors, then the variance of the errors in period t + 1 can be predicted in period t. The variance of the error in one period depends on how large the squared error was in the previous period for an ARCH model. Thus, the variance of the error term for Bytewave's time series is predictable but not constant.\nB. both constant and predictable. — Incorrect\nIncorrect because Bytewave's time-series model contains ARCH(1) errors and, by definition, the variance of the error in one period depends on how large the squared error was in the previous period for an autoregressive conditional heteroskedasticity (ARCH) model. Thus, the variance of the error term for Bytewave's time series is not constant but predictable.\nC. neither constant nor predictable. — Incorrect\nIncorrect because analysts can test for first-order ARCH in a time-series model by regressing the squared residual on the squared residual from the previous period. The variance of the error term for Bytewave's time series, which contains ARCH(1) errors, would depend linearly on the squared error from the previous period. If a large error occurs in one period, the variance of the error in the next period will be even larger. Thus, the variance of the error term for Bytewave's time series is predictable.", "ko": "ARCH = autoregressive conditional heteroskedasticity. 이름 그대로 풀면 된다.\n· heteroskedasticity → error variance가 constant가 아니다.\n· autoregressive conditional → 이번 기의 variance가 직전 기의 squared error에 달려 있다: σ²(t) = a0 + a1 × ε²(t−1).\n따라서 직전 error를 알면 다음 기의 variance를 예측할 수 있다 → 'not constant but predictable'.\n검정: squared residuals를 한 기 전 squared residuals에 회귀해 a1이 유의하면 ARCH(1). 큰 error 다음에는 variance가 더 커진다(volatility clustering).\n결과와 대응: ARCH가 있으면 AR model의 standard errors가 틀려 inference가 무효 → generalized least squares 등으로 교정하거나, 예측된 variance를 risk 예측에 활용한다.", "trap": "'heteroskedasticity = 예측 불가'로 생각하면 C(내가 고른 답)를 고른다. ARCH의 핵심은 variance가 변하되 과거 error로 설명된다는 것, 즉 예측 가능하다는 것이다.", "f": "ARCH(1): ε²(t) = a0 + a1 ε²(t−1) + u(t); 예측 σ²(t+1) = â0 + â1 ε²(t)", "why": {"B": "ARCH errors가 있으면 variance가 직전 squared error에 따라 변한다 → constant가 아니다.", "C": "variance는 직전 기 squared error의 선형 함수라 t 시점에 t+1의 variance를 예측할 수 있다."}, "orig": "Mock 6 Session 2 Q6", "conf": false, "my": "C"}, {"id": "mock6-Q51", "src": "정답", "module": "QM", "tag": "covariance stationary의 조건과 판정", "vig": 12, "stem": "The first-differenced time series for Circuitcraft's growth in quarterly sales:", "opts": {"A": "is a random walk.", "B": "exhibits seasonality.", "C": "is covariance stationary."}, "ans": "C", "en": "A. is a random walk. — Incorrect\nIncorrect because a random walk is a time series in which the value of the series in one period is the value of the series in the previous period plus an unpredictable random error. The best forecast of xt that can be made in period t − 1 is xt−1. In fact, in this model, xt−1 is the best forecast of x in every period after t − 1.\nBased on the exhibit, b2 = –0.5272 with a t-statistic of –4.3411. As the absolute value of this t-statistic is higher than the critical value for the t-statistic of 2.0 at the 5% significance level, it can be concluded that b2 is significant and not equal to 0. Its absolute value is less than 1. Thus, xt−1 is not the best forecast of x in every period after t − 1. Thus, Circuitcraft's time series is not a random walk.\nB. exhibits seasonality. — Incorrect\nIncorrect because none of the autocorrelations of the residual lags differ significantly from 0. The seasonality would be easy to detect because the seasonal autocorrelation (in the case of quarterly data, the fourth autocorrelation) of the error term would differ significantly from 0. To test this, examine the highest absolute value of the t-statistic of the residuals and compare it with the critical value of the t-statistic of 2.0 at the 5% significance level for this model. The absolute value of the t-statistic for lag 3 is 1.8424, which is lower than the critical value of 2.0, and we fail to reject the null hypothesis that any of the autocorrelations are equal to 0 and thus conclude that the time series does not exhibit any seasonality issue.\nC. is covariance stationary. — Correct\nCorrect because the time series satisfies the three requirements of the covariance-stationary series.\nNone of the autocorrelations of the residual lags differ significantly from 0 (the highest absolute value is 1.8424, which is lower than the critical value of the t-statistic of 2.0) and hence the residuals are uncorrelated. The fact that the residuals are not autocorrelated is consistent with the covariance of the times series with itself being constant and finite at different lags. This satisfies one of the three requirements of the covariance-stationary series, i.e., the covariance of the time series with itself for a fixed number of periods in the past or future must be constant and finite in all periods.\nAs per the case, Aoun determines that the mean and the variance of the time series are constant over time, which satisfies the remaining two requirements of the covariance-stationary series. Specifically, they are that the expected value of the time series must be constant and finite in all periods and that the variance of the time series must be constant and finite in all periods.\nAoun concludes that the time series does not have a unit root in the case and, thus, Circuitcraft's first-differenced sales growth time series satisfies all three requirements of a covariance-stationary series, i.e., the mean is constant, the variance is constant, and the covariance of the time series with itself is constant.", "ko": "covariance stationary의 세 조건: ① mean이 constant·finite ② variance가 constant·finite ③ 자기 자신과의 covariance(고정된 lag)가 constant·finite.\n지문: first-differenced series의 mean과 variance가 constant(①②), unit root 없음, residual autocorrelations가 모두 유의하지 않음(가장 큰 |t|가 lag 3의 1.84 < 2.0) → model이 잘 맞고 ③과도 일치 → covariance stationary.\nrandom walk가 아닌 이유: random walk는 unit root가 있는 series(b1 = 1)인데 Aoun이 unit root가 없다고 결론냈고, b2 = −0.5272(t = −4.34)가 유의해 과거 값으로 예측 가능한 구조가 있다.\nseasonality가 아닌 이유: quarterly data의 seasonality는 residual의 4th lag autocorrelation이 유의한지로 본다. lag 4의 t = 0.43 < 2.0 → 없음.", "trap": "quarterly data라는 이유만으로 seasonality를 고르지 말 것. lag 4 residual autocorrelation의 t-statistic으로 확인한다.", "f": "", "why": {"A": "unit root가 없고 유의한 AR coefficient(b2)가 있다 → random walk가 아니다.", "B": "lag 4 residual autocorrelation의 t = 0.43으로 유의하지 않다 → seasonality 없음."}, "orig": "Mock 6 Session 2 Q7", "conf": false}, {"id": "mock6-Q52", "src": "정답", "module": "QM", "tag": "first-differenced AR(2)로 forecast", "vig": 12, "stem": "Based on the regression results for Circuitcraft, the 1-period-ahead sales growth forecast is closest to:", "opts": {"A": "–4.6%.", "B": "8.6%.", "C": "29.7%."}, "ans": "B", "en": "A. –4.6%. — Incorrect\nIncorrect because of not using the change in sales growth to get the 1-period-ahead forecast.\nFor the 1-period-ahead sales growth,\nΔSales Growtht+1 = 0.0024 – 0.2021 × ΔSales Growtht – 0.5272 × ΔSales Growtht−1\nSales Growth51 = 0.0024 – 0.2021 × 0.189 – 0.5272 × 0.020\nSales Growth51 = –0.04634 ≈ –4.6%\nB. 8.6%. — Correct\nCorrect because of the following calculation of the quarterly sales growth for the next quarter from now.\nThe equation describing a first-differenced AR(2) model can be given as:\nΔSales Growtht = b0 + b1ΔSales Growtht−1 + b2ΔSales Growtht−2\nBased on the exhibit, this translates into ΔSales Growtht = 0.0024 – 0.2021 × ΔSales Growtht−1 – 0.5272 × ΔSales Growtht−2\nFor the 1-period-ahead sales growth,\nΔSales Growtht+1 = 0.0024 – 0.2021 × ΔSales Growtht – 0.5272 × ΔSales Growtht−1\nSales Growth51 – Sales Growth50 = 0.0024 – 0.2021 × (Sales Growth50 – Sales Growth49) – 0.5272 × (Sales Growth49 – Sales Growth48)\nSales Growth51 – 0.189 = 0.0024 – 0.2021 × (0.189 – 0.020) – 0.5272 × (0.020 – (–0.115))\nSales Growth51 = 0.0024 – 0.0342 – 0.0712 + 0.189 = 0.08607 ≈ 8.6%\nC. 29.7%. — Incorrect\nIncorrect because of reversing the growth percentages values in the formula on the right-hand side.\nFor the 1-period-ahead sales growth,\nΔSales Growtht+1 = 0.0024 – 0.2021 × ΔSales Growtht – 0.5272 × ΔSales Growtht−1\nSales Growth51 – 0.189 = 0.0024 – 0.2021 × (0.020 – 0.189) – 0.5272 × (–0.115 – 0.020)\nSales Growth51 = 0.0024 + 0.0342 + 0.0712 + 0.189 = 0.29673 ≈ 29.7%", "ko": "model은 '변화분'에 대한 식이다: ΔSG(t) = b0 + b1 ΔSG(t−1) + b2 ΔSG(t−2), 여기서 ΔSG(t) = SG(t) − SG(t−1).\n① 변화분 계산: ΔSG50 = 18.9% − 2.0% = 16.9%, ΔSG49 = 2.0% − (−11.5%) = 13.5%\n② ΔSG51 = 0.0024 − 0.2021 × 0.169 − 0.5272 × 0.135 = 0.0024 − 0.0342 − 0.0712 = −0.1030\n③ level로 되돌리기: SG51 = SG50 + ΔSG51 = 0.189 − 0.1030 = 0.086 = 8.6%.\nb1의 t가 −1.64로 유의하지 않아도 forecast에는 추정된 coefficient를 그대로 쓴다.", "trap": "세 가지 실수 지점: (1) 우변에 level이 아니라 차분을 넣기 (2) 차분의 방향(최근 − 이전) (3) 마지막에 SG50을 다시 더하기.", "f": "ΔSG(t+1) = b0 + b1 ΔSG(t) + b2 ΔSG(t−1); SG(t+1) = SG(t) + ΔSG(t+1)", "why": {"A": "우변에 차분 대신 level(0.189, 0.020)을 넣고 SG50도 더하지 않은 계산 → −4.6%.", "C": "차분의 방향을 뒤집어(이전 − 최근) 부호가 반대가 된 계산 → 29.7%."}, "orig": "Mock 6 Session 2 Q8", "conf": true}, {"id": "mock6-Q53", "src": "정답", "module": "ECO", "tag": "growth accounting equation으로 potential growth", "vig": 13, "stem": "Based on the information given to Team Blue, the estimate of the economy's potential growth rate is closest to:", "opts": {"A": "1.95%.", "B": "2.55%.", "C": "3.50%."}, "ans": "A", "en": "A. 1.95%. — Correct\nCorrect because candidates conduct the right calculation: the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor.\nGrowth Accounting Equation: 1.0% + 30%ⅹ2.0% + 70%ⅹ0.5% = 1.0% + 0.6% + 0.35% = 1.95%.\nThe growth accounting equation states that the growth rate of output equals the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor. Because a 1% increase in capital leads to an α% increase in output, α is the elasticity of output with respect to capital. Similarly, (1 − α) is the elasticity of output with respect to labor. Thus, in the Cobb–Douglas production function, the exponents α and (1 − α) play dual roles as both output elasticities and the shares of income paid to each factor.\nB. 2.55%. — Incorrect\nIncorrect because 2.55% is erroneously derived by multiplying the growth rate of capital by plus (1 − α) and multiplying the growth rate of labor by α. Candidates compute the figure as:\n1.0% + 70%ⅹ2.0% + 30%ⅹ0.5% = 1.0% + 1.4% + 0.15% = 2.55%.\nC. 3.50%. — Incorrect\nIncorrect because 3.50% is erroneously derived by calculating the simple total of three components’ growth rates: capital, labor, and total factor productivity. Candidates compute the figure as:\n1.0% + 2.0% + 0.5% = 3.5%.", "ko": "growth accounting equation(Cobb–Douglas 기반):\nΔY/Y = ΔA/A + α × ΔK/K + (1 − α) × ΔL/L\nα = share of capital in GDP = 0.30 → labor share = 0.70.\n= 1.0% + 0.30 × 2.0% + 0.70 × 0.5% = 1.0% + 0.6% + 0.35% = 1.95%.\nα와 (1 − α)는 각 factor의 income share이자 output elasticity다(capital이 1% 늘면 output이 α% 늘어남). TFP growth는 가중치 없이 그대로 더한다.", "trap": "α(0.3)는 capital에, (1 − α)(0.7)는 labor에 곱한다. 서로 바꾸거나 세 growth rate를 그냥 더하면 틀린다.", "f": "ΔY/Y = ΔA/A + α(ΔK/K) + (1 − α)(ΔL/L)", "why": {"B": "가중치를 반대로 적용: 1.0% + 0.7 × 2.0% + 0.3 × 0.5% = 2.55%.", "C": "가중치 없이 단순 합: 1.0% + 2.0% + 0.5% = 3.5%."}, "orig": "Mock 6 Session 2 Q9", "conf": false}, {"id": "mock6-Q54", "src": "오답", "module": "ECO", "tag": "capital deepening·TFP·R&D와 growth", "vig": 13, "stem": "Which of the points raised by Team Green is most likely correct?", "opts": {"A": "Point 1", "B": "Point 2", "C": "Point 3"}, "ans": "C", "en": "A. Point 1 — Incorrect\nIncorrect because Point 1 (since technology results in an upward shift in the production function, the relationship between economic growth and R&D spending is positive in the short run) is not properly stated. As technological innovation has the double-edg

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 2 Session 1 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.jump{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.jump select,.jump input{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:inherit}
.jump select{flex:1;min-width:0;max-width:100%}
.jump input{width:72px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
/* 지문 왼쪽 · 문제/해설 오른쪽 (cmock처럼) */
body.wide .wrap{max-width:1440px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
.split .card{margin-top:0}
.vpane{position:sticky;top:104px;max-height:calc(100vh - 116px);overflow:auto;background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:12px;padding:12px 18px 16px;font-size:14.5px}
.vpane .vhead{font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:4px}
.vpane p{margin:.5em 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.vpane{position:static;max-height:42vh}}
</style>
</head>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock2-1", "title": "Mock 2 Session 1"}, "questions": [{"id": "mock2-1-Q1", "src": "정답", "module": "DER", "tag": "FRA 고정금리 (3×12)", "vig": 0, "stem": "The no-arbitrage 3 × 12 FRA fixed rate is closest to:", "opts": {"A": "3.07%.", "B": "3.20%.", "C": "4.27%."}, "ans": "C", "en": "A. 3.07%. — Incorrect\nIncorrect because this is simply the difference between the discount rates between 3 and 12 months which is: 0.9909 -0.9602 = 0.0307 = 3.07%\nB. 3.20%. — Incorrect\nIncorrect because tm is ignored when annualizing the 9-month rate, as follows:\nFRA0 = {[1 + LTtT]/[1 + Lhth] − 1}/tm\n= {[1 + (0.0415 x 360/360)]/[1 + (0.0367 x 90/360)] − 1}\n= {[1 + 0.0415]/[1 + 0.0092] − 1}\n= 0.0320 = 3.20%\nC. 4.27%. — Correct\nCorrect because the no-arbitrage fixed rate on a 3×12 FRA is calculated as follows:\nFRA0 = {[1 + LTtT] / [1 + Lhth] − 1} / tm\nFRA0 = initial FRA rate\nLT = longer spot rate\ntT = combined time to maturity of FRA and underlying\nLh = shorter spot rate\nth = time to expiry of FRA\ntm = accrual period\nFRA0 = {[1 + LTtT] / [1 + Lhth] − 1} / tm\n= {[1 + (0.0415 × 360/360)] / [1 + (0.0367 × 90/360)] − 1} / (270/360)\n= {[1 + 0.0415] / [1 + 0.0092] − 1} / 0.75\n= {1.0320 − 1} / 0.75\n= 0.0427 = 4.27%", "ko": "3×12 FRA는 3개월 뒤 시작해 12개월에 끝나는 9개월(270일) 금리다. 긴 쪽 성장: 1 + 0.0415 × 360/360 = 1.0415, 짧은 쪽 성장: 1 + 0.0367 × 90/360 = 1.0092. 1.0415 / 1.0092 − 1 = 0.0320은 9개월 동안의 기간 금리이므로 연율로 바꾸려고 tm = 270/360 = 0.75로 나눈다. 0.0320 / 0.75 = 4.27%.", "trap": "마지막에 기간(270/360)으로 나눠 연율화해야 한다. 안 나누면 3.20%.", "f": "FRA0 = {[1 + LT·tT] / [1 + Lh·th] − 1} / tm", "why": {"A": "PV factor의 차이(0.9909 − 0.9602)를 금리처럼 썼습니다.", "B": "9개월 기간 금리를 tm(0.75)으로 나누지 않아 연율화를 빼먹었습니다."}, "orig": "Mock 2 Session 1 Q1", "conf": false}, {"id": "mock2-1-Q2", "src": "오답", "module": "DER", "tag": "receive-fixed 스왑 가치", "vig": 0, "stem": "The value (in ZAR) of the receive-fixed interest rate swap position is closest to:", "opts": {"A": "318,000.", "B": "398,000.", "C": "481,000."}, "ans": "A", "en": "A. 318,000. — Correct\nCorrect because the value of a swap is calculated as follows:\nFirst, the sum of the appropriate PV factors is calculated:\n\tSpot Market Reference Rate\tPV Factors\n6-month\t3.79%\t0.9814\n12-month\t4.15%\t0.9602\n\tΣ PV\t1.9416\nThen the value of the swap is determined as follows:\nVSWAP,t = NA × (FS0 – FSt) × AP × ∑^ni=1 PVi\nWhere:\nVSWAP,t = value of receive-fixed swap\nNA = notional amount\nFS0 = initial fixed rate\nFSt = current fixed rate\nAP = accrual period (semiannual, 180 / 360)\n∑^ni=1 PVi = sum of the present value factors\n= 10,000,000 x (0.0738 – 0.041) × 180 / 360 x 1.9416\n= 318,422.40\n≈ 318,000\nB. 398,000. — Incorrect\nIncorrect because the current fixed rate of the swap is used instead of the difference, as follows:\nVSWAP,t = NA × (FS0 – FSt) × AP × ∑^ni=1 PVi\n= 10,000,000 x 0.041 × 180 / 360 x 1.9416\n= 398,028.00\n≈ 398,000\nC. 481,000. — Incorrect\nIncorrect because the 3-month PV factors is incorrectly included when calculating the sum of the PV factors:\n\tSpot Market Reference Rate\tPV Factors\n3-month\t3.67%\t0.9909\n6-month\t3.79%\t0.9814\n12-month\t4.15%\t0.9602\n\tΣ PV\t2.9325\nThen the value of the swap is determined as follows:\nVSWAP,t = NA × (FS0 – FSt) × AP × ∑^ni=1 PVi\n= 10,000,000 × (0.0738 – 0.041) × 180 / 360 × 2.9325\n= 480,930.00\n≈ 481,000", "ko": "남은 만기 1년, 반기 리셋이므로 남은 지급일은 6개월·12개월 두 번이다. PV factor 합 = 0.9814 + 0.9602 = 1.9416 (3개월 값은 지급일이 아니라 안 씀). receive-fixed 쪽은 처음 고정금리 7.38%를 받고 지금 시장 고정금리는 4.10%라 이득이다. 가치 = 10,000,000 × (0.0738 − 0.041) × 180/360 × 1.9416 = 318,422 ≈ ZAR 318,000.", "trap": "PV factor는 남은 결제일(6M, 12M)만 더한다. 고정금리 '차이'를 곱해야 한다.", "f": "V = NA × (FS0 − FSt) × AP × ΣPV", "why": {"B": "금리 차이 대신 현재 고정금리 4.10%만 곱했습니다.", "C": "결제일이 아닌 3개월 PV factor까지 더했습니다(합 2.9325)."}, "orig": "Mock 2 Session 1 Q2", "conf": true, "my": "B"}, {"id": "mock2-1-Q3", "src": "정답", "module": "DER", "tag": "채권 선도가격", "vig": 0, "stem": "The no-arbitrage bond forward price (as a percentage of par) is closest to:", "opts": {"A": "99.2.", "B": "103.7.", "C": "108.4."}, "ans": "B", "en": "A. 99.2. — Incorrect\nIncorrect because the wrong signs for AI0 (i.e. minus) and AIT (i.e. plus) are used as follows:\nF0 = FV[B0 – AI0] + AIT – FVCI\n= [(1 + 0.037)^(3/12) x (105 – 3.00)] + 0.75 – 4.51\n= [1.00912 x 102.00] – 3.76\n= 102.9307 – 3.76\n= 99.1707\n≈ 99.2\nB. 103.7. — Correct\nCorrect because the equilibrium bond forward price (percentage of par) is calculated as follows:\nF0 = FV(S0) – AIT – FVCI\n= FV[B0 + AI0] – AIT – FVCI\nWhere:\nF0 = adjusted futures price\nFV(S0) = future value of the spot price = FV[B0 + AI0]\nB0= quoted bond price\nAI0 = accrued interest at time 0\nAIT = accrued interest at time T\nFVCI = future value of coupon interest\nF0 = FV[B0 + AI0] – AIT – FVCI\n= [(1 + 0.037)^(3/12) x (105 + 3.00)] – 0.75 – 4.51\n= [1.00912 x 108.00] – 5.26\n= 108.99 – 5.26\n= 103.773\n≈ 103.7\nC. 108.4. — Incorrect\nIncorrect because FVCI is incorrectly ignored as follows:\nF0 = FV[B0 + AI0] – AIT – FVCI\n= [(1 + 0.037)^(3/12) x (105 + 3.00)] – 0.75\n= [1.00912 x 108.00] – 0.75\n= 108.985 – 0.75\n= 108.235\n≈ 108.4", "ko": "현물가격은 경과이자를 포함한 dirty price = 105 + 3.00 = 108. 90일 동안 무위험이자로 키우면 108 × 1.037^(3/12) = 108 × 1.00912 = 108.99. 여기서 만기 때의 경과이자 0.75(선도가격은 clean 기준)와 기간 중 받은 쿠폰의 미래가치 4.51을 뺀다. 108.99 − 0.75 − 4.51 = 103.7.", "trap": "AI0는 더하고 AIT는 뺀다. 쿠폰 FV도 빼야 한다.", "f": "F0 = FV(B0 + AI0) − AIT − FVCI (전환계수 1.0)", "why": {"A": "AI0를 빼고 AIT를 더해 부호를 반대로 썼습니다.", "C": "쿠폰의 미래가치(FVCI 4.51)를 빼지 않았습니다."}, "orig": "Mock 2 Session 1 Q3", "conf": false}, {"id": "mock2-1-Q4", "src": "정답", "module": "DER", "tag": "주식 선도 차익거래 (reverse carry)", "vig": 0, "stem": "Does an arbitrage opportunity exist in Pintel Electronics shares?", "opts": {"A": "No", "B": "Yes, by buying the shares today and selling them forward", "C": "Yes, by short selling the shares today and buying them forward"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because there is a reverse carry arbitrage opportunity available in the shares of Pintel Electronics (i.e., buy the forward and short sell the stock).\nB. Yes, by buying the shares today and selling them forward — Incorrect\nIncorrect because there is a reverse carry arbitrage opportunity available in the shares of Pintel Electronics (i.e., buy the forward and short sell the stock). Buying the shares today and selling them forward would be the correct trade if the current forward price was higher than the spot price.\nC. Yes, by short selling the shares today and buying them forward — Correct\nCorrect because the forward price (ZAR 816) is lower than the spot price (ZAR 850), there is a reverse carry arbitrage opportunity available in the shares of Pintel Electronics (i.e., buy the forward and short sell the stock).\nThe reverse carry arbitrage will involve the following steps:\n1. Buy the forward contract on the shares at ZAR 816.\n2. Sell the shares short at ZAR 850.\n3. Lend the short sale proceeds at the positive interest rate.\n4. Borrow the PV of the arbitrage profit at the positive interest rate.", "ko": "배당 34를 반영한 무차익 선도가격 = (850 − PV(34)) × (1 + r)^0.75. 금리가 양수면 PV(34) < 34라서 850 − PV(34) > 816이고, 여기에 이자까지 붙으므로 무차익 선도가격은 반드시 816보다 크다. 시장 선도 816은 싸므로 선도를 사고 주식을 공매도한 뒤 받은 돈을 빌려준다(reverse carry). 해설 기준: 선도가격(816)이 현물(850)보다 낮아 reverse carry 차익거래가 있다.", "trap": "선도가 싸면 선도 매수 + 현물 공매도. 비싸면 현물 매수 + 선도 매도(carry arbitrage).", "f": "F0 = (S0 − PV(D)) × (1 + r)^T", "why": {"A": "선도가 무차익가격보다 싸서 차익거래 기회가 있습니다.", "B": "현물 매수 + 선도 매도는 선도가 비쌀 때의 거래입니다."}, "orig": "Mock 2 Session 1 Q4", "conf": false}, {"id": "mock2-1-Q5", "src": "정답", "module": "EQ", "tag": "2단계 FCFE 모형", "vig": 1, "stem": "Based on Norberg's assumptions, the intrinsic value of Firm A's shares is closest to:", "opts": {"A": "$134.", "B": "$141.", "C": "$145."}, "ans": "C", "en": "A. $134. — Incorrect\nIncorrect because n = 3 was used to compute the present value of the terminal value.\nUsing n = 3 incorrectly:\nItem\tCash Flow\tPV(Cash Flow)\nYear 1 cash flow\t$6.20\t$5.69 = $6.20 / 1.09\nYear 2 cash flow\t$9.00\t$7.58 = $9.00 / 1.09^2\nTerminal value (discounted incorrectly using n = 3)\t$157\t$121.23 = $157 / 1.09^3\nSum of PV(cash flow) = $134.4960 ≈ $134.\nB. $141. — Incorrect\nIncorrect because the first constant growth cash flow (Year 3) AND the terminal value are both discounted from Year 3. In other words, the candidate double counts Year 3:\nThe cost of equity is 9%.\nThe terminal value is $7.85 / (0.09 – 0.04) = $157.\nSumming the present values and double-counting the Year 3 cash flow:\n$6.20/1.09 + $9.00/1.09^2 + $7.85/1.09^3 + $157/1.09^3\n= $5.69 + $7.58 + $6.06 + $121.23 = $140.56 ≈ $141.\nC. $145. — Correct\nCorrect because this is the present value of the Year 1, Year 2, and terminal value cash flows.\n\tYear 1\tYear 2\tYear 3 and Thereafter\nFCFE/share\t$6.20\t$9.00\t$7.85\nThe cost of equity is 9%.\nThe terminal value (as of Year 2) is $7.85 / (0.09 – 0.04) = $157.\nSumming the present values:\n$6.20/1.09 + $9.00/1.09^2 + $157/1.09^2\n= $5.69 + $7.58 + $132.14 = $145.41 ≈ $145.", "ko": "Year 3부터 4%로 일정 성장하므로 terminal value는 Year 2 시점에서 구한다. TV2 = FCFE3 / (r − g) = 7.85 / (0.09 − 0.04) = 157. 할인율은 FCFE이므로 자기자본비용 9%. V0 = 6.20/1.09 + 9.00/1.09² + 157/1.09² = 5.69 + 7.58 + 132.14 = $145.41 ≈ $145.", "trap": "Year 3 FCFE로 구한 TV는 Year 2 시점 값이다. n = 2로 할인하고 Year 3 FCFE는 따로 더하지 않는다.", "f": "TV(n) = FCFE(n+1) / (r − g), V0 = Σ FCFEt/(1+r)^t + TVn/(1+r)^n", "why": {"A": "TV를 n = 3으로 할인했습니다.", "B": "Year 3 FCFE를 따로 더하고 TV도 3년 할인해 Year 3을 이중 계산했습니다."}, "orig": "Mock 2 Session 1 Q5", "conf": false}, {"id": "mock2-1-Q6", "src": "정답", "module": "EQ", "tag": "FCFF > FCFE의 원인", "vig": 1, "stem": "Which of the following would best explain the difference in Firm A's cash flow measures in the previous year?", "opts": {"A": "Repayment of a bank loan", "B": "Reduction in cash dividends for common stock", "C": "Repurchase of shares financed from cash balances"}, "ans": "A", "en": "A. Repayment of a bank loan — Correct\nCorrect because repayment of a bank loan is the only choice that would make the previous fiscal year's FCFF larger than FCFE. Given that:\nFCFE = FCFF – Interest × (1 – Tax rate) + Net borrowing.\nRepaying a loan allows net borrowing to be negative, resulting in FCFF being larger than FCFE.\nB. Reduction in cash dividends for common stock — Incorrect\nIncorrect because the amount of cash common stock dividends does not affect either FCFF or FCFE.\nC. Repurchase of shares financed from cash balances — Incorrect\nIncorrect because changes in cash balances or share repurchases do not affect either FCFF or FCFE.", "ko": "FCFE = FCFF − 이자 × (1 − t) + 순차입. 은행 대출을 갚으면 순차입이 음수가 되어 FCFE가 FCFF보다 작아진다. 배당이나 자사주 매입은 FCF를 '쓰는' 방법일 뿐 FCFF·FCFE 계산 자체에는 영향이 없다.", "trap": "배당·자사주 매입·현금 변동은 FCFF·FCFE에 영향 없음.", "f": "FCFE = FCFF − Int(1 − t) + Net borrowing", "why": {"B": "보통주 배당은 FCFF·FCFE 어느 쪽에도 영향을 주지 않습니다.", "C": "현금으로 하는 자사주 매입도 FCFF·FCFE에 영향을 주지 않습니다."}, "orig": "Mock 2 Session 1 Q6", "conf": false}, {"id": "mock2-1-Q7", "src": "오답", "module": "EQ", "tag": "인수 대상 기업 가치평가 모형", "vig": 1, "stem": "Which of the following is the most appropriate model to value Firm B?", "opts": {"A": "DDM", "B": "FCFE", "C": "FCFF"}, "ans": "C", "en": "A. DDM — Incorrect\nIncorrect because the possible takeover will likely result in the new owner altering its dividend and capital structure policies.\nB. FCFE — Incorrect\nIncorrect because, with the possibility of a change in control and capital structure, the free cash flow to the firm is more appropriate as it represents funds a new owner can access to change the capital structure and payments to the firm's financing sources.\nC. FCFF — Correct\nCorrect because, with a growing cash reserve, Firm B's dividends paid differ significantly from the company's capacity to pay dividends. With a possible change in control, Norberg expects a change in dividend payouts and a greater reliance on debt financing (and thus a change in capital structure to emphasize new debt over new equity).\nThe FCFF model is often chosen in the case of a levered company with a changing capital structure. First, if historical data are used to forecast free cash flow growth rates, FCFF growth might reflect fundamentals more clearly than does FCFE growth, which reflects fluctuating amounts of net borrowing. Second, in a forward-looking context, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify.", "ko": "Firm B는 현금이 쌓여 실제 배당이 배당 여력과 다르고, 인수되면 새 주인이 배당 정책을 바꾸고 부채를 늘려(자본구조 변경) 투자를 유지할 것으로 예상된다. 지배권이 바뀌고 자본구조가 바뀌는 경우에는 FCFF가 가장 알맞다. 레버리지가 바뀌면 자기자본비용이 크게 변하지만 WACC는 덜 변하기 때문이다.", "trap": "배당 정책이 바뀌면 DDM 탈락, 자본구조(부채)가 바뀌면 FCFE보다 FCFF.", "f": "", "why": {"A": "인수 뒤 배당 정책이 바뀔 것이라 DDM은 맞지 않습니다.", "B": "부채 발행으로 자본구조가 바뀌면 순차입이 출렁여 FCFE보다 FCFF가 낫습니다."}, "orig": "Mock 2 Session 1 Q7", "conf": true, "my": "A"}, {"id": "mock2-1-Q8", "src": "정답", "module": "EQ", "tag": "가치의 정의: investment value", "vig": 1, "stem": "Which of the following definitions of value would be most relevant for Norberg's valuation estimate for Firm B?", "opts": {"A": "Intrinsic value", "B": "Investment value", "C": "Fair market value"}, "ans": "B", "en": "A. Intrinsic value — Incorrect\nIncorrect because intrinsic value typically uses the present value of expected future cash flows assuming a going concern. In the case of an acquisition with alleged synergies, the stand-alone going-concern value is not the value of the target firm.\nUnder the efficient markets hypothesis, intrinsic value usually equals the market price of an asset. Under the rational efficient markets hypothesis, investors will not rationally incur the expenses of gathering information unless they expect to be rewarded by higher gross returns compared with the free alternative of accepting the market price. Analysts often rely on price eventually converging to intrinsic value, although intrinsic value is unobservable.\nB. Investment value — Correct\nCorrect because in some situations an asset is worth more to a particular buyer (e.g., because of potential operating synergies). The concept of value to a specific buyer taking account of potential synergies and based on the investor’s requirements and expectations is called investment value.\nC. Fair market value — Incorrect\nIncorrect because fair market value is the price at which an asset (or liability) would change hands between a willing buyer and a willing seller when the former is not under any compulsion to buy and the latter is not under any compulsion to sell. Assuming the marketplace has confidence that the company’s management is acting in the owners’ best interests, market prices should tend, in the long run, to reflect fair market value. The transaction price, if the takeover occurs, will likely exceed Firm B's current market price due to the synergies that are believed to exist.", "ko": "Norberg는 경쟁사(인수자)가 시너지를 얻을 수 있다는 점에서, 인수자 입장으로 평가한다. 특정 구매자에게 시너지를 반영한 가치가 investment value다. intrinsic value는 계속기업 기준 단독 가치, fair market value는 강요받지 않는 일반 매수·매도자 사이 거래 가격이다.", "trap": "'특정 구매자 + 시너지' = investment value.", "f": "", "why": {"A": "intrinsic value는 시너지 없는 단독 계속기업 가치입니다.", "C": "fair market value는 일반적인 매수자·매도자 기준이라 특정 인수자의 시너지를 반영하지 않습니다."}, "orig": "Mock 2 Session 1 Q8", "conf": true}, {"id": "mock2-1-Q9", "src": "정답", "module": "PM", "tag": "연간 parametric VaR", "vig": 2, "stem": "The annual 5% parametric VaR estimate of the model portfolio (in $ millions) is closest to:", "opts": {"A": "21.1.", "B": "30.7.", "C": "81.1."}, "ans": "A", "en": "A. 21.1. — Correct\nCorrect because the calculation correctly applies the critical z-value for a one-sided test (1.65) in the calculation, accordingly:\nVaR = {[E(Rp) − 1.65σp](−1)}(Portfolio value),\nwhere:\nE(Rp) = Annualized monthly return = (0.0125 × 12) = 0.15\nσp = Annualized standard deviation = (0.0447 × 12^(1/2)) = 0.154845\nPortfolio value = $200 million\nVaR = −[(0.15 − 1.65 × 0.154845)] × $200 million\nVaR = −[(0.15 − 0.255495)] × $200 million = $21,098,963\n≈ $21.1 million\nB. 30.7. — Incorrect\nIncorrect because the calculation uses the critical z-value for a two-sided test (1.96) instead of the critical z-value for a one-sided test (1.65), consequently:\nVaR = {[E(Rp) − 1.96σp](−1)}(Portfolio value),\nwhere:\nE(Rp) = Annualized monthly return = (0.0125 × 12) = 0.15\nσp = Annualized standard deviation = (0.0447 × 12^(1/2)) = 0.154845\nPortfolio value = $200 million\nVaR = −[(0.15 − 1.96 × 0.154845)] × $200 million\nVaR = −[(0.15 − 0.303497)] × $200 million = $30,699,374\n≈ $30.7 million\nC. 81.1. — Incorrect\nIncorrect because the calculation adds rather than subtracts 1.65σp, accordingly:\nVaR = [E(Rp) + 1.65σp](Portfolio value),\nwhere:\nE(Rp) = Annualized monthly return = (0.0125 × 12) = 0.15\nσp = Annualized standard deviation = (0.0447 × 12^(1/2)) = 0.154845\nPortfolio value = $200 million\nVaR = [(0.15 + 1.65 × 0.154845)] × $200 million\nVaR = [(0.15 + 0.255495)] × $200 million = $81,098,963\n≈ $81.1 million", "ko": "월 수치를 연으로 바꾼다. 기대수익률 = 1.25% × 12 = 15%, 표준편차 = 4.47% × √12 = 15.4845%. VaR는 한쪽 꼬리이므로 z = 1.65. VaR = −(0.15 − 1.65 × 0.154845) × $200m = −(0.15 − 0.2555) × 200 = $21.1m.", "trap": "VaR는 one-sided(1.65). 기대수익률은 빼지 않고 −zσ에 더해진다.", "f": "VaR = −[E(R) − z·σ] × 포트폴리오 가치, 연 σ = 월 σ × √12", "why": {"B": "양측 검정 z값 1.96을 썼습니다.", "C": "1.65σ를 빼지 않고 더했습니다."}, "orig": "Mock 2 Session 1 Q9", "conf": false}, {"id": "mock2-1-Q10", "src": "정답", "module": "PM", "tag": "Conditional VaR (CVaR)", "vig": 2, "stem": "Which of the following risk measures best addresses the CIO's request?", "opts": {"A": "Marginal VaR", "B": "Conditional VaR", "C": "Incremental VaR"}, "ans": "B", "en": "A. Marginal VaR — Incorrect\nIncorrect because conditional VaR is the average loss conditional on exceeding the VaR cutoff. Marginal VaR (MVaR) measures the change in portfolio VaR given a small change in the portfolio position. In a diversified portfolio, MVaRs can be summed to determine the contribution of each asset to the overall VaR.\nB. Conditional VaR — Correct\nCorrect because conditional VaR is the average loss conditional on exceeding the VaR cutoff.\nC. Incremental VaR — Incorrect\nIncorrect because conditional VaR is the average loss conditional on exceeding the VaR cutoff. Incremental VaR measures the change in portfolio VaR as a result of adding or deleting a position from the portfolio or if a position size is changed relative to the remaining positions.", "ko": "CIO가 원하는 것은 손실이 VaR를 넘을 때의 평균 손실이다. 이것이 conditional VaR(expected shortfall)다. marginal VaR는 포지션을 조금 바꿀 때 VaR 변화, incremental VaR는 포지션을 추가·삭제할 때 VaR 변화다.", "trap": "'VaR를 넘을 때 기대 손실' = CVaR.", "f": "", "why": {"A": "marginal VaR는 포지션을 조금 바꿀 때 VaR가 얼마나 변하는지입니다.", "C": "incremental VaR는 포지션을 넣거나 빼거나 크기를 바꿀 때 VaR 변화입니다."}, "orig": "Mock 2 Session 1 Q10", "conf": false}, {"id": "mock2-1-Q11", "src": "정답", "module": "PM", "tag": "위험 제약: tracking error budget", "vig": 2, "stem": "Which of the following risk constraints would most likely reduce the CIO's concern about the managed accounts?", "opts": {"A": "A VaR budget", "B": "Position limits", "C": "An ex ante tracking error budget"}, "ans": "C", "en": "A. A VaR budget — Incorrect\nIncorrect because an ex ante tracking error budget is what mitigates the CIO's concern of deviating from (in this case, underperforming) the respective benchmark.\nSome firms might use marginal VaR for each trading desk, allocating each desk a VaR budget such that the total VaR is the sum of each individual desk’s marginal VaR. A VaR budget is mainly used for risk budget allocation amongst different trading desks and does not address underperformance relative to a benchmark.\nB. Position limits — Incorrect\nIncorrect because an ex ante tracking error budget is what mitigates the CIO's concern of deviating from (in this case, underperforming) the respective benchmark.\nPosition limits are limits on the market value of any given investment, or the notional principal amount for a derivatives contract. Position limits mainly address concentration risks and do not address underperformance relative to a benchmark.\nC. An ex ante tracking error budget — Correct\nCorrect because the CIO may establish her tolerance for underperformance in a given asset class and allocate that tolerance to the asset managers selected to manage the assets by assigning each an ex ante tracking error budget. Given this budget, they will seek to optimize the portfolio’s exposures relative to the benchmark to ensure that the strategies that generate the most tracking error for the portfolio are those for which they expect the greatest reward.", "ko": "걱정거리는 벤치마크 대비 부진이다. 벤치마크에서 얼마나 벗어나도 되는지를 정하는 것이 ex ante tracking error budget이다. VaR budget은 데스크별 위험 배분, position limit은 집중 위험을 다룬다.", "trap": "벤치마크 대비 = tracking error.", "f": "", "why": {"A": "VaR budget은 트레이딩 데스크 사이 위험 배분용이라 벤치마크 대비 부진과 관계없습니다.", "B": "position limit은 집중 위험을 막는 것이지 벤치마크 대비 부진을 다루지 않습니다."}, "orig": "Mock 2 Session 1 Q11", "conf": false}, {"id": "mock2-1-Q12", "src": "정답", "module": "PM", "tag": "VaR의 한계: correlation risk", "vig": 2, "stem": "A limitation of the measure discussed in Lang's presentation is that it:", "opts": {"A": "is exposed to correlation risk.", "B": "is not widely accepted by regulators.", "C": "does not facilitate capital allocation decisions."}, "ans": "A", "en": "A. is exposed to correlation risk. — Correct\nCorrect because correlation risk is one of the primary limitations of VaR. Correlation risk is the risk that during times of extreme market stress, correlations among all assets tend to rise significantly. Thus, markets that provide a reasonable degree of diversification under normal conditions tend to decline together under stressed market conditions, thereby no longer providing diversification.\nB. is not widely accepted by regulators. — Incorrect\nIncorrect because regulatory reporting is an advantage of VaR, while correlation risk is a limitation. Global banking regulators also encourage banks to use VaR. These regulations require or encourage the use of VaR.\nC. does not facilitate capital allocation decisions. — Incorrect\nIncorrect because facilitating capital allocation decisions is an advantage of VaR, while correlation risk is a limitation. The ability to compare VaR across trading units or portfolio positions provides management with a benchmark that can be used in capital allocation decisions.", "ko": "VaR의 대표적 한계는 correlation risk다. 시장이 극도로 불안하면 자산 간 상관관계가 모두 올라가 평소의 분산 효과가 사라지는데 VaR는 이를 잘 잡지 못한다. 규제 기관이 널리 쓰는 점과 자본 배분을 돕는 점은 VaR의 장점이다.", "trap": "규제 수용·자본 배분은 VaR의 장점이다.", "f": "", "why": {"B": "규제 당국은 VaR 사용을 요구·권장합니다(장점).", "C": "부문 간 VaR 비교로 자본 배분 결정을 돕습니다(장점)."}, "orig": "Mock 2 Session 1 Q12", "conf": true}, {"id": "mock2-1-Q13", "src": "정답", "module": "AI", "tag": "calendar spread", "vig": 3, "stem": "Based on current market prices, which commodity has a negative calendar spread?", "opts": {"A": "Commodity 1", "B": "Commodity 2", "C": "Commodity 3"}, "ans": "A", "en": "A. Commodity 1 — Correct\nCorrect because the calendar spread is defined as the difference between the near-term futures contract price and the farther-term futures contract price, namely $1,688 – $1,707 = –$19.\nB. Commodity 2 — Incorrect\nIncorrect because the calendar spread is zero. It is defined as the difference between the near-term futures contract price and the farther-term futures contract price, namely $835 – $835 = $0.\nThis is the only commodity where the futures price exceeds the spot price. However, the difference between spot price and futures price (here, $830 – $835 = –$5) is called basis and not calendar spread.\nC. Commodity 3 — Incorrect\nIncorrect because the calendar spread is positive. It is defined as the difference between the near-term futures contract price and the farther-term futures contract price, namely $85.90 – $84.60 = $1.30.\nThis commodity would have a negative spread if the definition of the calendar spread was incorrectly reversed ($84.60 – $85.90 = –$1.30).", "ko": "calendar spread = 근월물 가격 − 원월물 가격. Commodity 1: 1,688 − 1,707 = −19 (음수). Commodity 2: 835 − 835 = 0. Commodity 3: 85.90 − 84.60 = +1.30.", "trap": "현물 − 선물은 basis이지 calendar spread가 아니다. 순서(근월 − 원월)를 뒤집지 않는다.", "f": "Calendar spread = near-term futures − farther-term futures", "why": {"B": "근월·원월 가격이 같아 spread가 0입니다(830 − 835는 basis).", "C": "85.90 − 84.60 = +1.30으로 양수입니다(순서를 뒤집어야 음수)."}, "orig": "Mock 2 Session 1 Q13", "conf": false}, {"id": "mock2-1-Q14", "src": "오답", "module": "AI", "tag": "선물 곡선 이론 (backwardation)", "vig": 3, "stem": "Based on Exhibit 1 and Becker's additional information, the shape of the futures price curve of Commodity 3 is most consistent with the:", "opts": {"A": "insurance theory.", "B": "theory of storage.", "C": "hedging pressure hypothesis."}, "ans": "B", "en": "A. insurance theory. — Incorrect\nIncorrect because the insurance theory explains the situation of backwardation with the fact that there is more hedging by producers than consumers. Alternatively, this theory posits that the futures price has to be lower than the current spot price as a form of payment or remuneration to the speculator who takes on the price risk and provides price insurance to the commodity seller. However, the case states that hedging by consumers exceeds hedging by producers, which is inconsistent with the insurance theory, given that the market is in backwardation.\nB. theory of storage. — Correct\nCorrect because Commodity 3 is in backwardation. Backwardation occurs when the convenience yield exceeds storage costs, based on the following formula, which describes the theory of storage: Futures Price = Spot Price + Direct Storage Costs – Convenience Yield. This situation is described in the vignette.\nIn contrast, the fact that hedging by consumers exceeds hedging by producers would lead to a situation of contango based on the hedging pressure hypothesis. However, based on Exhibit 1, Commodity 3 is in backwardation, which means that this theory cannot explain the shape of the price curve. Finally, while the insurance theory describes a situation of backwardation, it requires that there is more hedging by producers than by consumers.\nTo sum up, the backwardation of Commodity 3 is consistent with the theory of storage and the situation where the convenience yield exceeds storage costs. Given Becker's information about relative hedging positions, backwardation cannot be explained by either the insurance theory or the hedging pressure hypothesis, since backwardation would require hedging demand of producers (and not consumers) to exceed hedging demand of consumers (and not producers).\nC. hedging pressure hypothesis. — Incorrect\nIncorrect because the hedging pressure hypothesis describes the shape of the price curve with reference to relative hedging demand. The case states that there is more demand for hedging from consumers than from producers. Based on the hedging pressure hypothesis, this will lead to a situation of contango. However, Commodity 3 is in backwardation.", "ko": "Commodity 3은 현물 87.20 > 근월 85.90 > 원월 84.60이라 backwardation이다. 정보: 소비자 헤지 수요 > 생산자 헤지 수요, convenience yield > 저장비용. 저장 이론(선물 = 현물 + 저장비용 − convenience yield)에서는 convenience yield가 크면 선물이 현물보다 낮아 backwardation이 된다 → 맞음. 헤지 압력 가설에서는 소비자 헤지가 많으면(소비자가 선물 매수) contango가 되어야 하는데 실제는 backwardation → 설명 못 함. 보험 이론도 생산자 헤지가 많아야 backwardation이라 맞지 않는다.", "trap": "소비자 헤지 우세 → 헤지 압력 가설로는 contango. 실제 곡선과 반대라 답이 될 수 없다.", "f": "Futures = Spot + Storage cost − Convenience yield", "why": {"A": "보험 이론은 생산자 헤지가 많을 때 backwardation을 설명합니다. 여기는 소비자 헤지가 많습니다.", "C": "소비자 헤지가 많으면 헤지 압력 가설은 contango를 예측하지만 Commodity 3은 backwardation입니다."}, "orig": "Mock 2 Session 1 Q14", "conf": false, "my": "C"}, {"id": "mock2-1-Q15", "src": "정답", "module": "AI", "tag": "선물 총수익 (price + roll + collateral)", "vig": 3, "stem": "The 2-month total return of Wyman's position in Commodity 3 is closest to:", "opts": {"A": "–0.4%.", "B": "2.9%.", "C": "3.9%."}, "ans": "B", "en": "A. –0.4%. — Incorrect\nIncorrect because the roll return is calculated incorrectly by reversing near-term and farther-term futures prices in the numerator. The total return is the sum of price return, roll return, and collateral return as follows:\nPrice return = (Current price – Previous price)/Previous price = ($85.50 – $84.60)/$84.60 = 0.01063830\nRoll return for the entire position is calculated incorrectly by reversing near-term and farther-term futures prices as follows: (Farther-term futures price – Near-term futures price)/Near-term futures price = ($84.10 – $85.50)/$85.50 = –0.01637427\nCollateral return for 2 months (based on a fully collateralized position and an annualized return of 1.2%) = 0.012 × 2/12 = 0.002\nTotal return = 0.01063830 – 0.01637427 + 0.002 = –0.00373597 ≈ –0.4%\nIf the denominator is also incorrectly swapped when calculating the roll return, we get: (Farther-term futures price – Near-term futures price)/Farther-term futures price = ($84.10 – $85.50)/$84.10 = –0.01664685. In this case, the total return is incorrectly calculated as 0.01063830 – 0.01664685 + 0.002 = –0.00400855 ≈ –0.4%.\nB. 2.9%. — Correct\nCorrect because the total return is the sum of price return, roll return, and collateral return as follows:\nPrice return = (Current price – Previous price)/Previous price = ($85.50 – $84.60)/$84.60 = 0.01063830\nRoll return for the entire position = (Near-term futures price – Farther-term futures price)/Near-term futures price = ($85.50 – $84.10)/$85.50 = 0.01637427\nCollateral return for 2 months (based on a fully collateralized position and an annualized return of 1.2%) = 0.012 × 2/12 = 0.002\nTotal return = 0.01063830 + 0.01637427 + 0.002 = 0.02901257 ≈ 2.9%\nC. 3.9%. — Incorrect\nIncorrect because the collateral return is calculated for one year and not for two months. The total return is the sum of price return, roll return, and collateral return as follows:\nPrice return = (Current price – Previous price)/Previous price = ($85.50 – $84.60)/$84.60 = 0.01063830\nRoll return for the entire position = (Near-term futures price – Farther-term futures price)/Near-term futures price = ($85.50 – $84.10)/$85.50 = 0.01637427\nCollateral return (based on a fully collateralized position) is incorrectly taken for 1 year: 0.012\nTotal return = 0.01063830 + 0.01637427 + 0.012 = 0.03901257 ≈ 3.9%", "ko": "가격 수익 = (85.50 − 84.60) / 84.60 = 1.064%. 롤 수익 = (근월 − 원월) / 근월 = (85.50 − 84.10) / 85.50 = 1.637% (backwardation이라 양수). 담보 수익 = 1.2% × 2/12 = 0.2%. 합계 = 1.064 + 1.637 + 0.2 = 2.9%.", "trap": "롤 수익 분자는 근월 − 원월. 담보 수익은 보유 기간(2/12)만큼만.", "f": "Total = Price return + Roll return + Collateral return, Roll = (F_near − F_far) / F_near", "why": {"A": "롤 수익의 근월·원월 순서를 뒤집어 음수로 계산했습니다.", "C": "담보 수익을 2개월이 아니라 1년치(1.2%)로 넣었습니다."}, "orig": "Mock 2 Session 1 Q15", "conf": false}, {"id": "mock2-1-Q16", "src": "오답", "module": "AI", "tag": "상품 지수 선택: 리밸런싱·backwardation", "vig": 3, "stem": "Based on his objective regarding the commodity index investment, Wyman should select an index that:", "opts": {"A": "rebalances frequently and contains a large percentage of constituents in backwardation.", "B": "rebalances frequently and contains a small percentage of constituents in backwardation.", "C": "rebalances infrequently and contains a large percentage of constituents in backwardation."}, "ans": "C", "en": "A. rebalances frequently and contains a large percentage of constituents in backwardation. — Incorrect\nIncorrect because frequent rebalancing can lead to underperformance in a trending market, because the outperforming assets are sold, but will continue up in price, whereas the underperforming assets are purchased, but will drift lower. With regard to backwardation, commodity sectors in backwardation typically improve index returns. This is because backwardation leads to positive roll returns.\nB. rebalances frequently and contains a small percentage of constituents in backwardation. — Incorrect\nIncorrect because frequent rebalancing can lead to underperformance in a trending market, because the outperforming assets are sold, but will continue up in price, whereas the underperforming assets are purchased, but will drift lower. Also, a small percentage of constituents in backwardation limits the potential for positive roll return. Instead, a large percentage of constituents in backwardation is preferred.\nC. rebalances infrequently and contains a large percentage of constituents in backwardation. — Correct\nCorrect because in markets that are trending, infrequent rebalancing coupled with a large percentage of constituents in backwardation provides the largest contribution to performance among the three options. With regard to rebalancing, frequent rebalancing can lead to underperformance in a trending market, because the outperforming assets are sold, but will continue up in price, whereas the underperforming assets are purchased, but will drift lower. With regard to backwardation, commodity sectors in backwardation typically improve index returns. This is because backwardation leads to positive roll returns. So a large percentage of constituents in backwardation is preferred.", "ko": "추세장(오른 것은 계속 오르고 내린 것은 계속 내림)에서는 자주 리밸런싱하면 오른 것을 팔고 내린 것을 사게 되어 손해다 → 리밸런싱은 드물게. 곡선 모양이 그대로라면 backwardation 종목은 롤 수익이 양수라 지수 수익을 높인다 → backwardation 비중이 큰 지수. 따라서 C.", "trap": "추세장 = 리밸런싱을 덜 할수록 유리. 리밸런싱은 평균 회귀(mean-reverting) 장에서 유리하다.", "f": "", "why": {"A": "backwardation 비중은 맞지만 추세장에서 잦은 리밸런싱은 성과를 깎습니다.", "B": "잦은 리밸런싱도, 적은 backwardation 비중(롤 수익 제한)도 불리합니다."}, "orig": "Mock 2 Session 1 Q16", "conf": true, "my": "A"}, {"id": "mock2-1-Q17", "src": "정답", "module": "EQ", "tag": "정규화 EPS: average ROE method", "vig": 4, "stem": "Based on the average ROE method, Delong's normalized EPS is closest to:", "opts": {"A": "EUR 1.68.", "B": "EUR 1.79.", "C": "EUR 1.96."}, "ans": "B", "en": "A. EUR 1.68. — Incorrect\nIncorrect because it multiplies the average book value per share over the business cycle by the average ROE over the business cycle instead of using the book value per share for the most recent year:\nNormalized EPS = 16.0% × EUR 10.5 =1.68\nThe same answer can be obtained by multiplying book value per share by ROE for most recent year as well as the average over 5 years.\nNormalized EPS = EUR 11.2 ×15% = 1.68\nNormalized EPS = EUR 9.6 ×17.5% = 1.68\nB. EUR 1.79. — Correct\nCorrect because it multiplies average ROE over the most recent business cycle by the book value per share for the most recent year:\nNormalized EPS = 16.0% × EUR 11.2 = 1.792 or 1.79\nMond uses the method of average return on equity, in which normalized EPS is calculated as the average return on equity (ROE) from the most recent full cycle, multiplied by current book value per share.\nThis alternative, by using recent book value per share, reflects more accurately\nthe effect on EPS of growth or shrinkage in the company’s size.\nC. EUR 1.96. — Incorrect\nIncorrect because it multiplies the long-term historical average ROE by the book value per share for the most recent year instead of using the average ROE over most recent business cycle:\nNormalized EPS = 17.5% × EUR 11.2 = 1.96", "ko": "average ROE method = 최근 경기 사이클의 평균 ROE × 현재(최근 연도) BVPS. 16.0% × EUR 11.2 = EUR 1.79. 최근 BVPS를 쓰는 이유는 회사 규모의 성장·축소를 EPS에 반영하기 위해서다.", "trap": "ROE는 '최근 사이클 평균', BVPS는 '현재' 값. 장기 평균 ROE가 아니다.", "f": "Normalized EPS = 사이클 평균 ROE × 현재 BVPS", "why": {"A": "BVPS까지 사이클 평균(10.5)을 썼습니다.", "C": "사이클 평균 대신 장기 평균 ROE(17.5%)를 썼습니다."}, "orig": "Mock 2 Session 1 Q17", "conf": false}, {"id": "mock2-1-Q18", "src": "정답", "module": "EQ", "tag": "justified trailing P/E", "vig": 4, "stem": "Based on Mond's forecasted fundamentals, Delong's justified trailing P/E is closest to:", "opts": {"A": "14.8.", "B": "17.0.", "C": "18.4."}, "ans": "C", "en": "A. 14.8. — Incorrect\nIncorrect because the calculation uses the dividend payout ratio rather than the retention rate, giving a value of 14.8.\nFormula for justified trailing P/E:\nP0/E0 = (1 – b)(1 + g)/(r – g)\nUsing the wrong b = 0.46.\nGiven the ROE of 15%, g = b × ROE = 0.46 × 15% = 6.9%.\nRequired rate of return, r = 10.8%\nJustified trailing P/E = (1 – 0.46) × (1 + 0.069)/(0.108 – 0.069) = 14.802 or 14.8\nB. 17.0. — Incorrect\nIncorrect because this is the calculation of justified forward P/E rather than justified trailing P/E, giving a value of 17.0.\nFormula for justified forward P/E:\nP0/E1 = (1 – b)/(r – g)\nDelong's dividend payout ratio is 46%, thus making b = (1 – 0.46) = 0.54.\nGiven the ROE of 15%, g = b × ROE = 0.54 × 15% = 8.1%.\nRequired rate of return, r = 10.8%\nJustified forward P/E = (1 – 0.54)/(0.108 – 0.081) = 17.037 or 17.0\nC. 18.4. — Correct\nCorrect because based on Mond's forecasted fundamentals, the justified trailing P/E for Delong shares is 18.4.\nThe P/E of a share can be related to the value of a stock as calculated in the Gordon growth model through the expression:\nP0/E0 = (1 – b)(1 + g)/(r – g)\nfor the trailing P/E, where\nP = price\nE = earnings\nb = retention rate\ng = dividend growth rate\nr = required rate of return\nDelong's dividend payout ratio is 46%, thus b = (1 – 0.46) = 0.54.\nGiven the ROE of 15%, g= b × ROE = 0.54 × 15% = 8.1%.\nRequired rate of return, r = 10.8%\nJustified trailing P/E = (1 – 0.54) × (1 + 0.081)/(0.108 – 0.081) = 18.417 or 18.4", "ko": "유보율 b = 1 − 0.46 = 0.54, g = b × ROE = 0.54 × 15% = 8.1%. trailing P/E = (1 − b)(1 + g) / (r − g) = 0.46 × 1.081 / (0.108 − 0.081) = 0.4973 / 0.027 = 18.4.", "trap": "trailing은 (1 + g)를 곱한다. g는 payout이 아니라 유보율 × ROE.", "f": "Trailing P0/E0 = (1 − b)(1 + g)/(r − g), Forward P0/E1 = (1 − b)/(r − g), g = b × ROE", "why": {"A": "유보율 대신 배당성향 0.46을 b로 써서 g = 6.9%가 됐습니다.", "B": "(1 + g)를 곱하지 않은 forward P/E(17.0)입니다."}, "orig": "Mock 2 Session 1 Q18", "conf": false}, {"id": "mock2-1-Q19", "src": "정답", "module": "EQ", "tag": "벤치마크 배수: harmonic mean", "vig": 4, "stem": "Which of the following measures of central tendency should Mond use to calculate the industry benchmark multiple?", "opts": {"A": "Median", "B": "Harmonic mean", "C": "Arithmetic mean"}, "ans": "B", "en": "A. Median — Incorrect\nIncorrect because the median mitigates the impact of both large and small outliers. Using the median rather than the arithmetic mean to derive an average multiple mitigates the effect of outliers. This would also mitigate an impact of small outliers, but such outliers are already bounded by zero on the downside.\nThe harmonic mean is more appropriate as the competitor's multiples are bounded by zero on the downside, but include very large outliers, and Mond wants to use a measure of central tendency, which mitigates the impact of large, but not small outliers.\nB. Harmonic mean — Correct\nCorrect because harmonic mean meets Mond's objective of being a measure of central tendency which mitigates the impact of large, but not small outliers. The harmonic mean is sometimes also used to reduce the impact of large outliers—which are typically the major concern in using the arithmetic mean multiple—but not the impact of small outliers (i.e., those close to zero). The harmonic mean tends to mitigate the impact of large outliers.\nC. Arithmetic mean — Incorrect\nIncorrect because the arithmetic average is impacted by outliers, especially the large outliers. Mond wants to use a measure of central tendency, which mitigates the impact of large outliers, and therefore the harmonic mean would be more appropriate.", "ko": "배수는 0 아래로 내려가지 않고 아주 큰 이상치가 있다. 큰 이상치의 영향은 줄이되 작은 이상치(0 근처)는 줄이지 않는 지표가 harmonic mean이다. median은 큰 것·작은 것 모두 줄이고, arithmetic mean은 큰 이상치에 크게 흔들린다.", "trap": "큰 이상치만 줄임 = harmonic mean, 양쪽 다 줄임 = median.", "f": "", "why": {"A": "median은 큰 이상치와 작은 이상치를 모두 줄입니다.", "C": "산술평균은 큰 이상치에 크게 영향을 받습니다."}, "orig": "Mock 2 Session 1 Q19", "conf": false}, {"id": "mock2-1-Q20", "src": "정답", "module": "EQ", "tag": "PEG ratio의 한계", "vig": 4, "stem": "Will the alternative valuation method that Mond considers address the two growth differences between Gruseb and its peers?", "opts": {"A": "Yes", "B": "No, it will not address the difference in the duration of growth", "C": "No, it will not address the difference in expected earnings growth"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because although PEG ratio addresses the impact of earnings growth, it does not account for the difference in growth duration.\nA metric that appears to address the impact of earnings growth on P/E is the P/E-to-growth (PEG) ratio. The PEG ratio is calculated as the stock’s P/E divided by the expected earnings growth rate (in percentage terms).\nThe PEG ratio does not account for differences in the duration of growth. For example, dividing P/Es by short-term (five-year) growth forecasts may not capture differences in long-term growth prospects.\nB. No, it will not address the difference in the duration of growth — Correct\nCorrect because although PEG ratio addresses the impact of earnings growth, it does not account for the difference in growth duration.\nA metric that appears to address the impact of earnings growth on P/E is the P/E-to-growth (PEG) ratio. The PEG ratio is calculated as the stock’s P/E divided by the expected earnings growth rate (in percentage terms).\nThe PEG ratio does not account for differences in the duration of growth. For example, dividing P/Es by short-term (five-year) growth forecasts may not capture differences in long-term growth prospects.\nC. No, it will not address the difference in expected earnings growth — Incorrect\nIncorrect because PEG ratio addresses the impact of earnings growth.\nA metric that appears to address the impact of earnings growth on P/E is the P/E-to-growth (PEG) ratio. The PEG ratio is calculated as the stock’s P/E divided by the expected earnings growth rate (in percentage terms).", "ko": "PEG = P/E ÷ 기대 이익성장률(%). 성장률 차이는 반영하지만 성장이 얼마나 오래 이어지는지(duration)는 반영하지 못한다. 예를 들어 5년 성장 예측으로 나누면 장기 성장 전망 차이는 놓친다. 따라서 B.", "trap": "PEG는 성장률은 반영, 성장 지속 기간은 반영 못 함.", "f": "PEG = (P/E) / g(%)", "why": {"A": "PEG는 성장 지속 기간 차이를 반영하지 못합니다.", "C": "PEG는 기대 이익성장률 차이는 반영합니다."}, "orig": "Mock 2 Session 1 Q20", "conf": true}, {"id": "mock2-1-Q21", "src": "정답", "module": "FSA", "tag": "equity method vs 연결: 순이익률", "vig": 5, "stem": "Delphine's net profit margin under Scenario 1 would be:", "opts": {"A": "lower than under Scenario 2.", "B": "the same as under Scenario 2.", "C": "higher than under Scenario 2."}, "ans": "C", "en": "A. lower than under Scenario 2. — Incorrect\nIncorrect because sales would be higher under Scenario 2, while net income would be the same under Scenario 1 and Scenario 2, making net profit margin (net income / sales) higher under Scenario 1. This answer incorrectly assumes that sales is the same under both scenarios but that net income is higher under consolidation (Scenario 2), or that net income is the same under both scenarios but that sales is lower under Scenario 2.\nB. the same as under Scenario 2. — Incorrect\nIncorrect because sales would be higher under Scenario 2, while net income would be the same under Scenario 1 and Scenario 2, making net profit margin (net income / sales) higher under Scenario 1. This answer incorrectly assumes that the equity method (Scenario 1) and consolidation (Scenario 2) have the same effect on net income and sales.\nC. higher than under Scenario 2. — Correct\nCorrect because the ability to exercise significant influence (Scenario 1) requires use of the equity method to account for intercompany investments. In contrast, the ability to exercise control (Scenario 2) requires consolidation.\nThe equity method is often referred to as 'one-line consolidation' because the investor’s proportionate ownership interest in the assets and liabilities of the investee is disclosed as a single line item (net assets) on its balance sheet, and the investor’s share of the revenues and expenses of the investee is disclosed as a single line item on its income statement. In contrast, consolidation combines the assets, liabilities, revenues, and expenses of subsidiaries with the parent company. Importantly, net margin ratios could be overstated under Scenario 1, the equity method because income for the associate is included in investor net income but is not specifically included in sales.\nThus, net income would be the same under either Scenario 1 or Scenario 2. However, in Scenario 2, Delphine would include Company A's sales in the consolidated financial statements, thereby causing net profit margin (net income / sales) to be higher under Scenario 1 than under Scenario 2.", "ko": "Scenario 1(significant influence)은 equity method, Scenario 2(control)는 연결(consolidation)이다. 순이익은 두 방법이 같다. 하지만 연결하면 Company A의 매출이 Delphine 매출에 더해진다. 분모(매출)가 커지므로 연결 쪽 순이익률이 낮고, equity method(Scenario 1)의 순이익률이 더 높다.", "trap": "순이익은 같고 매출만 연결에서 커진다 → equity method 마진이 더 높다.", "f": "Net profit margin = 순이익 / 매출", "why": {"A": "연결이 순이익을 키운다고 보거나 매출을 줄인다고 착각했습니다.", "B": "두 방법의 매출이 같다고 봤지만 연결은 피투자회사 매출을 더합니다."}, "orig": "Mock 2 Session 1 Q21", "conf": false}, {"id": "mock2-1-Q22", "src": "오답", "module": "FSA", "tag": "IFRS 손상차손 (CGU)", "vig": 5, "stem": "Based on Kriser's projections, the expected impairment loss for Delphine's cash-generating unit is:", "opts": {"A": "€200,000.", "B": "€300,000.", "C": "€500,000."}, "ans": "C", "en": "A. €200,000. — Incorrect\nIncorrect because the impairment loss under IFRS is the difference between the recoverable amount and the carrying value of the cash-generating unit. This answer choice assumes that the impairment loss is the difference between the excess carrying value and the recorded goodwill of the cash-generating unit.\nB. €300,000. — Incorrect\nIncorrect because the impairment loss (the difference between these two amounts) is first applied to the goodwill that has been allocated to the cash-generating unit. Once this has been reduced to zero, the remaining amount of the loss is then allocated to all of the other non-cash assets in the unit on a pro rata basis. This answer choice assumes that the impairment loss is limited to the goodwill allocated to the reporting unit.\nC. €500,000. — Correct\nCorrect because, under IFRS, an impairment loss is recognized if the recoverable amount of the cash-generating unit is less than its carrying value. The impairment loss (the difference between these two amounts) is first applied to the goodwill that has been allocated to the cash-generating unit. Once this has been reduced to zero, the remaining amount of the loss is then allocated to all of the other non-cash assets in the unit on a pro rata basis. In the vignette, the recoverable amount of the cash-generating unit is €17,700,000 and the carrying value is €18,200,000, which makes the impairment loss equal to €500,000.", "ko": "IFRS에서는 CGU의 회수가능액이 장부가보다 작으면 그 차이 전부가 손상차손이다. 18,200,000 − 17,700,000 = €500,000. 이 손실은 먼저 CGU에 배분된 goodwill(€300,000)을 0까지 줄이고, 남은 €200,000은 다른 자산에 비례 배분한다. 손실 총액은 €500,000.", "trap": "goodwill 300,000은 손실을 '먼저 배분하는 곳'이지 손실 한도가 아니다.", "f": "Impairment loss = Carrying value − Recoverable amount (IFRS, one-step)", "why": {"A": "goodwill을 빼고 남은 금액(200,000)만 손실로 봤습니다.", "B": "손실이 goodwill 금액까지만 생긴다고 봤습니다."}, "orig": "Mock 2 Session 1 Q22", "conf": false, "my": "B"}, {"id": "mock2-1-Q23", "src": "정답", "module": "FSA", "tag": "earnings persistence: 현금 vs 발생액", "vig": 5, "stem": "Which of the following best supports Kriser's expectation for Delphine's earnings persistence?", "opts": {"A": "The cash component of Delphine's earnings is less than the accrual component", "B": "The cash component of Delphine's earnings is equal to the accrual component", "C": "The cash component of Delphine's earnings is greater than the accrual component"}, "ans": "C", "en": "A. The cash component of Delphine's earnings is less than the accrual component — Incorrect\nIncorrect because a lower cash component of earnings is consistent with less (not more) persistent earnings.\nB. The cash component of Delphine's earnings is equal to the accrual component — Incorrect\nIncorrect because a higher (not equal) cash component of earnings is consistent with more persistent earnings.\nC. The cash component of Delphine's earnings is greater than the accrual component — Correct\nCorrect because earnings can be viewed as being composed of a cash component and an accruals component. Earnings with a larger component of accruals would be less persistent and thus of lower quality. A higher cash component of earnings (relative to the accrual component of earnings) is most consistent with greater earnings persistence.", "ko": "이익은 현금 부분과 발생액(accrual) 부분으로 나뉜다. 발생액 비중이 클수록 이익의 지속성이 낮고 질이 낮다. 지속성이 높다면 현금 부분이 발생액 부분보다 커야 한다.", "trap": "현금 비중 ↑ = 지속성 ↑.", "f": "", "why": {"A": "현금 부분이 작으면 지속성이 낮습니다.", "B": "같은 것이 아니라 현금 부분이 더 커야 지속성이 높습니다."}, "orig": "Mock 2 Session 1 Q23", "conf": false}, {"id": "mock2-1-Q24", "src": "정답", "module": "FSA", "tag": "이자 현금흐름 분류: IFRS vs US GAAP", "vig": 5, "stem": "Is Delphine's classification of interest paid and interest received consistent with competitors that report under US GAAP?", "opts": {"A": "Yes", "B": "No, the classification of interest paid is not consistent", "C": "No, the classification of interest received is not consistent"}, "ans": "C", "en": "A. Yes — Incorrect\nIncorrect because IFRS also permits companies to classify interest and dividends received as operating or as investing. In contrast, US GAAP requires that interest paid, interest received, and dividends received all be classified as operating cash flows. Thus, Delphine's classification of interest received as investing is not consistent with competitors that report under US GAAP.\nB. No, the classification of interest paid is not consistent — Incorrect\nIncorrect because IFRS permits companies to classify interest paid either as operating or as financing. In contrast, US GAAP requires that interest paid, interest received, and dividends received all be classified as operating cash flows. Thus, Delphine's classification of interest paid as operating is consistent with competitors that report under US GAAP.\nC. No, the classification of interest received is not consistent — Correct\nCorrect because IFRS permits companies to classify interest paid either as operating or as financing. IFRS also permits companies to classify interest and dividends received as operating or as investing. In contrast, US GAAP requires that interest paid, interest received, and dividends received all be classified as operating cash flows. Thus, Delphine's classification of interest received as investing is not consistent with competitors that report under US GAAP.", "ko": "US GAAP은 이자 지급·이자 수취·배당 수취를 모두 영업활동(CFO)으로 분류한다. IFRS는 이자 지급을 영업 또는 재무, 이자·배당 수취를 영업 또는 투자로 고를 수 있다. Delphine은 이자 지급을 영업(US GAAP과 같음), 이자 수취를 투자(US GAAP과 다름)로 분류했다. 따라서 이자 수취가 일치하지 않는다.", "trap": "US GAAP: 이자 지급·수취, 배당 수취 = 모두 CFO (배당 지급만 CFF).", "f": "", "why": {"A": "이자 수취를 투자로 분류한 것은 US GAAP과 다릅니다.", "B": "이자 지급을 영업으로 분류한 것은 US GAAP과 같습니다."}, "orig": "Mock 2 Session 1 Q24", "conf": true}, {"id": "mock2-1-Q25", "src": "오답", "module": "ETH", "tag": "Standard I(C): 원출처 인용", "vig": 6, "stem": "Did Garrett violate the Standards in her report on industry trends?", "opts": {"A": "No", "B": "Yes, because she did not cite the trade association", "C": "Yes, because she did not independently review the trade association report"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because in all instances, a member or candidate must cite the actual source of the information. Best practice would be either to obtain the complete study from its original author and cite only that author or to use the information provided by the intermediary and cite both sources. An unprepared candidate might select this response believing that the media outlet citation is sufficient.\nB. Yes, because she did not cite the trade association — Correct\nCorrect because in all instances, a member or candidate must cite the actual source of the information. Best practice would be either to obtain the complete study from its original author and cite only that author or to use the information provided by the intermediary and cite both sources.\nC. Yes, because she did not independently review the trade association report — Incorrect\nIncorrect because there is no requirement that the analyst independently review third-party research. From the reading, in the case of distributing third-party, outsourced research, members and candidates may use and distribute such reports as long as they do not represent themselves as the report’s authors. Indeed, the member or candidate may add value for the client by sifting through research and repackaging it for clients. Therefore, there is no violation of Standard I(C) - Diligence and Reasonable Basis. An unprepared candidate might select this option believing that such reports must be independently reviewed.", "ko": "Garrett은 무역협회 연구를 직접 구하지 않고 신문 기사 요약을 보고서에 넣으면서 신문만 인용했다. 정보의 실제 출처(무역협회)를 반드시 밝혀야 하므로 위반이다. 모범 관행은 원 연구를 구해 원저자만 인용하거나, 중간 매체 정보를 쓰고 두 출처를 모두 인용하는 것이다. 제3자 연구를 직접 검토해야 한다는 요구는 없다.", "trap": "신문만 인용 = 위반. 원 보고서를 직접 검토할 의무는 없다.", "f": "", "why": {"A": "신문 인용만으로는 부족합니다. 실제 출처인 무역협회를 밝혀야 합니다.", "C": "제3자 연구를 독립적으로 검토해야 한다는 요구는 없습니다."}, "orig": "Mock 2 Session 1 Q25", "conf": true, "my": "A"}, {"id": "mock2-1-Q26", "src": "정답", "module": "ETH", "tag": "그룹 리서치 보고서 (I(C))", "vig": 6, "stem": "Were the Standards violated in the publication of the investment committee report?", "opts": {"A": "No", "B": "Yes, because Garrett's opinion should have been included", "C": "Yes, because Garrett should not have been listed as an author"}, "ans": "A", "en": "A. No — Correct\nCorrect because in a group research setting, the conclusions or recommendations of the group report represent the consensus of the group and are not necessarily the views of the member or candidate, even though the name of the member or candidate is included on the report. In some instances, a member or candidate will not agree with the view of the group. If, however, the member or candidate believes that the consensus opinion has a reasonable and adequate basis and is independent and objective, the member or candidate need not decline to be identified with the report. If the member or candidate is confident in the process, the member or candidate does not need to dissociate from the report even if it does not reflect his or her opinion.\nB. Yes, because Garrett's opinion should have been included — Incorrect\nIncorrect because the conclusions or recommendations of the group report represent the consensus of the group and are not necessarily the views of the member or candidate, even though the name of the member or candidate is included on the report. An unprepared candidate might select this response believing that group research reports must reflect the opinions of all the authors.\nC. Yes, because Garrett should not have been listed as an author — Incorrect\nIncorrect because if the member or candidate believes that the consensus opinion has a reasonable and adequate basis and is independent and objective, the member or candidate need not decline to be identified with the report. If the member or candidate is confident in the process, the member or candidate does not need to dissociate from the report even if it does not reflect his or her opinion. An unprepared candidate might select this response believing that dissenting analysts must dissociate from the group report.", "ko": "위원회 보고서는 그룹의 합의 의견이고, Garrett은 의견이 달라도 그 결론에 합리적 근거가 있다고 인정했다. 이런 경우 자신의 의견이 빠져도 보고서에 이름을 올릴 수 있고, 거리를 둘 필요도 없다. 위반 없음.", "trap": "합의 결론에 합리적 근거가 있다고 믿으면 반대 의견이어도 저자로 남아도 된다.", "f": "", "why": {"B": "그룹 보고서는 합의 의견이라 모든 저자의 의견을 담을 필요가 없습니다.", "C": "합의에 합리적 근거가 있다고 보면 이름을 빼지 않아도 됩니다."}, "orig": "Mock 2 Session 1 Q26", "conf": false}, {"id": "mock2-1-Q27", "src": "오답", "module": "ETH", "tag": "Standard IV(C) 권장: 윤리강령 내용", "vig": 6, "stem": "Is Garrett's statement about the Standard's recommendation for the code of ethics correct?", "opts": {"A": "Yes", "B": "No, with regard to compliance procedures", "C": "No, with regard to general fiduciary concepts"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because the recommended procedures for compliance with Standard IV(C) states stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. Further, separating the code of ethics from compliance procedures will also reduce, if not eliminate, the legal terminology and boilerplate language that can make the underlying ethical principles incomprehensible to the average person. An unprepared candidate might select this response believing that a code of ethics that is compliant with the Standards should include detailed compliance procedures.\nB. No, with regard to compliance procedures — Correct\nCorrect because the recommended procedures for compliance with Standard IV(C) states stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. Further, separating the code of ethics from compliance procedures will also reduce, if not eliminate, the legal terminology and boilerplate language that can make the underlying ethical principles incomprehensible to the average person.\nC. No, with regard to general fiduciary concepts — Incorrect\nIncorrect because the recommended procedures for compliance with Standard IV(C) states stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. An unprepared candidate might select this response believing that a code of ethics that is compliant with the Standards should not include general fiduciary concepts.", "ko": "Garrett은 윤리강령에 일반적인 fiduciary 개념과 '상세한 compliance 절차'를 모두 넣으라고 권장한다고 말했다. Standards는 윤리강령을 쉬운 말로 쓰고 일반 fiduciary 개념을 다루되, 상세 절차는 넣지 말고 따로 두라고 권장한다. 그래서 compliance 절차 부분이 틀렸다.", "trap": "윤리강령 = 쉬운 말 + fiduciary 개념, 상세 절차는 분리.", "f": "", "why": {"A": "상세 compliance 절차를 넣으라는 부분이 틀렸습니다.", "C": "일반 fiduciary 개념은 윤리강령에 넣는 것이 맞습니다."}, "orig": "Mock 2 Session 1 Q27", "conf": false, "my": "A"}, {"id": "mock2-1-Q28", "src": "정답", "module": "ETH", "tag": "Standard IV(A): 퇴사 후 모델 사용", "vig": 6, "stem": "Would Garrett violate the Standards if she uses the quantitative model at her new firm?", "opts": {"A": "No", "B": "Yes, unless she receives permission from IGMA", "C": "Yes, unless she receives written permission from her colleague at IGMA"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because when members and candidates are planning to leave their current employer, they must continue to act in the employer’s best interest. Activities that might constitute a violation, especially in combination, include self-dealing (appropriating for one’s own property a business opportunity or information belonging to one’s employer). The quantitative model developed with her colleague at AGM is the property of AGM. Thus, Garrett must receive permission from AGM to use the model at the new firm. An unprepared candidate might select this response believing that, because Garrett developed the model with another colleague, she is free to use it at the new firm.\nB. Yes, unless she receives permission from IGMA — Correct\nCorrect because when members and candidates are planning to leave their current employer, they must continue to act in the employer’s best interest. Activities that might constitute a violation, especially in combination, include self-dealing (appropriating for one’s own property a business opportunity or information belonging to one’s employer). The quantitative model developed with her colleague at AGM is the property of AGM. Thus, Garrett must receive permission from AGM to use the model at the new firm.\nC. Yes, unless she receives written permission from her colleague at IGMA — Incorrect\nIncorrect because when members and candidates are planning to leave their current employer, they must continue to act in the employer’s best interest. Activities that might constitute a violation, especially in combination, include self-dealing (appropriating for one’s own property a business opportunity or information belonging to one’s employer). The quantitative model developed with her colleague at AGM is the property of AGM. Thus, Garrett must receive permission from AGM to use the model at the new firm. An unprepared candidate might select this response believing that, because Garrett developed the model with another colleague, she must receive permission from her colleague to use it at the new firm.", "ko": "Garrett이 동료와 IGMA에서 만든 정량 모델은 IGMA(고용주) 재산이다. 새 회사에서 쓰려면 IGMA의 허락을 받아야 한다. 허락 없이 쓰면 고용주의 재산을 가져가는 것이라 loyalty 위반이다. 함께 만든 동료의 허락으로는 안 된다.", "trap": "직장에서 만든 모델의 주인은 회사. 동료가 아니라 회사 허락.", "f": "", "why": {"A": "자신이 만들었어도 모델은 IGMA 재산이라 허락 없이 쓰면 위반입니다.", "C": "모델의 주인은 동료가 아니라 IGMA입니다."}, "orig": "Mock 2 Session 1 Q28", "conf": false}, {"id": "mock2-1-Q29", "src": "정답", "module": "PM", "tag": "ETF 프리미엄과 AP 창출", "vig": 7, "stem": "To take advantage of the pricing differential in ETF Zulu, the authorized participants could:", "opts": {"A": "create ETF Zulu shares.", "B": "redeem ETF Zulu shares.", "C": "buy back ETF Zulu shares from investors."}, "ans": "A", "en": "A. create ETF Zulu shares. — Correct\nCorrect because the share price of ETF Zulu is at a premium to the net asset value of its underlying securities. When the value of the security basket is different from the value of the corresponding ETF shares it represents, a potential arbitrage opportunity exists for APs to step in and transact in the ETF market. So, an AP will step in to create ETF shares (buy the basket of securities and simultaneously sell ETF shares on the open market for the higher price), realizing the difference. This action puts downward pressure on the ETF price because the AP is selling shares out into the market and puts upward pressure on the prices of the underlying securities because the AP went out into the market and bought the underlying shares. APs will continue this process until no further arbitrage opportunity exists.\nB. redeem ETF Zulu shares. — Incorrect\nIncorrect. The unprepared candidate may think that redeeming ETF Zulu shares (selling the underlying securities and buying ETF Zulu shares) is the expected reaction from the APs. This would be the case if the ETF was trading at a discount to its NAV.\nC. buy back ETF Zulu shares from investors. — Incorrect\nIncorrect. The unprepared candidate who does not understand the redemption/creation process may think that APs will buy back ETF Zulu shares from investors to keep the ETF in a tighter range around the NAV.", "ko": "ETF Zulu가 NAV보다 비싸다(프리미엄). AP는 싼 기초 주식 바스켓을 사서 ETF 주식을 새로 만들고(creation), 비싼 ETF를 시장에 판다. 이 과정에서 ETF 가격은 내려가고 기초 주식 가격은 올라 차이가 사라진다.", "trap": "프리미엄 → creation, 할인 → redemption.", "f": "", "why": {"B": "redemption은 ETF가 NAV보다 쌀 때(할인) 하는 일입니다.", "C": "AP가 투자자에게서 ETF를 되사는 것은 creation/redemption 과정이 아닙니다."}, "orig": "Mock 2 Session 1 Q29", "conf": false}, {"id": "mock2-1-Q30", "src": "정답", "module": "PM", "tag": "ETF 보유 기간 비용", "vig": 7, "stem": "The expected holding period cost for Granger's investment in ETF X-Ray is closest to:", "opts": {"A": "0.45%.", "B": "0.55%.", "C": "0.60%."}, "ans": "A", "en": "A. 0.45%. — Correct\nCorrect because the six-month holding period cost can be calculated as follows:\nHolding period cost (%) = Round-trip trade cost (%) + Management fee for period (%)\nWhere: Round-trip trading cost (%) = (One-way commission % × 2) + (1/2 × Bid–ask spread % × 2)\n= (One-way commission % × 2) + (1/2 × Bid–ask spread % × 2) + Management fee for period (%)\n= (0.10% × 2) + (1/2 × 0.15% × 2) + (6/12 × 0.20%)\n= 0.20% + 0.15% + 0.10%\n= 0.45%\nB. 0.55%. — Incorrect\nIncorrect. The candidate gets to this option by not adjusting the management fee for the six-month investment period as follows:\n= (One-way commission % × 2) + (1/2 × Bid–ask spread % × 2) + Management fee for period (%)\n= (0.10% × 2) + (1/2 × 0.15% × 2) + (0.20%)\n= 0.20% + 0.15% + 0.20%\n= 0.55%\nC. 0.60%. — Incorrect\nIncorrect. The candidate gets to this option by multiplying the full bid-ask spread by two as follows:\n= (One-way commission % × 2) + (Bid–ask spread % × 2) + Management fee for period (%)\n= (0.10% × 2) + (0.15% × 2) + (6/12 × 0.20%)\n= 0.20% + 0.30% + 0.10%\n= 0.60%", "ko": "왕복 거래비용 = 편도 수수료 × 2 + (½ × 호가 스프레드) × 2 = 0.10% × 2 + ½ × 0.15% × 2 = 0.20% + 0.15% = 0.35%. 운용보수는 6개월만큼 = 0.20% × 6/12 = 0.10%. 합계 = 0.45%.", "trap": "스프레드는 한 번 거래에 절반씩 → 왕복이면 스프레드 1배. 보수는 보유 기간만큼.", "f": "Holding cost = 2 × 수수료 + 2 × (½ × 스프레드) + 연 보수 × 기간", "why": {"B": "연 운용보수 0.20%를 6개월로 나누지 않았습니다.", "C": "스프레드 전체를 2번 넣었습니다(0.30%)."}, "orig": "Mock 2 Session 1 Q30", "conf": false}, {"id": "mock2-1-Q31", "src": "정답", "module": "PM", "tag": "Carhart 4요인 기대수익률", "vig": 7, "stem": "Based on the Carhart model, the equilibrium expected return on the portfolio of smart beta ETFs is closest to:", "opts": {"A": "7.6%.", "B": "10.2%.", "C": "12.1%."}, "ans": "C", "en": "A. 7.6%. — Incorrect\nIncorrect. The candidate gets to this option by omitting the risk-free rate (i.e., calculates excess return) as follows:\nE(Rp) = RF + βp,1RMRF + βp,2SMB + βp,3HML + βp,4WML\n= (1.0 ´ 2.5) + (‒1.8 ´ ‒1.7) + (0.7 ´ 2.1) + (0.2 ´ 2.8)\n= 2.5 + 3.06 + 1.47 + 0.56\n= 7.59\nB. 10.2%. — Incorrect\nIncorrect. The candidate gets to this option by adding the factor returns to the risk-free rate, i.e. he/she does not multiply them with the betas:\nE(Rp) = RF + βp,1RMRF + βp,2SMB + βp,3HML + βp,4WML\n= 4.5 + 2.5 ‒ 1.7 + 2.1 + 2.8\n= 10.20\nC. 12.1%. — Correct\nCorrect because the Carhart model can be stated as giving equilibrium expected return as:\nE(Rp) = RF + βp,1RMRF + βp,2SMB + βp,3HML + βp,4WML\nWhere:\nE(Rp) = expected return on the portfolio\nRF = risk-free rate of return\nβp = the sensitivity of the portfolio to the given factor\nRMRF = the return on a value-weighted equity index in excess of the one-month T-bill rate\nSMB = small minus big, a size (market capitalization) factor; SMB is the average return on three small-cap portfolios minus the average return on three large-cap portfolios\nHML = high minus low, the average return on two high book-to-market portfolios minus the average return on two low book-to-market portfolios\nWML = winners minus losers, a momentum factor; WML is the return on a portfolio of the past year’s winners minus the return on a portfolio of the past year’s losers. (Note that WML is an equally weighted average of the stocks with the highest 30% 11-month returns lagged 1 month minus the equally weighted average of the stocks with the lowest 30% 11-month returns lagged 1 month.)\n= 4.5 + (1.0 ´ 2.5) + (‒1.8 ´ ‒1.7) + (0.7 ´ 2.1) + (0.2 ´ 2.8)\n= 4.5 + 2.5 + 3.06 + 1.47 + 0.56\n= 12.09", "ko": "E(R) = RF + β1·RMRF + β2·SMB + β3·HML + β4·WML = 4.5 + 1.0×2.5 + (−1.8)×(−1.7) + 0.7×2.1 + 0.2×2.8 = 4.5 + 2.5 + 3.06 + 1.47 + 0.56 = 12.09% ≈ 12.1%.", "trap": "무위험이자율을 더하고, 음수 × 음수(SMB)는 양수다.", "f": "E(Rp) = RF + β·RMRF + β·SMB + β·HML + β·WML", "why": {"A": "무위험이자율 4.5%를 더하지 않았습니다(초과수익률만 계산).", "B": "요인 수익률에 민감도(β)를 곱하지 않고 그냥 더했습니다."}, "orig": "Mock 2 Session 1 Q31", "conf": false}, {"id": "mock2-1-Q32", "src": "정답", "module": "PM", "tag": "statistical vs macroeconomic 요인 모형", "vig": 7, "stem": "Are both of Granger's conclusions regarding the multifactor models used by the European equity ETFs correct?", "opts": {"A": "Yes", "B": "No, only Conclusion 1 is correct", "C": "No, only Conclusion 2 is correct"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect as Conclusion 1 is correct, but Conclusion 2 is incorrect. The unprepared candidate may choose this option if he/she correctly reasons that (1) Conclusion 1 is correct, and incorrectly reasons that (2) because statistical factor models make minimal assumptions, statistical factors are also easier to interpret than macroeconomic factors.\nB. No, only Conclusion 1 is correct — Correct\nCorrect because:\nA potential advantage of statistical factor models is that they make minimal assumptions and the interpretation of statistical factors is generally difficult in contrast to macroeconomic and fundamental factors.\nConclusion 1 is therefore correct, but Conclusion 2 is incorrect.\nC. No, only Conclusion 2 is correct — Incorrect\nIncorrect as the interpretation of macroeconomic factors is easier than statistical factors. The unprepared candidate may choose this option if he/she incorrectly reasons that (1) Conclusion 1 does not seem plausible because it seems that statistical models could make more assumptions, and incorrectly reasons that (2) macroeconomic factors are more difficult to interpret than statistical factors.", "ko": "Conclusion 1: 통계적 요인 모형은 가정을 최소한으로 한다는 장점이 있다 → 맞음. Conclusion 2: 통계적 요인은 해석하기 어렵고, 거시경제 요인(인플레이션, GDP 등)은 해석이 쉽다 → 틀림(반대로 말함).", "trap": "통계 모형: 가정 적음(장점), 해석 어려움(단점).", "f": "", "why": {"A": "Conclusion 2가 반대입니다. 해석이 어려운 쪽은 통계적 요인입니다.", "C": "Conclusion 1은 맞고, Conclusion 2는 틀렸습니다."}, "orig": "Mock 2 Session 1 Q32", "conf": false}, {"id": "mock2-1-Q33", "src": "정답", "module": "ECO", "tag": "크로스 환율 차익거래", "vig": 8, "stem": "Based on the dealer's quote, does an arbitrage opportunity exist in the THB/AUD currency pair?", "opts": {"A": "No", "B": "Yes, by selling AUD to the dealer and buying AUD in the interbank market", "C": "Yes, by buying AUD from the dealer and selling AUD in the interbank market"}, "ans": "A", "en": "A. No — Correct\nCorrect because, for an arbitrage opportunity to exist, the cross-rate bids (offers) posted by the dealer must be higher (lower) than the impl

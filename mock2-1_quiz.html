ied cross-rate offers (bids) available in the interbank market, which is not the case here.\nHere we are trying to find the THB/AUD cross-rate. The bid is determined by taking the interbank market bid quotes of THB/USD and USD/AUD, while the offer is determined by taking the offer quotes.\nTHB/AUD bid is 0.7276 × 33.3942 = 24.2976.\nTHB/AUD offer is 0.7279 × 33.3965 = 24.3093.\nThe dealer quote for THB/AUD is 24.3065/24.3090, which means that both the bid and the offer are outside the range required for an arbitrage opportunity to exist.\nB. Yes, by selling AUD to the dealer and buying AUD in the interbank market — Incorrect\nIncorrect because the AUD is offered in the interbank market at 24.3093 THB/AUD while the dealer's bid is 24.3065 THB/AUD, so the trade would incur a loss of 24.3093 – 24.3065 = 0.0028. The cross-rate implied by the interbank market does not provide an arbitrage opportunity.\nC. Yes, by buying AUD from the dealer and selling AUD in the interbank market — Incorrect\nIncorrect because the AUD is offered from the dealer at 24.3090 THB/AUD while the interbank market bid is 24.2976 THB/AUD, so the trade would incur a loss of 24.3090 – 24.2976 = 0.0114. The cross-rate implied by the interbank market does not provide an arbitrage opportunity.", "ko": "THB/AUD = THB/USD × USD/AUD. 은행간 bid = 33.3942 × 0.7276 = 24.2976, offer = 33.3965 × 0.7279 = 24.3093. 딜러 호가 24.3065/24.3090은 은행간 범위(24.2976~24.3093) 안에 있다. 차익거래는 딜러 bid가 은행간 offer보다 높거나, 딜러 offer가 은행간 bid보다 낮을 때만 생긴다 → 기회 없음.", "trap": "딜러 bid(24.3065) < 은행간 offer(24.3093), 딜러 offer(24.3090) > 은행간 bid(24.2976) → 차익 없음.", "f": "Cross bid = bid × bid, Cross offer = offer × offer", "why": {"B": "은행간에서 AUD를 24.3093에 사서 딜러에게 24.3065에 팔면 0.0028 손실입니다.", "C": "딜러에게서 24.3090에 사서 은행간에 24.2976에 팔면 0.0114 손실입니다."}, "orig": "Mock 2 Session 1 Q33", "conf": false}, {"id": "mock2-1-Q34", "src": "정답", "module": "ECO", "tag": "선도 포인트 (540일)", "vig": 8, "stem": "The forward points for the FXA/FXB forward contract are closest to:", "opts": {"A": "–722.", "B": "–679.", "C": "–464."}, "ans": "B", "en": "A. –722. — Incorrect\nIncorrect because the price currency's interest rate is used in the denominator instead of the base currency's. This gets:\n1.1423 × [(540/360) / (1 + 0.0123(540/360))] × (0.0123 – 0.0552)\n= –0.072175 ≈ –0.0722,\nwhich when turned into forward points = (–0.0722 × 10,000)\n= –722 forward points.\nB. –679. — Correct\nCorrect because the equation to calculate the forward premium or discount is:\nFP/B – SP/B = SP/B[(Actual Days/360) / (1 + iB(Actual/360))](iP – iB), where SP/B is the spot rate, iP is the price currency interest rate, and iB is the base currency interest rate.\nFP/B – SP/B = 1.1423 × [(540/360) / (1 + 0.0552(540/360))] × (0.0123 – 0.0552)\n= 1.1423 × 1.3853 × –0.0429 = –0.067886 ≈ –0.0679,\nwhich when turned into forward points = (–0.0679 ×10,000)\n= –679 forward points.\nC. –464. — Incorrect\nIncorrect because the formula used is for one year instead of 18 months (540 days). This gets:\n1.1423 × [(360/360) / (1 + 0.0552(360/360))] × (0.0123 – 0.0552)\n= –0.046441 ≈ –0.0464,\nwhich when turned into forward points = (–0.0464 × 10,000)\n= –464 forward points.", "ko": "FXA/FXB에서 가격통화 = FXA(1.23%), 기준통화 = FXB(5.52%). F − S = S × [(540/360) / (1 + iB × 540/360)] × (iP − iB) = 1.1423 × [1.5 / (1 + 0.0552 × 1.5)] × (0.0123 − 0.0552) = 1.1423 × 1.3853 × (−0.0429) = −0.0679. 포인트 = −0.0679 × 10,000 = −679.", "trap": "분모에는 기준통화(분모 통화, FXB) 금리를 쓴다. 기간은 540/360.", "f": "F − S = S × [(일수/360) / (1 + iB × 일수/360)] × (iP − iB)", "why": {"A": "분모에 가격통화(FXA) 금리 1.23%를 썼습니다.", "C": "540일이 아니라 1년(360/360)으로 계산했습니다."}, "orig": "Mock 2 Session 1 Q34", "conf": true}, {"id": "mock2-1-Q35", "src": "정답", "module": "ECO", "tag": "통화 선도 mark-to-market", "vig": 8, "stem": "The mark-to-market value of Podowski's USD/EUR forward contract is closest to:", "opts": {"A": "USD 59,921.", "B": "USD 69,907.", "C": "USD 115,847."}, "ans": "A", "en": "A. USD 59,921. — Correct\nCorrect because, when marking to market a forward position, you have to create an offsetting forward position, determine the appropriate all-in forward rate, calculate the cash flow at the future settlement date, and calculate the present value of this cash flow.\nPodowski bought forward EUR 20 million at 1.1308 USD/EUR. This forward now has 3 months left. To offset it, you need to sell EUR 20 million 3 months forward. Since the EUR is the base currency, we need to sell at the bid for the spot and forward points. The all-in bid rate is 1.1352 – 14/10,000 = 1.1338 USD/EUR.\nOn settlement, Podowski will pay USD 22,616,000 (20,000,000 × 1.1308) on the original forward and receive USD 22,676,000 (20,000,000 × 1.1338) from the offsetting forward, resulting in a positive cash flow of USD 60,000 (22,676,000 – 22,616,000). This now has to be discounted at the 90-day MRR, which results in a PV of:\nUSD 60,000 / [1 + 0.0053(90/360)] = USD 59,921.\nB. USD 69,907. — Incorrect\nIncorrect because the offer, and not the bid, is used for the offsetting contract. The all-in offer rate is 1.1355 – 12/10,000 = 1.1343 USD/EUR.\nEUR 20 million × 1.1343 USD/EUR = USD 22,686,000. This gives a positive cash flow of USD 70,000 (22,686,000 – 22,616,000). Discounted at the 90-day MRR, the PV equals:\nUSD 70,000 / [1 + 0.0053(90/360)] = USD 69,907.\nC. USD 115,847. — Incorrect\nIncorrect because the forward points are subtracted, which gives an all-in bid rate of 1.1352 – (–14/10,000) = 1.1366 USD/EUR.\nOn settlement, Podowski will pay USD 22,616,000 (20,000,000 × 1.1308) on the original forward and receive USD 22,732,000 (20,000,000 × 1.1366) from the offsetting forward, resulting in a positive cash flow of USD 116,000 (22,732,000 – 22,616,000). Discounted at the 90-day MRR, the PV equals:\nUSD 116,000 / [1 + 0.0053(90/360)] = USD 115,847.", "ko": "EUR 2,000만을 1.1308에 사기로 한 선도가 3개월 남았다. 상쇄하려면 3개월 선도로 EUR을 팔아야 하므로 bid 쪽을 쓴다: 1.1352 + (−14/10,000) = 1.1338. 만기 현금흐름 = 20,000,000 × (1.1338 − 1.1308) = USD 60,000. USD 금리로 90일 할인: 60,000 / (1 + 0.0053 × 90/360) = USD 59,921.", "trap": "EUR(기준통화)을 파는 상쇄 거래 → bid 사용. 음수 포인트는 더하면(= 빼면) 된다. 할인은 USD(가격통화) 금리.", "f": "MTM = 명목 × (F_상쇄 − F_원래) / (1 + i_가격통화 × 일수/360)", "why": {"B": "상쇄 거래에 bid가 아니라 offer(1.1343)를 썼습니다.", "C": "음수 포인트를 빼서 1.1366이 되었습니다(부호 실수)."}, "orig": "Mock 2 Session 1 Q35", "conf": false}, {"id": "mock2-1-Q36", "src": "오답", "module": "ECO", "tag": "carry trade 성공 조건", "vig": 8, "stem": "What condition would best support Francis' trade proposal between AUD and ZAR?", "opts": {"A": "Low market volatility", "B": "Covered interest rate parity not holding in the short term", "C": "The interest rate differential between the two countries being expected to widen after the trade is initiated"}, "ans": "A", "en": "A. Low market volatility — Correct\nCorrect because the payoff in a carry trade is the gradual accrual of the interest rate differential—income that is unrelated to exchange rate volatility. During periods of low turbulence, investors may feel relatively confident that exchange rate movements will not jeopardize the gradual accrual of the interest differential. When volatility in the currency markets spikes, however, the risk of an adverse exchange rate movement rises sharply relative to the gradual flow of income. During periods of low volatility, carry trades tend to generate positive returns, but they are prone to significant crash risk in turbulent times.\nB. Covered interest rate parity not holding in the short term — Incorrect\nIncorrect because for a carry trade to succeed, it is uncovered interest rate parity, not covered interest rate parity, that must not hold. If it held, the investor would receive identical returns from either an unhedged foreign currency return or a domestic currency investment as the appreciation or depreciation of the exchange rate would offset the yield differential. If uncovered interest rate parity held at all times, investors would not be able to profit from a strategy that undertook long positions in high-yield currencies and short positions in low-yield currencies. The change in spot rates over the tenor of the forward contracts would cancel out the interest rate differentials locked in at the inception of the position.\nC. The interest rate differential between the two countries being expected to widen after the trade is initiated — Incorrect\nIncorrect because the difference in yields is locked in at the time of the trade, so the movement of the yield spread once the trade is initiated is irrelevant.", "ko": "carry trade는 저금리 통화를 빌려 고금리 통화에 투자해 금리 차이를 조금씩 쌓는 전략이다. 환율 변동성이 낮으면 환율 손실이 금리 차이 수익을 깎을 위험이 적어 유리하다. 변동성이 커지면 급락(crash) 위험이 크다. 금리 차이는 거래 시작 때 고정되므로 이후 차이가 벌어질 것이라는 예상은 상관없다. 또 깨져야 하는 것은 covered가 아니라 uncovered 금리평가다.", "trap": "carry trade = 낮은 변동성 + uncovered IRP가 성립하지 않을 때.", "f": "", "why": {"B": "carry trade가 성공하려면 covered가 아니라 uncovered 금리평가가 성립하지 않아야 합니다.", "C": "금리 차이는 거래 시작 시점에 고정되므로 이후 벌어지는 것은 관계없습니다."}, "orig": "Mock 2 Session 1 Q36", "conf": false, "my": "C"}, {"id": "mock2-1-Q37", "src": "정답", "module": "FI", "tag": "CVA로 위험 채권 가격", "vig": 9, "stem": "The price of the AHM01 bond is closest to:", "opts": {"A": "97.84.", "B": "98.71.", "C": "99.10."}, "ans": "A", "en": "A. 97.84. — Correct\nCorrect because it computes the risky bond value as VND minus CVA (value assuming no default MINUS the credit value adjustment).\nVND is given in the case as 100.46. The CVA is computed based on the loss given default (LGD) assuming a recovery rate of 40%, where LGD is (1 – Recovery Rate) × Expected Exposure.\nExpected exposure, probability of default (POD), and the discount factors are given in Exhibit 1.\nYear 1: LGD = 60% × 105.49 = 63.294\nYear 2: LGD = 60% × 105.00 = 63.000\nCVA per year is then equal to POD times LGD times the discount factor:\nYear 1: CVA = 0.0225 × 63.294 × 0.9524 = 1.3563\nYear 2: CVA = 0.0220 × 63.000 × 0.9115 = 1.2633\nCVA = sum of the yearly CVA = 2.6196\nPrice = Fair Value of Bond = VND – CVA = 100.46 – 2.6196 = 97.8404 ≈ 97.84\nB. 98.71. — Incorrect\nIncorrect because it computes the LGD as Expected Exposure times the Recovery Rate.\nYear 1: LGD = 40% × 105.49 = 42.196\nYear 2: LGD = 40% × 105.00 = 42.000\nCVA per year is then equal to POD times LGD times the discount factor:\nYear 1: CVA = 0.0225 × 42.196 × 0.9524 = 0.9042\nYear 2: CVA = 0.0220 × 42.000 × 0.9115 = 0.8422\nCVA = sum of the yearly CVA = 1.7464\nValue of Bond = VND – CVA = 100.46 – 1.7464 = 98.7136 ≈ 98.71\nC. 99.10. — Incorrect\nIncorrect because it computes the bond value as VND – Year 1 CVA:\n100.46 – 1.3563 = 99.1037 ≈ 99.10", "ko": "LGD = (1 − 회수율 40%) × 기대 노출. Year 1: 0.6 × 105.49 = 63.294, Year 2: 0.6 × 105.00 = 63.000. CVA = PD × LGD × 할인계수: Year 1 = 0.0225 × 63.294 × 0.9524 = 1.3563, Year 2 = 0.0220 × 63.000 × 0.9115 = 1.2633. 합 = 2.6196. 가격 = VND − CVA = 100.46 − 2.6196 = 97.84.", "trap": "LGD는 회수율이 아니라 (1 − 회수율). CVA는 모든 연도를 더한다.", "f": "Price = VND − CVA, CVA = Σ PD × (1 − RR) × Exposure × DF", "why": {"B": "LGD를 회수율(40%) × 노출로 계산했습니다.", "C": "Year 1 CVA만 빼고 Year 2를 빠뜨렸습니다."}, "orig": "Mock 2 Session 1 Q37", "conf": false}, {"id": "mock2-1-Q38", "src": "오답", "module": "FI", "tag": "회수율과 implied PD", "vig": 9, "stem": "Based on the recovery rate estimated by the junior analyst, the probability of default of the AHM01 bond would be:", "opts": {"A": "less than 2.25%.", "B": "equal to 2.25%.", "C": "greater than 2.25%."}, "ans": "A", "en": "A. less than 2.25%. — Correct\nCorrect because a lower recovery rate (i.e., 30% stated by the junior analyst vs. 40% assumed by Wang) is associated with a lower probability of default (given price and credit spread), holding all else equal. Given the observed bond price (and credit spread), we would need a lower probability of default to offset the lower rate of recovery.\nB. equal to 2.25%. — Incorrect\nIncorrect because the probability of default would need to be reduced from its current value of 2.25%.\nC. greater than 2.25%. — Incorrect\nIncorrect because the probability of default would be lower than 2.25%.", "ko": "채권 가격(=신용 스프레드)이 그대로라면, 기대 손실(대략 PD × LGD)도 그대로여야 한다. 회수율이 40% → 30%로 낮아지면 LGD가 커지므로, 같은 가격을 맞추려면 PD가 더 낮아야 한다. 따라서 PD는 2.25%보다 작다.", "trap": "가격 고정 상태에서 회수율 ↓ → LGD ↑ → PD ↓ (서로 상쇄).", "f": "Credit spread ≈ PD × LGD = PD × (1 − RR)", "why": {"B": "LGD가 커졌으므로 같은 가격을 맞추려면 PD가 줄어야 합니다.", "C": "PD가 커지면 가격이 더 내려가야 합니다. 가격이 같다면 PD는 작아집니다."}, "orig": "Mock 2 Session 1 Q38", "conf": false, "my": "B"}, {"id": "mock2-1-Q39", "src": "정답", "module": "FI", "tag": "CDS upfront payment", "vig": 9, "stem": "The CDS protection that Wang purchases on the AHM01 bond requires:", "opts": {"A": "no upfront payment.", "B": "Wang to make an upfront payment.", "C": "XRM Bank to make an upfront payment."}, "ans": "B", "en": "A. no upfront payment. — Incorrect\nIncorrect because an upfront payment is required in this case to set the value of the CDS equal to zero on the trade date. As stated in the case, the initial value is set to zero. Since the CDS has a standardized fixed coupon of 100 basis points while the risk premium fair price of CDS protection is 150 basis points, a payment must be made by Wang to set the value equal to zero.\nB. Wang to make an upfront payment. — Correct\nCorrect because the upfront payment is designed to set the initial value of the CDS equal to zero. The CDS has a standardized fixed coupon of 100 basis points, while the current market price (risk premium fair price) of CDS protection is 150 basis points. Since the protection buyer is paying only 100 basis points premium for a credit risk worth 150 basis points, the protection buyer must make an upfront payment to the protection seller. In this way, the value of the CDS trade is set equal to zero.\nC. XRM Bank to make an upfront payment. — Incorrect\nIncorrect because an upfront payment is made by Wang to XRM Bank. As stated in the case, the initial value is set to zero. Since the CDS has a standardized fixed coupon of 100 basis points while the risk premium fair price of CDS protection is 150 basis points, a payment must be made by Wang to set the value equal to zero.", "ko": "표준 쿠폰은 100bp인데 시장 신용 스프레드(공정 가격)는 150bp다. 보호 매수자인 Wang은 150bp 가치의 보호를 100bp만 내고 받으므로, 차이만큼을 처음에 보호 매도자(XRM Bank)에게 upfront로 낸다. 그래야 계약 시작 가치가 0이 된다.", "trap": "스프레드 > 쿠폰 → 보호 매수자가 지급, 스프레드 < 쿠폰 → 보호 매도자가 지급.", "f": "Upfront ≈ (spread − coupon) × duration (스프레드 > 쿠폰 → 매수자가 지급)", "why": {"A": "쿠폰(100bp)이 스프레드(150bp)와 달라 가치를 0으로 맞추려면 upfront가 필요합니다.", "C": "덜 내는 쪽은 보호 매수자(Wang)라 Wang이 지급합니다."}, "orig": "Mock 2 Session 1 Q39", "conf": false}, {"id": "mock2-1-Q40", "src": "정답", "module": "FI", "tag": "CDS basis trade", "vig": 9, "stem": "For the basis trade, Wang should:", "opts": {"A": "buy Bond X and sell protection.", "B": "buy Bond X and buy protection.", "C": "buy Bond Y and buy protection."}, "ans": "B", "en": "A. buy Bond X and sell protection. — Incorrect\nIncorrect because the correct basis trade is to buy Bond X and to buy protection since compared to the bond market, the CDS market is pricing in credit risk that is low compared to the bond market.\nB. buy Bond X and buy protection. — Correct\nCorrect because Bond X trades at a credit risk premium of 2.50%, while the credit spread in the CDS market is 2.25%. The correct basis trade is then to buy Bond X and to buy protection, thereby earning the 25 basis point difference. From the perspective of the CDS market, the risk premium is too low relative to the bond risk premium and the CDS market is pricing in too little credit risk, and/or the bond market is pricing in too much risk.\nC. buy Bond Y and buy protection. — Incorrect\nIncorrect because the correct basis trade involving Bond Y is to sell Bond Y and to sell protection. Bond Y currently looks overpriced compared to the CDS market (its credit spread is 2.50%; the CDS risk premium is 2.75%) and one can buy the credit risk of Bond Y by selling protection. Investing the proceeds of the sale of Bond Y in a risk-free bond, combined with the sale of protection, essentially replicates a cheaper way to purchase Bond Y.", "ko": "Bond X: 채권 신용 프리미엄 2.50% > CDS 2.25%. 채권이 위험을 너무 비싸게(채권이 싸게) 보고 있으므로 채권을 사고 CDS로 보호를 사면 2.50% − 2.25% = 25bp를 얻는다. Bond Y는 채권 2.50% < CDS 2.75%라 반대로 채권을 팔고 보호를 판다. 보기 중 맞는 것은 'Bond X 매수 + 보호 매수'.", "trap": "채권 스프레드 > CDS → 채권 매수 + 보호 매수. 채권 스프레드 < CDS → 채권 매도 + 보호 매도.", "f": "", "why": {"A": "Bond X를 사면 신용위험을 없애려고 보호를 사야 합니다. 팔면 위험이 두 배가 됩니다.", "C": "Bond Y는 채권이 비싸서(스프레드가 CDS보다 작음) 채권 매도 + 보호 매도가 맞습니다."}, "orig": "Mock 2 Session 1 Q40", "conf": true}, {"id": "mock2-1-Q41", "src": "정답", "module": "ETH", "tag": "Standard IV(B): 외부 직위 서면 동의", "vig": 10, "stem": "According to the Standards, does Keegan need to obtain written permission from Stanz before accepting the CFA society and the Kino Empire positions?", "opts": {"A": "Yes", "B": "No, only for the CFA society position", "C": "No, only for the Kino Empire position"}, "ans": "A", "en": "A. Yes — Correct\nCorrect because, according to Standard IV(B) Additional Compensation Arrangements, Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved.\nA conflict of interest is likely to arise in the case of both external positions being offered to Keegan and, as such, she needs to obtain written permission before accepting each of them. Regarding the CFA society leadership position, in addition to receiving monetary compensation, Keegan will be monitoring the asset allocation for the society, which could create potential conflicts with her role at Stanz. Regarding the Kino Empire board position, although Keegan will not receive monetary compensation, she will still receive benefits in the form of free movie tickets.\nB. No, only for the CFA society position — Incorrect\nIncorrect because Keegan must obtain written permission to accept both the CFA society position and the Kino Empire position.\nC. No, only for the Kino Empire position — Incorrect\nIncorrect because Keegan must obtain written permission to accept both the CFA society position and the Kino Empire position.", "ko": "IV(B)는 고용주 이익과 경쟁하거나 이해상충이 생길 수 있는 보수·혜택을 받으려면 모든 당사자의 서면 동의를 받으라고 한다. CFA 협회 재무 담당: 보수를 받고 협회 자금의 자산배분을 감시하므로 Stanz 업무와 충돌 가능. Kino Empire 이사: 현금 보수는 없지만 무료 영화표라는 혜택을 받고, 고객 계좌가 이 회사 주식을 갖고 있다. 둘 다 서면 허락이 필요하다.", "trap": "현금이 아니어도 혜택(무료 표)이면 IV(B) 대상.", "f": "", "why": {"B": "Kino Empire도 무료 영화표라는 혜택이 있어 서면 동의가 필요합니다.", "C": "CFA 협회 자리도 보수를 받고 자산배분을 감시해 서면 동의가 필요합니다."}, "orig": "Mock 2 Session 1 Q41", "conf": false}, {"id": "mock2-1-Q42", "src": "정답", "module": "ETH", "tag": "Standard VII(A): 시험 문제 공개", "vig": 10, "stem": "During the conversation with Keegan at the local CFA society event, does the CFA candidate violate the Standards?", "opts": {"A": "No", "B": "Yes, because of her comment about the recent Level II exam", "C": "Yes, because of her comment about the relevance of the CFA Program"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because, according to Standard VII(A) Conduct as Participants in CFA Institute Programs, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to specific details of questions appearing on the exam. Therefore, the CFA candidate violates the Standards by detailing the specific exam question about how alternative accounting methods affect company balance sheets.\nB. Yes, because of her comment about the recent Level II exam — Correct\nCorrect because, according to Standard VII(A) Conduct as Participants in CFA Institute Programs, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to specific details of questions appearing on the exam. Therefore, the CFA candidate violates the Standards by detailing the specific exam question about how different accounting methods affect company balance sheets.\nC. Yes, because of her comment about the relevance of the CFA Program — Incorrect\nIncorrect because Standard VII(A) does not cover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute programs. As a result, the CFA candidate's comment about the relevance of the CFA Program is not a violation of the Standards.", "ko": "응시자가 '최근 Level II 시험에 회계 방법에 따라 재무상태표가 어떻게 달라지는지 묻는 문제가 나왔다'고 말한 것은 시험 문제의 구체적 내용을 공개한 것이라 VII(A) 위반이다. CFA 프로그램이 업무에 쓸모없다는 의견을 말하는 것은 위반이 아니다.", "trap": "프로그램에 대한 의견 = OK, 구체적 시험 문제 내용 = 위반.", "f": "", "why": {"A": "구체적인 시험 문제 내용을 말해 위반입니다.", "C": "CFA 프로그램에 대한 의견 표현은 VII(A) 대상이 아닙니다."}, "orig": "Mock 2 Session 1 Q42", "conf": false}, {"id": "mock2-1-Q43", "src": "정답", "module": "ETH", "tag": "Standard III(D): 해지 계좌 제외", "vig": 10, "stem": "Regarding the performance presentation section of the marketing materials, are Keegan's actions consistent with the Standards?", "opts": {"A": "Yes", "B": "No, because of the treatment of closed accounts", "C": "No, because of the use of simulated results from the backtest"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because Keegan excludes any closed accounts when determining the performance of the composite and is therefore not consistent with the Standards.\nB. No, because of the treatment of closed accounts — Correct\nCorrect because, according to the recommended procedures for Standard III(D) Performance Presentation, members and candidates can also meet their obligations under Standard III(D) by presenting the performance of the weighted composite of similar portfolios rather than using a single representative account and including terminated accounts as part of performance history with a clear indication of when the accounts were terminated. In the case, Keegan excludes any closed accounts when determining the performance of the composite and is therefore not consistent with the Standards.\nC. No, because of the use of simulated results from the backtest — Incorrect\nIncorrect because, according to the recommended procedures for Standard III(D) Performance Presentation, members and candidates can also meet their obligations under Standard III(D) by including disclosures that fully explain the performance results being reported (for example, stating, when appropriate, that results are simulated when model results are used). In the case, Keegan provides details of the model and shows a comparison with actual performance history. Therefore, her actions with respect to the simulated backtest are consistent with the Standards.", "ko": "Keegan은 모델 성과가 시뮬레이션 백테스트라고 밝혔다 → 공시가 충분하므로 OK. 하지만 composite 성과를 낼 때 해지된 계좌를 뺐다. III(D) 권장 절차는 해지 계좌도 언제 해지됐는지 표시해 성과 이력에 넣으라고 한다. 해지 계좌 제외는 성과를 좋게 보이게 할 수 있어 위반이다.", "trap": "시뮬레이션은 밝히면 OK. 해지 계좌는 빼면 안 된다.", "f": "", "why": {"A": "해지 계좌를 빼서 Standards와 맞지 않습니다.", "C": "시뮬레이션 결과라고 밝혔으므로 백테스트 사용 자체는 문제없습니다."}, "orig": "Mock 2 Session 1 Q43", "conf": false}, {"id": "mock2-1-Q44", "src": "정답", "module": "ETH", "tag": "Standard I(D): 개인 부채·합법 도박", "vig": 10, "stem": "With regard to his personal situation, does the assistant wealth manager violate the Standard relating to misconduct?", "opts": {"A": "No", "B": "Yes, because of his spending habits", "C": "Yes, because of his activity with friends"}, "ans": "A", "en": "A. No — Correct\nCorrect because, according to Standard I(D) Misconduct, Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit, or commit any act that reflects adversely on their professional reputation, integrity, or competence. Furthermore, although CFA Institute discourages any sort of unethical behavior by members and candidates, the Code and Standards are primarily aimed at conduct and actions related to a member's or candidate's professional life. For example, personal bankruptcy may not reflect on the integrity or trustworthiness of the person declaring bankruptcy, but if the circumstances of the bankruptcy involve fraudulent or deceitful business conduct, the bankruptcy may be a violation of this standard.\nIn this case, the assistant wealth manager has accumulated significant personal debt, but it is not a result of acts that reflect adversely on his professional reputation, integrity, or competence. Furthermore, the assistant wealth manager's participation in legal poker games with friends does not involve any illegal activity or affect his professional responsibilities.\nB. Yes, because of his spending habits — Incorrect\nIncorrect because, while the assistant wealth manager has accumulated significant personal debt, it is not a result of acts that reflect adversely on his professional reputation, integrity, or competence.\nC. Yes, because of his activity with friends — Incorrect\nIncorrect because the assistant wealth manager's participation in legal poker games with friends does not involve any illegal activity or affect his professional responsibilities.", "ko": "I(D)는 정직하지 않거나 사기적인 업무 관련 행위, 또는 직업적 평판·정직성·능력을 해치는 행위를 금지한다. 보조 매니저의 카드 빚은 나쁜 소비 습관 때문이지 사기나 기만 때문이 아니고, 친구들과의 포커는 합법이며 업무에 영향이 없다. 위반 아님.", "trap": "개인 빚·합법 활동 자체는 I(D) 위반이 아니다(사기·불법이 끼어야 위반).", "f": "", "why": {"B": "소비 습관으로 생긴 빚은 직업적 정직성·능력을 해치는 행위가 아닙니다.", "C": "합법적인 포커는 불법도 아니고 업무에 영향을 주지 않습니다."}, "orig": "Mock 2 Session 1 Q44", "conf": false}], "vignettes": ["Lucy Wang is a derivatives trader for a South African broker-dealer. All of her firm's trades are in South African rand (ZAR) and use a 30/360 day count convention.\nWang wants to hedge a floating-rate note held by her firm against a decline in interest rates. She uses data from Exhibit 1 to price a 3 × 12 forward rate agreement (FRA).\nExhibit 1\nMaturity\tSpot Market Reference Rate\tPresent Value Factor\n3-month\t3.67%\t0.9909\n6-month\t3.79%\t0.9814\n12-month\t4.15%\t0.9602\nWang analyzes a receive-fixed, pay-floating interest rate swap with a fixed rate of 7.38% with a 1-year remaining maturity. The notional amount of the swap is ZAR 10,000,000 which resets semiannually. She values the swap position using the current 1-year fixed rate of 4.10% and data from Exhibit 1.\nNext, Wang determines the no-arbitrage price of a bond forward contract. She uses information from Exhibit 2 and an annualized risk-free rate of 3.7%.\nExhibit 2\nQuoted bond price without accrued interest (% of par)\t105.0\nFuture value of coupon interest (% of par)\t4.51\nAccrued interest at contract initiation (% of par)\t3.00\nAccrued interest at contract expiration (% of par)\t0.75\nTime to forward contract expiration\t90 days\nConversion factor\t1.0\nWang then evaluates whether an arbitrage opportunity exists in 9-month forward contracts on the shares of Pintel Electronics. She is quoted a 9-month forward price of ZAR 816 by a dealer. Pintel shares currently trade at ZAR 850 and will pay a dividend of ZAR 34 in six months.", "Charlene Norberg is an analyst for a sell-side firm. She is building valuation models for several publicly traded firms.\nNorberg estimates the intrinsic value of Firm A's shares based on an FCFE model, using her forecasts in Exhibit 1. She expects long-term annual sales growth of 4% starting in Year 3, with consistent relationships between sales and net profit, changes in fixed capital, changes in working capital, and changes in debt. She estimates Firm A's cost of equity to be 9% and its WACC to be 8%.\nExhibit 1\n\tYear 1\tYear 2\tYear 3\nSales per share\t$90.00\t$90.00\t$93.60\nFCFE per share\t$6.20\t$9.00\t$7.85\nNorberg notes that, in the previous year, Firm A's FCFF was greater than its FCFE.\nNext, Norberg values another firm, Firm B, which has consistently been paying dividends. The firm has a large cash balance with a growing retained earnings balance. Norberg believes that Firm B is a takeover target because it offers synergies to one of its main competitors. If a takeover does occur, Norberg expects the new owner will likely change Firm B's dividend payout and will issue debt to maintain its capital expenditures. Norberg evaluates the potential takeover from the acquirer's perspective.", "Fred Lang, a risk manager at an investment firm, reviews one of the firm's latest model portfolios and estimates its annual 5% parametric VaR using the information in Exhibit 1. At a 5% significance level, the critical z-value for a one-sided test is 1.65 and the critical z-value for a two-sided test is 1.96.\nExhibit 1\nMonthly expected return\t1.25%\nMonthly standard deviation of returns\t4.47%\nPortfolio's assets under management\t$200 million\nLang presents his VaR estimate to the firm's CIO. After reviewing Lang's calculation of the annual 5% parametric VaR, the CIO requests that Lang provide her with an alternative risk measure that estimates the expected loss if losses exceed the VaR cutoff.\nThe CIO is concerned about the underperformance of some of the firm's managed accounts relative to their benchmark. She asks Lang for his recommendation on risk constraints to help reduce her concern.\nFinally, Lang prepares a presentation for an internal risk management training session. Part of this presentation focuses on the limitations of VaR.", "Ross Wyman is a portfolio manager for a family office. He plans to add commodities to his client's holdings and meets with Tina Becker, a commodity advisor.\nWyman and Becker discuss the current market prices for three commodities, summarized in Exhibit 1.\nExhibit 1\n\tCommodity 1\tCommodity 2\tCommodity 3\nSpot price\t$1,688\t$830\t$87.20\nNear-term futures price\t$1,688\t$835\t$85.90\nFarther-term futures price\t$1,707\t$835\t$84.60\nBecker provides additional information about Commodity 3. She notes that hedging demand by consumers currently exceeds hedging demand by producers and that the convenience yield exceeds direct storage costs.\nWyman takes a fully collateralized long futures position in Commodity 3 at a price of $84.60. Two months later, he rolls the entire position from the near-term futures contract into the farther-term futures contract. At that point, the near-term futures price is $85.50 and the farther-term futures price is $84.10. The collateral earned an annualized return of 1.2% during the two months.\nWyman also considers investing in a commodity index. His objective is to select the index that provides the largest contribution to performance based on the following two expectations:\ntrending commodity markets, where outperforming assets continue to go up in price and underperforming assets continue to drift lower;\nno changes in the shapes of forward curves, with some markets currently in backwardation and others in contango.", "Amanda Mond, a junior analyst, is valuing two consumer cyclical companies: Delong and Gruseb.\nDelong\nDelong is a growing company in a cyclical industry with volatile earnings. Mond summarizes Delong's book value per share (BVPS) and ROE for the most recent year in Exhibit 1. She compares these metrics to their respective averages over the most recent business cycle and over the long term. She then normalizes Delong's EPS using the average ROE method.\nExhibit 1\n\tMost Recent Year\tAverage Over Most Recent Business Cycle\tLong-Term Historical Average\nBVPS\tEUR 11.2\tEUR 10.5\tEUR 9.6\nROE\t15.0%\t16.0%\t17.5%\nMond next uses the following forecasted fundamentals to calculate Delong's justified trailing P/E.\nDividend payout ratio of 46%\nROE of 15%\nRequired rate of return of 10.8%\nMond wants to calculate an industry benchmark multiple for Delong based on the multiples of its competitors. She observes that the range of competitor multiples is bounded by zero on the downside but includes very large outliers. Mond uses a measure of central tendency that mitigates the impact of these very large outliers, but not the small outliers.\nGruseb\nGruseb is a manufacturer of small household appliances. Mond observes that there are significant differences in both the duration of growth and the expected earnings growth between Gruseb and its peers. She considers using the PEG ratio as an alternative valuation method to the P/E ratio to address these differences.", "Dora Kriser, a financial analyst, is currently evaluating the intercompany investments and earnings quality of Delphine Industries, a large diversified consumer products company that reports under IFRS.\nDelphine recently announced that it would be increasing its ownership interest in Company A from 35% to 50%. Delphine and Company A are both profitable. Kriser considers how Delphine's net profit margin might be affected after the increase in ownership under the following scenarios:\nScenario 1: Delphine exercises significant influence, but not control, over Company A.\nScenario 2: Delphine exercises control over Company A.\nKriser is concerned that recent industry changes may negatively affect one of Delphine's cash-generating units. She evaluates the following projections to determine the expected impairment loss under IFRS:\nCarrying value of cash-generating unit: €18,200,000\nRecoverable amount of cash-generating unit: €17,700,000\nGoodwill allocated to cash-generating unit: €300,000\nNext, Kriser analyzes Delphine's earnings quality. She begins by examining the cash component and accrual component of Delphine's recurring earnings. Based on this examination, she expects Delphine to continue to exhibit a high degree of earnings persistence.\nFinally, Kriser examines Delphine's statement of cash flows and observes that interest paid is classified as an operating activity and interest received is classified as an investing activity. She considers whether these cash flow classifications could affect comparisons with competitors that report under US GAAP.", "Marcia Garrett is a research analyst at IGMA Investments. IGMA is a large investment firm that claims compliance with the Standards.\nWhile preparing a report on industry trends, Garrett read an article that appeared in a leading business newspaper. Included in the article was a summary of a study conducted by a prominent trade association. Garrett did not obtain a copy of the study directly from the trade association, but did however include information from the article in her report. Garrett cites only the newspaper in her report.\nDuring the most recent quarter, Garrett prepared an analysis detailing her interest rate expectations over the next year and submitted it to IGMA's investment committee. Her research is to be included as part of a wider report by the firm regarding market expectations for the year ahead. Based on her analysis, Garrett's opinion is that interest rates will remain fairly stable. The committee disagrees with some of Garrett's assumptions and does not include her opinion in the wider report. The committee's final report issues a consensus expectation that interest rates will increase and includes detailed assumptions supporting that view. Despite the difference in opinions, Garrett acknowledges that the committee's conclusion has a reasonable basis. The final report is distributed to clients and includes Garrett's name, as well as other research analysts who contributed to the report as authors.\nGarrett is part of a working group asked to review IGMA's code of ethics and to suggest any necessary changes that are needed to ensure that it is consistent with the Standards. During one of the working group's discussions, Garrett states that the Standards recommend that the code of ethics include general fiduciary concepts as well as detailed compliance procedures.\nGarrett has accepted an offer to join a rival firm. While at IGMA, Garrett and a colleague developed a quantitative model that was used for industry and company analysis. Garrett considers if she can continue to use the model at her new firm.", "Marietjie Granger works for a South African equity fund manager specializing in ETFs. She is evaluating several potential ETF investments and the use of factor models in investment decision-making.\nGranger evaluates ETF Zulu and notices that its share price is currently trading at a higher than the usual premium to the NAV of its underlying equities. She considers how the authorized participants may take advantage of this pricing differential.\nGranger wants to make a 6-month tactical investment in ETF X-Ray. She determines the expected holding period cost using the following information:\nBid-ask spread: 0.15%\nOne-way commission: 0.10%\nAnnual management fee: 0.20%\nGranger also analyzes a portfolio of smart beta ETFs using the Carhart model. She calculates the equilibrium expected return on the portfolio using the factor sensitivities and returns in Exhibit 1. The risk free rate is 4.5%.\nExhibit 1\n\tFactor Sensitivity\tFactor Return\nMarket risk (RMRF)\t1.0\t2.5%\nCapitalization (SMB)\t–1.8\t–1.7%\nBook-to-market (HML)\t0.7\t2.1%\nMomentum (WML)\t0.2\t2.8%\nFinally, Granger evaluates the multifactor models used by two European equity ETFs to construct their portfolios. One of the ETFs uses a statistical factor model, while the other uses a macroeconomic factor model. She makes the following conclusions regarding the two models:\nConclusion 1: An advantage of statistical factor models is that they make minimal assumptions.\nConclusion 2: The interpretation of macroeconomic factors is more difficult than statistical factors.", "Jennifer Francis is a currency specialist helping clients manage their foreign exchange exposures. All currencies are quoted as the amount of the numerator currency per one unit of the denominator currency (e.g., USD/EUR is quoted as the amount of USD per 1 EUR).\nFrancis is working with a client looking to execute a trade in the Thai baht (THB) and Australian dollar (AUD) currency pair. Francis receives a bid–offer quote in THB/AUD (24.3065/24.3090) from a dealer and compares this to the interbank market quotes in THB/USD (33.3942/33.3965) and USD/AUD (0.7276/0.7279) to see if an arbitrage opportunity exists.\nStephan Podowski is a client of Francis' located in Country A, whose currency is the FXA. Podowski's company will receive a payment in Country B's currency (FXB) in 18 months, and he is considering using a forward contract to hedge the currency exposure. Francis uses the following information to determine the forward discount for a 540-day FXA/FXB forward contract:\nFXA/FXB spot exchange rate: 1.1423;\n540-day market reference rate (annualized, Actual/360) for Country A: 1.23%;\n540-day market reference rate (annualized, Actual/360) for Country B: 5.52%.\nNine months ago, Podowski bought EUR 20 million forward against the USD by entering into a 1-year forward contract at 1.1308 USD/EUR. He wants to calculate the mark-to-market value of this position today. The current USD/EUR spot rate is quoted at 1.1352/1.1355 and the 90-day forward points are –14/–12. The annualized 90-day market reference rate (Actual/360) is 0.53% for USD and 0.77% for EUR.\nFrancis is looking for potential carry trades to recommend to her clients. She focuses on a potential trade between the AUD and the South African rand (ZAR). She reviews what market conditions are required for the trade to be profitable.", "Liying Wang manages her firm's investment-grade bond portfolio. She considers purchasing a senior unsecured bond issued by AHM Manufacturing (the AHM01 bond) for the portfolio. This bond is rated BBB, has a 2-year maturity, and has a 5% annual coupon. Wang assumes a recovery rate of 40% and uses a government yield binomial interest rate model to estimate the fair value of the AHM01 bond. Selected information for the bond is presented in Exhibit 1. Given no default, the value of the AHM01 bond is 100.46.\nBased on her assumptions and the information in Exhibit 1, Wang purchases the AHM01 bond at a price equal to its fair value.\nExhibit 1\nYear\tExpected Exposure\tProbability of Default\tDiscount Factor\n1\t105.49\t2.25%\t0.9524\n2\t105.00\t2.20%\t0.9115\nWang’s junior analyst estimates that the recovery rate for the AHM01 bond will be 30%. Holding all else equal, Wang considers how this estimate would affect her valuation of the bond.\nWang purchases protection on the AHM01 bond using a single-name CDS. The counterparty for the transaction is XRM Bank. The CDS has a standard annual coupon of 100 basis points and the current market spread on AHM01 bonds is 150 basis points. The initial value of the CDS contract is set to zero.\nFinally, Wang makes the following observations regarding two other investment-grade bonds, Bond X and Bond Y, each of which has a 5-year maturity and is option-free:\nBond X trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.25%.\nBond Y trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.75%.\nBelieving that the disparity in risk premiums is temporary, Wang considers a basis trade.", "Maya Keegan, CFA, is a private wealth manager at Stanz Investments, which has adopted the Standards as part of its ethics and compliance policy. Stanz does not claim compliance with the GIPS standards.\nKeegan is invited to join the leadership team of her local CFA society as treasurer. Her responsibilities will include monitoring the asset allocation of the society's reserve funds. Keegan will receive annual compensation for the position as treasurer. Separately, she is asked to join the board of Kino Empire, a small publicly traded movie theater chain founded by a family friend. Many of Keegan's client accounts invest in Kino Empire's shares. Keegan has opted to receive no monetary compensation if she accepts this board position, although she will receive free movie tickets for her personal use at all Kino Empire theaters.\nAt a local CFA society event, Keegan meets a CFA candidate who just took the Level II exam. During the conversation with Keegan, the candidate comments that her employer expects her to complete the CFA Program even though she is convinced that it is not relevant for her current position as a trader. To support her claim, the candidate cites a question on the recent Level II exam that tested how different accounting methods affect company balance sheets.\nIn the performance presentation section of her firm's marketing materials, Keegan provides details of an investment model recently developed by a Stanz analyst. She first notes that the model's performance is based on results from a simulated backtest. She then shows a comparison of this simulated performance with the actual past performance of a weighted composite of similar accounts she currently manages. Keegan ensures that all closed accounts are excluded when determining the performance of this composite.\nKeegan supervises an assistant wealth manager who has a good track record of managing client accounts. However, the assistant wealth manager has accumulated significant personal credit card debt due to his poor personal spending habits. He also regularly participates in legal poker games with friends. He would like to set up a plan to reduce his debt and is seeking personal financial advice from Keegan."], "modules": {"ECO": "Economics", "FSA": "Financial Statement Analysis", "EQ": "Equity Valuation", "FI": "Fixed Income", "DER": "Derivatives", "AI": "Alternative Investments", "PM": "Portfolio Management", "ETH": "Ethical and Professional Standards"}, "images": {}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules, IMG = DATA.images || {};
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = DATA.meta.subject, KEY = SUBJECT+"_quiz_state_v1", EXPKEY = SUBJECT+"_quiz_exports_v1", CONFKEY = SUBJECT+"_confused_v1", UIKEY = SUBJECT+"_ui_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
// 헷갈림: 원본 txt의 "헷갈림:" 번호가 기본값, 화면에서 켜고 끈 것은 CONF.ids에 덮어씀
var CONF = store.get(CONFKEY) || {ids:{}, at:""};
// 학습 화면(문제+정답+해설) 상태는 풀이 기록(S)과 따로 둔다
var UI = store.get(UIKEY) || {view:null};
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }
function saveUI(){ store.set(UIKEY,UI); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables + [IMAGE: 파일명]
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], im=/^\[IMAGE: (.+)\]$/.exec(l.trim());
    if(im){ flush(); if(IMG[im[1]]) html+='<p><img class="exh" src="'+IMG[im[1]]+'" alt="'+esc(im[1])+'"></p>'; continue; }
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]||m; }
function srcClass(s){ return s==="오답"?"src-wrong":"src-rel"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }
function isWrong(q){ return q.src==="오답"; }
function isConf(q){ var v=CONF.ids[q.id]; return v===undefined ? !!q.conf : !!v; }
function toggleConf(id){
  var q=BYID[id]; CONF.ids[id]=!isConf(q);
  if(CONF.ids[id]===!!q.conf) delete CONF.ids[id]; // 원래 값으로 돌아오면 덮어쓴 기록 삭제
  CONF.at=new Date().toISOString(); store.set(CONFKEY,CONF);
}
function confBtn(q){ return '<button class="btn conf'+(isConf(q)?' on':'')+'" id="bConf" title="헷갈린 문제로 표시/해제">'+(isConf(q)?'★ 헷갈림':'☆ 헷갈림')+'</button>'; }
function metaHtml(q, no, showMy){
  return '<div class="meta"><span class="qno">'+no+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+(showMy && q.my ? ' · 내 답 '+esc(q.my) : '')+'</span>'+
    (isConf(q)?'<span class="pill src-var">헷갈림</span>':'')+'<span class="tagline">'+esc(q.tag)+'</span><span style="flex:1"></span>'+confBtn(q)+'</div>';
}
// 범위: wrong = 오답만, wc = 오답+헷갈림, all = 전체
var FILT = {wrong:"오답만", wc:"오답+헷갈림", all:"전체"};
function pick(f, m){
  return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (f==="all" || isWrong(q) || (f==="wc" && isConf(q))); }).map(function(q){return q.id;});
}

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
var MODE = {all:"전체 풀기", list:"학습한 목록 풀기", wrong:"오답만 풀기", wc:"오답+헷갈림 풀기", review:"틀린 문제 다시 풀기", rwc:"틀린+헷갈림 다시 풀기"};
function header(){
  if(UI.view==="study"){ var T=UI.study; $("nOk").textContent="-"; $("nBad").textContent="-"; $("pbar").style.width=((T.i+1)/T.ids.length*100)+"%"; $("ptxt").textContent=(T.i+1)+" / "+T.ids.length; $("pmode").textContent="해설 보며 학습 · "+T.label; return; }
  if(!S || !S.order){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=MODE[S.mode]||"";
}

/* ---------- setup screen ---------- */
function setup(){
  UI.view=null; saveUI();
  S && (S.view="setup", save());
  var wrongAll=Q.filter(isWrong).length, confAll=Q.filter(isConf).length;
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 토픽 ('+Q.length+')</option>'+Object.keys(MN).filter(function(m){return counts[m];}).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  var f = UI.filt || "wc";
  document.body.classList.remove("wide");
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">'+esc(DATA.meta.title)+' 오답 퀴즈</h2>'+
   '<p class="muted">전체 '+Q.length+'문제 · 내가 틀린 문제 '+wrongAll+' · 헷갈린 문제 '+confAll+'. 정답과 영어 해설은 CFA Institute 원문, 한국어 해설은 원문을 바탕으로 작성했습니다. 헷갈림 표시는 문제 화면의 ☆ 버튼으로 켜고 끌 수 있습니다.</p>'+
   '<label>토픽 <select id="selMod">'+opts+'</select></label>'+
   '<div class="seg" id="segF">'+Object.keys(FILT).map(function(k){return '<button class="btn'+(k===f?' on':'')+'" data-f="'+k+'">'+FILT[k]+' <span id="n_'+k+'"></span></button>';}).join("")+'</div>'+
   '<p class="kbd">풀기: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 / 학습: ← → 이동</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">풀기</button> <button class="btn" id="bStudy">해설 보며 학습</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function labels(){
    var m=$("selMod").value;
    Object.keys(FILT).forEach(function(k){ $("n_"+k).textContent="("+pick(k,m).length+")"; });
    var n=pick(f,m).length; $("bStart").textContent=FILT[f]+" 풀기 ("+n+")"; $("bStudy").textContent=FILT[f]+" 해설 보며 학습 ("+n+")";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(b){ b.onclick=function(){
    f=b.getAttribute("data-f"); UI.filt=f; saveUI();
    Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(x){ x.classList.toggle("on", x===b); }); labels(); }; });
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){
    var order=pick(f,$("selMod").value); if(!order.length){ alert("이 범위에는 문제가 없습니다."); return; }
    S=fresh(order,f); save(); render();
  };
  $("bStudy").onclick=function(){
    var m=$("selMod").value, ids=pick(f,m); if(!ids.length){ alert("이 범위에는 문제가 없습니다."); return; }
    startStudy(ids, FILT[f]+(m==="all"?"":" · "+mname(m)));
  };
  header();
}

/* ---------- 지문 패널: 지문이 있는 문제는 왼쪽에 지문, 오른쪽에 문제·보기·해설 ---------- */
function split(q, html){
  var has = q.vig!==null && q.vig!==undefined;
  document.body.classList.toggle("wide", has);
  if(!has) return html;
  var old=document.querySelector(".vpane"), keep=(old && old.getAttribute("data-v")===String(q.vig)) ? old.scrollTop : 0;
  setTimeout(function(){ var n=document.querySelector(".vpane"); if(n) n.scrollTop=keep; },0);
  return '<div class="split"><aside class="vpane" data-v="'+q.vig+'"><div class="vhead">케이스 지문 (Vignette)</div>'+rich(VIG[q.vig])+'</aside><div class="qpane">'+html+'</div></div>';
}

/* ---------- study screen: 문제 + 정답 + 해설을 같이 본다 ---------- */
function startStudy(ids, label){ UI.view="study"; UI.study={ids:ids, i:0, label:label}; saveUI(); study(); window.scrollTo(0,0); }
function study(){
  var T=UI.study, id=T.ids[T.i], q=BYID[id];
  var vig = '';
  var optsHtml = ["A","B","C"].map(function(L){
    return '<div class="opt'+(L===q.ans?' sel-ok':'')+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+
      (L!==q.ans && q.why && q.why[L] ? '<span class="whyl">'+esc(q.why[L])+'</span>' : '')+'</span></div>';
  }).join("");
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  $("view").innerHTML=split(q, '<section class="card">'+metaHtml(q, esc(q.orig), true)+vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div>'+
    '<div class="fb ok"><h3>정답 '+q.ans+'</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+trap+
    '<details class="en"><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details></div>'+
    '<div class="nav"><button class="btn" id="sPrev" '+(T.i===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+(T.i+1)+' / '+T.ids.length+'</span>'+
    '<button class="btn primary" id="sNext" '+(T.i===T.ids.length-1?'disabled':'')+'>다음 →</button></div>'+jumpBar(T.ids,T.i)+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="btn" id="sQuiz">이 목록 풀기 ('+T.ids.length+')</button><button class="btn" id="sHome">처음 화면</button></div></section>');
  $("sPrev").onclick=function(){ studyGo(T.i-1); };
  $("sNext").onclick=function(){ studyGo(T.i+1); };
  $("sQuiz").onclick=function(){ UI.view=null; saveUI(); S=fresh(T.ids.slice(),"list"); save(); render(); };
  $("sHome").onclick=setup;
  bindJump(T.ids.length, studyGo);
  $("bConf").onclick=function(){ toggleConf(id); study(); };
  header();
}
/* ---------- 번호로 이동: 목록에서 고르거나 순서 번호 입력 ---------- */
function jumpBar(ids, cur, done){
  var o=ids.map(function(id,i){ var q=BYID[id], r=done&&done[id], mk=r?(r.correct?"✓ ":"✗ "):"";
    return '<option value="'+i+'"'+(i===cur?' selected':'')+'>'+mk+(i+1)+'. '+esc(q.orig)+' · '+esc(q.tag)+'</option>'; }).join("");
  return '<div class="jump"><select id="jSel" aria-label="문제 목록에서 이동">'+o+'</select>'+
    '<input id="jIn" type="text" inputmode="numeric" placeholder="1~'+ids.length+'" aria-label="이동할 번호"><button class="btn" id="jGo">이동</button></div>';
}
function bindJump(n, go){
  $("jSel").onchange=function(){ go(+this.value); };
  function typed(){ var v=parseInt($("jIn").value,10); if(!(v>=1&&v<=n)){ alert("1부터 "+n+" 사이 번호를 입력하세요."); return; } go(v-1); }
  $("jGo").onclick=typed;
  $("jIn").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); typed(); } };
}
function studyGo(i){ var T=UI.study; if(i<0||i>=T.ids.length) return; T.i=i; saveUI(); study(); window.scrollTo(0,0); }

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card">'+metaHtml(q,'Q'+(S.idx+1), !!r)+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div>'+jumpBar(S.order,S.idx,S.round)+'</section>';
  $("view").innerHTML=split(q, html);
  Array.prototype.forEach.call(document.querySelectorAll("button.opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  bindJump(S.order.length, quizGo);
  $("bConf").onclick=function(){ toggleConf(id); quiz(); };
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function quizGo(i){ if(i<0||i>=S.order.length) return; S.idx=i; save(); quiz(); window.scrollTo(0,0); }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  var wcIds=S.order.filter(function(id){var r=S.round[id];return (r&&!r.correct) || isConf(BYID[id]);});
  document.body.classList.remove("wide");
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"||S.mode==="rwc"?"다시 풀기 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">토픽별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bRetryWC" '+(wcIds.length?'':'disabled')+'>틀린 문제 + 헷갈림 다시 풀기 ('+wcIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  function retry(ids, mode){ if(!ids.length) return; S.order=ids; S.idx=0; S.mode=mode; S.round={}; S.finished=false; S.view="quiz"; save(); render(); }
  $("bRetry").onclick=function(){ retry(wrongIds,"review"); };
  $("bRetryWC").onclick=function(){ retry(wcIds,"rwc"); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S || !S.order){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, confused:isConf(q), selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak,
    confusedOverrides:CONF.ids
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{이름}/latest.json)의 마지막 attempt로 진행 상태와 헷갈림 표시를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  if(at.confusedOverrides){ CONF={ids:at.confusedOverrides, at:at.exportedAt||""}; store.set(CONFKEY,CONF); }
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:MODE[at.mode]?at.mode:"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  UI.view=null; saveUI();
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기·헷갈림 변경보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(CONF.at>t) t=CONF.at;
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(UI.view!=="study" && (!S || S.view==="setup")){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(UI.view==="study" && UI.study && UI.study.ids && UI.study.ids.length) return study();
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} UI.view=null; saveUI(); S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(UI.view==="study"){ if(e.key==="ArrowRight") studyGo(UI.study.i+1); else if(e.key==="ArrowLeft") studyGo(UI.study.i-1); return; }
  if(!S||S.view!=="quiz"||!document.querySelector("button.opt")) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>

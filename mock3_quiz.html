rk return: 10% × –10% = –1%\nTherefore, value added from asset allocation = 2% + (–1%) = 1%\nValue added from security selection:\nValue added from equities: 50% × [(–16%) – (–20%)] = 2%\nValue added from bonds: 50% × [(–12%) – (–10%)] = –1%\nTherefore, value added from security selection = 2% + (–1%) = 1%\nThe positive contribution to performance therefore comes equally from asset allocation and security selection (1% = 1%).\nC. greater than the value added from security selection. — Incorrect\nIncorrect because the value added from asset allocation is equal to the value added from security selection.\nAn example of how this conclusion may be derived is as follows:\nThe strategic asset allocation weights multiplied by the fund returns is [(60% × –16%) + (40% × –12%)] = –14.4%.\nThe total fund return is [(50% × –16%) + (50% × –12%)] = –14.0%.\n–14.0% – (–14.4%) = 0.4%, which may be interpreted as the value added from security selection, and this is less than the value added from asset allocation (1.0%).", "ko": "자산배분: 주식 (50% − 60%) × (−20%) = 2%, 채권 (50% − 40%) × (−10%) = −1% → 1%. 종목선택: 주식 50% × [(−16%) − (−20%)] = 2%, 채권 50% × [(−12%) − (−10%)] = −1% → 1%. 둘이 같다.", "trap": "자산배분은 비중 차이 × 벤치마크 수익, 종목선택은 실제 비중 × 초과수익.", "f": "RA = Σ Δw × R_B + Σ w_P × (R_P − R_B)", "why": {"A": "자산배분 1% = 종목선택 1%.", "C": "자산배분 1% = 종목선택 1%."}, "orig": "Mock 3 Session 2 Q29", "conf": false}, {"id": "mock3-Q74", "src": "정답", "module": "PM", "tag": "최적 능동위험 → 벤치마크 비중", "vig": 18, "stem": "To achieve her goal for the equity exposure, the weight that Kabbaj should allocate to the global equity index benchmark portfolio is closest to:", "opts": {"A": "−30%.", "B": "15%.", "C": "100%."}, "ans": "B", "en": "A. −30%. — Incorrect\nIncorrect because the optimal amount of active risk is incorrectly calculated using the active stock selection strategy's standard deviation (σP) rather than that of the benchmark, as follows:\nσ(RA) = (IR/SRB) × σP\nσ(RA) = (0.27/0.53) × 23% = 11.72%\nThe weight on the active stock selection strategy would then be 11.72%/9.00% = 1.30 = 130%, and the weight on the benchmark portfolio would be 1 – 1.30 = –0.30 = –30% (i.e., short).\nB. 15%. — Correct\nCorrect because the maximum Sharpe ratio is achieved by having the optimal amount of active risk, reflected as:\nσ(RA) = (IR/SRB) × σB\nwhere:\nσ(RA) = Optimal amount of active risk\nIR = Information ratio of active stock selection strategy = 0.27\nSRB = Sharpe ratio of benchmark = 0.53\nσB = Standard deviation of benchmark returns = 15%\nσ(RA) = (0.27/0.53) × 15% = 7.64%\nTo achieve this optimal amount of active risk, the weight of the active stock selection strategy should be proportionate to the current level of active risk in the portfolio (9%).\n7.64%/9.00% = 0.85 = 85%\nTherefore, the allocation to the active stock selection strategy should be 85% and the allocation to the benchmark portfolio should be 1 − 0.85 = 0.15 = 15%.\nC. 100%. — Incorrect\nIncorrect because allocating 100% to the benchmark portfolio would give a Sharpe ratio of 0.53. This is higher than that of the active stock selection strategy but lower than the maximum Sharpe ratio of 0.595, which can be achieved through the combination of an allocation to both the active stock selection strategy and the benchmark portfolio.\nThe maximum Sharpe ratio based on a combination of benchmark portfolio and active stock selection strategy is calculated as:\nSRP^2= SRB^2 + IR^2 = 0.53^2+ 0.27^2 = 0.3538\nSRP = SQRT(0.3538) = 0.595", "ko": "최적 능동위험 = (IR/SR_B) × σ_B = (0.27/0.53) × 15% = 7.64%. 현재 능동전략의 능동위험이 9%이므로 능동전략 비중 = 7.64/9 = 85%, 벤치마크 비중 = 15%.", "trap": "σ_B 자리에 능동전략의 표준편차를 넣지 말 것. 남는 비중이 벤치마크.", "f": "σ(RA)* = (IR / SR_B) × σ_B", "why": {"A": "벤치마크 표준편차 대신 능동전략 표준편차로 계산.", "C": "벤치마크 100%는 Sharpe 0.53으로, 능동전략을 섞은 최적 조합보다 낮다."}, "orig": "Mock 3 Session 2 Q30", "conf": true}, {"id": "mock3-Q75", "src": "정답", "module": "PM", "tag": "채권 위험 프리미엄 (인플레 불확실성)", "vig": 18, "stem": "The bond risk premium for uncertainty about future inflation in Country A is closest to:", "opts": {"A": "0.54%.", "B": "1.16%.", "C": "2.86%."}, "ans": "A", "en": "A. 0.54%. — Correct\nCorrect because the risk premium for uncertainty about future inflation, also known as the bond risk premium, can be approximated as follows: assume that the real return on an index-linked government bond is a good proxy for the real rate of interest that balances savings and investment in an economy over time. If we subtract the yield on an index-linked government bond from the yield on a conventional government bond with a similar maturity and then subtract from this amount a survey-based measure of inflation expectations, what is left over is the bond risk premium. That is, the extra yield investors require for holding a conventional government bond over and above the real required return and the return in compensation for expected inflation.\nTherefore, the calculation is: Conventional government bond yield less inflation-linked government bond yield less survey-based inflation expectation.\n5.66% – 2.32% – 2.80% = 0.54%\nB. 1.16%. — Incorrect\nIncorrect because the corporate bond yield is used as the starting point, however, this is incorrect as this would also include a credit premium.\nThe incorrect calculation is: Corporate bond yield less inflation-linked government bond yield less survey-based inflation expectation.\n6.28% – 2.32% – 2.80% = 1.16%\nC. 2.86%. — Incorrect\nIncorrect because this is calculated as conventional government bond yield less survey-based inflation expectation.\n5.66% – 2.80% = 2.86%", "ko": "명목 국채 수익률 − 물가연동 국채 수익률 − 설문 기대인플레이션 = 5.66% − 2.32% − 2.80% = 0.54%.", "trap": "회사채 수익률로 시작하면 신용 프리미엄이 섞인다.", "f": "BRP = 명목 국채 − 물가연동 국채 − 기대인플레", "why": {"B": "국채 대신 회사채 수익률에서 출발(신용 프리미엄 포함).", "C": "물가연동 국채 수익률을 빼지 않음(명목 − 기대인플레만)."}, "orig": "Mock 3 Session 2 Q31", "conf": true}, {"id": "mock3-Q76", "src": "오답", "module": "PM", "tag": "높은 P/E 원인: 실질 이익성장 기대", "vig": 18, "stem": "The change in which of the following factors best explains the recent level of P/E ratios in Country A?", "opts": {"A": "Real interest rates", "B": "The equity risk premium", "C": "Real earnings growth expectations"}, "ans": "C", "en": "A. Real interest rates — Incorrect\nIncorrect because a high P/E could be the result of a number of factors, including the following: falling real interest rates. Therefore, increasing real interest rates will not result in higher P/E ratios.\nB. The equity risk premium — Incorrect\nIncorrect because a high P/E could be the result of a number of factors, including the following: a decline in the equity risk premium. Therefore, an increase in the equity risk premium will not result in higher P/E ratios.\nC. Real earnings growth expectations — Correct\nCorrect because a high P/E could be the result of a number of factors, including the following: falling real interest rates, a decline in the equity risk premium, an increase in the expectation of future real earnings growth, an expectation of lower operating and/or financial risk, or a combination of all of these factors. All of these components will be influenced by the business cycle. Since interest rates have been rising in Country A, the high P/E ratios are most likely a result of the increased expectation of future real earnings growth.", "ko": "높은 P/E는 실질금리 하락, ERP 하락, 실질 이익성장 기대 상승 등에서 온다. Country A는 금리가 오르고 있으므로 높은 P/E는 실질 이익성장 기대가 커졌기 때문으로 본다.", "trap": "금리 상승·ERP 상승은 P/E를 낮추는 쪽이다.", "f": "", "why": {"A": "실질금리가 오르면 P/E는 낮아진다.", "B": "ERP가 오르면 P/E는 낮아진다."}, "orig": "Mock 3 Session 2 Q32", "conf": true, "my": "A"}, {"id": "mock3-Q77", "src": "오답", "module": "CI", "tag": "목표 배당성향 조정 모형", "vig": 19, "stem": "Emery's forecast for Zeta's dividend per share for the current year should be closest to:", "opts": {"A": "$1.27.", "B": "$1.37.", "C": "$1.45."}, "ans": "A", "en": "A. $1.27. — Correct\nCorrect because Zeta follows a target payout adjustment model in which case the expected increase in dividends is (expected earnings × target payout ratio – previous dividend) × adjustment factor, where the adjustment factor is one divided by the number of years over which the dividend adjustment occurs.\nFor Zeta, the expected increase in dividends is: ($2.44 × 0.60 – $1.21) × (1/4) = $0.0635.\nThus, the forecasted dividend for next year is $1.21 + $0.0635 = $1.2735 ≈ $1.27.\nB. $1.37. — Incorrect\nIncorrect because, on the basis that Zeta is assumed to move toward its target payout ratio over four years, the average payout ratio over the past four years is calculated and multiplied by the forecasted EPS. The sum of the past four dividends is $4.55 and the sum of the past four EPS is $8.11. Therefore, the average payout ratio is $4.55/$8.11 = 0.561; multiplying this by the forecasted EPS is 0.561 × $2.44 = $1.369 ≈ $1.37.\nThis distracter is also the closest response if the most recent year's payout ratio is used to estimate the dividend: 0.568 × $2.44 = $1.386 ≈ $1.39.\nC. $1.45. — Incorrect\nIncorrect because this is the average dividend payout ratio over the most recent four years multiplied by $2.44, the EPS forecast:\n(0.446 + 0.485 + 0.880 + 0.568) / 4 = 0.595; multiplying this by the earnings forecast of $2.44 equals $1.45.\nThis is also the closest answer if the target payout ratio (0.60) is multiplied by the $2.44 earnings forecast: 0.60 × $2.44 = $1.464 ≈ $1.46.", "ko": "배당 증가 = (예상 EPS × 목표 배당성향 − 직전 배당) × 조정계수 = ($2.44 × 0.60 − $1.21) × 1/4 = $0.0635. 예상 배당 = 1.21 + 0.0635 = $1.27.", "trap": "과거 평균 배당성향을 쓰는 것이 아니라 목표 배당성향으로 부분 조정한다.", "f": "ΔD = (E × 목표 배당성향 − D_0) × (1/조정 연수)", "why": {"B": "과거 4년 평균 배당성향(4.55/8.11 = 0.561) × 2.44.", "C": "과거 4년 배당성향의 단순 평균 × 2.44."}, "orig": "Mock 3 Session 2 Q33", "conf": true, "my": "C"}, {"id": "mock3-Q78", "src": "오답", "module": "CI", "tag": "배당 발표 후 주가 상승: 대리인 비용", "vig": 19, "stem": "Zeta's stock price movement following the dividend announcement is most consistent with:", "opts": {"A": "homemade dividends.", "B": "the bird in the hand argument.", "C": "perceived agency cost changes."}, "ans": "C", "en": "A. homemade dividends. — Incorrect\nIncorrect because this theory states that investors can \"make their own dividend\" by selling (or purchasing) shares as appropriate, so the firm's dividend policy is irrelevant and does not affect firm value. But the theory behind this view assumes perfect capital markets and no taxes or transactions costs. Zeta is subject to a flat corporate tax rate and investors have a progressive tax rate schedule. Therefore, the assumption is violated. In addition, with a dividend below expectations, investors may have been expected to sell shares, thus reducing stock price, if 'homemade dividends' were an issue.\nB. the bird in the hand argument. — Incorrect\nIncorrect because this perspective will lead to a decline, not an increase, in stock price. Under the bird in the hand argument, investors prefer dividends now (cash in hand) rather than the risky and uncertain future capital gains. In addition, the announcement that dividends are lower than expected may create the possibility (due to product market uncertainty) for lower-than-expected earnings and dividends in the short-term future.\nC. perceived agency cost changes. — Correct\nCorrect because reduced agency costs should result in a higher stock price. Increased transparency by management and the perception they are taking actions to maintain financial flexibility to protect shareholders' interests can reduce agency costs and result in a share price increase.", "ko": "경영진이 투명하게 재무 유연성을 지키는 조치를 하면 주주는 대리인 비용이 줄었다고 보고 주가가 오른다.", "trap": "bird in the hand라면 배당 축소에 주가가 내려야 한다.", "f": "", "why": {"A": "homemade dividend 이론에서는 배당정책이 주가와 무관하다.", "B": "bird in the hand라면 이 상황에서 주가가 떨어져야 한다."}, "orig": "Mock 3 Session 2 Q34", "conf": false, "my": "B"}, {"id": "mock3-Q79", "src": "오답", "module": "CI", "tag": "주식배당의 영향", "vig": 19, "stem": "Which of the following would most likely change in the dividend scenario considered by Emery?", "opts": {"A": "Cash", "B": "Retained earnings", "C": "Stockholders' equity"}, "ans": "B", "en": "A. Cash — Incorrect\nIncorrect because cash is not affected by a stock dividend; stock dividends do not affect assets or liquidity ratios.\nB. Retained earnings — Correct\nCorrect because both retained earnings (reduced) and contributed capital (increased) change by equal amounts but stockholders' equity does not change.\nStock dividends, on the other hand, do not affect assets or shareholders’ equity. Although retained earnings are reduced by the value of the stock dividends paid (i.e., by the number of shares issued × price per share), contributed capital increases by the same amount (i.e., the value of the shares issued). As a result, total shareholders’ equity does not change. Neither stock dividends nor stock splits affect liquidity ratios or financial leverage ratios.\nC. Stockholders' equity — Incorrect\nIncorrect because stockholders' equity is not affected by stock dividends (offsetting changes in retained earnings and contributed capital keep stockholders' equity unchanged).", "ko": "주식배당은 이익잉여금을 줄이고 같은 금액만큼 납입자본을 늘린다. 현금·자산·총자본은 변하지 않고 이익잉여금만(자본 내 구성) 바뀐다.", "trap": "총자본은 그대로다(이익잉여금 ↓ = 납입자본 ↑).", "f": "", "why": {"A": "주식배당은 현금을 쓰지 않는다.", "C": "이익잉여금과 납입자본이 같은 금액만큼 바뀌어 총자본은 그대로다."}, "orig": "Mock 3 Session 2 Q35", "conf": true, "my": "C"}, {"id": "mock3-Q80", "src": "오답", "module": "CI", "tag": "FCFE 커버리지 비율", "vig": 19, "stem": "Etaphi's FCFE coverage ratio is closest to:", "opts": {"A": "1.17.", "B": "1.27.", "C": "1.39."}, "ans": "A", "en": "A. 1.17. — Correct\nCorrect because the FCFE coverage ratio is computed as FCFE / [dividends + share repurchases]. Here, there are no share repurchases, only new share issues. The coverage ratio is ($89 / $76) = 1.1711 ≈ 1.17.\nB. 1.27. — Incorrect\nIncorrect because the FCFE coverage ratio is computed as FCFE / [dividends + share repurchases]. Here, an incorrect calculation includes the new share issuance proceeds and net interest paid: $89 / [$76 – $12 + $6] = 1.2714 ≈ 1.27.\nC. 1.39. — Incorrect\nIncorrect because the FCFE coverage ratio is computed as FCFE / [dividends + share repurchases]. Here, an incorrect calculation includes the new share issuance proceeds: $89 / [$76 – $12] = 1.3906 ≈ 1.39.", "ko": "FCFE 커버리지 = FCFE / (배당 + 자사주 매입). 자사주 매입은 없고 신주 발행만 있으므로 = $89 / $76 = 1.17.", "trap": "신주 발행 대금이나 이자를 분모에 넣지 않는다.", "f": "FCFE coverage = FCFE / (Dividends + Buybacks)", "why": {"B": "신주 발행 대금과 순이자를 분모에 반영(89/(76 − 12 + 6)).", "C": "신주 발행 대금 등을 분모에 잘못 반영."}, "orig": "Mock 3 Session 2 Q36", "conf": true, "my": "C"}, {"id": "mock3-Q81", "src": "정답", "module": "ECO", "tag": "클럽 수렴", "vig": 20, "stem": "The type of convergence occurring if Country A achieves its long-term goal is best referred to as:", "opts": {"A": "club convergence.", "B": "absolute convergence.", "C": "conditional convergence."}, "ans": "A", "en": "A. club convergence. — Correct\nCorrect because Country A is a developing economy and it intends to achieve its growth objective by having the required institutional changes to ensure convergence. There is the notion of club convergence, where only rich and middle-income countries that are members of the club are converging to the income level of the world’s richest countries. However, poor countries can join the club if they make institutional changes to support this, such as those that Country A is planning.\nB. absolute convergence. — Incorrect\nIncorrect because absolute convergence means that developing countries, regardless of their particular characteristics, will eventually catch up with the developed countries and match them in per capita output, whereas Ling believes Country A will converge if it introduces trade policies and successfully develops its legal, political, and economic institutions to support this goal. Furthermore, absolute convergence implies convergence of per capita growth rates among all countries. It does not, however, imply that the level of per capita income will be the same in all countries, whereas Country A plans to achieve the same income level of developed countries.\nC. conditional convergence. — Incorrect\nIncorrect because conditional convergence means that convergence is conditional on the countries having the same saving rate, population growth rate, and production function. Country A has higher population growth than developed economies.", "ko": "Country A는 개발도상국이지만 제도 개혁으로 부유국 클럽에 들어가 소득을 따라잡으려 한다. 제도를 바꾸면 가난한 나라도 클럽에 들어올 수 있다는 것이 클럽 수렴이다.", "trap": "절대 수렴 = 조건 상관없이 따라잡음, 조건부 수렴 = 저축률·인구증가율·생산함수가 같을 때.", "f": "", "why": {"B": "절대 수렴은 국가 특성과 관계없이 따라잡는다는 개념.", "C": "조건부 수렴은 저축률·인구증가율 등이 같아야 한다는 조건이 붙는다."}, "orig": "Mock 3 Session 2 Q37", "conf": true}, {"id": "mock3-Q82", "src": "정답", "module": "ECO", "tag": "잠재 GDP 영구적 증가: 인적자본", "vig": 20, "stem": "Which expected change in Country B's labor market will most likely contribute to a permanent increase in its potential GDP growth?", "opts": {"A": "Change 1", "B": "Change 2", "C": "Change 3"}, "ans": "C", "en": "A. Change 1 — Incorrect\nIncorrect because a reduction in the number of unemployed workers would boost utilization of the existing labor supply. This shift would represent a transition to a higher level of employment rather than a permanent increase in the potential growth rate of the economy, not the growth rate of employment. Unemployment is a transitory and not a permanent factor of the country's economic growth rate. Therefore, declining unemployment is not going to permanently change Country B’s economic growth rate.\nB. Change 2 — Incorrect\nIncorrect because rising participation rates among women could increase growth in the labor force and in potential GDP. It should be noted, however, that rising or falling labor force participation is likely to represent a transition to a new higher or lower level of participation rather than a truly permanent rate of change. The rise in the female labor force participation rate is a transitory and not a permanent factor to the country's economic growth rate.\nC. Change 3 — Correct\nCorrect because increased education, obtained both formally and via on-the-job training, could result in a permanent increase in the growth rate of an economy if the more educated workforce results in more innovations and a faster rate of technological progress. Also, the quality of the labor force is an important source of growth for an economy. In general, better-educated and more-skilled workers will be more productive and more adaptable to changes in technology or other shifts in market demand and supply. If on-the-job training is provided to a larger proportion of Country B's workforce, its labor force quality will be improved, contributing to a permanent increase in the country's potential GDP growth rate.", "ko": "교육·직무훈련이 늘면 노동의 질이 높아지고 혁신·기술 진보가 빨라져 잠재 GDP 성장률이 영구적으로 오를 수 있다(Change 3).", "trap": "실업 감소는 기존 노동력 활용도 상승(일시적 이행), 여성 참가율 상승도 한계가 있어 영구적이지 않다.", "f": "", "why": {"A": "실업자 감소는 기존 노동력 활용이 늘어나는 일시적 효과.", "B": "참가율 상승은 상한이 있어 영구적 성장률 증가가 아니다."}, "orig": "Mock 3 Session 2 Q38", "conf": false}, {"id": "mock3-Q83", "src": "정답", "module": "ECO", "tag": "노동생산성 성장회계", "vig": 20, "stem": "Based on the labor productivity growth accounting equation, the potential GDP growth rate of Country B is:", "opts": {"A": "–0.9%.", "B": "0.7%.", "C": "1.5%."}, "ans": "B", "en": "A. –0.9%. — Incorrect\nIncorrect because it erroneously includes the growth in total hours worked. Growth rate of potential GDP = Growth in total hours worked + Long-term growth rate of labor force + Long-term growth rate in labor productivity = –1.6% – 1.7% + 2.4% = –0.9%.\nB. 0.7%. — Correct\nCorrect because Growth rate of potential GDP = Long-term growth rate of labor force + Long-term growth rate in labor productivity = –1.7% + 2.4% = 0.7%.\nC. 1.5%. — Incorrect\nIncorrect because it erroneously includes the growth in total factor productivity. Growth rate of potential GDP = Growth in total factor productivity + Long-term growth rate of labor force + Long-term growth rate in labor productivity = 0.8% – 1.7% + 2.4% = 1.5%.", "ko": "잠재 GDP 성장률 = 장기 노동력 증가율 + 장기 노동생산성 증가율 = −1.7% + 2.4% = 0.7%.", "trap": "총 근로시간 증가율이나 TFP 증가율을 더하지 않는다.", "f": "Potential GDP growth = Labor force growth + Labor productivity growth", "why": {"A": "총 근로시간 증가율을 잘못 포함.", "C": "총요소생산성 증가율을 잘못 포함."}, "orig": "Mock 3 Session 2 Q39", "conf": false}, {"id": "mock3-Q84", "src": "정답", "module": "ECO", "tag": "인플레 전망과 채권 가격", "vig": 20, "stem": "Based on Ling's outlook, which country's bonds would most likely increase in price?", "opts": {"A": "Country A's bonds only", "B": "Country B's bonds only", "C": "Both Country A's bonds and Country B's bonds"}, "ans": "B", "en": "A. Country A's bonds only — Incorrect\nIncorrect because actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation, which puts corresponding pressure on nominal interest rates and bond prices. Ling expects Country A's actual GDP growth rate will stay above the potential GDP growth rate. This leads to higher inflation and lower, not higher, bond prices.\nB. Country B's bonds only — Correct\nCorrect because actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation, which puts corresponding pressure on nominal interest rates and bond prices. Ling expects Country B will experience much lower inflation than the current market forecast. This leads to higher bond prices.\nC. Both Country A's bonds and Country B's bonds — Incorrect\nIncorrect because actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation, which puts corresponding pressure on nominal interest rates and bond prices. Ling expects Country B will experience much lower inflation than the current market forecast. This leads to higher bond prices for Country B. Ling expects Country A's actual GDP growth rate will stay above the potential GDP growth rate. This leads to higher inflation and lower, not higher, bond prices.", "ko": "Ling은 Country B의 인플레이션이 시장 예상보다 훨씬 낮을 것으로 본다. 인플레이션이 예상보다 낮으면 명목금리가 내려가 채권 가격이 오른다. Country A는 그렇지 않다.", "trap": "실제 GDP 성장 > 잠재 성장이면 인플레·금리 상승 압력 → 채권 가격 하락.", "f": "", "why": {"A": "Country A는 실제 성장이 잠재 성장을 웃돌아 인플레 상승 → 채권 가격 하락.", "C": "Country A 채권은 인플레 상승 압력으로 가격이 내려간다."}, "orig": "Mock 3 Session 2 Q40", "conf": true}, {"id": "mock3-Q85", "src": "오답", "module": "EQ", "tag": "비상장사 정상화 EBIT", "vig": 21, "stem": "Romala's normalized EBIT (in $ millions) is closest to:", "opts": {"A": "3.9.", "B": "4.4.", "C": "4.8."}, "ans": "B", "en": "A. 3.9. — Incorrect\nIncorrect because the normalized earnings after interest and tax (EAIT) is calculated (instead of EBIT) as follows:\nNormalized EAIT = Reported EBIT – CEO salary – Increase in interest paid + Tax benefit on interest paid\nInterest paid = $5,500,000 × 0.10 = $550,000\nTax benefit on interest paid = $550,000 × 0.18 = $99,000\nNormalized EAIT = $5,000,000 – $600,000 – $550,000 + $99,000\n= $3,949,000 ≈ $3.9 million\nB. 4.4. — Correct\nCorrect because the normalized EBIT for Romala is calculated as follows:\nNormalized EBIT = Reported EBIT – CEO salary\n= $5,000,000 – $600,000\n= $4,400,000 = $4.4 million\nThere are two aspects relevant to the CEO compensation—the amount that should be reflected, and its effect on normalized EBIT:\n(1) SG&A expenses should reflect the expected salary expense under professional management at a market rate of compensation.\nTo normalize earnings, $600,000 is used for the CEO salary as the market rate of compensation because the current CEO earns more than what a replacement would earn.\n(2) takes no compensation and instead receives 1.5 million as a dividend. A proper amount for CEO compensation would be 500,000, and the normalized income statement should take this as a deduction. Thus, normalized earnings would be lower after the adjustment.\nThe full amount of a replacement CEO's salary ($600,000) needs to be deducted as part of SG&A expenses, while the current CEO compensation in the form of dividends is correctly not included in EBIT (dividends are only reflected after EBIT).\nNo adjustment to EBIT is necessary for the increase in debt level as interest and its effect on taxes are below the EBIT line.\nC. 4.8. — Incorrect\nIncorrect because the normalized EBIT for Romala is calculated by deducting the net difference between the current CEO's compensation and a replacement CEO's salary ($800,000 – $600,000 = $200,000):\nNormalized EBIT = Reported EBIT – Net difference in CEO salary\n= $5,000,000 – $200,000\n= $4,800,000 = $4.8 million\nNo adjustment to EBIT was correctly taken into account for the increase in debt level as interest and its effect on taxes are below the EBIT line.", "ko": "현 CEO는 급여 대신 연 $800,000를 배당으로 받는다. 배당은 EBIT 아래 항목이라 보고 EBIT에 CEO 급여가 빠져 있다. 대체 CEO 시장 급여 $600,000 전액을 SG&A로 빼야 한다. 정상화 EBIT = $5.0m − $0.6m = $4.4m. 부채 증가는 이자가 EBIT 아래라 조정 없음.", "trap": "급여 차액(800,000 − 600,000)만 빼면 4.8. 배당은 EBIT에 영향 없으므로 대체 급여 전액을 차감.", "f": "Normalized EBIT = Reported EBIT − 대체 CEO 시장 급여", "why": {"A": "EBIT가 아니라 세후·이자후 이익(EAIT)을 계산.", "C": "현 CEO 보상과 대체 CEO 급여의 차액만 차감."}, "orig": "Mock 3 Session 2 Q41", "conf": false, "my": "A"}, {"id": "mock3-Q86", "src": "정답", "module": "EQ", "tag": "확장 CAPM", "vig": 21, "stem": "The required return on equity for Romala using the expanded CAPM is closest to:", "opts": {"A": "11.5%.", "B": "12.0%.", "C": "14.0%."}, "ans": "C", "en": "A. 11.5%. — Incorrect\nIncorrect because the calculation for the required return on equity for Romala does not adjust the equity risk premium for beta.\n= 3.5% + 5.0% + 2.0% + 1.0%\n= 11.5%\nB. 12.0%. — Incorrect\nIncorrect because the required return on equity for Romala using the CAPM omits the small stock risk premium:\nre = rf + β(rm – rf) + Company-specific risk premium\n= 3.5% + (1.5 × 5.0%) + 1.0%\n= 12.0%\nC. 14.0%. — Correct\nCorrect because the expanded CAPM is an adaptation of the CAPM that adds to the single premium based upon beta to take small size and company-specific risk into account as additions to the cost of equity.\nThe required return on equity for Romala using the expanded CAPM is calculated as follows:\nre = rf + β(rm – rf) + Small stock risk premium + Company-specific risk premium\n= 3.5% + (1.5 × 5.0%) + 2.0% + 1.0%\n= 14.0%", "ko": "re = rf + β(rm − rf) + 소형주 프리미엄 + 기업 고유 프리미엄 = 3.5% + 1.5 × 5.0% + 2.0% + 1.0% = 14.0%.", "trap": "ERP에 베타를 곱해야 한다. 소형주 프리미엄도 빠뜨리지 말 것.", "f": "re = rf + β × ERP + Size premium + Company-specific premium", "why": {"A": "ERP에 베타 1.5를 곱하지 않음.", "B": "소형주 프리미엄을 빠뜨림."}, "orig": "Mock 3 Session 2 Q42", "conf": false}, {"id": "mock3-Q87", "src": "정답", "module": "EQ", "tag": "DLOC·DLOM 할인 적용", "vig": 21, "stem": "Romala's adjusted equity value (in $ millions) is closest to:", "opts": {"A": "683.", "B": "689.", "C": "695."}, "ans": "C", "en": "A. 683. — Incorrect\nIncorrect because the total discount is calculated incorrectly by adding the DLOC and DLOM as follows:\nAdjusted equity value = Unadjusted equity value – Total discount\nTotal discount = 1 – (DLOC + DLOM)\nwhere:\nDLOC = Discount for lack of control\nDLOM = Discount for lack of marketability\nDLOM is given in the case as 15%, but DLOC has to be calculated first:\nDLOC = 1 – [1/(1 + Control premium)]\n= 1 – [1/(1 + 0.10)]\n≈ 1 – 0.9091\n≈ 0.0909 = 9.09%\nTotal discount is calculated as:\n≈ 0.0909 + 0.1500\n≈ 0.2409 ≈ 24.09%\nAnd then the adjusted equity value is $900 million × (1 – 0.2409) ≈ $683.18 million ≈ $683 million.\nB. 689. — Incorrect\nIncorrect because the DLOC is not calculated correctly and merely multiplied with the DLOM as follows:\nTotal discount is calculated as:\n= 1 – [(1 – 0.10) × (1 – 0.15)]\n= 1 – 0.7650\n= 0.2350 = 23.5%\nAnd then the adjusted equity value is $900 million × (1 – 0.2350) = $688.5 million ≈ $689 million.\nC. 695. — Correct\nCorrect because Romala's adjusted equity value is calculated as follows:\nAdjusted equity value = Unadjusted equity value – Total discount\nTotal discount = 1 – [(1 – DLOC) × (1 – DLOM)]\nwhere:\nDLOC = Discount for lack of control\nDLOM = Discount for lack of marketability\nDLOM is given in the case as 15%, but DLOC has to be calculated first:\nDLOC = 1 – [1/(1 + Control premium)]\n= 1 – [1/(1 + 0.10)]\n≈ 1 – 0.9091\n≈ 0.0909 = 9.09%\nTotal discount can thus be calculated as:\n≈ 1 – [(1 – 0.0909) × (1 – 0.15)]\n≈ 1 – 0.7727\n≈ 0.2273 ≈ 22.73%\nAnd then the adjusted equity value is $900 million × (1 – 0.2273) = $695.45 million ≈ $695 million.", "ko": "DLOC = 1 − 1/(1 + 지배 프리미엄 10%) = 9.09%. 총 할인 = 1 − (1 − 0.0909)(1 − 0.15) = 22.73%. 조정 자기자본가치 = $900m × (1 − 0.2273) = $695m.", "trap": "할인은 더하지 않고 곱셈으로 결합. 지배 프리미엄 10%를 DLOC로 바꿔야 한다.", "f": "DLOC = 1 − 1/(1 + CP), Total = 1 − (1 − DLOC)(1 − DLOM)", "why": {"A": "DLOC와 DLOM을 더함.", "B": "DLOC를 계산하지 않고 10%를 그대로 곱셈에 사용."}, "orig": "Mock 3 Session 2 Q43", "conf": true}, {"id": "mock3-Q88", "src": "정답", "module": "EQ", "tag": "FCFF 기업가치 (2년 + TV)", "vig": 21, "stem": "Using the FCFF valuation approach, Rhode's enterprise value (in $ millions) is closest to:", "opts": {"A": "13.2.", "B": "13.9.", "C": "14.5."}, "ans": "C", "en": "A. 13.2. — Incorrect\nIncorrect because Rhode's enterprise value is calculated using the FCFF valuation approach but discounts the terminal value for three years as follows:\nEV = FCFF1/(1 + WACC) + FCFF2/(1 + WACC)^2 + TV/(1 + WACC)^3\nwhere:\nEV = Enterprise value\nTV = Terminal value (given in the case as $15.4 million)\nEV = ($1,200,000 × 1.06)/(1.12) + ($1,200,000 × (1.06)^2)/(1.12)^2 + $15,400,000/(1.12)^3\n≈ ($1,272,000/1.12) + ($1,348,320/1.2544) + $15,400,000/(1.4049)\n≈ $1,135,714 + $1,074,872 + $10,961,416\n≈ $13,172,003\n≈ $13.2 million\nB. 13.9. — Incorrect\nIncorrect because Rhode's enterprise value is calculated using the FCFF valuation approach with required return on equity as the discount rate as follows:\nEV = FCFF1/(1 + r) + FCFF2/(1 + r)^2 + TV/(1 + r)^2\nwhere:\nEV = Enterprise value\nTV = Terminal value (given in the case as $15.4 million)\nEV = ($1,200,000 × 1.06)/(1.145) + ($1,200,000 × (1.06)^2)/(1.145)^2 + $15,400,000/(1.145)^2\n≈ ($1,272,000/1.145) + ($1,348,320/1.3110) + ($15,400,000/1.3110)\n≈ $1,110,917 + $1,028,447 + $11,746,534\n≈ $13,885,898\n≈ $13.9 million\nC. 14.5. — Correct\nCorrect because Rhode's enterprise value using the FCFF valuation approach is closest to $14.5 million, calculated as follows:\nEV = FCFF1/(1 + WACC) + FCFF2/(1 + WACC)^2 + TV/(1 + WACC)^2\nwhere:\nEV = Enterprise value\nTV = Terminal value (given in the case as $15.4 million)\nEV = ($1,200,000 × 1.06)/(1.12) + ($1,200,000 × (1.06)^2)/(1.12)^2 + $15,400,000/(1.12)^2\n= ($1,272,000/1.12) + ($1,348,320/1.2544) + ($15,400,000/1.2544)\n≈ $1,135,714 + $1,074,872 + $12,276,786\n≈ $14,487,372\n≈ $14.5 million", "ko": "FCFF1 = 1.2m × 1.06 = 1.272m, FCFF2 = 1.348m. WACC 12%로 할인: 1.272/1.12 + 1.348/1.12^2 + TV 15.4/1.12^2 = 1.136 + 1.075 + 12.277 = $14.5m.", "trap": "TV는 2년 말 값이므로 2년만 할인한다. 할인율은 WACC.", "f": "EV = Σ FCFF_t/(1 + WACC)^t + TV/(1 + WACC)^n", "why": {"A": "TV를 3년 할인.", "B": "WACC 대신 자기자본 요구수익률로 할인."}, "orig": "Mock 3 Session 2 Q44", "conf": false}], "vignettes": ["Hector Priam, an equity analyst at Troy Investments, is considering the following three valuation models.\nModel 1: Dividend discount model\nModel 2: Residual income model\nModel 3: Free cash flow to equity (FCFE) model\nPriam assumes constant growth in earnings and collects the information on Castor Industries shown in Exhibit 1.\nExhibit 1\nExpected EPS next period (E1)\t$2.65\nPresent value of growth opportunities (PVGO) per share\t$16.52\nRequired return on equity\t12%\nDividend payout ratio (constant)\t40%\nReturn on assets (ROA)\t9%\nCurrent book value per share (B0)\t$17.25\nTotal assets (millions)\t$77\nShareholders' equity (millions)\t$45", "Palmco Plc is a large British drinks manufacturer that produces a small range of well-known alcoholic and non-alcoholic beverages. Fabio Sylvester is Palmco's incoming Chief Financial Officer and his first task is to analyze the company's historical and current cost of capital. Sylvester observes that Palmco's cost of capital has decreased over recent years. He also notes three factors that could potentially explain this behavior:\nFactor 1: Palmco's ESG risk has increased significantly.\nFactor 2: The market has moved into a recessionary period, impacting Palmco's equity risk premium.\nFactor 3: Palmco has significantly reduced the proportion of intangible assets on its balance sheet.\nNext, Sylvester estimates the company's current cost of capital. To estimate Palmco's cost of equity, Sylvester initially considers using a historical approach with arithmetic mean returns and a short-term government bill rate as a proxy for the risk-free rate. However, Sylvester identifies a number of disadvantages with this approach.\nPalmco's CEO, Jacky Westerholm, approaches Sylvester with a proposal that Palmco acquire Spritz Ltd. Spritz is a privately held drinks company that specializes in alcoholic seltzers, a fast-growing segment of the beverage market that Palmco has yet to enter. Not only will Spritz provide Palmco with a fast-growing revenue stream, it will also provide synergies in the form of cost savings from consolidating production facilities. To provide a quick estimate of the price that Palmco should expect to pay to acquire Spritz, Sylvester gathers information about two comparable transactions, both of which completed in the last two years. Exhibit 1 shows the transaction price per share for each comparable company, along with various per share metrics which are given equal weights in Sylvester's analysis.\nExhibit 1\n\tCompany 1\tCompany 2\tSpritz\nTransaction share price (£)\t10.55\t35.60\t\nEarnings per share (£)\t0.52\t1.36\t3.24\nBook value per share (£)\t3.15\t10.05\t15.62\nPalmco's board of directors and Westerholm agree that the acquisition is the right move to improve stakeholder value and so they decide to make an offer to purchase Spritz. Currently, Palmco has no preferred equity and 25 million common equity shares outstanding, each trading at £28.00 per share. Palmco also has a book value of debt of £850 million, including publicly traded debt without any embedded options. Details of Palmco's offer are summarized in Exhibit 2. The balance of financing for the transaction will be funded with cash on hand.\nExhibit 2\nOffer price per Spritz share\t£70.00\nMix of consideration per Spritz share\t1 Palmco share and £42.00 cash\nTotal consideration\t£350 million\nAssumed Spritz debt\t£150 million\nNew borrowings by Palmco\t£200 million\nShare issuance\t5 million Palmco shares", "Janice McCabe is an analyst specializing in the financial institutions sector. She is currently reviewing the financial statements and regulatory disclosures for Acme Bank, a large commercial bank headquartered in the US. Acme prepares its financial statements in accordance with US GAAP.\nAs part of her analysis, McCabe uses the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach. She reviews Acme's selected financial information (in $ millions) for the most recent year in Exhibit 1 and computes its Common Equity Tier 1 Capital Ratio.\nExhibit 1\nCommon stockholders' equity\t176,400\nIntangible assets\t18,784\nDeferred tax assets\t7,986\nTotal risk-weighted assets\t1,042,361\nTotal assets\t1,596,723\nMcCabe examines the primary sources of earnings for Acme and its two closest competitors in Exhibit 2. Each earnings source is expressed as a percentage of total operating income. Based on this information, she determines which bank has the highest earnings quality.\nExhibit 2\n\tAcme\tCompetitor 1\tCompetitor 2\nNet interest income\t46.3%\t46.5%\t51.6%\nNet fee income\t22.7%\t19.8%\t20.9%\nNet trading income\t16.2%\t20.3%\t13.4%\nMcCabe notes that a large restricted stock grant of Acme vested during the current year, and that Acme's share price increased significantly between the initial stock grant date and the settlement date. Recognizing that Acme's financial statements are prepared in accordance with US GAAP, McCabe considers how the change in share price between the initial grant date and the settlement date will affect Acme's net income in the current year.\nFinally, McCabe examines the pension cost related to Acme's defined benefit pension plan for the most recent year. McCabe notes that Acme has no amortization of the following items: past service costs, actuarial gains and losses, and differences between actual and expected returns on plan assets. Acme reports the following components (in $ millions):\nCurrent service cost = 294\nInterest cost = 2,467\nActual return on plan assets = 2,240\nExpected return on plan assets = 2,075", "Alice Walhan, a fixed-income portfolio manager at Wye Creek Investments, is evaluating her portfolio and reviewing new investment opportunities in three different countries. For her analysis, Walhan collects the par and spot rates for various maturities of government bonds of Country A, as shown in Exhibit 1. She uses this information to construct a forward rate curve.\nExhibit 1\nMaturity (Years)\tPar Rate\tSpot Rate\n1\t3.25%\t3.25%\n2\t3.00%\t3.00%\n3\t2.75%\t2.80%\nWalhan decides to enter into a 2-year forward contract to purchase a 2-year zero-coupon government bond. Wye Creek's economist expects increasing employment and lower inflation in Country A to drive future spot rates below those predicted by the prevailing forward rates.\nFor her investment in Country B, Walhan has a 10- to 12-year investment horizon for fixed income securities. However, according to her stated strategy, she can deviate from this maturity range if the expected additional returns from doing so are large enough.\nCountry C has an upward sloping yield curve. Walhan has a 4-year investment horizon for her investment in Country C and her strategy is to maximize total return by riding the yield curve. She considers the most appropriate zero-coupon government bond to buy to implement this strategy, under the assumption that the yield curve will be unchanged in its level or shape over her investment horizon.", "Anna Kemp is an analyst with a UK-based asset management firm. Kemp is evaluating the firm's two UK equity portfolios (Portfolio 1 and Portfolio 2) and ETF investments in foreign markets.\nKemp uses macroeconomic factor models to analyze the returns of both UK equity portfolios. Each model assumes that stock returns are correlated with surprises in two factors.\nFor Portfolio 1, Kemp's model uses the inflation rate and the GDP growth rate as its factors. The portfolio's benchmark is a major UK equity market index, and the portfolio's active return for the most recent year was 1.34%. Based on the information in Exhibit 1, Kemp determines the contribution of factor tilts and security selection to the portfolio's active return.\nExhibit 1\nFactor\tFactor Sensitivity for Portfolio 1\tFactor Sensitivity for Benchmark\tFactor Surprise (Most Recent Year)\nInflation rate\t–1.5\t–2.1\t0.4%\nGDP growth rate\t2.4\t0.7\t–0.8%\nFor Portfolio 2, Kemp's model uses a reference interest rate and the change in consumer confidence as its factors. At the start of the most recent year, Portfolio 2's expected annual return was 8.0%. At the end of the year, Kemp compares the initial forecasted values of the model's factors to their actual values in Exhibit 2. The actual return of the portfolio was 6.0% for the most recent year.\nExhibit 2\nFactor\tFactor Sensitivity\tForecasted Value\tActual Value\nReference interest rate\t–1.0\t6.5%\t7.0%\nChange in consumer confidence\t3.2\t0.5%\t–0.5%\nSeparately, Kemp calculates the expected total holding period cost of investing in a US equity ETF, based on the following information:\n• The ETF will be held for six months.\n• The one-way commission is 0.05%.\n• The bid–ask spread on purchase and sale is 0.20%.\n• The annual management fee is 0.30%.\nKemp observes that the US equity ETF shares are trading at an usually high discount relative to their intraday NAV and that arbitrage costs are low. She considers how the gap to fair value may be closed.", "Maria Pirlo, an analyst at Chenta Investments, is preparing a report on the firm’s portfolios. Pirlo first examines Portfolio X. Using historical data, she determines that Portfolio X’s daily 5% VaR is $24 million. Pirlo then computes an alternative VaR measure that captures the expected daily loss of Portfolio X on days when losses exceed the VaR. Next, Pirlo examines Portfolio Y and collects the following information:\nDaily expected return: 0.052%\nDaily standard deviation: 2.15%\nTotal portfolio value: $420 million\nPirlo computes the daily 5% VaR for Portfolio Y using the parametric method. At a 5% significance level, the critical z-value for a one-sided test is 1.65 and the critical z-value for a two-sided test is 1.96.\nChenta plans to launch a new portfolio for clients utilizing an equity investment strategy based on a multifactor model. To select the new investment strategy, Pirlo identifies ten fundamental factors and uses these factors to backtest numerous strategies. For the backtest, Pirlo uses point-in-time data while accounting for reporting lags and data revisions. Based on the backtesting results, Pirlo selects the strategy with the highest t-statistics for Chenta's new portfolio offering.", "Vitor Costa, CFA, is a private wealth manager for high-net-worth individuals. Costa's firm does not claim compliance with the GIPS standards. During an initial meeting with a prospective client, Costa has prepared a brief presentation of performance data. In his calculation of composite returns, he excludes terminated accounts. He includes a disclaimer that the presentation does not include detailed information, although additional details are available upon request.\nCosta next meets with his largest client. Costa has an arrangement with this client that, if the client's annual portfolio return outperforms its benchmark by more than 5%, Costa gets access to the client’s yacht for three days for personal use. Costa's colleagues are aware of this arrangement, and he has obtained verbal approval from his employer.\nWhile at a wealth management conference, Costa discusses with other attendees his practices regarding proxy voting, trust account management, and soft commissions. He states that, when voting on proxies for non-routine governance issues, he always follows the recommendations of each company's management. Regarding trust accounts, Costa explains that his fiduciary duty is to the trust's beneficiaries rather than to the individual who hires him to manage the trust. As for soft commissions, Costa discloses that he occasionally engages a brokerage firm that offers research services. While this research benefits Costa's clients, the broker charges higher commissions than his usual broker.\nAs part of his commitment to contribute to the investment profession, Costa maintains a blog where he discusses developments in the wealth management industry. Recently, on his blog, he posted an article in which he was critical of ESG-related material published by CFA Institute. Separately, Costa is helping a friend study for the CFA Level III exam. After reviewing the curriculum material, Costa highlights to his friend what he considers to be the topic areas and formulas that are likely to be tested on the exam.", "Susan Branson is a quantitative analyst studying several financial and economic time series.\nBranson fits a log-linear trend model to the monthly values of a financial variable (in $ thousands). The time series consists of 964 monthly observations, and the most recent observation of the time series is 4,860. Branson uses the estimated coefficients of the log-linear trend model in Exhibit 1 to predict the trend value of the variable for the following month.\nExhibit 1\n\tCoefficient\tStandard Error\nIntercept\t2.5230\t0.0195\nt (Trend)\t0.0068\t0.0004\nBranson also analyzes the quarterly time series of another financial variable. She performs a Dickey–Fuller test on the time series and fails to reject the null hypothesis of the test at the chosen significance level.\nIn another study, Branson uses structured data in a machine-learning model to predict up movements (Class \"1\") and down movements (Class \"0\") in an economic variable. She scales the data as part of the preprocessing step.\nBranson evaluates the machine-learning model's performance using the information in Exhibit 2. She calculates the F1 score to evaluate the overall performance of the model.\nExhibit 2\n\t\tActual Training Labels\t\nUp (Class \"1\")\tDown (Class \"0\")\nPredicted Results\tUp (Class \"1\")\t350\t533\nDown (Class \"0\")\t246\t941", "Grant Pulo is a fixed income analyst evaluating bonds for his firm's portfolio.\nPulo analyzes several bonds issued by Corr Inc. He assumes interest rate volatility of 10% and constructs the binomial interest rate tree shown in Exhibit 1. In the tree, branching from each node to a high state or a low state occurs with equal probability. Pulo uses the tree to value a 6% annual-coupon, option-free bond issued by Corr that matures in 3 years and has a par value of 100.\n[IMAGE: CFA-IS-2023.04-FIIN-Pande+1-Case_2.png]\nYear zero: 3 point zero zero percent. Arrow upward to: Year 1: 4 point 8 9 percent. Arrow downward to Year 1, 4 point zero zero percent. From the top box in year 1, arrow upward to Year 2: 7 point 4 6 percent. Arrow downward to 6 point 1 1 percent. From the bottom box, arrow upward to the Year 2, 6 point 1 1 percent box. Arrow downward to 5 point zero zero percent.\nPulo gathers information about a callable bond and a putable bond issued by Corr, as shown in Exhibit 2.\nExhibit 2\n\tCallable Bond\tPutable Bond\nMaturity\t3 years\t3 years\nPar value\t$100\t$100\nCurrent price\t$102.91\t$104.58\nPrice when the benchmark yield curve shifts up by 50 bps\t$102.03\t$103.45\nPrice when the benchmark yield curve shifts down by 50 bps\t$103.41\t$105.96\nPulo calculates the effective convexity of the Corr putable bond. He also analyzes how an increase in interest rate volatility would affect the value of the callable and putable Corr bonds.\nFinally, Pulo analyzes convertible bonds issued by three competitors of Corr: Company X, Company Y, and Company Z. All three bonds have the same maturity and a conversion price of $10. The current stock prices for the three companies are $20 for Company X, $5 for Company Y, and $10 for Company Z. Pulo determines which company's convertible bonds would be most affected by changes in interest rates.", "Marcos Bonetti is an equity analyst reviewing the financial statements of Cela SpA, a publicly traded Italian company that reports under IFRS.\nBonetti notes that Cela invested €25 million in each of three bonds at the beginning of the most recent year. All three bonds were acquired at par and paid their annual coupons at the end of the most recent year. Bonetti compiles information about these bonds in Exhibit 1.\nExhibit 1\n\tBond 1\tBond 2\tBond 3\nClassification\tAmortized cost\tFair value through other comprehensive income\tFair value through profit and loss\nFair value at end of most recent year\t€24,990,000\t€25,600,000\t€24,700,000\nCoupon interest rate\t6.0%\t5.5%\t7.0%\nAt the beginning of the most recent year, Cela paid €140 million in cash for 35% of the common shares of Fragola SpA. At that time, the fair value of Fragola’s identifiable net assets was €360 million, which exceeded their book value by €20 million, attributable to property, plant, and equipment. Cela was unsuccessful in negotiating contractual clauses that would have given it control over Fragola. As a result, Cela is deemed to have significant influence but not control over Fragola. Bonetti considers whether Cela's financial ratios would have been impacted if the negotiations had been successful. Both Cela and Fragola are profitable.\nTo evaluate earnings quality, Bonetti computes several ratios based on Cela’s financial statements. He notices that Cela's days sales outstanding for the most recent year was 62 days, which is significantly outside the range of 102 to 120 days occurring over the prior five years. Given that Cela had no significant change in its sales and collection policies, Bonetti considers whether this could indicate a potential earnings quality issue.", "Alix Montana, an investment consultant, advises family offices and institutional clients on real estate investments.\nD’Amato Family\nThe D’Amato family plans to add real estate to their portfolio. They tell Montana that their requirements for the investment are high liquidity and the maximization of growth opportunities. To meet these requirements, Montana considers three investment vehicles: a public real estate operating company (REOC), an equity REIT, and a direct investment in an income-producing property.\nMontana determines the optimal allocations for stocks, bonds, and real estate for the D'Amato family. He considers three types of real estate indexes and wants to avoid using the index that may have an overstated Sharpe ratio.\nIndex 1: Appraisal-based index\nIndex 2: Repeat sales index\nIndex 3: Hedonic index\nSlade Investments\nThe management of Slade considers investing in a multi-family REIT. Montana values the REIT using the financial information (in $ millions) in Exhibit 1. Montana forecasts an annual net operating income (NOI) growth rate of 3% and uses a capitalization rate of 5%. The REIT has 20 million shares outstanding.\nExhibit 1\nNOI for the last 12 months\t80\nCash and equivalents\t12\nLand held for future development\t32\nTotal debt and other liabilities\t192\nSlade also considers investing in a retail REIT. Montana calculates the adjusted FFO (AFFO) for the REIT using the information (in $ millions) in Exhibit 2.\nExhibit 2\nNet income\t840\nLosses from sales of properties\t64\nDepreciation and amortization\t50\nNon-cash (straight-line) rent adjustment\t37\nRecurring capital expenditures\t69", "Alice Chan, CFA is a senior partner at a large investment bank which has adopted the CFA Institute Code of Ethics and Standards of Professional Conduct. Alex Berg is her supervisor.\nChan has been working with an internal data science team to develop a machine learning model to improve the bank's forecast of IPO prices. Chan needs to provide a formal recommendation of the model. In its last meeting with Chan, the data science team advised that adding several new variables to the model resulted in a statistically significant increase in forecast accuracy. However, Chan was not clear on how the new variables would improve the accuracy and considers whether to complete the following steps to finalize her recommendation:\nStep 1: Review the technical aspects and programming of the model;\nStep 2: Review the model factors and parameters to better understand its assumptions and limitations.\nChan receives a call from a client requesting a report on the telecommunications industry. Chan knows that she will not complete a full report because she plans to leave the bank to start her own private equity firm. Chan recalls another partner published a telecommunications industry report last month. However, that partner left the bank shortly after publication and is not available for any follow-up questions. Chan advises the client of the partner's report and forwards it, without changes, to the client.\nChan provides her resignation to Berg, effective in 10 business days. Chan expects to remain at the bank during the notice period to transition her client portfolios and to ensure that she leaves the bank on good terms. However, after reviewing the bank's standard policy for an employee's departure, Chan realizes that she must notify her clients and provide an alternative contact person. Accordingly, on the same day that she submits her resignation notice, Chan contacts all of her clients, informing them of her planned departure and providing Berg's contact information. If clients ask about her departure, Chan informs them she is starting her own firm. Immediately after contacting her clients, Chan updates her social media profile, which includes personal and professional contacts and information on the product offerings of her new firm.\nSeveral weeks later, at her new firm, Chan receives an email from a client who is upset about finding significant errors in a research report provided by one of Chan's new employees. The client mentions the errors to Chan and suggests that Chan did not sufficiently review the report before publication. Chan is surprised by these errors because she has established a compliance process to validate all research reports and findings. Specifically, Chan validated the referenced sources and believed the analysis to be sound when the employee sent the report. Chan calls the employee into her office to review the client's concern. The employee acknowledges the errors, one of which included entering a stock price increase, rather than a stock price decrease, in the model used. Chan updates the client and commits to reviewing the firm's compliance process.", "Emily Silva is an equity analyst working at a US-based investment consulting firm. She values the equity of four publicly traded firms, Firm A, Firm B, Firm C, and Firm D.\nSilva examines whether the equity of Firm A, a manufacturing company, is mispriced. She gathers the information (in $ millions) in Exhibit 1 based on the most recent year in order to calculate Firm A's FCFF. Firm A's tax rate is 30%.\nExhibit 1\nEBITDA\t200\nDepreciation expense\t20\nInterest expense\t30\nNet borrowing\t44\nInvestment in fixed capital\t27\nInvestment in working capital\t15\nSilva then estimates the intrinsic value of Firm A's equity based on a declining growth two-stage model. The market value of Firm A's debt is $450 million. Firm A's cost of equity is 12%, and its WACC is 10%. Exhibit 2 shows Silva's projections of Firm A's FCFF (in $ millions) for the next three years. Silva assumes that FCFF will grow at a constant annual rate of 3% after Year 3.\nExhibit 2\n\tYear 1\tYear 2\tYear 3\nProjected FCFF\t160\t180\t190\nNext, Silva evaluates Firm B for a corporate client interested in acquiring a controlling position in the firm. The client expects the acquisition to result in significant operating synergies. Firm B has a positive FCFE, most of which is paid out in dividends. Silva expects Firm B to continue to have an unstable capital structure because its use of debt changes from year to year. Silva identifies the most appropriate valuation approach for Firm B.\nAnother client asks Silva to evaluate a pairs trade that involves two publicly traded firms, Firm C and Firm D. Both firms operate in the copper mining industry. They are both profitable and close competitors. In addition to owning copper reserves, both firms manufacture electrical wires. The electrical wire segment comprises approximately one-third of each firm's revenues. For the pairs trade, Silva wants to evaluate which firm to buy and which firm to sell using an appropriate valuation approach.", "Antoinette Barilla is a credit advisor reviewing a client's corporate bond portfolio.\nThe portfolio holds an A-rated bond issued by Better Corp. The bond has a YTM of 3.0% and a credit spread of 110 bps. Barilla calculates the expected 1-year total return for the bond using the 1-year credit rating migration information in Exhibit 1.\nExhibit 1\nCredit Rating Migration\tTransition Probability\tExpected Price Change\nFrom A to A\t90%\t0.0%\nFrom A to BBB\t9%\t–2.0%\nFrom A to BB\t1%\t–3.0%\nBarilla considers adding another bond to the client's portfolio. She evaluates the credit term structure for Grocery, Inc. Grocery is offering a new bond issue to refinance short-term debt with longer-maturity debt. Barilla notes that the new issue has a tighter bid–offer spread and a higher credit rating than Grocery's previously issued bonds. Barilla expects the credit spread curve for Grocery bonds to steepen after the new issue.\nBarilla recommends the client enter into a bond–CDS basis trade on a corporate bond issued by Animal Supplies Company. The bond currently yields 5.0%. A comparable-maturity CDS contract has a credit spread of 290 bps. Barilla notes that the client can borrow at the 1.2% market reference rate. She calculates the profit of the basis trade if convergence were to occur between the bond and the CDS contract.\nFinally, Barilla reviews a combined position where the client owns $1 million of Bond D issued by Material Corporation, along with $1 million of CDS protection on Material where Bond D is the reference obligation. Material has issued three bonds, Bonds C, D, and E, that rank equally with respect to the priority of claims. Barilla estimates that, in the event of a default, Bond C would trade at 20% of par, Bond D at 30% of par, and Bond E at 40% of par. If a default occurs, the client will cash settle the CDS.", "Andrea Castillo is an investment consultant specializing in alternative investments. One of her clients is the Busilak family office. The Busilak family office considers allocating a portion of its portfolio to hedge funds. Castillo identifies three hedge funds as potential investments for Busilak, Fund X, Fund Y, and Fund Z.\nCastillo assesses the performance of each fund under a crisis scenario where the stock market index falls and stock market volatility rises. Castillo estimates a conditional factor risk model using monthly returns for the past 10 years. Exhibit 1 provides the factor beta estimates of the model. All coefficient estimates are statistically significant.\nExhibit 1\n\tFund X\tFund Y\tFund Z\nNormal Times Exposures\t\t\t\nIntercept\t0.00\t0.00\t0.00\nEquity risk factor (EQU)\t–0.19\t0.43\t–0.03\nVolatility risk factor (VOL)\t0.09\t0.16\t0.01\nCrisis Times Exposures (Incremental)\t\t\t\nDEQU\t0.09\t0.16\t–0.02\nDVOL\t0.27\t–0.18\t0.03\nDEQU is the product of the equity risk factor, EQU, and a dummy variable that equals 1 during crisis periods and 0 otherwise. DVOL is the product of the volatility risk factor, VOL, and the same dummy variable.\nThe family office decides to add hedge funds to the current portfolio to form a new portfolio. The family office's objective is to choose a new portfolio based on maximized risk-adjusted return with risk measured by downside deviation. Exhibit 2 provides the risk and return characteristics of three simulated combined portfolios, with each holding a 20% hedge fund allocation.\nExhibit 2\nPortfolio\tStandard Deviation\tSharpe Ratio\tSortino Ratio\nCurrent portfolio + Fund X\t7.50%\t0.32\t0.48\nCurrent portfolio + Fund Y\t8.80%\t0.43\t0.70\nCurrent portfolio + Fund Z\t7.62%\t0.45\t0.68\nAnother client of Castillo is Pearl University, whose endowment is currently invested in stocks and bonds. Pearl plans to gain long exposure to energy commodities and considers investing in futures contracts.\nCastillo analyzes a recent trade that involved a long position in crude oil futures. The fully collateralized position was held for six months and realized a price return of 6% and a roll return of 4%. The risk-free rate is 2% per year. Castillo computes the 6-month total return for this position.\nCastillo suggests that, instead of futures, Pearl could also use a total return swap based on any of the following broad-based major commodity indexes: the Rogers International Commodity Index (RICI), the Bloomberg Commodity Index (BCOM), or the S&P GSCI. Castillo determines the most appropriate reference index for the swap if the objective is to maximize exposure to energy commodities.", "Eto Partners is a multinational investment firm managing portfolios for institutions and high-net-worth individuals. Eto has adopted the Standards as part of its ethics and compliance policy. The firm's policy requires employees obtain pre-approval of personal trades in all securities held in Eto portfolios.\nAnnika Lyden manages Eto's Epic equity fund which focuses on the health care and life sciences sectors. Stefan Meier, an analyst that reports to Lyden, reviews Proctivi, a small-cap firm developing an experimental arthritis treatment. Proctivi is not currently held in any Eto portfolios. Meier believes the company has strong growth potential and recommends its purchase. After discussing the recommendation, Lyden and Meier conclude it is too risky for the Epic fund but will revisit the recommendation in 12 months. After the discussion, Lyden decides to purchase 5,000 shares of Proctivi for her personal account.\nEto's research department releases an updated economic forecast which projects a significant increase in market volatility over the next 12 months. One of Lyden's high-net-worth clients reviews the forecast and expresses concern about the corresponding impact on his portfolio. Lyden suggests the client use a structured product developed by Eto which has a return tied to changes in market volatility. Lyden provides the client with a report describing the basic characteristics and inputs of the product, how it is constructed, and the amount of leverage in the structure. She does not include specific details about the model used to develop the product or details of how inputs were determined. The report only provides the expected performance under an increase in market volatility because that is the client's primary concern.\nLyden asks Meier to participate in a presentation to a class of finance students at a nearby university. None of the students are clients of Eto. Meier shares his long-term forecast and Eto's investment recommendation for Balmtrex with the students. Balmtrex is a small-cap firm that has developed a successful cancer treatment. He states his belief that Balmtrex has substantial upside potential and that it is suitable for all investors with a long-term investment horizon. He tells the students, \"This is an awesome investment for people like yourselves.\" He does not discuss related risks.\nLyden is considering adding to the Epic fund's investment in InG Pharma. During a lunch meeting, a well-respected biotech industry analyst tells Lyden that InG Pharma has a promising anti-viral drug in a late-stage drug trial. He believes the drug will come to market in the next 24 months and will significantly increase the company's revenue. Following the conversation, Lyden purchases an additional 50,000 shares of InG for the Epic fund. Lyden shares the analyst's information with a colleague who manages another fund for Eto.", "Jennifer Lee is analyzing the performance of Belle, a global consumer products company. Belle is located in the eurozone and uses the EUR as its functional and presentation currency. Belle reports under IFRS and has a 31 December year end.\nBelle operates predominantly in the UK. Lee gathers the information about EUR/GBP exchange rates (amount of EUR per 1 GBP) in Exhibit 1.\nExhibit 1\n\tEUR/GBP Exchange Rate\n16 November, most recent year\t1.186\n31 December, most recent year\t1.176\n18 January, current year\t1.193\nLee notes that Belle purchased inventory for GBP 500,000 from an unaffiliated UK company on 16 November of the most recent year. The transaction was settled on 18 January of the current year.\nA UK-based subsidiary of Belle uses the GBP as its functional currency. Lee gathers the information about the subsidiary's net sales growth in Exhibit 2.\nExhibit 2\n\tMost Recent Year\tTwo Years Ago\nVolume growth\t5%\t3%\nPrice growth\t2%\t1%\nForeign currency effect\t3%\t–1%\nNet sales growth\t10%\t3%\nBelle uses the current rate method to translate its subsidiaries' financial statements. In contrast, Belle's primary competitor uses the temporal method to translate its subsidiaries' financial statements. Lee considers how each company should report its cumulative translation adjustment under the method used.\nLindo is Belle's wholly owned subsidiary in Country F, a hyperinflationary economy that uses the currency FCX. Lindo purchased land for FCX 61,390,000 on 1 January two years ago. The EUR/FCX exchange rates (amount of EUR per 1 FCX) and Country F's inflation rates are shown in Exhibit 3.\nExhibit 3\nExchange rate on 1 January two years ago\t0.0149 EUR/FCX\nExchange rate on 31 December of the most recent year\t0.0086 EUR/FCX\nInflation rate for two years ago\t38%\nInflation rate for the most recent year\t51%", "Edel Asset Management is a long-short manager and manages portfolios primarily for endowment clients utilizing equities and listed options. Chief Investment Officer, Thomas Edel, is discussing the market environment with one of his portfolio managers, Anton Uder.\nEdel explains to Uder: “I think it is important for us to be aware of the potential effects of unusual option trading volumes on markets as different types of risk become evident. Recently, discussion on a popular social media site promoted heavy purchases of short-term far out-of-the money call options on the stock of New Optics Technology (New Optics), a chain of eyeglass stores. New Optics is currently in financial difficulty, which has made it a favorite of short-sellers and it has a short interest of 85 million shares, which is over twenty times as large as its average daily volume. Call options volume was greatest in the calls with two weeks remaining to expiration with 1.46 million call options at a strike price of 90 being purchased by speculators. Each call option is a right to buy 100 shares of stock. Unlike in equities markets where there is a seller for every buyer, option contracts can be created by options dealers selling directly to speculators. They are able to do so by simultaneously delta hedging their own positions. The prices of the stock and option prices for New Optics Technology during the two weeks are shown in Exhibit 1.”\nExhibit 1\nInformation\tUSD Price\nStock price 2 weeks before expiry\t47\n90 Call price 2 weeks before expiry\t0.15\n90 Put price 2 weeks before expiry\t42.97\nDeltac 2 weeks before expiry\t0.057\nDeltap 2 weeks before expiry\t0.989\nStock price 1 week before expiry\t90\nStock price at expiry\t140\nUder comments: I have determined that the volatility of the New Optics stock price in the 3 months prior to the options expiry was 23%, which would have been important information for options dealers two weeks before expiry, as it provided information regarding the perceived uncertainty going forward. The BSM options pricing model could have also been used to obtain information regarding future volatility.\"\nEdel explains: \"Option prices are also sensitive to a variety of factors derived from option valuation models. These factors are also referred to as the \"Greeks\", otherwise known as delta, gamma, theta, vega and rho, which are risk measures representing an option price's sensitivity to a particular factor. The same measure can simultaneously represent different types of risks to different market participants, such as options dealers and speculators.\"", "Imane Kabbaj is the CIO of the Dynamo Fund, which is actively managed and invests in equities and bonds.\nKabbaj reviews the performance of the Dynamo Fund for the past year and focuses on the decomposition of the value added from asset allocation and security selection. Exhibit 1 reflects the return generated by the fund in each asset class compared to the relevant benchmark.\nExhibit 1\nAsset Class\tFund Return\tFund Allocation\tBenchmark Return\tStrategic Asset Allocation\nEquities\t–16%\t50%\t–20%\t60%\nBonds\t–12%\t50%\t–10%\t40%\nKabbaj's goal for the fund's equity exposure is to maximize the Sharpe ratio by optimizing the allocation to active equity risk. She intends to invest in a combination of an active stock selection strategy and its benchmark, a global equity index. Based on the information in Exhibit 2, Kabbaj calculates the weight that should be allocated to the global equity index benchmark portfolio to achieve her goal.\nExhibit 2\n\tActive Stock Selection Strategy\tGlobal Equity Index\nStandard deviation of returns\t23%\t15%\nSharpe ratio\t0.47\t0.53\nActive risk\t9%\t---\nInformation ratio\t0.27\t---\nNext, Kabbaj analyzes the information in Exhibit 3, which shows the yields on corporate bonds, conventional government bonds, and inflation-linked government bonds issued in Country A with the same maturity, along with inflation expectations. She analyzes the bond risk premium to determine the market's confidence in inflation expectations being realized through the business cycle.\nExhibit 3\nCorporate bond yield\t6.28%\nConventional government bond yield\t5.66%\nInflation-linked government bond yield\t2.32%\nSurvey-based inflation expectation\t2.80%\nKabbaj notes that P/E ratios for equities in Country A have recently increased to historically high levels. She observes that real interest rates, the equity risk premium, and real earnings growth expectations have also increased.", "Ulysses Emery is an analyst working on a research report on Zeta Incorporated, a manufacturing firm. The country in which Zeta operates has a flat income tax rate for corporations and a progressive income tax rate for individuals.\nEmery reviews recent EPS and dividend per share (DPS) information for Zeta, presented in Exhibit 1. Zeta follows a target payout adjustment model for dividend payouts with a target payout ratio of 60%. Emery calculates the current year's expected DPS, assuming Zeta moves toward the target payout ratio over four years. Emery forecasts EPS of $2.44 for the current year.\nExhibit 1\n\tMost Recent Year\tTwo Years Ago\tThree Years Ago\tFour Years Ago\nEPS\t$2.13\t$1.33\t$2.41\t$2.24\nDPS\t$1.21\t$1.17\t$1.17\t$1.00\nPayout ratio\t56.8%\t88.0%\t48.5%\t44.6%\nThe following week, Zeta announces its quarterly EPS, which matches market expectations, while its announced dividend is lower than what Emery and the market expected. Zeta's management justifies the announced dividend by stating that the firm faces near-term economic uncertainty in its major markets and needs to maintain its financial flexibility. Emery notes that Zeta's stock price rises after the dividend announcement.\nEmery considers a scenario in which Zeta pays a 10% stock dividend and evaluates its impact on Zeta's financial statements.\nEmery also covers Etaphi Company. He calculates Etaphi's FCFE coverage ratio using the financial information (in $ millions) in Exhibit 2.\nExhibit 2\nNet interest paid\t6\nDividends paid\t76\nShare issuance proceeds\t12\nFCFE\t89", "Amine Ling manages a multi-asset portfolio that invests in the stocks and bonds of Country A and Country B.\nCountry A\nCountry A is a developing economy and its population growth rate will continue to be higher than that in developed economies. Country A's long-term goal is to accelerate economic growth so that its level of per capita income will eventually match that of developed economies. Country A intends to implement trade policies and develop legal, political, and economic institutions of developed countries to support this goal.\nCountry B\nLing researches Country B's labor market. She expects that in the next decade, Country B will experience the following changes:\nChange 1:\tThe unemployment rate will decline.\nChange 2:\tThe female labor force participation rate will rise.\nChange 3:\tA greater proportion of the workforce will receive on-the-job training.\nLing estimates the potential GDP growth rate of Country B based on the labor productivity growth accounting equation and using her forecast of long-term growth rates in Exhibit 1.\nExhibit 1\nGrowth rate of labor force\t–1.7%\nGrowth in total hours worked\t–1.6%\nGrowth rate of labor productivity\t2.4%\nGrowth rate of total factor productivity\t0.8%\nLing intends to trade government bonds issued by Country A and Country B. Ling's outlook is that Country A's actual GDP growth rate will stay above the potential GDP growth rate and that Country B will experience much lower inflation than the current market forecast.", "Joel Dlamini, a private equity fund manager, is evaluating several potential investment opportunities for his portfolio.\nRomala Enterprises\nDlamini believes that the valuation of small, privately owned Romala Enterprises requires several adjustments to estimate the firm's earnings potential. He uses the following information to estimate Romala's normalized EBIT:\nRomala's reported EBIT is $5 million.\nRomala's CEO is not paid a salary; however, she receives an annual $800,000 dividend as compensation. The annual salary of a replacement CEO is estimated to be $600,000.\nRomala's optimal level of debt is $5.5 million more than its current amount of outstanding debt. The firm's pretax cost of debt is 10%.\nRomala's effective tax rate is 18%.\nDlamini then uses the information in Exhibit 1 and the expanded CAPM to calculate Romala's required return on equity. For this calculation, he concludes that an industry risk premium is not relevant for Romala.\nExhibit 1\nEstimated beta\t1.5\nRisk-free rate\t3.5%\nEquity risk premium\t5.0%\nSmall stock risk premium\t2.0%\nCompany-specific risk premium\t1.0%\nDlamini plans to acquire a non-controlling minority interest in Romala. He determines Romala has an unadjusted equity value of $900 million. He estimates the discount for lack of marketability to be 15% and the control premium to be 10%. Dlamini calculates the current equity value of Romala by making adjustments for lack of control and lack of marketability.\nRhode Industries\nDlamini values Rhode Industries, a privately held company. He calculates Rhode's EV using the FCFF valuation approach and the information in Exhibit 2.\nExhibit 2\nBase-year FCFF (Year 0)\t$1.2 million\nTerminal value at the end of Year 2\t$15.4 million\nWACC\t12.0%\nRequired return on equit

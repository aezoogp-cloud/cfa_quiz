rice, a convertible bond exhibits mostly stock risk–return characteristics thus the price of the convertible bond is significantly affected by share price movements but mostly unaffected by factors driving the value of an otherwise identical option-free bond, such as interest rate movements.\nB. Company Y — Correct\nCorrect because Company Y's stock price of $5 is much lower than the bond conversion price of $10. Therefore, the Company Y bond is a busted convertible that will exhibit the characteristics of a straight bond.\nWhen the underlying share price is well below the conversion price, the convertible bond is described as 'busted convertible' and exhibits mostly bond risk–return characteristics. Consequently, the price movement of the convertible bond closely follows that of the straight bond, and such factors as interest rate movements and credit spreads significantly affect the convertible bond price.\nC. Company Z — Incorrect\nIncorrect because Company Z's stock price of $10 is equal to the bond conversion price of $10. Therefore, the Company Z bond exhibits hybrid characteristics of Company Z common stock and a straight bond and will be relatively less affected by interest rate movements than the Company Y convertible bond.\nIn between the bond and the stock extremes, the call option component increases in value as the underlying share price approaches the conversion price. The return on the convertible bond during such periods increases significantly but at a lower rate than the increase in the underlying share price.", "ko": "Company Y는 주가 $5가 전환가격 $10보다 훨씬 낮은 busted convertible이다. 일반 채권처럼 움직이므로 금리 변화의 영향을 가장 많이 받는다.", "trap": "주가가 전환가격보다 훨씬 높으면 주식처럼, 비슷하면 혼합형.", "f": "", "why": {"A": "주가 $20 > 전환가 $10이라 주식처럼 움직인다.", "C": "주가 = 전환가라 채권·주식 혼합 특성을 보인다."}, "orig": "Mock 3 Session 1 Q36", "conf": true}, {"id": "mock3-Q37", "src": "정답", "module": "FSA", "tag": "채권 분류별 세전이익 기여", "vig": 9, "stem": "Which bond had the largest contribution to Cela's pre-tax income in the most recent year?", "opts": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}, "ans": "A", "en": "A. Bond 1 — Correct\nCorrect because Bond 1 is the bond with the highest contribution to Cela’s pre-tax income.\nBond 1 is accounted for at amortized cost, which means its contribution to Cela’s pre-tax income is limited to the interest income resulting from the coupon payment:\nInterest income = Coupon rate × Par value\n= 6.0% × €25,000,000 = €1,500,000\nBond 2 is accounted for at fair value through other comprehensive income, which means its contribution to Cela’s pre-tax income is also limited to the interest income resulting from the coupon payment (the fair value change is recognized in other comprehensive income on the balance sheet, not in profit and loss):\nInterest income = Coupon rate × Par value\n= 5.5% × €25,000,000 = €1,375,000\nFinally, Bond 3 is accounted for at fair value through profit and loss, which means its contribution to Cela’s pre-tax income includes both the interest income resulting from the coupon payment and the fair value change:\nInterest income = Coupon rate × Par value\n= 7.0% × €25,000,000 = €1,750,000\nFair value change = Fair value at end of most recent year – Fair value at acquisition\n= €24,700,000 – €25,000,000 = –€300,000\nBond 3’s total contribution to Cela’s pre-tax income is €1,450,000 (calculated as €1,750,000 – €300,000).\nTherefore, Bond 1 is the bond that contributes the most to Cela’s pre-tax income.\nB. Bond 2 — Incorrect\nIncorrect because, although Bond 2 has the highest fair value, its contribution to Cela’s pre-tax income is not the highest. Bond 2’s contribution to Cela’s pre-tax income is €1,375,000, whereas Bond 1’s contribution to Cela’s pre-tax income is €1,500,000.\nC. Bond 3 — Incorrect\nIncorrect because, although Bond 3 has the highest coupon interest rate, its contribution to Cela’s pre-tax income is not the highest. Bond 3’s contribution to Cela’s pre-tax income is €1,450,000, whereas Bond 1’s contribution to Cela’s pre-tax income is €1,500,000.", "ko": "Bond 1(상각원가): 이자수익만 6.0% × €25m = €1.50m. Bond 2(FVOCI): 이자 5.5% × €25m = €1.375m만 손익, 공정가치 변동은 OCI. Bond 3(FVPL): 이자 7.0% × €25m = €1.75m + 공정가치 변동(24.7 − 25.0 = −€0.30m) = €1.45m. 그래서 Bond 1이 가장 크다.", "trap": "FVOCI의 평가이익은 손익이 아니라 OCI. FVPL은 평가손실이 손익에 반영.", "f": "", "why": {"B": "공정가치는 가장 높지만 평가이익이 OCI로 가서 손익 기여는 이자 €1.375m뿐.", "C": "쿠폰은 가장 높지만 FVPL 평가손실 €0.3m이 반영돼 €1.45m."}, "orig": "Mock 3 Session 1 Q37", "conf": true}, {"id": "mock3-Q38", "src": "오답", "module": "FSA", "tag": "관계기업 영업권 (35%)", "vig": 9, "stem": "The amount (in € millions) of goodwill resulting from Cela’s investment in Fragola is:", "opts": {"A": "14.", "B": "21.", "C": "40."}, "ans": "A", "en": "A. 14. — Correct\nCorrect because the goodwill resulting from Cela’s investment in Fragola is computed as follows:\n\tPurchase price\t€140.0 million\nminus\tBook value acquired (35% × (€360 million – €20 million))\t(€119.0 million)\n\tExcess purchase price\t€21.0 million\nminus\tAttributable to PP&E (35% × €20 million)\t(€7.0 million)\n\tGoodwill\t€14.0 million\nB. 21. — Incorrect\nIncorrect because this answer corresponds to the excess purchase price, failing to deduct the portion of the excess purchase price that is attributable to PP&E:\n\tPurchase price\t€140.0 million\nminus\tBook value acquired (35% × (€360 million – €20 million))\t(€119.0 million)\n\tExcess purchase price\t€21.0 million\nC. 40. — Incorrect\nIncorrect because this answer considers full goodwill instead of the partial goodwill corresponding to the 35% interest acquired:\n\tPurchase price\t€140.0 million\nminus\tBook value acquired (35% × (€360 million – €20 million))\t(€119.0 million)\n\tExcess purchase price\t€21.0 million\nminus\tAttributable to PP&E (35% × €20 million)\t(€7.0 million)\n\tGoodwill\t€14.0 million\n\t% acquired\t35%\n\tFull goodwill\t€40.0 million", "ko": "취득가 €140m − 취득 장부가 35% × (€360m − €20m) = €119m → 초과액 €21m. 그중 PP&E 공정가치 초과분 35% × €20m = €7m을 빼면 영업권 €14m.", "trap": "초과액(€21m)에서 PP&E 배분분을 빼야 한다. 전부영업권(100%)이 아니라 35% 기준.", "f": "Goodwill = 취득가 − 지분율 × 순자산 공정가치", "why": {"B": "초과 취득가에서 PP&E 배분분을 빼지 않음.", "C": "35% 지분 대신 100% 기준 전부영업권으로 계산."}, "orig": "Mock 3 Session 1 Q38", "conf": true, "my": "B"}, {"id": "mock3-Q39", "src": "정답", "module": "FSA", "tag": "지분법 vs 연결: ROA", "vig": 9, "stem": "If Cela had been successful in negotiating the contractual clauses, its return on assets for the most recent year would have been:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "A", "en": "A. lower. — Correct\nCorrect because, if Cela had been successful in gaining control over Fragola, it would have had to consolidate Fragola’s financial statements.\nIn the most recent year, Cela reported its investment in Fragola using the equity method, as required by IFRS when a company has significant influence but not control. The equity method is often referred to as 'one-line consolidation' because the investor’s proportionate ownership interest in the assets and liabilities of the investee is disclosed as a single line item (net assets) on its balance sheet, and the investor's share of the revenues and expenses of the investee is disclosed as a single line item on its income statement. Therefore, the equity method requires that Cela report the acquisition cost of 35% of Fragola in one line on Cela's balance sheet and 35% of Fragola's net income in one line on Cela's income statement.\nOn the other hand, if Cela had consolidated Fragola’s financial statements in the most recent year, Fragola's individual assets and liabilities would have been reported line by line on Cela's balance sheet, and the components of Fragola's net income would have been reported line by line on Cela's income statement. As a result, Cela would have reported higher total assets than under the equity method, but the same net income as under the equity method.\nTherefore, if Cela had been successful in negotiating the contractual clauses related to control, its return on assets for the most recent year would have been lower—the same numerator (net income) but a higher denominator (total assets).\nB. the same. — Incorrect\nIncorrect because, although Cela’s net income would have been the same under both the equity method and consolidation, Cela’s total assets would have been higher under consolidation than under the equity method, resulting in a lower return on assets.\nC. higher. — Incorrect\nIncorrect because, if Cela had been successful in gaining control, it would have had to consolidate Fragola, resulting in higher total assets but the same net income. Therefore, the return on assets would have been lower rather than higher.", "ko": "지배권을 얻었다면 Fragola를 연결해야 한다. 순이익은 지분법과 같지만 Fragola의 자산 전체가 들어와 총자산이 커진다. 그래서 ROA는 낮아진다.", "trap": "연결과 지분법은 순이익이 같다(비지배지분 차감 후). 차이는 총자산.", "f": "ROA = 순이익/총자산", "why": {"B": "순이익은 같지만 총자산이 늘어 ROA가 달라진다.", "C": "총자산이 커지므로 ROA는 낮아진다."}, "orig": "Mock 3 Session 1 Q39", "conf": false}, {"id": "mock3-Q40", "src": "정답", "module": "FSA", "tag": "DSO 급감 → 매출채권 매각", "vig": 9, "stem": "Which of the following best explains the difference between Cela's most recent days sales outstanding compared to the range over the prior five years?", "opts": {"A": "Channel stuffing", "B": "Bill-and-hold sales", "C": "A sale of receivables"}, "ans": "C", "en": "A. Channel stuffing — Incorrect\nIncorrect because channel stuffing entails inducing customers to order more goods than they would normally through offers of discounts and other incentives. Often, the customers also have return rights on their purchases. If Cela had engaged in channel stuffing, both receivables and revenues would have increased by the same amount (and by more than normal) near the end of the most recent year. Since the quotient (receivables/revenue) that composes days sales outstanding is lower than one, days sales outstanding would have increased, not decreased.\nB. Bill-and-hold sales — Incorrect\nIncorrect because, in bill-and-hold sales, revenue is recognized when the invoice is issued while the goods remain on the premises of the seller. If Cela had engaged in bill-and-hold sales in the most recent year, both receivables and revenues would have increased by the same amount as a result of those transactions. Since the quotient (receivables/revenue) that composes days sales outstanding is lower than one, days sales outstanding would have increased, not decreased.\nC. A sale of receivables — Correct\nCorrect because days sales outstanding (which is calculated as accounts receivable times 365, divided by revenues) shows a significant decrease in the most recent year, outside the range of the prior five years, even though there was no significant change in Cela's sales and collection policies. The decrease in days sales outstanding indicates that receivables are a lower proportion of sales in the most recent year than in the past five years. This could be an indication that Cela sold receivables to third parties in the most recent year, as this practice decreases the receivables balance while keeping the amount of sales unchanged.\nA company may focus on accounts receivable because it wants to hide liquidity or revenue collection issues. Choices include removing the accounts receivable from the balance sheet by selling them externally.", "ko": "판매·회수 정책 변화가 없는데 DSO가 과거 5년 범위보다 크게 줄었다. 매출은 그대로이고 매출채권만 줄어든 것이므로 매출채권을 제3자에게 판 것으로 볼 수 있다.", "trap": "밀어내기·bill-and-hold는 매출채권을 늘려 DSO를 올린다.", "f": "DSO = 매출채권 × 365 / 매출", "why": {"A": "채널 스터핑은 매출채권이 늘어 DSO가 올라간다.", "B": "bill-and-hold도 송장 발행으로 매출채권이 늘어 DSO가 올라간다."}, "orig": "Mock 3 Session 1 Q40", "conf": false}, {"id": "mock3-Q41", "src": "정답", "module": "AI", "tag": "부동산 투자 수단: REOC", "vig": 10, "stem": "Based on the D'Amato family's requirements, which of the following real estate investment vehicles is the most suitable to add to their portfolio?", "opts": {"A": "REOC", "B": "Equity REIT", "C": "Direct investment in an income-producing property"}, "ans": "A", "en": "A. REOC — Correct\nCorrect because a REOC is the only vehicle type that meets both requirements: high liquidity and maximization of growth opportunities. With a liquidity objective, REOC and REIT investments are most appropriate because REOCs and REITs are traded on stock exchanges and are more liquid. Direct investments in income-producing property are generally less liquid. With a maximum growth opportunities objective, REOCs and direct property investment are most appropriate because REOCs and direct investors are free to invest in any kind of real estate or related activity without limitation and to reinvest as much of their income as they believe is appropriate for their objectives. This freedom gives them the opportunity to create more value in development activity and in trading real estate. REITs’ constraints prevent them from retaining earnings to reinvest, so their growth opportunities are more limited.\nSince both the primary criteria are best met by REOCs, they are the most suitable investment type.\nB. Equity REIT — Incorrect\nIncorrect because with a maximum growth opportunities objective, REOCs and direct property investment are most appropriate because REOCs and direct investors are free to invest in any kind of real estate or related activity without limitation and to reinvest as much of their income as they believe is appropriate for their objectives. This freedom gives them the opportunity to create more value in development activity and in trading real estate. REITs’ constraints prevent them from retaining earnings to reinvest, so their growth opportunities are more limited.\nC. Direct investment in an income-producing property — Incorrect\nIncorrect because with a liquidity objective, REOC and REIT investments are most appropriate because REOCs and REITs are traded on stock exchanges and are more liquid. Direct investments in income-producing property are generally less liquid.", "ko": "D’Amato 가족은 높은 유동성과 최대 성장 기회를 원한다. 유동성 → 상장된 REOC·REIT. 성장 기회(이익 재투자 제한 없음) → REOC·직접투자. 둘 다 만족하는 것은 REOC.", "trap": "REIT는 배당 의무 때문에 재투자가 제한돼 성장 기회가 작다.", "f": "", "why": {"B": "REIT는 이익 대부분을 배당해야 해 성장 기회 극대화에 맞지 않는다.", "C": "직접투자는 유동성이 낮다."}, "orig": "Mock 3 Session 1 Q41", "conf": true}, {"id": "mock3-Q42", "src": "정답", "module": "AI", "tag": "감정평가 지수 → Sharpe 과대", "vig": 10, "stem": "Which index considered by Montana is most likely to have an overstated Sharpe ratio?", "opts": {"A": "Index 1", "B": "Index 2", "C": "Index 3"}, "ans": "A", "en": "A. Index 1 — Correct\nCorrect because appraisal-based indexes tend to suffer from appraisal lag resulting in a smoothing of returns and therefore less volatility than transaction-based indexes. Appraisal lag tends to smooth the index, meaning that it has less volatility. Thus, appraisal-based indexes may underestimate the volatility of real estate returns. Because of the lag in appraisal-based real estate indexes, they will also tend to have a lower correlation with other asset classes. The smoothing effect will also overstate Sharpe ratios, which is problematic if the index is used in asset allocation models to determine how much of a portfolio should be allocated to real estate versus other asset classes. The appropriate allocation to and benefits from private real estate would likely be overestimated.\nB. Index 2 — Incorrect\nIncorrect because a repeat sales index is a transaction-based index. Transaction-based indexes tend to lead appraisal-based indexes for the reasons discussed, but they can be noisy (that is, they include random elements in the observations) because of the need to use statistical techniques to estimate the index. So, there may be upward or downward movements from quarter to quarter that are somewhat random. Since this index is more volatile than an appraisal based index but exhibits the same return, the Sharpe ratio is not expected to be overstated.\nC. Index 3 — Incorrect\nIncorrect because a hedonic index is a transaction-based index which does not require repeat sales of the same property, it requires only one sale. Transaction-based indexes tend to lead appraisal-based indexes for the reasons discussed, but they can be noisy (that is, they include random elements in the observations) because of the need to use statistical techniques to estimate the index. So, there may be upward or downward movements from quarter to quarter that are somewhat random. Because this index is more volatile than an appraisal-based index but exhibits the same return, the Sharpe ratio is not expected to be overstated.", "ko": "감정평가 기반 지수(Index 1)는 평가 시차로 수익률이 평활화돼 변동성이 작게 나온다. 그래서 Sharpe 비율이 과대평가된다.", "trap": "repeat sales·hedonic 지수는 거래 기반이라 평활화 문제가 덜하다.", "f": "", "why": {"B": "repeat sales 지수는 거래 기반 지수다.", "C": "hedonic 지수도 거래 기반 지수다."}, "orig": "Mock 3 Session 1 Q42", "conf": true}, {"id": "mock3-Q43", "src": "오답", "module": "AI", "tag": "REIT NAVPS", "vig": 10, "stem": "The NAV per share for the multi-family REIT is closest to:", "opts": {"A": "$72.80.", "B": "$75.00.", "C": "$84.60."}, "ans": "B", "en": "A. $72.80. — Incorrect\nIncorrect because cash and equivalents and land held for future development are not added to the estimated value of operating real estate to arrive at the gross asset value. The incorrectly calculated NAVPS is $72.80\nNet operating income (NOI) for last 12 months\t80.0\nA: Estimated next 12 months NOI = NOI × (1 + growth rate of 3%)\t82.4\nB: Estimated value of operating real estate = A / Cap rate of 5%\t1,648.0\nC: Estimate gross asset value = B\t1,648.0\nLess: Total debt and other liabilities\t192.0\nD: Net asset value = C – Total debt and liabilities\t1,456.0\nShares outstanding\t20.0\nE: NAVPS = D / shares outstanding\t72.80\nIf the calculation is based on NOI of last 12 months with no other errors, the answer is $72.60, which is also closest to this answer.\nB. $75.00. — Correct\nCorrect because NAVPS is $75.00\nNet operating income (NOI) for last 12 months\t80.0\nA: Estimated next 12 months NOI = NOI × (1 + growth rate of 3%)\t82.4\nB: Estimated value of operating real estate = A / Cap rate of 5%\t1,648.0\nC: Estimate gross asset value = B\t1,648.0\nLess: Total debt and other liabilities\t192.0\nD: Net asset value = C – Total debt and liabilities\t1,456.0\nShares outstanding\t20.0\nE: NAVPS = D / shares outstanding\t72.80\nC. $84.60. — Incorrect\nIncorrect because the value of total debt and other liabilities are not subtracted from the gross asset value to arrive at the net asset value. The incorrectly calculated NAVPS is $84.60\nNet operating income (NOI) for last 12 months\t80.0\nA: Estimated next 12 months NOI = NOI × (1 + growth rate of 3%)\t82.4\nB: Estimated value of operating real estate = A / Cap rate of 5%\t1,648.0\nAdd: Cash and equivalents\t12.0\nAdd: Land held for future development\t32.0\nC: Estimate gross asset value = B + Short-term assets + Land\t1,692.0\nD: Net asset value = C\t1,692.0\nShares outstanding\t20.0\nE: NAVPS = D / shares outstanding\t84.60", "ko": "다음 12개월 NOI = 80 × 1.03 = 82.4. 운영 부동산 가치 = 82.4/0.05 = 1,648. 총자산가치 = 1,648 + 현금 12 + 개발용 토지 32 = 1,692. NAV = 1,692 − 부채 192 = 1,500. ÷ 20m주 = $75.00.", "trap": "현금과 개발용 토지를 더하는 것을 빠뜨리면 $72.80.", "f": "NAV = NOI1/cap rate + 현금 + 토지 − 부채", "why": {"A": "현금·개발용 토지를 총자산가치에 더하지 않음.", "C": "부채를 빼지 않음."}, "orig": "Mock 3 Session 1 Q43", "conf": true, "my": "A"}, {"id": "mock3-Q44", "src": "정답", "module": "AI", "tag": "AFFO", "vig": 10, "stem": "The AFFO (in $ millions) for the retail REIT is:", "opts": {"A": "720.", "B": "848.", "C": "954."}, "ans": "B", "en": "A. 720. — Incorrect\nIncorrect because the losses from sales of properties are deducted instead of being added to the net income.\nNet Income\t840\nLESS: Losses from sale of properties\t64\nADD: Depreciation and amortization\t50\nFFO\t826\nLESS: Non-cash rent\t37\nLESS: Recurring capex\t69\nAFFO\t720\nB. 848. — Correct\nCorrect because AFFO is calculated as below:\nAFFO = (FFO - non-cash rent - recurring capex) and\nFFO = net income plus losses from sales of properties plus depreciation and amortization related to real estate, plus real estate impairments and write-downs unrelated to depreciation (none in the exhibit).\nNet Income\t840\nADD: Losses from sale of properties\t64\nADD: Depreciation and amortization\t50\nFFO\t954\nLESS: Non-cash rent\t37\nLESS: Recurring capex\t69\nAFFO\t848\nC. 954. — Incorrect\nIncorrect because instead of the AFFO, this calculation calculates the FFO.\nNet Income\t840\nADD: Losses from sale of properties\t64\nADD: Depreciation and amortization\t50\nFFO\t954", "ko": "FFO = 순이익 840 + 처분손실 64 + 감가상각 50 = 954. AFFO = FFO − 비현금 임대료 37 − 경상 자본지출 69 = 848.", "trap": "처분손실은 더한다(빼면 720). 954는 FFO.", "f": "AFFO = FFO − non-cash rent − recurring capex", "why": {"A": "처분손실을 더하지 않고 뺌.", "C": "AFFO가 아니라 FFO."}, "orig": "Mock 3 Session 1 Q44", "conf": false}, {"id": "mock3-Q45", "src": "오답", "module": "ETH", "tag": "V(A) 모형 이해 범위", "vig": 11, "stem": "With regard to the machine learning model, to be in compliance with the Standards, Chan must complete:", "opts": {"A": "Step 1 only.", "B": "Step 2 only.", "C": "both Step 1 and Step 2."}, "ans": "B", "en": "A. Step 1 only. — Incorrect\nIncorrect because Step 1, to review the technical aspects and programming of the model, is beyond the requirements of the Standard. Members and candidates are not required to become experts in the technical aspect of the models.\nB. Step 2 only. — Correct\nCorrect because Step 2, to review the model factors and parameters to understand its assumptions and limitations is in-line with the Standards. Members and candidates must understand the assumptions and limitations inherent in any model and how the results were used in the decision-making process. Chan is required to understand the relationship between the input parameters and the forecasted accuracy result but is not required to do a complete technical model review.\nC. both Step 1 and Step 2. — Incorrect\nIncorrect because Chan is not required to complete Step 1 to be in compliance with the Standards. Members and candidates are not required to become experts in every technical aspect of the models. Only Step 2 is required to be compliant with the Standards.", "ko": "Chan은 머신러닝 모형의 프로그래밍·기술 세부(Step 1)까지 검토할 필요는 없다. 다만 모형의 입력 요소·가정·한계(Step 2)는 이해해야 V(A) 성실·합리적 근거를 지킨다. 그래서 Step 2만 하면 된다.", "trap": "기술 전문가가 될 필요는 없다. 가정과 한계를 이해하는 것이 요구사항.", "f": "", "why": {"A": "기술·프로그래밍 검토는 기준이 요구하는 범위를 넘는다. 오히려 Step 2가 필요.", "C": "Step 1은 요구되지 않는다."}, "orig": "Mock 3 Session 2 Q1", "conf": true, "my": "A"}, {"id": "mock3-Q46", "src": "정답", "module": "ETH", "tag": "I(C) 전 직원 보고서 사용", "vig": 11, "stem": "Did Chan violate the Standards by sending the previously prepared telecommunications industry report to the client?", "opts": {"A": "No", "B": "Yes, because the author of the report no longer works at the bank", "C": "Yes, because she knowingly provided work completed by another analyst"}, "ans": "A", "en": "A. No — Correct\nCorrect because Chan did not misrepresent the completed report as her own work, the firm continues to own the rights to completed work by analysts no longer with the firm, and she advised the client of the original source.\nB. Yes, because the author of the report no longer works at the bank — Incorrect\nIncorrect because research and models developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member or candidate has left the organization.\nC. Yes, because she knowingly provided work completed by another analyst — Incorrect\nIncorrect because Chan advises the client of the pre-existing report and shares the report without making any changes or any representations that Chan completed the work herself.", "ko": "재직 중 만든 보고서는 회사 소유라, 작성자가 퇴사해도 회사가 계속 쓸 수 있다. Chan은 기존 보고서임을 고객에게 알리고 고치지 않은 채 자기 것처럼 꾸미지 않았으므로 위반이 아니다.", "trap": "자기 작업인 척하지 않고 출처를 밝히면 회사 소유 자료 사용은 괜찮다.", "f": "", "why": {"B": "작성자가 떠나도 회사가 보고서 권리를 가진다.", "C": "출처를 알리고 그대로 전달했으므로 표절이 아니다."}, "orig": "Mock 3 Session 2 Q2", "conf": false}, {"id": "mock3-Q47", "src": "정답", "module": "ETH", "tag": "IV(A) 퇴사 예고 기간 SNS 갱신", "vig": 11, "stem": "With regard to informing her clients of her planned departure and updating her social media profile, did Chan violate the Standards?", "opts": {"A": "No", "B": "Yes, because of the timing of her updating her social media accounts", "C": "Yes, because of the timing of when she informed clients that she was starting her own firm"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because publicly updating her social media to include references to the new firm and product offering would be detrimental and potentially cause harm to her current employer and is a violation of the Standards.\nB. Yes, because of the timing of her updating her social media accounts — Correct\nCorrect because while in her notice period, Chan still has a duty of loyalty to her employer. Publicly updating her social media to include references to the new firm and product offering while still employed at the bank would be detrimental and potentially cause harm to her current employer by causing confusion amongst her clients and promoting her firm ahead of her employer.\nC. Yes, because of the timing of when she informed clients that she was starting her own firm — Incorrect\nIncorrect because Chan followed her employer's policies and procedures by notifying clients immediately, so there was no violation. Once notice is provided to the employer of the intent to resign, the member or candidate must follow the employer's policies and procedures related to notifying clients of his or her planned departure.", "ko": "예고 기간에도 Chan은 현 고용주에게 충성 의무가 있다. 재직 중 SNS에 새 회사·상품을 공개적으로 올리면 고객 혼란을 일으키고 고용주에 앞서 자기 회사를 홍보하는 것이라 위반이다. 고객 통지는 회사 정책대로 했으므로 문제 없다.", "trap": "고객에게 알린 시점은 회사 정책을 따른 것이라 괜찮다. 문제는 SNS 갱신 시점.", "f": "", "why": {"A": "재직 중 새 회사를 공개 홍보해 고용주에게 해를 끼쳤으므로 위반.", "C": "고객 통지는 고용주 정책대로 즉시 했으므로 위반 아님."}, "orig": "Mock 3 Session 2 Q3", "conf": false}, {"id": "mock3-Q48", "src": "오답", "module": "ETH", "tag": "IV(C) 감독 책임: 적절한 시스템", "vig": 11, "stem": "With regard to the error in the research report, did Chan violate the Standards?", "opts": {"A": "No", "B": "Yes, because she failed to detect the error", "C": "Yes, because she failed to have an adequate system for supervision"}, "ans": "A", "en": "A. No — Correct\nCorrect because Chan had an existing compliance process to review and validate all research reports. Chan reviewed the employee's report, validated the sources, and believed the analysis to be sound when it was published. If a member or candidate has adopted reasonable procedures and taken steps to institute an effective compliance program, then the member or candidate may not be in violation of Standard IV (C) if he or she does not detect violations that occur despite these efforts.\nB. Yes, because she failed to detect the error — Incorrect\nIncorrect because the data entry error (a stock price increase, rather than a decrease) was missed by both the analyst and Chan but that does not constitute a violation of the Standards.\nC. Yes, because she failed to have an adequate system for supervision — Incorrect\nIncorrect because Chan had an established compliance program in place prior to the occurrence of the violation. The Standard requires that members and candidates with supervisory responsibility make reasonable efforts to prevent and detect violations by ensuring the establishment of effective compliance systems. Chan had established a compliance procedure and processes at her firm and validated the report before publication.", "ko": "Chan은 모든 보고서를 검토·검증하는 준법 절차를 갖추고 실제로 검토했다. 합리적 절차를 갖췄다면 그래도 놓친 오류 때문에 IV(C) 위반이 되지는 않는다.", "trap": "감독자는 오류를 모두 잡아야 하는 것이 아니라 합리적 절차를 갖추고 실행해야 한다.", "f": "", "why": {"B": "합리적 절차를 갖췄다면 오류를 놓쳤다는 것만으로는 위반이 아니다.", "C": "Chan은 위반 전에 이미 준법 절차를 갖추고 있었다."}, "orig": "Mock 3 Session 2 Q4", "conf": false, "my": "B"}, {"id": "mock3-Q49", "src": "정답", "module": "EQ", "tag": "FCFF (EBITDA 기준)", "vig": 12, "stem": "Firm A's FCFF (in $ millions) for the most recent year is:", "opts": {"A": "104.", "B": "118.", "C": "127."}, "ans": "A", "en": "A. 104. — Correct\nCorrect because FCFF can be calculated as follows.\nFCFF = EBITDA(1 – Tax rate) + Dep(Tax rate) – FCInv – WCInv\nwhere:\nDep: Depreciation expense\nTax rate: Corporate tax rate\nFCInv: Investment in fixed capital\nWCInv: Investment in working capital\nEBITDA = $200, Dep = $20, Tax rate = 30%, FCInv = $27 and WCInv = $15. Therefore,\nFCFF = $200(1 – 30%) + $20(30%) – $27 – $15 = $140 + $6 – $27 – $15 = $104\nB. 118. — Incorrect\nIncorrect because it ignores the tax rate for depreciation expense:\nFCFF = $200(1 – 30%) + $20 – $27 – $15 = $140 + $20 – $27 – $15 = $118\nThe correct formula that calculates FCFF using EBIT is:\nFCFF = EBIT(1 – Tax rate) + Dep – FCInv – WCInv\nC. 127. — Incorrect\nIncorrect because it represents the FCFE and uses all of the information provided in the exhibit.\nFCFE = FCFF – Int (1 – Tax rate) + Net borrowing\nFCFE = EBITDA(1 – Tax rate) + Dep(Tax rate) – FCInv – WCInv – Int (1 – Tax rate) + Net borrowing\nwhere:\nInt: Interest expense\nNet borrowing: Net new borrowing\nFCFE = $200(1 – 30%) + $20(30%) – $27 – $15 – $30(1– 30%) + $44\n= $140 + $6 – $27 – $15 – $21 + $44 = $127", "ko": "FCFF = EBITDA(1 − t) + Dep × t − FCInv − WCInv = 200 × 0.7 + 20 × 0.3 − 27 − 15 = 140 + 6 − 27 − 15 = $104m.", "trap": "EBITDA에서 출발하면 감가상각은 절세효과(Dep × t)만 더한다.", "f": "FCFF = EBITDA(1 − t) + Dep·t − FCInv − WCInv", "why": {"B": "감가상각 전액(20)을 더함. 세율을 곱해야 한다.", "C": "FCFF가 아니라 FCFE(이자·순차입 반영)를 계산."}, "orig": "Mock 3 Session 2 Q5", "conf": false}, {"id": "mock3-Q50", "src": "정답", "module": "EQ", "tag": "다단계 FCFF로 자기자본 가치", "vig": 12, "stem": "The intrinsic value of Firm A's equity (in $ millions), as estimated by Silva, should be closest to:", "opts": {"A": "1,519.", "B": "2,087.", "C": "2,537."}, "ans": "B", "en": "A. 1,519. — Incorrect\nIncorrect because this answer uses the cost of equity as the discount rate (instead of WACC). Below are the resulting incorrect figures obtained for the intermediate steps:\n\tYear 1\tYear 2\tYear 3\nProjected FCFF ($ millions)\t$160\t$180\t$190\nPV at 12% ($ millions)\t$142.86\t$143.49\t$135.24\nTV3 = $195.7 / (12% – 3%) = $2,174.44 million\nPresent value of TV3 = $2,174.44 / (1.12)^3 = $1,547.73\nThe total present value of future FCFF (Intrinsic value of the firm) = $142.86 + $143.49 + $135.24 + $1,547.73 = $1,969.32\nIntrinsic value of equity = $1,969.32 – $450 = $1,519.32\nB. 2,087. — Correct\nCorrect because Firm A's intrinsic value based on a multi-stage FCFF model can be estimated in two steps as follows.\nStep 1: Finding the present value of projected FCFF\nSince Silva uses an FCFF-based valuation approach, the appropriate discount rate to find the present value of future FCFF is the WACC, which is given as 10%.\n\tYear 1\tYear 2\tYear 3\nProjected FCFF ($ millions)\t$160\t$180\t$190\nPV at 10% ($ millions)\t$145.45\t$148.76\t$142.75\nTerminal value at the end of Year 3 (TV3) is\nTV3 = FCFF4 / (WACC – g)\nwhere g is the constant growth rate (provided as 3% in the vignette)\nFCFF4 = FCFF3 (1 + g) = $190 (1.03) = $195.7\nTV3 = $195.7 / (10% – 3%) = $2,795.71 million\nPresent value of TV3 = $2,795.71 / (1.10)^3 = $2,100.46\nThe total present value of future FCFF, which is the intrinsic value of the firm, equals $2,537.43 = $145.45 + $148.76 + $142.75 + $2,100.46\nStep 2: Subtracting the value of debt\nIntrinsic value of equity = Value of the firm – Market value of debt\n= $2,537.43 – $450 = $2,087.43 million\nC. 2,537. — Incorrect\nIncorrect because this answer ignores the subtraction of debt in Step 2. This figure represents the estimated intrinsic value of the firm (i.e., the present value of future FCFFs of $2,537.43).", "ko": "WACC 10%로 할인: 160/1.1 = 145.45, 180/1.1^2 = 148.76, 190/1.1^3 = 142.75. TV3 = 190 × 1.03/(0.10 − 0.03) = 2,795.71, PV = 2,100.46. 기업가치 = 2,537.43. 자기자본 = 2,537.43 − 부채 450 = $2,087m.", "trap": "FCFF는 WACC로 할인하고 마지막에 부채를 뺀다. 2,537은 기업가치.", "f": "Equity = Σ FCFF/(1 + WACC)^t + TV/(1 + WACC)^n − Debt", "why": {"A": "WACC 대신 자기자본비용으로 할인.", "C": "부채를 빼지 않은 기업가치."}, "orig": "Mock 3 Session 2 Q6", "conf": false}, {"id": "mock3-Q51", "src": "정답", "module": "EQ", "tag": "가치평가 모형 선택: FCFF", "vig": 12, "stem": "Which of the following is the most appropriate valuation approach for Firm B?", "opts": {"A": "DDM", "B": "FCFE", "C": "FCFF"}, "ans": "C", "en": "A. DDM — Incorrect\nIncorrect because of two reasons. First, DDM uses required return on equity as the discount rate, which is more sensitive to changes in financial leverage than the WACC. Second, the client is interested in a controlling position, which gives them the ability to change the use of free cash flows. For example, future dividends might be projected to decrease if the client intends to use the firm's free cash flow to serve the debt. In such a scenario, the use of DDM will seriously understate the value of the firm's equity and therefore be inappropriate.\nB. FCFE — Incorrect\nIncorrect because the capital structure is unstable. FCFE uses required return on equity as the discount rate, which is more sensitive to changes in financial leverage than the WACC, making the use of FCFE inappropriate.\nC. FCFF — Correct\nCorrect because FCFF is the only approach that is appropriate for a client seeking a controlling position and for a firm that has an unstable capital structure.\nMany analysts consider free cash flow models to be more useful than DDM in practice. Analysts like to use free cash flow whenever the investor takes a control perspective. With control comes discretion over the uses of free cash flow. If an investor can take control of the company (or expects another investor to do so), dividends may be changed substantially; for example, they may be set at a level approximating the company’s capacity to pay dividends. Such an investor can also apply free cash flows to uses such as servicing the debt incurred in an acquisition.\nThe FCFF model is often chosen over FCFE when valuing a levered company with a changing capital structure for two reasons. First, if historical data is used to forecast free cash flow growth rates, FCFF growth might reflect fundamentals more clearly than does FCFE growth, which reflects fluctuating amounts of net borrowing. Second, in a forward-looking context, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify. Therefore, FCFF is the appropriate model to value Firm B.", "ko": "Firm B는 지배권 인수를 원하는 고객이고 자본구조가 불안정하다. 지배 관점이면 FCF 모형, 레버리지가 자주 바뀌면 자기자본비용보다 덜 민감한 WACC를 쓰는 FCFF가 알맞다.", "trap": "자본구조 불안정 → FCFE·DDM의 자기자본비용이 레버리지에 민감해 부적합.", "f": "", "why": {"A": "DDM은 지배 관점에 맞지 않고 자기자본비용이 레버리지에 민감.", "B": "자본구조가 불안정해 자기자본비용 기반 FCFE가 부적합."}, "orig": "Mock 3 Session 2 Q7", "conf": false}, {"id": "mock3-Q52", "src": "오답", "module": "EQ", "tag": "페어 트레이딩 → 상대가치 (P/E 비교)", "vig": 12, "stem": "Which of the following valuation approaches is the most appropriate for Silva to use when evaluating the pairs trade involving Firm C and Firm D?", "opts": {"A": "A P/E-based comparables valuation", "B": "An asset-based valuation adjusted for conglomerate discount", "C": "A price-to-EBITDA-based comparables valuation adjusted for lack of marketability discount"}, "ans": "A", "en": "A. A P/E-based comparables valuation — Correct\nCorrect because pairs trading is a classic example of relative value investing that utilizes pairs of closely related stocks (e.g., two automotive stocks), buying the relatively undervalued stock and selling short the relatively overvalued stock. Regardless of which direction the overall stock market goes, the investor will be better off to the extent that the relatively undervalued stock ultimately rises more (falls less) than the relatively overvalued stock. Since the intent is to identify relative mispricing, a relative valuation model is most suitable such as a P/E-based comparables valuation.\nB. An asset-based valuation adjusted for conglomerate discount — Incorrect\nIncorrect because of two reasons. First, both firms generate significant revenue from industrial electrical wiring sales and an asset-based approach is less suitable to value this segment. Second, conglomerate discount applies for companies that operate unrelated segments. Conglomerate discount refers to the concept that the market applies a discount to the stock of a company operating in multiple and unrelated businesses compared to the stock of companies with narrower focuses.\nC. A price-to-EBITDA-based comparables valuation adjusted for lack of marketability discount — Incorrect\nIncorrect because lack of marketability discount does not apply to either firm as they are both publicly traded.", "ko": "페어 트레이딩은 비슷한 두 종목 중 상대적으로 싼 것을 사고 비싼 것을 공매도하는 상대가치 투자다. 상대적 오평가를 찾는 것이므로 P/E 비교 평가가 알맞다.", "trap": "두 회사 모두 상장사라 시장성 결여 할인(DLOM)은 해당 없다.", "f": "", "why": {"B": "두 회사는 전선 매출 중심이라 자산 기반 평가·복합기업 할인이 맞지 않는다.", "C": "상장사이므로 시장성 결여 할인이 적용되지 않는다."}, "orig": "Mock 3 Session 2 Q8", "conf": false, "my": "B"}, {"id": "mock3-Q53", "src": "정답", "module": "FI", "tag": "신용등급 전이 기대수익률", "vig": 13, "stem": "Based on the credit rating migration information, the expected 1-year total return for the Better Corp. bond is closest to:", "opts": {"A": "0.9%.", "B": "1.7%.", "C": "2.8%."}, "ans": "C", "en": "A. 0.9%. — Incorrect\nIncorrect because the change in value is subtracted from the credit spread.\n(0.90 × 0.0%) + (0.09 × –2.0%) + (0.01 × –3.0%) = –0.21%\n1.10%-0.21% = 0.89%≈ 0.9%\nB. 1.7%. — Incorrect\nIncorrect because, in addition to subtracting the change in value, the credit spread is subtracted from the YTM.\n(0.90 × 0.0%) + (0.09 × –2.0%) + (0.01 × –3.0%) = –0.21%\n3.00% – 0.21% - 1.10% = 1.69% ≈ 1.7%\nC. 2.8%. — Correct\nCorrect because the expected percentage change in bond value is given as the sum of the products of the transition probabilities and the expected price changes. Both pieces of information are given in Exhibit 1.\nCalculate the expected percentage change in bond value:\n(0.90 × 0.0%) + (0.09 × –2.0%) + (0.01 × –3.0%) = –0.21%\nAdjust the 3% YTM given in the case:\n3.00% – 0.21% = 2.79% ≈ 2.8%\nNote that it is not necessary to calculate the expected percentage price change (i.e., modified duration times change in the credit spread) for each credit rating migration because they are given in the case.", "ko": "기대 가격변화 = 0.90 × 0% + 0.09 × (−2.0%) + 0.01 × (−3.0%) = −0.21%. 1년 기대 총수익 = YTM 3.00% − 0.21% = 2.79% ≈ 2.8%.", "trap": "출발점은 신용스프레드(1.10%)가 아니라 YTM(3.0%).", "f": "기대수익 ≈ YTM + Σ(전이확률 × 가격변화)", "why": {"A": "YTM 대신 신용스프레드 1.10%에서 차감.", "B": "YTM에서 스프레드까지 빼고 가격변화도 차감."}, "orig": "Mock 3 Session 2 Q9", "conf": true}, {"id": "mock3-Q54", "src": "정답", "module": "FI", "tag": "신용스프레드 곡선 가팔라짐: 만기 연장", "vig": 13, "stem": "Barilla's expectation regarding the credit spread curve for Grocery, Inc. is best supported by the new bond issue's:", "opts": {"A": "longer maturity.", "B": "higher credit rating.", "C": "tighter bid–offer spread."}, "ans": "A", "en": "A. longer maturity. — Correct\nCorrect because Grocery, Inc. is offering the new issue to refinance short-term debt with longer-maturity debt and Barilla expects the Grocery, Inc. credit spread curve to steepen after the new issue. One might expect the credit curve to steepen for a borrower refinancing near-term maturities with long-term debt.\nB. higher credit rating. — Incorrect\nIncorrect because Barilla notes that the new issue will have a higher credit rating than previously issued bonds and she expects the Grocery, Inc. credit spread curve to steepen after the new issue. The credit term structure for the most highly rated securities tends to be either flat or slightly upward sloping.\nC. tighter bid–offer spread. — Incorrect\nIncorrect because Barilla notes that the new issue has a tighter bid–offer spread and she expects the Grocery, Inc. credit spread curve to steepen after the new issue. The steepening effect may be partially offset by a tighter bid–offer spread for longer credit maturities.", "ko": "Grocery는 단기 부채를 장기 부채로 차환한다. 장기 만기 발행이 늘면 신용스프레드 곡선이 가팔라질 것으로 기대할 수 있다.", "trap": "등급 상승·호가 스프레드 축소는 오히려 스프레드를 줄이는 쪽이라 가팔라짐을 뒷받침하지 않는다.", "f": "", "why": {"B": "신용등급 상승은 스프레드 곡선 가팔라짐의 근거가 아니다.", "C": "호가 스프레드 축소(유동성 개선)는 가팔라짐의 근거가 아니다."}, "orig": "Mock 3 Session 2 Q10", "conf": false}, {"id": "mock3-Q55", "src": "정답", "module": "FI", "tag": "CDS 베이시스 트레이드", "vig": 13, "stem": "If convergence were to occur, the basis trade on Animal Supplies would capture a profit closest to:", "opts": {"A": "0.9%.", "B": "2.1%.", "C": "3.3%."}, "ans": "A", "en": "A. 0.9%. — Correct\nCorrect because Barilla makes a basis trade to take advantage of valuation disparities between the Animal Supplies bond and CDS by buying the bond and buying CDS protection.\nBond credit spread = Yield – MRR\n5.0% – 1.2% = 3.8%\nIf convergence occurs, Bond credit spread – CDS credit spread = Profit\n3.8% – 2.9% = 0.9%\nB. 2.1%. — Incorrect\nIncorrect because the CDS credit spread (not the MRR) is subtracted from the bond yield.\n5.0% – 2.9% = 2.1%\nC. 3.3%. — Incorrect\nIncorrect because the MRR is subtracted from the CDS credit spread (instead of from the bond yield):\n2.9% – 1.2% = 1.7%\nThen this result is subtracted from the bond yield:\n5.0% – 1.7% = 3.3%", "ko": "채권 신용스프레드 = 채권 수익률 5.0% − MRR 1.2% = 3.8%. 채권을 사고 CDS 보호를 사면, 수렴 시 이익 = 3.8% − CDS 스프레드 2.9% = 0.9%.", "trap": "채권 수익률에서 MRR을 먼저 빼서 채권 스프레드를 구한다.", "f": "Profit = (Bond yield − MRR) − CDS spread", "why": {"B": "MRR 대신 CDS 스프레드를 채권 수익률에서 뺌.", "C": "MRR을 CDS 스프레드에서 빼는 등 순서가 틀림."}, "orig": "Mock 3 Session 2 Q11", "conf": false}, {"id": "mock3-Q56", "src": "정답", "module": "FI", "tag": "부도 시 CDS 현금결제 + 채권 매각", "vig": 13, "stem": "If Material Corporation defaults, the total proceeds from the client's Bond D and CDS position would be closest to:", "opts": {"A": "$0.9 million.", "B": "$1.0 million.", "C": "$1.1 million."}, "ans": "C", "en": "A. $0.9 million. — Incorrect\nIncorrect because the CDS payoff should be based on the lowest recovery rate, not the highest.\nThis response is based on an understanding that cash settlement is different than physical settlement, but it incorrectly calculates the proceeds based on the highest recovery rate. The highest CDS recovery rate is based on Bond E at 40% of par.\nCDS: (1 – 40%) × $1 million = $600,000\nBond: 30% × $1 million = $300,000\nTotal proceeds: $600,000 + $300,000 = $0.9 million\nB. $1.0 million. — Incorrect\nIncorrect because the CDS payoff should be based on the lowest recovery rate.\nThis response incorrectly calculates the proceeds from physical settlement by using the recovery rate of Bond D. The CDS physical settlement recovery rate based on Bond D is 30% of par.\nCDS: (1 – 30%) × $1 million = $700,000\nBond: 30% × $1 million = $300,000\nTotal proceeds: $700,000 + $300,000 = $1.0 million\nC. $1.1 million. — Correct\nCorrect because the client will cash settle the CDS and sell Bond D. The client would receive the cheapest-to-deliver recovery rate on the CDS and the proceeds from selling Bond D at the current market price. The CDS cheapest-to-deliver recovery rate is based on Bond C at 20% of par.\nCDS:\nLoss given default (LGD) = 1 – Recovery rate (%)\nPayout amount = LGD × Notional\n(1 – 20%) × $1 million = $800,000\nBond:\nBond payout = Recovery rate (%) × Par\n30% × $1 million = $300,000\nTotal proceeds:\nTotal proceeds = Cash settlement of CDS + Proceeds from Bond D sale\n$800,000 + $300,000 = $1.1 million", "ko": "CDS는 최저가 인도(cheapest-to-deliver) 채권 회수율로 정산: Bond C 20% → (1 − 0.20) × $1m = $0.8m. Bond D는 시장가 30%에 매각 → $0.3m. 합계 $1.1m.", "trap": "CDS 정산은 가장 낮은 회수율(CTD) 기준이다. 가장 높은 회수율 40%가 아니다.", "f": "CDS payout = (1 − CTD 회수율) × 명목금액", "why": {"A": "CDS를 가장 높은 회수율(Bond E 40%)로 정산.", "B": "실물결제 대금을 잘못 계산, CTD 최저 회수율을 써야 한다."}, "orig": "Mock 3 Session 2 Q12", "conf": false}, {"id": "mock3-Q57", "src": "오답", "module": "AI", "tag": "위기 시 헤지펀드 팩터 노출", "vig": 14, "stem": "Which fund should be expected to perform best under the crisis scenario?", "opts": {"A": "Fund X", "B": "Fund Y", "C": "Fund Z"}, "ans": "A", "en": "A. Fund X — Correct\nCorrect because, when equity prices fall and volatility rises, the fund that would perform best is the one with the smallest equity risk factor beta and the largest volatility risk factor beta.\nThe table below shows that, during crisis periods, Fund X has historically had the smallest (in this case, largest negative) equity risk factor beta (–0.10) and the largest volatility risk factor beta (0.36).\n\tFund X\tFund Y\tFund Z\nNormal Times Exposures\t\t\t\nIntercept\t0\t0\t0\nEquity risk factor (EQU)\t-0.19\t0.43\t-0.03\nVolatility risk factor (VOL)\t0.09\t0.16\t\nCrisis Times Exposures (Incremental)\t\t\t\nDEQU\t0.09\t0.16\t-0.02\nDVOL\t0.27\t-0.18\t0.03\nCrisis Times Exposures (Total)\t\t\t\nEquity risk factor (EQU + DEQU)\t-0.19 + 0.09 = -0.10\t0.43 + 0.16 = 0.59\t-0.03 - 0.02 = -0.05\nVolatility risk factor (VOL + DVOL)\t0.09 + 0.27 = 0.36\t0.16 - 0.18 = -0.02\t0.01 + 0.03 = 0.04\nB. Fund Y — Incorrect\nIncorrect because, when equity prices fall and volatility rises, the fund that would perform best is the one with the smallest equity risk factor beta and the largest volatility risk factor beta.\nDuring crisis periods, Fund Y has historically had the largest equity risk factor beta (0.59) and the smallest volatility risk factor beta (–0.02). Fund Y is expected to perform worst.\nC. Fund Z — Incorrect\nIncorrect because, when equity prices fall and volatility rises, the fund that would perform best is the one with the smallest equity risk factor beta and the largest volatility risk factor beta.\nDuring crisis periods, Fund X is expected to perform better than Fund Z. Fund X has historically had a larger negative equity risk factor beta than Fund Z (–0.10 versus –0.05) and a larger positive volatility risk factor beta (0.36 versus 0.04).", "ko": "주가가 떨어지고 변동성이 오르는 위기에는 주식 베타가 가장 작고 변동성 베타가 가장 큰 펀드가 유리하다. 위기 총노출: Fund X 주식 −0.19 + 0.09 = −0.10, 변동성 0.09 + 0.27 = 0.36으로 가장 유리하다.", "trap": "평시 노출만 보지 말고 위기 증분을 더한 총노출로 판단한다.", "f": "위기 노출 = 평시 노출 + 위기 증분(DEQU, DVOL)", "why": {"B": "Fund Y는 위기 주식 베타 0.59로 가장 크고 변동성 베타 −0.02.", "C": "Fund Z는 변동성 베타 0.04로 Fund X(0.36)보다 작다."}, "orig": "Mock 3 Session 2 Q13", "conf": false, "my": "B"}, {"id": "mock3-Q58", "src": "정답", "module": "AI", "tag": "Sortino 비율로 펀드 선택", "vig": 14, "stem": "Which of the following funds should the family office add to the current portfolio to meet its objective?", "opts": {"A": "Fund X", "B": "Fund Y", "C": "Fund Z"}, "ans": "B", "en": "A. Fund X — Incorrect\nIncorrect because the addition of Fund X to the current portfolio results in the lowest (not highest) Sortino ratio. The Sharpe ratio measures risk-adjusted performance, where risk is defined as standard deviation, so it penalizes both upside and downside variability. The Sortino ratio measures risk-adjusted performance, where risk is defined as downside deviation, so it penalizes only downside variability below a minimum target return.\nB. Fund Y — Correct\nCorrect because the addition of Fund Y to the current portfolio results in the highest Sortino ratio. The Sharpe ratio measures risk-adjusted performance, where risk is defined as standard deviation, so it penalizes both upside and downside variability. The Sortino ratio measures risk-adjusted performance, where risk is defined as downside deviation, so it penalizes only downside variability below a minimum target return.\nC. Fund Z — Incorrect\nIncorrect because the addition of Fund Z to the current portfolio does not result in the highest Sortino ratio. Instead, it results in the highest Sharpe ratio. The Sharpe ratio measures risk-adjusted performance, where risk is defined as standard deviation, so it penalizes both upside and downside variability. The Sortino ratio measures risk-adjusted performance, where risk is defined as downside deviation, so it penalizes only downside variability below a minimum target return.", "ko": "가족 오피스는 하방 위험만 신경 쓰므로 Sortino 비율(하방편차 기준)이 가장 높아지는 펀드를 고른다. Fund Y를 더하면 Sortino가 가장 높다.", "trap": "Sharpe가 가장 높은 것(Fund Z)과 혼동 주의.", "f": "Sortino = (R − MAR)/하방편차", "why": {"A": "Fund X를 더하면 Sortino가 가장 낮다.", "C": "Fund Z는 Sharpe가 가장 높을 뿐 Sortino는 최고가 아니다."}, "orig": "Mock 3 Session 2 Q14", "conf": false}, {"id": "mock3-Q59", "src": "정답", "module": "AI", "tag": "원자재 선물 총수익", "vig": 14, "stem": "The 6-month total return for the crude oil futures position is:", "opts": {"A": "10%.", "B": "11%.", "C": "12%."}, "ans": "B", "en": "A. 10%. — Incorrect\nIncorrect because the collateral return is omitted from the calculation.\nPrice return = 6%\nRoll return = 4%\nTotal return (incorrect) = 6% + 4% = 10%\nB. 11%. — Correct\nCorrect because the total return for a fully collateralized position is the sum of the price return, the roll return, and the collateral return.\nPrice return = 6%\nRoll return = 4%\nCollateral return = Annual rate × Period length as a fraction of the year = 2% × 0.5 = 1%\nTotal return = 6% + 4% + 1% = 11%\nC. 12%. — Incorrect\nIncorrect because the given collateral return, which is annualized, is not converted to a 6-month return.\nPrice return = 6%\nRoll return = 4%\nCollateral return (incorrect) = 2%\nTotal return (incorrect) = 6% + 4% + 2% = 12%", "ko": "완전 담보 포지션 총수익 = 가격수익 6% + 롤수익 4% + 담보수익(2% × 0.5 = 1%) = 11%.", "trap": "담보수익은 연율이라 6개월이면 절반만.", "f": "Total = Price + Roll + Collateral return", "why": {"A": "담보수익을 빠뜨림.", "C": "연 2% 담보수익을 6개월로 환산하지 않음."}, "orig": "Mock 3 Session 2 Q15", "conf": false}, {"id": "mock3-Q60", "src": "오답", "module": "AI", "tag": "에너지 비중 최대 지수: S&P GSCI", "vig": 14, "stem": "The most appropriate reference index for Pearl’s swap is the:", "opts": {"A": "RICI.", "B": "BCOM.", "C": "S&P GSCI."}, "ans": "C", "en": "A. RICI. — Incorrect\nIncorrect because Pearl aims to maximize exposure to energy commodities, so the most appropriate index to use as a basis for the commodity swap is the one which has the highest sector weight on energy.\nThe RICI uses a fixed-weighting scheme to allocate exposure among 38 different commodities. RICI uses the fixed weight weighting method.\nB. BCOM. — Incorrect\nIncorrect because Pearl aims to maximize exposure to energy commodities, so the most appropriate index to use as a basis for the commodity swap is the one which has the highest sector weight on energy.\nBCOM's rules of index construction also place caps on the size of the sectors (33% maximum) and floors on individual commodities (2% minimum). These differences mean that very different index composition and weights can occur. For example, the energy sector currently dominates the S&P GSCI (as high as 80% weight), whereas the BCOM’s exposure is much lower (approximately 30%).\nC. S&P GSCI. — Correct\nCorrect because Pearl aims to maximize exposure to energy commodities and, among the three indexes, the S&P GSCI has the highest sector weight on energy.\nThe S&P GSCI uses a world production value-weighting scheme that gives the largest weight to the most valuable commodity on the basis of physical trade value. It should be no surprise that crude oil has the highest single weight and energy has the highest sector weight (historically as high as 80%) in this index. S&P GSCI uses the production weight weighting method.", "ko": "S&P GSCI는 세계 생산가치로 가중해 원유 비중이 가장 크고 에너지 섹터 비중이 가장 높다(한때 80%). 에너지 노출을 최대화하려면 S&P GSCI.", "trap": "RICI는 고정 가중, BCOM은 섹터 상한을 둬서 에너지 비중이 낮다.", "f": "", "why": {"A": "RICI는 38개 원자재를 고정 가중해 에너지 비중이 GSCI보다 낮다.", "B": "BCOM은 섹터 상한(33%)·종목 하한(2%) 규칙으로 에너지 비중이 약 30%로 낮다."}, "orig": "Mock 3 Session 2 Q16", "conf": true, "my": "A"}, {"id": "mock3-Q61", "src": "정답", "module": "ETH", "tag": "개인 매매: 회사 포트폴리오 밖 종목", "vig": 15, "stem": "Does Lyden's purchase of Proctivi for her personal account violate the Standards?", "opts": {"A": "No", "B": "Yes, she should have obtained pre-approval for the purchase", "C": "Yes, she should follow Epic's investment methodology and not purchase Proctivi"}, "ans": "A", "en": "A. No — Correct\nCorrect because there is no violation of the Standard relating to disclosure of conflicts. The investment was inappropriate for Epic and not held in any Eto portfolios. That does not limit her ability to invest in it personally.\nB. Yes, she should have obtained pre-approval for the purchase — Incorrect\nIncorrect because she doesn't need to obtain preapproval. She is only required to get preapproval for securities held in Eto portfolios. Proctivi is not held in any of the firm's portfolios so pre-approval is not required.\nC. Yes, she should follow Epic's investment methodology and not purchase Proctivi — Incorrect\nIncorrect because Epic's investment methodology does not apply to Lyden's personal trading activities. She is free to purchase investments that are unsuitable for Epic.", "ko": "Proctivi는 Eto 포트폴리오에 없고 Epic 펀드에도 맞지 않는 종목이다. 사전 승인은 회사 포트폴리오 보유 종목에만 필요하고, 펀드 방법론은 개인 매매에 적용되지 않으므로 위반이 아니다.", "trap": "고객 펀드에 부적합한 종목이라도 개인 투자는 자유다.", "f": "", "why": {"B": "사전 승인 대상은 회사 포트폴리오 보유 종목뿐.", "C": "Epic의 투자 방법론은 Lyden 개인 매매와 관계없다."}, "orig": "Mock 3 Session 2 Q17", "conf": true}, {"id": "mock3-Q62", "src": "오답", "module": "ETH", "tag": "V(B) 위험 공시: 변동성 양방향", "vig": 15, "stem": "Does Lyden violate the Standards in providing the structured product report to her client?", "opts": {"A": "No", "B": "Yes, because her report didn't provide specific details about the model or the inputs", "C": "Yes, because she should disclose expected performance for both an increase and a decrease in market volatility"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because members and candidates must adequately disclose the general market-related risks and the risks associated with the use of complex financial instruments that are deemed significant. In addition, the member or candidate who prepares the report must include those elements that are important to the analysis and conclusions of the report so that the reader can follow and challenge the report’s reasoning. Lyden's report only discusses performance with an increase in market volatility, not a decrease in market volatility.\nB. Yes, because her report didn't provide specific details about the model or the inputs — Incorrect\nIncorrect because the member or candidate who prepares the report must include those elements that are important to the analysis and conclusions of the report so that the reader can follow and challenge the report’s reasoning. A report writer who has done adequate investigation may emphasize certain areas, touch briefly on others, and omit certain aspects deemed unimportant. Lyden included the basic characteristics of the product but doesn't include specific details about the model and the inputs. The specifics of a complex model do not need to be shared.\nC. Yes, because she should disclose expected performance for both an increase and a decrease in market volatility — Correct\nCorrect because Eto has adopted the Standards so Lyden must follow them. In addition, members and candidates must adequately disclose the general market-related risks and the risks associated with the use of complex financial instruments that are deemed significant. In addition, the member or candidate who prepares the report must include those elements that are important to the analysis and conclusions of the report so that the reader can follow and challenge the report’s reasoning. Lyden's report only discusses performance with respect to an increase in market volatility, not a decrease in market volatility.", "ko": "Lyden의 구조화상품 보고서는 시장 변동성이 오를 때의 성과만 설명하고 내릴 때는 설명하지 않았다. 복잡한 상품의 중요한 위험을 충분히 알려야 하므로 위반이다. 모형 세부·입력값을 모두 밝힐 필요는 없다.", "trap": "모형 세부 공개는 필수 아님. 중요한 위험(변동성 하락 시)을 빠뜨린 것이 문제.", "f": "", "why": {"A": "변동성 하락 시 성과를 빠뜨려 위험 공시가 부족하다.", "B": "모든 모형 세부·입력값을 공개할 의무는 없다."}, "orig": "Mock 3 Session 2 Q18", "conf": false, "my": "A"}, {"id": "mock3-Q63", "src": "정답", "module": "ETH", "tag": "III(C) 적합성: 자문 관계 없음", "vig": 15, "stem": "Does Meier violate the Standards with his recommendation of Balmtrex to the finance students?", "opts": {"A": "No", "B": "Yes, because he did not discuss the risks of investing in Balmtrex", "C": "Yes, because he did not consider the suitability of the investment for the students"}, "ans": "A", "en": "A. No — Correct\nCorrect because Standard III(C) requires that members and candidates who are in an investment advisory relationship with clients consider carefully the needs, circumstances, and objectives of the clients when determining the appropriateness and suitability of a given investment or course of investment action. The students are not clients receiving investment advice so there is no investment advisory relationship.\nB. Yes, because he did not discuss the risks of investing in Balmtrex — Incorrect\nIncorrect because Standard III(C) requires that members and candidates who are in an investment advisory relationship with clients consider carefully the needs, circumstances, and objectives of the clients when determining the appropriateness and suitability of a given investment or course of investment action. The students are not clients receiving investment advice so there is no investment advisory relationship so there is no requirement to discuss the risk around the investment.\nC. Yes, because he did not consider the suitability of the investment for the students — Incorrect\nIncorrect because Standard III(C) requires that members and candidates who are in an investment advisory relationship with clients consider carefully the needs, circumstances, and objectives of the clients when determining the appropriateness and suitability of a given investment or course of investment action. The students are not clients receiving investment advice so there is no investment advisory relationship and therefore no need to consider the suitability for them.", "ko": "III(C) 적합성은 투자자문 관계의 고객에게 적용된다. Meier가 종목을 언급한 대학생들은 고객이 아니므로 적합성·위험 검토 의무가 없다.", "trap": "자문 관계(고객)가 있어야 적합성 기준이 적용된다.", "f": "", "why": {"B": "학생은 고객이 아니라 위험 설명 의무가 적용되지 않는다.", "C": "자문 관계가 없어 적합성 검토 의무가 없다."}, "orig": "Mock 3 Session 2 Q19", "conf": true}, {"id": "mock3-Q64", "src": "오답", "module": "ETH", "tag": "II(A) 중요성: 신뢰도 낮은 정보", "vig": 15, "stem": "With regard to InG Pharma, does Lyden violate the Standards regarding material nonpublic information?", "opts": {"A": "No", "B": "Yes, because she purchased additional shares for the fund", "C": "Yes, because she shared the analyst's information with a colleague"}, "ans": "A", "en": "A. No — Correct\nCorrect because, according to Standard II(A) regarding material nonpublic information, the information about the drug trial is not material nonpublic information. Lyden is allowed to share the information with a colleague and trade on the information.\nIn addition to the substance and specificity of the information, the source or relative reliability of the information also determines materiality. The less reliable a source, the less likely the information provided would be considered material. Additionally, information about trials of a new drug, product, or service under development from qualified personnel involved in the trials is likely to be material, whereas educated conjecture by subject experts not connected to the trials is unlikely to be material.\nThe source of the information is a well-respected industry analyst expressing his opinion on the prospects of the new drug driving InG Pharma's future sales. It is unlikely that his opinion would be considered material.\nB. Yes, because she purchased additional shares for the fund — Incorrect\nIncorrect because the information is not material non-public information so she is allowed to purchase shares using this information as an input into her valuation model.\nIn addition to the substance and specificity of the information, the source or relative reliability of the information also determines materiality. The less reliable a source, the less likely the information provided would be considered material. Additionally, information about trials of a new drug, product, or service under development from qualified personnel involved in the trials is likely to be material, whereas educated conjecture by subject experts not connected to the trials is unlikely to be material.\nThe source of the information is a well-respected industry analyst expressing his opinion on the prospects of the new drug driving InG Pharma's future sales. It is unlikely that his opinion would be considered material.\nC. Yes, because she shared the analyst's information with a colleague — Incorrect\nIncorrect because the information is not material non-public information so she is allowed to share it with her research analyst.\nIn addition to the substance and specificity of the information, the source or relative reliability of the information also determines materiality. The less reliable a source, the less likely the information provided would be considered material. Additionally, information about trials of a new drug, product, or service under development from qualified personnel involved in the trials is likely to be material, whereas educated conjecture by subject experts not connected to the trials is unlikely to be material.", "ko": "신약 전망은 시험에 관여하지 않은 업계 애널리스트의 의견이다. 시험 관계자가 아닌 전문가의 추측은 중요(material) 정보로 보기 어렵다. 그래서 동료와 공유하고 그 정보를 근거로 펀드에서 사도 위반이 아니다.", "trap": "정보 출처의 신뢰도가 낮으면 중요 정보가 아니다. 시험 관계자에게서 나온 정보라면 중요.", "f": "", "why": {"B": "중요 미공개 정보가 아니라 매수해도 된다.", "C": "중요 미공개 정보가 아니라 동료와 공유해도 된다."}, "orig": "Mock 3 Session 2 Q20", "conf": false, "my": "B"}, {"id": "mock3-Q65", "src": "오답", "module": "FSA", "tag": "외화거래 손익: 결제 연도", "vig": 16, "stem": "As a result of the inventory purchase, Belle should recognize a foreign currency transaction loss of:", "opts": {"A": "EUR 8,500 in the current year.", "B": "EUR 5,000 in the most recent year.", "C": "EUR 3,500 in the current year."}, "ans": "A", "en": "A. EUR 8,500 in the current year. — Correct\nCorrect because, on the date of the transaction, Belle owed GBP 500,000, which would cost GBP 500,000 × EUR/GBP 1.186 = EUR 593,000.\nOn 31 December (at year end) of the most recent year, GBP 500,000 would cost GBP 500,000 × EUR/GBP 1.176 = EUR 588,000. Belle would recognize an unrealized foreign currency gain of EUR 5,000 (EUR 593,000 – EUR 588,000) at the end of the most recent year.\nAt the settlement date, Belle would pay EUR 596,500 (GBP 500,000 × EUR/GBP 1.193). Belle needs to pay EUR 8,500 (EUR 596,500 – EUR 588,000) more than the amount reported at the end of the most recent year, resulting in a foreign currency transaction loss of EUR 8,500 in the current year.\nB. EUR 5,000 in the most recent year. — Incorrect\nIncorrect because Belle would recognize an unrealized foreign currency gain, not loss, of EUR 593,000 – EUR 588,000 = EUR 5,000 at the end of the most recent year.\nC. EUR 3,500 in the current year. — Incorrect\nIncorrect because this represents the net foreign currency loss from transaction date to settlement date. Belle owed GBP 500,000, which would cost EUR 593,000 (GBP 500,000 × EUR/GBP 1.186). At the settlement date, Belle would pay EUR 596,500 (GBP 500,000 × EUR/GBP 1.193). The total foreign currency loss in the current year is EUR 3,500 (EUR 596,500 – EUR 593,000).", "ko": "거래일: GBP 500,000 × 1.186 = EUR 593,000. 연말: × 1.176 = EUR 588,000 → 전년에 EUR 5,000 이익. 결제일: × 1.193 = EUR 596,500 → 올해 손실 596,500 − 588,000 = EUR 8,500.", "trap": "전년 말에 이미 5,000 이익을 인식했으므로 올해 손실은 연말 기준(588,000)과 비교한다.", "f": "올해 손익 = 결제액 − 전년 말 평가액", "why": {"B": "전년 말에는 손실이 아니라 EUR 5,000 이익.", "C": "거래일부터 결제일까지 순손실(596,500 − 593,000)."}, "orig": "Mock 3 Session 2 Q21", "conf": false, "my": "C"}, {"id": "mock3-Q66", "src": "정답", "module": "FSA", "tag": "지속가능 매출 성장 (물량·가격)", "vig": 16, "stem": "From two years ago to the most recent year, the increase in the UK-based subsidiary's sustainable sales growth rate was:", "opts": {"A": "2%.", "B": "3%.", "C": "7%."}, "ans": "B", "en": "A. 2%. — Incorrect\nIncorrect because this represents the change in the growth of volume (5% – 3%) and does not consider the effect of the change in the growth of price (2% – 1% = 1%).\nFor a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.\nB. 3%. — Correct\nCorrect because this represents the change in the growth of sales resulting from the change in the growth of volume and price; [(5% + 2%) – (3% + 1%)] = 3%. For a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates.\nC. 7%. — Incorrect\nIncorrect because this represents the change in the growth of net sales (10% – 3%), which includes the effect of foreign currency changes (3% – (–1%) = 4%).\nFor a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates.", "ko": "지속가능한 매출 성장은 물량과 가격 변화에서 나온 부분(환율 제외)이다. 최근 (5% + 2%) − 2년 전 (3% + 1%) = 3%p 증가.", "trap": "환율 효과는 지속가능하지 않으므로 뺀다. 물량만 보면 2%.", "f": "지속가능 성장 = 물량 성장 + 가격 성장", "why": {"A": "물량 변화만 보고 가격 변화를 빠뜨림.", "C": "환율 효과가 포함된 순매출 성장 변화(10% − 3%)."}, "orig": "Mock 3 Session 2 Q22", "conf": false}, {"id": "mock3-Q67", "src": "정답", "module": "FSA", "tag": "누적환산조정 (현재환율법)", "vig": 16, "stem": "Belle should report its cumulative translation adjustment as:", "opts": {"A": "a component of non-operating income.", "B": "a component of other operating income.", "C": "a separate component of stockholders' equity."}, "ans": "C", "en": "A. a component of non-operating income. — Incorrect\nIncorrect because this represents a potential treatment of a foreign currency transaction and not a translation adjustment. The two most common treatments (of foreign currency transaction gains and losses, not translation adjustments) are either (1) as a component of other operating income/expense or (2) as a component of non-operating income. Belle uses the current rate method, and when the current rate method is used, the cumulative translation adjustment needed to keep the translated balance sheet in balance is reported as a separate component of stockholders’ equity.\nB. a component of other operating income. — Incorrect\nIncorrect because Belle uses the current rate method and this represents treatment under the temporal method. Under both international and US accounting standards, when the temporal method is used, the translation adjustment needed to keep the translated balance sheet in balance is reported as a gain or loss in net income.\nIt also represents a potential treatment of a foreign currency transaction, not a translation adjustment. The two most common treatments (of foreign currency transaction gains and losses, not translation adjustments) are either (1) as a component of other operating income/expense or (2) as a component of non-operating income.\nC. a separate component of stockholders' equity. — Correct\nCorrect because Belle uses the current rate method, and when the current rate method is used, the cumulative translation adjustment needed to keep the translated balance sheet in balance is reported as a separate component of stockholders’ equity.", "ko": "Belle는 현재환율법을 쓰므로 누적환산조정(CTA)은 자본의 별도 항목(OCI 누적)으로 보고한다.", "trap": "환산손익이 손익계산서로 가는 것은 시제법(temporal).", "f": "", "why": {"A": "외화거래 손익의 처리 방식이지 환산조정이 아니다.", "B": "시제법의 처리 방식."}, "orig": "Mock 3 Session 2 Q23", "conf": true}, {"id": "mock3-Q68", "src": "오답", "module": "FSA", "tag": "고인플레이션 자회사 토지 (IFRS)", "vig": 16, "stem": "At the end of the most recent year, the value of Lindo's land (in EUR thousands) on its consolidated balance sheet should be closest to:", "opts": {"A": "528.", "B": "915.", "C": "1,100."}, "ans": "C", "en": "A. 528. — Incorrect\nIncorrect because this represents the land's value under the current rate method without restating the value.\nFCX 61,390,000 × 0.0086 EUR/FCX = EUR 527,954 ≈ EUR 528,000\nIFRS requires the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate. Non-monetary assets and non-monetary liabilities are restated for changes in the general purchasing power of the monetary unit. Most non-monetary items are carried at historical cost. In these cases, the restated cost is determined by applying to the historical cost the change in the general price index from the date of acquisition to the balance sheet date.\nB. 915. — Incorrect\nIncorrect because this is the value of the land under US GAAP. Under US GAAP, the land is valued using the temporal method (historical cost at historical rate).\nFCX 61,390,000 × 0.0149 EUR/FCX = EUR 914,711 ≈ EUR 915,000\nUS GAAP simply requires the foreign currency financial statements of such an entity to be translated as if the parent’s currency is the functional currency (i.e., the temporal method must be used with the resulting translation gain or loss reported in net income).\nC. 1,100. — Correct\nCorrect because land is a non-monetary asset. Under IFRS, the land's value in FCX is restated for inflation and then converted to EUR at the current exchange rate.\nFCX 61,390,000 × 1.38 × 1.51 = FCX 127,924,482\nFCX 127,924,482 × 0.0086 EUR/FCX ≈ EUR 1,100,151 ≈ EUR 1,100,000\nIFRS requires the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate. Non-monetary assets and non-monetary liabilities are restated for changes in the general purchasing power of the monetary unit. Most non-monetary items are carried at historical cost. In these cases, the restated cost is determined by applying to the historical cost the change in the general price index from the date of acquisition to the balance sheet date.", "ko": "IFRS(IAS 29)는 고인플레이션 경제 자회사의 비화폐성 항목을 먼저 물가로 재작성한 뒤 현재환율로 환산한다. FCX 61,390,000 × 1.38 × 1.51 = 127,924,482 × 0.0086 = EUR 1,100,151 ≈ 1,100 (천 EUR).", "trap": "US GAAP는 시제법(역사적 환율) → 915. 재작성 없이 현재환율이면 528.", "f": "IFRS: 물가 재작성 → 현재환율 환산", "why": {"A": "물가 재작성 없이 현재환율로만 환산.", "B": "US GAAP 방식(시제법, 역사적 환율 0.0149)."}, "orig": "Mock 3 Session 2 Q24", "conf": true, "my": "B"}, {"id": "mock3-Q69", "src": "정답", "module": "DER", "tag": "콜 매도 딜러의 델타 헤지", "vig": 17, "stem": "In response to the purchase of 1.46 million call options by speculators two weeks prior to expiry, the number of shares (in millions) that options dealers would likely have purchased in aggregate, is closest to:", "opts": {"A": "8.", "B": "144.", "C": "146."}, "ans": "A", "en": "A. 8. — Correct\nCorrect. Options dealers selling calls to speculators are exposed to the underlying instrument rising in price and would have to hedge their position by buying Deltac units of stock.1.46 million call options is a right to buy 146,000,000 shares where Deltac is .057. 0.057 delta units of 146 million shares = 146 million shares x .057 = 8.322 million.\nB. 144. — Incorrect\nIncorrect. The number of shares has been erroneously multiplied by Deltap 0.989 x 146 = 144.394.\nC. 146. — Incorrect\nIncorrect. Stock always has a Delta of 1 and it is not necessary to buy the same number of shares as the short options position if the Deltac is less than 1.", "ko": "콜을 판 딜러는 주가 상승에 노출되어 델타만큼 주식을 산다. 1.46m 계약 × 100주 = 146m주에 대한 권리. 146m × 콜 델타 0.057 = 8.3m주 ≈ 8.", "trap": "주식 수 전부(146m)를 사지 않는다. 풋 델타를 쓰면 144.", "f": "헤지 주식 수 = 옵션 기초주식 수 × Delta_call", "why": {"B": "콜 델타 대신 풋 델타(0.989)를 곱함.", "C": "델타가 1보다 작으면 같은 수의 주식을 살 필요가 없다."}, "orig": "Mock 3 Session 2 Q25", "conf": true}, {"id": "mock3-Q70", "src": "오답", "module": "DER", "tag": "역사적 vs 내재 변동성", "vig": 17, "stem": "Uder's comments on the importance of volatility information of the New Optics stock are most likely:", "opts": {"A": "correct.", "B": "incorrect with respect to the use of the BSM model.", "C": "incorrect with respect to gauging uncertainty going forward."}, "ans": "C", "en": "A. correct. — Incorrect\nIncorrect. Uder is incorrect with respect to determining perceived uncertainty going forward, future uncertainty using historical volatility. Also, the correct measure is known as implied volatility. He is correct with regard to the use of the BSM model to calculate perceived uncertainty going forward, that is implied volatility.\nB. incorrect with respect to the use of the BSM model. — Incorrect\nIncorrect. The BSM model is indeed used to calculate volatility going forward, otherwise known as implied volatility.\nC. incorrect with respect to gauging uncertainty going forward. — Correct\nCorrect. Historical volatility is realized volatility and not used in options pricing to determine future, or implied, volatility. Implied volatility is the perceived uncertainty going forward and not the same as historical volatility.", "ko": "역사적 변동성은 이미 실현된 변동성이다. 앞으로의 불확실성은 옵션가격에서 BSM으로 역산한 내재변동성이 보여 준다. Uder가 역사적 변동성으로 미래 불확실성을 판단한다고 한 부분이 틀렸다.", "trap": "BSM으로 내재변동성을 구하는 것은 맞다. 틀린 부분은 미래 불확실성 판단.", "f": "", "why": {"A": "미래 불확실성을 역사적 변동성으로 본 부분이 틀렸다.", "B": "BSM으로 내재변동성(미래 변동성)을 계산하는 것은 맞다."}, "orig": "Mock 3 Session 2 Q26", "conf": true, "my": "B"}, {"id": "mock3-Q71", "src": "오답", "module": "DER", "tag": "딜러=감마, 옵션 매수자=세타", "vig": 17, "stem": "The Greek letters representing the greatest risks to the two groups of market participants cited by Edel are most likely:", "opts": {"A": "delta and rho.", "B": "vega and delta.", "C": "gamma and theta."}, "ans": "C", "en": "A. delta and rho. — Incorrect\nIncorrect. Delta is the change in the option for a change in the stock price. While related to gamma, it is not the primary risk for options dealers. Rho is the change in the option's price for a given change in the risk-free interest rate and is not a significant risk for speculators.\nB. vega and delta. — Incorrect\nIncorrect. Vega is the change in the option price for a change in volatility. Dealers, hedge and seek to hold market neutral positions, would not be impacted by vega alone. Delta is the change in price of the option for a change in the stock price.\nC. gamma and theta. — Correct\nCorrect. Gamma is the change in delta as a stock price changes and measures the risk of stocks experiencing large price changes, resulting in becoming unhedged when delta hedging. Theta is the change in the option price for a change in calendar time and represents time value. As the expiry approaches, the time value reduces until it is zero at expiry, representing a risk to option purchasers, as the option value decreases.", "ko": "델타 헤지한 딜러의 가장 큰 위험은 주가가 크게 움직일 때 헤지가 깨지는 감마 위험이다. 옵션을 산 투기자의 위험은 만기가 다가올수록 시간가치가 0으로 줄어드는 세타다.", "trap": "델타는 딜러가 헤지해 두는 것이라 주 위험이 아니다. 시장중립 딜러는 베가 영향도 작다.", "f": "", "why": {"A": "델타는 헤지돼 있고 로(금리)는 주된 위험이 아니다.", "B": "중립 포지션 딜러는 베가 영향이 작고 델타도 헤지돼 있다."}, "orig": "Mock 3 Session 2 Q27", "conf": false, "my": "B"}, {"id": "mock3-Q72", "src": "정답", "module": "DER", "tag": "만기 2주 전 포지션 손익", "vig": 17, "stem": "According to the data in Exhibit 1, the position resulting in the greatest USD profit beginning two weeks to expiry would most likely have been realized initiating a position combining:", "opts": {"A": "long calls and long puts.", "B": "long puts and long stocks.", "C": "long calls and short stocks."}, "ans": "B", "en": "A. long calls and long puts. — Incorrect\nIncorrect. The 90 puts would have cost 42.97 and would have expired worthless if the stock rose to 140. The 90 calls would have cost 0.15 and had a price of 50 at expiration resulting in a profit of 49.85 for the call and a loss of 42.97 for the put.\nB. long puts and long stocks. — Correct\nCorrect. The 90 puts would have cost 42.97 and would have expired worthless if the stock rose to 140. The stocks would have produced a gain of 93 (140 - 47) resulting in a profit of 50.03.\nC. long calls and short stocks. — Incorrect\nIncorrect. The 90 calls would hedge the short stock position after the stock price rose above 90, however the stocks would have had a loss between 47 and 90 of 43. The terminal call price of 50 would have had the combination result in a net gain of 6.85 ((50-0.15)-43) = 6.85", "ko": "주가가 47에서 140으로 올랐다. 90 풋(42.97에 매수)은 무가치로 끝나고, 주식은 93(140 − 47) 이익 → 순이익 50.03으로 가장 크다.", "trap": "콜+공매도는 47~90 구간 공매도 손실이 커서 이익이 작다.", "f": "", "why": {"A": "콜(0.15 → 50, 이익 49.85) − 풋 손실 42.97 = 6.88로 롱 풋+주식(50.03)보다 작다.", "C": "콜은 90 위에서만 공매도를 헤지해 47~90 구간 손실이 난다."}, "orig": "Mock 3 Session 2 Q28", "conf": true}, {"id": "mock3-Q73", "src": "정답", "module": "PM", "tag": "가치 추가 분해: 자산배분 vs 종목선택", "vig": 18, "stem": "For the Dynamo Fund, the value added from asset allocation over the past year was:", "opts": {"A": "less than the value added from security selection.", "B": "equal to the value added from security selection.", "C": "greater than the value added from security selection."}, "ans": "B", "en": "A. less than the value added from security selection. — Incorrect\nIncorrect because the value added from asset allocation is equal to the value added from security selection.\nAn example of how this conclusion may be derived is if value added from security selection is incorrectly calculated as follows:\nThe strategic asset allocation weights multiplied by the fund returns is [(60% × –16%) + (40% × –12%)] = –14.4%.\nThe benchmark return is [(60% × –20%) + (40% × –10%)] = –16.0%.\n–14.4% – (–16.0%) = 1.6%, which may be interpreted as the value added from security selection, and this is greater than the value added from asset allocation (1.0%).\nB. equal to the value added from security selection. — Correct\nCorrect because the total value added equals 2% with the value added from asset allocation being 1% and the value added from security selection being 1%.\nValue added from various sources is calculated from the following equation. The first (parenthetical) term is the value added from the asset allocation decision. The second (parenthetical) term is the value added from security selection within the stock and bond portfolios.\nRA = (Δwstocks RB,stocks + Δwbonds RB,bonds) + (wP,stocks RA,stocks + wP,bonds RA,bonds)\nwhere:\nRA = return from active management\nΔwstocks = fund allocation to equities minus strategic asset allocation to equities\nRB,stocks = benchmark return for equities\nΔwbonds = fund allocation to bonds minus strategic asset allocation to bonds\nRB,bonds = benchmark return for bonds\nwP,stocks = portfolio weight to equities\nRA,stocks = fund's return for equities minus benchmark return for equities\nwP,bonds = portfolio weight to bonds\nRA,bonds = fund's return for bonds minus benchmark return for bonds\nValue added from asset allocation:\nEquities weight differential: 50% – 60% = –10% (underweight)\nDifferential multiplied by benchmark return: –10% × –20% = 2%\nBonds weight differential: 50% – 40% = 10% (overweight)\nDifferential multiplied by benchma

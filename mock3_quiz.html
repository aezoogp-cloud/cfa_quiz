<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 3 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.jump{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.jump select,.jump input{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:inherit}
.jump select{flex:1;min-width:0;max-width:100%}
.jump input{width:72px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.btn.flag{padding:3px 10px;font-size:13px}
.btn.flag.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.pill.src-flag{background:var(--bad-soft);color:var(--bad)}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
/* 지문 왼쪽 · 문제/해설 오른쪽 (cmock처럼) */
body.wide .wrap{max-width:1440px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
.split .card{margin-top:0}
.vpane{position:sticky;top:104px;max-height:calc(100vh - 116px);overflow:auto;background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:12px;padding:12px 18px 16px;font-size:14.5px}
.vpane .vhead{font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:4px}
.vpane p{margin:.5em 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.vpane{position:static;max-height:42vh}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Mock 3 오답 퀴즈<span>CFA Level II, CFA Institute 모의고사</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>

</div></header>

</main>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock3", "title": "Mock 3"}, "questions": [{"id": "mock3-Q1", "src": "정답", "module": "EQ", "tag": "FCFE vs 잔여이익 모형 선택", "vig": 0, "stem": "Which of the following is the best reason to use Model 3 rather than Model 2 to value a company?", "opts": {"A": "The investor takes a control perspective", "B": "The company's residual net income is negative", "C": "The company's expected free cash flow is negative"}, "ans": "A", "en": "A. The investor takes a control perspective — Correct\nCorrect because (Model 3) FCFE also represents cash flow that can be redeployed outside the company without affecting the company’s capital investments. A controlling equity interest can bring about such redeployment. As a result, free cash flow valuation is appropriate for investors who want to take a control perspective. Residual income valuation (Model 2) does not indicate how much free cash is available for outside deployment. Generally, defining returns as free cash flow and using the FCFE (and FCFF) models are most suitable when the investor takes a control perspective.\nB. The company's residual net income is negative — Incorrect\nIncorrect because a negative residual net income is not a reason to prefer FCFE valuation (Model 3) over residual income valuation (Model 2). The residual income model can value a firm even if residual income is negative. A company that is generating more income than its cost of obtaining capital—that is, one with positive residual income—is creating value. Conversely, a company that is not generating enough income to cover its cost of capital—that is, a company with negative residual income—is destroying value. Thus, all else equal, higher (lower) residual income should be associated with higher (lower) valuations.\nC. The company's expected free cash flow is negative — Incorrect\nIncorrect because negative free cash flow is a reason to prefer residual income valuation (Model 2) over FCFE valuation (Model 3). Generally, the definition of returns as residual income, and the residual income model, is most suitable when:\nthe company is not paying dividends, as an alternative to a free cash flow model, or\nthe company’s expected free cash flows are negative within the analyst’s comfortable forecast horizon.", "ko": "FCFE는 회사 투자에 영향을 주지 않고 밖으로 돌려쓸 수 있는 현금이다. 지배지분을 가진 투자자는 이 현금의 사용처를 바꿀 수 있으므로 지배(control) 관점이면 FCFE 모형이 알맞다. 잔여이익 모형은 밖으로 쓸 수 있는 현금이 얼마인지 보여 주지 않는다.", "trap": "FCF가 음수면 오히려 잔여이익 모형을 쓴다. 잔여이익이 음수여도 RI 모형은 쓸 수 있다.", "f": "", "why": {"B": "잔여이익이 음수여도 RI 모형으로 가치평가 가능, FCFE를 고를 이유가 아니다.", "C": "FCF가 음수면 FCFE보다 잔여이익 모형이 낫다(반대 방향)."}, "orig": "Mock 3 Session 1 Q1", "conf": false}, {"id": "mock3-Q2", "src": "정답", "module": "EQ", "tag": "PVGO로 선행 P/E", "vig": 0, "stem": "Castor Industries' leading P/E ratio based on its present value of growth opportunities (PVGO) is closest to:", "opts": {"A": "15.", "B": "17.", "C": "24."}, "ans": "A", "en": "A. 15. — Correct\nCorrect because by the following equation:\nP0/E1 = 1/r + PVGO/E1, where\nP0/E1 = leading P/E ratio,\nr = required return on equity = 12%\nPVGO = present value of growth opportunities = $16.52\nE1 = expected next-period earnings = $2.65\nP0/E1 = 1/0.12 + $16.52/$2.65 = 14.57 ≈ 15\nB. 17. — Incorrect\nIncorrect because ROA is used instead of the required return on equity.\nP0/E1 = 1/ROA + PVGO/E1 = 1/0.09 + $16.52/$2.65 = 17.345 ≈ 17\nC. 24. — Incorrect\nIncorrect because the expected next-period dividend is used instead of earnings.\nSince the payout ratio is given, expected dividends = payout ratio × expected earnings = 0.4 × $2.65 = $1.06. Then,\nP0/E1 = 1/r + PVGO/D1 = 1/0.12 + $16.52/$1.06 = 23.92 ≈ 24", "ko": "선행 P/E = 1/r + PVGO/E1. r = 12%, PVGO = $16.52, E1 = $2.65이므로 1/0.12 + 16.52/2.65 = 8.33 + 6.23 = 14.57 ≈ 15.", "trap": "r 자리에 ROA(9%)를 넣으면 17, E1 대신 배당을 넣으면 24.", "f": "P0/E1 = 1/r + PVGO/E1", "why": {"B": "요구수익률 대신 ROA 9%를 사용.", "C": "분모에 이익 대신 다음 기 배당(배당성향 × E1)을 사용."}, "orig": "Mock 3 Session 1 Q2", "conf": true}, {"id": "mock3-Q3", "src": "정답", "module": "EQ", "tag": "지속가능 성장률 g = b × ROE", "vig": 0, "stem": "Castor Industries' sustainable growth rate is closest to:", "opts": {"A": "3.2%.", "B": "5.4%.", "C": "9.2%."}, "ans": "C", "en": "A. 3.2%. — Incorrect\nIncorrect because the equity multiplier = (Total Assets/Shareholders' Equity) is incorrectly used as (Shareholders' Equity/Total Assets).\nThen, ROE = ROA × (Shareholders' Equity/Total Assets) = 9% × ($45/$77) = 5.26% and\ng = b × ROE = 0.6 × 5.26% = 3.156% ≈ 3.2%\nB. 5.4%. — Incorrect\nIncorrect because g is calculated using ROA instead of ROE.\ng = b × ROA = (1 – payout ratio) × ROA = 0.6 × 9% = 5.4%\nC. 9.2%. — Correct\nCorrect because the sustainable growth rate, g, is given by:\ng = b × ROE, where\nb = retention ratio = (Net Income – Dividends)/Net Income = (1 – payout ratio) and\nROE = (Net Income/Sales) × (Sales/Total Assets) × (Total Assets/Shareholders' Equity)\nbut ROA = (Net Income/Sales) × (Sales/Total Assets), so\nROE = ROA × (Total Assets/Shareholders' Equity) = 9% × ($77/$45) = 15.4%\nThen, g = (1 – 0.4) × 15.4% = 9.24% ≈ 9.2%", "ko": "ROE = ROA × (총자산/자기자본) = 9% × (77/45) = 15.4%. 유보율 b = 1 − 배당성향 0.4 = 0.6. g = 0.6 × 15.4% = 9.24% ≈ 9.2%.", "trap": "ROE 대신 ROA를 쓰면 5.4%, 자산승수를 뒤집으면(SE/TA) 3.2%.", "f": "g = b × ROE, ROE = ROA × (TA/SE)", "why": {"A": "자산승수를 자기자본/총자산으로 뒤집어 ROE를 과소 계산.", "B": "ROE 대신 ROA로 g를 계산(0.6 × 9%)."}, "orig": "Mock 3 Session 1 Q3", "conf": false}, {"id": "mock3-Q4", "src": "정답", "module": "EQ", "tag": "잔여이익 RI1 = E1 − r·B0", "vig": 0, "stem": "Castor Industries' expected residual income per share in the next period is closest to:", "opts": {"A": "–$1.01.", "B": "$0.58.", "C": "$1.10."}, "ans": "B", "en": "A. –$1.01. — Incorrect\nIncorrect because the expected dividend is used in place of expected earnings, so\nRIt = Dt – rBt–1, and\nEt is period t expected earnings per share = $2.65,\nr is the required rate of return on equity = 0.12,\nBt–1 is period t–1 book value per share = $17.25.\nD1 = E1 × payout ratio = $2.65 × 0.4 = $1.06\nThen, RI1 = $1.06 – 0.12 × $17.25 = –$1.01\nB. $0.58. — Correct\nCorrect because residual income, RI, in period t is defined by:\nRIt = Et – rBt–1, where\nEt is period t expected earnings per share = $2.65,\nr is the required rate of return on equity = 0.12,\nBt–1 is period t–1 book value per share = $17.25.\nThen, RI1 = E1 – rB0 = $2.65 – 0.12 × $17.25 = $0.58\nC. $1.10. — Incorrect\nIncorrect because ROA is used in the formula instead of r,\nRIt = Et – ROA × Bt–1, where\nEt is period t expected earnings per share = $2.65,\nROA is the return on assets = 0.09,\nBt–1 is period t–1 book value per share = $17.25.\nThen, RI1 = E1 – ROA × B0 = $2.65 – 0.09 × $17.25 = $1.0975 ≈ $1.10", "ko": "RI1 = E1 − r × B0 = $2.65 − 0.12 × $17.25 = $2.65 − $2.07 = $0.58.", "trap": "이익 대신 배당을 넣거나 r 대신 ROA를 쓰면 안 된다.", "f": "RI_t = E_t − r × B_(t−1)", "why": {"A": "E1 대신 예상 배당을 넣어 계산.", "C": "요구수익률 r 대신 ROA로 자본비용을 계산."}, "orig": "Mock 3 Session 1 Q4", "conf": false}, {"id": "mock3-Q5", "src": "정답", "module": "CI", "tag": "자본비용 변화 요인 (유형자산 비중)", "vig": 1, "stem": "Which of the factors identified by Sylvester would most likely explain the recent change in Palmco's cost of capital?", "opts": {"A": "Factor 1", "B": "Factor 2", "C": "Factor 3"}, "ans": "C", "en": "A. Factor 1 — Incorrect\nIncorrect because a company with higher environmental, social, and governance (ESG) risk is likely to have a higher, not lower, cost of capital.\nB. Factor 2 — Incorrect\nIncorrect because the ERP (equity risk premium) demanded by investors tends to increase during recessions and decrease during expansionary times. Thus, if the market has moved into a recessionary period, it is likely that Palmco's cost of capital will have increased, not decreased.\nC. Factor 3 — Correct\nCorrect because, in general, companies with primarily tangible assets are likely to be able to access debt capital at lower cost than companies with a high proportion of intangible assets because they have the ability to pledge these assets as collateral. Thus, significantly reducing the proportion of intangible assets on Palmco's balance sheet is consistent with a decrease in the cost of capital.", "ko": "유형자산이 많은 회사는 담보로 잡힐 자산이 있어 더 싸게 빌릴 수 있다. Palmco가 무형자산 비중을 크게 줄였으므로(Factor 3) 자본비용이 낮아진 것과 맞는다.", "trap": "ESG 위험이 높아지면 자본비용은 오른다. ERP는 불황에 오르고 호황에 내린다.", "f": "", "why": {"A": "ESG 위험이 높은 회사는 자본비용이 더 높다(낮아질 이유가 아님).", "B": "경기침체로 가면 ERP가 올라 자본비용은 오히려 높아진다."}, "orig": "Mock 3 Session 1 Q5", "conf": false}, {"id": "mock3-Q6", "src": "정답", "module": "CI", "tag": "역사적 ERP 추정의 단점", "vig": 1, "stem": "Which of the following is most likely a disadvantage of Sylvester's initial method for estimating Palmco's cost of equity?", "opts": {"A": "The estimates are sensitive to extreme values", "B": "Survivorship bias tends to deflate the estimates", "C": "The proxy used for the risk-free rate is not completely risk free due to unknown coupon reinvestment rates"}, "ans": "A", "en": "A. The estimates are sensitive to extreme values — Correct\nCorrect because the use of an arithmetic mean when calculating historic returns is sensitive to extreme values.\nB. Survivorship bias tends to deflate the estimates — Incorrect\nIncorrect because survivorship bias tends to inflate, not deflate, historical estimates of the ERP (equity risk premium). This bias is present in equity market data when poorly performing or defunct companies are removed from index membership, so that only relative winners remain represented in index performance.\nC. The proxy used for the risk-free rate is not completely risk free due to unknown coupon reinvestment rates — Incorrect\nIncorrect because short-term government bills do not typically pay coupons and so coupon reinvestment rates would not introduce any risk into the proxy for the risk-free rate. The coupon reinvestment rate can become a problem when using long-term government bond yields to proxy the risk-free rate. The YTM is not a completely risk-free return at the time of purchase because of unknown coupon reinvestment rates.", "ko": "과거 수익률의 산술평균으로 ERP를 구하면 극단값에 민감하다.", "trap": "생존 편향은 ERP를 부풀린다(줄이지 않음). 단기 국채(T-bill)는 쿠폰이 없어 재투자 위험이 없다.", "f": "", "why": {"B": "생존 편향은 추정치를 낮추는 게 아니라 높인다.", "C": "단기 국채는 쿠폰이 없어 쿠폰 재투자율 문제가 없다."}, "orig": "Mock 3 Session 1 Q6", "conf": false}, {"id": "mock3-Q7", "src": "오답", "module": "CI", "tag": "비교 거래법 인수가격", "vig": 1, "stem": "Using Sylvester's comparable transaction method, the estimated share price at which Spritz can be acquired is closest to:", "opts": {"A": "£56.53.", "B": "£64.55.", "C": "£67.07."}, "ans": "B", "en": "A. £56.53. — Incorrect\nIncorrect because the per share metrics are averaged before the ratio is computed and Spritz's takeover value is determined. That is, the multiple is incorrectly calculated as:\n[0.52 + 3.15] / 2 = 3.67 / 2 = 1.835 for Company 1;\n[1.36 + 10.05] / 2 = 11.41 / 2 = 5.705 for Company 2; and\n[3.24 + 15.62] / 2 = 18.86 / 2 = 9.430 for Spritz.\nThus, the fair takeover value implied by each company is:\nCompany 1: (£10.55 / 1.835) × 9.430 = £54.2161; and\nCompany 2: (£35.60 / 5.705) × 9.430 = £58.8445.\nYielding an average value of £[54.2161 + 58.8445] / 2 = £56.53.\nB. £64.55. — Correct\nCorrect because the average price multiples implied by the metrics in Exhibit 1 are calculated as:\nP/E: [(10.55 / 0.52) + (35.60 / 1.36)] / 2 = 46.465 / 2 = 23.232;\nP/BV: [(10.55 / 3.15) + (35.60 / 10.05)] / 2 = 6.891 / 2 = 3.446.\nHence, the estimated fair takeover value for Spritz implied by each metric is:\nP/E: 23.232 × £3.24 = £75.27;\nP/BV: 3.446 × £15.62 = £53.82.\nFinally, the average implied takeover value is:\n£[75.27 + 53.82] / 2 = £64.55.\nC. £67.07. — Incorrect\nIncorrect because the comparable company metrics are averaged, before the ratio is computed and Spritz's takeover value determined. That is, the average transaction price of the two companies is calculated as £[10.55 + 35.60] / 2 = £23.075. Then the average metrics are:\n£[0.52 + 1.36] / 2 = £1.88 / 2 = £0.94, for earnings per share; and\n£[3.15 + 10.05] / 2 = £13.20 / 2 = £6.60, for book value per share.\nLeading to the following valuation multiples:\nP/E: 23.075 / 0.94 = 24.548;\nP/BV: 23.075 / 6.60 = 3.496,\nand an estimated fair takeover value for Spritz implied by each metric as:\nP/E: 24.548 × £3.24 = £79.535;\nP/BV: 3.496 × £15.62 = £54.611.\nFinally, the average implied takeover value is:\n£[79.535 + 54.611] / 2 = £67.07.", "ko": "거래별로 배수를 먼저 구하고 평균한다. P/E = [(10.55/0.52) + (35.60/1.36)]/2 = 23.232, P/BV = [(10.55/3.15) + (35.60/10.05)]/2 = 3.446. Spritz 적용: 23.232 × £3.24 = £75.27, 3.446 × £15.62 = £53.82. 평균 (75.27 + 53.82)/2 = £64.55.", "trap": "가격·지표를 먼저 평균하고 나눠 배수를 만들면 틀린다(평균의 비율 ≠ 비율의 평균).", "f": "배수 = 각 거래 (가격/지표)의 평균 → × 대상 지표 → 두 값 평균", "why": {"A": "주당 지표를 먼저 평균한 뒤 배수를 계산.", "C": "비교 회사 가격·지표를 먼저 평균한 뒤 배수를 계산."}, "orig": "Mock 3 Session 1 Q7", "conf": true, "my": "C"}, {"id": "mock3-Q8", "src": "오답", "module": "CI", "tag": "인수 후 자본구조", "vig": 1, "stem": "Palmco's capital structure after acquiring Spritz is closest to:", "opts": {"A": "54.8% debt and 45.2% equity.", "B": "55.6% debt and 44.4% equity.", "C": "58.8% debt and 41.2% equity."}, "ans": "C", "en": "A. 54.8% debt and 45.2% equity. — Incorrect\nIncorrect because this is Palmco's capital structure before, not after, acquisition. Palmco's current book value of debt is £850 million and its current market value of equity can be computed as: £28.00 × 25 million shares outstanding = £700 million. Hence, pre-acquisition, Palmco will have:\n£850m / £[850 + 700]m = 850 / 1,550 = 0.5484 ≈ 54.8% debt; and\n£700m / £[850 + 700]m = 700 / 1,550 = 0.4516 ≈ 45.2% equity.\nB. 55.6% debt and 44.4% equity. — Incorrect\nIncorrect because this capital structure neglects Spritz's existing debt that is assumed by Palmco upon acquisition. Hence, Palmco's debt after acquisition would be computed only as its debt prior to acquisition (£850 million) plus the new debt issued (£200 million), giving a post-acquisition debt value of £1,050 million. Coupled with the post-acquisition equity value of £28.00 × (25 + 5) million = £840 million, Palmco's capital structure after acquisition will be computed as:\n£1,050m / £[1,050 + 840]m = 1,050 / 1,890 = 0.5556 = 55.6% debt; and\n£840m / £[1,050 + 840]m = 840 / 1,890 = 0.4444 = 44.4% equity.\nC. 58.8% debt and 41.2% equity. — Correct\nCorrect because Palmco's debt after acquisition will be equal to its debt prior to acquisition (£850 million) plus the assumed Spritz debt (£150 million) and the new debt issued (£200 million). This gives a post-acquisition debt value of £1,200 million. In addition to the 25 million existing shares outstanding, Palmco has also issued 5 million new shares to existing Spritz shareholders as part of the takeover offer. Therefore, Palmco's post-acquisition equity value is computed as £28.00 × 30 million = £840 million. Hence, post-acquisition, Palmco will have:\n£1,200m / £[1,200 + 840]m = 1,200 / 2,040 = 0.5882 = 58.8% debt; and\n£840m / £[1,200 + 840]m = 840 / 2,040 = 0.4118 = 41.2% equity.", "ko": "부채 = 기존 £850m + 인수한 Spritz 부채 £150m + 새로 발행 £200m = £1,200m. 주식 = (기존 25m + 신규 5m) × £28 = £840m. 부채 비중 = 1,200/2,040 = 58.8%, 자기자본 41.2%.", "trap": "Spritz에서 넘겨받는 부채(£150m)를 빠뜨리기 쉽다.", "f": "D/(D+E), 인수 후 D·E에 인수 부채·신주 포함", "why": {"A": "인수 전 자본구조.", "B": "Spritz에서 인수하는 기존 부채를 빠뜨림."}, "orig": "Mock 3 Session 1 Q8", "conf": true, "my": "B"}, {"id": "mock3-Q9", "src": "오답", "module": "FSA", "tag": "CET1 비율", "vig": 2, "stem": "Acme's Common Equity Tier 1 Capital Ratio for the most recent year is closest to:", "opts": {"A": "9%.", "B": "14%.", "C": "17%."}, "ans": "B", "en": "A. 9%. — Incorrect\nIncorrect because this calculation uses total book assets (instead of risk-weighted assets):\n(Common stockholders' equity – Intangible assets – Deferred tax assets) / Total book assets = (176,400 – 18,784 – 7,986)/1,596,723 = 0.0937107 ≈ 9%.\nB. 14%. — Correct\nCorrect because Acme's Common Equity Tier 1 Capital Ratio is closest to 14%:\n(Common stockholders' equity – Intangible assets – Deferred tax assets) / Total risk-weighted assets = (176,400 – 18,784 – 7,986)/1,042,361 = 0.143549 ≈ 14%.\nCommon Equity Tier 1 Capital includes common stock, issuance surplus related to common stock, retained earnings, accumulated other comprehensive income, and certain adjustments, including the deduction of intangible assets and deferred tax assets.\nC. 17%. — Incorrect\nIncorrect because this calculation ignores intangible assets and deferred tax assets:\nCommon stockholders' equity / Total risk-weighted assets = 176,400/1,042,361 = 0.1692312 ≈ 17%.", "ko": "CET1 = 보통주 자본 − 무형자산 − 이연법인세자산 = 176,400 − 18,784 − 7,986 = 149,630. ÷ 위험가중자산 1,042,361 = 14.4% ≈ 14%.", "trap": "분모는 총자산이 아니라 위험가중자산. 무형자산·DTA를 빼야 한다.", "f": "CET1 ratio = (보통주 자본 − 무형자산 − DTA) / RWA", "why": {"A": "분모에 위험가중자산 대신 총자산을 사용.", "C": "무형자산·이연법인세자산을 빼지 않음."}, "orig": "Mock 3 Session 1 Q9", "conf": false, "my": "C"}, {"id": "mock3-Q10", "src": "정답", "module": "FSA", "tag": "은행 이익의 질 (수익 구성)", "vig": 2, "stem": "Based on the stated earnings sources, earnings quality is most likely highest for:", "opts": {"A": "Acme.", "B": "Competitor 1.", "C": "Competitor 2."}, "ans": "C", "en": "A. Acme. — Incorrect\nIncorrect because, although Acme has the highest percentage of net fee income (22.7%), combined earnings from net interest income and net fee income (69.0%) are less than for Competitor 2 (72.5%). Further, Acme's percentage of net trading income (16.2%), considered a less sustainable source of earnings, is higher than Competitor 2's (13.4%).\nB. Competitor 1. — Incorrect\nIncorrect because Competitor 1 has the highest percentage of net trading income (20.3%), which is considered a less sustainable source of earnings.\nC. Competitor 2. — Correct\nCorrect because the quality of earnings is directly related to the level of sustainable sources of income. Further, regarding sustainability of a bank’s earnings, it is important to examine the composition of earnings. Banks’ earnings typically comprise (a) net interest income (the difference between interest earned on loans minus interest paid on the deposits supporting those loans), (b) service income, and (c) trading income. Of these three general sources, trading income is typically the most volatile. Thus, a greater proportion of net interest income and service income is typically more sustainable than trading income.\nNet trading income comprises the lowest percentage of total operating income for Competitor 2 (13.4%) versus Acme (16.2%) or Competitor 1 (20.3%). Further, net interest income and net fee income collectively comprise a greater percentage of total operating income for Competitor 2 (51.6% + 20.9% = 72.5%) versus Acme (46.3% + 22.7% = 69.0%) or Competitor 1 (46.5% + 19.8% = 66.3%). Based on this information, Competitor 2 has the highest-quality earnings.", "ko": "트레이딩 이익은 가장 변동성이 크고 지속성이 낮다. 순이자이익과 수수료이익 비중이 높을수록 이익의 질이 높다. Competitor 2가 트레이딩 이익 비중이 가장 낮다. 이자+수수료 비중: Competitor 2 72.5% > Acme 69.0%, 트레이딩 비중: Competitor 2 13.4% < Acme 16.2% < Competitor 1 20.3%.", "trap": "수수료 비중이 가장 높은 곳(Acme)이 아니라 이자+수수료 합계가 높고 트레이딩이 낮은 곳을 본다.", "f": "", "why": {"A": "수수료 비중은 높지만 이자+수수료 합계가 Competitor 2보다 낮다.", "B": "트레이딩 이익 비중이 가장 높아(20.3%) 지속성이 가장 낮다."}, "orig": "Mock 3 Session 1 Q10", "conf": false}, {"id": "mock3-Q11", "src": "오답", "module": "FSA", "tag": "주식보상 세금 혜택 (US GAAP)", "vig": 2, "stem": "The change in Acme's share price between the initial grant date and the settlement date will most likely cause its current-year net income to:", "opts": {"A": "decrease.", "B": "not change.", "C": "increase."}, "ans": "C", "en": "A. decrease. — Incorrect\nIncorrect because a higher share price on the settlement date will result in a larger tax deduction (i.e., excess tax benefit or tax windfall), which will decrease income tax expense and increase net income.\nB. not change. — Incorrect\nIncorrect because Acme complies with US GAAP (not IFRS) and, as a result, a change in share price between the initial grant date and the settlement date will result in an increase or decrease in net income. Under IFRS, tax windfalls and shortfalls are recognized directly in equity as gains and losses, respectively. Under US GAAP, they are included as decreases and increases, respectively, in income tax expense on the income statement.\nC. increase. — Correct\nCorrect because Acme complies with US GAAP and the share price increase between the initial grant date and the settlement (vesting) date will decrease income tax expense and increase net income. A higher share price at settlement versus the grant date results in a higher tax deduction than the cumulative stock-based compensation expense. This is known as an excess tax benefit or tax windfall because taxable income and tax expense are reduced. Under IFRS, tax windfalls and shortfalls are recognized directly in equity as gains and losses, respectively. Under US GAAP, they are included as decreases and increases, respectively, in income tax expense on the income statement.", "ko": "부여일보다 정산일 주가가 오르면 세법상 공제가 누적 보상비용보다 커진다(초과 세금 혜택, tax windfall). US GAAP는 이를 법인세비용 감소로 손익에 반영하므로 순이익이 늘어난다. IFRS는 자본에 직접 반영.", "trap": "IFRS였다면 순이익 변화 없음(자본 직접 반영). Acme는 US GAAP.", "f": "", "why": {"A": "주가 상승은 세금 공제를 늘려 법인세비용을 줄인다(순이익 증가).", "B": "IFRS 처리. US GAAP는 손익의 법인세비용에 반영."}, "orig": "Mock 3 Session 1 Q11", "conf": true, "my": "B"}, {"id": "mock3-Q12", "src": "정답", "module": "FSA", "tag": "연금비용 (손익계산서, US GAAP)", "vig": 2, "stem": "The pension cost (in $ millions) that Acme should report in its income statement for the most recent year is:", "opts": {"A": "459.", "B": "521.", "C": "686."}, "ans": "C", "en": "A. 459. — Incorrect\nIncorrect because this answer adds the difference between the actual return and expected return to the service cost and ignores the interest cost. Hence, the incorrect pension cost (in $ millions) would be:\n294 current service cost + 165 difference between actual and expected return on plan assets (2,240 – 2,075) = 459.\nB. 521. — Incorrect\nIncorrect because this answer uses the actual return on plan assets (2,240) instead of the expected return on plan assets. Hence, the incorrect pension cost (in $ millions) would be:\n294 current service cost + 2,467 interest cost – 2,240 actual return on plan assets = 521.\nC. 686. — Correct\nCorrect because the components of pension cost on the income statement (assuming no amortization of past service costs, actuarial gains and losses, and differences between actual and expected returns on plan assets) include current service cost, interest cost, and expected return on plan assets.\nBased on the items provided in the vignette, Acme's pension cost (in $ millions) would be 686, calculated as:\n294 current service cost + 2,467 interest cost – 2,075 expected return on plan assets = 686.", "ko": "상각 항목이 없을 때 손익계산서 연금비용 = 근무원가 + 이자원가 − 기대수익. 294 + 2,467 − 2,075 = 686.", "trap": "실제수익(2,240)이 아니라 기대수익(2,075)을 뺀다.", "f": "Pension cost = Service cost + Interest cost − Expected return on plan assets", "why": {"A": "실제·기대수익 차이를 근무원가에 더하고 이자원가를 빠뜨림.", "B": "기대수익 대신 실제수익 2,240을 차감."}, "orig": "Mock 3 Session 1 Q12", "conf": false}, {"id": "mock3-Q13", "src": "정답", "module": "FI", "tag": "선도금리 f(2,1)", "vig": 3, "stem": "The 1-year forward rate two years from today in Country A is closest to:", "opts": {"A": "2.25%.", "B": "2.40%.", "C": "2.58%."}, "ans": "B", "en": "A. 2.25%. — Incorrect\nIncorrect because the par rate is used instead of spot rate in calculating the 1-year forward rate two years from today.\nZ2 = 2-Year par rate used instead of spot rate\nZ3 = 3-Year par rate used instead of spot rate\nf(2,1)= 1-year forward rate two years from today\n(1+Z3 )^3=(1+Z2)^2(1+f(2,1))\nf(2,1)= (1.0275^3/1.03^2) – 1 = 2.25182%\nB. 2.40%. — Correct\nCorrect because the way to interpret forward rates is the reinvestment rate that would make an investor indifferent between buying a three-year zero-coupon bond or investing in a two-year zero-coupon bond and at maturity reinvesting the proceeds for one year.\nZ2 = 2-Year spot rate\nZ3 = 3-Year spot rate\nf(2,1)= 1-year forward rate two years from today\n(1+Z3 )^3= (1+Z2)^2(1+f(2,1))\nf(2,1)= (1.028^3/1.03^2) – 1 = 2.4012%\nC. 2.58%. — Incorrect\nIncorrect because this is the calculation of the 2-year forward rate one year from today rather than the 1-year forward rate two years from today.\nZ1 = 1-Year spot rate\nZ3 = 3- Year spot rate\nf(1,2)= Incorrectly interpreted as the 2-year forward rate one year from today\n(1+Z3 )^3= (1+Z1)^1(1+f(1,2))^2\nf(1,2)= ((1.0280^3/1.0325^1))^(1/2)– 1 = 2.5757%", "ko": "(1 + Z3)^3 = (1 + Z2)^2 × (1 + f(2,1)). 현물금리 Z2 = 3.0%, Z3 = 2.8%이므로 f(2,1) = 1.028^3/1.03^2 − 1 = 2.40%.", "trap": "par 금리가 아니라 spot(zero) 금리를 써야 한다. f(1,2)(1년 후 2년)와 헷갈리지 말 것.", "f": "f(2,1) = (1 + Z3)^3 / (1 + Z2)^2 − 1", "why": {"A": "spot 금리 대신 par 금리를 사용.", "C": "1년 후 2년 선도금리 f(1,2)를 계산."}, "orig": "Mock 3 Session 1 Q13", "conf": false}, {"id": "mock3-Q14", "src": "정답", "module": "FI", "tag": "기대 미래 현물 < 선도 → 선도계약 가치", "vig": 3, "stem": "If the expectation of Wye Creek's economist is correct, the price of Walhan's forward contract would most likely:", "opts": {"A": "decrease.", "B": "remain unchanged.", "C": "increase."}, "ans": "C", "en": "A. decrease. — Incorrect\nIncorrect because if the trader expects the future spot rate to be above that predicted by the existing forward rate, then the forward contract value is expected to decrease and the trader would sell the forward contract. However, in this case the future spot rates are expected to be lower than the prevailing spot curve.\nB. remain unchanged. — Incorrect\nIncorrect because the forward contract price remains unchanged as long as future spot rates evolve as predicted by today’s forward curve. However, in this case the future spot rates are expected to be lower than the prevailing spot curve.\nC. increase. — Correct\nCorrect because if a trader expects the future spot rate to be below what is predicted by the prevailing forward rate, the forward contract value is expected to increase and the trader would buy the forward contract. This is consistent with the economist's expectation in the case text.", "ko": "미래 현물금리가 현재 선도금리가 예측하는 것보다 낮을 것으로 보면(이코노미스트 예상), 채권 선도계약 가치는 오를 것으로 기대된다. 그래서 선도계약을 산다.", "trap": "현물금리가 선도곡선대로 움직이면 선도계약 가격은 변하지 않는다. 예상 금리 < 선도 → 가치 상승.", "f": "", "why": {"A": "미래 금리가 선도보다 높을 것으로 볼 때의 결과.", "B": "금리가 선도곡선대로 움직일 때만 변화 없음."}, "orig": "Mock 3 Session 1 Q14", "conf": false}, {"id": "mock3-Q15", "src": "정답", "module": "FI", "tag": "선호 서식지 이론", "vig": 3, "stem": "Which of the following interest rate term structure theories is most consistent with Walhan's stated strategy in Country B?", "opts": {"A": "Preferred habitat theory", "B": "Pure expectations theory", "C": "Segmented markets theory"}, "ans": "A", "en": "A. Preferred habitat theory — Correct\nCorrect because in this case Walhan is willing to deviate from her maturity range if the expected additional returns are large enough. Preferred habitat theory is similar to the segmented markets theory in proposing that many borrowers and lenders have strong preferences for particular maturities, but it does not assert that yields at different maturities are determined independently of each other. The theory contends, however, that if the expected additional returns to be gained become large enough, institutions will be willing to deviate from their preferred maturities or habitats. For example, if the expected returns on longer-term securities exceed those on short-term securities by a large enough margin, an intermediate-term bond fund might lengthen the maturities of their assets. And if the excess returns expected from buying short-term securities become large enough, life insurance companies might stop limiting themselves to long-term securities and place a larger part of their portfolios in shorter-term investments.\nB. Pure expectations theory — Incorrect\nIncorrect because the pure expectations theory states that the forward rate is an unbiased predictor of the future spot rate; its broadest interpretation is that bonds of any maturity are perfect substitutes for one another. For example, buying a bond with a maturity of five years and holding it for three years has the same expected return as buying a three-year bond or buying a series of three one-year bonds. The predictions of the unbiased expectations theory are consistent with the assumption of risk neutrality. In a risk-neutral world, investors are unaffected by uncertainty and risk premiums do not exist.\nC. Segmented markets theory — Incorrect\nIncorrect because segmented markets theory allows for lender and borrower preferences to influence the shape of the yield curve. It states that yields are not a reflection of expected spot rates or liquidity premiums. Rather, they are solely a function of the supply and demand for funds of a particular maturity. That is, each maturity sector can be thought of as a segmented market (and investors in that maturity segment cannot leave it) in which yield is determined independently from the yields that prevail in other maturity segments. However, in this case, Walhan is willing to deviate from the maturity range for additional returns.", "ko": "Walhan은 원래 만기대를 선호하지만 기대 추가수익이 충분히 크면 다른 만기로 옮긴다. 이것이 선호 서식지(preferred habitat) 이론이다.", "trap": "분할시장 이론은 만기대를 절대 안 옮긴다. 옮길 수 있으면 선호 서식지.", "f": "", "why": {"B": "순수 기대이론은 선도금리 = 미래 현물 예측치라는 이론, 만기 선호와 무관.", "C": "분할시장 이론은 만기별 수익률이 독립적이고 만기대를 옮기지 않는다."}, "orig": "Mock 3 Session 1 Q15", "conf": false}, {"id": "mock3-Q16", "src": "정답", "module": "FI", "tag": "수익률 곡선 타기 (우상향·정적)", "vig": 3, "stem": "To implement her strategy in Country C, which of the following zero-coupon government bonds should Walhan buy?", "opts": {"A": "3-year", "B": "4-year", "C": "5-year"}, "ans": "C", "en": "A. 3-year — Incorrect\nIncorrect because when a yield curve is upward sloping, the forward curve is always above the current spot curve. If the trader expects the yield curve to remain static over an investment horizon, then buying bonds with a maturity longer than the investment horizon would provide a total return greater than the return on a maturity-matching strategy. In this case, the maturity is shorter than the investment horizon and this would be a correct answer if the yield curve is downward sloping, however, in this case it is upward sloping.\nB. 4-year — Incorrect\nIncorrect because when a yield curve is upward sloping (as specified for Country C), the forward curve is above the current spot curve. If the trader expects the yield curve to remain static over an investment horizon, then buying bonds with a maturity longer than the investment horizon would provide a total return greater than the return on a maturity-matching strategy.\nC. 5-year — Correct\nCorrect because when a yield curve is upward sloping (as specified for Country C), the forward curve is above the current spot curve. If the trader expects the yield curve to remain static over an investment horizon, then buying bonds with a maturity longer than the investment horizon would provide a total return greater than the return on a maturity-matching strategy. 5-year bond sold at the end of 4-year would provide maximum return when compared with other options.", "ko": "우상향 곡선이 그대로 유지될 것으로 보면, 투자 기간(4년)보다 만기가 긴 채권을 사서 기간 끝에 팔면 만기 일치 전략보다 수익이 크다. 보기 중 가장 긴 5년 무이표채를 사서 4년 후 판다.", "trap": "투자 기간과 같은 4년 채권은 만기 일치 전략일 뿐 추가수익이 없다.", "f": "", "why": {"A": "투자 기간보다 짧아 곡선 타기 효과가 없고 재투자가 필요.", "B": "만기 일치 전략으로 곡선 타기 추가수익이 없다."}, "orig": "Mock 3 Session 1 Q16", "conf": false}, {"id": "mock3-Q17", "src": "정답", "module": "PM", "tag": "능동수익 분해: 종목선택", "vig": 4, "stem": "For the most recent year, the return from security selection for Portfolio 1 was closest to:", "opts": {"A": "0.22%.", "B": "1.74%.", "C": "2.46%."}, "ans": "C", "en": "A. 0.22%. — Incorrect\nIncorrect because the return due to factor tilts is calculated incorrectly with the order of the portfolio sensitivity and benchmark sensitivity terms reversed in the formula for active return as follows:\nActive return = Σk=1^K {[(Benchmark sensitivity)k – (Portfolio sensitivity)k] × (Factor return)k} + Security selection\nReturn due to factor tilts would therefore be:\n{[–2.1 – (–1.5)] × 0.4%} + {[0.7 – 2.4] × (–0.8%)} = –0.24% + 1.36% = 1.12%\nThe active return is 1.34%. Therefore, the return due to security selection would be:\nActive return – Return due to factor tilts = 1.34% – 1.12% = 0.22%\nB. 1.74%. — Incorrect\nIncorrect because this would be the result if the factor surprises were deducted from the active return as follows:\nActive return – Inflation surprise – GDP growth surprise = 1.34% – 0.40% – (–0.80%) = 1.74%\nC. 2.46%. — Correct\nCorrect because the return from security selection can be calculated as the difference between active return and the return due to factor tilts.\nActive return is given by the following formula:\nActive return = Σk=1^K {[(Portfolio sensitivity)k – (Benchmark sensitivity)k] × (Factor return)k} + Security selection\nΣk=1^K{[(Portfolio sensitivity)k – (Benchmark sensitivity)k] × (Factor return)k} is the component of active return due to factor tilts.\nIn Kemp's model, the two factors are inflation and GDP growth and the relevant return driver is factor surprise.\nReturn due to factor tilts is therefore:\n{[–1.5 – (–2.1)] × 0.4%} + {[2.4 – 0.7] × (–0.8%)} = 0.24% + (–1.36%) = –1.12%\nThe active return is 1.34%. Therefore, the return due to security selection is:\nActive return – Return due to factor tilts = 1.34% – (–1.12%) = 2.46%", "ko": "팩터 틸트 수익 = Σ(포트폴리오 민감도 − 벤치마크 민감도) × 팩터 서프라이즈 = [−1.5 − (−2.1)] × 0.4% + (2.4 − 0.7) × (−0.8%) = 0.24% − 1.36% = −1.12%. 종목선택 = 능동수익 1.34% − (−1.12%) = 2.46%.", "trap": "민감도 차이의 순서를 바꾸거나 팩터 서프라이즈를 그대로 빼면 틀린다.", "f": "Active return = Σ(βp − βb) × F + Security selection", "why": {"A": "포트폴리오·벤치마크 민감도 순서를 뒤집어 팩터 틸트 계산.", "B": "능동수익에서 팩터 서프라이즈 자체를 차감."}, "orig": "Mock 3 Session 1 Q17", "conf": true}, {"id": "mock3-Q18", "src": "오답", "module": "PM", "tag": "거시 팩터 모형 잔차 εi", "vig": 4, "stem": "For the most recent year, the amount of Portfolio 2's return not explained by Kemp's model was closest to:", "opts": {"A": "–1.5%.", "B": "1.7%.", "C": "2.9%."}, "ans": "B", "en": "A. –1.5%. — Incorrect\nIncorrect because this would be the return if the anticipated factor surprises were added to the ex ante expected return (ignoring the factor sensitivities):\nRi = ai + F1 + F2 + εi\n6.0% = 8.0% + 0.5% – 1.0% + εi\n6.0% = 7.5% + εi\nTherefore, εi = 6.0% – 7.5% = –1.5%.\nB. 1.7%. — Correct\nCorrect because the two-factor macroeconomic model with interest rate (factor 1) and consumer confidence (factor 2) is given as follows:\nRi = ai + bi1F1 + bi2F2 + εi\nwhere:\nRi = the return on asset i\nai = the ex ante expected return on asset i\nbi1 = the sensitivity of the return on asset i to surprises in factor 1\nF1 = the surprise in factor 1\nbi2 = the sensitivity of the return on asset i to surprises in factor 2\nF2 = the surprise in factor 2\nεi = an error term with a zero mean that represents the portion of the return on asset i that is not explained by the factor model\nbi1 and bi2 are –1.0 and 3.2, respectively. The factor surprises are actual values less forecasted values: F1 is 7.0% – 6.5% = 0.5%; F2 is –0.5% – 0.5% = –1.0%.\nSo the return on the portfolio taking into account the surprises is:\n6.0% = 8.0% + (–1.0 × 0.5%) + (3.2 × –1.0%) + εi\n6.0% = 8.0% – 0.5% – 3.2% + εi\n6.0% = 4.3% + εi\nTherefore, εi = 6.0% – 4.3% = 1.7%.\nC. 2.9%. — Incorrect\nIncorrect because the original macroeconomic forecasts are used in the equation and not the factor surprises.\n6.0% = 8.0% + (–1.0 × 6.5%) + (3.2 × 0.5%) + εi\n6.0% = 8.0% – 6.5% + 1.6% + εi\n6.0% = 3.1% + εi\nTherefore, εi = 6.0% – 3.1% = 2.9%.", "ko": "서프라이즈 = 실제 − 예측: F1 = 7.0% − 6.5% = 0.5%, F2 = −0.5% − 0.5% = −1.0%. 6.0% = 8.0% + (−1.0 × 0.5%) + (3.2 × −1.0%) + ε = 4.3% + ε → ε = 1.7%.", "trap": "예측치 자체가 아니라 서프라이즈(실제 − 예측)를 넣는다.", "f": "Ri = ai + bi1·F1 + bi2·F2 + εi (F = 실제 − 예측)", "why": {"A": "민감도를 무시하고 서프라이즈를 기대수익에 그대로 더함.", "C": "서프라이즈 대신 원래 예측치를 식에 넣음."}, "orig": "Mock 3 Session 1 Q18", "conf": true, "my": "C"}, {"id": "mock3-Q19", "src": "정답", "module": "PM", "tag": "ETF 보유 총비용", "vig": 4, "stem": "The expected total holding period cost of investing in the US equity ETF is closest to:", "opts": {"A": "0.45%.", "B": "0.60%.", "C": "0.65%."}, "ans": "A", "en": "A. 0.45%. — Correct\nCorrect because this is the expected total cost of holding the US equity ETF over the 6-month period (excluding the compounding effect).\nThe expected total holding period cost is the sum of:\nThe management fee for the period\nRound-trip trading commissions\nBid–ask spread on purchase and sale\nThe annual management fee is 0.30%. Since the ETF is to be held for six months, the management fee is 0.5 × 0.30% = 0.15%.\nThe one-way commission is 0.05%, so the round-trip commission is 2 × 0.05% = 0.10%.\nThe bid–ask spread on the purchase and sale is 0.20%.\nThere are two trades, the purchase is assumed to occur at the ask price and the sale at the bid price, and therefore the bid–ask spread is incurred as a cost.\nThe expected total holding period cost is 0.15% + 0.10% + 0.20% = 0.45%.\nB. 0.60%. — Incorrect\nIncorrect because this would be the expected total holding period cost if the annual management fee was used instead of the management fee for a 6-month period.\nAnnual management fee of 0.30% plus the round-trip commission of 0.10% plus the bid–ask spread of 0.20% results in a total cost of 0.60%.\nC. 0.65%. — Incorrect\nIncorrect because the full bid–ask spread is assumed to be incurred on both the purchase and sale legs of the transaction.\nThe bid–ask spread of 0.20% is doubled to 0.40% and added to the 6-month management fee of 0.15% and the round-trip commission of 0.10%, resulting in a total cost of 0.65%.", "ko": "6개월 보유: 운용보수 0.30% × 0.5 = 0.15%, 왕복 수수료 2 × 0.05% = 0.10%, 매수·매도 합쳐 bid–ask 스프레드 0.20%(한쪽에 절반씩). 합계 0.15 + 0.10 + 0.20 = 0.45%.", "trap": "스프레드는 매수·매도 각각 절반씩이라 한 번만(0.20%) 더한다. 보수는 기간 비례.", "f": "총비용 = 보수 × 기간 + 왕복 수수료 + 스프레드", "why": {"B": "6개월분 대신 연간 운용보수 0.30%를 사용.", "C": "스프레드를 매수·매도 양쪽에 전부(0.40%) 반영."}, "orig": "Mock 3 Session 1 Q19", "conf": false}, {"id": "mock3-Q20", "src": "정답", "module": "PM", "tag": "ETF 할인 → AP 차익거래", "vig": 4, "stem": "For the US equity ETF shares, the gap to fair value would most likely be closed by the:", "opts": {"A": "sponsor buying the basket of securities and exchanging them for ETF shares.", "B": "authorized participants buying the basket of securities and selling ETF shares.", "C": "authorized participants selling the basket of securities and buying ETF shares."}, "ans": "C", "en": "A. sponsor buying the basket of securities and exchanging them for ETF shares. — Incorrect\nIncorrect because buying the basket of securities in the market is the role of the authorized participants, not the sponsor, and in any case, as the ETF shares are trading at a discount, this would not close the gap to fair value.\nB. authorized participants buying the basket of securities and selling ETF shares. — Incorrect\nIncorrect because this is the opposite of the trade that would close the gap to fair value.\nThis trade suggested would be appropriate if the ETF was trading at a premium: If shares of the ETF are quoted at a higher price than the per-share market value of the basket of securities, the ETF is trading at a premium, and the AP can make a profit by simultaneously selling the ETF shares in the market and buying the basket of securities.\nC. authorized participants selling the basket of securities and buying ETF shares. — Correct\nCorrect because this is the trade that would close the gap to fair value.\nIf the ETF shares are trading at a discount to NAV, they are selling for lower than the underlying basket of securities. Therefore, an arbitrage opportunity can be exploited by buying the cheaper instrument (ETF shares) and selling the more expensive instrument (the basket of underlying securities). If the current per-share market value of the basket of underlying securities is greater than the quoted price of the ETF shares, the AP can simultaneously sell (or short) the basket of securities and buy ETF shares, to make a profit.", "ko": "ETF가 NAV보다 싸게 거래되면, AP가 싼 ETF를 사고 비싼 기초자산 바스켓을 팔아(공매도) 이익을 얻는다. 이 거래가 괴리를 좁힌다.", "trap": "바스켓 매수·ETF 매도는 ETF가 프리미엄일 때의 거래. 스폰서가 아니라 AP가 한다.", "f": "", "why": {"A": "바스켓을 사는 것은 스폰서가 아닌 AP의 역할이고, 할인 상황에 맞지 않는 방향.", "B": "ETF가 프리미엄일 때의 반대 방향 거래."}, "orig": "Mock 3 Session 1 Q20", "conf": false}, {"id": "mock3-Q21", "src": "정답", "module": "PM", "tag": "VaR의 의미", "vig": 5, "stem": "Pirlo's risk measure calculation for Portfolio X indicates that $24 million is the:", "opts": {"A": "average daily loss she should expect 5% of the time.", "B": "minimum daily loss she should expect 5% of the time.", "C": "maximum daily loss she should expect 5% of the time."}, "ans": "B", "en": "A. average daily loss she should expect 5% of the time. — Incorrect\nIncorrect because it is correct to say any of the following:\n$24 million is the minimum loss we would expect 5% of the time.\n5% of the time, losses would be at least $24 million.\nWe would expect a loss of no more than $24 million 95% of the time.\nBut VaR does not indicate the average loss.\nB. minimum daily loss she should expect 5% of the time. — Correct\nCorrect because value at risk is the minimum loss that would be expected a certain percentage of the time over a certain period of time given the assumed market conditions. In this case, a minimum loss of $24 million would be expected 5% of the time on any one day. It is correct to say: $24 million is the minimum loss we would expect 5% of the time.\nC. maximum daily loss she should expect 5% of the time. — Incorrect\nIncorrect because it is correct to say: 5% of the time, losses would be at least $24 million, but this is not the maximum loss.", "ko": "5% 일간 VaR $24m = 5%의 날에는 손실이 최소 $24m 이상이라는 뜻. 즉 5% 확률로 예상되는 최소 손실이다.", "trap": "VaR은 최대 손실도 평균 손실도 아니다. 꼬리 평균은 CVaR.", "f": "", "why": {"A": "꼬리 손실의 평균은 CVaR이다.", "C": "그 5%의 날에는 $24m보다 더 잃을 수 있어 최대 손실이 아니다."}, "orig": "Mock 3 Session 1 Q21", "conf": false}, {"id": "mock3-Q22", "src": "정답", "module": "PM", "tag": "CVaR (조건부 VaR)", "vig": 5, "stem": "The alternative VaR measure that Pirlo computes for Portfolio X is referred to as:", "opts": {"A": "relative VaR.", "B": "conditional VaR.", "C": "incremental VaR."}, "ans": "B", "en": "A. relative VaR. — Incorrect\nIncorrect because ex ante tracking error, also known as relative VaR, is a measure of the degree to which the performance of a given investment portfolio might deviate from its benchmark.\nB. conditional VaR. — Correct\nCorrect because Pirlo computes the expected daily loss of Portfolio X on days when losses exceed the VaR. Conditional VaR, or CVaR, answers the question, How much can I expect to lose if VaR is exceeded? Therefore, the metric that Pirlo computes is referred to as conditional VaR.\nC. incremental VaR. — Incorrect\nIncorrect because incremental VaR measures how the portfolio VaR will change if a position size is changed relative to the remaining positions.", "ko": "VaR을 넘는 날의 평균 손실을 계산했으므로 conditional VaR(CVaR, expected shortfall)이다.", "trap": "relative VaR = 사전 추적오차, incremental VaR = 포지션 크기 변경에 따른 VaR 변화.", "f": "", "why": {"A": "relative VaR은 벤치마크 대비 추적오차 위험.", "C": "incremental VaR은 포지션 변경 시 포트폴리오 VaR 변화."}, "orig": "Mock 3 Session 1 Q22", "conf": false}, {"id": "mock3-Q23", "src": "정답", "module": "PM", "tag": "모수적 VaR", "vig": 5, "stem": "Portfolio Y's daily 5% parametric VaR is closest to:", "opts": {"A": "$6.9 million.", "B": "$14.7 million.", "C": "$17.5 million."}, "ans": "B", "en": "A. $6.9 million. — Incorrect\nIncorrect because the % sign in the daily expected return is omitted in the calculation.\nMultiply the daily standard deviation by the critical z-value for a one-sided test:\n0.0215 × 1.65 = 0.035475\nIncorrect use of the expected return without % sign:\n0.052 – 0.035475 = 0.016525\nChange the sign of the value obtained in Step 2:\nNot applicable\nMultiply the result in Step 3 by the value of the portfolio:\n$420 million × 0.016525 = $6,940,500 ≈ $6.9 million\nB. $14.7 million. — Correct\nCorrect because using the parametric method, a 5% daily VaR is computed as follows:\nMultiply the daily standard deviation by the critical z-value for a one-sided test:\n0.0215 × 1.65 = 0.035475\nSubtract the answer obtained in Step 1 from the expected return:\n0.00052 – 0.035475 = –0.034955\nChange the sign of the value obtained in Step 2:\n0.034955\nMultiply the result in Step 3 by the value of the portfolio:\n$420 million × 0.034955 = $14,681,100 ≈ $14.7 million\nC. $17.5 million. — Incorrect\nIncorrect because the two-tailed z-statistic is incorrectly used in the calculation.\nIncorrect multiplication of the daily standard deviation by the critical z-value for a two-sided test (instead of the critical z-value for a one-sided test):\n0.0215 × 1.96 = 0.042140\nSubtract the answer obtained in Step 1 from the expected return:\n0.00052 – 0.042140 = –0.041620\nChange the sign of the value obtained in Step 2:\n0.041620\nMultiply the result in Step 3 by the value of the portfolio:\n$420 million × 0.041620 = $17,480,400 ≈ $17.5 million", "ko": "1단계: 일간 표준편차 × 단측 z = 0.0215 × 1.65 = 0.035475. 2단계: 기대수익 0.00052 − 0.035475 = −0.034955. 3단계: 부호 바꿔 × 포트폴리오 $420m = $14.68m ≈ $14.7m.", "trap": "5% VaR은 단측 1.65(양측 1.96 아님). 기대수익의 % 단위를 맞춘다.", "f": "VaR = (z × σ − μ) × V, 5% 단측 z = 1.65", "why": {"A": "기대수익의 % 표시를 빠뜨려 단위가 틀림.", "C": "단측 1.65 대신 양측 z(1.96)를 사용."}, "orig": "Mock 3 Session 1 Q23", "conf": false}, {"id": "mock3-Q24", "src": "정답", "module": "PM", "tag": "백테스트 편향: 데이터 스누핑", "vig": 5, "stem": "The backtesting approach used to identify the new investment strategy is most likely subject to which of the following biases?", "opts": {"A": "Data snooping", "B": "Look-ahead bias", "C": "Survivorship bias"}, "ans": "A", "en": "A. Data snooping — Correct\nCorrect because the process used by Pirlo to design the new investment strategy involves several backtesting runs and picking the strategy with the highest t-statistics. There is often a temptation to substitute sound portfolio construction by simply backtesting many strategies and picking the best-performing strategy. This bias is called data snooping—making an inference after looking at statistical results rather than testing a prior inference.\nB. Look-ahead bias — Incorrect\nIncorrect because look-ahead bias is created by using information that was unknown or unavailable during the historical periods over which the backtest is conducted. As Pirlo duly considered reporting lags and data revisions in the backtest, there is no evidence suggesting that the process used to select the new investment strategy is subject to look-ahead bias.\nC. Survivorship bias — Incorrect\nIncorrect because survivorship bias is related to the fact that companies continually appear and disappear from market indexes. Survivorship bias refers to deriving conclusions from data that reflects only those entities that have survived to that date. Although it is straightforward (but definitely not recommended) to backtest an investment strategy using only survivors, tracking all companies that have ever existed in a correct point-in-time fashion is strongly recommended Point-in-time data allow analysts to use the most complete data for any given prior time period. As Pirlo uses point-in-time data in the backtest, there is no evidence suggesting that the process used to select the new investment strategy is subject to survivorship bias.", "ko": "여러 번 백테스트를 돌려 t값이 가장 높은 전략을 고른 것은 결과를 본 뒤 추론하는 데이터 스누핑이다.", "trap": "미래 정보 사용 = look-ahead, 사라진 종목 제외 = survivorship. 여러 전략 중 최고 선택 = data snooping.", "f": "", "why": {"B": "당시 알 수 없던 정보를 쓴 경우가 아니다.", "C": "지수에서 사라진 종목 문제가 아니다."}, "orig": "Mock 3 Session 1 Q24", "conf": false}, {"id": "mock3-Q25", "src": "정답", "module": "ETH", "tag": "III(D) 성과 제시: 해지 계좌 제외", "vig": 6, "stem": "Does Costa violate the Standards when presenting his performance data to the prospective client?", "opts": {"A": "No", "B": "Yes, because of his calculation of composite returns", "C": "Yes, because his presentation does not include detailed information"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because, in his calculation of composite returns, Costa excluded terminated accounts and this is a violation of Standard III(D) - Performance Presentation.\nB. Yes, because of his calculation of composite returns — Correct\nCorrect because, in his calculation of composite returns, Costa excluded terminated accounts and this is a violation of Standard III(D) - Performance Presentation.\nStandard III(D) - Performance Presentation requires members and candidates to provide credible performance information to clients and prospective clients and to avoid misstating performance or misleading clients and prospective clients about the investment performance of members or candidates or their firms.\nIn the case where GIPS standards are not applied, obligations under Standard III(D) can be met through several specific actions, among them including terminated accounts as part of performance history with a clear indication of when the accounts were terminated.\nC. Yes, because his presentation does not include detailed information — Incorrect\nIncorrect because a presentation with limited (not detailed) information is not, in and of itself, a violation of the Standards. By adding a disclaimer, he is following best practice.\nBased on Standard III(D), if the presentation is brief, the member or candidate must make available to clients and prospects, on request, the detailed information supporting that communication. Best practice dictates that brief presentations include a reference to the limited nature of the information provided.", "ko": "Costa는 컴포지트 수익률을 계산할 때 해지된 계좌를 뺐다. GIPS를 따르지 않아도 III(D)를 지키려면 해지 계좌를 성과 이력에 포함하고 해지 시점을 밝혀야 하므로 위반이다.", "trap": "간략한 자료 + 추가 정보 제공 안내는 위반 아님. 문제는 해지 계좌 제외.", "f": "", "why": {"A": "해지 계좌를 빼서 성과를 부풀렸으므로 위반.", "C": "정보가 간략한 것 자체는 위반이 아니며 상세 정보 제공을 안내하면 된다."}, "orig": "Mock 3 Session 1 Q25", "conf": false}, {"id": "mock3-Q26", "src": "정답", "module": "ETH", "tag": "IV(B) 추가 보상: 서면 동의", "vig": 6, "stem": "Does Costa's arrangement with his largest premium client violate the Standard relating to additional compensation arrangements?", "opts": {"A": "No", "B": "Yes, because such arrangements are prohibited", "C": "Yes, because he did not obtain the appropriate approval"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because, to be consistent with the Standards, Costa is required to obtain written consent from all parties involved to accept the use of the client's yacht. In this case, he received only verbal approval from his employer.\nB. Yes, because such arrangements are prohibited — Incorrect\nIncorrect because it would be possible for Costa to enter such an arrangement under the Standards as long as he obtained written consent from all parties involved.\nC. Yes, because he did not obtain the appropriate approval — Correct\nCorrect because, to be consistent with Standard IV(B) Duties to Employers - Additional Compensation Arrangements, Costa is required to obtain written consent from all parties involved to accept the use of the client's yacht. In this case, he received only verbal approval from his employer. Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved.", "ko": "최대 고객의 요트 사용을 받으려면 관련 당사자 모두의 서면 동의가 필요하다. Costa는 고용주에게 구두 승인만 받았으므로 위반.", "trap": "추가 보상 자체는 금지가 아니다. 서면(written) 동의가 핵심.", "f": "", "why": {"A": "구두 승인만으로는 부족, 서면 동의가 필요해 위반.", "B": "서면 동의를 받으면 허용되므로 금지된 것은 아니다."}, "orig": "Mock 3 Session 1 Q26", "conf": false}, {"id": "mock3-Q27", "src": "정답", "module": "ETH", "tag": "III(A) 의결권: 경영진 맹목 추종", "vig": 6, "stem": "Which of the practices Costa discusses at the conference is not consistent with the Standard relating to loyalty, prudence, and care?", "opts": {"A": "Proxy voting", "B": "Trust accounts", "C": "Soft commissions"}, "ans": "A", "en": "A. Proxy voting — Correct\nCorrect because Costa shares that his proxy voting strategy for non-routine governance issues is to follow the recommendations of management. This is not consistent with Standard III(A) - Loyalty, Prudence, and Care. Specifically, an investment manager who fails to vote, casts a vote without considering the impact of the question, or votes blindly with management on nonroutine governance issues (e.g., a change in company capitalization) may violate this standard.\nB. Trust accounts — Incorrect\nIncorrect because Costa's explanation that his fiduciary duty is to the beneficiaries rather than to the individual who hires him is consistent with Standard III(A) - Loyalty, Prudence, and Care. When the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries.\nC. Soft commissions — Incorrect\nIncorrect because Costa occasionally engages an alternative brokerage firm which charges a higher fee but does provide research services, which is a benefit to his clients and consistent with Standard III(A) - Loyalty, Prudence, and Care. An investment manager often has discretion over the selection of brokers executing transactions. Conflicts may arise when an investment manager uses client brokerage to purchase research services, a practice commonly called 'soft dollars' or 'soft commissions.' A member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client.", "ko": "Costa는 비일상적 지배구조 안건에서 늘 경영진 권고대로 투표한다. 비일상 안건에 영향 검토 없이 경영진을 따르는 것은 III(A) 충성·신중·주의 의무와 맞지 않는다.", "trap": "신탁계좌는 수익자에게 의무(맞음), 리서치를 주는 비싼 브로커는 고객 이익이면 허용.", "f": "", "why": {"B": "신탁계좌의 충실 의무는 수익자에게 있다는 설명은 기준과 맞다.", "C": "리서치가 고객에게 도움이 되는 soft commission은 허용."}, "orig": "Mock 3 Session 1 Q27", "conf": false}, {"id": "mock3-Q28", "src": "정답", "module": "ETH", "tag": "VII(A) 의견 표명·시험 주제", "vig": 6, "stem": "Does Costa violate the Standards with either of the actions undertaken as part of his commitment to contribute to the profession?", "opts": {"A": "No", "B": "Yes, by posting the article about CFA Institute material on his blog", "C": "Yes, by highlighting the likely exam topics and formulas to his friend"}, "ans": "A", "en": "A. No — Correct\nCorrect because neither his criticism of the CFA Institute material nor his highlighting of likely exam topics to his friend are a violation of the Standards.\nWith regard to his criticism of the CFA Institute material, per Standard VII(A) - Conduct as Participants in CFA Institute Programs, Costa is free to disagree and express their disagreement with CFA Institute on its policies, its procedures, or any advocacy positions taken by the organization.\nWith regard to his highlighting of likely exam topics to his friend, he is basing this on his opinion after a review of the curriculum and not on his experience as a candidate. As per Standard VII(A), candidates are not prohibited from discussing nonconfidential information or curriculum material with others or in study groups in preparation for the exam.\nB. Yes, by posting the article about CFA Institute material on his blog — Incorrect\nIncorrect because Costa is stating his opinion when being critical of the material. As per Standard VII(A), candidates and members are free to disagree and express their disagreement with CFA Institute on its policies, its procedures, or any advocacy positions taken by the organization.\nC. Yes, by highlighting the likely exam topics and formulas to his friend — Incorrect\nIncorrect because Costa's highlighting of topic areas and formulas is based on his opinion and is not disclosing confidential information.\nStandard VII(A) prohibits members from disclosing and/or soliciting confidential material gained prior to or during the exam.", "ko": "CFA Institute 자료를 비판하는 글은 의견 표명이라 허용된다. 친구에게 시험 주제·공식을 짚어 준 것도 커리큘럼을 보고 낸 본인 의견이지 시험 기밀이 아니므로 위반이 아니다.", "trap": "VII(A)는 실제 시험 문제·내용 공개를 금지. 커리큘럼 기반 예상은 괜찮다.", "f": "", "why": {"B": "CFA Institute 정책·자료에 반대 의견을 표명하는 것은 허용.", "C": "시험 응시 경험이 아니라 커리큘럼 기반 의견이라 기밀 공개가 아니다."}, "orig": "Mock 3 Session 1 Q28", "conf": false}, {"id": "mock3-Q29", "src": "오답", "module": "QM", "tag": "로그선형 추세 예측", "vig": 7, "stem": "The predicted trend value of the financial variable for the following month is closest to:", "opts": {"A": "4,893.", "B": "8,822.", "C": "9,085."}, "ans": "B", "en": "A. 4,893. — Incorrect\nIncorrect because this is the value obtained when the estimated exponential trend exp(0.0068) (approximately 0.68% growth per month) is applied to the last observed value of the time series (y964 = 4,860):\n4,860 × exp(0.0068) = 4,893.16 ≈ 4,893\nB. 8,822. — Correct\nCorrect because the predicted trend value for next month (which corresponds to observation 965) is obtained as follows:\nln(y965) = b0 + b1 × t = 2.5230 + 0.0068 × 965 = 9.085\n⇒ y965 = exp(9.085) = 8,821.97 ≈ 8,822\nC. 9,085. — Incorrect\nIncorrect because the predicted trend value for next month (which corresponds to observation 965) is incorrectly obtained as follows, omitting the exponentiation:\nln(y965) = b0 + b1 × t = 2.5230 + 0.0068 × 965 = 9.085\n⇒ 9.085 × 1,000 = 9,085", "ko": "다음 달은 965번째 관측치. ln(y) = 2.5230 + 0.0068 × 965 = 9.085. y = e^9.085 = 8,822.", "trap": "마지막에 지수변환(e^)을 해야 한다. 9.085는 ln 값이다.", "f": "ln(y_t) = b0 + b1·t → y_t = e^(b0 + b1·t)", "why": {"A": "성장률 e^0.0068을 마지막 관측치에 적용한 값.", "C": "지수변환을 빠뜨리고 ln 값을 그대로 씀."}, "orig": "Mock 3 Session 1 Q29", "conf": false, "my": "A"}, {"id": "mock3-Q30", "src": "정답", "module": "QM", "tag": "Dickey–Fuller 검정", "vig": 7, "stem": "The test performed by Branson indicates that the quarterly financial time series:", "opts": {"A": "has a unit root.", "B": "is covariance stationary.", "C": "exhibits autoregressive conditional heteroskedasticity."}, "ans": "A", "en": "A. has a unit root. — Correct\nCorrect because the null hypothesis of the Dickey–Fuller test is that the time series has a unit root. Branson cannot reject the null hypothesis of the test and hence should conclude that the time series has a unit root.\nDickey and Fuller (1979) developed a regression-based unit root test based on a transformed version of the AR(1) model\nxt − xt−1 = b0 + g1xt−1 + εt\nIf there is a unit root in the AR(1) model, then g1 will be 0 in a regression where the dependent variable is the first difference of the time series and the independent variable is the first lag of the time series. The null hypothesis of the Dickey–Fuller test is H0: g1 = 0—that is, that the time series has a unit root and is nonstationary—and the alternative hypothesis is Ha: g1 < 0, that the time series does not have a unit root and is stationary.\nB. is covariance stationary. — Incorrect\nIncorrect because the null hypothesis of the Dickey–Fuller test cannot be rejected, which means that the time series has a unit root. Time series that have a unit root are not covariance stationary.\nC. exhibits autoregressive conditional heteroskedasticity. — Incorrect\nIncorrect because the test performed by Branson is a Dickey–Fuller test, which is a test on unit roots. The test does not give any indication as to whether the time series exhibits autoregressive conditionally heteroskedasticity (ARCH). Tests developed by Robert F. Engle on the variance of residuals of an AR, MA, or ARMA model should instead be used to determine if a time series is ARCH.", "ko": "DF 검정의 귀무가설은 g1 = 0(단위근 있음). Branson이 귀무가설을 기각하지 못했으므로 단위근이 있다(공분산 정상 아님).", "trap": "기각 못함 = 단위근 있음 = 비정상. ARCH는 다른 검정.", "f": "x_t − x_(t−1) = b0 + g1·x_(t−1) + ε, H0: g1 = 0", "why": {"B": "귀무가설을 기각하지 못해 단위근이 있으므로 공분산 정상이 아니다.", "C": "DF 검정은 단위근 검정이며 ARCH 여부는 알 수 없다."}, "orig": "Mock 3 Session 1 Q30", "conf": false}, {"id": "mock3-Q31", "src": "정답", "module": "QM", "tag": "전처리: 정규화", "vig": 7, "stem": "Which of the following preprocessing tasks is Branson performing on the economic variable?", "opts": {"A": "Trimming", "B": "Winsorization", "C": "Normalization"}, "ans": "C", "en": "A. Trimming — Incorrect\nIncorrect because Branson scales the data as part of the preprocessing step, and trimming is not a process to scale data. When extreme values and outliers are simply removed from the dataset, it is known as trimming.\nTrimming data deals with outliers but does not scale the data.\nB. Winsorization — Incorrect\nIncorrect because Branson scales the data as part of the preprocessing step and winsorization is not a process to scale data. When extreme values and outliers are replaced with the maximum (for large value outliers) and minimum (for small value outliers) values of data points that are not outliers, the process is known as winsorization.\nWinsorizing data deals with outliers but does not scale the data.\nC. Normalization — Correct\nCorrect because scaling is a process of adjusting the range of a feature by shifting and changing the scale of data and normalization is the process of rescaling numeric variables in the range of [0, 1].", "ko": "변수를 [0, 1] 범위로 다시 맞추는 스케일링은 정규화(normalization)다.", "trap": "trimming·winsorization은 이상치 처리이지 스케일링이 아니다.", "f": "Normalization = (X − min)/(max − min)", "why": {"A": "trimming은 극단값을 제거하는 것, 스케일 조정이 아니다.", "B": "winsorization은 극단값을 특정 백분위 값으로 바꾸는 것."}, "orig": "Mock 3 Session 1 Q31", "conf": false}, {"id": "mock3-Q32", "src": "정답", "module": "QM", "tag": "F1 점수", "vig": 7, "stem": "The F1 score for the machine-learning model is closest to:", "opts": {"A": "0.47.", "B": "0.59.", "C": "0.62."}, "ans": "A", "en": "A. 0.47. — Correct\nCorrect because the F1 score is calculated as follows:\nPrecision (P) = TP/(TP + FP)\n= 350/(350 + 533)\n= 0.3964\nRecall (R) = TP/(TP + FN)\n= 350/(350 + 246)\n= 0.5872\nF1 = (2 × P × R)/(P + R)\n= (2 × 0.3964 × 0.5872)/(0.3964 + 0.5872)\n= 0.4655/0.9836\n= 0.4733 ≈ 0.47\nB. 0.59. — Incorrect\nIncorrect because recall is calculated instead of the F1 score as follows:\nRecall (R) = TP/(TP + FN)\n= 350/(350 + 246)\n= 0.5872 ≈ 0.59\nC. 0.62. — Incorrect\nIncorrect because accuracy is calculated instead of the F1 score as follows:\nAccuracy = (TP + TN)/(TP + FP + TN + FN)\n= (350 + 941)/(350 + 533 + 941 + 246)\n= 1,291/2,070\n= 0.6237 ≈ 0.62", "ko": "Precision = 350/(350 + 533) = 0.3964, Recall = 350/(350 + 246) = 0.5872. F1 = 2 × 0.3964 × 0.5872 / (0.3964 + 0.5872) = 0.4733 ≈ 0.47.", "trap": "recall(0.59)이나 accuracy(0.62)를 답으로 고르지 말 것.", "f": "F1 = 2PR/(P + R), P = TP/(TP + FP), R = TP/(TP + FN)", "why": {"B": "F1 대신 recall을 계산.", "C": "F1 대신 accuracy를 계산."}, "orig": "Mock 3 Session 1 Q32", "conf": false}, {"id": "mock3-Q33", "src": "정답", "module": "FI", "tag": "이항트리 무옵션 채권", "vig": 8, "stem": "The value of the option-free bond issued by Corr is closest to:", "opts": {"A": "98.97.", "B": "104.22.", "C": "109.94."}, "ans": "B", "en": "A. 98.97. — Incorrect\nIncorrect because this response omits the coupon in the last year and hence assumes that only the par value is repaid at maturity instead of the par value plus the coupon. The calculations are as follows:\nValues at Year 2\nTop node: 100 / 1.0746 = $93.06\nMiddle node: 100 / 1.0611 = $94.24\nBottom node: 100 / 1.0500 = $95.24\nValues at Year 1\nTop node: [6 + 0.5 × (93.06 + 94.24)] / 1.0489 = $95.00\nBottom node: [6 + 0.5 × (94.24 + 95.24)] / 1.0400 = $96.86\nValue at Year 0\nCurrent node: [6+ 0.5 × (95.00 + 96.86)] / 1.0300 = $98.97\nB. 104.22. — Correct\nCorrect because using the binomial tree produces a value of $104.22 for the option-free Corr bond. The calculations are as follows:\nValues at Year 2\nTop node: 106 / 1.0746 = $98.64\nMiddle node: 106 / 1.0611 = $99.90\nBottom node: 106 / 1.0500 = $100.95\nValues at Year 1\nTop node: [6 + 0.5 × (98.64 + 99.90)] / 1.0489 = $100.36\nBottom node: [6 + 0.5 × (99.90 + 100.95)] / 1.0400 = $102.33\nValue at Year 0\nCurrent node: [6 + 0.5 × (100.36 + 102.33)] / 1.0300 = $104.22\nC. 109.94. — Incorrect\nIncorrect because this response assumes repayment of par plus coupon in Year 2 instead of Year 3 – i.e., assumes this is a 2-year bond rather than a 3-year bond – but also includes an extra coupon in calculating the Year 1 values. The calculations are as follows:\nValues at Year 2\nTop node: $106\nMiddle node: $106\nBottom node: $106\nValues at Year 1\nTop node: [6 + 0.5 × (106 + 106)] / 1.0489 = $106.78\nBottom node: [6 + 0.5 × (106 + 106)] / 1.0400 = $107.69\nValue at Year 0\nCurrent node: [6 + 0.5 × (106.78 + 107.69)] / 1.0300 = $109.94", "ko": "3년 6% 쿠폰. 2년 시점: 106/1.0746 = 98.64, 106/1.0611 = 99.90, 106/1.0500 = 100.95. 1년 시점: [6 + 0.5(98.64 + 99.90)]/1.0489 = 100.36, [6 + 0.5(99.90 + 100.95)]/1.04 = 102.33. 0시점: [6 + 0.5(100.36 + 102.33)]/1.03 = 104.22.", "trap": "만기 현금흐름은 원금 + 마지막 쿠폰(106). 3년 채권임을 확인.", "f": "V = [C + 0.5(V_up + V_down)] / (1 + r)", "why": {"A": "마지막 해 쿠폰을 빼고 원금만 상환으로 계산.", "C": "3년이 아니라 2년 채권으로 계산."}, "orig": "Mock 3 Session 1 Q33", "conf": false}, {"id": "mock3-Q34", "src": "정답", "module": "FI", "tag": "유효 볼록성", "vig": 8, "stem": "The effective convexity of the Corr putable bond is closest to:", "opts": {"A": "2.40.", "B": "95.62.", "C": "100.00."}, "ans": "B", "en": "A. 2.40. — Incorrect\nIncorrect because this is the effective duration of the putable bond, calculated as:\n(PV− – PV+) / [2 × (ΔCurve ) × PV0]\n= (105.96 – 103.45) / [2 × 0.005 × 104.58]\n= 2.51 / 1.0458\n= 2.40\nB. 95.62. — Correct\nCorrect because effective convexity is calculated as:\n[PV− + PV+ – (2 × PV0)] / [(ΔCurve)^2 × (PV0 )]\nwhere\nPV− = the full price of the bond when the benchmark yield curve is shifted down by ΔCurve\nPV+ = the full price of the bond when the benchmark yield curve is shifted up by ΔCurve\nPV0 = the current full price of the bond (i.e., with no shift)\nΔCurve = the magnitude of the parallel shift in the benchmark yield curve (in decimal)\nEffective convexity = [105.96 + 103.45 – (2 × 104.58)] / [(0.005)^2 × 104.58]\n= (209.41 – 209.16) / 0.0026145\n= 0.25 / 0.0026145\n= 95.6206 ≈ 95.62\nC. 100.00. — Incorrect\nIncorrect because this uses an incorrect input in the denominator of the effective convexity formula (the par value of the bond instead of the current price).\nEffective convexity = [PV− + PV+ – (2 × PV0)] / [(ΔCurve)^2 × Par]\n= [105.96 + 103.45 – (2 × 104.58)] / [(0.005)^2 × 100]\n= (209.41 – 209.16) / 0.0025\n= 0.25 / 0.0025\n= 100", "ko": "유효 볼록성 = [PV− + PV+ − 2PV0] / [(ΔCurve)^2 × PV0] = [105.96 + 103.45 − 2 × 104.58] / [0.005^2 × 104.58] = 0.25/0.0026145 = 95.62.", "trap": "분모는 현재 가격(104.58)이지 액면 100이 아니다. 2.40은 유효 듀레이션.", "f": "EffCon = (PV− + PV+ − 2PV0) / [(ΔCurve)^2 × PV0]", "why": {"A": "유효 듀레이션을 계산.", "C": "분모에 현재 가격 대신 액면가를 사용."}, "orig": "Mock 3 Session 1 Q34", "conf": false}, {"id": "mock3-Q35", "src": "정답", "module": "FI", "tag": "금리 변동성↑ → 내재옵션 채권 가치", "vig": 8, "stem": "Given the interest rate volatility change analyzed by Pulo, which of the Corr bonds would most likely increase in value?", "opts": {"A": "The putable bond only", "B": "The callable bond only", "C": "Both the putable bond and the callable bond"}, "ans": "A", "en": "A. The putable bond only — Correct\nCorrect because the value of a putable bond is as follows:\nValue of putable bond = Value of straight bond + Value of investor put option\nAs interest rate volatility increases, the value of the embedded put option increases as there are more opportunities for the embedded option to be exercised. Because the value of the straight bond is not affected by a change in interest rate volatility, the value of the putable bond would thus increase with an increase in interest rate volatility.\nB. The callable bond only — Incorrect\nIncorrect because the value of a callable bond is as follows:\nValue of callable bond = Value of straight bond – Value of issuer call option\nAs interest rate volatility increases, the value of the embedded call option increases as there are more opportunities for the embedded option to be exercised. Because the value of the straight bond is not affected by a change in interest rate volatility, the value of the callable bond would thus decrease with an increase in interest rate volatility.\nC. Both the putable bond and the callable bond — Incorrect\nIncorrect because the value of the putable bond would increase and the value of the callable bond would decrease with an increase in interest rate volatility.", "ko": "변동성이 커지면 옵션 가치가 오른다. 풋 채권 = 일반 채권 + 투자자 풋 → 가치 상승. 콜 채권 = 일반 채권 − 발행자 콜 → 가치 하락. 그래서 풋 채권만 오른다.", "trap": "옵션은 둘 다 가치가 오르지만 콜은 투자자가 판 옵션이라 채권 가치는 내려간다.", "f": "V_put = V_straight + V_put option, V_call = V_straight − V_call option", "why": {"B": "콜 옵션 가치가 오르면 콜 채권 가치는 내려간다.", "C": "콜 채권은 변동성 상승 시 가치가 하락한다."}, "orig": "Mock 3 Session 1 Q35", "conf": false}, {"id": "mock3-Q36", "src": "정답", "module": "FI", "tag": "버스티드 전환사채 → 금리 민감", "vig": 8, "stem": "Which company's convertible bonds would be most affected by changes in interest rates?", "opts": {"A": "Company X", "B": "Company Y", "C": "Company Z"}, "ans": "B", "en": "A. Company X — Incorrect\nIncorrect because Company X's stock price of $20 is much higher than the bond conversion price of $10. Therefore, the Company X bond will exhibit the characteristics of Company X stock and thus be relatively less affected by interest rate movements.\nIn contrast, when the underlying share price is above the conversion p

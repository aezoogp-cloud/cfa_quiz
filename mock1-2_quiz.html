<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 1 Session 2 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
</style>
</head>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock1-2", "title": "Mock 1 Session 2"}, "questions": [{"id": "mock1-2-Q1", "src": "정답", "module": "EQ", "tag": "단일단계 RI 모형", "vig": 0, "stem": "Based on the single-stage residual income model, the intrinsic value per share of Firm A’s common stock is closest to:", "opts": {"A": "$200.", "B": "$366.", "C": "$486."}, "ans": "B", "en": "A. $200. — Incorrect\nIncorrect because this calculation omits adding the current book value to the second term of the equation:\nV0 = [(ROE – r)/(r – g)] × B0 = [(16.0% – 12.5%)/(12.5% – 9.6%)] × $166.00 = $200.34 ≈ $200\nB. $366. — Correct\nCorrect because a stock’s intrinsic value under the residual income model, assuming constant growth, can be expressed as:\nV0 = B0 + [(ROE – r)/(r – g)] × B0\nwhere:\nB0 = beginning-of-year book value = $166.00\nROE = expected return on equity = 16.0%\nr = required rate of return on equity = 12.5%\ng = the sustainable growth rate = 9.6%\nTherefore, the intrinsic value of Firm A’s stock is:\nV0 = $166.00 + [(16.0% – 12.5%)/(12.5% – 9.6%)] × $166.00 = $366.34 ≈ $366\nC. $486. — Incorrect\nIncorrect because this calculation uses the current market price instead of the book value:\nV0 = Market Price0 + [(ROE – r)/(r – g)] × Market Price0 = $220.00 + [(16.0% – 12.5%)/(12.5% – 9.6%)] × $220.00 = $485.52 ≈ $486", "ko": "상수 성장 RI 모형은 현재 장부가 B0에 초과이익의 현재가치를 더한다. V0 = 166 + [(16.0% − 12.5%)/(12.5% − 9.6%)] × 166 = 166 + 1.2069 × 166 = 366.34 ≈ $366.", "trap": "B0를 더하는 것을 빼먹거나, B0 자리에 시장가격(220)을 넣는 실수.", "f": "V0 = B0 + [(ROE − r)/(r − g)] × B0", "why": {"A": "초과이익 부분만 계산하고 B0(166)를 더하지 않았습니다.", "C": "장부가 대신 시장가격 220을 넣었습니다."}, "orig": "Mock 1 Session 2 Q1", "conf": false}, {"id": "mock1-2-Q2", "src": "정답", "module": "EQ", "tag": "다단계 RI: persistence factor 터미널 가치", "vig": 0, "stem": "Based on Lazslo's multistage residual income model, the present value of the estimated terminal value of Firm A's stock is closest to:", "opts": {"A": "$6.07.", "B": "$6.83.", "C": "$9.68."}, "ans": "B", "en": "A. $6.07. — Incorrect\nIncorrect because this calculation discounts the capitalized Year 10 residual income for 10 years instead of 9 years.\nPresent value of terminal value = Residual income in Year T/[(1 + required return – persistence factor) × (1 + required return)^T]\n= $8.38/[(1 + 0.125 – 0.7) × (1 + 0.125)^10] = $6.07\nB. $6.83. — Correct\nCorrect because the terminal value at the end of the forecast horizon (T) is estimated as the terminal-year residual income discounted in perpetuity. Based on the residual income model in which residual income fades over time, the present value of the terminal value equals:\nPresent value of terminal value = Residual income in Year T/[(1 + required return – persistence factor) × (1 + required return)^(T–1)]\n= $8.38/[(1 + 0.125 – 0.7) × (1 + 0.125)^(10–1)] = $6.83\nC. $9.68. — Incorrect\nIncorrect because this calculation does not include the required return in the capitalization of Year 5 residual income.\nPresent value of terminal value = Residual income in Year T/[(1 – persistence factor) × (1 + required return)^(T–1)]\n= $8.38/[(1 – 0.7) × (1 + 0.125)^(10–1)] = $9.68", "ko": "Year 10 RI가 persistence factor ω = 0.7로 줄어든다고 보면, Year 9 시점 가치 = RI_10/(1 + r − ω)이고 이를 9년 할인한다. 8.38 / [(1 + 0.125 − 0.7) × 1.125^9] = 8.38 / (0.425 × 2.8865) = $6.83.", "trap": "할인 기간은 T가 아니라 T−1(=9년). 분모에 r을 빼먹지 말 것.", "f": "PV(TV) = RI_T / [(1 + r − ω) × (1 + r)^(T−1)]", "why": {"A": "9년이 아니라 10년 할인했습니다.", "C": "자본화 분모에 r을 빼고 (1 − ω)만 썼습니다."}, "orig": "Mock 1 Session 2 Q2", "conf": false}, {"id": "mock1-2-Q3", "src": "오답", "module": "EQ", "tag": "RI: OCI(clean surplus 위반) 조정", "vig": 0, "stem": "Firm B’s per-share residual income for Year 2 is closest to:", "opts": {"A": "$14.73.", "B": "$15.55.", "C": "$18.30."}, "ans": "C", "en": "A. $14.73. — Incorrect\nIncorrect because the capital charge is based on end-of-Year 2 book value of equity.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nBook value at the end of Year 2:\n= Book value at the end of Year 1 + net income – dividends + other comprehensive income = $133.45 + $31.56 – $4.57 + $2.75 = $163.19\nResidual income in Year 2:\n= Net income + other comprehensive income – (cost of capital × end-of-year book value) = $31.56 + $2.75 – (12% × $163.19) = $14.73\nB. $15.55. — Incorrect\nIncorrect because the residual income calculation does not adjust net income for other comprehensive income.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nResidual income in Year 2:\n= Net income – (cost of capital × beginning-of-year book value) = $31.56 – (12% × $133.45) = $15.55\nC. $18.30. — Correct\nCorrect because residual income equals net income minus equity charge (the cost of equity × beginning-of-year book value). The residual income model assumes clean surplus accounting, i.e., end-of-year book value equals beginning-of-year book value + earnings – dividends. However, there are accounting items (referred to as other comprehensive income) that can affect the book value of equity directly while bypassing the income statement.\nIn that case, net income is adjusted by the amount of other comprehensive income.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nResidual income in Year 2:\n= Net income + other comprehensive income – (cost of capital × beginning-of-year book value) = $31.56 + $2.75 – (12% × $133.45) = $18.30", "ko": "① Year 1 말 장부가 = 111 + 26.25 − 3.80 + 0 = 133.45. ② Year 2에 OCI 2.75가 장부가를 직접 바꿨으므로(clean surplus 위반) 이익에 더해 준다. RI_2 = 31.56 + 2.75 − 12% × 133.45 = 34.31 − 16.01 = $18.30.", "trap": "자본비용은 기초(Year 1 말) 장부가에 곱한다. OCI는 이익에 더해 준다.", "f": "RI_t = NI_t + OCI_t − r × B_(t−1)", "why": {"A": "자본비용을 Year 2 말 장부가에 곱했습니다(기초 장부가를 써야 함).", "B": "OCI 2.75를 이익에 더하지 않았습니다."}, "orig": "Mock 1 Session 2 Q3", "conf": false}, {"id": "mock1-2-Q4", "src": "오답", "module": "EQ", "tag": "Gordon growth model: D1 사용", "vig": 0, "stem": "Based on the Gordon growth model, the per-share value of Firm C’s stock is closest to:", "opts": {"A": "$34.", "B": "$36.", "C": "$44."}, "ans": "B", "en": "A. $34. — Incorrect\nIncorrect because this calculation uses D0 instead of D1.\nV0 = $1.6875/(12.0% – 7.0%) = $33.75 ≈ $34,\nwhere D0 is last year’s dividend = last year’s EPS × dividend payout ratio = $3.75 × 45% = $1.6875\nB. $36. — Correct\nCorrect because the Gordon growth model (GGM) assumes that dividends grow indefinitely at a constant rate, g. Assuming that the required equity return, r, is greater than the growth rate, the value of a stock according to the GGM equals:\nV0 = D0 × (1 + g)/(r – g) = D1/(r – g), where D0 is last year’s dividend = last year’s EPS × dividend payout ratio = $3.75 × 45% = $1.6875\nD1 = $1.6875 × (1.07) = $1.8056\nV0 = $1.6875 × (1.07)/(12.0% – 7.0%) = $1.8056/(5.0%) = $36.1125 ≈ $36\nC. $44. — Incorrect\nIncorrect because D1 is calculated as last year’s EPS × (1 – dividend payout ratio) × (1 + g) = $3.75 × (1 – 45%) × (1.07) = $2.2069.\nV0 = $2.2069/(5.0%) = $44.1375 ≈ $44", "ko": "D0 = 3.75 × 45% = 1.6875, D1 = 1.6875 × 1.07 = 1.8056. V0 = 1.8056 / (12% − 7%) = $36.11 ≈ $36.", "trap": "분자는 D0가 아니라 D1. 배당은 payout ratio로 구한다(1 − payout은 유보율).", "f": "V0 = D1/(r − g), D1 = EPS0 × payout × (1 + g)", "why": {"A": "D1 대신 D0(1.6875)를 썼습니다.", "C": "배당을 (1 − payout) = 유보율로 계산했습니다."}, "orig": "Mock 1 Session 2 Q4", "conf": false}, {"id": "mock1-2-Q5", "src": "정답", "module": "ECO", "tag": "성장이론: 수렴(convergence)", "vig": 1, "stem": "Which of the following theories best supports Simpson's belief about the growth rate of per capita income?", "opts": {"A": "Classical growth theory", "B": "Endogenous growth theory", "C": "Neoclassical growth theory"}, "ans": "C", "en": "A. Classical growth theory — Incorrect\nIncorrect because, based on classical growth theory the labor input faces diminishing marginal returns, the additional output produced by the growing workforce eventually declines to zero. Ultimately, the population grows so much that labor productivity falls and per capita income returns back to the subsistence level. The classical model predicts that in the long run, the adoption of new technology results in a larger but not richer population. Thus, the standard of living is constant over time even with technological progress, and there is no growth in per capita output.\nPer capita economic growth under the classical model is only temporary because an exploding population with limited resources brings growth to an end.\nAccordingly, under the classical growth theory, there is no possibility of income convergence between developing countries and developed countries.\nB. Endogenous growth theory — Incorrect\nIncorrect because according to endogenous growth theory, there is no reason why the incomes of developed and developing countries should converge. Because of constant or even increasing returns associated with investment in knowledge capital, the developed countries can continue to grow as fast as, or faster than, the developing countries. As a result, there is no reason to expect convergence of income over time.\nC. Neoclassical growth theory — Correct\nCorrect because neoclassical growth theory predicts two types of convergence: absolute convergence and conditional convergence. Absolute convergence means that developing countries, regardless of their particular characteristics, will eventually catch up with the developed countries and match them in per capita output. The neoclassical model assumes that all countries have access to the same technology. As a result, per capita income in all countries should eventually grow at the same rate.", "ko": "개도국의 1인당 소득 성장률이 올라가 결국 선진국과 같아진다 = 수렴. 신고전파(neoclassical) 이론은 모든 나라가 같은 기술에 접근하고 자본의 수확체감 때문에 자본이 적은 나라가 더 빨리 성장해 수렴(absolute·conditional)을 예측한다.", "trap": "내생적 성장이론은 수확체감이 없어 수렴할 이유가 없다고 본다.", "f": "", "why": {"A": "고전파는 인구 증가로 1인당 소득이 생계 수준으로 돌아간다고 봅니다.", "B": "내생적 성장이론은 수확 불변·증가로 선진국·개도국 소득이 수렴할 이유가 없다고 봅니다."}, "orig": "Mock 1 Session 2 Q5", "conf": false}, {"id": "mock1-2-Q6", "src": "오답", "module": "ECO", "tag": "선진국 성장 정책: 노동 공급", "vig": 1, "stem": "Which of the following policies would most likely have the greatest impact on economic growth in Country A?", "opts": {"A": "Encouraging immigration", "B": "Encouraging increased savings and investment", "C": "Loosening credit restraints in the financial sector"}, "ans": "A", "en": "A. Encouraging immigration — Correct\nCorrect because Country A already has a high rate of capital per worker and the economy is growing slowly. An increase in the quantity of labor that would result from higher immigration would likely increase economic growth.\nAnother factor increasing economic and population growth, especially among the developed countries, is immigration. Heightened immigration is a possible solution to the slowing labor force growth being experienced by many developed countries with low birthrates within the native population.\nB. Encouraging increased savings and investment — Incorrect\nIncorrect because Country A is a developed country with a high rate of capital per worker. Consequently, increased savings and investment, which would further increase capital per worker, is unlikely to substantially increase economic growth.\nOne of the major problems for some developing countries is a low level of capital per worker.\nC. Loosening credit restraints in the financial sector — Incorrect\nIncorrect because Country A being a developed economy already has a high rate of capital per worker and the economy is growing slowly. Consequently, a loosening of credit restraints, which would encourage additional capital, is unlikely to substantially increase economic growth.", "ko": "Country A는 이미 1인당 자본이 높고 성장이 느린 선진국이다. 자본을 더 늘려도(capital deepening) 수확체감 때문에 효과가 작다. 노동 투입을 늘리는 이민 장려가 성장에 가장 큰 영향을 준다.", "trap": "'저축·투자 늘리기'는 자본이 적은 개도국에 효과가 크다.", "f": "", "why": {"B": "1인당 자본이 이미 높아 자본을 더 늘려도 수확체감으로 효과가 작습니다.", "C": "신용 완화도 자본 투자를 늘리는 경로라 같은 이유로 효과가 작습니다."}, "orig": "Mock 1 Session 2 Q6", "conf": true}, {"id": "mock1-2-Q7", "src": "오답", "module": "ECO", "tag": "성장회계: capital deepening 기여", "vig": 1, "stem": "In the most recent five years, the contribution of capital deepening to Country A's labor productivity growth was:", "opts": {"A": "0.3%.", "B": "0.8%.", "C": "0.9%."}, "ans": "C", "en": "A. 0.3%. — Incorrect\nIncorrect because this is the difference between the labor productivity annual growth rate and the growth rates of hours worked and total factor productivity:\n1.4% – 0.6% – 0.5% = 0.3%\nThe contribution of capital deepening to Country A's labor productivity growth should be the difference between the labor productivity growth rate and the total factor productivity growth rate:\n= 1.4% – 0.5% = 0.9%\nB. 0.8%. — Incorrect\nIncorrect because this is the difference between the labor productivity growth rate and the growth rate of the hours worked:\n= 1.4% – 0.6% = 0.8%\nThe contribution of capital deepening to Country A's labor productivity growth should be the difference between the labor productivity growth rate and the total factor productivity growth rate:\n= 1.4% – 0.5% = 0.9%\nC. 0.9%. — Correct\nCorrect because the contribution of capital deepening can be measured as the difference between the growth rates of labor productivity and total factor productivity (TFP). Also, the larger the difference between the productivity growth measures, the more important capital deepening is as a source of economic growth. For the most recent 5-year period, Country A's labor productivity grew by 1.4% per year of which 0.5% came from TFP growth and 0.9% (1.4% – 0.5%) from capital deepening.\nCapital deepening = labor productivity growth – TFP growth = 1.4% – 0.5% = 0.9%", "ko": "노동생산성 성장 = TFP 성장 + capital deepening 기여. 1.4% − 0.5% = 0.9%. 근로시간(0.6%)은 노동생산성 분해에 들어가지 않는다.", "trap": "근로시간 증가율을 빼면 안 된다(그건 GDP 성장 분해에 쓰임).", "f": "Capital deepening 기여 = 노동생산성 성장률 − TFP 성장률", "why": {"A": "근로시간(0.6%)까지 빼서 1.4 − 0.6 − 0.5로 계산했습니다.", "B": "TFP가 아니라 근로시간을 뺐습니다(1.4 − 0.6)."}, "orig": "Mock 1 Session 2 Q7", "conf": false}, {"id": "mock1-2-Q8", "src": "정답", "module": "ECO", "tag": "잠재 GDP vs 실제 GDP와 인플레이션", "vig": 1, "stem": "Simpson's forecast for Country B's GDP growth rate implies that inflationary pressures will most likely:", "opts": {"A": "decrease.", "B": "remain the same.", "C": "increase."}, "ans": "A", "en": "A. decrease. — Correct\nCorrect because potential GDP forecasts can gauge inflationary pressures in the economy that arise from cyclical variations in actual output growth relative to the economy's long-term potential growth rate. Specifically, actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation.\nSince Country B's actual GDP growth rate is presently lower than its potential GDP growth rate, and because this is also forecasted to continue in the future, there will likely be downward pressure on inflation.\nB. remain the same. — Incorrect\nIncorrect because actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation.\nSince Country B's actual GDP growth rate is presently lower than its potential GDP growth rate, and because this is also forecasted to continue in the future, there will likely be downward pressure on inflation.\nC. increase. — Incorrect\nIncorrect because actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation.\nSince Country B's actual GDP growth rate is presently lower than its potential GDP growth rate, and because this is also forecasted to continue in the future, there will likely be downward pressure on inflation.", "ko": "실제 GDP 성장률이 잠재 GDP 성장률보다 높으면 인플레 압력↑, 낮으면 ↓. Country B는 이미 잠재 GDP가 실제보다 크고(output gap 음수), 앞으로도 잠재 성장률이 실제보다 높다고 예상하므로 갭이 더 커져 인플레 압력은 줄어든다.", "trap": "'잠재 GDP가 높다'를 경기 과열로 착각하지 말 것.", "f": "", "why": {"B": "실제 성장률이 잠재 성장률보다 낮으면 인플레 압력이 줄어듭니다.", "C": "인플레 압력이 커지는 건 실제 성장률이 잠재 성장률보다 높을 때입니다."}, "orig": "Mock 1 Session 2 Q8", "conf": false}, {"id": "mock1-2-Q9", "src": "오답", "module": "FI", "tag": "부도 시 채권 수익률(IRR)", "vig": 2, "stem": "Under his base case scenario, the annualized return on Moffet's Company A bond investment would be closest to:", "opts": {"A": "–19.57%.", "B": "–15.45%.", "C": "–9.29%."}, "ans": "A", "en": "A. –19.57%. — Correct\nCorrect because the return from the bond investment if it defaults at the end of Year 3 is –19.57%.\nIf default occurs at the end of Year 3, the bondholder will have received the two coupon payments for the first two years and can expect to receive the Year 3 recovery value of $43.20 from Exhibit 1.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + $43.20/(1 + IRR)^3\nSolving for IRR results in a value of –19.57%.\nB. –15.45%. — Incorrect\nIncorrect because this answer includes an extra coupon payment in Year 3, which is already reflected in the exposure amount as an accrual.\nThe Year 3 exposure value of $108 already reflects the accrued coupon in Year 3. If default occurs in Year 3, the recovery amount of $43.20 already includes the coupon value expected to be paid along with the principal and hence the coupon should not be added again.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + ($43.20 + $8)/(1 + IRR)^3\nSolving for IRR results in a value of –15.45%.\nC. –9.29%. — Incorrect\nIncorrect because this uses the loss given default value from Year 3 instead of the recovery value.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + $64.80/(1 + IRR)^3\nSolving for IRR results in a value of –9.29%.", "ko": "Year 3 말 부도 시나리오: Year 1·2 쿠폰 8씩은 받고, Year 3에는 회수액 43.20만 받는다. 105.35 = 8/(1+IRR) + 8/(1+IRR)^2 + 43.20/(1+IRR)^3 → IRR = −19.57%.", "trap": "Year 3 exposure 108에 이미 Year 3 쿠폰이 들어 있으므로 쿠폰을 따로 더하지 않는다. 회수액(recovery)을 써야 하며 LGD가 아니다.", "f": "105.35 = 8/(1+IRR) + 8/(1+IRR)^2 + 회수액/(1+IRR)^3", "why": {"B": "Year 3 쿠폰 8을 회수액에 또 더했습니다(이미 exposure에 포함).", "C": "회수액 43.20 대신 LGD 64.80을 썼습니다."}, "orig": "Mock 1 Session 2 Q9", "conf": true}, {"id": "mock1-2-Q10", "src": "정답", "module": "FI", "tag": "Covered bond: 발행자 입장 장점", "vig": 2, "stem": "Which of the following is a benefit of the Company B bond from the prospective of the issuer?", "opts": {"A": "The bond can have a higher credit rating than Company B's rating", "B": "Once fully collateralized, the bond is no longer an obligation of Company B", "C": "Any prepaid or non-performing assets in the cover pool do not have to be replaced"}, "ans": "A", "en": "A. The bond can have a higher credit rating than Company B's rating — Correct\nCorrect because covered bonds can have a higher credit rating than that of the issuing financial institution.\nThe curriculum states that given the additional credit enhancements, recovery rates tend to be high and default probabilities low, making covered bonds a relatively safe credit asset. As a result, rating agencies often assign a credit rating to covered bonds that is several notches above that of the issuing financial institution.\nB. Once fully collateralized, the bond is no longer an obligation of Company B — Incorrect\nIncorrect because with a covered bond the financial institution has the ongoing obligation to maintain sufficient assets in the cover pool to satisfy the claims of covered bondholders at all times.\nThe curriculum states that a covered bond is a senior debt obligation of a financial institution that gives recourse to both the originator/issuer and a predetermined underlying collateral pool. The dual recourse to the issuing financial institution and the underlying asset pool has been a hallmark of covered bonds since their inception.\nThe covered bond therefore remains an ongoing obligation of Company B, even after it is collateralized at inception.\nC. Any prepaid or non-performing assets in the cover pool do not have to be replaced — Incorrect\nIncorrect because the cover pool is dynamic in nature and, if there are prepayments in the underlying pool, the financing institution needs to replace assets in the cover pool from time to time.\nThe curriculum states that another aspect of covered bonds that needs to be considered in credit analysis is the dynamic nature of the cover pool. In contrast to a static pool of mortgage loans (which expose investors to prepayment risk in the case of US mortgage-backed securities), cover pool sponsors must replace any prepaid or non-performing assets in the cover pool to ensure sufficient cash flows to the maturity of the covered bond.", "ko": "Covered bond는 dual recourse(발행자 + cover pool)와 추가 신용보강 덕분에 회수율이 높고 부도확률이 낮아, 신용평가사가 발행 금융기관보다 몇 단계 높은 등급을 준다. 그래서 발행자는 더 싸게 조달할 수 있다.", "trap": "Covered bond는 발행자의 대차대조표에 남고, cover pool은 계속 관리(교체)해야 한다(ABS와 차이).", "f": "", "why": {"B": "발행자는 만기까지 cover pool을 충분히 유지할 의무가 계속 있습니다.", "C": "cover pool은 동적이라 조기상환·부실 자산은 교체해야 합니다."}, "orig": "Mock 1 Session 2 Q10", "conf": true}, {"id": "mock1-2-Q11", "src": "오답", "module": "FI", "tag": "CDS 결제: 현금 vs 실물, CTD", "vig": 2, "stem": "Would the two settlement methods for the CDS on Company C result in the same total proceeds for Moffet?", "opts": {"A": "Yes", "B": "No, cash settlement would result in higher total proceeds", "C": "No, physical settlement would result in higher total proceeds"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because the total proceeds are not the same for cash and physical settlements. The same proceeds would occur if the bond held by Moffet was also the cheapest-to-deliver bond. In this instance, however, Bond 1 is held by Moffet and trades at 40% of par, but Bond 2 is the cheapest-to-deliver bond and trades at 35% of par.\nB. No, cash settlement would result in higher total proceeds — Correct\nCorrect because the maximum total proceeds occurs if Moffet opts for cash settlement of the CDS.\nWhen Company C defaults, the CDS will recover based on the cheapest-to-deliver defaulted debt which has the same seniority as the reference obligation.\nBond 1 and Bond 2 are at the same seniority level and Bond 2 is the cheapest-to-deliver bond as it trades at 35% of par value. The payoff of the CDS is determined by the cheapest-to-deliver obligation, which is the debt instrument that can be purchased and delivered at the lowest cost but has the same seniority as the reference obligation.\nThe recovery value on Bond 2 is 35% and the loss given default, which is an indicator of credit risk, is (1 – 0.35) for the cheapest-to-deliver bond.\nTherefore, the CDS will pay out (1 – 0.35) × $10 million = $6.5 million. Moffet can then sell Bond 1 for 40% of par value for another $4 million (40% × $10 million). The total proceeds will be $6.5 million + $4 million = $10.5 million.\nC. No, physical settlement would result in higher total proceeds — Incorrect\nIncorrect because the total proceeds will not be higher in physical settlement when compared to cash settlement.\nIf Moffet opts for physical settlement, he will surrender his holding of Bond 1 and obtain the notional $10 million in cash. This is lower than the total amount that would be received if he sold the bond and cash settled the CDS ($4 million + $6.5 million = $10.5 million).", "ko": "CDS 지급액은 같은 순위의 가장 싼 채권(CTD)인 Bond 2(35)를 기준으로 정해진다. 현금결제: CDS가 (1 − 0.35) × 10M = 6.5M을 주고, 보유한 Bond 1을 시장에서 40%에 팔아 4M → 합계 10.5M. 실물결제: Bond 1을 넘기고 명목 10M을 받아 합계 10M. 그래서 현금결제가 더 많다.", "trap": "보유 채권이 CTD가 아니면 결제 방식에 따라 총액이 달라진다.", "f": "현금결제 지급액 = (1 − CTD 회수율) × 명목", "why": {"A": "보유 채권(Bond 1)이 CTD였다면 같았겠지만, CTD는 Bond 2입니다.", "C": "실물결제는 Bond 1을 넘기고 10M만 받아 현금결제(10.5M)보다 적습니다."}, "orig": "Mock 1 Session 2 Q11", "conf": true}, {"id": "mock1-2-Q12", "src": "오답", "module": "FI", "tag": "CDS upfront premium", "vig": 2, "stem": "As a percentage of the notional amount, the estimated upfront premium for the CDS on Company D is closest to:", "opts": {"A": "1.0%.", "B": "1.4%.", "C": "1.5%."}, "ans": "B", "en": "A. 1.0%. — Incorrect\nIncorrect because this is derived by taking the difference between the CDS maturity and effective duration and multiplying it by the CDS coupon rate.\nUpfront premium = (Maturity – Effective duration) × Coupon rate\n= (3 – 2.8) × 5.0%\n= 1.0%\nB. 1.4%. — Correct\nCorrect because the approximate upfront premium for a CDS can be estimated as (Credit spread – Fixed coupon rate) × Effective duration.\nNote that the duration used here is effective duration, since the cash flows arising from the coupon leg of the CDS are uncertain because they are contingent on the reference entity not defaulting.\nEffective duration = 2.8\nCredit spread = 5.5%\nFixed coupon rate = 5.0%\nUpfront premium ≈ (Credit spread – Coupon rate) × Effective duration\n= (5.5% – 5.0%) × 2.8\n= 1.4%\nC. 1.5%. — Incorrect\nIncorrect because this uses the wrong duration of 3 years, which is the CDS maturity, instead of the effective CDS duration, to calculate the upfront premium.\nUpfront premium ≈ (Credit spread – Coupon rate) × Maturity\n= (5.5% – 5.0%) × 3\n= 1.5%", "ko": "(5.5% − 5.0%) × 2.8 = 1.4%. CDS의 쿠폰 다리는 부도가 안 나야만 지급되는 불확실한 현금흐름이라 만기가 아니라 effective duration을 쓴다.", "trap": "CDS 만기(3년)가 아니라 effective duration(2.8)을 곱한다.", "f": "Upfront ≈ (credit spread − fixed coupon) × effective duration", "why": {"A": "(만기 − duration) × 쿠폰으로 잘못 계산했습니다.", "C": "duration 대신 만기 3년을 곱했습니다."}, "orig": "Mock 1 Session 2 Q12", "conf": true}, {"id": "mock1-2-Q13", "src": "정답", "module": "PM", "tag": "APT 기대수익률", "vig": 3, "stem": "Based on the model used by Walker, the expected return on the active ETF is:", "opts": {"A": "9.6%.", "B": "10.4%.", "C": "12.4%."}, "ans": "C", "en": "A. 9.6%. — Incorrect\nIncorrect because the risk-free rate is subtracted from each factor price:\nE\n[\nR\n]\n=\nR\nF\n+\n(\nλ\n1\n-\nR\nF\n)\nβ\n1\n+\nλ\n2\n(\nβ\n2\n-\nR\nF\n)\n=\n2\n+\n(\n8\n-\n2\n)\n×\n1\n+\n(\n6\n-\n2\n)\n×\n0\n.\n4\n=\n9\n.\n6\n%\nB. 10.4%. — Incorrect\nIncorrect because the risk-free rate is not included in the calculation. With RF = 0%, λ1 = 8.0%, λ2 = 6.0%, β1 = 1.0, and β2 = 0.4:\nE\n[\nR\n]\n=\n0\n+\nλ\n1\nβ\n1\n+\nλ\n2\nβ\n2\n=\n0\n+\n8\n×\n1\n+\n6\n×\n0\n.\n4\n=\n10\n.\n4\n%\nC. 12.4%. — Correct\nCorrect because based on APT with RF = 2%, λ1 = 8.0%, λ2 = 6.0%, β1 = 1.0, and β2 = 0.4:\nE\n[\nR\n]\n=\nR\nF\n+\nλ\n1\nβ\n1\n+\nλ\n2\nβ\n2\n=\n2\n+\n8\n×\n1\n+\n6\n×\n0\n.\n4\n=\n12\n.\n4\n%", "ko": "APT에서 factor price(λ)는 이미 위험프리미엄이다. E(R) = 2 + 8 × 1.0 + 6 × 0.4 = 2 + 8 + 2.4 = 12.4%.", "trap": "factor price에서 RF를 또 빼지 않는다.", "f": "E(R) = RF + λ1β1 + λ2β2", "why": {"A": "factor price에서 RF를 빼서 계산했습니다.", "B": "RF(2%)를 더하지 않았습니다."}, "orig": "Mock 1 Session 2 Q13", "conf": false}, {"id": "mock1-2-Q14", "src": "정답", "module": "PM", "tag": "APT 가정", "vig": 3, "stem": "The correct answer to the client's question is:", "opts": {"A": "Assumption 1.", "B": "Assumption 2.", "C": "Assumption 3."}, "ans": "C", "en": "A. Assumption 1. — Incorrect\nIncorrect because the APT does not require that the factors are correlated. Assumption 1 states that a factor model describes asset returns.\nB. Assumption 2. — Incorrect\nIncorrect because the APT Assumption 3 states that arbitrage opportunities are not available.\nC. Assumption 3. — Correct\nCorrect because APT assumption (number 2) states that investors can form well-diversified portfolios that eliminate asset-specific risk. Walker's calculation is based on the APT. Note: there is no reason to state in Assumption 3 that the portfolio is well diversified. 'Well diversified' either means elimination of asset-specific risk, in which case the inclusion is redundant, or it means something else -- in which case it is not required.", "ko": "APT 가정은 ① 수익률이 factor model로 설명된다 ② 잘 분산된 포트폴리오로 개별자산 위험을 없앨 수 있다 ③ 차익거래 기회가 없다. 보기 중 가정에 맞는 것은 Assumption 3(개별자산 위험 제거 가능).", "trap": "APT는 차익거래 기회가 '없다'고 가정한다. factor 간 상관은 요구하지 않는다.", "f": "", "why": {"A": "APT는 factor들이 서로 상관돼 있을 것을 요구하지 않습니다.", "B": "APT는 차익거래 기회가 없다고 가정합니다."}, "orig": "Mock 1 Session 2 Q14", "conf": false}, {"id": "mock1-2-Q15", "src": "정답", "module": "PM", "tag": "ETF 보유기간 총비용", "vig": 3, "stem": "The 2-year holding period cost of the active ETF is:", "opts": {"A": "1.22%.", "B": "1.34%.", "C": "1.44%."}, "ans": "A", "en": "A. 1.22%. — Correct\nCorrect because:\nETF annual management fee is 0.50%\nETF one-way commission is 0.05%\nETF bid-ask spread is 0.12%.\nRound trip trading costs =\nTwo-year holding-period cost = Round trip trading costs + 2 Management fee\n= 0.22 + 2 0.50 = 1.22%,\nwhere annual management fee is multiplied by 2 (years).\nB. 1.34%. — Incorrect\nIncorrect because the bid-ask spread is used rather than 1/2 the bid-ask spread in the second term of the equation:\nETF annual management fee is 0.50%\nETF one-way commission is 0.05%\nETF bid-ask spread is 0.12%.\nRound trip trading costs =\nTwo-year holding-period cost = Round trip trading costs + 2 × Management fee\n= 0.34 + 2 0.50 = 1.34%,\nwhere annual management fee is multiplied by 2.\nC. 1.44%. — Incorrect\nIncorrect because the trading costs are incorrectly multiplied by two when computing the two-year holding-period costs.\nETF annual management fee is 0.50%\nETF one-way commission is 0.05%\nETF bid-ask spread is 0.12%.\nRound trip trading costs =\nTwo-year holding-period cost = 2Round trip trading costs + 2Management fee\n= 2 0.22 + 2 0.50 = 1.44%,\nwhere round trip trading cost (incorrectly) and annual management fee is multiplied by 2 (years).", "ko": "왕복 거래비용 = 2 × (0.05% + 0.12%/2) = 0.22%. 2년 보수 = 2 × 0.50% = 1.00%. 합계 1.22%.", "trap": "스프레드는 편도에 절반씩, 거래비용은 한 번만(왕복) 든다.", "f": "보유기간 비용 = 왕복 거래비용 + 연 보수 × 연수, 왕복 = 2 × (편도 수수료 + 스프레드/2)", "why": {"B": "스프레드 절반이 아니라 전체(0.12%)를 편도마다 넣었습니다.", "C": "왕복 거래비용까지 2배(연수만큼) 했습니다."}, "orig": "Mock 1 Session 2 Q15", "conf": false}, {"id": "mock1-2-Q16", "src": "정답", "module": "PM", "tag": "ETF 창설·환매 차익거래", "vig": 3, "stem": "The mechanism that addresses the client's concern about the active ETF involves the:", "opts": {"A": "ETF sponsor creating new shares.", "B": "authorized participant buying the basket of securities and selling the ETF shares in the open market.", "C": "authorized participant selling the basket of securities and buying the ETF shares in the open market."}, "ans": "C", "en": "A. ETF sponsor creating new shares. — Incorrect\nIncorrect because the ETF sponsor would lose money if it issued new ETF shares that are selling for less than the NAV of the underlying basket.\nB. authorized participant buying the basket of securities and selling the ETF shares in the open market. — Incorrect\nIncorrect because this is the action an AP might take if the fund is selling at a premium to its NAV. The AP would lose money because it would pay more for the underlying shares then it receives from selling the ETF.\nC. authorized participant selling the basket of securities and buying the ETF shares in the open market. — Correct\nCorrect because if the ETF is selling at a discount to the NAV of the underlying stocks, AP may choose to redeem shares by exchanging them for the basket of securities with the fund's issuer.", "ko": "ETF가 NAV보다 할인되면 AP는 시장에서 싼 ETF 주식을 사서 발행사에 넘기고(환매) 바스켓 주식을 받아 판다. 이 차익거래로 ETF 가격이 NAV 쪽으로 올라가 큰 할인이 유지되지 않는다.", "trap": "할인 → AP가 ETF 매수·바스켓 매도(환매), 프리미엄 → 바스켓 매수·ETF 매도(창설).", "f": "", "why": {"A": "할인일 때 새 주식을 만들면 발행사가 손해를 봅니다.", "B": "프리미엄일 때 AP가 하는 거래입니다."}, "orig": "Mock 1 Session 2 Q16", "conf": false}, {"id": "mock1-2-Q17", "src": "정답", "module": "FSA", "tag": "외화 거래: 미실현 환차익", "vig": 4, "stem": "With regard to its USD accounts receivable, Obsidian should:", "opts": {"A": "not record any foreign currency transaction gain or loss until it is realized on settlement.", "B": "record an unrealized foreign currency transaction loss of EUR 15,000 for the most recent year.", "C": "record an unrealized foreign currency transaction gain of EUR 15,000 for the most recent year."}, "ans": "C", "en": "A. not record any foreign currency transaction gain or loss until it is realized on settlement. — Incorrect\nIncorrect because the increase in the value of the accounts receivable and the transaction gain may not be deferred until the settlement date.\nB. record an unrealized foreign currency transaction loss of EUR 15,000 for the most recent year. — Incorrect\nIncorrect because the accounts receivable would increase, rather than decrease, by EUR 15,000.\nC. record an unrealized foreign currency transaction gain of EUR 15,000 for the most recent year. — Correct\nCorrect because for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gains and losses are reported on the income statement, creating one of the few situations in which accounting rules allow, indeed require, companies to include (recognize) a gain or loss in income before it has been realized.\nAt the time of sale, the receivable was valued at EUR 950,000 (USD 1,000,000 × EUR/USD 0.950). On 31 December (at year end), the receivable was valued at EUR 965,000 (USD 1,000,000 × EUR/USD 0.965). Since the accounts receivable increased in value by EUR 15,000 on the balance sheet, Obsidian should record an unrealized foreign exchange gain of EUR 15,000 on the income statement.", "ko": "USD 1M 매출채권: 거래일 0.950, 기말 0.965 EUR/USD. 채권의 EUR 가치가 1M × (0.965 − 0.950) = EUR 15,000 늘었다. 결제 전이라도 IFRS·US GAAP 모두 기말에 미실현 거래이익으로 당기손익에 인식한다.", "trap": "결제 전에도 기말 환율로 다시 재서 손익에 반영한다.", "f": "환차익 = 외화 금액 × (기말 환율 − 거래일 환율)", "why": {"A": "결제일까지 미룰 수 없고 기말에 인식해야 합니다.", "B": "USD가 강해져 채권 가치가 늘었으므로 손실이 아니라 이익입니다."}, "orig": "Mock 1 Session 2 Q17", "conf": false}, {"id": "mock1-2-Q18", "src": "오답", "module": "FSA", "tag": "Current rate method: 누적 환산조정", "vig": 4, "stem": "On 31 December of the most recent year, after translating Ametrine, Obsidian should have reported a:", "opts": {"A": "foreign exchange loss on its consolidated income statement.", "B": "positive translation adjustment on its consolidated balance sheet.", "C": "negative translation adjustment on its consolidated balance sheet."}, "ans": "B", "en": "A. foreign exchange loss on its consolidated income statement. — Incorrect\nIncorrect because Obsidian translates Ametrine's financial statements using the current rate method, with a translation adjustment reported on the consolidated balance sheet rather than the income statement. Gains or losses are reported on the consolidated income statement only when a subsidiary is translated using the temporal method.\nB. positive translation adjustment on its consolidated balance sheet. — Correct\nCorrect because the current rate method results in a net asset balance sheet exposure (except in the rare case in which an entity has negative stockholders' equity):\nItems Translated at Current Exchange Rate\nTotal assets > Total liabilities → Net asset balance sheet exposure\nWhen the foreign currency increases in value (i.e., strengthens), application of the current rate method results in an increase in the positive cumulative translation adjustment (or a decrease in the negative translation adjustment) reflected in stockholders' equity.\nSince Ametrine had positive equity (assets > liabilities), and the foreign currency (GBP) of Ametrine strengthened against the EUR, Obsidian should report a positive translation adjustment to stockholders' equity on the consolidated balance sheet.\nC. negative translation adjustment on its consolidated balance sheet. — Incorrect\nIncorrect because when the foreign currency decreases in value (i.e., weakens), the current rate method results in a decrease in the positive cumulative translation adjustment (or an increase in the negative cumulative translation adjustment) in stockholders' equity.\nDuring the most recent year, the foreign currency (GBP) strengthened, rather than weakened, against the EUR. A positive translation adjustment should be reported on the consolidated balance sheet.", "ko": "Current rate method는 자산·부채를 모두 기말 환율로 환산하므로 순자산(자본) 노출이 생긴다. Ametrine은 자본이 양수이고 GBP가 EUR 대비 강해졌으므로, 순자산의 EUR 가치가 늘어 연결 재무상태표(자본, OCI)에 양(+)의 환산조정이 생긴다.", "trap": "current rate method의 환산손익은 손익계산서가 아니라 자본(CTA)에 간다.", "f": "", "why": {"A": "current rate method의 환산손익은 손익계산서가 아니라 자본에 반영됩니다.", "C": "외화(GBP)가 강해졌고 순자산 노출이라 조정은 양(+)입니다."}, "orig": "Mock 1 Session 2 Q18", "conf": true}, {"id": "mock1-2-Q19", "src": "정답", "module": "FSA", "tag": "Temporal method: 매출총이익률", "vig": 4, "stem": "Citrine's gross profit margin on 31 December of the most recent year was:", "opts": {"A": "lower after translation.", "B": "the same after translation.", "C": "higher after translation."}, "ans": "C", "en": "A. lower after translation. — Incorrect\nIncorrect because the PLN steadily strengthened relative to the EUR throughout the most recent year. Cost of goods sold will be lower, due to a historical cost for expensed inventory that is lower than the average cost used for translating its revenues.\nB. the same after translation. — Incorrect\nIncorrect because the PLN steadily strengthened relative to the EUR throughout the most recent year. Cost of goods sold will be lower, due to a historical cost for expensed inventory that is lower than the average cost used for translating its revenues.\nC. higher after translation. — Correct\nCorrect because, under the temporal method, a foreign entity might have the parent's presentation currency as its functional currency. To achieve the objective of translating to the parent's presentation currency as if the subsidiary's transactions had been recorded in that currency, the following procedures are used:\nRevenues and expenses, other than those expenses related to non-monetary assets (as explained below), are translated at the exchange rate that existed when the transactions took place (for practical reasons, average rates may be used).\nExpenses related to non-monetary assets, such as cost of goods sold (inventory), depreciation (fixed assets), and amortization (intangible assets), are translated at the exchange rates used to translate the related assets. (Non-monetary assets and liabilities measured at historical cost are translated at historical exchange rates.)\nObsidian translates Citrine by using the temporal method (that is, the foreign entity has the parent's presentation currency as its functional currency). Since the PLN steadily strengthened relative to the EUR throughout the most recent year, the cost of goods sold will be lower since it is translated at the lower historical cost than the average rate, which is used to translate the revenues. Accordingly, the gross profit margin [(Sales revenue – Cost of goods sold) / Sales revenue] will be higher after translation.", "ko": "Temporal method에서 매출은 평균 환율, 매출원가(재고)는 재고를 산 시점의 역사적 환율로 환산한다. PLN이 계속 강해졌으므로 예전 환율(PLN 약할 때)로 환산한 매출원가가 상대적으로 작다. 매출은 크고 원가는 작아져 환산 후 매출총이익률이 더 높다.", "trap": "재고·감가상각 같은 비화폐성 항목 관련 비용은 역사적 환율로 환산한다.", "f": "", "why": {"A": "외화 강세에서 역사적 환율 원가가 작아지므로 이익률은 오히려 올라갑니다.", "B": "매출과 원가에 다른 환율을 쓰므로 이익률이 달라집니다."}, "orig": "Mock 1 Session 2 Q19", "conf": false}, {"id": "mock1-2-Q20", "src": "정답", "module": "FSA", "tag": "초인플레 국가: IFRS 처리", "vig": 4, "stem": "If Erikson's concern about Kunzite is realized, Obsidian should:", "opts": {"A": "translate Kunzite's financial statements using the temporal method directly.", "B": "restate Kunzite's financial statements for inflation, and then translate them using the temporal method.", "C": "restate Kunzite's financial statements for inflation, and then translate them using the current exchange rate."}, "ans": "C", "en": "A. translate Kunzite's financial statements using the temporal method directly. — Incorrect\nIncorrect because this is the required treatment under US GAAP, however, Obsidian reports under IFRS. US GAAP requires a very different approach for translating the foreign currency financial statements of foreign entities located in highly inflationary economies. US GAAP does not allow restatement for inflation but instead requires the foreign entity's financial statements to be remeasured as if the functional currency were the reporting currency (i.e., the temporal method). IFRS requires the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate.\nB. restate Kunzite's financial statements for inflation, and then translate them using the temporal method. — Incorrect\nIncorrect because the financial statements should first be restated for inflation and the inflation-adjusted financial statements should then be translated using the current exchange rate, not using the temporal method. IFRS requires the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate.\nC. restate Kunzite's financial statements for inflation, and then translate them using the current exchange rate. — Correct\nCorrect because IFRS and US GAAP differ substantially in their approach to translating the foreign currency financial statements of foreign entities operating in the currency of a hyperinflationary economy. US GAAP simply require the foreign currency financial statements of such an entity to be translated as if the parent's currency is the functional currency (i.e., the temporal method must be used with the resulting translation gain or loss reported in net income). IFRS require the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate.", "ko": "IFRS(IAS 29)는 초인플레 국가 자회사의 재무제표를 먼저 현지 물가지수로 재작성한 뒤, 모든 항목을 현재 환율로 환산한다. US GAAP은 temporal method를 쓴다. Obsidian은 IFRS 보고 회사다.", "trap": "'temporal method'는 US GAAP의 방식이다.", "f": "", "why": {"A": "US GAAP의 방식입니다. Obsidian은 IFRS로 보고합니다.", "B": "재작성 후에는 temporal이 아니라 현재 환율로 환산합니다."}, "orig": "Mock 1 Session 2 Q20", "conf": false}, {"id": "mock1-2-Q21", "src": "정답", "module": "PM", "tag": "Information ratio", "vig": 5, "stem": "Fund X’s ex ante information ratio is closest to:", "opts": {"A": "0.06.", "B": "0.38.", "C": "0.49."}, "ans": "B", "en": "A. 0.06. — Incorrect\nIncorrect because this answer uses Fund X’s standard deviation of returns as the denominator instead of active risk:\nFund X’s active return / Fund X’s standard deviation of returns = 0.5%/8.9% = 0.0562 ≈ 0.06\nB. 0.38. — Correct\nCorrect because Fund X’s ex ante information ratio (IR) is computed as:\nIR = Fund X’s active return / Fund X’s active risk\nFund X’s active return = Fund X’s expected return – Benchmark’s expected return = 6.7% – 6.2% = 0.5%\nFund X’s active risk = 1.3% (given in the vignette)\nTherefore,\nIR = 0.5%/1.3% = 0.3846 ≈ 0.38\nThe information ratio tells the investor how much active return has been earned, or is expected to be earned, for incurring the level of active risk. Active return, RA, is the difference between the managed portfolio return, RP, and the benchmark portfolio return, RB. The information ratio of an actively managed portfolio, IR, is calculated by dividing the active return by active risk:\nIR = [RP − RB] / [σ(RP − RB)] = RA/σA\nC. 0.49. — Incorrect\nIncorrect because this is Fund X’s Sharpe ratio (SR), not its information ratio:\nSR = (Fund X’s expected return – risk-free rate) / Fund X’s standard deviation of returns\n= (6.7% – 2.3%) / 8.9% = 0.4944 ≈ 0.49", "ko": "Fund X 액티브 수익 = 6.7% − 6.2% = 0.5%, 액티브 위험 = 1.3%. IR = 0.5/1.3 = 0.38.", "trap": "분모는 총 표준편차가 아니라 active risk(tracking error).", "f": "IR = 액티브 수익 / 액티브 위험", "why": {"A": "분모에 총 표준편차(8.9%)를 썼습니다.", "C": "Sharpe ratio((6.7 − 2.3)/8.9)를 계산했습니다."}, "orig": "Mock 1 Session 2 Q21", "conf": false}, {"id": "mock1-2-Q22", "src": "정답", "module": "PM", "tag": "최적 결합 포트폴리오 Sharpe ratio", "vig": 5, "stem": "The maximum Sharpe ratio that can be achieved by combining Fund Y and the benchmark portfolio is closest to:", "opts": {"A": "0.29.", "B": "0.54.", "C": "0.74."}, "ans": "B", "en": "A. 0.29. — Incorrect\nIncorrect because this calculation does not apply the square root to the equation:\nSRC = (SRB^2+ IRY^2)\nSRC = (0.4699^2+ 0.27^2) = 0.2937 ≈ 0.29\nB. 0.54. — Correct\nCorrect because the maximum Sharpe ratio that can be achieved by combining the benchmark portfolio (B) and an actively managed portfolio (Fund Y) is determined by the equation below:\nSRC^2 = SRB^2+ IRY^2\nSRC = Sharpe ratio of combined portfolio\nSRB= Sharpe ratio of benchmark portfolio\nIRY= information ratio of Fund Y\nAn important property in active management theory is that given the opportunity to adjust active risk and return by investing in both the actively managed and benchmark portfolios, the squared Sharpe ratio of an actively managed portfolio is equal to the squared Sharpe ratio of the benchmark plus the information ratio squared.\nTherefore:\nSRC = (SRB^2+ IRY^2)^(1/2)\nSRB= (E(RB) – Risk-free rate) / StdDevB\nSRB= (6.2% – 2.3%) / 8.3% = 0.4699\nSRC = (0.4699^2+ 0.27^2)^(1/2) = 0.5419 ≈ 0.54\nC. 0.74. — Incorrect\nIncorrect because this answer is the simple addition of the benchmark’s Sharpe ratio and Fund Y’s information ratio:\nSRC = SRB+ IRY = 0.4699 + 0.27 = 0.7399 ≈ 0.74", "ko": "벤치마크 SR = (6.2 − 2.3)/8.3 = 0.4699. Fund Y IR = 0.27. SR_C = √(0.4699² + 0.27²) = √(0.2208 + 0.0729) = √0.2937 = 0.54.", "trap": "제곱합에 루트를 씌운다. 단순 합이 아니다.", "f": "SR_C² = SR_B² + IR²", "why": {"A": "제곱합(0.2937)에 루트를 씌우지 않았습니다.", "C": "SR과 IR을 그냥 더했습니다."}, "orig": "Mock 1 Session 2 Q22", "conf": false}, {"id": "mock1-2-Q23", "src": "정답", "module": "PM", "tag": "Fundamental law: IC·TC·breadth", "vig": 5, "stem": "Compared to Fund Y's manager, Bolton's observations suggest that Fund X's manager most likely has:", "opts": {"A": "greater breadth.", "B": "a higher transfer coefficient.", "C": "a higher information coefficient."}, "ans": "C", "en": "A. greater breadth. — Incorrect\nIncorrect because breadth measures the number of independent investment decisions made by the investor, typically defined using the number of securities and the rebalancing frequency. Bolton observes that both managers have access to the same set of securities and rebalance their portfolios at the same frequency. Therefore, it is most likely that breadth is similar for both managers.\nB. a higher transfer coefficient. — Incorrect\nIncorrect because the transfer coefficient measures the degree to which the investor’s forecasts are translated into active weights. Bolton observes that neither manager has any restrictions on implementing their forecasts when constructing portfolios. Therefore, it is most likely that the transfer coefficients for Fund X’s and Fund Y’s managers are similar.\nC. a higher information coefficient. — Correct\nCorrect because the information coefficient measures a manager’s ability to forecast returns. Bolton observes that Fund X’s manager has better forecasting skills than Fund Y’s manager. Therefore, it is most likely that the information coefficient is higher for Fund X’s manager than for Fund Y’s manager.", "ko": "두 매니저는 같은 종목·같은 리밸런싱 빈도(breadth 같음)이고 제약이 없다(TC 같음). 차이는 X 매니저의 예측력이 더 좋다는 것뿐이므로 information coefficient(IC)가 더 높다.", "trap": "예측력 = IC, 예측을 비중에 옮기는 정도 = TC, 독립적 결정 수 = breadth.", "f": "IR ≈ TC × IC × √BR", "why": {"A": "같은 종목과 리밸런싱 빈도라 breadth는 같습니다.", "B": "두 매니저 모두 제약이 없어 TC는 같습니다."}, "orig": "Mock 1 Session 2 Q23", "conf": false}, {"id": "mock1-2-Q24", "src": "오답", "module": "PM", "tag": "실질 무위험 금리 결정 요인", "vig": 5, "stem": "Based on the macroeconomic data of the three countries, real short-term default-free interest rates are most likely highest in:", "opts": {"A": "Country 1.", "B": "Country 2.", "C": "Country 3."}, "ans": "C", "en": "A. Country 1. — Incorrect\nIncorrect because Country 1 has the lowest real GDP growth rate (2.8%) and the lowest volatility of real GDP growth (0.5%). Therefore, real default-free interest rates in Country 1 are most likely the lowest of the three countries.\nB. Country 2. — Incorrect\nIncorrect because, although Country 2 has the same real GDP growth rate (4.2%) as Country 3, the volatility of its real GDP growth (0.5%) is lower than Country 3's (0.8%). Therefore, real default-free interest rates in Country 2 are most likely lower than in Country 3.\nC. Country 3. — Correct\nCorrect because Country 3 has both the highest real GDP growth rate (4.2%) and the highest volatility of real GDP growth (0.8%) among the three countries.\nAn economy with higher trend real economic growth, other things being equal, should have higher real default-free interest rates than an economy with lower trend growth. This is because more goods and services will be available in the future relative to today, so investors' willingness to substitute over time will fall, resulting in less saving and more borrowing, so that the real default-free interest rate increases.\nAlso, other things being equal, real interest rates are higher in an economy in which GDP growth is more volatile than in an economy in which growth is more stable. Because of such uncertain circumstances, the real default-free interest rate will be positively related to the expected volatility of GDP growth.", "ko": "실질 성장률이 높을수록(미래 소비가 더 많아 지금 저축할 유인↓) 실질 금리가 높다. 성장의 변동성이 클수록 소비 헤지 수요가 커져 위험프리미엄이 붙어 실질 금리가 높다. Country 3은 성장률(4.2%)과 변동성(0.8%)이 둘 다 가장 높다.", "trap": "Country 2와 3은 성장률이 같으니 변동성으로 구분한다.", "f": "", "why": {"A": "성장률(2.8%)과 변동성(0.5%)이 모두 가장 낮아 실질 금리가 가장 낮습니다.", "B": "성장률은 Country 3과 같지만 변동성(0.5%)이 낮습니다."}, "orig": "Mock 1 Session 2 Q24", "conf": true}, {"id": "mock1-2-Q25", "src": "정답", "module": "CI", "tag": "배당 증가와 agency 비용", "vig": 6, "stem": "Which of the following is the most likely consequence of the expected change in Firm A's dividend during the current year?", "opts": {"A": "Negative information will be conveyed to the market", "B": "The agency conflict between shareholders and debtholders will be reduced", "C": "Management's ability to invest in negative NPV projects will be constrained"}, "ans": "C", "en": "A. Negative information will be conveyed to the market — Incorrect\nIncorrect because dividend increases typically convey positive information. Empirical studies broadly support the thesis that dividend initiations or increases convey positive information and are associated with future earnings growth, whereas dividend omissions or reductions convey negative information.\nB. The agency conflict between shareholders and debtholders will be reduced — Incorrect\nIncorrect because increasing dividends will exacerbate the scope of the agency conflict between shareholders and debtholders.\nWhen a company has debt outstanding, the payment of dividends reduces the cash cushion available to the company for the disbursement of fixed required payments to bondholders. The payment of large dividends, with the intention of transferring wealth from bondholders to shareholders, could lead to underinvestment in profitable projects. All else equal, both dividends and share repurchases increase the default risk of debt.\nC. Management's ability to invest in negative NPV projects will be constrained — Correct\nCorrect because increasing dividends reduces the potential for the firm's managers to squander free cash flow.\nWhen agents (the managers) and owners (the shareholders) are two separate parties, managers may have an incentive to maximize their own welfare at the company's expense because they own none or relatively small percentages of the company for which they work and thus do not bear all the costs of such actions. One managerial incentive of particular concern is the potential private benefit managers may obtain from investment in negative present value (NPV) projects. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.", "ko": "성장 기회가 적고 FCF가 꾸준한 Firm A가 배당을 늘리면, 경영진이 쓸 수 있는 잉여현금이 줄어 NPV 음수 사업에 투자(empire building)하기 어려워진다. 주주-경영진 agency 갈등이 줄어든다.", "trap": "배당 증가는 주주-채권자 갈등은 오히려 키운다.", "f": "", "why": {"A": "배당 증가는 보통 긍정적 신호입니다.", "B": "배당으로 자산이 빠져 채권자에게 불리해지므로 주주-채권자 갈등은 커집니다."}, "orig": "Mock 1 Session 2 Q25", "conf": false}, {"id": "mock1-2-Q26", "src": "정답", "module": "CI", "tag": "Target payout adjustment model", "vig": 6, "stem": "Maloy should expect Firm A's dividend per share for the current year to be closest to:", "opts": {"A": "$3.08.", "B": "$3.20.", "C": "$3.30."}, "ans": "C", "en": "A. $3.08. — Incorrect\nIncorrect because this choice uses the payout ratio of the previous year (i.e., 50%) instead of the target payout ratio. This answer can be obtained as follows:\nExpected DPS = $3.00 + [($6.48 × 50% – $3.00) × 1/3] = $3.00 + $0.08 = $3.08\nB. $3.20. — Incorrect\nIncorrect because this choice does not incorporate the expected earnings growth (i.e., 8%). This answer can be obtained as follows:\nExpected DPS = $3.00 + [($6.00 × 60% – $3.00) × 1/3] = $3.00 + $0.20 = $3.20\nC. $3.30. — Correct\nCorrect because expected dividend per share (DPS) can be calculated as:\nExpected DPS = Previous DPS + [(Expected EPS × Target payout ratio – Previous DPS) × Adjustment factor]\nPrevious DPS is calculated using the previous year's EPS and payout ratio (provided in the vignette as $6.00 and 50%, respectively):\nPrevious DPS = $6.00 × 50% = $3.00\nExpected EPS is calculated using the expected EPS growth (provided in the vignette as 8%):\nExpected EPS = $6.00 × (1 + 8%) = $6.48\nTarget payout ratio = 60% (provided in the vignette)\nAdjustment factor = 1 / Adjustment period (provided in the vignette as 3 years) = 1/3\nTherefore,\nExpected DPS = $3.00 + [($6.48 × 60% – $3.00) × 1/3] = $3.00 + $0.296 = $3.296 ≈ $3.30", "ko": "직전 DPS = 6.00 × 50% = 3.00. 기대 EPS = 6.00 × 1.08 = 6.48. 목표 배당 = 6.48 × 60% = 3.888. 기대 DPS = 3.00 + (3.888 − 3.00) × 1/3 = 3.00 + 0.296 = $3.30.", "trap": "목표 payout(60%)과 이번 해 기대 EPS(성장 반영)를 쓴다.", "f": "기대 DPS = 직전 DPS + (기대 EPS × 목표 payout − 직전 DPS) × (1/조정 기간)", "why": {"A": "목표 payout 대신 직전 payout 50%를 썼습니다.", "B": "EPS 성장 8%를 반영하지 않았습니다."}, "orig": "Mock 1 Session 2 Q26", "conf": false}, {"id": "mock1-2-Q27", "src": "정답", "module": "CI", "tag": "차입 자사주 매입 후 EPS", "vig": 6, "stem": "If the share repurchase proposal is implemented, Firm B's expected EPS for the current year will be closest to:", "opts": {"A": "$9.72.", "B": "$10.23.", "C": "$10.53."}, "ans": "B", "en": "A. $9.72. — Incorrect\nIncorrect because this choice does not account for the reduction in outstanding shares. This answer can be obtained as follows:\nEPS after buyback = ($2,000 million – $56 million) / 200 million = $9.72\nB. $10.23. — Correct\nCorrect because the firm's EPS following the share repurchase is calculated as:\nEPS after buyback = (Earnings – After-tax cost of funds) / Shares outstanding after buyback,\nwhere\nEarnings = Shares outstanding × EPS = 200 million × $10 = $2,000 million\nAfter-tax cost of funds = Number of shares to be repurchased × Share price × After-tax cost of borrowing = 10 million × $80 × 7% = $56 million\nShares outstanding after buyback = 200 million – 10 million = 190 million\nTherefore,\nEPS after buyback = ($2,000 million – $56 million) / 190 million = $10.2316 ≈ $10.23\nC. $10.53. — Incorrect\nIncorrect because this choice does not account for the effect of debt financing on after-tax earnings, thus implicitly assuming that the repurchase would be funded by surplus cash. This answer can be obtained as follows:\nEPS after buyback = ($2,000 million) / 190 million = $10.5263 ≈ $10.53", "ko": "이익 = 200M × $10 = $2,000M. 세후 차입비용 = 10M × $80 × 7% = $56M. EPS = (2,000 − 56)/(200 − 10) = 1,944/190 = $10.23.", "trap": "분자(이자비용)와 분모(주식 수 감소)를 둘 다 반영한다.", "f": "EPS = (이익 − 세후 차입비용) / (주식 수 − 매입 주식 수)", "why": {"A": "주식 수 감소를 반영하지 않았습니다(1,944/200).", "C": "차입 이자비용을 빼지 않았습니다(잉여현금으로 산 것처럼)."}, "orig": "Mock 1 Session 2 Q27", "conf": false}, {"id": "mock1-2-Q28", "src": "정답", "module": "CI", "tag": "자사주 매입과 BVPS", "vig": 6, "stem": "If the share repurchase proposal is implemented, Firm B's expected book value per share of common equity will most likely:", "opts": {"A": "decrease.", "B": "not change.", "C": "increase."}, "ans": "A", "en": "A. decrease. — Correct\nCorrect because the prevailing market price per share (i.e., $80) is greater than the BVPS of common equity (i.e., $60).\nWhen the market price per share is greater than its book value per share, BVPS will decrease after the share repurchase.\nAlthough no calculations are required to answer the question, one might show that BVPS after the share repurchase will decline to $58.95:\n[($60 × 200 million) – ($80 × 10 million)] / (200 million – 10 million) = $58.95 < $60\nB. not change. — Incorrect\nIncorrect because the prevailing market price per share (i.e., $80) is greater than the BVPS of common equity (i.e., $60). This choice would be correct if the prevailing market price per share were equal to the BVPS of common equity.\nC. increase. — Incorrect\nIncorrect because the prevailing market price per share (i.e., $80) is greater than the BVPS of common equity (i.e., $60). This choice would be correct if the prevailing market price per share were less than the BVPS of common equity.", "ko": "매입가($80)가 BVPS($60)보다 높으면 매입 후 BVPS는 떨어진다. 계산: (60 × 200M − 80 × 10M)/190M = (12,000 − 800)/190 = $58.95.", "trap": "매입가 > BVPS → BVPS↓, 매입가 < BVPS → BVPS↑.", "f": "", "why": {"B": "매입가와 BVPS가 같을 때만 변하지 않습니다.", "C": "매입가가 BVPS보다 낮을 때 오릅니다."}, "orig": "Mock 1 Session 2 Q28", "conf": false}, {"id": "mock1-2-Q29", "src": "정답", "module": "EQ", "tag": "매출 기반 FCFF 예측", "vig": 7, "stem": "Based on Connor’s assumptions, Lismore’s estimated FCFF (in $ millions) for the next year is closest to:", "opts": {"A": "240.", "B": "330.", "C": "450."}, "ans": "A", "en": "A. 240. — Correct\nCorrect because the forecast FCFF is computed as follows:\n\tForecast\t\nSales\t$3,500\t= $2,500 × (1 + 40%)\nEBIT\t$1,050\t= $3,500 × 30%\nEBIT(1 – Tax rate)\t$840\t= $1,050 × (1 – 20%)\nIncremental Fixed Capital\t$(350)\t= $2,500 × 40% × 35%\nIncremental Working Capital\t$(250)\t= $2,500 × 40% × 25%\nFCFF\t$240\t= $840 – $350 – $250\nwhere:\nSales = (Most recent sales) × (1 + Sales growth)\nEBIT = (Sales forecast) × (EBIT margin)\nEBIT(1 – Tax rate) = After-tax EBIT\nIncremental FC = (Most recent sales) × (Sales growth) × (ΔFC as % Sales growth)\nIncremental WC = (Most recent sales) × (Sales growth) × (ΔWC as % Sales growth)\nFCFF = (EBIT(1 – Tax rate)) – Incremental FC – Incremental WC\nB. 330. — Incorrect\nIncorrect because the proportions of incremental FC and WC financed by debt are included in the forecast FCFF. This would be included when computing FCFE, but not FCFF. Forecast FCFF is erroneously computed as follows:\n\tForecast\t\nSales\t$3,500\t= $2,500 × (1 + 40%)\nEBIT\t$1,050\t= $3,500 × 30%\nEBIT(1 – Tax rate)\t$840\t= $1,050 × (1 – 20%)\nIncremental Fixed Capital\t$(350)\t= $2,500 × 40% × 35%\nIncremental Working Capital\t$(250)\t= $2,500 × 40% × 25%\nNet borrowing\t$90\t= ($350 + $250) × 15%\nFCFF\t$330\t= $840 – $350 – $250 + $90\nwhere:\nSales = (Most recent sales) × (1 + Sales growth)\nEBIT = (Sales forecast) × (EBIT margin)\nEBIT(1 – Tax rate) = After-tax EBIT\nIncremental FC = (Most recent sales) × (Sales growth) × (ΔFC as % Sales growth)\nIncremental WC = (Most recent sales) × (Sales growth) × (ΔWC as % Sales growth)\nNet borrowing = (Incremental FC + Incremental WC) × Proportion financed by debt\nFCFF = (EBIT(1 – Tax rate)) – Incremental FC – Incremental WC + Net borrowing\nC. 450. — Incorrect\nIncorrect because taxes are ignored and the forecast FCFF is erroneously computed as follows:\n\tForecast\t\nSales\t$3,500\t= $2,500 × (1 + 40%)\nEBIT\t$1,050\t= $3,500 × 30%\nIncremental Fixed Capital\t$(350)\t= $2,500 × 40% × 35%\nIncremental Working Capital\t$(250)\t= $2,500 × 40% × 25%\nFCFF\t$450\t= $1,050 – $350 – $250\nwhere:\nSales = (Most recent sales) × (1 + Sales growth)\nEBIT = (Sales forecast) × (EBIT margin)\nIncremental FC = (Most recent sales) × (Sales growth) × (ΔFC as % Sales growth)\nIncremental WC = (Most recent sales) × (Sales growth) × (ΔWC as % Sales growth)\nFCFF = EBIT – Incremental FC – Incremental WC", "ko": "매출 = 2,500 × 1.4 = 3,500, 증가분 1,000. EBIT = 3,500 × 30% = 1,050, 세후 840. 추가 고정자본 = 1,000 × 35% = 350, 추가 운전자본 = 1,000 × 25% = 250. FCFF = 840 − 350 − 250 = $240M.", "trap": "부채로 조달한 비율(15%)은 FCFE 계산에만 쓴다.", "f": "FCFF = EBIT(1 − t) − 추가 고정자본 − 추가 운전자본", "why": {"B": "투자의 부채 조달분(15% × 600 = 90)을 더했습니다. FCFE에서만 씁니다.", "C": "세금을 빼지 않았습니다(1,050 − 600)."}, "orig": "Mock 1 Session 2 Q29", "conf": false}, {"id": "mock1-2-Q30", "src": "오답", "module": "EQ", "tag": "2단계 FCFF 가치: ESG 프리미엄", "vig": 7, "stem": "Based on Connor’s assumptions, the company value (in $ millions) of Omega is closest to:", "opts": {"A": "27,500.", "B": "29,700.", "C": "32,600."}, "ans": "B", "en": "A. 27,500. — Incorrect\nIncorrect because the terminal value of the firm is discounted back three years instead of two years. The value of Omega is erroneously computed as follows.\nStep 1 Identify the FCFFs\nConnor is using a two-stage model with no growth in the first two years followed by a long-term growth rate of 3% starting in Year 3. The first three FCFFs would be:\nYear\tFCFF\n1\t$1,850\n2\t$1,850\n3\t$1,906 = $1,850 × (1 + 3.0%)\nStep 2 Estimate the WACC\nCost of debt = (Pre-tax cost of debt) × (1 – Tax rate) = 6.0% × (1 – 25%) = 4.5%\nCost of equity = Risk-free rate + [Beta × (Market risk premium)] + ESG premium\nCost of equity = 3.5% + [1.4 × 5.5%] + 0.9% = 12.1%\nWACC = Proportion of debt × Cost of debt + Proportion of equity × Cost of equity\nWACC = 0.4 × 4.5% + 0.6 × 12.1% = 9.06%\nStep 3 Estimate the terminal value of the firm but incorrectly assume that the TV is at the end of Year 3\nTV3 = CF3/(WACC – Long-term growth rate) = $1,906/(9.06% – 3.0%) = $31,444\nStep 4 Compute the value of the FCFFs to estimate the value of the firm\nValue of the firm = FCFF1/(1 + WACC) + FCFF2/(1 + WACC)^2 + TV3/(1 + WACC)^3\nValue of the firm = $1,850/1.0906 + $1,850/(1.0906)^2 + $31,444/(1.0906)^3\nValue of the firm = $1,696 + $1,555 + $24,240 = $27,492 ≈ $27,500\nB. 29,700. — Correct\nCorrect because the company value of Omega is the present value of the forecast FCFFs discounted at the WACC, which includes an ESG risk premium added to the cost of equity. The value of Omega is computed as follows.\nStep 1 Identify the FCFFs\nConnor is using a two-stage model with no growth in the first two years followed by a long-term growth rate of 3.0% starting in Year 3. The first three FCFFs would be:\nYear\tFCFF\n1\t$1,850\n2\t$1,850\n3\t$1,906 = $1,850 × (1 + 3.0%)\nStep 2 Estimate the WACC\nCost of debt = (Pre-tax cost of debt) × (1 – Tax rate) = 6.0% × (1 – 25%) = 4.5%\nCost of equity = Risk-free rate + [Beta × (Market risk premium)] + ESG premium\nCost of equity = 3.5% + [1.4 × 5.5%] + 0.9% = 12.1%\nWACC = Proportion of debt × Cost of debt + Proportion of equity × Cost of equity\nWACC = 0.4 × 4.5% + 0.6 × 12.1% = 9.06%\nStep 3 Estimate the terminal value of the firm at the end of Year 2\nTV2 = CF3/(WACC – Long-term growth rate) = $1,906/(9.06% – 3.0%) = $31,444\nStep 4 Compute the value of the FCFFs to estimate the value of the firm\nValue of the firm = FCFF1/(1 + WACC) + (FCFF2 + TV2)/(1 + WACC)^2\nValue of the firm = $1,850/1.0906 + ($1,850 + $31,444)/(1.0906)^2\nValue of the firm = $1,696 + $27,992 = $29,688 ≈ $29,700\nC. 32,600. — Incorrect\nIncorrect because the ESG risk premium is ignored and not added to the cost of equity. The value of Omega is erroneously computed as follows.\nStep 1 Identify the FCFFs\nConnor is using a two-stage model with no growth in the first two years followed by a long-term growth rate of 3% starting in Year 3. The first three FCFFs would be:\nYear\tFCFF\n1\t$1,850\n2\t$1,850\n3\t$1,906 = $1,850 × (1 + 3.0%)\nStep 2 Estimate the WACC\nCost of debt = (Pre-tax cost of debt) × (1 – Tax rate)\nCost of debt = 6.0% × (1 – 25%) = 4.5%\nCost of equity = Risk-free rate + [Beta × (Market risk premium)]\nCost of equity = 3.5% + [1.4 × 5.5%] = 11.2%\nWACC = Proportion of debt × Cost of debt + Proportion of equity × Cost of equity\nWACC = 0.4 × 4.5% + 0.6 × 11.2% = 8.52%\nStep 3 Estimate the terminal value of the firm at the end of Year 2\nTV2 = CF3/(WACC – Long-term growth rate) = $1,906/(8.52% – 3.0%) = $34,520\nStep 4 Compute the value of the FCFFs to estimate the value of the firm\nValue of the firm = FCFF1/(1 + WACC) + (FCFF2 + TV2)/(1 + WACC)^2\nValue of the firm = $1,850/1.0852 + ($1,850 + $34,520)/(1.0852)^2\nValue of the firm = $1,705 + $30,883 = $32,588 ≈ $32,600", "ko": "세후 부채비용 = 6% × 0.75 = 4.5%. 자기자본비용 = 3.5 + 1.4 × 5.5 + 0.9 = 12.1%. WACC = 0.4 × 4.5 + 0.6 × 12.1 = 9.06%. FCFF3 = 1,850 × 1.03 = 1,906, TV2 = 1,906/(9.06% − 3%) = 31,444. 가치 = 1,850/1.0906 + (1,850 + 31,444)/1.0906² = 1,696 + 27,992 = $29,688M ≈ 29,700.", "trap": "TV는 Year 2 말 값이라 2년만 할인한다. ESG 프리미엄은 자기자본비용에 더한다.", "f": "WACC = wd × rd(1 − t) + we × (RF + β × ERP + ESG 프리미엄), TV2 = FCFF3/(WACC − g)", "why": {"A": "Year 2 말 터미널 가치를 3년 할인했습니다.", "C": "ESG 프리미엄을 빼 할인율이 낮아져 가치가 커졌습니다."}, "orig": "Mock 1 Session 2 Q30", "conf": true}, {"id": "mock1-2-Q31", "src": "오답", "module": "EQ", "tag": "자본구조 변경과 FCFF", "vig": 7, "stem": "After incorporating Omega's capital structure change, Connor's FCFF forecasts would most likely be:", "opts": {"A": "lower.", "B": "unchanged.", "C": "higher."}, "ans": "B", "en": "A. lower. — Incorrect\nIncorrect because FCFF is determined before any payments are made to the suppliers of capital. The issuance of debt for the purpose of repurchasing common shares only impacts how the FCFF is distributed to the suppliers of capital but not what the FCFF is.\nAn increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense.\nB. unchanged. — Correct\nCorrect because FCFF is determined before any payments are made to the suppliers of capital. The issuance of debt for the purpose of repurchasing common shares only impacts how the FCFF is distributed to the suppliers of capital but not what the FCFF is.\nChanging leverage (changing the amount of debt financing in the company’s capital structure), however, does have some effects on FCFE particularly. An increase in leverage will not affect FCFF (although it might affect the calculations used to arrive at FCFF). An increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense.\nAlso consider the top down calculation of FCFF starting with cash flow from operations (CFO):\nAssuming that interest paid is included in operating cash flow, FCFF can be estimated as follows:\nFree cash flow to the firm = Cash flow from operations\nPlus: Interest expense × (1 − Tax rate )\nLess: Investment in fixed capital,\nor\nFCFF = CFO + Int(1 – Tax rate) – FCInv.\nNotice that FCFF does not include any returns to investors. The after-tax interest (Int(1 – Tax rate)) payment in the FCFF calculation is there only because it was previously deducted in the calculation of CFO.\nC. higher. — Incorrect\nIncorrect because FCFF is determined before any payments are made to the suppliers of capital. The issuance of debt for the purpose of repurchasing common shares only impacts how the FCFF is distributed to the suppliers of capital but not what the FCFF is.\nAn increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense.", "ko": "FCFF는 자본 제공자에게 지급하기 전의 현금흐름이다. 부채를 발행해 자사주를 사는 것은 FCFF를 누구에게 나누느냐만 바꿀 뿐 FCFF 자체는 그대로다(FCFE는 바뀜).", "trap": "레버리지 변화는 FCFE와 WACC에 영향을 주지, FCFF 예측치는 그대로다.", "f": "", "why": {"A": "부채 이자는 FCFF 계산 이후에 나누는 것이라 FCFF를 줄이지 않습니다.", "C": "자본구조 변경으로 영업 현금흐름이 늘지 않습니다."}, "orig": "Mock 1 Session 2 Q31", "conf": false}, {"id": "mock1-2-Q32", "src": "정답", "module": "EQ", "tag": "Sum-of-the-parts 가치평가", "vig": 7, "stem": "Which of the following is the most appropriate approach for estimating the intrinsic value of Slane?", "opts": {"A": "Relative valuation", "B": "Asset-based valuation", "C": "Sum-of-the-parts valuation"}, "ans": "C", "en": "A. Relative valuation — Incorrect\nIncorrect because Connor could identify publicly traded competitors for the specialty chemicals division only. Relative valuation could not be used for valuing the lithium and the bromine divisions because there were no publicly traded competitors.\nA relative valuation model estimates an asset’s value relative to that of another asset. The idea underlying relative valuation is that similar assets should sell at similar prices.\nB. Asset-based valuation — Incorrect\nIncorrect because asset-based valuation would only be one part of the process of valuing the lithium and bromine divisions, which each hold significant reserves.\nAnother type of absolute valuation is asset-based valuation, which values a company on the basis of the market value of the assets or resources it controls. For appropriate companies asset-based valuation can provide an independent estimate of value, and an analyst typically finds alternative, independent estimates of value to be useful.\nC. Sum-of-the-parts valuation — Correct\nCorrect because the sum-of-the-parts valuation would be the most useful approach to valuing Slane, a firm that is segmented into three independent divisions serving different markets and growing at different rates.\nA variation to valuing a company as a single entity is to estimate its value as the sum of the estimated values of its various businesses considered as independent, going-concern entities. A valuation that sums the estimated values of each of the company’s businesses as if each business were an independent going concern is known as a sum-of-the-parts valuation. (The value derived using a sum-of-the-parts valuation is sometimes called the breakup value or private market value.) Sum-of-the-parts analysis is most useful when valuing a company with segments in different industries that have different valuation characteristics.", "ko": "Slane은 서로 다른 시장·성장률의 독립된 3개 사업부로 나뉘어 있다. 사업부마다 맞는 방법(상대가치, 자산가치 등)으로 따로 평가해 더하는 sum-of-the-parts가 가장 적절하다.", "trap": "비교기업은 specialty chemicals에만 있어 전체에 상대가치를 쓸 수 없다.", "f": "", "why": {"A": "비교기업이 specialty chemicals 사업부에만 있습니다.", "B": "자산가치는 lithium·bromine 사업부 평가의 일부일 뿐입니다."}, "orig": "Mock 1 Session 2 Q32", "conf": false}, {"id": "mock1-2-Q33", "src": "정답", "module": "DER", "tag": "2기간 이항모형 콜옵션", "vig": 8, "stem": "Using a two-period binomial model, the no-arbitrage value of the Tara call option is closest to:", "opts": {"A": "INR 1.31.", "B": "INR 2.00.", "C": "INR 2.80."}, "ans": "B", "en": "A. INR 1.31. — Incorrect\nIncorrect because a single-period binomial model is incorrectly used to calculate the fair value of the option as follows;\nc^(+) = Max(0,uS – X) = Max (0, 1.5 × 10 –12) = 3\nc^(-) = Max(0,dS – X) = Max (0, 0.67 × 10 –12) = 0\nπ = [(1+ r – d) / (u – d)] = (1.05 – 0.67) / (1.5 – 0.67) = 0.457831\nc = PV [πc^(+) + (1 - π)c^(-)]\nWhere PV = 1 / (1 + r)\nc = (1 / 1.05) × [0.4

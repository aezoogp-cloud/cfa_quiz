57831 × 3 + 0.542169 x 0] = 1.30809 ≈ 1.31\nB. INR 2.00. — Correct\nCorrect because the calculation using the two-period binomial model involves the following 5 steps:\nStep 1: Probability of up move, π, where r is the risk free rate, d is the stock down move factor and u is the stock up move factor.\nπ = [(1+ r – d) / (u – d)]\n= (1.05 – 0.67) / (1.5 – 0.67)\n= 0.457831\nStep 2: Calculation of c++ where c++ is the call option value at time t=2 years for 2 successive price up moves\nc^(++) = Max(0,S^(++) – X) = Max(0,u^2S – X)\n= Max(0,(1.5^2 × 10 – 12))\n= Max(0, 10.5) = 10.5\nStep 3: Calculation of c+- and c-+ where c+- is the call option value at t=2 years after a price up move in year 1 followed by a price down move in year 2, c-+ is the call option value at t=2 years after a price down move in year 1 followed by a price up move in year 2, and c-- is the call option value at t=2 years after two successive price down moves\nc^(+-) = c^(-+)= Max(0,S^(+-) – X) = Max (0, udS - X)\n= Max(0,(1.5 x 0.67 x 10 – 12))\n= Max(0, -1.95) = 0\nStep 4: Calculation of c--\nc^(--) = Max(0,S^(--) – X) = Max (0, d^2S - X)\n= Max(0,(0.67^2 x 10 – 12))\n= Max(0, -7.511) = 0\nStep 5: Calculation of present value of call option\nc = PV [π^2c^(++) + 2π(1 – π)c^(+-) + (1 – π)^2c^(--)\nWhere PV = [1 / (1 + r)^2]\nc = (1 / 1.05)^2 × [0.457831^2 × 10.5 + 2 × 0.457831 × 0.542169 × 0 + 0.542169^2 × 0]\n= (1 / 1.05)^2 x 2.2009\n= 1.996281 ≈ 2.00\nC. INR 2.80. — Incorrect\nIncorrect as the stock up move factor is used in the place of stock down move factor and vice versa. This error is the same as mixing up π and (1 – π) in the valuation formula.\nπ = [(1+ r – d) / (u – d)]\n= (1.05 – 1.5) / (0.67 – 1.5)\n= 0.542169\nc = PV [π^2c^(++) + 2π(1 – π)c^(+-) + (1 – π)^2c^(--)\nWhere PV = [1 / (1 + r)^2]\nc = (1 / 1.05)^2 × [0.542169^2 x 10.5 + 2 × 0.457831 × 0.542169 × 0 + 0.457831^2 × 0]\n= (1 / 1.05)^2 × 3.086442\n= 2.799494 ≈ 2.80", "ko": "π = (1.05 − 0.67)/(1.5 − 0.67) = 0.4578. 만기 주가: uu = 22.5 → c++ = 10.5, ud = 10.05 → 0, dd = 4.49 → 0. c = 0.4578² × 10.5 / 1.05² = 0.2096 × 10.5 / 1.1025 = INR 2.00.", "trap": "2기간이면 2번 할인하고 π²를 쓴다. π와 (1 − π)를 바꾸지 말 것.", "f": "π = (1 + r − d)/(u − d), c = [π²c++ + 2π(1−π)c+− + (1−π)²c−−]/(1 + r)²", "why": {"A": "1기간 모형으로 계산했습니다.", "C": "u와 d(π와 1 − π)를 바꿔 썼습니다."}, "orig": "Mock 1 Session 2 Q33", "conf": false}, {"id": "mock1-2-Q34", "src": "정답", "module": "DER", "tag": "콜옵션 복제", "vig": 8, "stem": "To replicate a position in the illiquid Tara option, Tian should:", "opts": {"A": "buy Tara stock and lend funds.", "B": "buy Tara stock and borrow funds.", "C": "short sell Tara stock and lend funds."}, "ans": "B", "en": "A. buy Tara stock and lend funds. — Incorrect\nIncorrect because buying both the stock and a zero-coupon bond is an upfront investment of cash, and does not replicate a long call option where only the option premium is paid at the outset. Moreover, in case the stock loses money, the fund manager is fully exposed, while the loss is restricted to the option premium in case of a long call position.\nB. buy Tara stock and borrow funds. — Correct\nCorrect because the long call option (the illiquid Tara option position) on a stock can be replicated by first borrowing the amount through shorting a zero-coupon bond and then using the proceeds to buy the stock. The call option is equivalent to a leveraged position in the underlying.\nC. short sell Tara stock and lend funds. — Incorrect\nIncorrect because short selling the underlying stock and lending the proceeds would not replicate the long call option, however it would replicate a long put option.", "ko": "콜옵션은 레버리지를 쓴 주식 매수와 같다. 무위험채권을 공매도(차입)한 돈으로 주식을 사면 long call이 복제된다.", "trap": "주식 공매도 + 대출은 long put의 복제다.", "f": "Long call = 주식 h주 매수 + 차입", "why": {"A": "주식 매수 + 대출은 현금이 많이 드는 포지션으로 콜이 아닙니다.", "C": "주식 공매도 + 대출은 long put을 복제합니다."}, "orig": "Mock 1 Session 2 Q34", "conf": false}, {"id": "mock1-2-Q35", "src": "오답", "module": "DER", "tag": "선물옵션 put-call parity (Black)", "vig": 8, "stem": "The value of the call option on equity index futures is closest to:", "opts": {"A": "25.", "B": "30.", "C": "35."}, "ans": "B", "en": "A. 25. — Incorrect\nIncorrect because the difference between the futures price and the strike price is not discounted.\nc = (1,100 – 1,300) + 225 = 25\nB. 30. — Correct\nCorrect because the data provided on the put with the same underlying, strike price, and time to expiration is used in the following formula to determine the value of the call option:\nc = e^((-rT)^())[F0(T) – X] + ρ\nρ = 225\nF0(T) = 1,100\nX = 1,300\nr = 0.05\nT = 6 / 12 = 0.5\nTherefore\nc = e^(()^(–0.05 x 0.5))× [1,100 – 1,300] + 225\nc = 0.97531 × (–200) + 225\nc = 29.93802 ≈ 30\nC. 35. — Incorrect\nIncorrect because the 0.5 in the exponent is ignored.\nc = e^(()^(–0.05))[1,100 – 1,300] + 225\nc = 0.95123 × –200 + 225\nc = –190.246 + 225\nc = 34.754 ~ 35", "ko": "c = 225 + e^(−0.05 × 0.5) × (1,100 − 1,300) = 225 + 0.97531 × (−200) = 225 − 195.06 = 29.94 ≈ 30.", "trap": "(F − X)를 할인하고, T = 6/12 = 0.5를 지수에 넣는다.", "f": "c = p + e^(−rT) × (F − X)", "why": {"A": "(F − X)를 할인하지 않았습니다.", "C": "지수에 T = 0.5를 곱하지 않았습니다."}, "orig": "Mock 1 Session 2 Q35", "conf": true}, {"id": "mock1-2-Q36", "src": "정답", "module": "DER", "tag": "implied volatility로 옵션 비교", "vig": 8, "stem": "Which Purnima option in Exhibit 3 best meets Tian's objective?", "opts": {"A": "Option X", "B": "Option Y", "C": "Option Z"}, "ans": "B", "en": "A. Option X — Incorrect\nIncorrect because although Option X has the lowest strike price, what is relevant is that it has implied volatility of 30% which is higher than Option Y's implied volatility of 25% and therefore does not best meet Tian's objective.\nB. Option Y — Correct\nCorrect because Tian's objective is to select the option that is cheapest after she makes adjustments for differences in moneyness and time to expiration. Traders can compare the value of options, which may have markedly different exercise prices and expiration dates, and therefore, markedly different prices using a common unit of measure, specifically implied volatility. Option Y best meets her objective as it has the lowest implied volatility at 25% (Option X at 30%, Option Z at 35%).\nC. Option Z — Incorrect\nIncorrect because although Option Z has the lowest quoted price, what is relevant is that it has the highest implied volatility at 35% and therefore does not best meet Tian's objective.", "ko": "행사가와 만기가 다른 옵션의 상대가치는 가격이 아니라 implied volatility로 비교한다. IV가 가장 낮은 Option Y(25%)가 가장 싸다.", "trap": "가격이나 행사가가 낮다고 싼 옵션이 아니다.", "f": "", "why": {"A": "행사가는 가장 낮지만 IV가 30%로 Y보다 높습니다.", "C": "가격은 가장 낮지만 IV가 35%로 가장 높습니다."}, "orig": "Mock 1 Session 2 Q36", "conf": true}, {"id": "mock1-2-Q37", "src": "정답", "module": "ETH", "tag": "CFA 프로그램 언급: 예상 완료 시점", "vig": 9, "stem": "The reference to which of the following in Lee's statement to Holt violates the Standards?", "opts": {"A": "Level I only", "B": "Two-year completion only", "C": "Both Level I and two-year completion"}, "ans": "B", "en": "A. Level I only — Incorrect\nIncorrect because stating that Lee has successfully completed Level I of the CFA program appears on the list of acceptable references to CFA program under the Standards appearing in Exhibit 3. It says \"I passed Level I of the CFA Program.”\nB. Two-year completion only — Correct\nCorrect because by saying that Lee will likely acquire the CFA charter over the next two years, Holt is indicating an expected completion date which is not permitted under the Standards as stated below.\nCFA Program candidates must never state or imply that they have a partial designation as a result of passing one or more levels or cite an expected completion date of any level of the CFA Program.\nC. Both Level I and two-year completion — Incorrect\nIncorrect because while stating that Lee has successfully completed Level I of the CFA exam is not a violation, indicating an expected completion date is not permitted.", "ko": "Lee가 'Level I을 통과했다'고 말한 것은 허용된다. 하지만 '2년 안에 charter를 딸 것 같다'는 예상 완료 시점을 말한 것으로 Standard VII(B) 위반이다.", "trap": "합격 사실은 말해도 되지만 예상 완료 시점·부분 자격은 안 된다.", "f": "", "why": {"A": "Level I 통과 사실을 밝히는 것은 허용됩니다.", "C": "Level I 언급은 위반이 아니고 2년 완료 예상만 위반입니다."}, "orig": "Mock 1 Session 2 Q37", "conf": false}, {"id": "mock1-2-Q38", "src": "정답", "module": "ETH", "tag": "외부 활동: Standard IV(B)", "vig": 9, "stem": "With respect to the commercial law course, is Lee required to take any action to comply with the Standard relating to duty to employers?", "opts": {"A": "No", "B": "Yes, prior to accepting the offer, he must obtain prior written approval from Holt", "C": "Yes, after accepting the offer, he must inform Holt of the terms in a written report"}, "ans": "A", "en": "A. No — Correct\nCorrect because Lee's offer to teach the commercial law course is uncompensated and given the firm's flexible time policy, he would be able to carry out this activity without affecting his work responsibilities. Hence, it does not create a requirement to seek permission from his employer nor a responsibility to disclose the activity to his employer.\nStandard IV(B) requires members and candidates to obtain permission from their employer before accepting compensation or other benefits from third parties for the services rendered to the employer or for any services that might create a conflict with their employer’s interest. Additionally, members and candidates must obtain permission for additional compensation/benefits because such arrangements may affect loyalties and objectivity and create potential conflicts of interest. Disclosure allows an employer to consider the outside arrangements when evaluating the actions and motivations of members and candidates.\nB. Yes, prior to accepting the offer, he must obtain prior written approval from Holt — Incorrect\nIncorrect because Lee's offer to teach the course is uncompensated and given the firm's flexible time policy he will be able to carry out this activity on his own time, hence it does not create a requirement to seek permission or disclosure responsibility on Lee.\nC. Yes, after accepting the offer, he must inform Holt of the terms in a written report — Incorrect\nIncorrect because Lee's offer is to teach the commercial law course is uncompensated and given the firm's flexible time policy he will be able to carry out this activity on his own time, hence it does not create a requirement of providing a written report of terms of the offer upon Lee.", "ko": "Lee의 강의는 무보수이고, 회사의 재택·유연근무 정책 덕분에 업무 시간 밖에서 할 수 있어 회사와 경쟁하거나 업무에 지장을 주지 않는다. IV(B)는 보수를 받는 외부 활동에 대해 사전 허락을 요구하므로 별도 조치가 필요 없다.", "trap": "보수가 없고 회사 업무와 충돌하지 않으면 허락·보고 의무가 없다.", "f": "", "why": {"B": "무보수이고 업무와 충돌하지 않아 사전 서면 승인이 필요 없습니다.", "C": "같은 이유로 사후 서면 보고 의무도 없습니다."}, "orig": "Mock 1 Session 2 Q38", "conf": false}, {"id": "mock1-2-Q39", "src": "정답", "module": "ETH", "tag": "Soft dollar 성격 리베이트: III(A)", "vig": 9, "stem": "Does the rebate arrangement with Prexel violate the Standard relating to loyalty, prudence, and care?", "opts": {"A": "No", "B": "Yes, because the rebate should not be used for Skylark's operations", "C": "Yes, because Holt should have sought lowest cost mutual funds for clients"}, "ans": "A", "en": "A. No — Correct\nCorrect because while Prexel charges higher than average fees, this arrangement is disclosed to clients and Skylark uses fees which are returned as rebates for the benefit of clients. This is not a violation of Standard III(A) - Loyalty, Prudence, and Care.\nA member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client.\nAdditionally, disclosures should be made to clients regarding fee arrangements, sub-advisory agreements, or other situations involving nonstandard fee structures. Equally important is the disclosure of arrangements in which the firm benefits directly from investment recommendations. An obvious conflict of interest is the rebate of a portion of the service fee some classes of mutual funds charge to investors. Members and candidates should ensure that their firms disclose such relationships so clients can fully understand the costs.\nB. Yes, because the rebate should not be used for Skylark's operations — Incorrect\nIncorrect because the rebate is used to maintain client reporting systems for the benefit of clients. The reporting system enables both Skylark and the clients to access more timely performance data. As the rebate is being used for client benefit, it is therefore not a violation.\nC. Yes, because Holt should have sought lowest cost mutual funds for clients — Incorrect\nIncorrect because the 'rebate' is permitted as it meets the two standards for the use of soft dollars. First, it is used for the benefit of clients and second, it has been disclosed to the clients. It is also mentioned in the case that Skylark has determined that the higher Prexel fees are justified.", "ko": "Prexel은 수수료가 높지만 보수 차감 후 성과가 더 좋아 고객에게 가장 적합하다고 판단했다. 리베이트는 모든 고객을 위한 보고 시스템 유지에 쓰이고, Holt가 계좌 개설 때 고객에게 공개했다. 고객 이익 + 공개라 III(A) 위반이 아니다.", "trap": "soft dollar는 '고객에게 이익'이고 '공개'되면 허용된다. 무조건 최저비용 펀드를 고를 의무는 없다.", "f": "", "why": {"B": "리베이트를 고객을 위한 보고 시스템에 쓰므로 허용됩니다.", "C": "보수 차감 후 성과가 더 좋아 최저비용 펀드가 아니어도 됩니다."}, "orig": "Mock 1 Session 2 Q39", "conf": false}, {"id": "mock1-2-Q40", "src": "정답", "module": "ETH", "tag": "공정 배분: 가족 계좌", "vig": 9, "stem": "Did Lee violate the Standard relating to fair dealing in his allocation of PCSF shares?", "opts": {"A": "No", "B": "Yes, because he should have allocated shares to his sister's account", "C": "Yes, because he should have allocated shares to both his sister's and to his account"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because Lee violated the Standard relating to Fair Dealing by not allocating shares to his sister. He did not violate the Standards by not allocating shares to himself. If the account for his sister is managed in the same manner as other clients, which it is, then she should not be precluded from the allocation.\nB. Yes, because he should have allocated shares to his sister's account — Correct\nCorrect because his sister's account is managed in the same manner as other client accounts and therefore should have been allocated shares.\nIf the issue is oversubscribed, members and candidates should forgo any sales to themselves or their immediate families in order to free up additional shares for clients. If the investment professional’s family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member accounts should not be excluded from buying such shares.\nC. Yes, because he should have allocated shares to both his sister's and to his account — Incorrect\nIncorrect because Lee violated the Standard relating to Fair Dealing by not allocating shares to his sister. He did not violate the Standards by not allocating shares to himself. If the account for his sister is managed in the same manner as other clients, which it is, then she should not be precluded from the allocation.", "ko": "공급이 부족한 펀드는 본인 몫을 포기해야 하므로 Lee가 자기에게 배분하지 않은 것은 옳다. 하지만 누나 계좌는 수수료를 내고 다른 고객과 똑같이 운용되는 고객 계좌이므로 다른 고객처럼 배분받아야 했다. 누나를 빼서 Standard III(B) 위반.", "trap": "가족 계좌라도 일반 고객과 같이 운용되면 고객으로 대우해야 한다.", "f": "", "why": {"A": "누나 계좌를 배분에서 뺀 것이 위반입니다.", "C": "공급이 부족하면 본인 몫은 포기하는 것이 맞습니다."}, "orig": "Mock 1 Session 2 Q40", "conf": false}, {"id": "mock1-2-Q41", "src": "오답", "module": "ETH", "tag": "IPO 참여: VI(B) 거래 우선순위", "vig": 10, "stem": "With respect to the IPO, does Hirayo violate the Standard relating to priority of transactions?", "opts": {"A": "No", "B": "Yes, because he allocates shares to himself", "C": "Yes, because he applied for the IPO for his personal account"}, "ans": "A", "en": "A. No — Correct\nCorrect because Summit receives all requested IPO shares and Hirayo allocates them pro rata among his subscribing clients and his own account, with no client being disadvantaged. Therefore, Hirayo does not violate the Standards.\nAccording to Standard VI(B) Priority of Transactions, members and candidates should not benefit from the position that their clients occupy in the marketplace—through preferred trading, the allocation of limited offerings, or oversubscription.\nB. Yes, because he allocates shares to himself — Incorrect\nIncorrect because, although Hirayo receives IPO shares, he does not disadvantage his clients. Summit receives all requested IPO shares and Hirayo allocates them pro rata among his subscribing clients and his own account, with no client being disadvantaged. Therefore, Hirayo does not violate the Standards.\nAccording to Standard VI(B) Priority of Transactions, members and candidates should not benefit from the position that their clients occupy in the marketplace—through preferred trading, the allocation of limited offerings, or oversubscription.\nC. Yes, because he applied for the IPO for his personal account — Incorrect\nIncorrect because Hirayo does not disadvantage his clients by applying for the IPO for his personal account. Summit receives all requested IPO shares and Hirayo allocates them pro rata among his subscribing clients and his own account, with no client being disadvantaged. Therefore, Hirayo does not violate the Standards.\nAccording to Standard VI(B) Priority of Transactions, members and candidates should not benefit from the position that their clients occupy in the marketplace—through preferred trading, the allocation of limited offerings, or oversubscription.", "ko": "Hirayo는 사전 승인(preclearance)을 받았고, 청약이 결국 다 찼어도 Summit이 신청 물량을 전부 받았다. 그는 이를 청약 고객과 본인 계좌에 비례 배분했으므로 고객이 손해 본 것이 없다. VI(B) 위반이 아니다.", "trap": "본인 IPO 참여 자체가 위반은 아니다. 고객 몫을 줄였는지가 기준이다.", "f": "", "why": {"B": "신청 물량을 전부 받아 비례 배분했으니 고객에게 손해가 없습니다.", "C": "사전 승인을 받았고 고객에게 불리하지 않아 참여해도 됩니다."}, "orig": "Mock 1 Session 2 Q41", "conf": false}, {"id": "mock1-2-Q42", "src": "오답", "module": "ETH", "tag": "공개된 리포트로 매매: II(A)", "vig": 10, "stem": "When purchasing ION shares, does Hirayo violate the Standards?", "opts": {"A": "No", "B": "Yes, because he acts on material nonpublic information", "C": "Yes, because he does not have a reasonable basis for buying the shares"}, "ans": "A", "en": "A. No — Correct\nCorrect because the leading analyst issued the strong buy rating on ION during the morning, which means it is already public information. According to Standard II(A) Material Nonpublic Information, once the information is disseminated to the market, it is public information that is no longer covered by this standard. Similarly, the rumor about the merger is also no longer considered material nonpublic information.\nB. Yes, because he acts on material nonpublic information — Incorrect\nIncorrect because the leading analyst issued the strong buy rating on ION during the morning, which means it is already public information. According to Standard II(A) Material Nonpublic Information, once the information is disseminated to the market, it is public information that is no longer covered by this standard. Similarly, the rumor about the merger is also no longer considered material nonpublic information.\nC. Yes, because he does not have a reasonable basis for buying the shares — Incorrect\nIncorrect because a reasonable basis is required by Standard V(A) Diligence and Reasonable Basis when making investment analysis, recommendations, and actions for clients and for the firm. Hirayo bought the securities for his own account. The Standards do not impose a requirement of diligence or reasonable basis on personal trades.", "ko": "브로커들이 말한 리포트(합병 루머·강력 매수 의견)는 그날 아침 온라인에 이미 공개된 것이다. 공개된 정보는 MNPI가 아니므로 II(A) 위반이 아니다. 본인 계좌 매매라 고객용 reasonable basis 요건(V(A))도 해당 없다.", "trap": "'식당에서 엿들었다'가 아니라 '이미 공개된 리포트'인지가 핵심이다.", "f": "", "why": {"B": "리포트는 이미 공개돼 비공개 정보가 아닙니다.", "C": "V(A)는 고객·회사를 위한 분석·추천에 적용되고, 본인 계좌 매수에는 해당하지 않습니다."}, "orig": "Mock 1 Session 2 Q42", "conf": false}, {"id": "mock1-2-Q43", "src": "오답", "module": "ETH", "tag": "보상 공개: VI(A) 이해상충", "vig": 10, "stem": "In relation to his compensation, Hirayo violates the Standards when he fails to disclose:", "opts": {"A": "the $60,000 bonus only.", "B": "the $12,000 reward only.", "C": "both the $60,000 bonus and the $12,000 reward."}, "ans": "A", "en": "A. the $60,000 bonus only. — Correct\nCorrect because, according to Standard VI(A) Disclosure of Conflicts, a conflict of interest is any matter that could reasonably be expected to impair independence and objectivity or raise a question about whether actions, judgement, or decision making is free from bias. A common source of conflict is compensation structure, especially incentive and bonus structures that provide immediate returns for members and candidates with little or no consideration of long-term value creation.\nMembers and Candidates must avoid or make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer.\nHirayo violates Standard VI(A) when he fails to disclose the $60,000 performance bonus arrangement to his prospective clients.\nB. the $12,000 reward only. — Incorrect\nIncorrect because Hirayo is not in violation of the CFA Institute Code and Standards. The $12,000 does not have to be disclosed to clients because it is not a referral fee or additional compensation, and it does not create a conflict of interest with his employer, clients, or prospective clients.\nAccording to Standard VI(C): Conflicts of Interest, Referral Fees, referral fees are any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services.\nThe $12,000 reward Hirayo will receive from Summit for bringing over clients from his previous employer is not a referral fee because this reward is paid by Summit (the employer) and not charged to clients. This amount is compensation paid by the firm, not a fee charged to clients.\nC. both the $60,000 bonus and the $12,000 reward. — Incorrect\nIncorrect because Hirayo is not in violation of the Standards when he fails to disclose the $12,000 reward received from Summit (the employer) for bringing over clients, with Summit paying the reward that is not charged back to clients. The $12,000 does not have to be disclosed to clients because it is not a referral fee or additional compensation, and it does not create a conflict of interest with his employer, clients, or prospective clients.\nHowever, Hirayo violates the Standards regarding the $60,000 performance bonus arrangement by not disclosing it to his prospective clients.", "ko": "월간 성과가 다른 포트폴리오보다 좋으면 받는 $60,000 보너스는 단기 성과를 쫓게 만드는 이해상충이라 잠재 고객에게도 공개해야 한다. Hirayo는 기존 고객에게만 알렸으므로 위반. $12,000는 Summit이 자기 돈으로 주는 고객 유치 보상이고 고객에게 비용이 없어 공개 의무가 없다.", "trap": "성과 보너스는 기존 고객뿐 아니라 잠재 고객에게도 공개한다. 회사가 직접 주는 유치 보상은 referral fee가 아니다.", "f": "", "why": {"B": "$12,000는 고객에게 청구되지 않는 회사의 보상이라 공개 의무가 없습니다.", "C": "$12,000는 공개 대상이 아니고 $60,000만 위반입니다."}, "orig": "Mock 1 Session 2 Q43", "conf": false}, {"id": "mock1-2-Q44", "src": "오답", "module": "ETH", "tag": "기록 보관: V(C)", "vig": 10, "stem": "To comply with the Standards, which provision in Summit’s record retention policy should be amended?", "opts": {"A": "Provision 1", "B": "Provision 2", "C": "Provision 3"}, "ans": "B", "en": "A. Provision 1 — Incorrect\nIncorrect because, according to Standard V(C) Record Retention, records may be maintained either in hard copy or electronic form.\nB. Provision 2 — Correct\nCorrect because, according to Standard V(C) Record Retention, the nature or format of the information does not remove a member’s or candidate’s responsibility to maintain a record of information used in his or her analysis or communicated to clients.\nExamples of non-print media formats that should be retained include, but are not limited to, e-mails, text messages, blog posts, and Twitter posts.\nC. Provision 3 — Incorrect\nIncorrect because, according to Standard V(C) Record Retention, firms may also implement policies detailing the applicable time frame for retaining research and client communication records. Fulfilling such regulatory and firm requirements satisfies the requirements of Standard V(C).\nThe Standard adds that in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years. The 7-year retention period is only recommended in the absence of a firm policy.\nㄴ", "ko": "V(C)는 분석·고객 소통에 쓴 정보의 형식과 상관없이 기록을 보관하라고 한다. 블로그·짧은 메시지(트위터 등) 게시물도 보관 대상이라 '보관 안 해도 된다'는 Provision 2를 고쳐야 한다.", "trap": "종이·전자 형식은 자유, 보관 기간은 회사가 정할 수 있다(현지 규정 없으면 7년 권고).", "f": "", "why": {"A": "기록은 종이 또는 전자 형식 어느 쪽으로든 보관할 수 있습니다.", "C": "보관 기간은 회사 정책으로 정할 수 있습니다."}, "orig": "Mock 1 Session 2 Q44", "conf": false}], "vignettes": ["Victoria Lazslo is an analyst valuing three firms held in client portfolios.\nFirm A owns a chain of regional dental offices and has no debt. Lazslo initially selects a single-stage residual income model to estimate the intrinsic value of Firm A’s stock and compiles the data in Exhibit 1.\nExhibit 1\nConstant long-term growth rate\t9.6%\nConstant long-term ROE\t16.0%\nMarket price per share\t$220.00\nBook value per share\t$166.00\nCost of equity\t12.5%\nLazslo also considers the possibility that after Year 10 Firm A’s ROE will exhibit mean reversion. She uses a multistage residual income model to value Firm A’s stock and estimates residual income in Year 10 to be $8.38 per share, with a persistence factor of 0.7.\nFirm B is a distributor of building supplies. Firm B’s year-end (Year 0) book value of equity is $111 per share and its cost of equity is 12%. Lazslo forecasts financial data for the next two years in Exhibit 2.\nExhibit 2\n\tYear 1\tYear 2\nNet income\t$26.25\t$31.56\nDividends\t$3.80\t$4.57\nOther comprehensive income\t$0.00\t$2.75\nFirm C is an international carbon capture firm that reported EPS of $3.75 last year. Lazslo forecasts earnings growth of 7%, a required return on equity of 12%, and a dividend payout ratio of 45% for the foreseeable future. She selects the Gordon growth model to value Firm C's stock.", "Sarah Simpson is an economist for an investment firm. She researches the economic growth of several countries. Simpson believes the growth rate of per capita income in developing countries will increase and eventually match that of developed countries.\nCountry A has a developed, slow-growing economy and a high rate of capital per worker. Exhibit 1 provides the average annual growth rates for selected economic variables in Country A over the most recent five years. Simpson uses this information to determine the contribution of capital deepening to factor productivity.\nExhibit 1\nHours worked\t0.6%\nLabor productivity\t1.4%\nTotal factor productivity\t0.5%\nCountry B's potential GDP currently exceeds its actual GDP. Simpson forecasts that Country B's potential GDP growth rate will be higher than the actual GDP growth rate over the next two years. She assesses the implications of her forecast on Country B's economy.", "Nathan Moffet is a fixed-income portfolio manager analyzing the credit risk within a corporate bond portfolio.\nMoffet purchases a senior unsecured bond issued by Company A at a price of $105.35. The bond has the following characteristics:\nAn 8% annual-pay coupon, a face value of $100, and no embedded options\nThree years remain to maturity and a coupon has just been paid\nMoffet collects information on the bond in Exhibit 1, which provides end-of-period data. He uses the information to consider a base case scenario where the bond defaults at the end of Year 3.\nExhibit 1\n\tExposure\tRecovery\tLoss Given Default\tProbability of Default\tExpected Loss\tDiscount Factor\tPresent Value (PV) of Expected Loss\nYear 1\t$117.57\t$47.03\t$70.54\t5.00%\t$3.53\t0.9709\t$3.43\nYear 2\t$112.85\t$45.14\t$67.71\t4.75%\t$3.22\t0.9426\t$3.04\nYear 3\t$108.00\t$43.20\t$64.80\t4.51%\t$2.92\t0.9151\t$2.67\nSum\t---\t---\t---\t14.26%\t$9.67\t---\t$9.14\nMoffet learns that Company B plans to issue a covered bond. He considers the benefits of covered bonds from the perspective of the company.\nMoffet owns $10 million of Bond 1, a 5-year senior unsecured bond issued by Company C. He recently bought credit protection on Company C using a $10 million notional value CDS. The CDS can be settled by physical or cash settlement and its reference obligation is Bond 1. Company C recently filed for bankruptcy and Moffet gathers the information in Exhibit 2 on its outstanding debt obligations.\nExhibit 2\n\tSeniority\tTenor\tPar Value\tCurrent Price\nBond 1\tSenior unsecured\t5 years\t$100\t$40\nBond 2\tSenior unsecured\t4 years\t$100\t$35\nMoffet is considering buying CDS protection on Company D. He does not own any of the company's debt. He gathers the following information for a 3-year CDS on Company D:\nThe credit spread is 550 bps\nThe effective duration is 2.8\nThe coupon rate is 5.0%\nMoffet estimates the upfront premium needed to buy the CDS protection.", "Susan Walker is a portfolio manager at Meerkat Investment Group. She uses a factor model when managing portfolios for her institutional clients.\nWalker computes the expected return on an active ETF using a two-factor model based on arbitrage pricing theory (APT). The current risk-free rate is 2.0%. The APT factor prices and ETF factor sensitivities are presented in Exhibit 1.\nExhibit 1\nFactor\tFactor Price (%)\tETF Factor Sensitivity\n1\t8.0\t1.0\n2\t6.0\t0.4\nOne of Walker's clients asks her which of the following is an assumption of the two-factor model she used to value the active ETF:\nAssumption 1: The two factors in the model are correlated\nAssumption 2: Arbitrage opportunities are available in the market\nAssumption 3: Investors can form portfolios that eliminate asset-specific risk\nNext, Walker calculates the 2-year holding period cost of the active ETF. The annual management fee is 0.50%, the one-way commission is 0.05%, and the bid-ask spread is 0.12%.\nThe client is concerned that the ETF, which is currently trading at its NAV, could trade at a large discount in the future. Walker tells the client that there is a mechanism that ensures the ETF does not trade at a large discount to NAV.", "Herbert Erikson is examining the multinational operations of Obsidian AG, a eurozone company that reports under IFRS.\nDuring the most recent year, Obsidian made unhedged export sales to customers located in non-eurozone countries. On 31 December, the end of the most recent year, USD 1 million of accounts receivable remained outstanding. At the time of sale, the EUR/USD (amount of EUR per 1 USD) exchange rate was 0.950. On 31 December, the EUR/USD exchange rate was 0.965.\nOn 1 January of the most recent year, Obsidian formed two new subsidiaries: Ametrine, a UK-based company, and Citrine, a Poland-based company. Ametrine was consolidated using the current rate method, while Citrine was consolidated using the temporal method. The GBP and the Polish zloty (PLN) steadily strengthened against the EUR throughout the year. All of the combined PP&E, and a major portion of the inventory that was sold during the year, were acquired when the companies were formed. Both companies were profitable and had positive shareholders' equity in their first year of operations.\nKunzite is a wholly owned subsidiary that Obsidian acquired six years ago. Erikson is concerned that Kunzite is based in a country that may soon become hyperinflationary, and considers the appropriate accounting treatment when Obsidian consolidates Kunzite.", "Juan Bolton is a fixed-income analyst at an investment firm. He is analyzing the firm's actively managed funds and examining macroeconomic data.\nBolton analyzes two actively managed funds, Fund X and Fund Y. He compiles data regarding the performance of the funds and their benchmark in Exhibit 1. Fund X’s expected active risk is 1.3% and Fund Y’s ex ante information ratio is 0.27. The risk-free rate is 2.3%.\nExhibit 1\n\tFund X\tFund Y\tBenchmark\nExpected annual return\t6.7%\t6.5%\t6.2%\nStandard deviation of returns\t8.9%\t8.6%\t8.3%\nBolton uses the fundamental law of active management to evaluate the performance of the managers of Fund X and Fund Y. He observes that both managers have access to the same set of securities and rebalance their portfolios at the same frequency. Neither manager has any restrictions on implementing their forecasts when constructing portfolios. Bolton also observes that Fund X’s manager has better forecasting skills than Fund Y’s manager.\nNext, Bolton examines the macroeconomic data of three countries for potential investment in their fixed-income securities. He collects selected market expectations for these countries, which are at similar stages of economic development, in Exhibit 2.\nExhibit 2\n\tCountry 1\tCountry 2\tCountry 3\nReal GDP growth (annual)\t2.8%\t4.2%\t4.2%\nVolatility of real GDP growth\t0.5%\t0.5%\t0.8%", "Samantha Maloy is an analyst reviewing the payout policies of Firm A and Firm B.\nFirm A has a stable dividend policy. Its free cash flow has been consistently positive for the past 15 years and the firm does not have many growth opportunities. Firm A's D/E ratio is currently 35%. Maloy expects an increase in Firm A's dividend during the current year and calculates its expected dividend under a target payout adjustment model, using the information in Exhibit 1.\nExhibit 1\nEPS for previous year\t$6.00\nPayout ratio for previous year\t50%\nExpected EPS growth for current year\t8%\nTarget payout ratio\t60%\nDividend adjustment period\t3 years\nNext, Maloy reviews the payout policies of Firm B. Firm B's management considers repurchasing 10 million of the company's 200 million outstanding shares at the prevailing market price of $80 per share. The repurchase would be financed using borrowed funds with an after-tax cost of capital of 7%. Before accounting for the repurchase, management expects that Firm B's EPS will be $10 for the current year and that book value per share (BVPS) of common equity will be $60 at year end. Maloy examines whether the share repurchase would affect expected EPS and BVPS of common equity.", "Clara Connor, an advisor for Newbridge Investments, is valuing three publicly traded firms: Lismore Corp., Omega Pipeline, and Slane Industries.\nConnor estimates Lismore’s FCFF for the next year based on its forecasted revenues. Lismore’s revenues over the past 12 months were $2,500 million. Connor’s assumptions for estimating Lismore's FCFF are summarized in Exhibit 1.\nExhibit 1\nSales growth over the next year\t40%\nEBIT margin\t30%\nIncremental fixed capital as percent of increased sales\t35%\nIncremental working capital as percent of increased sales\t25%\nProportion of new fixed and working capital financed by debt\t15%\nTax rate\t20%\nOmega Pipeline is a US-based company operating a network of oil and gas pipelines. Connor is concerned about increasing awareness of the environmental and social impacts these pipelines have on their surrounding communities. She believes these concerns are not fully reflected in Omega's current share price and that an ESG equity risk premium should be incorporated in the discount rate. Using a two-stage model and the assumptions provided in Exhibit 2, Connor determines the company value of Omega.\nExhibit 2\nFCFF for both Year 1 and Year 2\t$1,850 million\nExpected long-term FCFF annual growth rate starting in Year 3\t3.0%\nPretax cost of Omega's debt\t6.0%\nDebt-to-assets ratio\t40%\nRisk-free rate\t3.5%\nMarket equity risk premium\t5.5%\nESG equity risk premium\t0.9%\nOmega's equity beta\t1.4\nCorporate tax rate\t25%\nSoon after Connor completes her valuation of Omega, the company announces it will issue debt to buy back equity during the next year (Year 1). Connor considers how this capital structure change would impact her FCFF forecasts.\nFinally, Connor analyzes Slane Industries. Slane is composed of three independent divisions: 1) lithium mining, 2) bromine extraction, and 3) specialty chemicals. The values of the firm's lithium and bromine reserves are significant. The rates of revenue growth differ across the three divisions. Connor is able to identify publicly traded competitors for the specialty chemicals division but not for the other two divisions. After considering different approaches, she identifies the most appropriate approach for estimating the intrinsic value of Slane.", "Qiu Tian is a hedge fund manager evaluating options on several equities. She begins with Tara Corp., a non-dividend-paying stock priced in Indian rupees (INR). Tian is bullish on Tara stock and values European-style Tara call options using a two-period binomial model and information from Exhibit 1.\nExhibit 1\nCurrent stock price\tINR 10\nTime to option expiration\t2 years\nRisk-free rate (annual)\t5.0%\nOption strike price\tINR 12\nUp factor per period\t1.50\nDown factor per period\t0.67\nTian observes that the 2-year Tara call option is illiquid. She determines how to replicate a long position in this call option.\nNext, Tian assesses the value of a European-style call option on equity index futures using the Black model. She gathers information related to the call in Exhibit 2. The Black model value of a put with the same underlying, strike price, and time to expiration is 225.\nExhibit 2\nCurrent futures price\t1,100\nTime to expiration\t6 months\nExercise price\t1,300\nRisk-free rate\t5.0%\nTian is also evaluating the addition of Purnima Corp. options to her portfolio. She compares the relative value of three Purnima call options in Exhibit 3. Her objective is to select the option that is cheapest after she makes adjustments for differences in moneyness and time to expiration. Purnima stock is currently trading at INR 62.\nExhibit 3\n\tOption X\tOption Y\tOption Z\nCurrent price\tINR 10.55\tINR 6.89\tINR 6.44\nImplied volatility\t30%\t25%\t35%\nStrike price\tINR 55\tINR 62\tINR 75\nTime to expiration\t8 months\t12 months\t16 months", "Michael Lee is a portfolio manager at Skylark Advisory, a small financial advisory firm serving individual clients. He holds degrees in law and finance and has recently passed Level I of the CFA exam. Skylark has adopted the Standards.\nLee reports directly to the lead portfolio manager Deborah Holt. In a recent conversation with Holt, Lee states, \"I have successfully completed Level I of the CFA Program and I am likely to acquire the CFA charter over the next two years.\"\nLee is offered an opportunity to teach an online commercial law course for a semester at his former university. He will not receive any compensation for the role. Lee is able to accommodate the teaching outside of his regular work schedule as Skylark's policy permits employees to work from home and use flexible time when attending office in person.\nSkylark primarily uses mutual funds from Prexel Funds for client accounts. Prexel charges fees that are higher than similar funds; however, some of these fees are given back to Skylark as rebates. Skylark uses these rebates to maintain reporting systems for the benefit of all clients. The systems enable both Skylark and clients to access better and more timely performance data. Prexel Funds' net-of-fee performance is better than its competitor funds. Skylark determines Prexel to be best suited for clients. Holt discloses this arrangement to clients when they open an account with Skylark.\nLike most employees, Lee maintains his retirement portfolio with Skylark. His adult sister also has a fee-paying account with Skylark which is managed in the same manner as other clients. Recently, Prexel Funds offered a limited number of shares in the previously closed Prexel Commodity Strategies Fund (PCSF) to Skylark. The demand for PCSF shares from Skylark's suitable clients far exceeded the limited supply available. To avoid any conflict of interest, Lee did not allocate any shares to himself, or his sister.", "Carl Hirayo, CFA, recently joined Summit Investments as a portfolio manager. Hirayo plans to participate in Tarragon Petroleum’s IPO for both his personal account and his clients' accounts. He obtains preclearance for his own participation because the IPO is not fully subscribed at that time. The offering turns out to be fully subscribed at the time of issue and Summit receives all requested shares. Hirayo allocates these shares on a pro rata basis among his subscribing clients and his own account.\nWhile meeting with a client at a restaurant, Hirayo overhears two brokers talking about ION, an electronic manufacturing company. The brokers discuss a report that was released online earlier in the morning by a leading analyst. The report included a merger rumor about ION and the analyst placed a strong buy recommendation on the stock. Hirayo calls his broker to buy 4,000 shares of ION for his personal account.\nHirayo will receive a $60,000 performance bonus from Summit if his monthly portfolio performance exceeds that of Summit's other portfolios. He discloses the bonus arrangement to his existing clients but not to prospective clients. Separately, Hirayo will receive a $12,000 reward from Summit after he successfully brought in 20 clients from his previous employer. This reward is paid by Summit and is not charged to clients. Hirayo does not disclose this reward arrangement to the clients that he brought over.\nSummit's management team decides to further strengthen its record retention policy. The current policy has the following notable provisions:\nProvision 1: Client meeting notes must be preserved in electronic form; hence, any hard copies must be digitized.\nProvision 2: Informal blog posts and short message form posts sourced from the internet do not need to be preserved.\nProvision 3: Research reports and all supporting documents have a retention period of three years."], "modules": {"ECO": "Economics", "CI": "Corporate Issuers", "FSA": "Financial Statement Analysis", "EQ": "Equity Valuation", "FI": "Fixed Income", "DER": "Derivatives", "PM": "Portfolio Management", "ETH": "Ethical and Professional Standards"}, "images": {}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules, IMG = DATA.images || {};
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = DATA.meta.subject, KEY = SUBJECT+"_quiz_state_v1", EXPKEY = SUBJECT+"_quiz_exports_v1", CONFKEY = SUBJECT+"_confused_v1", UIKEY = SUBJECT+"_ui_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
// 헷갈림: 원본 txt의 "헷갈림:" 번호가 기본값, 화면에서 켜고 끈 것은 CONF.ids에 덮어씀
var CONF = store.get(CONFKEY) || {ids:{}, at:""};
// 학습 화면(문제+정답+해설) 상태는 풀이 기록(S)과 따로 둔다
var UI = store.get(UIKEY) || {view:null};
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }
function saveUI(){ store.set(UIKEY,UI); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables + [IMAGE: 파일명]
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], im=/^\[IMAGE: (.+)\]$/.exec(l.trim());
    if(im){ flush(); if(IMG[im[1]]) html+='<p><img class="exh" src="'+IMG[im[1]]+'" alt="'+esc(im[1])+'"></p>'; continue; }
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]||m; }
function srcClass(s){ return s==="오답"?"src-wrong":"src-rel"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }
function isWrong(q){ return q.src==="오답"; }
function isConf(q){ var v=CONF.ids[q.id]; return v===undefined ? !!q.conf : !!v; }
function toggleConf(id){
  var q=BYID[id]; CONF.ids[id]=!isConf(q);
  if(CONF.ids[id]===!!q.conf) delete CONF.ids[id]; // 원래 값으로 돌아오면 덮어쓴 기록 삭제
  CONF.at=new Date().toISOString(); store.set(CONFKEY,CONF);
}
function confBtn(q){ return '<button class="btn conf'+(isConf(q)?' on':'')+'" id="bConf" title="헷갈린 문제로 표시/해제">'+(isConf(q)?'★ 헷갈림':'☆ 헷갈림')+'</button>'; }
function metaHtml(q, no){
  return '<div class="meta"><span class="qno">'+no+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span>'+
    (isConf(q)?'<span class="pill src-var">헷갈림</span>':'')+'<span class="tagline">'+esc(q.tag)+'</span><span style="flex:1"></span>'+confBtn(q)+'</div>';
}
// 범위: wrong = 오답만, wc = 오답+헷갈림, all = 전체
var FILT = {wrong:"오답만", wc:"오답+헷갈림", all:"전체"};
function pick(f, m){
  return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (f==="all" || isWrong(q) || (f==="wc" && isConf(q))); }).map(function(q){return q.id;});
}

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
var MODE = {all:"전체 풀기", list:"학습한 목록 풀기", wrong:"오답만 풀기", wc:"오답+헷갈림 풀기", review:"틀린 문제 다시 풀기", rwc:"틀린+헷갈림 다시 풀기"};
function header(){
  if(UI.view==="study"){ var T=UI.study; $("nOk").textContent="-"; $("nBad").textContent="-"; $("pbar").style.width=((T.i+1)/T.ids.length*100)+"%"; $("ptxt").textContent=(T.i+1)+" / "+T.ids.length; $("pmode").textContent="해설 보며 학습 · "+T.label; return; }
  if(!S || !S.order){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=MODE[S.mode]||"";
}

/* ---------- setup screen ---------- */
function setup(){
  UI.view=null; saveUI();
  S && (S.view="setup", save());
  var wrongAll=Q.filter(isWrong).length, confAll=Q.filter(isConf).length;
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 토픽 ('+Q.length+')</option>'+Object.keys(MN).filter(function(m){return counts[m];}).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  var f = UI.filt || "wc";
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">'+esc(DATA.meta.title)+' 오답 퀴즈</h2>'+
   '<p class="muted">전체 '+Q.length+'문제 · 내가 틀린 문제 '+wrongAll+' · 헷갈린 문제 '+confAll+'. 정답과 영어 해설은 CFA Institute 원문, 한국어 해설은 원문을 바탕으로 작성했습니다. 헷갈림 표시는 문제 화면의 ☆ 버튼으로 켜고 끌 수 있습니다.</p>'+
   '<label>토픽 <select id="selMod">'+opts+'</select></label>'+
   '<div class="seg" id="segF">'+Object.keys(FILT).map(function(k){return '<button class="btn'+(k===f?' on':'')+'" data-f="'+k+'">'+FILT[k]+' <span id="n_'+k+'"></span></button>';}).join("")+'</div>'+
   '<p class="kbd">풀기: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 / 학습: ← → 이동</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">풀기</button> <button class="btn" id="bStudy">해설 보며 학습</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function labels(){
    var m=$("selMod").value;
    Object.keys(FILT).forEach(function(k){ $("n_"+k).textContent="("+pick(k,m).length+")"; });
    var n=pick(f,m).length; $("bStart").textContent=FILT[f]+" 풀기 ("+n+")"; $("bStudy").textContent=FILT[f]+" 해설 보며 학습 ("+n+")";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(b){ b.onclick=function(){
    f=b.getAttribute("data-f"); UI.filt=f; saveUI();
    Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(x){ x.classList.toggle("on", x===b); }); labels(); }; });
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){
    var order=pick(f,$("selMod").value); if(!order.length){ alert("이 범위에는 문제가 없습니다."); return; }
    S=fresh(order,f); save(); render();
  };
  $("bStudy").onclick=function(){
    var m=$("selMod").value, ids=pick(f,m); if(!ids.length){ alert("이 범위에는 문제가 없습니다."); return; }
    startStudy(ids, FILT[f]+(m==="all"?"":" · "+mname(m)));
  };
  header();
}

/* ---------- study screen: 문제 + 정답 + 해설을 같이 본다 ---------- */
function startStudy(ids, label){ UI.view="study"; UI.study={ids:ids, i:0, label:label}; saveUI(); study(); window.scrollTo(0,0); }
function study(){
  var T=UI.study, id=T.ids[T.i], q=BYID[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case"><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    return '<div class="opt'+(L===q.ans?' sel-ok':'')+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+
      (L!==q.ans && q.why && q.why[L] ? '<span class="whyl">'+esc(q.why[L])+'</span>' : '')+'</span></div>';
  }).join("");
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  $("view").innerHTML='<section class="card">'+metaHtml(q, esc(q.orig))+vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div>'+
    '<div class="fb ok"><h3>정답 '+q.ans+'</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+trap+
    '<details class="en"><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details></div>'+
    '<div class="nav"><button class="btn" id="sPrev" '+(T.i===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+(T.i+1)+' / '+T.ids.length+'</span>'+
    '<button class="btn primary" id="sNext" '+(T.i===T.ids.length-1?'disabled':'')+'>다음 →</button></div>'+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="btn" id="sQuiz">이 목록 풀기 ('+T.ids.length+')</button><button class="btn" id="sHome">처음 화면</button></div></section>';
  $("sPrev").onclick=function(){ studyGo(T.i-1); };
  $("sNext").onclick=function(){ studyGo(T.i+1); };
  $("sQuiz").onclick=function(){ UI.view=null; saveUI(); S=fresh(T.ids.slice(),"list"); save(); render(); };
  $("sHome").onclick=setup;
  $("bConf").onclick=function(){ toggleConf(id); study(); };
  header();
}
function studyGo(i){ var T=UI.study; if(i<0||i>=T.ids.length) return; T.i=i; saveUI(); study(); window.scrollTo(0,0); }

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card">'+metaHtml(q,'Q'+(S.idx+1))+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll("button.opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  $("bConf").onclick=function(){ toggleConf(id); quiz(); };
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  var wcIds=S.order.filter(function(id){var r=S.round[id];return (r&&!r.correct) || isConf(BYID[id]);});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"||S.mode==="rwc"?"다시 풀기 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">토픽별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bRetryWC" '+(wcIds.length?'':'disabled')+'>틀린 문제 + 헷갈림 다시 풀기 ('+wcIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  function retry(ids, mode){ if(!ids.length) return; S.order=ids; S.idx=0; S.mode=mode; S.round={}; S.finished=false; S.view="quiz"; save(); render(); }
  $("bRetry").onclick=function(){ retry(wrongIds,"review"); };
  $("bRetryWC").onclick=function(){ retry(wcIds,"rwc"); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S || !S.order){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, confused:isConf(q), selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak,
    confusedOverrides:CONF.ids
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{이름}/latest.json)의 마지막 attempt로 진행 상태와 헷갈림 표시를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  if(at.confusedOverrides){ CONF={ids:at.confusedOverrides, at:at.exportedAt||""}; store.set(CONFKEY,CONF); }
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:MODE[at.mode]?at.mode:"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  UI.view=null; saveUI();
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기·헷갈림 변경보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(CONF.at>t) t=CONF.at;
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(UI.view!=="study" && (!S || S.view==="setup")){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(UI.view==="study" && UI.study && UI.study.ids && UI.study.ids.length) return study();
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} UI.view=null; saveUI(); S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(UI.view==="study"){ if(e.key==="ArrowRight") studyGo(UI.study.i+1); else if(e.key==="ArrowLeft") studyGo(UI.study.i-1); return; }
  if(!S||S.view!=="quiz"||!document.querySelector("button.opt")) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>
</html>

 model increases the statistical accuracy of the estimated value and produces a value closer to the true fundamental value of the security.”"}]},"FixedIncome::25.7-osagae":{"blocks":[{"type":"text","content":"Vincent Osagae, CFA, is the fixed income portfolio manager for Alpha Specialists, an institutional money manager. Vanessa Alwan, an intern, has suggested a list of bonds for Osagae’s consideration as shown in Figure 1. The benchmark yield curve is currently upward sloping."},{"type":"html","content":"<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p style=\"font-weight:bold;margin:0 0 0.5em\">Figure 1: Selected Bonds for Consideration</p><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:center;padding:4px 12px\">Bond</th><th style=\"text-align:center;padding:4px 12px\">Embedded Option</th></tr></thead><tbody><tr><td style=\"text-align:center;padding:4px 12px\">X</td><td style=\"text-align:center;padding:4px 12px\">None (option-free)</td></tr><tr><td style=\"text-align:center;padding:4px 12px\">Y</td><td style=\"text-align:center;padding:4px 12px\">Call option (callable)</td></tr><tr><td style=\"text-align:center;padding:4px 12px\">Z</td><td style=\"text-align:center;padding:4px 12px\">Put option (putable)</td></tr></tbody></table><p style=\"font-size:0.8em;color:#888;margin:0.5em 0 0\"><em>※ 원본 PDF에서 Figure 1 표 데이터 누락 — 답안 역추론으로 재구성</em></p></div>"},{"type":"text","content":"Osagae then turns his attention to a newly issued 4%, 15-year bond issued by Suni Corp. The bond has a Bermudan-style call option exercisable annually at any time after Year 4. Osagae computes an OAS of 145 bps for this bond using a binomial interest rate tree. The tree was generated with U.S. Treasury rates and an assumed volatility of 15%, which was consistent with historical data. Option markets are currently pricing interest rate options at an implied volatility of 19%.\n\nEvery week, Alwan meets with Osagae to discuss what she had learned over the week. At one of their weekly meetings, Alwan makes the following statements about key rate duration:\nStatement 1: The highest key rate duration of a low-coupon callable bond corresponds to the bond’s time-to-exercise.\nStatement 2: The highest key rate duration of a high-coupon putable bond corresponds to the bond’s time-to-maturity."},{"type":"text","content":"Beth Grange, a senior analyst reporting to Osagae has generated the following two-year MRR tree using a 15% volatility assumption (Figure 2: MRR Tree)."},{"type":"image","src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABLAAAADfCAIAAABprr0EAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAhrUlEQVR4nO3dDZBdZX0/8IAiIGirwojVdleXtmzoFtKMmik1bQVlk9aY0amlZvClyZYAE4GpgE5C7IwUgdjd8tKmMsqmUF8GB3cLRRBC17SAGFhwWsB1A0iEzCqRf9wukMTluv/f7tk9Ofdld+/evOzL+XzmO8zuvc9z7rkvZO5377nnmTcEAABALs2b7h0AAABgeiiEAAAAOaUQAgAA5JRCCAAAkFMKIQAAQE4phAAAADmlEAIAAOSUQggAAJBTCiEAAEBOKYQAAAA5pRACAADklEIIAACQUwohAABATimEAAAAOaUQAgAA5JRCCAAAkFOzrBDecsstf/RHf/Tnf/7njz322HTvyzQYGBh46qmntm/fPjg4ON37AgAAzHrTXAgfeuiht0/mggsuSAbv2bPnyCOPnDeiubl5evf8UHrkkUdWrVr1W7/1W/PGxOPwgQ984K677tr/jff09GQf7T/7sz+bdMrVV1+dnfJv//ZvJQPKn8STTjrp9NNP/8QnPnHdddf9+Mc/rmZPEieffHI81y0tLe3t7Tt37qzyTk36osr6i7/4iyo3CwAAc8w0F8L//u//njeZv/qrv0oG7969+9WvfnVy4fve977p3fND48UXX4wqOMGDc8455/zqV7/an5v4n//5n5Jtbtu2beIpDQ0N2fH//M//XDJg4if08MMPj4L30ksvTbonJY4++ujPf/7zr7zyyqR3auLtlDjttNOm9IgBAMCcMZsKYfjyl7988sknxzv4rVu3TuNuHxp79uyJO5t9KKKJvec976mrq8te+I//+I/7cyvlNezyyy+fYPyDDz5YMn6qhTDxp3/6p3v37p14Tyo6++yzJ71T1WwnpRACAJBbM6gQ3nffff+vkhdffHF6d3Iabdq0KXlwPv7xj2c/uIvH7bjjjkuuih+q+dBsPGkNe/3rX5/8MH/+/AnGn3/++cmwY445JvlhgkKYXrVr167u7u6///u/f+Mb35hee8MNN1Tck/Af//EfyYXPP/98vDAuuuii9Gjh8L3vfW/iO1X+KmpsbEzmfvjDHy656v/+7/+m9pABAMBcMYMKYfSBA7XZeIu/Px2pBnv27Jl4QBSP2o7tvOKKK+65557yy6NrpQ9ddK0atpxIa9hpp532O7/zOxM/F4ODg8cff3wMeN3rXnfmmWdWXwhTP/7xj1/72tcm155++ukV9yRbCFP33ntveu1555031bv5e7/3e8nc7AfOVfrlL39ZKBQ hyIQAgAAAIBDEQgBAAAAwKEIhAAAAADgUARCAAAAAHAoAiEAAAAAOBSBEAAAAAAcikAIAAAAAA71/5kg/R8G8+GdAAAAAElFTkSuQmCC","alt":"Figure 3: OAS at 10% Volatility"}]},"FixedIncome::27.3-banaji":{"text":"Jamshed Banaji, CFA, manages a $400 million bond portfolio for a large public pension fund. Banaji is concerned about volatility in the credit markets and expects credit spreads to widen in the short-term but revert back to current levels over the long-term. Banaji has flagged two of his holdings for further scrutiny: IDG Corp. and Zeta Corp.\n\nThe portfolio currently has $10 million par value of 6% 10-year senior unsecured IDG Corp. bonds. Because he is concerned about IDG’s credit risk, Banaji enters into a credit default swap as a protection buyer. Banaji selects a five-year senior CDS for IDG with a coupon rate of 5% and a duration of 4. IDG bonds have a yield-to-maturity of 6.5%. The MRR yield curve is flat at 2%.\n\nBanaji is also concerned about the Zeta Corp. bonds that he holds. Zeta’s management is planning to pursue a recapitalization plan that involves a large stock buyback program financed by new debt."},"Derivatives::28.5-passage":{"blocks":[{"type":"text","content":"Two parties enter into a 2-year fixed-for-floating interest rate swap with semiannual payments. The floating-rate payments are based on MRR. The 180-, 360-, 540-, and 720- day annualized MRR rates and present value factors are:"},{"type":"html","content":"<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">Rate</th><th style=\"text-align:center;padding:4px 12px\">Present Value Factor</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">180-day MRR</td><td style=\"text-align:center;padding:4px 12px\">5.0%</td><td styl 6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">Europe</th><th style=\"text-align:center;padding:4px 12px\">United States</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Nominal 1-year interest rate:</td><td style=\"text-align:center;padding:4px 12px\">4%</td><td style=\"text-align:center;padding:4px 12px\">?</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Expected annual inflation:</td><td style=\"text-align:center;padding:4px 12px\">2%</td><td style=\"text-align:center;padding:4px 12px\">1%</td></tr></tbody></table></div>Franklin also gathers the following information:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">Switzerland</th><th style=\"text-align:center;padding:4px 12px\">South Africa</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Nominal 1-year interest rate:</td><td style=\"text-align:center;padding:4px 12px\">5%</td><td style=\"text-align:center;padding:4px 12px\">7%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Expected annual inflation:</td><td style=\"text-align:center;padding:4px 12px\">3%</td><td style=\"text-align:center;padding:4px 12px\">5%</td></tr></tbody></table></div>"},"Economics::5.3-passage":{"text":"Agnetha Poulsen works as an analyst in the foreign exchange overlay strategies department for CFN, a large asset management firm serving institutional clients. She is concerned about the excessive unhedged currency exposure taken on by the overlay strategies department. She makes an appointment with Alvilda Kristensen, director of risk management, to discuss this matter. Prior to the meeting, Poulsen collects information on foreign currency quotes and on interest rates as shown in Figure 1 and Figure 2.<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><div style=\"font-weight:600;margin-bottom:0.4em\">Figure 1: Current Spot and Forward Exchange Rate Quotes</div><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\">Quotes</th><th style=\"text-align:center;padding:4px 12px\">USD/CHF</th><th style=\"text-align:center;padding:4px 12px\">USD/EUR</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Spot</td><td style=\"text-align:center;padding:4px 12px\">0.9817/0.9821</td><td style=\"text-align:center;padding:4px 12px\">1.2235/1.2238</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">30-day forward</td><td style=\"text-align:center;padding:4px 12px\">−7.6/−6.9</td><td style=\"text-align:center;padding:4px 12px\">−7.21/−6.80</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">60-day forward</td><td style=\"text-align:center;padding:4px 12px\">−15.3/−13.3</td><td style=\"text-align:center;padding:4px 12px\">−14.56/−13.76</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">90-day forward</td><td style=\"text-align:center;padding:4px 12px\">−24.3/−23.05</td><td style=\"text-align:center;padding:4px 12px\">−23.84/−22.77</td></tr></tbody></table></div><div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><div style=\"font-weight:600;margin-bottom:0.4em\">Figure 2: Selected Interest Rates</div><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\">Interest Rates</th><th style=\"text-align:center;padding:4px 12px\">USD</th><th style=\"text-align:center;padding:4px 12px\">EUR</th><th style=\"text-align:center;padding:4px 12px\">CHF</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">30-day rate</td><td style=\"text-align:center;padding:4px 12px\">0.20%</td><td style=\"text-align:center;padding:4px 12px\">0.91%</td><td style=\"text-align:center;padding:4px 12px\">1.13%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">60-day rate</td><td style=\"text-align:center;padding:4px 12px\">0.21%</td><td style=\"text-align:center;padding:4px 12px\">0.93%</td><td style=\"text-align:center;padding:4px 12px\">1.15%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">90-day rate</td><td style=\"text-align:center;padding:4px 12px\">0.26%</td><td style=\"text-align:center;padding:4px 12px\">1.04%</td><td style=\"text-align:center;padding:4px 12px\">1.25%</td></tr></tbody></table></div>Poulsen also reviews the current open forward contracts. As an example, she reviews two contracts. Contract FX2001 is a 90-day forward contract initiated 60 days ago. The contract calls for purchase of CHF 200 million at an all-in rate of USD 0.9832. Contract FX2051 is a 90-day contract initiated 30 days ago to purchase 100 million EUR at an all- in rate of 1.2242. During her meeting with Kristensen, Poulsen expresses concern about traders establishing FX carry trades in several emerging market currencies. Kristensen assures Poulsen that CFN has adequate monitoring mechanisms. She continues that these carry trades have been generating significant positive returns for the clients and Poulsen should not worry about it. Poulsen counters by stating that carry trade returns distributions are characterized by negative kurtosis and excess skewness. Poulsen reviews her notes and decides to prepare a report on currency crises. She compiles a list of indicators of an impending currency crisis based on empirical analysis. Poulsen then turns her attention to the firm’s investments in Zambola, an emerging market. She realizes that currently the currency overlay strategy department has no trades involving the free-floating Zambolan currency, the Zu. Poulsen is concerned about significant long exposure of the portfolio in Zu. Zambola is enjoying large capital inflows drawn by Zambola’s attractive yields. Her analysis indicates that Zambola has been running large current account deficits. A trend analysis on Zu indicates a steep upward trend continuing above its PPP value."},"Economics::6.1, 6.2-passage":{"text":"Jay Smith, an analyst for Mako Capital, is evaluating investment prospects in Minikaz, an emerging market economy. Minikaz has experienced moderate growth in the past four years, after decades of stagnation. Smith is evaluating changes in government policies that would foster a higher level of growth. Figure 1 shows the summary of his findings. Figure 1: Proposed Changes in Minikaz Government Policies 1. Consumer protection will be at the forefront of government’s agenda. 2. The government will lower the entry barriers for foreign financial institutions to operate as intermediaries in Minikaz capital markets. 3. The government will expand public domain legislation to acquire private property for public works projects. Smith reviews a report published by the Minikaz commerce department. The report indicates that the long-term real growth rate of Minikaz GDP is 2.5%, corporate profits as a percentage of GDP increased by 2% last year, and the P/E ratio increased from 17 to 19 over the last two years. Separately, Smith also reviews World Bank reports indicating that Minikaz’s potential GDP growth is 4% and that it has been experiencing actual GDP growth of approximately 2.5%. Finally, Smith reviews Minikaz’s national income accounts and finds that Minikaz is experiencing both technological progress and making increased capital expenditures. Separately, Smith evaluates the performance of Kinimaz, a neighboring republic. Kinimaz has had labor growth of 2% over the last several years and capital growth of 3%. Labor’s share of total output is estimated to be 60%. Over the same period, Kinimaz’s real GDP has grown by 3.7%. Comparing the two countries, Smith notes that Kinimaz has substantially higher amounts of natural resource endowments. He concludes that Minikaz’s relatively lower GDP growth is due to lack of natural resources."},"Economics::6.3-passage":{"text":"Jignesh Sangani, an economist with a large asset management firm, makes the following statements about removal of barriers to trade and capital flows:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p><strong>Statement 1:</strong> Removal of barriers is likely to lead to permanently higher global economic growth under the neoclassical theory.</p><p><strong>Statement 2:</strong> Removal of barriers is likely to lead to permanently higher economic growth for developing countries only under the endogenous growth theory.</p></div>"},"CorporateIssuers::13.1-passage":{"text":"Klaatu is a country that taxes dividends based on a double-taxation system. The corporate tax rate on company profits is 35%. Barada is a country that taxes dividends based on a split-rate tax system. The corporate tax rate applied to retained earnings is 36%, while the corporate tax rate applied to earnings paid out as dividends is 20%. Nikto is a country that taxes dividends based on an imputation tax system. The corporate tax rate on earnings is 38%."},"CorporateIssuers::15.1, 15.2-passage":{"text":"Daniel Hsu, CFA, follows the pharmaceutical industry for Applied Fundamentals LLC. Hsu has asked associate Rudolph Hsei to evaluate the cost of capital in two countries P and Q. Hsei collects the information shown in Exhibit 1. Exhibit 1: Selected Information for Countries P and Q<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\">Factor</th><th style=\"text-align:center;padding:4px 12px\">Country P</th><th style=\"text-align:center;padding:4px 12px\">Country Q</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Legal System</td><td style=\"text-align:center;padding:4px 12px\">Common law</td><td style=\"text-align:center;padding:4px 12px\">Civil law</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Capital Markets</td><td style=\"text-align:center;padding:4px 12px\">Developed</td><td style=\"text-align:center;padding:4px 12px\">Less developed</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Volatility of currency value</td><td style=\"text-align:center;padding:4px 12px\">Low</td><td style=\"text-align:center;padding:4px 12px\">High</td></tr></tbody></table></div> Hsu is interested in estimating the cost of capital for two companies: Sizemore and Minicure. Sizemore is a large-cap company with a rich portfolio of successful drugs, while Minicure is a privately held company with a single drug, Mitra, which was approved by the FDA for treatment of early-stage dementia. Exhibit 2 shows selected financial information relevant to Sizemore. Exhibit 2: Sizemore, Selected Data ($ in millions)<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\"></th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Net revenues</td><td style=\"text-align:center;padding:4px 12px\">17,942</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">EBITDA</td><td style=\"text-align:center;padding:4px 12px\">4,498</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">EBIT</td><td style=\"text-align:center;padding:4px 12px\">3,421</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Interest expense</td><td style=\"text-align:center;padding:4px 12px\">814</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Income tax</td><td style=\"text-align:center;padding:4px 12px\">662</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Net income</td><td style=\"text-align:center;padding:4px 12px\">1,945</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Total debt</td><td style=\"text-align:center;padding:4px 12px\">8,671</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Cash and cash equivalents</td><td style=\"text-align:center;padding:4px 12px\">2,400</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Stockholders' equity</td><td style=\"text-align:center;padding:4px 12px\">17,342</td></tr></tbody></table></div> Sizemore’s tax rate is 34%. After analyzing hundreds of rated securities, Hsu arrives at a matrix for interest coverage (IC) ratios and financial leverage (D/E) ratios by rating class and credit spread relative to the benchmark security (currently yielding 2.3%) as shown in Exhibit 3. Exhibit 3: Rating Classes, Ratios and Spreads (truncated)<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\">Rating Class</th><th style=\"text-align:center;padding:4px 12px\">IC</th><th style=\"text-align:center;padding:4px 12px\">D/E</th><th style=\"text-align:center;padding:4px 12px\">Spread</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">AAA</td><td style=\"text-align:center;padding:4px 12px\">IC > 10</td><td style=\"text-align:center;padding:4px 12px\">D/E < 25%</td><td style=\"text-align:center;padding:4px 12px\">0.25%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">AA</td><td style=\"text-align:center;padding:4px 12px\">7 < IC < 10</td><td style=\"text-align:center;padding:4px 12px\">25% < D/E < 35%</td><td style=\"text-align:center;padding:4px 12px\">0.50%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">A</td><td style=\"text-align:center;padding:4px 12px\">5 < IC < 7</td><td style=\"text-align:center;padding:4px 12px\">35% < D/E < 40%</td><td style=\"text-align:center;padding:4px 12px\">0.80%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">BBB</td><td style=\"text-align:center;padding:4px 12px\">4 < IC < 5</td><td style=\"text-align:center;padding:4px 12px\">40% < D/E < 52%</td><td style=\"text-align:center;padding:4px 12px\">1.20%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">BB</td><td style=\"text-align:center;padding:4px 12px\">3 < IC < 4</td><td style=\"text-align:center;padding:4px 12px\">52% < D/E < 60%</td><td style=\"text-align:center;padding:4px 12px\">1.75%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">B</td><td style=\"text-align:center;padding:4px 12px\">2 < IC < 3</td><td style=\"text-align:center;padding:4px 12px\">60% < D/E < 67%</td><td style=\"text-align:center;padding:4px 12px\">2.33%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">CCC</td><td style=\"text-align:center;padding:4px 12px\">1 < IC < 2</td><td style=\"text-align:center;padding:4px 12px\">67% < D/E < 75%</td><td style=\"text-align:center;padding:4px 12px\">3.20%</td></tr></tbody></table></div> While discussing the computation of the equity risk premium, Hsei makes the following statements:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p><strong>Statement 1:</strong> The arithmetic mean of historical values of the equity risk premium (ERP) provides the best estimate of terminal value of wealth if invested at the ERP.</p><p><strong>Statement 2:</strong> Forward-looking estimates of the equity risk premium (ERP) do not suffer from survivorship bias and do not rely on the ERP being stationary.</p></div> Hsu obtains estimates of economic data for use in the calculation of ERP as shown in Exhibit 4. Exhibit 4: Selected Data: Wilshire 5000<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\"></th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Expected dividend yield</td><td style=\"text-align:center;padding:4px 12px\">1.10%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Forecast P/E growth rate</td><td style=\"text-align:center;padding:4px 12px\">−0.10%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Forecast real GDP growth</td><td style=\"text-align:center;padding:4px 12px\">3%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">10-year Treasury yield</td><td style=\"text-align:center;padding:4px 12px\">2.67%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">10-year TIPS yield</td><td style=\"text-align:center;padding:4px 12px\">0.33%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Change in shares outstanding</td><td style=\"text-align:center;padding:4px 12px\">0</td></tr></tbody></table></div> Hsu then compiles consensus estimates of Sizemore’s dividends and stock price. Sizemore is expected to pay a dividend of $1.00 per share in each of the next three years, and the stock price is expected to be $34 at the end of three years. Sizemore’s current stock price is $25. Hsei collects the following information and ponders how they might affect the SCRP for Minicure:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p><strong>Factor 1:</strong> Minicure's founder is the chairman and CEO. The management team is comprised of the team of scientists whose research initially led to the development of Mitra.</p><p><strong>Factor 2:</strong> The value of the patent on Mitra represents 90% of Minicure's total assets.</p><p><strong>Factor 3:</strong> Subcontractor Samita, Inc., handles the commercial production of Mitra because Samita is the only company that has the necessary specialized equipment.</p></div>"},"CorporateIssuers::16.3-passage":{"text":"Fastnar is a large European industrial supplies company with a market capitalization of €17 billion. During the COVID-19 pandemic, Fastnar’s supply chain experienced significant stress, leading to the loss of several large customers. Fastnar’s board has made the decision to acquire 100% of the outstanding stock of Luxor, a transportation company. Pre-announcement, Luxor’s stock was trading at €260. The pre-acquisition income statements (in € millions) for the two companies are shown here:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">Fastnar</th><th style=\"text-align:center;padding:4px 12px\">Luxor</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Revenues</td><td style=\"text-align:center;padding:4px 12px\">28,695</td><td style=\"text-align:center;padding:4px 12px\">8,964</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Cost of goods sold</td><td style=\"text-align:center;padding:4px 12px\">20,660</td><td style=\"text-align:center;padding:4px 12px\">6,006</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Operating expenses</td><td style=\"text-align:center;padding:4px 12px\">2,583</td><td style=\"text-align:center;padding:4px 12px\">807</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">EBITDA</td><td style=\"text-align:center;padding:4px 12px\">5,452</td><td style=\"text-align:center;padding:4px 12px\">2,151</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Depreciation & amortization</td><td style=\"text-align:center;padding:4px 12px\">1,121</td><td style=\"text-align:center;padding:4px 12px\">1,671</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">EBIT</td><td style=\"text-align:center;padding:4px 12px\">4,331</td><td style=\"text-align:center;padding:4px 12px\">480</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Interest expense</td><td style=\"text-align:center;padding:4px 12px\">1,100</td><td style=\"text-align:center;padding:4px 12px\">112</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Tax</td><td style=\"text-align:center;padding:4px 12px\">679</td><td style=\"text-align:center;padding:4px 12px\">55</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Net income</td><td style=\"text-align:center;padding:4px 12px\">2,553</td><td style=\"text-align:center;padding:4px 12px\">313</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Shares outstanding (millions)</td><td style=\"text-align:center;padding:4px 12px\">1,000</td><td style=\"text-align:center;padding:4px 12px\">20</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">EPS</td><td style=\"text-align:center;padding:4px 12px\">2.55</td><td style=\"text-align:center;padding:4px 12px\">15.66</td></tr></tbody></table></div> Additional details: A new issue of 30-year bonds yielding 3% will finance the purchase price of €6.26 billion. Synergies in the form of cost savings of €480 million per year are expected from this transaction. Additional depreciation due to the fair market value adjustment of Luxor’s fixed assets will be €35 million per year. Excluding the items just mentioned, in the first year after the -align:center;padding:4px 12px\">17.7</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Durbin-Watson</td><td style=\"text-align:center;padding:4px 12px\">1.8</td></tr></tbody></table></div>"},"Quants::1.4-passage":{"blocks":[{"type":"text","content":"Phil Ohlmer estimates a cross-sectional regression in order to predict price to earnings ratios (P/E) from fundamental variables that are related to P/E, including dividend payout ratio (DPO), growth rate (G), and beta (B). All 50 stocks in the sample come from two industries, electric utilities and biotechnology. He defines the following dummy variable:"},{"type":"html","content":"IND = 0 if the stock is in the electric utilities industry, or IND = 1 if the stock is in the biotechnology industry."},{"type":"text","content":"The results of his regression are shown in the following table."},{"type":"html","content":"<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\">Variable</th><th style=\"text-align:center;padding:4px 12px\">Coefficient</th><th style=\"text-align:center;padding:4px 12px\">t-Statistic</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Intercept</td><td style=\"text-align:center;padding:4px 12px\">6.75</td><td style=\"text-align:center;padding:4px 12px\">3.89*</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">IND</td><td style=\"text-align:center;padding:4px 12px\">8.00</td><td style=\"text-align:center;padding:4px 12px\">4.50*</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">DPO</td><td style=\"text-align:center;padding:4px 12px\">4.00</td><td style=\"text-align:center;padding:4px 12px\">1.86</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">G</td><td style=\"text-align:center;padding:4px 12px\">12.35</td><td style=\"text-align:center;padding:4px 12px\">2.43*</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">B</td><td style=\"text-align:center;padding:4px 12px\">−0.50</td><td style=\"text-align:center;padding:4px 12px\">1.46</td></tr></tbody></table></div><div style=\"font-size:0.85em;color:#666;margin-top:-0.5em\">*significant at the 5% level</div>"},{"type":"text","content":"While discussing the model with Bernie Shultz, Ohlmer mentions models with qualitative dependent variables. Ohlmer makes the following statements:"},{"type":"html","content":"<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p><strong>Statement 1:</strong> To evaluate nested models, a likelihood ratio (LR) test is used for logistic regressions. The LR test statistic uses an F-distribution.</p><p><strong>Statement 2:</strong> The slope coefficients in a logit model are interpreted as the change in the probability of the event occurring per 1-unit change in the independent variable, holding all other independent variables constant.</p></div>"},{"type":"text","content":"Ohlmer also raises the topic of model parsimony. He notes that one of the models with five independent variables has a log-likelihood (LL) metric of −212.44. Removing two of the independent variables results in LL (restricted) of −216.22. He wants to use 5% level of significance (critical chi-square of 5.99)."}]},"Quants::2.1-passage":{"text":"Consider the results of the regression of monthly real estate loans (RE) in billions of dollars by commercial banks over the period January 2020 through September 2023 in the following table:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><div style=\"font-weight:600;margin-bottom:0.4em\">Time Series Regression Results for Real Estate Loans</div><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"t esented in the following table.<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><div style=\"font-weight:600;margin-bottom:0.4em\">Regression Results for Outstanding Revolving Credit Study</div><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\"></th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Model: RCOₜ = b₀ + b₁RCOₜ₋₁ + εₜ</td><td style=\"text-align:center;padding:4px 12px\"></td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">R²</td><td style=\"text-align:center;padding:4px 12px\">0.952643</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Adjusted R²</td><td style=\"text-align:center;padding:4px 12px\">0.951208</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Standard error</td><td style=\"text-align:center;padding:4px 12px\">9.261452</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Observations</td><td style=\"text-align:center;padding:4px 12px\">35</td></tr></tbody></table></div><div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">Coefficients</th><th style=\"text-align:center;padding:4px 12px\">Standard Error</th><th style=\"text-align:center;padding:4px 12px\">t-Statistic</th><th style=\"text-align:center;padding:4px 12px\">p-Value</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Intercept</td><td style=\"text-align:center;padding:4px 12px\">−34.0019</td><td style=\"text-align:center;padding:4px 12px\">24.19417</td><td style=\"text-align:center;padding:4px 12px\">−1.40537</td><td style=\"text-align:center;padding:4px 12px\">0.169255</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Lag 1</td><td style=\"text-align:center;padding:4px 12px\">1.065697</td><td style=\"text-align:center;padding:4px 12px\">0.041362</td><td style=\"text-align:center;padding:4px 12px\">25.76512</td><td style=\"text-align:center;padding:4px 12px\">< 0.0001</td></tr></tbody></table></div>"},"Quants::2.4-passage":{"text":"<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><div style=\"font-weight:600;margin-bottom:0.4em\">Regression Results for Monthly Cash Flow Study</div><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">Coefficients</th><th style=\"text-align:center;padding:4px 12px\">Standard Error</th><th style=\"text-align:center;padding:4px 12px\">t-Statistic</th><th style=\"text-align:center;padding:4px 12px\">p-Value</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Intercept</td><td style=\"text-align:center;padding:4px 12px\">26.8625</td><td style=\"text-align:center;padding:4px 12px\">12.15146</td><td style=\"text-align:center;padding:4px 12px\">2.210639</td><td style=\"text-align:center;padding:4px 12px\">0.035719</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Lag 1</td><td style=\"text-align:center;padding:4px 12px\">0.7196</td><td style=\"text-align:center;padding:4px 12px\">0.042584</td><td style=\"text-align:center;padding:4px 12px\">16.89837</td><td style=\"text-align:center;padding:4px 12px\">< 0.0001</td></tr></tbody></table></div><div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><div style=\"font-weight:600;margin-bottom:0.4em\">Autocorrelation of the Residual</div><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\">Lag</th><th style=\"text-align:center;padding:4px 12px\">Autocorrelation</th><th style=\"text-align:center;padding:4px 12px\">Standard Error</th><th style=\"text-align:center;padding:4px 12px\">t-Statistic</th><th style=\"text-align:center;padding:4px 12px\">p-Value</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">12</td><td style=\"text-align:center;padding:4px 12px\">−0.0254</td><td style=\"text-align:center;padding:4px 12px\">0.0632</td><td style=\"text-align:center;padding:4px 12px\">−0.4019</td><td style=\"text-align:center;padding:4px 12px\">0.5612</td></tr></tbody></table></div>"},"Quants::4.3-passage":{"text":"While analyzing health care stocks, Ben Stokes devises a model to classify the stocks as those that will report earnings above consensus forecasts versus those that won’t. Stokes prepares the following confusion matrix using the results of his model.<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><div style=\"font-weight:600;margin-bottom:0.4em\">Confusion Matrix for Earnings Outperformance</div><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">Actual: Beat Forecast</th><th style=\"text-align:center;padding:4px 12px\">Actual: Not Beat</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Prediction: Beat Forecast</td><td style=\"text-align:center;padding:4px 12px\">12</td><td style=\"text-align:center;padding:4px 12px\">4</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Prediction: Not Beat</td><td style=\"text-align:center;padding:4px 12px\">2</td><td style=\"text-align:center;padding:4px 12px\">7</td></tr></tbody></table></div>"},"AlternativeInvestments::32.1-passage":{"text":"Anna Ginzburg, CFA, is using the following information to analyze a potential investment in an industrial building. Selected REIT Financial Information<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\">All Amounts in $ Million</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Estimated 12 months' cash net operating income</td><td style=\"text-align:center;padding:4px 12px\">$40</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Funds from operations (FFO)</td><td style=\"text-align:center;padding:4px 12px\">$30</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Cash and equivalents</td><td style=\"text-align:center;padding:4px 12px\">$30</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Accounts receivable</td><td style=\"text-align:center;padding:4px 12px\">$20</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Debt and other liabilities</td><td style=\"text-align:center;padding:4px 12px\">$250</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Non-cash rents</td><td style=\"text-align:center;padding:4px 12px\">$5</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Recurring maintenance-type capital expenditures</td><td style=\"text-align:center;padding:4px 12px\">$10</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Shares outstanding</td><td style=\"text-align:center;padding:4px 12px\">10 million shares</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Expected annual dividend next year (2024)</td><td style=\"text-align:center;padding:4px 12px\">$3.00</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Dividend growth rate in 2025 and 2026</td><td style=\"text-align:center;padding:4px 12px\">4%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Dividend growth rate (from 2027 into perpetuity)</td><td style=\"text-align:center;padding:4px 12px\">3%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Assumed cap rate</td><td style=\"text-align:center;padding:4px 12px\">8%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Office subsector average P/FFO multiple</td><td style=\"text-align:center;padding:4px 12px\">12×</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Office subsector average P/AFFO multiple</td><td style=\"text-align:center;padding:4px 12px\">20×</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Ginzburg's cost of equity capital</td><td style=\"text-align:center;padding:4px 12px\">11%</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Risk-free rate</td><td style=\"text-align:center;padding:4px 12px\">2%</td></tr></tbody></table></div>"},"Ethics_cfai::crawfood":{"blocks":[{"type":"html","content":"<p style='font-weight:700;color:var(--text)'>The following information relates to questions 5–10</p>"},{"type":"text","content":"Adam Craw, CFA, is chief executive officer (CEO) of Crawfood, a European private equity firm specializing in food retailers. The retail food industry has been consolidating during the past two years as private equity funds have closed numerous deals and taken many companies private.\n\nCrawfood recently hired Lillian Voser, a Level II CFA candidate, as a controller. On Voser’s first day of work, the head of personnel informs her that by signing the employment contract, Voser agrees to comply with the company’s code of ethics and compliance manual. She hands Voser copies of the code and compliance manual without further comment. Voser spends the next hour reading both documents. An excerpt from the compliance manual appears in Exhibit 1."},{"type":"html","content":"<div style='background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;margin:4px 0 12px'><div style='font-weight:700;color:var(--text);margin-bottom:6px'>Exhibit 1 Crawfood Company Compliance Manual Excerpts</div><ol><li>Employees must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved.</li><li>Officers have responsibility for ensuring that their direct reports—that is, employees whom they directly supervise—adhere to applicable laws, rules, and regulations.</li><li>Employees in possession of material nonpublic information should make reasonable efforts to achieve public dissemination of the information if such actions would not breach a duty.</li><li>Employees shall not trade or cause others to trade in securities of food retailers that may be potential takeover targets of their employer.</li></ol></div>"},{"type":"text","content":"When she enters her new office that afternoon, Voser finds a large gift basket sent by her sister. The card reads, “Congratulations on your new position.” The basket is filled with expensive high-quality food items from Greenhornfood—a local small, publicly traded food retailer, which produces many delicatessen products under its own brand name.\n\nDuring the next two weeks, Voser meets with all of Crawfood’s upper management, including the CEO. In his office, Craw praises Voser’s efforts to complete the CFA Program. “The program is demanding, but it is worthwhile.” Craw then explains his investment strategy for choosing Crawfood’s acquisition targets. He points to a large map on the wall with multicolored pins marking Crawfood’s previous takeovers. The map shows acquisitions in all the major cities of Germany with one exception—the home of Crawfood headquarters. Craw remarks, “We are currently in talks for another purchase. Confidentiality prohibits me from discussing it any further, but you will hear more about it soon.”\n\nIntroduced to Greenhornfood by her sister, Voser quickly becomes a loyal customer. She considers it the best food retailer in the vicinity, and she frequently purchases its products.\n\nThe following week, the local newspaper features an article about Greenhornfood and its young founders. The article describes the company’s loyal and growing customer base and its poor quarterly financial results. Voser notes that the stock has steadily declined during the past 12 months. She concludes that the company has an inexperienced management team but its popular product line and loyal customer base make the company a potential acquisition target. Voser calls her sister and recommends that she purchase Greenhornfood shares because “it would be an attractive acquisition for a larger company.” Based on Voser’s recommendation, her sister buys €3,000 worth of shares.\n\nDuring the following two weeks, the stock price of Greenhornfood continues to decline. Voser’s sister is uncertain about what she should do with her position. She seeks Voser’s advice. Voser recommends that her sister wait another few days before making her decision and promises to analyze the situation in the meantime.\n\nWhile walking by Craw’s office the following day, Voser sees a document with Greenhornfood’s distinctive logo and overhears the company’s name through an open office door. That evening, Voser tells her sister, “with the price decline, the stock is even more attractive.” She recommends that her sister increase her position. Based on her recommendation, her sister buys an additional €3,000 worth of Greenhornfood shares.\n\nOne month later, Crawfood publicly announces the acquisition of Greenhornfood Company at a 20% premium to the previous day’s closing price. Following the announcement, Voser’s sister boasts about Voser’s excellent recommendation and timing to her broker.\n\nRegulatory authorities initiate an investigation into suspicious trading in Greenhornfood shares and options preceding the formal announcement of the acquisition. Craw receives a letter from regulatory authorities stating that he is the subject of a formal investigation into his professional conduct surrounding the acquisition. He learns from the compliance officer that Voser is also under investigation. The compliance officer provides no details, and out of respect for Voser’s privacy, Craw makes no inquiries.\n\nThe situation remains unchanged, and the matter is still pending with regulatory authorities several months later when Craw receives his annual Professional Conduct Statement (PCS) from CFA Institute. He reviews the text that asks, “In the last two years, have you been . . . the subject of . . . any investigation . . . in which your professional conduct, in either a direct or supervisory capacity, was at issue?”"}]},"Ethics_cfai::boswin":{"blocks":[{"type":"html","content":"<p style='font-weight:700;color:var(--text)'>The following information relates to questions 16–21</p>"},{"type":"text","content":"Anne Boswin, CFA, is a senior fixed-income analyst at Greenfield Financial Corporation. Boswin develops financial models for predicting changes in bond prices. On the premise that bonds of firms targeted for leveraged buyouts (LBOs) often decline in value, Boswin develops a model to predict which firms are likely to be subject to LBOs.\n\nBoswin works closely with another analyst, Robert Acertado, CFA. Acertado frequently uses Boswin’s model to identify potential LBO targets for further research. Using the model and his extensive research skills, Acertado makes timely investment recommendations and develops a strong track record.\n\nBased on this record, Acertado receives an employment offer from the asset management division of Smith &amp; Garner Investments, Inc., a diversified financial services firm. With Boswin’s consent, Acertado downloads the model before leaving Greenfield.\n\nAt Smith &amp; Garner, Acertado presents the idea of predicting LBO targets as a way to identify bonds that might decline in value and thus be good sell recommendations. After Acertado walks his boss through the model, the supervisor comments, “I like your idea and your model, Robert. I can see that we made the right decision in hiring you.”\n\nBecause Smith &amp; Garner has both an investment banking (IB) and an asset management division, Acertado’s supervisor reminds him that he should not attempt to contact or engage in conversation with anyone from the investment banking division. The supervisor also directs him to eat in the east end of the company cafeteria. “The west end is reserved for the IB folks, and you may laugh at this, but we actually put up a wall between the two ends. If anyone were to accuse us of not having a firewall, we could actually point to it!” Robert’s supervisor also tells him, “There should be absolutely no conversation about divisional business while in the hall and elevator that serves as a common access to the cafeteria for both divisions. We are very strict about this.”\n\nThe following week, Acertado is riding alone in the elevator when it stops on an IB floor. As the doors begin to slide open, Acertado hears a voice whispering, “I am so pleased that we were able to put the financing together for Country Industries. I was concerned because the leverage will go to 80%—higher than our typical deal.” As soon as the doors open enough to reveal that the elevator is occupied, all conversation stops.\n\nLate that afternoon, Acertado uses the LBO model to measure the probability of Country Industries receiving an LBO offer. According to the model, the probability is 62%—slightly more than the 60% Acertado generally requires before conducting additional research. It is late in the afternoon and Acertado has little time to research the matter fully before the end of the trading day. He checks his inputs to the model. In the interest of time, Acertado immediately recommends selling Country Industries’ senior bonds held in any long-only accounts. He also recommends establishing positions in derivatives contracts that will benefit from a decline in the value of Country Industries’ bonds.\n\nThe next morning, after the firm has established the derivatives positions he recommended, Acertado calls Boswin. Knowing that his former associate will be preparing Greenfield’s monthly newsletter, he tells her, “I ran Country Industries through your model, and I think it is likely that they will receive an LBO offer.” Acertado explains some of the inputs he used in the model. At the conclusion of the conversation, Boswin responds, “You may be right. Country Industries sounds like a possible LBO candidate, and thus, a sell rating on its senior bonds would be in order. If I’m lucky, I can finish researching the issue in time to include the recommendation in the upcoming newsletter. Thanks. It was good talking with you, Robert.”\n\nAfter the conversation with Acertado, Boswin quickly runs Country Industries through the model. Based on her inputs, the model calculates that the probability of an LBO is 40%—not enough, in Boswin’s opinion, to justify further research. She wonders if there is a discrepancy between her inputs and Acertado’s. Pressed for time, Boswin resumes her work on the upcoming newsletter rather than investigating the matter.\n\nAcertado soon begins searching the internet for information on companies that the model predicts have more than a 60% probability of an LBO offer. He scours blogs and company websites looking for signs of a potential offer. He uses evidence of rumored offers in developing sell recommendations on various corporations’ bonds."}]},"Ethics_cfai::telline":{"blocks":[{"type":"html","content":"<p style='font-weight:700;color:var(--text)'>The following information relates to questions 30–35</p>"},{"type":"text","content":"Samuel Telline, CFA, is a portfolio manager at Aiklin Investments with discretionary authority over all his accounts. One of his clients, Alan Caper, chief executive officer (CEO) of Ellipse Manufacturing, invites Telline to lunch.\n\nAt the restaurant, the CEO reveals the reason for the lunch. “As you know, Reinhold Partners has made an unsolicited cash offer for all outstanding shares of Ellipse Manufacturing. Reinhold has made it clear that I will not be CEO if it is successful. I can assure you that our shareholders will be better off in the long term if I’m in charge.” Caper then shows Telline his projections for a new plan designed to boost both sales and operating margins.\n\n“I know that your firm is the trustee for our firm’s employee stock ownership plan (ESOP). I hope that the trustee will vote in the best interest of our shareholders—and that would be a vote against the takeover offer.”\n\nAfter looking through Caper’s business plans, Telline says, “This plan looks good. I will recommend that the trustee vote against the offer.”\n\nCaper responds, “I remember my friend Karen Leighton telling me that the Leighton Family Trust is managed by your firm. Perhaps the trustee could vote those shares against the acquisition as well. Karen Leighton is a close friend. I am sure that she would agree.”\n\nTelline responds, “The Leighton Family Trust is no longer managed by Aiklin.” He adds, “I understand that the trust is very conservatively managed. I doubt that it would have holdings in Ellipse Manufacturing.” Telline does not mention that although the Leighton Family Trust has changed investment managers, Karen Leighton remains an important client at Aiklin, with significant personal holdings in Ellipse.\n\nAfter lunch, Telline meets with Sydney Brown, CFA, trustee of the Ellipse ESOP. He shows her Caper’s plan for improvements. “I think the plan is a good one, and Caper is one of the firm’s most profitable accounts. We don’t want to lose him.” Brown agrees to analyze the plan. After thoroughly analyzing both the plan and the takeover offer, Brown concludes that the takeover offer is best for the shareholders in the ESOP and votes the plan’s shares in favor of the takeover offer.\n\nA few months later, the acquisition of Ellipse by Reinhold Partners is completed. Caper again meets Telline for lunch. “I received a generous severance package and I’m counting on you to manage my money well for me. While we are on the subject, I would like to be more aggressive with my portfolio. With my severance package, I can take additional risk.” Telline and Caper discuss his current financial situation, risk tolerance, and financial objectives throughout lunch. Telline agrees to adjust Caper’s investment policy statement (IPS) to reflect his greater appetite for risk and his increased wealth.\n\nBack at the office, Telline realizes that with the severance package, Caper is now his wealthiest client. He also realizes that Caper’s increased appetite for risk gives him a risk profile similar to that of another client. He pulls a copy of the other client’s investment policy statement (IPS), reviews it quickly, and realizes that the two clients have very different tax situations. Telline quickly revises Caper’s IPS to reflect the changes in his financial situation. He uses the other client’s IPS as a reference when revising the section relating to Caper’s risk tolerance. He then files the revised IPS in Caper’s file.\n\nThe following week, an Aiklin analyst issues a buy recommendation on a small technology company with a promising software product. Telline reads the report carefully and concludes it would be suitable under Caper’s new IPS. Telline places an order for 10,000 shares in Caper’s account and then calls Caper to discuss the stock in more detail. Telline does not purchase the stock for any other clients. Although the one client has the same risk profile as Caper, that client does not have cash available in his account, and Telline determines that selling existing holdings does not make sense.\n\nIn a subsequent telephone conversation, Caper expresses his lingering anger over the takeover. “You didn’t do enough to persuade Aiklin’s clients to vote against the takeover. Maybe I should look for an investment manager who is more loyal.” Telline tries to calm Caper but is unsuccessful. In an attempt to change the topic of conversation, Telline states, “The firm was just notified of our allocation of a long-awaited IPO. Your account should receive a significant allocation. I would hate to see you lose out by moving your account.” Caper seems mollified and concludes the phone call, “I look forward to a long-term relationship with you and your firm.”\n\nAiklin distributes a copy of its firm policies regarding IPO allocations to all clients annually. According to the policy, Aiklin allocates IPO shares to each investment manager and each manager has responsibility for allocating shares to accounts for which the IPO is suitable. The statement also discloses that Aiklin offers different levels of service for different fees.\n\nAfter carefully reviewing the proposed IPO and his client accounts, Telline determines that the IPO is suitable for 11 clients, including Caper. Because the deal is oversubscribed, he receives only half of the shares he expected. Telline directs 50% of his allocation to Caper’s account and divides the remaining 50% between the other 10 accounts, each with a value equal to half of Caper’s account."}]},"Ethics_cfai::apfelbaum":{"blocks":[{"type":"html","content":"<p style='font-weight:700;color:var(--text)'>The following information relates to questions 41–45</p>"},{"type":"text","content":"Erik Brecksen, CFA, a portfolio manager at Apfelbaum Kapital, recently recruited Hans Grohl, a CFA candidate and recent MBA graduate from a top university with excellent quantitative analysis skills. Apfelbaum Kapital stresses “top-down” fundamental analysis and uses a team approach to investment management. The firm’s investment professionals, all of whom are CFA charterholders or candidates, attend weekly investment committee meetings. At the meetings, analysts responsible for different industrial sectors present their research and recommendations. Following each presentation, the investment committee, consisting of senior portfolio managers, questions the analysts about the recommendations. If the majority of the committee agrees with the recommendation, the recommendation is approved and the stock is placed on a restricted list while the firm executes the necessary trades.\n\nApfelbaum considers its research proprietary. It is intended for the sole use of its investment professionals and is not distributed outside the firm. The names of all the investment personnel associated with the sector or investment class are listed on each research report regardless of their actual level of contribution to the report.\n\nOn Grohl’s first day of work, Brecksen assigns him responsibility for a company that Brecksen covered previously. He provides Grohl with his past research, including all his files and reports. Brecksen instructs Grohl to report back when he has finished his research and is ready to submit his own research report on the company.\n\nGrohl reads Brecksen’s old reports before studying the financial statements of the company and its competitors. Taking advantage of his quantitative analysis skills, Grohl then conducts a detailed multifactor analysis. Afterward, he produces a written buy recommendation using Brecksen’s old research reports as a guide for format and submits a draft to Brecksen for review.\n\nBrecksen reviews the work and indicates that he is not familiar with multifactor analysis. He tells Grohl that he agrees with the buy recommendation but instructs Grohl to omit the multifactor analysis from the report. Grohl attempts to defend his research methodology but is interrupted when Brecksen accepts a phone call. Grohl follows Brecksen’s instructions and removes all mention of the multifactor analysis from the final report. Brecksen presents the completed report at the weekly meeting with both his and Grohl’s names listed on the document. After Brecksen’s initial presentation, the committee turns to Grohl and asks about his research. Grohl takes the opportunity to mention the multifactor analysis. Satisfied, the committee votes in favor of the recommendation and congratulates Grohl on his work.\n\nOttie Zardt, CFA, has worked as a real estate analyst for Apfelbaum for the past 18 months. A new independent rating service has determined that Zardt’s recommendations have resulted in an excess return of 12% versus the industry’s return of 2.7% for the past 12 months. After learning about the rating service, Zardt immediately updates the promotional material he is preparing for distribution at an upcoming industry conference. He includes a reference to the rating service and quotes its return results and other information. Before distributing the material at the conference, he adds a footnote stating, “Past performance is no guarantee of future success.”"}]}};

const SUBJECTS    = ["FSA", "Fixed Income", "Derivatives", "Equity", "Portfolio Mgmt", "Economics", "Corporate Issuers", "Quants", "Alternative Investments", "Ethics (Module Quiz)", "Ethics (CFAI)"];

const STORAGE_KEY = 'cfa2_all_review_v1';
let state = { answers: {}, lastUpdatedAt: null };
let starred = {};
ALL_ITEMS.forEach(it => { if(it.starred) starred[it.key] = true; });
function isStarred(k){ return starred[k] === true; }
// 'pre' = 기존별표(데이터에 원래 있던 별표), 'user' = 추가별표(내가 단 별표), 'none' = 별표 없음
const PRE_STAR = {};
ALL_ITEMS.forEach(it => { if(it.starred) PRE_STAR[it.key] = true; });
function starKind(it){ if(!isStarred(it.key)) return 'none'; return PRE_STAR[it.key] ? 'pre' : 'user'; }
function saveToStorage(){ state.lastUpdatedAt=new Date().toISOString(); try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({state, starred})); }catch(e){} }
function loadFromStorage(){ try{ const d=localStorage.getItem(STORAGE_KEY); if(d){ const p=JSON.parse(d); if(p.state) state=p.state; if(p.starred) starred=p.starred; } }catch(e){} }

let filteredItems = [...ALL_ITEMS];
let cur = 0, passageOpen = true;
let currFilter = {type:'all', subj:null};
let collapsedSubj = {};

function applyFilter(type, subj) {
  currFilter = {type, subj};
  document.querySelectorAll('.flt-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector('[data-filter="'+(subj||type)+'"]');
  if(btn) btn.classList.add('active');
  filteredItems = ALL_ITEMS.filter(it=>{
    const tOk = type==='all'||(type==='wrong'&&it.wrong)||(type==='starred'&&isStarred(it.key))||(type==='prestar'&&starKind(it)==='pre')||(type==='userstar'&&starKind(it)==='user');
    const sOk = !subj||it.subject===subj;
    return tOk&&sOk;
  });
  cur=0; renderSidebar(); render();
}

function resolveImgs(html){
  return html.replace(/\{\{IMG:([^}]+)\}\}/g,(_,k)=>{
    const src=PAGE_IMAGES[k];
    return src?'<img src="'+src+'" alt="img" style="max-width:100%;border:1px solid #e0e0e0;border-radius:4px;margin:8px 0;display:block">':'';
  });
}

function renderPassageHTML(psg, passageKey, blockFilter){
  if(!psg) return '';
  let out='';
  if(psg.blocks){
    const blocks = blockFilter
      ? psg.blocks.filter((_,i)=>blockFilter.includes(i))
      : psg.blocks;
    for(const block of blocks){
      if(block.type==='text'){
        const hasHTML = /<[a-z][\s\S]*?>/i.test(block.content);
        if(hasHTML){
          out += block.content;
        } else {
          out += block.content.split(/\n\s*\n/)
            .map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
        }
      } else if(block.type==='html'){
        out += block.content;
      } else if(block.type==='image'){
        out += '<figure style="margin:10px 0;text-align:center">'
             +'<img src="'+block.src+'" alt="'+(block.alt||'')+'" '
             +'style="max-width:100%;border:1px solid #e0e0e0;border-radius:4px">'
             +'</figure>';
      } else if(block.type==='ref'&&PASSAGES[block.id]){
        out += renderPassageHTML(PASSAGES[block.id], block.id, null);
      }
    }
  } else {
    if(psg.text){
      const hasHTML = /<[a-z][\s\S]*?>/i.test(psg.text);
      if(hasHTML){
        out += psg.text;
      } else {
        out += psg.text.split(/\n\s*\n/)
          .map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
      }
    }
    if(psg.image){
      const src=PAGE_IMAGES[psg.image];
      if(src) out+='<img src="'+src+'" alt="exhibit" style="max-width:100%;border:1px solid #e0e0e0;border-radius:4px;margin:10px 0;display:block">';
    }
  }
  return out;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jsAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function toggleSubj(subj){ collapsedSubj[subj]=!collapsedSubj[subj]; renderSidebar(); }
function strip(s){return String(s).replace(/<[^>]*>/g,'');}

function renderSidebar(){
  const inner=document.getElementById('sb-inner');
  // group filtered items by subject preserving order
  const groups=[];
  filteredItems.forEach((it,i)=>{
    let g=groups[groups.length-1];
    if(!g||g.subject!==it.subject){ g={subject:it.subject,items:[]}; groups.push(g); }
    g.items.push({it,i});
  });
  let html='';
  groups.forEach(g=>{
    const total=g.items.length;
    const doneCnt=g.items.filter(x=>!!state.answers[x.it.key]).length;
    const collapsed=!!collapsedSubj[g.subject];
    const allDone=total>0&&doneCnt===total;
    html+='<button class="sb-subj-hdr'+(collapsed?' collapsed':'')+'" onclick="toggleSubj(\''+jsAttr(g.subject)+'\')">'
         +'<span class="sb-caret">▼</span>'
         +'<span class="sb-subj-name">'+esc(g.subject)+'</span>'
         +'<span class="sb-subj-count'+(allDone?' done':'')+'">'+doneCnt+'/'+total+'</span>'
         +'</button>';
    html+='<div class="sb-group'+(collapsed?' collapsed':'')+'">';
    g.items.forEach(({it,i})=>{
      const sk=starKind(it);
      const dc=sk==='pre'?'dot-pre':sk==='user'?'dot-user':it.wrong?'dot-wrong':'dot-none';
      const isDone=!!state.answers[it.key];
      html+='<button class="sb-q-btn'+(i===cur?' active':'')+'" id="sb-'+i+'" onclick="gotoIdx('+i+')">'
           +'<span class="dot '+dc+'"></span>'
           +'<span class="sb-num">'+(i+1)+'</span>'
           +(isDone?'<span style="color:#0F7A50;font-size:10px;line-height:1;flex-shrink:0">✓</span>':'')
           +'</button>';
    });
    html+='</div>';
  });
  inner.innerHTML=html;
}
function updateSbActive(){
  const curItem=filteredItems[cur];
  if(curItem&&collapsedSubj[curItem.subject]){
    collapsedSubj[curItem.subject]=false;
    renderSidebar();
  }
  document.querySelectorAll('.sb-q-btn').forEach((b,i)=>b.classList.toggle('active',i===cur));
  const ab=document.getElementById('sb-'+cur);
  if(ab) ab.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function render(){
  const empty=document.getElementById('empty'), qa=document.getElementById('q-area');
  if(!filteredItems.length){
    empty.classList.add('show');qa.style.display='none';
    document.getElementById('prog-label').textContent='';
    document.getElementById('prog-bar-fill').style.width='0%';
    return;
  }
  empty.classList.remove('show');qa.style.display='';
  const it=filteredItems[cur], total=filteredItems.length;

  document.getElementById('prog-label').textContent=(cur+1)+' / '+total;
  document.getElementById('prog-bar-fill').style.width=((cur+1)/total*100).toFixed(1)+'%';
  document.getElementById('jump-input').value=cur+1;
  document.getElementById('jump-total').textContent='/ '+total;
  document.getElementById('btn-next').disabled=cur>=total-1;

  let meta='<span class="subj-badge">'+esc(it.subject)+'</span>';
  if(it.wrong) meta+='<span class="tag tag-wrong">✗ 오답</span>';
  const _sk=starKind(it);
  if(_sk==='pre') meta+='<span class="tag tag-pre">★ 기존별표</span>';
  else if(_sk==='user') meta+='<span class="tag tag-user">★ 추가별표</span>';
  meta+='<span class="q-counter-right">'+(cur+1)+' / '+total+'</span>';
  document.getElementById('q-meta').innerHTML=meta;
  const _sb=document.getElementById('btn-star-toggle');
  if(_sb){ const sk2=starKind(it); _sb.textContent=sk2==='pre'?'★ 기존별표':sk2==='user'?'★ 추가별표':'☆ 별표'; _sb.className='tb-btn'+(sk2==='pre'?' star-pre':sk2==='user'?' star-user':''); }

  const pb=document.getElementById('passage-box');
  if(it.p && PASSAGES[it.p]){
    const passageHTML=renderPassageHTML(PASSAGES[it.p], it.p, it.passageBlocks||null);
    if(passageHTML.trim()){
      pb.style.display='';
      document.getElementById('passage-content').innerHTML=passageHTML;
      document.getElementById('passage-caret').textContent=passageOpen?'▼':'▶';
      document.getElementById('passage-content').style.display=passageOpen?'':'none';
    } else pb.style.display='none';
  } else pb.style.display='none';

  document.getElementById('q-body').innerHTML=resolveImgs(it.q);

  const optDiv=document.getElementById('options');
  const expDiv=document.getElementById('explanation');
  const isRev=!!state.answers[it.key];

  if(it.open){
    optDiv.innerHTML='<button class="btn-reveal" onclick="revealOpen()">정답 확인 ▼</button>';
  } else {
    let oh='';
    (it.o||[]).forEach(opt=>{
      const letter=opt.charAt(0);
      const text=opt.length>2?opt.substring(2).trim():opt;
      let cls='opt',dis='';
      if(isRev){dis='disabled';if(letter===it.a)cls+=' correct';}
      oh+='<button class="'+cls+'" '+dis+' onclick="pickOpt(this,\''+esc(letter)+'\')"><span class="ol">'+esc(letter)+'.</span><span>'+resolveImgs(text)+'</span></button>';
    });
    optDiv.innerHTML=oh;
  }

  if(isRev){
    expDiv.classList.add('show');
    let eh='';
    if(it.los) eh+='<div class="los-tag">'+esc(it.los)+'</div>';
    eh+=resolveImgs(it.e||'');
    expDiv.innerHTML=eh;
  } else {expDiv.classList.remove('show');expDiv.innerHTML='';}

  updateSbActive();
}

function pickOpt(btn,letter){
  const it=filteredItems[cur];
  state.answers[it.key]=true; saveToStorage();
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const l=b.querySelector('.ol').textContent.replace('.','');
    if(l===it.a) b.classList.add('correct');
    else if(l===letter&&letter!==it.a) b.classList.add('wrong');
  });
  showExp(it);
  renderSidebar();
}
function revealOpen(){
  const it=filteredItems[cur];
  state.answers[it.key]=true; saveToStorage();
  const rb=document.querySelector('.btn-reveal');
  if(rb) rb.style.display='none';
  showExp(it);
  renderSidebar();
}
function showExp(it){
  const expDiv=document.getElementById('explanation');
  expDiv.classList.add('show');
  let eh='';
  if(it.los) eh+='<div class="los-tag">'+esc(it.los)+'</div>';
  eh+=resolveImgs(it.e||'');
  expDiv.innerHTML=eh;
}

function navigate(d){const n=cur+d;if(n<0||n>=filteredItems.length)return;cur=n;render();window.scrollTo(0,0);}
function gotoIdx(i){cur=i;render();window.scrollTo(0,0);}
function jumpTo(v){const n=parseInt(v,10)-1;if(isNaN(n)||n<0||n>=filteredItems.length)return;cur=n;render();}
function togglePassage(){passageOpen=!passageOpen;document.getElementById('passage-caret').textContent=passageOpen?'▼':'▶';document.getElementById('passage-content').style.display=passageOpen?'':'none';}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') navigate(1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') navigate(-1);
});

function fmtDateTime(d){ if(!(d instanceof Date)||isNaN(d)) return '?'; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function refreshCounts(){
  const starredCount = ALL_ITEMS.filter(it=>isStarred(it.key)).length;
  const preCount = ALL_ITEMS.filter(it=>starKind(it)==='pre').length;
  const userCount = ALL_ITEMS.filter(it=>starKind(it)==='user').length;
  const btn = document.querySelector('[data-filter="starred"]');
  if(btn) btn.textContent = '⭐ 별표 전체 ('+starredCount+')';
  const btnPre = document.querySelector('[data-filter="prestar"]');
  if(btnPre) btnPre.textContent = '★ 기존별표 ('+preCount+')';
  const btnUser = document.querySelector('[data-filter="userstar"]');
  if(btnUser) btnUser.textContent = '★ 추가별표 ('+userCount+')';
  const chipPre = document.querySelector('.chip-pre');
  if(chipPre) chipPre.textContent = '★ 기존별표 '+preCount+'개';
  const chipUser = document.querySelector('.chip-user');
  if(chipUser) chipUser.textContent = '★ 추가별표 '+userCount+'개';
}

function resetAll(){
  const answered = Object.keys(state.answers||{}).length;
  const userCnt = ALL_ITEMS.filter(it=>starKind(it)==='user').length;
  const msg = '전체 초기화를 하면 다음이 모두 지워집니다:\n\n'
    + '· 풀이 기록 '+answered+'문항 (정답/오답 표시)\n'
    + '· 내가 추가한 별표 '+userCnt+'개\n\n'
    + '기존별표(원래 있던 별표)는 그대로 유지됩니다.\n'
    + '다른 사람이 처음부터 다시 풀 수 있는 상태가 됩니다.\n\n계속하시겠습니까?';
  if(!confirm(msg)) return;
  state = { answers:{}, lastUpdatedAt:null };
  starred = {};
  ALL_ITEMS.forEach(it => { if(it.starred) starred[it.key] = true; });
  saveToStorage(); refreshCounts();
  cur = 0;
  applyFilter('all', null);
  alert('전체 초기화 완료! 모든 문제를 처음부터 다시 풀 수 있습니다.');
}

function toggleStar(){
  if(!filteredItems.length) return;
  const it = filteredItems[cur];
  starred[it.key] = !isStarred(it.key);
  saveToStorage(); refreshCounts();
  if(currFilter.type==='starred'){
    const saveCur = cur;
    applyFilter(currFilter.type, currFilter.subj);
    cur = Math.min(saveCur, Math.max(0, filteredItems.length-1));
    renderSidebar(); render();
  } else { render(); }
}

function resetQ(){
  if(!filteredItems.length) return;
  const it = filteredItems[cur];
  delete state.answers[it.key];
  saveToStorage(); render(); renderSidebar();
}

const DB_NAME = 'cfa2_all_review_fsdb';
const EXPORT_FILENAME = 'cfa2_all_review_progress.json';

function idbHandleGet(){
  return new Promise(resolve=>{
    if(!window.indexedDB){resolve(null);return;}
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{try{req.result.createObjectStore("handles");}catch(e){}};
    req.onsuccess=()=>{
      try{
        const tx=req.result.transaction("handles","readonly");
        const g=tx.objectStore("handles").get("export");
        g.onsuccess=()=>resolve(g.result||null);
        g.onerror=()=>resolve(null);
      }catch(e){resolve(null);}
    };
    req.onerror=()=>resolve(null);
  });
}
function idbHandleSet(handle){
  return new Promise(resolve=>{
    if(!window.indexedDB){resolve(false);return;}
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{try{req.result.createObjectStore("handles");}catch(e){}};
    req.onsuccess=()=>{
      try{
        const tx=req.result.transaction("handles","readwrite");
        tx.objectStore("handles").put(handle,"export");
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>resolve(false);
      }catch(e){resolve(false);}
    };
    req.onerror=()=>resolve(false);
  });
}

function buildExportData(){
  return {
    version: 1,
    source: 'cfa2_all_review',
    exportedAt: new Date().toISOString(),
    exportedFrom: (navigator.platform || "unknown") + " · " + (navigator.userAgentData?.brands?.find(b=>!/Not.A.Brand/i.test(b.brand))?.brand || (navigator.userAgent.match(/Chrome|Firefox|Safari|Edg/)?.[0] || "")),
    state,
    starred
  };
}

async function exportJSON(){
  const data = buildExportData();
  const json = JSON.stringify(data, null, 2);
  const filename = EXPORT_FILENAME;

  if (typeof window.showSaveFilePicker === "function") {
    try {
      let handle = await idbHandleGet();
      if (handle) {
        const perm = await handle.queryPermission({mode:"readwrite"});
        if (perm !== "granted") {
          const req = await handle.requestPermission({mode:"readwrite"});
          if (req !== "granted") handle = null;
        }
      }
      if (!handle) {
        handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{description:"Progress JSON", accept:{"application/json":[".json"]}}]
        });
        await idbHandleSet(handle);
      }
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      alert(`내보내기 완료!
저장된 파일: ${handle.name}
(다음 내보내기부터는 같은 파일에 자동으로 덮어쓐니다)`);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      console.warn("File System Access export failed, falling back to download:", e);
    }
  }

  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  alert(`내보내기 완료! (다운로드 폴더에 "${filename}"로 저장됨)`);
}

function importJSON(event){
  const files = Array.from(event.target.files||[]);
  event.target.value='';
  if(!files.length) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const d = JSON.parse(e.target.result);
      if(!d.state || typeof d.state.answers !== 'object'){ alert('\uc720\ud6a8\ud55c \uc9c4\ud589 \uc0c1\ud669 \ud30c\uc77c\uc774 \uc544\ub2d9\ub2c8\ub2e4.'); return; }
      const answeredCount = Object.keys(d.state.answers||{}).length;
      const starredCount = Object.keys(d.starred||{}).filter(k=>d.starred[k]).length;
      const ts = d.exportedAt ? fmtDateTime(new Date(d.exportedAt)) : '\uc54c \uc218 \uc5c6\uc74c';
      const msg = `\uc9c4\ud589 \uc0c1\ud669\uc744 \uac00\uc838\uc635\ub2c8\ub2e4.\n\n\ub0b4\ubcf4\ub09c \uc2dc\uac01: ${ts}\n\ud480\uc774 \uc644\ub8cc: ${answeredCount}\ubb38\ud56d\n\ubcc4\ud45c: ${starredCount}\ubb38\ud56d\n\n\ud604\uc7ac \ube0c\ub77c\uc6b0\uc800\uc5d0 \uc800\uc7a5\ub41c \uae30\ub85d\uc744 \ub36e\uc5b4\uc501\ub2c8\ub2e4. \uacc4\uc18d\ud558\uc2dc\uac4c\uc2b5\ub2c8\uae4c?`;
      if(!confirm(msg)) return;
      state = d.state;
      starred = d.starred || {};
      saveToStorage(); refreshCounts();
      applyFilter(currFilter.type, currFilter.subj);
    }catch(err){ alert('\ud30c\uc77c\uc744 \uc77d\ub294 \uc911 \uc624\ub958\uac00 \ubc1c\uc0dd\ud588\uc2b5\ub2c8\ub2e4: '+err.message); }
  };
  reader.readAsText(files[0]);
}

loadFromStorage(); refreshCounts(); applyFilter('all',null);

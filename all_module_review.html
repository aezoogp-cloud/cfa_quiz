ageBlocks":null},{"key":"21.4_81","subject":"Equity","subject_id":"Equity","wrong":true,"starred":true,"q":"Josef Robien, CFA, is valuing the common stock of British Cornucopia Bank (BCB) as of December 31, 20X3, when the book value per share is £10.62. In this effort, Robien has made the following assumptions:<ul><li>Earnings per share (EPS) will be 20% of the beginning book value per share for each of the next three years.</li><li>BCB will pay cash dividends equal to 40% of EPS.</li><li>At the end of three years, BCB’s common stock will trade at four times its book value.</li><li>Beta for BCB is 0.7, the risk-free rate is 4.5%, and the equity risk premium is 5.0%.</li></ul>The value per share of BCB stock using the residual income model is closest to:","o":["A. £39.17.","B. £49.80.","C. £53.20."],"a":"B","e":"The present value of residual income in 20X3 is: \\[ \\frac{(P_{20X6} - B_{20X6}) + \\text{RI}_{20X6}}{1 + r} = \\frac{(\\text{£}59.64 - \\text{£}14.91) + \\text{£}1.59}{1.08} = \\text{£}42.89 \\] \\[ \\frac{\\text{£}42.89}{1.08^2} = \\text{£}36.77 \\] \\[ \\text{value} = \\text{£}10.62 + \\text{£}2.41 + \\text{£}36.77 = \\text{£}49.80 \\]","los":"LOS 21.h","open":false,"p":null,"passageBlocks":null},{"key":"21.4_83","subject":"Equity","subject_id":"Equity","wrong":false,"starred":true,"q":"Aaron Mechanic, CFA, is responsible for valuing the shares of Duotronics Research Laboratories (DRL). The stock is currently trading at €8.75, and Mechanic gathers the following financial information about the company:<ul><li>Expected return on equity (ROE) = 16% annually for each of the next four years.</li><li>Current book value (BV) of equity = €435,000,000.</li><li>Shares outstanding: 60 million.</li><li>Required rate of return on equity = 12%.</li><li>No dividends paid.</li><li>All earnings are reinvested.</li><li>Continuing residual income = 0 after four years.</li></ul>Mechanic is considering revising his expectation of the continuing residual income\nafter the 4-year horizon period and believes that it will remain constant at the Year 4\nforecast level of residual income for the foreseeable future. Based on the residual\nincome model, the intrinsic value and the most likely recommendation Mechanic\nwould issue for the stock of DRL are:","o":["A. Intrinsic value: €8.75; Recommendation: Buy.","B. Intrinsic value: €10.73; Recommendation: Buy.","C. Intrinsic value: €10.73; Recommendation: Sell."],"a":"B","e":"We now modify the previous problem and assume that residual income remains constant at €0.45 after the initial forecast period, so ω = 1. The continuing value at the end of Year 3 is: \\[ \\text{CV}_3 = \\frac{\\text{RI}_4}{1 + r - \\omega} = \\frac{\\text{€}0.45}{1 + 0.12 - 1} = \\text{€}3.75 \\] \\[ V_0 = \\text{€}7.25 + \\frac{\\text{€}0.29}{1.12} + \\frac{\\text{€}0.34}{1.12^2} + \\frac{\\text{€}0.39 + \\text{€}3.75}{1.12^3} = \\text{€}10.73 \\] In this case, the value of the shares exceeds the current price of €8.75, and the analyst should consider issuing a buy recommendation.","los":"LOS 21.c","open":false,"p":null,"passageBlocks":null},{"key":"21.5_87","subject":"Equity","subject_id":"Equity","wrong":true,"starred":true,"q":"Kim Dae-Eun, CFA, values Zues Printing Company at $46 per share with a residual\nincome model using historical data to estimate return on equity and book value as\nreported on the balance sheet. Subsequently, he determines that Zues uses the\ncurrent rate method of foreign currency translation and has, for the past ten years,\nconsistently reported foreign currency translation gains as part of comprehensive\nincome. He expects these foreign currency gains will continue in the future. What will\nbe the effect on his forecasts of return on equity (ROE), book value, and intrinsic value\nif he revises his valuation estimate to take this new information into account?","o":["A. ROE: Increase; Book value: Increase; Intrinsic value: Increase.","B. ROE: Increase; Book value: No effect; Intrinsic value: Increase.","C. ROE: No effect; Book value: Increase; Intrinsic value: Increase."],"a":"B","e":"The foreign currency translation gains were recorded directly to equity as part of\ncomprehensive income and were not reflected in income, so his ROE forecast was\nunderstated. If he expects these gains to continue, he should revise his forecast\nupward of ROE. Book value was not affected, however, because the gains were\nrecorded to equity. Correcting the valuation to reflect these changes would cause\nhis ROE estimate to increase, the book value per share to stay the same, and the\nintrinsic value from the residual income model to increase.","los":"LOS 21.k","open":false,"p":null,"passageBlocks":null},{"key":"22.1_91","subject":"Equity","subject_id":"Equity","wrong":false,"starred":true,"q":"Suppose that we are provided the following figures for a medical diagnostic and consumer health care technology. (Assume that the earnings and expenses are normalized, and that capital expenditures will equal depreciation plus 4% of the firm’s incremental revenues.)<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><tbody><tr><td style=\"padding:3px 12px\">Current revenues</td><td style=\"text-align:right;padding:3px 12px\">$10,000,000</td></tr><tr><td style=\"padding:3px 12px\">Revenue growth</td><td style=\"text-align:right;padding:3px 12px\">5%</td></tr><tr><td style=\"padding:3px 12px\">Gross profit margin</td><td style=\"text-align:right;padding:3px 12px\">20%</td></tr><tr><td style=\"padding:3px 12px\">Depreciation expense as a percentage of sales</td><td style=\"text-align:right;padding:3px 12px\">1%</td></tr><tr><td style=\"padding:3px 12px\">Working capital as a percentage of sales</td><td style=\"text-align:right;padding:3px 12px\">12%</td></tr><tr><td style=\"padding:3px 12px\">SG&A expenses</td><td style=\"text-align:right;padding:3px 12px\">$1,600,000</td></tr><tr><td style=\"padding:3px 12px\">Tax rate</td><td style=\"text-align:right;padding:3px 12px\">40%</td></tr></tbody></table></div>Based on a pro forma income statement, forecasted FCFF for the next year is closest to:","o":["A. $157,000.","B. $277,000.","C. $407,000."],"a":"A","e":"The forecasted pro forma income statement and FCFF are calculated as follows:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p style=\"font-weight:bold;margin:0 0 0.5em\">Pro Forma Income Statement</p><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><tbody><tr><td style=\"padding:3px 12px\">Revenues</td><td style=\"text-align:right;padding:3px 12px\">$10,500,000</td></tr><tr><td style=\"padding:3px 12px\">Cost of goods sold</td><td style=\"text-align:right;padding:3px 12px\">$8,400,000</td></tr><tr><td style=\"padding:3px 12px\">Gross profit</td><td style=\"text-align:right;padding:3px 12px\">$2,100,000</td></tr><tr><td style=\"padding:3px 12px\">SG&A expenses</td><td style=\"text-align:right;padding:3px 12px\">$1,600,000</td></tr><tr><td style=\"padding:3px 12px\">Pro forma EBITDA</td><td style=\"text-align:right;padding:3px 12px\">$500,000</td></tr><tr><td style=\"padding:3px 12px\">Depreciation and amortization</td><td style=\"text-align:right;padding:3px 12px\">$105,000</td></tr><tr><td style=\"padding:3px 12px\">Pro forma EBIT</td><td style=\"text-align:right;padding:3px 12px\">$395,000</td></tr><tr><td style=\"padding:3px 12px\">Pro forma taxes on EBIT</td><td style=\"text-align:right;padding:3px 12px\">$158,000</td></tr><tr><td style=\"padding:3px 12px\">Operating income after tax</td><td style=\"text-align:right;padding:3px 12px\">$237,000</td></tr></tbody></table></div><div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p style=\"font-weight:bold;margin:0 0 0.5em\">Adjustments to obtain FCFF</p><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><tbody><tr><td style=\"padding:3px 12px\">Plus: depreciation and amortization</td><td style=\"text-align:right;padding:3px 12px\">$105,000</td></tr><tr><td style=\"padding:3px 12px\">Minus: capital expenditures</td><td style=\"text-align:right;padding:3px 12px\">$125,000</td></tr><tr><td style=\"padding:3px 12px\">Minus: increase in working capital</td><td style=\"text-align:right;padding:3px 12px\">$60,000</td></tr><tr><td style=\"padding:3px 12px\">FCFF</td><td style=\"text-align:right;padding:3px 12px\">$157,000</td></tr></tbody></table></div>Revenues grow 5% to $10,500,000; cost of goods sold is 80% of revenues (20% gross margin); EBITDA equals gross profit less SG&A; depreciation and amortization is 1% of sales ($105,000); taxes are 40% of EBIT. Capital expenditures = depreciation + 4% of incremental revenues = $105,000 + 0.04 × ($10,500,000 − $10,000,000) = $125,000. Increase in working capital = 12% × $500,000 = $60,000. Therefore, FCFF = $237,000 + $105,000 − $125,000 − $60,000 = $157,000.","los":"LOS 22.c","open":false,"p":null,"passageBlocks":null},{"key":"22.2_95","subject":"Equity","subject_id":"Equity","wrong":true,"starred":true,"q":"Suppose that we are considering the acquisition of a small private firm with a high\ndegree of firm-specific risk, where the firm is dissimilar to public firms. The\nappropriate WACC to use is closest to:","o":["A. 12.1%.","B. 14.5%.","C. 16.8%."],"a":"C","e":"The build-up method is appropriate when there are no comparable public firms\nwith which to estimate beta. Because the firm is small with a high degree of firm-\nspecific risk, risk premiums will be used for these. An industry risk premium is\nused in the build-up method, but not beta.\nBecause the firm is being acquired, we assume the new owners will use an\noptimal capital structure and weights in the WACC calculation. The capital\nstructure for public firms should not be used because public firms typically have\nbetter access to debt financing.\nThe resulting calculations are as follows.\nUsing the build-up method, the risk-free rate, the equity risk premium, the small\nstock premium, a company-specific risk premium, and an industry risk premium\nare added together: \\[ \\text{required return on equity} = 4.8\\% + 5.5\\% + 3.8\\% + 2.5\\% + 2.0\\% = 18.6\\% \\]\nThe WACC using the optimal capital structure factors in the debt to total cap, the\ncost of debt, the tax rate, and the given cost of equity: \\[ \\text{WACC} = (w_e r_e) + [w_d r_d (1 - \\text{tax rate})] = (0.85 \\times 18.6\\%) + [0.15 \\times 10\\% \\times (1 - 35\\%)] = 16.8\\% \\]","los":"LOS 22.e","open":false,"p":"Equity::22.2-privatefirm","passageBlocks":null},{"key":"22.3_99","subject":"Equity","subject_id":"Equity","wrong":false,"starred":true,"q":"Suppose that the following financial figures relate to a small firm with significant intangible assets:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><tbody><tr><td style=\"padding:3px 12px\">Working capital</td><td style=\"text-align:right;padding:3px 12px\">$400,000</td></tr><tr><td style=\"padding:3px 12px\">Fixed assets</td><td style=\"text-align:right;padding:3px 12px\">$1,800,000</td></tr><tr><td style=\"padding:3px 12px\">Normalized earnings</td><td style=\"text-align:right;padding:3px 12px\">$235,000</td></tr><tr><td style=\"padding:3px 12px\">Required return for working capital</td><td style=\"text-align:right;padding:3px 12px\">4%</td></tr><tr><td style=\"padding:3px 12px\">Required return for fixed assets</td><td style=\"text-align:right;padding:3px 12px\">12%</td></tr><tr><td style=\"padding:3px 12px\">Growth rate of residual income</td><td style=\"text-align:right;padding:3px 12px\">3%</td></tr><tr><td style=\"padding:3px 12px\">Discount rate for intangible assets</td><td style=\"text-align:right;padding:3px 12px\">16%</td></tr></tbody></table></div>The value of the firm using the excess earnings method (EEM) is closest to:","o":["A. $1,823,800.","B. $2,223,000.","C. $2,223,800."],"a":"C","e":"The value of the firm can be calculated using the following steps:\nStep 1: Calculate the required return for working capital and fixed assets.\nGiven the required returns as a percentage, the monetary returns are as\nfollows:\nworking capital = $400,000 × 4% = $16,000\nfixed assets = $1,800,000 × 12% = $216,000\nStep 2: Calculate the residual income.\nAfter the monetary returns to assets are calculated, the residual income is\nthat which is left over in the normalized earnings:\nresidual income = $235,000 − $16,000 − $216,000 = $3,000\nStep 3: Value the intangible assets.\nUsing the formula for a growing perpetuity, the discount rate for\nintangible assets, and the growth rate for residual income, this is the value:\nvalue of intangible assets = ($3,000 × 1.03) / (0.16 − 0.03) = $23,769\nStep 4: Sum the asset values to arrive at the total firm value.\nThe firm value = $400,000 + $1,800,000 + $23,769 = $2,223,769.","los":"LOS 22.h","open":false,"p":null,"passageBlocks":null},{"key":"341_5","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":true,"q":"Zeon Corp’s 10-year bonds are currently yielding 7.50%. The real rate is 3% and expected inflation is 2%. Which of the following is most accurate? Credit spread on Zeon bonds is:","o":["A. equal to 2.50%.","B. less than 2.50%.","C. greater than 2.50%."],"a":"B","e":"Yield on risky corporate debt = real risk-free rate + expected inflation + risk premium for inflation uncertainty + credit spread. 2.50% = risk premium for inflation uncertainty + credit spread. Given that the bond is long term, the risk premium for inflation uncertainty must be positive and credit spread must be less than 2.50%","los":"(LOS 34.f)","open":false,"p":null,"passageBlocks":null},{"key":"342_10","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":false,"q":"Relative to other asset classes, investors in commercial real estate are least likely to require a risk premium for:","o":["A. uncertainty in inflation.","B. illiquidity.","C. uncertainty in terminal value."],"a":"A","e":"Two risk premiums that are unique to real estate as an asset class are the risk premium for illiquidity and the risk premium for uncertainty in terminal value (similar to the equity risk premium)","los":"(LOS 34.k)","open":false,"p":null,"passageBlocks":null},{"key":"353_13","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":false,"q":"Investors that are constrained by regulation or investment policy may find that some of the important variables identified by the fundamental law of active portfolio management are out of their control. The element that is most likely to still be within the investor’s control is the:","o":["A. information coefficient.","B. transfer coefficient.","C. benchmark tracking risk."],"a":"A","e":"The information coefficient represents an active manager’s own skill and ability to forecast returns accurately. The other three of the four elements of the fundamental law of active portfolio management (transfer coefficient, breadth of the strategy, and benchmark tracking risk) may be beyond investors’ control if they are constrained by investment policy or regulation","los":"(LOS 35.c)","open":false,"p":null,"passageBlocks":null},{"key":"361_19","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":false,"q":"The authorized participants (APs) in an ETF are most likely to be required to settle their ETF trades in:","o":["A. one day.","B. two days.","C. six days."],"a":"C","e":"APs are typically given 6 days to complete settlement, reflecting the amount of time needed for creation/redemption","los":"(LOS 36.b)","open":false,"p":null,"passageBlocks":null},{"key":"363_28","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":false,"q":"Active ETF strategies are most likely to be used:","o":["A. for fixed income rather than for equity.","B. for tactical trading.","C. to reduce the tracking risk."],"a":"A","e":"Due to the low liquidity of most fixed-income securities, active fixed-income ETFs are more popular than active equity ETFs. Generally, active ETFs are suitable for long-term buy-and-hold investors. Because active strategies seek to beat the benchmark, tracking risk is expected to be higher than for passive ETFs","los":"(LOS 36.h)","open":false,"p":null,"passageBlocks":null},{"key":"373_36","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":true,"q":"Factor Investment Services, LLC manages a tracking portfolio that claims to outperform the S&P 500. The active factor risk and active specific risk for the tracking portfolio are most likely to be described as:","o":["A. high active factor risk and high active specific risk.","B. high active factor risk and low active specific risk.","C. low active factor risk and high active specific risk."],"a":"C","e":"A tracking portfolio is deliberately constructed to have the same set of factor exposures to match (track) a predetermined benchmark. The strategy involved in constructing a tracking portfolio is usually an active bet on asset selection (the manager claims to beat the S&P 500). The manager constructs the portfolio to have the same factor exposures as the benchmark, but then selects superior securities (subject to the factor sensitivities constraint), thus outperforming the benchmark without taking on more systematic risk than the benchmark. Therefore, a tracking portfolio, with active asset selection but with factor sensitivities that match those of the benchmark, will have little or no active factor risk, but will have high active specific risk","los":"(LOS 37.e)","open":false,"p":null,"passageBlocks":null},{"key":"392_49","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":true,"q":"Considering the various factors (or assets) to be combined in an investment portfolio, the “risk parity” portfolio construction technique is least likely to take into account each factor’s (or asset’s):","o":["A. volatility.","B. correlations.","C. liquidity."],"a":"C","e":"Risk parity is a technique for portfolio construction that takes into account (1) the volatility of each factor (or asset), and (2) the correlations of returns between the factors (or assets) to be combined. The idea of risk parity is that each factor (or asset) should contribute an equal amount of risk to the portfolio (hence, “parity”)","los":"(LOS 39.b)","open":false,"p":null,"passageBlocks":null},{"key":"392_51","subject":"Portfolio Mgmt","subject_id":"PortfolioManagement","wrong":true,"starred":false,"q":"In the rolling window backtesting methodology, researchers are least likely to:","o":["A. use a walk-forward framework.","B. calibrate trade signals based on the rolling window.","C. identify data, attributes, and priorities."],"a":"C","e":"In the rolling window backtesting methodology, researchers use a walk-forward (also called rolling window) framework, fit/calibrate factors or trade signals based on the rolling window, periodically rebalance the portfolio, and then track performance over time. Rolling window backtesting is considered to be a proxy for actual investing","los":"(LOS 39.b)","open":false,"p":null,"passageBlocks":null},{"key":"51_0","subject":"Economics","subject_id":"Economics","wrong":true,"starred":true,"q":"All of the following factors are likely to contribute to an increase in USD/EUR dealer spread except:","o":["A. increase in the volatility of EUR/USD spot rate.","B. increase in the EUR/USD spread in the interbank market.","C. smaller order size."],"a":"C","e":"Dealer spreads are lower for smaller orders as compared to larger orders. Dealer spreads are larger when spreads in the interbank market are higher. An increase in spot rate volatility will increase spreads in the interbank market","los":"(LOS 5.a)","open":false,"p":null,"passageBlocks":null},{"key":"52_4","subject":"Economics","subject_id":"Economics","wrong":true,"starred":true,"q":"For uncovered interest rate parity to hold, which condition is necessary?","o":["A. Forward rate parity holds.","B. Covered interest rate parity holds and ex-ante relative PPP holds.","C. Real interest rate parity and ex-ante relative PPP holds."],"a":"A","e":"Covered interest parity is forced by arbitrage, which is not the case for uncovered interest rate parity. If the forward rate is equal to the expected future spot rate, we say that the forward rate is an unbiased predictor of the future spot rate: F = E(S1). In this special case, given that covered interest parity holds, uncovered interest parity would also hold (and vice versa). In other words, if uncovered interest rate parity (and covered interest parity) holds, the forward rate is unbiased predictor of future spot rate (i.e., forward rate parity holds)","los":"(LOS 5.e)","open":false,"p":null,"passageBlocks":null},{"key":"612_20","subject":"Economics","subject_id":"Economics","wrong":true,"starred":false,"q":"Which of the following actions by Minikaz’s government is most likely to increase Minikaz’s economic growth rate?","o":["A. Increasing protection for consumers through regulations.","B. Allowing foreign financial institutions to enter the market.","C. Expanding public domain legislation."],"a":"B","e":"Financial intermediary development helps foster economic growth by allowing more efficient allocation of capital and risk","los":"(Module 6.1, LOS 6.a)","open":false,"p":"Economics::6.1, 6.2-passage","passageBlocks":null},{"key":"612_24","subject":"Economics","subject_id":"Economics","wrong":true,"starred":false,"q":"Smith’s conclusion about Minikaz’s relatively lower GDP growth is most likely:","o":["A. correct.","B. correct because in some cases, natural resources may inhibit economic growth.","C. incorrect because access to natural resources is more important than ownership."],"a":"C","e":"Empirical evidence has shown that for economic growth, access to natural resources is more important than ownership. Natural resources may inhibit growth if countries that own them do not develop other industries. However, that is not the conclusion Smith reaches","los":"(Module 6.2, LOS 6.f)","open":false,"p":"Economics::6.1, 6.2-passage","passageBlocks":null},{"key":"132_6","subject":"Corporate Issuers","subject_id":"CorporateIssuers","wrong":true,"starred":true,"q":"Nick Adams is recommending to the board of directors that they share the profits from an excellent year (totaling $56 million) with shareholders by either declaring a special cash dividend of $20 million, or using the $20 million to repurchase shares of Volksberger common stock in the open market. Selected financial information about the firm is shown in the following:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\"></th><th style=\"text-align:center;padding:4px 12px\"></th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">Shares outstanding:</td><td style=\"text-align:center;padding:4px 12px\">40 million</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Current stock price:</td><td style=\"text-align:center;padding:4px 12px\">$28.00</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">52-week trading range:</td><td style=\"text-align:center;padding:4px 12px\">$20.00 to $36.00</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">Book value of equity:</td><td style=\"text-align:center;padding:4px 12px\">$880 million</td></tr>\n<tr><td style=\"text-align:left;padding:4px 12px\">After-tax cost of borrowing:</td><td style=\"text-align:center;padding:4px 12px\">5.5%</td></tr></tbody></table></div>Adams drafts a memo to the board of directors detailing the financial impact of declaring a special cash dividend versus repurchasing shares. His memo includes the following two statements:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><p><strong>Statement 1:</strong> The total shareholder wealth resulting from owning one share of stock with the special dividend option will increase to $28.50.</p><p><strong>Statement 2:</strong> Our company's P/E ratio after the share buyback will remain the same as before the buyback.</p></div>Which of Adams’s statements are correct?","o":["A. Both statements are correct.","B. Only one of the statements is correct.","C. Neither statement is correct."],"a":"C","e":"Adams is incorrect with respect to Statement 1. If the firm pays its special dividend of $20 million, both the assets and equity of the firm will drop by $20 million. The total wealth from owning one share will be [(40 million)($28) − $20 million] / 40 million = $27.50, plus $20 million / 40 million = $0.50 per share as a dividend, so the total shareholder wealth resulting from owning one share of stock is $28. Note that the total shareholder wealth of $28 is the same whether the cash dividend or share repurchase option is chosen. Adams is also incorrect with respect to Statement 2. The current EPS is $56 million / 40 million = $1.40, so the current P/E ratio is $28 / $1.40 = 20 times earnings. The price per share will remain the same. Share buyback = $20 million / 28 = 714,286 shares. New price = [(40 million × $28/share) − $20 million] / (40 million − 714,286) = $28/share. EPS will increase. $56 million / 39,285,714 = $1.43. Since the price is the same, and EPS increases, the P/E ratio will fall slightly after the repurchase","los":"(LOS 13.j)","open":false,"p":null,"passageBlocks":null},{"key":"1512_15","subject":"Corporate Issuers","subject_id":"CorporateIssuers","wrong":true,"starred":false,"q":"Which statements made by Hsei regarding the equity risk premium are correct?","o":["A. Statement 1 only.","B. Statement 2 only.","C. Neither statement is correct."],"a":"B","e":"Statement 1 is incorrect. Arithmetic mean is a good estimate of a one-period expected return, but does a poor job of estimating multiperiod return (which determines expected terminal wealth). A geometric mean gives lower weight to outliers and estimates the expected terminal wealth more accurately. Statement 2 is correct. A weakness of the historical approach (and not forward- looking estimates) is the assumption that the mean and variance of the returns are constant over time (i.e., the ERP time series is stationary). Historical estimates (not forward-looking estimates) may suffer from survivorship bias","los":"(Module 15.2, LOS 15.c)","open":false,"p":"CorporateIssuers::15.1, 15.2-passage","passageBlocks":null},{"key":"1512_16","subject":"Corporate Issuers","subject_id":"CorporateIssuers","wrong":false,"starred":true,"q":"Using information in Exhibit 4, the estimate of equity risk premium (ERP) consistent with the Grinold-Kroner model is closest to:","o":["A. 2.44%.","B. 3.44%.","C. 3.66%."],"a":"C","e":"Expected inflation = (1+ nominal yieldTreasury) / (1 + yieldTIPS) – 1 = (1.0267 / 1.0033) – 1 = 2.33%. ERP = [DY + ΔP/E + i + G – ΔS] – E(rf) = [1.10% – 0.10% + 2.33% + 3% – 0] – 2.67% = 3.66% Note: If a risk-free rate is separately provided, use that. In this case, we are given 10-year nominal Treasury yield, which in the absence of any other guidance is used as the risk-free rate","los":"(Module 15.2, LOS 15.e)","open":false,"p":"CorporateIssuers::15.1, 15.2-passage","passageBlocks":null},{"key":"163_25","subject":"Corporate Issuers","subject_id":"CorporateIssuers","wrong":false,"starred":true,"q":"The consolidated EPS of Fastnar in the first year after acquisition is closest to:","o":["A. €2.33.","B. €2.87.","C. €3.07."],"a":"C","e":"Consolidated net income before adjustments: 2,553 + 313 = 2,866Adjustments: Adjusted consolidated net income: 2,866 + 203 = 3,069Adjusted EPS = 3,069 / 1,000 = €3.07","los":"(LOS 16.e)","open":false,"p":"CorporateIssuers::16.3-passage","passageBlocks":null},{"key":"14_15","subject":"Quants","subject_id":"Quants","wrong":false,"starred":true,"q":"Regarding Ohlmer’s statements about qualitative dependent variables:","o":["A. only Statement 1 is correct.","B. only Statement 2 is correct.","C. both statements are incorrect."],"a":"C","e":"Both statements are incorrect. To evaluate nested models, a likelihood ratio (LR) test is used for logistic regressions. The LR test statistic has a chi-square distribution, not an F distribution. The slope coefficients in a logit model are interpreted as the change in the log odds of the event occurring per 1-unit change in the independent variable, holding all other independent variables constant","los":"(Module 1.4, LOS 1.m)","open":false,"p":"Quants::1.4-passage","passageBlocks":[0,4,5,6]},{"key":"21_21","subject":"Quants","subject_id":"Quants","wrong":true,"starred":false,"q":"An analyst has determined that monthly sport utility vehicle (SUV) sales in the United States have been increasing over the last 10 years, but the growth rate over that period has been relatively constant. Which model is most appropriate to predict future SUV sales?","o":["A. SUVsalest = b0 + b1(t) + et.","B. lnSUVsalest = b0 + b1(t) + et.","C. lnSUVsalest = b0 + b1(SUVsalest−1) + et."],"a":"B","e":"A log-linear model (choice B) is most appropriate for a time series that grows at a relatively constant growth rate. Neither a linear trend model (choice A), nor an AR(1) model (choice C) are appropriate in this case","los":"(LOS 2.b)","open":false,"p":null,"passageBlocks":null},{"key":"24_30","subject":"Quants","subject_id":"Quants","wrong":false,"starred":true,"q":"The number of observations in the time series used to estimate the model represented in the table is closest to:","o":["A. 16.","B. 50.","C. 250."],"a":"C","e":"The standard error of the estimated autocorrelations is  , where T is the number of observations (periods). So, if the standard error is given as 0.0632, the number of observations, T, in the time series must be (1 / 0.0632)2 ≈ 250","los":"(Module 2.2, LOS 2.e)","open":false,"p":"Quants::2.4-passage","passageBlocks":null},{"key":"25_36","subject":"Quants","subject_id":"Quants","wrong":true,"starred":false,"q":"Which of the following is true of modeling a time series that contains two or more distinct periods where the data is fundamentally different?","o":["A. The optimal data sample period for estimating the time-series model can be calculated mathematically.","B. To most accurately estimate the time-series model, the entire available time series data set should be used as the sample period.","C. We have to fit two different models for each of the two distinct periods."],"a":"C","e":"To accurately model a time series that contains shifts, it may be necessary to strategically choose a longer or shorter sample period, or to use a first- or second- order autoregressive model. There is no accepted formula for estimating the optimal sample period (though a graphical inspection of the data may be helpful)","los":"(LOS 2.o)","open":false,"p":null,"passageBlocks":null},{"key":"32_46","subject":"Quants","subject_id":"Quants","wrong":true,"starred":false,"q":"An algorithm to assign a bond to a credit rating category is least likely to use:","o":["A. clustering.","B. classification and regression tree (CART).","C. K-nearest neighbor (KNN)."],"a":"A","e":"CART and KNN are supervised learning algorithms used for classification. Clustering is an unsupervised learning algorithm (i.e., it does not use labeled training data for ratings such as AAA, AA, etc.) for grouping similar observations","los":"(LOS 3.c)","open":false,"p":null,"passageBlocks":null},{"key":"33_49","subject":"Quants","subject_id":"Quants","wrong":true,"starred":false,"q":"Which of the following is least likely to be described as a black-box approach to machine learning (ML)?","o":["A. Principal component analysis (PCA).","B. Classification trees.","C. Random forests."],"a":"B","e":"Classification trees are popular because they provide a visual explanation of the predictive process. Random forests and PCA do not provide clear guidance about the features used to classify observations (random forests) or what the principal components represent, resulting in the black-box descriptor for both algorithms. (LOS 3.c, 3.d)","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"41_53","subject":"Quants","subject_id":"Quants","wrong":true,"starred":false,"q":"The process of adjusting variable values so that they fall between 0 and 1 is most commonly referred to as:","o":["A. scaling.","B. standardization.","C. normalization."],"a":"C","e":"Normalization scales variable values between 0 and 1","los":"(LOS 4.b)","open":false,"p":null,"passageBlocks":null},{"key":"43_59","subject":"Quants","subject_id":"Quants","wrong":true,"starred":true,"q":"The model’s recall is closest to:","o":["A. 0.67.","B. 0.72.","C. 0.86."],"a":"C","e":"Recall (R) = TP / (TP + FN) = 12 / 14 = 0.86","los":"(LOS 4.c)","open":false,"p":"Quants::4.3-passage","passageBlocks":null},{"key":"301_1","subject":"Alternative Investments","subject_id":"AlternativeInvestments","wrong":true,"starred":true,"q":"For which of the following commodities is the production and consumption cycle least affected by seasonality?","o":["A. Hogs.","B. Coffee.","C. Natural gas."],"a":"B","e":"Coffee has a long production cycle but is grown at warm latitudes and harvested throughout the year. Livestock production is strongly influenced by seasonality. Natural gas demand has a seasonal component due to its uses for heating and electricity generation for cooling","los":"(LOS 30.b)","open":false,"p":null,"passageBlocks":null},{"key":"301_3","subject":"Alternative Investments","subject_id":"AlternativeInvestments","wrong":true,"starred":true,"q":"A commodity is most likely to be physically stored by a(n):","o":["A. exchange.","B. speculator.","C. arbitrageur."],"a":"C","e":"Arbitrageurs may store a physical inventory of a commodity to exploit differences between spot and futures prices relative to the costs of storing the commodity","los":"(LOS 30.d)","open":false,"p":null,"passageBlocks":null},{"key":"313_18","subject":"Alternative Investments","subject_id":"AlternativeInvestments","wrong":true,"starred":false,"q":"Which of the following statements about the NCREIF Property Index (NPI) is least accurate? The NPI:","o":["A. is computed using recent sales transactions.","B. is value weighted.","C. allows investors to compare real estate performance with that of other asset classes."],"a":"A","e":"The NPI uses a value-weighted return that is calculated using appraisal data. The index allows comparison of the performance of the real estate asset class with that of other asset classes","los":"(LOS 31.e)","open":false,"p":null,"passageBlocks":null},{"key":"4011_1","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Karen Jones, CFA, is an outside director for Valley Manufacturing. At a director’s meeting, Jones finds out that Valley Corp. has made several contributions to foreign politicians that she suspects were illegal. Jones checks with her firm’s legal counsel and determines that the contributions were indeed illegal. At the next board meeting, Jones urges the board to disclose the contributions. The board, however, votes not to make a disclosure. Jones’ most appropriate action would be to:","o":["A. protest the board’s actions in writing to the executive officer of Valley.","B. resign from the board and seek legal counsel as to her legal disclosure requirements.","C. inform her supervisor of her discovery and cease attending meetings until the matter is resolved."],"a":"B","e":"According to Standard I(A), since she has taken steps to stop the illegal activities and the board has ignored her, Jones must dissociate from the board and seek legal advice as to what other actions would be appropriate in this instance. She may need to inform legal or regulatory authorities of the illegal activities. (Module 41.1, LOS 41: I(A))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"412_6","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"In which of the following has the analyst least likely committed plagiarism?","o":["A. Julie Long takes performance projections and charts from a company she is researching, combines them with her own analysis, and publishes them under her own name.","B. Bill Cooper finds a statistical table in the Federal Reserve Bulletin that supports the work he has done in his industry analysis and has his secretary include the table as part of his report without citing the source.","C. Jan Niedfeldt gets a call from one of her fellow analysts stating that the analyst’s research shows that XYZ Company is a buy. Niedfeldt calls up her major clients and tells them that her research shows XYZ is a buy."],"a":"B","e":"According to Standard I(C), Misrepresentation, factual data from a recognized statistical reporting service need not be cited. (LOS 41: I(C))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"412_9","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Josef Karloff, CFA, acts as liaison between Pinnacle Financial (an investment management firm) and Summit Inc. (an investment banking boutique specializing in penny stocks). When Summit underwrites an IPO, Karloff routinely has Pinnacle issue vague statements implying that the firm has cash flows, financial resources, and growth prospects that are better than is the case in reality. This action is a violation of the section of the Standards concerning:","o":["A. fair dealing.","B. nonpublic information.","C. misconduct."],"a":"C","e":"Since the statements are vague, we have no direct evidence that a violation of securities law has occurred. However, under Standard I(D), Misconduct, members and candidates are prohibited from engaging in activities involving deceit. Karloff’s action is a clear attempt to mislead the investing public regarding the value of Summit IPOs. (LOS 41: I(D))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"413_15","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Julia Green, CFA, has friends from her previous employer who have suggested that she receive information from them via an internet chat room. In this way, she receives news about an exciting new product being developed by a firm in Singapore that has the potential to double the firm’s revenue. The firm has not revealed any information regarding the product to the public. According to the Code and Standards, this information is:","o":["A. both material and nonpublic and Green may not trade on it in Singapore, but may trade on it elsewhere.","B. both material and nonpublic and Green may not trade on it in any jurisdiction.","C. public by virtue of its release in the chat room and Green may trade on it."],"a":"B","e":"The release of such information to a limited circle via an internet chat room does not cause the information to be public. The information is also clearly material. Therefore, Green is not allowed to trade on the information under Standard II(A). (LOS 41: II(A))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"416_21","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"In a marketing brochure, DNR Asset Managers presents the performance of several composite portfolios managed according to similar investment strategies. In constructing composites, the firm excludes individual portfolios with less than $1 million in assets, excludes terminated portfolios, and includes simulated results. DNR includes the following disclosure in the brochure: “Past performance is no guarantee of future results. Composites exclude portfolios under $1 million in assets and include results from simulated model portfolios with similar strategies.” DNR’s brochure:","o":["A. does not violate the Code and Standards.","B. violates the Code and Standards by failing to include terminated portfolios in the performance presentation.","C. violates the Code and Standards by excluding portfolios under $1 million from the composite performance presentation."],"a":"B","e":"By failing to include terminated portfolios in the performance presentation, the performance will have an inherent upward bias, making results appear better than they truly are. By excluding the terminated portfolios, DNR misleads its potential investors and thus violates Standard III(D), Performance Presentation, which prohibits any “practice that would lead to misrepresentation of a member or candidate’s performance record.” (LOS 41: III(D))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"416_23","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Which of the following is least likely one of the recommendations included in the Standards of Practice Handbook with regard to performance presentation?","o":["A. Include terminated accounts in past performance history.","B. Present the performance of a representative account to show how a composite has performed.","C. Consider the level of financial knowledge of the audience to whom the performance is presented."],"a":"B","e":"The recommended procedure in Standard III(D), Performance Presentation, is to present the performance of a composite as a weighted average of the performance of similar portfolios rather than using a single representative account. (LOS 41: III(D))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"417_24","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Connie Fletcher, CFA, works for a small money management firm that specializes in pension accounts. Recently, a friend asked her to act as an unpaid volunteer manager for the city’s street sweep pension fund. As part of the position, the city would grant Fletcher a free parking space in front of her downtown office. Fletcher is considering the offer. Fletcher is most likely required by CFA Institute Standards to:","o":["A. decline the offer because it might create a conflict of interest with her employer’s interest.","B. inform her current clients in writing and discuss the offer with her employer before accepting the offer.","C. obtain written permission from her employer before accepting the offer."],"a":"C","e":"According to Standard IV(A), Loyalty, members and candidates are expected to act for the benefit of the employer and not deprive the employer of their skills. Fletcher is performing work similar to the services that her employer provides for a fee. Although the position is a volunteer position, Fletcher will receive compensation in the form of a free parking space. In light of the circumstances, Fletcher must disclose the details of the position and get written permission from her employer before accepting the volunteer position. (LOS 41: IV(A))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"417_25","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Which of the following statements about a supervisor’s responsibilities is most accurate?","o":["A. If her employer has an inadequate compliance system, a member or candidate should refuse to accept supervisory responsibility until the firm develops plans to adopt reasonable procedures in the future.","B. In the event of misconduct by an employee that they oversee, a member or candidate can fulfill their supervisory responsibilities by reporting the misconduct up the chain of command and warning the employee to cease the activity.","C. Members and candidates with oversight responsibilities for large numbers of employees may delegate supervisory duties to subordinates who directly oversee these employees."],"a":"C","e":"Members and candidates with oversight responsibilities for large numbers of employees may not be able to personally evaluate the conduct of these employees on a continuing basis, and thus they may delegate supervisory duties to subordinates who directly oversee the other employees. A member or candidate faced with no compliance procedures or with procedures she believes are inadequate must decline supervisory responsibility in writing until adequate procedures are adopted by the firm. According to Standard IV(C), Responsibilities of Supervisors, reporting the violation and warning the employee to cease activities that violate the law or the Code and Standards are not enough. The supervisor must take steps (such as limiting employee activity or increasing the level of employee monitoring) to prevent further violations while she conducts an investigation. (LOS 41: IV(C))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"417_27","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Ahmed Jamal, CFA, head of research for Valley Brokers, decided it was time to change his recommendation on D&R Company from buy to sell. He orally announced his decision during the Monday staff meeting and said his written report would be finished and disseminated to Valley’s customers by the middle of next week. As a result of this announcement, Doris Smith, one of Jamal’s subordinates, immediately sold her personal shares in D&R, and Martin Temple told his largest institutional customers of the change the following day. Which Standards have most likely been violated?","o":["A. Jamal violated Standard IV(C) Responsibilities of Supervisors; Smith violated Standard II(A) Material Nonpublic Information; and Temple violated Standard VI(B) Priority of Transactions.","B. Jamal violated Standard IV(C) Responsibilities of Supervisors; Smith violated Standard VI(B) Priority of Transactions; and Temple violated Standard III(B) Fair Dealing.","C. Smith violated Standard VI(B) Priority of Transactions, and Temple violated Standard III(B) Fair Dealing."],"a":"B","e":"Jamal failed to properly supervise employees and provide adequate procedures and policies to prevent employee violations. Smith should not have traded her own account ahead of client accounts. Temple should not have disclosed the recommendation change selectively but should have informed his clients fairly and objectively. No inside information was used in the question. (LOS 41: IV(C))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"418_31","subject":"Ethics (Module Quiz)","subject_id":"Ethics","wrong":true,"starred":true,"q":"Eugene Nieder, CFA, has just accepted a new job as a quantitative analyst for Paschal Investments, LLP. Nieder developed a complex model while working for his previous employer and plans to recreate the model for Paschal. Nieder did not make copies of the model or any supporting documents since his employer refused to grant him permission to do so. Nieder will recreate the model from memory. Which of the following statements is most likely correct?","o":["A. Nieder can recreate the model without violating the Code and Standards as long as he also generates supporting documentation.","B. Nieder can recreate the model without violating the Code and Standards without documentation if the model is modified from its original form.","C. Nieder cannot recreate the model without violating the Code and Standards because it is the property of his former employer."],"a":"A","e":"Nieder must not take models or documents from his previous employer without explicit permission to do so, or he would violate Standard IV(A), Loyalty. He is allowed, however, to reproduce the model from memory but must recreate the supporting documentation to maintain compliance with Standard V(C), Record Retention. (LOS 41: V(A))","los":null,"open":false,"p":null,"passageBlocks":null},{"key":"lm1_3","subject":"Ethics (CFAI)","subject_id":"Ethics_cfai","wrong":true,"starred":true,"q":"<b>4.</b> Which of the following statements best describes an aspect of the Standards of Professional Conduct? Members and candidates are required to:","o":["A. ensure a portfolio mandate is suitable for all investors.","B. promptly disclose changes that might materially affect investment processes.","C. have a reasonable and adequate basis for decisions about client confidentiality."],"a":"B","e":"B is correct. The Standards of Professional Conduct require members and candidates to promptly disclose any changes that might materially affect investment processes.<br><br>A is incorrect because under Standard III(C) Suitability, when members and candidates are responsible for managing a portfolio according to a specific mandate, they must take only investment actions that are consistent with the stated objectives of the portfolio and not be concerned with whether the mandate is suitable for all investors.<br><br>C is incorrect because under Standard III(E) Preservation of Confidentiality, members and candidates must keep information about current clients confidential unless the information concerns illegal activities on the part of the client, disclosure is required by law, or the client permits disclosure. No decisions on confidentiality are required, with the “reasonable and adequate basis” criterion related to Standard V(A) Diligence and Reasonable Basis.","los":"LM1 · Practice Problem 4","open":false,"p":null,"passageBlocks":null},{"key":"lm2e_35","subject":"Ethics (CFAI)","subject_id":"Ethics_cfai","wrong":true,"starred":true,"q":"<b>26.</b> One of the discretionary accounts managed by Farnsworth is the Jones Corporation employee profit-sharing plan. Jones, the company president, recently asked Farnsworth to vote the shares in the profit-sharing plan in favor of the slate of directors nominated by Jones Corporation and against the directors sponsored by a dissident stockholder group. Farnsworth does not want to lose this account, because he directs all the account’s trades to a brokerage firm that provides Farnsworth with useful information about tax-free investments. Although this information is not of value in managing the Jones Corporation account, it does help in managing several other accounts. The brokerage firm providing this information also offers the lowest commissions for trades and provides best execution. Farnsworth investigates the director issue, concludes that the management-nominated slate is better for the long-run performance of the company than the dissident group’s slate, and votes accordingly. Farnsworth:","o":["A. violated the Standards in voting the shares in the manner requested by Jones but not in directing trades to the brokerage firm.","B. did not violate the Standards in voting the shares in the manner requested by Jones or in directing trades to the brokerage firm.","C. violated the Standards in directing trades to the brokerage firm but not in voting the shares as requested by Jones."],"a":"B","e":"The correct answer is B. This question relates to Standard III(A) Loyalty, Prudence, and Care—specifically, a member’s or candidate’s responsibility for voting proxies and the use of client brokerage. According to the facts stated in the question, Farnsworth did not violate Standard III(A). Although the company president asked Farnsworth to vote the shares of the Jones Corporation profit-sharing plan a certain way, Farnsworth investigated the issue and concluded, independently, the best way to vote. Therefore, even though his decision coincided with the wishes of the company president, Farnsworth is not in violation of his responsibility to be loyal and to provide care to his clients. In this case, the participants and the beneficiaries of the profit-sharing plan are the clients, not the company’s management. Had Farnsworth not investigated the issue or had he yielded to the president’s wishes and voted for a slate of directors that he had determined was not in the best interest of the company, Farnsworth would have violated his responsibilities to the beneficiaries of the plan. In addition, because the brokerage firm provides the lowest commissions and best execution for securities transactions, Farnsworth has met his obligations to the client in using this brokerage firm. It does not matter that the brokerage firm also provides research information that is not useful for the account generating the commission, because Farnsworth is not paying extra client money for that information.","los":"LM2 · Practice Problem 26","open":false,"p":null,"passageBlocks":null},{"key":"lm2e_38","subject":"Ethics (CFAI)","subject_id":"Ethics_cfai","wrong":true,"starred":true,"q":"<b>29.</b> Stafford is a portfolio manager for a specialized real estate mutual fund. Her firm clearly describes in the fund’s prospectus its soft dollar policies. Stafford decides that entering the CFA Program will enhance her investment decision-making skill and decides to use the fund’s soft dollar account to pay the registration and exam fees for the CFA Program. Which of the following statements is <b>most likely</b> correct?","o":["A. Stafford did not violate the Code and Standards, because the prospectus informed investors of the fund’s soft dollar policies.","B. Stafford violated the Code and Standards because improving her investment skills is not a reasonable use of the soft dollar account.","C. Stafford violated the Code and Standards because the CFA Program does not meet the definition of research allowed to be purchased with brokerage commissions."],"a":"C","e":"Answer C is correct. According to Standard III(A) Loyalty, Prudence, and Care, the CFA Program would be considered a personal or firm expense and should not be paid for with the fund’s brokerage commissions. Soft dollar accounts should be used only to purchase research services that directly assist the investment manager in the investment decision-making process, not to assist the management of the firm or to further education. Thus, answer A is incorrect. Answer B is incorrect because the reasonableness of how the money is used is not an issue; the issue is that educational expense is not research.","los":"LM2 · Practice Problem 29","open":false,"p":null,"passageBlocks":null},{"key":"lm2g_49","subject":"Ethics (CFAI)","subject_id":"Ethics_cfai","wrong":false,"starred":true,"q":"<b>40.</b> Paper was recently terminated as one of a team of five managers of an equity fund. The fund had two value-focused managers and terminated one of them to reduce costs. In a letter sent to prospective employers, Paper presents, with written permission of the firm, the performance history of the fund to demonstrate his past success. Which of the following statements is true?","o":["A. Paper did not violate the Code and Standards.","B. Paper violated the Code and Standards by claiming the performance of the entire fund as his own.","C. Paper violated the Code and Standards by including the historical results of his prior employer."],"a":"B","e":"Answer B is correct. Paper violated Standard III(D) Performance Presentation by not disclosing that he was part of a team of managers that achieved the results shown. If he had also included the return of the portion he directly managed, he would not have violated the standard. Thus, answer A is incorrect. Answer C is incorrect because Paper received written permission from his prior employer to include the results.","los":"LM2 · Practice Problem 40","open":false,"p":null,"passageBlocks":null},{"key":"lm2i_57","subject":"Ethics (CFAI)","subject_id":"Ethics_cfai","wrong":false,"starred":true,"q":"<b>48.</b> Which of the following statements is correct under the Code and Standards?","o":["A. CFA Institute members and candidates are prohibited from undertaking independent practice in competition with their employer.","B. Written consent from the employer is necessary to permit independent practice that could result in compensation or other benefits in competition with a member’s or candidate’s employer.","C. Members and candidates are prohibited from making arrangements or preparations to go into a competitive business before terminating their relationship with their employer."],"a":"B","e":"The correct answer is B. Under Standard IV(A) Loyalty, members and candidates may undertake independent practice that may result in compensation or other benefit in competition with their employer as long as they obtain consent from their employer. Answer C is not consistent with the Standards, because the Standards allow members and candidates to make arrangements or preparations to go into competitive business as long as those arrangements do not interfere with their duty to their current employer. Answer A is not consistent with the Standards, because the Standards do not include a complete prohibition against undertaking independent practice.","los":"LM2 · Practice Problem 48","open":false,"p":null,"passageBlocks":null},{"key":"lm2i_62","subject":"Ethics (CFAI)","subject_id":"Ethics_cfai","wrong":true,"starred":false,"q":"<b>53.</b> Cannan has been working from home on weekends and occasionally saves correspondence with clients and completed work on her home computer. Because of worsening market conditions, Cannan is one of several employees released by her firm. While Cannan is looking for a new job, she uses the files she saved at home to request letters of recommendation from former clients. She also provides to prospective clients some of the reports as examples of her abilities.","o":["A. Cannan violated the Code and Standards because she did not receive permission from her former employer to keep or use the files after her employment ended.","B. Cannan did not violate the Code and Standards, because the files were created and saved on her own time and computer.","C. Cannan violated the Code and Standards because she is prohibited from saving files on her home computer."],"a":"A","e":"Answer A is correct. According to Standard V(C) Record Retention, Cannan needed the permission of her employer to maintain the files at home after her employment ended. Without that permission, she should have deleted the files. All files created as part of a member’s or candidate’s professional activity are the property of the firm, even those created outside normal work hours. Thus, answer B is incorrect. Answer C is incorrect because the Code and Standards do not prohibit using one’s personal computer to complete work for one’s employer.","los":"LM2 · Practice Problem 53","open":false,"p":null,"passageBlocks":null},{"key":"lm2j_63","subject":"Ethics (CFAI)","subject_id":"Ethics_cfai","wrong":true,"starred":true,"q":"<b>54.</b> Jamison is a junior research analyst with Howard &amp; Howard, a brokerage and investment banking firm. Howard &amp; Howard’s mergers and acquisitions department has represented the Britland Company in all its acquisitions for the past 20 years. Two of Howard &amp; Howard’s senior officers are directors of various Britland subsidiaries. Jamison has been asked to write a research report on Britland. What is the best course of action for her to follow?","o":["A. Jamison may write the report but must refrain from expressing any opinions because of the special relationships between the two companies.","B. Jamison should not write the report, because the two Howard &amp; Howard officers serve as directors for subsidiaries of Britland.","C. Jamison may write the report if she discloses the director relationship between the two companies."],"a":"B","e":"The correct answer is B. This question involves Standard VI(A) Avoid or Disclose Conflicts. The question establishes a conflict of interest in which an analyst, Jamison, is asked to write a research report on a company that is a client of her employer. In addition, two directors of the company are senior officers of Jamison’s employer. Best practice would be to avoid the conflicts of interest by not providing a research report on companies that are clients of or have a director relationship with Howard &amp; Howard. If the conflicts are not avoided, both the client relationship and director relationship must be disclosed by Jamison in her research report. Answer C is incorrect because Jamison would be disclosing only one of the conflicts. Answer A is incorrect because whether Jamison expresses any opinions in the report is irrelevant to her duty to disclose all conflicts of interest. Not expressing opinions does not relieve the analyst of the responsibility to disclose the special relationships between the two companies","los":"LM2 · Practice Problem 54","open":false,"p":null,"passageBlocks":null}];
const PASSAGES    = {"FSA::9.56-flexco":{"text":"This information is a continuation of the FlexCo/Vibrant example from the topic review. Suppose it is now the end of 2023 and Vibrant reports the operating results shown in the following table.\n\nThe following exchange rates between the U.S. dollar and the loca were observed:\nDecember 31, 2022: USD/LC 0.4545.\nDecember 31, 2023: USD/LC 0.4000.\nAverage for 2023: USD/LC 0.4292.\nHistorical rate for fixed assets, inventory, and equity: USD/LC 0.5000.\nThe CTA at the end of 2022 was equal to −$37.9 under the current rate method.","image":"FSA::79"},"FSA::9.8-ibm":{"text":"IBM’s 2012 annual report includes the following excerpts:\n\nForeign currency fluctuations often drive operational responses that mitigate the simple mechanical translation of earnings. During periods of sustained movements in currency, the marketplace and competition adjust to the changing rates. For example, when pricing offerings in the marketplace, the company may use some of the advantage from a weakening U.S. dollar to improve its position competitively, and price more aggressively to win the business, essentially passing on a portion of the currency advantage to its customers. Competition will frequently take the same action. Consequently, the company believes that some of the currency based changes in cost impact the prices charged to clients. The company also maintains currency hedging programs for cash management purposes which mitigate, but do not eliminate, the volatility of currency impacts on the company’s financial results. The company translates revenue, cost, and expense in its non-U.S. operations at current exchange rates in the reported period.\n\nReferences to “adjusted for currency” or “constant currency” reflect adjustments based upon a simple constant currency mathematical translation of local currency results using the comparable prior period’s currency conversion rate. However, this constant currency methodology that the company utilizes to disclose this information does not incorporate any operational actions that management may take in reaction to fluctuating currency rates.\n\nBased on the currency rate movements in 2012, total revenue decreased 2.3 percent as reported and was flat at constant currency versus 2011. On a pre-tax income basis, these translation impacts offset by the net impact of hedging activities resulted in a theoretical maximum (assuming no pricing or sourcing actions) decrease of approximately $100 million in 2012. The same mathematical exercise resulted in an increase of approximately $600 million in 2011. The company views these amounts as a theoretical maximum impact to its as-reported financial results. Considering the operational responses mentioned previously, movements of exchange rates, and the nature and timing of hedging instruments, it is difficult to predict future currency impacts on any particular period, but the company believes it could be substantially less than the theoretical maximum given the competitive pressure in the marketplace."},"FSA::11.5-midha-ex1":{"text":"Rana Midha, CFA, works as a freelance equity analyst in the United States. Midha’s main area of expertise is in the analysis of financial statements, and he is currently reviewing the latest annual reports issued by five large companies in the retail sector. Midha’s approach to analyzing the results is to focus first on the quality of the financial reporting. To do this, he uses a conceptual framework that addresses the quality of earnings and whether the information is decision-useful. Midha then orders the companies on a quality spectrum.\n\nExtracts from Midha’s notes on three of the companies under analysis are shown in Exhibit 1.\n\nIn modeling the sustainability of earnings, Midha regresses earnings in the current period against those in the previous period using the following AR(1) model: earnings<sub>t+1</sub> = α + β₁earnings<sub>t</sub> + ε","image":"FSA::139"},"FSA::11.5-jones":{"blocks":[{"type":"text","content":"Hannah Jones, CFA, is currently reviewing the financial statements of three pharmaceutical companies she covers in her role as an equity analyst. Her primary aim is to establish the growth in operating earnings over the last year for each company. Exhibit 1 shows operating earnings for each company in 20X0 and 20X1. While performing her review, Jones makes adjustments to the earnings figures to arrive at her “core earnings growth” figure. The following are adjustments she intends to make:\n\nZZYP has sold two of its patents in the last two years. Both sales were forced by government anti-trust actions. Jones wants to remove the impact of these non-recurring items from operating earnings. The sale boosted operating profit by $8.2 million in 2020 and $1.9 million in 20X1.\n\nAART uses IFRS and in 20X0 capitalized development costs totaling $20.1 million. No similar costs were capitalized in 20X1 but the development project was finished during the year and depreciation of $5.0 million on the previously capitalized costs was charged. Jones believes the costs should be expensed as incurred."},{"type":"html","content":"<p><strong>Exhibit 1: Operating Earnings ($ Millions)</strong></p>\n<table>\n  <thead><tr><th>Company</th><th>20X0 Operating Earnings</th><th>20X1 Operating Earnings</th></tr></thead>\n  <tbody>\n    <tr><td>ZZYP</td><td>142.5</td><td>140.3</td></tr>\n    <tr><td>AART</td><td>209.8</td><td>195.4</td></tr>\n    <tr><td>XXPG</td><td>220.9</td><td>233.2</td></tr>\n  </tbody>\n</table>"}]},"FSA::7.2-kirk":{"blocks":[{"type":"text","content":"Kirk Company acquired shares of both Company A and Company B. The following information shows the investment value at the time of purchase (t=0) and at two subsequent dates."},{"type":"html","content":"<table>\n  <thead><tr><th>Security</th><th>Cost</th><th>t − 1</th><th>t − 2</th></tr></thead>\n  <tbody>\n    <tr><td>A</td><td>$950</td><td>$850</td><td>$900</td></tr>\n    <tr><td>B</td><td>$250</td><td>$180</td><td>$350</td></tr>\n  </tbody>\n</table>"}]},"FSA::7.456-companymn":{"text":"Company M acquired 20% of Company N for $6 million on January 1, 20X3. Company N’s debt and equity securities are publicly traded on an organized exchange. Company N reported net income (loss) and dividends paid for the year ended 20X3 as shown below.","image":"FSA::24"},"FSA::7.456-companyps":{"blocks":[{"type":"text","content":"Suppose Company P acquires 80% of the common stock of Company S on December 31, 20X2, by paying $120,000 cash to the shareholders of Company S. The two firms’ pre-acquisition balance sheets as of December 31, 20X2, and pro forma income statements for the year ending December 31, 20X3, are shown below.\n\nAt acquisition: Company P total assets = $1,200,000; Company S total assets = $360,000; Company S equity = $150,000. For the year ended December 31, 20X3: Company P net income = $300,000; Company S net income = $60,000; Company S dividends paid = $15,000."},{"type":"html","content":"<p><strong>Pre-Acquisition Balance Sheets (December 31, 20X2)</strong></p>\n<table>\n  <thead><tr><th></th><th>Company P</th><th>Company S</th></tr></thead>\n  <tbody>\n    <tr><td>Current assets</td><td>$720,000</td><td>$240,000</td></tr>\n    <tr><td>Other assets</td><td>480,000</td><td>120,000</td></tr>\n    <tr><td><strong>Total assets</strong></td><td><strong>$1,200,000</strong></td><td><strong>$360,000</strong></td></tr>\n    <tr><td colspan=\"3\" style=\"padding:3px 0;background:transparent;border:none\"></td></tr>\n    <tr><td>Current liabilities</td><td>$600,000</td><td>$210,000</td></tr>\n    <tr><td>Common stock</td><td>420,000</td><td>90,000</td></tr>\n    <tr><td>Retained earnings</td><td>180,000</td><td>60,000</td></tr>\n    <tr><td><strong>Total liabilities &amp; equity</strong></td><td><strong>$1,200,000</strong></td><td><strong>$360,000</strong></td></tr>\n  </tbody>\n</table>\n<p style=\"margin-top:12px\"><strong>Unconsolidated Income Statements (Year Ended December 31, 20X3)</strong></p>\n<table>\n  <thead><tr><th></th><th>Company P</th><th>Company S</th></tr></thead>\n  <tbody>\n    <tr><td>Revenue</td><td>$900,000</td><td>$300,000</td></tr>\n    <tr><td>Expenses</td><td>600,000</td><td>240,000</td></tr>\n    <tr><td><strong>Net income</strong></td><td><strong>$300,000</strong></td><td><strong>$60,000</strong></td></tr>\n    <tr><td>Dividends paid</td><td>—</td><td>$15,000</td></tr>\n  </tbody>\n</table>"}]},"FSA::7.8-jvc":{"blocks":[{"type":"text","content":"Company C owns a 50% interest in a joint venture, JVC, and accounts for it using the equity method. JVC’s assets and liabilities have a book value equal to their fair value. They have each reported the following 20X4 financial results."},{"type":"html","content":"<p><strong>Balance Sheets</strong></p>\n<table>\n  <thead><tr><th></th><th>Company C</th><th>JVC</th></tr></thead>\n  <tbody>\n    <tr><td>Cash</td><td>$1,550</td><td>$300</td></tr>\n    <tr><td>Accounts receivable</td><td>3,500</td><td>700</td></tr>\n    <tr><td>Inventory</td><td>3,000</td><td>800</td></tr>\n    <tr><td>Fixed assets</td><td>5,000</td><td>2,600</td></tr>\n    <tr><td>Investment in JVC</td><td>400</td><td>—</td></tr>\n    <tr><td><strong>Total assets</strong></td><td><strong>$13,450</strong></td><td><strong>$4,400</strong></td></tr>\n    <tr><td colspan=\"3\" style=\"padding:3px 0;background:transparent;border:none\"></td></tr>\n    <tr><td>Accounts payable</td><td>$3,500</td><td>$1,200</td></tr>\n    <tr><td>Long-term debt</td><td>4,000</td><td>2,400</td></tr>\n    <tr><td>Equity</td><td>5,950</td><td>800</td></tr>\n    <tr><td><strong>Total liabilities and equity</strong></td><td><strong>$13,450</strong></td><td><strong>$4,400</strong></td></tr>\n  </tbody>\n</table>\n<p style=\"margin-top:12px\"><strong>Income Statements</strong></p>\n<table>\n  <thead><tr><th></th><th>Company C</th><th>JVC</th></tr></thead>\n  <tbody>\n    <tr><td>Revenues</td><td>$17,430</td><td>$2,800</td></tr>\n    <tr><td>Equity in JVC earnings</td><td>100</td><td>—</td></tr>\n    <tr><td>Cost of goods sold</td><td>7,000</td><td>2,000</td></tr>\n    <tr><td>Other expenses</td><td>9,600</td><td>600</td></tr>\n    <tr><td><strong>Net income</strong></td><td><strong>$930</strong></td><td><strong>$200</strong></td></tr>\n  </tbody>\n</table>"}]},"FSA::9.34-gila":{"blocks":[{"type":"text","content":"Gila Sailing and Fishing, Inc. (Gila), is a subsidiary of Sea of Cortez Unlimited Boating Adventures, Inc. (Cortez), a multinational organization headquartered in Tempe, Arizona. Gila is located in the Sonora Valley and sells fishing trips off the coast of the Sea of Cortez. Cortez accounts for Gila using the temporal method. Gila’s current balance sheet (denominated in pesos) is shown below."},{"type":"html","content":"<p><strong>Gila's Current Balance Sheet (denominated in pesos)</strong></p>\n<table>\n  <tbody>\n    <tr><td>Cash</td><td style=\"text-align:right\">1,000,000</td></tr>\n    <tr><td>Accounts receivable</td><td style=\"text-align:right\">11,000,000</td></tr>\n    <tr><td>Fixed assets</td><td style=\"text-align:right\">43,000,000</td></tr>\n    <tr><td><strong>Total assets</strong></td><td style=\"text-align:right\"><strong>55,000,000</strong></td></tr>\n    <tr><td colspan=\"2\" style=\"padding:3px 0;background:transparent;border:none\"></td></tr>\n    <tr><td>Accounts payable</td><td style=\"text-align:right\">9,000,000</td></tr>\n    <tr><td>Deferred revenue*</td><td style=\"text-align:right\">2,000,000</td></tr>\n    <tr><td>Long-term debt</td><td style=\"text-align:right\">8,000,000</td></tr>\n    <tr><td>Equity</td><td style=\"text-align:right\">36,000,000</td></tr>\n    <tr><td><strong>Total liabilities and equity</strong></td><td style=\"text-align:right\"><strong>55,000,000</strong></td></tr>\n  </tbody>\n</table>\n<p style=\"font-size:12px;margin-top:6px\">*Deferred revenue relates to a wealthy customer who paid for several trips in advance but has been unable to find enough spare time to come back to Sonora.</p>"}]},"FSA::10.4-banks":{"image":"FSA::105"},"FSA::10.6-jiali":{"blocks":[{"type":"text","content":"Jia Li, CFA, is reviewing the relative performance of three P&C insurers. Li has collected the following information for 20X9."},{"type":"html","content":"<table>\n  <thead><tr><th>Description ($ millions)</th><th>IPCO</th><th>SYMCO</th><th>DELPHI</th></tr></thead>\n  <tbody>\n    <tr><td>Loss and loss adjustment expense</td><td>4,512</td><td>2,278</td><td>3,265</td></tr>\n    <tr><td>Underwriting expense</td><td>1,322</td><td>1,799</td><td>1,867</td></tr>\n    <tr><td>Dividends to policyholders (shareholders)</td><td>122</td><td>198</td><td>148</td></tr>\n    <tr><td>Net premiums earned</td><td>7,598</td><td>4,978</td><td>5,994</td></tr>\n    <tr><td>Net premiums written</td><td>7,682</td><td>5,222</td><td>6,322</td></tr>\n  </tbody>\n</table>"}]},"FSA::12.6-bigsmall":{"blocks":[{"type":"text","content":"Big Company owns 25% of Small Company. Selected recent financial data for both firms follows."},{"type":"html","content":"<table>\n  <thead><tr><th></th><th>Big</th><th>Small</th></tr></thead>\n  <tbody>\n    <tr><td>Net income</td><td>£16,000</td><td>€6,000</td></tr>\n    <tr><td>Market capitalization</td><td>£275,000</td><td>€150,000</td></tr>\n    <tr><td>Current exchange rate (£/€)</td><td>0.85</td><td>—</td></tr>\n    <tr><td>Average exchange rate (£/€)</td><td>0.80</td><td>—</td></tr>\n  </tbody>\n</table>"}]},"FixedIncome::24.1-green":{"blocks":[{"type":"text","content":"Dan Green, CFA, is currently working for FIData, a company specializing in the provision of price data for fixed-income instruments.\n\nGreen heads a team that inputs raw data into an instructional area on FIData’s website. FIData uses these pages to provide hypothetical bond information along with a description of how to read and interpret the information.\n\nOne of FIData’s customers has questioned whether some of the data used to demonstrate pricing concepts is correct. The customer’s email stated, “The prices of the three bonds used are not consistent with each other and hence may not be accurate. If they were, I would be able to make a significant arbitrage profit (i.e., I could secure the current risk-free rate of return with zero net investment).” Green thinks the customer is misinformed regarding arbitrage gains, but wants to check the data anyway.\n\nThe relevant data for three hypothetical risk-free bonds is shown in Figure 1 given that the benchmark yield curve is flat at 1.50%. (FFPQ is an annual-pay bond.)"},{"type":"image","src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABdwAAAEGCAIAAADwvcBpAAAACXBIWXMAAA7EAAAOxAGVKw4bAABO30lEQVR4nO3dC3hcdZ3/cRQtXrhfvC2aQEBN2LgNFY37lyyPVk2DxFhWBeL6FNNIihSLVLAmBNHqAsVEsmhXsCRS0V2wTIQtaEkZ6wV3U0ZUKsYBwVLjAAVKHKGmYcj/O/M7c+Z35lzmzCVzJp336/k8PCVz5pKZM2fO75M5v3PALAAAAAAAAMrugKAfAAAAAAAAQDWilAEAAAAAAAgApQwAAAAAAEAAKGUAAAAAAAACQCkDAAAAAAAQAEoZAAAAAACAAFDKAAAAAAAABIBSBgAAAAAAIACUMgAAAAAAAAGglAEAAAAAAAgApQwAAAAAAEAAKGUAAAAAAAACQCkDAAAAAAAQAEoZAAAAAACAAFDKAAAAAAAABIBSBmUVj8c3btx45513vvjii0E/FlSQ+++//+S0hx56KOiHM7tt27bh4eHdu3cXfAuyhst6fvPNN8s6X8IHBgAAAGB/QimDouzatevKXG6//Xa1sAxTGxsbD0i59NJLg33kQXnwwQfV03LrrbeW5AaffPJJ+3M+ODj4ne9855577nn00UdLci9z7Wc/+9kBab/97W/9XMX+Ww8MDIyMjPziF7947rnninkw3/zmN9Uj+Yd/+Ifnn3++sBuRNVzdyMKFC4t5MCX38MMP25+6b3zjGxs2bPjpT386NTUV9AMEAAAAqgilDIqij6XdnH322WphGe+ZPzz11FODfeSB2LRp08EHH6yegba2tpLc5m9/+1vv5//oo4++4IIL/vKXv5Tk7uZIAaWMx6980EEHydP7q1/9qrAHc84555g3tWPHjsJu5N3vfrd5I3/9618Lu5G58D//8z/eK8zb3/72b33rW9PT00E/UgAAAGD/RymDouRVyohTTz1V/XDt2rUBPuzye+GFF9asWaM/LWUrZZTDDz/cZ9kRiNKWMsrLXvay733vewU8GLmWuoW3vOUt+/btK+AWxFVXXaVu5LTTTivsFuZIzlJGeetb33rfffeV8H6///3vH3fcca2trSW8TQAAAGC+o5RBUfSx9Gc+8xnvw5fE9PT01q1bt2/fHuBjLr+nnnrqfe97X9agdy5KmdWrV38r5ZprrlmzZs0ZZ5zxqle9yrz0pJNOqtipfIopZTo6OuRXXr9+vaxs55133hvf+EbzooMOOigajRbweB544IG77767yOlgZD2/5557Ku0rJ3opc9lll6kV5uqrr77kkks++MEPvuIVrzAvlZVH3q2lut/TTz9dbvMf//EfS3WDAAAAwH6AUgZFKWA

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CFA L2 — All Subjects Review</title>
<style>
:root{
  --bg:#F7F8FA;--surface:#FFF;--surface-alt:#F2F3F6;
  --border:#E4E7EC;--text:#1A1D23;--text-secondary:#5B616E;--text-tertiary:#6B7280;
  --accent:#4F46E5;--accent-hover:#4338CA;--accent-soft:#EEF2FF;--accent-soft-border:#C7D2FE;
  --correct-bg:#ECFDF5;--correct-border:#A7D8B9;--correct-text:#0F7A50;
  --wrong-bg:#FEF2F2;--wrong-border:#EFC1C1;--wrong-text:#B3413B;
  --warn-bg:#FFF8EB;--warn-border:#F3D999;--warn-text:#9A6B12;
  --pre-bg:#F4F0FF;--pre-border:#D4C5F3;--pre-text:#7C3AED;
  --user-bg:#F6EEE2;--user-border:#DBC19B;--user-text:#8A5A1E;
  --radius-lg:10px;--radius-md:8px;--radius-sm:6px;
  --shadow-card:0 1px 2px rgba(20,22,30,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
#header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
#header-title{font-size:15px;font-weight:700;color:var(--text)}
#header-sub{font-size:11px;color:var(--text-tertiary);margin-top:1px}
#header-stats{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat-chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;border:1px solid}
.chip-wrong{background:var(--wrong-bg);color:var(--wrong-text);border-color:var(--wrong-border)}
.chip-star{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)}
.chip-total{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft-border)}
#filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:7px 20px;display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
#filter-bar .flabel{font-size:11px;color:var(--text-tertiary);white-space:nowrap;margin-right:2px}
.flt-btn{padding:3px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.flt-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.flt-btn:hover:not(.active){background:var(--surface-alt)}
#prog-bar-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 20px;flex-shrink:0}
#prog-label{font-size:11px;color:var(--text-tertiary);margin-bottom:3px}
#prog-bar-bg{background:var(--surface-alt);border-radius:4px;height:5px;overflow:hidden}
#prog-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
#app{display:flex;flex:1;min-height:0}
#sidebar{width:220px;min-width:180px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
#sb-inner{padding:10px 0}
.sb-subj-hdr{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 14px 5px;font-size:10px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;border-top:1px solid var(--border);background:none;border-left:none;border-right:none;border-bottom:none;cursor:pointer}
.sb-subj-hdr:first-child{border-top:none;margin-top:0}
.sb-subj-hdr:hover{background:var(--surface-alt);color:var(--text-secondary)}
.sb-caret{font-size:8px;flex-shrink:0;transition:transform .15s;color:var(--text-tertiary)}
.sb-subj-hdr.collapsed .sb-caret{transform:rotate(-90deg)}
.sb-subj-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-subj-count{font-size:9px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--surface-alt);color:var(--text-tertiary);flex-shrink:0;letter-spacing:0}
.sb-subj-count.done{background:var(--correct-bg);color:var(--correct-text)}
.sb-group.collapsed{display:none}
.sb-q-btn{display:flex;align-items:center;gap:5px;width:100%;text-align:left;padding:5px 14px;font-size:11.5px;color:var(--text-secondary);background:none;border:none;cursor:pointer;border-left:3px solid transparent;line-height:1.3}
.sb-q-btn:hover{background:var(--surface-alt);color:var(--text)}
.sb-q-btn.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-wrong{background:var(--wrong-text)}.dot-star{background:var(--warn-text)}.dot-both{background:var(--accent)}
.dot-pre{background:var(--pre-text)}.dot-user{background:var(--user-text)}
.sb-num{font-size:10px;color:var(--text-tertiary);flex-shrink:0;min-width:22px}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#q-area{flex:1;padding:20px 24px;max-width:820px;margin:0 auto;width:100%}
#q-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.subj-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-soft-border)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid}
.tag-wrong{background:var(--wrong-bg);color:var(--wrong-text);border-color:var(--wrong-border)}
.tag-star{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)}
.tag-pre{background:var(--pre-bg);color:var(--pre-text);border-color:var(--pre-border)}
.tag-user{background:var(--user-bg);color:var(--user-text);border-color:var(--user-border)}
.q-counter-right{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
#passage-box{background:var(--accent-soft);border:1px solid var(--accent-soft-border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden}
#passage-header{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;cursor:pointer;user-select:none;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
#passage-header:hover{color:var(--accent-hover)}
#passage-content{padding:2px 16px 14px;font-size:13.5px;line-height:1.75;color:var(--text-secondary)}
#passage-content p{margin-bottom:8px}#passage-content p:last-child{margin-bottom:0}
#passage-content img{max-width:100%;border-radius:var(--radius-sm);border:1px solid var(--border);margin:8px 0;display:block;background:var(--surface)}
#passage-content table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
#passage-content th,#passage-content td{border:1px solid var(--border);padding:5px 8px;text-align:left}
#passage-content th{background:var(--surface-alt);font-weight:700;color:var(--text)}
#passage-content td strong,#passage-content th strong{font-weight:700}
#q-body{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:18px;margin-bottom:14px;font-size:14px;line-height:1.7;color:var(--text)}
#q-body table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px}
#q-body th,#q-body td{border:1px solid var(--border);padding:5px 9px;text-align:left}
#q-body th{background:var(--surface-alt);font-weight:700;color:var(--text-secondary)}
#q-body img{max-width:100%;border-radius:var(--radius-sm);border:1px solid var(--border);margin:8px 0;display:block}
#q-body ul,#q-body ol{margin:.5em 0;padding-left:1.3em}
#q-body li{margin:.25em 0}
#options{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);text-align:left;font-size:14px;line-height:1.6;color:var(--text);cursor:pointer;transition:all .15s;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent-soft-border);background:var(--accent-soft)}
.opt .ol{font-weight:700;color:var(--accent);min-width:18px;margin-top:1px;flex-shrink:0}
.opt.correct{border-color:var(--correct-border);background:var(--correct-bg);color:var(--correct-text)}
.opt.correct .ol{color:var(--correct-text)}
.opt.wrong{border-color:var(--wrong-border);background:var(--wrong-bg);color:var(--wrong-text)}
.opt.wrong .ol{color:var(--wrong-text)}
.opt[disabled]{cursor:default}
.btn-reveal{padding:11px 14px;border-radius:var(--radius-md);border:1px solid var(--accent-soft-border);background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;width:100%;text-align:center;margin-bottom:14px}
.btn-reveal:hover{background:#E0E4FE}
#explanation{display:none;background:var(--correct-bg);border:1px solid var(--correct-border);border-radius:var(--radius-md);padding:14px;margin-bottom:14px;font-size:13px;line-height:1.7;color:#2A5C46}
#explanation.show{display:block}
.los-tag{display:inline-block;background:var(--surface);border:1px solid var(--correct-border);border-radius:3px;padding:2px 7px;font-size:11px;font-weight:700;color:var(--correct-text);margin-bottom:7px}
#explanation table{border-collapse:collapse;margin:8px 0;width:100%;font-size:12px}
#explanation th,#explanation td{border:1px solid var(--correct-border);padding:4px 7px;text-align:left}
#explanation th{background:rgba(167,216,185,.3);font-weight:700}
#explanation ul,#explanation ol{margin:.4em 0;padding-left:1.2em}
#explanation li{margin:.2em 0}
#explanation img{max-width:100%;border-radius:var(--radius-sm);margin:7px 0;display:block}
#nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:32px;margin-top:4px}
.nav-btn{padding:7px 16px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-size:13px;font-weight:600}
.btn-prev{background:var(--surface);color:var(--text-secondary);border-color:var(--border)}
.btn-prev:hover{background:var(--surface-alt)}
.btn-next{background:var(--accent);color:#fff}
.btn-next:hover:not([disabled]){background:var(--accent-hover)}
.btn-next[disabled]{opacity:.4;cursor:default}
#jump-wrap{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-tertiary)}
#jump-input{width:48px;padding:3px 7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px}
#empty{display:none;padding:60px 24px;text-align:center;color:var(--text-tertiary)}
#empty.show{display:block}
#empty h2{font-size:18px;margin-bottom:6px;color:var(--text-secondary)}
@media(max-width:640px){#sidebar{display:none}}
#toolbar-btns{display:flex;gap:6px;align-items:center}
.tb-btn{padding:4px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tb-btn:hover{background:var(--surface-alt)}
.tb-btn.starred{border-color:var(--warn-border);background:var(--warn-bg);color:var(--warn-text)}
.tb-btn.star-pre{border-color:var(--pre-border);background:var(--pre-bg);color:var(--pre-text)}
.tb-btn.star-user{border-color:var(--user-border);background:var(--user-bg);color:var(--user-text)}
.chip-pre{background:var(--pre-bg);color:var(--pre-text);border-color:var(--pre-border)}
.chip-user{background:var(--user-bg);color:var(--user-text);border-color:var(--user-border)}
.tb-btn-reset:hover{background:#FECACA}
</style>
</head>
<body>
<div id="header">
  <div>
    <div id="header-title">CFA Level 2 — All Subjects Review</div>
    <div id="header-sub">틀린 문제 + 별표 문제 복습</div>
  </div>
  <div id="header-stats">
    <span class="stat-chip chip-wrong">✗ 오답 71개</span>
    <span class="stat-chip chip-pre">★ 기존별표 41개</span>
    <span class="stat-chip chip-user">★ 추가별표 0개</span>
    <span class="stat-chip chip-total">총 83문제</span>
  </div>
  <input type="file" id="import-input" accept=".json" style="display:none" onchange="importJSON(event)">
  <div id="toolbar-btns">
    <button class="tb-btn" onclick="exportJSON()">↑ 내보내기</button>
    <button class="tb-btn" onclick="document.getElementById('import-input').click()">↓ 가져오기</button>
    <button class="tb-btn tb-btn-reset" onclick="resetAll()">⟳ 전체 초기화</button>
  </div>
</div>
<div id="filter-bar">
  <span class="flabel">필터:</span>
  <button class="flt-btn active" data-filter="all" onclick="applyFilter('all',null)">전체 (83)</button>
  <button class="flt-btn" data-filter="wrong" onclick="applyFilter('wrong',null)">✗ 오답 (71)</button>
  <button class="flt-btn" data-filter="starred" onclick="applyFilter('starred',null)">⭐ 별표 전체 (41)</button>
  <button class="flt-btn" data-filter="prestar" onclick="applyFilter('prestar',null)">★ 기존별표 (41)</button>
  <button class="flt-btn" data-filter="userstar" onclick="applyFilter('userstar',null)">★ 추가별표 (0)</button>
  <span style="width:1px;background:var(--border);height:16px;flex-shrink:0;margin:0 4px"></span>
  <button class="flt-btn" data-filter="FSA" onclick="applyFilter('all','FSA')">FSA (13)</button>
    <button class="flt-btn" data-filter="Fixed Income" onclick="applyFilter('all','Fixed Income')">Fixed Income (8)</button>
    <button class="flt-btn" data-filter="Derivatives" onclick="applyFilter('all','Derivatives')">Derivatives (2)</button>
    <button class="flt-btn" data-filter="Equity" onclick="applyFilter('all','Equity')">Equity (16)</button>
    <button class="flt-btn" data-filter="Portfolio Mgmt" onclick="applyFilter('all','Portfolio Mgmt')">Portfolio Mgmt (8)</button>
    <button class="flt-btn" data-filter="Economics" onclick="applyFilter('all','Economics')">Economics (4)</button>
    <button class="flt-btn" data-filter="Corporate Issuers" onclick="applyFilter('all','Corporate Issuers')">Corporate Issuers (4)</button>
    <button class="flt-btn" data-filter="Quants" onclick="applyFilter('all','Quants')">Quants (8)</button>
    <button class="flt-btn" data-filter="Alternative Investments" onclick="applyFilter('all','Alternative Investments')">Alternative Investments (3)</button>
    <button class="flt-btn" data-filter="Ethics (Module Quiz)" onclick="applyFilter('all','Ethics (Module Quiz)')">Ethics (Module Quiz) (10)</button>
    <button class="flt-btn" data-filter="Ethics (CFAI)" onclick="applyFilter('all','Ethics (CFAI)')">Ethics (CFAI) (7)</button>
    
</div>
<div id="prog-bar-wrap">
  <div id="prog-label"></div>
  <div id="prog-bar-bg"><div id="prog-bar-fill" style="width:0%"></div></div>
</div>
<div id="app">
  <div id="sidebar"><div id="sb-inner"></div></div>
  <div id="main">
    <div id="q-area">
      <div id="q-meta"></div>
      <div id="passage-box" style="display:none">
        <div id="passage-header" onclick="togglePassage()">
          <span>지문 / 자료</span><span id="passage-caret">▼</span>
        </div>
        <div id="passage-content"></div>
      </div>
      <div id="q-body"></div>
      <div id="options"></div>
      <div id="explanation"></div>
      <div id="nav">
        <button class="nav-btn btn-prev" onclick="navigate(-1)">← 이전</button>
        <button class="nav-btn btn-next" id="btn-next" onclick="navigate(1)">다음 →</button>
        <button class="tb-btn" id="btn-star-toggle" onclick="toggleStar()">☆ 별표</button>
        <button class="tb-btn" style="border-color:var(--wrong-border);background:var(--wrong-bg);color:var(--wrong-text)" onclick="resetQ()">↺ 초기화</button>
        <div id="jump-wrap">
          <label for="jump-input">이동:</label>
          <input id="jump-input" type="number" min="1" value="1" onchange="jumpTo(this.value)">
          <span id="jump-total"></span>
        </div>
      </div>
    </div>
    <div id="empty"><h2>표시할 문제가 없습니다</h2><p>필터를 변경해보세요.</p></div>
  </div>
</div>
<script>
const ALL_ITEMS   = [{"key":"7.2_2","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"At t = 1, Kirk will:","o":["A. carry the financial assets at cost.","B. write down the financial assets to $1,030 and recognize an unrealized loss of $170.","C. write down the financial assets to $1,030 and recognize a realized loss of $170."],"a":"B","e":"Fair value through OCI and fair value through profit or loss securities are carried at market value. Market value at t=1 is $850 + $180 = $1,030. Unrealized loss = ($850–$950) + ($180–$250) = –$170. With FVOCI, recognition is only on the balance sheet (not the income statement); with FVPL, it impacts the income statement.","los":"LOS 7.a","open":false,"p":"FSA::7.2-kirk","passageBlocks":null},{"key":"7.456_15","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"On its December 31, 20X3 pro forma consolidated balance sheet, Company P should report a <b>minority ownership interest</b> of:","o":["A. $0.","B. $39,000.","C. $42,000."],"a":"B","e":"Beginning minority interest = $150,000 × 20% = $30,000. Add minority share of income: $60,000 × 20% = $12,000. Subtract minority share of dividends: $15,000 × 20% = $3,000. Ending minority interest = $30,000 + $12,000 − $3,000 = $39,000.","los":"LOS 7.a (Module 7.4)","open":false,"p":"FSA::7.456-companyps","passageBlocks":null},{"key":"7.8_20","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"Assuming <b>proportionate consolidation</b>, Company C's cost of goods sold and net income for the year ended 20X4 are closest to:","o":["A. Row A (COGS = $8,000; Net income = $930).","B. Row B (COGS = $8,000; Net income = $1,330).","C. Row C (COGS = $9,000; Net income = $1,330)."],"a":"A","e":"COGS = $7,000 (Company C) + 50% × $2,000 (JVC) = $8,000. Net income of $930 is not affected by proportionate consolidation — it remains the same under all three methods (equity, proportionate consolidation, acquisition).","los":"LOS 7.a (Module 7.8)","open":false,"p":"FSA::7.8-jvc","passageBlocks":null},{"key":"8.1_25","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"Which of the following is <b>least accurate</b>? Short-term compensation:","o":["A. is expensed to the income statement as it vests.","B. includes bonuses, health insurance, retirement contributions, and paid leave.","C. is subject to high measurement error in estimating costs."],"a":"C","e":"Short-term employee compensation vests in less than 12 months. Because it is settled in cash, there is a limited scope for measurement error. It is expensed to the income statement as it vests, and unpaid amounts at year-end are shown as a current liability.","los":"LOS 8.a","open":false,"p":null,"passageBlocks":null},{"key":"8.2_32","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"SCP Incorporated disclosed the following information related to its defined-benefit pension plan:<table><thead><tr><th></th><th>20X3</th><th>20X2</th><th>20X1</th></tr></thead><tbody><tr><td>Discount rate</td><td>4.4%</td><td>4.3%</td><td>4.1%</td></tr><tr><td>Expected return on assets</td><td>5.2%</td><td>4.9%</td><td>4.9%</td></tr><tr><td>Expected salary growth rate</td><td>3.1%</td><td>3.1%</td><td>3.1%</td></tr><tr><td>Actual inflation rate</td><td>2.3%</td><td>2.5%</td><td>2.6%</td></tr><tr><td style=\"padding-top:6px\"><em>Allocation of plan assets:</em></td><td></td><td></td><td></td></tr><tr><td style=\"padding-left:16px\">Debt investments</td><td>40%</td><td>30%</td><td>30%</td></tr><tr><td style=\"padding-left:16px\">Equity investments</td><td>60%</td><td>70%</td><td>70%</td></tr></tbody></table><br>SCP's pension assumptions are internally consistent with regard to:","o":["A. inflation expectations but not asset returns.","B. asset returns but not inflation expectations.","C. neither asset returns nor inflation expectations."],"a":"C","e":"<b>C is correct.</b> Neither inflation expectations nor asset returns are internally consistent.<br><br><b>A. Incorrect — inflation expectations are <em>not</em> internally consistent.</b> Actual inflation has been <em>decreasing</em> (2.6% in 20X1 → 2.5% in 20X2 → 2.3% in 20X3). When inflation falls, long-term nominal interest rates — and hence the pension discount rate — should also fall. Yet SCP's discount rate is <em>increasing</em> (4.1% → 4.3% → 4.4%). A rising discount rate is inconsistent with declining inflation.<br><br><b>B. Incorrect — asset returns are also <em>not</em> internally consistent.</b> SCP has been shifting its asset allocation from equity to debt: equity fell from 70% (20X1–20X2) to 60% (20X3), while debt rose from 30% to 40%. Because equities typically earn higher returns than fixed-income, a shift toward debt should cause the expected return on plan assets to <em>decrease</em>. Instead, the expected return <em>increased</em> (4.9% → 4.9% → 5.2%) — inconsistent with the reduced equity exposure.<br><br><b>C. Correct.</b> Both sets of assumptions are internally inconsistent: the discount rate rises despite falling inflation, and the expected asset return rises despite a lower-return asset mix.","los":"LOS 8.d","open":false,"p":null,"passageBlocks":null},{"key":"9.34_41","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"How many of the following situations might result in a <b>translation gain</b>?<br><ol style=\"margin:10px 0 10px 20px\"><li>Total assets exceed total liabilities when the foreign currency is <em>depreciating</em> using the current rate method.</li><li>Monetary liabilities exceed monetary assets when the foreign currency is <em>appreciating</em> using the temporal method.</li><li>Monetary assets exceed monetary liabilities when the foreign currency is <em>depreciating</em> using the temporal method.</li><li>Total assets equal total liabilities when the foreign currency is <em>appreciating</em> using the current rate method.</li></ol>","o":["A. None.","B. One.","C. Two."],"a":"A","e":"None of the situations result in a gain. (1) Net assets in a depreciating environment → loss. (2) Net monetary liabilities in an appreciating environment → loss. (3) Net monetary assets in a depreciating environment → loss. (4) Total assets = total liabilities means net assets = zero → no gain or loss.","los":"LOS 9.c (Module 9.4)","open":false,"p":null,"passageBlocks":null},{"key":"9.34_42","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"<b>Nonmonetary assets less nonmonetary liabilities</b> are:","o":["A. 5,000,000.","B. 41,000,000.","C. 43,000,000."],"a":"B","e":"Fixed assets are the only nonmonetary assets = 43,000,000. Deferred revenue is the only nonmonetary liability = 2,000,000. Equity is not relevant to this calculation. Nonmonetary assets − nonmonetary liabilities = 43,000,000 − 2,000,000 = 41,000,000.","los":"LOS 9.c (Module 9.3)","open":false,"p":"FSA::9.34-gila","passageBlocks":null},{"key":"9.8_54","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"The most likely impact of currency fluctuations on IBM's <b>2011 pre-tax earnings</b> net of hedging activities is that pre-tax earnings were:","o":["A. lower by $600 million.","B. lower by $100 million.","C. higher by $600 million."],"a":"C","e":"Per the annual report: \"The same mathematical exercise resulted in an increase of approximately $600 million in 2011.\" Pre-tax earnings increased by approximately $600 million due to currency translation effects in 2011.","los":"LOS 9.j","open":false,"p":"FSA::9.8-ibm","passageBlocks":null},{"key":"10.6_79","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"Which insurer has the <b>highest combined ratio</b>?","o":["A. IPCO.","B. SYMCO.","C. DELPHI."],"a":"C","e":"Combined ratio = Loss &amp; LAE ratio + Underwriting expense ratio. Per the PDF answer key, DELPHI has the highest combined ratio; IPCO has the lowest.","los":"LOS 10.f","open":false,"p":"FSA::10.6-jiali","passageBlocks":null},{"key":"10.6_81","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"Which insurer has the <b>highest combined ratio after dividends (CRAD)</b>?","o":["A. IPCO.","B. SYMCO.","C. DELPHI."],"a":"C","e":"CRAD = Combined ratio + Dividend to policyholders ratio. Per the PDF answer key, DELPHI has the highest CRAD; IPCO has the lowest.","los":"LOS 10.f","open":false,"p":"FSA::10.6-jiali","passageBlocks":null},{"key":"11.all_88","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"Using Exhibit 1 and Jones' proposed adjustments (XXPG needs no adjustments), the company with the <b>highest \"core earnings growth\"</b> from 20X0 to 20X1 was most likely:","o":["A. ZZYP.","B. AART.","C. XXPG."],"a":"B","e":"AART capitalized $20.1M in 20X0 (which Jones removes, lowering 20X0 core earnings significantly) and charged $5.0M depreciation in 20X1 (which Jones adds back, increasing 20X1 core earnings). This adjustment substantially increases AART's apparent growth. After Jones' adjustments, AART shows the highest core earnings growth.","los":"LOS 11.k (Module 11.5)","open":false,"p":"FSA::11.5-jones","passageBlocks":null},{"key":"12.2_98","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"Selected financial information from Westcreek Corporation follows:<table><thead><tr><th></th><th>2023</th><th>2022</th></tr></thead><tbody><tr><td>Revenue</td><td>$848,000</td><td>$732,800</td></tr><tr><td>Fixed assets</td><td>$146,800</td><td>$114,400</td></tr><tr><td>Investment in Creston Corp.</td><td>$56,400</td><td>$42,100</td></tr><tr><td>Total assets</td><td>$468,000</td><td>$363,600</td></tr></tbody></table><br>At the end of 2023, Westcreek's <b>total asset turnover, without regard to the investment in Creston</b>, is closest to:","o":["A. 2.0.","B. 2.3.","C. 2.5."],"a":"B","e":"Average assets excluding Creston = [($468,000 − $56,400) + ($363,600 − $42,100)] / 2 = ($411,600 + $321,500) / 2 = $366,550. Turnover = $848,000 / $366,550 = 2.31.","los":"LOS 12.b","open":false,"p":null,"passageBlocks":null},{"key":"12.6_102","subject":"FSA","subject_id":"FSA","wrong":true,"starred":false,"q":"The <b>implied P/E multiple of Big</b>, without regard to Small, is closest to:","o":["A. 16.1.","B. 16.4.","C. 17.2."],"a":"B","e":"Big's implied value without Small = £275,000 − £31,875 (pro rata share of Small market cap) = £243,125. Big's net income without Small = £16,000 − (€6,000 × 25% × 0.80) = £16,000 − £1,200 = £14,800. Implied P/E = £243,125 / £14,800 = 16.4.","los":"LOS 12.e","open":false,"p":"FSA::12.6-bigsmall","passageBlocks":null},{"key":"24.1_13","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"Given the three bonds in Figure 1, it is possible to make an arbitrage gain by:","o":["A. selling 1 FFPQ bond and simultaneously purchasing 10 DALO and 10 NKDS bonds.","B. selling 10 FFPQ bonds and simultaneously purchasing 1 DALO and 1 NKDS bond.","C. selling 1 DALO bond and 1 NKDS bond and simultaneously purchasing 10 FFPQ bonds."],"a":"B","e":"An up-front arbitrage profit of $38.70 can be earned by selling 10 FFPQ bonds short and purchasing 1 DALO and 1 NKDS bonds as shown here. (LOS 24.a)","los":"","open":false,"p":"FixedIncome::24.1-green","passageBlocks":[0,1]},{"key":"24.23_23","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"When calibrating a binomial interest rate tree to match a specific term structure, which of the following statements is least accurate?","o":["A. Interest rates in the tree should produce an arbitrage-free valuation for benchmark securities.","B. Adjacent spot rates at each node of the tree are related by the multiplier e2σ.","C. The middle forward rate in a period is approximately equal to the implied (from the benchmark spot rate curve) one-period forward rate for that period."],"a":"B","e":"The stated multiplier is correct but it is important to note that the rates given at each node of the tree are forward rates not spot rates. (Module 24.2, LOS 24.d)","los":"","open":false,"p":null,"passageBlocks":null},{"key":"25.67_33","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"If Osagae had used implied volatility from interest rate options to compute the OAS for Suni Corp bond, the estimated OAS would most likely have been:","o":["A. lower than 145 bps.","B. higher than 145 bps.","C. equal to 145 bps."],"a":"A","e":"When the assumed volatility in a binomial tree increases, the computed value of OAS will decrease. When an analyst uses a lower-than-actual level of volatility like the 15% volatility assumed here, the computed OAS for a callable bond will be too high. Using the 19% implied volatility instead would have resulted in an estimated OAS lower than 145 bps. (Module 25.4, LOS 25.h)","los":"","open":false,"p":"FixedIncome::25.7-osagae","passageBlocks":[2,3,4]},{"key":"26.1_50","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"Joel Abramson, CFA, is the fixed income portfolio manager of VZ Bank. Based on his analysis of bonds issued by Tinta Corp, including an evaluation of Tinta’s balance sheet, Joel estimates the hazard rate for the bond. Abramson would most accurately consider the bond to be an attractive purchase if the:","o":["A. estimated hazard rate is less than the bond’s risk-neutral probability of default.","B. estimated hazard rate is less than 2%.","C. estimated hazard rate is greater than the risk-neutral probability of default."],"a":"A","e":"Risk-neutral probability of default is the probability of default that is priced by the market. If Abramson’s estimated hazard rate is less than this, the market has priced-in a higher credit risk in the bond (i.e., the bond is undervalued). (LOS 26.a)","los":"","open":false,"p":null,"passageBlocks":null},{"key":"26.2_53","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"Given the following information, which bond has the least amount of credit risk?<table><thead><tr><th>Bond</th><th>Exposure (per $100 par)</th><th>Recovery (per $100 par)</th><th>Probability of Default</th></tr></thead><tbody><tr><td>P</td><td>98</td><td>50</td><td>2.50%</td></tr><tr><td>Q</td><td>94</td><td>56</td><td>3.00%</td></tr><tr><td>R</td><td>89</td><td>49</td><td>4.65%</td></tr></tbody></table>","o":["A. Bond P.","B. Bond Q.","C. Bond R."],"a":"B","e":"Bond Q has the lowest expected loss and hence the lowest credit risk. (LOS 26.a)","los":"","open":false,"p":null,"passageBlocks":null},{"key":"26.6_66","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"Mossimo Gulzar is compiling data on spreads for AAA corporate bonds. Mossimo has compiled the following information from the firm’s senior economist. Using a typical 4% coupon AAA bond for each maturity category, Mossimo would most likely conclude that the credit spread curve is:<table><thead><tr><th>Year</th><th>1</th><th>3</th><th>5</th><th>10</th></tr></thead><tbody><tr><td><strong>Benchmark Par Rate</strong></td><td>0.75%</td><td>1.25%</td><td>1.75%</td><td>2.25%</td></tr><tr><td><strong>AAA CVA</strong></td><td>$1.79</td><td>$2.12</td><td>$3.24</td><td>$5.84</td></tr></tbody></table>","o":["A. upward sloping.","B. downward sloping.","C. flat."],"a":"B","e":"The coupon rate is given as 4%. The following table shows the results: VND is calculated using the benchmark par rate. For example, VND for 5-year bond: N = 5, FV = 100, PMT = 4, I/Y = 1.75, CPT PV = 110.68 value (risky) = VND – CVA Yield (risky) is computed using the value of risky bond as its price. Yield (risky) for 3-year bond: N = 3, PV = –105.93, PMT = 4, FV = 100, CPT I/Y = 1.95% credit spread = yield (risky) – par rate Credit spreads appear to decline with maturity, resulting in a downward sloping credit spread curve. (LOS 26.f)","los":"","open":false,"p":null,"passageBlocks":null},{"key":"26.7_73","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"With respect to the servicer in a secured debt, investors most likely face:","o":["A. operational and financial risk only.","B. financial and counterparty risk only.","C. operational and counterparty risk only."],"a":"C","e":"After origination, investors in a secured debt face operational and counterparty risk of the servicer. (LOS 26.h)","los":"","open":false,"p":null,"passageBlocks":null},{"key":"27.123_77","subject":"Fixed Income","subject_id":"FixedIncome","wrong":true,"starred":false,"q":"For this question only, suppose that six months after the inception of the swap, IDG declares bankruptcy. Figure 1 shows the market prices of IDG bonds after the company files for bankruptcy. Figure 1: Market Price of IDG Bonds Post Bankruptcy Filing If Banaji has a choice of settlement procedure, he is most likely to choose:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:left;padding:4px 12px\">Description</th><th style=\"text-align:center;padding:4px 12px\">Market Price (%) of Par</th></tr></thead><tbody><tr><td style=\"padding:4px 12px\">9.5-year 6% senior unsecured</td><td style=\"text-align:center;padding:4px 12px\">45% of par</td></tr><tr><td style=\"padding:4px 12px\">5-year 5% senior unsecured</td><td style=\"text-align:center;padding:4px 12px\">40% of par</td></tr><tr><td style=\"padding:4px 12px\">5-year 6% subordinated unsecured</td><td style=\"text-align:center;padding:4px 12px\">30% of par</td></tr></tbody></table></div>","o":["A. physical settlement.","B. cash settlement and the payoff would be $6 million.","C. cash settlement and the payoff would be $7 million."],"a":"B","e":"The CDS in the question is a senior CDS, hence the reference obligation is a senior unsecured bond. The payoff on the CDS is based on the CTD with same seniority as reference obligation. From the three choices given, the five-year 5% senior unsecured is the cheapest to deliver. Hence, the payoff will be notional principal – market value of the CTD = $10 million – $4 million = $6 million. Note that physical settlement would not be advantageous to Banaji; Figure 1 indicates that the IDG bonds that Banaji is currently holding have a market value of $4.5 million, so the implied payoff of physically delivering these bonds in exchange for $10 million would be only $5.5 million ($10 million – $4.5 million). (Module 27.2, LOS 27.c)","los":"","open":false,"p":"FixedIncome::27.3-banaji","passageBlocks":null},{"key":"297_25","subject":"Derivatives","subject_id":"Derivatives","wrong":true,"starred":false,"q":"Which of the following statements is most accurate? Implied volatility:","o":["A. requires market prices.","B. requires a series of past returns.","C. is equal for otherwise identical options with different maturities."],"a":"A","e":"Implied volatility is the volatility that produces market option prices from the BSM model. Its use for pricing options is limited because it is based on market prices. Past returns are used to calculate historical volatility","los":"(LOS 29.n)","open":false,"p":null,"passageBlocks":null},{"key":"297_28","subject":"Derivatives","subject_id":"Derivatives","wrong":true,"starred":false,"q":"A put option with an exercise price of $45 is trading for $3.50. The current stock price is $45. What is the most likely effect on the option’s delta and gamma if the stock price increases to $50?","o":["A. Both delta and gamma will increase.","B. Both delta and gamma will decrease.","C. One will increase and the other will decrease."],"a":"C","e":"The put option is currently at-the-money because its exercise price is equal to the stock price of $45. As stock price increases, the put option’s delta (which is less than zero) will increase toward zero, becoming less negative. The put option’s gamma, which measures the rate of change in delta as the stock price changes, is at a maximum when the option is at-the-money. Therefore, as the option moves out-of-the-money, its gamma will fall","los":"(LOS 29.k)","open":false,"p":null,"passageBlocks":null},{"key":"19.5_36","subject":"Equity","subject_id":"Equity","wrong":false,"starred":true,"q":"The Gray Furniture Co. earned £3.50 per share last year. Investment in fixed capital\nwas £2.00 per share, depreciation was £1.60, and the investment in working capital\nwas £0.50 per share. Gray is currently operating at its target debt-to-asset ratio of\n40%. Thus, 40% of annual investments in working capital and fixed capital will be\nfinanced with new borrowings. Shareholders require a return of 14% on their\ninvestment, and the expected growth rate is 4%. The value of Gray’s stock is closest to:","o":["A. £27.04.","B. £29.90.","C. £30.78."],"a":"C","e":" \\[ \\text{FCFE} = 3.50 - (1-0.4)(2.00-1.60) - (1-0.4)(0.50) = \\text{£}2.96 \\] \\[ \\text{equity value per share} = \\frac{\\text{£}2.96 \\times 1.04}{0.14 - 0.04} = \\text{£}30.78 \\]","los":"LOS 19.e","open":false,"p":null,"passageBlocks":null},{"key":"19.5_37","subject":"Equity","subject_id":"Equity","wrong":true,"starred":true,"q":"Free cash flow to the firm (FCFF) in Year 6 is closest to:","o":["A. $14.14.","B. $16.49.","C. $18.26."],"a":"B","e":"In the stable stage (Year 6), sales, EBIT, and working capital investment grow at 4%, while fixed capital investment and depreciation offset each other: \\[ \\text{EBIT}_6(1-T) = 21.15 \\times 1.04 = 21.99, \\quad \\text{WCInv}_6 = 5.29 \\times 1.04 = 5.50 \\] \\[ \\text{FCFF}_6 = \\text{EBIT}_6(1-T) + \\text{Dep} - \\text{FCInv} - \\text{WCInv} = 21.99 + 0 - 5.50 = \\$16.49 \\]","los":"LOS 19.c","open":false,"p":"Equity::19.5-sanford","passageBlocks":null},{"key":"19.5_42","subject":"Equity","subject_id":"Equity","wrong":true,"starred":true,"q":"The value of Barlow Energy’s equity using a single-stage FCFF model is closest to:","o":["A. $897.15.","B. $1,097.15.","C. $1,497.15."],"a":"A","e":"The value of the equity is equal to firm value less the market value of debt and\npreferred stock:\nvalue of equity = $1,697.15 – $600 – $200 = $897.15","los":"LOS 19.k","open":false,"p":"Equity::19.5-barlow","passageBlocks":null},{"key":"19.5_47","subject":"Equity","subject_id":"Equity","wrong":false,"starred":true,"q":"The value of MWC’s common stock using the two-stage FCFE approach is closest to:","o":["A. $55.09.","B. $59.10.","C. $68.24."],"a":"B","e":"The current value of MWC common stock can be estimated using the two-stage\nFCFE approach as follows: \\[ \\text{FCFE}_{2023} = \\text{CFO} - \\text{FCInv} + \\text{net borrowing} = 33{,}960 - 12{,}000 + 3{,}200 = \\$25{,}160 \\] \\[ \\text{FCFE per share} = \\frac{\\$25{,}160}{10{,}400} = \\$2.42 \\] \\[ \\text{terminal value} = \\frac{\\$3.20 \\times 1.08}{0.13 - 0.08} = \\$69.12 \\qquad \\text{equity value} = \\frac{\\$2.78}{1.13} + \\frac{\\$3.20 + \\$69.12}{1.13^2} = \\$59.10 \\]","los":"LOS 19.d","open":false,"p":"Equity::19.5-mwc","passageBlocks":null},{"key":"19.5_48","subject":"Equity","subject_id":"Equity","wrong":true,"starred":true,"q":"The Hoffman Card Co. earned £1.50 per share last year. Investment in fixed capital\nwas £0.80 per share, and depreciation was £0.30. Investment in working capital was\n£0.20 per share. Hoffman expects earnings to grow at 15% per year for the next five\nyears, and that investment in fixed capital, depreciation, and investment in working\ncapital will grow at the same rate. After five years, the growth in earnings and working\ncapital requirements will decline to a stable 5% per year, and investment in fixed\ncapital and depreciation will offset each other (i.e., they will be equal). Hoffman’s\n\ntarget debt ratio is 30%. The shareholders require a return of 17% on their investment\nduring the high-growth stage, and a return of 10% on their investment during the\nstable stage. The FCFE in Year 6 and the value per share of Hoffman’s common stock\nare closest to:","o":["A. FCFE in Year 6: £2.88; Share value: £31.08.","B. FCFE in Year 6: £2.88; Share value: £57.60.","C. FCFE in Year 6: £2.03; Share value: £57.60."],"a":"A","e":"The following table shows FCFE for Years 0 through 6 (in £), where FCFE = NI − [(1 − DR) × (FCInv − Dep)] − [(1 − DR) × WCInv]:<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"border-collapse:collapse;width:100%;font-size:0.9em\"><thead><tr style=\"border-bottom:2px solid #333\"><th style=\"text-align:center;padding:4px 12px\">Year</th><th style=\"text-align:center;padding:4px 12px\">0</th><th style=\"text-align:center;padding:4px 12px\">1</th><th style=\"text-align:center;padding:4px 12px\">2</th><th style=\"text-align:center;padding:4px 12px\">3</th><th style=\"text-align:center;padding:4px 12px\">4</th><th style=\"text-align:center;padding:4px 12px\">5</th><th style=\"text-align:center;padding:4px 12px\">6</th></tr></thead><tbody><tr><td style=\"text-align:left;padding:4px 12px\">NI</td><td style=\"text-align:center;padding:4px 12px\">1.50</td><td style=\"text-align:center;padding:4px 12px\">1.73</td><td style=\"text-align:center;padding:4px 12px\">1.98</td><td style=\"text-align:center;padding:4px 12px\">2.28</td><td style=\"text-align:center;padding:4px 12px\">2.62</td><td style=\"text-align:center;padding:4px 12px\">3.02</td><td style=\"text-align:center;padding:4px 12px\">3.17</td></tr><tr><td style=\"text-align:left;padding:4px 12px\">(−) [(1 − DR) × (FCInv − Dep)]</td><td style=\"text-align:center;padding:4px 12px\">0.35</td><td style=\"text-align:center;padding:4px 12px\">0.40</td><td style=\"text-align:center;padding:4px 12px\">0.46</td><td style=\"text-align:center;padding:4px 12px\">0.53</td><td style=\"text-align:center;padding:4px 12px\">0.61</td><td style=\"text-align:center;padding:4px 12px\">0.70</td><td style=\"text-align:center;padding:4px 12px\">0</td></tr><tr><td style=\"text-align:left;padding:4px 12px\">(−) [(1 − relative to the industry."],"a":"A","e":"In the department and discount segment of the retail industry, Harmon’s appears\nto be a more attractive investment than Wally’s for the following reasons:\nHarmon’s is trading at a P/B that is 57% of the average P/B for the department\nand discount store segment of the retail industry with a forecasted ROE that is\nvery close to that of the industry. This indicates that Harmon’s is undervalued\nrelative to the industry.\nHarmon’s is currently trading at a P/B that is 50% of the current P/B for\nWally’s, with an estimated ROE that is just slightly less than the forecasted ROE\nfor Wally’s. This indicates that Harmon’s is undervalued relative to Wally’s. It\nshould be noted that the beta values for Harmon’s and Wally’s are only slightly\ndifferent, indicating similar risk.\nWally’s is trading at a P/B that is 114% of the industry average P/B, with a\nforecasted ROE that is only slightly above the ROE forecast for the industry.\nThis indicates that Wally’s is overvalued relative to its industry.","los":"Module 20.3, LOS 20.l","open":false,"p":"Equity::20.234-fischer","passageBlocks":[0,1,2]},{"key":"20.234_64","subject":"Equity","subject_id":"Equity","wrong":false,"starred":true,"q":"Clementi requests that Fischer calculate the P/CFO for Lester’s, using adjusted cash flow from operations for cash flow for comparison with other companies. The adjusted P/CFO for Lester’s is closest to:","o":["A. 15.","B. 17. ","C. 19."],"a":"B","e":"It is appropriate to make one adjustment to CFO in this problem to reflect\nnonrecurring items:\n\nThe nonrecurring expense of $139,870,000 that appears on the income\nstatement should be added back after adjusting for taxes.\nCFO (reflecting nonrecurring items) = $1,497,442,000 + $139,870,000(1 – 0.37)\n= $1,585,560,100\nadjusted CFO per share = $1,585,560,100 / 631,643,000 = $2.51\nadjusted P/CFO = $42.10 / $2.51 = 16.77 or closest to 17","los":"Module 20.3, LOS 20.n","open":false,"p":"Equity::20.234-fischer","passageBlocks":[2,3,4]},{"key":"20.234_65","subject":"Equity","subject_id":"Equity","wrong":true,"starred":false,"q":"The 12-month trailing EPS for Sample Fabrication Company as of December 31, 20X3,\nis $1.29. Sample stock trades at $42.50 per share as of 12/31/20X3. In the first quarter\nof 20X3, Sample reported an extraordinary loss of $0.22 per share. In the third\nquarter, the company reported a loss from the write-down of inventory of $0.04 per\nshare. In the fourth quarter, Sample reported a gain of $0.08 per share from a change\nin accounting estimate when it increased the estimate of useful life of certain\nmanufacturing equipment. Sample’s trailing P/E ratio based on underlying earnings is\nclosest to:","o":["A. 24.6.","B. 28.9.","C. 32.9."],"a":"B","e":"underlying earnings = $1.29 + $0.22 + $0.04 − $0.08 = $1.47 \\[ \\text{P/E} = \\frac{\\$42.50}{\\$1.47} = 28.9 \\]","los":"Module 20.4, LOS 20.e","open":false,"p":null,"passageBlocks":null},{"key":"20.234_66","subject":"Equity","subject_id":"Equity","wrong":true,"starred":false,"q":"The average ROE for Lever, Inc., over the last business cycle was 32%. Lever’s earnings\nper share for the coming year is expected to be $5. The dividend payout ratio is 30%,\nand the current book value per share is $14. Shares are trading in the market at $54.\nLever’s normalized earnings per share are closest to:","o":["A. $4.48.","B. $5.00.","C. $5.26."],"a":"A","e":"Only the average ROE and the book value per share are relevant for calculating\nnormalized earnings:\nnormalized earnings = average ROE × BVPS = 0.32 × $14 = $4.48 per share","los":"Module 20.4, LOS 20.e","open":false,"p":null,"passageBlocks":null},{"key":"20.234_72","subject":"Equity","subject_id":"Equity","wrong":true,"starred":false,"q":"Sabrina Valentine, CFA, has gathered the following data for Carolina Steel, Inc. (CSI):<div style=\"margin:1em 0;padding:0.75em 1em;border:1px solid #ddd;border-radius:6px;background:#fafafa\"><table style=\"borde

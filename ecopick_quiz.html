<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ECO 중요 45 + Mock Flag — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.pill.src-try{background:var(--cobalt);color:#fff}
.pill.src-flag{background:var(--bad-soft);color:var(--bad)}
.btn.flag{padding:3px 10px;font-size:13px;margin-left:auto}
.btn.flag.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.catbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* split: vignette left, question right */
body.wide .wrap{max-width:1400px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.split>.card{margin:0}
.split .nav .btn{white-space:nowrap}
.vpane{position:sticky;top:104px;max-height:calc(100vh - 120px);display:flex;flex-direction:column;background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:10px;overflow:hidden}
.vhead{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);border-bottom:1px solid var(--line)}
.vbody{padding:4px 16px 16px;font-size:14.5px;overflow:auto}
.vbody p{margin:.5em 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.vpane{position:static;max-height:46vh}}
</style>
</head>

<script id="quizdata" type="application/json">{"questions": [{"id": "Economics-ECO-M1-Q36", "src": "ECO", "module": 2, "tag": "MTM – base 매도 포지션 청산은 offer, 음수 points", "vig": 0, "stem": "The mark-to-market value for Drawbridge's forward position is closest to:", "opts": {"A": "–USD44,774.", "B": "–USD44,800.", "C": "–USD42,576."}, "ans": "A", "en": "Drawbridge sold AUD 5 million forward at 0.8940 (USD/AUD). To mark to market, it buys AUD 5 million three months forward, paying the offer for both spot and points: 0.9066 − 0.00364 = 0.90296. Settlement cash flow = 5,000,000 × (0.8940 − 0.90296) = −USD44,800 (AUD appreciated). PV at the three-month USD rate: −44,800 / [1 + 0.0023(90/360)] = −USD44,774.", "ko": "AUD를 forward로 팔아 둔 포지션이라 청산하려면 AUD를 사야 합니다(offer). 0.9066 + (−36.4/10,000) = 0.90296. 5,000,000 × (0.8940 − 0.90296) = −44,800을 USD(price) 3개월 금리로 할인하면 −44,774.", "trap": "points가 음수면 spot에서 빼야 한다. offer 쪽 points는 −36.4(절댓값이 작은 쪽)임에 주의.", "f": "V = (F0 − Ft) × 5,000,000 / [1 + i_USD × 90/360] (base 매도 포지션 기준)", "why": {"B": "현재가치로 할인하지 않은 만기 현금흐름입니다.", "C": "청산 거래에 bid(0.9062 − 0.00368 = 0.90252)를 쓴 값입니다. AUD를 사는 거래이므로 offer를 씁니다."}, "orig": "Economics · ECO Module 1 Q36 · Currency Exchange Rates: Understanding Equilibrium Value"}, {"id": "Economics-ECO-M1-Q64", "src": "ECO", "module": 2, "tag": "MTM – base 매수 포지션 청산은 bid, 남은 기간 금리", "vig": null, "stem": "An investor purchases 1 million Canadian Dollars (CAD) for delivery against the Euro in nine months at an all-in forward rate of 1.4301 (EUR/CAD). Three months later, the bid-offer quotes for spot and forward points six months prior to the settlement date are as follows:\nSpot (EUR/CAD)\t1.4011 / 1.4202\n6-month points\t46 / 50\n180-day MRR (EUR) annualized\t2.5%\nNote: EUR/CAD is the amount of EUR per 1 CAD.\nIf the investor wants to close out his position today, the mark-to-market value of the original forward contract is closest to:", "opts": {"A": "EUR –24,099.", "B": "EUR –23,805.", "C": "EUR –4,840."}, "ans": "A", "en": "To close the long CAD position, sell CAD (the base currency) using the bid side: 1.4011 + 46/10,000 = 1.4057. EUR cash flow at settlement = (1.4057 − 1.4301) × 1,000,000 = −EUR24,400. Discount for six months: −24,400 / [1 + 0.025(180/360)] = −EUR24,099.", "ko": "CAD를 산 포지션을 청산하려면 CAD를 팔아야 합니다(base 매도 → bid): 1.4011 + 0.0046 = 1.4057. (1.4057 − 1.4301) × 1,000,000 = −24,400을 EUR(price) 6개월 금리로 할인: −24,400 / 1.0125 = −24,099.", "trap": "1년 금리 그대로(÷1.025) 할인하거나, 청산에 offer를 쓰는 실수.", "f": "V = (Ft − F0) × 1,000,000 / [1 + 0.025 × 180/360] (base 매수 포지션 기준)", "why": {"B": "6개월이 아니라 1년 금리 전체(÷1.025)로 할인한 값입니다. 할인율에 180/360을 곱해야 합니다.", "C": "청산 거래에 offer(1.4202 + 0.0050 = 1.4252)를 쓴 값입니다. CAD를 파는 거래이므로 bid를 씁니다."}, "orig": "Economics · ECO Module 1 Q64 · Currency Exchange Rates: Understanding Equilibrium Value"}, {"id": "Economics-ECO-M1-Q9", "src": "ECO", "module": 2, "tag": "Forward mark-to-market – 남은 기간·price 통화 금리로 할인", "vig": 1, "stem": "Based on Exhibits 1, 2, and 3, the mark-to-market gain for Goldsworthy's forward position is closest to:", "opts": {"A": "GBP 19,971.", "B": "GBP 20,500.", "C": "GBP 21,968."}, "ans": "A", "en": "Marking the nine-month contract to market six months later requires buying GBP/EUR (EUR) three months forward. The three-month forward rate to use is the offer: 0.9471 + 15/10,000 = 0.9486. She sold EUR 5,000,000 at 0.9526 and buys at 0.9486, so the settlement cash flow is 5,000,000 × (0.9526 − 0.9486) = GBP 20,000. Discount for three months at the GBP MRR of 0.58%: 20,000 / [1 + 0.0058 × (90/360)] = GBP 19,971.", "ko": "EUR를 forward로 판 포지션을 청산하려면 남은 3개월짜리로 EUR를 사야 합니다(base 매수 → offer). 0.9471 + 15/10,000 = 0.9486. 만기 현금흐름 5,000,000 × (0.9526 − 0.9486) = GBP 20,000을 GBP(price 통화) 3개월 금리로 할인하면 19,971입니다.", "trap": "① 반대 거래 방향(bid/offer) ② 남은 기간의 forward points ③ price 통화 금리로 남은 기간만큼 할인 – 셋 중 하나만 틀려도 오답.", "f": "V = (F0 − Ft) × 계약규모 / [1 + i_price × (남은 일수/360)]", "why": {"B": "offer spot(0.9471)에 bid points(14)를 붙여 0.9485로 계산하고, 할인도 하지 않은 값입니다.", "C": "bid spot(0.9467)에 offer points(15)를 붙여 0.9482로 계산한 값입니다. spot과 points는 같은 쪽(offer끼리)을 써야 합니다."}, "orig": "Economics · ECO Module 1 Q9 · Currency Exchange Rates: Understanding Equilibrium Value"}, {"id": "Economics-ECO-M1-Q25", "src": "ECO", "module": 2, "tag": "Carry trade 수익률 – offer 환전 + 차입비용 차감", "vig": 2, "stem": "Based on the data in Exhibit 1, the expected net investment return on a one-year carry trade based on the JPY/EUR currency pair, measured in JPY terms, is closest to:", "opts": {"A": "2.86%.", "B": "3.01%.", "C": "3.10%."}, "ans": "A", "en": "Borrow the low-rate JPY at 0.15% and invest in the higher-rate EUR at 1.40%. Borrow JPY and buy USD at JPY 117.66 (offer), then buy EUR at USD 1.0873 (offer): 117.66 × 1.0873 = 127.93 JPY/EUR. One year later: 118.32 × 1.0984 = 129.96. Net return = [(1/127.93) × 1.0140 × 129.96] − [1.0000 × 1.0015] = 1.0301 − 1.0015 = 2.86%.", "ko": "JPY(저금리)를 빌려 EUR(고금리)에 투자합니다. EUR를 사야 하므로 두 번 다 offer로 환전: 117.66 × 1.0873 = 127.93. 1년 뒤 환율은 118.32 × 1.0984 = 129.96. (1/127.93) × 1.014 × 129.96 = 1.0301에서 차입 원리금 1.0015를 빼면 2.86%.", "trap": "① 통화를 살 때는 offer ② 마지막에 차입 이자(0.15%) 차감 – 둘 중 하나라도 빠지면 3.01%나 3.10%.", "f": "Carry 수익 = (1/S0) × (1 + i_invest) × S1 − (1 + i_fund)", "why": {"B": "JPY 차입 이자(0.15%)를 빼지 않은 값입니다. 1.0301 − 1.0000 = 3.01%.", "C": "처음 환전에서 bid로 cross rate(117.62 × 1.0851 = 127.63)를 만든 값입니다. EUR를 살 때는 offer를 씁니다."}, "orig": "Economics · ECO Module 1 Q25 · Currency Exchange Rates: Understanding Equilibrium Value"}, {"id": "Economics-ECO-M2-Q9", "src": "ECO", "module": 2, "tag": "제도 개혁해야 수렴 → Club convergence", "vig": 3, "stem": "The type of convergence described by Klymchuk in Statement 5 is best described as:", "opts": {"A": "club convergence.", "B": "absolute convergence.", "C": "conditional convergence."}, "ans": "A", "en": "Under club convergence, lower-income members of the club converge to the income levels of the richest countries, and countries can join the club by making appropriate institutional changes. Countries outside the club continue to fall behind.", "ko": "'제도를 바꿔야만 부자 나라 수준으로 수렴한다'는 것이 club convergence입니다. 제도 개혁으로 클럽에 들어간 가난한 나라는 빠르게 따라잡고, 클럽 밖의 나라는 계속 뒤처집니다.", "trap": "absolute = 모든 나라가 수렴, conditional = 저축률·인구증가율·생산함수가 같은 나라끼리 수렴, club = 제도 개혁으로 클럽에 들어가야 수렴.", "f": "Club convergence: 비슷한 제도(저축·금융시장·재산권·교육)를 갖춘 클럽 안에서 수렴", "why": {"B": "absolute convergence는 특성과 관계없이 모든 개발도상국이 선진국 수준으로 수렴한다는 가설입니다. 바로 부하 직원의 주장이고, Klymchuk은 이를 반박했습니다.", "C": "conditional convergence는 저축률·인구증가율·생산함수가 같은 나라끼리 수렴한다는 가설입니다. '제도 개혁'이 조건이 아닙니다."}, "orig": "Economics · ECO Module 2 Q9 · Economic Growth"}, {"id": "Quant-ECO-M5-Q2", "src": "ECO", "module": 1, "tag": "로그-선형 추세 예측 (e^ 변환)", "vig": 4, "stem": "Based on Exhibit 1, the predicted WTI oil price for September 2015 using the log-linear trend model is closest to:", "opts": {"A": "$29.75.", "B": "$29.98.", "C": "$116.50."}, "ans": "C", "en": "September 2015 is the first month out of sample, t = 182. ln(price) = 3.3929 + 0.0075(182) = 4.7579, so price = e^4.7579 = $116.50.", "ko": "로그-선형 모형은 ln(y)를 예측하므로 마지막에 반드시 e^로 되돌립니다. t = 182(표본 마지막 181 다음 달).", "trap": "ln 값을 그대로 쓰거나 지수 변환을 빼먹는 실수.", "f": "ln ŷt = b0 + b1t → ŷt = e^(b0 + b1t)", "why": {"A": "로그-선형 식을 잘못 적용한 값입니다. e^(3.3929 + 0.0075 × 182) = 116.50입니다.", "B": "로그-선형 식을 잘못 적용한 값입니다. ln 가격 4.7579를 e^로 변환해야 합니다."}, "orig": "Quant · ECO Module 5 Q2 · Time-Series Analysis"}, {"id": "Quant-ECO-M5-Q93", "src": "ECO", "module": 1, "tag": "ARCH(1) 다음 기 분산 예측", "vig": null, "stem": "An analyst estimates an AR(1) model for the daily returns of a major stock market index, using data from the past year. Denoting the residual from the AR(1) model in time period t as εt, the analyst regresses the squared residual, εt², on its first lag, εt–1², and presents the following results:\n\tCoefficient\tp-Value\nIntercept\t0.0005\t< 0.01\nεt–1²\t0.3000\t< 0.01\nThe AR(1) residual for the last day in the sample period is 0.018755. The predicted variance of the error for the next day is closest to:", "opts": {"A": "0.0005.", "B": "0.0006.", "C": "0.0061."}, "ans": "B", "en": "The ARCH(1) model is εt² = a0 + a1εt–1²: 0.0005 + 0.3000 × 0.018755² = 0.000606 ≈ 0.0006.", "ko": "ARCH(1) 예측 분산 = 절편 + 계수 × (직전 잔차)². 잔차를 반드시 제곱합니다. a1이 유의하므로 절편만 쓰면 안 됩니다.", "trap": "잔차를 제곱하지 않는 실수(0.0061).", "f": "σ̂²t+1 = a0 + a1ε̂²t", "why": {"A": "절편만 쓴 값입니다. a1이 0과 유의하게 다르므로 직전 오차² 항을 더해야 합니다.", "C": "직전 잔차를 제곱하지 않고 곱했습니다(0.0005 + 0.3 × 0.018755)."}, "orig": "Quant · ECO Module 5 Q93 · Time-Series Analysis"}, {"id": "Quant-ECO-M4-Q13", "src": "ECO", "module": 1, "tag": "로지스틱 회귀 – log odds 변화로 확률 계산", "vig": 5, "stem": "Based on the logistic model and with a diverse board, the probability of Tekdat being listed on a US exchange would be closest to:", "opts": {"A": "0.73.", "B": "0.81.", "C": "0.93."}, "ans": "B", "en": "Without a diverse board, P = 0.65, so odds = 0.65/0.35 = 1.8571 and log odds = ln(1.8571) = 0.6190. With gender diversity, the log odds increase by 0.80 to 1.4190. New odds = e^1.4190 = 4.1331, so P = 4.1331/(1 + 4.1331) = 0.8052 ≈ 0.81.", "ko": "로지스틱 회귀 계수는 'log odds'의 변화량입니다. 확률 → odds → ln(odds) → +0.80 → e^ → odds → 확률 순서로 풉니다.", "trap": "odds에 0.8을 더하면(0.73) 틀림. 계수는 ln(odds)에 더함.", "f": "ln[P/(1−P)] 에 b 더하기 → P = odds/(1+odds)", "why": {"A": "odds(1.8571)에 0.8을 더했습니다. 계수 0.8은 odds가 아니라 log odds에 더해야 합니다.", "C": "odds에 0.8을 더한 값(2.6571)을 log odds처럼 지수화했습니다(로그 단계 누락)."}, "orig": "Quant · ECO Module 4 Q13 · Extensions of Multiple Regression"}, {"id": "Quant-ECO-M5-Q74", "src": "ECO", "module": 1, "tag": "두 시계열 모두 단위근 → 공적분이면 유효", "vig": null, "stem": "An analyst estimates a simple linear regression of a time series yt on another time series xt. In which of the following situations could the estimates of the regression test statistics be valid?", "opts": {"A": "Both the dependent variable yt and the independent variable xt have a unit root", "B": "The dependent variable yt has a unit root, but the independent variable xt does not", "C": "The independent variable xt has a unit root, but the dependent variable yt does not"}, "ans": "A", "en": "If both time series have a unit root, we must establish whether they are cointegrated. If they are cointegrated, the error term is covariance stationary and the coefficients and standard errors are consistent, so the test statistics are valid. If only one series has a unit root, the error term is not covariance stationary and the results would be spurious.", "ko": "하나만 단위근 → 항상 무효. 둘 다 단위근 → 공적분이면 유효할 '수 있음'. 'could be valid'를 물었으므로 둘 다 단위근인 경우가 답입니다.", "trap": "'둘 다 단위근'이 가장 나빠 보이지만, 공적분 가능성 때문에 유일하게 유효할 수 있는 경우.", "f": "Cointegrated → 회귀 잔차 stationary → 회귀 유효", "why": {"B": "종속변수만 단위근 → 오차항이 stationary가 아니어서 계수·표준오차가 inconsistent(가짜 회귀)합니다.", "C": "독립변수만 단위근 → 오차항이 stationary가 아니어서 회귀를 쓸 수 없습니다."}, "orig": "Quant · ECO Module 5 Q74 · Time-Series Analysis"}, {"id": "CorpIssuer-ECO-M1-Q51", "src": "ECO", "module": 3, "tag": "Target payout adjustment model", "vig": null, "stem": "An analyst gathers the following information about a company with a stable dividend policy:\nPrevious year's EPS\t$2.00\nPrevious year's payout ratio\t30%\nCurrent year's expected EPS\t$2.50\nTarget payout ratio\t36%\nIf the company uses a 3-year period to adjust its dividends, the expected increase in the current year dividend per share should be:", "opts": {"A": "$0.10.", "B": "$0.20.", "C": "$0.30."}, "ans": "A", "en": "A is correct because Expected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor, where the adjustment factor is equal to 1 / Number of years to adjust dividends. In this case:\nAdjustment factor = 1/3\nExpected increase in dividends = (2.50 × 36% − 2.00 × 30%) × 1/3 = 0.10 = $0.10\nB is incorrect because it assumes that the adjustment towards the target payout ratio is done linearly over time. Since the difference between the target payout ratio and current payout ratio is 36% − 30% = 6%, the annual equal adjustment over the three-year period will be 6% / 3 = 2%. Therefore, this year's payout ratio is expected to be current payout ratio + 2%, that is 30% + 2% = 32%. Finally:\nExpected increase in dividends = (Expected earnings × This year's target payout ratio − Previous dividend) = (2.50 × 32% − 2 × 30%) = 0.20 = $0.20\nC is incorrect because this calculation overlooks the adjustment factor. In that case:\nExpected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) = (2.50 × 36% − 2 × 30%) = 0.30 = $0.30", "ko": "이전 배당 = 2.00 × 30% = 0.60. 증가액 = (2.50 × 36% − 0.60) × 1/3 = (0.90 − 0.60) / 3 = $0.10.", "trap": "조정계수 1/n을 곱한다. payout 비율을 매년 2%p씩 올리는 식으로 계산하지 않는다.", "f": "ΔD = (기대 EPS × 목표 payout − D0) × (1 / 조정 연수)", "why": {"B": "목표 배당성향까지 비율을 매년 똑같이(30% → 32%) 올린다고 본 오류입니다. 모델은 금액 차이에 1/3을 곱합니다.", "C": "조정계수(1/3)를 빼먹은 값입니다."}, "orig": "CorpIssuer · ECO Module 1 Q51 · Analysis of Dividends and Share Repurchases"}, {"id": "CorpIssuer-ECO-M1-Q57", "src": "ECO", "module": 3, "tag": "Agency 문제(과잉투자) 완화 → 현금배당", "vig": null, "stem": "Which of the following would best constrain management's ability to overinvest by taking on negative NPV projects?", "opts": {"A": "Increase stock dividends", "B": "Increase internally financed cash dividends", "C": "Set minimum levels of EBITDA coverage of interest charges as a condition for paying dividends"}, "ans": "B", "en": "A is incorrect because to prevent potential overinvestment agency problems the company should increase cash dividends, not stock dividends. From a company’s perspective, the key difference between a stock dividend and a cash dividend is that a cash dividend affects a company’s capital structure, whereas a stock dividend has no economic impact on a company. Cash dividends reduce assets (because cash is being paid out) and shareholders’ equity (by reducing retained earnings), while stock dividends do not. Therefore, by increasing stock dividends any free cash will remain available to managers for potential overinvestment in negative NPV projects.\nB is correct because one managerial incentive of particular concern is the potential private benefit managers may obtain from investment in negative net present value (NPV) projects. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.\nC is incorrect because all else equal, both dividends and share repurchases increase the default risk of debt. Reflecting bondholders’ concern, the bond indenture (contract) often includes a covenant restricting distributions to shareholders that might impair the position of bondholders. Covenants that specify minimum levels of EBITDA and/or EBIT coverage of interest charges are frequently used. Therefore, covenants are designed to protect bondholders rather than alleviating potential overinvestment agency problems.", "ko": "경영진이 NPV < 0 프로젝트에 돈을 쓰는(empire building) 문제는 잉여현금을 현금배당으로 내보내면 줄어듭니다.", "trap": "주식배당은 현금이 안 나가 과잉투자 억제 효과 없음. 커버넌트는 채권자 보호 장치.", "f": "", "why": {"A": "주식배당은 현금이 빠져나가지 않아 경영진이 쓸 수 있는 현금이 그대로입니다.", "C": "이자보상 조건 같은 커버넌트는 주주-채권자 갈등에서 채권자를 보호하는 장치이지 과잉투자 억제 수단이 아닙니다."}, "orig": "CorpIssuer · ECO Module 1 Q57 · Analysis of Dividends and Share Repurchases"}, {"id": "CorpIssuer-ECO-M4-Q13", "src": "ECO", "module": 3, "tag": "CTA: 중앙값 P/E로 적정 인수가", "vig": null, "stem": "An analyst gathers the following information in conducting comparable transaction analysis of an acquisition. For her analysis, she uses the median of valuation ratios from three recently closed comparable acquisitions.\nValuation Variable\tAcquired Company 1\tAcquired Company 2\tAcquired Company 3\nAcquisition share price\t$30\t$40\t$50\nEPS\t$2.50\t$2.20\t$3.00\nIf the target company had an EPS of $2.50 and was acquired at a price of $40 per share, the analyst should conclude that the acquirer:", "opts": {"A": "underpaid for this transaction.", "B": "paid fair value for this transaction.", "C": "overpaid for this transaction."}, "ans": "A", "en": "A is correct because the P/E ratio for the three companies is $30/$2.50 = 12 for Company 1, $40/$2.20 = 18.2 for Company 2 and $50/$3.00 = 16.7 for Company 3. The median of these three ratios is 16.7 and the estimated fair takeover value is 16.7 × $2.5 = $41.75. Compared to an acquisition price of $40, the acquirer underpaid for this transaction.\nB is incorrect because as demonstrated in the correct answer, the acquirer underpaid for this transaction.\nC is incorrect because as demonstrated in the correct answer, the acquirer underpaid for this transaction.", "ko": "거래 P/E: 30/2.50 = 12, 40/2.20 = 18.2, 50/3.00 = 16.7 → 중앙값 16.7. 적정 인수가 = 16.7 × 2.50 = $41.75 > 실제 $40 → 덜 지불(underpaid).", "trap": "중앙값은 '배수'의 중앙값(16.7). 가격 $40의 중앙값과 같다고 fair라고 보면 함정.", "f": "적정가 = 중앙값(거래가/EPS) × 타깃 EPS", "why": {"B": "인수가격 $40이 비교 거래 가격의 중앙값과 같아 보일 뿐, 배수 기준 적정가는 $41.75입니다.", "C": "적정가($41.75)보다 낮게 샀으므로 과다 지불이 아닙니다."}, "orig": "CorpIssuer · ECO Module 4 Q13 · Corporate Restructuring"}, {"id": "FSA-ECO-M1-Q26", "src": "ECO", "module": 4, "tag": "Equity method – 기말 장부가", "vig": 6, "stem": "Using only the information from Exhibit 2, the carrying value of Topmaker’s investment in Rainer at the end of 2016 is closest to:", "opts": {"A": "$282 million.", "B": "$317 million.", "C": "$321 million."}, "ans": "B", "en": "B is correct. The carrying value of Topmaker’s investment in Rainer using the equity method is $317 million and is calculated as:\n\n \t$ Millions\nPurchase price\t$300\nPlus: Topmaker’s share of Rainer’s net income (15% x $360)\t54\nLess: Dividends received (15% x $220)\t33\nLess: Amortization of excess purchase price attributable to plant and equipment (15% x ($3,160 – $2,900))) / 10 years\t3.9\nInvestment in associate (Rainer) at the end of 2016\t$317.1", "ko": "기말 투자계정 = 취득가 + 지분 순이익 − 수령 배당 − 초과취득가 상각. P&E 초과분 39는 10년 상각 → 연 3.9 차감. 300 + 54 − 33 − 3.9 = 317.1.", "trap": "321은 초과분 상각 누락, 282는 초과분 39 전액을 한 해에 차감한 실수입니다.", "f": "Investment(t) = Cost + %×NI − %×Div − %×(FV−BV)/잔존연수", "why": {"A": "P&E 초과분 39 전체를 한 해에 차감한 값입니다. 10년 정액 상각이므로 연 3.9만 차감합니다.", "C": "초과취득가 상각(3.9)을 빼지 않은 값(300 + 54 − 33 = 321)입니다."}, "orig": "FSA · ECO Module 1 Q26 · Intercorporate Investments"}, {"id": "FSA-ECO-M1-Q33", "src": "ECO", "module": 4, "tag": "Equity vs Consolidation – ROE(기초자본)", "vig": 7, "stem": "Based on Byron’s forecast, NinMount’s 2019 return on beginning equity most likely will be the same under:", "opts": {"A": "either of the consolidations, but different under the equity method.", "B": "the equity method, consolidation with full goodwill, and consolidation with partial goodwill.", "C": "none of the equity method, consolidation with full goodwill, or consolidation with partial goodwill."}, "ans": "A", "en": "A is correct. Net income attributable to shareholders of the parent is the same using any of the choices. Beginning equity under the equity method is £1,430. Under either of the consolidations, beginning equity is £1,750 since it includes the £320 noncontrolling interest. Return on beginning equity is highest under the equity method.", "ko": "지배주주 귀속 NI는 세 방법 모두 동일. 분모: equity method 1,430, 연결(full/partial)은 NCI 320 포함 1,750. Goodwill이 0이라 full=partial → 두 연결은 같고 equity method만 다름(더 높음).", "trap": "'NI가 같으니 ROE도 같다'(B) — 분모에 NCI가 포함되는지 꼭 확인하세요.", "f": "", "why": {"B": "NI는 같아도 분모(기초자본)가 다릅니다. 연결은 NCI 320이 자본에 포함되어 1,750, equity method는 1,430입니다.", "C": "Goodwill이 0이므로 full과 partial의 자본(NCI)은 같습니다 → 두 연결 방법의 ROE는 동일합니다."}, "orig": "FSA · ECO Module 1 Q33 · Intercorporate Investments"}, {"id": "FSA-ECO-M3-Q24", "src": "ECO", "module": 4, "tag": "Temporal method – RE 환산", "vig": 8, "stem": "After translating Consol-Can’s 31 December 20X2 balance sheet into the parent company’s currency (US$), the translated value of retained earnings will be closest to:", "opts": {"A": "$41 million.", "B": "$44 million.", "C": "$46 million."}, "ans": "B", "en": "B is correct. Translating the 20X2 balance sheet using the temporal method, as is required in this instance, results in assets of US$369 million. The translated liabilities and common stock are equal to US$325 million, meaning that the value for 20X2 retained earnings is US$369 million − US$325 million = US$44 million.\n\nTemporal Method (20X2)\nAccount\tC$\t \tRate\t \tUS$\nCash\t135\t \t0.95\t \t128\nAccounts receivable\t98\t \t0.95\t \t93\nInventory\t77\t \t0.92\t \t71\nFixed assets\t100\t \t0.86\t \t86\nAccumulated depreciation\t(10)\t \t0.86\t \t(9)\nTotal assets\t400\t \t \t \t369\nAccounts payable\t77\t \t0.95\t \t73\nLong-term debt\t175\t \t0.95\t \t166\nCommon stock\t100\t \t0.86\t \t86\nRetained earnings\t48\t \tto balance\t \t44\nTotal liabilities and shareholders’ equity\t400\t \t \t \t369", "ko": "Consol-Can 기능통화 = USD(모회사 통화) → temporal. 자산 369(현금·AR·AP·LTD는 0.95, 재고 0.92, 고정자산 0.86) − 부채 239 − 자본금 86 = RE 44.", "trap": "Current rate로 모두 환산하면 다른 값이 나옵니다. 기능통화부터 확인하세요.", "f": "", "why": {"A": "일부 항목(재고·고정자산 등)에 잘못된 환율을 적용한 값입니다. Temporal 규칙: 화폐성 = 0.95, 재고 = 0.92, 고정자산·자본금 = 0.86.", "C": "화폐성/비화폐성 구분을 잘못 적용한 값입니다. RE는 자산 369 − 부채 239 − 자본금 86 = 44."}, "orig": "FSA · ECO Module 3 Q24 · Multinational Operations"}, {"id": "FSA-ECO-M3-Q25", "src": "ECO", "module": 4, "tag": "기능통화 변경 근거", "vig": 8, "stem": "In response to the board’s first question, Templeton would most likely reply that such a change would be justified if:", "opts": {"A": "the inflation rate in the United States became hyperinflationary.", "B": "management wanted to flow more of the gains through net income.", "C": "Consol-Can were making autonomous decisions about operations, investing, and financing."}, "ans": "C", "en": "C is correct. The Canadian dollar would be the appropriate reporting currency when substantially all operating, financing, and investing decisions are based on the local currency. The parent country’s inflation rate is never relevant. Earnings manipulation is not justified, and at any rate changing the functional currency would take the gains off of the income statement.", "ko": "기능통화 = 주된 경제환경의 통화. 자회사가 영업·투자·재무 결정을 현지통화 기반으로 자율적으로 내리면 CAD로 변경이 정당합니다. 모회사 국가 인플레이션은 무관하고, 이익조작 목적의 변경은 불가.", "trap": "초인플레이션은 '자회사 소재국'일 때 의미 있음 — 모회사(미국) 인플레이션은 무관.", "f": "", "why": {"A": "초인플레이션 판단은 자회사 소재국 기준 — 모회사(미국) 인플레이션은 기능통화 선택과 무관합니다.", "B": "이익 조작 목적의 기능통화 변경은 불가하며, CAD로 바꾸면 오히려 환산손익이 NI에서 빠집니다(OCI)."}, "orig": "FSA · ECO Module 3 Q25 · Multinational Operations"}, {"id": "FSA-ECO-M3-Q58", "src": "ECO", "module": 4, "tag": "FX가 매출 증가에 미친 영향", "vig": 9, "stem": "Using Exhibits 1, 2, and 3 and Lars’s notes about the US operations, the change in sales reported for the US region (in SEK millions) explained by the change in the SEK/USD exchange rate in 2015 is closest to:", "opts": {"A": "SEK737.", "B": "SEK813.", "C": "SEK1,432."}, "ans": "A", "en": "Correct. The number of stores in the United States is the same in 2014 and 2015 (80). The average sales per US store in 2014 is the same as the Swedish stores, and the USD sales are the same in both years. But when sales are converted into SEK, the values reflect the change in the exchange rate over the period.\nCalculations\tSEK (millions)\nNumber of stores in the United States (Exhibit 1)\t80\t---\nAverage sales/US store in 2014 (same as the Swedish stores in 2014)\tSEK4,653/99 stores =\t47/Store\nSales/US store (in USD millions) based on average exchange rate in 2014\t(SEK47/Store)/(SEK6.350/USD) = USD7.40/Store\t---\nTotal USD sales (in USD millions) in 2014 and 2015 (same both years in USD)\t80 stores × (USD7.40/Store) = USD592.13\t---\nTotal USD sales in 2014 in SEK\tUSD592.13 × (SEK6.350/USD) =\t3,760\nSales in USD in 2015 (the same as 2014), converted at the 2015 average rate\tUSD592.13 × (SEK7.595/USD) =\t4,497\nIncrease in sales because of change in exchange rate\t737", "ko": "US 매장당 매출(2014) = 스웨덴 매장과 동일 4,653/99 = 47 SEK → USD 47/6.35 × 80 = USD 592.1 (2015도 동일). FX 효과 = 592.1 × (7.595 − 6.35) = 737.", "trap": "매출은 평균환율로 환산(기말환율 쓰면 1,432), 기준은 스웨덴(모회사) 매장(전체 평균 쓰면 813).", "f": "FX 효과 = USD 매출 × (평균환율t − 평균환율t−1)", "why": {"B": "Incorrect. It uses the average sales overall, not the Swedish ones to determine sales level.\nNumber of stores in the United States\t80\t---\nAverage sales/US store (in millions SEK) is the same as total stores in 2014\tIn 2014: SEK26,892/519 store = SEK51.815/store\t(the error)\nSales/US store (in millions USD)\nbased on average exchange rate in 2014\tSEK51.815/store/6.35 SEK/USD = $8.160/store\t---\nTotal USD sales (in millions USD) in 2014 and 2015 (same both years in USD)\t80 store × 8.160 USD/store = 652.79 USD\t---\nTotal USD sales in 2014 (in millions SEK)\t652.79 USD × 6.350 SEK/USD\tSEK4,145\nSales in USD in 2015 (the same as 2014)\nConverted at the 2015 average rate\t652.79 USD × 7.595 SEK/USD\tSEK4,958\nIncrease in sales (in millions) due to change in exchange rate\tSEK813", "C": "Incorrect. It uses year-end rates instead of average rates to convert sales\nNumber of stores in United States\t80\t---\nAverage sales/US store (in millions SEK)\n(same as the Swedish stores in 2014)\tIn 2014: SEK4,653/99 stores = SEK47/store\t---\nSales/US store (in millions USD)\nbased on ending exchange rate in 2014\tSEK47/store/6.380 SEK/USD = $7.367\t(the error)\nTotal USD sales (in millions USD) in 2014\t80 stores × $7.367/store = $589.36\t---\nTotal USD sales in 2014 (in millions SEK)\t$589.36 × 6.380 SEK/USD\tSEK3,760\nSales in USD in 2015 (the same as 2014)\nConverted at the 2015 closing rate (the error)\t$589.36 USD × 8.810 SEK/USD\tSEK5,192\nIncrease in sales (in millions) due to change in exchange rate\tSEK1,432"}, "orig": "FSA · ECO Module 3 Q58 · Multinational Operations"}, {"id": "FSA-ECO-M2-Q8", "src": "ECO", "module": 4, "tag": "IFRS service cost = current + past", "vig": 10, "stem": "The amount recognized by XYZ as operating expense on the income statement related to its DB plan for fiscal year 2024 is closest to:", "opts": {"A": "200.", "B": "320.", "C": "1,000."}, "ans": "B", "en": "B is correct. Service cost, comprising current and past service costs of 200 and 120, respectively, is recognized on the income statement as an operating expense.", "ko": "IFRS: service cost = current(200) + past(120) = 320, 전부 즉시 P&L 영업비용. Employer contribution 1,000은 현금 항목입니다.", "trap": "Past service cost를 빼먹는 실수 — IFRS는 즉시 비용화, US GAAP은 OCI 인식 후 상각.", "f": "IFRS P&L pension cost = Service cost(current + past) + Net interest", "why": {"A": "200은 current service cost만입니다. IFRS는 past service cost(120)도 즉시 P&L에 인식합니다.", "C": "1,000은 employer contribution(현금 납부액)으로 비용이 아닙니다."}, "orig": "FSA · ECO Module 2 Q8 · Employee Compensation"}, {"id": "FSA-ECO-M2-Q17", "src": "ECO", "module": 4, "tag": "RSU 희석 – Treasury stock method", "vig": 11, "stem": "SKI reported basic shares outstanding of 270,400,000 and positive net income on its income statement for the year ended 31 December 20X2. Besides unvested RSUs, SKI had no other potentially dilutive securities outstanding. Assuming an average share price of SGD 71.50 for the year, diluted shares outstanding for the year ended 31 December 20X2 is closest to:", "opts": {"A": "273,284,585.", "B": "275,695,075.", "C": "279,341,928."}, "ans": "B", "en": "B is correct. Diluted shares outstanding is computed using the treasury stock method, where unvested RSUs are added to basic shares outstanding, net of assumed repurchases which is based on the average unrecognized share-based compensation expense and average prevailing market price for the shares.\n\nBasic shares outstanding:\t270,400,000\nPlus: Unvested RSUs of\t9,341,928\nMinus: Average unrecognized share-based compensation expense of (145.6 + 433.1 million)/2 = 289.350 million / average share price of 71.50 =\t4,046,853\nDiluted shares outstanding:\t275,695,075", "ko": "Diluted shares = basic + 미가득 RSU − (평균 미인식 보상비용 ÷ 평균주가). 270.4m + 9.342m − (289.35m ÷ 71.50 = 4.047m) = 275.695m.", "trap": "TSM 차감 누락(279.3m) 또는 기말 미인식 비용만 사용하는 실수.", "f": "Dilutive shares = Unvested RSUs − Avg unrecognized SBC / Avg price", "why": {"A": "기말 미인식 비용(433.1m)만 사용한 값입니다. TSM은 '평균' 미인식 비용((145.6 + 433.1)/2)을 씁니다.", "C": "TSM 재매입 차감 없이 미가득 RSU 전체를 더한 값입니다."}, "orig": "FSA · ECO Module 2 Q17 · Employee Compensation"}, {"id": "Equity-ECO-M3-Q65", "src": "ECO", "module": 5, "tag": "FCFF → FCFE (net borrowing 음수)", "vig": 12, "stem": "Assuming 2012 FCFF equals $500 million, McLaughlin’s FCFE ($ millions) for 2012 is closest to:", "opts": {"A": "$114.", "B": "$174.", "C": "$574."}, "ans": "B", "en": "(A) Incorrect. It ignores tax adjustment for interest expense.\nFCFE = 500 – 186 + (–200) = $114 million\n(B) Correct.\nFCFE = FCFF – Interest (1 – T) + Net borrowing\nGiven: 2012 FCFF base case estimate = $500; Interest expense = $186; Tax rate = 32%\n2012\t2011\tNet increase\nLong-term debt ($)\t2,249\t2,449\t–200\nFCFE = 500 – 186 × (1 – 0.32) + (–200) = $174 million\n(C) Incorrect. It switches the sign for net borrowing\nFCFE = 500 – 186 × (1 – 0.32) + 200 = $574 million", "ko": "FCFE = FCFF − Int(1 − t) + Net borrowing = 500 − 186×0.68 + (2,249 − 2,449 = −200) = $174M.", "trap": "부채 감소 = 음(−)의 net borrowing.", "f": "FCFE = FCFF − Int(1 − t) + Net borrowing", "why": {"A": "$114M은 이자를 세후로 조정하지 않은 값입니다(500 − 186 − 200).", "C": "$574M은 순차입의 부호를 반대로(+200) 쓴 오류입니다. 부채 상환은 FCFE를 '감소'."}, "orig": "Equity · ECO Module 3 Q65 · Free Cash Flow Valuation"}, {"id": "Equity-ECO-M3-Q63", "src": "ECO", "module": 5, "tag": "2-stage FCFE – 시점 처리", "vig": 13, "stem": "According to the approach preferred by Bahrami and using the estimates developed by him in Exhibit 4, the value of FDF’s equity as of the previous year end is closest to:", "opts": {"A": "$8,554,891.", "B": "$8,793,104.", "C": "$12,755,292."}, "ans": "B", "en": "(A) Incorrect. The mistakes are in treating the FCFE for the current year as if it were for the previous year and the associated timing differences.\nCash flow from operations (CFO) for the current year\t1,000,000\nLess: Investment in fixed capital\t(400,000)\nPlus: Net borrowing\t250,000\nFree cash flow to equity (FCFE) )mistakenly taken for the previous year )\t850,000\nFCFEcurr yr +2 = 850,000 × 1.102 × 1.06 = 1,090,210\nTVcurr yr +1 = 1,090,210/(0.16 – 0.06) = 10,902,100\nVprev yr = (850,000 × 1.10)/1.16 + (850,000 × 1.102)/1.162 + 10,902,100/1.163\n= 806,034 + 764,343 + 6,984,514\n= 8,554,891\n(B) Correct.\nCalculation of the current year's FCFE and Value of Equity at the End of the previous year\nCash flow from operations (CFO) for current year\t$1,000,000\nLess: investment in fixed capital\t–400,000\nPlus: net borrowing\t250,000\nFree cash flow to equity (FCFEcurr yr)\t$850,000\nFCFEcurr yr +1 = FCFEcurr yr × 1.10 = 850,000 × 1.10\t935,000\nFCFEcurr yr +2 = FCFEcurr yr +1 × 1.06 = 935,000 × 1.06\t991,100\nUsing a two-stage model:\nTVcurr yr + 1 = 991,100/(0.16 – 0.06) = 9,911,000\nVprev yr = 850,000/1.16 + 935,000/1.162 + 9,911,000/1.162\n= 732,759 + 694,857 + 7,365,488 =\t8,793,104\n(C) Incorrect. The mistake is in using WACC for discount rate, instead of the required return on equity.\nCash flow from operations (CFO) for the current year end\t1,000,000\nLess: Investment in fixed capital\t(400,000)\nPlus: Net borrowing\t250,000\nFree cash flow to equity (FCFE) for the current year end\t850,000\nFCFEcurr yr +2 = 850,000 × 1.10 × 1.06 = 991,100\nTVcurr yr +1 = 991,100/(0.129 – 0.06) = 14,363,768\nVprev yr = 850,000/1.129 + (850,000 × 1.10)/1.1292 + 12,388,750/1.1292\n= 752,879 + 733,540 + 11,268,873\n= 12,755,292", "ko": "FCFE(당해) = CFO 1,000,000 − FCInv 400,000 + 차입 250,000 = 850,000. 다음해 = 935,000(10%), 그 다음 = 991,100(6%). TV(다음해 말) = 991,100/(0.16 − 0.06) = 9,911,000. V(전년도 말) = 850,000/1.16 + (935,000 + 9,911,000)/1.16² = $8,793,104.", "trap": "평가 시점(전년도 말) 기준 당해 FCFE = 1기 현금흐름. FCFE ↔ r_e, FCFF ↔ WACC.", "f": "V0 = Σ FCFE_t/(1+r)^t + TV/(1+r)^n", "why": {"A": "당해 FCFE를 전년도 값으로 취급해 한 기간씩 밀린 타이밍 오류입니다.", "C": "FCFE를 WACC로 할인한 오류입니다. FCFE는 자기자본비용(16%)으로 할인."}, "orig": "Equity · ECO Module 3 Q63 · Free Cash Flow Valuation"}, {"id": "Equity-ECO-M3-Q69", "src": "ECO", "module": 5, "tag": "FCF vs DDM, FCFF vs FCFE 선택", "vig": 12, "stem": "Which of Nicosia’s three statements pertaining to McLaughlin’s valuation is the most accurate? Statement:", "opts": {"A": "1", "B": "2", "C": "3"}, "ans": "A", "en": "(A) Correct. Nicosia’s first statement is correct. Analysts should use a FCFE valuation whenever dividends differ significantly from the company’s capacity to pay dividends or when a change of control is anticipated. A FCFF valuation is preferred over a FCFE valuation whenever the capital structure is unstable or ever-changing. So, Nicosia’s first statement is correct, and her second and third statements are incorrect.\n(B) Incorrect. Analysts should use free cash flow to equity valuation whenever dividends differ significantly from the company’s capacity to pay dividends. FCFF valuation is preferred over FCFE valuation whenever the capital structure is unstable or ever-changing.\n(C) Incorrect. With control comes discretion over the uses of free cash flow, as does the capacity to change dividend levels. As such, a free cash flow valuation approach is likely to be superior to a discounted dividend valuation approach.", "ko": "Statement 1 정확: 배당이 FCFE(배당 지급 능력)와 크게 다르면 FCF 접근이 DDM보다 우월합니다.", "trap": "불안정 자본구조 → FCFF / 배당 ≠ 지급능력 or 지배 관점 → FCF.", "f": "", "why": {"B": "Statement 2 오류: 자본구조가 불안정하면 FCFF가 FCFE보다 우월합니다.", "C": "Statement 3 오류: 지배권 변경 시에는 FCF 접근이 우월합니다(배당 결정권 확보)."}, "orig": "Equity · ECO Module 3 Q69 · Free Cash Flow Valuation"}, {"id": "Equity-ECO-M5-Q84", "src": "ECO", "module": 5, "tag": "Single-stage RI – 내재 성장률", "vig": null, "stem": "An analyst gathers the following information about a company:\nCurrent stock price\t$24.50\nCurrent book value per share\t$10.50\nCost of equity\t7.2%\nLong-term ROE\t11.0%\nUsing a single-stage residual income model, the implied long-term growth rate in the company's residual income is closest to:", "opts": {"A": "4.35%.", "B": "5.57%.", "C": "6.93%."}, "ans": "A", "en": "(A) Correct because the implied long-term growth rate in the residual income is calculated using: P0 = B0 + [(ROE – r)/(r – g)] × B0, where B0 is the current book value per share, ROE is the return on equity, r is the cost of equity, and g is the implied growth rate of residual income. This implies:\ng = r – (ROE – r)/[(P0 – B0)/B0]\n= 0.072 – (0.11 – 0.072)/[($24.50 – $10.50)/$10.50]\n= 4.35%\n(B) Incorrect because the implied long-term growth rate in the residual income is calculated using an incorrect equation: P0 = [(ROE – r)/(r – g)] × B0. This incorrect equation implies:\ng = r – (ROE – r)/(P0/B0)\n= 0.072 – (0.11 – 0.072)/($24.50/$10.50)\n= 5.57%\n(C) Incorrect because the implied long-term growth rate in the residual income is calculated using an incorrect equation: P0 = B0 + (ROE – r)/(r – g). This incorrect equation implies:\ng = r – (ROE – r)/(P0 – B0)\n= 0.072 – (0.11 – 0.072)/($24.50 – $10.50)\n= 6.93%", "ko": "P0 = B0 + (ROE − r)B0/(r − g) → g = r − (ROE − r)/[(P0 − B0)/B0] = 0.072 − 0.038/(14/10.5) = 4.35%.", "trap": "", "f": "g = r − (ROE − r)·B0/(P0 − B0)", "why": {"B": "5.57%는 B0를 빼지 않은 식(P0 = (ROE − r)B0/(r − g))으로 푼 값입니다.", "C": "6.93%는 (P0 − B0)를 B0로 나누지 않은 식으로 푼 값입니다."}, "orig": "Equity · ECO Module 5 Q84 · Residual Income Valuation"}, {"id": "Equity-ECO-M6-Q24", "src": "ECO", "module": 5, "tag": "Normalized earnings 조정 (세후)", "vig": 14, "stem": "The total additional adjustment (in USD) needed to normalize Horzak’s previous year net income in the event of a takeover is closest to:", "opts": {"A": "385,000.", "B": "550,000.", "C": "595,000."}, "ans": "A", "en": "(A) Correct because the excessive Board remuneration is an above-market expense whose excess over the normal rate of remuneration needs to be added to reported net income, while the free use of storage facilities is a benefit that requires a deduction from net income to reflect its normal market cost. Earnings normalization in private companies seeks to adjust for anomalies such as under- or over- reporting of earnings arising from noneconomic or non-recurring factors, in order to establish a baseline for forecasting future earnings under new ownership. These anomalies can include executive remuneration that deviates significantly from market practice, private use by executives of the companies’ assets, or free use of personal assets by the company.\nNew ownership of Horzak Digital would likely cut executive remuneration to the market rate, bringing about an increase in net income of USD 700,000 (USD 1.5 million less USD 0.8 million). Likewise, under new ownership, the CEO is unlikely to want to continue to provide free use of storage facilities in property he personally owns, resulting in a loss of USD 150,000.  Combining these two adjustments results in a pre-tax gain of USD 550,000. Accounting for a 30% tax rate results in a total adjustment to net income of USD 385,000 [=550,000 × (1-30%)].\n(B) Incorrect because this response does not taken into account the 30% tax rate and has adjusted the pre-tax amount to net income.\n(C) Incorrect because this response has made an incorrect adjustment for the free storage costs, by adding them back instead of subtracting them. Adding USD 700,000 and USD 150,000 equals USD 850,000, which, after adjusting for a tax rate of 30%, is USD 595,000.", "ko": "과다 이사회 보수 1.5M − 0.8M = +0.7M(가산), 사장 소유 창고 무상사용 −0.15M(시장비용 차감) → 세전 +0.55M → 세후 0.55 × (1 − 0.30) = USD 385,000.", "trap": "과다 비용 → 가산, 무상 혜택 → 시장비용만큼 차감, 그다음 세후 환산.", "f": "", "why": {"B": "550,000은 세전 금액입니다. 순이익 조정은 세후.", "C": "595,000은 창고 비용을 차감하지 않고 더하는 등 방향을 잘못 처리한 값입니다."}, "orig": "Equity · ECO Module 6 Q24 · Private Company Valuation"}, {"id": "Equity-ECO-M6-Q48", "src": "ECO", "module": 5, "tag": "DLOC + DLOM 결합 (곱셈)", "vig": null, "stem": "An investor considers purchasing a non-controlling minority interest in a private company whose shares have not traded recently. The private company's closest comparable public company is trading at €60.00 per share and the appropriate at-the-money put option premium on shares of the public company is €7.50. Assuming a control premium of 20%, the estimated total discount due to lack of control and lack of marketability is closest to:", "opts": {"A": "27.1%.", "B": "29.2%.", "C": "30.0%."}, "ans": "A", "en": "(A) Correct because a discount for lack of control (DLOC) involves a deduction from the pro rata share of 100% of the value of an equity interest to reflect the absence of some or all powers of control.\nA discount for lack of marketability (DLOM) is a deduction from an ownership interest’s value to reflect the relative absence (compared with publicly traded companies) of a liquid market for a company’s shares.\nLack of marketability discounts are frequently applied in the valuation of non-controlling equity interests in private companies. Although a DLOM differs from a DLOC, they are often linked; that is, if a valuation is on a non-controlling interest basis, a lack of marketability discount is typically appropriate.\nOption-based approaches seek to quantify DLOMs using the right to sell shares as captured by a put option premium. This premium is used to quantify the ability to sell at a given price. As a first step, an at-the-money put option is priced. The put option premium as a percentage of the stock value provides an estimate of the DLOM.\nThe DLOC is 1 – [1/(1 + Control premium)] = 1 – [1/(1 + 0.2)] = 1 – [1/1.2] ≈ 1 – 0.833 = 0.167 = 16.7%. The DLOM is €7.50/€60.00 = 0.125 = 12.5%. The total discount for lack of control and lack of marketability is therefore 1 – [(1 – 0.167) × (1 – 0.125)] ≈ 0.271 = 27.1%.\n(B) Incorrect because in this answer the DLOC and DLOM are simply being added together: 16.7% + 12.5% = 29.2%.\n(C) Incorrect because the control premium is being used as the DLOC. Therefore, the incorrect DLOC is 20%. The DLOM is €7.50/€60.00 = 12.5%. The total discount for lack of control and lack of marketability is therefore 1 – [(1 – 0.200) × (1 – 0.125)] = 0.300 = 30.0%.", "ko": "DLOC = 1 − 1/(1 + 20%) = 16.7%. DLOM = 풋옵션 프리미엄/주가 = 7.50/60 = 12.5%. 총할인 = 1 − (1 − 0.167)(1 − 0.125) = 27.1%.", "trap": "DLOC ≠ control premium. DLOC = 1 − 1/(1 + CP). 총할인 = 1 − (1 − DLOC)(1 − DLOM).", "f": "Total discount = 1 − (1 − DLOC)(1 − DLOM)", "why": {"B": "29.2%는 두 할인을 더한 값(16.7% + 12.5%)입니다. 할인은 곱셈으로 결합.", "C": "30.0% = 1 − (1 − 0.20)(1 − 0.125) — control premium 20%를 DLOC로 그대로 쓴 오류입니다. DLOC는 16.7%."}, "orig": "Equity · ECO Module 6 Q48 · Private Company Valuation"}, {"id": "FixedIncome-ECO-M4-Q34", "src": "ECO", "module": 6, "tag": "Rating migration → 1년 기대수익률", "vig": 15, "stem": "Assuming no change in market conditions and a flat yield curve and using Exhibit 2, the expected return on Cromwell’s sample bond over a one-year horizon is closest to:", "opts": {"A": "–1.73%.", "B": "3.28%.", "C": "6.73%."}, "ans": "B", "en": "(A) Incorrect because it does not consider the coupon payment: 3.275% – 5.00% = –1.725%.\n(B) Correct. The bond is expected to be downgraded from A+ to A–. The G-spread is expected to widen from 0.85% to 1.10% based on market pricing. The expected return over a one-year horizon is, therefore,\n[–Duration × (New spread – Initial spread)] + Annual Coupon =\n[–6.9 × (1.10% – 0.85%)] + 5.00% = 3.275%.\n(C) Incorrect because it uses the wrong sign for duration—that is, +6.9 instead of –6.9: [+6.9 × (1.10% – 0.85%)] + 5.00% = 6.725%.", "ko": "A+ → A−(2 notch 하락): G-spread 0.85% → 1.10%. 기대수익률 = 쿠폰 + [−Duration × Δspread] = 5.00% + [−6.9 × 0.25%] = 5.00% − 1.725% = 3.275% ≈ 3.28%.", "trap": "Notch 세기(A+ → A → A−), 쿠폰 포함, 부호(−Duration).", "f": "E[R] ≈ Coupon (or YTM) − ModDur × Δspread", "why": {"A": "−1.73%는 쿠폰 수익(5%)을 빼먹은 값입니다. 총수익 = 이자수익 + 가격변화.", "C": "6.73%는 duration 부호를 +로 쓴 값입니다. spread 확대는 가격 '하락'."}, "orig": "FixedIncome · ECO Module 4 Q34 · Credit Analysis Models"}, {"id": "FixedIncome-ECO-M4-Q12", "src": "ECO", "module": 6, "tag": "부도 시나리오 실현수익률 (IRR)", "vig": 16, "stem": "The market price of Bond B2 is €1,090. If the bond is purchased at this price and there is a default on Date 3, the rate of return to the bond buyer would be closest to:\n[Note from the previous question's CVA table (flat 3% curve, RR = 30%): recovery on Date 3 = €326.74.]", "opts": {"A": "–28.38%.", "B": "–41.72%.", "C": "–69.49%."}, "ans": "A", "en": "A is correct. Solve for IRR: €1,090 = €60/(1 + IRR) + €60/(1 + IRR)^2 + €326.74/(1 + IRR)^3, where €60 is the coupon received at Dates 1 and 2 and €326.74 is the recovery at Date 3 (from the CVA table). IRR = −28.38%.", "ko": "Date 1·2에 쿠폰 60씩 받고 Date 3에 부도 → 회수액 326.74(= Date 3 exposure 1,089.13 × 30%). 1,090 = 60/(1+r) + 60/(1+r)² + 326.74/(1+r)³ → IRR = −28.38%.", "trap": "부도 시점 이전 쿠폰은 받음. 부도일에는 '회수액'만 (쿠폰 별도 X — exposure에 이미 포함).", "f": "Price = Σ CF_t/(1+IRR)^t,  Recovery_t = Exposure_t × RR", "why": {"B": "정답 현금흐름(CF0 = −1,090, CF1 = 60, CF2 = 60, CF3 = 326.74)의 IRR은 −28.38%입니다. −41.72%는 이 현금흐름과 맞지 않습니다.", "C": "−69.49%는 쿠폰 수령분과 3년의 기간을 제대로 반영하지 않은 값입니다. IRR은 CF0 = −1,090, 60, 60, 326.74로 계산합니다."}, "orig": "FixedIncome · ECO Module 4 Q12 · Credit Analysis Models"}, {"id": "FixedIncome-ECO-M5-Q6", "src": "ECO", "module": 6, "tag": "Basis trade – 이익 크기", "vig": 17, "stem": "If convergence occurs in the bond and CDS markets for Tollunt Corporation, a basis trade will capture a profit closest to:", "opts": {"A": "0.25%.", "B": "1.75%.", "C": "2.75%."}, "ans": "A", "en": "A is correct. A difference in credit spreads in the bond market and CDS market is the foundation of the basis trade strategy. If the spread is higher in the bond market than in the CDS market, it is said to be a negative basis. In this case, the bond credit spread is currently 4.50% (bond yield minus MRR) and the comparable CDS contract has a credit spread of 4.25%. The credit risk is cheap in the CDS market relative to the bond market. Since the protection and the bond were both purchased, if convergence occurs, the trade will capture the 0.25% differential in the two markets (4.50% – 4.25%).\nB is incorrect because the bond market implies a 4.50% credit risk premium (bond yield minus the market reference rate) and the CDS market implies a 4.25% credit risk premium. Convergence of the bond market credit risk premium and the CDS credit risk premium would result in capturing the differential, 0.25%. The 1.75% is derived by incorrectly subtracting MRR from the credit spread on the CDS (= 4.25% – 2.50%).\nC is incorrect because convergence of the bond market credit risk premium and the CDS credit risk premium would result in capturing the differential, 0.25%. The 2.75% is derived incorrectly by subtracting the credit spread on the CDS from the current bond yield (= 7.00% – 4.25%).", "ko": "Bond credit spread = 채권수익률 − MRR = 7.00% − 2.50% = 4.50%. CDS spread = 4.25%. Bond spread > CDS spread → negative basis. 채권 매수 + protection 매수 후 수렴하면 차이 0.25%를 확보.", "trap": "Bond credit spread = Bond yield − MRR. 그 다음 CDS spread와 비교.", "f": "Basis = CDS spread − (Bond yield − MRR)", "why": {"B": "1.75%는 CDS spread에서 MRR을 뺀 값(4.25 − 2.50). CDS spread는 이미 '신용' spread입니다.", "C": "2.75%는 채권수익률 − CDS spread(7.00 − 4.25). 채권수익률에서 MRR을 먼저 빼야 합니다."}, "orig": "FixedIncome · ECO Module 5 Q6 · Credit Default Swaps"}, {"id": "FixedIncome-ECO-M4-Q7", "src": "ECO", "module": 6, "tag": "Reduced-form vs Structural model", "vig": 18, "stem": "Kreming’s suggested model for Bond IV is a:", "opts": {"A": "structural model.", "B": "reduced-form model.", "C": "term structure model."}, "ans": "B", "en": "B is correct. A reduced-form model in credit risk analysis uses historical variables, such as financial ratios and macroeconomic variables, to estimate the default intensity. A structural model for credit risk analysis, in contrast, uses option pricing and relies on a traded market for the issuer’s equity.", "ko": "재무비율(레버리지, ROA)과 거시변수로 default intensity를 추정 → reduced-form model. Structural model은 옵션가격결정 이론을 쓰며 주식 시장가격(자산가치)에 의존합니다.", "trap": "'관측 가능한 변수(재무비율·거시) + 회귀' → reduced-form. '옵션·자산가치·default barrier' → structural.", "f": "", "why": {"A": "Structural model은 자산가치·변동성·부채(default barrier)로 옵션 접근. 회귀분석 변수 기반이 아닙니다.", "C": "Term structure model은 금리 모형(CIR, Vasicek 등)이지 신용위험 모형이 아닙니다."}, "orig": "FixedIncome · ECO Module 4 Q7 · Credit Analysis Models"}, {"id": "FixedIncome-ECO-M3-Q72", "src": "ECO", "module": 6, "tag": "변동성↑ → Callable OAS↓", "vig": null, "stem": "The OAS of a callable bond is 75 basis points in a zero volatility environment. As interest rate volatility increases, the bond's OAS most likely:", "opts": {"A": "decreases.", "B": "remains the same.", "C": "increases."}, "ans": "A", "en": "(A) Correct because as interest rate volatility increases, the OAS for the callable bond decreases.\n(B) Incorrect because as interest rate volatility increases, the OAS for the callable bond decreases.\n(C) Incorrect because as interest rate volatility increases, the OAS for the callable bond decreases.", "ko": "변동성↑ → call 가치↑ → 모형 가치(callable)↓. 같은 시장가격에 맞추려면 더 작은 spread가 필요 → OAS 감소.", "trap": "σ↑: OAS_callable ↓, OAS_putable ↑.", "f": "", "why": {"B": "OAS는 변동성 가정에 따라 변합니다.", "C": "증가는 putable bond의 경우입니다(변동성↑ → put 가치↑ → 모형가치↑ → 더 큰 OAS 필요)."}, "orig": "FixedIncome · ECO Module 3 Q72 · Bonds with Embedded Options"}, {"id": "FixedIncome-ECO-M3-Q62", "src": "ECO", "module": 6, "tag": "Convertible 지표 – 전환가격·전환가치·시장전환프리미엄", "vig": 19, "stem": "Is Hamilton most likely accurate regarding her convertible bond calculations?", "opts": {"A": "Yes.", "B": "No, the conversion value is incorrect.", "C": "No, the market conversion premium is incorrect."}, "ans": "A", "en": "(A) Correct. Given the initial conversion premium is 20%, the initial conversion price per share is $80.00 × 1.2 = $96. The conversion ratio is the par value of the bond divided by the conversion price per share: $1,000/$96 = 10.4167. The conversion value of a convertible bond is equal to the underlying share price times the conversion ratio: 10.4167 × $90.00 = $937.50. The market conversion premium is the convertible bond price divided by the conversion ratio minus the stock price: $1,050/10.4167 = $100.80 – $90.00 = $10.80.\n(B) Incorrect. The conversion value of a convertible bond is equal to the underlying share price times the conversion ratio: 10.4167 × $90.00 = $937.50.\n(C) Incorrect. The market conversion premium is the convertible bond price divided by the conversion ratio minus the stock price: $1,050/10.4167 = $100.80 – $90.00 = $10.80.", "ko": "최초 전환가격 = $80 × 1.20 = $96 → 전환비율 = 1,000/96 = 10.4167. 전환가치 = 10.4167 × $90 = $937.50. 시장전환가격 = 1,050/10.4167 = $100.80 → 프리미엄/주 = 100.80 − 90 = $10.80. Hamilton 계산 모두 정확.", "trap": "Initial conversion premium 20% → 전환가격 = 발행일 주가 × 1.2. 전환비율 = par/전환가격.", "f": "CR = Par/Conversion price,  CV = CR × S,  MCP = CB price/CR,  Premium = MCP − S", "why": {"B": "전환가치 = 전환비율 × 현재 주가 = 10.4167 × 90 = 937.50으로 맞습니다.", "C": "시장전환프리미엄 = 1,050/10.4167 − 90 = 10.80으로 맞습니다."}, "orig": "FixedIncome · ECO Module 3 Q62 · Bonds with Embedded Options"}, {"id": "Derivatives-ECO-M1-Q44", "src": "ECO", "module": 7, "tag": "Receive-fixed swap 90일 뒤 가치", "vig": 20, "stem": "Using data in Exhibit 2 and a 30/360 day count, the market value of Novatel's swap after 90 days is closest to:", "opts": {"A": "–$2,875,000.", "B": "–$2,408,880.", "C": "–$602,250."}, "ans": "C", "en": "Original quarterly fixed rate (from Exhibit 1) = 0.008396. New PV factors: PV(90) = 0.994505, PV(180) = 0.987069, PV(270) = 0.972786. New periodic swap rate = (1 − 0.972786)/(sum 2.95436) = 0.009211. Receive-fixed value = (0.008396 − 0.009211) × 2.95436 × 250,000,000 ≈ –$602,250.", "ko": "처음 정한 분기 고정금리는 0.8396%입니다. 90일 뒤 금리로 새 PV factor를 구하고 남은 3번 지급의 새 swap rate를 구하면 0.9211%입니다. Receive-fixed는 낮은 옛 금리를 받으니 손해: (0.008396 − 0.009211) × ΣPV 2.954 × 2.5억 ≈ –$602,250.", "trap": "새 PV factor는 90일 뒤 금리로 다시 만든다(예: 1/(1 + 0.0262 × 180/360)). 금리 차이는 분기 단위, annuity는 남은 3개 PV 합이다.", "f": "V(receive-fixed) = NA × (FS_0 − FS_t) × ΣPV_t", "why": {"A": "계산이 틀린 값입니다. 새 PV factor로 남은 3번 지급의 새 분기 swap rate(0.9211%)를 구해 옛 금리(0.8396%)와 비교해야 합니다.", "B": "금리 차이를 분기 단위로 맞추지 않아 손실이 약 4배로 커진 값입니다."}, "orig": "Derivatives · ECO Module 1 Q44 · Pricing and Valuation of Forward Commitments"}, {"id": "Derivatives-ECO-M1-Q34", "src": "ECO", "module": 7, "tag": "FRA 중도 가치 – 새 FRA rate와 할인", "vig": 21, "stem": "The current value of Cline's FRA is closest to:", "opts": {"A": "–US$10,625.", "B": "–US$10,515.", "C": "US$10,612."}, "ans": "B", "en": "After 30 days the 3 × 6 FRA is a 2 × 5 FRA. New FRA rate = {[1 + 0.025 × 150/360]/[1 + 0.015 × 60/360] − 1}/(90/360) = 3.16%. Value to the long (receive-floating) = 5,000,000 × (0.0316 − 0.0231) × (90/360)/(1 + 0.025 × 150/360) = $10,515. Cline pays floating (short FRA), so the value is −US$10,515.", "ko": "30일이 지나서 3 × 6 FRA는 이제 2 × 5 FRA입니다. 새 FRA rate = 3.16%. 금리 차이(3.16% − 2.31%) × 90/360 × 500만을 FRA 만기(지금부터 5개월)까지 5개월 금리로 할인하면 10,515입니다. Cline은 pay-floating(short FRA)이라 금리 상승이 손해 → −US$10,515.", "trap": "할인은 남은 FRA 만기 전체 기간(h + m − g = 150일)으로 한다. Pay-floating(receive-fixed)은 short FRA다.", "f": "V_g = NA × [FRA_g − FRA_0] × t_m / [1 + L(h+m−g) × t(h+m−g)]", "why": {"A": "금리 차이를 할인하지 않고 계산한 값입니다(−10,625). 차액은 5개월 뒤 받으므로 할인해야 합니다.", "C": "2개월 금리(1.5%)와 30일로 잘못 할인했고 부호도 반대입니다. Pay-floating은 금리가 오르면 손해입니다."}, "orig": "Derivatives · ECO Module 1 Q34 · Pricing and Valuation of Forward Commitments"}, {"id": "Derivatives-ECO-M2-Q50", "src": "ECO", "module": 7, "tag": "금리 call option – 노드별 할인계수", "vig": null, "stem": "An analyst values a 2-year, European-style call option on a 1-year spot rate. The notional value of the option is $10,000,000, and the exercise rate is 3.50% of par. The risk-neutral probability of an up move is 0.50. Annually compounded 1-year interest rates, along with the corresponding zero-coupon bond values, are shown below.\nNode\t1-year rate\t1-year zero value\nt=0\t4%\t0.961538\nt=1 up\t5%\t0.952381\nt=1 down\t3%\t0.970874\nt=2 up-up\t6%\t0.943396\nt=2 up-down\t4%\t0.961538\nt=2 down-down\t2%\t0.980392\nThe value of the interest rate option is closest to:", "opts": {"A": "$34,118.", "B": "$45,343.", "C": "$80,350."}, "ans": "C", "en": "Time 2 payoffs: 0.025, 0.005, 0. c+ = 0.952381 × [0.5(0.025) + 0.5(0.005)] = 0.014286; c− = 0.970874 × [0.5(0.005)] = 0.002427. c = 0.961538 × [0.5(0.014286) + 0.5(0.002427)] = 0.008035 → × 10,000,000 = $80,350.", "ko": "만기 payoff = Max(0, 금리 − 3.5%): 2.5%, 0.5%, 0. t = 1 위 0.952381 × 평균 = 0.014286, 아래 0.970874 × 0.0025 = 0.002427. t = 0 = 0.961538 × 평균 = 0.008035 → $80,350.", "trap": "기대값은 π와 (1 − π)를 '더한다'. 음수 payoff는 0으로 바꾼다(Max).", "f": "c = PV × [π c_up + (1 − π) c_down]", "why": {"A": "각 단계에서 두 값을 더하지 않고 뺀 값입니다.", "B": "아래-아래 노드 payoff에 Max를 적용하지 않아 음수(−1.5%)를 그대로 쓴 값입니다."}, "orig": "Derivatives · ECO Module 2 Q50 · Valuation of Contingent Claims"}, {"id": "Derivatives-ECO-M2-Q94", "src": "ECO", "module": 7, "tag": "Delta hedge된 long call – 큰 변동 시 가치 ↑", "vig": null, "stem": "An at-the-money long call option is delta hedged using stock. If the price of the stock increases by a large amount, the value of the combined option and delta hedge position:", "opts": {"A": "decreases.", "B": "remains the same.", "C": "increases."}, "ans": "C", "en": "Long call has positive gamma. The delta approximation is biased low for both up and down moves, so after a large rise the call gains more than the delta estimate and the combined position's value increases.", "ko": "Long call은 gamma가 양수입니다. 주가가 크게 오르면 call 가치가 delta로 예상한 것보다 더 많이 올라서, short 주식 손실을 넘어 전체 포지션 가치가 오릅니다.", "trap": "Delta hedge는 작은 변동에만 맞는다. Long option(+gamma)이면 큰 변동은 위든 아래든 이득.", "f": "Δc ≈ Δ·ΔS + ½Γ·(ΔS)²,  Γ > 0", "why": {"A": "Long call은 gamma가 양수라 큰 변동에서 오히려 이득입니다.", "B": "가치가 그대로인 것은 아주 작은 변동일 때뿐입니다."}, "orig": "Derivatives · ECO Module 2 Q94 · Valuation of Contingent Claims"}, {"id": "AlternativeInvestments-ECO-M1-Q14", "src": "ECO", "module": 8, "tag": "Total return 계산(천연가스, contango)", "vig": 22, "stem": "Based on Exhibit 2, the total return from the long position in natural gas futures is closest to:", "opts": {"A": "1.46%.", "B": "3.71%.", "C": "4.14%."}, "ans": "A", "en": "A is correct. The total return for a fully collateralized position is the sum of the price return, the roll return, and the collateral return:\nPrice return = (Current price − Previous price)/Previous price\n= (2.99 − 2.93)/2.93\n= 2.05%.\nRoll return\n= (Near-term futures closing price − Farther-term futures closing price)/Near-term futures closing price × Percentage of position in futures contract being rolled\n= [(2.99 − 3.03)/2.99] × 100%\n= −1.34%.\nCollateral return = Annual rate × Period length as a fraction of the year\n= 3% × 0.25\n= 0.75%.\nTherefore, the total return for three months = 2.05% − 1.34% + 0.75% = 1.46%.", "ko": "가격 = (2.99 − 2.93)/2.93 = 2.05%, 롤 = (2.99 − 3.03)/2.99 = −1.34%, 담보 = 3% × 0.25 = 0.75% → 합계 1.46%.", "trap": "담보수익률 3%를 그대로 쓰지 않는다(3개월 → × 0.25).", "f": "TR = 가격 + 롤 + 담보", "why": {"B": "담보수익률 3%를 3개월로 환산하지 않고 그대로 더한 값(2.05 − 1.34 + 3.00)입니다.", "C": "롤수익률 부호를 거꾸로(+1.34%) 더한 값(2.05 + 1.34 + 0.75)입니다."}, "orig": "AlternativeInvestments · ECO Module 1 Q14 · Introduction to Commodities and Commodity Derivatives"}, {"id": "AlternativeInvestments-ECO-M3-Q19", "src": "ECO", "module": 8, "tag": "NAV: 다음 12개월 현금 NOI / cap rate", "vig": 23, "stem": "The NAV per share for REIT A is closest to:", "opts": {"A": "$69.31.", "B": "$78.39.", "C": "$94.63."}, "ans": "C", "en": "C is correct. Cap rate = 6.5% − 1.5% = 5.0%. Last-12-month cash NOI = 280,000 − 9,800 = 270,200. Next-12-month cash NOI = 270,200 × 1.015 = 274,253. Value of operating real estate = 274,253 / 5.0% = 5,485,060. Plus cash 69,300 = 5,554,360. Less total debt 823,000 = NAV 4,731,360. NAV per share = 4,731,360 / 50,000 = $94.63.\nA is incorrect because it capitalizes next-12-month cash NOI at the discount rate (6.5%) instead of the cap rate.\nB is incorrect because it reduces NOI by capital expenditures.", "ko": "Cap = 6.5% − 1.5% = 5%. 현금 NOI = 280,000 − 9,800 = 270,200 → × 1.015 = 274,253. 부동산 가치 = 274,253 / 5% = 5,485,060. + 현금 69,300 − 부채 823,000 = 4,731,360 → ÷ 50,000 = $94.63.", "trap": "Capex는 NOI에서 빼지 않는다. 할인율이 아니라 cap rate(= r − g)로 자본화.", "f": "Cap = r − g ; NOI_{next} = (NOI − 비현금 임대료)(1 + g)", "why": {"A": "Cap rate(5%) 대신 할인율(6.5%)로 나눴습니다.", "B": "NOI에서 capex(40,000)까지 뺐습니다."}, "orig": "AlternativeInvestments · ECO Module 3 Q19 · Investments in Real Estate through Publicly Traded Securities"}, {"id": "AlternativeInvestments-ECO-M4-Q52", "src": "ECO", "module": 8, "tag": "Multi-strategy vs FoF 성과", "vig": null, "stem": "Multi-strategy funds have typically:", "opts": {"A": "outperformed funds-of-funds.", "B": "experienced lower volatility than funds-of-funds.", "C": "provided better redemption provisions than funds-of-funds."}, "ans": "A", "en": "A is correct because multi-strategy hedge funds typically outperform funds-of-funds: They have higher mean returns (7.85%/TASS and 8.52%/CISDM) and among the highest Sharpe ratios and Sortino ratios. Multi-strategy funds have higher Rho (more than 20%) compared to FoFs, indicating relatively high serial autocorrelation. This is reasonable because multi-strategy funds may be simultaneously running strategies using less liquid instruments, such as convertible arbitrage, fixed-income arbitrage, and other relative value strategies.\nB is incorrect because multi-strategy funds are generally considered to have higher volatility than FOFs. Multi-strategy funds have generally outperformed FoFs but with more variance and occasional large losses often related to their higher leverage.\nC is incorrect because multi-strategy funds are generally considered to have more restrictive redemption terms than FOFs. Both groups (FOFs and multi-strategy funds) typically have similar initial lock-up and redemption periods, but multi-strategy funds also often impose investor-level or fund-level gates on maximum redemptions allowed per quarter. Further, multi-strategy funds may be simultaneously running strategies using less liquid instruments, such as convertible arbitrage, fixed-income arbitrage, and other relative value strategies. That is why, unlike FoFs, they often impose investor-level or fund-level gates on maximum quarterly redemptions.", "ko": "Schweser: multi-strategy 펀드는 더 나은 수수료 구조와 빠른 전술적 배분 덕분에 역사적으로 FoF보다 성과가 좋았습니다. 대신 레버리지 때문에 변동성이 더 크고 가끔 큰 손실이 있습니다.", "trap": "성과↑지만 변동성↑, 환매 조건은 더 엄격(gate).", "f": "", "why": {"B": "Multi-strategy는 레버리지 때문에 FoF보다 변동성이 큽니다.", "C": "Multi-strategy는 분기별 환매 한도(gate) 등 환매 조건이 더 엄격합니다."}, "orig": "AlternativeInvestments · ECO Module 4 Q52 · Hedge Fund Strategies"}, {"id": "PM-ECO-M1-Q60", "src": "ECO", "module": 9, "tag": "실질금리 ∝ GDP 성장률 & 변동성", "vig": null, "stem": "The real default-free interest rate in an economy is most likely positively related to:", "opts": {"A": "the expected growth rate of GDP only.", "B": "the expected volatility of GDP growth only.", "C": "both the expected growth rate of GDP and the expected volatility of GDP growth."}, "ans": "C", "en": "Correct because GDP growth from one period to the next cannot be perfectly anticipated. Under these uncertain circumstances, interest rates will still be positively related to the expected growth rate of GDP, but additionally they will be positively related to the expected volatility of GDP growth.\nA: Incorrect because interest rates are also positively related to the expected volatility of GDP growth.\nB: Incorrect because interest rates are also positively related to the expected growth rate of GDP.", "ko": "실질 무위험이자율은 기대 GDP 성장률과 기대 GDP 성장 변동성 '둘 다'와 양(+)의 관계.", "trap": "'only'가 붙은 선택지 주의. 성장률·변동성 둘 다.", "f": "", "why": {"A": "성장률뿐 아니라 성장 변동성과도 양의 관계입니다.", "B": "변동성뿐 아니라 성장률 자체와도 양의 관계입니다."}, "orig": "PM · ECO Module 1 Q60 · Economics and Investment Markets"}, {"id": "PM-ECO-M1-Q3", "src": "ECO", "module": 9, "tag": "인플레이션 불확실성 프리미엄 계산", "vig": 24, "stem": "The implied premium for inflation uncertainty for the one-year government zero-coupon bond proposed by Carlisle is closest to:", "opts": {"A": "0.23%.", "B": "0.37%.", "C": "1.10%."}, "ans": "B", "en": "B is correct. For a one-year default-free nominal zero-coupon bond, P0 = CF1/(1 + r + π + θ). Thus 1 + r + π + θ = 100/96.37 = 1.0377. The implied premium for inflation uncertainty is θ = 1.0377 − (1 + 0.0115 + 0.0225) = 1.0377 − 1.0340 = 0.0037, or 0.37%.", "ko": "1년 무이표 명목 국채: P = 100/(1 + r + π + θ). 100/96.37 = 1.0377 → r + π + θ = 3.77%. r = 1.15%, π = 2.25% → θ = 3.77% − 3.40% = 0.37%.", "trap": "가격 → 총수익률 → 실질금리·기대인플레이션 차감 = 인플레이션 불확실성 프리미엄(θ).", "f": "P0 = CF1 / (1 + r + π + θ)  ⇒  θ = CF1/P0 − 1 − r − π", "why": {"A": "0.23%는 계산 근거가 없는 값입니다. 1.0377 − 1.0340 = 0.0037입니다.", "C": "1.10%는 기대인플레이션(2.25%)에서 실질금리(1.15%)를 뺀 값으로, 의미 없는 차이입니다. 총수익률(3.77%)에서 실질금리와 기대인플레이션을 모두 빼야 합니다."}, "orig": "PM · ECO Module 1 Q3 · Economics and Investment Markets"}, {"id": "PM-ECO-M2-Q7", "src": "ECO", "module": 9, "tag": "SR_P² = SR_B² + IR²", "vig": 25, "stem": "Based on Exhibit 1, combining Fund W with a fund that replicates the benchmark would produce a Sharpe ratio closest to:", "opts": {"A": "0.44.", "B": "0.56.", "C": "0.89."}, "ans": "B", "en": "B is correct. Given the IR for Fund W of 0.35 and the benchmark’s SR of 0.44, the optimal combination of the benchmark and Fund W has SR_P² = SR_B² + IR², so SR_P = (0.44² + 0.35²)^0.5 = 0.56.", "ko": "벤치마크와 액티브 펀드를 최적으로 결합한 포트폴리오의 Sharpe ratio: SR_P = √(0.44² + 0.35²) = √(0.1936 + 0.1225) = 0.56.", "trap": "SR과 IR을 단순 합산하지 말고, 제곱해서 더한 뒤 제곱근.", "f": "SR_P² = SR_B² + IR²", "why": {"A": "0.44는 벤치마크 SR 그대로입니다. 액티브 펀드를 더하면 IR만큼 SR이 올라갑니다.", "C": "0.89는 SR과 IR을 그냥 더한 값(0.44 + 0.35 = 0.79)과도 다르며, 공식은 제곱합의 제곱근입니다."}, "orig": "PM · ECO Module 2 Q7 · Analysis of Active Portfolio Management"}, {"id": "PM-ECO-M2-Q19", "src": "ECO", "module": 9, "tag": "최적 active risk와 비중", "vig": 26, "stem": "Which of the following pairs of weights would be used to achieve the highest Sharpe ratio and optimal amount of active risk through combining the Indigo Fund and benchmark portfolio, respectively?", "opts": {"A": "1.014 on Indigo and −0.014 on the benchmark", "B": "1.450 on Indigo and −0.450 on the benchmark", "C": "1.500 on Indigo and −0.500 on the benchmark"}, "ans": "A", "en": "A is correct. The optimal amount of active risk is σA = (IR/SR_B) × σB = (0.15/0.333) × 18.0% = 8.11%. The weight on the active portfolio (Indigo) is 8.11%/8.0% = 1.014, and the weight on the benchmark is 1 − 1.014 = −0.014.\nCheck: Indigo’s expected active return is 1.014(1.2%) = 1.217%, the total excess return is 6.0% + 1.217% = 7.217%, σP² = 18.0² + 8.11² = 389.79, σP = 19.743, and the Sharpe ratio is 7.217/19.743 = 0.365, the maximum.", "ko": "최적 active risk σA* = (IR/SR_B) × σB = (0.15/0.333) × 18% = 8.11%. Indigo의 active risk가 8%이므로 Indigo 비중 = 8.11/8.0 = 1.014, 벤치마크 비중 = 1 − 1.014 = −0.014. 이때 SR = 7.217/19.743 = 0.365로 최대.", "trap": "최적 active risk를 먼저 구한 뒤, 그것을 펀드의 active risk로 나눠 비중을 구함.", "f": "σA* = (IR / SR_B) × σB,  w(active) = σA* / σA", "why": {"B": "1.450은 근거 없는 비중입니다. 최적 active risk(8.11%)를 Indigo의 active risk(8.0%)로 나눠야 합니다.", "C": "1.500은 근거 없는 비중입니다. 비중 = σA*/σA(Indigo) = 8.11%/8.0% = 1.014입니다."}, "orig": "PM · ECO Module 2 Q19 · Analysis of Active Portfolio Management"}, {"id": "PM-ECO-M4-Q6", "src": "ECO", "module": 9, "tag": "Macro 모형 수익률 = a + b × surprise", "vig": 27, "stem": "Based on the data in Exhibit 2 and Exhibit 3, the return for Portfolio AC, given the surprises in inflation and GDP growth, is closest to:", "opts": {"A": "2.02%.", "B": "2.40%.", "C": "4.98%."}, "ans": "A", "en": "A is correct. The macroeconomic two-factor model is Ri = ai + bi1·F_INF + bi2·F_GDP + εi, where F_INF and F_GDP are surprises and ai is the expected return.\nRA = 0.02 + 0.5F_INF + 1.0F_GDP + εA; RC = 0.03 + 1.0F_INF + 1.1F_GDP + εC.\nSurprise in inflation = 2.2% − 2.0% = 0.2%; surprise in GDP growth = 1.0% − 1.5% = −0.5%.\nR_AC = (0.6)(0.02) + (0.4)(0.03) + [(0.6)(0.5) + (0.4)(1.0)](0.002) + [(0.6)(1.0) + (0.4)(1.1)](−0.005) = 2.02%.", "ko": "Surprise = 실제 − 예측: 인플레이션 2.2 − 2.0 = +0.2%, GDP 1.0 − 1.5 = −0.5%. Portfolio AC(A 60%, C 40%): a = 0.6(2%) + 0.4(3%) = 2.4%. b_INF = 0.6(0.5) + 0.4(1.0) = 0.7, b_GDP = 0.6(1.0) + 0.4(1.1) = 1.04. R = 2.4% + 0.7(0.2%) + 1.04(−0.5%) = 2.4 + 0.14 − 0.52 = 2.02%.", "trap": "F = 실제 − 예측(surprise). 실제값을 그대로 넣으면 틀림.", "f": "Ri = ai + bi1·F_INF + bi2·F_GDP + εi,  F = actual − forecast", "why": {"B": "2.40%는 기대수익률(절편)만 계산하고 surprise 효과를 빠뜨린 값입니다.", "C": "4.98%는 surprise 대신 실제값(2.2%, 1.0%)을 요인값으로 곱한 값입니다. Macro 모형에서 F는 surprise입니다."}, "orig": "PM · ECO Module 4 Q6 · Using Multifactor Models"}, {"id": "Ethics-ECO-M3-Q3", "src": "ECO", "module": 10, "tag": "VI(B) Priority of Transactions — firm proprietary account", "vig": null, "stem": "Derek Buckley, CFA, is a portfolio manager. When allocating oversubscribed IPO shares, Buckley initially allocates shares to his firm’s proprietary account based on his loyalty to his employer. He then allocates shares to his father’s standard fee-paying account at the same time as other clients’ fee-paying accounts.\nDo Buckley's actions violate the Standard related to priority of transactions?", "opts": {"A": "No", "B": "Yes, by initially allocating IPO shares to the firm’s proprietary account", "C": "Yes, by allocating shares to his father’s account at the same time as other clients’ accounts"}, "ans": "B", "en": "B is correct. Correct because Standard VI(B) states that, investment transactions for clients and employers must have priority over investment transactions in which a member or candidate is the beneficial owner. Also, client transactions must take precedence over transactions made on behalf of the member’s or candidate’s firm or personal transactions. Buckley thus violates Standard VI (B) by initially allocating to the firm’s proprietary account before allocating to client accounts.\nA is incorrect. Incorrect because, as noted in the correct answer, Buckley violates Standard VI(B), Priority of Transactions, by initially allocating to his firm’s proprietary account.\nC is incorrect. Incorrect because Buckley does not violate Standard VI (B), Priority of Transactions, by allocating to her father’s fee-paying account concurrently with other clients. Standard VI (B) states that family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship.", "ko": "Client 거래가 firm proprietary account·개인 거래보다 먼저다. 회사 계정에 먼저 배정했으니 위반. 아버지는 standard fee-paying client라 다른 client와 동시에 배정하면 문제없다.", "trap": "'회사에 대한 loyalty'라도 client보다 먼저 할 수 없다. family account도 client account면 똑같이 대우.", "f": "", "why": {"A": "Incorrect because, as noted in the correct answer, Buckley violates Standard VI(B), Priority of Transactions, by initially allocating to his firm’s proprietary account.", "C": "Incorrect because Buckley does not violate Standard VI (B), Priority of Transactions, by allocating to her father’s fee-paying account concurrently with other clients. Standard VI (B) states that family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship."}, "orig": "Ethics · ECO Module 3 Q3 · Application of the Code and Standards: Level II"}, {"id": "Ethics-ECO-M3-Q10", "src": "ECO", "module": 10, "tag": "III(B) Fair Dealing — premium service levels", "vig": null, "stem": "Amy Wynn, CFA, is a research analyst at an investment bank. In an email to all of her clients, she includes a research report with a “buy” recommendation on one of the stocks she covers. Afterwards, she calls her premium fee-paying clients to discuss the report in detail. When her standard fee-paying clients call about the report, she declines the calls and asks her research associate, who co-wrote the report, to return the calls on her behalf.\nDid Wynn's actions violate the Standard related to fair dealing?", "opts": {"A": "No", "B": "Yes, by calling her premium fee-paying clients to discuss the report in detail", "C": "Yes, by declining the calls of standard fee-paying clients and asking her associate to reply"}, "ans": "A", "en": "A is correct. Correct because Wynn did not violate Standard III(B), Fair Dealing. According to the this Standard, members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage. Members and candidates may differentiate their services to clients, but different levels of service must not disadvantage or negatively affect clients.\nTherefore, Wynn has not violated Standard III(B) because she is allowed to provide differentiated service levels to her clients and did not appear to disadvantage or negatively affect other clients.\nB is incorrect. Incorrect because Wynn calling her premium fee-paying clients to discuss the report in detail does not violate Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, calling her premium fee-paying clients to discuss the report in detail is not a violation of Standard III(B).\nC is incorrect. Incorrect because Wynn declining the calls from standard fee-paying clients and asking her research associate who co-wrote the report to return the calls on her behalf is not a violation of Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, declining the calls of her standard fee-paying clients and asking the research associate who co-wrote the report to return the calls is not a violation of Standard III(B).", "ko": "Premium client에게 더 깊은 service를 주는 건 허용(공개돼 있고 다른 client에 불리하지 않으면). 공동 저자인 associate가 standard client 전화에 답하게 하는 것도 OK.", "trap": "'모든 client를 똑같이'가 아니라 'fairly'. 추천을 동시에 배포했으면 서비스 수준 차등은 허용.", "f": "", "why": {"B": "Incorrect because Wynn calling her premium fee-paying clients to discuss the report in detail does not violate Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, calling her premium fee-paying clients to discuss the report in detail is not a violation of Standard III(B).", "C": "Incorrect because Wynn declining the calls from standard fee-paying clients and asking her research associate who co-wrote the report to return the calls on her behalf is not a violation of Standard III(B), Fair Dealing. According to Standard III(B), members and candidates may provide more personal, specialized, or in-depth service to clients who are willing to pay for premium services through higher management fees or higher levels of brokerage.\nTherefore, declining the calls of her standard fee-paying clients and asking the research associate who co-wrote the report to return the calls is not a violation of Standard III(B)."}, "orig": "Ethics · ECO Module 3 Q10 · Application of the Code and Standards: Level II"}, {"id": "mock1-2-Q3", "src": "Mock", "module": 5, "tag": "RI: OCI(clean surplus 위반) 조정", "vig": 28, "stem": "Firm B’s per-share residual income for Year 2 is closest to:", "opts": {"A": "$14.73.", "B": "$15.55.", "C": "$18.30."}, "ans": "C", "en": "A. $14.73. — Incorrect\n

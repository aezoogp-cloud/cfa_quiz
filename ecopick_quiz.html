am.\nThe firm invests in a variety of bonds. Ibarra is presently analyzing a set of bonds with some similar characteristics, such as four years until maturity and a par value of €1,000. Exhibit 1 includes details of these bonds.\nExhibit 1\nA Brief Description of the Bonds Being Analyzed\nBond\tDescription\nB1\tA zero-coupon, four-year corporate bond with a par value of €1,000. The wealth management firm’s research team has estimated that the risk-neutral probability of default for each date for the bond is 1.50%, and the recovery rate is 30%.\nB2\tA bond similar to B1, except that it has a fixed annual coupon rate of 6% paid annually.\nB3\tA bond similar to B2 but rated AA.\nB4\tA bond similar to B2 but the coupon rate is the one-year benchmark rate plus 4%.\nIbarra asks Koning to assist her with analyzing the bonds. She wants him to perform the analysis with the assumptions that there is no interest rate volatility and that the government bond yield curve is flat at 3%.\nIbarra performs the analysis assuming an upward-sloping yield curve and volatile interest rates. Exhibit 2 provides the data on annual payment benchmark government bonds.\nShe uses these data to construct a binomial interest rate tree, shown in Exhibit 3, based on an assumption of future interest rate volatility of 20%.\nExhibit 2\nPar Curve for Annual Payment Benchmark Government Bonds\nMaturity\tCoupon Rate\tPrice\tDiscount Factor\tSpot Rate\tForward Rate\n1\t–0.25%\t€100\t1.002506\t–0.2500%\t\n2\t0.75%\t€100\t0.985093\t0.7538%\t1.7677%\n3\t1.50%\t€100\t0.955848\t1.5166%\t3.0596%\n4\t2.25%\t€100\t0.913225\t2.2953%\t4.6674%\nExhibit 3\nInterest Rate Tree\nDate 0\tDate 1\tDate 2\tDate 3\n−0.2500%\t2.1180%\t4.3999%\t8.0804%\n\t1.4197%\t2.9493%\t5.4164%\n\t\t1.9770%\t3.6307%\n\t\t\t2.4338%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nAnswer the first five questions (9-13) based on the assumptions made by Marten Koning, the junior analyst.\nNote: All calculations in this problem set are carried out on spreadsheets to preserve precision. The rounded results are reported in the solutions.", "UNAB Corporation\nOn 1 January 20X2, Deem Advisors purchased a $10 million six-year senior unsecured bond issued by UNAB Corporation. Six months later (1 July 20X2), concerned about the portfolio’s credit exposure to UNAB, Doris Morrison, the chief investment officer at Deem Advisors, buys $10 million protection on UNAB with a standardized coupon rate of 5%. The reference obligation of the CDS is the UNAB bond owned by Deem Advisors. UNAB adheres to the ISDA CDS protocols.\nOn 1 January 20X3, Morrison asks Bill Watt, a derivatives analyst, to assess the current credit quality of UNAB bonds and the value of Deem Advisors’ CDS on UNAB debt. Watt gathers the following information on UNAB’s debt issues currently trading in the market:\nBond 1: A two-year senior unsecured bond trading at 40% of par\nBond 2: A five-year senior unsecured bond trading at 50% of par\nBond 3: A five-year subordinated unsecured bond trading at 20% of par\nWith respect to the credit quality of UNAB, Watt makes the following statement:\n“There is severe near-term stress in the financial markets, and UNAB’s credit curve clearly reflects the difficult environment.”\nOn 1 July 20X3, UNAB fails to make a scheduled interest payment on the outstanding subordinated unsecured obligation after a grace period; however, the company does not file for bankruptcy. Morrison asks Watt to determine if UNAB experienced a credit event and, if so, to recommend a settlement preference.\nKand Corporation\nMorrison is considering purchasing protection on Kand Corporation debt to hedge the portfolio’s position in Kand. She instructs Watt to determine if an upfront payment would be required and, if so, the amount of the premium. Watt presents the information for the CDS in Exhibit 1.\nExhibit 1\nSummary Data for 10-year CDS on Kand Corporation\nCredit spread\t700 bps\nDuration\t7 years\nCoupon rate\t5%\nMorrison purchases 10-year protection on Kand Corporation debt. Two months later the credit spread for Kand Corporation has increased by 200 bps. Morrison asks Watt to close out the firm’s CDS position on Kand Corporation by entering into a new, offsetting contract.\nTollunt Corporation\nDeem Advisors’ chief credit analyst recently reported that Tollunt Corporation’s five-year bond is currently yielding 7% and a comparable CDS contract has a credit spread of 4.25%. Since the current market reference rate is 2.5%, Watt has recommended executing a basis trade to take advantage of the pricing of Tollunt’s bonds and CDS. The basis trade would consist of purchasing both the bond and the CDS contract.", "Lena Liecken is a senior bond analyst at Taurus Investment Management. Kristel Kreming, a junior analyst, works for Liecken in helping conduct fixed-income research for the firm’s portfolio managers. Liecken and Kreming meet to discuss several bond positions held in the firm’s portfolios.\nBonds I and II both have a maturity of one year, an annual coupon rate of 5%, and a market price equal to par value. The risk-free rate is 3%. Historical default experiences of bonds comparable to Bonds I and II are presented in Exhibit 1.\nExhibit 1\nCredit Risk Information for Comparable Bonds\nBond\tRecovery Rate\tPercentage of Bonds That Survive and Make Full Payment\nI\t40%\t98%\nII\t35%\t99%\nBond III is a zero-coupon bond with three years to maturity. Liecken evaluates similar bonds and estimates a recovery rate of 38% and a risk-neutral default probability of 2%, assuming conditional probabilities of default. Kreming creates Exhibit 2 to compute Bond III’s credit valuation adjustment. She assumes a flat yield curve at 3%, with exposure, recovery, and loss given default values expressed per 100 of par value.\nExhibit 2\nAnalysis of Bond III\nDate\tExposure\tRecovery\tLoss Given Default\tProbability of Default\tProbability of Survival\tExpected Loss\tPresent Value of Expected Loss\n0\t\t\t\t\t\t\t\n1\t94.2596\t35.8186\t58.4410\t2.0000%\t98.0000%\t1.1688\t1.1348\n2\t97.0874\t36.8932\t60.1942\t1.9600%\t96.0400%\t1.1798\t1.1121\n3\t100.0000\t38.0000\t62.0000\t1.9208%\t94.1192%\t1.1909\t1.0898\nSum\t\t\t\t5.8808%\t\t3.5395\t3.3367\nBond IV is an AA rated bond that matures in five years, has a coupon rate of 6%, and a modified duration of 4.2. Liecken is concerned about whether this bond will be downgraded to an A rating, but she does not expect the bond to default during the next year. Kreming constructs a partial transition matrix, which is presented in Exhibit 3, and suggests using a model to predict the rating change of Bond IV using leverage ratios, return on assets, and macroeconomic variables.\nExhibit 3\nPartial One-Year Corporate Transition Matrix (entries in %)\nFrom/To\tAAA\tAA\tA\nAAA\t92.00\t6.00\t1.00\nAA\t2.00\t89.00\t8.00\nA\t0.05\t1.00\t85.00\nCredit Spread (%)\t0.50\t1.00\t1.75\nKreming calculates the risk-neutral probabilities, compares them with the actual default probabilities of bonds evaluated over the past 10 years, and observes that the actual and risk-neutral probabilities differ. She makes two observations regarding the comparison of these probabilities:\nObservation 1: Actual default probabilities include the default risk premium associated with the uncertainty in the timing of the possible default loss.\nObservation 2: The observed spread over the yield on a risk-free bond in practice includes liquidity and tax considerations, in addition to credit risk.", "Stellwagen Investment Partners is an institutional investment manager located in Boston that offers advice on both equity and fixed-income strategies. Stellwagen manages a number of separate accounts for large institutional investors and also serves as a subadviser for mutual funds.\nThomas Harding, a fixed-income portfolio manager at Stellwagen, is a member of the firm’s investment committee. Harding is responsible for management of the firm’s short-and intermediate-duration credit strategies. When making investment decisions, he often relies on input from Stellwagen’s team of 15 credit analysts. Sarah Hamilton is a credit analyst at Stellwagen and covers the technology and telecommunication sectors.\nHamilton is analyzing three bonds being considered for investment by Harding: CommCo, which is currently callable at par; StorageTech, which is currently putable at par; and NexTec, which has a make-whole call provision. All three bonds have a five-year maturity, are of equivalent credit quality, and pay the same coupon (3.5%). Harding believes that interest rates will increase more rapidly than currently implied by the market.\nHarding asks Hamilton what the impact of increased interest rate volatility and changes to the shape of the yield curve would have on the value of these bonds. She states that all else being equal,\n• Comment 1: increased interest rate volatility decreases the value of the CommCo bond,\n• Comment 2: the value of NexTec’s make-whole call provision increases as the yield curve flattens,\n• Comment 3: and the value of StorageTech’s option will be more valuable with a downward-sloping yield curve than with a flat yield curve.\nHamilton has been working on interest rate scenarios to model how bond prices would change given a 40 bp (basis point) upward or downward shift in the yield curve. Her work is shown in Exhibit 1.\nExhibit 1 Bond Sensitivity Analysis to 40 bp Interest Rate Shifts\n \tCommCo\tStorageTech\tNexTec\nCurrent price\t99.70\t100.35\t100.05\nPrice rates up 40 bps\t98.20\t100.00\t98.40\nPrice rates down 40 bps\t100.00\t101.85\t101.70\nTo prepare for rising rates, Harding asks Hamilton to evaluate floating-rate bond issues. She reviews a two-year floater issued by NexTec and creates a two-year binomial interest rate tree for valuation purposes, as shown in Exhibit 2. The bond pays annual coupons based in the one-year MRR. The MRR swap curve is the same as the par yield curve: 2.5% at one year and 3.0% at two years.\nExhibit 2\nYear 0\tYear 1\tYear 2\n2.5000%\t3.8695%\t5.5258%\n\t3.1681%\t4.5242%\n\t\t3.7041%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nHarding subadvises a core-plus bond fund that allows for up to 5% of assets to be invested in convertible debt. Hamilton has read research from Stellwagen’s equity team that has identified StorageTech equity as a top idea, with a price target of $120 per share. The stock does not pay a dividend and is trading for $90.00 per share on 2 April 2017. Harding asks Hamilton to provide him with the current conversion price, conversion value, and market conversion premium per share based on data in Exhibit 3.\nExhibit 3 StorageTech Convertible Bond Data\nIssue Date\t1 April 2015\nMaturity\t1 April 2020\nIssue Par Price\t$1,000.00\nStock Price at Issue\t$80.00\nInitial Conversion Premium\t20.0%\nConvertible Price 2 April 2017\t$1,050.00\nAnnual Coupon\t2.5%\nBased on this information, Hamilton calculates the conversion value to be $937.50 and the market conversion premium per share to be $10.80 per share.", "Meredith Whitney is a senior consultant in the Swaps Advisory Group of DCM Capital, an independent advisory firm. Whitney will be preparing to meet with three clients who need advice on structuring and implementing a swap program to manage their interest rate exposures. She is assisted by a junior analyst from the fixed income group, Toni Yang.\nFor her meetings, Whitney plans to use the data presented in Exhibit 1 below.\nExhibit 1 – Current Term Structure of Rates (%)\nDays\tMRR\tEuribor\tHibor\n90\t1.42\t1.86\t1.22\n180\t1.84\t2.11\t1.53\n270\t2.12\t2.24\t1.70\n360\t3.42\t2.34\t1.87\nNote: MRR is the Market Reference Rate. Euribor is the Euro Interbank Offered Rate. Hibor is the Hong Kong Interbank Offered Rate. All rates shown are annualized.\nWhitney's first meeting is with Novatel, a US based company that currently has an outstanding loan of $250,000,000 that carries a 5.15% fixed interest rate. Novatel's managers feel that the current interest rate on the loan is high and they also believe that interest rates are poised to decline. Whitney advises Novatel to enter into a one-year pay-floating MRR receive-fixed interest rate swap with quarterly payments. The notional principal on the swap will be $250,000,000. Whitney's first task is to determine the appropriate swap rate.\nYang asks Whitney to explain the calculation of the fixed swap rate in a floating-for-fixed interest rate swap. Whitney outlines three possible methods for Yang to consider:\n• Method 1: The swap rate is the difference between MRR and the fixed interest rate on the bond.\n• Method 2: The swap rate is the rate that sets the value of the fixed-rate bond equal to the notional principal of the swap.\n• Method 3: The swap rate is the rate that sets the initial value of the swap equal to zero.\nNext, Whitney meets with Grand Manufacturing. This client is based in Hong Kong but requires a €25,000,000 one-year bridge loan to fund operations in Germany. Grand Manufacturing is currently able to borrow euros at an interest rate of 3.75% but wonders if there is a less expensive alternative. Whitney advises Grand to borrow in HK$ and enter into a one-year foreign currency swap with quarterly payments to pay euros at a fixed rate and receive HK$ at a fixed rate. The current exchange rate is HK$11.42 per €1, and the notional amounts will be exchanged at initiation and at maturity.\nThe final meeting is with KPS Financial Services, a US based asset manager. KPS wants to increase the equity exposure to the US market in one of its portfolios by $100,000,000. Whitney advises KPS to enter into a one-year equity swap with quarterly payments to receive the return on a US stock index and pay a floating MRR interest rate. The current value of the US stock index is 925.\nEach client follows Whitney's advice and immediately implements the recommended position.\nNinety days have passed since Whitney's initial meetings, and in the interim interest rates have increased dramatically. Whitney's clients have asked to meet with her to review their positions.\nIn order to prepare for the meeting, Whitney has obtained updated interest rate data that is presented in Exhibit 2. In addition, she determines that the exchange rate for the Hong Kong dollar is HK$9.96 per €1, and the US stock index is at 905.\nExhibit 2 – Term Structure of Rates 90 Days Later (%)\nDays\tMRR\tEuribor\tHibor\n90\t2.21\t2.94\t1.95\n180\t2.62\t3.03\t2.45\n270\t3.73\t3.08\t2.70\nNote: MRR is the Market Reference Rate. Euribor is Euro Interbank Offered Rate. Hibor is the Hong Kong Interbank Offered Rate. All rates shown are annualized.", "Matthew Riley is a managing director in the Derivatives Group at Stone Ridge Capital Partners (SRCP). Riley specializes in advising clients on the use of derivatives to manage portfolio management strategies. Riley is preparing to meet with four of the firm's clients: Kaeun Kim, Erin Cline, Rahul Mehta, and Michael Mensah.\nThree months ago (90 days), Kim purchased a bond with a 3% annual coupon and a maturity date of seven years from the date of purchase. The bond has a face value of US$1,000 and pays interest every 180 days from the date of issue. Kim is concerned about a potential increase in interest rates over the next year and has approached Riley for advice on how to use forward contracts to manage this risk. Riley advises Kim to enter into a short position in a fixed-income forward contract expiring in 360 days. The annualized risk-free rate now is 1.5% per year and the price of the bond with accrued interest is US$1,103.45.\nOne month ago (30 days), Cline entered a pay floating 3 × 6 forward rate agreement (FRA) at a rate of 2.31% with a notional amount of US$5,000,000. At the time, the three-month MRR was 1.28% and the six-month MRR was 1.8%. Now, 30 days after entering the FRA, two-month MRR is 1.5% and the five-month MRR is 2.5%.\nMehta, who is based in Hong Kong SAR, requires a €25,000,000 one-year bridge loan to fund operations in Germany. He wants to fund this loan at a competitive rate. Riley advises Mehta to borrow HK dollars domestically and then enter into a one-year foreign currency swap to swap into euros. The current exchange rate is HK$9.15 per euro. Exhibit 1 below provides Hong Kong and euro spot interest rates and present value factors.\nExhibit 1 – Hong Kong and Euro Spot Interest Rates\nDays to Maturity\tHK$ Spot Rate (%)\tHK$ PV Factor\tEuro Spot Rate (%)\tEuro PV Factor\n90\t0.610\t0.9985\t0.372\t0.9991\n180\t0.765\t0.9962\t0.422\t0.9979\n270\t0.850\t0.9937\t0.448\t0.9967\n360\t0.935\t0.9907\t0.468\t0.9953\nMichael Mensah is based in Australia and entered into a one-year equity swap 30 days ago. Under the terms of the swap, he would receive the return on the S&P/ASX 300 Metals and Mining Index and pay a fixed annual interest rate of 4.8% on a notional amount of AUD75,000,000. The swap payments are quarterly. At the time the swap was initiated 30 days ago, the value of the S&P/ASX 300 index was 3,250. Today, the value of the S&P/ASX 300 index is 3,738. Exhibit 2 provides present value factors based on the current Australian term structure of interest rates.\nExhibit 2 – Present Value Factors Based on Current Australian Term Structure\nDays to Maturity\tPresent Value Factors\n60\t0.9976\n150\t0.9924\n240\t0.9861\n330\t0.9696", "Mary McNeil is the corporate treasurer at Farmhouse, which owns and operates several farms and ethanol production plants in the United States. McNeil’s primary responsibility is risk management. Katrina Falk, a recently hired junior analyst at Farmhouse, works for McNeil in managing the risk of the firm’s commodity price exposures. Farmhouse’s risk management policy requires the use of futures to protect revenue from price volatility, regardless of forecasts of future prices, and prohibits risk managers from taking speculative positions.\nMcNeil meets with Falk to discuss recent developments in two of Farmhouse’s commodity markets, grains and livestock. McNeil asks Falk about key characteristics of the two markets that affect revenues and costs. Falk tells McNeil the following:\nStatement 1: The life cycle for livestock depends on the product and varies widely by product.\nStatement 2: Grains have well-defined seasons and growth cycles specific to geographic regions.\nA material portion of Farmhouse’s revenue comes from livestock exports, and a major input cost is the cost of grains imported from outside the United States. Falk and McNeil next discuss three conclusions that Falk reached in an analysis of the grains and livestock markets:\nConclusion 1: Assuming demand for grains remains constant, extreme heat in the regions from which we import our grains will result in a benefit to us in the form of lower grain prices.\nConclusion 2: New tariffs on cattle introduced in our primary export markets will likely result in higher prices for our livestock products in our local market.\nConclusion 3: Major improvements in freezing technology allowing for longer storage will let us better manage the volatility in the prices of our livestock products.\nMcNeil asks Falk to gather spot and futures price data on live cattle, wheat, and soybeans, which are presented in Exhibit 1. Additionally, she observes that (1) the convenience yield of soybeans exceeds the costs of its direct storage and (2) commodity producers as a group are less interested in hedging in the forward market than commodity consumers are.\nExhibit 1: Selected Commodity Price Data (Live cattle: US cents per pound; wheat and soybeans: US cents per bushel)\nMarket\tLive Cattle Price\tWheat Price\tSoybeans Price\nSpot\t109\t407\t846\nFutures\t108\t407\t850\nA key input cost for Farmhouse in producing ethanol is natural gas. McNeil uses positions in natural gas (NG) futures contracts to manage the risk of natural gas price volatility. Three months ago, she entered into a long position in natural gas futures at a futures price of $2.93 per million British thermal units (MMBtu). The current price of the same contract is $2.99. Exhibit 2 presents additional data about the three-month futures position.\nExhibit 2: Selected Information—Natural Gas Futures Three-Month Position (NG: $ per MMBtu; 1 contract = 10,000 MMBtu)\nCommodity\tTotal Current $ Exposure\tPosition\tNear-Term Futures (Current Price)\tFarther-Term Futures\nNatural Gas (NG)\t5,860,000\tLong\t2.99\t3.03\nThe futures position is fully collateralized earning a 3% rate. McNeil decides to roll forward her current exposure in the natural gas position.\nEach month, McNeil reports the performance of the energy futures positions, including details on price returns, roll returns, and collateral returns, to the firm’s executive committee. A new committee member is concerned about the negative roll returns on some of the positions. In a memo to McNeil, the committee member asks her to explain why she is not avoiding positions with negative roll returns.", "Matteo Rossi is a financial adviser specializing in commercial real estate investing. He meets with Anika Patel, a new client, who wants to diversify her portfolio by adding real estate investments to it.\nUsing data from an appraisal-based index, Rossi discusses real estate return and risk statistics with Patel and compares them to the return and risk of Patel's current portfolio of stocks and bonds. Based on Patel's investment objectives, Rossi recommends the following types of investments:\n• Investment 1: A real estate operating company (REOC);\n• Investment 2: An equity real estate investment trust (REIT).\nPatel asks Rossi how REITs and REOCs are valued. Rossi mentions that the following measures are widely used in the valuation of REITs and REOCs:\n• Measure 1: EBITDA;\n• Measure 2: Funds from operations (FFO);\n• Measure 3: Adjusted funds from operations (AFFO).\nNext, Rossi presents Patel with the valuation of a REIT. REIT A is a multi-family REIT and its NAV is calculated based on the net operating income (NOI) information in Exhibit 1.\nExhibit 1\n\tREIT A\nProperty subsector\tMulti-family\nLast-12-month real estate NOI\t$280,000\nLast-12-month non-cash rent\t$9,800\nLast-12-month capital expenditures\t$40,000\nCash and equivalents\t$69,300\nTotal debt\t$823,000\nDiscount rate\t6.5%\nEstimated growth rate\t1.5%\nShares outstanding\t50,000", "Julie Carlisle is a financial planner at a large wealth management firm. One of her clients, Esteban Blake, just received a sizable inheritance. He invests a portion of the inheritance in an annuity that will immediately increase his income by a substantial amount. He enlists Carlisle’s help to invest the remaining amount of the inheritance.\nBlake informs Carlisle that he would like some short-term bonds in his portfolio. Carlisle proposes purchasing a one-year domestic government zero-coupon bond. It has a face value of $100 and is currently priced at $96.37. Carlisle estimates the one-year real risk-free rate at 1.15% and expects inflation over the next year to be 2.25%.\nIn an effort to provide Blake with some exposure to international markets, Carlisle proposes three countries to look for investment opportunities. Selected data on the three countries are presented in Exhibit 1.\nExhibit 1\nSelected Macroeconomic Data\n\tNominal GDP Growth\tInflation Rate\tVolatility of Real GDP Growth\tYield Curve Shape\tTrailing 12-Month Equity Index P/E\nCountry #1\t6.5%\t4.0%\tLow\tFlat\t16.5\nCountry #2\t5.0%\t2.5%\tHigh\tUpward slope\t17.3\nCountry #3\t3.5%\t2.0%\tLow\tFlat\t18.2\nIn her analysis, Carlisle observes that the spread between the three-year default-free nominal bond and the default-free real zero-coupon bond in Country #3 is 2.0%.\nBlake expresses concern that stocks may be currently overvalued in Country 3 given its 20-year historical equity index P/E of 16.0. Carlisle comments,\nI think the equilibrium P/E in Country #3 has increased because of changes in market conditions.\nCarlisle predicts that Country #3 will slip into a recession next quarter. She thinks it will be short-lived, lasting only 12 months or so, and considers the impact of such a recession on the performance of the country’s stocks and bonds.\nExhibit 2\nThree-Year Corporate Bonds from Country #3\nCorporate Bond\tMoody’s Investors Service Rating\tSpread*\nBond A\tAaa\t1.4%\nBond B\tBaa1\t3.2%\nBond C\tB3\t5.3%\n*Spread versus three-year sovereign bond", "James Frazee is chief investment officer at H&F Capital Investors. Frazee hires a third-party adviser to develop a custom benchmark for three actively managed balanced funds he oversees: Fund X, Fund Y, and Fund Z. (Balanced funds are funds invested in equities and bonds.) The benchmark needs to be composed of 60% global equities and 40% global bonds. The third-party adviser submits the proposed benchmark to Frazee, who rejects the benchmark based on the following concerns:\nConcern 1: Many securities he wants to purchase are not included in the benchmark portfolio.\nConcern 2: One position in the benchmark portfolio will be somewhat costly to replicate.\nConcern 3: The benchmark portfolio is a float-adjusted, capitalization-weighted portfolio.\nAfter the third-party adviser makes adjustments to the benchmark to alleviate Frazee’s concerns, Frazee accepts the benchmark portfolio. He then asks his research staff to develop risk and expected return forecasts for Funds X, Y, and Z as well as for the benchmark. The forecasts are presented in Exhibit 1.\nExhibit 1\nForecasted Portfolio Statistics for Funds X, Y, and Z and the Benchmark\n\tFund X\tFund Y\tFund Z\tBenchmark\nPortfolio weights:\t\t\t\t\nGlobal equities (%)\t60.0\t65.0\t68.0\t60.0\nGlobal bonds (%)\t40.0\t35.0\t32.0\t40.0\n\t\t\t\t\nExpected return (%)\t10.0\t11.6\t13.2\t9.4\nExpected volatility (%)\t17.1\t18.7\t22.2\t16.3\nActive risk (%)\t5.2\t9.2\t15.1\tN/A\nSharpe ratio (SR)\t0.45\t0.50\t0.49\t0.44\nNote: Data are based on a risk-free rate of 2.3%.\nFrazee decides to add a fourth offering to his group of funds, Fund W, which will use the same benchmark as in Exhibit 1. Frazee estimates Fund W’s information ratio to be 0.35. He is considering adding the following constraint to his portfolio construction model: Fund W would now have maximum over- and underweight constraints of 7% on single-country positions.\nFrazee conducts a search to hire a manager for the global equity portion of Fund W and identifies three candidates. He asks the candidates to prepare risk and return forecasts relative to Fund W’s benchmark based on their investment strategy, with the only constraint being no short selling. Each candidate develops independent annual forecasts with active return projections that are uncorrelated and constructs a portfolio made up of stocks that are diverse both geographically and across economic sectors. Selected data for the three candidates’ portfolios are presented in Exhibit 2.\nExhibit 2\nForecasted Portfolio Data for Equity Portion of Fund W\n\tCandidate A\tCandidate B\tCandidate C\nRebalancing\tAnnually\tAnnually\tAnnually\nNumber of securities\t100\t64\t36\nInformation ratio (IR)\t0.582\t0.746\t0.723\nTransfer coefficient (TC)\t0.832\t0.777\t0.548\nInformation coefficient*\t0.07\t0.12\t0.22\n* Information coefficient based on previously managed funds.\nFrazee asks Candidate C to re-evaluate portfolio data given the following changes:\nChange 1: Fix the number of securities to 50.\nChange 2: Rebalance on a semi-annual basis.\nChange 3: Add maximum over- or underweight constraints on sector weightings.", "S&P 500\tIndigo Fund\nExpected annual return\t9.0%\t10.5%\nReturn standard deviation\t18.0%\t25.0%\nSharpe ratio\t0.333\t0.30\nActive return\t\t1.2%\nActive risk\t\t8.0%\nInformation ratio\t\t0.15\nNote: Data are based on a risk-free rate of 2.3%.", "Carlos Altuve is a manager-of-managers at an investment company that uses quantitative models extensively. Altuve seeks to construct a multi-manager portfolio using some of the funds managed by portfolio managers within the firm. Maya Zapata is assisting him.\nAltuve uses arbitrage pricing theory (APT) as a basis for evaluating strategies and managing risks. From his earlier analysis, Zapata knows that Funds A and B in Exhibit 1 are well diversified. He has not previously worked with Fund C and is puzzled by the data because it is inconsistent with APT. He asks Zapata gather additional information on Fund C’s holdings and to determine if an arbitrage opportunity exists among these three investment alternatives. Her analysis, using the data in Exhibit 1, confirms that an arbitrage opportunity does exist.\nExhibit 1\nExpected Returns and Factor Sensitivities (One-Factor Model)\nFund\tExpected Return\tFactor Sensitivity\nA\t0.02\t0.5\nB\t0.04\t1.5\nC\t0.03\t0.9\nUsing a two-factor model, Zapata now estimates the three funds’ sensitivity to inflation and GDP growth. That information is presented in Exhibit 2. Zapata assumes a zero value for the error terms when working with the selected two-factor model.\nExhibit 2\nExpected Returns and Factor Sensitivities (Two-Factor Model)\nFund\tExpected Return\tSensitivity: Inflation\tSensitivity: GDP Growth\nA\t0.02\t0.5\t1.0\nB\t0.04\t1.6\t0.0\nC\t0.03\t1.0\t1.1\nAltuve asks Zapata to calculate the return for Portfolio AC, composed of a 60% allocation to Fund A and 40% allocation to Fund C, using the surprises in inflation and GDP growth in Exhibit 3.\nExhibit 3\nSelected Data on Factors\nFactor\tResearch Staff Forecast\tActual Value\nInflation\t2.0%\t2.2%\nGDP Growth\t1.5%\t1.0%\nFinally, Altuve asks Zapata about the return sensitivities of Portfolios A, B, and C given the information provided in Exhibit 3.", "Victoria Lazslo is an analyst valuing three firms held in client portfolios.\nFirm A owns a chain of regional dental offices and has no debt. Lazslo initially selects a single-stage residual income model to estimate the intrinsic value of Firm A’s stock and compiles the data in Exhibit 1.\nExhibit 1\nConstant long-term growth rate\t9.6%\nConstant long-term ROE\t16.0%\nMarket price per share\t$220.00\nBook value per share\t$166.00\nCost of equity\t12.5%\nLazslo also considers the possibility that after Year 10 Firm A’s ROE will exhibit mean reversion. She uses a multistage residual income model to value Firm A’s stock and estimates residual income in Year 10 to be $8.38 per share, with a persistence factor of 0.7.\nFirm B is a distributor of building supplies. Firm B’s year-end (Year 0) book value of equity is $111 per share and its cost of equity is 12%. Lazslo forecasts financial data for the next two years in Exhibit 2.\nExhibit 2\n\tYear 1\tYear 2\nNet income\t$26.25\t$31.56\nDividends\t$3.80\t$4.57\nOther comprehensive income\t$0.00\t$2.75\nFirm C is an international carbon capture firm that reported EPS of $3.75 last year. Lazslo forecasts earnings growth of 7%, a required return on equity of 12%, and a dividend payout ratio of 45% for the foreseeable future. She selects the Gordon growth model to value Firm C's stock.", "Nathan Moffet is a fixed-income portfolio manager analyzing the credit risk within a corporate bond portfolio.\nMoffet purchases a senior unsecured bond issued by Company A at a price of $105.35. The bond has the following characteristics:\nAn 8% annual-pay coupon, a face value of $100, and no embedded options\nThree years remain to maturity and a coupon has just been paid\nMoffet collects information on the bond in Exhibit 1, which provides end-of-period data. He uses the information to consider a base case scenario where the bond defaults at the end of Year 3.\nExhibit 1\n\tExposure\tRecovery\tLoss Given Default\tProbability of Default\tExpected Loss\tDiscount Factor\tPresent Value (PV) of Expected Loss\nYear 1\t$117.57\t$47.03\t$70.54\t5.00%\t$3.53\t0.9709\t$3.43\nYear 2\t$112.85\t$45.14\t$67.71\t4.75%\t$3.22\t0.9426\t$3.04\nYear 3\t$108.00\t$43.20\t$64.80\t4.51%\t$2.92\t0.9151\t$2.67\nSum\t---\t---\t---\t14.26%\t$9.67\t---\t$9.14\nMoffet learns that Company B plans to issue a covered bond. He considers the benefits of covered bonds from the perspective of the company.\nMoffet owns $10 million of Bond 1, a 5-year senior unsecured bond issued by Company C. He recently bought credit protection on Company C using a $10 million notional value CDS. The CDS can be settled by physical or cash settlement and its reference obligation is Bond 1. Company C recently filed for bankruptcy and Moffet gathers the information in Exhibit 2 on its outstanding debt obligations.\nExhibit 2\n\tSeniority\tTenor\tPar Value\tCurrent Price\nBond 1\tSenior unsecured\t5 years\t$100\t$40\nBond 2\tSenior unsecured\t4 years\t$100\t$35\nMoffet is considering buying CDS protection on Company D. He does not own any of the company's debt. He gathers the following information for a 3-year CDS on Company D:\nThe credit spread is 550 bps\nThe effective duration is 2.8\nThe coupon rate is 5.0%\nMoffet estimates the upfront premium needed to buy the CDS protection.", "Qiu Tian is a hedge fund manager evaluating options on several equities. She begins with Tara Corp., a non-dividend-paying stock priced in Indian rupees (INR). Tian is bullish on Tara stock and values European-style Tara call options using a two-period binomial model and information from Exhibit 1.\nExhibit 1\nCurrent stock price\tINR 10\nTime to option expiration\t2 years\nRisk-free rate (annual)\t5.0%\nOption strike price\tINR 12\nUp factor per period\t1.50\nDown factor per period\t0.67\nTian observes that the 2-year Tara call option is illiquid. She determines how to replicate a long position in this call option.\nNext, Tian assesses the value of a European-style call option on equity index futures using the Black model. She gathers information related to the call in Exhibit 2. The Black model value of a put with the same underlying, strike price, and time to expiration is 225.\nExhibit 2\nCurrent futures price\t1,100\nTime to expiration\t6 months\nExercise price\t1,300\nRisk-free rate\t5.0%\nTian is also evaluating the addition of Purnima Corp. options to her portfolio. She compares the relative value of three Purnima call options in Exhibit 3. Her objective is to select the option that is cheapest after she makes adjustments for differences in moneyness and time to expiration. Purnima stock is currently trading at INR 62.\nExhibit 3\n\tOption X\tOption Y\tOption Z\nCurrent price\tINR 10.55\tINR 6.89\tINR 6.44\nImplied volatility\t30%\t25%\t35%\nStrike price\tINR 55\tINR 62\tINR 75\nTime to expiration\t8 months\t12 months\t16 months", "Carl Hirayo, CFA, recently joined Summit Investments as a portfolio manager. Hirayo plans to participate in Tarragon Petroleum’s IPO for both his personal account and his clients' accounts. He obtains preclearance for his own participation because the IPO is not fully subscribed at that time. The offering turns out to be fully subscribed at the time of issue and Summit receives all requested shares. Hirayo allocates these shares on a pro rata basis among his subscribing clients and his own account.\nWhile meeting with a client at a restaurant, Hirayo overhears two brokers talking about ION, an electronic manufacturing company. The brokers discuss a report that was released online earlier in the morning by a leading analyst. The report included a merger rumor about ION and the analyst placed a strong buy recommendation on the stock. Hirayo calls his broker to buy 4,000 shares of ION for his personal account.\nHirayo will receive a $60,000 performance bonus from Summit if his monthly portfolio performance exceeds that of Summit's other portfolios. He discloses the bonus arrangement to his existing clients but not to prospective clients. Separately, Hirayo will receive a $12,000 reward from Summit after he successfully brought in 20 clients from his previous employer. This reward is paid by Summit and is not charged to clients. Hirayo does not disclose this reward arrangement to the clients that he brought over.\nSummit's management team decides to further strengthen its record retention policy. The current policy has the following notable provisions:\nProvision 1: Client meeting notes must be preserved in electronic form; hence, any hard copies must be digitized.\nProvision 2: Informal blog posts and short message form posts sourced from the internet do not need to be preserved.\nProvision 3: Research reports and all supporting documents have a retention period of three years.", "Jennifer Francis is a currency specialist helping clients manage their foreign exchange exposures. All currencies are quoted as the amount of the numerator currency per one unit of the denominator currency (e.g., USD/EUR is quoted as the amount of USD per 1 EUR).\nFrancis is working with a client looking to execute a trade in the Thai baht (THB) and Australian dollar (AUD) currency pair. Francis receives a bid–offer quote in THB/AUD (24.3065/24.3090) from a dealer and compares this to the interbank market quotes in THB/USD (33.3942/33.3965) and USD/AUD (0.7276/0.7279) to see if an arbitrage opportunity exists.\nStephan Podowski is a client of Francis' located in Country A, whose currency is the FXA. Podowski's company will receive a payment in Country B's currency (FXB) in 18 months, and he is considering using a forward contract to hedge the currency exposure. Francis uses the following information to determine the forward discount for a 540-day FXA/FXB forward contract:\nFXA/FXB spot exchange rate: 1.1423;\n540-day market reference rate (annualized, Actual/360) for Country A: 1.23%;\n540-day market reference rate (annualized, Actual/360) for Country B: 5.52%.\nNine months ago, Podowski bought EUR 20 million forward against the USD by entering into a 1-year forward contract at 1.1308 USD/EUR. He wants to calculate the mark-to-market value of this position today. The current USD/EUR spot rate is quoted at 1.1352/1.1355 and the 90-day forward points are –14/–12. The annualized 90-day market reference rate (Actual/360) is 0.53% for USD and 0.77% for EUR.\nFrancis is looking for potential carry trades to recommend to her clients. She focuses on a potential trade between the AUD and the South African rand (ZAR). She reviews what market conditions are required for the trade to be profitable.", "Darren Carter is a credit analyst reviewing Gowran Bank. The bank is subject to the Basel III regulatory framework and prepares its financial statements under IFRS.\nCarter first considers Gowran's capital adequacy. For the most recent year end, Gowran reported Common Equity Tier 1 Capital of $15 billion and risk-weighted assets of $100 billion. Carter determines Gowran's pro forma year-end Common Equity Tier 1 Capital ratio to account for the following two events, which occurred after the most recent year end.\nGowran issued $1 billion of Additional Tier 1 Capital.\nThe regulator required Gowran to recognize an additional $3.5 billion of operational risk-weighted assets.\nCarter next assesses Gowran's asset quality by analyzing the adequacy of its allowance for loan losses. Specifically, he examines how the ratio of the bank's allowance for loan losses to non-performing loans changed during the most recent year based on the data (in millions) in Exhibit 1.\nExhibit 1\nNon-performing loans at start of year\t$2,000\nNon-performing loans at end of year\t$2,400\nAllowance for loan losses at start of year\t$1,500\nProvision for loan losses during the year\t$500\nCharge-offs, net of recoveries, during the year\t$200\nGowran has a defined benefit pension plan (Plan A) that is closed to new members. Carter determines the effect of this pension plan on Gowran's income statement.\nAs part of its executive management compensation, Gowran also has a stock option plan (Plan B). Three years ago, Gowran granted executives 5 million at-the-money stock options with a three-year vesting period. On the grant date, Gowran's share price was $12 and the fair value of each option was $3. All of the options are now vested in the current year. Carter determines the effect on Gowran's paid-in capital on its balance sheet in the current year, assuming that 2 million of the stock options are exercised at the strike price of $12 and Gowran's share price is currently $18.", "Andrea Castillo is an investment consultant specializing in alternative investments. One of her clients is the Busilak family office. The Busilak family office considers allocating a portion of its portfolio to hedge funds. Castillo identifies three hedge funds as potential investments for Busilak, Fund X, Fund Y, and Fund Z.\nCastillo assesses the performance of each fund under a crisis scenario where the stock market index falls and stock market volatility rises. Castillo estimates a conditional factor risk model using monthly returns for the past 10 years. Exhibit 1 provides the factor beta estimates of the model. All coefficient estimates are statistically significant.\nExhibit 1\n\tFund X\tFund Y\tFund Z\nNormal Times Exposures\t\t\t\nIntercept\t0.00\t0.00\t0.00\nEquity risk factor (EQU)\t–0.19\t0.43\t–0.03\nVolatility risk factor (VOL)\t0.09\t0.16\t0.01\nCrisis Times Exposures (Incremental)\t\t\t\nDEQU\t0.09\t0.16\t–0.02\nDVOL\t0.27\t–0.18\t0.03\nDEQU is the product of the equity risk factor, EQU, and a dummy variable that equals 1 during crisis periods and 0 otherwise. DVOL is the product of the volatility risk factor, VOL, and the same dummy variable.\nThe family office decides to add hedge funds to the current portfolio to form a new portfolio. The family office's objective is to choose a new portfolio based on maximized risk-adjusted return with risk measured by downside deviation. Exhibit 2 provides the risk and return characteristics of three simulated combined portfolios, with each holding a 20% hedge fund allocation.\nExhibit 2\nPortfolio\tStandard Deviation\tSharpe Ratio\tSortino Ratio\nCurrent portfolio + Fund X\t7.50%\t0.32\t0.48\nCurrent portfolio + Fund Y\t8.80%\t0.43\t0.70\nCurrent portfolio + Fund Z\t7.62%\t0.45\t0.68\nAnother client of Castillo is Pearl University, whose endowment is currently invested in stocks and bonds. Pearl plans to gain long exposure to energy commodities and considers investing in futures contracts.\nCastillo analyzes a recent trade that involved a long position in crude oil futures. The fully collateralized position was held for six months and realized a price return of 6% and a roll return of 4%. The risk-free rate is 2% per year. Castillo computes the 6-month total return for this position.\nCastillo suggests that, instead of futures, Pearl could also use a total return swap based on any of the following broad-based major commodity indexes: the Rogers International Commodity Index (RICI), the Bloomberg Commodity Index (BCOM), or the S&P GSCI. Castillo determines the most appropriate reference index for the swap if the objective is to maximize exposure to energy commodities.", "Imane Kabbaj is the CIO of the Dynamo Fund, which is actively managed and invests in equities and bonds.\nKabbaj reviews the performance of the Dynamo Fund for the past year and focuses on the decomposition of the value added from asset allocation and security selection. Exhibit 1 reflects the return generated by the fund in each asset class compared to the relevant benchmark.\nExhibit 1\nAsset Class\tFund Return\tFund Allocation\tBenchmark Return\tStrategic Asset Allocation\nEquities\t–16%\t50%\t–20%\t60%\nBonds\t–12%\t50%\t–10%\t40%\nKabbaj's goal for the fund's equity exposure is to maximize the Sharpe ratio by optimizing the allocation to active equity risk. She intends to invest in a combination of an active stock selection strategy and its benchmark, a global equity index. Based on the information in Exhibit 2, Kabbaj calculates the weight that should be allocated to the global equity index benchmark portfolio to achieve her goal.\nExhibit 2\n\tActive Stock Selection Strategy\tGlobal Equity Index\nStandard deviation of returns\t23%\t15%\nSharpe ratio\t0.47\t0.53\nActive risk\t9%\t---\nInformation ratio\t0.27\t---\nNext, Kabbaj analyzes the information in Exhibit 3, which shows the yields on corporate bonds, conventional government bonds, and inflation-linked government bonds issued in Country A with the same maturity, along with inflation expectations. She analyzes the bond risk premium to determine the market's confidence in inflation expectations being realized through the business cycle.\nExhibit 3\nCorporate bond yield\t6.28%\nConventional government bond yield\t5.66%\nInflation-linked government bond yield\t2.32%\nSurvey-based inflation expectation\t2.80%\nKabbaj notes that P/E ratios for equities in Country A have recently increased to historically high levels. She observes that real interest rates, the equity risk premium, and real earnings growth expectations have also increased.", "Ulysses Emery is an analyst working on a research report on Zeta Incorporated, a manufacturing firm. The country in which Zeta operates has a flat income tax rate for corporations and a progressive income tax rate for individuals.\nEmery reviews recent EPS and dividend per share (DPS) information for Zeta, presented in Exhibit 1. Zeta follows a target payout adjustment model for dividend payouts with a target payout ratio of 60%. Emery calculates the current year's expected DPS, assuming Zeta moves toward the target payout ratio over four years. Emery forecasts EPS of $2.44 for the current year.\nExhibit 1\n\tMost Recent Year\tTwo Years Ago\tThree Years Ago\tFour Years Ago\nEPS\t$2.13\t$1.33\t$2.41\t$2.24\nDPS\t$1.21\t$1.17\t$1.17\t$1.00\nPayout ratio\t56.8%\t88.0%\t48.5%\t44.6%\nThe following week, Zeta announces its quarterly EPS, which matches market expectations, while its announced dividend is lower than what Emery and the market expected. Zeta's management justifies the announced dividend by stating that the firm faces near-term economic uncertainty in its major markets and needs to maintain its financial flexibility. Emery notes that Zeta's stock price rises after the dividend announcement.\nEmery considers a scenario in which Zeta pays a 10% stock dividend and evaluates its impact on Zeta's financial statements.\nEmery also covers Etaphi Company. He calculates Etaphi's FCFE coverage ratio using the financial information (in $ millions) in Exhibit 2.\nExhibit 2\nNet interest paid\t6\nDividends paid\t76\nShare issuance proceeds\t12\nFCFE\t89", "Yasmine Bernal, an equity analyst, is valuing two port operators: Ariel Port Inc and Boston Terminals Ltd. Bernal uses [free cash flow models] to value the stocks.\nAriel Port is an established business, which maintains moderate leverage and has steadily growing cash flows. Boston Terminals is completing construction of its second terminal this year, partially financed with new debt. Bernal forecasts that revenues of Boston Terminals will rise significantly in the first two years of operations of the new terminal and then stabilize. Bernal expects the leverage of Boston Terminals to decrease in the medium term once the second terminal is operational and the new debt is gradually repaid.\nAriel Port\nBernal reviews key financial data from Ariel Port, which reports under IFRS. Based on data from Ariel's annual report in Exhibit 1, Bernal gathers data for the latest reporting year starting from cash flow from operations (CFO). Ariel Port's tax rate is 30%.\nExhibit 1\nCash Flow Statement ($ Million)\t\nNet income\t648.2\nDepreciation and amortization\t900.0\nDecrease/(increase) in working capital\t100.0\nInterest expense\t183.4\nCash flow from operations\t1,831.6\nNet purchases of fixed assets\t(370.0)\nCash flow from investing activities\t(370.0)\nNew borrowings\t2,298.0\nRepayment of borrowings\t(1,944.0)\nInterest expense\t(262.0)\nCash flow from financing activities\t92.0\nNet change in cash\t1,553.6\nBoston Terminals\nBernal reviews Boston Terminals fundamental data and identifies three variables to consider:\nVariable 1:\tThe dividend payout ratio will decrease in the future\nVariable 2:\tBoston Terminals will have an inconsistent capital structure\nVariable 3:\tCapital expenditures will increase dramatically\nBernal decides to use FCFF to value Boston Terminals.\nThere are rumors that Boston Terminals plans to acquire a competitor, whose shares are currently trading at $24.1 per share. Bernal would like to determine if the stock is fairly valued, using the following assumptions:\nFCFF is estimated at $368 million in Year 1, $442 million in Year 2 and is expected to grow by 3% per year afterwards.\nWACC is 12% and number of outstanding shares is 100 million.\nMarket value of non-operating assets is $300 million.\nBook value of debt is $2,000 million and market value of debt is $2,300 million.\nBernal thinks that the competitor is likely to deploy anti-takeover measures against acquisition by Boston Terminals. She believes the competitor will issue new debt and use the proceeds to buy-back its own shares. Bernal assesses how these measures will affect the competitor's FCFF and FCFE.", "Sarah Kendall is an analyst at a commodity trading firm. She is tasked with evaluating quantitative models to explain precious metal returns. Kendall develops a model with three factors to explain weekly returns (RET):\nRETt = b0 + b1FSIt + b2EPUt + b3GPRt + εt,\nwhere FSI is the weekly change in the financial stress index, EPU is the weekly change in economic policy uncertainty, and GPR is the weekly change in geopolitical risk. She estimates the model for silver and platinum returns using 624 weekly observations.\nKendall gathers the model output for silver returns and tests whether the model explains RET with any statistical significance. She uses the partial ANOVA table results in Exhibit 1 and notes that the critical value of the F-statistic is 3.813 at the 1% significance level and 2.619 at the 5% significance level.\nExhibit 1\nSource\tDegrees of Freedom\tSum of Squares\tMean Squares\nRegression\t3\t0.0453\t0.0151\nResidual\t620\t0.9512\t0.0015\nTotal\t623\t0.9965\t---\nNext, Kendall considers platinum returns. After running the model, she tests for model misspecification. The variance inflation factor for each of the independent variables is close to 1.00, and the Breusch–Godfrey test fails to reject the null hypothesis.\nKendall considers alternate model specifications using the three factors to model platinum returns. Her objective is to select the most parsimonious, best-fitting model. Kendall evaluates several goodness-of-fit measures, including Akaike's information criterion (AIC), Schwarz's Bayesian information criteria (BIC), and R^2. She gathers relevant model output in Exhibit 2.\nExhibit 2\nModel\tFactors\tAIC\tBIC\tR^2\n1\tFSI\t5.134\t5.141\t0.098\n2\tFSI, GPR\t5.132\t5.153\t0.103\n3\tFSI, GPR, EPU\t5.139\t5.160\t0.106\nAs a result of her firm investing in new data sources and technology, Kendall gains access to a wide range of new inputs that could be used to model the commodity market. She decides to utilize this dataset in a machine-learning algorithm with the goal of predicting commodity returns from the complex non-linear data.", "Amanda Glade is an analyst with an investment management firm that actively manages several diversified portfolios. She is currently updating her analysis of investment markets in Country A and Country B, both of which have developed economies, and assessing portfolio performance in preparation for a report to the firm's portfolio managers.\nGlade notes that Country A has a large positive equity risk premium, and she considers what this suggests about investor expectations.\nGlade analyzes the breakeven inflation rate of Country B. She examines the following most recent financial data for the country:\nCurrent yield on a 5-year zero-coupon default-free nominal bond: 4.5%\nCurrent yield on a 5-year zero-coupon default-free real bond: 2.0%\nRisk premium for inflation uncertainty: 0.3%\nNext, Glade assesses the performance of the firm's actively managed global asset portfolio. Using the most recent financial information presented in Exhibit 1, she calculates the value added to the portfolio from asset allocation.\nExhibit 1\n\tPortfolio Return (%)\tBenchmark Return (%)\tCurrent Allocation (%)\tStrategic Asset Allocation (%)\nGlobal equities\t16.4\t12.8\t74\t70\nGlobal fixed income\t–3.4\t–4.5\t26\t30\nGlade considers the possibility of combining one of the firm's actively managed domestic equity funds, Fund X, with an investment in its passive index benchmark portfolio. Using the information in Exhibit 2, she determines the maximum Sharpe ratio that a portfolio manager could achieve by combining Fund X with the passive index benchmark portfolio.\nExhibit 2\n\tIndex\tFund X\nSharpe ratio\t0.275\t0.242\nActive return\t---\t1.5%\nActive risk\t---\t6.0%", "Nicole Zern, an equity analyst, is reviewing preliminary research reports developed by her team for two wireless telecommunications companies: LuftComm and PrimaNet.\nLuftComm\nAfter reviewing the preliminary report for LuftComm, Zern decides to revise it slightly. She notes that interest expense is tax-deductible and collects the selected financial data for LuftComm shown in Exhibit 1.\nExhibit 1\nBook value of total assets at beginning of the year (millions)\t€5,000\nBook value of total debt at beginning of the year (millions)\t€3,000\nEBIT (millions)\t€700\nCorporate tax rate\t15.0%\nROE\t22.1%\nCost of equity\t16.0%\nPretax cost of debt\t6.0%\nMarket price per share\t€44.65\nP/B ratio\t1.90\nAssuming the clean surplus relation holds, Zern uses the data in Exhibit 1 to calculate residual income for the year and then estimates the implied growth rate of earnings for LuftComm based on the current market price.\nPrimaNet\nZern first notes that the team's preliminary report on PrimaNet uses a multistage residual income model with a persistence factor of 0.12, one-quarter of the industry average of 0.48.\nZern next assumes the clean surplus relation holds, and uses the data in Exhibit 2 to update the report based on a finite-horizon multistage residual income model.\nExhibit 2\nCurrent book value per share\t€18.50\nPresent value of residual income per share for Year 1\t€2.25\nPresent value of residual income per share for Year 2\t€2.00\nForecasted book value per share at end of Year 2\t€23.75\nForecasted market price per share at end of Year 2\t€26.50\nCost of equity\t12.8%\nWACC\t6.5%", "Michael Eng manages institutional client portfolios of US Treasury securities. He expects that spot rates one year from now will be the same as they are today. Eng implements a strategy of rolling down the yield curve in one of the managed portfolios. Current information on rates is shown in Exhibit 1.\nExhibit 1\nSpot Rate\t1-year Implied Forward Rate\nr(1) = 0.75%\tf(0,1) = 0.75%\nr(2) = 1.20%\tf(1,1) = 1.65%\nr(3) = 1.45%\tf(2,1) = 1.95%\nr(4) = 1.65%\tf(3,1) = 2.25%\nEng is reviewing the portfolios of his two largest clients. Client 1 restricts Eng to buy only bonds with maturities of three years or less. Even though Eng expects the return of 5-year maturity bonds to be superior to that of 3-year maturity bonds, he continues to invest in 3-year maturities for Client 1's portfolio.\nClient 2's portfolio consists of 1-year, 3-year and 5-year zero-coupon bonds and has an effective duration of 3.20. Eng is concerned about the effect a twist in the yield curve would have on this portfolio. The portfolio's 1-year key rate duration is 0.25 and its 3-year key rate duration is 1.10.", "Greta Edberg is an activist investor with Sintra Partners. Sintra recently acquired a 9.9% equity position in Alfa Corporation and is seeking two board seats.\nAlfa is a mature company that has maintained a constant dividend payout ratio and does not currently have a share repurchase program. In public comments, Edberg recommends a material increase in Alfa's dividend payout ratio and benchmarking the payout to Alfa's competitors.\nEdberg tells Alfa's management that Minskar, one of Alfa's competitors, has a 75% target payout ratio with an adjustment period of four years. Minskar's most recent annual dividend was $0.25 per share. Minskar's EPS is expected to be $1.30 in Year 1 and $1.10 in Year 2 of the adjustment period.\nAs an alternative to Alfa increasing dividends, Edberg proposes a one-time share repurchase using borrowed funds. Edberg's current EPS forecast for Alfa for the next year is $1.50. The company currently has 2,267,000 shares outstanding, its current share price is $30, and its after-tax cost of borrowing is 4.25%. Edberg calculates the revised EPS forecast for Alfa, assuming that 250,000 shares are repurchased immediately at the current share price.\nTaylor Greene, an analyst, oversees the integration of ESG factors into Sintra's investment analysis. Greene analyzes current policies and practices related to Alfa's board and recommends changes that would increase governance effectiveness. Alfa's board has 13 members, seven of whom are independent, and is chaired by the company's CEO. The board has audit, compensation, nomination, risk and compliance, and governance committees.", "Susan Traske is an analyst specializing in financial institutions. She is evaluating Sigmar, a large US-based commercial bank. Traske uses the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach in her evaluation of Sigmar. As part of this analysis, she examines Sigmar's liquidity ratios and notes that the bank's net stable funding ratio has increased steadily over the past three years. She then investigates which components of the ratio explain this trend.\nTraske reviews Sigmar's employee compensation policy and notes that a large restricted stock grant vested during the current year. The share price on the settlement date was greater than the share price on the grant date. Recognizing that Sigmar prepares its financial statements in accordance with US GAAP, Traske considers the effect of the vested grant on Sigmar's income tax expense for the current year.\nSigmar sponsors a defined benefit pension plan for employees. Sigmar's pension disclosure for the most recent year is shown in Exhibit 1 (amounts in $ millions):\nExhibit 1\nInterest cost\t2,875\nCurrent service cost\t535\nActual return on plan assets\t2,895\nExpected return on plan assets\t3,000\nTraske notes that there was no amortization of past service costs, no amortization of actuarial gains or losses, and no amortization of differences between actual and expected return on plan assets.\nFinally, Traske compares the overall efficiency of the underwriting operations of three property and casualty insurance companies based on the information in Exhibit 2.\nExhibit 2\n\tInsurer A\tInsurer B\tInsurer C\nLoss and loss adjustment ratio\t60.2%\t66.4%\t63.1%\nUnderwriting expense ratio\t42.3%\t30.8%\t32.5%", "Maximilian Bueden manages the equity exposure for a family office. All of the office's investment returns are measured in EUR, while equity holdings in foreign currencies are usually hedged to eliminate exchange rate risk. Six months ago, Bueden entered a 3-year receive-equity, pay-fixed, annual-reset equity swap with a notional amount of EUR 1,000,000. At initiation, the fixed rate was 2.3% and the equity index was trading at 100. Now the fixed rate has declined to 1.8% and the equity index is trading at 104.8. Bueden determines the no-arbitrage value of the equity swap based on the present value (PV) factors in Exhibit 1.\nExhibit 1\nMaturity (in Years)\tPV Factor for Equity Swap\n0.5\t0.99108\n1.5\t0.97371\n2.5\t0.95694\nOver the next year, Bueden expects regular cash inflows denominated in Australian dollar (AUD) from the family office's Australian equity portfolio. He hedges the currency exposure by entering into a fixed-for-fixed currency swap with a notional amount of AUD 16 million. The AUD/EUR spot exchange rate is 1.60 AUD per EUR and notional amounts are exchanged at initiation and at maturity. The interest rate on the EUR leg is 1.8%. Bueden calculates the interest rate on the AUD leg that results in a contract value of zero at initiation, based on the present value factors in Exhibit 2.\nExhibit 2\nMaturity (in Years)\tPV Factor for AUD Leg\n0.25\t0.99567\n0.50\t0.99012\n0.75\t0.98345\n1.00\t0.97965\nSum of PV factors:\t3.94889\nBueden next identifies an arbitrage opportunity in shares of Reyab, a publicly traded company. A forward contract on Reyab is trading in the market at EUR 63.25, while the theoretical arbitrage-free price is EUR 63.65.\nFinally, Bueden evaluates a 9-month forward contract on Furblag, another equity holding. He enters into the 9-month forward contract on Furblag at a price of EUR 123. Six months after initiation of the contract, the dividend has been paid and Furblag shares are trading at EUR 131. The annually compounded interest rate is 1.6%."], "modules": {"1": "Quant", "2": "Economics", "3": "CorpIssuer", "4": "FSA", "5": "Equity", "6": "FixedIncome", "7": "Derivatives", "8": "AlternativeInvestments", "9": "PM", "10": "Ethics"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "ecopick", KEY = "ecopick_quiz_state_v1", EXPKEY = "ecopick_quiz_exports_v1", FLAGKEY = "ecopick_flag_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]; }
function srcClass(s){ return s==="ECO"?"src-wrong":s==="Mock"?"src-try":s==="ECO 오답"?"src-wrong":s==="안 푼 문제"?"src-rel":s==="풀어볼 문제"?"src-try":s==="Schweser MQ"?"src-sch":"src-var"; }
/* ---------- flag ---------- */
// Flag: 다시 볼 문제로 표시(분류와 별개). FL[id]=true
var FL = store.get(FLAGKEY)||{};
function isFlag(id){ return !!FL[id]; }
function toggleFlag(id){ if(FL[id]) delete FL[id]; else FL[id]=true; store.set(FLAGKEY,FL); if(S){ S.updatedAt=new Date().toISOString(); save(); } }
function flagList(){ return Object.keys(FL).filter(function(id){return BYID[id];}); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":S.mode==="flag"?"Flag 다시 풀기":(S.label||"전체 풀기");
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var CATS=[
    {key:"eco", label:"ECO 45", test:function(q){return q.src==="ECO";}, primary:true},
    {key:"mock", label:"Mock Flag", test:function(q){return q.src==="Mock";}},
    {key:"all", label:"전체", test:function(q){return true;}},
    {key:"flag", label:"🚩 Flag", test:function(q){return isFlag(q.id);}}
  ];
  function cnt(src){ return Q.filter(function(q){return q.src===src;}).length; }
  var opts='<option value="all">전체 과목 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+Q.filter(function(q){return String(q.module)===m;}).length+'문제)</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">ECO 중요 45문제 + Mock Flag</h2>'+
   '<p class="muted">전 과목 ECO 오답 중에서 고른 <b>ECO</b> '+cnt("ECO")+'문제(약점·출제 빈도·중요도·난이도 기준, Forward mark-to-market 3문제 포함)와, 모의고사에서 Flag한 <b>Mock</b> '+cnt("Mock")+'문제입니다. 문제와 보기는 원문 그대로이고, 예전에 고른 답은 보이지 않습니다. 범위(과목)를 고르고 버튼을 누르세요. 문제 화면의 ⚑ 버튼(F 키)으로 Flag를 켜고 끕니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 · F Flag</p>'+
   (resume||remote?'<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'</div>':'')+
   '<div class="catbtns">'+CATS.map(function(c){return '<button class="btn'+(c.primary&&!resume?' primary':'')+'" data-cat="'+c.key+'"></button>';}).join("")+'</div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function pool(c){ var m=$("selMod").value; return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && c.test(q); }); }
  function labels(){ CATS.forEach(function(c){ var b=document.querySelector('[data-cat="'+c.key+'"]'), n=pool(c).length; b.textContent=c.label+" 풀기 ("+n+")"; b.disabled=!n; }); }
  CATS.forEach(function(c){ document.querySelector('[data-cat="'+c.key+'"]').onclick=function(){
    var order=pool(c).map(function(q){return q.id;}); if(!order.length) return;
    S=fresh(order,c.key==="flag"?"flag":"all"); S.label=c.label.replace("🚩 ","")+" 풀기"; save(); render();
  }; });
  $("selMod").onchange=labels; labels();
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var hasVig = q.vig!==null && q.vig!==undefined;
  var vigPane = hasVig ? '<aside class="vpane"><div class="vhead">케이스 지문 (Vignette)</div><div class="vbody">'+rich(VIG[q.vig])+'</div></aside>' : '';
  var vig = '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span>'+(r?'<span class="tagline">'+esc(q.tag)+'</span>':'')+(isFlag(id)?'<span class="pill src-flag">🚩 Flag</span>':'')+'<button class="btn flag'+(isFlag(id)?' on':'')+'" id="bFlag" title="Flag (F)">'+(isFlag(id)?'🚩 Flag 해제':'⚑ Flag')+'</button></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  if(hasVig) html='<div class="split">'+vigPane+html+'</div>';
  document.body.classList.toggle("wide",hasVig);
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  $("bFlag").onclick=function(){ toggleFlag(id); quiz(); };
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  var flagIds=S.order.filter(isFlag);
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":S.mode==="flag"?"Flag 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bFlagRetry" '+(flagIds.length?'':'disabled')+'>🚩 Flag 다시 풀기 ('+flagIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">이번 라운드 남은 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bFlagRetry").onclick=function(){ if(!flagIds.length) return; S.order=flagIds; S.idx=0; S.mode="flag"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, flagged:isFlag(id), selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    flags:flagList(), label:S.label||"",
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- history export ---------- */
// 이 브라우저에 쌓인 문제별 풀이 기록(첫 풀이 포함)과 지금까지 내보낸 결과를 한 파일로 내려받는다.
function exportHistory(){
  var exps=store.get(EXPKEY)||{};
  if((!S||!S.all||!Object.keys(S.all).length) && !Object.keys(exps).length){ alert("이 브라우저에는 풀이 기록이 없습니다."); return; }
  var file={subject:SUBJECT, kind:"history", exportedAt:new Date().toISOString(), device:navigator.userAgent,
    all:(S&&S.all)||{}, exports:exps,
    flags:flagList(),
    state:S?{order:S.order, mode:S.mode, round:S.round, started:S.started, updatedAt:S.updatedAt||""}:null};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_history_"+today()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  if(at.flags){ FL={}; at.flags.forEach(function(id){ if(BYID[id]) FL[id]=true; }); store.set(FLAGKEY,FL); }
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:(at.mode==="review"||at.mode==="flag")?at.mode:"all", label:at.label||"", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  document.body.classList.remove("wide");
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
$("bHistory").onclick=exportHistory;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
  else if(k==="F" && !e.metaKey && !e.ctrlKey){ toggleFlag(S.order[S.idx]); quiz(); }
});
render();
loadRemote();
})();
</script>
</body>

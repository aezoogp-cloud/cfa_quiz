Incorrect because the capital charge is based on end-of-Year 2 book value of equity.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nBook value at the end of Year 2:\n= Book value at the end of Year 1 + net income – dividends + other comprehensive income = $133.45 + $31.56 – $4.57 + $2.75 = $163.19\nResidual income in Year 2:\n= Net income + other comprehensive income – (cost of capital × end-of-year book value) = $31.56 + $2.75 – (12% × $163.19) = $14.73\nB. $15.55. — Incorrect\nIncorrect because the residual income calculation does not adjust net income for other comprehensive income.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nResidual income in Year 2:\n= Net income – (cost of capital × beginning-of-year book value) = $31.56 – (12% × $133.45) = $15.55\nC. $18.30. — Correct\nCorrect because residual income equals net income minus equity charge (the cost of equity × beginning-of-year book value). The residual income model assumes clean surplus accounting, i.e., end-of-year book value equals beginning-of-year book value + earnings – dividends. However, there are accounting items (referred to as other comprehensive income) that can affect the book value of equity directly while bypassing the income statement.\nIn that case, net income is adjusted by the amount of other comprehensive income.\nBook value at the end of Year 1:\n= Book value at the beginning of Year 1 + net income – dividends + other comprehensive income = $111.00 + $26.25 – $3.80 + $0.00 = $133.45\nResidual income in Year 2:\n= Net income + other comprehensive income – (cost of capital × beginning-of-year book value) = $31.56 + $2.75 – (12% × $133.45) = $18.30", "ko": "① Year 1 말 장부가 = 111 + 26.25 − 3.80 + 0 = 133.45. ② Year 2에 OCI 2.75가 장부가를 직접 바꿨으므로(clean surplus 위반) 이익에 더해 준다. RI_2 = 31.56 + 2.75 − 12% × 133.45 = 34.31 − 16.01 = $18.30.", "trap": "자본비용은 기초(Year 1 말) 장부가에 곱한다. OCI는 이익에 더해 준다.", "f": "RI_t = NI_t + OCI_t − r × B_(t−1)", "why": {"A": "자본비용을 Year 2 말 장부가에 곱했습니다(기초 장부가를 써야 함).", "B": "OCI 2.75를 이익에 더하지 않았습니다."}, "orig": "Mock 1 Session 2 Q3"}, {"id": "mock1-2-Q9", "src": "Mock", "module": 6, "tag": "부도 시 채권 수익률(IRR)", "vig": 29, "stem": "Under his base case scenario, the annualized return on Moffet's Company A bond investment would be closest to:", "opts": {"A": "–19.57%.", "B": "–15.45%.", "C": "–9.29%."}, "ans": "A", "en": "A. –19.57%. — Correct\nCorrect because the return from the bond investment if it defaults at the end of Year 3 is –19.57%.\nIf default occurs at the end of Year 3, the bondholder will have received the two coupon payments for the first two years and can expect to receive the Year 3 recovery value of $43.20 from Exhibit 1.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + $43.20/(1 + IRR)^3\nSolving for IRR results in a value of –19.57%.\nB. –15.45%. — Incorrect\nIncorrect because this answer includes an extra coupon payment in Year 3, which is already reflected in the exposure amount as an accrual.\nThe Year 3 exposure value of $108 already reflects the accrued coupon in Year 3. If default occurs in Year 3, the recovery amount of $43.20 already includes the coupon value expected to be paid along with the principal and hence the coupon should not be added again.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + ($43.20 + $8)/(1 + IRR)^3\nSolving for IRR results in a value of –15.45%.\nC. –9.29%. — Incorrect\nIncorrect because this uses the loss given default value from Year 3 instead of the recovery value.\nThe return can be obtained by solving the equation:\n$105.35 = $8/(1 + IRR) + $8/(1 + IRR)^2 + $64.80/(1 + IRR)^3\nSolving for IRR results in a value of –9.29%.", "ko": "Year 3 말 부도 시나리오: Year 1·2 쿠폰 8씩은 받고, Year 3에는 회수액 43.20만 받는다. 105.35 = 8/(1+IRR) + 8/(1+IRR)^2 + 43.20/(1+IRR)^3 → IRR = −19.57%.", "trap": "Year 3 exposure 108에 이미 Year 3 쿠폰이 들어 있으므로 쿠폰을 따로 더하지 않는다. 회수액(recovery)을 써야 하며 LGD가 아니다.", "f": "105.35 = 8/(1+IRR) + 8/(1+IRR)^2 + 회수액/(1+IRR)^3", "why": {"B": "Year 3 쿠폰 8을 회수액에 또 더했습니다(이미 exposure에 포함).", "C": "회수액 43.20 대신 LGD 64.80을 썼습니다."}, "orig": "Mock 1 Session 2 Q9"}, {"id": "mock1-2-Q35", "src": "Mock", "module": 7, "tag": "선물옵션 put-call parity (Black)", "vig": 30, "stem": "The value of the call option on equity index futures is closest to:", "opts": {"A": "25.", "B": "30.", "C": "35."}, "ans": "B", "en": "A. 25. — Incorrect\nIncorrect because the difference between the futures price and the strike price is not discounted.\nc = (1,100 – 1,300) + 225 = 25\nB. 30. — Correct\nCorrect because the data provided on the put with the same underlying, strike price, and time to expiration is used in the following formula to determine the value of the call option:\nc = e^((-rT)^())[F0(T) – X] + ρ\nρ = 225\nF0(T) = 1,100\nX = 1,300\nr = 0.05\nT = 6 / 12 = 0.5\nTherefore\nc = e^(()^(–0.05 x 0.5))× [1,100 – 1,300] + 225\nc = 0.97531 × (–200) + 225\nc = 29.93802 ≈ 30\nC. 35. — Incorrect\nIncorrect because the 0.5 in the exponent is ignored.\nc = e^(()^(–0.05))[1,100 – 1,300] + 225\nc = 0.95123 × –200 + 225\nc = –190.246 + 225\nc = 34.754 ~ 35", "ko": "c = 225 + e^(−0.05 × 0.5) × (1,100 − 1,300) = 225 + 0.97531 × (−200) = 225 − 195.06 = 29.94 ≈ 30.", "trap": "(F − X)를 할인하고, T = 6/12 = 0.5를 지수에 넣는다.", "f": "c = p + e^(−rT) × (F − X)", "why": {"A": "(F − X)를 할인하지 않았습니다.", "C": "지수에 T = 0.5를 곱하지 않았습니다."}, "orig": "Mock 1 Session 2 Q35"}, {"id": "mock1-2-Q42", "src": "Mock", "module": 10, "tag": "공개된 리포트로 매매: II(A)", "vig": 31, "stem": "When purchasing ION shares, does Hirayo violate the Standards?", "opts": {"A": "No", "B": "Yes, because he acts on material nonpublic information", "C": "Yes, because he does not have a reasonable basis for buying the shares"}, "ans": "A", "en": "A. No — Correct\nCorrect because the leading analyst issued the strong buy rating on ION during the morning, which means it is already public information. According to Standard II(A) Material Nonpublic Information, once the information is disseminated to the market, it is public information that is no longer covered by this standard. Similarly, the rumor about the merger is also no longer considered material nonpublic information.\nB. Yes, because he acts on material nonpublic information — Incorrect\nIncorrect because the leading analyst issued the strong buy rating on ION during the morning, which means it is already public information. According to Standard II(A) Material Nonpublic Information, once the information is disseminated to the market, it is public information that is no longer covered by this standard. Similarly, the rumor about the merger is also no longer considered material nonpublic information.\nC. Yes, because he does not have a reasonable basis for buying the shares — Incorrect\nIncorrect because a reasonable basis is required by Standard V(A) Diligence and Reasonable Basis when making investment analysis, recommendations, and actions for clients and for the firm. Hirayo bought the securities for his own account. The Standards do not impose a requirement of diligence or reasonable basis on personal trades.", "ko": "브로커들이 말한 리포트(합병 루머·강력 매수 의견)는 그날 아침 온라인에 이미 공개된 것이다. 공개된 정보는 MNPI가 아니므로 II(A) 위반이 아니다. 본인 계좌 매매라 고객용 reasonable basis 요건(V(A))도 해당 없다.", "trap": "'식당에서 엿들었다'가 아니라 '이미 공개된 리포트'인지가 핵심이다.", "f": "", "why": {"B": "리포트는 이미 공개돼 비공개 정보가 아닙니다.", "C": "V(A)는 고객·회사를 위한 분석·추천에 적용되고, 본인 계좌 매수에는 해당하지 않습니다."}, "orig": "Mock 1 Session 2 Q42"}, {"id": "mock2-Q36", "src": "Mock", "module": 2, "tag": "carry trade 성공 조건", "vig": 32, "stem": "What condition would best support Francis' trade proposal between AUD and ZAR?", "opts": {"A": "Low market volatility", "B": "Covered interest rate parity not holding in the short term", "C": "The interest rate differential between the two countries being expected to widen after the trade is initiated"}, "ans": "A", "en": "A. Low market volatility — Correct\nCorrect because the payoff in a carry trade is the gradual accrual of the interest rate differential—income that is unrelated to exchange rate volatility. During periods of low turbulence, investors may feel relatively confident that exchange rate movements will not jeopardize the gradual accrual of the interest differential. When volatility in the currency markets spikes, however, the risk of an adverse exchange rate movement rises sharply relative to the gradual flow of income. During periods of low volatility, carry trades tend to generate positive returns, but they are prone to significant crash risk in turbulent times.\nB. Covered interest rate parity not holding in the short term — Incorrect\nIncorrect because for a carry trade to succeed, it is uncovered interest rate parity, not covered interest rate parity, that must not hold. If it held, the investor would receive identical returns from either an unhedged foreign currency return or a domestic currency investment as the appreciation or depreciation of the exchange rate would offset the yield differential. If uncovered interest rate parity held at all times, investors would not be able to profit from a strategy that undertook long positions in high-yield currencies and short positions in low-yield currencies. The change in spot rates over the tenor of the forward contracts would cancel out the interest rate differentials locked in at the inception of the position.\nC. The interest rate differential between the two countries being expected to widen after the trade is initiated — Incorrect\nIncorrect because the difference in yields is locked in at the time of the trade, so the movement of the yield spread once the trade is initiated is irrelevant.", "ko": "carry trade는 저금리 통화를 빌려 고금리 통화에 투자해 금리 차이를 조금씩 쌓는 전략이다. 환율 변동성이 낮으면 환율 손실이 금리 차이 수익을 깎을 위험이 적어 유리하다. 변동성이 커지면 급락(crash) 위험이 크다. 금리 차이는 거래 시작 때 고정되므로 이후 차이가 벌어질 것이라는 예상은 상관없다. 또 깨져야 하는 것은 covered가 아니라 uncovered 금리평가다.", "trap": "carry trade = 낮은 변동성 + uncovered IRP가 성립하지 않을 때.", "f": "", "why": {"B": "carry trade가 성공하려면 covered가 아니라 uncovered 금리평가가 성립하지 않아야 합니다.", "C": "금리 차이는 거래 시작 시점에 고정되므로 이후 벌어지는 것은 관계없습니다."}, "orig": "Mock 2 Session 1 Q36"}, {"id": "mock2-Q88", "src": "Mock", "module": 4, "tag": "스톡옵션 행사와 납입자본", "vig": 33, "stem": "Based on Carter's assumptions regarding the exercise of the share options, paid-in capital on Gowran's balance sheet in the current year will increase by:", "opts": {"A": "$24 million.", "B": "$30 million.", "C": "$42 million."}, "ans": "B", "en": "A. $24 million. — Incorrect\nIncorrect because this ignores the $6 million transferred from share-based compensation reserve to paid-in capital and only considers the $24 million amount which is 2 million options at $12 strike price.\nB. $30 million. — Correct\nCorrect because over the vesting period Gowran will recognize the fraction of the aggregate fair value that vests on the income statement (i.e., 1/3 in this case because the vesting period is three years). The offsetting entry is made to share-based compensation reserve in equity on the balance sheet. Therefore, at the end of year 3, the share-based compensation reserve will total $15 million (5 million options × $3 fair value).\nCarter's assumption is that 2 million share options will be exercised in the current year, therefore Gowran will recognize a cash inflow in financing activities for the receipt of strike price multiplied by the number of options exercised. The entry made to the share-based compensation reserve account is transferred to paid-in capital on the balance sheet.\nIn this case, the share-based compensation reserve would reduce by $6 million (2 million options exercised at $3 fair value) and cash flow from financing activities would increase by $24 million (2 million options at $12 strike price).\nGowran's paid-in capital therefore would increase by $30 million, which includes the $24 million plus the $6 million transferred from share-based compensation reserve.\nC. $42 million. — Incorrect\nIncorrect because the adjustment to paid-in capital is incorrectly calculated as a $36 million increase which is based on 2 million options exercised at the current share price of $18 (rather than using the strike price of $12) plus the $6 million transferred from share-based compensation reserve.", "ko": "가득 기간 동안 공정가치를 비용으로 인식하면서 자본의 주식보상 적립금이 쌓였다(5m × $3 = $15m). 2m개가 행사되면 (1) 행사가로 받은 현금 2m × $12 = $24m이 납입자본에 들어오고, (2) 해당 적립금 2m × $3 = $6m이 납입자본으로 옮겨진다. 합계 $30m 증가.", "trap": "현재 주가($18)가 아니라 행사가($12). 적립금 대체($6m)도 더한다.", "f": "ΔPaid-in capital = 행사 수 × 행사가 + 행사 수 × 부여일 공정가치", "why": {"A": "주식보상 적립금에서 옮겨오는 $6m을 빠뜨렸습니다.", "C": "행사가 대신 현재 주가 $18을 썼습니다."}, "orig": "Mock 2 Session 2 Q44"}, {"id": "mock3-Q57", "src": "Mock", "module": 8, "tag": "위기 시 헤지펀드 팩터 노출", "vig": 34, "stem": "Which fund should be expected to perform best under the crisis scenario?", "opts": {"A": "Fund X", "B": "Fund Y", "C": "Fund Z"}, "ans": "A", "en": "A. Fund X — Correct\nCorrect because, when equity prices fall and volatility rises, the fund that would perform best is the one with the smallest equity risk factor beta and the largest volatility risk factor beta.\nThe table below shows that, during crisis periods, Fund X has historically had the smallest (in this case, largest negative) equity risk factor beta (–0.10) and the largest volatility risk factor beta (0.36).\n\tFund X\tFund Y\tFund Z\nNormal Times Exposures\t\t\t\nIntercept\t0\t0\t0\nEquity risk factor (EQU)\t-0.19\t0.43\t-0.03\nVolatility risk factor (VOL)\t0.09\t0.16\t\nCrisis Times Exposures (Incremental)\t\t\t\nDEQU\t0.09\t0.16\t-0.02\nDVOL\t0.27\t-0.18\t0.03\nCrisis Times Exposures (Total)\t\t\t\nEquity risk factor (EQU + DEQU)\t-0.19 + 0.09 = -0.10\t0.43 + 0.16 = 0.59\t-0.03 - 0.02 = -0.05\nVolatility risk factor (VOL + DVOL)\t0.09 + 0.27 = 0.36\t0.16 - 0.18 = -0.02\t0.01 + 0.03 = 0.04\nB. Fund Y — Incorrect\nIncorrect because, when equity prices fall and volatility rises, the fund that would perform best is the one with the smallest equity risk factor beta and the largest volatility risk factor beta.\nDuring crisis periods, Fund Y has historically had the largest equity risk factor beta (0.59) and the smallest volatility risk factor beta (–0.02). Fund Y is expected to perform worst.\nC. Fund Z — Incorrect\nIncorrect because, when equity prices fall and volatility rises, the fund that would perform best is the one with the smallest equity risk factor beta and the largest volatility risk factor beta.\nDuring crisis periods, Fund X is expected to perform better than Fund Z. Fund X has historically had a larger negative equity risk factor beta than Fund Z (–0.10 versus –0.05) and a larger positive volatility risk factor beta (0.36 versus 0.04).", "ko": "주가가 떨어지고 변동성이 오르는 위기에는 주식 베타가 가장 작고 변동성 베타가 가장 큰 펀드가 유리하다. 위기 총노출: Fund X 주식 −0.19 + 0.09 = −0.10, 변동성 0.09 + 0.27 = 0.36으로 가장 유리하다.", "trap": "평시 노출만 보지 말고 위기 증분을 더한 총노출로 판단한다.", "f": "위기 노출 = 평시 노출 + 위기 증분(DEQU, DVOL)", "why": {"B": "Fund Y는 위기 주식 베타 0.59로 가장 크고 변동성 베타 −0.02.", "C": "Fund Z는 변동성 베타 0.04로 Fund X(0.36)보다 작다."}, "orig": "Mock 3 Session 2 Q13"}, {"id": "mock3-Q75", "src": "Mock", "module": 9, "tag": "채권 위험 프리미엄 (인플레 불확실성)", "vig": 35, "stem": "The bond risk premium for uncertainty about future inflation in Country A is closest to:", "opts": {"A": "0.54%.", "B": "1.16%.", "C": "2.86%."}, "ans": "A", "en": "A. 0.54%. — Correct\nCorrect because the risk premium for uncertainty about future inflation, also known as the bond risk premium, can be approximated as follows: assume that the real return on an index-linked government bond is a good proxy for the real rate of interest that balances savings and investment in an economy over time. If we subtract the yield on an index-linked government bond from the yield on a conventional government bond with a similar maturity and then subtract from this amount a survey-based measure of inflation expectations, what is left over is the bond risk premium. That is, the extra yield investors require for holding a conventional government bond over and above the real required return and the return in compensation for expected inflation.\nTherefore, the calculation is: Conventional government bond yield less inflation-linked government bond yield less survey-based inflation expectation.\n5.66% – 2.32% – 2.80% = 0.54%\nB. 1.16%. — Incorrect\nIncorrect because the corporate bond yield is used as the starting point, however, this is incorrect as this would also include a credit premium.\nThe incorrect calculation is: Corporate bond yield less inflation-linked government bond yield less survey-based inflation expectation.\n6.28% – 2.32% – 2.80% = 1.16%\nC. 2.86%. — Incorrect\nIncorrect because this is calculated as conventional government bond yield less survey-based inflation expectation.\n5.66% – 2.80% = 2.86%", "ko": "명목 국채 수익률 − 물가연동 국채 수익률 − 설문 기대인플레이션 = 5.66% − 2.32% − 2.80% = 0.54%.", "trap": "회사채 수익률로 시작하면 신용 프리미엄이 섞인다.", "f": "BRP = 명목 국채 − 물가연동 국채 − 기대인플레", "why": {"B": "국채 대신 회사채 수익률에서 출발(신용 프리미엄 포함).", "C": "물가연동 국채 수익률을 빼지 않음(명목 − 기대인플레만)."}, "orig": "Mock 3 Session 2 Q31"}, {"id": "mock3-Q80", "src": "Mock", "module": 3, "tag": "FCFE 커버리지 비율", "vig": 36, "stem": "Etaphi's FCFE coverage ratio is closest to:", "opts": {"A": "1.17.", "B": "1.27.", "C": "1.39."}, "ans": "A", "en": "A. 1.17. — Correct\nCorrect because the FCFE coverage ratio is computed as FCFE / [dividends + share repurchases]. Here, there are no share repurchases, only new share issues. The coverage ratio is ($89 / $76) = 1.1711 ≈ 1.17.\nB. 1.27. — Incorrect\nIncorrect because the FCFE coverage ratio is computed as FCFE / [dividends + share repurchases]. Here, an incorrect calculation includes the new share issuance proceeds and net interest paid: $89 / [$76 – $12 + $6] = 1.2714 ≈ 1.27.\nC. 1.39. — Incorrect\nIncorrect because the FCFE coverage ratio is computed as FCFE / [dividends + share repurchases]. Here, an incorrect calculation includes the new share issuance proceeds: $89 / [$76 – $12] = 1.3906 ≈ 1.39.", "ko": "FCFE 커버리지 = FCFE / (배당 + 자사주 매입). 자사주 매입은 없고 신주 발행만 있으므로 = $89 / $76 = 1.17.", "trap": "신주 발행 대금이나 이자를 분모에 넣지 않는다.", "f": "FCFE coverage = FCFE / (Dividends + Buybacks)", "why": {"B": "신주 발행 대금과 순이자를 분모에 반영(89/(76 − 12 + 6)).", "C": "신주 발행 대금 등을 분모에 잘못 반영."}, "orig": "Mock 3 Session 2 Q36"}, {"id": "mock4-Q59", "src": "Mock", "module": 5, "tag": "2단계 FCFF 주당 가치", "vig": 37, "stem": "Based on her assumptions for Boston Terminals competitor, Bernal should conclude that the stock is:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "A", "en": "A. undervalued. — Correct\nCorrect because the fair value of the Boston Terminals competitor is $27.1 per share whereas the shares are currently trading at $24.1 per share.\nThe equity value is the value of the firm minus the market value of its debt plus the market value of its non-operating assets:\nEquity value = Value of operating assets + MV of non-operating assets - MV of debt\nThe value of operating assets can be calculated in a two-stage free cash flow model. The two-stage model is appropriate for Boston Terminals because its FCFF exhibit higher growth in the first two years and dropping to the long-run sustainable rate of 3% thereafter (Stage 2).\nValue of operating assets =\n- free cash flow to firm in Year t\nWACC - weighted average cost of capital\ng - long-term growth rate\n\tY1\tY2\tY3\nFCFF\t368\t442\t455\nDiscount factor\t0.89\t0.80\t0.80\nTV\t\t\t5,053.9\nPV at 12%\t328.6\t352.0\t4,028.9\nFirm value / value of operating assets\t4,709.5\t\t\nUsing the equation and the exhibit above, equity value is calculated as follows:\nFirm Value=\nEquity value = Value of operating assets + MV of non-operating assets - MV of debt\nEquity value = 4,709.5 + 300 - 2,300 = $2,709.5 million\nShare price = $2,709.5 million/100 million shares = $27.1.\nB. fairly valued. — Incorrect\nIncorrect because the fair value of the Boston Terminals competitor is $27.1 per share whereas the shares are currently trading at $24.1 per share. The correct calculation of equity value = Value of operating assets + MV of non-operating assets - MV of debt. However, if the MV of non-operating assets is mistakenly omitted from the formula, this will lead to:\nEquity value = Value of operating assets - MV of debt\nEquity value = 4,709.5 - 2,300 = 2,409.5\nShare price = $2,409.5 million/100 million shares = $24.1.\nC. overvalued. — Incorrect\nIncorrect because the fair value of the Boston Terminals competitor is $27.1 per share whereas the shares are currently trading at $24.1 per share. The correct calculation of equity value = Value of operating assets + MV of non-operating assets - MV of debt. However, if book value of debt is mistakenly used instead of MV of debt, this will lead to:\nEquity value = Value of operating assets + Value of non-operating assets - Book Value of debt\nEquity value = 4,709.5 + 300 - 2,000 = 3,009.5\nShare price = $3,009.5 million/100 million shares = $30.1.", "ko": "FCFF1 368, FCFF2 442, FCFF3 = 442 × 1.03 = 455.3. TV2 = 455.3/(0.12 − 0.03) = 5,059 정도. operating assets 가치 = 368/1.12 + (442 + TV)/1.12^2 ≈ 4,710. 자기자본 = 4,710 + non-operating assets 300 − 부채 시가 2,300 = 2,710 → 주당 $27.1 > 시장가 $24.1 → 저평가.", "trap": "non-operating assets을 빠뜨리면 $24.1(적정), 부채 장부가를 쓰면 $30.1.", "f": "Equity = Σ FCFF/(1+WACC)^t + non-operating assets − 부채 시가", "why": {"B": "non-operating assets 300을 더하지 않음.", "C": "고평가 근거가 없다. 내재가치 $27.1 > 시장가 $24.1 (부채 장부가를 쓰면 $30.1)."}, "orig": "Mock 4 Session 2 Q15"}, {"id": "mock4-Q79", "src": "Mock", "module": 1, "tag": "AIC vs BIC 모형 선택", "vig": 38, "stem": "Which of the models for platinum returns should Kendall select based on her objective?", "opts": {"A": "Model 1", "B": "Model 2", "C": "Model 3"}, "ans": "A", "en": "A. Model 1 — Correct\nCorrect because Model 1 has the lowest Schwarz's Bayesian information criterion (BIC). BIC is preferred when the best goodness of fit is desired and the lower the better.\nB. Model 2 — Incorrect\nIncorrect because Model 2 has the lowest Akaike's information criterion (AIC), which is preferred if the model is used for prediction purposes. However, BIC is preferred when the best goodness of fit is desired and Model 2 does not have the lowest BIC.\nC. Model 3 — Incorrect\nIncorrect because Model 3 has the highest R^2 but this is not generally suitable for testing the significance of the model's fit. The R^2 cannot tell whether the model fit is good. BIC is preferred when the best goodness of fit is desired and Model 3 does not have the lowest BIC.\nIn addition, as both the R^2 and adjusted R^2 may increase when we add independent variables, we risk model overfitting.", "ko": "목표가 가장 간결하면서 잘 적합하는(goodness of fit) 모형이면 BIC를 쓰고 낮을수록 좋다. BIC가 가장 낮은 것은 Model 1(5.141). AIC는 예측 목적일 때 쓴다.", "trap": "AIC 최저(Model 2)는 예측용. R²는 변수만 늘려도 커진다.", "f": "", "why": {"B": "AIC 최저 – 예측 목적일 때.", "C": "R² 최고지만 과적합 위험."}, "orig": "Mock 4 Session 2 Q35"}, {"id": "mock4-Q81", "src": "Mock", "module": 9, "tag": "주식 risk premium과 소비", "vig": 39, "stem": "Country A's equity risk premium most likely suggests that investors expect equity returns and the marginal value of future consumption to be:", "opts": {"A": "negatively correlated.", "B": "uncorrelated.", "C": "positively correlated."}, "ans": "A", "en": "A. negatively correlated. — Correct\nCorrect because an asset’s risk premium is determined by the relationship between its future payoff and the marginal value of consumption as given by the covariance between the two quantities. When the covariance is negative—that is, payoffs are low and expected utility from consumption is high—or equivalently, when times in the future are expected to be bad and the value of an extra unit of consumption is high, the risk premium will be high. When the covariance term is zero (there is no relationship), the asset is risk free. When the covariance term is positive, the asset is a hedge and will have a rate of return less than the risk-free rate. Also, equity investors will demand an equity risk premium if the consumption hedging properties of equities are poor—that is, if equities tend not to pay off in bad times. Our arguments earlier indicate that the equity risk premium should be positive and therefore, implicitly, that equities are a bad hedge for bad consumption outcomes. Thus, a large positive equity risk premium most likely suggests that investors expect the marginal value of future consumption and equity returns to be negatively correlated.\nB. uncorrelated. — Incorrect\nIncorrect because a large positive equity risk premium suggests that investors expect the marginal value of future consumption and equity returns to be negatively correlated. An equity risk premium of zero would suggest that the marginal value of future consumption and equity returns are uncorrelated.\nC. positively correlated. — Incorrect\nIncorrect because a large positive equity risk premium suggests that investors expect the marginal value of future consumption and equity returns to be negatively correlated. A negative (not positive) equity risk premium would suggest that the marginal value of future consumption and equity returns are positively correlated.", "ko": "risk premium은 자산 수익과 미래 소비의 한계 가치 사이 공분산으로 정해진다. 나쁜 시기(소비의 한계 가치가 높을 때)에 주식 수익이 낮으면, 즉 음의 상관이면 risk premium이 크다.", "trap": "상관 0이면 무위험, 양의 상관이면 hedge 자산(수익률 < 무위험).", "f": "", "why": {"B": "상관이 없으면 risk premium 0.", "C": "양의 상관이면 음의 risk premium."}, "orig": "Mock 4 Session 2 Q37"}, {"id": "mock4-Q82", "src": "Mock", "module": 9, "tag": "breakeven inflation rate", "vig": 39, "stem": "Based on the most recent financial data, Country B's breakeven inflation rate is closest to:", "opts": {"A": "2.2%.", "B": "2.5%.", "C": "2.8%."}, "ans": "B", "en": "A. 2.2%. — Incorrect\nIncorrect because this answer choice incorrectly subtracts the risk premium for inflation uncertainty (0.3%) from the difference between the current yield on a 5-year zero-coupon default-free nominal bond (4.5%) and the current yield on a 5-year zero-coupon default-free real bond (2.0%).\nThe difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate. It should be clear from the discussion earlier that this break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon of the two bonds, plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation.\nB. 2.5%. — Correct\nCorrect because the difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate. Thus, the current break-even inflation rate for Country B is 4.5% (current yield on 5-year zero-coupon default-free nominal bond) – 2.0% (current yield on 5-year zero-coupon default-free real bond) = 2.5%.\nC. 2.8%. — Incorrect\nIncorrect because this answer choice incorrectly adds the risk premium for inflation uncertainty (0.3%) to the difference between the current yield on a 5-year zero-coupon default-free nominal bond (4.5%) and the current yield on a 5-year zero-coupon default-free real bond (2.0%).\nThe difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate. It should be clear from the discussion earlier that this break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon of the two bonds, plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation.", "ko": "BEI = nominal 무위험 zero-coupon bond 수익률 − 같은 만기 real zero-coupon bond 수익률 = 4.5% − 2.0% = 2.5%. inflation risk premium은 이미 BEI 안에 포함돼 있어 따로 더하거나 빼지 않는다.", "trap": "risk premium 0.3%를 더하면 2.8%, 빼면 2.2%(이건 기대 인플레이션).", "f": "BEI = nominal 수익률 − real 수익률 (= 기대 인플레이션 + inflation risk premium)", "why": {"A": "risk premium을 뺌.", "C": "risk premium을 더함."}, "orig": "Mock 4 Session 2 Q38"}, {"id": "mock5-Q28", "src": "Mock", "module": 5, "tag": "finite-horizon RI 모델 가치", "vig": 40, "stem": "Based on the finite-horizon multistage residual income model, PrimaNet's intrinsic value per share is closest to:", "opts": {"A": "€24.91.", "B": "€25.17.", "C": "€25.50."}, "ans": "A", "en": "A. €24.91. — Correct\nCorrect because the intrinsic value per share of €24.91 is calculated by adding the present value of residual income in Year 1, present value of income in Year 2, and the present value of the terminal value (premium of market value over book value) at the end of Year 2.\nWhere:\nV0 = Intrinsic value per share today\nB0 = Book value per share today = €18.50 in Exhibit 2\nThe middle term is the sum of the present values of residual income for each year of the forecast period = €2.25 for Year 1 and €2.00 for Year 2\nPT = market price at the end of the forecast period = €26.50\nBT = book value at the end of the forecast period = €23.75\nr = cost of equity = 12.8%\nV0 = 18.50 + 2.25 + 2.00 + [(26.50 - 23.75) / (1.128)^2] = €24.91\nB. €25.17. — Incorrect\nIncorrect because it mistakenly uses the WACC (6.5%) as the discount rate for the premium over book value at the end of Year 2 (Terminal Value of 2.75) instead of the cost of equity (12.80%).\nIncorrect V0 = 18.50 + 2.25 + 2.00 + [(26.50 - 23.75) / (1.065)^2] = €25.17\nC. €25.50. — Incorrect\nIncorrect because it fails to discount the present value of premium (market price less book value) at the end of Year 2 (terminal value of 2.75).\nIncorrect V0 = 18.50 + 2.25 + 2.00 + (26.50 - 23.75) = €25.50", "ko": "V0 = B0 + 각 해 RI의 PV + (P_T − B_T)/(1 + r)^T = 18.50 + 2.25 + 2.00 + (26.50 − 23.75)/1.128^2 = 22.75 + 2.75/1.2724 = 22.75 + 2.16 = €24.91. 할인율은 cost of equity 12.8%.", "trap": "RI 모델 할인율은 WACC가 아니라 cost of equity. 마지막 premium도 할인해야 한다.", "f": "V0 = B0 + Σ PV(RI_t) + (P_T − B_T)/(1 + r_e)^T", "why": {"B": "premium을 WACC 6.5%로 할인.", "C": "premium 2.75를 할인하지 않음."}, "orig": "Mock 5 Session 1 Q28"}, {"id": "mock5-Q34", "src": "Mock", "module": 6, "tag": "spot curve 불변 시 rolldown 수익", "vig": 41, "stem": "Given Eng's expectation for spot rates, the first-year return on a 3-year zero-coupon bond is closest to:", "opts": {"A": "0.75%.", "B": "1.45%.", "C": "1.95%."}, "ans": "C", "en": "A. 0.75%. — Incorrect\nIncorrect because this is the 1-year spot rate. This rate would only have been achieved if the spot rates evolved as implied by the current forward curve. This is not the case under Eng's expectation of an unchanged spot curve.\nB. 1.45%. — Incorrect\nIncorrect because this is the 3-year spot rate. Eng would realize the one-year forward rate for year 3, not the geometric average of the forward rates over the three years.\nC. 1.95%. — Correct\nCorrect because under Eng's spot curve expectation the total return will be the one-year forward rate for year 3. We can see that if the spot rate curve is unchanged, then each bond rolls down the curve and earns the forward rate.\nThis can be shown mathematically by calculating the price of a 3-year zero coupon bond today. Price = 1/(1 + spot rate)^3 = 1/(1.0145^3) = 0.957732. With an unchanged yield curve, this bond will become a 2-year zero coupon bond in one year with a price = 1/(1 + spot rate)^2 = 1/(1.0120^2) = 0.976425. The first year return = 0.976425/0.957732 – 1 ≈ 1.95%, which equals f(2,1) from Exhibit 1.", "ko": "spot curve가 그대로면 3년 zero는 1년 뒤 2년 zero가 되어 2년 spot rate로 가격이 매겨진다. 가격 0 = 1/1.0145^3 = 0.957732, 1년 후 = 1/1.012^2 = 0.976425. 1년 수익 = 0.976425/0.957732 − 1 = 1.95% = f(2,1). curve가 변하지 않으면 각 채권은 해당 1년 forward rate를 번다.", "trap": "forward rate가 실현되면 모든 채권 수익은 1년 spot(0.75%), spot curve가 불변이면 forward rate. 두 가정을 헷갈리지 말 것.", "f": "spot curve 불변 → n년 zero의 1년 수익 = f(n−1, 1)", "why": {"A": "forward curve대로 spot rate가 변할 때의 수익(1년 spot). Eng의 가정은 spot curve 불변.", "B": "3년 spot rate(3년 평균 수익률)이지 첫해 수익이 아니다."}, "orig": "Mock 5 Session 1 Q34"}, {"id": "mock5-Q54", "src": "Mock", "module": 3, "tag": "target payout adjustment model", "vig": 42, "stem": "Using a target payout adjustment model, the expected increase in Minskar's dividend per share in Year 2 of the adjustment period is closest to:", "opts": {"A": "$0.10.", "B": "$0.15.", "C": "$0.18."}, "ans": "A", "en": "A. $0.10. — Correct\nCorrect because the expected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor. The expected dividend increases for Minskar are as follows:\nIn Year 1: ($1.30 × 0.75 − $0.25) × 0.25 = $0.18125 (for a Year 1 dividend of $0.43125)\nIn Year 2: ($1.10 × 0.75 − $0.43125) × 0.25 = $0.0984375 ≈ $0.10\nB. $0.15. — Incorrect\nIncorrect because the calculation uses a 100% target payout ratio instead of 75%, as follows:\nIn Year 1: ($1.30 × 1.00 − $0.25) × 0.25 = $0.2625 (for a Year 1 dividend of $0.5125)\nIn Year 2: ($1.10 × 1.00 − $0.5125) × 0.25 = $0.146875 ≈ $0.15\nC. $0.18. — Incorrect\nIncorrect because this is the expected Year 1 increase, as follows:\nIn Year 1: ($1.30 × 0.75 − $0.25) × 0.25 = $0.18125 ≈ $0.18", "ko": "기대 배당 증가 = (기대 EPS × target payout − 직전 배당) × 조정 계수(1/4년 = 0.25). Year 1: (1.30 × 0.75 − 0.25) × 0.25 = 0.18125 → Year 1 배당 0.43125. Year 2: (1.10 × 0.75 − 0.43125) × 0.25 = (0.825 − 0.43125) × 0.25 = 0.0984 ≈ $0.10.", "trap": "Year 2 계산의 직전 배당은 원래 0.25가 아니라 Year 1 배당 0.43125.", "f": "ΔD = (EPS × target payout − D_prev) × (1/조정 기간)", "why": {"B": "target payout 75% 대신 100% 사용.", "C": "Year 1 증가분."}, "orig": "Mock 5 Session 2 Q10"}, {"id": "mock5-Q67", "src": "Mock", "module": 4, "tag": "US GAAP 연금 비용 (손익계산서)", "vig": 43, "stem": "The total pension expense (in $ millions) reported on Sigmar's income statement for the most recent year is:", "opts": {"A": "410.", "B": "515.", "C": "535."}, "ans": "A", "en": "A. 410. — Correct\nCorrect because there is no amortization of past service costs or actuarial gains and losses, hence the total pension expense (in $ millions) is computed as: Current service cost + Interest cost – Expected return on plan assets = 535 + 2,875 – 3,000 = 410.\nB. 515. — Incorrect\nIncorrect because this answer uses the actual (instead of expected) return on plan assets, hence the total pension expense (in $ millions) is incorrectly computed as: 535 + 2,875 – 2,895 = 515.\nC. 535. — Incorrect\nIncorrect because this answer is the current service cost, and it ignores the interest cost and expected return on plan assets. The current service cost would be recognized in operating expense, but would not be the only pension expense reported on Sigmar's income statement for the most recent year.", "ko": "US GAAP 손익계산서 연금 비용 = current service cost + interest cost − expected return on plan assets + 상각 항목(여기선 없음) = 535 + 2,875 − 3,000 = $410m. actual return이 아니라 expected return을 쓴다.", "trap": "US GAAP은 expected return, actual과의 차이는 OCI.", "f": "Pension expense (US GAAP) = service cost + interest cost − expected return ± 상각", "why": {"B": "expected 대신 actual return 2,895 사용.", "C": "service cost만 반영."}, "orig": "Mock 5 Session 2 Q23"}, {"id": "mock5-Q68", "src": "Mock", "module": 4, "tag": "보험사 combined ratio", "vig": 43, "stem": "Which insurer's underwriting operation is the most efficient overall?", "opts": {"A": "Insurer A", "B": "Insurer B", "C": "Insurer C"}, "ans": "C", "en": "A. Insurer A — Incorrect\nIncorrect because Insurer A has the highest combined ratio (60.2% + 42.3% = 102.5%) compared to Insurer B (66.4% + 30.8% = 97.2%) and Insurer C (63.1% + 32.5% = 95.6%), thus it does not have the most efficient underwriting operation overall.\nB. Insurer B — Incorrect\nIncorrect because Insurer B has a higher combined ratio (66.4% + 30.8% = 97.2%) than Insurer C (63.1% + 32.5% = 95.6%), thus it does not have the most efficient underwriting operation overall.\nC. Insurer C — Correct\nCorrect because Insurer C has the lowest combined ratio (63.1% + 32.5% = 95.6%) compared to Insurer A (60.2% + 42.3% = 102.5%) and Insurer B (66.4% + 30.8% = 97.2%). Combined ratio = Loss and loss adjustment expense ratio + Underwriting expense ratio. This ratio indicates the overall efficiency of an underwriting operation. A combined ratio of less than 100% is considered efficient.", "ko": "underwriting 효율 = combined ratio = loss & LAE ratio + underwriting expense ratio, 낮을수록 효율적. A = 60.2 + 42.3 = 102.5%, B = 66.4 + 30.8 = 97.2%, C = 63.1 + 32.5 = 95.6% → Insurer C가 가장 효율적.", "trap": "한 비율만 보지 말고 두 비율의 합을 비교. 100% 미만이면 underwriting 이익.", "f": "Combined ratio = Loss & LAE ratio + Underwriting expense ratio", "why": {"A": "loss ratio는 가장 낮지만 combined ratio 102.5%로 가장 높다.", "B": "expense ratio는 가장 낮지만 combined ratio 97.2% > C의 95.6%."}, "orig": "Mock 5 Session 2 Q24"}, {"id": "mock5-Q69", "src": "Mock", "module": 7, "tag": "equity swap 가치 (receive equity)", "vig": 44, "stem": "The no-arbitrage value (in EUR) of Bueden's position in the equity swap is closest to:", "opts": {"A": "−19,200.", "B": "23,860.", "C": "33,262."}, "ans": "B", "en": "A. −19,200. — Incorrect\nIncorrect because the sum of the present value factors (0.99108 + 0.97371 + 0.95694 = 2.92173) is multiplied by the fixed income cash flows (1,000,000 x 2.3% = 23,000): 2.92173 x 23,000 = 67,200. This is subtracted from the equity return (1,000,000 x 104.8/100 – 1,000,000 = 48,000) to arrive at –19,200.\nB. 23,860. — Correct\nCorrect because to determine the value of the fixed leg, the present value factors are multiplied by the fixed income cash flows (1,000,000 x 2.3% = 23,000) as follows:\n0.99108 x 23,000 = 22,795\n0.97371 x 23,000 = 22,395\n0.95694 x 1,023,000 = 978,950\nand then 22,795 + 22,395 + 978,950 = 1,024,140.\nThe equity investment becomes 1,000,000 x 104.8 / 100 = 1,048,000.\nThe difference is 1,048,000 - 1,024,140 = 23,860.\nC. 33,262. — Incorrect\nIncorrect because the present value factors are used to determine the equilibrium interest rate (at initiation) by calculating (1 - last PV factor) / Sum of PV-factors. This yields 1 - 0.95694 / 2.92173 = 0.014738. The difference between the equity return of 0.048 and 0.014738 = 0.033262 which multiplied by 1,000,000 = 33,262.", "ko": "fixed leg는 initiation 때 고정한 2.3%로 계속 지급한다(현재 시장 rate 1.8%는 무관). fixed leg 가치 = 23,000 × 0.99108 + 23,000 × 0.97371 + 1,023,000 × 0.95694 = 22,795 + 22,395 + 978,950 = 1,024,140. equity leg 가치 = 1,000,000 × 104.8/100 = 1,048,000. receive-equity 가치 = 1,048,000 − 1,024,140 = EUR 23,860.", "trap": "fixed leg에 notional 원금(1,000,000)을 마지막에 포함해야 한다.", "f": "V(receive equity) = N × S_t/S_0 − N × [c × Σ PV + PV_last]", "why": {"A": "fixed leg를 쿠폰만의 PV(67,200)로 보고 equity 이익 48,000에서 뺌. 원금 PV 처리 누락.", "C": "현재 swap rate를 구해 equity 수익률과 비교하는 잘못된 방법."}, "orig": "Mock 5 Session 2 Q25"}], "vignettes": ["Charles Hollingsworth is an investment strategist at Drawbridge Asset Partners (Drawbridge). He begins a meeting with the following statement:\n\"A few months ago, Drawbridge entered into a carry trade in a set of currencies. This morning, we were unfortunately forced to close out the position at a sizable loss as a result of unexpected market volatility.\"\nHe continues: \"Earlier in the year, Drawbridge hedged a long exposure to the Australian dollar (AUD) by selling AUD 5 million forward against the US dollar (USD); the all-in forward price was 0.8940 (USD/AUD). It is now three months prior to the settlement date, and I want to mark the forward position to market.\"\nExhibit 1 – Current Foreign Exchange Data\nSpot rate (USD/AUD)\t0.9062/0.9066\nThree-month points\t–36.8/–36.4\nThree-month MRR (AUD)\t2.88%\nThree-month MRR (USD)\t0.23%", "Anna Goldsworthy is the chief financial officer of a manufacturing firm headquartered in the United Kingdom. She is responsible for overseeing exposure to price risk in both the commodity and currency markets. Her intern, Scott Underwood, assists her.\nThe firm hedges input costs using forward contracts that are priced in US dollars (USD) and Mexican pesos (MXN). Goldsworthy is expecting to receive a customer payment of JPY 225,000,000 that she wants to convert to pounds sterling (GBP). Underwood gathers the exchange rates from Dealer A in Exhibit 1.\nExhibit 1 – Dealer A's Spot Exchange Rates\nCurrency Pair (Price/Base)\tBid\tOffer\tMidpoint\nJPY/GBP\t129.65\t129.69\t129.67\nMXN/USD\t20.140\t20.160\t20.150\nGBP/EUR\t0.9467\t0.9471\t0.9469\nUSD/EUR\t1.1648\t1.1652\t1.1650\nUSD/GBP\t1.2301\t1.2305\t1.2303\nThe firm must also buy USD to pay a major supplier. Goldsworthy calls Dealer A with specific details of the transaction and asks to verify the USD/GBP quote. Dealer A calls her back later with a revised USD/GBP bid–offer quote of 1.2299/1.2307.\nGoldsworthy must purchase MXN 27,000,000 to pay an invoice at the end of the quarter. In addition to the quotes from Dealer A, Underwood contacts Dealer B, who provides a bid–offer price of GBP/MXN 0.0403/0.0406. To check whether the dealer quotes are reflective of an efficient market, Underwood examines whether the prices allow for an arbitrage profit.\nIn three months, the firm will receive EUR 5,000,000 from another customer. Six months ago, the firm sold EUR 5,000,000 against the GBP using a nine-month forward contract at an all-in price of GBP/EUR 0.9526. To mark the position to market, Underwood collects the GBP/EUR forward rates in Exhibit 2.\nExhibit 2 – GBP/EUR Forward Rates\nMaturity\tForward Points\nOne month\t4.40/4.55\nThree months\t14.0/15.0\nSix months\t29.0/30.0\nGoldsworthy also asks for the current 90-day MRRs for the major currencies (Exhibit 3). She says, \"We have the spot rate and the 90-day forward rate for GBP/EUR. As long as we have the GBP 90-day MRR, we will be able to calculate the implied EUR 90-day MRR.\"\nExhibit 3 – 90-Day MRR\nCurrency\tAnnualized Rate\nGBP\t0.5800%\nJPY\t0.0893%\nUSD\t0.3300%\nAfter reading a draft report, Underwood notes, \"We do not hedge the incoming Japanese yen cash flow. Your report asks for a forecast of the JPY/GBP exchange rate in 90 days. We know the JPY/GBP spot exchange rate. Does the information we have collected tell us what the JPY/GBP exchange rate will be in 90 days?\"\nGoldsworthy replies, \"The JPY/GBP exchange rate in 90 days would be a valuable piece of information to know. An international parity condition can be used to provide an estimate of the future spot rate.\"", "Alexandra Beauregard is an analyst at CapFX Partners, a US-based currency trading firm. She assists foreign currency strategist Robert Thibodeaux.\nThibodeaux notes that current account trends influence the path of exchange rates over time through several mechanisms: \"Of the three mechanisms that economists identify, I have the most confidence in the one that assumes there are long-run limits on current account deficits.\"\nThibodeaux and Beauregard discuss some of CapFX's recent trades. Based on the data in Exhibit 1, a European client recently entered into a one-year JPY/EUR carry trade based on the projected outlook for the two currencies.\nExhibit 1 – Interbank Currency Quotes and One-Year MRR\nCurrency Pair\tBid (Spot)\tOffer (Spot)\tProjected Spot in One Year\nUSD/AUD\t0.7050\t0.7083\t0.7148\nUSD/EUR\t1.0851\t1.0873\t1.0984\nUSD/NZD\t0.6740\t0.6770\t---\nJPY/USD\t117.62\t117.66\t118.32\nOne-year rates: JPY 0.15%, USD 0.80%, EUR 1.40%, NZD 2.00%", "Victor Klymchuk, the chief economist at ECONO Consulting (EC), is reviewing the long-term GDP growth of three countries and is interested in forecasting the long-term change in stock market value for each country.\nExhibit 1 – Select Country Factors and Historical Economic Data (2009–2019)\nCountry\tCountry Factors\tGrowth in Hours Worked (%)\tGrowth in Labor Productivity (%)\tGrowth in TFP (%)\tGrowth in GDP (%)\nCountry A\tHigh savings and investment; highly educated workforce; low tariffs on foreign imports; limited natural resources\t0.9\t2.4\t0.6\t3.3\nCountry B\tDeveloped financial markets; moderate disposable income; significant foreign direct and indirect investments; significant natural resources\t−0.3\t1.6\t0.8\t1.3\nCountry C\tPolitically unstable; limited property rights; poor public education and health; significant natural resources\t1.8\t0.8\t−0.3\t2.6\nStatement 1: \"Over short time horizons, percentage changes in GDP, the ratio of earnings to GDP, and the price-to-earnings ratio are important factors for describing the relationship between economic growth and stock prices. However, I am interested in a long-term stock market forecast.\"\nStatement 4: \"Although countries with greater access to natural resources are often wealthier, the relationship between resource abundance and economic growth is not clear. My analysis shows that the presence of a dominant natural resource (oil) in Country C is constraining growth. Interestingly, Country A has few natural resources but is experiencing a strong rate of increase in per capita GDP growth.\"\nKlymchuk knows that growth in per capita income cannot be sustained by pure capital deepening. He asks the associate economist to determine how important capital deepening is as a source of economic growth for each country, using the data in Exhibit 1.\nThe associate economist believes that developing countries, irrespective of their particular characteristics, will eventually equal developed countries in per capita output. Klymchuk responds:\nStatement 5: \"Poor countries will only converge to the income levels of the richest countries if they make appropriate institutional changes.\"", "Angela Martinez, an energy sector analyst at an investment bank, examines West Texas Intermediate (WTI) monthly crude oil price data, expressed in US dollars per barrel, for the 181-month period from August 2000 through August 2015. The end-of-month WTI oil price was $51.16 in July 2015 and $42.86 in August 2015 (Month 181).\nAfter reviewing the time-series data, Martinez determines that the mean and variance of the time series of oil prices are not constant over time. She then runs the following four regressions:\n• Linear trend model: Oil price t = b0 + b1t + et\n• Log-linear trend model: ln Oil price t = b0 + b1t + et\n• AR(1) model: Oil price t = b0 + b1 Oil price t−1 + et\n• AR(2) model: Oil price t = b0 + b1 Oil price t−1 + b2 Oil price t−2 + et\nExhibit 1 – Crude Oil Price per Barrel, August 2000–August 2015 (t-statistics in parentheses)\n\tLinear\tLog-Linear\tAR(1)\tAR(2)\nR²\t0.5703\t0.6255\t0.9583\t0.9656\nStandard error\t18.6327\t0.3034\t5.7977\t5.2799\nObservations\t181\t181\t180\t179\nDurbin–Watson\t0.10\t0.08\t1.16\t2.08\nRMSE\t\t\t2.0787\t2.0530\nIntercept\t28.3278 (10.1846)\t3.3929 (74.9091)\t1.5948 (1.4610)\t2.0017 (1.9957)\nt (Trend)\t0.4086 (15.4148)\t0.0075 (17.2898)\t\t\nOil price t−1\t\t\t0.9767 (63.9535)\t1.3946 (20.2999)\nOil price t−2\t\t\t\t−0.4249 (−6.2064)\nAt the 5% significance level, the lower critical value for the Durbin–Watson test statistic is 1.75 for both the linear and log-linear regressions.\nExhibit 2 – Autocorrelations of the Residual from AR(1) Model\nLag\tAutocorrelation\tt-Statistic\n1\t0.4157\t5.5768\n2\t0.2388\t3.2045\n3\t0.0336\t0.4512\n4\t−0.0426\t−0.5712\nNote: At the 5% significance level, the critical value for a t-statistic is 1.97.", "Anna Gabor is an analyst with an investment management firm. She is investigating the impact of leverage on annual ROE in the firm's Eurozone equities fund (\"the fund\"). She collects data on the 72 stocks in the fund, including company size as an independent variable.\nExhibit 1 shows the results from estimating the model Ri = b0 + b1(Sizei) + b2(D/Ei) + εi, where:\n• Ri is the annual ROE for company i in the last calendar year in numbers (0.05 is 5%);\n• Sizei is the natural log of the market capitalization of company i (millions of euro) on 31 December;\n• D/Ei is the debt/equity ratio of company i on 31 December;\n• b0 is the intercept; b1, b2 are the slope coefficients for Sizei and D/Ei; εi is the error term.\nExhibit 1\n\tCoefficient\tStandard Error\nIntercept\t0.2248\t---\nSizei\t–0.012\t---\nD/Ei\t–0.0172\t0.00986\nANOVA\tDegrees of freedom\tSum of squares\nRegression\t2\t0.0960\nResidual\t69\t0.5704\nExhibit 2 – Selected values of Student's t-distribution (69 degrees of freedom)\nArea in right tail\tt-value\n0.05\t1.6670\n0.025\t1.9950\nGabor expects to find that both the debt/equity ratio and size are negatively related to ROE. She considers a relationship meaningful when it is statistically significant at the 0.05 level. As part of her analysis Gabor compares the predictions of her model with the actual ROE for two stocks in the portfolio which have the same debt ratio: A and B, which have market capitalizations EUR 100 million and EUR 200 million respectively.\nGabor shares her results with a colleague, Eva Szabo, who warns that the variance of the error terms might not be constant, but positively correlated with D/E and Size. Szabo states that such a flaw would lead to the F- and t-statistics being biased and failing to reject the null hypothesis when it is false.\nAs an additional goal Gabor investigates the impact of qualitative governance factors. She is considering adding two dummy variables to the model: D1 and D2. D1 is 1 for firms with two or more female board members, and otherwise 0. The value of D2 is 1 if the audit committee of the board includes only independent directors, and otherwise 0.\nFinally, Gabor wishes to test the hypothesis that whether or not a stock in the fund is listed on a US (as well as European) exchange is determined by the same independent variables as above (including the governance factors). She employs a logistic regression with the dependent variable of A, which takes on a value of 1 for a company listed on a US exchange and otherwise 0. For Tekdat, a company in the fund which does not have gender diversity on its board, the probability, based on the model, of being listed on a US exchange is 0.65. The regression coefficient of D1 in the logistic model is 0.80 and is statistically significant.", "John Thronen is an analyst in the research department of an international securities firm. Thronen is preparing a research report on Topmaker, Inc., a publicly-traded company that complies with IFRS. Thronen reviews two of Topmaker’s recent transactions relating to investments in Blanco Co. and Rainer Co.\n\nInvestment in Blanca Co.\n\nOn 1 January 2016, Topmaker invested $11 million in Blanca Co. debt securities (with a 5.0% stated coupon rate on par value, payable each 31 December). The par value of the securities is $10 million, and the market interest rate in effect when the bonds were purchased was 4.0%. Topmaker designates the investment as held-to-maturity. On 31 December 2016, the fair value of the securities was $12 million.\n\nBlanca Co. plans to raise $40 million in capital by borrowing against its financial receivables. Blanca plans to create a special purpose entity (SPE), invest $10 million in the SPE, have the SPE borrow $40 million, and then use the total funds to purchase $50 million of receivables from Blanca. Blanca meets the definition of control and plans to consolidate the SPE. Blanca’s current balance sheet is presented in Exhibit 1.\n\nExhibit 1\nBlanca Co. Balance Sheet at 31 December 2016 ($ millions)\nCash\t20\t \tCurrent liabilities\t25\nAccounts receivable\t50\t \tNoncurrent liabilities\t30\nOther assets\t30\t \tShareholders’ equity\t45\nTotal assets\t100\t \tTotal liabilities and equity\t100\nInvestment in Rainer Co.\n\nOn 1 January 2016, Topmaker acquired a 15% equity interest with voting power in Rainer Co. for $300 million. Exhibit 2 presents selected financial information for Rainer on the acquisition date. Thronen notes that the plant and equipment are depreciated on a straight-line basis and have 10 years of remaining life. Topmaker has representation on Rainer’s board of directors and participates in the associate’s policy-making process.\n\nExhibit 2\nSelected Financial Data for Rainer Co., 1 January 2016 (Acquisition Date) ($ millions)\n \tBook Value\tFair Value\nCurrent assets\t270\t270\nPlant and equipment\t2,900\t3,160\nTotal assets\t3,170\t3,430\nLiabilities\t1,830\t1,830\nNet assets\t1,340\t1,600\nThronen notes that, for fiscal year 2016, Rainer reported total revenue of $1,740 million and net income of $360 million, and paid dividends of $220 million.\n\nThronen is concerned about possible goodwill impairment for Topmaker due to expected changes in the industry effective at the end of 2017. He calculates the impairment loss based on selected data from the projected consolidated balance sheet data presented in Exhibit 3, assuming that the cash-generating unit and reporting unit of Topmaker are the same.\n\nExhibit 3\nSelected Financial Data for Topmaker, Inc., Estimated Year Ending 31 December 2017 ($ millions)\nCarrying value of cash-generating unit/reporting unit\t15,200\nRecoverable amount of cash-generating unit/reporting unit\t14,900\nFair value of reporting unit\t14,800\nIdentifiable net assets\t14,400\nGoodwill\t520\nFinally, Topmaker announces its plan to increase its ownership interest in Rainer to 80% effective 1 January 2018 and will account for the investment in Rainer using the partial goodwill method. Thronen estimates that the fair market value of the Rainer’s shares on the expected date of exchange is $2 billion with the identifiable assets valued at $1.5 billion.", "Percy Byron, CFA, is an equity analyst with a UK-based investment firm. One firm Byron follows is NinMount PLC, a UK-based company. On 31 December 2018, NinMount paid £320 million to purchase a 50 percent stake in Boswell Company. The excess of the purchase price over the fair value of Boswell’s net assets was attributable to previously unrecorded licenses. These licenses were estimated to have an economic life of six years. The fair value of Boswell’s assets and liabilities other than licenses was equal to their recorded book values. NinMount and Boswell both use the pound sterling as their reporting currency and prepare their financial statements in accordance with IFRS.\n\nByron is concerned whether the investment should affect his “buy” rating on NinMount common stock. He knows NinMount could choose one of several accounting methods to report the results of its investment, but NinMount has not announced which method it will use. Byron forecasts that both companies’ 2019 financial results (excluding any merger accounting adjustments) will be identical to those of 2018.\n\nNinMount’s and Boswell’s condensed income statements for the year ended 31 December 2018, and condensed balance sheets at 31 December 2018, are presented in Exhibits 1 and 2, respectively.\n\nExhibit 1\nNinMount PLC and Boswell Company Income Statements for the Year Ended 31 December 2018 (£ millions)\n \tNinMount\t \tBoswell\nNet sales\t950\t \t510\nCost of goods sold\t(495)\t \t(305)\nSelling expenses\t(50)\t \t(15)\nAdministrative expenses\t(136)\t \t(49)\nDepreciation & amortization expense\t(102)\t \t(92)\nInterest expense\t(42)\t \t(32)\n   Income before taxes\t125\t \t17\nIncome tax expense\t(50)\t \t(7)\n   Net income\t75\t \t10\nExhibit 2\nNinMount PLC and Boswell Company Balance Sheets at 31 December 2018 (£ millions)\n \tNinMount\t \tBoswell\nCash\t50\t \t20\nReceivables—net\t70\t \t45\nInventory\t130\t \t75\n   Total current assets\t250\t \t140\nProperty, plant, & equipment—net\t1,570\t \t930\nInvestment in Boswell\t320\t \t—\n   Total assets\t2,140\t \t1,070\nCurrent liabilities\t110\t \t90\nLong-term debt\t600\t \t400\n   Total liabilities\t710\t \t490\nCommon stock\t850\t \t535\nRetained earnings\t580\t \t45\n   Total equity\t1,430\t \t580\n   Total liabilities and equity\t2,140\t \t1,070\nNote: Balance sheets reflect the purchase price paid by NinMount, but do not yet consider the impact of the accounting method choice.", "Consolidated Motors is a US-based corporation that sells mechanical engines and components used by electric utilities. Its Canadian subsidiary, Consol-Can, operates solely in Canada. It was created on 31 December 20X1, and Consolidated Motors determined at that time that it should use the US dollar as its functional currency.\n\nChief Financial Officer Monica Templeton was asked to explain to the board of directors how exchange rates affect the financial statements of both Consol-Can and the consolidated financial statements of Consolidated Motors. For the presentation, Templeton collects Consol-Can’s balance sheets for the years ended 20X1 and 20X2 (Exhibit 1), as well as relevant exchange rate information (Exhibit 2).\n\nExhibit 1\nConsol-Can Condensed Balance Sheet for Fiscal Years Ending 31 December (C$ millions)\nAccount\t20X2\t \t20X1\nCash\t135\t \t167\nAccounts receivable\t98\t \t—\nInventory\t77\t \t30\nFixed assets\t100\t \t100\nAccumulated depreciation\t(10)\t \t—\nTotal assets\t400\t \t297\nAccounts payable\t77\t \t22\nLong-term debt\t175\t \t175\nCommon stock\t100\t \t100\nRetained earnings\t48\t \t—\nTotal liabilities and shareholders’ equity\t400\t \t297\nExhibit 2\nExchange Rate Information\n \tUS$/C$\nRate on 31 December 20X1\t0.86\nAverage rate in 20X2\t0.92\nWeighted-average rate for inventory purchases\t0.92\nRate on 31 December 20X2\t0.95\nTempleton explains that Consol-Can uses the FIFO inventory accounting method and that purchases of C$300 million and the sell-through of that inventory occurred evenly throughout 20X2. Her presentation includes reporting the translated amounts in US dollars for each item, as well as associated translation-related gains and losses. The board responds with several questions.\n\nWould there be a reason to change the functional currency to the Canadian dollar?\n\nWould there be any translation effects for Consolidated Motors if the functional currency for Consol-Can were changed to the Canadian dollar?\n\nWould a change in the functional currency have any impact on financial statement ratios for the parent company?\n\nWhat would be the balance sheet exposure to translation effects if the functional currency were changed?", "Marcus Eriksson, chief financial officer of Trana AB, and Katrina Lars, director of financial reporting, are preparing the company’s 2015 annual report. Today’s meeting is to discuss the transactions and disclosures related to Trana’s foreign operations. Trana, which reports under International Financial Reporting Standards (IFRS), is a Sweden-based retailer operating stores in three geographic locations: Sweden, the eurozone (with a current presence only in France, Germany, and Italy), and the United States. The stores in the eurozone and the United States are operated through a wholly owned subsidiary in each region. Consistent with Swedish accounting practice, the annual report includes separate financial statements for the parent company (Trana) and consolidated, or group, financial statements. The income statements are presented in Exhibit 1.\n\nExhibit 1 Trana AB Income Statements for the Years Ended 31 December\n\n \tConsolidated Income Statement (SEK millions)\t\tParent Income Statement (SEK million)\t\n \t2015\t2014\t2015\t2014\nSales\t30,200\t26,892\t4,700\t4,653\nCost of goods sold\t13,590\t12,639\t2,600\t2,650\nGross profit\t16,610\t14,253\t2,100\t2,003\nSelling expenses\t10,872\t9,143\t1,500\t1,525\nAdmin. expenses\t1,510\t1,076\t260\t200\nOperating profit\t4,228\t4,034\t340\t278\nNet other costs/losses\t10\t15\t2\t3\nEarnings before taxes\t4,218\t4,019\t338\t275\nIncome taxes\t1,122\t1,071\t74\t61\nNet profit\t3,096\t2,948\t264\t214\nEriksson and Lars start the meeting by reviewing some of the relevant currency exchange rates, shown in Exhibit 2. The functional currency for the eurozone and US subsidiaries is the local currency (EUR and USD, respectively), thus the financial statements of both are translated using the current rate method. Both subsidiaries are consistently profitable.\n\nExhibit 2 Exchange Rates\n\n \tSEK per EUR\tSEK per USD\nBeginning 2014\t8.43\t6.32\nAverage 2014\t8.555\t6.35\nEnd of 2014\t8.88\t6.38\nAverage 2015\t9.125\t7.595\nEnd of 2015\t9.31\t8.81\nNext, they review the performance and related disclosures by region. The number of stores operated in each region is shown in Exhibit 3.\n\nExhibit 3 Number of Stores by Region\n\nYear\tEurozone\tSweden\tUnited States\tTotal\n2014\t340\t99\t80\t519\n2015\t400\t100\t80\t580\nIn preparation for the meeting, Lars looked at the US region and calculated the effect of the change in the SEK/USD exchange rate on the increase in sales from 2014 to 2015. Her notes include the following:\n\nIn 2014, the sales per store, in SEK, were the same for both US and Swedish stores.\nThe sales per US store in USD remained constant in 2015.\nEriksson reminds Lars that Trana defines organic growth in retail as coming from two factors:\n\nincreasing the number of stores, and\nincreasing the sales per store in the local currency.\nHe says that he wants to provide disclosures related to the organic growth rate in domestic sales per store, by region, and asks Lars to calculate it for the eurozone region where the sales figures (in millions) were SEK18,394 in 2014 and SEK21,640 in 2015.\n\nIn 2012, at the start of Trana’s expansion into North American markets, the company established a subsidiary, Anart Inc., in a South American country to benefit from lower labor and shipping costs. The details of the Anart investment are as follows:\n\nAnart is 80% owned by Trana with 20% local investment.\nIt sells all of its production to Trana and Trana’s other subsidiaries and determines the transfer price as full cost plus 5%.\nIn 2015, sales (in millions) from Anart to Trana companies were SEK4,485 with net profit of SEK204.\nThe corporate tax rate in the country is 10%.\nThroughout 2013, the South American country experienced high rates of inflation, approaching 30% per year. Trana had originally assumed that the high inflation rate was temporary, but it has shown no signs of decreasing and is now a concern. Eriksson and Lars discuss the impact of Anart on Trana’s financial statements and Eriksson asks Lars:\n\n“Is the same accounting method being used this year to account for Anart in the consolidated financial statements as in prior years?”\n\nEriksson reminds Lars that there is a proposal in Sweden to reduce the corporate tax rate from the current 22% to 16.5%. He would like to provide pro-forma disclosures related to the potential change in net income this change could provide for Trana. He reminds Lars that the average tax rate for the eurozone countries where Trana operates is 30% and 25% in the United States. Sweden operates under a tax treaty with all countries in which it has subsidiaries, such that it will owe taxes on foreign earned income to the extent that the Swedish rate exceeds the foreign rate.\n\nIn closing the meeting, Eriksson mentions that Trana is undertaking a comprehensive review of its operations in 2016, and its objectives include reducing overall tax costs by lowering its effective tax rate and reducing foreign exchange gains and losses reported on the income statement.", "XYZ SA is a fictional company that uses a DB pension plan and stock option grants as part of its compensation to qualified employees. XYZ SA prepares its financial statements under IFRS.\n\nInformation on XYZ’s DB plan and volatility assumptions used to value stock option grants were as follows:\n\nXYZ SA Defined BP Information, Fiscal Year 2024\nEmployer contributions\t1,000\nCurrent service costs\t200\nPast service costs\t120\nDiscount rate used to estimate plan liabilities at beginning of year\t7.00%\nBenefit obligation at beginning of year\t42,000\nBenefit obligation at end of year\t41,720\nActuarial loss due to increase in plan obligation\t460\nPlan assets at beginning of year\t39,000\nPlan assets at end of year\t38,700\nActual return on plan assets\t2,700\nExpected rate of return on plan assets\t8.00%\nGrant Year\tWeighted Average Expected Volatility\n2024 Valuation Assumptions\t \n     2020–2024\t21.50%\n2023 Valuation Assumptions\t \n     2019–2023\t23.00%", "Sallie Kwan Industrials (SKI) is a Singapore-based automation equipment manufacturer that reports under US GAAP. The company disclosed the following information in a note to its financial statements titled “Share-Based Compensation.”\n\nUnder our Share Incentive Plan, the Company grants restricted stock units (“RSUs”) to its officers, employees, directors and other eligible persons of up to 83,000,000 Class A ordinary shares. RSUs vest 25% on the first anniversary year from the grant date and the remaining 75% vest in 12 substantially equal quarterly installments. RSU activity for the two years ended 31 December 20X2 was as follows.\n\n \tNumber of Shares\tWeighted Average Grant-Date Fair Value per Share (SGD)\nUnvested at 31 December 20X0\t4,754,972\t12.34\nGranted\t6,249,313\t20.50\nVested and settled\t(2,131,415)\t13.67\nForfeited\t(791,433)\t15.22\nUnvested at 31 December 20X1\t8,081,437\t18.02\nGranted\t5,034,735\t72.37\nVested and settled\t(3,332,063)\t19.25\nForfeited\t(442,181)\t28.74\nUnvested at 31 December 20X2\t9,341,928\t46.36\nShare-based compensation expense for RSUs is measured based on the fair value of the Company’s ordinary shares on the date of grant. SKI accounts for forfeitures as they occur.\n\nUnrecognized share-based compensation expense as of 31 December 20X0, 20X1, and 20X2 was SGD 58.7, SGD 145.6, and SGD 433.1 million, respectively.", "Chan Mei Yee is valuing McLaughlin Corporation common shares using a free cash flow approach. Yee gathered information about McLaughlin from several sources. She begins her analysis by determining free cash flow to the firm (FCFF) and free cash flow to equity (FCFE) for the 2012 fiscal year, using the financial statements in Exhibits 1 and 2. McLaughlin’s fiscal year ends 31 December.\nExhibit 1 McLaughlin Corporation Selected Financial Data ($ millions, except per share amounts)\nFor Year Ending 31 December\t2012\nRevenues\t$6,456\nEarnings before interest, taxes, depreciation, and amortization (EBITDA)\t1,349\nDepreciation expense\t243\nOperating income\t1,106\nInterest expense\t186\nPretax income\t920\nIncome tax (32%)\t294\nNet income\t$626\nNumber of outstanding shares (millions)\t411\n2012 earnings per share\t$1.52\n2012 dividends paid (millions)\t148\n2012 dividends per share\t0.36\n2012 fixed capital investment (millions)\t535\nCost of equity\t12.0%\nWeighted average cost of capital (WACC)\t9.0%\nExhibit 2 McLaughlin Corporation Consolidated Balance Sheets ($ millions)\n \tas of 31 December\t\n\t2012\t2011\nAssets\nCash and cash equivalents\t$32\t$21\nAccounts receivable\t413\t417\nInventories\t709\t638\nOther current assets\t136\t123\nTotal current assets\t$1,290\t$1,199\nCurrent liabilities\t$2,783\t$2,678\nLong-term debt\t2,249\t2,449\nCommon stockholders' equity\t1,072\t594\nTotal liabilities and stockholders' equity\t$6,104\t$5,721\nYee plans to perform two different valuations of McLaughlin, which she calls the “base case” valuation and the “alternative” valuation. Critical assumptions for each are given in the following lists.\nBase case valuation\n2013 FCFF will be $600 million.\nBeyond 2013, FCFF will grow in perpetuity at 4% annually.\nThe market value and book value of McLaughlin’s long-term debt are approximately equal.\nAlternative valuation\n2013 earnings per share (EPS) will be $1.80.\nEPS will grow forever at 6% annually.\nFor 2013 and beyond:\nNet capital expenditures (fixed capital expenditures minus depreciation) will be 30% of EPS.\nInvestments in working capital will be 10% of EPS.\nOf future investments, 60% will be financed with equity and 40% will be financed with debt.\nYee is also concerned about the effects on McLaughlin’s 2013 FCFE of the following three possible financial actions by McLaughlin during the year 2013:\nAction 1: Increasing common stock cash dividends by $110 million\nAction 2: Repurchasing $60 million of common shares\nAction 3: Reducing its outstanding long-term debt by $100 million\nMelissa Nicosia, Yee’s supervisor, reviews McLaughlin’s valuations. Specifically, Nicosia makes the following three statements:\nStatement 1: The free cash flow valuation approach is superior to the discounted dividend valuation approach because the company’s dividends have been substantially different from its FCFE.\nStatement 2: Because the company’s capital structure seems unstable, the FCFE valuation approach is superior to the FCFF valuation approach.\nStatement 3: If there is a change in control at McLaughlin, the discounted dividend valuation approach would be superior to a free cash flow valuation approach.", "Minneapolis Viking Arbitrageurs, LLC (MVA), is a fledgling US-based hedge fund having slightly more than $50 million in assets under management. MVA specializes in owning and managing small-sized properties in agriculture, forestry, and mining.\nJim Hester, MVA’s merger and acquisition (M&A) analyst is evaluating Fargo Durum Farms, Inc. (FDF) for a potential acquisition. FDF owns 1,500 acres of fertile land, farm buildings, machinery, residential quarters, livestock, cattle feed, seeds, grain, significant amounts of intangible assets, and so on. Selected data from FDF’s income statement for the previous year ended and additional estimates compiled by Hester are presented in Exhibits 1 and 2.\nExhibit 1 FDF’s Select Financial Data for the Previous Year Ended\nGross revenues from crops, livestock, feed, and so on\t$2,500,000\nCost of goods sold\t1,000,000\nSelling, general, and administrative expenses (SG&A)\t900,000\nDepreciation and amortization\t200,000\nTax rate\t30%\nNotes:\n1) FDF carries debt in the amount of $750,000 at an interest rate of 8%, and it comprises 30% of total assets on a book value basis. Debt will be a part of the acquisition transaction.\n2) FDF holds $200,000 in cash and short-term investments, but it will not be a part of the assets under acquisition transaction.\nExhibit 2 Additional Data and Hester’s Estimates for Normalization\n1.\tThe cost of goods sold ratio should be higher at 45%.\n2.\tSG&A includes $400,000 in owners’ compensation. According to Hester’s research, owners’ compensation expense for similar sized farms is $200,000.\n3.\tA ranch and living quarters are not required for the farm’s core operations. The reported SG&A expenses include $100,000 for operating expenses relating to those properties. The ranch and living quarters will be kept by the current owners and are not a part of FDF’s farming operations being considered for purchase by the hedge fund.\n4.\tFor pro forma estimations, Hester will consider depreciation and amortization at 10% of gross revenues. He thinks the current tax rate of 30% is reasonable.\nFirst, Hester assesses FDF’s normalized operating income after tax. Next, Hester values FDF’s equity starting with the free cash flow to the firm (FCFF) with the data and assumptions in Exhibit 3.\nExhibit 3 FDF’s Data and Estimates for Valuing Its Equity\nFCFF for Current Year\t$336,250\nFCFF annual growth rate for the foreseeable future\t5%\nFDF’s debt holding at an interest rate of 8.0% per year\t$750,000\nFDF’s weighted average cost of capital (WACC)\t11.50%\nFDF’s cost of equity\t14.00%\nHester presents his initial assessment and valuation of FDF to MVA’s investment committee. The following are comments and suggestions from some members on the committee.\nXavier Moreno, commodities analyst, suggests the use of the excess earnings method (EEM) for valuing FDF and makes the following three statements in support of his preference:\nStatement 1: EEM involves estimating the earnings remaining before deducting amounts that reflect the required returns to the tangible assets.\nStatement 2: EEM is a widely-used method for valuing entire private businesses similar to FDF.\nStatement 3: EEM is especially useful for valuing FDF because it allows for valuing working capital, fixed assets, and intangibles using different discount rates.\nJamal Bahrami, the external consultant on the committee, differs from Hester and prefers the use of the free cash flow to equity (FCFE) model. Furthermore, he develops his own estimates for valuing FDF's equity, shown in Exhibit 4.\nExhibit 4 Bahrami’s Estimates for Valuing FDF’s Equity\n1.\tIn current year, FDF will:\nrealize $1,000,000 in cash flow from operations.\nrequire $400,000 in new capital investment.\nneed additional borrowing in the amount of $250,000 at an interest cost of 8%.\n2.\tBecause of the continued strength in the global demand for wheat, FDF will experience a higher annual growth rate of 10% for the following year; thereafter, it will grow at a constant rate of 6% per year.\n3.\tBecause of illiquidity and small-firm risk premiums, the appropriate WACC and required return on equity will be higher at 12.9% and 16%, respectively.", "Daniel Pegham is a mergers and acquisitions analyst currently advising Horzak Digital, a privately owned, rapidly growing satellite dish manufacturer that reports in USD.\nPegham wants to use FCFE to value the company and recalls that some peers have used EBITDA as a proxy for FCFE. He concludes that EBITDA is not a good proxy for Horzak’s FCFE for two reasons. First, EBITDA fails to account for cash flows from new borrowings. Second, EBITDA understates cash flows for growth companies such as Horzak.\nInstead, Pegham uses the indirect method to calculate FCFE, starting with Horzak’s previous year’s net income. Horzak had two unusual noncash items in the previous year: a USD 5 million after-tax reversal of noncash restructuring charges taken in the previous year, and a USD 2 million after-tax gain.\nHorzak is entirely family-owned, and the president is the largest shareholder. Horzak is subject to a 30% tax rate. Pegham determines that, in the event of a takeover, his valuation should reflect two additional adjustments to normalize net income.\nBoard compensation was USD 1,500,000 in the previous year, compared to USD 800,000 at comparable companies.\nHorzak has had free use of storage facilities owned by the company’s president for warehousing inventory. This benefit would otherwise have cost USD 150,000 in the previous year.\nLastly, Pegham evaluates Horzak using the capitalized cash flow method under the following assumptions.\nNormalized FCFE in the current period (FCFE0) is USD 4.0 million.\nThe long-term growth rate of FCFE is 5%.\nThe market value of debt is USD 6.6 million.\nThe cost of equity is 17.5%.", "Henry Cromwell is the director of quantitative research at Blackfriars Asset Advisers, a fixed-income firm located in London. Rebecca Thames recently joined Cromwell’s analyst team supporting credit analysis and credit risk modeling. After a brief orientation on the firm and its investment process, Cromwell instructs Thames to develop a model that derives the credit valuation adjustment (CVA). Cromwell makes the following comments regarding credit modeling.\n• Comment 1: The factors to consider in modeling credit risk are the expected exposure to default loss, the risk-neutral probability of default, and the loss given default.\n• Comment 2: The use of an actual default rate in the model may overstate the observed value for a corporate bond because it includes a default risk premium associated with uncertainty over the timing of possible default loss.\n• Comment 3: The observed credit spread may also be higher than required for credit risk to compensate for a liquidity premium and tax considerations.\nThames reminds Cromwell that her model assumes zero interest rate volatility and a flat government yield curve. Cromwell responds that Thames should relax these unrealistic assumptions. Thames outlines the steps to take in valuing risky bonds under this scenario in Exhibit 1.\nExhibit 1 Steps in Valuing Risky Bonds, Arbitrage-Free Framework\nStep 1\n• Build the binomial interest rate tree under the assumption of no arbitrage.\n• Apply an assumption of interest rate volatility.\n• Using the spot curve, derive implied zero-coupon rates, discount factors, and forward rates.\nStep 2\n• Use the risk-neutral probability of default as determined by a credit model.\n• Assign a recovery rate based on the company’s credit rating.\n• Calculate the present value of the product of the loss given default and the probability of default.\nStep 3\n• Determine the value for the corporate bond assuming no default (VND).\n• Calculate the CVA.\n• Calculate the fair value of the bond as the VND minus the CVA.\nCromwell works with another analyst, George Hastings, to discuss credit scoring and credit rating models. Hastings starts the conversation by saying, “Credit scoring models are primarily applied to consumers or small business borrowers. In some cases, only negative information, such as delinquencies or defaults, are used, while other models use a mix of factors, such as payment history and recent credit searches.” The focus of credit scores is the probability of default. Hastings continues, “Credit ratings, on the other hand, are used in the corporate and sovereign bond market and also for asset-backed securities. Ratings are focused on probability of default. Credit rating agencies, such as Standard & Poor’s, consider the loss given default by means of notching, which adjusts the issuer rating to reflect the priority of claims in the capital structure.”\nCromwell explains that the migration of a company’s ratings can have an impact on the total return of a bond holding. As an example, he selects a 10-year maturity, 5% coupon bond currently trading at par and rated A+ by Standard & Poor’s. He asks Thames to calculate the expected total return over a one-year horizon assuming the bond is downgraded by two notches and to determine why the year-end duration for the bond is 6.9. The average G-spread for corporate bonds across the credit spectrum is shown in Exhibit 2.\nExhibit 2 Bond Market G-Spread by Credit Rating\nS&P Rating\tG-Spread\tS&P Rating\tG-Spread\nAAA\t0.30\tA\t1.00\nAA+\t0.45\tA–\t1.10\nAA\t0.60\tBBB+\t1.30\nAA–\t0.70\tBBB\t1.45\nA+\t0.85\tBBB–\t1.60\nCromwell and Thames get into a discussion on structural and reduced-form models of credit risk. Cromwell is a proponent of these models and tells Thames, “Structural models are dependent on the structure of the company’s balance sheet. Equity is analogous to a purchased call option on the assets of the company whereby the strike price equals the face value of the debt. Strengths of these models are that they aim to explain why default occurs and are dependent on readily available public information, such as the market value of the company’s assets. Weaknesses are that the models can be burdensome to implement and measuring the default barrier can be challenging.”\nThames responds with her view of credit models for corporate credit risk, saying “Reduced-form models have less restrictive assumptions than structural models. The default intensity is estimated using regression analysis on company-specific and macroeconomic variables. Strengths of these models are that they directly reflect the business cycle in the credit risk measure and its inputs are observable variables. Weaknesses of the model are that they do not explain the reason for default and they assume that default occurs at a defined point in time.”", "Daniela Ibarra is a senior analyst in the fixed-income department of a large wealth management firm. Marten Koning is a junior analyst in the same department, and David Lok is a member of the credit research te

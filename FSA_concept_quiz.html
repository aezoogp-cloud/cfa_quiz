<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FSA Concept Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#side{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--sheet);border-right:1px solid var(--line);overflow-y:auto;z-index:20;transform:translateX(-100%);transition:transform .18s;padding-bottom:40px}
body.side-open #side{transform:none}
#sideBack{display:none;position:fixed;inset:0;background:#0006;z-index:19}
.sd-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;position:sticky;top:0;background:var(--sheet)}
.sd-top button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:2px 9px;cursor:pointer;font:inherit}
.sd-hdr{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:8px 14px 6px;font:600 12px/1.3 inherit;color:var(--ink2);background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.sd-hdr:hover{background:var(--paper)}
.sd-caret{font-size:9px;transition:transform .15s}
.sd-hdr.collapsed .sd-caret{transform:rotate(-90deg)}
.sd-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-cnt{font-size:10px;padding:1px 6px;border-radius:9px;background:var(--paper)}
.sd-cnt.done{background:var(--ok-soft);color:var(--ok)}
.sd-grp.collapsed{display:none}
.sd-q{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 14px;font:12px/1.35 inherit;color:var(--ink2);background:none;border:0;border-left:3px solid transparent;cursor:pointer}
.sd-q:hover{background:var(--paper);color:var(--ink)}
.sd-q.active{border-left-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}
.sd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--line)}
.sd-dot.ok{background:var(--ok)}.sd-dot.bad{background:var(--bad)}
.sd-num{min-width:26px;color:var(--ink2);font-size:11px}
.sd-tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-empty{padding:14px;color:var(--ink2);font-size:13px}
@media (min-width:1000px){body.side-open{padding-left:250px}}
@media (max-width:999px){body.side-open #sideBack{display:block}}
</style>
</head>

오답노트 L13 · 근거 SCH R7"}, {"id": "CON-M1-03", "src": "개념", "module": 1, "tag": "Consolidated revenue – intercompany sales", "vig": null, "stem": "Consolidated revenue includes:", "opts": {"A": "subsidiary sales × ownership %", "B": "the simple sum of parent and subsidiary sales", "C": "only sales to external customers"}, "ans": "C", "en": "L14: Consolidation  매출 = 외부 고객에게 판 매출만 (그룹 내 판매는 제거)", "enLabel": "오답노트 원문", "ko": "Consolidated revenue = sales to external customers only; intragroup sales are eliminated.", "trap": "", "f": "", "why": {"B": "Intercompany sales are eliminated to avoid double counting.", "A": "Adding sales by ownership % is proportionate consolidation."}, "orig": "FSA 오답노트 L14 · 근거 ECO-M1-Q54"}, {"id": "CON-M1-04", "src": "개념", "module": 1, "tag": "Joint venture accounting", "vig": null, "stem": "Under IFRS and US GAAP, an investment in a joint venture is normally accounted for using:", "opts": {"A": "proportionate consolidation under IFRS and the equity method under US GAAP", "B": "the equity method under both standards", "C": "full consolidation (acquisition method) under both"}, "ans": "B", "en": "L15: IFRS·US GAAP 모두 Joint Venture는 equity method(single-line)", "enLabel": "오답노트 원문", "ko": "Both IFRS and US GAAP: joint venture → equity method (single-line).", "trap": "", "f": "", "why": {"A": "Proportionate consolidation is allowed only in rare cases.", "C": "A joint venture is not controlled, so it is not consolidated."}, "orig": "FSA 오답노트 L15 · 근거 ECO-M1-Q55"}, {"id": "CON-M1-05", "src": "개념", "module": 1, "tag": "Joint venture revenue in consolidated revenue", "vig": null, "stem": "Under the equity method, how much of a joint venture's revenue is included in the investor's consolidated revenue?", "opts": {"A": "All of the joint venture's revenue", "B": "Zero", "C": "Joint venture revenue × ownership %"}, "ans": "B", "en": "L36: Equity method 이익 = 지분 × NI  - equity in earning으로 single-line으로 반영됨\nL38: 매출·비용은 라인별 반영 없음 → Joint Venture 매출이 consolidated 매출에 포함되는 금액 = 0 (이익이 0이라는 뜻이 아님)", "enLabel": "오답노트 원문", "ko": "The equity method shows only ownership % × net income in a single line → no revenue or expense lines (this does not mean income is zero).", "trap": "", "f": "", "why": {"C": "Adding line items by ownership % is proportionate consolidation.", "A": "Including all revenue happens only under full consolidation."}, "orig": "FSA 오답노트 L36 · 근거 ECO-M1-Q17"}, {"id": "CON-M1-06", "src": "개념", "module": 1, "tag": "IFRS 9 reclassification", "vig": null, "stem": "Under IFRS 9, when the business model changes, which financial assets may be reclassified?", "opts": {"A": "Both debt and equity instruments", "B": "Equity instruments only", "C": "Debt instruments only"}, "ans": "C", "en": "L17: Financial asset의 business model 변경 시 dept만 reclassification 가능. equity는 불가", "enLabel": "오답노트 원문", "ko": "Business model change → only debt can be reclassified; equity cannot.", "trap": "", "f": "", "why": {"B": "The fair value through profit or loss / fair value through other comprehensive income designation of equity instruments is irrevocable.", "A": "Equity instruments cannot be reclassified."}, "orig": "FSA 오답노트 L17 · 근거 SCH R7 / ECO-M1-Q56"}, {"id": "CON-M1-07", "src": "개념", "module": 1, "tag": "IFRS goodwill impairment level", "vig": null, "stem": "Under IFRS, goodwill is tested for impairment at the level of the:", "opts": {"A": "individual asset", "B": "reporting unit", "C": "cash-generating unit (CGU)"}, "ans": "C", "en": "L20: IFRS: 인식된 goodwill→ CGU에 배분, 연 1회, CGU carrying value > recoverable amount이면 impairment (U.S. GAAP은 reporting unit)", "enLabel": "오답노트 원문", "ko": "IFRS: goodwill is allocated to cash-generating units and tested annually; impairment if carrying value > recoverable amount (US GAAP uses the reporting unit).", "trap": "", "f": "", "why": {"B": "The reporting unit is the US GAAP level.", "A": "Goodwill does not generate cash flows on its own, so it is allocated to cash-generating units."}, "orig": "FSA 오답노트 L20 · 근거 SCH-M1-05"}, {"id": "CON-M1-08", "src": "개념", "module": 1, "tag": "Equity method investment impairment", "vig": null, "stem": "Implicit goodwill inside an equity method investment is tested for impairment:", "opts": {"A": "as part of the whole investment, treated as a single asset", "B": "separately from the investment every year", "C": "by amortizing it each year"}, "ans": "A", "en": "L21: Equity method →  Investment in Associate 전체를 single asset으로 impairment test (별도 인식 x) → Impairment loss는 IS에 인식\nL22: Equity method의 암묵적 goodwill은 별도 자산이 아님 → 투자 전체를 한 자산으로 test (손상 징후 시)", "enLabel": "오답노트 원문", "ko": "Implicit goodwill in an equity method investment is not a separate asset → test the whole investment as one asset; impairment loss goes to the income statement.", "trap": "", "f": "", "why": {"B": "Implicit goodwill is not recognized as a separate asset.", "C": "Goodwill is not amortized."}, "orig": "FSA 오답노트 L21 · 근거 SCH R7"}, {"id": "CON-M1-09", "src": "개념", "module": 1, "tag": "Equity method – fair value option", "vig": null, "stem": "The fair value option for equity method investments is available:", "opts": {"A": "under US GAAP; under IFRS only to venture capital firms, mutual funds, and similar entities", "B": "only under IFRS, not under US GAAP", "C": "to all entities under both IFRS and US GAAP"}, "ans": "A", "en": "L23: equity method 투자에 FV option은 US GAAP만 허용 → change in value, dividend → I/S에 인식\nL25: IFRS에서는 venture capital, mutual fund만 FV사용 가능", "enLabel": "오답노트 원문", "ko": "Fair value option: allowed under US GAAP (changes in value and dividends → income statement); under IFRS only venture capital firms, mutual funds, and similar entities.", "trap": "", "f": "", "why": {"C": "IFRS limits it to certain entities.", "B": "It is the reverse: US GAAP allows it."}, "orig": "FSA 오답노트 L23 · 근거 SCH R7"}, {"id": "CON-M1-10", "src": "개념", "module": 1, "tag": "Bargain purchase", "vig": null, "stem": "If the purchase price is less than the fair value of identifiable net assets (negative goodwill), the difference is:", "opts": {"A": "recognized in other comprehensive income and amortized", "B": "recognized immediately as a gain in profit or loss", "C": "recorded as a negative goodwill asset"}, "ans": "B", "en": "L26: Goodwill = 지급액 − identificational Net Asset의 FV\nL28: 음수면 bargain purchase → 즉시 P&L gain", "enLabel": "오답노트 원문", "ko": "Goodwill = price paid − fair value of identifiable net assets; if negative → bargain purchase → immediate gain in profit or loss.", "trap": "", "f": "", "why": {"C": "There is no negative goodwill asset.", "A": "A bargain purchase gain goes to profit or loss."}, "orig": "FSA 오답노트 L26 · 근거 ECO-M1-Q53"}, {"id": "CON-M1-11", "src": "개념", "module": 1, "tag": "Goodwill – target's existing goodwill", "vig": null, "stem": "When calculating goodwill, goodwill already on the target company's books is:", "opts": {"A": "excluded, because it is not an identifiable asset", "B": "included in identifiable net assets", "C": "revalued to fair value and included"}, "ans": "A", "en": "L32: 피인수 회사의 기존 goodwill은 식별가능 자산이 아니라 제외", "enLabel": "오답노트 원문", "ko": "The target's existing goodwill is not an identifiable asset → excluded.", "trap": "", "f": "", "why": {"B": "Existing goodwill is not an identifiable asset.", "C": "Revaluing it does not make it identifiable."}, "orig": "FSA 오답노트 L32 · 근거 SCH R7"}, {"id": "CON-M1-12", "src": "개념", "module": 1, "tag": "Partial vs full goodwill – return on assets", "vig": null, "stem": "Comparing IFRS partial goodwill with US GAAP full goodwill, return on assets is higher under:", "opts": {"A": "neither; they are the same", "B": "partial goodwill (IFRS)", "C": "full goodwill (US GAAP)"}, "ans": "B", "en": "L33: Partial: goodwill↓ → 총자산↓, NCI↓. NI는 동일 → ROA는 partial이 더 높음", "enLabel": "오답노트 원문", "ko": "Partial goodwill: goodwill↓ → total assets↓, non-controlling interest↓; net income is the same → return on assets is higher under partial goodwill.", "trap": "", "f": "", "why": {"C": "Full goodwill records more goodwill, so total assets are larger.", "A": "Net income is the same, but total assets differ."}, "orig": "FSA 오답노트 L33 · 근거 ECO-M1-Q58"}, {"id": "CON-M1-13", "src": "개념", "module": 1, "tag": "Size of non-controlling interest", "vig": null, "stem": "The non-controlling interest (NCI) is larger under:", "opts": {"A": "the full goodwill method", "B": "the partial goodwill method", "C": "neither; they are the same"}, "ans": "A", "en": "L35: NCI는 US GAAP(full)이 더 큼", "enLabel": "오답노트 원문", "ko": "Non-controlling interest is larger under US GAAP (full goodwill).", "trap": "", "f": "", "why": {"B": "Under partial goodwill, the non-controlling interest has no share of goodwill.", "C": "Under full goodwill, the non-controlling interest includes its share of goodwill."}, "orig": "FSA 오답노트 L35 · 근거 ECO-M1-Q45"}, {"id": "CON-M1-14", "src": "개념", "module": 1, "tag": "Fair value through profit or loss income", "vig": null, "stem": "For a financial asset at fair value through profit or loss (FVPL), the amount recognized in the income statement is:", "opts": {"A": "dividends + change in fair value", "B": "dividends only", "C": "change in fair value only"}, "ans": "A", "en": "L40: FVPL 일 때 IS에 인식하는 FVPL income = Dividends + ΔFair value", "enLabel": "오답노트 원문", "ko": "Fair value through profit or loss income = dividends + change in fair value.", "trap": "", "f": "", "why": {"B": "Dividends only in profit or loss applies to equity at fair value through other comprehensive income.", "C": "Dividends are also recognized in profit or loss."}, "orig": "FSA 오답노트 L40 · 근거 SCH R7"}, {"id": "CON-M1-15", "src": "개념", "module": 1, "tag": "Fair value through other comprehensive income – equity", "vig": null, "stem": "For equity instruments designated at fair value through other comprehensive income (FVOCI), unrealized gains and losses go to:", "opts": {"A": "nowhere; the asset stays at cost", "B": "other comprehensive income (only dividends go to profit or loss)", "C": "profit or loss"}, "ans": "B", "en": "L45: | FVOCI | 배당만 P&L, 평가손익(기말 FV− 취득가) 은 OCI |", "enLabel": "오답노트 원문", "ko": "Fair value through other comprehensive income: only dividends in profit or loss; unrealized gains/losses (ending fair value − cost) in other comprehensive income.", "trap": "", "f": "", "why": {"C": "Profit or loss treatment is fair value through profit or loss.", "A": "These assets are measured at fair value."}, "orig": "FSA 오답노트 L45 · 근거 SCH R7"}, {"id": "CON-M1-16", "src": "개념", "module": 1, "tag": "Equity method – dividends", "vig": null, "stem": "Under the equity method, dividends received from the investee:", "opts": {"A": "reduce the investment account (they are not income)", "B": "are recognized in other comprehensive income", "C": "are recognized as investment income in profit or loss"}, "ans": "A", "en": "L46: | Equity method | NI × 지분율 → single line. 배당은 현금유입임(이익 X) |", "enLabel": "오답노트 원문", "ko": "Equity method: ownership % × net income → single line. Dividends are a cash inflow, not income.", "trap": "", "f": "", "why": {"C": "Income is already recognized as ownership % × net income.", "B": "Dividends are not an other comprehensive income item."}, "orig": "FSA 오답노트 L46 · 근거 SCH R7"}, {"id": "CON-M1-17", "src": "개념", "module": 1, "tag": "Bond bought at a premium – interest income", "vig": null, "stem": "For a bond bought above par (at a premium) and carried at amortized cost, interest income is:", "opts": {"A": "greater than the coupon", "B": "equal to the coupon", "C": "less than the coupon"}, "ans": "C", "en": "L182: Par < Cost → Premium → Interest income < Coupon\nL183: Par > Cost → Discount → Interest income > Coupon", "enLabel": "오답노트 원문", "ko": "Par < cost → premium → interest income < coupon.", "trap": "", "f": "", "why": {"A": "Interest income exceeds the coupon when the bond is bought at a discount.", "B": "Premium amortization reduces interest income."}, "orig": "FSA 오답노트 L182 · 근거 ECO-M1-Q5"}, {"id": "CON-M2-01", "src": "개념", "module": 2, "tag": "Discounted cash flow – net interest expense", "vig": null, "stem": "In a discounted cash flow model, if the net pension liability is already deducted from enterprise value at present value, the net pension interest expense should be:", "opts": {"A": "removed from free cash flow together with service cost", "B": "removed from free cash flow", "C": "kept as an expense in free cash flow"}, "ans": "B", "en": "L52: ### ① Net Interest Expense는 FCF에서 제거해야 함\nL63: 왜 Net Interest Expense는 빼는가\nL65: 시간이 지나며 discount가 풀리는(unwinding) 효과일 뿐, time value of money를 반영하는 항목\nL66: DCF 모델이 net pension liability를 이미 present value로 계산해서 enterprise value에서 차감하고 있다면\nL67: 여기에 net interest expense까지 매년 FCF에서 또 빼면 → 같은 시간가치 효과를 두 번(double-counting) 반영하는 셈\nL69: > 🔑 핵심원칙: net pension liability를 PV로 이미 한 번 차감했다면, net interest expense는 더 이상 FCF에서 별도로 빼면 안 됨", "enLabel": "오답노트 원문", "ko": "Net interest expense = unwinding of the discount (time value). The liability is already deducted at present value, so expensing it in free cash flow double-counts.", "trap": "", "f": "", "why": {"C": "Keeping it double-counts the time value of money.", "A": "Service cost is a real operating cost and stays in free cash flow."}, "orig": "FSA 오답노트 L52 · 근거 ECO-M2-Q26"}, {"id": "CON-M2-02", "src": "개념", "module": 2, "tag": "Discounted cash flow – service cost", "vig": null, "stem": "In a discounted cash flow model, pension service cost should be:", "opts": {"A": "removed from free cash flow as a time-value item", "B": "reflected only as a liability deducted from enterprise value", "C": "kept as an operating expense in free cash flow"}, "ans": "C", "en": "L58: 왜 Service Cost는 남기는가\nL60: 직원이 이번 기간 한 번 더 일해서 새로 쌓인 obligation의 present value\nL61: 순수한 operating 비용 → FCF에 반영하는 게 맞음", "enLabel": "오답노트 원문", "ko": "Service cost = present value of benefits earned by working one more period → a genuine operating cost → keep in free cash flow.", "trap": "", "f": "", "why": {"A": "The time-value item is net interest, not service cost.", "B": "Service cost is a recurring operating cost."}, "orig": "FSA 오답노트 L58 · 근거 ECO-M2-Q26"}, {"id": "CON-M2-03", "src": "개념", "module": 2, "tag": "Pension – actual cash outflow", "vig": null, "stem": "For a defined benefit plan, the company's actual cash outflow is:", "opts": {"A": "benefits paid", "B": "pension cost in profit or loss", "C": "employer contributions"}, "ans": "C", "en": "L123: 회사의 실제 cash outflow = employer contributions만 (operating activities에 인식)\nL124: Benefits paid는 plan assets 내부 거래라 회사 현금흐름표엔 안 잡힘", "enLabel": "오답노트 원문", "ko": "The company's actual cash outflow = employer contributions only (operating activities).", "trap": "", "f": "", "why": {"A": "Benefits are paid from plan assets and do not appear in the company's cash flow statement.", "B": "Profit or loss expense is not the same as cash flow."}, "orig": "FSA 오답노트 L123 · 근거 SCH R8"}, {"id": "CON-M2-04", "src": "개념", "module": 2, "tag": "Payments by the plan", "vig": null, "stem": "Payments from a defined benefit or defined contribution plan to retirees are reported in the employer's financial statements:", "opts": {"A": "as an operating cash outflow", "B": "not at all", "C": "as an operating expense"}, "ans": "B", "en": "L176: DC·DB 모두 plan이 직원에게 지급하는 금액은 BS에 보고 X\nL178: payments of benefits plan under DB → BS 기록 X", "enLabel": "오답노트 원문", "ko": "For both defined contribution and defined benefit plans, payments from the plan to employees are not reported by the employer.", "trap": "", "f": "", "why": {"C": "The employer's expense is service cost and related items.", "A": "The employer's cash outflow is employer contributions."}, "orig": "FSA 오답노트 L176 · 근거 ECO-M2-Q39"}, {"id": "CON-M2-05", "src": "개념", "module": 2, "tag": "Share-based compensation dilution", "vig": null, "stem": "In a discounted cash flow model, the correct way to reflect dilution from share-based compensation (SBC) is to:", "opts": {"A": "either expense it in free cash flow or increase the share count, but not both", "B": "both expense it in free cash flow and increase the share count", "C": "add it back to free cash flow because it is non-cash"}, "ans": "A", "en": "L76: ### ② SBC 희석효과 반영하는 2가지 대안 방법 (둘 중 하나만!)\nL78: ①SBC를 FCF에서 비용처리(expense) → 분자(현금흐름)를 깎는 방식\nL80: ②예상 희석분만큼 shares outstanding 증가 →분모(주식수)를 늘리는 방식\nL82: 둘 다 결국 같은 경제적 실체(주주가치 희석)를 반영하는 것 → 하나만 선택해야 함, 둘 다 적용하면 이중차감\nL84: > ❌ 오답 함정: \"SBC는 비현금이니 net cash를 늘린다\"거나 \"현금보상으로 대체 가능하니 operating expense를 줄인다\"는 접근 — 이건 SBC의 실제 경제적 비용(지분희석)을 아예 무시하는 것이라 밸류에이션을 overstate시킴", "enLabel": "오답노트 원문", "ko": "Reduce the numerator (free cash flow) or increase the denominator (shares), only one. Doing both double-counts.", "trap": "", "f": "", "why": {"B": "Doing both counts the same dilution twice.", "C": "This ignores the real economic cost (dilution) and overstates value."}, "orig": "FSA 오답노트 L76 · 근거 ECO-M2-Q29"}, {"id": "CON-M2-06", "src": "개념", "module": 2, "tag": "Forecasting share-based compensation", "vig": null, "stem": "Share-based compensation expense is commonly forecast as a percentage of:", "opts": {"A": "net income", "B": "revenues", "C": "the share price"}, "ans": "B", "en": "L147: SBC expense는 revenues 대비 비율로 예측!!\nL149: SBC expense는 매출 대비(% of revenues)로 예측", "enLabel": "오답노트 원문", "ko": "Forecast share-based compensation expense as a percentage of revenues.", "trap": "", "f": "", "why": {"A": "The curriculum and ECO use revenues.", "C": "The share price is not the forecast base."}, "orig": "FSA 오답노트 L147 · 근거 ECO-M2-Q38 / SCH LOS 8.c"}, {"id": "CON-M2-07", "src": "개념", "module": 2, "tag": "When a tax windfall arises", "vig": null, "stem": "A tax windfall on share-based compensation arises when the:", "opts": {"A": "share price at settlement < share price at grant", "B": "share price at settlement > share price at grant", "C": "award is granted"}, "ans": "B", "en": "L104: Tax windfall은 \"정산일 주가 > 부여일 주가\"일 때 생기는 일회성 효과\nL119: Tax windfall = settlement date 주가 > grant date 주가 → 세법상 공제 > 회계상 누적 비용", "enLabel": "오답노트 원문", "ko": "Tax windfall = settlement-date price > grant-date price → tax deduction > cumulative book expense.", "trap": "", "f": "", "why": {"A": "That case is a tax shortfall.", "C": "The tax deduction is determined at settlement."}, "orig": "FSA 오답노트 L104 · 근거 SCH R8"}, {"id": "CON-M2-08", "src": "개념", "module": 2, "tag": "Tax windfall – US GAAP", "vig": null, "stem": "Under US GAAP, a tax windfall:", "opts": {"A": "reduces income tax expense and lowers the effective tax rate", "B": "is recorded in other comprehensive income", "C": "is recorded directly in equity"}, "ans": "A", "en": "L120: U.S. GAAP: windfall이 income tax expense를 줄임 → ETR ↓ (net income·ETR 변동성 발생)", "enLabel": "오답노트 원문", "ko": "US GAAP: windfall reduces income tax expense → effective tax rate↓ (net income and effective tax rate become more volatile).", "trap": "", "f": "", "why": {"C": "Recording it in equity is the IFRS treatment.", "B": "It is not an other comprehensive income item."}, "orig": "FSA 오답노트 L120 · 근거 SCH R8"}, {"id": "CON-M2-09", "src": "개념", "module": 2, "tag": "Tax windfall – IFRS vs US GAAP effective tax rate", "vig": null, "stem": "With a tax windfall, if the company reported under IFRS instead of US GAAP, its effective tax rate would be:", "opts": {"A": "lower", "B": "the same", "C": "higher"}, "ans": "C", "en": "L121: IFRS: windfall을 자기자본에 직접 반영 → ETR 영향 없음 (IFRS 적용 시 ETR이 더 높음)", "enLabel": "오답노트 원문", "ko": "IFRS: windfall goes directly to equity → no effect on the effective tax rate (so the effective tax rate is higher under IFRS).", "trap": "", "f": "", "why": {"A": "IFRS records the windfall in equity, so tax expense does not fall.", "B": "Only US GAAP lowers tax expense, so they differ."}, "orig": "FSA 오답노트 L121 · 근거 ECO-M2-Q16"}, {"id": "CON-M2-10", "src": "개념", "module": 2, "tag": "Tax windfall – in a forecast", "vig": null, "stem": "If a low effective tax rate caused by a one-time windfall is applied to the whole forecast period, free cash flow to the firm and enterprise value are:", "opts": {"A": "unaffected", "B": "understated", "C": "overstated"}, "ans": "C", "en": "L102: 이 낮은 세율을 미래 전체(모델 전 기간)에 계속 적용하면 안 되는 이유\nL104: Tax windfall은 \"정산일 주가 > 부여일 주가\"일 때 생기는 일회성 효과\nL105: 매년 반복된다고 가정하는 건 비현실적(주가가 계속 예측대로 오른다는 가정을 깔고 있는 셈)\nL107: $$\nL111: > 🔑 핵심원칙: 일회성 tax windfall 효과를 영구적인 것처럼 미래 전체 모델에 반영하면 FCFF와 Enterprise Value가 모두 overstate됨 → 이미 어딘가에서 반영된 효과를, 다른 자리에서 또 반영하면 double-counting", "enLabel": "오답노트 원문", "ko": "Low effective tax rate applied permanently → after-tax operating income (EBIT)↑ → free cash flow to the firm↑ → enterprise value overstated.", "trap": "", "f": "", "why": {"B": "A lower tax rate raises after-tax profit, so free cash flow to the firm rises.", "A": "The tax rate directly affects free cash flow to the firm."}, "orig": "FSA 오답노트 L102 · 근거 ECO-M2-Q30"}, {"id": "CON-M2-11", "src": "개념", "module": 2, "tag": "Tax shortfall – IFRS", "vig": null, "stem": "Under IFRS, a tax shortfall is recorded:", "opts": {"A": "directly in equity", "B": "as higher income tax expense", "C": "in other comprehensive income and amortized"}, "ans": "A", "en": "L122: Tax shortfall은 반대 (U.S. GAAP: tax expense ↑ / IFRS: equity)", "enLabel": "오답노트 원문", "ko": "Tax shortfall is the reverse (US GAAP: tax expense↑ / IFRS: equity).", "trap": "", "f": "", "why": {"B": "Higher tax expense is the US GAAP treatment.", "C": "There is no amortization through other comprehensive income."}, "orig": "FSA 오답노트 L122 · 근거 SCH R8"}, {"id": "CON-M2-12", "src": "개념", "module": 2, "tag": "Discount rate ↑ → projected benefit obligation", "vig": null, "stem": "If the discount rate increases, the projected benefit obligation (PBO):", "opts": {"A": "does not change", "B": "increases", "C": "decreases"}, "ans": "C", "en": "L126: Discount Rate↑ = 금리↑ → 지금 돈 조금만 넣어도 알아서 크게 불어남 →PBO↓(부채↓)", "enLabel": "오답노트 원문", "ko": "Discount rate↑ → projected benefit obligation↓ (liability↓).", "trap": "", "f": "", "why": {"B": "The projected benefit obligation rises when the discount rate falls.", "A": "It is a present value, so it is sensitive to the discount rate."}, "orig": "FSA 오답노트 L126 · 근거 SCH R8 / ECO-M2-Q21"}, {"id": "CON-M2-13", "src": "개념", "module": 2, "tag": "Discount rate ↑ → funded status", "vig": null, "stem": "If the discount rate increases and plan assets are unchanged, the funded status (plan assets − projected benefit obligation):", "opts": {"A": "worsens (decreases)", "B": "improves (increases)", "C": "does not change"}, "ans": "B", "en": "L187: 할인율 ↑  → PBO ↓ , Plan asset은 변화 X → funded status (plan assets − PBO) ↓", "enLabel": "오답노트 원문", "ko": "Discount rate↑ → projected benefit obligation↓, plan assets unchanged → funded status = plan assets − obligation ↑ (improves). ※ Note line 187 says '↓'; please check it.", "trap": "", "f": "", "why": {"A": "The projected benefit obligation falls, so plan assets − obligation rises. Note line 187 says '↓', which is the wrong direction.", "C": "The obligation changes, so funded status changes."}, "orig": "FSA 오답노트 L187 · 근거 SCH R8"}, {"id": "CON-M2-14", "src": "개념", "module": 2, "tag": "Discount rate ↓ – bond-heavy plan assets", "vig": null, "stem": "When the discount rate falls and plan assets are mostly long-term bonds, the deterioration in funded status is:", "opts": {"A": "larger than the increase in the projected benefit obligation", "B": "equal to the increase in the projected benefit obligation", "C": "smaller than the increase in the projected benefit obligation"}, "ans": "C", "en": "L130: 할인율↓ → PBO↑(부채증가)와 동시에 plan assets 내 장기채 시가도 duration 효과로 ↑(자산증가) → 두 효과 상쇄되어 funded status 순악화폭 < PBO 증가폭\nL155: 금리(할인율) 하락 시\nL158: Plan assets ↑ 가능 (특히 장기 고정수익 증권, duration 효과로 가격 상승)→ Funded status 악화폭 < PBO 증가폭 (자산 증가가 일부 상쇄)\nL161: 금리 ↓: PBO ↑ + (장기 채권 위주 자산이면) Plan assets ↑ → 악화폭 = PBO 증가폭 − 자산 증가분 < PBO 증가폭\nL162: 자산이 채권 위주일수록 상쇄 효과가 큼 (duration matching)", "enLabel": "오답노트 원문", "ko": "Discount rate↓ → projected benefit obligation↑, long-term bond prices↑ (duration effect) → funded status worsens by less than the obligation increase.", "trap": "", "f": "", "why": {"A": "Bond prices also rise, partly offsetting the higher obligation.", "B": "The asset gain makes them unequal."}, "orig": "FSA 오답노트 L130 · 근거 ECO"}, {"id": "CON-M2-15", "src": "개념", "module": 2, "tag": "IFRS pension cost in profit or loss", "vig": null, "stem": "Under IFRS, pension cost recognized in profit or loss is:", "opts": {"A": "service cost + remeasurements", "B": "service cost + interest cost − expected return on plan assets", "C": "service cost (current + past) + net interest expense/income"}, "ans": "C", "en": "L131: Pension Cost = Service cost + Net interest expense/income → P/L\nL132: IFRS → Service cost = current + past → P/L\nL141: IFRS  P&L pension cost = Service cost(current + past) + Net interest", "enLabel": "오답노트 원문", "ko": "IFRS pension cost in profit or loss = service cost (current + past) + net interest.", "trap": "", "f": "", "why": {"B": "That is the US GAAP formula.", "A": "Remeasurements go to other comprehensive income."}, "orig": "FSA 오답노트 L131 · 근거 ECO-M2-Q10"}, {"id": "CON-M2-16", "src": "개념", "module": 2, "tag": "Past service cost – US GAAP", "vig": null, "stem": "Under US GAAP, past (prior) service cost is:", "opts": {"A": "recognized immediately in profit or loss", "B": "not recognized", "C": "recognized in other comprehensive income and amortized into profit or loss"}, "ans": "C", "en": "L133: US GAAP ⇒ Service cost = current . past는 상각분만큼만 추가\nL142: US GAAP은 OCI 인식 후 상각", "enLabel": "오답노트 원문", "ko": "US GAAP: service cost = current service cost; past service cost only through amortization.", "trap": "", "f": "", "why": {"A": "Immediate recognition in profit or loss is the IFRS treatment.", "B": "It increases the obligation, so it is recognized."}, "orig": "FSA 오답노트 L133 · 근거 SCH R8"}, {"id": "CON-M2-17", "src": "개념", "module": 2, "tag": "IFRS remeasurements", "vig": null, "stem": "Under IFRS, remeasurements (such as actuarial gains and losses) are recognized:", "opts": {"A": "in other comprehensive income, never passing through profit or loss", "B": "immediately in profit or loss", "C": "in other comprehensive income, then amortized into profit or loss"}, "ans": "A", "en": "L135: [한 해 동안 발생하는 pension 관련 변화] / │ / ├─ Service cost ────────┐ / ├─ Net interest ─────────┼─→ P&L → Net income → 이익잉여금(자본) 감소 / │  (이 둘의 합 = \"Pension cost\") / │ / └─ Remeasurements ──────→ OCI → 자본(AOCI) 직접 조정 (P&L 안 거침)\nL145: remeasurement는 둘 중 어디에도 안 끼고 OCI로 따로 빠짐", "enLabel": "오답노트 원문", "ko": "Remeasurements → other comprehensive income → equity (accumulated other comprehensive income) directly, bypassing profit or loss.", "trap": "", "f": "", "why": {"B": "Only service cost and net interest go to profit or loss.", "C": "Amortization from other comprehensive income is the US GAAP approach."}, "orig": "FSA 오답노트 L135 · 근거 SCH R8"}, {"id": "CON-M2-18", "src": "개념", "module": 2, "tag": "Expected return on plan assets", "vig": null, "stem": "The assumed expected return on plan assets affects:", "opts": {"A": "IFRS pension expense", "B": "the projected benefit obligation", "C": "US GAAP pension expense only (not the projected benefit obligation)"}, "ans": "C", "en": "L164: Expected return on plan assets는 PBO 계산과 무관\nL166: Expected return → U.S. GAAP pension expense에만 영향 (↑이면 expense ↓), IFRS는 사용 X (IFRS :  net interest를 할인율로 계산)", "enLabel": "오답노트 원문", "ko": "Expected return affects only US GAAP pension expense (higher return → lower expense); it does not affect the projected benefit obligation.", "trap": "", "f": "", "why": {"B": "The obligation depends on the discount rate, salary growth, and similar assumptions.", "A": "IFRS uses the discount rate for net interest, not an expected return."}, "orig": "FSA 오답노트 L164 · 근거 SCH R8"}, {"id": "CON-M2-19", "src": "개념", "module": 2, "tag": "Higher assumed compensation growth", "vig": null, "stem": "If the assumed rate of compensation growth increases:", "opts": {"A": "projected benefit obligation↑ → pension cost↑ → net income and retained earnings↓", "B": "plan assets↑", "C": "projected benefit obligation↓ → net income↑"}, "ans": "A", "en": "L184: assumed rate of compensation growth(임금상승률)↑ → PBO↑ → 비용↑ → NI↓ → 이익잉여금↓\nL186: 임금상승률은 Plan assets와 무관.", "enLabel": "오답노트 원문", "ko": "Compensation growth↑ → projected benefit obligation↑ → cost↑ → net income↓ → retained earnings↓. No effect on plan assets.", "trap": "", "f": "", "why": {"B": "Compensation growth does not affect plan assets.", "C": "The direction is reversed."}, "orig": "FSA 오답노트 L184 · 근거 SCH-M2-07"}, {"id": "CON-M2-20", "src": "개념", "module": 2, "tag": "Restricted stock unit fair value", "vig": null, "stem": "Which is correct about the grant-date fair value of a restricted stock unit (RSU)?", "opts": {"A": "It is the grant-date share price (possibly adjusted for expected dividends), so the volatility assumption does not matter", "B": "It is set by the share price at settlement", "C": "It comes from an option pricing model, so higher volatility raises it"}, "ans": "A", "en": "L167: RSU의 grant-date FV = grant-date 주가 (예상 배당으로 adjusted 될 수 O) → volatility assumption은 RSU value에 영향 X", "enLabel": "오답노트 원문", "ko": "Restricted stock unit grant-date fair value = grant-date share price → the volatility assumption does not affect its value.", "trap": "", "f": "", "why": {"C": "Volatility matters for options, not restricted stock units.", "B": "It is measured at grant-date fair value."}, "orig": "FSA 오답노트 L167 · 근거 ECO-M2-Q12"}, {"id": "CON-M2-21", "src": "개념", "module": 2, "tag": "Restricted stock unit dilution – treasury stock method", "vig": null, "stem": "Under the treasury stock method, the number of dilutive shares from unvested restricted stock units is:", "opts": {"A": "unvested units − (average unrecognized share-based compensation ÷ average share price)", "B": "all unvested units", "C": "unvested units + (average unrecognized share-based compensation ÷ average share price)"}, "ans": "A", "en": "L168: Dilutive shares = Unvested RSUs − (Avg unrecognized SBC / Avg price)\nL172: 줄어드는 주식 : unrecognized SBC는 앞으로 비용으로 처리할 거였으니까, 이 금액으로 자사주를 사서 소각", "enLabel": "오답노트 원문", "ko": "Dilutive shares = unvested restricted stock units − (average unrecognized share-based compensation / average price).", "trap": "", "f": "", "why": {"B": "The unrecognized compensation is assumed to buy back shares, which must be subtracted.", "C": "The shares bought back are subtracted, not added."}, "orig": "FSA 오답노트 L168 · 근거 ECO-M2-Q17"}, {"id": "CON-M2-22", "src": "개념", "module": 2, "tag": "Short-term employee benefits", "vig": null, "stem": "Which is a short-term employee benefit?", "opts": {"A": "Long-term disability benefits", "B": "Contributions to social security", "C": "Sabbatical (long-term paid leave)"}, "ans": "B", "en": "L173: sabbatical paid leave : 장기유급휴가\nL175: Contribution to social security → 단기 급여", "enLabel": "오답노트 원문", "ko": "Contributions to social security → short-term. Sabbatical paid leave → long-term.", "trap": "", "f": "", "why": {"C": "Long-term paid leave is a long-term benefit.", "A": "Long-term disability is a long-term benefit."}, "orig": "FSA 오답노트 L173 · 근거 ECO-M2-Q34 / SCH LOS 8.a"}, {"id": "CON-M2-23", "src": "개념", "module": 2, "tag": "Projected benefit obligation roll-forward", "vig": null, "stem": "Ending projected benefit obligation equals:", "opts": {"A": "beginning obligation + service cost + interest cost + actuarial loss − benefits paid", "B": "beginning obligation + service cost + actual return − benefits paid", "C": "beginning obligation + employer contributions − benefits paid"}, "ans": "A", "en": "L179: beginning PBO + service cost + Interest cost + actuarial loss - benefit paid = ending PBO", "enLabel": "오답노트 원문", "ko": "Beginning projected benefit obligation + service cost + interest cost + actuarial loss − benefits paid = ending projected benefit obligation.", "trap": "", "f": "", "why": {"B": "Actual return belongs to the plan asset roll-forward.", "C": "Employer contributions belong to the plan asset roll-forward."}, "orig": "FSA 오답노트 L179 · 근거 SCH R8"}, {"id": "CON-M2-24", "src": "개념", "module": 2, "tag": "Plan asset roll-forward", "vig": null, "stem": "Ending plan assets equal:", "opts": {"A": "beginning plan assets + service cost − benefits paid", "B": "beginning plan assets + actual return + employer contributions − benefits paid", "C": "beginning plan assets + expected return + employer contributions − benefits paid"}, "ans": "B", "en": "L180: beginning asset + actual return + employer contribution - benefit paid = ending Plan asset", "enLabel": "오답노트 원문", "ko": "Beginning assets + actual return + employer contributions − benefits paid = ending plan assets.", "trap": "", "f": "", "why": {"C": "The asset balance uses the actual return.", "A": "Service cost belongs to the obligation roll-forward."}, "orig": "FSA 오답노트 L180 · 근거 SCH R8"}, {"id": "CON-M2-25", "src": "개념", "module": 2, "tag": "US GAAP periodic pension cost", "vig": null, "stem": "Ignoring amortization items, US GAAP periodic pension cost is:", "opts": {"A": "service cost + interest cost − actual return on plan assets", "B": "service cost + interest cost − expected return on plan assets", "C": "service cost + net interest"}, "ans": "B", "en": "L181: US GAAP periodic pension cost = service cost + interest cost(PBO x discount rate) − expected return", "enLabel": "오답노트 원문", "ko": "US GAAP periodic pension cost = service cost + interest cost (obligation × discount rate) − expected return.", "trap": "", "f": "", "why": {"A": "Profit or loss uses the expected return, not the actual return.", "C": "Net interest is the IFRS approach."}, "orig": "FSA 오답노트 L181 · 근거 SCH-M2-05"}, {"id": "CON-M2-26", "src": "개념", "module": 2, "tag": "Discount rate for the projected benefit obligation", "vig": null, "stem": "The discount rate used to compute the projected benefit obligation is typically the:", "opts": {"A": "expected return on plan assets", "B": "yield on investment-grade corporate bonds", "C": "short-term government bill rate"}, "ans": "B", "en": "L152: PBO = 미래 benefit의 PV, 할인율은 보통 investment-grade 회사채 yield", "enLabel": "오답노트 원문", "ko": "Projected benefit obligation = present value of future benefits; discount rate is usually the investment-grade corporate bond yield.", "trap": "", "f": "", "why": {"A": "The expected return does not affect the obligation.", "C": "The curriculum uses investment-grade corporate bonds."}, "orig": "FSA 오답노트 L152 · 근거 SCH R8"}, {"id": "CON-M2-27", "src": "개념", "module": 2, "tag": "Equity-settled share-based compensation – credit side", "vig": null, "stem": "When equity-settled share-based compensation expense is recognized, the credit goes to:", "opts": {"A": "equity (share-based compensation reserve)", "B": "a liability", "C": "cash"}, "ans": "A", "en": "L146: Stock-BasedC는 자본(equity) 계정끼리 왔다갔다는거. 부채 안잡힘", "enLabel": "오답노트 원문", "ko": "Share-based compensation moves between equity accounts; no liability is recorded.", "trap": "", "f": "", "why": {"B": "It is settled in shares, so no liability arises.", "C": "There is no cash payment."}, "orig": "FSA 오답노트 L146 · 근거 SCH LOS 8.b"}, {"id": "CON-M3-01", "src": "개념", "module": 3, "tag": "Transaction exposure – unrealized gain or loss", "vig": null, "stem": "If a foreign currency receivable is still unsettled at the fiscal year-end, the exchange rate change up to that date is:", "opts": {"A": "recognized in other comprehensive income (cumulative translation adjustment)", "B": "deferred until settlement", "C": "recognized as an unrealized gain or loss in the income statement"}, "ans": "C", "en": "L208: 거래일≠결제일이면 회계연도 말(intervening balance sheet date)에 unrealized G/L 인식\nL209: Transaction Exposure → 결제 전(unrealized)도 I/S에 인식 →  IFRS·US GAAP 공통, 환산 방법(current rate·temporal)과 무관\nL252: \"결제 안 했으니 손익인식 보류\"는 틀림 — 연말이면 무조건 미실현손익 인식", "enLabel": "오답노트 원문", "ko": "Transaction date ≠ settlement date → recognize unrealized gain/loss in the income statement at the balance sheet date (IFRS and US GAAP).", "trap": "", "f": "", "why": {"B": "At a balance sheet date it is recognized even before settlement.", "A": "The cumulative translation adjustment belongs to the current rate method."}, "orig": "FSA 오답노트 L208 · 근거 SCH R9"}, {"id": "CON-M3-02", "src": "개념", "module": 3, "tag": "Current rate method – where gains and losses go", "vig": null, "stem": "Translation gains and losses under the current rate method go to:", "opts": {"A": "other comprehensive income (cumulative translation adjustment)", "B": "the income statement", "C": "retained earnings directly"}, "ans": "A", "en": "L295: Current Rate Method = Translation → FX 손익이 OCI에", "enLabel": "오답노트 원문", "ko": "Current rate method = translation → foreign exchange gains/losses in other comprehensive income.", "trap": "", "f": "", "why": {"B": "The income statement is used by the temporal method (remeasurement).", "C": "Retained earnings is the plug under the temporal method."}, "orig": "FSA 오답노트 L295 · 근거 SCH R9"}, {"id": "CON-M3-03", "src": "개념", "module": 3, "tag": "Temporal method – where gains and losses go", "vig": null, "stem": "Remeasurement gains and losses under the temporal method go to:", "opts": {"A": "the income statement", "B": "nowhere; they are not recognized", "C": "other comprehensive income (cumulative translation adjustment)"}, "ans": "A", "en": "L296: Temporal Method = Remeasurement  →FX 손익이 IS에", "enLabel": "오답노트 원문", "ko": "Temporal method = remeasurement → foreign exchange gains/losses in the income statement.", "trap": "", "f": "", "why": {"C": "Other comprehensive income is used by the current rate method.", "B": "Remeasurement gains and losses are recognized in the income statement."}, "orig": "FSA 오답노트 L296 · 근거 SCH R9"}, {"id": "CON-M3-04", "src": "개념", "module": 3, "tag": "When the temporal method is used", "vig": null, "stem": "The temporal method is used when the subsidiary's:", "opts": {"A": "functional currency = the parent's presentation currency", "B": "functional currency = its local currency", "C": "operations are independent of the parent"}, "ans": "A", "en": "L216: | 조건 | 거래일과 결제일 사이 환율 변동 | FC ≠ PC | FC = PC |", "enLabel": "오답노트 원문", "ko": "Temporal: functional currency = presentation currency / Current rate: functional currency ≠ presentation currency.", "trap": "", "f": "", "why": {"B": "That case uses the current rate method.", "C": "Independent operations (local functional currency) use the current rate method."}, "orig": "FSA 오답노트 L216 · 근거 SCH R9"}, {"id": "CON-M3-05", "src": "개념", "module": 3, "tag": "Temporal method – non-monetary assets", "vig": null, "stem": "Under the temporal method, non-monetary assets such as inventory and property, plant & equipment are translated at the:", "opts": {"A": "historical rate", "B": "average rate", "C": "current (year-end) rate"}, "ans": "A", "en": "L217: | 자산· / 부채 | 외화 채권·채무를  / 결제일·보고일 환율로 | 전부 current | 화폐성 current,  / 비화폐성 historical |\nL294: Temporal은 비화폐성 항목을 historical rate로 고정 → unrealized G&L 무시", "enLabel": "오답노트 원문", "ko": "Temporal: monetary items at the current rate, non-monetary items at historical rates.", "trap": "", "f": "", "why": {"C": "Translating all assets and liabilities at the current rate is the current rate method.", "B": "The average rate is used for revenues and expenses."}, "orig": "FSA 오답노트 L217 · 근거 SCH R9"}, {"id": "CON-M3-06", "src": "개념", "module": 3, "tag": "Current rate method – plug", "vig": null, "stem": "Under the current rate method, the balancing (plug) item is:", "opts": {"A": "common stock", "B": "retained earnings", "C": "the cumulative translation adjustment"}, "ans": "C", "en": "L218: | Plug | - | CTA | Retained earnings |", "enLabel": "오답노트 원문", "ko": "Plug: current rate → cumulative translation adjustment / temporal → retained earnings.", "trap": "", "f": "", "why": {"B": "Retained earnings is the plug under the temporal method.", "A": "Common stock is translated at the historical rate."}, "orig": "FSA 오답노트 L218 · 근거 SCH R9"}, {"id": "CON-M3-07", "src": "개념", "module": 3, "tag": "Depreciating subsidiary currency – operating income", "vig": null, "stem": "When the subsidiary's currency is depreciating, reported operating income is higher under the:", "opts": {"A": "neither; they are the same", "B": "temporal method", "C": "current rate method"}, "ans": "C", "en": "L281: 자회사 통화 절화 상황에서 ⇒ Operating Income: Current Rate>Temporal (COGS 더 낮으니까)", "enLabel": "오답노트 원문", "ko": "Depreciating subsidiary currency ⇒ operating income: current rate > temporal (lower cost of goods sold).", "trap": "", "f": "", "why": {"B": "The temporal method translates cost of goods sold at older (higher) historical rates, so costs are larger.", "A": "Cost of goods sold uses different rates, so results differ."}, "orig": "FSA 오답노트 L281 · 근거 ECO-M3-Q86 / SCH R9"}, {"id": "CON-M3-08", "src": "개념", "module": 3, "tag": "Local currency as functional currency", "vig": null, "stem": "Choosing the subsidiary's local currency as its functional currency is justified when the subsidiary:", "opts": {"A": "makes autonomous operating, investing, and financing decisions based on the local currency", "B": "earns its sales in the parent's currency", "C": "has all decisions made by the parent"}, "ans": "A", "en": "L282: functional currency를 자회사 통화로 변경하는 경우 : 자회사가 현지통화 기반 자율적으로 결정 내릴 때 가능 (making autonomous decision about operation, investing, financing)", "enLabel": "오답노트 원문", "ko": "Local functional currency when the subsidiary makes autonomous decisions about operating, investing, and financing.", "trap": "", "f": "", "why": {"C": "Then the parent's currency is the functional currency.", "B": "If parent-currency transactions dominate, the parent's currency is functional."}, "orig": "FSA 오답노트 L282 · 근거 ECO-M3-Q25"}, {"id": "CON-M3-09", "src": "개념", "module": 3, "tag": "Hyperinflation – IFRS", "vig": null, "stem": "Under IFRS, the statements of a subsidiary in a hyperinflationary economy are:", "opts": {"A": "translated at the average rate without restatement", "B": "restated using a general price index, then translated at the current (year-end) rate", "C": "remeasured with the temporal method"}, "ans": "B", "en": "L273: IFRS: inflation으로 재작성 → current(기말) rate로 환산", "enLabel": "오답노트 원문", "ko": "IFRS: restate for inflation → translate at the current (year-end) rate.", "trap": "", "f": "", "why": {"C": "The temporal method is the US GAAP approach.", "A": "IFRS restates for inflation first."}, "orig": "FSA 오답노트 L273 · 근거 SCH R9"}, {"id": "CON-M3-10", "src": "개념", "module": 3, "tag": "Hyperinflation – US GAAP", "vig": null, "stem": "Under US GAAP, a subsidiary in a hyperinflationary economy uses:", "opts": {"A": "the temporal method (no inflation restatement)", "B": "the current rate method as usual", "C": "general price index restatement, then the current rate"}, "ans": "A", "en": "L277: US GAAP: temporal method (Inflation 조정 X)", "enLabel": "오답노트 원문", "ko": "US GAAP: temporal method (no inflation adjustment).", "trap": "", "f": "", "why": {"C": "General price index restatement is the IFRS approach.", "B": "US GAAP treats the parent's currency as functional and uses the temporal method."}, "orig": "FSA 오답노트 L277 · 근거 SCH R9"}, {"id": "CON-M3-11", "src": "개념", "module": 3, "tag": "Hyperinflation indicator", "vig": null, "stem": "A common indicator of hyperinflation is cumulative inflation of more than:", "opts": {"A": "50% over three years", "B": "50% over one year", "C": "100% over three years"}, "ans": "C", "en": "L271: Hyperinflation 판단: 3년 누적 inflation > 100% (GPI 기준)", "enLabel": "오답노트 원문", "ko": "Hyperinflation: three-year cumulative inflation > 100%.", "trap": "", "f": "", "why": {"B": "The curriculum uses 100% over three years.", "A": "The threshold is 100%."}, "orig": "FSA 오답노트 L271 · 근거 SCH R9"}, {"id": "CON-M3-12", "src": "개념", "module": 3, "tag": "Hyperinflation – restating flow items", "vig": null, "stem": "In IFRS hyperinflation restatement, the restatement factor for flow items such as revenue is:", "opts": {"A": "average general price index ÷ year-end general price index", "B": "year-end general price index ÷ average general price index", "C": "year-end general price index ÷ index at the acquisition date"}, "ans": "B", "en": "L257: Flow 항목 (매출, 비용 등 — 1년 내내 발생)\nL259: \\text{Restatement Factor} = \\frac{GPI(\\text{기말})}{GPI(\\text{평균})}", "enLabel": "오답노트 원문", "ko": "Flow items (occur throughout the year): general price index (year-end) / general price index (average).", "trap": "", "f": "", "why": {"C": "The acquisition-date index is used for stock (non-monetary) items.", "A": "The numerator and denominator are reversed."}, "orig": "FSA 오답노트 L257 · 근거 ECO-M3-Q6"}, {"id": "CON-M3-13", "src": "개념", "module": 3, "tag": "Effective tax rate reconciliation – profit mix", "vig": null, "stem": "To judge a change in the mix of profits across countries, look at the effective tax rate reconciliation line:", "opts": {"A": "effect of tax rates in foreign jurisdictions", "B": "the change in the total effective tax rate", "C": "the change in the domestic statutory tax rate"}, "ans": "A", "en": "L227: Profit Mix(이익구성) 변화는 오직 \"Effect of tax rates in foreign jurisdictions\" 항목만으로 판단\nL253: Profit Mix 판단은 \"해외세율효과\" 항목만 봐야 함, ETR 합계나 법정세율 변화는 함정", "enLabel": "오답노트 원문", "ko": "Profit mix changes are judged only from the 'effect of tax rates in foreign jurisdictions' line.", "trap": "", "f": "", "why": {"B": "The total effective tax rate mixes many effects.", "C": "The domestic statutory rate is unrelated to the profit mix."}, "orig": "FSA 오답노트 L227 · 근거 ECO / SCH R9"}, {"id": "CON-M3-14", "src": "개념", "module": 3, "tag": "Foreign jurisdiction effect +2% → +4%", "vig": null, "stem": "If the 'effect of tax rates in foreign jurisdictions' in the effective tax rate reconciliation rises from +2% to +4%:", "opts": {"A": "the domestic statutory tax rate has increased", "B": "the share of profit earned in lower-tax countries has increased", "C": "the share of profit earned in higher-tax countries has increased"}, "ans": "C", "en": "L230: ETR in foreign jurisdiction 값이 +2% → +4% (양(+)의 효과가 커짐) : 고세율 국가에서 번 이익의 비중이 커졌다는 것 = profit in country with higher marginal tax rate ↑\nL231: (-) 효과가 확대 = 저세율 국가 이익 비중 ↑  (or 그 국가 세율 ↓)", "enLabel": "오답노트 원문", "ko": "Larger (+) effect = more profit in higher-tax countries / larger (−) effect = more profit in lower-tax countries.", "trap": "", "f": "", "why": {"B": "More profit in lower-tax countries makes the effect more negative.", "A": "The domestic rate is not this line."}, "orig": "FSA 오답노트 L230 · 근거 ECO"}, {"id": "CON-M3-15", "src": "개념", "module": 3, "tag": "Net sales growth components", "vig": null, "stem": "Net sales growth is correctly broken down as:", "opts": {"A": "organic growth ± acquisitions and divestitures ± foreign exchange", "B": "organic growth only", "C": "price effect ± foreign exchange"}, "ans": "A", "en": "L286: Net sales growth = organic growth ± acquisitions·divestitures ± foreign exchange", "enLabel": "오답노트 원문", "ko": "Net sales growth = organic growth ± acquisitions/divestitures ± foreign exchange.", "trap": "", "f": "", "why": {"B": "Acquisitions, divestitures, and foreign exchange are also included.", "C": "Acquisitions and divestitures are missing."}, "orig": "FSA 오답노트 L286 · 근거 ECO-M3-Q4"}, {"id": "CON-M3-16", "src": "개념", "module": 3, "tag": "Translation loss and sales growth", "vig": null, "stem": "A foreign currency translation loss (weaker foreign currency):", "opts": {"A": "does not affect net sales growth", "B": "reduces net sales growth but does not affect organic growth", "C": "reduces organic growth"}, "ans": "B", "en": "L289: 외화 약세(translation loss) → FX 항목으로 net sales growth ↓ (organic에는 영향 없음)", "enLabel": "오답노트 원문", "ko": "Weaker foreign currency (translation loss) → net sales growth↓ through the foreign exchange line (no effect on organic growth).", "trap": "", "f": "", "why": {"C": "The foreign exchange effect is separate from organic growth.", "A": "It reduces net sales growth through the foreign exchange line."}, "orig": "FSA 오답노트 L289 · 근거 ECO-M3-Q4"}, {"id": "CON-M3-17", "src": "개념", "module": 3, "tag": "Cash flow at risk", "vig": null, "stem": "Which measure reflects hedging and shows the actual size of currency risk?", "opts": {"A": "Neither; both ignore hedging", "B": "Cash flow at risk", "C": "Total (principal) exposure"}, "ans": "B", "en": "L196: | Cash Flow at Risk | Total Exposure − 헤지로 커버된 부분 = 실제 노출된(uncovered) 위험 | ✅ 반영됨 |\nL198: > 🔑 Total Exposure는 분석의 \"출발점\"일 뿐 — 헤지 여부까지 반영한 Cash Flow at Risk가 진짜 위험크기를 나타냄 / 🔑 Cash-Flow-at-Risk 방법론: \\*\\*변동성(volatility) + 상관관계(correlation)\\*\\*를 입력값으로 확률분포 기반 추정 (Reading 38 VaR과 동일 원리)\nL250: Total Exposure 크다고 위험이 큰 게 아님 — Cash Flow at Risk(헤지반영 후)로 판단", "enLabel": "오답노트 원문", "ko": "Total exposure is only the starting point; cash flow at risk, which reflects hedging, shows the true risk.", "trap": "", "f": "", "why": {"C": "Total exposure is the nominal amount regardless of hedging.", "A": "Cash flow at risk does reflect hedging."}, "orig": "FSA 오답노트 L196 · 근거 ECO-M3-Q70"}, {"id": "CON-M4-01", "src": "개념", "module": 4, "tag": "Bank assets", "vig": null, "stem": "Most of a bank's assets are:", "opts": {"A": "deposits", "B": "property, plant & equipment", "C": "financial assets such as loans and securities"}, "ans": "C", "en": "L301: The assets of banks are predominantly financial assets, such as loans and securitiesㅡ(not deposits, which represent most of a bank's liabilities\nL302: insured deposits는 은행의 부채 (자산X)", "enLabel": "오답노트 원문", "ko": "Bank assets are predominantly loans and securities; deposits are most of a bank's liabilities.", "trap": "", "f": "", "why": {"A": "Deposits are the bank's liabilities.", "B": "Financial institutions mainly hold financial assets."}, "orig": "FSA 오답노트 L301 · 근거 SCH R10"}, {"id": "CON-M4-02", "src": "개념", "module": 4, "tag": "Types of depository institutions", "vig": null, "stem": "A member-owned, non-profit, non-public institution offering deposits, loans, and mortgages is a:", "opts": {"A": "mortgage bank", "B": "savings & loan", "C": "mutual bank"}, "ans": "C", "en": "L306: 판별기준  ①소유구조/영리성 ②취급상품의 범위·전문성\nL307: non-profit, non-public + 예금·대출·모기지 두루 취급 → Mutual Bank", "enLabel": "오답노트 원문", "ko": "Non-profit, non-public + broad deposits/loans/mortgages → mutual bank.", "trap": "", "f": "", "why": {"A": "A mortgage bank is a for-profit firm specializing in mortgages.", "B": "A savings & loan specializes in long-term home mortgages."}, "orig": "FSA 오답노트 L306 · 근거 ECO-M4-Q25"}, {"id": "CON-M4-03", "src": "개념", "module": 4, "tag": "What Basel III regulates directly", "vig": null, "stem": "Which is NOT a direct target of Basel III?", "opts": {"A": "Earnings quality", "B": "Liquidity (liquidity coverage ratio)", "C": "Minimum capital relative to risk-weighted assets"}, "ans": "A", "en": "L319: earning quality 는 직접적 규제 조항 X\nL320: Basel III 시행으로 수익의 질이 개선될 수 있다\"는 side effect일 뿐, 직접적 목표(직접 규제대상)는 아님", "enLabel": "오답노트 원문", "ko": "Earnings quality is not directly regulated; any improvement is only a side effect.", "trap": "", "f": "", "why": {"C": "Minimum capital is a core Basel III requirement.", "B": "The liquidity coverage ratio is a Basel III liquidity standard."}, "orig": "FSA 오답노트 L319 · 근거 ECO-M4-Q29 / SCH R10"}, {"id": "CON-M4-04", "src": "개념", "module": 4, "tag": "Stable funding", "vig": null, "stem": "Under Basel III, which funding source is considered more stable?", "opts": {"A": "Consumer deposits", "B": "Interbank funding", "C": "Neither; they are equally stable"}, "ans": "A", "en": "L321: funding stability 강화는 consumer deposits을 우대해서 달성 — (interbank deposits은 위기시 더 빠르게 이탈하는 경향)", "enLabel": "오답노트 원문", "ko": "Funding stability is improved by favoring consumer deposits (interbank funds leave faster in a crisis).", "trap": "", "f": "", "why": {"B": "Interbank funds tend to leave quickly in a crisis.", "C": "Stability depends on the type of depositor."}, "orig": "FSA 오답노트 L321 · 근거 SCH R10 / ECO-M4-Q50"}, {"id": "CON-M4-05", "src": "개념", "module": 4, "tag": "Available stable funding factor", "vig": null, "stem": "For funding with residual maturity of six months to one year, which has the highest Basel III available stable funding (ASF) factor?", "opts": {"A": "Less stable deposits from retail and small business customers", "B": "Funding from sovereigns and public sector entities", "C": "Funding from financial institutions"}, "ans": "A", "en": "L324: retail · small business 예금(non-maturity+term deposit) ASF Factor = 90%\nL326: sticky → 안정성 인정↑", "enLabel": "오답노트 원문", "ko": "Retail and small business deposits (non-maturity + term) available stable funding factor = 90%; they are sticky → more stability credit.", "trap": "", "f": "", "why": {"C": "Funding from financial institutions gets low stability credit.", "B": "Sovereign and public sector funding gets 50%, which is lower."}, "orig": "FSA 오답노트 L324 · 근거 ECO-M4-Q50"}, {"id": "CON-M4-06", "src": "개념", "module": 4, "tag": "Hard market → soft market", "vig": null, "stem": "What typically follows a hard market (high premiums, high profitability) in property & casualty insurance?", "opts": {"A": "Even stricter underwriting standards", "B": "A continued hard market with even higher premiums", "C": "A soft market, as new competitors enter and premiums and profitability fall"}, "ans": "C", "en": "L341: > - Hard Market(고보험료·고수익·엄격한인수기준)은 그 높은 수익성 때문에 오히려 신규 경쟁자들을 시장으로 끌어들이고, 그 경쟁자들이 더 싼 가격을 제시하면서 보험료·수익성·인수기준이 모두 하락하는 Soft Market으로 전환된다 / — Hard market에서 느슨해지는 방향으로 전환 / — Hard market에서 \"Soft로 전환되며 자본이 소진되어 더 어려워지는 방향\nL347: Hard→Soft 전환 시 인수기준·자본적정성 모두 \"악화\"방향", "enLabel": "오답노트 원문", "ko": "High hard-market profits → new competitors → lower prices → soft market (premiums, profitability, underwriting standards all fall).", "trap": "", "f": "", "why": {"B": "High profits attract competitors, so it does not last.", "A": "Underwriting loosens as the market turns soft."}, "orig": "FSA 오답노트 L341 · 근거 SCH R10"}, {"id": "CON-M4-07", "src": "개념", "module": 4, "tag": "Combined ratio denominators", "vig": null, "stem": "Under statutory accounting, the denominators of the loss ratio and the underwriting expense ratio are:", "opts": {"A": "written premiums for both", "B": "earned premiums for the loss ratio, written premiums for the expense ratio", "C": "written premiums for the loss ratio, earned premiums for the expense ratio"}, "ans": "B", "en": "L348: Combined Ratio 계산 시 Loss Ratio(분모=Earned) ≠ Underwriting Expense Ratio(분모=Written)\nL350: US GAAP 은 분모 Earned로 통일", "enLabel": "오답노트 원문", "ko": "Loss ratio (denominator = earned) ≠ underwriting expense ratio (denominator = written). US GAAP uses earned for both.", "trap": "", "f": "", "why": {"A": "The loss ratio uses earned premiums.", "C": "It is the reverse."}, "orig": "FSA 오답노트 L348 · 근거 SCH R10"}, {"id": "CON-M4-08", "src": "개념", "module": 4, "tag": "Reinsurance", "vig": null, "stem": "Which line of insurance is the most international (cross-border)?", "opts": {"A": "Life insurance", "B": "Property & casualty insurance", "C": "Reinsurance"}, "ans": "C", "en": "L351: 재보험만 구조적으로 국제화(위험분산의 필연적 요구)", "enLabel": "오답노트 원문", "ko": "Only reinsurance is structurally international (needed to spread risk).", "trap": "", "f": "", "why": {"A": "Life insurance is mostly domestic.", "B": "Ordinary property & casualty insurance has less cross-border business."}, "orig": "FSA 오답노트 L351 · 근거 ECO-M4-Q32"}, {"id": "CON-M4-09", "src": "개념", "module": 4, "tag": "Bank earnings quality", "vig": null, "stem": "A bank's earnings become more sustainable when:", "opts": {"A": "trading income makes up a larger share", "B": "net interest income and fee income make up a larger share", "C": "the absolute amount of earnings grows"}, "ans": "B", "en": "L355: Net Interest Income + Net Fee Income 비중 ↑ ⇒ Sustainability ↑  (반복적 본업 수익, 예측 가능)\nL356: Net Trading Income 비중 ↑ → Volatility ↑  = 시장가격 노출, 예측 불가\nL357: 절대금액이 아니라 common-size %로 판단해야 함 (이 항목의 비중이 늘었나 줄었나로)", "enLabel": "오답노트 원문", "ko": "Higher net interest + fee income share ⇒ sustainability↑; higher trading income share ⇒ volatility↑. Use common-size %.", "trap": "", "f": "", "why": {"A": "A larger trading income share means more volatility.", "C": "Judge by composition (common-size %), not absolute amounts."}, "orig": "FSA 오답노트 L355 · 근거 SCH R10 / ECO-M4-Q16"}, {"id": "CON-M4-10", "src": "개념", "module": 4, "tag": "Total Tier 1 capital ratio", "vig": null, "stem": "The total Tier 1 capital ratio is:", "opts": {"A": "(common equity Tier 1 + additional Tier 1) ÷ total assets", "B": "(common equity Tier 1 + Tier 2) ÷ risk-weighted assets", "C": "(common equity Tier 1 + additional Tier 1) ÷ risk-weighted assets"}, "ans": "C", "en": "L361: Total Tier 1 ratio = (CET1 + Additional Tier 1) / RWA\nL363: Risk-weighted assets 대비 비율로 계산", "enLabel": "오답노트 원문", "ko": "Total Tier 1 ratio = (common equity Tier 1 + additional Tier 1) / risk-weighted assets.", "trap": "", "f": "", "why": {"B": "Tier 2 belongs in the total capital ratio.", "A": "The denominator is risk-weighted assets, not total assets."}, "orig": "FSA 오답노트 L361 · 근거 ECO-M4-Q21"}, {"id": "CON-M4-11", "src": "개념", "module": 4, "tag": "Value at risk – covariance adjustment", "vig": null, "stem": "For a bank's market risk, the covariance adjustment reflects that total value at risk (VaR) is:", "opts": {"A": "less than the sum of the value at risk for each risk type", "B": "equal to the sum of the value at risk for each risk type", "C": "greater than the sum of the value at risk for each risk type"}, "ans": "A", "en": "L367: Sensitivity to market risk - covariance adjustment : total VaR < sum of 개별 VaR", "enLabel": "오답노트 원문", "ko": "Covariance adjustment: total value at risk < sum of individual value at risk figures.", "trap": "", "f": "", "why": {"C": "Diversification makes total value at risk smaller.", "B": "They are equal only if correlations are 1."}, "orig": "FSA 오답노트 L367 · 근거 ECO-M4-Q49"}, {"id": "CON-M4-12", "src": "개념", "module": 4, "tag": "Not covered by CAMELS", "vig": null, "stem": "Which is NOT covered by the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, sensitivity) approach?", "opts": {"A": "Capital adequacy", "B": "Off-balance-sheet items", "C": "Liquidity"}, "ans": "B", "en": "L405: CAMELS  : Off-balance-sheet 항목(standby L/C, 미인출 대출약정 등)은 안다룸", "enLabel": "오답노트 원문", "ko": "CAMELS does not cover off-balance-sheet items (standby letters of credit, unused loan commitments, etc.).", "trap": "", "f": "", "why": {"A": "Capital adequacy is the C in CAMELS.", "C": "Liquidity is the L in CAMELS."}, "orig": "FSA 오답노트 L405 · 근거 ECO-M4-Q56"}, {"id": "CON-M5-01", "src": "개념", "module": 5, "tag": "Limits of quantitative models", "vig": null, "stem": "A limitation of quantitative models such as the Beneish model is that they:", "opts": {"A": "can prove cause and effect", "B": "show only associations between variables, not cause and effect", "C": "become more predictive over time"}, "ans": "B", "en": "L371: quantitative models → 인과관계(cause and effect) 파악 불가. 상관관계 (establishing association)만 가능, 시간 지날수록 예측력 떨어짐 ", "enLabel": "오답노트 원문", "ko": "Quantitative models cannot establish cause and effect, only association, and their predictive power falls over time.", "trap": "", "f": "", "why": {"A": "Quantitative models establish only associations.", "C": "Their predictive power declines as managers learn to game them."}, "orig": "FSA 오답노트 L371 · 근거 ECO-M5-Q4 / SCH R11"}, {"id": "CON-M5-02", "src": "개념", "module": 5, "tag": "Understating intangibles at acquisition", "vig": null, "stem": "If amortizable intangible assets are understated at acquisition:", "opts": {"A": "goodwill is understated", "B": "goodwill is overstated and amortization is lower, so future earnings are overstated", "C": "future earnings are understated"}, "ans": "B", "en": "L372: 무형자산 과소계상 → 이익 과대계상 메커니즘\nL374: 인수시 Amortizable Intangibles 과소계상 → 차액이 Goodwill로 과대배분\nL375: 상각비(amortization expense) 과소계상 → 이익 과대계상", "enLabel": "오답노트 원문", "ko": "Understated amortizable intangibles → goodwill over-allocated → lower amortization expense → earnings overstated.", "trap": "", "f": "", "why": {"C": "Lower amortization raises earnings.", "A": "The difference goes to goodwill, so goodwill is larger."}, "orig": "FSA 오답노트 L372 · 근거 SCH R11"}, {"id": "CON-M5-03", "src": "개념", "module": 5, "tag": "Understated valuation allowance", "vig": null, "stem": "Understating the valuation allowance for deferred tax assets:", "opts": {"A": "overstates tax expense and understates deferred tax assets", "B": "understates tax expense and overstates deferred tax assets", "C": "overstates both tax expense and deferred tax assets"}, "ans": "B", "en": "L378: understate valuation allowance for deferred tax assets: understates tax expenses and overstates the value of the deferred tax assets.", "enLabel": "오답노트 원문", "ko": "Understated valuation allowance → understates tax expense, overstates deferred tax assets.", "trap": "", "f": "", "why": {"A": "The direction is reversed.", "C": "A smaller allowance means lower tax expense."}, "orig": "FSA 오답노트 L378 · 근거 ECO-M5-Q36"}, {"id": "CON-M5-04", "src": "개념", "module": 5, "tag": "Sources for business risk", "vig": null, "stem": "Which source is least useful for investigating a company's business risks (such as environmental risk)?", "opts": {"A": "The auditor's report", "B": "Management commentary", "C": "The financial press"}, "ans": "A", "en": "L379: auditor’s report는 재무제표의 적정성 의견일 뿐 환경위험 등 사업위험을 설명하지 않음 → business risk 조사에 유용 X .\nL381: financial press, management commentary는 business risk조사에 유용", "enLabel": "오답노트 원문", "ko": "The auditor's report only gives an opinion on the financial statements; it does not describe business risks.", "trap": "", "f": "", "why": {"C": "The financial press is useful for business risks.", "B": "Management commentary discusses risks."}, "orig": "FSA 오답노트 L379 · 근거 ECO-M5-Q26"}, {"id": "CON-M5-05", "src": "개념", "module": 5, "tag": "Capitalizing off-balance-sheet obligations", "vig": null, "stem": "When an off-balance-sheet obligation such as a take-or-pay contract is added to the balance sheet:", "opts": {"A": "only liabilities rise and equity falls", "B": "assets, liabilities, and equity all rise", "C": "assets and liabilities both rise by the present value of future payments; equity is unchanged"}, "ans": "C", "en": "L382: Off-Balance-Sheet Obligations → Constructive Capitalization\nL385: Assets: 미래 지급액의 현재가치(PV)만큼 증가\nL386: Liabilities: 미래 지급액의 현재가치(PV)만큼 증가\nL387: Equity: 변동 없음 (No Change)\nL404: Take-or-pay 등 off-balance-sheet obligation 는 미래 지급액의 PV만큼 자산과 부채에 동시에 추가. Equity 변동 X", "enLabel": "오답노트 원문", "ko": "Constructive capitalization: assets and liabilities ↑ by present value; equity unchanged.", "trap": "", "f": "", "why": {"A": "Assets rise by the same amount, so equity does not change.", "B": "Equity does not change."}, "orig": "FSA 오답노트 L382 · 근거 SCH R11"}, {"id": "CON-M5-06", "src": "개념", "module": 5, "tag": "Normalizing recurring restructuring charges", "vig": null, "stem": "If restructuring charges recur regularly, to estimate permanent earnings the analyst should:", "opts": {"A": "leave it only in the current period", "B": "exclude it entirely as a one-off item", "C": "spread the current charge over past periods and the current period"}, "ans": "C", "en": "L388: Restructuring Charge의 Earnings Normalization\nL390: 반복적으로 발생하는 구조조정 비용이라면 과거 - 현재 기간에 걸쳐서 분산 (Spread)\nL391: 특정 연도에 비용이 몰려 이익이 착시되는 현상을 막고, 회사의 지속 가능한 이익(Permanent / Normalized Earnings)을 정확히 추정하기 위함.", "enLabel": "오답노트 원문", "ko": "Recurring restructuring charges → spread over past and current periods → normalized earnings.", "trap": "", "f": "", "why": {"B": "If it recurs, it is not a one-off.", "A": "Leaving it in one year distorts earnings."}, "orig": "FSA 오답노트 L388 · 근거 ECO-M5-Q53"}, {"id": "CON-M5-07", "src": "개념", "module": 5, "tag": "Non-observable inputs", "vig": null, "stem": "If many assets are valued using non-observable (Level 3) inputs, which aspect of reporting quality is most at risk?", "opts": {"A": "Clarity of presentation", "B": "Completeness", "C": "Unbiased measurement"}, "ans": "C", "en": "L398: non-observable asset → Unbiased measurement 문제 ↑", "enLabel": "오답노트 원문", "ko": "Non-observable inputs → unbiased measurement problem↑.", "trap": "", "f": "", "why": {"B": "Completeness is about omitted items.", "A": "It is not a presentation issue."}, "orig": "FSA 오답노트 L398 · 근거 ECO-M5-Q39"}, {"id": "CON-M5-08", "src": "개념", "module": 5, "tag": "Bankruptcy models – going concern problem", "vig": null, "stem": "Which bankruptcy prediction models best address the going-concern problem of accounting-based models such as the Altman model?", "opts": {"A": "Using more years of financial statements", "B": "Market-based models", "C": "Hazard models"}, "ans": "B", "en": "L399: Altman 등 회계기반(hazard 모형 포함) 모델은 과거 성과·going concern assumption에 기반한 재무제표 사용이 단점\nL401: 대안 = market-based 모델", "enLabel": "오답노트 원문", "ko": "Accounting-based models (including hazard models) rely on past performance and going-concern statements → alternative = market-based models.", "trap": "", "f": "", "why": {"C": "Hazard models also rely on accounting data.", "A": "Historical statements keep the same limitation."}, "orig": "FSA 오답노트 L399 · 근거 ECO-M5-Q40"}, {"id": "CON-M5-09", "src": "개념", "module": 5, "tag": "Propping", "vig": null, "stem": "Propping means:", "opts": {"A": "transferring wealth from a public company to a private entity", "B": "transferring resources from a manager-owned private entity to a public company", "C": "shifting accounting earnings into future periods"}, "ans": "B", "en": "L402: Propping: private → public entity로 자원 이전(생존 유지, 미래 착취 옵션 보존)\nL403: Tunneling: public→ private기업으로 불리한 가격 거래로 부 이전", "enLabel": "오답노트 원문", "ko": "Propping: private → public resource transfer / Tunneling: public → private wealth transfer.", "trap": "", "f": "", "why": {"A": "That is tunneling.", "C": "That describes earnings management."}, "orig": "FSA 오답노트 L402 · 근거 ECO-M5-Q44"}, {"id": "CON-M5-10", "src": "개념", "module": 5, "tag": "Lower inventory obsolescence allowance", "vig": null, "stem": "If the inventory obsolescence allowance is reduced, inventory turnover:", "opts": {"A": "increases", "B": "does not change", "C": "decreases"}, "ans": "C", "en": "L377: obsolescence allowance↓⇒inventory 장부가↑⇒inventory turnover↓", "enLabel": "오답노트 원문", "ko": "Obsolescence allowance↓ ⇒ inventory carrying value↑ ⇒ inventory turnover↓.", "trap": "", "f": "", "why": {"A": "Inventory carrying value rises, so the denominator rises.", "B": "The carrying value changes, so the ratio changes."}, "orig": "FSA 오답노트 L377 · 근거 ECO-M5-Q2"}, {"id": "CON-M5-11", "src": "개념", "module": 5, "tag": "Abnormal accruals", "vig": null, "stem": "When total accruals are regressed on normal drivers, abnormal (discretionary) accruals are the:", "opts": {"A": "regression coefficients", "B": "regression residuals", "C": "fitted values"}, "ans": "B", "en": "L396: 총 Accrual을 정상 발생 요인(신용매출 증가 등)에 회귀 → 잔차 = abnormal(discretionary) accruals\nL397: 잔차가 0이면 총 발생액 = normal(non-discretionary) accruals", "enLabel": "오답노트 원문", "ko": "Regress total accruals on normal drivers → residual = abnormal accruals.", "trap": "", "f": "", "why": {"C": "Fitted values are normal (non-discretionary) accruals.", "A": "Coefficients measure sensitivity to the normal drivers."}, "orig": "FSA 오답노트 L396 · 근거 SCH R11"}, {"id": "CON-M6-01", "src": "개념", "module": 6, "tag": "Judging accruals ratio improvement", "vig": null, "stem": "If the cash-flow-based accruals ratio changes from −6.7% to −1.4%, it has:", "opts": {"A": "cannot be judged", "B": "worsened (the value increased)", "C": "improved (its absolute value moved closer to zero)"}, "ans": "C", "en": "L392: |Accural Ratio| 작을 수록 Eargning qualtiy ↑\nL395: 마이너스(-) 부호가 붙어 있더라도 절댓값이 줄어들면 0에 가까워진 것이므로 개선된 것!\nL412: accural ratio 개선은 절대값으로 판단! 절대값이 작아진게 개선된 것", "enLabel": "오답노트 원문", "ko": "Judge accruals ratio improvement by absolute value: a smaller absolute value is an improvement.", "trap": "", "f": "", "why": {"B": "Judge by absolute value, regardless of sign.", "A": "The change in absolute value is enough to judge."}, "orig": "FSA 오답노트 L392 · 근거 ECO-M6-Q22"}, {"id": "CON-M6-02", "src": "개념", "module": 6, "tag": "When restatement is required", "vig": null, "stem": "A company most likely must restate prior-year financial statements when:", "opts": {"A": "a change in accounting standards alters the calculation of benefit plan obligations", "B": "it reclassifies financial assets", "C": "its accruals ratio is high"}, "ans": "A", "en": "L413: Accounting standard change로 퇴직급여 부채 계산이 바뀐 경우 → prior year 재무재표 재작성 필요\nL415: accural ratio가 높은것은 조정 대상일 뿐 재작성은 X", "enLabel": "오답노트 원문", "ko": "An accounting standard change that alters post-employment benefit obligations → restate the prior year.", "trap": "", "f": "", "why": {"C": "A high accruals ratio calls for analyst adjustment, not restatement.", "B": "Reclassifying financial assets does not restate prior periods."}, "orig": "FSA 오답노트 L413 · 근거 ECO-M6-Q24 / ECO-M1-Q52"}, {"id": "CON-M1-18", "src": "개념", "module": 1, "tag": "Goodwill calculation", "vig": null, "stem": "An acquirer pays €800 for 100% of a target. The target's assets have a fair value of €1,000 and its liabilities a fair value of €400 (book value of net assets: €400). Goodwill is:", "opts": {"A": "€400", "B": "−€200 (a bargain purchase gain)", "C": "€200"}, "ans": "C", "en": "L26: Goodwill = 지급액 − identificational Net Asset의 FV\nL29: identificial Net asset의 FV = 자산의 FV − 부채의 FV", "enLabel": "오답노트 원문", "ko": "Goodwill = price paid − fair value of identifiable net assets; identifiable net assets = fair value of assets − fair value of liabilities = 1,000 − 400 = 600 → 800 − 600 = 200.", "trap": "", "f": "", "why":

{"A": "This uses the book value of net assets; goodwill uses fair value.", "B": "This ignores the liabilities; identifiable net assets = assets − liabilities at fair value."}, "orig": "FSA 오답노트 L26 · 근거 SCH R7"}, {"id": "CON-M1-19", "src": "개념", "module": 1, "tag": "Identifiable net assets when fair value = book value", "vig": null, "stem": "If all of the target's fair values equal book values, the fair value of identifiable net assets can be taken as:", "opts": {"A": "the target's share capital only", "B": "the target's book equity (share capital + retained earnings)", "C": "the target's total assets"}, "ans": "B", "en": "L30: 모든 FV = BV로 주어지면: 자기자본(share capital + retained earnings)을 그대로 사용\nL31: 일부 FV가 BV와 다르면: 자기자본 + (FV − BV) 조정분", "enLabel": "오답노트 원문", "ko": "All fair value = book value → use equity (share capital + retained earnings). If some differ → equity + (fair value − book value) adjustments.", "trap": "", "f": "", "why": {"C": "Liabilities must be subtracted from assets.", "A": "Retained earnings are also part of equity."}, "orig": "FSA 오답노트 L30 · 근거 SCH R7"}, {"id": "CON-M1-20", "src": "개념", "module": 1, "tag": "Equity method – year-one carrying value", "vig": null, "stem": "An investor buys 30% of an investee for $500. In year one the investee earns net income of $200 and pays dividends of $50. The excess of fair value over book value of the investee's equipment is $200, with a 10-year remaining life. The year-end investment balance is:", "opts": {"A": "$560", "B": "$539", "C": "$545"}, "ans": "B", "en": "L9: Depreciable asset(P&E)에 excess purchase price가 있을 때, 1년차 carrying value :\nL10: Investment = Cost + NI x %− Div x % − (FV − BV)x% ÷ remaining useful life\nL11: Excess purchase price(FV − BV)가 depreciable asset에 귀속되면, ownership % × (FV − BV) ÷ remaining useful life를 매년 amortize", "enLabel": "오답노트 원문", "ko": "Investment = cost + % × net income − % × dividends − % × (fair value − book value) ÷ remaining life = 500 + 60 − 15 − 6 = 539.", "trap": "", "f": "", "why": {"C": "This omits the amortization of the excess purchase price (30% × 200 ÷ 10 = $6).", "A": "This also omits the dividends received (30% × 50 = $15)."}, "orig": "FSA 오답노트 L9 · 근거 SCH R7"}, {"id": "CON-M1-21", "src": "개념", "module": 1, "tag": "Fair value through profit or loss – amount in profit or loss", "vig": null, "stem": "A company buys shares for $1,000, receives dividends of $30, and the shares are worth $1,100 at year-end. If classified at fair value through profit or loss, the amount recognized in profit or loss is:", "opts": {"A": "$130", "B": "$100", "C": "$30"}, "ans": "A", "en": "L40: FVPL 일 때 IS에 인식하는 FVPL income = Dividends + ΔFair value\nL44: | FVPL | [배당 + (기말 FV− 취득가)] x 지분% |", "enLabel": "오답노트 원문", "ko": "Fair value through profit or loss income = [dividends + (ending fair value − cost)] = 30 + 100 = 130.", "trap": "", "f": "", "why": {"C": "Only dividends in profit or loss is the fair value through other comprehensive income treatment for equity.", "B": "Dividends are also recognized in profit or loss."}, "orig": "FSA 오답노트 L40 · 근거 SCH R7"}, {"id": "CON-M1-22", "src": "개념", "module": 1, "tag": "Proportionate consolidation", "vig": null, "stem": "Under proportionate consolidation, the investor reports:", "opts": {"A": "its ownership share of each revenue and expense line", "B": "a single line equal to its share of the investee's net income", "C": "100% of revenues and expenses with a non-controlling interest"}, "ans": "A", "en": "L39: Proportionate consolidation: 지분율 × 매출·비용 라인별 합산", "enLabel": "오답노트 원문", "ko": "Proportionate consolidation: ownership % × each revenue and expense line added line by line.", "trap": "", "f": "", "why": {"B": "A single line is the equity method.", "C": "100% with a non-controlling interest is full consolidation."}, "orig": "FSA 오답노트 L39 · 근거 SCH R7"}, {"id": "CON-M2-28", "src": "개념", "module": 2, "tag": "Effective tax rate definition", "vig": null, "stem": "A company's effective tax rate is:", "opts": {"A": "the statutory rate set by the tax code", "B": "income tax expense ÷ pretax income", "C": "income taxes paid in cash ÷ pretax income"}, "ans": "B", "en": "L92: statutory tax rate = 법정 세율\nL93: Effective tax rate = 회사가 IS에 반영한 실효 세율\nL94: income tax expense ÷ pretax income (statutory tax rate = 세법상 세율)", "enLabel": "오답노트 원문", "ko": "Effective tax rate = income tax expense ÷ pretax income (the rate actually reflected in the income statement); statutory tax rate = rate set by tax law.", "trap": "", "f": "", "why": {"C": "The effective tax rate uses income tax expense from the income statement.", "A": "The statutory rate is the legal rate, not the effective rate."}, "orig": "FSA 오답노트 L92 · 근거 SCH R9"}, {"id": "CON-M2-29", "src": "개념", "module": 2, "tag": "Enterprise value to equity value", "vig": null, "stem": "When moving from enterprise value (present value of free cash flow to the firm) to equity value, the correct adjustment is:", "opts": {"A": "equity value = enterprise value − debt − net pension liability − other claims + cash", "B": "equity value = enterprise value − debt + cash (pensions ignored)", "C": "equity value = enterprise value − debt − gross pension benefit obligation + cash"}, "ans": "A", "en": "L125: EV → Equity value 전환 시, net pension liability(=funded status, PBO−plan assets)를 debt처럼 차감.\nL127: FCFF의 PV = EV (주주 + 채권자 + 연금 수급자 등 모든 자금 제공자 몫)\nL128: Equity Value = EV - Debt - Net pension Liability - 기타청구권 + cash", "enLabel": "오답노트 원문", "ko": "Present value of free cash flow to the firm = enterprise value (value to all capital providers, including pension beneficiaries). Equity value = enterprise value − debt − net pension liability − other claims + cash.", "trap": "", "f": "", "why": {"C": "Deducting the gross obligation ignores plan assets that are reserved for paying benefits.", "B": "An underfunded pension is a debt-like claim and must be deducted."}, "orig": "FSA 오답노트 L125 · 근거 ECO-M2-Q6"}, {"id": "CON-M2-30", "src": "개념", "module": 2, "tag": "Other comprehensive income and funded status", "vig": null, "stem": "If actuarial losses are recognized in other comprehensive income instead of profit or loss, the funded status on the balance sheet is:", "opts": {"A": "larger, because other comprehensive income is excluded from equity", "B": "unchanged; where the loss is recorded does not change plan assets − projected benefit obligation", "C": "smaller, because the loss is kept off profit or loss"}, "ans": "B", "en": "L151: OCI 인식은 '기록 위치'의 문제일 뿐. funded status(자산 − PBO) 크기는 별개", "enLabel": "오답노트 원문", "ko": "Recognizing in other comprehensive income is only a matter of where it is recorded; the funded status (assets − projected benefit obligation) is separate.", "trap": "", "f": "", "why": {"C": "Recording location does not change the size of the obligation or plan assets.", "A": "Other comprehensive income is part of equity, and the funded status is unaffected either way."}, "orig": "FSA 오답노트 L151 · 근거 SCH R8"}, {"id": "CON-M2-31", "src": "개념", "module": 2, "tag": "Assumptions that raise the projected benefit obligation", "vig": null, "stem": "Which assumption change increases the projected benefit obligation?", "opts": {"A": "Longer life expectancy of beneficiaries", "B": "A higher expected return on plan assets", "C": "A higher discount rate"}, "ans": "A", "en": "L154: 할인율(↓이면 PBO ↑), 임금 상승률(↑이면 PBO ↑), 사망률 등으로 결정", "enLabel": "오답노트 원문", "ko": "The projected benefit obligation depends on the discount rate (↓ → obligation↑), salary growth (↑ → obligation↑), and mortality/life expectancy.", "trap": "", "f": "", "why": {"C": "A higher discount rate lowers the obligation.", "B": "The expected return does not affect the obligation."}, "orig": "FSA 오답노트 L154 · 근거 SCH R8"}, {"id": "CON-M2-32", "src": "개념", "module": 2, "tag": "Restricted stock unit dilution – calculation", "vig": null, "stem": "A company has 1,000,000 unvested restricted stock units. Unrecognized share-based compensation is $12 million at the beginning and $8 million at the end of the year; the average share price is $50. Dilutive shares under the treasury stock method are:", "opts": {"A": "1,000,000", "B": "840,000", "C": "800,000"}, "ans": "C", "en": "L168: Dilutive shares = Unvested RSUs − (Avg unrecognized SBC / Avg price)\nL170: Avg unrecognized SBC  = (기초 + 기말)/2\nL171: 늘어나는 주식 : Unvested RSU(돈 안내고, 주식 수가 그대로 늘어남)", "enLabel": "오답노트 원문", "ko": "Dilutive shares = unvested units − (average unrecognized compensation ÷ average price) = 1,000,000 − (10m ÷ 50) = 800,000; average unrecognized = (beginning + ending) ÷ 2.", "trap": "", "f": "", "why": {"B": "This uses only the ending unrecognized amount ($8m ÷ $50); use the average of beginning and ending.", "A": "The unrecognized compensation is assumed to buy back shares, which must be subtracted."}, "orig": "FSA 오답노트 L168 · 근거 ECO-M2-Q17"}, {"id": "CON-M3-18", "src": "개념", "module": 3, "tag": "Net income volatility by method", "vig": null, "stem": "Which translation method makes the parent's net income more volatile?", "opts": {"A": "The temporal method, because remeasurement gains and losses go to the income statement", "B": "Neither; both send gains and losses to other comprehensive income", "C": "The current rate method, because all items use the current rate"}, "ans": "A", "en": "L219: | 손익 / 위치 | Income statement | Equity(CTA, OCI) | Income statement |\nL220: | 변동성 | net income 변동 | net income 변동X | net income 변동 |", "enLabel": "오답노트 원문", "ko": "Temporal: gains/losses in the income statement → net income volatility. Current rate: in equity (cumulative translation adjustment, other comprehensive income) → no net income volatility.", "trap": "", "f": "", "why": {"C": "Current rate gains and losses go to other comprehensive income, so net income is not affected.", "B": "Only the current rate method uses other comprehensive income."}, "orig": "FSA 오답노트 L219 · 근거 SCH R9"}, {"id": "CON-M3-19", "src": "개념", "module": 3, "tag": "Effective tax rate reconciliation – sign", "vig": null, "stem": "In the effective tax rate reconciliation, a positive 'effect of tax rates in foreign jurisdictions' means foreign tax rates are:", "opts": {"A": "higher than the domestic rate, raising the effective tax rate", "B": "higher than the domestic rate, lowering the effective tax rate", "C": "lower than the domestic rate, raising the effective tax rate"}, "ans": "A", "en": "L226: ETR = Statutory domestic tax rate + ETR in foreign jurisdiction + Effect of tax exemptions & other reconciling items (=국내 법정세율 + 외국 세율 효과 + 면세 · 기타 항목)\nL228: ETR in foreign jurisdiction > 국내세율 (+) → ETR을 올림\nL229: ETR in foreign jurisdiction < 국내세율 (-) → ETR을 낮춤", "enLabel": "오답노트 원문", "ko": "Effective tax rate = domestic statutory rate + effect of foreign tax rates + exemptions and other items. Foreign rate > domestic (+) → raises; < domestic (−) → lowers.", "trap": "", "f": "", "why": {"C": "Lower foreign rates give a negative effect.", "B": "Higher foreign rates raise, not lower, the effective tax rate."}, "orig": "FSA 오답노트 L226 · 근거 SCH R9"}, {"id": "CON-M3-20", "src": "개념", "module": 3, "tag": "Why foreign operations change the effective tax rate", "vig": null, "stem": "Changes in a company's effective tax rate due to foreign operations come from:", "opts": {"A": "changes in the company's dividend policy", "B": "changes in the domestic statutory rate only", "C": "changes in the mix of profits across countries and changes in tax rates"}, "ans": "C", "en": "L234: 외국 사업이 ETR에 미치는 영향\nL236: 1. profitable business mix 변화\nL237: 2. marginal tax rate(세율) 변화", "enLabel": "오답노트 원문", "ko": "Foreign operations affect the effective tax rate through (1) a change in the profitable business mix and (2) a change in marginal tax rates.", "trap": "", "f": "", "why": {"B": "The domestic rate is a separate line, not the foreign effect.", "A": "Dividend policy does not change tax rates on profits."}, "orig": "FSA 오답노트 L234 · 근거 SCH R9"}, {"id": "CON-M3-21", "src": "개념", "module": 3, "tag": "Foreign exchange effect on sales", "vig": null, "stem": "A subsidiary's sales are FC 1,000 in both years. The average exchange rate was $1.20/FC last year and $1.10/FC this year. The change in reported sales is:", "opts": {"A": "−$100, entirely from foreign exchange", "B": "$0, because local-currency sales did not change", "C": "−$100, from lower organic growth"}, "ans": "A", "en": "L244: 매출 증가 중 FX 효과 계산\nL246: FX 효과 = 외화 매출 × $ (\\text{평균환율}_t - \\text{평균환율}_{t-1})$\nL247: 외화 매출이 변하지 않으면 매출 증가는 전부 환율 효과\nL248: revenue, cost → avg rate로 환산", "enLabel": "오답노트 원문", "ko": "Foreign exchange effect = foreign currency sales × (average rate this year − average rate last year) = 1,000 × (1.10 − 1.20) = −100. If local sales are unchanged, all of the change is foreign exchange.", "trap": "", "f": "", "why": {"B": "Reported sales change because the translation rate changed.", "C": "Local-currency sales are flat, so organic growth is zero."}, "orig": "FSA 오답노트 L244 · 근거 SCH R9"}, {"id": "CON-M3-22", "src": "개념", "module": 3, "tag": "Hyperinflation – US GAAP revenue", "vig": null, "stem": "Under US GAAP, revenue of a subsidiary in a hyperinflationary economy is translated:", "opts": {"A": "at the average exchange rate, without inflation restatement", "B": "after restating with a general price index, at the year-end rate", "C": "at the historical rate when the subsidiary was acquired"}, "ans": "A", "en": "L277: US GAAP: temporal method (Inflation 조정 X)\nL279: 매출 → 바로 평균 환율로 환산", "enLabel": "오답노트 원문", "ko": "US GAAP: temporal method, no inflation adjustment → revenue translated directly at the average rate.", "trap": "", "f": "", "why": {"B": "Restatement then the year-end rate is the IFRS approach.", "C": "Revenue uses the average rate under the temporal method."}, "orig": "FSA 오답노트 L277 · 근거 SCH R9"}, {"id": "CON-M3-23", "src": "개념", "module": 3, "tag": "Hyperinflation – restating a stock item", "vig": null, "stem": "Under IFRS, land costing LC 1,000 was bought when the general price index was 100. The year-end index is 400, the year-end rate is $0.01/LC, and the historical rate was $0.05/LC. The land is reported at:", "opts": {"A": "$50", "B": "$10", "C": "$40"}, "ans": "C", "en": "L261: Stock 항목 (자본금, 유형자산, 무형자산 등 — 특정시점에 확정)\nL262: Stock: 금액 × GPI기말/GPI취득시점 × 기말환율\nL265: \\text{Restatement Factor} = \\frac{GPI(\\text{기말})}{GPI(\\text{취득/기초 시점})}\nL269: Restate된 Local currency 금액 = 원래 금액 x Restatement Factor\nL270: Reporting 통화 금액 = 재작성된 금액. x 기말 (현재) 환율", "enLabel": "오답노트 원문", "ko": "Stock items: amount × year-end index ÷ index at acquisition × year-end rate = 1,000 × 400/100 × 0.01 = 40.", "trap": "", "f": "", "why": {"B": "This translates at the year-end rate without restating for inflation.", "A": "This is the historical-rate amount, which IFRS does not use for hyperinflation."}, "orig": "FSA 오답노트 L261 · 근거 SCH R9"}, {"id": "CON-M3-24", "src": "개념", "module": 3, "tag": "Net price realization and mix", "vig": null, "stem": "Net price realization and product mix are part of:", "opts": {"A": "acquisitions and divestitures", "B": "organic growth", "C": "foreign exchange effects"}, "ans": "B", "en": "L288: Net price realization·mix = organic의 구성요소 (FX와 별개)", "enLabel": "오답노트 원문", "ko": "Net price realization and mix are components of organic growth (separate from foreign exchange).", "trap": "", "f": "", "why": {"C": "They are separate from foreign exchange.", "A": "They are not about buying or selling businesses."}, "orig": "FSA 오답노트 L288 · 근거 ECO-M3-Q4"}, {"id": "CON-M3-25", "src": "개념", "module": 3, "tag": "Sustainability of currency-driven growth", "vig": null, "stem": "Sales growth caused by a stronger foreign currency is:", "opts": {"A": "the best measure of future growth", "B": "less sustainable, so growth should be judged on organic (volume + price) growth", "C": "more sustainable than organic growth"}, "ans": "B", "en": "L290: 외화 강세로 인한 성장은 지속 가능성이 낮음 → 통화 효과를 제외한 organic 성장으로 평가\nL297: Sustainable growth = Volume + Price (FX 제외)", "enLabel": "오답노트 원문", "ko": "Growth from a stronger foreign currency is less sustainable → evaluate organic growth excluding currency; sustainable growth = volume + price.", "trap": "", "f": "", "why": {"C": "Currency gains can reverse.", "A": "Exchange rate moves are not a reliable driver of future growth."}, "orig": "FSA 오답노트 L290 · 근거 SCH R9"}, {"id": "CON-M3-26", "src": "개념", "module": 3, "tag": "Current rate method – non-monetary items", "vig": null, "stem": "Under the current rate method, unrealized gains and losses on non-monetary items from exchange rate changes are:", "opts": {"A": "recognized in the income statement", "B": "ignored, because non-monetary items use historical rates", "C": "reflected through the cumulative translation adjustment in other comprehensive income"}, "ans": "C", "en": "L292: Current rate method는 모든 자산·부채를 기말환율로 환산 → 비화폐성 항목의 unrealized G&L도 반영(CTA, OCI)\nL294: Temporal은 비화폐성 항목을 historical rate로 고정 → unrealized G&L 무시", "enLabel": "오답노트 원문", "ko": "Current rate method translates all assets and liabilities at the year-end rate → unrealized gains/losses on non-monetary items are reflected (cumulative translation adjustment, other comprehensive income); temporal ignores them.", "trap": "", "f": "", "why": {"B": "Holding non-monetary items at historical rates is the temporal method.", "A": "Current rate translation adjustments go to other comprehensive income."}, "orig": "FSA 오답노트 L292 · 근거 SCH R9"}, {"id": "CON-M3-27", "src": "개념", "module": 3, "tag": "Temporal method – translated retained earnings", "vig": null, "stem": "Under the temporal method, translated retained earnings are found as:", "opts": {"A": "the plug: translated assets − translated liabilities − other translated equity", "B": "retained earnings × current rate", "C": "retained earnings × average rate"}, "ans": "A", "en": "L218: | Plug | - | CTA | Retained earnings |\nL291: translated value of retained earning 계산 : Asset, Liab&Equity 구한 후 Asset - Liability - Equity 차액만큼 plug in", "enLabel": "오답노트 원문", "ko": "Translated retained earnings: compute assets, liabilities, and equity, then plug the difference (assets − liabilities − equity).", "trap": "", "f": "", "why": {"B": "Retained earnings is not translated at a single rate.", "C": "Retained earnings is the balancing figure, not an average-rate item."}, "orig": "FSA 오답노트 L218 · 근거 SCH R9"}, {"id": "CON-M4-13", "src": "개념", "module": 4, "tag": "Capital adequacy over the insurance cycle", "vig": null, "stem": "For property & casualty insurers, capital adequacy is easier to maintain in a:", "opts": {"A": "soft market, because lower premiums reduce risk", "B": "hard market, because higher profits build capital", "C": "soft market, because underwriting is looser"}, "ans": "B", "en": "L335: | 국면 | 보험료 | 수익성 | 인수기준 | capital adequacy |\nL337: | Hard Market | ↑ | ↑ | 엄격 | 쉬움(자본축적) |\nL338: | Soft Market | ↓ | ↓ | 느슨 | 어려움(자본소진) |", "enLabel": "오답노트 원문", "ko": "Hard market: premiums↑, profitability↑, strict underwriting, capital builds. Soft market: premiums↓, profitability↓, loose underwriting, capital drains.", "trap": "", "f": "", "why": {"A": "Soft markets bring losses and a shrinking capital base.", "C": "Looser underwriting increases losses and drains capital."}, "orig": "FSA 오답노트 L335 · 근거 SCH R10"}, {"id": "CON-M4-14", "src": "개념", "module": 4, "tag": "Insurer financial reporting", "vig": null, "stem": "US insurance companies prepare regulatory financial reports using:", "opts": {"A": "IFRS only", "B": "US GAAP only", "C": "statutory accounting rules, which differ from US GAAP and IFRS"}, "ans": "C", "en": "L352: 보험사 → IFRS, US GAAP 아닌 보험사 자체 회계기준 씀 Statutory Accounting Principles(SAP)", "enLabel": "오답노트 원문", "ko": "Insurers report to regulators under statutory accounting principles, which differ from IFRS and US GAAP.", "trap": "", "f": "", "why": {"B": "Regulatory reports follow statutory accounting, not US GAAP.", "A": "IFRS is not the US regulatory basis."}, "orig": "FSA 오답노트 L352 · 근거 ECO-M4-Q40"}, {"id": "CON-M4-15", "src": "개념", "module": 4, "tag": "Contribution of credit loss provisions to profit growth", "vig": null, "stem": "Earnings before tax rose from $100 to $150, while the provision for credit losses fell from $40 to $30. The proportion of the increase in earnings before tax that comes from the change in provisions is:", "opts": {"A": "6.7%", "B": "25%", "C": "20%"}, "ans": "C", "en": "L364: ex. proportion of the increase in the 2018 EBT that comes from the change in the provision for credit losses 계산법\nL366: 기여율 = ΔProvision ÷ ΔEBT (proportion of 2017년 대비 증가율)", "enLabel": "오답노트 원문", "ko": "Contribution = change in provision ÷ change in earnings before tax = 10 ÷ 50 = 20%.", "trap": "", "f": "", "why": {"A": "This divides by the new level of earnings (10 ÷ 150) instead of the change.", "B": "This divides by the old provision (10 ÷ 40)."}, "orig": "FSA 오답노트 L364 · 근거 ECO"}, {"id": "CON-M5-12", "src": "개념", "module": 5, "tag": "No impairment history", "vig": null, "stem": "If goodwill appears over-allocated at acquisition and the company has never recorded an impairment, this:", "opts": {"A": "shows the goodwill was valued correctly", "B": "means amortization expense was overstated", "C": "adds support that the overstatement has not been corrected and earnings remain overstated"}, "ans": "C", "en": "L376: > 🔑 Amortizable Intangibles = 매년 상각(비용화) / Goodwill = 상각 안 함, 손상검사만 / 🔑 \"impairment 한 번도 없었다\" = 과대배분된 Goodwill이 아직 어떤 경로로도 상쇄·조정되지 않았다는 추가 확증 / 상각비 과소 + 손상차손 부재 → 두 경로 모두 이익 과대계상 방향, 상쇄 없이 그대로 누적", "enLabel": "오답노트 원문", "ko": "Amortizable intangibles are expensed yearly; goodwill is only tested for impairment. No impairment ever = over-allocated goodwill has not been offset; low amortization + no impairment both keep earnings overstated.", "trap": "", "f": "", "why": {"A": "No impairment does not prove correct valuation; the excess may simply remain.", "B": "Over-allocating to goodwill understates, not overstates, amortization."}, "orig": "FSA 오답노트 L376 · 근거 SCH R11"}, {"id": "CON-M6-03", "src": "개념", "module": 6, "tag": "Core earnings", "vig": null, "stem": "Core earnings are calculated by adjusting reported earnings for:", "opts": {"A": "all items in other comprehensive income", "B": "non-recurring (one-off) items only", "C": "all non-cash items"}, "ans": "B", "en": "L409: Core earnings = 보고 이익에서 일회성(non-recurring) 항목만 조정\nL411: one-off는 제외", "enLabel": "오답노트 원문", "ko": "Core earnings = reported earnings adjusted only for non-recurring items; one-offs are excluded.", "trap": "", "f": "", "why": {"C": "Core earnings remove one-off items, not all non-cash items.", "A": "Other comprehensive income is not part of the core earnings adjustment."}, "orig": "FSA 오답노트 L409 · 근거 ECO"}], "vignettes": [], "modules": {"1": "Intercorporate Investments", "2": "Employee Compensation", "3": "Multinational Operations", "4": "Analysis of Financial Institutions", "5": "Quality of Financial Reports", "6": "Integration of FSA Techniques"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "FSAConcept", KEY = "FSAConcept_quiz_state_v1", EXPKEY = "FSAConcept_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return "Module "+m+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function shuffled(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+')</option>'+Object.keys(MN).filter(function(m){return counts[m];}).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">FSA 개념 확인</h2>'+
   '<p class="muted">FSA 오답노트의 개념을 한 문제에 하나씩 짧게 묻는 3지선다입니다('+Q.length+'문제). 보기를 보기 전에 답을 먼저 떠올려 보세요. 정답·오답을 확인하면 해당 오답노트 원문 줄이 바로 나옵니다. 문제 순서는 매번 섞입니다. 정답은 Schweser와 ECO 원문 해설로 확인했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">섞어서 풀기</button> <button class="btn" id="bWeak">지난번 틀린 것만</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function inRange(q){ var m=$("selMod").value; return m==="all"||String(q.module)===m; }
  function weak(q){ var a=S&&S.all&&S.all[q.id]; return a && a.lastCorrect===false; }
  function labels(){
    var n=Q.filter(inRange), w=n.filter(weak).length;
    $("bStart").textContent="섞어서 풀기 ("+n.length+")"; $("bWeak").textContent="지난번 틀린 것만 ("+w+")"; $("bWeak").disabled=!w;
  }
  function start(onlyWeak){
    var order=shuffled(Q.filter(function(q){ return inRange(q) && (!onlyWeak || weak(q)); }).map(function(q){return q.id;}));
    if(!order.length){ alert("이 범위에 풀 문제가 없습니다."); return; }
    S=fresh(order,onlyWeak?"review":"all"); save(); render();
  }
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){ start(false); };
  $("bWeak").onclick=function(){ start(true); };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = q.en ? '<details class="en" open><summary>'+esc(q.enLabel||'English explanation (원문 해설)')+'</summary><div class="enbody">'+rich(q.en)+'</div></details>' : '';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4>'+rich(q.ko)+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4>'+rich(q.ko)+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- history export ---------- */
// 이 브라우저에 쌓인 문제별 풀이 기록(첫 풀이 포함)과 지금까지 내보낸 결과를 한 파일로 내려받는다.
function exportHistory(){
  var exps=store.get(EXPKEY)||{};
  if((!S||!S.all||!Object.keys(S.all).length) && !Object.keys(exps).length){ alert("이 브라우저에는 풀이 기록이 없습니다."); return; }
  var file={subject:SUBJECT, kind:"history", exportedAt:new Date().toISOString(), device:navigator.userAgent,
    all:(S&&S.all)||{}, exports:exps,
    state:S?{order:S.order, mode:S.mode, round:S.round, started:S.started, updatedAt:S.updatedAt||""}:null};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_history_"+today()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}

/* ---------- question list sidebar ---------- */
var SIDEKEY = SUBJECT + "_side_v1", SIDE = store.get(SIDEKEY) || {open: window.innerWidth >= 1000, closed: {}};
function sideSave(){ store.set(SIDEKEY, SIDE); }
function sideOpen(v){ SIDE.open = v; sideSave(); document.body.classList.toggle("side-open", v); if(v) renderSide(); }
function renderSide(){
  var el = $("side"); if(!el) return;
  document.body.classList.toggle("side-open", !!SIDE.open);
  var top = '<div class="sd-top"><span>문제 목록</span><button id="sdClose" title="닫기">✕</button></div>';
  if(!S || !S.order || !S.order.length){ el.innerHTML = top + '<p class="sd-empty">문제를 시작하면 여기에 번호가 나옵니다.</p>'; $("sdClose").onclick = function(){ sideOpen(false); }; return; }
  var groups = {}, keys = [];
  S.order.forEach(function(id, i){ var m = String(BYID[id].module); if(!groups[m]){ groups[m] = []; keys.push(m); } groups[m].push(i); });
  keys.sort(function(a, b){ return (+a) - (+b); });
  var cur = S.view === "quiz" ? S.idx : -1, html = top;
  keys.forEach(function(m){
    var list = groups[m], done = list.filter(function(i){ return S.round[S.order[i]]; }).length, closed = !!SIDE.closed[m];
    html += '<button class="sd-hdr' + (closed ? ' collapsed' : '') + '" data-m="' + esc(m) + '"><span class="sd-caret">▼</span><span class="sd-name">' + esc(mname(m)) + '</span><span class="sd-cnt' + (done === list.length ? ' done' : '') + '">' + done + '/' + list.length + '</span></button><div class="sd-grp' + (closed ? ' collapsed' : '') + '">';
    list.sort(function(a, b){ return a - b; }).forEach(function(i){
      var id = S.order[i], r = S.round[id];
      html += '<button class="sd-q' + (i === cur ? ' active' : '') + '" data-i="' + i + '"><span class="sd-dot' + (r ? (r.correct ? ' ok' : ' bad') : '') + '"></span><span class="sd-num">Q' + (i + 1) + '</span><span class="sd-tag">' + esc(BYID[id].tag) + '</span></button>';
    });
    html += '</div>';
  });
  el.innerHTML = html;
  $("sdClose").onclick = function(){ sideOpen(false); };
  Array.prototype.forEach.call(el.querySelectorAll(".sd-hdr"), function(b){ b.onclick = function(){ var m = b.getAttribute("data-m"); SIDE.closed[m] = !SIDE.closed[m]; sideSave(); renderSide(); }; });
  Array.prototype.forEach.call(el.querySelectorAll(".sd-q"), function(b){ b.onclick = function(){ S.idx = +b.getAttribute("data-i"); S.view = "quiz"; save(); quiz(); window.scrollTo(0, 0); if(window.innerWidth < 1000) sideOpen(false); }; });
  var a = el.querySelector(".sd-q.active"); if(a && a.scrollIntoView) a.scrollIntoView({block: "center"});
}
var _header = header; header = function(){ _header(); renderSide(); };
$("bSide").onclick = function(){ sideOpen(!SIDE.open); };
$("sideBack").onclick = function(){ sideOpen(false); };
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
$("bHistory").onclick=exportHistory;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>
</html>

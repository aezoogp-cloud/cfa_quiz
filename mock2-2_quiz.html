<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mock 2 Session 2 Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.btn.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.btn.conf{padding:3px 10px;font-size:13px}
.btn.conf.on{background:var(--amber-soft);border-color:#E3A33A;color:var(--amber);font-weight:600}
.whyl{display:block;margin-top:6px;font-size:13.5px;color:var(--bad)}
img.exh{max-width:100%;height:auto;background:#fff}
/* 지문 왼쪽 · 문제/해설 오른쪽 (cmock처럼) */
body.wide .wrap{max-width:1440px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
.split .card{margin-top:0}
.vpane{position:sticky;top:104px;max-height:calc(100vh - 116px);overflow:auto;background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:12px;padding:12px 18px 16px;font-size:14.5px}
.vpane .vhead{font-weight:600;font-size:13px;color:var(--ink2);margin-bottom:4px}
.vpane p{margin:.5em 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.vpane{position:static;max-height:42vh}}
</style>
</head>

<script id="quizdata" type="application/json">{"meta": {"subject": "mock2-2", "title": "Mock 2 Session 2"}, "questions": [{"id": "mock2-2-Q1", "src": "정답", "module": "QM", "tag": "Durbin–Watson 검정", "vig": 0, "stem": "Based on the Durbin–Watson test, the errors in the economic variable's trend model are:", "opts": {"A": "negatively serially correlated.", "B": "not serially correlated.", "C": "positively serially correlated."}, "ans": "C", "en": "A. negatively serially correlated. — Incorrect\nIncorrect because the Durbin–Watson statistic has a value of 0.54, which is lower than the lower critical value of dl = 1.246. Therefore, we can reject the null hypothesis that correlation is <= 0 and conclude that correlation > 0.\nB. not serially correlated. — Incorrect\nIncorrect because the Durbin–Watson statistic has a value of 0.54, which is lower than the lower critical value of dl = 1.246. Therefore, we can reject the null hypothesis that correlation is <= 0 and conclude that correlation > 0.\nC. positively serially correlated. — Correct\nCorrect because the Durbin–Watson statistic has a value of 0.54, which is lower than the lower critical value of dl = 1.246. Therefore, we can reject the null hypothesis that correlation is <= 0 and conclude that correlation > 0.", "ko": "DW 통계량 0.54가 하한 임계값 dl = 1.25보다 작다. DW < dl이면 '상관 ≤ 0'이라는 귀무가설을 기각하고 오차가 양(+)의 자기상관을 가진다고 결론 낸다. (DW ≈ 2이면 자기상관 없음, 0에 가까우면 양의 자기상관, 4에 가까우면 음의 자기상관.)", "trap": "DW가 작다 = 양의 자기상관. 음의 자기상관은 DW가 4에 가까울 때.", "f": "DW ≈ 2(1 − r), DW < dl → 양의 자기상관", "why": {"A": "음의 자기상관은 DW가 4 − dl보다 클 때입니다. 0.54는 양의 자기상관입니다.", "B": "DW가 dl보다 작아 '자기상관 없음'을 기각합니다."}, "orig": "Mock 2 Session 2 Q1", "conf": false}, {"id": "mock2-2-Q2", "src": "정답", "module": "QM", "tag": "AR(1) 평균회귀 수준", "vig": 0, "stem": "The 1-period-ahead forecast of Garnet's EPS is:", "opts": {"A": "below its mean-reverting level.", "B": "equal to its mean-reverting level.", "C": "above its mean-reverting level."}, "ans": "C", "en": "A. below its mean-reverting level. — Incorrect\nIncorrect because the mean-reverting level is incorrectly calculated as:\nxt = b0/b1\nwhere b0 and b1 are the parameter estimates from an AR(1) model specified as\nxt+1 = b0 + b1xt\nTaking the parameter estimates from the exhibit:\nb0 = 0.4485\nb1 = 0.4541\nThe incorrect mean-reverting level xt = 0.4485/0.4541 = 0.9877\nThe current value of 0.96 < the incorrect mean-reverting level of 0.9877.\nB. equal to its mean-reverting level. — Incorrect\nIncorrect because the mean-reverting level is incorrectly assumed to be the most recent value of 0.96, in which case the current value of 0.96 = the incorrect mean-reverting level of 0.96.\nC. above its mean-reverting level. — Correct\nCorrect because the mean-reverting level xt is given by:\nxt = b0/(1 – b1)\nwhere b0 and b1 are the parameter estimates from an AR(1) model specified as\nxt+1 = b0 + b1xt\nTaking the parameter estimates from the exhibit:\nb0 = 0.4485\nb1 = 0.4541\nThe mean-reverting level xt = 0.4485/(1 – 0.4541) = 0.8216\nThe AR(1) model predicts that the time series will stay the same if its current value is b0/(1 − b1), increase if its current value is below b0/(1 − b1), and decrease if its current value is above b0/(1 − b1).\nThe current value of 0.96 > the mean-reverting level of 0.8216, so we can expect the 1-period-ahead forecast to be above its mean-reverting level.\nNote that it is not necessary to calculate the 1-period-ahead forecast of 0.4485 + 0.4541 × 0.96 = 0.8844 to arrive at this conclusion.", "ko": "AR(1): x(t+1) = 0.4485 + 0.4541 x(t). 평균회귀 수준 = b0 / (1 − b1) = 0.4485 / (1 − 0.4541) = 0.8216. 현재 EPS 0.96은 이보다 높으므로 다음 기 예측은 평균 쪽으로 내려오지만 아직 평균보다는 위에 있다. 실제 예측값 = 0.4485 + 0.4541 × 0.96 = 0.8844 > 0.8216.", "trap": "평균회귀 수준은 b0/(1 − b1)이지 b0/b1이 아니다. 예측은 평균으로 다가가지만 넘어가지 않는다.", "f": "Mean-reverting level = b0 / (1 − b1)", "why": {"A": "평균회귀 수준을 b0/b1 = 0.9877로 잘못 계산했습니다.", "B": "최근 값 0.96을 평균회귀 수준으로 착각했습니다."}, "orig": "Mock 2 Session 2 Q2", "conf": true}, {"id": "mock2-2-Q3", "src": "정답", "module": "QM", "tag": "데이터 정제: non-uniformity error", "vig": 0, "stem": "Which variable in the excerpt of the machine-learning dataset has a non-uniformity error?", "opts": {"A": "Price", "B": "Type", "C": "Convertible"}, "ans": "C", "en": "A. Price — Incorrect\nIncorrect because, although the price data in the exhibit do not have the same values for each observation, they are all presented in the same format.\nNon-uniformity error is where the data are not present in an identical format.\nB. Type — Incorrect\nIncorrect because type has an inaccuracy error, not a non-uniformity error. One of the observations is marked \"trade\" and is not labeled as a \"buy\" or a \"sell.\"\nNon-uniformity error is where the data are not present in an identical format.\nInaccuracy error is where the data are not a measure of true value. This can be rectified with the help of business records and administrators.\nC. Convertible — Correct\nCorrect because non-uniformity error is where the data are not present in an identical format. The convertible data in the exhibit are presented as \"Yes\" and \"y\" as well as \"N,\" \"no,\" and \"No.\" This error would be resolved by converting the data to a standard format.", "ko": "non-uniformity error는 같은 뜻의 데이터가 서로 다른 형식으로 적힌 것이다. Convertible 열에 'Yes', 'y', 'N', 'no', 'No'가 섞여 있어 형식이 통일되지 않았다. Type 열의 'Trade'는 buy/sell이 아닌 잘못된 값이라 inaccuracy error다. Price는 값이 달라도 형식은 같다.", "trap": "형식이 제각각 = non-uniformity, 값 자체가 틀림 = inaccuracy.", "f": "", "why": {"A": "Price는 값만 다르고 형식은 모두 같습니다.", "B": "Type의 'Trade'는 형식 문제가 아니라 틀린 값(inaccuracy error)입니다."}, "orig": "Mock 2 Session 2 Q3", "conf": false}, {"id": "mock2-2-Q4", "src": "정답", "module": "QM", "tag": "confusion matrix: accuracy", "vig": 0, "stem": "The confusion matrix indicates that model accuracy is closest to:", "opts": {"A": "0.64.", "B": "0.70.", "C": "0.78."}, "ans": "B", "en": "A. 0.64. — Incorrect\nIncorrect because this is model precision, not accuracy. Precision is the ratio of correctly predicted positive classes to all predicted positive classes.\nPrecision (P) = TP/(TP + FP)\nFor classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.\nFrom the case:\nTP = 70\nFP = 40\nPrecision = 70/(70 + 40) = 70/110 = 0.6364 ≈ 0.64\nB. 0.70. — Correct\nCorrect because accuracy is the percentage of correctly predicted classes out of total predictions.\nAccuracy = (TP + TN)/(TP + FP + TN + FN)\nFor classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.\nFrom the case:\nTP = 70\nTN = 70\nFP = 40\nFN = 20\nAccuracy = (70 + 70)/(70 + 40 + 70 + 20) = 140/200 = 0.70\nC. 0.78. — Incorrect\nIncorrect because this is model recall, not accuracy. Recall (also known as sensitivity) is the ratio of correctly predicted positive classes to all actual positive classes.\nRecall (R) = TP/(TP + FN)\nFor classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.\nFrom the case:\nTP = 70\nFN = 20\nRecall = 70/(70 + 20) = 70/90 = 0.7778 ≈ 0.78", "ko": "TP = 70(예측 buy·실제 buy), FP = 40(예측 buy·실제 sell), FN = 20(예측 sell·실제 buy), TN = 70. Accuracy = (TP + TN) / 전체 = (70 + 70) / 200 = 0.70.", "trap": "precision(0.64), recall(0.78)과 헷갈리지 않는다.", "f": "Accuracy = (TP + TN)/(TP + FP + TN + FN), Precision = TP/(TP + FP), Recall = TP/(TP + FN)", "why": {"A": "precision = 70/110입니다.", "C": "recall = 70/90입니다."}, "orig": "Mock 2 Session 2 Q4", "conf": false}, {"id": "mock2-2-Q5", "src": "정답", "module": "FI", "tag": "이항트리로 callable bond 가치", "vig": 1, "stem": "Based on the binomial interest rate tree, the value of Bond 2 is closest to:", "opts": {"A": "$98.66.", "B": "$102.56.", "C": "$103.16."}, "ans": "B", "en": "A. $98.66. — Incorrect\nIncorrect because this is the value of a 4.20% annual-coupon, 2-year bond non-callable bond where the coupon payment at the end of year 1 is omitted, i.e., the value at the end of year 1 is not changed to the call price.\nEnd of Year 0\tEnd of Year 1\tEnd of Year 2\n\tt1,H = 4.96%\tCF = 104.20\nValue = 98.655\tValue = 99.276\t\n\tCF = 0.00\tCF = 104.20\nt0 = 1.25%\tt1,L = 3.68%\t\n\tValue =100.502\tCF = 104.20\nwhere: CF is the bond's cash flow at the end of the year.\nB. $102.56. — Correct\nCorrect because the value of the 2-year callable bond equals the present value of future cash flows where in any year if the price is greater than 100, the bond will be called.\nThe value at the end of year 1 at t1,H = 4.96% equals ((104.20 + 104.20)/2)/(1.0496) = 99.276, where 104.20 is the total cash flow at maturity (Par = 100 and coupon = 4.20).\nThe value at the end of year 1 at t1,L = 3.68% equals ((104.2 + 104.2)/2)/(1.0368) = 100.502. As this bond is callable at the end of year 1 at par, the value is set to 100.\nThe value at the end of year 0 equals:\n[((99.276 + 100)/2) + 4.20]/1.0125 = 102.56, where 1.0125% is 1 plus the spot rate at the end of year 0.\nEnd of Year 0\tEnd of Year 1\tEnd of Year 2\n\tt1,H = 4.96%\tCF = 104.20\nValue = 102.556\tValue = 99.276\t\n\tCF = 4.20\tCF = 104.20\nt0 = 1.25%\tt1,L = 3.68%\t\n\tValue = 100.502 100\tCF = 104.20\nwhere: CF is the bond's cash flow at the end of the year.\nC. $103.16. — Incorrect\nIncorrect because this is the value that would be derived if the bond was assumed to be putable rather than callable bond. In the case of a putable bond the price at the end of Year 1 at t1,H = 4.96% would be set equal to 100.\nEnd of Year 0\tEnd of Year 1\tEnd of Year 2\n\tt1,H = 4.96%\tCF = 104.20\nValue = 103.161\tValue = 99.276 100\t\n\tCF = 4.20\t\nt0 = 1.25%\tt1,L = 3.68%\tCF = 104.20\n\tValue = 100.502\t\n\t\tCF = 104.20\nwhere: CF is the bond's cash flow at the end of the year.", "ko": "Year 1 높은 금리 노드(4.96%): 104.20 / 1.0496 = 99.276 (100보다 작아 콜 안 함). 낮은 금리 노드(3.68%): 104.20 / 1.0368 = 100.502 → 콜 가격 100으로 자른다. Year 0: [(99.276 + 100)/2 + 4.20] / 1.0125 = (99.638 + 4.20) / 1.0125 = 102.56.", "trap": "콜 가능 노드에서 값을 콜 가격(100)으로 자르고, Year 1 쿠폰 4.20도 더한다.", "f": "노드 값 = [(V_up + V_down)/2 + 쿠폰] / (1 + r), callable은 노드 값 = min(값, 콜 가격)", "why": {"A": "Year 1 쿠폰을 빼먹고 콜 가격으로 자르지도 않았습니다.", "C": "putable로 보고 높은 금리 노드 값을 100으로 올렸습니다."}, "orig": "Mock 2 Session 2 Q5", "conf": false}, {"id": "mock2-2-Q6", "src": "정답", "module": "FI", "tag": "변동성 하락과 옵션부채권", "vig": 1, "stem": "The value of which bond will most likely decrease under Polti's Scenario 1?", "opts": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}, "ans": "C", "en": "A. Bond 1 — Incorrect\nIncorrect because Bond 1 is option-free and the value is unaffected by changes in the assumed level of interest rate volatility.\nB. Bond 2 — Incorrect\nIncorrect because Bond 2 is a callable bond and as such is short the call option therefore the value of Bond 2 will increase when the assumed level of interest rate volatility decreases.\nC. Bond 3 — Correct\nCorrect because a decrease in the assumed level of interest rate volatility will decrease the value of both the embedded put and call options. Because the value of a putable bond is equal to the value of the straight bond plus the value of the embedded put option, Bond 3 will decrease when volatility falls. Because the value of a callable bond is equal to the value of the straight bond minus the value of the embedded call option, the price of Bond 2 will increase when volatility falls. Bond 1 is option free and the price is unaffected by changes in the assumed level of interest rate volatility.", "ko": "변동성이 낮아지면 내재된 콜·풋 옵션 가치가 모두 줄어든다. putable = 일반채권 + 풋 → 풋 가치가 줄어 Bond 3 가치 하락. callable = 일반채권 − 콜 → 콜 가치가 줄어 Bond 2 가치 상승. option-free(Bond 1)는 변동성과 무관하다.", "trap": "변동성 ↓ → callable ↑, putable ↓.", "f": "V_callable = V_straight − V_call, V_putable = V_straight + V_put", "why": {"A": "옵션이 없는 채권은 변동성 가정에 영향을 받지 않습니다.", "B": "callable은 콜을 판 상태라 콜 가치가 줄면 오히려 가치가 오릅니다."}, "orig": "Mock 2 Session 2 Q6", "conf": false}, {"id": "mock2-2-Q7", "src": "정답", "module": "FI", "tag": "수익률곡선 평탄화와 내재 옵션", "vig": 1, "stem": "Under Polti's Scenario 2, the value of the embedded option would be expected to increase in which of the following bonds?", "opts": {"A": "Bond 2 only", "B": "Bond 3 only", "C": "Both Bond 2 and Bond 3"}, "ans": "A", "en": "A. Bond 2 only — Correct\nCorrect because Bond 2 is a callable bond and all else being equal, the value of the call option increases as the yield curve flattens. The intuition to explain the effect of the shape of the yield curve on the value of the call option is as follows. When the yield curve is upward sloping, the one-period forward rates on the interest rate tree are high and opportunities for the issuer to call the bond are fewer. When the yield curve flattens or inverts, many nodes on the tree have lower forward rates that increase the opportunities to call.\nB. Bond 3 only — Incorrect\nIncorrect because Bond 3 is a putable bond and all else being equal, the value of the put option decreases as the yield curve moves from being upward sloping, to flat, to downward sloping. When the yield curve is upward sloping, the one-period forward rates in the interest rate tree are high, which creates more opportunities for the investor to put the bond. As the yield curve flattens or inverts, the number of opportunities declines.\nC. Both Bond 2 and Bond 3 — Incorrect\nIncorrect because while the value of the embedded option in Bond 2, the callable bond, would be expected to increase, the value of the embedded option in Bond 3, the putable bond, would be expected to decrease.", "ko": "장기금리가 더 많이 떨어져 곡선이 평탄해지면 트리의 미래 선도금리가 낮아진다. 금리가 낮은 노드가 많아지면 발행자가 콜할 기회가 늘어 콜 옵션 가치가 오른다(Bond 2). 반대로 풋은 금리가 높을 때 행사하므로 기회가 줄어 풋 가치가 내려간다(Bond 3).", "trap": "곡선 평탄/역전 → 콜 가치 ↑, 풋 가치 ↓. 우상향 곡선 → 콜 ↓, 풋 ↑.", "f": "", "why": {"B": "평탄해지면 풋 행사 기회가 줄어 풋 가치는 떨어집니다.", "C": "콜 가치만 오르고 풋 가치는 떨어집니다."}, "orig": "Mock 2 Session 2 Q7", "conf": true}, {"id": "mock2-2-Q8", "src": "정답", "module": "FI", "tag": "전환사채 최저 가치", "vig": 1, "stem": "The minimum value of the ZXEL Corp. convertible bond is closest to:", "opts": {"A": "$990.", "B": "$1,000.", "C": "$1,081."}, "ans": "C", "en": "A. $990. — Incorrect\nIncorrect because this is the value of the underlying option-free bond which is lower than the conversion value of $1,081.\nB. $1,000. — Incorrect\nIncorrect because this is the conversion ratio multiplied by the initial conversion price = 23 × $43.47 = $1,000. (The initial conversion price is 1,000/23.) This is also the par value of the bond.\nC. $1,081. — Correct\nCorrect because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond.\nThe conversion value equals the underlying share price × conversion ratio = $47 × 23 = $1,081\nThe value of the underlying option-free bond is lower at $990. Thus, the minimum value of the convertible bond is $1,081.", "ko": "전환사채의 최저 가치 = max(전환가치, 일반채권 가치). 전환가치 = 주가 × 전환비율 = $47 × 23 = $1,081. 일반채권 가치 $990보다 크므로 최저 가치는 $1,081.", "trap": "액면(1,000)이나 일반채권 가치(990)가 아니라 둘 중 큰 것.", "f": "Minimum value = max(Conversion value, Straight bond value), Conversion value = S × CR", "why": {"A": "일반채권 가치이지만 전환가치 1,081보다 작습니다.", "B": "액면이자 최초 전환가격 × 전환비율이며 현재 가치와 관계없습니다."}, "orig": "Mock 2 Session 2 Q8", "conf": false}, {"id": "mock2-2-Q9", "src": "정답", "module": "ETH", "tag": "Standard I(A): 법 vs Code", "vig": 2, "stem": "In the event of a conflict of rules or regulations at work, Lee must adhere to the:", "opts": {"A": "Code and Standards.", "B": "securities laws and regulations of Caldecott's country.", "C": "securities laws and regulations of Lee's home country."}, "ans": "A", "en": "A. Code and Standards. — Correct\nCorrect because Standard I(A) Knowledge of the Law requires members to understand the applicable laws and regulations of the jurisdictions where they engage in. Since applicable law states that the law of the locality where the business is conducted governs and local law is less strict than the Code and Standards, the member must adhere to the Code and Standards.\nIf applicable law is stricter than the requirements of the Code and Standards, members and candidates must adhere to applicable law; otherwise, they must adhere to the Code and Standards.\nSince the law of locality where business is conducted governs AND it (Caldecott's country's law) is less strict than the Code and Standards, Lee has to abide by the Code and Standards.\nB. securities laws and regulations of Caldecott's country. — Incorrect\nIncorrect because the applicable law in Caldecott's country is less strict than the Code and Standards. Based on Standard I(A) Knowledge of the Law, Lee must therefore adhere to the Code and Standards.\nC. securities laws and regulations of Lee's home country. — Incorrect\nIncorrect because the applicable law states that the law of the locality where the business is conducted governs. Based on Standard I(A) Knowledge of the Law, since business is conducted in Caldecott's country, Lee must adhere to the Code and Standards, which are stricter than the laws of Caldecott's country.\nThis choice might be correct if Lee were conducting business with another resident of her home country. However, Caldecott's clients are based in Caldecott's country.", "ko": "두 나라 모두 '사업이 이뤄지는 곳의 법'을 따르도록 한다. Caldecott의 고객은 모두 Caldecott 나라에 있으므로 그 나라 법이 적용되는데, 이 법은 Code and Standards보다 느슨하다. 법이 더 느슨하면 더 엄격한 Code and Standards를 따른다. Lee가 사는 나라의 엄격한 법은 여기 적용되지 않는다.", "trap": "적용되는 법(사업 장소 = Caldecott 나라)을 먼저 정한 뒤, 그 법과 Code 중 더 엄격한 쪽.", "f": "", "why": {"B": "Caldecott 나라 법은 Code보다 느슨해 Code를 따라야 합니다.", "C": "사업이 Caldecott 나라에서 이뤄지므로 Lee의 거주국 법은 적용되지 않습니다."}, "orig": "Mock 2 Session 2 Q9", "conf": false}, {"id": "mock2-2-Q10", "src": "정답", "module": "ETH", "tag": "Standard V(B): 사실과 의견 구분", "vig": 2, "stem": "In the memo regarding the ESG screening process, does Lee violate the Standard relating to communication with clients and prospective clients?", "opts": {"A": "No", "B": "Yes, because Lee fails to appropriately separate fact from opinion", "C": "Yes, because Lee fails to sufficiently communicate the risks associated with the screening process"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because the memo fails to appropriately distinguish opinion from fact. Standard V(B) Communications with Clients and Prospective Clients requires that opinion be separated from fact.\nB. Yes, because Lee fails to appropriately separate fact from opinion — Correct\nCorrect because the memo states as a fact that the new process will guarantee superior returns. Standard V(B) Communications with Clients and Prospective Clients requires that opinion be separated from fact.\nThe statement will guarantee superior returns cannot be a fact for risky stock investments. Moreover, as highlighted in the risks section, alternative existing ESG selection processes contradict (that is, recommend keeping stocks that Caldecott's process recommends to sell). Lee should have expressed the statement as an opinion, such as by including we believe this will boost returns.\nC. Yes, because Lee fails to sufficiently communicate the risks associated with the screening process — Incorrect\nIncorrect because the memo communicates significant risks including the key risk that the recommendations are subjective and may be contradicted by other ESG screens. According to Standard V(B) Communications with Clients and Prospective Clients, members and candidates must outline to clients and prospective clients significant risks and limitations of the analysis contained in their investment products or recommendations. The memo discusses significant risks of the new process and is therefore compliant with Standard V(B).", "ko": "Lee의 메모는 ESG 절차의 주관성과 다른 ESG 방법과 결론이 다를 수 있다는 위험을 밝혔으므로 위험 공시는 충분하다. 하지만 '이 절차가 우수한 수익을 보장한다(guarantee superior returns)'고 사실처럼 썼다. 주식 투자에서 수익 보장은 사실일 수 없으므로 의견으로 표현해야 했다('we believe…'). 사실과 의견을 구분하지 않아 V(B) 위반.", "trap": "위험은 잘 적었다. 문제는 '보장한다'는 표현.", "f": "", "why": {"A": "수익 보장을 사실처럼 적어 사실과 의견을 구분하지 못했습니다.", "C": "메모는 주관성 등 중요한 위험을 충분히 밝혔습니다."}, "orig": "Mock 2 Session 2 Q10", "conf": false}, {"id": "mock2-2-Q11", "src": "정답", "module": "ETH", "tag": "Standard V(C): 기록 보관", "vig": 2, "stem": "Lee violates the Standard relating to record retention with respect to the:", "opts": {"A": "sell trades.", "B": "buy trades.", "C": "trade record retention period."}, "ans": "A", "en": "A. sell trades. — Correct\nCorrect because Lee did not keep records for the executed sell trades. Standard V(C) Record Retention requires members to retain their own records to support their investment decisions. The automatically generated sell recommendations from Caldecott's software are insufficient to explain why trades were executed.\nLee needs to retain her own documentation that supports her decision for sell trades in the selected accounts.\nMembers and candidates must, however, archive research notes and other documents, either electronically or in hard copy, that support their current investment-related communications. Doing so will assist their firms in complying with requirements for preservation of internal or external records.\nB. buy trades. — Incorrect\nIncorrect because Standard V(C) Record Retention only requires Lee to maintain appropriate records to support her investment actions. Lee prepares notes justifying the buy trades executed in the client accounts. Her notes are likely sufficient to explain the decisions to increase each stock's weight in the client accounts.\nC. trade record retention period. — Incorrect\nIncorrect because this is a CFA Institute recommendation only in the absence of regulatory guidance or firm policies. It is not a must do for Lee to impose this requirement on her employer.\nAs per the guidance to Standard V(C) Record Retention, in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years.", "ko": "Lee는 소프트웨어가 자동으로 낸 매도 추천이라는 이유로 매도 거래 기록을 남기지 않았다. V(C)는 투자 결정을 뒷받침하는 자신의 기록을 보관하라고 요구하고, 자동 추천만으로는 왜 매매했는지 설명되지 않는다 → 매도 거래가 위반. 매수 거래는 근거 노트를 남겼으므로 OK. 7년 보관은 규제·회사 정책이 없을 때의 권장일 뿐이고, 여기는 5년 규제 기준이 있다.", "trap": "자동화된 추천도 기록을 남겨야 한다. 7년은 권장 사항.", "f": "", "why": {"B": "매수 거래는 근거 노트를 작성해 보관했습니다.", "C": "7년은 규제나 회사 정책이 없을 때의 권장이라 의무가 아닙니다."}, "orig": "Mock 2 Session 2 Q11", "conf": false}, {"id": "mock2-2-Q12", "src": "정답", "module": "ETH", "tag": "Standard VI(A): 이해상충 공시", "vig": 2, "stem": "With respect to the university, does Lee violate the Standard relating to disclosure of conflicts?", "opts": {"A": "No", "B": "Yes, by failing to disclose the retirement plan investment", "C": "Yes, by failing to disclose her position on the board of trustees"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Standard VI(A) Disclosure of Conflicts requires Lee to disclose to her employer her involvement with the university's board of trustees. Lee's new role as a trustee can reasonably be expected to be time consuming, to the possible detriment of Lee's responsibilities at Caldecott, at least in the first year.\nB. Yes, by failing to disclose the retirement plan investment — Incorrect\nIncorrect because the application of Standard VI(A) Disclosure of Conflicts would not require Lee to disclose her personal or retirement investments in large diversified mutual funds, unless specifically required by her employer.\nC. Yes, by failing to disclose her position on the board of trustees — Correct\nCorrect because, by failing to inform Caldecott of her involvement with the university board of trustees, Lee has violated Standard VI(A) Disclosure of Conflicts. Members and Candidates must avoid or make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Lee's new role as a trustee can reasonably be expected to be time consuming, and possibly interfere with or affect Lee's responsibilities at Caldecott.", "ko": "Lee는 무보수지만 첫해 시간이 많이 드는 대학 이사회 자리를 Caldecott에 알리지 않았다. 고용주에 대한 의무를 방해할 수 있는 일이라 공시해야 하므로 VI(A) 위반. 은퇴연금을 경쟁사의 대형 분산 뮤추얼펀드에 넣은 것은 회사가 특별히 요구하지 않는 한 공시할 필요가 없다.", "trap": "무보수라도 시간이 많이 드는 외부 직위는 공시. 대형 분산 펀드 투자는 공시 불필요.", "f": "", "why": {"A": "시간이 많이 드는 이사회 자리를 알리지 않아 위반입니다.", "B": "대형 분산 뮤추얼펀드에 대한 개인·은퇴 투자는 공시 대상이 아닙니다."}, "orig": "Mock 2 Session 2 Q12", "conf": true}, {"id": "mock2-2-Q13", "src": "정답", "module": "CI", "tag": "Grinold-Kroner ERP", "vig": 3, "stem": "Using the Grinold-Kroner model, the estimated ERP is:", "opts": {"A": "2.5%.", "B": "2.9%.", "C": "5.9%."}, "ans": "B", "en": "A. 2.5%. — Incorrect\nIncorrect because the change in shares outstanding was added rather than subtracted, consequently:\nERP = [DY + Δ(P/E) + i + g + ΔS] – E(rf) = [1.8% + 0.0% + 1.3% + 2.6% + (–0.2%)] – 3.0% = 2.5%\nB. 2.9%. — Correct\nCorrect because the ERP is calculated as ERP = [DY + Δ(P/E) + i + g – ΔS] – E(rf),\nwhere:\nDY = expected income component (dividend yield)\nΔ(P/E) = expected growth rate in P/E ratio\ni = expected inflation\ng = expected growth rate in real earnings per share (proxy for GDP growth)\nΔS = expected percentage change in shares outstanding\nE(rf) = risk free rate\n= [1.8% + 0.0% + 1.3% + 2.6% –(–0.2%)] – 3.0% = 2.9%\nC. 5.9%. — Incorrect\nIncorrect because the risk-free rate was incorrectly omitted from the calculation, consequently:\nERP = [DY + Δ(P/E) + i + g – ΔS] - E(rf) = [1.8% + 0.0% + 1.3% + 2.6% – (–0.2%)] = 5.9%", "ko": "기대 주식수익률 = 배당수익률 + P/E 변화율 + 인플레이션 + 실질 이익성장 − 주식수 변화율 = 1.8 + 0.0 + 1.3 + 2.6 − (−0.2) = 5.9%. ERP = 5.9 − 무위험이자율 3.0 = 2.9%.", "trap": "주식수 변화는 빼야 한다(−(−0.2) = +0.2). 마지막에 rf도 뺀다.", "f": "ERP = [DY + Δ(P/E) + i + g − ΔS] − rf", "why": {"A": "주식수 변화(−0.2%)를 빼지 않고 더했습니다.", "C": "무위험이자율을 빼지 않아 기대 주식수익률을 답했습니다."}, "orig": "Mock 2 Session 2 Q13", "conf": false}, {"id": "mock2-2-Q14", "src": "정답", "module": "CI", "tag": "matrix pricing: 보간", "vig": 3, "stem": "Using matrix pricing, the estimate for GameDay's current cost of debt is closest to:", "opts": {"A": "5.86%.", "B": "5.95%.", "C": "6.14%."}, "ans": "B", "en": "A. 5.86%. — Incorrect\nIncorrect because this is simply the average of the 2-year YTM (5.57%) and 5-year (6.14%) that Gunning has observed, i.e. (5.57% + 6.14%) / 2 = 5.855% ≈ 5.86%.\nB. 5.95%. — Correct\nCorrect because matrix pricing has been correctly applied. Gunning has observed the average YTM on BBB-rated bonds for the 2-year maturity to be 5.57% and the 5-year maturity to be 6.14%. There is a difference in YTM of 0.57% (6.14% – 5.57%). Using interpolation this is applied at a rate of 0.19% per year (0.57% / 3 years). Since Gunning has the 2-year YTM and requires the 4-year YTM, this is 2-year YTM + 2-years of adjustment = 5.57% + 2 × 0.19% = 5.95%.\nC. 6.14%. — Incorrect\nIncorrect because this is simply the 5-year YTM, the closest maturity to GameDay's 4-year bond to which Gunning has available information.", "ko": "2년 5.57%, 5년 6.14%. 3년 차이에 0.57% 차이이므로 1년당 0.19%. 4년물은 2년에서 2년 더 → 5.57% + 2 × 0.19% = 5.95%.", "trap": "단순 평균(5.86%)이 아니라 만기 거리에 비례해 보간한다.", "f": "y(4) = y(2) + (4 − 2)/(5 − 2) × [y(5) − y(2)]", "why": {"A": "2년·5년 수익률을 단순 평균했습니다.", "C": "가장 가까운 5년 수익률을 그대로 썼습니다."}, "orig": "Mock 2 Session 2 Q14", "conf": false}, {"id": "mock2-2-Q15", "src": "정답", "module": "CI", "tag": "comparable transactions 가중 평가", "vig": 3, "stem": "Based on the comparable transactions method used by Gunning, the StopGap acquisition was:", "opts": {"A": "underpriced.", "B": "fairly priced.", "C": "overpriced."}, "ans": "B", "en": "A. underpriced. — Incorrect\nIncorrect because the acquisition price of $33.80 was within $1 of the price per share calculated using the comparable transactions method.\nB. fairly priced. — Correct\nCorrect because the acquisition price of $33.80 was within $1 of the price per share calculated using the comparable transactions method as shown below.:\n\tAcquired Co.\tMean Multiple Paid for Comparable Transactions\tEstimate Value Based on Comparables\tWeight\tWeighted Estimates\nEarnings per share\t$2.20\t16.2\t$35.64\t25%\t$8.91\nBook value per share\t$8.40\t2.9\t$24.36\t25%\t$6.09\nSales per share\t$17.90\t2.1\t$37.59\t50%\t$18.795\n\t\tWeighted Average Estimate\t\t\t$33.795 (rounded to $33.80)\nC. overpriced. — Incorrect\nIncorrect because the acquisition price of $33.80 was within $1 of the price per share calculated using the comparable transactions method.", "ko": "P/E: 2.20 × 16.2 = 35.64 (가중치 25% → 8.91). P/B: 8.40 × 2.9 = 24.36 (25% → 6.09). P/S: 17.90 × 2.1 = 37.59 (50% → 18.795). 합계 = $33.795 ≈ $33.80. 인수가 $33.80은 추정치에서 $1 이내 → 적정 가격.", "trap": "P/S에 50%, 나머지 둘에 25%씩. 단순 평균하지 않는다.", "f": "가중 추정가 = Σ (배수 × 대상회사 지표 × 가중치)", "why": {"A": "인수가가 추정치와 $1 이내라 저평가가 아닙니다.", "C": "인수가가 추정치와 $1 이내라 고평가가 아닙니다."}, "orig": "Mock 2 Session 2 Q15", "conf": false}, {"id": "mock2-2-Q16", "src": "정답", "module": "CI", "tag": "spinoff vs divestiture", "vig": 3, "stem": "Compared to accepting the divestment offer, GameDay should choose to spinoff the Southern segment to:", "opts": {"A": "obtain a higher valuation.", "B": "receive more in proceeds.", "C": "ensure the valuation is definitive."}, "ans": "A", "en": "A. obtain a higher valuation. — Correct\nCorrect because Gunning believes that the spinoff will achieve a value of $1.96 billion (14 × $140 million), which is higher than the offer of $1.6 billion received from the rival firm.\nB. receive more in proceeds. — Incorrect\nIncorrect because in a spin off, the investor receives the divested business's equity and must value it and make an investment decision; the parent receives less in proceeds.\nC. ensure the valuation is definitive. — Incorrect\nIncorrect because the acquisition values Southern at $1.6 billion as opposed to the $1.96 billion (14 × $140 million) that Gunning believes the spinoff will achieve. An advantage of a sale is that the valuation is definitive and is not at risk if there is a capital market correction.", "ko": "spinoff 예상 가치 = 14 × $140m = $1.96bn으로 매각 제안 $1.6bn보다 높다 → 더 높은 가치평가. 하지만 spinoff는 주주가 새 회사 주식을 받는 것이라 모회사가 현금을 받지 않고, 시장 상황에 따라 가치가 바뀐다. 현금 수입과 확정된 가치는 매각의 장점이다.", "trap": "spinoff는 현금 수입이 없다. '확정된 가치'는 매각의 장점.", "f": "Spinoff value = EV/EBITDA × EBITDA", "why": {"B": "spinoff는 주주에게 주식을 나눠주는 것이라 모회사가 받는 현금은 오히려 적습니다.", "C": "가치가 확정되는 것은 매각(sale)의 장점입니다."}, "orig": "Mock 2 Session 2 Q16", "conf": false}, {"id": "mock2-2-Q17", "src": "정답", "module": "FI", "tag": "swap rate vs Treasury rate", "vig": 4, "stem": "Which of Russo's comments are correct regarding differences between Treasury rates and swap rates?", "opts": {"A": "Comment 1 only", "B": "Comment 2 only", "C": "Both Comment 1 and Comment 2"}, "ans": "A", "en": "A. Comment 1 only — Correct\nCorrect because the key difference between the swap rate and the government bond rate is that the swap rate is derived using short-term lending rates rather than default-risk-free rates.\nB. Comment 2 only — Incorrect\nIncorrect because arbitrage between Treasury bonds and swaps cannot be perfectly executed and does not represent the difference in rates. The Treasury rate can differ from the swap rate for the same term for several reasons. Unlike the cash flows from US Treasury bonds, the cash flows from swaps are subject to greater default risk. Market liquidity for specific maturities may differ. For example, some parts of the term structure of interest rates may be more actively traded with swaps than with Treasury bonds.\nC. Both Comment 1 and Comment 2 — Incorrect\nIncorrect because only Comment 1 is a valid statement.", "ko": "스왑금리는 무위험 금리가 아니라 단기 대출 금리(은행 신용위험 포함)를 바탕으로 만들어진다. 그래서 같은 만기여도 국채금리와 차이가 나며, 원인은 신용(default) 위험과 유동성 차이다 → Comment 1 맞음. 국채와 스왑 사이 차익거래는 완벽하게 할 수 없어 차이가 작다고 할 수 없다 → Comment 2 틀림.", "trap": "스왑-국채 차이는 차익거래로 없어지지 않는다.", "f": "", "why": {"B": "차익거래가 완벽하지 않아 차이가 작다는 말은 틀렸습니다.", "C": "Comment 2는 틀렸습니다."}, "orig": "Mock 2 Session 2 Q17", "conf": false}, {"id": "mock2-2-Q18", "src": "오답", "module": "FI", "tag": "spot rate로 선도금리 f(1,1)", "vig": 4, "stem": "The forward rate for a 1-year zero-coupon government bond issued one year from today is closest to:", "opts": {"A": "3.32%.", "B": "3.43%.", "C": "3.55%."}, "ans": "A", "en": "A. 3.32%. — Correct\nCorrect because using the Treasury spot rates provided in the Exhibit and the forward rate model, the forward rate for a one-year zero issued one year from today would be:\n(1 + z2)^2= (1 + z1)^1(1 + f1,1)^1\n(1 + 0.0310)^2= (1 + 0.0288)^1(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0310)^2/(1 + 0.0288)^1 – 1\n(1 + f1,1)^1= 1.0629/1.0288 – 1\n(1 + f1,1)^1= 0.0332.\nB. 3.43%. — Incorrect\nIncorrect because this response calculates the one-year forward rate in two years (rather than in one year). Using the forward rate model with these incorrect assumptions, the forward rate would be:\n(1 + z3)^3= (1 + z2)^2(1 + f1,1)^1\n(1 + 0.0321)^3= (1 + 0.0310)^2(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0321)^3/(1 + 0.0310)^2 – 1\n(1 + f1,1)^1= 1.099424/1.062961 – 1\n(1 + f1,1)^1= 0.034304.\nC. 3.55%. — Incorrect\nIncorrect because this response uses the swap rates instead of spot rates:\n(1 + z2)^2= (1 + z1)^1(1 + f1,1)^1\n(1 + 0.0326)^2= (1 + 0.0297)^1(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0326)^2 /(1 + 0.0297)^1 – 1\n(1 + f1,1)^1= 1.0663/1.0297 – 1\n(1 + f1,1)^1= 0.0355.", "ko": "국채 spot rate를 쓴다. (1 + z2)² = (1 + z1)(1 + f1,1) → 1 + f = 1.0310² / 1.0288 = 1.06296 / 1.0288 = 1.0332 → f(1,1) = 3.32%.", "trap": "스왑금리가 아니라 국채 spot rate. 1년 뒤 시작하는 1년물은 z1과 z2로 구한다.", "f": "(1 + z2)² = (1 + z1)(1 + f1,1)", "why": {"B": "z2와 z3으로 계산한 2년 뒤 시작하는 1년 선도금리(f2,1)입니다.", "C": "국채 spot rate 대신 스왑금리를 썼습니다."}, "orig": "Mock 2 Session 2 Q18", "conf": false}, {"id": "mock2-2-Q19", "src": "정답", "module": "FI", "tag": "segmented markets theory", "vig": 4, "stem": "The term structure theory that Russo accepts is best described as the:", "opts": {"A": "local expectations theory.", "B": "liquidity preference theory.", "C": "segmented markets theory."}, "ans": "C", "en": "A. local expectations theory. — Incorrect\nIncorrect because the local expectations theory contends that the expected return for every bond over short periods is the risk-free rate. This results from an assumed no-arbitrage condition in which bond pricing does not allow for traders to earn arbitrage profits.\nB. liquidity preference theory. — Incorrect\nIncorrect because liquidity preference theory asserts that liquidity premiums exist to compensate investors for the added interest rate risk they face when lending long term and that these premiums increase with maturity. It is not a term structure theory.\nC. segmented markets theory. — Correct\nCorrect because the segmented markets theory allows for lender and borrower preferences to influence the shape of the yield curve. The result is that yields are not a reflection of expected spot rates or liquidity premiums. Rather, they are solely a function of the supply and demand for funds of a particular maturity. That is, each maturity sector can be thought of as a segmented market in which yield is determined independently from the yields that prevail in other maturity segments.", "ko": "'수익률은 오직 각 만기의 자금 수요와 공급으로 정해진다'는 것이 segmented markets theory다. 만기별 시장이 따로 나뉘어 다른 만기의 수익률과 독립적으로 정해진다고 본다. local expectations는 짧은 기간 모든 채권의 기대수익률이 무위험이자율이라는 이론, liquidity preference는 장기일수록 유동성 프리미엄이 붙는다는 이론이다.", "trap": "'solely supply and demand at a particular maturity' = segmented markets.", "f": "", "why": {"A": "local expectations는 짧은 기간 기대수익률이 무위험이자율이라는 이론입니다.", "B": "liquidity preference는 만기가 길수록 커지는 유동성 프리미엄을 말합니다."}, "orig": "Mock 2 Session 2 Q19", "conf": false}, {"id": "mock2-2-Q20", "src": "정답", "module": "FI", "tag": "key rate duration으로 가치 변화", "vig": 4, "stem": "The percentage change in value on the real estate portfolio is closest to:", "opts": {"A": "–0.888%.", "B": "–0.515%.", "C": "0.888%."}, "ans": "A", "en": "A. –0.888%. — Correct\nCorrect because an increase in interest rates would lead to a decline in the expected value. The proportional change in value is calculated using the key rate duration (KeyDur) and change in yield (Δz) for each given maturity:\n= –KeyDur1Δz1 – KeyDur5Δ z5 – KeyDur10Δ z10\n= –0.444(0.0018) – 0.5129(0.0035) – 1.103(0.0057) = –0.888%.\nB. –0.515%. — Incorrect\nIncorrect because this response is incorrectly calculated using a 25 basis point change for all maturities: –0.444(0.0025) – 0.5129(0.0025) – 1.103(0.0025) = 0.515%.\nC. 0.888%. — Incorrect\nIncorrect because an increase in interest rates would lead to a decline, rather than an increase, in the expected value.\nResponse incorrectly calculated as 0.444(0.0018) + 0.5129(0.0035) + 1.103(0.0057) = 0.888%.", "ko": "만기별로 key rate duration × 금리 변화를 더한다. 금리가 올라가므로 가치는 내려간다. −(0.4444 × 0.0018 + 0.5129 × 0.0035 + 1.1030 × 0.0057) = −(0.0800% + 0.1795% + 0.6287%) = −0.888%.", "trap": "25bp는 검토 기준일 뿐, 실제 만기별 변화(18, 35, 57bp)를 쓴다. 부호는 음수.", "f": "%ΔV = −Σ KeyDur_k × Δy_k", "why": {"B": "모든 만기에 25bp를 똑같이 적용했습니다.", "C": "금리 상승인데 가치가 오른다고 부호를 반대로 했습니다."}, "orig": "Mock 2 Session 2 Q20", "conf": true}, {"id": "mock2-2-Q21", "src": "정답", "module": "FSA", "tag": "매출 성장의 지속성", "vig": 5, "stem": "Based on the components of total net sales growth, which of Pedra's geographic segments has the lowest sustainable growth rate?", "opts": {"A": "Europe", "B": "Americas", "C": "Asia Pacific"}, "ans": "B", "en": "A. Europe — Incorrect\nIncorrect because although Europe’s net sales growth has the highest contribution from volume growth (4.6%), it has a relatively small contribution from the less sustainable changes in the foreign currency exchange rate (1.4%). Europe has a combined contribution from the volume and price components (4.6% + 1.9% = 6.5%) which are the most sustainable components.\nB. Americas — Correct\nCorrect because the Americas segment has 1. the lowest net sales growth resulting from the combined effect of price and volume at 1.8% (= 1.1% + 0.7%) and 2. the lowest sustainable net sales growth based on the highest contribution from the effect of foreign currency exchange rate of 4.3%.\nFor a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price are more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.\nC. Asia Pacific — Incorrect\nIncorrect because Asia Pacific’s net sales growth has the highest contribution from price change (2.1%), it has a relatively small contribution from the less sustainable changes in the foreign currency exchange rate (1.8%). Asia Pacific has a combined contribution from the volume and price components (3.6% + 2.1% = 5.7%) which are the most sustainable components.", "ko": "물량·가격 성장은 경영진이 통제할 수 있어 지속성이 높고, 환율 효과는 지속성이 낮다. Americas는 물량 + 가격 = 0.7 + 1.1 = 1.8%로 가장 작고, 환율 효과가 4.3%로 가장 크다 → 지속 가능한 성장이 가장 낮다. Europe은 6.5%, Asia Pacific은 5.7%.", "trap": "총 성장률이 아니라 물량 + 가격 부분을 비교한다.", "f": "", "why": {"A": "Europe은 물량 + 가격이 6.5%로 가장 지속 가능합니다.", "C": "Asia Pacific은 물량 + 가격이 5.7%로 Americas보다 높습니다."}, "orig": "Mock 2 Session 2 Q21", "conf": false}, {"id": "mock2-2-Q22", "src": "정답", "module": "FSA", "tag": "외화 거래 손익 (매입채무)", "vig": 5, "stem": "For the most recent year, Pedra's purchase of imported goods resulted in a foreign exchange:", "opts": {"A": "loss of BRL 256,000.", "B": "gain of BRL 256,000.", "C": "gain of BRL 864,000."}, "ans": "B", "en": "A. loss of BRL 256,000. — Incorrect\nIncorrect because the calculation uses the right exchange rates but reverses the direction of the rates.\nForeign transaction result = USD 3.2 million × (5.45 – 5.53) = – BRL 256,000\nB. gain of BRL 256,000. — Correct\nCorrect because the amount payable for imported goods is in USD and the USD depreciated against the BRL from 1 November (5.53 BRL/USD) to 31 December (5.45 BRL/USD). The payable balance that remains outstanding as of 31 December generates a foreign transaction gain of:\nForeign transaction result = – USD 3.2 million × (5.45 – 5.53) = BRL 256,000\nFor foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gains and losses are reported on the income statement.\nC. gain of BRL 864,000. — Incorrect\nIncorrect because the calculation uses the transaction exchange rate and adjusts the amount payable to the average exchange rate for the year.\nForeign transaction result = – USD 3.2 million × (5.26 – 5.53) = BRL 864,000", "ko": "11월 1일 USD 3.2m 매입채무가 생겼을 때 BRL 환산 = 3.2m × 5.53. 12월 31일에는 3.2m × 5.45로 줄었다. 갚아야 할 BRL이 줄었으니 이익 = 3.2m × (5.53 − 5.45) = BRL 256,000. USD 약세 + USD 부채 → 거래 이익(손익계산서).", "trap": "외화 부채는 외화가 약해지면 이익. 거래일 환율과 기말 환율을 쓴다(평균 환율 X).", "f": "Payable 거래 손익 = −외화금액 × (S_기말 − S_거래일)", "why": {"A": "부채인데 자산처럼 부호를 써서 손실로 계산했습니다.", "C": "기말 환율 대신 평균 환율 5.26을 썼습니다."}, "orig": "Mock 2 Session 2 Q22", "conf": false}, {"id": "mock2-2-Q23", "src": "정답", "module": "FSA", "tag": "current rate method와 비율", "vig": 5, "stem": "After translation, Carro’s debt-to-assets ratio at 31 December of the most recent year was:", "opts": {"A": "lower than it was before translation.", "B": "the same as it was before translation.", "C": "higher than it was before translation."}, "ans": "B", "en": "A. lower than it was before translation. — Incorrect\nIncorrect because the debt-to-assets ratio will be the same before (computed with the USD financial statements) and after translation (computed with the BRL financial statements).\nB. the same as it was before translation. — Correct\nCorrect because Pedra uses the current rate method to translate Carro’s financial statements. Under such a method, all assets and liabilities (in USD) are translated (into BRL) at the current exchange rate at the balance sheet date (5.45 BRL/USD). Therefore, both the numerator (debt) and the denominator (total assets) of the ratio are translated using the same exchange rate of 5.45 BRL/USD. As a result, the debt-to-assets will be the same before (computed with the USD financial statements) and after translation (computed with the BRL financial statements).\nC. higher than it was before translation. — Incorrect\nIncorrect because the debt-to-assets ratio will be the same before (computed with the USD financial statements) and after translation (computed with the BRL financial statements). If Pedra had applied the temporal method, non-monetary assets and liabilities would be translated using the historical exchange rate. As the exchange rate used to translate non-monetary assets was lower at time of purchase (BRL/USD 5.24) than at reporting date (BRL/USD 5.45), total assets would have been lower and debt-to-total assets would have been higher.", "ko": "current rate method에서는 모든 자산·부채를 기말 환율(5.45)로 환산한다. 부채와 총자산에 같은 환율을 곱하므로 debt-to-assets 비율은 환산 전과 같다. temporal method였다면 비화폐성 자산(재고·고정자산)은 역사적 환율 5.24로 환산돼 자산이 작아지고 비율이 높아졌을 것이다.", "trap": "current rate method에서는 대차대조표 비율이 환산 전후 같다.", "f": "", "why": {"A": "분자·분모에 같은 환율을 쓰므로 비율이 변하지 않습니다.", "C": "temporal method였다면 높아졌겠지만 current rate method라 같습니다."}, "orig": "Mock 2 Session 2 Q23", "conf": false}, {"id": "mock2-2-Q24", "src": "오답", "module": "FSA", "tag": "환산 조정: current rate method", "vig": 5, "stem": "Based on Viniciu’s expectations, the translation of Carro’s financial statements in the current year will most likely result in a:", "opts": {"A": "translation loss in Pedra's income statement.", "B": "translation gain in Pedra's income statement.", "C": "positive translation adjustment in Pedra's shareholders’ equity."}, "ans": "C", "en": "A. translation loss in Pedra's income statement. — Incorrect\nIncorrect because Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity. Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency). Therefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment which will be reflected in stockholders’ equity because Pedra uses the current rate method to translate Carro's financial statements. If Carro used the temporal method for translation and there was a strengthening of the BRL, there would have been a translation loss recognized in the income statement.\nB. translation gain in Pedra's income statement. — Incorrect\nIncorrect because Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity. Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency). Therefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment which will be reflected in stockholders’ equity because Pedra uses the current rate method to translate Carro's financial statements. If Carro used the temporal method for translation then there would have been a translation gain recognized in the income statement.\nC. positive translation adjustment in Pedra's shareholders’ equity. — Correct\nCorrect because Pedra uses the current rate method to translate Carro’s financial statements. When the current rate method is used, the cumulative translation adjustment needed to keep the translated balance sheet in balance is reported as a separate component of stockholders’ equity.\nThe sign (positive or negative) of the current period’s translation adjustment is a function of two factors: (1) The nature of the balance sheet exposure (asset or liability), and (2) The direction of change in the exchange rate (strengthens or weakens). The relationship between exchange rate fluctuations, balance sheet exposure, and the current period’s translation adjustment can be summarized as follows:\nBalance Sheet Exposure\tForeign Currency Strengthens\tForeign Currency Weakens\nNet asset\tPositive translation adjustment\tNegative translation adjustment\nNet liability\tNegative translation adjustment\tPositive translation adjustment\nIn this case, Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency).\nTherefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity.", "ko": "current rate method의 환산 차이는 손익계산서가 아니라 자본(CTA, OCI)에 들어간다. 부호: Carro는 순자산 노출이고, BRL 약세 = 외화(USD) 강세. 순자산 + 외화 강세 → 양(+)의 환산 조정. 그래서 '자본에 양의 환산 조정'.", "trap": "current rate method → 손익이 아니라 자본(CTA). 순자산 노출 + 외화 강세 = +.", "f": "", "why": {"A": "current rate method의 환산 차이는 손익계산서에 가지 않고, 부호도 양수입니다.", "B": "부호는 맞지만 current rate method라 손익계산서가 아니라 자본에 반영됩니다."}, "orig": "Mock 2 Session 2 Q24", "conf": false}, {"id": "mock2-2-Q25", "src": "정답", "module": "AI", "tag": "equity market neutral 전략", "vig": 6, "stem": "The investment strategy used by Fund 1 most likely:", "opts": {"A": "relies primarily on market timing.", "B": "applies a higher level of leverage.", "C": "delivers returns that are more volatile than other hedge fund strategies."}, "ans": "B", "en": "A. relies primarily on market timing. — Incorrect\nIncorrect because Fund 1 follows an equity market neutral (EMN) strategy, and the main source of skill for an EMN manager is in security selection, with market timing being of secondary importance.\nB. applies a higher level of leverage. — Correct\nCorrect because Fund 1 follows equity market neutral (EMN) strategy and the use of leverage by hedge funds following this strategy is high: As many beta risks (e.g., market, sector) are hedged away, it is generally deemed acceptable for EMN managers to apply higher levels of leverage while striving for meaningful return targets.\nC. delivers returns that are more volatile than other hedge fund strategies. — Incorrect\nIncorrect because Fund 1 follows an equity market neutral (EMN) strategy, and EMN managers generally are more useful for portfolio allocation during periods of non-trending or declining markets because they typically deliver returns that are steadier and less volatile than those of many other hedge strategy areas.", "ko": "EMN은 시장·섹터 베타를 헤지로 없애고 종목 선택으로 수익을 낸다. 베타 위험이 거의 없으니 의미 있는 수익을 내려고 레버리지를 높게 쓰는 것이 일반적이다. 마켓 타이밍은 주된 기술이 아니고, 수익은 다른 헤지펀드 전략보다 안정적(변동성 낮음)이다.", "trap": "EMN = 종목 선택 + 높은 레버리지 + 낮은 변동성.", "f": "", "why": {"A": "EMN의 핵심 기술은 종목 선택이고 마켓 타이밍은 부차적입니다.", "C": "EMN 수익은 다른 전략보다 안정적이고 변동성이 낮습니다."}, "orig": "Mock 2 Session 2 Q25", "conf": true}, {"id": "mock2-2-Q26", "src": "정답", "module": "AI", "tag": "distressed securities 전략", "vig": 6, "stem": "The investment strategy used by Fund 2 most likely:", "opts": {"A": "has a short initial lock-up period.", "B": "produces either very good or very bad results.", "C": "applies primarily to short selling and is short biased."}, "ans": "B", "en": "A. has a short initial lock-up period. — Incorrect\nIncorrect because Fund 2 follows an event-driven strategy focusing on distressed securities. By nature, distressed debt and other illiquid assets may take several years to resolve, and they are generally difficult to value. Therefore, hedge fund managers running portfolios of distressed securities typically require relatively long initial lock-up periods (e.g., no redemptions allowed for the first two years) from their investors.\nB. produces either very good or very bad results. — Correct\nCorrect because Fund 2 follows an event-driven strategy focusing on distressed securities. Distressed securities investing typically entails relatively high levels of illiquidity, especially if using a concentrated activist approach. Pricing may involve 'mark-to-model' with return smoothing. Ultimate results are generally binary: either very good or very bad.\nC. applies primarily to short selling and is short biased. — Incorrect\nIncorrect because Fund 2 follows an event-driven strategy focusing on distressed securities. Distressed funds normally take long positions in investments and are often forced to sell at distressed prices that reflect increased credit and liquidity risks. Specifically, as noted in the curriculum: Outright shorts or hedged positions are possible, but distressed securities investing is usually long-biased. It is subject to security-specific outcomes.", "ko": "부실채권 투자는 유동성이 낮고 해결까지 몇 년이 걸려 가치평가도 어렵다(mark-to-model). 결과는 대체로 아주 좋거나 아주 나쁜 둘 중 하나(binary)다. 그래서 lock-up 기간이 길고, 주로 매수(long) 위주다.", "trap": "distressed = 긴 lock-up, long-biased, 결과는 binary.", "f": "", "why": {"A": "유동성이 낮아 lock-up 기간이 깁니다(예: 첫 2년 환매 불가).", "C": "distressed 투자는 보통 long 위주입니다."}, "orig": "Mock 2 Session 2 Q26", "conf": false}, {"id": "mock2-2-Q27", "src": "정답", "module": "AI", "tag": "Sortino ratio로 선택", "vig": 6, "stem": "Based on his definition of risk and his objective to maximize the endowment's risk-adjusted return, Tan should allocate to:", "opts": {"A": "Fund 1.", "B": "Fund 2.", "C": "Fund 3."}, "ans": "A", "en": "A. Fund 1. — Correct\nCorrect because the hypothetical combined portfolio where the endowment invests only in Fund 1 has the highest Sortino ratio. As mentioned in the curriculum, the Sharpe ratio measures risk-adjusted performance, where risk is defined as standard deviation, so it penalizes both upside and downside variability. The Sortino ratio measures risk-adjusted performance, where risk is defined as downside deviation, so it penalizes only downside variability below a minimum target return.\nB. Fund 2. — Incorrect\nIncorrect because the hypothetical combined portfolio where the endowment invests only in Fund 2 has the highest Sharpe ratio but not the highest Sortino ratio. For hedge fund strategies with large negative events, the Sortino ratio is considered a better performance measure.\nC. Fund 3. — Incorrect\nIncorrect because the hypothetical combined portfolio where the endowment invests only in Fund 3 has the lowest standard deviation of returns but not the highest Sortino ratio. For hedge fund strategies with large negative events, the Sortino ratio is considered a better performance measure.", "ko": "Tan은 위험을 하방 편차(downside deviation)로 정의했다. 하방 위험만 반영하는 지표는 Sortino ratio다. Sortino가 가장 높은 것은 Fund 1(1.5)이다. Sharpe는 표준편차(상·하방 모두)를 쓰므로 기준이 아니다.", "trap": "위험 = downside deviation → Sharpe가 아니라 Sortino.", "f": "Sortino = (R − MAR) / downside deviation", "why": {"B": "Fund 2는 Sharpe가 가장 높지만 Sortino는 가장 낮습니다.", "C": "Fund 3은 표준편차가 가장 낮지만 Sortino가 가장 높지는 않습니다."}, "orig": "Mock 2 Session 2 Q27", "conf": false}, {"id": "mock2-2-Q28", "src": "정답", "module": "AI", "tag": "fund of funds의 단점", "vig": 6, "stem": "The reallocation of hedge fund investments to Fund 4 would most likely:", "opts": {"A": "result in an additional layer of principal-agent relationships.", "B": "improve transparency into individual hedge fund managers' processes and returns.", "C": "increase the endowment fund's ability to net performance fees on individual managers."}, "ans": "A", "en": "A. result in an additional layer of principal-agent relationships. — Correct\nCorrect because disadvantages of the FoF approach include an additional principal–agent relationship.\nB. improve transparency into individual hedge fund managers' processes and returns. — Incorrect\nIncorrect because disadvantages of the FoF approach include a lack of transparency into individual hedge fund manager processes and returns.\nC. increase the endowment fund's ability to net performance fees on individual managers. — Incorrect\nIncorrect because disadvantages of the FoF approach include the inability to net performance fees on individual managers.", "ko": "FoF는 투자자 → FoF 매니저 → 개별 헤지펀드 매니저로 대리인 관계가 한 겹 더 생긴다. 또 개별 매니저의 과정·수익을 보기 어렵고(투명성 낮음), 개별 매니저 간 성과보수를 상계(netting)할 수 없다.", "trap": "FoF 단점: 대리인 한 겹 추가, 투명성 낮음, 성과보수 상계 불가, 수수료 이중.", "f": "", "why": {"B": "FoF는 개별 매니저에 대한 투명성이 오히려 떨어집니다.", "C": "FoF에서는 개별 매니저의 성과보수를 상계할 수 없습니다."}, "orig": "Mock 2 Session 2 Q28", "conf": false}, {"id": "mock2-2-Q29", "src": "정답", "module": "DER", "tag": "2기간 이항모형 콜 가치", "vig": 7, "stem": "Using the two-period binomial model, the value of the European-style call option is closest to:", "opts": {"A": "$20.11.", "B": "$25.28.", "C": "$42.66."}, "ans": "A", "en": "A. $20.11. — Correct\nCorrect because using the Risk Neutral approach:\nc = PV[π^2c^(++) + 2π(1 – π)c^(+–)+ (1 – π)^2c^(– –)]\n= 1/1.03^2[0.471429^2 x 96 + 2 x 0.471429 x 0.528571 x 0 + 0.528571^2x 0]\n= 20.11\nwhere:\nπ = [FV(1) – d]/(u – d) = (1.03 – 0.7)/(1.4 – 0.7) = 0.471429.\nc^(++) = Max(0,u^2S – X) = Max(0,1.4^2 × 100 - 100) = 96\nc^(+–) = Max(0,udS – X) = Max(0,1.4 × 0.7 × 100 - 100) = 0\nc^(– –) = Max(0,d^2S – X) = Max(0,0.7^2 × 100 - 100) = 0\nB. $25.28. — Incorrect\nIncorrect because the the values for π and 1 – π are reversed:\nc = PV[(1 –π)^2c^(++) + 2π(1 – π)c^(+–)+ π^2c^(– –)]\n= 1/1.03^2[0.528571^2 × 96 + 2 × 0.471429 × 0.528571 × 0 + 0.471429^(2 ×) 0]\n= 25.28.\nC. $42.66. — Incorrect\nIncorrect because 1 – π and π are not squared:\nc = PV[πc^(++) + 2π(1 – π)c^(+–)+ (1 – π)c^(– –)]\n= 1/1.03^2[0.471429 × 96 + 2 × 0.471429 × 0.528571 × 0 + 0.528571× 0]\n= 42.66.", "ko": "위험중립확률 π = (1.03 − 0.7) / (1.4 − 0.7) = 0.4714. 만기 주가: uu = 196 → 콜 96, ud = 98 → 0, dd = 49 → 0. 콜 = π² × 96 / 1.03² = 0.2222 × 96 / 1.0609 = 21.33 / 1.0609 = $20.11.", "trap": "2기간이면 확률을 제곱하고 (1 + r)²로 할인한다.", "f": "π = (1 + r − d)/(u − d), c = [π²c++ + 2π(1 − π)c+− + (1 − π)²c−−] / (1 + r)²", "why": {"B": "π와 1 − π를 바꿔 썼습니다.", "C": "π를 제곱하지 않았습니다."}, "orig": "Mock 2 Session 2 Q29", "conf": false}, {"id": "mock2-2-Q30", "src": "정답", "module": "DER", "tag": "delta hedge 주식 수", "vig": 7, "stem": "The optimal number of shares that should be purchased to delta hedge the short call position is closest to:", "opts": {"A": "2,055.", "B": "2,525.", "C": "2,945."}, "ans": "C", "en": "A. 2,055. — Incorrect\nIncorrect because this is the delta of 5,000 puts (without the minus sign) = N(–d1) x 5,000 = 0.411 x 5,000 = 2,055.\nB. 2,525. — Incorrect\nIncorrect because this is the portfolio delta (short 5,000 calls) without the minus sign mistakenly using N(d2) = N(d2) x 5,000 = 0.505 x 5,000 = 2,525.\nC. 2,945. — Correct\nCorrect because the optimal number of hedging units = NH = –Portfolio delta/DeltaH, where DeltaH is the delta of the hedging unit. Since there are no dividends Deltac = N(d1) =0.589 and Deltap = –N(–d1) = –0.411. The portfolio is short calls on 5,000 shares, so portfolio delta = –0.589 x 5,000 = –2,945. The hedging unit is shares of the underlying equity, so DeltaH = 1.0. The optimal number of shares = NH = –(–2,945)/1.0 = 2,945.", "ko": "배당 없는 콜의 델타 = N(d1) = 0.589. 콜 5,000주 매도 → 포트폴리오 델타 = −0.589 × 5,000 = −2,945. 주식 델타는 1이므로 2,945주를 사면 델타가 0이 된다.", "trap": "콜 델타는 N(d2)가 아니라 N(d1). N(−d1)은 풋 델타의 크기.", "f": "N_H = −Portfolio delta / Delta_H, call delta = N(d1)", "why": {"A": "풋 델타 크기 N(−d1) = 0.411을 썼습니다.", "B": "N(d1) 대신 N(d2) = 0.505를 썼습니다."}, "orig": "Mock 2 Session 2 Q30", "conf": false}, {"id": "mock2-2-Q31", "src": "정답", "module": "DER", "tag": "감마가 가장 큰 옵션", "vig": 7, "stem": "Which option would have the largest gamma?", "opts": {"A": "Call 1", "B": "Call 2", "C": "Call 3"}, "ans": "B", "en": "A. Call 1 — Incorrect\nIncorrect because Call 1 is in the money, and thus Call 1 has a lower gamma than Call 2. Adding a lower gamma to the delta prediction of the change in call price would have less of an impact on the predicted change in price.\nB. Call 2 — Correct\nCorrect because Call 2 is at the money where gamma takes on its largest value. The predicted change in call price is shown below, and the predicted change in call price is larger for larger gamma. As calls go out of the money (in either direction) gamma approaches zero.\nThe delta-plus-gamma prediction equation is:\nC. Call 3 — Incorrect\nIncorrect because Call 3 is out of the money, and thus has a lower gamma than Call 2. Adding a lower gamma to the delta prediction of the change in call price would have less of an impact on the predicted change in price.", "ko": "감마는 등가격(ATM)에서 가장 크고, 내가격·외가격으로 갈수록 0에 가까워진다. 주가 $100에서 행사가 $100인 Call 2가 ATM이라 감마가 가장 크다. 델타 + 감마 근사: Δc ≈ delta × ΔS + ½ × gamma × (ΔS)².", "trap": "감마 최대 = ATM (만기가 같을 때).", "f": "Δc ≈ Δ·ΔS + ½·Γ·(ΔS)²", "why": {"A": "Call 1은 내가격이라 감마가 ATM보다 작습니다.", "C": "Call 3은 외가격이라 감마가 ATM보다 작습니다."}, "orig": "Mock 2 Session 2 Q31", "conf": true}, {"id": "mock2-2-Q32", "src": "정답", "module": "DER", "tag": "내재 변동성과 옵션 매수", "vig": 7, "stem": "To benefit from its views on option volatility West should take a long position in:", "opts": {"A": "Put A.", "B": "Put B.", "C": "Put C."}, "ans": "B", "en": "A. Put A. — Incorrect\nIncorrect because Put A has a higher implied volatility than West's forecast (19% > 17%). If West is correct, Put A is overvalued.\nB. Put B. — Correct\nCorrect because for Put B West's forecast for volatility is higher than its implied volatility (22% > 16%) suggesting that Put B is currently undervalued and that West should take a long position in Put B. If her forecast proves correct she will profit/benefit from that long position. There is a 1:1 relation between implied volatility and option price for an agreed upon option pricing model. Implied volatility can be interpreted as the market’s view of how to value options. Different investors will have different views of the future volatility. The one with the most accurate forecast will have the most accurate assessment of the option value.\nC. Put C. — Incorrect\nIncorrect because Put C has a higher implied volatility than West's forecast (18% > 16%). If West is correct, Put C is overvalued.", "ko": "내 예측 변동성이 내재 변동성보다 높으면 시장이 옵션을 싸게 평가하는 것이므로 매수한다. Put B: 예측 22% > 내재 16% → 저평가 → 매수. Put A(19% > 17%), Put C(18% > 16%)는 내재가 예측보다 높아 고평가다. 역사적 변동성은 비교 기준이 아니다.", "trap": "비교는 '예측 vs 내재'. 역사적 변동성이 아니다.", "f": "", "why": {"A": "내재 변동성(19%)이 예측(17%)보다 높아 고평가입니다.", "C": "내재 변동성(18%)이 예측(16%)보다 높아 고평가입니다."}, "orig": "Mock 2 Session 2 Q32", "conf": false}, {"id": "mock2-2-Q33", "src": "정답", "module": "PM", "tag": "거시 요인과 P/E", "vig": 8, "stem": "Which of the following scenarios would most likely result in a decrease in the P/E ratio for equities?", "opts": {"A": "Scenario 1", "B": "Scenario 2", "C": "Scenario 3"}, "ans": "A", "en": "A. Scenario 1 — Correct\nCorrect because an increase in both real GDP growth volatility and inflation expectations (factors b and c below) would result in a decrease in the P/E ratio.\nHigh P/E could be the result of a number of factors, including\na. an increase in expectation of future real earnings growth;\nb. falling real interest rates (It,s), possibly associated with falling volatility in real GDP growth;\nc. a decrease in inflation expectations (Θt,s);\nd. a decline in uncertainty about future inflation (Πt,s); or\ne. a decrease in the equity risk premium (λ^it,s).\nB. Scenario 2 — Incorrect\nIncorrect because declining uncertainty about future inflation would result in a higher P/E ratio.\nC. Scenario 3 — Incorrect\nIncorrect because the two factors in this scenario (i.e., an expectation of higher real earnings growth and a higher equity risk premium) would have opposite effects on the P/E ratio, resulting in an indeterminate conclusion.", "ko": "P/E를 높이는 요인: 실질 이익성장 기대 ↑, 실질금리 ↓(실질 GDP 성장 변동성 ↓), 인플레이션 기대 ↓, 인플레이션 불확실성 ↓, ERP ↓. Scenario 1은 GDP 성장 변동성 ↑, 인플레이션 기대 ↑ → 둘 다 P/E를 낮춤. Scenario 2는 P/E를 높이고, Scenario 3은 이익성장 ↑(P/E ↑)과 ERP ↑(P/E ↓)이 반대라 결론이 안 난다.", "trap": "두 요인 방향이 반대면 '알 수 없음'이라 답이 안 된다.", "f": "", "why": {"B": "인플레이션 불확실성이 줄면 P/E는 올라갑니다.", "C": "이익성장 ↑과 ERP ↑이 반대로 작용해 결과를 알 수 없습니다."}, "orig": "Mock 2 Session 2 Q33", "conf": false}, {"id": "mock2-2-Q34", "src": "정답", "module": "PM", "tag": "가치 추가: security selection", "vig": 8, "stem": "For the active portfolio, the value added attributable to security selection is closest to:", "opts": {"A": "0.3%.", "B": "0.8%.", "C": "1.1%."}, "ans": "C", "en": "A. 0.3%. — Incorrect\nIncorrect because this is the value added attributable to asset allocation, which can be calculated as shown below:\nAsset\tBenchmark return [1]\tPortfolio allocation [2]\tBenchmark allocation [3]\tDifference in allocation [4] = [2] – [3]\t[1] × [4]\nEquities\t8%\t70%\t60%\t10%\t0.8%\nFixed income\t5%\t30%\t40%\t–10%\t–0.5%\n\t\tAsset allocation = Total\t\t\t0.3%\nB. 0.8%. — Incorrect\nIncorrect because this answer uses benchmark allocation weights instead of portfolio allocation weights, as shown below:\nAsset\tPortfolio return [1]\tBenchmark return [2]\tValue added [3] = [1] – [2]\tBenchmark allocation [4]\t[3] × [4]\nEquities\t10%\t8%\t2%\t60%\t1.2%\nFixed income\t4%\t5%\t–1%\t40%\t–0.4%\n\t\t\t\tTotal\t0.8%\nC. 1.1%. — Correct\nCorrect because the value added attributable to security selection can be calculated as shown below:\nAsset\tPortfolio return [1]\tBenchmark return [2]\tValue added [3] = [1] – [2]\tPortfolio allocation [4]\t[3] × [4]\nEquities\t10%\t8%\t2%\t70%\t1.4%\nFixed income\t4%\t5%\t–1%\t30%\t–0.3%\n\t\t\tSecurity selection = Total\t\t1.1%", "ko": "종목 선택 기여 = Σ 포트폴리오 비중 × (포트폴리오 수익률 − 벤치마크 수익률). 주식: 70% × (10% − 8%) = 1.4%, 채권: 30% × (4% − 5%) = −0.3%. 합계 = 1.1%. (자산배분 기여 = Σ (비중 차이) × 벤치마크 수익률 = 0.8 − 0.5 = 0.3%, 합계 1.4% = active return.)", "trap": "종목 선택은 포트폴리오 비중으로 곱한다(벤치마크 비중 X).", "f": "Selection = Σ w_P × (R_P − R_B), Allocation = Σ (w_P − w_B) × R_B", "why": {"A": "자산배분 기여(0.3%)입니다.", "B": "포트폴리오 비중 대신 벤치마크 비중을 썼습니다."}, "orig": "Mock 2 Session 2 Q34", "conf": false}, {"id": "mock2-2-Q35", "src": "정답", "module": "PM", "tag": "최적 active risk와 Sharpe 개선", "vig": 8, "stem": "Can Navarro improve the Sharpe ratio of the active portfolio by combining investments in this portfolio and the benchmark?", "opts": {"A": "No", "B": "Yes, by taking a short position in the active portfolio and a long position in the benchmark", "C": "Yes, by taking a long position in the active portfolio and a short position in the benchmark"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because the active portfolio's expected active risk is not at its optimal level, therefore the expected Sharpe ratio is not at its maximum value.\nB. Yes, by taking a short position in the active portfolio and a long position in the benchmark — Correct\nCorrect because the optimal amount of active risk (8.50%) is less than the expected active risk of the active portfolio (10.00%).\nThe optimal amount of active risk (σA) can be calculated as a function of the active manager's information ratio (IR), the Sharpe ratio of the benchmark (SRB), and the standard deviation of the benchmark (σB):\nσA = (IR / SRB) × σB\nwhere\nIR = Active return / Active risk = 1.4% / 10% = 0.14\nSRB = 0.28\nσB = 17%\nσA = (0.14 / 0.28) × 17% = 8.50%\nSince the optimal active risk is less than the expected active risk of the active portfolio (i.e., 8.50% < 10.00%), Navarro needs to short the active portfolio and go long the benchmark. Doing so will maximize the expected Sharpe ratio (calculated as 0.31 = (0.28^2 + 0.14^2)^0.5, which is not needed to answer the question).\nC. Yes, by taking a long position in the active portfolio and a short position in the benchmark — Incorrect\nIncorrect because the optimal amount of active risk (8.5%) is less than the expected active risk of the active portfolio (10.00%). This answer would only be correct if that relation were reversed.", "ko": "IR = 1.4% / 10% = 0.14. 최적 active risk = (IR / SR_B) × σ_B = (0.14 / 0.28) × 17% = 8.5%. 현재 active risk 10%가 최적보다 크므로 액티브 포트폴리오 비중을 줄이고 벤치마크 비중을 늘려야 한다(액티브 일부 매도·벤치마크 매수). 그러면 Sharpe가 √(0.28² + 0.14²) = 0.31까지 올라간다.", "trap": "현재 active risk > 최적 → 액티브를 줄이고 벤치마크를 늘린다.", "f": "σ_A* = (IR / SR_B) × σ_B, SR_P* = √(SR_B² + IR²)", "why": {"A": "active risk가 최적(8.5%)이 아니라서 Sharpe를 높일 여지가 있습니다.", "C": "현재 active risk가 최적보다 작을 때의 방법입니다(여기는 반대)."}, "orig": "Mock 2 Session 2 Q35", "conf": false}, {"id": "mock2-2-Q36", "src": "정답", "module": "PM", "tag": "확장 기본법칙: TC", "vig": 8, "stem": "Which of the following events will most likely reduce the information ratio of the active portfolio?", "opts": {"A": "Event 1", "B": "Event 2", "C": "Event 3"}, "ans": "C", "en": "A. Event 1 — Incorrect\nIncorrect because this event increases the information ratio (IR). Increasing the rebalancing frequency (from semiannual to quarterly) increases the number of independent decisions made, which increases breadth (BR) and thus the information ratio.\nIR = (TC) (IC) BR^0.5\nBR measures the number of independent decisions made per year by the investor in constructing the portfolio. A higher (lower) rebalancing frequency implies a higher (lower) BR. It is important to note that doubling the rebalancing frequency probably does not double BR due to the lack of independence among decisions.\nB. Event 2 — Incorrect\nIncorrect because this event increases the information ratio (IR). Adding two analysts with strong forecasting ability increases the information coefficient (IC).\nIR = (TC) (IC) BR^0.5\nIC measures the forecasting ability of the fund manager. The stronger the link between forecasted active returns and realized returns, the higher the IC.\nThis event will also increase breadth (BR) because the additional research provided by the two analysts will most likely increase the number of independent decisions made during the year. As a result, the information ratio increases.\nC. Event 3 — Correct\nCorrect because short-selling constraints will result in a lower transfer coefficient and thus reduce the information ratio (IR).\nThe IR under the expanded fundamental law of active management is expressed as a function of the transfer coefficient (TC), the information coefficient (IC), and breadth (BR) as follows:\nIR = (TC) (IC) BR^0.5\nTC measures the degree to which the investor’s forecasts are translated into active weights. One factor that decreases a fund manager's ability to construct portfolios efficiently is the imposition of short-selling constraints. Short-selling constraints result in a lower TC and thus a lower IR.", "ko": "IR = TC × IC × √BR. Event 1: 리밸런싱을 더 자주 → 독립적 결정 수(BR) 증가 → IR ↑. Event 2: 예측력 좋은 애널리스트 → IC ↑ (BR도 ↑) → IR ↑. Event 3: 공매도 제한 → 예측을 비중에 제대로 옮기지 못해 TC ↓ → IR ↓.", "trap": "공매도 같은 제약은 TC를 낮춘다.", "f": "IR = TC × IC × √BR", "why": {"A": "리밸런싱을 자주 하면 breadth가 늘어 IR이 올라갑니다.", "B": "예측력이 좋은 애널리스트는 IC를 높여 IR이 올라갑니다."}, "orig": "Mock 2 Session 2 Q36", "conf": false}, {"id": "mock2-2-Q37", "src": "정답", "module": "EQ", "tag": "PRAT 모형", "vig": 9, "stem": "Kaufmann's conclusion about the sustainable growth rate of Company A relative to Company B is best supported by Company A's:", "opts": {"A": "payout ratio.", "B": "profit margin.", "C": "equity multiplier."}, "ans": "A", "en": "A. payout ratio. — Correct\nCorrect because a higher payout ratio will lead to a lower sustainable growth rate. Company A and Company B have identical total asset turnover ratios, but Company A has a higher payout ratio, higher profit margin, and higher equity multiplier. The PRAT model calculates the growth rate as the product of retention rate, profit margin, asset turnover, and equity multiplier (leverage). Since the retention rate is defined as (1 – payout ratio), a higher payout ratio results in a comparably lower retention rate and hence in a lower growth rate.\nB. profit margin. — Incorrect\nIncorrect because a higher profit margin will lead to a higher sustainable growth rate based on the PRAT model, which calculates the growth rate as the product of retention rate, profit margin, asset turnover, and equity multiplier (leverage). Company A has a higher profit margin.\nC. equity multiplier. — Incorrect\nIncorrect because a higher equity multiplier will lead to a higher sustainable growth rate based on the PRAT model, which calculates the growth rate as the product of retention rate, profit margin, asset turnover, and equity multiplier (leverage). Company A has a higher equity multiplier.", "ko": "g = 유보율 × 순이익률 × 총자산회전율 × 자기자본승수. A는 B보다 순이익률·자기자본승수가 높아 성장률을 높이는 쪽이고, 자산회전율은 같다. 그런데도 A의 성장률이 낮다면 원인은 배당성향이 높아 유보율(1 − payout)이 낮기 때문이다.", "trap": "payout ↑ → 유보율 ↓ → g ↓. 나머지 셋은 높을수록 g ↑.", "f": "g = b × PM × ATO × EM (b = 1 − payout)", "why": {"B": "순이익률이 높으면 성장률이 높아집니다.", "C": "자기자본승수가 높으면 성장률이 높아집니다."}, "orig": "Mock 2 Session 2 Q37", "conf": false}, {"id": "mock2-2-Q38", "src": "정답", "module": "EQ", "tag": "2단계 DDM", "vig": 9, "stem": "Based on the two-stage DDM, the shares of Company B are:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "B", "en": "A. undervalued. — Incorrect\nIncorrect because the current share price of EUR 42.37 is within the tolerance band of +/–5% relative to the model value of EUR 41.34.\nAn undervaluation results if the cash flows are not discounted:\nThe next three dividends are calculated as follows.\nD(1) = 1.40 × 1.12 = 1.568\nD(2) = 1.568 × 1.12 = 1.75616\nD(3) = 1.75616 × 1.06 = 1.86153\nBased on D(3), the value at t = 2 of the dividends from t = 3 until infinity (terminal value) can be calculated using the Gordon growth model: V(2) = 1.86153/(

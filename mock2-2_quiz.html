0.10 – 0.06) = 46.53824.\nNext, the two dividends and the terminal value are added up: 1.568 + 1.75616 + 46.53824 = 49.8624 ≈ 49.86.\nCalculating the deviation of the current share price from the intrinsic value:\n42.37/49.86 – 1 = –0.150262 ≈ –15.0%. The shares are undervalued by 15.0%.\nB. fairly valued. — Correct\nCorrect because the current share price of EUR 42.37 is within the tolerance band of +/–5% relative to the model value of EUR 41.34.\nThe next three dividends are calculated as follows.\nInputs:\nD(0) = 1.40\ngS = 12%\ngL = 6%\nr = 10%\nD(1) = 1.40 × 1.12 = 1.568\nD(2) = 1.568 × 1.12 = 1.75616\nD(3) = 1.75616 × 1.06 = 1.86153\nBased on D(3), the value at t = 2 of the dividends from t = 3 until infinity (terminal value) can be calculated using the Gordon growth model: V(2) = 1.86153/(0.10 – 0.06) = 46.53824.\nNext, the two dividends and the terminal value (D(1), D(2), and V(2)) are discounted at the required return on equity of 10%:\n1.568/1.1 = 1.42545\n(1.75616 + 46.53824)/1.1^2 = 39.91273\nFinally, these discounted values are added up to arrive at V(0), the model value:\n1.42545 + 39.91273 = 41.33818 ≈ 41.34.\nCalculating the deviation of the current share price from the intrinsic value:\n42.37/41.34 – 1 = 0.024960 ≈ 2.5%. This is within the tolerance band of +/–5%.\nC. overvalued. — Incorrect\nIncorrect because the current share price of EUR 42.37 is within the tolerance band of +/–5% relative to the model value of EUR 41.34.\nAn overvaluation results if only the terminal value is discounted:\nThe next three dividends are calculated as follows.\nD(1) = 1.40 × 1.12 = 1.568\nD(2) = 1.568 × 1.12 = 1.75616\nD(3) = 1.75616 × 1.06 = 1.86153\nBased on D(3), the value at t = 2 of the dividends from t = 3 until infinity (terminal value) can be calculated using the Gordon growth model: V(2) = 1.86153/(0.10 – 0.06) = 46.53824.\nThis terminal value is discounted at the required return on equity:\n46.53824/1.1^2 = 38.46136 ≈ 38.46.\nCalculating the deviation of the current share price from the intrinsic value:\n42.37/38.46 – 1 = 0.101625 ≈ 10.2%. The shares are overvalued by 10.2%.", "ko": "D1 = 1.40 × 1.12 = 1.568, D2 = 1.568 × 1.12 = 1.7562, D3 = 1.7562 × 1.06 = 1.8615. V2 = D3 / (0.10 − 0.06) = 46.538. V0 = 1.568/1.1 + (1.7562 + 46.538)/1.1² = 1.425 + 39.913 = 41.34. 주가 42.37은 41.34보다 2.5% 높아 ±5% 안 → 적정 가치.", "trap": "TV는 Year 2 시점 값이라 1.1²로 할인하고, D1·D2도 할인해 더한다.", "f": "V0 = Σ Dt/(1+r)^t + [D(n+1)/(r − g)]/(1+r)^n", "why": {"A": "배당과 TV를 할인하지 않아(49.86) 저평가로 나왔습니다.", "C": "TV만 할인하고 D1·D2를 빠뜨려(38.46) 고평가로 나왔습니다."}, "orig": "Mock 2 Session 2 Q38", "conf": false}, {"id": "mock2-2-Q39", "src": "정답", "module": "EQ", "tag": "Gordon growth model 적합 회사", "vig": 9, "stem": "Which of the following companies is most suitable for valuation using the Gordon growth model?", "opts": {"A": "Company C", "B": "Company D", "C": "Company E"}, "ans": "B", "en": "A. Company C — Incorrect\nIncorrect because the payout ratio fluctuates widely, ranging from 13% to 109%. Thus, there is no strong link between profitability and dividends, a key assumption for the use of the Gordon growth model.\nB. Company D — Correct\nCorrect because both payout ratio and dividend growth align well with the assumptions of the Gordon growth model. The payout ratio is stable, indicating that there is a direct link between profitability and dividends. Also, the dividend growth rate from year to year is stable, ranging between 4.4% and 5.4% with an average of 5.0%. The Gordon growth model implies a set of relationships for the growth rates of dividends, earnings and stock value. With dividends growing at a constant rate g, stock value also grows at g as well. Given a constant payout ratio—a constant, proportional relationship between earnings and dividends—dividends and earnings grow at g.\nC. Company E — Incorrect\nIncorrect because the payout ratio is increasing steadily, indicating that an ever increasing share of profits is required to maintain the stable dividend. Thus, there is no strong link between profitability and dividends, a key assumption for the use of the Gordon growth model.", "ko": "GGM은 배당이 일정한 비율로 성장하고, 배당과 이익이 안정적으로 연결된다(배당성향 일정)고 가정한다. Company D: 배당성향 0.38~0.42로 안정, 배당 성장률도 4.4~5.4%(평균 약 5%)로 안정 → 적합. Company C는 배당성향이 13~109%로 들쑥날쑥, Company E는 배당성향이 계속 올라 이익과 배당의 연결이 약하다.", "trap": "배당 성장이 안정적이어도 배당성향이 계속 오르면(E) 이익이 줄고 있다는 뜻이라 부적합.", "f": "", "why": {"A": "배당성향이 13%~109%로 크게 흔들려 이익과 배당의 연결이 없습니다.", "C": "배당성향이 계속 올라 같은 배당을 위해 이익의 더 많은 부분이 필요합니다."}, "orig": "Mock 2 Session 2 Q39", "conf": false}, {"id": "mock2-2-Q40", "src": "정답", "module": "EQ", "tag": "residual income", "vig": 9, "stem": "Residual income for Company C in the current year is closest to:", "opts": {"A": "EUR 140,000.", "B": "EUR 230,000.", "C": "EUR 500,000."}, "ans": "B", "en": "A. EUR 140,000. — Incorrect\nIncorrect because the fact that interest is tax deductible has been ignored. The incorrect calculation of residual income is as follows:\nNet operating income after taxes\n– Equity charge (= balance sheet total × percentage of equity × cost of equity)\n– Debt charge (= balance sheet total × percentage of debt × cost of debt)\n= Residual income\nEUR 900,000\n– EUR 400,000 (= EUR 10,000,000 × 0.40 × 0.10)\n– EUR 360,000 (= EUR 10,000,000 × 0.60 × 0.06)\n= EUR 140,000\nB. EUR 230,000. — Correct\nCorrect because all financing costs (cost of equity and cost of debt) need to be subtracted from net operating income after taxes to arrive at residual income as follows:\nNet operating income after taxes\n– Equity charge (= balance sheet total × percentage of equity × cost of equity)\n– Debt charge (= balance sheet total × percentage of debt × cost of debt × (1 – tax rate)\n= Residual income\nEUR 900,000\n– EUR 400,000 (= EUR 10,000,000 × 0.40 × 0.10)\n– EUR 270,000 (= EUR 10,000,000 × 0.60 × 0.06 × 0.75)\n= EUR 230,000\nC. EUR 500,000. — Incorrect\nIncorrect because only the cost of equity is subtracted from net operating income after taxes. The incorrect calculation of residual income is as follows:\nNet operating income after taxes\n– Equity charge (= balance sheet total × percentage of equity × cost of equity)\n= Residual income\nEUR 900,000\n– EUR 400,000 (= EUR 10,000,000 × 0.40 × 0.10)\n= EUR 500,000", "ko": "RI = NOPAT − 자기자본 비용 − 세후 부채 비용. 자기자본 비용 = 10m × 40% × 10% = 400,000. 세후 부채 비용 = 10m × 60% × 6% × (1 − 25%) = 270,000. RI = 900,000 − 400,000 − 270,000 = EUR 230,000.", "trap": "NOPAT에서 빼는 부채 비용은 세후 금리로.", "f": "RI = NOPAT − (E × re) − (D × rd × (1 − t))", "why": {"A": "이자의 세금 절감을 무시하고 세전 부채 비용(360,000)을 뺐습니다.", "C": "자기자본 비용만 빼고 부채 비용을 빼지 않았습니다."}, "orig": "Mock 2 Session 2 Q40", "conf": false}, {"id": "mock2-2-Q41", "src": "정답", "module": "FSA", "tag": "CET1 비율", "vig": 10, "stem": "Gowran's pro forma Common Equity Tier 1 Capital ratio is closest to:", "opts": {"A": "14.5%.", "B": "15.0%.", "C": "15.5%."}, "ans": "A", "en": "A. 14.5%. — Correct\nCorrect because at year end, Gowran's Risk-Weighted Assets was $100 billion. Risk-Weighted Assets is the combination of various risk-weighted asset types including; credit risk, market risk, and operational risk. As the regulator has stated Gowran must hold an additional $3.5 billion of operational risk-weighted assets, the proforma amount becomes $103.5 billion. Common Equity Tier 1 Capital ratio is the bank's Common Equity Capital Tier 1 Capital divided by Risk-Weighted Assets. Pro forma for the actions which occurred after Gowran's year end, this ratio would be calculated as follows: $15 billion / ($100 billion + $3.5 billion) = 14.49% ~ 14.5%.\nAt year end, Gowran's Common Equity Capital Tier 1 Capital was $15 billion and this is not impacted by the fact that Gowran raised Additional Tier 1 Capital of $1 billion. Raising Additional Tier 1 Capital would increase the bank's Total Tier 1 Capital, but not its Common Equity Tier 1 Capital.\nCommon Equity Tier 1 Capital includes common stock, issuance surplus related to common stock, retained earnings, accumulated other comprehensive income, and certain adjustments including the deduction of intangible assets and deferred tax assets.\nB. 15.0%. — Incorrect\nIncorrect because this indicates that neither of the actions that occurred after year end affected the Common Equity Tier 1 Capital Ratio (i.e., $15 billion / $100 billion = 15.0%)\nWhile the issuance of Additional Tier 1 Capital is correctly excluded from the Common Equity Tier 1 Capital Ratio, the additional operational risk-weighted assets should be included. The latter might be assumed to be true if the only type of risk-weighted assets related to credit risk and while it is typically the largest component of risk-weighted assets for a bank, it is not the only type.\nC. 15.5%. — Incorrect\nIncorrect because this would be the pro forma Common Equity Tier 1 Capital ratio at year end for Gowran if both actions occurring after year end were assumed to have an effect on the ratio as follows: ($15 billion + $1 billion) / ($100 billion + $3.5 billion) = 15.46% ~ 15.5%.", "ko": "CET1 비율 = CET1 자본 / 위험가중자산. Additional Tier 1 발행은 Tier 1 전체는 늘리지만 CET1에는 들어가지 않는다 → CET1은 $15bn 그대로. 운영위험 RWA가 $3.5bn 늘어 RWA = $103.5bn. 15 / 103.5 = 14.5%.", "trap": "AT1은 CET1이 아니다. 운영위험 RWA도 RWA에 포함된다.", "f": "CET1 ratio = CET1 capital / RWA", "why": {"B": "추가된 운영위험 RWA를 반영하지 않았습니다.", "C": "AT1 $1bn을 CET1에 잘못 더했습니다."}, "orig": "Mock 2 Session 2 Q41", "conf": true}, {"id": "mock2-2-Q42", "src": "오답", "module": "FSA", "tag": "대손충당금 / 부실채권 비율", "vig": 10, "stem": "Over the most recent year, the ratio of Gowran's allowances for loan losses to non-performing loans:", "opts": {"A": "decreased.", "B": "not changed.", "C": "increased."}, "ans": "B", "en": "A. decreased. — Incorrect\nIncorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nThe conclusion that the ratio decreased could be derived if provision for loan losses during the year was subtracted rather than added when calculating the allowance for loan losses at the end of the year.\nAllowance for loan losses at start of year\t1,500\nSubtract: Provision for loan losses during the year\t500\nSubtract: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t800\nThen the calculation of the ratio of allowances for loan losses to non-performing loans becomes;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t800\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.33\nB. not changed. — Correct\nCorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nFirst, we calculate the allowance for loan losses at the end of the year on the basis that provision for loan losses is an income statement expense account that increases the amount of the allowance for loan losses. Actual loan losses (i.e., charge-offs—net of recoveries) reduce the amount of the allowance for loan losses.\nAllowance for loan losses at start of year\t1,500\nAdd: Provision for loan losses during the year\t500\nSubtract: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t1,800\nThen, we calculate the ratio of allowances for loan losses to non-performing loans;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t1,800\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.75\nC. increased. — Incorrect\nIncorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nThe conclusion that the ratio increased could be derived if the net charge-offs were added rather than subtracted in calculating the allowance for loan losses at the end of the year.\nAllowance for loan losses at start of year\t1,500\nAdd: Provision for loan losses during the year\t500\nAdd: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t2,200\nThen the calculation of the ratio of allowances for loan losses to non-performing loans becomes;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t2,200\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.92", "ko": "기말 충당금 = 기초 1,500 + 대손상각비(provision) 500 − 순상각(charge-off) 200 = 1,800. 비율: 기초 1,500 / 2,000 = 0.75, 기말 1,800 / 2,400 = 0.75 → 변화 없음.", "trap": "provision은 충당금을 늘리고, charge-off는 줄인다.", "f": "기말 충당금 = 기초 + Provision − Net charge-offs", "why": {"A": "provision을 빼서 기말 충당금을 800으로 계산했습니다.", "C": "charge-off를 더해서 기말 충당금을 2,200으로 계산했습니다."}, "orig": "Mock 2 Session 2 Q42", "conf": true}, {"id": "mock2-2-Q43", "src": "정답", "module": "FSA", "tag": "IFRS 연금비용 항목", "vig": 10, "stem": "Regarding Plan A, which of the following would be recognized as an expense on Gowran's income statement?", "opts": {"A": "Remeasurements", "B": "Plan contributions", "C": "Past service costs"}, "ans": "C", "en": "A. Remeasurements — Incorrect\nIncorrect because under IFRS, remeasurements are recognized in other comprehensive income on the balance sheet, not as a pension expense in the income statement.\nIn contrast, under US GAAP, all actuarial gains and losses and differences between the expected and actual return on pension assets (remeasurements in IFRS) can be reported either in P&L or, the more commonly chosen approach, in OCI and amortized to the income statement.\nB. Plan contributions — Incorrect\nIncorrect because under IFRS, pension expense does not consider employer’s contributions to the plan (nor the settlement of benefits via payments to retirees); it is a non-cash accrual based on the change in the net pension liability or asset. Plan contributions are recognized on the statement of cash flows, typically in operating activities.\nC. Past service costs — Correct\nCorrect because under IFRS, both current and past service costs are recognized as a pension expense in the income statement. Past service cost is incurred if plan amendments are made that change the pension obligation relating to employees’ service in prior periods. Under IFRS, service costs are recognized as an operating expense on the income statement. The treatment differs under US GAAP, where only current service cost is recognized as an operating expense in the income statement.", "ko": "IFRS에서 손익계산서에 들어가는 연금비용은 근무원가(당기 + 과거 근무원가)와 순이자비용이다. 과거 근무원가(plan 변경으로 과거 근무분 의무가 바뀐 것)는 손익에 바로 인식한다. remeasurement는 OCI로 가고, 회사의 기여금은 현금흐름표 항목이지 비용이 아니다.", "trap": "IFRS: 근무원가(과거 포함)·순이자 → P&L, remeasurement → OCI.", "f": "", "why": {"A": "IFRS에서 remeasurement는 손익이 아니라 OCI에 인식합니다.", "B": "기여금은 현금 지급일 뿐 연금비용 계산에 들어가지 않습니다."}, "orig": "Mock 2 Session 2 Q43", "conf": false}, {"id": "mock2-2-Q44", "src": "정답", "module": "FSA", "tag": "스톡옵션 행사와 납입자본", "vig": 10, "stem": "Based on Carter's assumptions regarding the exercise of the share options, paid-in capital on Gowran's balance sheet in the current year will increase by:", "opts": {"A": "$24 million.", "B": "$30 million.", "C": "$42 million."}, "ans": "B", "en": "A. $24 million. — Incorrect\nIncorrect because this ignores the $6 million transferred from share-based compensation reserve to paid-in capital and only considers the $24 million amount which is 2 million options at $12 strike price.\nB. $30 million. — Correct\nCorrect because over the vesting period Gowran will recognize the fraction of the aggregate fair value that vests on the income statement (i.e., 1/3 in this case because the vesting period is three years). The offsetting entry is made to share-based compensation reserve in equity on the balance sheet. Therefore, at the end of year 3, the share-based compensation reserve will total $15 million (5 million options × $3 fair value).\nCarter's assumption is that 2 million share options will be exercised in the current year, therefore Gowran will recognize a cash inflow in financing activities for the receipt of strike price multiplied by the number of options exercised. The entry made to the share-based compensation reserve account is transferred to paid-in capital on the balance sheet.\nIn this case, the share-based compensation reserve would reduce by $6 million (2 million options exercised at $3 fair value) and cash flow from financing activities would increase by $24 million (2 million options at $12 strike price).\nGowran's paid-in capital therefore would increase by $30 million, which includes the $24 million plus the $6 million transferred from share-based compensation reserve.\nC. $42 million. — Incorrect\nIncorrect because the adjustment to paid-in capital is incorrectly calculated as a $36 million increase which is based on 2 million options exercised at the current share price of $18 (rather than using the strike price of $12) plus the $6 million transferred from share-based compensation reserve.", "ko": "가득 기간 동안 공정가치를 비용으로 인식하면서 자본의 주식보상 적립금이 쌓였다(5m × $3 = $15m). 2m개가 행사되면 (1) 행사가로 받은 현금 2m × $12 = $24m이 납입자본에 들어오고, (2) 해당 적립금 2m × $3 = $6m이 납입자본으로 옮겨진다. 합계 $30m 증가.", "trap": "현재 주가($18)가 아니라 행사가($12). 적립금 대체($6m)도 더한다.", "f": "ΔPaid-in capital = 행사 수 × 행사가 + 행사 수 × 부여일 공정가치", "why": {"A": "주식보상 적립금에서 옮겨오는 $6m을 빠뜨렸습니다.", "C": "행사가 대신 현재 주가 $18을 썼습니다."}, "orig": "Mock 2 Session 2 Q44", "conf": true}], "vignettes": ["Bella Stone is an analyst covering Garnet Corp. To forecast the price of Garnet shares, she starts by examining related economic data and estimates a log-linear trend in the economic variable most relevant to her analysis. Stone evaluates whether the log-linear trend model suffers from serially correlated errors. The Durbin–Watson test statistic from the regression is 0.54 and the lower critical value for the Durbin–Watson statistic is dl = 1.25.\nStone predicts Garnet's EPS using quarterly data in a first-order autoregressive model, AR(1). She tests for and rejects the presence of a unit root. The model estimation is presented in Exhibit 1. In the most recent quarter, EPS was $0.96. The critical t-statistic is 2.04.\nExhibit 1\nRegression Statistics\t\nR^2\t0.2059\nStandard error\t0.0856\nObservations\t32\nDurbin–Watson statistic\t1.56\n\tCoefficient\tStandard Error\tt-Statistic\nIntercept\t0.4485\t0.1457\t3.08\nEPSt–1\t0.4541\t0.1572\t2.89\nAutocorrelations of the Residual\t\t\t\nLag\tAutocorrelation\tStandard Error\tt-Statistic\n1\t–0.0572\t0.1768\t–0.32\n2\t0.0705\t0.1768\t0.40\n3\t0.0855\t0.1768\t0.48\n4\t0.1908\t0.1768\t1.08\nStone also incorporates machine learning into her modelling. She gathers transaction-level data for a set of Garnet bonds and provides an excerpt of the dataset in Exhibit 2. Stone prepares to wrangle the extracted raw data.\nExhibit 2\nTransaction Number\tPrice\tType\tConvertible\n1\t100\tBuy\tYes\n2\t105\tSell\tN\n3\t95\tTrade\ty\n4\t101\tSell\tno\n5\t98\tBuy\tNo\nStone evaluates if the model can properly classify the \"Type\" feature into \"buy\" or \"sell,\" and examines the model training performance for validation of the model. She compiles the confusion matrix in Exhibit 3.\nExhibit 3\n\t\tActual Training Labels\t\nBuy (Class \"1\")\tSell (Class \"0\")\nPredicted Results\tBuy (Class \"1\")\t70\t40\nSell (Class \"0\")\t20\t70", "Vilem Polti, a fixed-income analyst, is evaluating three default-free bonds in Country A. The bonds each have a par value of $100, a 2-year maturity, and pay an annual coupon of 4.2%.\nBond 1: Option-free\nBond 2: Callable at par at the end of year 1\nBond 3: Putable at par at the end of year 1\nPolti estimates the binomial interest rate tree in Exhibit 1, assuming interest rate volatility of 15% and that branching from each node to an up state and to a down state occurs with equal probability. She uses the binomial interest rate tree to value Bond 2.\n[IMAGE: CFA-IS-2022.11-FIIN-Lamy+1_5010P1786416.png]\nPolti believes that recent economic events in Country A could lead to changes in the interest rates over the maturity of these bonds. As a result, she assesses the impact of the following interest rate scenarios on the estimated value of Bonds 1, 2, and 3.\nScenario 1: Interest rate volatility is lower\nScenario 2: Long-term rates fall more than short-term rates, resulting in a flat yield curve\nPolti is also evaluating a convertible bond issued by ZXEL Corporation. The convertible bond was initially sold at par ($1,000). The convertible bond pays a 3.00% annual fixed-rate coupon, has a conversion ratio of 23, and the price of ZXEL Corp. common stock is currently $47 per share. The underlying straight-bond value of the convertible bond is $990.", "Minah Lee, CFA, recently joined Caldecott Asset Management as a portfolio manager. Lee resides in a country where the securities laws and regulations are stricter than the Code and Standards. Caldecott is based in a neighboring country with securities laws and regulations that are less strict than the Code and Standards. All of Caldecott's clients are based in the firm's home country. In both countries, applicable law states that the law of the locality where business is conducted governs.\nCaldecott hires a consultant to establish an ESG screening process for stock selection. Lee prepares an investment memo recommending the new screening process to Caldecott's clients. It includes a description that states \"we will include the consultant's proprietary ESG factors when filtering out unsuitable stocks.\" The memo also discusses significant risks of the process, including that \"the ESG screening process is subjective and may contradict conclusions from other ESG selection processes.\" The memo ends by stating that \"this process will reduce the risk of portfolios suffering from unanticipated climate risk and will guarantee superior returns.\"\nLee receives automated sell recommendations from Caldecott's portfolio allocation software to ensure all client portfolios match the recommendations from the ESG screen. After securing approval from selected clients with IPS that are suitable to adopt the new ESG screen, Lee begins executing sell trades in these client accounts. Lee decides not to keep records for the sell trades since Caldecott's software has automated the ESG screen recommendations. Lee then reinvests the cash generated by the sell trades to maintain the same level of equity market exposure. She manually selects stocks to buy for the accounts and prepares notes justifying these buy trades. Lee retains trade records for five years as part of the firm's regulatory compliance.\nLee joins the board of trustees at the local university. The position is unpaid but is likely to be time consuming in the first year. She also starts a position as an adjunct professor at the university. The compensation from the university includes government-mandated defined contributions to a retirement plan. Lee decides to allocate the retirement plan assets to a large diversified mutual fund managed by Caldecott's competitor. Lee obtained written approval from Caldecott for her compensation as an adjunct professor but did not disclose her board position and how the retirement plan assets are invested.", "Jessica Gunning is an analyst reviewing US-based GameDay Inc.'s cost of capital and corporate restructuring actions.\nFor GameDay's cost of capital, Gunning begins by determining GameDay's cost of equity and uses a macroeconomic model to estimate the equity risk premium (ERP). She forecasts the data shown in Exhibit 1 and applies the Grinold-Kroner model.\nExhibit 1\nRisk-free rate\t3.0%\nInflation\t1.3%\nGrowth rate in P/E ratio\t0.0%\nS&P 500 dividend yield\t1.8%\nPercent change in shares outstanding\t–0.2%\nReal GDP growth\t2.6%\nNext, Gunning estimates GameDay's current cost of debt. GameDay has a single outstanding bond issue – a straight unsecured bond with a remaining maturity of four-years. The issue is thinly traded and there is no reliable market-based YTM available. Gunning uses matrix pricing to estimate the bond's yield. She notes that the average YTM on similarly rated bonds at more liquid two- and five-year maturities are 5.57% and 6.14%, respectively.\nTo improve sales in a new product segment, GameDay recently acquired StopGap Inc. for $33.80 per share. Gunning assesses whether the acquisition was fairly priced using the comparable transactions method and the information in Exhibit 2. When calculating a weighted average estimated price, she assigns a weight of 50% to the price-to-sales (P/S) multiple, and a 25% weight to each of the other two multiples. She considers the acquisition to be fairly priced if the price paid is within $1 of her estimate on a per share basis.\nExhibit 2\nComparable Transactions Information\t\nP/E ratio\t16.2\nP/B ratio\t2.9\nP/S ratio\t2.1\nStopGap Inc. Information\t\nEPS\t$2.20\nBook value per share\t$8.40\nSales per share\t$17.90\nSeveral months pass and GameDay announces that a rival firm has offered $1.6 billion to acquire its Southern product segment. Southern has produced EBITDA of $140 million in the most recent year and Gunning estimates that a spinoff of Southern would achieve an EV/EBITDA multiple of 14. She evaluates which is the better choice: accept the divestment offer or begin the spinoff process of the segment.", "Stephen Russo is a treasury analyst at Central Finance Inc., which specializes in financing equipment and real estate. Russo and his manager, Ericka Patry, meet to discuss anticipated changes to interest rates and the potential impact on Central Finance's portfolio.\nPatry and Russo discuss the differences between Treasury rates and swap rates for the same maturity. Russo makes the following two comments.\nComment 1: Differences between the two rates arise because of differences in default risk and liquidity risk\nComment 2: Given the opportunity for arbitrage, differences between the two rates are minimal\nIn Exhibit 1, Patry presents current government bond spot rates and swap rates for annual maturities up to three years.\nExhibit 1\n\t1-year\t2-year\t3-year\nSwap rates\t2.97%\t3.26%\t3.43%\nTreasury spot rates\t2.88%\t3.10%\t3.21%\nUsing the government rates, Russo determines the forward rate for a 1-year zero coupon bond issued one year from today.\nPatry and Russo next discuss the term structure of interest rates. Russo accepts the theory that yields are solely a function of the supply and demand for funds at a particular maturity.\nCentral Finance manages yield curve risk using key rate durations and reviews portfolio exposures when there is a 25 basis point change in the yield curve. For one of the firm's real estate portfolios, Patry shares with Russo the key rate durations and expected change in yield curve at various maturities in Exhibit 2.\nExhibit 2\nMaturity\tKey Rate Duration\tChange in Yield Curve (bps)\n1 year\t0.4444\t18\n5 years\t0.5129\t35\n10 years\t1.1030\t57", "Joao Viniciu is an equity analyst researching Pedra S.A., a Brazilian multinational corporation. Pedra reports under IFRS with a fiscal year end of 31 December. Its reporting currency is the Brazilian Real (BRL).\nViniciu analyzes the sustainability of net sales growth for each of Pedra’s geographic segments. Exhibit 1 shows the components of total net sales growth for each of these segments.\nExhibit 1\nGeographic Segment\tContribution from Volume Growth\tContribution from Price Growth\tContribution from Foreign Currency Exchange\tTotal Net Sales Growth\nEurope\t4.6%\t1.9%\t1.4%\t7.9%\nAmericas\t0.7%\t1.1%\t4.3%\t6.1%\nAsia Pacific\t3.6%\t2.1%\t1.8%\t7.5%\nFor his research, Viniciu uses the BRL/USD (number of BRL per 1 USD) exchange rate information for the most recent year as shown in Exhibit 2.\nExhibit 2\n\tBRL/USD\n1 January\t5.07\n1 November\t5.53\n31 December\t5.45\nAverage for the year\t5.26\nOn 1 November of the most recent year, Pedra purchased imported goods worth USD 3.2 million on credit from an unaffiliated US supplier. The amount payable for these imported goods by Pedra was still outstanding as of 31 December.\nCarro Corp. is one of Pedra’s wholly-owned US-based subsidiaries. Pedra translates Carro’s financial statements using the current rate method based on the rates in Exhibit 2. Carro's only non-monetary assets are inventory and fixed assets, while all of its liabilities are monetary. Carro's inventory and fixed assets were purchased at a BRL/USD rate of 5.24. Viniciu analyzes the effect of the translation method on Carro’s debt-to-assets ratio for the most recent year.\nOver the current year, Viniciu expects that Carro will maintain a stable net asset balance sheet exposure and that the BRL will weaken against the USD.", "Ryan Tan is the chief investment officer of an endowment portfolio. The portfolio has 20% of its assets invested in two hedged funds, with an equal proportion invested in each fund. The investment strategies used by the two hedge funds are as follows.\nFund 1 uses equity market-neutral strategies\nFund 2 applies an event-driven strategy focusing on distressed securities\nThe endowment is considering investing in just one hedge fund. Tan performs a scenario analysis to better understand relative performance if the entire 20% allocation is invested in one fund. For this analysis, Tan considers a third hedge fund for possible investment. Tan's objective is to select the fund that would maximize the endowment portfolio's risk-adjusted return, where risk is defined as downside deviation. Exhibit 1 shows the risk-return characteristics of the overall portfolio with a 20% allocation to either Fund 1, Fund 2, or Fund 3.\nExhibit 1\n\tStandard Deviation\tSharpe Ratio\tSortino Ratio\nAllocation to Fund 1\t8.2%\t0.81\t1.5\nAllocation to Fund 2\t8.3%\t0.82\t1.3\nAllocation to Fund 3\t7.9%\t0.80\t1.4\nFinally, Tan evaluates whether it would be better to reallocate the endowment's 20% hedge funds investment to Fund 4, a fund-of-funds. This allocation would give the endowment portfolio exposure to multiple distinct hedge fund strategies.", "Judy West is a trader who is training a new hire, Alex Carter, on the application of option pricing models.\nWest and Carter first discuss how to estimate the value of a European-style call option using a two-period binomial model on a non-dividend paying stock. The inputs are:\ncurrent stock price (S) is $100\nexercise price (X) is $100\nup factor (u) is 1.4, down factor (d) is 0.7\nrisk-free rate is 3%\nWest then reviews the Black-Scholes-Merton (BSM) model and presents information in Exhibit 1. She explains this information can be used to structure a delta hedge for option positions. West presents an example of delta hedging a short call position on 5,000 shares of an underlying stock. She asks Carter to determine the optimal number of shares of stock to buy to hedge the short call position.\nExhibit 1\nN(d1)\tN(d2)\tN(–d1)\tN(–d2)\n0.589\t0.505\t0.411\t0.495\nWest next sets up a gamma hedging exercise. She shows Carter how to predict the change in call price for a given change in the underlying stock price for the three calls in Exhibit 2. All three calls have the same time to expiration. West explains how including gamma improves the accuracy of the prediction.\nExhibit 2\nCurrent stock price\t$100\nCall 1 strike price\t$90\nCall 2 strike price\t$100\nCall 3 strike price\t$110\nFinally, West presents volatility data and her forecast in Exhibit 3 for three put options on different securities. She discusses how to use this data to benefit if her forecast on volatility is correct.\nExhibit 3\nVolatility\tPut A\tPut B\tPut C\nHistorical\t15%\t17%\t23%\nImplied\t19%\t16%\t18%\nForecast\t17%\t22%\t16%", "Mary Navarro, a portfolio manager, is analyzing the effect of current macroeconomic factors on various asset classes and is researching actively managed funds.\nNavarro first evaluates the effect of macroeconomic factors on the P/E ratio and the performance of equities. She considers the following three scenarios over the next 10 years:\nScenario 1: Real GDP growth volatility and inflation expectations both increase.\nScenario 2: There is declining uncertainty about future inflation.\nScenario 3: Expected real earnings growth and the equity risk premium both increase.\nNavarro next reviews the performance of an active portfolio that does not have any short-selling restrictions. Exhibit 1 summarizes the returns, allocations, and performance statistics for the active portfolio and the benchmark. Using this information, Navarro evaluates the sources of value added.\nExhibit 1\n\tPortfolio\t\tBenchmark\t\nReturn\tAllocation\tReturn\tAllocation\nEquities\t10%\t70%\t8%\t60%\nFixed income\t4%\t30%\t5%\t40%\nActive return\t1.40%\t\t---\t\nActive risk\t10.00%\t\t---\t\nStandard deviation\t21%\t\t17%\t\nSharpe ratio\t0.29\t\t0.28\t\nNavarro believes that the realized performance statistics in Exhibit 1 are reasonable estimates for the future. She determines that the optimal level of active risk is 8.50% and investigates whether the Sharpe ratio of the active portfolio can be improved by combining investments in this portfolio and the benchmark.\nSeveral months later, Navarro reviews three recent developments regarding the active portfolio in Exhibit 1. Using the expanded fundamental law of active management, Navarro evaluates the effect of the following events on the information ratio of the active portfolio.\nEvent 1: The portfolio rebalancing frequency has been changed from semiannual to quarterly.\nEvent 2: The portfolio manager has added two analysts with strong forecasting ability.\nEvent 3: Short-selling restrictions have been added to the portfolio's IPS.", "Malte Kaufmann is an equity analyst initiating coverage on several listed stocks.\nFirst, Kaufmann determines the sustainable growth rates for Company A and Company B using the PRAT model. Company A and Company B have identical total asset turnover ratios, but Company A has a higher payout ratio, higher profit margin, and higher equity multiplier. Based on the PRAT model, Kaufmann concludes that Company A has a lower sustainable growth rate than Company B.\nKaufmann uses the two-stage DDM to value Company B's shares, which are currently trading at EUR 42.37. He forecasts that the current dividend (D0) of EUR 1.40 will grow by 12% per year for the next two years. Thereafter, Kaufmann assumes that the growth rate will decline to 6% and remain at that level indefinitely. He estimates the required return on equity to be 10%. Kaufmann considers a share to be fairly valued if its price is within +/–5% of the estimated model value.\nNext, Kaufmann considers three companies to add to his list of covered firms. Based on the historical data in Exhibit 1, which covers the 5-year period up to the most recent year (Year 0), Kaufmann assesses which of the three companies is most suitable for valuation using the Gordon growth model.\nExhibit 1\n\tCompany C\t\tCompany D\t\tCompany E\t\nYear\tPayout Ratio\tDividend (USD)\tPayout Ratio\tDividend (USD)\tPayout Ratio\tDividend (USD)\n–4\t0.92\t5.25\t0.38\t12.00\t0.62\t3.22\n–3\t0.32\t5.51\t0.42\t12.61\t0.63\t3.18\n–2\t1.09\t5.84\t0.40\t13.29\t0.70\t3.20\n–1\t0.13\t6.16\t0.39\t13.88\t0.80\t3.23\n0\t0.61\t6.44\t0.40\t14.59\t0.83\t3.18\nFinally, Kaufmann calculates residual income for Company C in the current year. He uses the following information for Company C:\nTotal assets of EUR 10 million, financed with 40% equity and 60% debt\nNet operating profit after taxes of EUR 900,000\nTax rate of 25%\nCost of equity of 10%\nBefore-tax cost of debt of 6%\nInterest is tax deductible", "Darren Carter is a credit analyst reviewing Gowran Bank. The bank is subject to the Basel III regulatory framework and prepares its financial statements under IFRS.\nCarter first considers Gowran's capital adequacy. For the most recent year end, Gowran reported Common Equity Tier 1 Capital of $15 billion and risk-weighted assets of $100 billion. Carter determines Gowran's pro forma year-end Common Equity Tier 1 Capital ratio to account for the following two events, which occurred after the most recent year end.\nGowran issued $1 billion of Additional Tier 1 Capital.\nThe regulator required Gowran to recognize an additional $3.5 billion of operational risk-weighted assets.\nCarter next assesses Gowran's asset quality by analyzing the adequacy of its allowance for loan losses. Specifically, he examines how the ratio of the bank's allowance for loan losses to non-performing loans changed during the most recent year based on the data (in millions) in Exhibit 1.\nExhibit 1\nNon-performing loans at start of year\t$2,000\nNon-performing loans at end of year\t$2,400\nAllowance for loan losses at start of year\t$1,500\nProvision for loan losses during the year\t$500\nCharge-offs, net of recoveries, during the year\t$200\nGowran has a defined benefit pension plan (Plan A) that is closed to new members. Carter determines the effect of this pension plan on Gowran's income statement.\nAs part of its executive management compensation, Gowran also has a stock option plan (Plan B). Three years ago, Gowran granted executives 5 million at-the-money stock options with a three-year vesting period. On the grant date, Gowran's share price was $12 and the fair value of each option was $3. All of the options are now vested in the current year. Carter determines the effect on Gowran's paid-in capital on its balance sheet in the current year, assuming that 2 million of the stock options are exercised at the strike price of $12 and Gowran's share price is currently $18."], "modules": {"QM": "Quantitative Methods", "CI": "Corporate Issuers", "FSA": "Financial Statement Analysis", "EQ": "Equity Valuation", "FI": "Fixed Income", "DER": "Derivatives", "AI": "Alternative Investments", "PM": "Portfolio Management", "ETH": "Ethical and Professional Standards"}, "images": {"CFA-IS-2022.11-FIIN-Lamy+1_5010P1786416.png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfkAAAEkCAYAAAAsFkgVAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAfntJREFUeJzs3WmwrWdZJ/zV3Y4g86iIhEEEGUWQAIEwBEiYAgmz0igqtvqhy+oPfrCqu8ovdpVV3VXd1YOiTTOLEMYkQCCQQBjCHCZlBsM8hnnQ7vd9f7fvf3vl9ln77H3O2efsvfb1r1q11nqG+7mf6f5f8/0j/8//h1Wj0Wg0Go2Nw4+c7A40Go1Go9H <script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules, IMG = DATA.images || {};
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = DATA.meta.subject, KEY = SUBJECT+"_quiz_state_v1", EXPKEY = SUBJECT+"_quiz_exports_v1", CONFKEY = SUBJECT+"_confused_v1", UIKEY = SUBJECT+"_ui_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
// 헷갈림: 원본 txt의 "헷갈림:" 번호가 기본값, 화면에서 켜고 끈 것은 CONF.ids에 덮어씀
var CONF = store.get(CONFKEY) || {ids:{}, at:""};
// 학습 화면(문제+정답+해설) 상태는 풀이 기록(S)과 따로 둔다
var UI = store.get(UIKEY) || {view:null};
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }
function saveUI(){ store.set(UIKEY,UI); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables + [IMAGE: 파일명]
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], im=/^\[IMAGE: (.+)\]$/.exec(l.trim());
    if(im){ flush(); if(IMG[im[1]]) html+='<p><img class="exh" src="'+IMG[im[1]]+'" alt="'+esc(im[1])+'"></p>'; continue; }
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]||m; }
function srcClass(s){ return s==="오답"?"src-wrong":"src-rel"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }
function isWrong(q){ return q.src==="오답"; }
function isConf(q){ var v=CONF.ids[q.id]; return v===undefined ? !!q.conf : !!v; }
function toggleConf(id){
  var q=BYID[id]; CONF.ids[id]=!isConf(q);
  if(CONF.ids[id]===!!q.conf) delete CONF.ids[id]; // 원래 값으로 돌아오면 덮어쓴 기록 삭제
  CONF.at=new Date().toISOString(); store.set(CONFKEY,CONF);
}
function confBtn(q){ return '<button class="btn conf'+(isConf(q)?' on':'')+'" id="bConf" title="헷갈린 문제로 표시/해제">'+(isConf(q)?'★ 헷갈림':'☆ 헷갈림')+'</button>'; }
function metaHtml(q, no){
  return '<div class="meta"><span class="qno">'+no+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span>'+
    (isConf(q)?'<span class="pill src-var">헷갈림</span>':'')+'<span class="tagline">'+esc(q.tag)+'</span><span style="flex:1"></span>'+confBtn(q)+'</div>';
}
// 범위: wrong = 오답만, wc = 오답+헷갈림, all = 전체
var FILT = {wrong:"오답만", wc:"오답+헷갈림", all:"전체"};
function pick(f, m){
  return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (f==="all" || isWrong(q) || (f==="wc" && isConf(q))); }).map(function(q){return q.id;});
}

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
var MODE = {all:"전체 풀기", list:"학습한 목록 풀기", wrong:"오답만 풀기", wc:"오답+헷갈림 풀기", review:"틀린 문제 다시 풀기", rwc:"틀린+헷갈림 다시 풀기"};
function header(){
  if(UI.view==="study"){ var T=UI.study; $("nOk").textContent="-"; $("nBad").textContent="-"; $("pbar").style.width=((T.i+1)/T.ids.length*100)+"%"; $("ptxt").textContent=(T.i+1)+" / "+T.ids.length; $("pmode").textContent="해설 보며 학습 · "+T.label; return; }
  if(!S || !S.order){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=MODE[S.mode]||"";
}

/* ---------- setup screen ---------- */
function setup(){
  UI.view=null; saveUI();
  S && (S.view="setup", save());
  var wrongAll=Q.filter(isWrong).length, confAll=Q.filter(isConf).length;
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 토픽 ('+Q.length+')</option>'+Object.keys(MN).filter(function(m){return counts[m];}).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  var f = UI.filt || "wc";
  document.body.classList.remove("wide");
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">'+esc(DATA.meta.title)+' 오답 퀴즈</h2>'+
   '<p class="muted">전체 '+Q.length+'문제 · 내가 틀린 문제 '+wrongAll+' · 헷갈린 문제 '+confAll+'. 정답과 영어 해설은 CFA Institute 원문, 한국어 해설은 원문을 바탕으로 작성했습니다. 헷갈림 표시는 문제 화면의 ☆ 버튼으로 켜고 끌 수 있습니다.</p>'+
   '<label>토픽 <select id="selMod">'+opts+'</select></label>'+
   '<div class="seg" id="segF">'+Object.keys(FILT).map(function(k){return '<button class="btn'+(k===f?' on':'')+'" data-f="'+k+'">'+FILT[k]+' <span id="n_'+k+'"></span></button>';}).join("")+'</div>'+
   '<p class="kbd">풀기: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 / 학습: ← → 이동</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">풀기</button> <button class="btn" id="bStudy">해설 보며 학습</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function labels(){
    var m=$("selMod").value;
    Object.keys(FILT).forEach(function(k){ $("n_"+k).textContent="("+pick(k,m).length+")"; });
    var n=pick(f,m).length; $("bStart").textContent=FILT[f]+" 풀기 ("+n+")"; $("bStudy").textContent=FILT[f]+" 해설 보며 학습 ("+n+")";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(b){ b.onclick=function(){
    f=b.getAttribute("data-f"); UI.filt=f; saveUI();
    Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(x){ x.classList.toggle("on", x===b); }); labels(); }; });
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){
    var order=pick(f,$("selMod").value); if(!order.length){ alert("이 범위에는 문제가 없습니다."); return; }
    S=fresh(order,f); save(); render();
  };
  $("bStudy").onclick=function(){
    var m=$("selMod").value, ids=pick(f,m); if(!ids.length){ alert("이 범위에는 문제가 없습니다."); return; }
    startStudy(ids, FILT[f]+(m==="all"?"":" · "+mname(m)));
  };
  header();
}

/* ---------- 지문 패널: 지문이 있는 문제는 왼쪽에 지문, 오른쪽에 문제·보기·해설 ---------- */
function split(q, html){
  var has = q.vig!==null && q.vig!==undefined;
  document.body.classList.toggle("wide", has);
  if(!has) return html;
  var old=document.querySelector(".vpane"), keep=(old && old.getAttribute("data-v")===String(q.vig)) ? old.scrollTop : 0;
  setTimeout(function(){ var n=document.querySelector(".vpane"); if(n) n.scrollTop=keep; },0);
  return '<div class="split"><aside class="vpane" data-v="'+q.vig+'"><div class="vhead">케이스 지문 (Vignette)</div>'+rich(VIG[q.vig])+'</aside><div class="qpane">'+html+'</div></div>';
}

/* ---------- study screen: 문제 + 정답 + 해설을 같이 본다 ---------- */
function startStudy(ids, label){ UI.view="study"; UI.study={ids:ids, i:0, label:label}; saveUI(); study(); window.scrollTo(0,0); }
function study(){
  var T=UI.study, id=T.ids[T.i], q=BYID[id];
  var vig = '';
  var optsHtml = ["A","B","C"].map(function(L){
    return '<div class="opt'+(L===q.ans?' sel-ok':'')+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+
      (L!==q.ans && q.why && q.why[L] ? '<span class="whyl">'+esc(q.why[L])+'</span>' : '')+'</span></div>';
  }).join("");
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  $("view").innerHTML=split(q, '<section class="card">'+metaHtml(q, esc(q.orig))+vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div>'+
    '<div class="fb ok"><h3>정답 '+q.ans+'</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+trap+
    '<details class="en"><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details></div>'+
    '<div class="nav"><button class="btn" id="sPrev" '+(T.i===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+(T.i+1)+' / '+T.ids.length+'</span>'+
    '<button class="btn primary" id="sNext" '+(T.i===T.ids.length-1?'disabled':'')+'>다음 →</button></div>'+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="btn" id="sQuiz">이 목록 풀기 ('+T.ids.length+')</button><button class="btn" id="sHome">처음 화면</button></div></section>');
  $("sPrev").onclick=function(){ studyGo(T.i-1); };
  $("sNext").onclick=function(){ studyGo(T.i+1); };
  $("sQuiz").onclick=function(){ UI.view=null; saveUI(); S=fresh(T.ids.slice(),"list"); save(); render(); };
  $("sHome").onclick=setup;
  $("bConf").onclick=function(){ toggleConf(id); study(); };
  header();
}
function studyGo(i){ var T=UI.study; if(i<0||i>=T.ids.length) return; T.i=i; saveUI(); study(); window.scrollTo(0,0); }

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card">'+metaHtml(q,'Q'+(S.idx+1))+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=split(q, html);
  Array.prototype.forEach.call(document.querySelectorAll("button.opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  $("bConf").onclick=function(){ toggleConf(id); quiz(); };
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  var wcIds=S.order.filter(function(id){var r=S.round[id];return (r&&!r.correct) || isConf(BYID[id]);});
  document.body.classList.remove("wide");
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"||S.mode==="rwc"?"다시 풀기 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">토픽별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bRetryWC" '+(wcIds.length?'':'disabled')+'>틀린 문제 + 헷갈림 다시 풀기 ('+wcIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  function retry(ids, mode){ if(!ids.length) return; S.order=ids; S.idx=0; S.mode=mode; S.round={}; S.finished=false; S.view="quiz"; save(); render(); }
  $("bRetry").onclick=function(){ retry(wrongIds,"review"); };
  $("bRetryWC").onclick=function(){ retry(wcIds,"rwc"); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S || !S.order){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, confused:isConf(q), selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak,
    confusedOverrides:CONF.ids
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{이름}/latest.json)의 마지막 attempt로 진행 상태와 헷갈림 표시를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  if(at.confusedOverrides){ CONF={ids:at.confusedOverrides, at:at.exportedAt||""}; store.set(CONFKEY,CONF); }
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:MODE[at.mode]?at.mode:"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  UI.view=null; saveUI();
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기·헷갈림 변경보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(CONF.at>t) t=CONF.at;
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(UI.view!=="study" && (!S || S.view==="setup")){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(UI.view==="study" && UI.study && UI.study.ids && UI.study.ids.length) return study();
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} UI.view=null; saveUI(); S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(UI.view==="study"){ if(e.key==="ArrowRight") studyGo(UI.study.i+1); else if(e.key==="ArrowLeft") studyGo(UI.study.i-1); return; }
  if(!S||S.view!=="quiz"||!document.querySelector("button.opt")) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>

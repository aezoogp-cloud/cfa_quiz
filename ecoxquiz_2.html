<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ECOx Mock 2 — CFA Level II</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1d2330;--mut:#5d6677;--bd:#d5d9e0;--acc:#1f5fbf;--accbg:#e6efff;--ok:#1b7f45;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fbe9e7;--flag:#c77700;--flagbg:#fff1d6;--hl:#fff176}
body.dark{--bg:#14171d;--panel:#1d222b;--fg:#e4e8ef;--mut:#9aa3b2;--bd:#343b48;--acc:#6ea8ff;--accbg:#22314d;--ok:#5fd18b;--okbg:#17332379;--bad:#ff8a80;--badbg:#3d1f1c;--flag:#ffb74d;--flagbg:#3d2f14;--hl:#6b5f00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
textarea{width:100%;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px}
#top{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--bd);flex:none;flex-wrap:wrap}
#top .grow{flex:1}
#timer{font:600 20px/1 ui-monospace,Menlo,monospace}
#timer.low{color:var(--bad)}
#main{flex:1;min-height:0;display:flex}
#left,#right{overflow:auto;padding:14px 18px}
#left{flex:1 1 50%;border-right:1px solid var(--bd);background:var(--panel)}
#right{flex:1 1 50%}
#bottom{flex:none;background:var(--panel);border-top:1px solid var(--bd);padding:6px 14px;display:flex;gap:10px;align-items:center}
#nav{display:flex;flex-wrap:wrap;gap:3px;flex:1;max-height:96px;overflow:auto}
.nb{width:30px;height:26px;padding:0;font-size:12px;position:relative}
.nb.ans{background:var(--accbg);border-color:var(--acc)}
.nb.cur{outline:2px solid var(--acc);outline-offset:1px;font-weight:700}
.nb.fl::after{content:"";position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:var(--flag);border-right-color:var(--flag)}
.nb.setstart{margin-left:8px}
#left table{border-collapse:collapse;margin:10px 0;font-size:14px}
#left th,#left td{border:1px solid var(--bd);padding:3px 9px}
#left th{background:var(--bg)}
#left caption{font-weight:600;text-align:left;padding-bottom:4px}
.vh{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;gap:8px;align-items:center}
mark{background:var(--hl);color:inherit}
.vb{transition:opacity .15s}
.vb.dim{opacity:.35}
#relbtn.on{background:var(--accbg);border-color:var(--acc)}
.nb.nno{color:var(--bad);border-color:var(--bad)}
.nb.out{opacity:.35}
.nb.rok{color:var(--ok);border-color:var(--ok)}
.nb.rvd::before{content:"✓";position:absolute;left:2px;bottom:-1px;font-size:9px;color:var(--ok)}
.sl{font-size:11px;color:var(--mut);align-self:center;margin:0 2px 0 8px}
.why{font-size:13px;color:var(--mut);margin-top:4px}
.note{display:grid;grid-template-columns:40px 1fr;gap:10px 12px;font-size:14px;line-height:1.65;border-top:1px solid var(--bd);margin-top:16px;padding-top:14px}
.nl{font-size:12px;font-weight:600;color:var(--mut);padding-top:2px}
.raw{margin-top:10px;font-size:13px;color:var(--mut)}
.raw .expl{color:var(--fg)}
.sh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#doneb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.stem{font-size:16px;margin:4px 0 14px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin:8px 0;background:var(--panel);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.sel{background:var(--accbg);border-color:var(--acc)}
.opt .l{font-weight:700;min-width:20px}
.opt .t{flex:1}
.opt.strike .t{text-decoration:line-through;opacity:.5}
.opt .x{padding:0 6px;font-size:12px;color:var(--mut)}
.flagbtn.on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.center{max-width:860px;margin:0 auto;padding:22px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px 20px;margin:12px 0}
h1,h2,h3{margin:.4em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
table.r{border-collapse:collapse;width:100%;font-size:14px}
table.r th,table.r td{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left}
table.r td.n,table.r th.n{text-align:right}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.opt{cursor:default}
body.live .opt{cursor:pointer}
.expl{white-space:pre-wrap;font-size:14px;border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;color:var(--mut)}
.warn{color:var(--bad)}.okc{color:var(--ok)}.mut{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:520px;margin:0}
#pauseov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center}
#pauseov.show{display:flex}
#pauseov .card{max-width:440px;text-align:center;margin:0}
#pauseov .big{font:600 44px/1.2 ui-monospace,Menlo,monospace}
@media (max-width:900px){#main{flex-direction:column}#left{border-right:0;border-bottom:1px solid var(--bd);flex:1 1 0;min-height:0}#right{flex:0 0 auto;max-height:45%;padding:8px 18px}#nav{display:none}#bottom{justify-content:center}}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100%"></div>
<div id="pauseov" role="dialog" aria-modal="true" aria-label="일시정지"></div>
<script>
"use strict";
const DATA = {"mock": 2, "sets": [{"set": 1, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Rowan Madison is a junior analyst at Cardinal Capital. Sage Winter, a senior portfolio manager and Madison’s supervisor, meets with Madison to discuss interest rates and review two bond positions in the firm’s fixed-income portfolio.<\/p><p>Winter begins the meeting by asking Madison to state her views on the term structure of interest rates. Madison responds:<\/p><p>“Yields are a reflection of expected spot rates and risk premiums. Investors demand risk premiums for holding long-term bonds, and these risk premiums increase with maturity.”<\/p><p>Winter tells Madison that, based on recent changes in spreads, she is concerned about a perceived increase in counterparty risk in the economy and its effect on the portfolio. Madison asks Winter:<\/p><p>“Which spread measure should we use to assess changes in counterparty risk in the economy?”<\/p><p>Winter is also worried about the effect of yield volatility on the portfolio. She asks Madison to identify the economic factors that affect short-term and long-term rate volatility. Madison responds:<\/p><p>“Short-term rate volatility is mostly linked to uncertainty regarding monetary policy, whereas long-term rate volatility is mostly linked to uncertainty regarding the real economy and inflation.”<\/p><p>Finally, Winter asks Madison to analyze the interest rate risk portfolio positions in a 5-year and a 20-year bond. Winter requests that the analysis be based on level, slope, and curvature as term structure factors. Madison presents her analysis in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Three-Factor Model of Term Structure<\/p><p>Time to Maturity (years)<\/p><table><tr><th>Factor<\/th><th>5<\/th><th>20<\/th><\/tr><tr><td>Level<\/td><td>–0.4352%<\/td><td>–0.5128%<\/td><\/tr><tr><td>Steepness<\/td><td>–0.0515%<\/td><td>–0.3015%<\/td><\/tr><tr><td>Curvature<\/td><td>0.3963%<\/td><td>0.5227%<\/td><\/tr><\/table><p>Note: Entries indicate how yields would change for a one standard deviation increase in a factor.<\/p><p>Winter asks Madison to perform two analyses:<\/p><p>Analysis 1:<\/p><p>Calculate the expected change in yield on the 20-year bond resulting from a two-standard-deviation increase in the steepness factor.<\/p><p>Analysis 2:<\/p><p>Calculate the expected change in yield on the five-year bond resulting from a one-standard-deviation decrease in the level factor and a one-standard-deviation decrease in the curvature factor.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q50", "rel": [], "los": "FI · ECO Module 1 Q50", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, the results of Analysis 1 should show the yield on the 20-year bond decreasing by:<\/p>", "options": {"A": "0.3015%.", "B": "0.6030%.", "C": "0.8946%."}}, {"id": "FI:ECO-M1-Q51", "rel": [], "los": "FI · ECO Module 1 Q51", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, the results of Analysis 2 should show the yield on the five-year bond:<\/p>", "options": {"A": "decreasing by 0.8315%.", "B": "decreasing by 0.0389%.", "C": "increasing by 0.0389%."}}]}, {"set": 2, "session": 1, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Marcia Garrett is a research analyst at IGMA Investments. IGMA is a large investment firm that claims compliance with the Standards.<\/p><p>While preparing a report on industry trends, Garrett read an article that appeared in a leading business newspaper. Included in the article was a summary of a study conducted by a prominent trade association. Garrett did not obtain a copy of the study directly from the trade association, but did however include information from the article in her report. Garrett cites only the newspaper in her report.<\/p><p>During the most recent quarter, Garrett prepared an analysis detailing her interest rate expectations over the next year and submitted it to IGMA&#x27;s investment committee. Her research is to be included as part of a wider report by the firm regarding market expectations for the year ahead. Based on her analysis, Garrett&#x27;s opinion is that interest rates will remain fairly stable. The committee disagrees with some of Garrett&#x27;s assumptions and does not include her opinion in the wider report. The committee&#x27;s final report issues a consensus expectation that interest rates will increase and includes detailed assumptions supporting that view. Despite the difference in opinions, Garrett acknowledges that the committee&#x27;s conclusion has a reasonable basis. The final report is distributed to clients and includes Garrett&#x27;s name, as well as other research analysts who contributed to the report as authors.<\/p><p>Garrett is part of a working group asked to review IGMA&#x27;s code of ethics and to suggest any necessary changes that are needed to ensure that it is consistent with the Standards. During one of the working group&#x27;s discussions, Garrett states that the Standards recommend that the code of ethics include general fiduciary concepts as well as detailed compliance procedures.<\/p><p>Garrett has accepted an offer to join a rival firm. While at IGMA, Garrett and a colleague developed a quantitative model that was used for industry and company analysis. Garrett considers if she can continue to use the model at her new firm.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q25", "rel": [], "los": "Mock 2 Session 1 Q25", "tier": null, "type": "", "stem": "<p>Did Garrett violate the Standards in her report on industry trends?<\/p>", "options": {"A": "No", "B": "Yes, because she did not cite the trade association", "C": "Yes, because she did not independently review the trade association report"}}, {"id": "Mock2:mock2-Q27", "rel": [], "los": "Mock 2 Session 1 Q27", "tier": null, "type": "", "stem": "<p>Is Garrett&#x27;s statement about the Standard&#x27;s recommendation for the code of ethics correct?<\/p>", "options": {"A": "Yes", "B": "No, with regard to compliance procedures", "C": "No, with regard to general fiduciary concepts"}}]}, {"set": 3, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Robert Krey is a financial analyst who is evaluating the financial statements of Ernst AG, a German manufacturing company that reports under IFRS. During the current year, Ernst invested in three different companies (Astrid, Balto, and Cordeau) that are based in the eurozone. All three investments were acquired on 1 January of the current year. Krey wants to determine the effect of these investments on Ernst&#x27;s current year financial statements and ratios.<\/p><p>Ernst purchased a 10% ownership interest in Astrid for €90 million. During the current year, Astrid reported €80 million in pre-tax income and paid €40 million in dividends. The fair value of Astrid shares at 31 December of the current year was €970 million. Ernst accounts for Astrid by using the fair value through profit or loss (FVPL) method.<\/p><p>A 25% ownership interest in Balto was purchased for €500 million. The fair values of all Balto&#x27;s assets and liabilities were equal to their book values except for equipment which was undervalued by €40 million. The undervalued equipment has a remaining useful life of 5 years and will be fully depreciated by using the straight-line method. Ernst has significant influence over Balto but it does not have control. During the current year, Balto reported €140 million in income and paid €40 million in dividends.<\/p><p>For Cordeau, Ernst exchanged €1,800 million in shares to acquire a 75% controlling interest in Cordeau. The book value of Cordeau on 1 January was €2,000 million. On that date, Cordeau&#x27;s inventory was undervalued by €60 million. All other recorded assets and liabilities were equal to their fair values. Cordeau applies the FIFO inventory valuation method and Ernst uses the partial goodwill method when it consolidates Cordeau. Cordeau&#x27;s primary competitor is a US company that reports under US GAAP. For the current year, Cordeau reported net income of €240 million and paid €40 million in dividends.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q43", "rel": [], "los": "FSA · ECO Module 1 Q43", "tier": null, "type": "", "stem": "<p>For the current year, Ernst reported pre-tax income from Astrid in the amount of:<\/p>", "options": {"A": "€4 million.", "B": "€8 million.", "C": "€11 million."}}, {"id": "FSA:ECO-M1-Q44", "rel": [], "los": "FSA · ECO Module 1 Q44", "tier": null, "type": "", "stem": "<p>At the end of the current year, Ernst&#x27;s investment in Balto has a recorded balance of:<\/p>", "options": {"A": "€523 million.", "B": "€525 million.", "C": "€533 million."}}, {"id": "FSA:ECO-M1-Q46", "rel": [], "los": "FSA · ECO Module 1 Q46", "tier": null, "type": "", "stem": "<p>Upon acquiring a controlling ownership interest in Cordeau on 1 January, Ernst&#x27;s pre-consolidation debt-to-assets ratio:<\/p>", "options": {"A": "decreased.", "B": "remained unchanged.", "C": "increased."}}]}, {"set": 4, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Andrew Rutherford is a fixed-income analyst with Quantum Credit Advisers, an institutional investment management company. Quantum offers a variety of fixed-income oriented investment strategies, including a core-plus-bond strategy as well as a popular long–short credit hedge fund. Rutherford participates in Quantum’s weekly fixed-income committee meetings.<\/p><p>A macro topic for this week’s fixed-income committee is the possibility that the US Federal Reserve Board (Fed) will raise the federal funds rate (FFR) 25 bps at their next meeting. Quantum’s committee believes that the Fed is likely to hold off raising the FFR for at least six months because of weak economic data, and that weakness will be seen in the upcoming payroll numbers. Quantum expects the monthly non-farm payroll report to show that the US labor market added only 90,000 jobs this month, roughly in line with consensus expectations. The committee is debating what will happen to the short end of the US yield curve (and what will happen subsequently to short-dated bond prices) if the payroll report comes in at the level they expect.<\/p><p>Quantum’s committee forecasts weaker-than-expected GDP growth in the future and expects that GDP growth will be more volatile as the economy ultimately adjusts to a changing interest rate policy. Rutherford believes these factors will exert downward pressure on short-term Treasury Inflation-Protected Securities (TIPS) rates.<\/p><p>As part of Rutherford’s analysis, he forecasts the real one-year risk-free rate to be 0.25% and average inflation over the next year to be 1.5%. A zero-coupon nominal Treasury bond with 1-year to maturity and a par value of $100 is currently trading at $98.05. Rutherford notes the discrepancy in market pricing relative to his forecasts.<\/p><p>Diana Coombs is a senior credit analyst at Quantum. Based on the GDP outlook from the committee, she evaluates three bonds from different sectors (shown in Exhibit 1) for a potential new short position in the company’s hedge fund. All three bonds mature in five years.<\/p><p>Exhibit 1 Credit Market Observations<\/p><table><tr><th><\/th><th>Economic Sector<\/th><th>Debt/Capital<\/th><th>Enterprise Value/EBITDA<\/th><th>Spread to Treasuries (bps)<\/th><th>Credit Rating<\/th><\/tr><tr><td>Bond 1<\/td><td>Pharmaceutical<\/td><td>52.2%<\/td><td>7.2<\/td><td>255<\/td><td>Baa2<\/td><\/tr><tr><td>Bond 2<\/td><td>Consumer Discretionary<\/td><td>48.3%<\/td><td>7.8<\/td><td>220<\/td><td>Baa1<\/td><\/tr><tr><td>Bond 3<\/td><td>Soft Drinks<\/td><td>32.3%<\/td><td>8.5<\/td><td>210<\/td><td>A3<\/td><\/tr><\/table><p>Quantum is looking to enhance its equity offerings. It has recently hired David Wu to help construct a quantitative equity rotation strategy that will use economic input from the fixed-income committee. Wu has a background in quantitative modeling of equity markets and is tasked with developing an aggregate earnings forecasts. He is also working on incorporating a target equity risk premium into an equity rotation model. Wu makes the following observations based on his prior experiences:<\/p><p>• Observation 1: The equity premium should be larger than, and positively correlated with, the corporate bond premium.<\/p><p>• Observation 2: Corporate profitability is a leading economic indicator.<\/p><p>• Observation 3: Equities provide superior consumption-hedging properties to high-quality bonds.<\/p><p>The equity rotation model can allocate between small- and large-cap stocks and growth and value stocks and can take targeted sector positions to enhance returns relative to the broader equity market. As the model is nearing completion, Wu evaluates how it would have performed during previous economic cycles. He runs extensive backtesting and observes the following tendencies of the model in the aftermath of recessions:<\/p><p>• Rotates from consumer discretionary to consumer staple stocks<\/p><p>• Rotates from large-cap growth stocks into large-cap value stocks<\/p><p>• Rotates from small-cap value stocks to mid-cap value stocks<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M1-Q45", "rel": [], "los": "PM · ECO Module 1 Q45", "tier": null, "type": "", "stem": "<p>Which of the following is the most likely impact on short-term bond prices if Quantum’s expectations regarding the payroll report are correct?<\/p>", "options": {"A": "Fall", "B": "No change", "C": "Rise"}}, {"id": "PM:ECO-M1-Q48", "rel": [], "los": "PM · ECO Module 1 Q48", "tier": null, "type": "", "stem": "<p>Based on Quantum’s economic forecast and the data in Exhibit 1, which bond is Coombs most likely to recommend as the short position for the hedge fund?<\/p>", "options": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}}]}, {"set": 5, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Sallie Kwan Industrials (SKI) is a Singapore-based automation equipment manufacturer that reports under US GAAP. The company disclosed the following information in a note to its financial statements titled “Share-Based Compensation.”<\/p><p>Under our Share Incentive Plan, the Company grants restricted stock units (“RSUs”) to its officers, employees, directors and other eligible persons of up to 83,000,000 Class A ordinary shares. RSUs vest 25% on the first anniversary year from the grant date and the remaining 75% vest in 12 substantially equal quarterly installments. RSU activity for the two years ended 31 December 20X2 was as follows.<\/p><table><tr><th><\/th><th>Number of Shares<\/th><th>Weighted Average Grant-Date Fair Value per Share (SGD)<\/th><\/tr><tr><td>Unvested at 31 December 20X0<\/td><td>4,754,972<\/td><td>12.34<\/td><\/tr><tr><td>Granted<\/td><td>6,249,313<\/td><td>20.50<\/td><\/tr><tr><td>Vested and settled<\/td><td>(2,131,415)<\/td><td>13.67<\/td><\/tr><tr><td>Forfeited<\/td><td>(791,433)<\/td><td>15.22<\/td><\/tr><tr><td>Unvested at 31 December 20X1<\/td><td>8,081,437<\/td><td>18.02<\/td><\/tr><tr><td>Granted<\/td><td>5,034,735<\/td><td>72.37<\/td><\/tr><tr><td>Vested and settled<\/td><td>(3,332,063)<\/td><td>19.25<\/td><\/tr><tr><td>Forfeited<\/td><td>(442,181)<\/td><td>28.74<\/td><\/tr><tr><td>Unvested at 31 December 20X2<\/td><td>9,341,928<\/td><td>46.36<\/td><\/tr><\/table><p>Share-based compensation expense for RSUs is measured based on the fair value of the Company’s ordinary shares on the date of grant. SKI accounts for forfeitures as they occur.<\/p><p>Unrecognized share-based compensation expense as of 31 December 20X0, 20X1, and 20X2 was SGD 58.7, SGD 145.6, and SGD 433.1 million, respectively.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M2-Q16", "rel": [], "los": "FSA · ECO Module 2 Q16", "tier": null, "type": "", "stem": "<p>If SKI reported under IFRS instead of US GAAP, its effective tax rate would likely be:<\/p>", "options": {"A": "lower.", "B": "higher.", "C": "the same."}}, {"id": "FSA:ECO-M2-Q17", "rel": [], "los": "FSA · ECO Module 2 Q17", "tier": null, "type": "", "stem": "<p>SKI reported basic shares outstanding of 270,400,000 and positive net income on its income statement for the year ended 31 December 20X2. Besides unvested RSUs, SKI had no other potentially dilutive securities outstanding. Assuming an average share price of SGD 71.50 for the year, diluted shares outstanding for the year ended 31 December 20X2 is closest to:<\/p>", "options": {"A": "273,284,585.", "B": "275,695,075.", "C": "279,341,928."}}]}, {"set": 6, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Chan Mei Yee is valuing McLaughlin Corporation common shares using a free cash flow approach. Yee gathered information about McLaughlin from several sources. She begins her analysis by determining free cash flow to the firm (FCFF) and free cash flow to equity (FCFE) for the 2012 fiscal year, using the financial statements in Exhibits 1 and 2. McLaughlin’s fiscal year ends 31 December.<\/p><p>Exhibit 1 McLaughlin Corporation Selected Financial Data ($ millions, except per share amounts)<\/p><table><tr><th>For Year Ending 31 December<\/th><th>2012<\/th><\/tr><tr><td>Revenues<\/td><td>$6,456<\/td><\/tr><tr><td>Earnings before interest, taxes, depreciation, and amortization (EBITDA)<\/td><td>1,349<\/td><\/tr><tr><td>Depreciation expense<\/td><td>243<\/td><\/tr><tr><td>Operating income<\/td><td>1,106<\/td><\/tr><tr><td>Interest expense<\/td><td>186<\/td><\/tr><tr><td>Pretax income<\/td><td>920<\/td><\/tr><tr><td>Income tax (32%)<\/td><td>294<\/td><\/tr><tr><td>Net income<\/td><td>$626<\/td><\/tr><tr><td>Number of outstanding shares (millions)<\/td><td>411<\/td><\/tr><tr><td>2012 earnings per share<\/td><td>$1.52<\/td><\/tr><tr><td>2012 dividends paid (millions)<\/td><td>148<\/td><\/tr><tr><td>2012 dividends per share<\/td><td>0.36<\/td><\/tr><tr><td>2012 fixed capital investment (millions)<\/td><td>535<\/td><\/tr><tr><td>Cost of equity<\/td><td>12.0%<\/td><\/tr><tr><td>Weighted average cost of capital (WACC)<\/td><td>9.0%<\/td><\/tr><\/table><p>Exhibit 2 McLaughlin Corporation Consolidated Balance Sheets ($ millions)<\/p><table><tr><th><\/th><th>as of 31 December<\/th><th><\/th><\/tr><tr><td><\/td><td>2012<\/td><td>2011<\/td><\/tr><\/table><p>Assets<\/p><table><tr><th>Cash and cash equivalents<\/th><th>$32<\/th><th>$21<\/th><\/tr><tr><td>Accounts receivable<\/td><td>413<\/td><td>417<\/td><\/tr><tr><td>Inventories<\/td><td>709<\/td><td>638<\/td><\/tr><tr><td>Other current assets<\/td><td>136<\/td><td>123<\/td><\/tr><tr><td>Total current assets<\/td><td>$1,290<\/td><td>$1,199<\/td><\/tr><tr><td>Current liabilities<\/td><td>$2,783<\/td><td>$2,678<\/td><\/tr><tr><td>Long-term debt<\/td><td>2,249<\/td><td>2,449<\/td><\/tr><tr><td>Common stockholders&#x27; equity<\/td><td>1,072<\/td><td>594<\/td><\/tr><tr><td>Total liabilities and stockholders&#x27; equity<\/td><td>$6,104<\/td><td>$5,721<\/td><\/tr><\/table><p>Yee plans to perform two different valuations of McLaughlin, which she calls the “base case” valuation and the “alternative” valuation. Critical assumptions for each are given in the following lists.<\/p><p>Base case valuation<\/p><p>2013 FCFF will be $600 million.<\/p><p>Beyond 2013, FCFF will grow in perpetuity at 4% annually.<\/p><p>The market value and book value of McLaughlin’s long-term debt are approximately equal.<\/p><p>Alternative valuation<\/p><p>2013 earnings per share (EPS) will be $1.80.<\/p><p>EPS will grow forever at 6% annually.<\/p><p>For 2013 and beyond:<\/p><p>Net capital expenditures (fixed capital expenditures minus depreciation) will be 30% of EPS.<\/p><p>Investments in working capital will be 10% of EPS.<\/p><p>Of future investments, 60% will be financed with equity and 40% will be financed with debt.<\/p><p>Yee is also concerned about the effects on McLaughlin’s 2013 FCFE of the following three possible financial actions by McLaughlin during the year 2013:<\/p><p>Action 1: Increasing common stock cash dividends by $110 million<\/p><p>Action 2: Repurchasing $60 million of common shares<\/p><p>Action 3: Reducing its outstanding long-term debt by $100 million<\/p><p>Melissa Nicosia, Yee’s supervisor, reviews McLaughlin’s valuations. Specifically, Nicosia makes the following three statements:<\/p><p>Statement 1: The free cash flow valuation approach is superior to the discounted dividend valuation approach because the company’s dividends have been substantially different from its FCFE.<\/p><p>Statement 2: Because the company’s capital structure seems unstable, the FCFE valuation approach is superior to the FCFF valuation approach.<\/p><p>Statement 3: If there is a change in control at McLaughlin, the discounted dividend valuation approach would be superior to a free cash flow valuation approach.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M3-Q65", "rel": [], "los": "Equity · ECO Module 3 Q65", "tier": null, "type": "", "stem": "<p>Assuming 2012 FCFF equals $500 million, McLaughlin’s FCFE ($ millions) for 2012 is closest to:<\/p>", "options": {"A": "$114.", "B": "$174.", "C": "$574."}}, {"id": "Equity:ECO-M3-Q66", "rel": [], "los": "Equity · ECO Module 3 Q66", "tier": null, "type": "", "stem": "<p>Using Yee’s base case valuation assumptions and the FCFF valuation approach, the year-end 2012 value per share of McLaughlin common stock is closest to:<\/p>", "options": {"A": "$12.78.", "B": "$23.73.", "C": "$29.20."}}, {"id": "Equity:ECO-M3-Q69", "rel": [], "los": "Equity · ECO Module 3 Q69", "tier": null, "type": "", "stem": "<p>Which of Nicosia’s three statements pertaining to McLaughlin’s valuation is the most accurate? Statement:<\/p>", "options": {"A": "1", "B": "2", "C": "3"}}]}, {"set": 7, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Dagmar AG is a European-based manufacturing firm that prepares its financial statements according to International Financial Reporting Standards (IFRS). Two members of Dagmar’s treasury group, Henrik Ferdinand and Adele Christoph, are reviewing Dagmar’s portfolio of investments. They are interested in the investment income reported during the year and whether any of the investments should be considered impaired or need to be reclassified.<\/p><p>On July 1 the company purchased €4,000 of 10-year bonds of Alme AG. The bonds have a 5% coupon payable annually and cost €3,705.60, reflecting the effective market rate of 6%. Dagmar is expecting to collect the interest and principal payments but if liquidity needs arise will sell the bonds. Ferdinand and Christophe start by reviewing how the bond is classified.<\/p><p>The company also holds bonds issued by Bergenfeld AG with a face value of €5 million and a coupon rate of 8%, payable semi-annually. The bonds have been held for 10 years and are classified as amortized cost.<\/p><p>The final investment is Dagmar’s longstanding holding of Elbe AG common shares. Elbe has been profitable and paid a consistent dividend every year since it was acquired, Additional details are available in Exhibit 1.<\/p><p>Exhibit 1 Additional Information Investment in Elbe AG (All € figures in 000s except per share data)<\/p><p>At the date of acquisition (February 28, 2008)<\/p><table><tr><th># shares purchased<\/th><th>1.8 million<\/th><\/tr><tr><td>Total shares outstanding<\/td><td>6.0 million<\/td><\/tr><tr><td>Price paid<\/td><td>€17 per share<\/td><\/tr><tr><td>Total net book value of Elbe<\/td><td>€90,000<\/td><\/tr><tr><td>Excess of fair market value of plant and equipment above book value<\/td><td>€5,250<\/td><\/tr><tr><td>Expected useful life remaining on plant and equipment<\/td><td>15 years<\/td><\/tr><\/table><p>Elbe uses straight-line depreciation for all of its tangible assets<\/p><p>Dagmar classified Elbe as an associate company<\/p><p>At December 31, 2019<\/p><table><tr><th>Book value of investment on Dagmar’s statement of financial position<\/th><th>€59,022<\/th><\/tr><tr><td>Net income reported by Elbe for 2019<\/td><td>€12,375<\/td><\/tr><tr><td>Dividends paid by Elbe in 2019<\/td><td>€0.50 per share<\/td><\/tr><\/table><p>Ferdinand continues the meeting with the following statement:<\/p><p>“Before we consider impairment, let us calculate the amount Elbe will contribute to Dagmar’s net earnings this year.”<\/p><p>Turning to the Bergenfeld bonds, Christoph says:<\/p><p>“If we’re looking for contributions to net earnings, I see an opportunity with the Bergenfeld bonds. The decline in interest rates over the years since the original purchase has significantly increased their market value. IFRS allows us to reclassify these bonds to fair value as a way to increase reported income in the period. It works well because the standards don’t require us to restate the prior periods when we reclassify.”<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q49", "rel": [], "los": "FSA · ECO Module 1 Q49", "tier": null, "type": "", "stem": "<p>The least appropriate classification for the investment in the Alme bonds is:<\/p>", "options": {"A": "amortized cost.", "B": "fair value through profit and loss.", "C": "fair value through other comprehensive income."}}]}, {"set": 8, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Carlos Altuve is a manager-of-managers at an investment company that uses quantitative models extensively. Altuve seeks to construct a multi-manager portfolio using some of the funds managed by portfolio managers within the firm. Maya Zapata is assisting him.<\/p><p>Altuve uses arbitrage pricing theory (APT) as a basis for evaluating strategies and managing risks. From his earlier analysis, Zapata knows that Funds A and B in Exhibit 1 are well diversified. He has not previously worked with Fund C and is puzzled by the data because it is inconsistent with APT. He asks Zapata gather additional information on Fund C’s holdings and to determine if an arbitrage opportunity exists among these three investment alternatives. Her analysis, using the data in Exhibit 1, confirms that an arbitrage opportunity does exist.<\/p><p>Exhibit 1<\/p><p>Expected Returns and Factor Sensitivities (One-Factor Model)<\/p><table><tr><th>Fund<\/th><th>Expected Return<\/th><th>Factor Sensitivity<\/th><\/tr><tr><td>A<\/td><td>0.02<\/td><td>0.5<\/td><\/tr><tr><td>B<\/td><td>0.04<\/td><td>1.5<\/td><\/tr><tr><td>C<\/td><td>0.03<\/td><td>0.9<\/td><\/tr><\/table><p>Using a two-factor model, Zapata now estimates the three funds’ sensitivity to inflation and GDP growth. That information is presented in Exhibit 2. Zapata assumes a zero value for the error terms when working with the selected two-factor model.<\/p><p>Exhibit 2<\/p><p>Expected Returns and Factor Sensitivities (Two-Factor Model)<\/p><table><tr><th>Fund<\/th><th>Expected Return<\/th><th>Sensitivity: Inflation<\/th><th>Sensitivity: GDP Growth<\/th><\/tr><tr><td>A<\/td><td>0.02<\/td><td>0.5<\/td><td>1.0<\/td><\/tr><tr><td>B<\/td><td>0.04<\/td><td>1.6<\/td><td>0.0<\/td><\/tr><tr><td>C<\/td><td>0.03<\/td><td>1.0<\/td><td>1.1<\/td><\/tr><\/table><p>Altuve asks Zapata to calculate the return for Portfolio AC, composed of a 60% allocation to Fund A and 40% allocation to Fund C, using the surprises in inflation and GDP growth in Exhibit 3.<\/p><p>Exhibit 3<\/p><p>Selected Data on Factors<\/p><table><tr><th>Factor<\/th><th>Research Staff Forecast<\/th><th>Actual Value<\/th><\/tr><tr><td>Inflation<\/td><td>2.0%<\/td><td>2.2%<\/td><\/tr><tr><td>GDP Growth<\/td><td>1.5%<\/td><td>1.0%<\/td><\/tr><\/table><p>Finally, Altuve asks Zapata about the return sensitivities of Portfolios A, B, and C given the information provided in Exhibit 3.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M4-Q8", "rel": [], "los": "PM · ECO Module 4 Q8", "tier": null, "type": "", "stem": "<p>Based on the data in Exhibit 2, which fund is most sensitive to the combined surprises in inflation and GDP growth in Exhibit 3?<\/p>", "options": {"A": "Fund A", "B": "Fund B", "C": "Fund C"}}]}, {"set": 9, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Joao Viniciu is an equity analyst researching Pedra S.A., a Brazilian multinational corporation. Pedra reports under IFRS with a fiscal year end of 31 December. Its reporting currency is the Brazilian Real (BRL).<\/p><p>Viniciu analyzes the sustainability of net sales growth for each of Pedra’s geographic segments. Exhibit 1 shows the components of total net sales growth for each of these segments.<\/p><p>Exhibit 1<\/p><table><tr><th>Geographic Segment<\/th><th>Contribution from Volume Growth<\/th><th>Contribution from Price Growth<\/th><th>Contribution from Foreign Currency Exchange<\/th><th>Total Net Sales Growth<\/th><\/tr><tr><td>Europe<\/td><td>4.6%<\/td><td>1.9%<\/td><td>1.4%<\/td><td>7.9%<\/td><\/tr><tr><td>Americas<\/td><td>0.7%<\/td><td>1.1%<\/td><td>4.3%<\/td><td>6.1%<\/td><\/tr><tr><td>Asia Pacific<\/td><td>3.6%<\/td><td>2.1%<\/td><td>1.8%<\/td><td>7.5%<\/td><\/tr><\/table><p>For his research, Viniciu uses the BRL/USD (number of BRL per 1 USD) exchange rate information for the most recent year as shown in Exhibit 2.<\/p><p>Exhibit 2<\/p><table><tr><th><\/th><th>BRL/USD<\/th><\/tr><tr><td>1 January<\/td><td>5.07<\/td><\/tr><tr><td>1 November<\/td><td>5.53<\/td><\/tr><tr><td>31 December<\/td><td>5.45<\/td><\/tr><tr><td>Average for the year<\/td><td>5.26<\/td><\/tr><\/table><p>On 1 November of the most recent year, Pedra purchased imported goods worth USD 3.2 million on credit from an unaffiliated US supplier. The amount payable for these imported goods by Pedra was still outstanding as of 31 December.<\/p><p>Carro Corp. is one of Pedra’s wholly-owned US-based subsidiaries. Pedra translates Carro’s financial statements using the current rate method based on the rates in Exhibit 2. Carro&#x27;s only non-monetary assets are inventory and fixed assets, while all of its liabilities are monetary. Carro&#x27;s inventory and fixed assets were purchased at a BRL/USD rate of 5.24. Viniciu analyzes the effect of the translation method on Carro’s debt-to-assets ratio for the most recent year.<\/p><p>Over the current year, Viniciu expects that Carro will maintain a stable net asset balance sheet exposure and that the BRL will weaken against the USD.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q68", "rel": [], "los": "Mock 2 Session 2 Q24", "tier": null, "type": "", "stem": "<p>Based on Viniciu’s expectations, the translation of Carro’s financial statements in the current year will most likely result in a:<\/p>", "options": {"A": "translation loss in Pedra&#x27;s income statement.", "B": "translation gain in Pedra&#x27;s income statement.", "C": "positive translation adjustment in Pedra&#x27;s shareholders’ equity."}}]}, {"set": 10, "session": 1, "topic": "Derivatives", "code": "DER", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "Deriv:ECO-M2-Q83", "rel": [], "los": "Deriv · ECO Module 2 Q83", "tier": null, "type": "", "stem": "<p>An investor wishes to replicate the value of a long European put on a futures contract using a bond component and a futures component. According to the Black model, which of the following combinations will replicate the put value?<\/p>", "options": {"A": "The futures component plus the bond component", "B": "The bond component minus the futures component", "C": "The futures component minus the bond component"}}, {"id": "Deriv:ECO-M2-Q87", "rel": [], "los": "Deriv · ECO Module 2 Q87", "tier": null, "type": "", "stem": "<p>An investment manager sells 6-month put options on a company&#x27;s shares. Two months later, the company announces a special dividend payable to shareholders at the end of the month. Based on the Black–Scholes–Merton model, the special dividend will:<\/p>", "options": {"A": "reduce the return on the put option position.", "B": "not impact the return on the put option position.", "C": "increase the return on the put option position."}}, {"id": "Deriv:ECO-M2-Q90", "rel": [], "los": "Deriv · ECO Module 2 Q90", "tier": null, "type": "", "stem": "<p>Which of the following statements about implied volatility is least accurate? In practice, the implied volatility of options:<\/p>", "options": {"A": "is constant across exercise price and time to expiration.", "B": "may be used to revalue existing option positions over time.", "C": "makes it easier to understand the current market price of various risk exposures."}}, {"id": "Deriv:ECO-M2-Q95", "rel": [], "los": "Deriv · ECO Module 2 Q95", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information about a non-dividend paying stock:<\/p><table><tr><th>Current stock price<\/th><th>€60<\/th><\/tr><tr><td>Call option exercise price<\/td><td>€60<\/td><\/tr><tr><td>Periodically compounded risk-free interest rate<\/td><td>4%<\/td><\/tr><\/table><p>In one period, the stock price will either rise to €66 or decline to €54. Based on the one-period binomial option pricing model, the value of the call option is closest to:<\/p>", "options": {"A": "€2.88.", "B": "€4.04.", "C": "€4.37."}}]}, {"set": 11, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M2-Q34", "rel": [], "los": "FSA · ECO Module 2 Q34", "tier": null, "type": "", "stem": "<p>Which of the following is classified as short-term employee compensation?<\/p>", "options": {"A": "Stock options", "B": "Sabbatical paid leave", "C": "Contributions to social security"}}, {"id": "FSA:ECO-M2-Q38", "rel": [], "los": "FSA · ECO Module 2 Q38", "tier": null, "type": "", "stem": "<p>The common approach to forecasting share-based compensation expense in a financial statement model is as a percentage of:<\/p>", "options": {"A": "revenues.", "B": "gross profit.", "C": "total operating expenses."}}, {"id": "FSA:ECO-M2-Q39", "rel": [], "los": "FSA · ECO Module 2 Q39", "tier": null, "type": "", "stem": "<p>Payments from a post-employment benefit plan to employees are:<\/p>", "options": {"A": "not reported on the employer&#x27;s financial statements.", "B": "reported on the employer&#x27;s financial statements in the case of defined benefit plans.", "C": "reported on the employer&#x27;s financial statements in the case of defined contribution plans."}}, {"id": "FSA:SCH-M2-03", "rel": [], "los": "FSA · Schweser MQ 8.1 변형", "tier": null, "type": "", "stem": "<p>Which of the following statements about short-term employee compensation is least accurate?<\/p>", "options": {"A": "It is expensed as employees provide service, with unpaid amounts shown as a current liability.", "B": "It includes salaries, bonuses, health insurance, social security contributions, and paid leave.", "C": "It is subject to high measurement error because the costs must be estimated far into the future."}}]}, {"set": 12, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Snohomish Mukilteo is a portfolio analyst for the Puyallup-Wenatchee Pension Fund (PWPF). PWPF’s investment committee (IC) asks Mukilteo to research adding hedge funds to the PWPF portfolio.<\/p><p>A member of the IC meets with Mukilteo to discuss hedge fund strategies. During the meeting, the IC member admits that her knowledge of hedge fund strategies is fairly limited but tells Mukilteo she believes the following:<\/p><p>Statement 1: Equity market-neutral strategies use a relative value approach.<\/p><p>Statement 2: Event-driven strategies are not exposed to equity market beta risk.<\/p><p>Statement 3: Opportunistic strategies have risk exposure to market directionality.<\/p><p>The IC member also informs Mukilteo that for equity-related strategies, the IC considers low volatility to be more important than negative correlation.<\/p><p>Mukilteo researches various hedge fund strategies. First, Mukilteo analyzes an event-driven strategy involving two companies, Algona Applications (AA) and Tukwila Technologies (TT). AA’s management, believing that its own shares are overvalued, uses its shares to acquire TT. The IC has expressed concern about this type of strategy because of the potential for loss if the acquisition unexpectedly fails. Mukilteo’s research reveals a way to use derivatives to protect against this loss, and he believes that such protection will satisfy the IC’s concern.<\/p><p>Next, while researching relative value strategies, Mukilteo considers a government bond strategy that involves buying lower-liquidity, off-the-run bonds and selling higher-liquidity, duration-matched, on-the-run bonds.<\/p><p>Mukilteo examines an opportunistic strategy implemented by one of the hedge funds under consideration. The hedge fund manager selects 12 AAA rated corporate bonds with actively traded futures contracts and approximately equal durations. For each corporate bond, the manager calculates the 30-day change in the yield spread over a constant risk-free rate. He then ranks the bonds according to this spread change. For the bonds that show the greatest spread narrowing (widening), the hedge fund will take long (short) positions in their futures contracts. The net holding for this strategy is market neutral.<\/p><p>Mukilteo also plans to recommend a specialist hedge fund strategy that would allow PWPF to maintain a high Sharpe ratio even during a financial crisis when equity markets fall.<\/p><p>The IC has been considering the benefits of allocating to a fund of funds (FoF) or to a multi-strategy fund (MSF). Mukilteo receives the following email from a member of the IC:<\/p><p>“From my perspective, an FoF is superior even though it entails higher manager-specific operational risk and will require us to pay a double layer of fees without being able to net performance fees on individual managers. I especially like the tactical allocation advantage of FoFs—that they are more likely to be well informed about when to tactically reallocate to a particular strategy and more capable of shifting capital between strategies quickly.”<\/p><p>Finally, Mukilteo creates a model to simulate adding selected individual hedge fund strategies to the current portfolio with a 20% allocation. The IC’s primary considerations for a combined portfolio are (1) that the variance of the combined portfolio must be less than 90% of that of the current portfolio and (2) that the combined portfolio maximize the risk-adjusted return with the expectation of large negative events. Exhibit 1 provides historical performance and risk metrics for three simulated portfolios.<\/p><p>Exhibit 1: Performance of Various Combined Portfolios<\/p><table><tr><th>Hedge Fund Strategy<\/th><th>Standard Deviation (%)<\/th><th>Sharpe Ratio<\/th><th>Sortino Ratio<\/th><th>Maximum Drawdown (%)<\/th><\/tr><tr><td>Current Portfolio (NA)<\/td><td>7.95<\/td><td>0.58<\/td><td>1.24<\/td><td>14.18<\/td><\/tr><tr><td>Merger arbitrage (20% allocation)<\/td><td>7.22<\/td><td>0.73<\/td><td>1.35<\/td><td>5.60<\/td><\/tr><tr><td>Systematic futures (20% allocation)<\/td><td>6.94<\/td><td>0.83<\/td><td>1.68<\/td><td>8.04<\/td><\/tr><tr><td>Equity market neutral (20% allocation)<\/td><td>7.17<\/td><td>0.73<\/td><td>1.80<\/td><td>10.72<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "AI:ECO-M4-Q7", "rel": [], "los": "AI · ECO Module 4 Q7", "tier": null, "type": "", "stem": "<p>The specialist hedge fund strategy that Mukilteo plans to recommend is most likely:<\/p>", "options": {"A": "cross-asset volatility trading between the US and Japanese markets.", "B": "selling equity volatility and collecting the volatility risk premium.", "C": "buying longer-dated out-of-the-money options on VIX index futures."}}, {"id": "AI:ECO-M4-Q9", "rel": [], "los": "AI · ECO Module 4 Q9", "tier": null, "type": "", "stem": "<p>Based on the IC’s primary considerations for a combined portfolio, which simulated hedge fund strategy portfolio in Exhibit 1 creates the most suitable combined portfolio?<\/p>", "options": {"A": "Merger arbitrage", "B": "Systematic futures", "C": "Equity market neutral"}}]}, {"set": 13, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Dierdre O’Callahan is a senior risk manager at Muckroth Investment Management, a global investment firm headquartered in Dublin, Ireland. O’Callahan’s team is responsible for tracking and estimating portfolio risk for the firm’s various investment strategies and for communicating risk exposures to Muckroth’s portfolio managers, investment committee, and chief risk officer. O’Callahan’s team also offers risk consulting services to the firm’s institutional investor clients.<\/p><p>When assessing portfolio risk, O’Callahan makes frequent use of value at risk (VaR) in addition to other measures, such as volatility, sensitivity risk, and scenario risk. O’Callahan believes that VaR is an appropriate risk measure in this application for the following reasons:<\/p><p>Reason 1:<\/p><p>The reliability of VaR can be easily verified through a process known as backtesting.<\/p><p>Reason 2:<\/p><p>VaR takes portfolio liquidity into account when some of the assets are relatively illiquid.<\/p><p>Reason 3:<\/p><p>VaR effectively accounts for an increase in asset correlations during times of market stress.<\/p><p>Michelle Ryan is a senior portfolio manager on the Muckroth Alpha Fund. Ryan and O’Callahan are reviewing the VaR report O’Callahan prepared for this fund to ensure that the fund is within the risk parameters established by the firm and communicated to investors. The Alpha Fund has assets under management of €315 million and has an expected annualized return of 10.4% with a volatility of 17.52%. The report describes VaR in both percentage and euro terms. It uses the parametric method of VaR at the 5% level (1.65 standard deviations), assuming 250 trading days per year.<\/p><p>After reviewing the current VaR report, Ryan asks O’Callahan to calculate how much the VaR estimate would change if she were to reduce the portfolio weight of Bordeaux Industries stock in the Alpha Fund from 6% to 2% of the portfolio and then use the proceeds to establish a new 4% position in Riga Bank &amp; Trust. O’Callahan tells Ryan that there are several extensions of VaR analysis that she can run.<\/p><p>Axiomada, a prospective institutional client, is impressed by Muckroth’s investment track record and would like to learn more about the consulting services Muckroth offers to monitor risk. Representatives from Axiomada set up a meeting with O’Callahan to discuss how Muckroth considers important risk categories facing institutional investors. O’Callahan provides Axiomada with a risk management document Muckroth has prepared for institutional clients that includes Exhibit 1. Exhibit 1 illustrates how Muckroth considers a variety of different risk categories depending on the type of institutional investor.<\/p><p>Exhibit 1 Important Risk Categories by Type of Institutional Investor<\/p><table><tr><th>Risk Category<\/th><th>Bank<\/th><th>Hedge Fund<\/th><th>Pension Plan<\/th><\/tr><tr><td>Liquidity Gap<\/td><td>√<\/td><td>---<\/td><td>√<\/td><\/tr><tr><td>VaR<\/td><td>√<\/td><td>√<\/td><td>---<\/td><\/tr><tr><td>Tracking Error<\/td><td>---<\/td><td>√<\/td><td>√<\/td><\/tr><tr><td>Leverage<\/td><td>√<\/td><td>√<\/td><td>---<\/td><\/tr><tr><td>Scenario Analysis<\/td><td>√<\/td><td>---<\/td><td>√<\/td><\/tr><tr><td>Key Rate Duration<\/td><td>√<\/td><td>---<\/td><td>√<\/td><\/tr><tr><td>Active Share<\/td><td>---<\/td><td>√<\/td><td>---<\/td><\/tr><tr><td>Operational Risk Capital<\/td><td>√<\/td><td>---<\/td><td>√<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "PM:ECO-M5-Q52", "rel": [], "los": "PM · ECO Module 5 Q52", "tier": null, "type": "", "stem": "<p>In Exhibit 1 provided to Axiomada, for which institutional investor type does Muckroth most likely accurately list important risk categories?<\/p>", "options": {"A": "Bank", "B": "Hedge fund", "C": "Pension plan"}}]}, {"set": 14, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Eleni Petsas is a portfolio manager in the fixed-income division of PDK Wealth Management (PDKW), based in Los Angeles. Petsas is running a training session for newly hired analysts Bonita Vasquez, Neil Gorman, and Rohit Kumar to examine the use of Credit Default Swaps (CDSs) in fixed-income portfolio management.<\/p><p>Petsas begins the session by asking the analysts to identify types of CDSs. Vasquez responds, “There are three types of CDS; single-name CDSs, index CDSs, and tranche CDSs. A single-name CDS is on any obligation of a specific reference entity. An index CDS allows investors to take a position on the credit risk of multiple companies, although higher credit correlations make the index CDS more expensive to purchase. Tranche CDSs also cover multiple borrowers, but losses are covered only up to a specific level.”<\/p><p>Petsas notes that a payment from the credit protection seller to the credit protection buyer is triggered whenever a credit event occurs. She asks each of the analysts to identify a credit event in the United States that will trigger a payment. The following are the responses of each analyst:<\/p><p>• Vasquez: “A declaration of bankruptcy by the reference entity is a credit event that will trigger a payment from the CDS seller.”<\/p><p>• Gorman: “If the reference entity fails to make a scheduled interest or principal payment, it is recognized as a failure-to-pay credit event.”<\/p><p>• Kumar: “A change in seniority of outstanding obligations is also recognized as a credit event that will trigger a payment by the protection seller.”<\/p><p>To facilitate a discussion of CDS pricing and CDS trading strategies, Petsas presents the group with the information in Exhibit 1.<\/p><p>Exhibit 1 Select CDS Information<\/p><table><tr><th>CDS<\/th><th>Type<\/th><th>Credit Spread (bps)<\/th><th>Recovery Rate<\/th><th>Tenor (yrs.)<\/th><th>Coupon (bps)<\/th><th>Duration<\/th><\/tr><tr><td>CDX NA IG<\/td><td>Index<\/td><td>59<\/td><td>40%<\/td><td>5<\/td><td>100<\/td><td>4.76<\/td><\/tr><tr><td>CDX NA HY<\/td><td>Index<\/td><td>328<\/td><td>30%<\/td><td>5<\/td><td>500<\/td><td>4.34<\/td><\/tr><tr><td>Company A<\/td><td>Single-Name<\/td><td>194<\/td><td>25%<\/td><td>5<\/td><td>100<\/td><td>4.57<\/td><\/tr><tr><td>Company A<\/td><td>Single-Name<\/td><td>266<\/td><td>40%<\/td><td>10<\/td><td>100<\/td><td>7.38<\/td><\/tr><tr><td>Company B<\/td><td>Single-Name<\/td><td>165<\/td><td>40%<\/td><td>5<\/td><td>500<\/td><td>4.55<\/td><\/tr><tr><td>Company B<\/td><td>Single-Name<\/td><td>326<\/td><td>40%<\/td><td>10<\/td><td>500<\/td><td>8.19<\/td><\/tr><\/table><p>Notes: CDX NA IG is an index of CDSs of investment-grade North American corporations. CDX NA HY is an index of CDSs of high-yield North American corporations.<\/p><p>Petsas states, “I would like you to formulate appropriate CDS trading strategies using the information provided in the following statements:”<\/p><p>• Statement 1: “Our economists expect the US economy to strengthen over the coming year, with spreads on high-yield CDSs tightening by 100 bps and spreads on investment-grade CDSs tightening by 8 bps.”<\/p><p>• Statement 2: “Our analysts expect that the credit curve for Company A will flatten, whereas the credit curve for Company B is expected to steepen.”<\/p><p>• Statement 3: “Company A has a bond with five years to maturity with a credit risk premium of 85.40 bps, and Company B has a bond with five years to maturity with a credit risk premium of 205.60 bps.”<\/p><p>Only Kumar responds, as follows: “A trade that addresses Statement 2 would be to sell Company A CDSs with a 10-year tenor and buy Company A CDSs with a 5-year tenor. Alternatively, one could buy Company B CDSs with a 10-year tenor and sell Company B CDSs with a 5-year tenor.”<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M5-Q31", "rel": [], "los": "FI · ECO Module 5 Q31", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, the price per 100 par of Company A CDSs is closest to:<\/p>", "options": {"A": "95.70.", "B": "99.06.", "C": "104.29."}}, {"id": "FI:ECO-M5-Q34", "rel": [], "los": "FI · ECO Module 5 Q34", "tier": null, "type": "", "stem": "<p>Which of the following trades is most likely appropriate on the basis of the information in Statement 3 and Exhibit 1? Go long:<\/p>", "options": {"A": "Company B five-year CDSs and short Company B five-year bonds.", "B": "Company A five-year CDSs and short Company A five-year bonds.", "C": "Company A five-year bonds and CDSs and go short Company B five-year bonds and CDSs."}}]}, {"set": 15, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Clara Connor, an advisor for Newbridge Investments, is valuing three publicly traded firms: Lismore Corp., Omega Pipeline, and Slane Industries.<\/p><p>Connor estimates Lismore’s FCFF for the next year based on its forecasted revenues. Lismore’s revenues over the past 12 months were $2,500 million. Connor’s assumptions for estimating Lismore&#x27;s FCFF are summarized in Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th>Sales growth over the next year<\/th><th>40%<\/th><\/tr><tr><td>EBIT margin<\/td><td>30%<\/td><\/tr><tr><td>Incremental fixed capital as percent of increased sales<\/td><td>35%<\/td><\/tr><tr><td>Incremental working capital as percent of increased sales<\/td><td>25%<\/td><\/tr><tr><td>Proportion of new fixed and working capital financed by debt<\/td><td>15%<\/td><\/tr><tr><td>Tax rate<\/td><td>20%<\/td><\/tr><\/table><p>Omega Pipeline is a US-based company operating a network of oil and gas pipelines. Connor is concerned about increasing awareness of the environmental and social impacts these pipelines have on their surrounding communities. She believes these concerns are not fully reflected in Omega&#x27;s current share price and that an ESG equity risk premium should be incorporated in the discount rate. Using a two-stage model and the assumptions provided in Exhibit 2, Connor determines the company value of Omega.<\/p><p>Exhibit 2<\/p><table><tr><th>FCFF for both Year 1 and Year 2<\/th><th>$1,850 million<\/th><\/tr><tr><td>Expected long-term FCFF annual growth rate starting in Year 3<\/td><td>3.0%<\/td><\/tr><tr><td>Pretax cost of Omega&#x27;s debt<\/td><td>6.0%<\/td><\/tr><tr><td>Debt-to-assets ratio<\/td><td>40%<\/td><\/tr><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Market equity risk premium<\/td><td>5.5%<\/td><\/tr><tr><td>ESG equity risk premium<\/td><td>0.9%<\/td><\/tr><tr><td>Omega&#x27;s equity beta<\/td><td>1.4<\/td><\/tr><tr><td>Corporate tax rate<\/td><td>25%<\/td><\/tr><\/table><p>Soon after Connor completes her valuation of Omega, the company announces it will issue debt to buy back equity during the next year (Year 1). Connor considers how this capital structure change would impact her FCFF forecasts.<\/p><p>Finally, Connor analyzes Slane Industries. Slane is composed of three independent divisions: 1) lithium mining, 2) bromine extraction, and 3) specialty chemicals. The values of the firm&#x27;s lithium and bromine reserves are significant. The rates of revenue growth differ across the three divisions. Connor is able to identify publicly traded competitors for the specialty chemicals division but not for the other two divisions. After considering different approaches, she identifies the most appropriate approach for estimating the intrinsic value of Slane.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-2-Q30", "rel": [], "los": "Mock 1 Session 2 Q30", "tier": null, "type": "", "stem": "<p>Based on Connor’s assumptions, the company value (in $ millions) of Omega is closest to:<\/p>", "options": {"A": "27,500.", "B": "29,700.", "C": "32,600."}}, {"id": "Mock1:mock1-2-Q31", "rel": [], "los": "Mock 1 Session 2 Q31", "tier": null, "type": "", "stem": "<p>After incorporating Omega&#x27;s capital structure change, Connor&#x27;s FCFF forecasts would most likely be:<\/p>", "options": {"A": "lower.", "B": "unchanged.", "C": "higher."}}]}, {"set": 16, "session": 1, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>Bernadette Rivera is a portfolio manager at Voxkor, a private equity company. She is working with a data analyst, Tim Achler, on a text-based machine-learning (ML) model that classifies text information into positive or negative sentiment classes.<\/p><p>Achler uses a web spidering program to obtain the data. After curating the text, Achler removes unnecessary elements from the raw text and completes additional text cleansing and preprocessing tasks. Next, Achler divides unique tokens into three groups; a sample of each group is shown in Exhibit 1.<\/p><p>Exhibit 1 – Summary of Sample Tokens<\/p><table><tr><th>Token Group 1<\/th><th>Token Group 2<\/th><th>Token Group 3<\/th><\/tr><tr><td>&quot;not_increas_market&quot;<\/td><td>&quot;not_increased_market&quot;<\/td><td>&quot;not,&quot; &quot;increased,&quot; &quot;market&quot;<\/td><\/tr><tr><td>&quot;currencysign&quot;<\/td><td>&quot;currencysign&quot;<\/td><td>&quot;EUR&quot;<\/td><\/tr><tr><td>&quot;sale_decreas&quot;<\/td><td>&quot;sale_decreased&quot;<\/td><td>&quot;Sales,&quot; &quot;decreased&quot;<\/td><\/tr><\/table><p>As part of the text exploration step, Achler conducts a term frequency analysis to identify outliers (Exhibit 2).<\/p><p>Exhibit 2 – Words with Highest and Lowest Frequency Value<\/p><table><tr><th>Group 1 word<\/th><th>Frequency<\/th><th>Group 2 word<\/th><th>Frequency<\/th><\/tr><tr><td>the<\/td><td>0.04935<\/td><td>naval<\/td><td>1.0123e-05<\/td><\/tr><tr><td>and<\/td><td>0.04661<\/td><td>stereotype<\/td><td>1.5185e-05<\/td><\/tr><tr><td>to<\/td><td>0.04179<\/td><td>till<\/td><td>1.5185e-05<\/td><\/tr><tr><td>that<\/td><td>0.03577<\/td><td>ribbon<\/td><td>2.0247e-05<\/td><\/tr><tr><td>in<\/td><td>0.03368<\/td><td>deposit<\/td><td>2.5308e-05<\/td><\/tr><\/table><p>Achler splits the DTM into training, cross-validation, and test datasets and trains a logistic regression model. Applying ROC and AUC metrics, Achler evaluates model performance on both the training and the cross-validation datasets (Exhibit 3).<\/p><p>Exhibit 3 – AUC for Different Threshold p-values<\/p><table><tr><th>Threshold p-Value<\/th><th>Training Set<\/th><th>Cross-Validation Set<\/th><\/tr><tr><td>p = 0.57<\/td><td>56.7%<\/td><td>57.3%<\/td><\/tr><tr><td>p = 0.79<\/td><td>91.3%<\/td><td>89.7%<\/td><\/tr><tr><td>p = 0.84<\/td><td>98.4%<\/td><td>87.1%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Quant:ECO-M7-Q18", "rel": [], "los": "Quant · ECO Module 7 Q18", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, which token group has most likely undergone the text preparation and wrangling process?<\/p>", "options": {"A": "Token Group 1", "B": "Token Group 2", "C": "Token Group 3"}}, {"id": "Quant:ECO-M7-Q20", "rel": [], "los": "Quant · ECO Module 7 Q20", "tier": null, "type": "", "stem": "<p>Based on Exhibit 2, Achler should exclude from further analysis words in:<\/p>", "options": {"A": "only Group 1.", "B": "only Group 2.", "C": "both Group 1 and Group 2."}}]}, {"set": 17, "session": 1, "topic": "Portfolio Management", "code": "PM", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M4-Q60", "rel": [], "los": "PM · ECO Module 4 Q60", "tier": null, "type": "", "stem": "<p>The returns of stocks X and Y are given by a macroeconomic factor model and expressed as follows:<\/p><p>RX = 0.08 – 0.05F1 + 0.03F2 + εX<\/p><p>RY = 0.16 + 0.02F1 + 0.04F2 + εY<\/p><p>where F1 and F2 reflect surprises in two macroeconomic factors. If a portfolio has one quarter of its investment in Stock X and the rest in Stock Y, the portfolio&#x27;s expected return is closest to:<\/p>", "options": {"A": "12%.", "B": "14%.", "C": "18%."}}, {"id": "PM:VAR-M4-03", "rel": [], "los": "PM · 변형 (ECO M4 Q33, 오답노트 R37)", "tier": null, "type": "", "stem": "<p>A portfolio has a sensitivity of 0.8 to a size factor, while its benchmark has a sensitivity of 1.2. If the size factor return for the period is −2.0%, the contribution of the size factor to the portfolio’s active return is closest to:<\/p>", "options": {"A": "−0.8%.", "B": "+0.8%.", "C": "−1.6%."}}]}, {"set": 18, "session": 1, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p>Barbara Carlyle is a financial adviser to high-net-worth individuals. She is currently reviewing the equity portfolio of a client and is considering adding new securities to it, as the client has indicated a preference for more income-producing securities. With this in mind, Carlyle takes a closer look at Avignon Corporation (“Avignon”), a chain of Canadian boutiques that has recently registered unusually high sales, resulting in large increases in the company’s cash balance. Avignon’s current stock price is C$47.33. Exhibit 1 shows earnings and dividends for the preceding four years.<\/p><p>Exhibit 1: Avignon Corporation Earnings and Dividend History<\/p><table><tr><th><\/th><th>2013<\/th><th>2014<\/th><th>2015<\/th><th>2016<\/th><\/tr><tr><td>EPS<\/td><td>C$1.38<\/td><td>C$1.39<\/td><td>C$1.37<\/td><td>C$1.44<\/td><\/tr><tr><td>DPS<\/td><td>C$0.20<\/td><td>C$0.22<\/td><td>C$0.22<\/td><td>C$0.22<\/td><\/tr><\/table><p>Carlyle reviews analysts’ reports. She notes the significant change in cash due to the high sales volume and wonders whether that will prompt a dividend increase. However, most analysts have stated that because the industry is cyclical, the increase in sales is believed to be temporary.<\/p><p>Carlyle asks her assistant, Richard Lee, to investigate whether Avignon might use its surplus cash for a share repurchase rather than for dividends. Lee, a junior analyst, comments that share repurchases can be beneficial for several reasons:<\/p><p>Statement 1: The distribution of cash among shareholders is equivalent to what would have otherwise been distributed to them as dividends.<\/p><p>Statement 2: Share repurchases provide greater flexibility to management than the payment of cash dividends.<\/p><p>Statement 3: When directly negotiated, share repurchases can be used to purchase stock for less than the current market price.<\/p><p>Lee believes that looking at other companies that have completed share repurchases could be helpful to his analysis. He looks at the history of SpeedyPro Inc. (“SpeedyPro”), a US-based industrial services company whose business depends heavily on the petroleum exploration and production sector. SpeedyPro made its first share repurchase in early 2017 using surplus cash. SpeedyPro’s selected financial information just prior to the repurchase is shown in Exhibit 2.<\/p><p>Exhibit 2: SpeedyPro, Inc. Selected Financial Information as of Year-End 2016<\/p><table><tr><th>Net income<\/th><th>$124 million<\/th><\/tr><tr><td>EPS<\/td><td>$1.24<\/td><\/tr><tr><td>Shares outstanding<\/td><td>100 million<\/td><\/tr><tr><td>Cash available for repurchase<\/td><td>$836 million<\/td><\/tr><tr><td>Share price at the time of repurchase<\/td><td>$38.00<\/td><\/tr><tr><td>Premium over current share price for repurchase<\/td><td>10.0%<\/td><\/tr><\/table><p>Lee returns to Carlyle to continue the discussion. Carlyle explains to Lee that a complete analysis of the impact of a share repurchase should also include an evaluation of the effects on leverage. She points out that Avignon’s most recent bond issue includes a covenant that limits the company’s debt-to-equity ratio to 35%. She asks Lee to prepare an analysis for Avignon, using the information in Exhibit 3, to see if the debt covenant will be violated if the company repurchases shares.<\/p><p>Exhibit 3: Avignon Corporation Selected Financial Information as of Year-End 2016<\/p><table><tr><th>Book value of equity<\/th><th>C$3,600 million<\/th><\/tr><tr><td>Shares outstanding<\/td><td>200 million<\/td><\/tr><tr><td>Cash available for repurchase<\/td><td>C$155 million<\/td><\/tr><tr><td>Debt-to-equity ratio<\/td><td>30.0%<\/td><\/tr><tr><td>After-tax cost of debt<\/td><td>5.0%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "CI:ECO-M1-Q34", "rel": [], "los": "CI · ECO Module 1 Q34", "tier": null, "type": "", "stem": "<p>Based on Exhibit 2, SpeedyPro most likely repurchased shares using:<\/p>", "options": {"A": "open market purchases.", "B": "a fixed-price tender offer.", "C": "a negotiated purchase agreement."}}]}, {"set": 19, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Amanda Rodriguez is an alternative investment analyst for a US investment management firm, Delphinus Brothers. Delphinus’s chief investment officer, Michael Tang, has informed Rodriguez that he wants to reduce the amount invested in traditional asset classes and gain exposure to the real estate sector by acquiring commercial property in the United States. Rodriguez is asked to analyze potential commercial real estate investments for Delphinus Brothers. Selected data on three commercial real estate properties are shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Property Data<\/p><table><tr><th><\/th><th>Property 1<\/th><th>Property 2<\/th><th>Property 3<\/th><\/tr><tr><td>Property type<\/td><td>Downtown Office Building<\/td><td>Grocery-Anchored Retail Center<\/td><td>Multi-Family Building<\/td><\/tr><tr><td>Location<\/td><td>New York City<\/td><td>Miami<\/td><td>Boston<\/td><\/tr><tr><td>Age<\/td><td>10 years<\/td><td>7 years<\/td><td>5 years<\/td><\/tr><tr><td>Occupancy<\/td><td>90.00%<\/td><td>93.00%<\/td><td>95.00%<\/td><\/tr><tr><td>Square feet or number of units<\/td><td>100,000 sf<\/td><td>205,000 sf<\/td><td>360,000 sf<\/td><\/tr><tr><td>Gross potential rental income<\/td><td>$4,750,000<\/td><td>$1,800,000<\/td><td>$3,100,000<\/td><\/tr><tr><td>Loss to lease<\/td><td>($475,000)<\/td><td>($90,000)<\/td><td>$155,000<\/td><\/tr><tr><td>Gross rental income<\/td><td>$5,225,000<\/td><td>$1,890,000<\/td><td>$2,945,000<\/td><\/tr><tr><td>Vacancy loss<\/td><td>($564,333)<\/td><td>($156,887)<\/td><td>($157,250)<\/td><\/tr><tr><td>Net rental income<\/td><td>$4,660,667<\/td><td>$1,733,113<\/td><td>$2,787,750<\/td><\/tr><tr><td>Expense reimbursement revenue<\/td><td>$333,333<\/td><td>$426,248<\/td><td>$0<\/td><\/tr><tr><td>Other income (includes % rent)<\/td><td>$560,000<\/td><td>$15,000<\/td><td>$45,000<\/td><\/tr><tr><td>Effective gross income<\/td><td>$5,554,000<\/td><td>$2,174,361<\/td><td>$2,832,750<\/td><\/tr><tr><td>Property management fees<\/td><td>($203,160)<\/td><td>($83,374)<\/td><td>($119,510)<\/td><\/tr><tr><td>Other operating expenses<\/td><td>($2,100,000)<\/td><td>($342,874)<\/td><td>($1,175,000)<\/td><\/tr><tr><td>Net operating income<\/td><td>$3,250,840<\/td><td>$1,748,113<\/td><td>$1,538,240<\/td><\/tr><\/table><p>Rodriguez asks Tang about the relative magnitudes of operating expenses in determining property NOI. Tang explains that the retail center in Miami is able to be fully reimbursed for its operating expenses but that the office property in New York City and the multi-family property in Boston must absorb considerable unreimbursed operating expenses.<\/p><p>Tang comments to Rodriguez that these three properties may be in different phases of the real estate cycle. He specifically cites the differences between gross potential rental income and gross rental income in making his argument. In response to Tang’s comments, Rodriguez makes the two following statements about the office building in New York City:<\/p><p>Statement 1: I believe that the office market in New York City is likely to enter the recovery stage of the real estate cycle within two years.<\/p><p>Statement 2: I believe that the high vacancy rates indicate that the net operating income of the office building has the potential to improve within two years.<\/p><p>Tang continues the conversation by commenting about the relative riskiness of various types of real estate given such developments as the COVID-19 pandemic, the movement toward remote working, and the evolution of internet-based retail.<\/p><p>Rodriguez asks Tang about the appropriateness of various valuation methods on these three properties. Tang suggests that the sales comparison approach is likely to be useful, but he is particularly interested in seeing the valuation results from an income approach for each of the three properties.<\/p>", "exhibits": [], "qs": [{"id": "AI:ECO-M2-Q7", "rel": [], "los": "AI · ECO Module 2 Q7", "tier": null, "type": "", "stem": "<p>Which of the following properties is least likely to be in the oversupply phase of its real estate cycle, based on Tang’s argument?<\/p>", "options": {"A": "The office building in New York City", "B": "The retail center in Miami", "C": "The multi-family complex in Boston"}}]}, {"set": 20, "session": 1, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:SCH-M3-11", "rel": [], "los": "FSA · Schweser R9 개념 변형", "tier": null, "type": "", "stem": "<p>A subsidiary in a hyperinflationary economy reports annual revenue of LC1,000. General price index: beginning of year 100, average for year 160, end of year 240. Year-end exchange rate is €0.05 per LC. Under IFRS, revenue reported in euros is closest to:<\/p>", "options": {"A": "€50.", "B": "€75.", "C": "€120."}}]}, {"set": 21, "session": 1, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Stephen Russo is a treasury analyst at Central Finance Inc., which specializes in financing equipment and real estate. Russo and his manager, Ericka Patry, meet to discuss anticipated changes to interest rates and the potential impact on Central Finance&#x27;s portfolio.<\/p><p>Patry and Russo discuss the differences between Treasury rates and swap rates for the same maturity. Russo makes the following two comments.<\/p><p>Comment 1: Differences between the two rates arise because of differences in default risk and liquidity risk<\/p><p>Comment 2: Given the opportunity for arbitrage, differences between the two rates are minimal<\/p><p>In Exhibit 1, Patry presents current government bond spot rates and swap rates for annual maturities up to three years.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>1-year<\/th><th>2-year<\/th><th>3-year<\/th><\/tr><tr><td>Swap rates<\/td><td>2.97%<\/td><td>3.26%<\/td><td>3.43%<\/td><\/tr><tr><td>Treasury spot rates<\/td><td>2.88%<\/td><td>3.10%<\/td><td>3.21%<\/td><\/tr><\/table><p>Using the government rates, Russo determines the forward rate for a 1-year zero coupon bond issued one year from today.<\/p><p>Patry and Russo next discuss the term structure of interest rates. Russo accepts the theory that yields are solely a function of the supply and demand for funds at a particular maturity.<\/p><p>Central Finance manages yield curve risk using key rate durations and reviews portfolio exposures when there is a 25 basis point change in the yield curve. For one of the firm&#x27;s real estate portfolios, Patry shares with Russo the key rate durations and expected change in yield curve at various maturities in Exhibit 2.<\/p><p>Exhibit 2<\/p><table><tr><th>Maturity<\/th><th>Key Rate Duration<\/th><th>Change in Yield Curve (bps)<\/th><\/tr><tr><td>1 year<\/td><td>0.4444<\/td><td>18<\/td><\/tr><tr><td>5 years<\/td><td>0.5129<\/td><td>35<\/td><\/tr><tr><td>10 years<\/td><td>1.1030<\/td><td>57<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q62", "rel": [], "los": "Mock 2 Session 2 Q18", "tier": null, "type": "", "stem": "<p>The forward rate for a 1-year zero-coupon government bond issued one year from today is closest to:<\/p>", "options": {"A": "3.32%.", "B": "3.43%.", "C": "3.55%."}}]}, {"set": 22, "session": 1, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Schwalke is currently valuing LPE, a private furniture manufacturing company based in France. The company is owned entirely by the Lapiere family, with several family members employed as senior company managers. Jean Lapiere is the current CEO and owns 25% of LPE stock. LPE’s most recent income statement as part of its reviewed financial statements is as follows:<\/p><table><tr><th>As of 31 December (in EUR)<\/th><th>As Reported<\/th><\/tr><tr><td>Revenues<\/td><td>30,000,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>18,000,000<\/td><\/tr><tr><td>Gross profit<\/td><td>12,000,000<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>8,000,000<\/td><\/tr><tr><td>EBITDA<\/td><td>4,000,000<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>2,400,000<\/td><\/tr><tr><td>Earnings before interest and taxes<\/td><td>1,600,000<\/td><\/tr><tr><td>Pro forma taxes (at 25%)<\/td><td>400,000<\/td><\/tr><tr><td>Operating income after taxes<\/td><td>1,200,000<\/td><\/tr><\/table><p>As Schwalke reviews compensation expenses, he learns that Jean Lapiere’s annual compensation is EUR 300,000 and that CEOs of similarly sized consumer durable goods companies earn EUR 600,000 on average.<\/p><p>To estimate LPE’s required return on equity, Schwalke gathers betas from public furniture manufacturing companies, and after making appropriate adjustments, estimates LPE’s beta at 0.80. He uses an equity risk premium of 6%, a small-cap stock premium of 2%, a company-specific stock premium of 1.5%, and an industry risk premium of 1%.<\/p><p>After making other normalizing assumptions to LPE’s income statement and deducting the change in long-term assets of EUR 600,000 (equal to EUR 3,000,000 in capital expenditures less EUR 2,400,000 in depreciation), Schwalke estimates FCFF for the base year to be EUR 600,000. He decides to use the CCM in his income approach to valuing LPE with a WACC of 8% and perpetual growth of 4%.<\/p><p>Given the availability of similar publicly traded furniture manufacturing companies, Schwalke also uses a market approach to value LPE. He finds an average EV/Sales multiple of 0.60 from these public comparable companies. Schwalke notes that LPE’s debt is currently EUR 6 million.<\/p><p>Jean Lapiere is seeking an estimate of the value of his LPE ownership stake. In the course of discussing the ownership structure, Schwalke concludes that none of the family members, including Jean, has a controlling interest in the company. Schwalke estimates discounts for lack of control and lack of marketability as 20% and 15%, respectively.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M6-Q14", "rel": [], "los": "Equity · ECO Module 6 Q14", "tier": null, "type": "", "stem": "<p>Which of the following is closest to the proper calculation of LPE’s equity value using the EV/Sales multiple?<\/p>", "options": {"A": "EUR 18 million", "B": "EUR 12 million", "C": "EUR 24 million"}}]}, {"set": 23, "session": 1, "topic": "Economics", "code": "ECO", "vignette": "<p>Jennifer Francis is a currency specialist helping clients manage their foreign exchange exposures. All currencies are quoted as the amount of the numerator currency per one unit of the denominator currency (e.g., USD/EUR is quoted as the amount of USD per 1 EUR).<\/p><p>Francis is working with a client looking to execute a trade in the Thai baht (THB) and Australian dollar (AUD) currency pair. Francis receives a bid–offer quote in THB/AUD (24.3065/24.3090) from a dealer and compares this to the interbank market quotes in THB/USD (33.3942/33.3965) and USD/AUD (0.7276/0.7279) to see if an arbitrage opportunity exists.<\/p><p>Stephan Podowski is a client of Francis&#x27; located in Country A, whose currency is the FXA. Podowski&#x27;s company will receive a payment in Country B&#x27;s currency (FXB) in 18 months, and he is considering using a forward contract to hedge the currency exposure. Francis uses the following information to determine the forward discount for a 540-day FXA/FXB forward contract:<\/p><p>FXA/FXB spot exchange rate: 1.1423;<\/p><p>540-day market reference rate (annualized, Actual/360) for Country A: 1.23%;<\/p><p>540-day market reference rate (annualized, Actual/360) for Country B: 5.52%.<\/p><p>Nine months ago, Podowski bought EUR

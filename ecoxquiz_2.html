rterly dividends paid by the company have been added to arrive at the annual dividends. Rae has also computed the dividend payout ratio for each year as DPS/EPS and the growth rates in EPS and DPS.<\/p><table><tr><th>Year<\/th><th>EPS ($)<\/th><th>DPS ($)<\/th><th>Payout Ratio<\/th><th>Growth in EPS (%)<\/th><th>Growth in DPS (%)<\/th><\/tr><tr><td>20X8<\/td><td>2.12<\/td><td>0.59<\/td><td>0.278<\/td><td>2.9<\/td><td>3.5<\/td><\/tr><tr><td>20X7<\/td><td>2.06<\/td><td>0.57<\/td><td>0.277<\/td><td>2.5<\/td><td>5.6<\/td><\/tr><tr><td>20X6<\/td><td>2.01<\/td><td>0.54<\/td><td>0.269<\/td><td>6.3<\/td><td>5.9<\/td><\/tr><tr><td>20X5<\/td><td>1.89<\/td><td>0.51<\/td><td>0.270<\/td><td>6.2<\/td><td>6.3<\/td><\/tr><tr><td>20X4<\/td><td>1.78<\/td><td>0.48<\/td><td>0.270<\/td><td><\/td><td><\/td><\/tr><\/table><p>Rae notes that the company’s EPS has been increasing at an average rate of 4.48% per year. The dividend payout ratio has remained fairly stable, and dividends have increased at an average rate of 5.30%. In view of a history of dividend payments by the company and the understandable relationship dividend policy bears to the company’s earnings, Rae concludes that the DDM is appropriate to value the equity of Tasty Foods. Further, he expects the company’s moderate growth rate to persist and decides to use the Gordon growth model.<\/p><p>Rae uses the CAPM to compute the return on equity. He uses the annual yield of 4% on the 10-year Treasury bond as the risk-free return. He estimates the expected US equity risk premium, with the S&amp;P 500 Index used as a proxy for the market, to be 6.5% per year. The estimated beta of Tasty Foods against the S&amp;P 500 Index is 1.10. Accordingly, Rae’s estimate for the required return on equity for Tasty Foods is 0.04 + 1.10(0.065) = 0.1115, or 11.15%.<\/p><p>Using the past growth rate in dividends of 5.30% as his estimate of the future growth rate in dividends, Rae computes the value of Tasty Foods stock. He shows his analysis to Alex Renteria, his colleague at the pension fund who specializes in the frozen foods industry. Renteria concurs with the valuation approach used by Rae but disagrees with the future growth rate he used. Renteria believes that the stock’s current price of $8.42 is the fair value of the stock.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M2-Q21", "rel": [], "los": "Equity · ECO Module 2 Q21", "tier": null, "type": "", "stem": "<p>If Renteria is correct that the current price of Tasty Foods stock is its fair value, what is the expected capital gains yield on the stock?<\/p>", "options": {"A": "3.87%.", "B": "4.25%.", "C": "5.30%."}}]}, {"set": 46, "session": 2, "topic": "Derivatives", "code": "DER", "vignette": "<p>Trident Advisory Group manages assets for high-net-worth individuals and family trusts.<\/p><p>Alice Lee, chief investment officer, is meeting with a client, Noah Solomon, to discuss risk management strategies for his portfolio. Solomon is concerned about recent volatility and has asked Lee to explain options valuation and the use of options in risk management.<\/p><p>Options on Stock<\/p><p>Lee uses the BSM model to price TCB, which is one of Solomon&#x27;s holdings. Exhibit 1 provides the current stock price (S), exercise price (X), risk-free interest rate (r), volatility (σ), and time to expiration (T) in years as well as selected outputs from the BSM model. TCB does not pay a dividend.<\/p><p>Exhibit 1 – BSM Model for European Options on TCB<\/p><table><tr><th>S<\/th><th>X<\/th><th>r<\/th><th>σ<\/th><th>T<\/th><\/tr><tr><td>$57.03<\/td><td>55<\/td><td>0.22%<\/td><td>32%<\/td><td>0.25<\/td><\/tr><tr><td>d1<\/td><td>N(d1)<\/td><td>d2<\/td><td>N(d2)<\/td><td>Call / Put<\/td><\/tr><tr><td>0.3100<\/td><td>0.6217<\/td><td>0.1500<\/td><td>0.5596<\/td><td>$4.695 / $2.634<\/td><\/tr><\/table><p>Options on Futures<\/p><p>The Black model valuation and selected outputs for options on another of Solomon&#x27;s holdings, the GPX 500 Index (GPX), are shown in Exhibit 2. The spot index level for the GPX is 187.95, and the index is assumed to pay a continuous dividend at a rate of 2.2% (δ) over the life of the options being valued, which expire in 0.36 years. A futures contract on the GPX also expiring in 0.36 years is currently priced at 186.73.<\/p><p>Exhibit 2 – Black Model for European Options on the GPX Index<\/p><table><tr><th>GPX Index<\/th><th>X<\/th><th>r<\/th><th>σ<\/th><th>T<\/th><th>δ Yield<\/th><\/tr><tr><td>187.95<\/td><td>180<\/td><td>0.39%<\/td><td>24%<\/td><td>0.36<\/td><td>2.2%<\/td><\/tr><tr><td>Model Call<\/td><td>Model Put<\/td><td>Market Call<\/td><td>Market Put<\/td><td><\/td><td><\/td><\/tr><tr><td>$14.2089<\/td><td>$7.4890<\/td><td>$14.26<\/td><td>$7.20<\/td><td><\/td><td><\/td><\/tr><tr><td>Delta (call)<\/td><td>Delta (put)<\/td><td>Gamma<\/td><td>Theta (call, daily)<\/td><td>Rho (call, per %)<\/td><td>Vega (per %)<\/td><\/tr><tr><td>0.6232<\/td><td>–0.3689<\/td><td>0.0139<\/td><td>–0.0327<\/td><td>0.3705<\/td><td>0.4231<\/td><\/tr><\/table><p>After reviewing Exhibit 2, Solomon asks Lee which option Greek letter best describes the changes in an option&#x27;s value as time to expiration declines.<\/p><p>Solomon observes that the market price of the put option in Exhibit 2 is $7.20. Lee responds that she used the historical volatility of the GPX of 24% as an input to the BSM model, and she explains the implications for the implied volatility for the GPX.<\/p><p>Options on Interest Rates<\/p><p>Solomon forecasts the three-month MRR will exceed 0.85% in six months and is considering using options to reduce the risk of rising rates. He asks Lee to value an interest rate call with a strike price of 0.85%. The current three-month MRR is 0.60%, and an FRA for a three-month MRR loan beginning in six months is currently 0.75%.<\/p><p>Hedging Strategy for the Equity Index<\/p><p>Solomon&#x27;s portfolio currently holds 10,000 shares of an exchange-traded fund (ETF) that tracks the GPX. He is worried the index will decline. He remarks to Lee, &quot;You have told me how the BSM model can provide useful information for reducing the risk of my GPX position.&quot; Lee suggests a delta hedge as a strategy to protect against small moves in the GPX Index.<\/p><p>Lee also indicates that a long position in puts could be used to hedge larger moves in the GPX. She notes that although hedging with either puts or calls can result in a delta-neutral position, they would need to consider the resulting gamma.<\/p>", "exhibits": [], "qs": [{"id": "Deriv:ECO-M2-Q15", "rel": [], "los": "Deriv · ECO Module 2 Q15", "tier": null, "type": "", "stem": "<p>The valuation inputs used by Lee to price a call reflecting Solomon&#x27;s interest rate views should include an underlying FRA rate of:<\/p>", "options": {"A": "0.60% with six months to expiration.", "B": "0.75% with nine months to expiration.", "C": "0.75% with six months to expiration."}}]}, {"set": 47, "session": 2, "topic": "Quantitative Methods", "code": "QM", "vignette": "<p>Megan Helmer is an analyst at Acuity Investments. She uses machine learning to build a model that categorizes companies according to whether their predicted ROE is low or high. The model uses multiple features to explain the variations in ROE. The model produces low error rates using training data, but much higher error rates using out-of-sample data.<\/p><p>Helmer also builds a logistic regression model to predict the 1-year probability of default for junk bond issuers. She collects data for 70 issuers over the past five years and identifies those that defaulted within the subsequent year (DEFAULT = 1) and those that did not default (DEFAULT = 0). She uses two independent variables in the logistic regression model: the ratio of debt to total capital (LEVERAGE) and the interest coverage ratio (COVERAGE). The coefficients of the regression are shown in Exhibit 1. Using this model, Helmer then estimates the probability of default by ACME, an issuer with LEVERAGE of 0.8 and COVERAGE of 0.9.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Coefficient<\/th><\/tr><tr><td>Intercept<\/td><td>–20.0<\/td><\/tr><tr><td>LEVERAGE<\/td><td>65.5<\/td><\/tr><tr><td>COVERAGE<\/td><td>–35.0<\/td><\/tr><\/table><p>Next, Helmer builds a linear regression model for manufacturing companies (Model 1) to forecast the impact of inflation caused by supply chain disruptions on profit margin. She uses five years of quarterly data for 100 companies and the following model specification:<\/p><p>Model 1: MARGINt = b0 + b1INPUTt + b2LOGISTICSt + εt,<\/p><p>where MARGIN is profit margin, INPUT is raw material cost inflation, and LOGISTICS is freight cost inflation.<\/p><p>Helmer assesses possible violations of regression assumptions in Model 1 and makes the following observations:<\/p><p>Observation 1: There are significant deviations of the residuals from the diagonal in the Q-Q plot.<\/p><p>Observation 2: The null hypothesis of the Breusch–Pagan test is rejected.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q34", "rel": [], "los": "Mock 1 Session 1 Q34", "tier": null, "type": "", "stem": "<p>Based on the logistic regression model, the probability that ACME defaults within the next year is closest to:<\/p>", "options": {"A": "29%.", "B": "71%.", "C": "90%."}}]}, {"set": 48, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Dagny Solberg is chief investment officer of the Harrowgate Teachers' Pension Fund. She meets with Rafael Quintero, who manages the fund's government bond portfolio, to review positioning. The government spot curve is upward sloping (Exhibit 1). All rates are annual-compounding, and all government bonds are assumed to be default-free.<\/p>\n<p>The fund will receive a &euro;150 million lump-sum contribution from a participating school district in exactly three years. Solberg wants to invest the contribution for two years from the date it is received and asks Quintero for the rate the fund could lock in today for that future investment.<\/p>\n<p>Separately, the fund has &euro;400 million of cash that it must hold in government bonds for exactly two years. Quintero proposes buying five-year zero-coupon government bonds and selling them after two years rather than buying two-year zero-coupon government bonds and holding them to maturity. Solberg comments, \"My base case is that the spot curve two years from now will have the same level and shape as today's curve.\"<\/p>\n<p>Quintero then shares his own interest rate view: he expects the two-year spot rate three years from now to be 4.20%. He explains that the fund could act on this view using forward contracts on two-year zero-coupon government bonds for settlement in three years.<\/p>\n<p>Finally, Solberg reviews the relative value of a five-year bond issued by a AA-rated European utility that the fund holds in a separate credit mandate. She asks Quintero to report the five-year swap spread using the market data in Exhibit 2.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Government Spot Rates<\/caption><thead><tr><th>Maturity (years)<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td>Government spot rate<\/td><td>2.40%<\/td><td>2.90%<\/td><td>3.30%<\/td><td>3.60%<\/td><td>3.85%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Five-Year Market Rates<\/caption><thead><tr><th>Five-year instrument<\/th><th>Rate<\/th><\/tr><\/thead><tbody><tr><td>Yield to maturity of on-the-run five-year government bond (trading at par)<\/td><td>3.80%<\/td><\/tr><tr><td>Five-year fixed-for-floating interest rate swap rate<\/td><td>4.25%<\/td><\/tr><tr><td>Yield to maturity of AA-rated utility bond<\/td><td>4.53%<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s06-q4", "rel": [], "los": "Agent Mock 1 Q24", "tier": null, "type": "", "stem": "The five-year swap spread that Quintero reports is <i>closest<\/i> to:", "options": {"A": "28 basis points.", "B": "40 basis points.", "C": "45 basis points."}}]}, {"set": 49, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M6-Q42", "rel": [], "los": "Equity · ECO Module 6 Q42", "tier": null, "type": "", "stem": "<p>An analyst identifies the following characteristics that make a private company different from public companies:<\/p><p>The financial statements have limited disclosures<\/p><p>The senior management owns 60% of the shares<\/p><p>The shareholder agreement restricts the ability to sell shares<\/p><p>Which characteristic would most likely have a positive effect on the private company valuation?<\/p>", "options": {"A": "Limited financial statement disclosures", "B": "Senior management owning a controlling interest in the company", "C": "A shareholder agreement that restricts the shareholders&#x27; ability to sell shares"}}]}, {"set": 50, "session": 2, "topic": "Derivatives", "code": "DER", "vignette": "<p>Lucy Wang is a derivatives trader for a South African broker-dealer. All of her firm&#x27;s trades are in South African rand (ZAR) and use a 30/360 day count convention.<\/p><p>Wang wants to hedge a floating-rate note held by her firm against a decline in interest rates. She uses data from Exhibit 1 to price a 3 × 12 forward rate agreement (FRA).<\/p><p>Exhibit 1<\/p><table><tr><th>Maturity<\/th><th>Spot Market Reference Rate<\/th><th>Present Value Factor<\/th><\/tr><tr><td>3-month<\/td><td>3.67%<\/td><td>0.9909<\/td><\/tr><tr><td>6-month<\/td><td>3.79%<\/td><td>0.9814<\/td><\/tr><tr><td>12-month<\/td><td>4.15%<\/td><td>0.9602<\/td><\/tr><\/table><p>Wang analyzes a receive-fixed, pay-floating interest rate swap with a fixed rate of 7.38% with a 1-year remaining maturity. The notional amount of the swap is ZAR 10,000,000 which resets semiannually. She values the swap position using the current 1-year fixed rate of 4.10% and data from Exhibit 1.<\/p><p>Next, Wang determines the no-arbitrage price of a bond forward contract. She uses information from Exhibit 2 and an annualized risk-free rate of 3.7%.<\/p><p>Exhibit 2<\/p><table><tr><th>Quoted bond price without accrued interest (% of par)<\/th><th>105.0<\/th><\/tr><tr><td>Future value of coupon interest (% of par)<\/td><td>4.51<\/td><\/tr><tr><td>Accrued interest at contract initiation (% of par)<\/td><td>3.00<\/td><\/tr><tr><td>Accrued interest at contract expiration (% of par)<\/td><td>0.75<\/td><\/tr><tr><td>Time to forward contract expiration<\/td><td>90 days<\/td><\/tr><tr><td>Conversion factor<\/td><td>1.0<\/td><\/tr><\/table><p>Wang then evaluates whether an arbitrage opportunity exists in 9-month forward contracts on the shares of Pintel Electronics. She is quoted a 9-month forward price of ZAR 816 by a dealer. Pintel shares currently trade at ZAR 850 and will pay a dividend of ZAR 34 in six months.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q2", "rel": [], "los": "Mock 2 Session 1 Q2", "tier": null, "type": "", "stem": "<p>The value (in ZAR) of the receive-fixed interest rate swap position is closest to:<\/p>", "options": {"A": "318,000.", "B": "398,000.", "C": "481,000."}}]}, {"set": 51, "session": 2, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Matteo Rossi is a financial adviser specializing in commercial real estate investing. He meets with Anika Patel, a new client, who wants to diversify her portfolio by adding real estate investments to it.<\/p><p>Using data from an appraisal-based index, Rossi discusses real estate return and risk statistics with Patel and compares them to the return and risk of Patel&#x27;s current portfolio of stocks and bonds. Based on Patel&#x27;s investment objectives, Rossi recommends the following types of investments:<\/p><p>• Investment 1: A real estate operating company (REOC);<\/p><p>• Investment 2: An equity real estate investment trust (REIT).<\/p><p>Patel asks Rossi how REITs and REOCs are valued. Rossi mentions that the following measures are widely used in the valuation of REITs and REOCs:<\/p><p>• Measure 1: EBITDA;<\/p><p>• Measure 2: Funds from operations (FFO);<\/p><p>• Measure 3: Adjusted funds from operations (AFFO).<\/p><p>Next, Rossi presents Patel with the valuation of a REIT. REIT A is a multi-family REIT and its NAV is calculated based on the net operating income (NOI) information in Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>REIT A<\/th><\/tr><tr><td>Property subsector<\/td><td>Multi-family<\/td><\/tr><tr><td>Last-12-month real estate NOI<\/td><td>$280,000<\/td><\/tr><tr><td>Last-12-month non-cash rent<\/td><td>$9,800<\/td><\/tr><tr><td>Last-12-month capital expenditures<\/td><td>$40,000<\/td><\/tr><tr><td>Cash and equivalents<\/td><td>$69,300<\/td><\/tr><tr><td>Total debt<\/td><td>$823,000<\/td><\/tr><tr><td>Discount rate<\/td><td>6.5%<\/td><\/tr><tr><td>Estimated growth rate<\/td><td>1.5%<\/td><\/tr><tr><td>Shares outstanding<\/td><td>50,000<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "AI:ECO-M2-Q16", "rel": [], "los": "AI · ECO Module 2 Q16", "tier": null, "type": "", "stem": "<p>The type of index Rossi uses will most likely:<\/p>", "options": {"A": "introduce noise in the index measurement.", "B": "overstate the diversification benefits of real estate.", "C": "have values that lead the transaction values in the market."}}]}], "sessSec": {"1": 7920, "2": 7740}};

// ---------- 복습: 채점 후 시험 화면 그대로 한 문항씩 ----------
const SFILT = [["wf", "오답+Flag"], ["wrong", "오답"], ["flag", "Flag"], ["all", "전체"]];

}

// ---------- 다시 풀기: 채점한 세션의 오답·Flag만 골라 한 문항씩 바로 채점 (시험 답안·점수는 그대로) ----------
const RFILT = {wf: "오답+Flag", wrong: "오답", flag: "Flag", all: "전체"};

function retryIds(se, f, rows) {
  rows = rows || grade();
  return rows.filter(r => S.sub[r.sess] && (!se || r.sess === se))
    .filter(r => f === "all" || (f === "wrong" && !r.ok) || (f === "flag" && r.flag) || (f === "wf" && (!r.ok || r.flag))).map(r => r.id);
}
function retryBtns(se, rows) {
  return ["wf", "wrong", "flag"].map(f => { const n = retryIds(se, f, rows).length;
    return `<button data-r="${se}:${f}"${n ? "" : " disabled"}>${se ? "" : "전체 "}${RFILT[f]} 다시 풀기 (${n})</button>`; }).join(" ");
}
function startRetry(ids, label) {
  if (!ids.length) return;
  S.retry = {ids, i: 0, res: {}, label, done: false};
  S.phase = "retry"; $("app").dataset.mode = ""; save(); render();
}
function retryStats() {
  const T = S.retry, sec = getSecret(); let ok = 0, bad = 0;
  T.ids.forEach(id => { const v = T.res[id]; if (v) { if (v === sec[id].a) ok++; else bad++; } });
  return {ok, bad, answered: ok + bad, total: T.ids.length};
}
function retryGo(i) { const T = S.retry; if (i < 0 || i >= T.ids.length) return; T.i = i; T.done = false; save(); renderRetry(); }
function retryAnswer(k) { const T = S.retry, id = T.ids[T.i]; if (T.res[id]) return; T.res[id] = k; save(); renderRetry(); }
// 다음: 안 푼 문제면 패스. 마지막 문제에서 패스하면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로
function retryNext() {
  const T = S.retry;
  if (T.i < T.ids.length - 1) return retryGo(T.i + 1);
  const j = T.ids.findIndex((id, k) => !T.res[id] && k !== T.i);
  if (!T.res[T.ids[T.i]] && j >= 0) return retryGo(j);
  T.done = true; save(); renderRetry();
}
function renderRetry() {
  const T = S.retry, app = $("app");

  $("rscore").textContent = `정답 ${st.ok} · 오답 ${st.bad} · 남음 ${st.total - st.answered}`;
  $("next").textContent = sel ? (T.i === T.ids.length - 1 ? "결과 보기 ▶" : "Next ▶") : "패스 ▶";
  renderLeft(x, renderRetry);
  const R = $("right");
  R.scrollTop = 0;
  R.innerHTML = (sel ? `<div class="sh"><b class="${sel === ans ? "okc" : "warn"}">${sel === ans ? "정답" : "오답"}</b><span class="mut">고른 답 ${sel} · 정답 ${ans}${S.flagged[id] ? " · ⚑ Flag" : ""}</span><span class="tag">${esc(q.los)}</span></div>` : "") +
    `<div class="mut" style="font-size:13px">Question ${x.no}</div><div class="stem">${q.stem}</div>` +
    Object.keys(q.options).map(k => sel

    (sel ? `${noteHTML(sec)}<details class="raw"><summary>원문 해설 (출처 포함)</summary><div class="expl">${esc(sec.e)}</div></details>` : "");
  if (!sel) R.querySelectorAll(".opt").forEach(o => o.onclick = () => retryAnswer(o.dataset.k));
  typeset(R);

    return `<button class="nb${v ? (v === sc[rid].a ? " rok" : " nno") : ""}${k === T.i ? " cur" : ""}${S.flagged[rid] ? " fl" : ""}" data-k="${k}" title="S${QL[byId[rid]].sess} Q${QL[byId[rid]].no}">${QL[byId[rid]].no}</button>`; }).join("");
  $("nav").querySelectorAll("button").forEach(bt => bt.onclick = () => retryGo(+bt.dataset.k));

function renderRetryResult(app) {

// ---------- grading ----------
function grade() {
  const sec = getSecret();
  const rows = QL.map((x, i) => {
    const q = x.q, id = q.id, sel = S.answers[id] || null, ans = sec[id].a, s = DATA.sets[x.si];
    return {i, id, x, q, set: s.set, sess: x.sess, code: s.code, topic: s.topic, los: q.los, tier: q.tier, sel, ans,
            ok: sel === ans, time: S.time[id] || 0, flag: !!S.flagged[id]};
  });
  return rows;
}
const pct = (n, d) => d ? Math.round(1000 * n / d) / 10 : 0;
const bar = p => `<div class="bar"><i style="width:${p}%"></i></div>`;
function agg(rows, keyf) {
  const m = {};
  rows.forEach(r => { const k = keyf(r); (m[k] = m[k] || {n: 0, c: 0, t: 0}); m[k].n++; m[k].c += r.ok ? 1 : 0; m[k].t += r.time; });
  return m;
}
const pauseLine = () => `일시정지 ${S.pauseLog.length}회 · 총 ${fmt(pauseTotal())}`;
function renderResults(app) {

      <p class="mut">비공식 참고선 ~65–70% (CFA Institute는 합격선을 공개하지 않음). ${S.unlimited ? "<b class='warn'>※ 시간 무제한 모드로 응시</b>" : ""}${[1, 2].filter(k => S.rem[k] < 0 && rows.some(r => r.sess === k)).map(k => ` <b class='warn'>※ Session ${k} 시간 초과 +${fmt(-S.rem[k])}</b>`).join("")}</p>

      Object.keys(m).sort((a, b) => pct(m[a].c, m[a].n) - pct(m[b].c, m[b].n)).map(k => `<tr><td>${k}</td><td class="n">${m[k].c}/${m[k].n}</td><td class="n">${pct(m[k].c, m[k].n)}%</td><td>${bar(pct(m[k].c, m[k].n))}</td><td class="n">${pct(m[k].n, n)}%</td><td class="n">${OFFICIAL[k] ? OFFICIAL[k][0] + "–" + OFFICIAL[k][1] + "%" : "-"}</td></tr>`).join("") + `</table></div>

// ---------- export / import ----------
function exportJSON() {
  save();
  // 정답은 제출한 세션 문항만 기록
  const rows = (S.sub[1] || S.sub[2]) ? grade() : null, answers = {};
  QL.forEach(x => { const id = x.q.id; if (S.answers[id] || S.time[id]) answers[id] = {selected: S.answers[id] || null, correct: rows && S.sub[x.sess] ? rows[byId[id]].ans : null, time: S.time[id] || 0}; });

 20 million forward against the USD by entering into a 1-year forward contract at 1.1308 USD/EUR. He wants to calculate the mark-to-market value of this position today. The current USD/EUR spot rate is quoted at 1.1352/1.1355 and the 90-day forward points are –14/–12. The annualized 90-day market reference rate (Actual/360) is 0.53% for USD and 0.77% for EUR.<\/p><p>Francis is looking for potential carry trades to recommend to her clients. She focuses on a potential trade between the AUD and the South African rand (ZAR). She reviews what market conditions are required for the trade to be profitable.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q36", "rel": [], "los": "Mock 2 Session 1 Q36", "tier": null, "type": "", "stem": "<p>What condition would best support Francis&#x27; trade proposal between AUD and ZAR?<\/p>", "options": {"A": "Low market volatility", "B": "Covered interest rate parity not holding in the short term", "C": "The interest rate differential between the two countries being expected to widen after the trade is initiated"}}]}, {"set": 24, "session": 1, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p>Sebastian Traver is a financial analyst at Feldcroft Inc., a large, US-based construction company specializing in commercial and residential projects. He is reviewing the company&#x27;s asset financing options and evaluating potential growth opportunities.<\/p><p>Feldcroft is considering the purchase of a new corporate helicopter to access remote construction sites. Traver evaluates a proposal for a 10-year lease with payments of $125,000 at the end of each month. The helicopter has a fair value of $15 million, and the lessor would incur a direct cost of $750,000 at the beginning of the lease. The residual value of the helicopter at the end of the lease is expected to be $8,700,000. Feldcroft has an unsecured incremental borrowing rate of 8%.<\/p><p>Feldcroft has operations in Country A, an emerging market that represents 10% of the company&#x27;s revenue. To estimate the equity risk premium that should be used in calculating Feldcroft&#x27;s cost of equity, Traver uses the country spread model with no adjustment for the relative volatility of Country A equity and bond returns. The current US equity risk premium is 5.94% and 10-year US Treasury bonds yield 3.50%. Country A recently issued a 10-year bond denominated in local currency that yields 7.55% and a 10-year bond denominated in US dollars that yields 5.15%.<\/p><p>Feldcroft is considering acquiring a construction company that has sales of $7.00 per share. To estimate a fair takeover value for this target company, Traver uses comparable transaction analysis with equal weights on three transactions, as shown in Exhibit 1. He notes that Feldcroft&#x27;s current price-to-sales (P/S) ratio is 1.35 and that transactions in the construction industry take place at an average takeover premium of 8%.<\/p><p>Exhibit 1<\/p><table><tr><th>Variable<\/th><th>Acquired Company 1<\/th><th>Acquired Company 2<\/th><th>Acquired Company 3<\/th><\/tr><tr><td>Sales per share<\/td><td>$6.30<\/td><td>$12.98<\/td><td>$9.01<\/td><\/tr><tr><td>P/S ratio at acquisition price<\/td><td>1.78<\/td><td>1.84<\/td><td>1.63<\/td><\/tr><\/table><p>Finally, Traver prepares a pro forma income statement reflecting the acquisition of the target construction company. He assumes the acquisition would generate cost synergies and be funded with new debt, which would include refinancing the target company&#x27;s existing debt. After separating depreciation and amortization from operating expenses, Traver models selected pro forma income statement balances as follows:<\/p><p>Interest expense: Add interest expense from the new debt issuance to the target company&#x27;s current interest expense<\/p><p>Operating expenses: Add cost synergies to and subtract cost dis-synergies from combined operating expenses<\/p><p>Depreciation and amortization expense: Add amortization of acquired intangible assets to combined depreciation and amortization expense<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q30", "rel": [], "los": "Mock 1 Session 1 Q30", "tier": null, "type": "", "stem": "<p>Based on the country spread model, the equity risk premium that should be used in calculating Feldcroft&#x27;s cost of equity is closest to:<\/p>", "options": {"A": "6.11%.", "B": "6.35%.", "C": "7.59%."}}]}, {"set": 25, "session": 1, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Sarah Lambert is an investment advisor meeting with one of her clients, Edward Banner. Banner is considering adding real estate and commodities to his portfolio.<\/p><p>Real Estate<\/p><p>Lambert researches REIT A, a hotel REIT, and notes that recent property market transaction volumes have been high. In addition, REIT A has recorded a number of one-time gains and charges. Lambert considers the potential impact these issues could have on different valuation approaches.<\/p><p>Lambert next reviews REIT B, an industrial REIT. She performs a price-to-adjusted funds from operations (P/AFFO) calculation based on the full-year financial information (in thousands) contained in Exhibit 1. The current share price is $74.65.<\/p><p>Exhibit 1<\/p><table><tr><th>Funds from operations<\/th><th>$465,419<\/th><\/tr><tr><td>(Gains)/Losses from sale of depreciable real estate<\/td><td>$22,613<\/td><\/tr><tr><td>Non-cash (straight-line) rent adjustment<\/td><td>$14,705<\/td><\/tr><tr><td>Recurring maintenance-type capital expenditures and leasing commissions<\/td><td>$33,297<\/td><\/tr><tr><td>Shares outstanding<\/td><td>100,000<\/td><\/tr><\/table><p>Lambert carries out further analysis on the wider economy and forecasts that job creation, retail sales growth, and consumer credit will all be stronger than expected. Based on these forecasts, she recommends hotel REITs over industrial REITs.<\/p><p>Commodities<\/p><p>Lambert then recommends an investment in the Gemini Commodity Futures Fund. According to Gemini&#x27;s prospectus, the fund always takes a long position in the natural gas futures contract with the shortest maturity. At the contract maturity date, Gemini sells the existing contract and buys the new contract with the shortest maturity. In Exhibit 2, Lambert gathers prior-year price information from the natural gas futures market for two of Gemini&#x27;s trade dates. All prices are in $ per million British thermal units as of the date listed.<\/p><p>Exhibit 2<\/p><table><tr><th>Trade Date<\/th><th>Spot Price<\/th><th>June Futures Price<\/th><th>July Futures Price<\/th><th>August Futures Price<\/th><\/tr><tr><td>28 May<\/td><td>2.546<\/td><td>2.489<\/td><td>2.418<\/td><td>1.957<\/td><\/tr><tr><td>26 June<\/td><td>2.546<\/td><td>2.546<\/td><td>2.338<\/td><td>1.795<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q37", "rel": [], "los": "Mock 1 Session 1 Q37", "tier": null, "type": "", "stem": "<p>The issues Lambert is considering regarding REIT A would pose a disadvantage for which of the following valuation models?<\/p>", "options": {"A": "Net asset value", "B": "P/AFFO multiple", "C": "Dividend discount model"}}]}, {"set": 26, "session": 2, "topic": "Economics", "code": "ECO", "vignette": "<p>Amara Okafor is a currency strategist at Lindqvist Partners, a Zurich-based fund manager that reports in Swiss francs (CHF). She is reviewing the fund's exposure to Tavaria, an emerging market whose currency is the Tavarian lira (TVL). Exchange rates are quoted as TVL/CHF (the number of TVL per CHF). Current money market rates are shown in Exhibit 1, and today's dealer quotes are shown in Exhibit 2.<\/p>\n<p>Okafor is considering a new 180-day TVL deposit for the fund that would be fully hedged back into CHF with a forward contract. A junior analyst remarks that \"a hedged TVL deposit lets us earn the 9.20% Tavarian rate without currency risk.\"<\/p>\n<p>Ninety days ago, to hedge existing Tavarian bond holdings, the fund entered into a 180-day forward contract to buy CHF 10,000,000 against TVL at a forward rate of 21.4800. Okafor wants to report the contract's current mark-to-market value.<\/p>\n<p>Okafor's colleague, Henrik Sjöberg, proposes a leveraged carry trade: borrowing CHF for 90 days and investing the proceeds in TVL deposits. Sjöberg notes that the TVL has been stable for the past 18 months and that implied volatility in TVL/CHF is near a five-year low.<\/p>\n<p>Okafor is also tracking policy developments. Tavaria maintains capital controls that sharply restrict cross-border portfolio flows. Its newly elected government has announced a large increase in infrastructure spending financed by borrowing, and the Tavarian central bank, under pressure to support growth, has cut its policy rate by 100 basis points. Meanwhile, the Swiss National Bank has left its policy rate unchanged.<\/p><div class=\"tbl\"><table><caption>Exhibit 1: Annualized Money Market Rates (actual/360)<\/caption><thead><tr><th>Currency<\/th><th>90-day rate<\/th><th>180-day rate<\/th><\/tr><\/thead><tbody><tr><td>CHF<\/td><td>1.00%<\/td><td>1.10%<\/td><\/tr><tr><td>TVL<\/td><td>9.00%<\/td><td>9.20%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><caption>Exhibit 2: Dealer Quotes Today (forward points are scaled by 10,000)<\/caption><thead><tr><th>Quote<\/th><th>Bid<\/th><th>Ask<\/th><\/tr><\/thead><tbody><tr><td>Spot TVL/CHF<\/td><td>21.1500<\/td><td>21.1600<\/td><\/tr><tr><td>90-day forward points<\/td><td>+4,210<\/td><td>+4,230<\/td><\/tr><\/tbody><\/table><\/div>", "exhibits": [], "qs": [{"id": "cMock1:m1-s04-q1", "rel": [], "los": "Agent Mock 1 Q13", "tier": null, "type": "", "stem": "Using the mid-market spot rate, the 180-day TVL/CHF forward rate consistent with covered interest rate parity is <i>closest<\/i> to:", "options": {"A": "20.3359.", "B": "22.0071.", "C": "22.8499."}}, {"id": "cMock1:m1-s04-q2", "rel": [], "los": "Agent Mock 1 Q14", "tier": null, "type": "", "stem": "The current mark-to-market value of the fund's existing forward contract is <i>closest<\/i> to:", "options": {"A": "TVL 889,976.", "B": "TVL 907,731.", "C": "TVL 1,007,335."}}, {"id": "cMock1:m1-s04-q4", "rel": [], "los": "Agent Mock 1 Q16", "tier": null, "type": "", "stem": "According to the Mundell–Fleming model, the policy changes in Tavaria will <i>most likely<\/i> cause the TVL to:", "options": {"A": "appreciate, because higher government borrowing raises real interest rates and attracts capital inflows.", "B": "depreciate, because the increase in net imports dominates the effect on the exchange rate.", "C": "move in an ambiguous direction, because the monetary and fiscal policy effects offset each other."}}]}, {"set": 27, "session": 2, "topic": "Ethical and Professional Standards", "code": "ETH", "vignette": "<p>Irina Benoit, CFA, is a senior research analyst at StockCo, an investment management firm. Multiple rumors have been circulating about a merger of StockCo with another firm. Benoit knows from internal senior management meetings that the merger will take place next year. As a result, Benoit has decided to leave StockCo and start her own investment management firm, Benoit Capital Traders (BCT). StockCo did not require Benoit to sign a non-compete agreement. During a family dinner, Benoit announces that she intends to start BCT after leaving StockCo. Benoit asks her brother to close his existing account at StockCo and bring his money to BCT once the new firm is operational. A week before Benoit leaves StockCo, she sends a message to a friend on her mobile phone: &quot;Goodbye StockCo—I&#x27;m glad I won&#x27;t be here for the merger!&quot;<\/p><p>Upon starting BCT, Benoit adopts the Standards with her firm and writes a compliance manual. She adds the following three procedures to BCT’s compliance manual.<\/p><p>Procedure 1: Analysts may accept gifts in the form of business-related entertainment to a maximum value listed by the compliance office.<\/p><p>Procedure 2: For all analysts, the purchase of a company’s stock through a private placement is capped at a maximum per private placement as listed by the compliance office.<\/p><p>Procedure 3: When attending meetings at an issuer’s headquarters, analysts are allowed to accept modest commercial transportation and hotel accommodation paid by the issuer.<\/p><p>During the first month of BCT&#x27;s operations, Benoit creates a list of StockCo clients from memory to solicit their business. Benoit then uses an external marketing company to send each prospective client either a card or a coffee mug. She provides this marketing company with a list of clients with their approximate portfolio values. Benoit requests that the company send the coffee mugs to only those clients with portfolios larger than $1 million. During Benoit&#x27;s employment at StockCo, she had access to the firm&#x27;s internal data system that contains confidential personal information about StockCo’s clients. The database and its access are managed by Benoit&#x27;s former department manager at StockCo, Mike Lee, CFA. Lee neglected to remove Benoit&#x27;s access from the server and, as a result, Benoit discovers that she still has access to the system. Benoit checks the names on the client list that she created from memory against the list in StockCo’s internal data system and confirms that her list is complete and accurate. She then contacts Lee to request him to cancel her access.<\/p><p>Three months later, Benoit hires and starts supervising two new analysts, Robert Kiprotich and Yoko Tanaka. Kiprotich’s first assignment is to write a report on a cryptocurrency. After writing the report, Kiprotich uses BCT’s social media page to promote the report. He starts by using an online generative artificial intelligence (AI) program to summarize his report and credits the generative AI program as the source of his summary. At the end of the summary, Kiprotich states that investors should not be concerned about the transaction costs of switching their investments because the higher returns from the cryptocurrency will more than offset the costs. He then posts the summary online, along with a link to the report. A week later, someone comments on the social media post, pointing out an error in the report. Kiprotich leaves the report unchanged since he intends to post a new report at the end of the week in which he will also correct the unintentional error.<\/p>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q42", "rel": [], "los": "Mock 1 Session 1 Q42", "tier": null, "type": "", "stem": "<p>Which procedure in the BCT compliance manual is not consistent with the Standards?<\/p>", "options": {"A": "Procedure 1", "B": "Procedure 2", "C": "Procedure 3"}}]}, {"set": 28, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Marcus Eriksson, chief financial officer of Trana AB, and Katrina Lars, director of financial reporting, are preparing the company’s 2015 annual report. Today’s meeting is to discuss the transactions and disclosures related to Trana’s foreign operations. Trana, which reports under International Financial Reporting Standards (IFRS), is a Sweden-based retailer operating stores in three geographic locations: Sweden, the eurozone (with a current presence only in France, Germany, and Italy), and the United States. The stores in the eurozone and the United States are operated through a wholly owned subsidiary in each region. Consistent with Swedish accounting practice, the annual report includes separate financial statements for the parent company (Trana) and consolidated, or group, financial statements. The income statements are presented in Exhibit 1.<\/p><p>Exhibit 1 Trana AB Income Statements for the Years Ended 31 December<\/p><table><tr><th><\/th><th>Consolidated Income Statement (SEK millions)<\/th><th><\/th><th>Parent Income Statement (SEK million)<\/th><th><\/th><\/tr><tr><td><\/td><td>2015<\/td><td>2014<\/td><td>2015<\/td><td>2014<\/td><\/tr><tr><td>Sales<\/td><td>30,200<\/td><td>26,892<\/td><td>4,700<\/td><td>4,653<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>13,590<\/td><td>12,639<\/td><td>2,600<\/td><td>2,650<\/td><\/tr><tr><td>Gross profit<\/td><td>16,610<\/td><td>14,253<\/td><td>2,100<\/td><td>2,003<\/td><\/tr><tr><td>Selling expenses<\/td><td>10,872<\/td><td>9,143<\/td><td>1,500<\/td><td>1,525<\/td><\/tr><tr><td>Admin. expenses<\/td><td>1,510<\/td><td>1,076<\/td><td>260<\/td><td>200<\/td><\/tr><tr><td>Operating profit<\/td><td>4,228<\/td><td>4,034<\/td><td>340<\/td><td>278<\/td><\/tr><tr><td>Net other costs/losses<\/td><td>10<\/td><td>15<\/td><td>2<\/td><td>3<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>4,218<\/td><td>4,019<\/td><td>338<\/td><td>275<\/td><\/tr><tr><td>Income taxes<\/td><td>1,122<\/td><td>1,071<\/td><td>74<\/td><td>61<\/td><\/tr><tr><td>Net profit<\/td><td>3,096<\/td><td>2,948<\/td><td>264<\/td><td>214<\/td><\/tr><\/table><p>Eriksson and Lars start the meeting by reviewing some of the relevant currency exchange rates, shown in Exhibit 2. The functional currency for the eurozone and US subsidiaries is the local currency (EUR and USD, respectively), thus the financial statements of both are translated using the current rate method. Both subsidiaries are consistently profitable.<\/p><p>Exhibit 2 Exchange Rates<\/p><table><tr><th><\/th><th>SEK per EUR<\/th><th>SEK per USD<\/th><\/tr><tr><td>Beginning 2014<\/td><td>8.43<\/td><td>6.32<\/td><\/tr><tr><td>Average 2014<\/td><td>8.555<\/td><td>6.35<\/td><\/tr><tr><td>End of 2014<\/td><td>8.88<\/td><td>6.38<\/td><\/tr><tr><td>Average 2015<\/td><td>9.125<\/td><td>7.595<\/td><\/tr><tr><td>End of 2015<\/td><td>9.31<\/td><td>8.81<\/td><\/tr><\/table><p>Next, they review the performance and related disclosures by region. The number of stores operated in each region is shown in Exhibit 3.<\/p><p>Exhibit 3 Number of Stores by Region<\/p><table><tr><th>Year<\/th><th>Eurozone<\/th><th>Sweden<\/th><th>United States<\/th><th>Total<\/th><\/tr><tr><td>2014<\/td><td>340<\/td><td>99<\/td><td>80<\/td><td>519<\/td><\/tr><tr><td>2015<\/td><td>400<\/td><td>100<\/td><td>80<\/td><td>580<\/td><\/tr><\/table><p>In preparation for the meeting, Lars looked at the US region and calculated the effect of the change in the SEK/USD exchange rate on the increase in sales from 2014 to 2015. Her notes include the following:<\/p><p>In 2014, the sales per store, in SEK, were the same for both US and Swedish stores.<\/p><p>The sales per US store in USD remained constant in 2015.<\/p><p>Eriksson reminds Lars that Trana defines organic growth in retail as coming from two factors:<\/p><p>increasing the number of stores, and<\/p><p>increasing the sales per store in the local currency.<\/p><p>He says that he wants to provide disclosures related to the organic growth rate in domestic sales per store, by region, and asks Lars to calculate it for the eurozone region where the sales figures (in millions) were SEK18,394 in 2014 and SEK21,640 in 2015.<\/p><p>In 2012, at the start of Trana’s expansion into North American markets, the company established a subsidiary, Anart Inc., in a South American country to benefit from lower labor and shipping costs. The details of the Anart investment are as follows:<\/p><p>Anart is 80% owned by Trana with 20% local investment.<\/p><p>It sells all of its production to Trana and Trana’s other subsidiaries and determines the transfer price as full cost plus 5%.<\/p><p>In 2015, sales (in millions) from Anart to Trana companies were SEK4,485 with net profit of SEK204.<\/p><p>The corporate tax rate in the country is 10%.<\/p><p>Throughout 2013, the South American country experienced high rates of inflation, approaching 30% per year. Trana had originally assumed that the high inflation rate was temporary, but it has shown no signs of decreasing and is now a concern. Eriksson and Lars discuss the impact of Anart on Trana’s financial statements and Eriksson asks Lars:<\/p><p>“Is the same accounting method being used this year to account for Anart in the consolidated financial statements as in prior years?”<\/p><p>Eriksson reminds Lars that there is a proposal in Sweden to reduce the corporate tax rate from the current 22% to 16.5%. He would like to provide pro-forma disclosures related to the potential change in net income this change could provide for Trana. He reminds Lars that the average tax rate for the eurozone countries where Trana operates is 30% and 25% in the United States. Sweden operates under a tax treaty with all countries in which it has subsidiaries, such that it will owe taxes on foreign earned income to the extent that the Swedish rate exceeds the foreign rate.<\/p><p>In closing the meeting, Eriksson mentions that Trana is undertaking a comprehensive review of its operations in 2016, and its objectives include reducing overall tax costs by lowering its effective tax rate and reducing foreign exchange gains and losses reported on the income statement.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q54", "rel": [], "los": "FSA · ECO Module 1 Q54", "tier": null, "type": "", "stem": "<p>The best estimate of the proportion of Anart’s sales that is reflected in Trana’s consolidated income statement is:<\/p>", "options": {"A": "0%.", "B": "80%.", "C": "100%."}}, {"id": "FSA:ECO-M3-Q58", "rel": [], "los": "FSA · ECO Module 3 Q58", "tier": null, "type": "", "stem": "<p>Using Exhibits 1, 2, and 3 and Lars’s notes about the US operations, the change in sales reported for the US region (in SEK millions) explained by the change in the SEK/USD exchange rate in 2015 is closest to:<\/p>", "options": {"A": "SEK737.", "B": "SEK813.", "C": "SEK1,432."}}, {"id": "FSA:ECO-M3-Q61", "rel": [], "los": "FSA · ECO Module 3 Q61", "tier": null, "type": "", "stem": "<p>If the proposed reduction in Swedish tax rates had been in effect in 2015, the increase in Trana’s net profit (in SEK millions) would have been closest to:<\/p>", "options": {"A": "SEK18.6.", "B": "SEK29.8.", "C": "SEK31.2."}}]}, {"set": 29, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>James Frazee is chief investment officer at H&amp;F Capital Investors. Frazee hires a third-party adviser to develop a custom benchmark for three actively managed balanced funds he oversees: Fund X, Fund Y, and Fund Z. (Balanced funds are funds invested in equities and bonds.) The benchmark needs to be composed of 60% global equities and 40% global bonds. The third-party adviser submits the proposed benchmark to Frazee, who rejects the benchmark based on the following concerns:<\/p><p>Concern 1: Many securities he wants to purchase are not included in the benchmark portfolio.<\/p><p>Concern 2: One position in the benchmark portfolio will be somewhat costly to replicate.<\/p><p>Concern 3: The benchmark portfolio is a float-adjusted, capitalization-weighted portfolio.<\/p><p>After the third-party adviser makes adjustments to the benchmark to alleviate Frazee’s concerns, Frazee accepts the benchmark portfolio. He then asks his research staff to develop risk and expected return forecasts for Funds X, Y, and Z as well as for the benchmark. The forecasts are presented in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Forecasted Portfolio Statistics for Funds X, Y, and Z and the Benchmark<\/p><table><tr><th><\/th><th>Fund X<\/th><th>Fund Y<\/th><th>Fund Z<\/th><th>Benchmark<\/th><\/tr><tr><td>Portfolio weights:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Global equities (%)<\/td><td>60.0<\/td><td>65.0<\/td><td>68.0<\/td><td>60.0<\/td><\/tr><tr><td>Global bonds (%)<\/td><td>40.0<\/td><td>35.0<\/td><td>32.0<\/td><td>40.0<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Expected return (%)<\/td><td>10.0<\/td><td>11.6<\/td><td>13.2<\/td><td>9.4<\/td><\/tr><tr><td>Expected volatility (%)<\/td><td>17.1<\/td><td>18.7<\/td><td>22.2<\/td><td>16.3<\/td><\/tr><tr><td>Active risk (%)<\/td><td>5.2<\/td><td>9.2<\/td><td>15.1<\/td><td>N/A<\/td><\/tr><tr><td>Sharpe ratio (SR)<\/td><td>0.45<\/td><td>0.50<\/td><td>0.49<\/td><td>0.44<\/td><\/tr><\/table><p>Note: Data are based on a risk-free rate of 2.3%.<\/p><p>Frazee decides to add a fourth offering to his group of funds, Fund W, which will use the same benchmark as in Exhibit 1. Frazee estimates Fund W’s information ratio to be 0.35. He is considering adding the following constraint to his portfolio construction model: Fund W would now have maximum over- and underweight constraints of 7% on single-country positions.<\/p><p>Frazee conducts a search to hire a manager for the global equity portion of Fund W and identifies three candidates. He asks the candidates to prepare risk and return forecasts relative to Fund W’s benchmark based on their investment strategy, with the only constraint being no short selling. Each candidate develops independent annual forecasts with active return projections that are uncorrelated and constructs a portfolio made up of stocks that are diverse both geographically and across economic sectors. Selected data for the three candidates’ portfolios are presented in Exhibit 2.<\/p><p>Exhibit 2<\/p><p>Forecasted Portfolio Data for Equity Portion of Fund W<\/p><table><tr><th><\/th><th>Candidate A<\/th><th>Candidate B<\/th><th>Candidate C<\/th><\/tr><tr><td>Rebalancing<\/td><td>Annually<\/td><td>Annually<\/td><td>Annually<\/td><\/tr><tr><td>Number of securities<\/td><td>100<\/td><td>64<\/td><td>36<\/td><\/tr><tr><td>Information ratio (IR)<\/td><td>0.582<\/td><td>0.746<\/td><td>0.723<\/td><\/tr><tr><td>Transfer coefficient (TC)<\/td><td>0.832<\/td><td>0.777<\/td><td>0.548<\/td><\/tr><tr><td>Information coefficient*<\/td><td>0.07<\/td><td>0.12<\/td><td>0.22<\/td><\/tr><\/table><p>* Information coefficient based on previously managed funds.<\/p><p>Frazee asks Candidate C to re-evaluate portfolio data given the following changes:<\/p><p>Change 1: Fix the number of securities to 50.<\/p><p>Change 2: Rebalance on a semi-annual basis.<\/p><p>Change 3: Add maximum over- or underweight constraints on sector weightings.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M2-Q4", "rel": [], "los": "PM · ECO Module 2 Q4", "tier": null, "type": "", "stem": "<p>Which of Frazee’s concerns best justifies his decision to reject the proposed benchmark?<\/p>", "options": {"A": "Concern 1", "B": "Concern 2", "C": "Concern 3"}}, {"id": "PM:ECO-M2-Q7", "rel": [], "los": "PM · ECO Module 2 Q7", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, combining Fund W with a fund that replicates the benchmark would produce a Sharpe ratio closest to:<\/p>", "options": {"A": "0.44.", "B": "0.56.", "C": "0.89."}}]}, {"set": 30, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Your colleague is building financial statement and discounted cash flow models for a company and has asked you review their modeling decisions with respect to the subject company’s post-employment and stock-based compensation plans.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M2-Q26", "rel": [], "los": "FSA · ECO Module 2 Q26", "tier": null, "type": "", "stem": "<p>Your colleague’s discounted cash flow model expenses service cost and net interest expense in free cash flow and deducts the company’s net pension liability from enterprise value to arrive at an estimate of equity value. You most likely recommend that your colleague:<\/p>", "options": {"A": "make no changes.", "B": "remove service cost from free cash flow because it is a non-cash expense.", "C": "remove net interest expense from free cash flow because the net pension, at present value, is already deducted from enterprise value."}}, {"id": "FSA:ECO-M2-Q29", "rel": [], "los": "FSA · ECO Module 2 Q29", "tier": null, "type": "", "stem": "<p>As an alternative to expensing stock-based compensation in free cash flow in the discounted cash flow valuation model, your colleague could account for the expected dilution by:<\/p>", "options": {"A": "increasing shares outstanding.", "B": "reducing operating expenses because the company could compensate its employees in cash rather than shares.", "C": "increasing net cash because share-based compensation expense is a non-cash expense."}}]}, {"set": 31, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Gianna Peters is an investment analyst who focuses on dividend-paying stocks. Peters uses a DCF approach to stock selection. She is meeting with her staff to evaluate portfolio holdings based on a bottom-up screening of stocks listed in the United States and Canada. Peters and her staff begin by reviewing the characteristics of the following portfolio candidates.<\/p><p>Company ABC<\/p><p>A Canadian company in the consumer staples sector with a required rate of return of 7.35%. Recent media reports suggest that ABC might be a takeover candidate. Peters and her team estimate that if the incumbent Canadian prime minister’s party retains its power, the company’s current annual dividend of C$0.65 per share will grow 12% a year for the next four years and then stabilize at a 3.5% growth rate a year indefinitely. If a new government takes office in Canada, however, then the team estimates that ABC will likely not experience the elevated 12% short-run growth because of new regulatory and tax changes, and instead it will grow by 3.5% indefinitely.<\/p><p>Company XYZ<\/p><p>A mid-sized US company in the utilities sector with a required rate of return of 10%. Peters and her team believe that because of a recent restructuring, the company is unlikely to pay dividends for the next three years. The team expects XYZ to pay an annual dividend of US$1.72 per share beginning four years from now, however. Thereafter, the dividend is expected to grow indefinitely at 4% even though the current price implies a growth rate of 6% during this same period.<\/p><p>Company JZY<\/p><p>A large US company in the telecom sector with a required rate of return of 8%. The stock is currently trading at US$32.76 per share with an implied earnings growth rate of 5.3%. Peters believes that because JZY is mature and has a stable capital structure, the company will grow at its sustainable growth rate. Over the past 10 years, the company’s return on equity (ROE) has averaged 8.17% and its payout ratio has averaged 40%. Recently, the company paid an annual dividend of US$0.84 per share.<\/p><p>Peters asks a newly hired analyst, Kurt Thomas, to comment on the evaluation approach for these three stocks. Thomas makes the following statements:<\/p><p>Statement 1: A free cash flow valuation model would not be appropriate to evaluate Company ABC if the firm becomes a takeover candidate.<\/p><p>Statement 2: A dividend discount model cannot be applied to Company XYZ if dividends are suspended for a few years.<\/p><p>Statement 3: A dividend discount model is suitable for evaluating the stock of Company JZY because of the historically consistent payout ratio.<\/p><p>Peters then asks the team to examine the growth opportunities of three Canadian stocks currently held in the portfolio. These stocks are listed in Exhibit 1. Peters believes that the stocks are fairly valued.<\/p><p>Exhibit 1<\/p><p>Selected Stock Characteristics<\/p><table><tr><th>Stock<\/th><th>Required Rate of Return<\/th><th>Next Year’s Forecasted EPS (C$)<\/th><th>Current Price per Share (C$)<\/th><\/tr><tr><td>ABTD<\/td><td>10.5%<\/td><td>7.30<\/td><td>80.00<\/td><\/tr><tr><td>BKKQ<\/td><td>8.0%<\/td><td>2.12<\/td><td>39.00<\/td><\/tr><tr><td>CPMN<\/td><td>12.0%<\/td><td>1.90<\/td><td>27.39<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Equity:ECO-M2-Q7", "rel": [], "los": "Equity · ECO Module 2 Q7", "tier": null, "type": "", "stem": "<p>Which of the following statements made by Thomas is correct?<\/p>", "options": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}}, {"id": "Equity:ECO-M2-Q15", "rel": [], "los": "Equity · ECO Module 2 Q15", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, the growth component of the leading P/E is largest for:<\/p>", "options": {"A": "ABTD.", "B": "BKKQ.", "C": "CPMN."}}]}, {"set": 32, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Nation Resorts Ltd (Nation) is a US-based operator of destination vacation resorts. Resorts are divided into three types: Winter, which are located at ski mountains; Golf, which are located on championship courses in such locations as Arizona; and Seaside, which are located at world-class ocean beaches. The three types of resorts generally attract different types of vacationers and provide different vacation packages for different budgets. Although the Winter and Golf resorts are somewhat counter seasonal, the company still suffers from risks related to the US economy, as well as the risk of unfavorable local weather conditions (lack of snow or sun). To diversify and reduce these risks, Nation started purchasing properties in other geographic areas, including Europe and Central America.<\/p><p>Nation made its first non-domestic investment when it bought a resort in Jamaica on 1 May 2008. Initially, Nation provided managers to assist in operating the resort but then hired local Jamaicans into its management development program, one of whom was recently appointed to a senior position at the resort. Nation invested in building and upgrading facilities, with the initial expansion financing provided by Nation’s US bank. Concerned about the high rate of inflation in Jamaica, which at the time of purchase averaged 20% per year over the previous three years, Nation kept any excess funds in US dollars. The company’s vacation packages are sold primarily in the United States, and its prices reflect competitive conditions in the US vacation market. In 2010, the Jamaican resort used local labor and supplies and was profitable for the first time. In addition, by that time, inflation had declined to 14% per year, and Nation expected to be able to reinvest any profits in the resort and start using a local bank for ongoing financing needs.<\/p><p>On 1 July 2010, Nation acquired its first European resort, Val Blanc SA, a ski resort in the Alps region of France. Nation paid €28 million for 100% of the company. The resort attracts skiers primarily from France and other European countries. The transition went very well, and Nation left the local managers in place to make all operating and financial decisions. By the end of 2011, Nation’s only financial contribution to the resort was the initial equity investment. Exhibit 1 shows financial statements for the ski resort at acquisition and for the following six months.<\/p><p>Exhibit 1 Val Blanc Financial Statements (€ thousands)<\/p><table><tr><th><\/th><th>Income Statement<\/th><th><\/th><\/tr><tr><td><\/td><td>31 Dec. 2010 (6 months)<\/td><td>30 Jun. 2010 (12 months)<\/td><\/tr><tr><td>Resort revenues<\/td><td>12,025<\/td><td>46,805<\/td><\/tr><tr><td>Operating expenses<\/td><td>9,800<\/td><td>35,105<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>1,750<\/td><td>4,000<\/td><\/tr><tr><td>Interest expense<\/td><td>1,200<\/td><td>2,500<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>–725<\/td><td>5,200<\/td><\/tr><tr><td>Income taxes<\/td><td>0<\/td><td>1,300<\/td><\/tr><tr><td>Net earnings<\/td><td>–725<\/td><td>3,900<\/td><\/tr><\/table><table><tr><th><\/th><th>Statement of Financial Position<\/th><th><\/th><\/tr><tr><td><\/td><td>31 Dec. 2010<\/td><td>30 Jun. 2010a<\/td><\/tr><tr><td>Cash and marketable securities<\/td><td>5,750<\/td><td>5,000<\/td><\/tr><tr><td>Accounts receivable<\/td><td>6,500<\/td><td>3,000<\/td><\/tr><tr><td>Inventory<\/td><td>8,000b<\/td><td>5,000<\/td><\/tr><tr><td>Total current assets<\/td><td>20,250<\/td><td>13,000<\/td><\/tr><tr><td>Property, plant, and equipment<\/td><td>41,750<\/td><td>43,500<\/td><\/tr><tr><td>Intangible assets<\/td><td>5,000<\/td><td>5,000<\/td><\/tr><tr><td>Total assets<\/td><td>67,000<\/td><td>61,500<\/td><\/tr><\/table><table><tr><th>Current liabilities<\/th><th>12,225<\/th><th>5,000<\/th><\/tr><tr><td>Long-term debt<\/td><td>26,000<\/td><td>27,000<\/td><\/tr><tr><td>Share capital<\/td><td>20,000<\/td><td>20,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>8,775<\/td><td>9,500<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>67,000<\/td><td>61,500<\/td><\/tr><\/table><p>a The 30 June 2010 Statement of Financial Position reflects the fair value of the identifiable assets and liabilities of Val Blanc at acquisition.<\/p><p>b The 31 December 2010 inventory was acquired evenly throughout the period since acquisition.<\/p><p>In early January 2011, Paul Nakiska, a business analyst with Nation, met with Nation’s manager of financial reporting, Max Chara, to discuss how the company should account for the two non-domestic resorts in the 2010 financial statements and the impact the resorts would have on Nation’s reported results. Nation has a 31 December year end and prepares its financial statements according to US GAAP.<\/p><p>In preparation for the meeting, Nakiska’s first task was to prepare the purchase price allocation of the Val Blanc acquisition using the acquisition method. He also gathered some exchange rate information related to the two resorts, shown in Exhibit 2.<\/p><p>Exhibit 2 Selected Exchange Rates<\/p><table><tr><th>Date<\/th><th>USD/JMD<\/th><th>USD/EUR<\/th><\/tr><tr><td>5/1/2008<\/td><td>0.0139<\/td><td>N/A<\/td><\/tr><tr><td>1/1/2010<\/td><td>0.0115<\/td><td>1.4368<\/td><\/tr><tr><td>6/30/2010<\/td><td>0.0117<\/td><td>1.225<\/td><\/tr><tr><td>12/31/2010<\/td><td>0.0117<\/td><td>1.3261<\/td><\/tr><tr><td>Average 2010<\/td><td>0.0115<\/td><td>1.3277<\/td><\/tr><tr><td>Average January–July 2010<\/td><td>0.0113<\/td><td>1.3303<\/td><\/tr><tr><td>Average July–December 2010<\/td><td>0.0117<\/td><td>1.3198<\/td><\/tr><\/table><p>Nakiska started the meeting:<\/p><p>“I suggest we use the current rate method for both our non-domestic subsidiaries because that will simplify our financial reporting. The current rate method also allows the key metrics we use to evaluate performance—the current ratio, fixed asset turnover, and operating margin—to be the same after translation as they are before.”<\/p><p>Chara replied:<\/p><p>“I am not so concerned about the translated metrics because we evaluate the performance of each resort in its local currency. I am concerned, however, about the effect on Nation’s consolidated net income and return on equity.<\/p><p>If we use the temporal method for the resort in France, we can take advantage of the strengthening euro and report the translation gain on the income statement.<\/p><p>I am also not concerned about using the same method for all subsidiaries if using different methods will help increase our net income.<\/p><p>Nakiska agreed to calculate the effects of the various translation methods and of the Val Blanc acquisition on the financial statements and send a report to Chara.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M1-Q53", "rel": [], "los": "FSA · ECO Module 1 Q53", "tier": null, "type": "", "stem": "<p>Prior to translating the subsidiary’s financial statements, Nakiska’s allocation of the Val Blanc acquisition purchase price most likely resulted in which of the following for Nation?<\/p>", "options": {"A": "A gain of €1,500", "B": "Goodwill of €8,000", "C": "An increase in retained earnings of €9,500"}}]}, {"set": 33, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Bill Akron is Director of Research at Cuyahoga Fixed Income Advisors. He has a large staff of research analysts and each year adds six new hires to the group. In addition to their regular work assignments, the analysts undergo formal training conducted by Akron. He plans to have six modules over the coming weeks each covering key fixed-income concepts. In each module, Akron starts out by outlining a lesson.<\/p><p>Module 1:<\/p><p>“A good place to start a fixed-income program is with a discussion of the yield curve and the information it conveys. This lesson will be theoretical in nature as we discuss interpretations of the term structure of interest rates. I want to present three theories that explain the shape of the yield curve. First is the pure expectations theory, which states that the forward rate is an unbiased predictor of the future spot rate. This theory assumes investors are affected by uncertainty and require a risk premium. Second is the liquidity preference theory, which postulates that investors are willing to take on more risk by investing in longer maturity bonds if they are paid a liquidity premium. Its explanation for an upward sloping yield curve, even if spot rates are expected to be unchanged, is the liquidity premium. A third explanation of the shape of the yield curve is the segmented markets theory, which says that yields are a function of supply and demand for funds in a specific maturity segment. This last theory is very similar to the preferred habitat theory and is premised on investors and borrowers having strong preferences for particular maturities.”<\/p><p>Module 2:<\/p><p>“Let’s use the term structure of interest rates to price bonds, and in particular, I want you to fully understand the relationships between spot and forward rates and yield to maturity. Use the data in Exhibit 1 to determine whether a 4% coupon Treasury bond, maturing in four years and offered by a dealer at a yield-to maturity of 7.89% is cheap (buy recommendation), fairly valued (hold recommendation), or rich (sell recommendation) based on arbitrage opportunities.”<\/p><p>Exhibit 1 Select Spot and Forward Rates<\/p><table><tr><th><\/th><th>Year 1<\/th><th>Year 2<\/th><th>Year 3<\/th><th>Year 4<\/th><\/tr><tr><td>Spot Rate<\/td><td>0.055<\/td><td>---<\/td><td>---<\/td><td>0.0825<\/td><\/tr><tr><td>Discount Factor<\/td><td>---<\/td><td>---<\/td><td>0.8163<\/td><td>---<\/td><\/tr><tr><td>Forward Rate f(2,1)<\/td><td>---<\/td><td>---<\/td><td>0.0852<\/td><td>---<\/td><\/tr><\/table><p>Module 3:<\/p><p>“Today I want to go over techniques we use at Cuyahoga to add alpha to our active fixed-income strategies. Many of our portfolio managers like to use a portfolio management strategy called riding the yield curve. This strategy can enhance total return in two ways. First, it increases the yield of the portfolio by buying bonds with maturities longer than their investment horizon whenever the yield curve is upward sloping and expected to maintain the same level and whenever the shape and spot rates rise as predicted by forward rates. Second, even if interest rates increase unexpectedly, since the bonds roll down the yield curve, the bonds will appreciate in price.”<\/p><p>Module 4:<\/p><p>“Today I want to go over several spread measures used in fixed-income markets. The Z-spread provides a useful measure of risk for credit instruments such as corporate bonds. It uses the implied spot yield curve and adds the spread necessary to discount the bond’s cash flows and derive its current market price. The TED spread is used for the valuation of government bonds and is calculated as the difference between MRR and the yield on a T-bill of equal maturity. The MRR–OIS spread incorporates unsecured lending between banks. It serves as a good measure of the risk and liquidity of money market securities.”<\/p><p>Module 5:<\/p><p>“Swap rates are very useful in the valuation of bonds. I would like you to use the information in Exhibit 2 to value a bond, issued by AAA-rated European Supranational Bank (ESB), maturing in 3.86 years, with a coupon rate of 2.86% paid annually. Dealers are quoting the bond flat to swaps. Simple interpolation can be used to perform the calculations.”<\/p><p>Exhibit 2 Yield Measures at Various Maturities<\/p><table><tr><th>Maturity (Years)<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td>Off the run Bund yield (%)<\/td><td>0.25<\/td><td>0.32<\/td><td>0.46<\/td><td>0.57<\/td><td>0.66<\/td><\/tr><tr><td>On the run Bund yield (%)<\/td><td>0.21<\/td><td>0.27<\/td><td>0.41<\/td><td>0.5<\/td><td>0.59<\/td><\/tr><tr><td>Swap rate (%)<\/td><td>0.81<\/td><td>0.89<\/td><td>1.05<\/td><td>1.16<\/td><td>1.27<\/td><\/tr><\/table><p>Module 6:<\/p><p>“Consider a portfolio of zero-coupon bonds that mature at different times in the future. Changes in interest rates are not always parallel across maturities, so let’s analyze what happens as rates change across the yield curve. Let’s assume that the portfolio has sensitivities to factors as provided in Exhibit 3. The portfolio has equal weightings in each key rate duration and an effective duration of 4.7. I would like you to assess the impact on the return of the portfolio if rates rise evenly across the curve and also when the curve flattens but does not twist.”<\/p><p>Exhibit 3 Factor Movements per One Standard Deviation Shift and Portfolio Key Rate Durations<\/p><table><tr><th>Year<\/th><th>5<\/th><th>10<\/th><th>30<\/th><\/tr><tr><td>Parallel<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>Steepness<\/td><td>1<\/td><td>0.5<\/td><td>–1<\/td><\/tr><tr><td>Curvature<\/td><td>0.5<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>Key rate curations<\/td><td>1.8<\/td><td>3.6<\/td><td>8.7<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q58", "rel": [], "los": "FI · ECO Module 1 Q58", "tier": null, "type": "", "stem": "<p>Based on the data in Exhibit 1 and the yield to maturity quoted by the dealer referenced in Module 2, what action should an analyst most likely take with regard to the Treasury bond?<\/p>", "options": {"A": "Buy", "B": "Sell", "C": "Hold"}}, {"id": "FI:ECO-M1-Q60", "rel": [], "los": "FI · ECO Module 1 Q60", "tier": null, "type": "", "stem": "<p>Akron is least likely correct with regard to which spread measure in Module 4?<\/p>", "options": {"A": "Z-spread", "B": "TED spread", "C": "MRR–OIS spread"}}]}, {"set": 34, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Quentin Abay, CFA, is an analyst for a private equity firm interested in purchasing Bickchip Enterprises, a conglomerate. His first task is to determine the trends in ROE and the main drivers of the trends using DuPont analysis. To do so he gathers the data in Exhibit 1.<\/p><p>Exhibit 1<\/p><p>Selected Financial Data for Bickchip Enterprises (€ Thousands)<\/p><table><tr><th><\/th><th>2020<\/th><th>2019<\/th><th>2018<\/th><\/tr><tr><td>Revenue<\/td><td>72,448<\/td><td>66,487<\/td><td>55,781<\/td><\/tr><tr><td>Earnings before interest and tax<\/td><td>6,270<\/td><td>4,710<\/td><td>3,609<\/td><\/tr><tr><td>Earnings before tax<\/td><td>5,101<\/td><td>4,114<\/td><td>3,168<\/td><\/tr><tr><td>Net income<\/td><td>4,038<\/td><td>3,345<\/td><td>2,576<\/td><\/tr><tr><td>Asset turnover<\/td><td>0.79<\/td><td>0.76<\/td><td>0.68<\/td><\/tr><tr><td>Assets/Equity<\/td><td>3.09<\/td><td>3.38<\/td><td>3.43<\/td><\/tr><\/table><p>After conducting the DuPont analysis, Abay believes that his firm could increase the ROE without operational changes. Further, Abay thinks that ROE could improve if the company divested segments that were generating the lowest returns on capital employed (total assets less non-interest-bearing liabilities). Segment EBIT margins in 2020 were 11 percent for Automation Equipment, 5 percent for Power and Industrial, and 8 percent for Medical Equipment. Other relevant segment information is presented in Exhibit 2.<\/p><p>Exhibit 2<\/p><p>Segment Data for Bickchip Enterprises (€ Thousands)<\/p><table><tr><th><\/th><th>Capital Employed<\/th><th><\/th><th><\/th><th><\/th><th><\/th><th><\/th><th>Capital Expenditures (Excluding Acquisitions)<\/th><th><\/th><th><\/th><th><\/th><th><\/th><th><\/th><\/tr><tr><td>Operating Segments<\/td><td>2020<\/td><td><\/td><td>2019<\/td><td><\/td><td>2018<\/td><td><\/td><td>2020<\/td><td><\/td><td>2019<\/td><td><\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Automation Equipment<\/td><td>10,705<\/td><td><\/td><td>6,384<\/td><td><\/td><td>5,647<\/td><td><\/td><td>700<\/td><td><\/td><td>743<\/td><td><\/td><td>616<\/td><td><\/td><\/tr><tr><td>Power and Industrial<\/td><td>15,805<\/td><td><\/td><td>13,195<\/td><td><\/td><td>12,100<\/td><td><\/td><td>900<\/td><td><\/td><td>849<\/td><td><\/td><td>634<\/td><td><\/td><\/tr><tr><td>Medical Equipment<\/td><td>22,870<\/td><td><\/td><td>22,985<\/td><td><\/td><td>22,587<\/td><td><\/td><td>908<\/td><td><\/td><td>824<\/td><td><\/td><td>749<\/td><td><\/td><\/tr><tr><td><\/td><td>49,380<\/td><td><\/td><td>42,564<\/td><td><\/td><td>40,334<\/td><td><\/td><td>2,508<\/td><td><\/td><td>2,416<\/td><td><\/td><td>1,999<\/td><td><\/td><\/tr><\/table><p>Abay is also concerned with earnings quality, so he intends to calculate Bickchip’s cash-flow-based accruals ratio and the ratio of operating cash flow before interest and taxes to operating income. To do so, he prepares the information in Exhibit 3.<\/p><p>Exhibit 3<\/p><p>Earnings Quality Data for Bickchip Enterprises (€ Thousands)<\/p><table><tr><th><\/th><th>2020<\/th><th>2019<\/th><th>2018<\/th><\/tr><tr><td>Net income<\/td><td>4,038<\/td><td>3,345<\/td><td>2,576<\/td><\/tr><tr><td>Net cash flow provided by (used in) operating activitya<\/td><td>9,822<\/td><td>5,003<\/td><td>3,198<\/td><\/tr><tr><td>Net cash flow provided by (used in) investing activity<\/td><td>(10,068)<\/td><td>(4,315)<\/td><td>(5,052)<\/td><\/tr><tr><td>Net cash flow provided by (used in) financing activityb<\/td><td>(5,792)<\/td><td>1,540<\/td><td>(2,241)<\/td><\/tr><tr><td>Average net operating assets<\/td><td>43,192<\/td><td>45,373<\/td><td>40,421<\/td><\/tr><tr><td>a includes cash paid for taxes of:<\/td><td>(1,930)<\/td><td>(1,191)<\/td><td>(1,093)<\/td><\/tr><tr><td>b includes cash paid for interest of:<\/td><td>(1,169)<\/td><td>(596)<\/td><td>(441)<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "FSA:ECO-M6-Q2", "rel": [], "los": "FSA · ECO Module 6 Q2", "tier": null, "type": "", "stem": "<p>Based on the DuPont analysis, Abay’s belief regarding ROE is most likely based on:<\/p>", "options": {"A": "leverage.", "B": "profit margins.", "C": "asset turnover."}}]}, {"set": 35, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>Francesca Martinez is a portfolio manager. She decides to review several fund managers who use macroeconomic multifactor models.<\/p><p>From her earlier analysis, she knows the funds in Exhibit 1 are well diversified. She determines the arbitrage opportunity that exists among the three funds.<\/p><p>Exhibit 1<\/p><table><tr><th>Fund<\/th><th>Expected Return (%)<\/th><th>Factor Sensitivity<\/th><\/tr><tr><td>A<\/td><td>4.0<\/td><td>1.5<\/td><\/tr><tr><td>B<\/td><td>8.0<\/td><td>4.5<\/td><\/tr><tr><td>C<\/td><td>6.0<\/td><td>2.7<\/td><\/tr><\/table><p>Martinez next estimates Fund D&#x27;s sensitivity to time horizon risk and inflation risk. She wants to further understand the drivers of Fund D&#x27;s risk relative to its benchmark. For this analysis, she calculates the active risk for each factor and assumes that the correlation between the model&#x27;s factors is negligible. She also assumes a zero value for the error term when working with the selected two-factor model, given in Exhibit 2. The expected return for Fund D is 6.0% and it has a tracking error of 8.0%.<\/p><p>Exhibit 2<\/p><table><tr><th>Risk Factor<\/th><th>Actual Value (%)<\/th><th>Expected Value (%)<\/th><th>Fund D&#x27;s Factor Sensitivity<\/th><th>Active Factor Risk (% Squared)<\/th><\/tr><tr><td>Time horizon risk<\/td><td>2.6<\/td><td>2.0<\/td><td>1.6<\/td><td>24<\/td><\/tr><tr><td>Inflation risk<\/td><td>1.5<\/td><td>0.8<\/td><td>–0.4<\/td><td>16<\/td><\/tr><\/table><p>Martinez considers whether Fund D would be a suitable investment for Lakemont University&#x27;s endowment. The endowment has an investment horizon of 30 years. The activities it supports have historically been subject to cost increases running above the average rate of inflation.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M4-Q28", "rel": [], "los": "PM · ECO Module 4 Q28", "tier": null, "type": "", "stem": "<p>Based solely on the factor model, is Fund D an appropriate investment for Lakemont University?<\/p>", "options": {"A": "Yes", "B": "No, because of Fund D&#x27;s sensitivity to inflation risk", "C": "No, because of Fund D&#x27;s sensitivity to time horizon risk"}}]}, {"set": 36, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p>Darren Carter is a credit analyst reviewing Gowran Bank. The bank is subject to the Basel III regulatory framework and prepares its financial statements under IFRS.<\/p><p>Carter first considers Gowran&#x27;s capital adequacy. For the most recent year end, Gowran reported Common Equity Tier 1 Capital of $15 billion and risk-weighted assets of $100 billion. Carter determines Gowran&#x27;s pro forma year-end Common Equity Tier 1 Capital ratio to account for the following two events, which occurred after the most recent year end.<\/p><p>Gowran issued $1 billion of Additional Tier 1 Capital.<\/p><p>The regulator required Gowran to recognize an additional $3.5 billion of operational risk-weighted assets.<\/p><p>Carter next assesses Gowran&#x27;s asset quality by analyzing the adequacy of its allowance for loan losses. Specifically, he examines how the ratio of the bank&#x27;s allowance for loan losses to non-performing loans changed during the most recent year based on the data (in millions) in Exhibit 1.<\/p><p>Exhibit 1<\/p><table><tr><th>Non-performing loans at start of year<\/th><th>$2,000<\/th><\/tr><tr><td>Non-performing loans at end of year<\/td><td>$2,400<\/td><\/tr><tr><td>Allowance for loan losses at start of year<\/td><td>$1,500<\/td><\/tr><tr><td>Provision for loan losses during the year<\/td><td>$500<\/td><\/tr><tr><td>Charge-offs, net of recoveries, during the year<\/td><td>$200<\/td><\/tr><\/table><p>Gowran has a defined benefit pension plan (Plan A) that is closed to new members. Carter determines the effect of this pension plan on Gowran&#x27;s income statement.<\/p><p>As part of its executive management compensation, Gowran also has a stock option plan (Plan B). Three years ago, Gowran granted executives 5 million at-the-money stock options with a three-year vesting period. On the grant date, Gowran&#x27;s share price was $12 and the fair value of each option was $3. All of the options are now vested in the current year. Carter determines the effect on Gowran&#x27;s paid-in capital on its balance sheet in the current year, assuming that 2 million of the stock options are exercised at the strike price of $12 and Gowran&#x27;s share price is currently $18.<\/p>", "exhibits": [], "qs": [{"id": "Mock2:mock2-Q86", "rel": [], "los": "Mock 2 Session 2 Q42", "tier": null, "type": "", "stem": "<p>Over the most recent year, the ratio of Gowran&#x27;s allowances for loan losses to non-performing loans:<\/p>", "options": {"A": "decreased.", "B": "not changed.", "C": "increased."}}]}, {"set": 37, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Mary Barton is a junior equity analyst for an investment company. She is currently working on a large US-based equity fund.<\/p><p>The large US-based fund uses discount models to estimate the value of stock prices. For this fund, a difference in price of $1 or more between the market and estimated prices indicates that the shares are mispriced for the fund’s investment purposes. The fund is allowed to take either long or short positions in shares identified as misvalued. Barton’s manager, George Eckhart, asks her to evaluate the stocks of two companies for possible inclusion in that fund: XRail Company (XRL) and Z-Tarp Limited (ZTL). Selected data for the stocks are shown in Exhibit 1.<\/p><p>Exhibit 1 Selected Stock Data for XRL and ZTL and Additional Market Information<\/p><table><tr><th><\/th><th>XRL<\/th><th><\/th><th>ZTL<\/th><th><\/th><\/tr><tr><td><\/td><td>EPS ($)<\/td><td>DPS ($)<\/td><td>EPS ($)<\/td><td>DPS ($)<\/td><\/tr><tr><td>Most Recent Year<\/td><td>3.15<\/td><td>1.77<\/td><td>5.62<\/td><td>2.53<\/td><\/tr><tr><td>1 Year Prior<\/td><td>3.08<\/td><td>1.52<\/td><td>4.98<\/td><td>2.24<\/td><\/tr><tr><td>2 Years Prior<\/td><td>2.99<\/td><td>1.36<\/td><td>4.73<\/td><td>2.13<\/td><\/tr><tr><td>3 Years Prior<\/td><td>2.77<\/td><td>1.21<\/td><td>4.5<\/td><td>2.02<\/td><\/tr><tr><td>4 Years Prior<\/td><td>2.52<\/td><td>0.9<\/td><td>4.2<\/td><td>1.89<\/td><\/tr><tr><td>Current market price<\/td><td>$77.23<\/td><td>---<\/td><td>$93.05<\/td><td>---<\/td><\/tr><tr><td>Return on assets<\/td><td>27.40%<\/td><td>---<\/td><td>25.80%<\/td><td>---<\/td><\/tr><tr><td>Return on common equity<\/td><td>31.60%<\/td><td>---<\/td><td>32.80%<\/td><td>---<\/td><\/tr><tr><td>Beta<\/td><td>0.94<\/td><td>---<\/td><td>1.2<\/td><td>---<\/td><\/tr><tr><td>Required rate of return on common equity<\/td><td>8.84%<\/td><td>---<\/td><td>10.48%<\/td><td>---<\/td><\/tr><\/table><p>Additional Information<\/p><table><tr><th>Risk-free rate<\/th><th>2.94%<\/th><\/tr><tr><td>Equity risk premium for common shares<\/td><td>6.28%<\/td><\/tr><tr><td>US economy real growth rate<\/td><td>3.70%<\/td><\/tr><tr><td>US inflation rate<\/td><td>2.00%<\/td><\/tr><\/table><p>Note: DPS is dividends per share, and EPS is earnings per share.<\/p><p>Barton begins her analysis by looking at XRL. After doing some research, she concludes that a reasonable growth estimate for the company is the sustainable growth rate using the most recent year’s retention ratio and calculates a price for XRL using this information. She makes the following note:<\/p><p>It will not be possible to use the Gordon growth model for the analysis of XRL.<\/p><p>Barton and Eckhart discuss the impact of a company’s growth rate on its future stock price. Barton determines XRL’s growth rate of earnings for the period from 4 Years Prior to the Most Recent Year and compares it with the current nominal growth rate of the US economy. She concludes that XRL is likely to be in the transition stage of growth.<\/p><p>Next, Eckhart asks Barton to calculate the intrinsic value of ZTL shares using the Gordon growth model to determine whether it meets the fund’s investment objectives. He suggests that rather than using the sustainable growth rate, she should use the growth rate of dividends over the past five years.<\/p><p>Eckhart tells Barton that he has heard rumors that ZTL is contemplating selling one of its major manufacturing facilities. If that should happen, he believes that the company would pay a series of special dividends in each of the three years following the sale. Barton asks him how she could best incorporate such a possibility into the valuation of the shares.<\/p>", "exhibits": [], "qs": [{"id": "Equity:ECO-M2-Q58", "rel": [], "los": "Equity · ECO Module 2 Q58", "tier": null, "type": "", "stem": "<p>Barton’s conclusion that XRL is in the transition phase is best described as:<\/p>", "options": {"A": "correct.", "B": "incorrect, because the company is in the mature phase.", "C": "incorrect, because the company is in the supernormal growth phase."}}, {"id": "Equity:ECO-M2-Q59", "rel": [], "los": "Equity · ECO Module 2 Q59", "tier": null, "type": "", "stem": "<p>Using the data in Exhibit 1 and following Eckhart’s suggestions regarding the valuation of ZTL, the most appropriate conclusion that Barton should make about the ZTL shares is that the fund should:<\/p>", "options": {"A": "take a long position in ZTL.", "B": "not add ZTL to the portfolio.", "C": "take a short position in ZTL."}}]}, {"set": 38, "session": 2, "topic": "Financial Statement Analysis", "code": "FSA", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "FSA:ECO-M3-Q66", "rel": [], "los": "FSA · ECO Module 3 Q66", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information about a company&#x27;s tax disclosures:<\/p><table><tr><th><\/th><th>Year T – 1<\/th><th>Year T – 2<\/th><\/tr><tr><td>Statutory domestic tax rate<\/td><td>28%<\/td><td>30%<\/td><\/tr><tr><td>Effect of tax rates in foreign jurisdictions<\/td><td>4%<\/td><td>2%<\/td><\/tr><tr><td>Effect of tax exemptions and other reconciling items<\/td><td>–2%<\/td><td>–2%<\/td><\/tr><tr><td>Effective tax rate<\/td><td>30%<\/td><td>30%<\/td><\/tr><\/table><p>Compared to Year T – 2, in Year T – 1 the company most likely generated:<\/p>", "options": {"A": "a lower share of its profit in countries with higher marginal tax rates.", "B": "the same proportion of profit in countries with higher marginal tax rates.", "C": "a higher share of its profit in countries with higher marginal tax rates."}}, {"id": "FSA:ECO-M3-Q67", "rel": [], "los": "FSA · ECO Module 3 Q67", "tier": null, "type": "", "stem": "<p>A company reported the following information related to its sales growth in the most recent year:<\/p><table><tr><th>Contribution from volume growth<\/th><th>7%<\/th><\/tr><tr><td>Contribution from price increases<\/td><td>2%<\/td><\/tr><tr><td>Contribution from foreign currency exchange<\/td><td>–3%<\/td><\/tr><tr><td>Total sales growth<\/td><td>6%<\/td><\/tr><\/table><p>The best estimate of its sustainable growth for the year is:<\/p>", "options": {"A": "6%.", "B": "7%.", "C": "9%."}}, {"id": "FSA:ECO-M3-Q71", "rel": [], "los": "FSA · ECO Module 3 Q71", "tier": null, "type": "", "stem": "<p>A foreign subsidiary is located in the UK and its parent is located in the US. The subsidiary primarily conducts business in EUR but reports in GBP. The subsidiary&#x27;s functional currency is most likely:<\/p>", "options": {"A": "GBP.", "B": "EUR.", "C": "USD."}}, {"id": "FSA:ECO-M3-Q72", "rel": [], "los": "FSA · ECO Module 3 Q72", "tier": null, "type": "", "stem": "<p>An analyst gathers the following information about a company’s transactions occurring on 15 December:<\/p><p>• USD 50,000 export, invoiced and paid on the same day; and<\/p><p>• USD 200,000 import, invoiced and will be paid in 30 days.<\/p><p>The company’s functional and presentation currency is EUR and the spot exchange rates are:<\/p><table><tr><th>Reference Date<\/th><th>EUR/USD<\/th><\/tr><tr><td>15 December<\/td><td>0.9525<\/td><\/tr><tr><td>31 December<\/td><td>0.9470<\/td><\/tr><\/table><p>Note: EUR/USD is the amount of EUR per 1 USD.<\/p><p>If the company&#x27;s year end is 31 December, the company would report as a result of these transactions:<\/p>", "options": {"A": "no foreign currency gain or loss.", "B": "a EUR 825 foreign currency gain.", "C": "a EUR 1,100 foreign currency gain."}}]}, {"set": 39, "session": 2, "topic": "Corporate Issuers", "code": "CI", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "CI:ECO-M1-Q12", "rel": [], "los": "CI · ECO Module 1 Q12", "tier": null, "type": "", "stem": "<p>Sophie Chan owns 100,000 shares of PAT Company. PAT is selling for €40 per share, so Chan’s investment is worth €4,000,000. Chan reinvests the gross amount of all dividends received to purchase additional shares. Assume that the clientele for PAT shares consists of tax-exempt investors. If PAT pays a €1.50 dividend, Chan’s new share ownership after reinvesting dividends at the ex-dividend price is most likely to be closest to:<\/p>", "options": {"A": "103,600.", "B": "103,750.", "C": "103,900."}}, {"id": "CI:ECO-M1-Q17", "rel": [], "los": "CI · ECO Module 1 Q17", "tier": null, "type": "", "stem": "<p>Beta Corporation is a manufacturer of inflatable furniture. Which of the following scenarios best reflects a stable dividend policy for Beta?<\/p>", "options": {"A": "Maintaining a constant dividend payout ratio of 40–50%.", "B": "Maintaining the dividend at US$1.00 a share for several years given no change in Beta’s long-term prospects.", "C": "Increasing the dividend 5% a year over several years to reflect the two years in which Beta recognized mark-to-market gains on derivatives positions."}}, {"id": "CI:ECO-M1-Q22", "rel": [], "los": "CI · ECO Module 1 Q22", "tier": null, "type": "", "stem": "<p>A company with 20 million shares outstanding decides to repurchase 2 million shares at the prevailing market price of €30 per share. At the time of the buyback, the company reports total assets of €850 million and total liabilities of €250 million. As a result of the buyback, that company’s book value per share will most likely:<\/p>", "options": {"A": "increase.", "B": "decrease.", "C": "remain the same."}}, {"id": "CI:ECO-M1-Q24", "rel": [], "los": "CI · ECO Module 1 Q24", "tier": null, "type": "", "stem": "<p>If a company’s objective is to support its stock price in the event of a market downturn, it would be advised to authorize:<\/p>", "options": {"A": "an open market share repurchase plan to be executed over the next five years.", "B": "a tender offer share repurchase at a fixed price effective in 30 days.", "C": "a Dutch auction tender offer effective in 30 days."}}]}, {"set": 40, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p>James Ryan is a portfolio manager who is reviewing the risk exposure of his stock and bond portfolios, and evaluating new trading strategies.<\/p><p>When analyzing his current stock portfolio, Ryan determines that the monthly 5% VaR is $10.6 million.<\/p><p>Ryan&#x27;s current bond portfolio has a value of $260 million. He uses the parametric method to estimate the daily 5% VaR based on a daily expected return of 0.0218% and a daily standard deviation of returns of 0.8246%. He assumes that portfolio returns follow a normal distribution and that a 5% VaR is 1.65 standard deviations below the expected value.<\/p><p>Ryan considers the implications of adding bonds with embedded options to his current bond portfolio. He is concerned that adding these bonds will cause portfolio performance to deviate significantly from the benchmark. Given this concern, he wants to use an extension of VaR that will measure the extent of this deviation.<\/p><p>Ryan is in the process of backtesting a new multifactor portfolio strategy. For his investment universe of liquid securities, he assesses the performance of a large number of different strategies that use a wide range of factors and rebalancing periods.<\/p><p>After completing his backtesting, Ryan identifies three factor strategies that are all expected to generate a similar mean return and standard deviation. He uses the metrics in Exhibit 1 to evaluate which strategy would provide the most attractive statistical properties for his risk-averse clients.<\/p><p>Exhibit 1<\/p><table><tr><th><\/th><th>Strategy X<\/th><th>Strategy Y<\/th><th>Strategy Z<\/th><\/tr><tr><td>Skewness<\/td><td>–0.9<\/td><td>2.4<\/td><td>2.4<\/td><\/tr><tr><td>Kurtosis<\/td><td>12.7<\/td><td>20.3<\/td><td>12.7<\/td><\/tr><tr><td>Maximum drawdown<\/td><td>35.3%<\/td><td>31.4%<\/td><td>30.2%<\/td><\/tr><\/table>", "exhibits": [], "qs": [{"id": "Mock1:mock1-1-Q19", "rel": [], "los": "Mock 1 Session 1 Q19", "tier": null, "type": "", "stem": "<p>Given his concern about the impact of adding bonds with embedded options to his current bond portfolio, which of the following extensions of VaR should Ryan use?<\/p>", "options": {"A": "Relative VaR", "B": "Conditional VaR", "C": "Incremental VaR"}}]}, {"set": 41, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>Jane Nguyen is a senior bond trader for an investment bank, and Chris Alexander is a junior bond trader at the bank. Nguyen is responsible for her own trading activities and also for providing assignments to Alexander that will develop his skills and create profitable trade ideas. Exhibit 1 presents the current par and spot rates.<\/p><p>Exhibit 1<\/p><p>Current Par and Spot Rates<\/p><table><tr><th>Maturity<\/th><th>Par Rate<\/th><th>Spot Rate<\/th><\/tr><tr><td>One year<\/td><td>2.50%<\/td><td>2.50%<\/td><\/tr><tr><td>Two years<\/td><td>2.99%<\/td><td>3.00%<\/td><\/tr><tr><td>Three years<\/td><td>3.48%<\/td><td>3.50%<\/td><\/tr><tr><td>Four years<\/td><td>3.95%<\/td><td>4.00%<\/td><\/tr><tr><td>Five years<\/td><td>4.37%<\/td><td><\/td><\/tr><\/table><p>Note: Par and spot rates are based on annual-coupon sovereign bonds.<\/p><p>Nguyen gives Alexander two assignments that involve researching various questions:<\/p><p>Assignment 1: What is the yield-to-maturity of the option-free, default-risk-free bond presented in Exhibit 2? Assume that the bond is held to maturity, and use the rates shown in Exhibit 1. Exhibit 2Selected Data for $1,000 Par Bond<\/p><table><tr><th>Bond Name<\/th><th>Maturity (T)<\/th><th>Coupon<\/th><\/tr><tr><td>Bond Z<\/td><td>Three years<\/td><td>6.00%<\/td><\/tr><\/table><p>Note: Terms are today for a T-year loan.<\/p><p>Assignment 2: Assuming that the projected spot curve two years from today will be below the current forward curve, is Bond Z fairly valued, undervalued, or overvalued?<\/p><p>After completing his assignments, Alexander asks about Nguyen’s current trading activities. Nguyen states that she has a two-year investment horizon and will purchase Bond Z as part of a strategy to ride the yield curve. Exhibit 1 shows Nguyen’s yield curve assumptions implied by the spot rates.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q18", "rel": [], "los": "FI · ECO Module 1 Q18", "tier": null, "type": "", "stem": "<p>Based on Exhibit 1, the five-year spot rate is closest to:<\/p>", "options": {"A": "4.40%.", "B": "4.45%.", "C": "4.50%."}}]}, {"set": 42, "session": 2, "topic": "Alternative Investments", "code": "AI", "vignette": "<p>Arturo Rivas is the research manager for alternative investments at the Raritan Bay Endowment Fund. He is attending a conference where hedge fund managers are presenting a broad spectrum of investment strategies. He will take this opportunity to review their presentations, offering memorandums (OMs), and limited partnership agreements and engage in one-on-one meetings. The due diligence will allow him to recommend hedge fund managers and strategies to the endowment’s investment committee.<\/p><p>Rivas reads the OM for the Gemini Fund to evaluate its strategy and performance. He notices the following points in the OM:<\/p><p>“Gemini specializes in the fundamental analysis of global companies in order to establish equity positions for its funds. We believe we have a particular advantage in valuing and actively shorting European companies in the technology, media, and communication sectors. Market timing does not play a role in our investment process. Our style is to take concentrated bets and use leverage to express our convictions. The primary focus is to have our analysts uncover irregularities in the financial reporting of companies and to exploit the potential impact on valuations when the irregularities become known. Our performance goal is to achieve returns that beat the equity market index return with 50% lower volatility. In order to diversify the portfolio, we also maintain value-oriented long positions. On average, the fund is 30%–60% net short the market.”<\/p><p>Rivas reviews managers that focus on event-driven strategies. In particular, the Pegasus Fund focuses on situations where a company has made a cash-for-stock or stock-for-stock offer for a target company. Its strategy takes a view that the merger will fail or that it can succeed, depending on Pegasus’s analysis. The range of returns using a modest degree of leverage is between 5% and 10% per deal if successful. Equities are the primary securities used in the merger arbitrage strategy, but Pegasus also uses convertible bonds, options, and senior and junior debt. A common trade is to take a long position in the target company and a short position in the acquirer. Despite the modest return targets, an attraction for investors is the high Sharpe ratio associated with the strategy.<\/p><p>Rivas evaluates the Orion Fund, a convertible bond strategy. Orion’s OM provides various examples of trades that its manager uses to generate alpha. Rivas reviews one of the many strategies Orion’s manager uses frequently, because he believes this is the best way to understand the fund’s investment style. The OM provides the data in Exhibit 1 from a trade the manager recently entered into.<\/p><p>Exhibit 1: Orion Fund Convertible Bond Arbitrage Position<\/p><table><tr><th>Security/Position Description<\/th><th>Trade Direction<\/th><th>Rationale<\/th><\/tr><tr><td>3% Convertible Bond due 6/1/2050<\/td><td>Long<\/td><td>Purchase new issue<\/td><\/tr><tr><td>Common Stock<\/td><td>Short<\/td><td>Delta-adjusted position<\/td><\/tr><tr><td>Credit Default Swap<\/td><td>Short<\/td><td>Hedge credit risk<\/td><\/tr><tr><td>Interest Rate Swap<\/td><td>Short<\/td><td>Duration-neutral hedge<\/td><\/tr><tr><td>Put Option on Stock<\/td><td>Long<\/td><td>Only in place of delta hedging<\/td><\/tr><tr><td>Leverage<\/td><td>Long/Short<\/td><td>Typically 300% long vs. 200% short<\/td><\/tr><\/table><p>Rivas moves on to a specialist hedge fund strategy that focuses exclusively on volatility trading. Adding this fund to an investor’s portfolio strives to hedge long equity positions. The Taurus Fund typically implements the following three trades in its strategy:<\/p><p>• Trade 1: Sell exchange-traded and over-the-counter equity call options on a market index. Selection of the options depends on the volatility smile and skew.<\/p><p>• Trade 2: Sell VIX futures to capture the volatility premium and roll-down payoff.<\/p><p>• Trade 3: Purchase a receiver volatility swap with an at-inception fair value of zero.<\/p>", "exhibits": [], "qs": [{"id": "AI:ECO-M4-Q29", "rel": [], "los": "AI · ECO Module 4 Q29", "tier": null, "type": "", "stem": "<p>What would the rationale most likely be for an institutional investor to include the Pegasus Fund in its portfolio?<\/p>", "options": {"A": "Uncorrelated source of alpha", "B": "Capital structure arbitrage of valuation divergence", "C": "Earn the illiquidity premium associated with the strategy"}}, {"id": "AI:ECO-M4-Q30", "rel": [], "los": "AI · ECO Module 4 Q30", "tier": null, "type": "", "stem": "<p>Based on the data in Exhibit 1, what strategy is the Orion portfolio manager most likely implementing?<\/p>", "options": {"A": "Taking advantage of option mispricing", "B": "Profiting from extreme market volatility", "C": "Going long a put on the equity net of hedging"}}]}, {"set": 43, "session": 2, "topic": "Portfolio Management", "code": "PM", "vignette": "<p class=\"mut\">이 세트는 지문 없이 문항만 있습니다.<\/p>", "exhibits": [], "qs": [{"id": "PM:ECO-M5-Q63", "rel": [], "los": "PM · ECO Module 5 Q63", "tier": null, "type": "", "stem": "<p>Alessia Rossi is the chief risk officer for Bellotti Bank, which operates in a region dominated by two established industries. Historically, these industries have provided stable employment to the region. Rossi would like to undertake an assessment of how the bank’s loans would perform if the regional economy lost one of these industries. The best choice for this assessment is a(n):<\/p>", "options": {"A": "stress test.", "B": "historical scenario analysis.", "C": "analysis of loan portfolio duration."}}, {"id": "PM:ECO-M5-Q67", "rel": [], "los": "PM · ECO Module 5 Q67", "tier": null, "type": "", "stem": "<p>Position limits:<\/p>", "options": {"A": "take volatility into account.", "B": "are good controls on overconcentration.", "C": "require a reduction in the size of a portfolio when a loss of a particular size occurs in a specified period."}}]}, {"set": 44, "session": 2, "topic": "Fixed Income", "code": "FI", "vignette": "<p>GFC Advisory is a private independent investment firm that provides solutions and advice to individuals and institutions in the United States and internationally. Fernando Aguero is the director of research and is meeting with analysts Sergio Torres, Matteo Pochettino, and Karen Dengler to discuss the development of a research note that explains the role of the term structure of interest rates in fixed-income investment decision making.<\/p><p>Aguero asks the group to describe how traditional theories of the term structure of interest rates explain the shape of the yield curve as well as the relationship between forward rates and expected future spot rates. Each of the analysts responds as follows:<\/p><p>Dengler states that the unbiased expectations theory applies to risky and risk-free assets and maintains that forward rates are an unbiased predictor of expected future spot rates. This theory can explain an upward sloping or downward sloping yield curve.<\/p><p>Pochettino responds that under the liquidity preference theory, investors require a liquidity premium to lend over longer maturities. The theory states that forward rates are an upwardly biased estimate of expected future spot rates, and the yield curve will typically be upward sloping. A downward sloping yield curve is only possible if expected future spot rates decline by enough to offset the liquidity premium.<\/p><p>Torres notes that according to the segmented markets theory, the shape of the yield curve is determined by supply and demand for funds at each maturity and that institutions will deviate from their preferred maturities if they are adequately compensated.<\/p><p>Aguero states there are modern theories of the term structure that offer more precise ways of describing the evolution of interest rates, specifically the Cox–Ingersoll–Ross (CIR) model, the Vasicek model, and the Ho–Lee model. He notes that all three models are structured similarly in that they have a drift term and a stochastic term. Aguero states the three models also assume that short-term interest rates converge to the long-term rate over time. He concludes by stating that while the CIR and Vasicek models assume constant interest rate volatility, the Ho–Lee model allows for interest rate volatility to increase with the level of interest rates.<\/p><p>Aguero notes that yield curve shaping risk is important in fixed-income portfolio management and asks for input on how this should be addressed in the research note. Dengler responds that our note should indicate three factors that describe yield curve movement: level, steepness, and curvature. The risk associated with these three factors can be measured using effective duration.<\/p><p>Torres states the research note should also include a discussion of the impact of interest rate volatility on fixed-income portfolio management and makes the following statements:<\/p><p>• Statement 1: “Interest rate volatility is an important consideration because it impacts the option values embedded in some fixed-income securities.”<\/p><p>• Statement 2: “Long-term interest rates are typically more volatile than short-term interest rates.”<\/p><p>• Statement 3: “Long-term interest rate volatility is linked to uncertainty regarding the real economy and inflation, whereas short-term interest rate volatility is related to uncertainty regarding monetary policy.<\/p>", "exhibits": [], "qs": [{"id": "FI:ECO-M1-Q71", "rel": [], "los": "FI · ECO Module 1 Q71", "tier": null, "type": "", "stem": "<p>With regard to Aguero’s question regarding traditional theories of the term structure of interest rates, who is most likely correct?<\/p>", "options": {"A": "Torres", "B": "Dengler", "C": "Pochettino"}}]}, {"set": 45, "session": 2, "topic": "Equity Valuation", "code": "EQ", "vignette": "<p>Jacob Daniel is the chief investment officer at a US pension fund sponsor, and Steven Rae is an analyst for the pension fund who follows consumer/non-cyclical stocks. At the beginning of 20X9, Daniel asks Rae to value the equity of Tasty Foods Company for its possible inclusion in the list of approved investments. Tasty Foods Company is involved in the production of frozen foods that are sold under its own brand name to retailers.<\/p><p>Rae is considering whether a dividend discount model would be appropriate for valuing Tasty Foods. He has compiled the information in the following table for the company’s EPS and DPS during the last five years. The qua

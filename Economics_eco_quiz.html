<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Economics Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.tbl td.lbl{background:#FAFBFD;font-weight:600;white-space:normal}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Economics 오답 퀴즈<span>CFA Level II, Schweser 기준</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>
  </div>
  <div class="progress"><i id="pbar"></i></div>

</div></header>

</main>
<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q4", "src": "ECO 오답", "module": 1, "tag": "FX 스프레드 요인 – spot 거래에서 신용등급 영향 작음", "vig": 0, "stem": "The factor least likely to lead to a narrow bid–offer spread for the industrial company's needed currency trade is the:", "opts": {"A": "timing of its trade.", "B": "company's credit rating.", "C": "pair of currencies involved."}, "ans": "B", "en": "While credit ratings can affect spreads, the trade involves spot settlement (two business days after the trade date), so the spread quoted to this highly rated (AA) firm is not likely to be much tighter than the spread quoted to a somewhat lower-rated (but still high-quality) firm. The relationship between the bank and the client, the size of the trade, the time of day the trade is initiated, the currencies involved, and the level of market volatility are more significant factors.", "ko": "spot 거래는 2영업일 뒤 결제라 신용위험에 노출되는 기간이 아주 짧습니다. 그래서 AA 등급이라고 스프레드가 크게 좁아지지 않습니다. 스프레드를 좌우하는 것은 거래 시간대, 통화쌍, 거래 규모, 은행–고객 관계, 시장 변동성입니다.", "trap": "'신용등급 높음 → 스프레드 좁음'이 직관적이지만 spot에서는 효과가 작다. 신용위험은 만기가 긴 forward에서 커진다.", "f": "Dealer spread ← interbank spread·거래 규모·고객 관계 / Interbank spread ← 통화쌍·시간대·변동성", "why": {"A": "거래 시간대는 중요한 요인입니다. 런던과 뉴욕이 함께 열려 있는 시간대(예: 뉴욕 오전 8시대)가 유동성이 가장 커서 스프레드가 가장 좁습니다.", "C": "통화쌍은 interbank 스프레드를 직접 결정합니다. 거래량이 많은 통화쌍일수록 스프레드가 좁습니다."}, "orig": "ECO Module 1 Q4"}, {"id": "ECO-M1-Q6", "src": "ECO 오답", "module": 1, "tag": "Spot 환전 – base 매수는 offer", "vig": 1, "stem": "Using the quotes in Exhibit 1, the amount received by Goldsworthy from converting JPY 225,000,000 will be closest to:", "opts": {"A": "GBP 1,734,906.", "B": "GBP 1,735,174.", "C": "GBP 1,735,442."}, "ans": "A", "en": "Goldsworthy is buying the base currency (GBP) in the JPY/GBP quote, so she must pay the offer price of JPY 129.69 per GBP: JPY 225,000,000 / 129.69 = GBP 1,734,906.", "ko": "JPY/GBP에서 GBP가 base입니다. JPY로 GBP를 사는 것은 base 매수이므로 딜러의 offer(129.69)를 쓰고, 'down the quote'라 나눕니다. 225,000,000 / 129.69 = GBP 1,734,906.", "trap": "base를 살 때 offer, 팔 때 bid. 고객에게 불리한 쪽 가격이 적용된다고 생각하면 헷갈리지 않는다.", "f": "GBP 받는 금액 = JPY 225,000,000 / 129.69(offer)", "why": {"B": "중간값 129.67로 나눈 값입니다. 실제 거래는 딜러의 bid나 offer로 체결됩니다.", "C": "bid 129.65로 나눈 값입니다. GBP(base)를 사는 쪽이므로 offer를 써야 합니다."}, "orig": "ECO Module 1 Q6"}, {"id": "ECO-M1-Q8", "src": "ECO 오답", "module": 1, "tag": "삼각 차익거래 – 딜러 cross rate 비교", "vig": 1, "stem": "Using the quotes from Dealer A and B, the triangular arbitrage profit on a transaction of MXN 27,000,000 would be closest to:", "opts": {"A": "GBP 0.", "B": "GBP 5,400.", "C": "GBP 10,800."}, "ans": "A", "en": "Dealer A's implied MXN/GBP: bid = 20.140 × 1.2301 = 24.7742; offer = 20.160 × 1.2305 = 24.8069. Inverting, Dealer A effectively quotes GBP/MXN 0.0403/0.0404 (1/24.8069 and 1/24.7742). She can buy MXN more cheaply from Dealer A (GBP 0.0404 versus Dealer B's 0.0406), but she cannot resell to Dealer B for more than Dealer B's bid of GBP 0.0403. There is no profit from triangular arbitrage.", "ko": "Dealer A의 MXN/USD와 USD/GBP를 곱해 MXN/GBP를 만들고 뒤집으면 GBP/MXN 0.0403/0.0404입니다. Dealer B는 0.0403/0.0406. 싸게 사는 곳(A의 offer 0.0404)보다 비싸게 파는 곳(B의 bid 0.0403)이 낮으니 차익이 없습니다. 차익거래가 되려면 한쪽의 bid가 다른 쪽 offer보다 높아야 합니다.", "trap": "두 offer끼리, 두 bid끼리 비교하면 가짜 이익이 보인다. 반드시 '산 가격(offer) < 판 가격(bid)'인지 확인.", "f": "차익 조건: 한 딜러의 bid > 다른 딜러의 offer. 뒤집을 때 bid ↔ offer 자리가 바뀜", "why": {"B": "27,000,000 × (0.0406 − 0.0404) = 5,400. 두 딜러의 offer끼리 비교한 값이라 실제로 실현할 수 없습니다.", "C": "bid와 offer를 섞어 계산한 가짜 이익입니다. A에서 사서(0.0404) B에 팔면(0.0403) 오히려 손해입니다."}, "orig": "ECO Module 1 Q8"}, {"id": "ECO-M1-Q9", "src": "ECO 오답", "module": 1, "tag": "Forward mark-to-market – 남은 기간·price 통화 금리로 할인", "vig": 1, "stem": "Based on Exhibits 1, 2, and 3, the mark-to-market gain for Goldsworthy's forward position is closest to:", "opts": {"A": "GBP 19,971.", "B": "GBP 20,500.", "C": "GBP 21,968."}, "ans": "A", "en": "Marking the nine-month contract to market six months later requires buying GBP/EUR (EUR) three months forward. The three-month forward rate to use is the offer: 0.9471 + 15/10,000 = 0.9486. She sold EUR 5,000,000 at 0.9526 and buys at 0.9486, so the settlement cash flow is 5,000,000 × (0.9526 − 0.9486) = GBP 20,000. Discount for three months at the GBP MRR of 0.58%: 20,000 / [1 + 0.0058 × (90/360)] = GBP 19,971.", "ko": "EUR를 forward로 판 포지션을 청산하려면 남은 3개월짜리로 EUR를 사야 합니다(base 매수 → offer). 0.9471 + 15/10,000 = 0.9486. 만기 현금흐름 5,000,000 × (0.9526 − 0.9486) = GBP 20,000을 GBP(price 통화) 3개월 금리로 할인하면 19,971입니다.", "trap": "① 반대 거래 방향(bid/offer) ② 남은 기간의 forward points ③ price 통화 금리로 남은 기간만큼 할인 – 셋 중 하나만 틀려도 오답.", "f": "V = (F0 − Ft) × 계약규모 / [1 + i_price × (남은 일수/360)]", "why": {"B": "offer spot(0.9471)에 bid points(14)를 붙여 0.9485로 계산하고, 할인도 하지 않은 값입니다.", "C": "bid spot(0.9467)에 offer points(15)를 붙여 0.9482로 계산한 값입니다. spot과 points는 같은 쪽(offer끼리)을 써야 합니다."}, "orig": "ECO Module 1 Q9"}, {"id": "ECO-M1-Q10", "src": "ECO 오답", "module": 1, "tag": "Forward points 부호 → 금리 높낮이", "vig": 1, "stem": "Based on Exhibit 2, Underwood should conclude that three-month EUR MRR is:", "opts": {"A": "below three-month GBP MRR.", "B": "equal to three-month GBP MRR.", "C": "above three-month GBP MRR."}, "ans": "A", "en": "The positive forward points for GBP/EUR indicate that the EUR (base) trades at a forward premium at all maturities. By covered interest rate parity, a forward rate greater than the spot rate requires the price-currency rate (GBP MRR) to be greater than the base-currency rate (EUR MRR).", "ko": "forward points가 +이면 F > S, 즉 base(EUR)가 forward premium입니다. CIP에서 F/S = (1+i_GBP)/(1+i_EUR)이므로 F > S이면 i_GBP > i_EUR. 금리가 낮은 통화가 forward에서 premium이 됩니다.", "trap": "'premium인 통화 = 금리가 높은 통화'로 거꾸로 외우는 실수. 금리가 낮은 통화가 forward premium.", "f": "F > S ⇔ i_price > i_base (F_P/B = S × (1+i_P)/(1+i_B))", "why": {"B": "두 금리가 같다면 F = S라서 forward points가 0이어야 합니다.", "C": "EUR 금리가 더 높다면 EUR(base)는 forward discount가 되고 points는 음수여야 합니다."}, "orig": "ECO Module 1 Q10"}, {"id": "ECO-M1-Q11", "src": "ECO 오답", "module": 1, "tag": "Forward premium/discount 계산 – 기간 조정", "vig": 1, "stem": "Based on the exchange rate midpoint in Exhibit 1 and the rates in Exhibit 3, the 90-day forward premium (discount) for the USD/GBP would be closest to:", "opts": {"A": "–0.0040.", "B": "–0.0010.", "C": "+0.0010."}, "ans": "B", "en": "By covered interest rate parity, F − S = S × [(90/360)(i_USD − i_GBP)] / [1 + i_GBP(90/360)] = 1.2303 × [0.25 × (0.0033 − 0.0058)] / (1 + 0.0058 × 0.25) ≈ −0.0008. Because the price-currency (USD) MRR is lower than the base-currency (GBP) MRR, the forward rate is below the spot rate; the closest answer is a discount of about −0.0010.", "ko": "USD/GBP에서 USD가 price, GBP가 base입니다. F − S = 1.2303 × 0.25 × (0.33% − 0.58%) / (1 + 0.58% × 0.25) ≈ −0.0008, 보기 중 가장 가까운 것은 −0.0010입니다. USD 금리가 GBP보다 낮으니 forward discount(음수)입니다.", "trap": "분자·분모 모두 90/360 기간 조정을 넣어야 한다. 금리 차이(i_P − i_B)의 순서를 바꾸면 부호가 뒤집힌다.", "f": "F − S = S × [(일수/360)(i_P − i_B)] / [1 + i_B(일수/360)]", "why": {"A": "실제 값(약 −0.0008)보다 절댓값이 훨씬 큽니다. 90일 계약이므로 금리 차이에 90/360을 곱해야 값이 작아집니다.", "C": "부호가 반대입니다. price 통화(USD) 금리가 base(GBP)보다 낮으므로 F < S, 즉 discount입니다."}, "orig": "ECO Module 1 Q11"}, {"id": "ECO-M1-Q12", "src": "ECO 오답", "module": 1, "tag": "Forward·spot·한쪽 금리로 다른 금리 구하기 → CIP", "vig": 1, "stem": "Using Exhibits 1, 2, and 3, which international parity condition would Goldsworthy most likely use to calculate the EUR MRR?", "opts": {"A": "Real interest rate parity", "B": "Covered interest rate parity", "C": "Uncovered interest rate parity"}, "ans": "B", "en": "Covered interest rate parity specifies the forward exchange rate that must hold to prevent arbitrage given the spot exchange rate and the risk-free rates in both countries. If the forward and spot rates and one of the risk-free rates are known, the other risk-free rate can be calculated.", "ko": "CIP는 spot, forward, 두 나라 금리를 하나의 식으로 묶습니다(차익거래로 항상 성립). 이 중 셋(spot, 90일 forward, GBP 금리)을 알면 나머지 EUR 금리를 풀 수 있습니다.", "trap": "'금리로 미래 환율 예측'은 UIP, 'forward가 주어지고 금리를 역산'은 CIP.", "f": "F_P/B = S_P/B × [1 + i_P(일수/360)] / [1 + i_B(일수/360)]", "why": {"A": "실질금리 평형은 두 나라 실질금리가 같아진다는 조건으로, forward 환율과 연결되지 않습니다.", "C": "UIP는 금리 차이로 '예상 미래 spot'을 설명합니다. 시장에서 거래되는 forward 환율이 들어간 식이 아닙니다."}, "orig": "ECO Module 1 Q12"}, {"id": "ECO-M1-Q13", "src": "ECO 오답", "module": 1, "tag": "헤지 안 한 미래 spot 예측 → UIP", "vig": 1, "stem": "The international parity condition Goldsworthy will use to provide the estimate of the future JPY/GBP spot rate is most likely:", "opts": {"A": "covered interest rate parity.", "B": "uncovered interest rate parity.", "C": "relative purchasing power parity."}, "ans": "B", "en": "According to uncovered interest rate parity, %ΔS^e(f/d) = i_f − i_d: the expected change in the spot exchange rate should reflect the interest rate spread between the two countries, which can be found in Exhibit 3. Given the spot rate (Exhibit 1) and the expected change, she can estimate the future spot rate.", "ko": "헤지하지 않는 엔화 현금흐름의 미래 spot을 '금리 차이'로 추정하는 것이 UIP입니다. Exhibit 3에 금리만 있고 인플레이션 자료는 없으니 PPP는 쓸 수 없습니다.", "trap": "CIP는 no-arbitrage forward 가격, UIP는 예상 미래 spot. 'do not hedge + future spot forecast' → UIP.", "f": "%ΔS^e(P/B) ≈ i_P − i_B", "why": {"A": "CIP는 차익거래가 없도록 하는 forward 환율을 구하는 조건입니다. 미래 spot 자체를 예측하는 조건은 아닙니다.", "C": "상대 PPP는 인플레이션 차이로 환율 변화를 설명합니다. 주어진 자료에는 인플레이션 정보가 없습니다."}, "orig": "ECO Module 1 Q13"}, {"id": "ECO-M1-Q14", "src": "ECO 오답", "module": 1, "tag": "Carry trade의 전제 – UIP가 단기·중기에 성립 안 함", "vig": 2, "stem": "The international parity condition McFadden is referring to in Statement 1 is:", "opts": {"A": "purchasing power parity.", "B": "covered interest rate parity.", "C": "uncovered interest rate parity."}, "ans": "C", "en": "The carry trade strategy depends on uncovered interest rate parity not holding in the short or medium term. If UIP held, an unhedged foreign currency investment would earn the same return as a domestic investment because exchange rate moves would offset the yield differential. During low-volatility periods, high-yield currencies do not depreciate enough and low-yield currencies do not appreciate enough to offset the yield differential.", "ko": "UIP가 성립하면 고금리 통화가 금리 차이만큼 절하돼서 carry trade 이익이 0이 됩니다. carry trade는 이 UIP가 단기·중기에 깨지는 것에 거는 전략이라 'does not always hold'는 UIP입니다.", "trap": "CIP는 차익거래로 항상 성립(covered = bound by arbitrage). '항상 성립하지 않는' 조건은 UIP.", "f": "Carry trade 수익 ≈ (i_high − i_low) − 고금리 통화 절하율", "why": {"A": "PPP는 인플레이션과 환율의 관계입니다. carry trade의 핵심인 금리 차이와 환율 변화의 관계가 아닙니다.", "B": "CIP는 차익거래로 강제되어 거의 항상 성립합니다. 또 forward로 헤지하는 거래에 관한 조건이라 헤지하지 않는 carry trade와 맞지 않습니다."}, "orig": "ECO Module 1 Q14"}, {"id": "ECO-M1-Q19", "src": "ECO 오답", "module": 1, "tag": "EM 중앙은행 개입 효과 ↑ – FX reserves/거래량 비율", "vig": 2, "stem": "The factor that McFadden is most likely referring to in Statement 4 is:", "opts": {"A": "FX reserve levels.", "B": "domestic demand.", "C": "the level of capital flows."}, "ans": "A", "en": "EM countries are better able to influence their exchange rates because their reserve levels as a ratio of average daily FX turnover are generally much greater than those of DM countries, where the ratio is negligible. EM policymakers use their foreign exchange reserves as a kind of insurance to defend their currencies.", "ko": "선진국 통화는 하루 거래량이 외환보유액에 비해 너무 커서 개입해도 효과가 없습니다. 신흥국은 외환보유액이 거래량에 비해 커서 수급에 영향을 줄 수 있으므로 개입 효과가 더 큽니다.", "trap": "'신흥국이 더 효과적'이라는 말에 자본 흐름을 떠올리기 쉽지만, 핵심은 외환보유액 대비 거래량 비율.", "f": "개입 효과 ∝ FX reserves / 평균 일일 FX 거래량", "why": {"B": "국내 수요는 개입 효과와 관계가 없습니다.", "C": "자본 흐름은 개입이 필요한 이유이지, 신흥국 개입이 더 효과적인 이유가 아닙니다."}, "orig": "ECO Module 1 Q19"}, {"id": "ECO-M1-Q20", "src": "ECO 오답", "module": 1, "tag": "통화위기 전조 – 외환보유액 급감", "vig": 2, "stem": "Which of McFadden's predictions in Statement 5 is least likely to be correct?", "opts": {"A": "Prediction 1", "B": "Prediction 2", "C": "Prediction 3"}, "ans": "A", "en": "Prediction 1 is least likely to be correct. Foreign exchange reserves tend to decline precipitously, not increase, as a currency crisis approaches. Broad money growth tends to rise in the period leading up to a currency crisis, and the exchange rate is substantially higher than its mean level during tranquil periods.", "ko": "위기가 다가오면 중앙은행이 통화가치를 지키려고 외환보유액을 써서 보유액이 급감합니다. 광의통화(M2) 증가, 환율이 평소보다 높은 수준(통화 고평가)은 실제 전조가 맞습니다.", "trap": "전조 신호 방향: 외환보유액 ↓, M2(광의통화)/은행 지급준비금 ↑, 교역조건 악화, 통화가치는 역사적 평균보다 높음.", "f": "위기 전조: reserves ↓, broad money ↑, terms of trade ↓, inflation ↑, 고정환율, 자본시장 자유화, 은행위기", "why": {"B": "광의통화 증가율은 위기 직전에 실제로 높아지는 경향이 있으므로 맞는 예측입니다.", "C": "위기 전 통화가치는 평온한 시기의 평균보다 높게(고평가) 형성되는 경향이 있으므로 맞는 예측입니다."}, "orig": "ECO Module 1 Q20"}, {"id": "ECO-M1-Q21", "src": "ECO 오답", "module": 1, "tag": "경상수지 장기 한계 → Debt sustainability channel", "vig": 3, "stem": "The mechanism about which Thibodeaux is most confident as an explanation for the long-run equilibrium value of exchange rates is best described as the:", "opts": {"A": "portfolio balance channel.", "B": "debt sustainability channel.", "C": "flow supply/demand channel."}, "ans": "B", "en": "The debt sustainability channel assumes there is some upper limit on the ability of countries to run persistently large current account deficits. If a country's external debt rises to levels investors view as unsustainable, a major depreciation of the deficit country's currency will eventually be required so that the deficit narrows and the external debt stabilizes.", "ko": "'경상수지 적자에 장기 한계가 있다'는 가정이 debt sustainability channel입니다. 적자가 쌓여 대외부채가 감당할 수 없는 수준이 되면 투자자가 떠나고 통화가 크게 절하되어 적자가 줄어듭니다.", "trap": "세 채널 구분: 무역 대금 환전 수급 → flow, 자산 보유 비중 재조정 → portfolio balance, 부채 한계 → debt sustainability.", "f": "지속적 CA 적자 → 대외부채 누적 → 통화 급락 → 적자 축소", "why": {"A": "portfolio balance channel은 경상수지 불균형으로 자산 보유가 옮겨가고 투자자가 포트폴리오 비중을 재조정하는 경로입니다. '적자의 한계'가 핵심이 아닙니다.", "C": "flow supply/demand channel은 수출입 대금 환전에 따른 통화 수급 변화입니다. 장기 적자 한계를 가정하지 않습니다."}, "orig": "ECO Module 1 Q21"}, {"id": "ECO-M1-Q25", "src": "ECO 오답", "module": 1, "tag": "Carry trade 수익률 – offer 환전 + 차입비용 차감", "vig": 3, "stem": "Based on the data in Exhibit 1, the expected net investment return on a one-year carry trade based on the JPY/EUR currency pair, measured in JPY terms, is closest to:", "opts": {"A": "2.86%.", "B": "3.01%.", "C": "3.10%."}, "ans": "A", "en": "Borrow the low-rate JPY at 0.15% and invest in the higher-rate EUR at 1.40%. Borrow JPY and buy USD at JPY 117.66 (offer), then buy EUR at USD 1.0873 (offer): 117.66 × 1.0873 = 127.93 JPY/EUR. One year later: 118.32 × 1.0984 = 129.96. Net return = [(1/127.93) × 1.0140 × 129.96] − [1.0000 × 1.0015] = 1.0301 − 1.0015 = 2.86%.", "ko": "JPY(저금리)를 빌려 EUR(고금리)에 투자합니다. EUR를 사야 하므로 두 번 다 offer로 환전: 117.66 × 1.0873 = 127.93. 1년 뒤 환율은 118.32 × 1.0984 = 129.96. (1/127.93) × 1.014 × 129.96 = 1.0301에서 차입 원리금 1.0015를 빼면 2.86%.", "trap": "① 통화를 살 때는 offer ② 마지막에 차입 이자(0.15%) 차감 – 둘 중 하나라도 빠지면 3.01%나 3.10%.", "f": "Carry 수익 = (1/S0) × (1 + i_invest) × S1 − (1 + i_fund)", "why": {"B": "JPY 차입 이자(0.15%)를 빼지 않은 값입니다. 1.0301 − 1.0000 = 3.01%.", "C": "처음 환전에서 bid로 cross rate(117.62 × 1.0851 = 127.63)를 만든 값입니다. EUR를 살 때는 offer를 씁니다."}, "orig": "ECO Module 1 Q25"}, {"id": "ECO-M1-Q29", "src": "ECO 오답", "module": 1, "tag": "Forward premium/discount – S × 금리차 / (1 + i_B)", "vig": 4, "stem": "Based on Exhibit 1 and Exhibit 2, the forward premium (discount) for a 360-day AUD/CAD forward contract is closest to:", "opts": {"A": "–0.00617.", "B": "–0.00580.", "C": "0.00277."}, "ans": "A", "en": "F − S = S × [(Actual/360)(i_P − i_B)] / [1 + i_B(Actual/360)]. CAD is the base and AUD is the price currency; S = 1.0732 (midpoint). F − S = 1.0732 × (0.0026 − 0.0084) / (1 + 0.0084) = −0.00617.", "ko": "AUD/CAD에서 AUD가 price, CAD가 base입니다. 1.0732 × (0.26% − 0.84%) / (1 + 0.84%) = −0.00617. 호주 금리가 더 낮으니 forward discount(음수)입니다.", "trap": "금리 차이만 계산하고 끝내거나(−0.0058), 한쪽 금리만 넣는 실수. S를 곱하고 (1 + i_B)로 나누는 것까지 해야 한다.", "f": "F − S = S_P/B × (i_P − i_B)(일수/360) / [1 + i_B(일수/360)]", "why": {"B": "금리 차이(0.26% − 0.84% = −0.58%)만 계산한 값입니다. spot 환율을 곱하고 (1 + i_B)로 나눠야 합니다.", "C": "금리 차이 대신 AUD 금리(0.26%)만 넣어 계산한 값입니다(1.0732 × 0.0026 / 1.0084). 부호도 반대입니다."}, "orig": "ECO Module 1 Q29"}, {"id": "ECO-M1-Q34", "src": "ECO 오답", "module": 1, "tag": "경상수지 흑자 → 통화 절상 (flow supply/demand)", "vig": 5, "stem": "Kaur's assertion about the change in the value of Country A's currency is most likely:", "opts": {"A": "correct because countries with trade surplus will finance their trade with increased borrowing.", "B": "incorrect because countries have an upper limit on the ability to borrow during trade surpluses.", "C": "correct because countries with persistent current account surpluses tend to appreciate over time."}, "ans": "C", "en": "The flow supply/demand channel asserts that countries with persistent current account surpluses should see their currencies appreciate over time, and countries with persistent current account deficits should see their currencies depreciate over time.", "ko": "경상수지 흑자국은 수출 대금을 자국 통화로 바꾸려는 수요가 계속 생기므로 통화가 절상됩니다. 이것이 flow supply/demand channel이고, Kaur의 주장은 맞습니다.", "trap": "다른 채널의 설명을 흑자/적자를 뒤바꿔 넣은 보기에 주의. 차입으로 무역을 메우는 것과 차입 한도는 모두 '적자국' 이야기.", "f": "CA 흑자 → 자국 통화 수요 ↑ → 절상 / CA 적자 → 절하", "why": {"A": "portfolio balance channel을 흑자/적자를 바꿔 설명한 보기입니다. 차입으로 무역을 메우는 쪽은 적자국입니다.", "B": "debt sustainability channel을 잘못 쓴 보기입니다. 차입 한도 문제는 흑자국이 아니라 지속적인 적자국에 해당합니다."}, "orig": "ECO Module 1 Q34"}, {"id": "ECO-M1-Q35", "src": "ECO 오답", "module": 1, "tag": "Carry trade crash의 근본 원인 – 레버리지", "vig": 6, "stem": "The primary factor that was most likely the cause of Drawbridge's outcome in its carry trade was:", "opts": {"A": "leverage.", "B": "flight to safety.", "C": "stop-loss orders."}, "ans": "A", "en": "The primary reason for crash risk is that carry trades are leveraged: the low-yield currency is borrowed and the proceeds invested in the high-yield currency. Leverage magnifies losses relative to the investors' equity base. Crowded positions unwind rapidly when a market shock occurs; stop-loss orders and a flight to safety further increase demand for the low-yield currency.", "ko": "carry trade는 저금리 통화를 빌려 투자하는 레버리지 거래라 작은 환율 충격도 자본 대비 큰 손실이 됩니다. flight to safety와 stop-loss는 손실을 키우는 요인일 뿐, 근본 원인은 레버리지입니다.", "trap": "'가속 요인(stop-loss, flight to safety)'과 '근본 원인(leverage)'을 구분.", "f": "Carry trade 수익 분포: 음의 왜도 + fat tail(crash risk) ← 레버리지", "why": {"B": "flight to safety는 위기 때 저금리 안전통화로 돈이 몰리는 현상입니다. 손실을 키우지만 근본 원인은 아닙니다.", "C": "stop-loss 주문은 연쇄 매도를 일으켜 하락을 가속합니다. 역시 근본 원인은 레버리지입니다."}, "orig": "ECO Module 1 Q35"}, {"id": "ECO-M1-Q36", "src": "ECO 오답", "module": 1, "tag": "MTM – base 매도 포지션 청산은 offer, 음수 points", "vig": 6, "stem": "The mark-to-market value for Drawbridge's forward position is closest to:", "opts": {"A": "–USD44,774.", "B": "–USD44,800.", "C": "–USD42,576."}, "ans": "A", "en": "Drawbridge sold AUD 5 million forward at 0.8940 (USD/AUD). To mark to market, it buys AUD 5 million three months forward, paying the offer for both spot and points: 0.9066 − 0.00364 = 0.90296. Settlement cash flow = 5,000,000 × (0.8940 − 0.90296) = −USD44,800 (AUD appreciated). PV at the three-month USD rate: −44,800 / [1 + 0.0023(90/360)] = −USD44,774.", "ko": "AUD를 forward로 팔아 둔 포지션이라 청산하려면 AUD를 사야 합니다(offer). 0.9066 + (−36.4/10,000) = 0.90296. 5,000,000 × (0.8940 − 0.90296) = −44,800을 USD(price) 3개월 금리로 할인하면 −44,774.", "trap": "points가 음수면 spot에서 빼야 한다. offer 쪽 points는 −36.4(절댓값이 작은 쪽)임에 주의.", "f": "V = (F0 − Ft) × 5,000,000 / [1 + i_USD × 90/360] (base 매도 포지션 기준)", "why": {"B": "현재가치로 할인하지 않은 만기 현금흐름입니다.", "C": "청산 거래에 bid(0.9062 − 0.00368 = 0.90252)를 쓴 값입니다. AUD를 사는 거래이므로 offer를 씁니다."}, "orig": "ECO Module 1 Q36"}, {"id": "ECO-M1-Q38", "src": "ECO 오답", "module": 1, "tag": "통화위기 위험 – 외화 단기조달로 커진 은행 부문", "vig": 7, "stem": "Which of the recent economic developments discussed by Birol and Pamuk is most likely to lead to a currency crisis?", "opts": {"A": "The banking sector", "B": "The exchange rate system", "C": "The trend in terms of trade and monetary ratios"}, "ans": "A", "en": "Growth in the banking sector funded by short-term foreign-currency deposits can lead to a currency crisis. Countries with fixed or partially fixed exchange rates are more susceptible (Daltonia floats). Broad money measures such as M2 relative to bank reserves tend to rise (not fall) just prior to a crisis, and the terms of trade (exports/imports) are improving for Daltonia.", "ko": "외화 예금으로 단기 조달해 국내 대출을 늘린 은행 부문은 통화가 절하되면 외화부채 부담이 커져 위기로 이어질 수 있습니다. 은행위기는 통화위기보다 먼저 오기도 합니다. 변동환율은 오히려 위험을 줄이고, 교역조건 개선·M2/지준 하락은 위기 신호의 반대 방향입니다.", "trap": "Pamuk은 은행 부문이 '강해졌다'고 말하지만, 외화 단기조달 구조 자체가 위험 신호.", "f": "위험: 외화표시 단기부채, 고정/부분고정 환율, M2/지준 ↑, 교역조건 악화", "why": {"B": "고정 또는 부분 고정 환율이 위기에 더 취약합니다. Daltonia는 변동환율로 바꿨으므로 위험을 줄인 쪽입니다.", "C": "수출/수입 비율 상승(교역조건 개선)과 M2/지준 하락은 모두 위기 신호의 반대 방향입니다."}, "orig": "ECO Module 1 Q38"}, {"id": "ECO-M1-Q39", "src": "ECO 오답", "module": 1, "tag": "삼각 차익거래 – interbank cross vs 딜러 호가", "vig": 7, "stem": "Based on the exchange rate quotes in Exhibit 2, an opportunistic European hedge fund interested in triangular arbitrage between the dealer and interbank markets is most likely to:", "opts": {"A": "discover that no triangular arbitrage opportunity exists.", "B": "buy EUR in the interbank market and sell EUR to the Daltonian dealer.", "C": "buy EUR from the Daltonian dealer and sell EUR in the interbank market."}, "ans": "B", "en": "Invert EUR/USD: USD/EUR bid = 1/0.8065 = 1.240; offer = 1/0.8045 = 1.243. Interbank DRN/EUR: bid = 1.2050 × 1.240 = 1.4942; offer = 1.2100 × 1.243 = 1.504. The interbank offer (1.504) is below the dealer's bid (1.514), so the fund buys EUR in the interbank market for DRN 1.504 and sells EUR to the dealer for DRN 1.514.", "ko": "EUR/USD를 뒤집으면 USD/EUR 1.240/1.243(뒤집을 때 bid·offer 자리 바뀜). DRN/USD와 곱하면 interbank DRN/EUR = 1.4942/1.504. 딜러는 EUR를 1.514에 사 주므로, interbank에서 1.504에 사서 딜러에게 1.514에 팔면 이익입니다.", "trap": "cross rate를 만들 때 bid × bid, offer × offer. 뒤집은 통화는 bid = 1/offer, offer = 1/bid.", "f": "DRN/EUR = DRN/USD × USD/EUR, USD/EUR bid = 1/(EUR/USD offer)", "why": {"A": "interbank offer(1.504)가 딜러 bid(1.514)보다 낮으므로 차익 기회가 있습니다.", "C": "딜러 offer 1.519에 사서 interbank bid 1.4942에 팔면 손해입니다. 이익이 나는 방향의 반대입니다."}, "orig": "ECO Module 1 Q39"}, {"id": "ECO-M1-Q43", "src": "ECO 오답", "module": 1, "tag": "Carry trade all-in 수익률 – 차입비용 차감", "vig": 8, "stem": "Based on Exhibit 3, the all-in return (in currency D terms) on Mandurah's carry trade is closest to:", "opts": {"A": "2.13%.", "B": "2.78%.", "C": "3.35%."}, "ans": "A", "en": "Currency D is the funding currency and currency E is the investment currency. The E-per-D rate rose from 6.6710 to 6.7500, meaning D appreciated (E depreciated). All-in return = (1 + 0.04)(6.6710 / 6.7500) − (1 + 0.0065) = 0.0213 = 2.13%.", "ko": "D(저금리)를 빌려 E(고금리)에 투자합니다. E per D 환율이 6.6710 → 6.7500으로 올랐으니 E가 약해졌습니다. D로 환산한 투자 원리금 1.04 × 6.6710/6.75에서 D 차입 원리금 1.0065를 빼면 2.13%.", "trap": "차입비용(0.65%)을 빼먹거나, 환율 변화를 무시하고 금리 차이만 계산하는 실수.", "f": "All-in = (1 + i_E) × (S0 / S1) − (1 + i_D)  (S = E per D)", "why": {"B": "D 차입 비용을 빼지 않은 값입니다: 1.04 × (6.6710/6.75) − 1 = 2.78%.", "C": "환율 변화를 무시하고 금리 차이(4.00% − 0.65%)만 계산한 값입니다."}, "orig": "ECO Module 1 Q43"}, {"id": "ECO-M1-Q44", "src": "ECO 오답", "module": 1, "tag": "확장 재정 + 긴축 통화 (고이동성) → 단기 절상, 장기 절하", "vig": 8, "stem": "Based on Gupta's observations and the Mundell-Fleming and portfolio balance approaches, Country A's currency would be expected to:", "opts": {"A": "appreciate in the short term but depreciate in the long term.", "B": "depreciate in the short term towards a lower, long-term equilibrium exchange rate.", "C": "appreciate in the short term towards a higher, long-term equilibrium exchange rate."}, "ans": "A", "en": "Mundell-Fleming is a short-term model: with highly mobile capital, expansionary fiscal policy and restrictive monetary policy cause the currency to appreciate. Over the longer term, the portfolio balance approach indicates that as foreign holdings of the country's bonds grow to levels creditors will not accept, they reduce their portfolio weights and sell the currency, causing depreciation.", "ko": "단기(Mundell-Fleming): 자본 이동이 자유로울 때 확장 재정 + 긴축 통화 → 금리 상승 → 자본 유입 → 절상. 장기(portfolio balance): 정부부채가 계속 쌓이면 해외 투자자가 비중을 줄이며 통화를 팔아 절하.", "trap": "Mundell-Fleming은 단기, portfolio balance는 장기. 두 모형을 합치면 '단기 절상 → 장기 절하'.", "f": "고이동성: 확장재정/긴축통화 → 절상(단기) → 부채 누적 → 절하(장기)", "why": {"B": "단기에는 높은 금리로 자본이 들어와 절상될 가능성이 큽니다. 처음부터 절하하지 않습니다.", "C": "단기 절상은 맞지만, 장기적으로는 부채 누적에 대한 우려로 절하됩니다."}, "orig": "ECO Module 1 Q44"}, {"id": "ECO-M1-Q52", "src": "ECO 오답", "module": 1, "tag": "삼각 차익거래 – USD/CHF 뒤집기와 bid/offer 교환", "vig": 9, "stem": "Based on the data in Exhibit 1, if a dealer quoted a bid–offer rate of CHF1.0741/EUR1.0746, then a profitable triangular arbitrage would most likely involve buying EUR1 from the dealer and then selling it in the interbank market for a profit of:", "opts": {"A": "CHF0.0005.", "B": "CHF0.0007.", "C": "CHF0.0008."}, "ans": "A", "en": "CHF/EUR = CHF/USD × USD/EUR. Invert USD/CHF 1.0453/1.0456 and interchange bid and offer: CHF/USD = (1/1.0456)/(1/1.0453) = 0.9564/0.9567. Bid: 0.9564 × 1.1241 = 1.0751; offer: 0.9567 × 1.1243 = 1.0756. The dealer offers EUR at 1.0746, below the interbank bid of 1.0751, so buy EUR from the dealer at 1.0746 and sell in the interbank market at 1.0751 for a profit of CHF0.0005 per EUR.", "ko": "USD/CHF를 CHF/USD로 뒤집을 때 bid = 1/offer, offer = 1/bid로 자리를 바꿉니다: 0.9564/0.9567. USD/EUR와 곱하면 interbank CHF/EUR = 1.0751/1.0756. 딜러 offer 1.0746에 사서 interbank bid 1.0751에 팔면 CHF 0.0005.", "trap": "뒤집은 뒤 bid/offer를 교환하지 않거나(0.0008), cross 계산에서 bid와 offer를 섞는(0.0007) 실수.", "f": "CHF/USD bid = 1 / (USD/CHF offer), CHF/EUR bid = CHF/USD bid × USD/EUR bid", "why": {"B": "cross rate 계산에서 bid와 offer를 섞은 값입니다(0.9564 × 1.1243 = 1.0753).", "C": "USD/CHF를 뒤집고 bid와 offer 자리를 바꾸지 않아 interbank bid가 1.0754로 잘못 나온 값입니다(bid가 offer보다 높아짐)."}, "orig": "ECO Module 1 Q52"}, {"id": "ECO-M1-Q53", "src": "ECO 오답", "module": 1, "tag": "UIP 성립 시 예상 spot = forward (CAD/NZD)", "vig": 9, "stem": "Using the bid–offer quote midpoint in Exhibit 1 as the current spot rate and assuming uncovered interest rate parity holds, the projected one-year spot rate for the CAD/NZD currency pair is closest to:", "opts": {"A": "0.8308.", "B": "0.8481.", "C": "0.8562."}, "ans": "A", "en": "If UIP holds, the expected spot rate one year forward equals the one-year forward rate: S^e = F = S(f/d) × (1 + i_f)/(1 + i_d). CAD is the price currency and NZD is the base. Midpoint spot = 0.8394. S^e = 0.8394 × (1.0095 / 1.02) = 0.8308.", "ko": "CAD/NZD에서 CAD가 price(분자), NZD가 base(분모)입니다. 중간값 0.8394 × (1 + 0.95%) / (1 + 2.00%) = 0.8308. NZD 금리가 더 높으니 UIP에 따라 NZD가 약해지는 방향(환율 하락)입니다.", "trap": "분자 = price 통화 금리, 분모 = base 통화 금리. 자리를 바꾸면 0.8481.", "f": "S^e(P/B) = S × (1 + i_P) / (1 + i_B)", "why": {"B": "금리 자리를 바꿔 넣은 값입니다: 0.8394 × 1.02 / 1.0095.", "C": "NZD 금리만 곱한 값입니다: 0.8394 × 1.02."}, "orig": "ECO Module 1 Q53"}, {"id": "ECO-M1-Q55", "src": "ECO 오답", "module": 1, "tag": "MTM – EUR 매도 포지션 청산, 6개월 USD 금리 할인", "vig": 9, "stem": "Based on the data in Exhibits 1 and 2, the mark-to-market value for Nexran's forward position related to the oil field construction equipment order is closest to:", "opts": {"A": "USD871,690.", "B": "USD874,000.", "C": "USD877,674."}, "ans": "A", "en": "Nexran sold EUR 20 million forward at 1.1716 (USD/EUR). To mark to market, it buys EUR 20 million six months forward, paying the offer for spot and points: 1.1243 + 0.0036 = 1.1279. Settlement cash flow = 20,000,000 × (1.1716 − 1.1279) = USD874,000 (inflow, because the EUR depreciated). PV at the six-month USD rate: 874,000 / [1 + 0.0053(180/360)] = USD871,690.", "ko": "EUR를 forward로 팔아 둔 포지션 → 청산은 EUR 매수(offer): 1.1243 + 36/10,000 = 1.1279. 20,000,000 × (1.1716 − 1.1279) = 874,000을 USD(price) 6개월 금리로 할인하면 871,690.", "trap": "할인을 빼먹거나(874,000), 청산 거래에 bid를 쓰는(877,674) 실수.", "f": "V = (F0 − Ft) × 20,000,000 / [1 + 0.0053 × 180/360]", "why": {"B": "현재가치로 할인하지 않은 만기 현금흐름입니다.", "C": "청산 거래에 bid(1.1241 + 0.0035 = 1.1276)를 쓴 값입니다. EUR를 사는 거래라 offer를 씁니다."}, "orig": "ECO Module 1 Q55"}, {"id": "ECO-M1-Q58", "src": "ECO 오답", "module": 1, "tag": "Portfolio balance – 장기 확장재정 → 절하", "vig": null, "stem": "A country exhibits high capital mobility and is implementing an excessive expansionary fiscal policy. All else being equal, according to the portfolio balance model, in the long run the currency of the country is most likely to:", "opts": {"A": "depreciate.", "B": "remain stable.", "C": "appreciate."}, "ans": "A", "en": "According to the portfolio balance model, governments that run large budget deficits on a sustained basis could eventually see their currencies decline. The currency may rise when the expansionary policy is first put in place, but as debt rises to levels believed to be unsustainable, markets expect the central bank to monetize the debt, reversing the initial appreciation.", "ko": "확장 재정은 처음에는 금리를 올려 절상시킬 수 있지만, 적자가 계속 쌓이면 투자자가 부채 상환 능력(또는 화폐 발행으로 메울 가능성)을 의심해 통화를 팔기 때문에 장기적으로 절하됩니다.", "trap": "'고이동성 + 확장재정 → 절상'은 단기(Mundell-Fleming) 결론. 장기(portfolio balance)를 물으면 절하.", "f": "장기: 지속적 재정적자 → 부채 ↑ → 화폐화 우려 → 절하", "why": {"B": "portfolio balance 모형은 장기 확장재정이 통화에 영향을 준다고 봅니다. 그대로 유지되지 않습니다.", "C": "절상은 정책 초기(단기)의 반응입니다. 장기에는 절하로 바뀝니다."}, "orig": "ECO Module 1 Q58"}, {"id": "ECO-M1-Q59", "src": "ECO 오답", "module": 1, "tag": "통화위기 취약성 – 자본시장 자유화", "vig": null, "stem": "Which of the following conditions is most likely to increase a country's vulnerability to a currency crisis?", "opts": {"A": "Liberalized capital markets", "B": "A floating exchange rate regime", "C": "Relatively low inflows of foreign capital"}, "ans": "A", "en": "Several studies have identified the liberalization of capital markets as a precursor to a currency crisis. Countries with fixed or partially fixed exchange rates are more susceptible than those with floating rates, and crises are preceded by large (not low) inflows of foreign capital relative to GDP.", "ko": "자본시장을 자유화해 자본이 자유롭게 드나들면, 대규모 유입 뒤 갑작스러운 유출로 위기가 오기 쉽습니다. 변동환율은 오히려 덜 취약하고, 위기 전에는 해외 자본 유입이 '많은' 편입니다.", "trap": "'자유화 = 좋은 것'이라는 직관과 반대. 자본시장 자유화는 위기 전조 목록에 있다.", "f": "위기 전조: 자본시장 자유화, 대규모 자본 유입(특히 외화 단기), 고정환율", "why": {"B": "고정 또는 부분 고정 환율이 더 취약합니다. 변동환율은 위험을 줄입니다.", "C": "위기 전에는 GDP 대비 해외 자본 유입이 '많은' 경향이 있습니다."}, "orig": "ECO Module 1 Q59"}, {"id": "ECO-M1-Q61", "src": "ECO 오답", "module": 1, "tag": "인플레 차이 → 환율 변화율 = Relative PPP", "vig": null, "stem": "Which international parity condition asserts that the percentage change in the spot exchange rate will be determined by the difference between the foreign and domestic inflation rates?", "opts": {"A": "The international Fisher effect", "B": "Relative purchasing power parity", "C": "Absolute purchasing power parity"}, "ans": "B", "en": "According to relative PPP, the percentage change in the spot exchange rate is completely determined by the difference between the foreign and domestic inflation rates. The international Fisher effect states that the nominal yield spread is determined by the expected inflation differential; absolute PPP states that the equilibrium exchange rate level is determined by the ratio of national price levels.", "ko": "환율 '변화율'을 '인플레이션 차이'로 설명하는 것이 상대 PPP입니다. IFE는 '금리 차이 = 기대 인플레 차이', 절대 PPP는 '환율 수준 = 물가 수준의 비율'입니다.", "trap": "변화율(%ΔS) ↔ 인플레 차이 = 상대 PPP / 환율 수준 ↔ 물가 비율 = 절대 PPP / 금리 차 ↔ 인플레 차 = IFE.", "f": "Relative PPP: %ΔS(A/B) = π_A − π_B", "why": {"A": "IFE는 두 나라의 명목금리 차이가 기대 인플레이션 차이와 같다는 조건입니다. 환율 변화를 직접 다루지 않습니다.", "C": "절대 PPP는 환율 '수준'이 두 나라 물가 수준의 비율로 정해진다는 조건입니다. 변화율이 아닙니다."}, "orig": "ECO Module 1 Q61"}, {"id": "ECO-M1-Q63", "src": "ECO 오답", "module": 1, "tag": "통화위기 조기경보 신호 개수 비교", "vig": null, "stem": "Consider the following economic conditions for three countries:\n\tCountry X\tCountry Y\tCountry Z\nQuantity of foreign exchange reserves\tHigh\tLow\tLow\nRatio of exports to imports\tHigh\tHigh\tLow\nBroad money growth\tLow\tLow\tHigh\nAll else being equal, which country is most vulnerable to a currency crisis?", "opts": {"A": "Country X", "B": "Country Y", "C": "Country Z"}, "ans": "C", "en": "Foreign exchange reserves tend to decline precipitously as a crisis approaches, the ratio of exports to imports (terms of trade) often deteriorates before a crisis, and broad money growth and the ratio of M2 to bank reserves tend to rise prior to a crisis. Country Z displays all three warning signs.", "ko": "위기 신호는 외환보유액 낮음, 수출/수입 비율(교역조건) 낮음, 광의통화 증가율 높음입니다. Z는 세 가지 모두, Y는 하나(낮은 보유액), X는 하나도 해당하지 않습니다.", "trap": "수출/수입 비율이 '높은' 것은 좋은 신호. 위기 신호는 교역조건 '악화(낮음)'.", "f": "위기 신호: reserves ↓, exports/imports ↓, broad money growth ↑", "why": {"A": "X는 보유액 많음, 교역조건 좋음, 통화 증가율 낮음으로 위기 신호가 하나도 없습니다.", "B": "Y는 외환보유액이 낮다는 신호 하나만 있습니다. 세 신호가 모두 있는 Z가 더 취약합니다."}, "orig": "ECO Module 1 Q63"}, {"id": "ECO-M1-Q64", "src": "ECO 오답", "module": 1, "tag": "MTM – base 매수 포지션 청산은 bid, 남은 기간 금리", "vig": null, "stem": "An investor purchases 1 million Canadian Dollars (CAD) for delivery against the Euro in nine months at an all-in forward rate of 1.4301 (EUR/CAD). Three months later, the bid-offer quotes for spot and forward points six months prior to the settlement date are as follows:\nSpot (EUR/CAD)\t1.4011 / 1.4202\n6-month points\t46 / 50\n180-day MRR (EUR) annualized\t2.5%\nNote: EUR/CAD is the amount of EUR per 1 CAD.\nIf the investor wants to close out his position today, the mark-to-market value of the original forward contract is closest to:", "opts": {"A": "EUR –24,099.", "B": "EUR –23,805.", "C": "EUR –4,840."}, "ans": "A", "en": "To close the long CAD position, sell CAD (the base currency) using the bid side: 1.4011 + 46/10,000 = 1.4057. EUR cash flow at settlement = (1.4057 − 1.4301) × 1,000,000 = −EUR24,400. Discount for six months: −24,400 / [1 + 0.025(180/360)] = −EUR24,099.", "ko": "CAD를 산 포지션을 청산하려면 CAD를 팔아야 합니다(base 매도 → bid): 1.4011 + 0.0046 = 1.4057. (1.4057 − 1.4301) × 1,000,000 = −24,400을 EUR(price) 6개월 금리로 할인: −24,400 / 1.0125 = −24,099.", "trap": "1년 금리 그대로(÷1.025) 할인하거나, 청산에 offer를 쓰는 실수.", "f": "V = (Ft − F0) × 1,000,000 / [1 + 0.025 × 180/360] (base 매수 포지션 기준)", "why": {"B": "6개월이 아니라 1년 금리 전체(÷1.025)로 할인한 값입니다. 할인율에 180/360을 곱해야 합니다.", "C": "청산 거래에 offer(1.4202 + 0.0050 = 1.4252)를 쓴 값입니다. CAD를 파는 거래이므로 bid를 씁니다."}, "orig": "ECO Module 1 Q64"}, {"id": "ECO-M1-Q65", "src": "ECO 오답", "module": 1, "tag": "Relative PPP – 저인플레 국가 통화 절상", "vig": null, "stem": "According to the relative version of purchasing power parity (PPP), a country that maintains a relatively low inflation level compared to another country will most likely experience:", "opts": {"A": "a depreciation of its currency.", "B": "no change in the value of its currency.", "C": "an appreciation of its currency."}, "ans": "C", "en": "Relative PPP implies that the exchange rate changes to offset changes in competitiveness arising from inflation differentials. The currency of the high-inflation country should depreciate relative to the currency of the low-inflation country; conversely, the low-inflation country's currency will appreciate.", "ko": "인플레이션이 낮으면 통화의 구매력이 잘 유지되므로, 상대 PPP에 따라 인플레이션이 높은 나라의 통화 대비 절상됩니다.", "trap": "UIP(고금리 통화 절하)와 헷갈려 방향을 반대로 고르는 실수. PPP: 저인플레 → 절상.", "f": "%ΔS(A/B) = π_A − π_B → π가 낮은 쪽 통화 절상", "why": {"A": "절하되는 쪽은 인플레이션이 '높은' 나라의 통화입니다.", "B": "상대 PPP에서는 인플레이션 차이만큼 환율이 바뀝니다. 차이가 있는데 가치가 그대로일 수는 없습니다."}, "orig": "ECO Module 1 Q65"}, {"id": "ECO-M1-Q66", "src": "ECO 오답", "module": 1, "tag": "Forward = 미래 spot의 불편 추정치 조건 – CIP와 UIP 둘 다", "vig": null, "stem": "The forward rate is an unbiased predictor of the future spot rate when which of the following conditions holds?", "opts": {"A": "Covered interest rate parity only", "B": "Uncovered interest rate parity only", "C": "Both covered interest rate parity and uncovered interest rate parity"}, "ans": "C", "en": "If both covered and uncovered interest rate parity hold—that is, the nominal yield spread equals both the forward premium (discount) and the expected percentage change in the spot exchange rate—then the forward exchange rate will be an unbiased predictor of the future spot exchange rate.", "ko": "CIP는 '금리 차이 = forward premium', UIP는 '금리 차이 = 예상 spot 변화'입니다. 둘이 같이 성립해야 forward = 예상 미래 spot(forward rate parity)이 됩니다.", "trap": "하나만 성립해서는 forward와 예상 spot을 연결할 수 없다. 둘이 금리 차이를 매개로 이어진다.", "f": "CIP + UIP ⇒ F = E(S1) (forward rate parity)", "why": {"A": "CIP만으로는 forward와 금리 차이의 관계만 알 수 있습니다. 미래 spot과 연결하려면 UIP도 필요합니다.", "B": "UIP만으로는 예상 spot과 금리 차이의 관계만 알 수 있습니다. forward와 연결하려면 CIP도 필요합니다."}, "orig": "ECO Module 1 Q66"}, {"id": "ECO-M1-Q67", "src": "ECO 오답", "module": 1, "tag": "확장재정 → 절상 조건 – 자본이 금리에 매우 민감", "vig": null, "stem": "An expansionary fiscal policy will most likely result in the appreciation of the domestic currency when capital flows are:", "opts": {"A": "immobile.", "B": "insensitive to interest rate differentials.", "C": "highly sensitive to interest rate differentials."}, "ans": "C", "en": "Expansionary fiscal policy typically puts upward pressure on interest rates because larger deficits must be financed. With flexible exchange rates and mobile capital, rising domestic rates attract capital, pushing the currency up. If capital flows are immobile or insensitive to rate differentials, the increase in aggregate demand raises imports and worsens the trade balance, creating downward pressure on the currency.", "ko": "확장 재정 → 국채 발행 → 금리 상승. 자본이 금리 차이에 민감하면 해외 자금이 들어와 절상됩니다. 자본이 움직이지 않으면 수요 증가로 수입만 늘어 무역수지가 나빠져 절하 압력이 생깁니다.", "trap": "같은 확장 재정이라도 자본 이동성이 높으면 절상, 낮으면 절하.", "f": "고이동성: 확장재정 → 금리 ↑ → 자본 유입 → 절상 / 저이동성: 수입 ↑ → 절하", "why": {"A": "자본이 움직이지 않으면 금리 효과가 없고 수입 증가로 무역수지가 악화돼 절하 압력이 생깁니다.", "B": "금리 차이에 둔감한 자본은 움직이지 않는 자본과 같은 결과(절하 압력)입니다."}, "orig": "ECO Module 1 Q67"}, {"id": "ECO-M1-Q68", "src": "ECO 오답", "module": 1, "tag": "자본통제·개입 목적 – 과도한 절상 방지", "vig": null, "stem": "A goal of government intervention and capital controls on inflows from overseas is most likely to:", "opts": {"A": "decrease foreign exchange reserves.", "B": "prevent the currency from depreciating.", "C": "prevent the currency from appreciating too strongly."}, "ans": "C", "en": "Government intervention and capital controls on inflows aim to limit the damage from unrestricted inflows of overseas capital—exchange rate overshooting, asset bubbles, and deteriorating future financial conditions. The key issue is whether they work in preventing currencies from appreciating too strongly. Intervening to weaken a currency involves selling domestic currency and accumulating (not decreasing) FX reserves.", "ko": "해외 자본이 과도하게 들어오면 통화가 지나치게 절상되고 자산 거품이 생깁니다. 유입을 막는 자본통제와 개입의 목적은 이 과도한 절상을 막는 것입니다. 자국 통화를 팔고 외화를 사므로 외환보유액은 오히려 늘어납니다.", "trap": "'유입' 통제 → 절상 방지. 절하 방어(외환보유액 사용)와 방향을 헷갈리지 말 것.", "f": "자본 유입 ↑ → 통화 절상·자산 거품 → 자본통제/개입으로 절상 억제", "why": {"A": "자국 통화 절상을 막으려면 자국 통화를 팔고 외화를 사므로 외환보유액은 늘어납니다.", "B": "유입 통제는 절하가 아니라 과도한 절상을 막기 위한 것입니다."}, "orig": "ECO Module 1 Q68"}, {"id": "ECO-M1-Q70", "src": "ECO 오답", "module": 1, "tag": "UIP – 저금리 통화 절상률 = 금리 차이", "vig": null, "stem": "An analyst gathers the following data for a potential short-term investment:\n\tNew Zealand\tUnited Kingdom\nCurrency\tNew Zealand dollar (NZD)\tGBP\n1-year MRR\t6.25%\t7.50%\nInflation rate (annual)\t4.00%\t6.00%\nOver the next year, if uncovered interest rate parity holds, the NZD is expected to appreciate:", "opts": {"A": "1.25%.", "B": "2.00%.", "C": "2.25%."}, "ans": "A", "en": "If uncovered interest rate parity holds, the expected change in the spot exchange rate over the investment horizon is reflected in the interest rate differential: 7.50% − 6.25% = 1.25%. The lower-yielding NZD is expected to appreciate by 1.25%.", "ko": "UIP는 '금리' 차이를 씁니다. 금리가 낮은 NZD가 GBP 대비 7.50% − 6.25% = 1.25% 절상될 것으로 예상됩니다. 인플레이션 자료는 함정입니다.", "trap": "UIP = 명목금리 차이, PPP = 인플레이션 차이. 표에 둘 다 있으면 무엇을 묻는지 확인.", "f": "UIP: %ΔS^e ≈ i_f − i_d (저금리 통화 절상)", "why": {"B": "인플레이션 차이(6.00% − 4.00%)입니다. PPP나 IFE에서 쓰는 값이지 UIP가 아닙니다.", "C": "NZD의 금리에서 인플레이션을 뺀 실질금리(6.25% − 4.00%)입니다."}, "orig": "ECO Module 1 Q70"}, {"id": "ECO-M1-Q72", "src": "ECO 오답", "module": 1, "tag": "MTM – base 매수 포지션 청산(bid), price 통화 금리 할인", "vig": null, "stem": "An investor bought 1 million Singapore Dollars (SGD) at an all-in forward price of 1.1465 AUD/SGD (1.1465 Australian Dollars (AUD) per 1 SGD). Three months prior to the settlement date, the investor wants to mark-to-market this forward position. The investor has the following information:\nSpot rate (AUD/SGD)\t1.1483/1.1484\n3-month points\t25/30\n3-month MRR (AUD) annualized\t4.50%\n3-month MRR (SGD) annualized\t3.50%\nThe mark-to-mark value of the forward position three months prior to settlement date is closest to:", "opts": {"A": "AUD 4,252.", "B": "AUD 4,300.", "C": "AUD 4,845."}, "ans": "A", "en": "The investor bought SGD 1 million forward at 1.1465. To offset, sell a three-month forward at the bid: 1.1483 + 25/10,000 = 1.1508. Settlement cash flow = (1.1508 − 1.1465) × 1,000,000 = AUD 4,300. Discount for three months at the AUD MRR: 4,300 / [1 + 0.045(90/360)] = AUD 4,252.", "ko": "SGD를 산 포지션 → 청산은 SGD 매도(bid): 1.1483 + 0.0025 = 1.1508. (1.1508 − 1.1465) × 1,000,000 = 4,300을 AUD(price 통화) 3개월 금리 4.5%로 할인하면 4,252. SGD 금리(3.5%)는 쓰지 않습니다.", "trap": "할인율은 price 통화(AUD) 금리. 주어진 base 통화 금리는 함정.", "f": "V = (Ft − F0) × 1,000,000 / [1 + i_AUD × 90/360]", "why": {"B": "현재가치로 할인하지 않은 값입니다.", "C": "청산에 offer(1.1483 + 0.0030 = 1.1514)를 쓴 값입니다. SGD를 파는 거래라 bid를 씁니다."}, "orig": "ECO Module 1 Q72"}, {"id": "ECO-M1-Q74", "src": "ECO 오답", "module": 1, "tag": "적자국 통화 절하 → 수입물가(자국통화) ↑", "vig": null, "stem": "All else being equal, a depreciation of the currency in a country with a current account deficit will most likely lead to an increase in:", "opts": {"A": "export prices in foreign currency terms.", "B": "export prices in domestic currency terms.", "C": "import prices in domestic currency terms."}, "ans": "C", "en": "A depreciation of a deficit country's currency should result in an increase in import prices in domestic currency terms and a decrease in export prices in foreign currency terms.", "ko": "자국 통화가 약해지면 같은 수입품을 사는 데 자국 통화가 더 많이 들어 수입물가(자국통화 기준)가 오릅니다. 반대로 수출품은 외국 통화 기준으로 싸집니다. 그래서 적자가 줄어드는 방향입니다.", "trap": "'어느 통화 기준'인지가 핵심. 수입 → 자국 통화 기준 ↑, 수출 → 외국 통화 기준 ↓.", "f": "절하 → 수입가격(자국통화) ↑, 수출가격(외국통화) ↓ → 경상수지 개선", "why": {"A": "절하되면 수출품 가격은 외국 통화 기준으로 '내려갑니다'.", "B": "절하의 핵심 효과는 외국 통화 기준 수출가격 하락과 자국 통화 기준 수입가격 상승입니다. 자국 통화 기준 수출가격 상승이 아닙니다."}, "orig": "ECO Module 1 Q74"}, {"id": "ECO-M1-Q77", "src": "ECO 오답", "module": 1, "tag": "Forward rate parity 조건 – CIP와 UIP 모두", "vig": null, "stem": "The forward exchange rate is an unbiased predictor of the future spot exchange rate if:", "opts": {"A": "only covered interest rate parity holds.", "B": "only uncovered interest rate parity holds.", "C": "both covered and uncovered interest rate parity hold."}, "ans": "C", "en": "If both covered and uncovered interest rate parity hold—that is, the nominal yield spread equals both the forward premium (or discount) and the expected percentage change in the spot exchange rate—then the forward exchange rate will be an unbiased predictor of the future spot exchange rate.", "ko": "forward와 예상 미래 spot은 금리 차이를 통해서만 이어집니다. CIP(forward ↔ 금리 차)와 UIP(예상 spot ↔ 금리 차)가 모두 성립해야 forward = 예상 spot입니다.", "trap": "'only'가 붙은 보기는 둘 중 하나만 성립하는 경우라 불충분.", "f": "CIP + UIP ⇒ F = E(S_T)", "why": {"A": "CIP만으로는 forward와 금리 차의 관계만 정해집니다. 미래 spot과 연결하려면 UIP가 필요합니다.", "B": "UIP만으로는 예상 spot과 금리 차의 관계만 정해집니다. forward와 연결하려면 CIP가 필요합니다."}, "orig": "ECO Module 1 Q77"}, {"id": "ECO-M1-Q83", "src": "ECO 오답", "module": 1, "tag": "모든 parity 성립 → 실질금리 차이 = 0", "vig": null, "stem": "If all international parity conditions hold, the foreign minus domestic real yield would:", "opts": {"A": "equal zero.", "B": "be positive when the domestic currency appreciates.", "C": "be negative when the domestic inflation rate increases."}, "ans": "A", "en": "If all the key international parity conditions held, the expected percentage change in the spot rate would equal the forward premium or discount, the nominal yield spread, and the expected inflation differential. It would be impossible to earn consistent profits on currency movements, and the real yield spread would equal zero regardless of expected changes in the spot exchange rate.", "ko": "모든 parity가 성립하면 명목금리 차이 = 기대 인플레이션 차이가 되므로 실질금리는 나라마다 같아집니다(실질금리 차이 = 0). 환율이나 인플레이션이 어떻게 변해도 이 결론은 같습니다.", "trap": "환율·인플레 변화에 따라 실질금리 차이가 달라진다는 보기는 모두 함정. '모든 parity 성립'이면 항상 0.", "f": "모든 parity 성립 ⇒ r_foreign = r_domestic", "why": {"B": "모든 parity가 성립하면 환율 변화와 관계없이 실질금리 차이는 0입니다.", "C": "인플레이션이 올라도 명목금리가 같이 올라 실질금리 차이는 0으로 유지됩니다."}, "orig": "ECO Module 1 Q83"}, {"id": "ECO-M1-Q86", "src": "ECO 오답", "module": 1, "tag": "Push factor = 선진국 투자자 기반", "vig": null, "stem": "Push factors driving foreign capital inflows most likely arise from:", "opts": {"A": "domestic policies only.", "B": "the investor base in industrial countries.", "C": "both domestic policies and the investor base in industrial countries."}, "ans": "B", "en": "Push factors driving foreign capital inflows arise from the primary sources of internationally mobile capital, notably the investor base in industrial countries. Pull factors are favorable domestic developments (price stability, a flexible exchange rate regime, improved fiscal position, privatization) that make a country attractive.", "ko": "push factor는 돈이 '나오는' 쪽, 즉 분산투자와 높은 수익을 찾는 선진국 투자자에게서 생깁니다. 자금을 받는 나라의 국내 정책(물가 안정, 유연한 환율, 재정 개선, 민영화)은 pull factor입니다.", "trap": "push = 자금을 내보내는 쪽(선진국), pull = 끌어당기는 쪽(신흥국 국내 정책).", "f": "Push: 선진국 투자자의 수익·분산 추구 / Pull: 받는 나라의 정책·여건", "why": {"A": "국내 정책은 자본을 끌어당기는 pull factor입니다.", "C": "국내 정책은 pull factor이므로 push factor에 포함되지 않습니다."}, "orig": "ECO Module 1 Q86"}, {"id": "ECO-M1-Q88", "src": "ECO 오답", "module": 1, "tag": "International Fisher effect – 명목금리 차 = 기대 인플레 차", "vig": null, "stem": "According to the international Fisher effect, the difference in nominal yield spreads between domestic and foreign markets will equal:", "opts": {"A": "the change in spot rate over the investment horizon.", "B": "the sum of their respective real interest rates and expected inflation rates.", "C": "the expected inflation differential between the domestic and foreign markets."}, "ans": "C", "en": "Assuming the Fisher effect holds in all markets (nominal rate = real rate + expected inflation) and real interest rates are the same across markets (real interest rate parity), the nominal yield spread between domestic and foreign markets equals the domestic–foreign expected inflation differential. This is the international Fisher effect.", "ko": "Fisher 관계(명목 = 실질 + 기대 인플레)와 실질금리 평형을 합치면, 두 나라 명목금리 차이 = 기대 인플레이션 차이가 됩니다. 이것이 IFE입니다.", "trap": "UIP(금리 차 = 예상 환율 변화)와 국내 Fisher(명목 = 실질 + 인플레)를 IFE와 헷갈리기 쉽다.", "f": "IFE: i_A − i_B = E(π_A) − E(π_B)", "why": {"A": "금리 차이와 예상 환율 변화의 관계는 UIP입니다.", "B": "한 나라 안에서 명목금리 = 실질금리 + 기대 인플레이션은 (국내) Fisher 효과입니다. 두 나라 금리 차이에 관한 IFE가 아닙니다."}, "orig": "ECO Module 1 Q88"}, {"id": "VAR-M1-01", "src": "변형", "module": 1, "tag": "Forward points로 all-in forward – 같은 쪽끼리, 음수면 빼기", "vig": null, "stem": "A dealer quotes USD/EUR spot at 1.1050/1.1054 and 90-day forward points of –12.5/–11.8. A client wants to buy EUR 90 days forward. The all-in forward rate the client will pay is closest to:", "opts": {"A": "1.10422.", "B": "1.10658.", "C": "1.10375."}, "ans": "A", "en": "The client buys the base currency (EUR), so it pays the offer for both the spot rate and the forward points: 1.1054 + (–11.8/10,000) = 1.1054 − 0.00118 = 1.10422.", "ko": "EUR(base)를 사므로 offer끼리 씁니다: spot offer 1.1054에 offer 쪽 points −11.8을 더합니다(음수라 빼짐). 1.1054 − 0.00118 = 1.10422. points가 음수면 EUR가 forward discount입니다.", "trap": "points 부호를 무시하고 더하거나(1.10658), bid 쪽 숫자를 쓰는(1.10375) 실수.", "f": "Forward = Spot + Points/10,000 (bid는 bid끼리, offer는 offer끼리)", "why": {"B": "음수 points를 양수처럼 더한 값입니다(1.1054 + 0.00118).", "C": "bid 쪽(1.1050 − 0.00125)으로 계산한 값입니다. EUR를 사는 고객은 offer를 냅니다."}, "orig": "변형 (오답노트 R5 Forward Rate = Spot + Forward Points, Schweser LOS 5.c)"}, {"id": "VAR-M1-02", "src": "변형", "module": 1, "tag": "F < S → base 통화 금리가 더 높음", "vig": null, "stem": "Spot JPY/USD is 150.00 and the one-year forward JPY/USD is 146.25. If covered interest rate parity holds, it is most likely that the one-year:", "opts": {"A": "USD MRR is higher than the JPY MRR.", "B": "JPY MRR is higher than the USD MRR.", "C": "USD and JPY MRRs are equal."}, "ans": "A", "en": "Under covered interest rate parity, F/S = (1 + i_JPY)/(1 + i_USD) for a JPY/USD (price/base) quote. Because F < S, (1 + i_JPY) < (1 + i_USD), so the USD (base) rate is higher and the USD trades at a forward discount.", "ko": "JPY/USD에서 JPY가 price, USD가 base입니다. F/S = (1 + i_JPY)/(1 + i_USD)이고 F(146.25) < S(150.00)이므로 i_USD > i_JPY입니다. 금리가 높은 USD가 forward discount입니다.", "trap": "'forward가 낮다 → 그 통화가 약하다 → 금리도 낮다'로 거꾸로 추론하는 실수. 금리가 높은 통화가 forward discount.", "f": "F > S ⇔ i_price > i_base, F < S ⇔ i_base > i_price", "why": {"B": "JPY 금리가 더 높다면 F > S(USD forward premium)여야 합니다.", "C": "두 금리가 같으면 F = S여야 합니다."}, "orig": "변형 (오답노트 R5 F>S ⇒ r_price > r_base, Schweser LOS 5.e)"}, {"id": "VAR-M1-03", "src": "변형", "module": 1, "tag": "CIP로 다른 나라 금리 역산 – 기간 조정 포함", "vig": null, "stem": "The USD/EUR spot rate is 1.1000 and the 180-day forward rate is 1.1050. The 180-day USD MRR is 3.00% (annualized, Actual/360). If covered interest rate parity holds, the implied 180-day EUR MRR (annualized) is closest to:", "opts": {"A": "2.08%.", "B": "3.92%.", "C": "2.53%."}, "ans": "A", "en": "Covered interest rate parity: F = S × [1 + i_USD(180/360)] / [1 + i_EUR(180/360)]. So 1 + i_EUR(0.5) = (1.015) × (1.1000/1.1050) = 1.01041, giving i_EUR(0.5) = 1.041% and i_EUR ≈ 2.08% annualized.", "ko": "USD/EUR에서 USD가 price(분자), EUR가 base(분모)입니다. 1 + i_EUR × 0.5 = (1 + 3% × 0.5) × S/F = 1.015 × 1.1/1.105 = 1.01041 → i_EUR ≈ 2.08%. F > S(EUR premium)이므로 EUR 금리가 USD보다 낮아야 맞습니다.", "trap": "① 분자·분모 자리 ② 180/360 기간 조정 – 하나만 틀려도 3.92%나 2.53%.", "f": "1 + i_B(t) = [1 + i_P(t)] × S / F", "why": {"B": "S/F를 F/S로 뒤집어 계산한 값입니다(1.015 × 1.105/1.1). EUR가 forward premium인데 EUR 금리가 더 높게 나오면 모순입니다.", "C": "180/360 기간 조정 없이 1년 금리 그대로(1.03 × 1.1/1.105) 계산한 값입니다."}, "orig": "변형 (오답노트 R5 Forward rate 주어지고 다른 나라 금리 계산 → CIP, Schweser LOS 5.e)"}, {"id": "VAR-M1-04", "src": "변형", "module": 1, "tag": "기대 인플레로 미래 spot 예측 → ex-ante PPP", "vig": null, "stem": "An analyst has the current spot rate and expected inflation forecasts for two countries, but no interest rate or forward rate data. To forecast the spot rate one year ahead, the parity condition the analyst would most likely use is:", "opts": {"A": "uncovered interest rate parity.", "B": "the ex-ante version of relative PPP.", "C": "covered interest rate parity."}, "ans": "B", "en": "The ex-ante version of PPP is the same as relative PPP except that it uses expected inflation instead of actual inflation: the expected change in the spot rate equals the expected inflation differential. UIP and CIP both require interest rate data.", "ko": "인플레이션 차이로 환율 변화를 설명하는 것이 PPP이고, 기대 인플레이션을 쓰면 ex-ante PPP입니다. UIP와 CIP는 금리가 있어야 쓸 수 있습니다.", "trap": "'인플레이션 → PPP, 금리 → UIP/CIP'. 어떤 자료가 주어졌는지 먼저 본다.", "f": "Ex-ante PPP: E(%ΔS(A/B)) = E(π_A) − E(π_B)", "why": {"A": "UIP는 두 나라 금리 차이로 예상 환율 변화를 구합니다. 금리 자료가 없습니다.", "C": "CIP는 spot과 두 나라 금리로 forward 환율을 구하는 조건입니다. 금리 자료가 없고, 미래 spot 예측 식도 아닙니다."}, "orig": "변형 (오답노트 R5 Inflation 차이로 환율 설명 → PPP, Schweser LOS 5.e)"}, {"id": "VAR-M1-05", "src": "변형", "module": 1, "tag": "Carry trade 초과수익 조건 – 고금리 통화가 금리차보다 덜 절하", "vig": null, "stem": "An investor borrows in a low-yield currency and invests in a high-yield currency without hedging. The investor is most likely to earn an excess return if, over the investment horizon, the high-yield currency:", "opts": {"A": "depreciates by exactly the interest rate differential.", "B": "depreciates by less than the interest rate differential.", "C": "trades at a forward discount, as covered interest rate parity implies."}, "ans": "B", "en": "Uncovered interest rate parity implies the high-yield currency should depreciate by the interest rate differential, leaving no excess return. The carry trade is a bet against UIP: if the high-yield currency depreciates by less than the differential (or appreciates), the investor earns an excess return.", "ko": "UIP대로 고금리 통화가 금리 차이만큼 정확히 절하되면 이자 이익이 환손실로 상쇄되어 초과수익이 0입니다. 금리 차이보다 덜 절하되거나 오히려 절상될 때 carry trade가 이익을 냅니다.", "trap": "carry trade = UIP가 성립하지 않는 쪽에 거는 전략. '정확히 금리 차만큼 절하'는 UIP가 성립하는 경우.", "f": "Carry 수익 ≈ (i_high − i_low) − (고금리 통화 절하율)", "why": {"A": "금리 차이만큼 정확히 절하되면 UIP가 성립해 초과수익이 없습니다.", "C": "고금리 통화가 forward discount인 것은 CIP상 항상 그렇습니다. 헤지하지 않은 carry trade의 수익은 forward가 아니라 실제 미래 spot에 달려 있습니다."}, "orig": "변형 (오답노트 R5 Carry trade는 UIP가 단기·중기에 성립하지 않는 것을 전제, Schweser LOS 5.i)"}, {"id": "VAR-M1-06", "src": "변형", "module": 1, "tag": "Carry trade 수익률 계산 – 차입비용 차감", "vig": null, "stem": "An investor borrows USD for one year at 1.00% and invests the proceeds in a one-year MXN deposit at 9.00%. The spot rate today is MXN/USD 18.00, and the investor expects MXN/USD to be 18.36 in one year. The expected all-in return on the carry trade, measured in USD, is closest to:", "opts": {"A": "5.86%.", "B": "6.86%.", "C": "8.00%."}, "ans": "A", "en": "USD 1 buys MXN 18.00, which grows to 18.00 × 1.09 = MXN 19.62. Converted back at 18.36: 19.62 / 18.36 = USD 1.06863. Subtract the borrowing cost: 1.06863 − 1.0100 = 0.0586 = 5.86%.", "ko": "USD 1 → MXN 18.00 → 1년 뒤 18 × 1.09 = 19.62 → 18.36으로 되바꾸면 USD 1.06863. 여기서 USD 차입 원리금 1.01을 빼면 5.86%. MXN이 약 2% 절하되어 금리 차이(8%) 중 일부가 사라졌습니다.", "trap": "차입 이자를 빼지 않으면 6.86%, 환율 변화를 무시하면 8.00%.", "f": "Carry 수익 = (1/S0) × (1 + i_invest) × S1 − (1 + i_fund)  (S = 투자 통화 1단위당 USD)", "why": {"B": "USD 차입 이자(1%)를 빼지 않은 값입니다: 1.06863 − 1.", "C": "환율 변화를 무시하고 금리 차이(9% − 1%)만 계산한 값입니다."}, "orig": "변형 (오답노트 R5 Carry trade 수익 – borrowing cost 차감, Schweser LOS 5.i)"}, {"id": "VAR-M1-07", "src": "변형", "module": 1, "tag": "MTM – base 매도 포지션, offer로 청산, USD 금리로 할인", "vig": null, "stem": "Six months ago, a US firm sold GBP 2,000,000 forward (nine-month contract) at an all-in rate of 1.2650 USD/GBP. Three months now remain to settlement. Current quotes:\nSpot (USD/GBP)\t1.2580/1.2584\n3-month points\t–8.0/–7.5\n3-month MRR (USD), annualized\t4.00%\n3-month MRR (GBP), annualized\t5.00%\nThe mark-to-market value of the forward position is closest to:", "opts": {"A": "USD 14,554.", "B": "USD 15,446.", "C": "USD 14,519."}, "ans": "A", "en": "To close the short GBP position, buy GBP three months forward at the offer: 1.2584 − 0.00075 = 1.25765. Settlement cash flow = 2,000,000 × (1.2650 − 1.25765) = USD 14,700 (a gain, because the GBP fell). Discount at the USD (price currency) rate: 14,700 / [1 + 0.04(90/360)] = USD 14,554.", "ko": "GBP를 판 포지션 → 청산은 GBP 매수(offer): 1.2584 + (−7.5/10,000) = 1.25765. 2,000,000 × (1.2650 − 1.25765) = 14,700(이익). USD(price) 3개월 금리로 할인: 14,700 / 1.01 = 14,554.", "trap": "할인 금리는 price 통화(USD). GBP 금리가 같이 주어져도 쓰지 않는다. 청산 방향(offer)도 확인.", "f": "V = (F0 − Ft) × 계약규모 / [1 + i_price × 남은 일수/360]", "why": {"B": "청산에 bid(1.2580 − 0.0008 = 1.2572)를 쓴 값입니다. GBP를 사는 거래이므로 offer를 씁니다.", "C": "GBP 금리(5%)로 할인한 값입니다. 현금흐름이 USD이므로 USD(price 통화) 금리로 할인합니다."}, "orig": "변형 (오답노트 R5 Mark-to-market – 반대 거래, price 통화 금리 할인, Schweser LOS 5.d)"}, {"id": "VAR-M1-08", "src": "변형", "module": 1, "tag": "저이동성 + 확장재정 → 수입 증가 → 절하", "vig": null, "stem": "An emerging market country with low capital mobility and a floating exchange rate adopts an expansionary fiscal policy while keeping monetary policy unchanged. According to the Mundell–Fleming model, the domestic currency will most likely:", "opts": {"A": "appreciate, because higher interest rates attract foreign capital.", "B": "depreciate, because higher aggregate demand raises net imports.", "C": "remain unchanged, because capital cannot cross borders."}, "ans": "B", "en": "With low capital mobility, the impact of trade imbalances on exchange rates (goods flow effect) is greater than the impact of interest rates (financial flows effect). Expansionary fiscal policy increases aggregate demand and net imports, leading to depreciation of the domestic currency.", "ko": "자본 이동성이 낮으면 금리가 올라도 해외 자본이 거의 들어오지 못합니다. 대신 재정 확장으로 수요가 늘어 수입이 증가하고, 무역수지가 나빠져 통화가 절하됩니다.", "trap": "'확장재정 → 금리 ↑ → 절상'은 자본 이동성이 높을 때만. 저이동성이면 무역 경로가 지배.", "f": "저이동성: 확장(재정·통화) → 순수입 ↑ → 절하 / 고이동성: 확장재정 → 절상", "why": {"A": "자본 이동성이 높을 때의 결과입니다. 저이동성에서는 금리 상승이 자본 유입으로 이어지지 않습니다.", "C": "자본이 움직이지 않아도 수출입(상품 흐름)을 통해 환율이 움직입니다."}, "orig": "변형 (오답노트 R5 자본 이동 민감도별 Expansionary Fiscal Policy 결과, Schweser LOS 5.k)"}, {"id": "VAR-M1-09", "src": "변형", "module": 1, "tag": "Pull factor = 자금을 받는 나라의 국내 정책", "vig": null, "stem": "Which of the following is most likely a pull factor for foreign capital flowing into an emerging market economy?", "opts": {"A": "Low interest rates in developed economies", "B": "Global investors' search for portfolio diversification", "C": "Privatization of state-owned enterprises in the emerging market"}, "ans": "C", "en": "Pull factors are favorable developments that make a country an attractive destination for foreign capital, such as relative price stability, a flexible exchange rate regime, an improved fiscal position, and privatization of state-owned enterprises. Push factors are driven by mobile international capital in industrial countries seeking high returns and diversification.", "ko": "pull factor는 자금을 '받는' 나라의 좋은 변화입니다(물가 안정, 유연한 환율, 재정 개선, 국영기업 민영화). 선진국의 저금리나 분산투자 수요는 자금을 '내보내는' push factor입니다.", "trap": "push = 보내는 쪽 사정(선진국 투자자), pull = 받는 쪽 사정(신흥국 정책).", "f": "Pull: 물가 안정, 유연한 환율, 재정 개선, 민영화 / Push: 선진국 투자자의 수익·분산 추구", "why": {"A": "선진국 저금리는 투자자가 더 높은 수익을 찾아 돈을 내보내게 만드는 push factor입니다.", "B": "분산투자 수요는 선진국 투자자 쪽 사정이므로 push factor입니다."}, "orig": "변형 (오답노트 R5 Push vs Pull factors, Schweser LOS 5.l)"}, {"id": "VAR-M1-10", "src": "변형", "module": 1, "tag": "물가 수준 비율 → 환율 수준 = 절대 PPP", "vig": null, "stem": "An analyst states: \"A representative basket of goods costs EUR 100 in the eurozone and USD 120 in the United States, so the equilibrium exchange rate should be USD 1.20 per EUR.\" The analyst is applying:", "opts": {"A": "absolute purchasing power parity.", "B": "relative purchasing power parity.", "C": "the international Fisher effect."}, "ans": "A", "en": "Absolute PPP states that the equilibrium exchange rate is determined by the ratio of national price levels: S(USD/EUR) = P_US / P_EUR = 120/100 = 1.20. Relative PPP relates the percentage change in the exchange rate to the inflation differential; the international Fisher effect relates nominal interest rate differentials to expected inflation differentials.", "ko": "환율 '수준'을 두 나라 물가 수준의 비율(120/100)로 구했으므로 절대 PPP입니다. 상대 PPP는 환율 '변화율'과 인플레이션 차이, IFE는 금리 차이와 기대 인플레이션 차이의 관계입니다.", "trap": "수준(level) → 절대 PPP, 변화율(%) → 상대 PPP.", "f": "Absolute PPP: S(A/B) = P_A / P_B", "why": {"B": "상대 PPP는 인플레이션 차이로 환율의 '변화율'을 설명합니다. 여기서는 물가 '수준'으로 환율 수준을 구했습니다.", "C": "IFE는 명목금리 차이와 기대 인플레이션 차이의 관계로, 환율 수준을 정하지 않습니다."}, "orig": "변형 (오답노트 R5 IFE·Relative PPP·Absolute PPP 비교표, Schweser LOS 5.e)"}, {"id": "VAR-M1-11", "src": "변형", "module": 1, "tag": "Base 통화를 팔 때 → bid로 곱함", "vig": null, "stem": "A dealer quotes JPY/USD at 149.80/149.85. A US company wants to convert USD 2,000,000 into JPY. The amount of JPY it will receive is closest to:", "opts": {"A": "JPY 299,600,000.", "B": "JPY 299,650,000.", "C": "JPY 299,700,000."}, "ans": "A", "en": "In the JPY/USD quote, USD is the base currency. The company sells USD (base) and buys JPY (price), so it receives the dealer's bid: USD 2,000,000 × 149.80 = JPY 299,600,000.", "ko": "JPY/USD에서 USD가 base입니다. USD를 팔고 JPY(price)를 사는 것은 base 매도이므로 bid(149.80)를 쓰고, 'up the quote'라 곱합니다. 2,000,000 × 149.80 = JPY 299,600,000.", "trap": "price 통화를 사는 것 = base 통화를 파는 것 → bid. 고객에게 불리한 쪽(적게 받는 쪽)이 적용된다.", "f": "Base 매도 → bid × 금액 / Base 매수 → 금액 ÷ offer", "why": {"B": "중간값(149.825)을 쓴 값입니다. 실제 거래는 bid나 offer로 체결됩니다.", "C": "offer(149.85)를 쓴 값입니다. USD(base)를 파는 고객은 딜러의 bid를 받습니다."}, "orig": "변형 (오답노트 R5 Base를 살 때 offer, Price를 살 때 = Base를 파는 것 → bid, Schweser LOS 5.a)"}, {"id": "VAR-M1-12", "src": "변형", "module": 1, "tag": "통화위기 신호가 아닌 것 – 통화가치 역사적 평균 아래", "vig": null, "stem": "Which of the following is least likely to be a warning sign of an approaching currency crisis?", "opts": {"A": "A rising ratio of M2 to bank reserves", "B": "Deteriorating terms of trade", "C": "A currency value well below its historical mean"}, "ans": "C", "en": "Warning signs in the period leading up to a currency crisis include deteriorating terms of trade, fixed or partially fixed exchange rates, a dramatic decline in official FX reserves, a currency value that has risen above its historical mean, rising inflation, liberalized capital markets, a rising money supply relative to bank reserves, and banking crises.", "ko": "위기 전에는 통화가 역사적 평균보다 '높게'(고평가) 형성되는 경향이 있습니다. 평균보다 낮은 통화가치는 위기 신호가 아닙니다. M2/지준 상승과 교역조건 악화는 위기 신호입니다.", "trap": "위기 전 통화는 '고평가' 상태. 이미 싸진 통화는 신호가 아니다.", "f": "위기 신호: 교역조건 ↓, 고정환율, 외환보유액 급감, 통화가치 > 평균, 인플레 ↑, 자본시장 자유화, M2/지준 ↑, 은행위기", "why": {"A": "M2(통화량)가 은행 지급준비금보다 빠르게 늘어나는 것은 위기 신호입니다.", "B": "수출/수입 비율(교역조건) 악화는 위기 신호입니다."}, "orig": "변형 (오답노트 R5 Currency crisis approaching – M2 ↑, FX reserves ↓, Schweser LOS 5.m)"}, {"id": "VAR-M1-13", "src": "변형", "module": 1, "tag": "자본 유입 증가 → 통화 수요 증가 → 절상", "vig": null, "stem": "All else equal, a sharp increase in capital inflows into a country with a floating exchange rate will most likely cause its currency to:", "opts": {"A": "appreciate.", "B": "depreciate.", "C": "remain unchanged, because capital flows affect only the financial account."}, "ans": "A", "en": "As capital flows into a country, demand for that country's currency increases, resulting in appreciation. Capital flows tend to be the dominant factor influencing exchange rates in the short term because they are larger and more rapidly changing than goods flows.", "ko": "해외 자본이 들어오려면 그 나라 통화로 바꿔야 하므로 통화 수요가 늘어 절상됩니다. 단기에는 상품 흐름보다 자본 흐름이 환율에 더 큰 영향을 줍니다.", "trap": "자본 유입이 과도하면 '과도한 절상'이 문제가 되고, 그래서 자본통제가 등장한다.", "f": "Capital inflows ↑ ⇒ 자국 통화 수요 ↑ ⇒ 절상", "why": {"B": "자본 유입은 자국 통화 수요를 늘리므로 절하가 아니라 절상 요인입니다.", "C": "변동환율에서는 자본 흐름이 통화 수요를 바꾸므로 환율이 움직입니다."}, "orig": "변형 (오답노트 R5 Capital inflows ↑ ⇒ Currency appreciation, Schweser LOS 5.j)"}, {"id": "VAR-M1-14", "src": "변형", "module": 1, "tag": "CIP 위반 시 차익거래 방향 – 시장 forward가 높으면 forward 매도", "vig": null, "stem": "The USD/EUR spot rate is 1.1000. One-year interest rates are 5% in the United States and 3% in the eurozone. A dealer quotes the one-year USD/EUR forward rate at 1.1300. A covered interest arbitrage would most likely involve:", "opts": {"A": "buying EUR spot and selling EUR forward.", "B": "selling EUR spot and buying EUR forward.", "C": "no trade, because no arbitrage opportunity exists."}, "ans": "A", "en": "Covered interest rate parity requires F = 1.1000 × (1.05/1.03) = 1.1214. The market forward (1.1300) is too high, so sell EUR in the forward market and buy EUR in the spot market: borrow USD, buy EUR spot, invest at 3%, and sell the EUR proceeds forward at 1.1300.", "ko": "CIP가 요구하는 forward는 1.1 × 1.05/1.03 = 1.1214입니다. 시장 forward 1.1300은 EUR가 비싸게 매겨진 것이므로, forward에서 EUR를 팔고 spot에서 EUR를 삽니다(USD 차입 → spot EUR 매수 → EUR 예금 → forward로 EUR 매도).", "trap": "비싸게 매겨진 쪽(시장 forward)에서 팔고, 싼 쪽(spot)에서 산다.", "f": "F_CIP = S × (1 + i_P)/(1 + i_B); 시장 F > F_CIP → base를 forward 매도, spot 매수", "why": {"B": "반대 방향입니다. forward에서 EUR를 사면 비싸게 매겨진 가격에 사는 것이 됩니다.", "C": "시장 forward(1.1300)가 CIP 가격(1.1214)과 달라 차익 기회가 있습니다."}, "orig": "변형 (오답노트 R5 시장 forward가 CIP 값보다 높으면 forward 매도·spot 매수, Schweser LOS 5.e)"}, {"id": "VAR-M1-15", "src": "변형", "module": 1, "tag": "UIP – 고금리 통화 절하, 저금리 통화 절상", "vig": null, "stem": "The spot rate is ZAR/USD 18.00. One-year interest rates are 8% in South Africa and 4% in the United States. If uncovered interest rate parity holds, over the next year the USD is expected to:", "opts": {"A": "appreciate by approximately 4% against the ZAR.", "B": "depreciate by approximately 4% against the ZAR.", "C": "remain unchanged against the ZAR."}, "ans": "A", "en": "Under uncovered interest rate parity, for an A/B quote the base currency B is expected to appreciate by approximately R_A − R_B. Here, the USD (base) is expected to appreciate by about 8% − 4% = 4% against the ZAR, offsetting the higher ZAR yield.", "ko": "UIP에서는 금리가 높은 통화가 금리 차이만큼 절하됩니다. ZAR 금리가 4%p 높으므로 ZAR가 약 4% 약해지고, 반대로 USD는 약 4% 절상됩니다(ZAR/USD 상승).", "trap": "Mundell-Fleming(고금리 → 절상)과 혼동하는 함정. UIP에서는 고금리 통화가 절하.", "f": "UIP: E(%ΔS(A/B)) ≈ R_A − R_B", "why": {"B": "방향이 반대입니다. UIP에서 절하되는 것은 고금리 통화(ZAR)입니다.", "C": "UIP는 금리 차이만큼 환율이 변한다고 봅니다. 금리 차이가 있으면 환율도 변합니다."}, "orig": "변형 (오답노트 R5 Future spot forecast → UIP, Schweser LOS 5.e)"}, {"id": "ECO-M2-Q2", "src": "ECO 오답", "module": 2, "tag": "Capital deepening 기여 = 노동생산성 성장 − TFP 성장", "vig": 10, "stem": "Based on Exhibit 1, capital deepening as a source of growth was most important for:", "opts": {"A": "Country A.", "B": "Country B.", "C": "Country C."}, "ans": "A", "en": "The effect of pure capital deepening is measured as the difference between the growth rates of labor productivity and total factor productivity; the larger the difference, the more important capital deepening is. Country A: 2.4% − 0.6% = 1.8%; Country B: 1.6% − 0.8% = 0.8%; Country C: 0.8% − (−0.3%) = 1.1%.", "ko": "노동생산성 성장 = TFP 기여 + capital deepening 기여이므로, capital deepening = 노동생산성 − TFP입니다. A 1.8%, B 0.8%, C 1.1%로 A가 가장 큽니다.", "trap": "GDP 성장률이나 근로시간이 아니라 '노동생산성 − TFP'를 비교. TFP가 음수면 빼면서 더해진다(C: 0.8 + 0.3).", "f": "Capital deepening = 노동생산성 성장률 − TFP 성장률", "why": {"B": "B는 1.6% − 0.8% = 0.8%로 세 나라 중 가장 작습니다.", "C": "C는 0.8% − (−0.3%) = 1.1%로 A(1.8%)보다 작습니다."}, "orig": "ECO Module 2 Q2"}, {"id": "ECO-M2-Q3", "src": "ECO 오답", "module": 2, "tag": "장기 주가 상승의 결정 요인 = GDP 성장", "vig": 10, "stem": "Based on Statement 1, over the requested forecast horizon, the factor that will most likely drive stock market performance is the percentage change in:", "opts": {"A": "GDP.", "B": "the earnings to GDP ratio.", "C": "the price-to-earnings ratio."}, "ans": "A", "en": "In the long run, the GDP growth rate is the most important driver of stock market performance. The ratio of earnings to GDP cannot increase indefinitely (profits would absorb all of GDP) or shrink forever, so its growth rate must be approximately zero over long horizons. Similarly, the P/E ratio cannot grow or contract at a finite rate forever.", "ko": "이익/GDP 비율과 P/E는 끝없이 오르거나 내릴 수 없어서 장기 변화율이 0에 가깝습니다. 그래서 장기 주가 상승은 결국 GDP 성장률이 좌우합니다.", "trap": "단기에는 세 요인이 모두 중요하지만, '장기'를 물으면 GDP 하나.", "f": "장기: %ΔP ≈ %ΔGDP (이익/GDP, P/E 변화율 ≈ 0)", "why": {"B": "이익/GDP 비율은 무한히 커질 수 없으므로 장기 변화율이 0에 가깝습니다.", "C": "P/E도 계속 오르거나 내릴 수 없으므로 장기 변화율이 0에 가깝습니다."}, "orig": "ECO Module 2 Q3"}, {"id": "ECO-M2-Q8", "src": "ECO 오답", "module": 2, "tag": "인구 증가는 1인당 GDP 성장을 높이지 못함", "vig": 10, "stem": "Based on Statement 4, the higher rate of per capita income growth in Country A is least likely explained by the:", "opts": {"A": "rate of investment.", "B": "growth of its population.", "C": "application of information technology."}, "ans": "B", "en": "Population growth can increase the growth rate of the overall economy but does not affect the rate of increase in per capita GDP. Therefore, population growth does not explain Country A's higher per capita income growth. An increase in labor force participation, however, could raise the growth rate of per capita GDP.", "ko": "인구가 늘면 전체 GDP는 커지지만 사람 수도 같이 늘어 1인당 GDP 성장률은 높아지지 않습니다. 투자(capital deepening)와 IT 활용(TFP)은 생산성을 높여 1인당 소득을 키웁니다.", "trap": "전체 GDP 성장 요인과 1인당 GDP 성장 요인을 구분. 노동 '양'의 증가는 전체만, 생산성 증가는 1인당까지.", "f": "1인당 성장 ← 생산성(투자·TFP·IT·노동참가율) / 인구 증가 → 전체 GDP만 ↑", "why": {"A": "높은 투자율은 근로자 1인당 자본을 늘려(capital deepening) 1인당 소득 성장에 기여합니다.", "C": "IT 활용은 TFP와 생산성을 높여 1인당 소득 성장에 기여합니다."}, "orig": "ECO Module 2 Q8"}, {"id": "ECO-M2-Q9", "src": "ECO 오답", "module": 2, "tag": "제도 개혁해야 수렴 → Club convergence", "vig": 10, "stem": "The type of convergence described by Klymchuk in Statement 5 is best described as:", "opts": {"A": "club convergence.", "B": "absolute convergence.", "C": "conditional convergence."}, "ans": "A", "en": "Under club convergence, lower-income members of the club converge to the income levels of the richest countries, and countries can join the club by making appropriate institutional changes. Countries outside the club continue to fall behind.", "ko": "'제도를 바꿔야만 부자 나라 수준으로 수렴한다'는 것이 club convergence입니다. 제도 개혁으로 클럽에 들어간 가난한 나라는 빠르게 따라잡고, 클럽 밖의 나라는 계속 뒤처집니다.", "trap": "absolute = 모든 나라가 수렴, conditional = 저축률·인구증가율·생산함수가 같은 나라끼리 수렴, club = 제도 개혁으로 클럽에 들어가야 수렴.", "f": "Club convergence: 비슷한 제도(저축·금융시장·재산권·교육)를 갖춘 클럽 안에서 수렴", "why": {"B": "absolute convergence는 특성과 관계없이 모든 개발도상국이 선진국 수준으로 수렴한다는 가설입니다. 바로 부하 직원의 주장이고, Klymchuk은 이를 반박했습니다.", "C": "conditional convergence는 저축률·인구증가율·생산함수가 같은 나라끼리 수렴한다는 가설입니다. '제도 개혁'이 조건이 아닙니다."}, "orig": "ECO Module 2 Q9"}, {"id": "ECO-M2-Q37", "src": "ECO 오답", "module": 2, "tag": "Classical vs Endogenous – steady state·체감은 neoclassical 개념", "vig": 11, "stem": "N'Diarra's understanding of the two growth theories is most accurate with regard to:", "opts": {"A": "classical growth theory.", "B": "endogenous growth theory.", "C": "both classical growth theory and endogenous growth theory."}, "ans": "A", "en": "N'Diarra's understanding of classical growth theory is correct: growth in real GDP per person is temporary because of a population explosion. Her description of endogenous growth theory is not accurate: she references a steady state rate of growth and diminishing marginal returns, which are tenets of neoclassical growth theory.", "ko": "고전학파 설명(1인당 소득 증가 → 인구 폭발 → 생계 수준으로 회귀)은 맞습니다. 하지만 내생적 성장이론에는 steady state도, 자본의 수확 체감도 없습니다. 그녀가 말한 '성장률이 steady state에 이를 때까지 오르다가 결국 수확 체감'은 신고전학파 이론입니다.", "trap": "'steady state', '수확 체감'이 나오면 neoclassical. 내생적 성장 = 자본 수익 일정, 투자·R&D로 성장률을 영구적으로 높임.", "f": "Endogenous: 수확 체감 없음, steady state 없음, 저축·R&D ↑ → 성장률 영구 ↑", "why": {"B": "내생적 성장이론 설명에 steady state와 수확 체감을 넣었는데, 이는 신고전학파의 개념이라 틀렸습니다.", "C": "고전학파 설명은 맞지만 내생적 성장이론 설명이 틀렸으므로 둘 다 맞다고 할 수 없습니다."}, "orig": "ECO Module 2 Q37"}, {"id": "ECO-M2-Q39", "src": "ECO 오답", "module": 2, "tag": "신고전학파 – 무역장벽 제거 시 수렴 가속", "vig": null, "stem": "According to the neoclassical growth model, when trade barriers are removed, convergence of per capita income levels between developed and developing countries should:", "opts": {"A": "occur more slowly.", "B": "remain unaffected.", "C": "occur more quickly."}, "ans": "C", "en": "According to the neoclassical model, convergence should occur more quickly if economies are open and there is free trade and international borrowing and lending. Opening up the economy increases the rate at which capital-to-labor ratios converge: capital inflows make the physical capital stock in developing countries grow more rapidly, raising productivity growth so per capita incomes converge.", "ko": "무역과 자본 이동이 자유로우면 아직 수확 체감이 덜한 개발도상국으로 해외 자본이 들어와 자본/노동 비율이 빠르게 올라갑니다. 그래서 신고전학파 모형에서는 수렴이 더 빨라집니다.", "trap": "개방 → 자본 유입 → capital deepening 가속 → 수렴 가속.", "f": "Neoclassical + open economy: 자본 유입 → K/L ↑ → 1인당 소득 수렴 가속", "why": {"A": "개방하면 자본 유입으로 개발도상국의 자본 축적이 빨라져 수렴이 오히려 빨라집니다.", "B": "무역·자본 개방은 자본/노동 비율이 수렴하는 속도를 바꿉니다."}, "orig": "ECO Module 2 Q39"}, {"id": "ECO-M2-Q44", "src": "ECO 오답", "module": 2, "tag": "Grinold–Kroner – 경제성장이 주식수익률로 가는 주 경로 = EPS 성장", "vig": null, "stem": "Based on the Grinold–Kroner model, which of the following factors is the primary channel through which economic growth can impact equity returns?", "opts": {"A": "Dividend yield", "B": "Earnings growth per share", "C": "Expected repricing term of the market's P/E ratio"}, "ans": "B", "en": "Earnings growth per share is the primary channel through which economic growth can impact equity returns. The dividend yield has

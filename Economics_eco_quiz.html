 been fairly stable over time, and the repricing term mainly reflects volatility in the market's P/E ratio over market cycles; it cannot continue to grow in the long run.", "ko": "E(R) = 배당수익률 + 실질 EPS 성장 + 인플레이션 − 주식 수 변화 + P/E 변화입니다. 배당수익률은 안정적이고 P/E 변화는 경기 따라 출렁일 뿐 장기적으로 계속 커질 수 없습니다. 경제성장은 EPS 성장을 통해 수익률로 이어집니다.", "trap": "P/E는 경기 좋을 때 오르지만 그건 '변동'이지 지속적인 경로가 아니다.", "f": "E(R) = DY + ΔEPS_R + π − ΔS + ΔP/E", "why": {"A": "배당수익률은 오랜 기간 꽤 안정적이라 경제성장을 반영하는 주된 경로가 아닙니다.", "C": "P/E 재평가는 경기 순환에 따른 변동을 주로 반영하고, 장기적으로 계속 커질 수 없습니다."}, "orig": "ECO Module 2 Q44"}, {"id": "ECO-M2-Q47", "src": "ECO 오답", "module": 2, "tag": "Solow growth accounting – α = 1 − 노동 몫", "vig": null, "stem": "An analyst gathers the following information about a country's economy:\nAnnual growth in capital\t3.25%\nAnnual growth in labor\t–1.70%\nAnnual growth in total factor productivity\t1.25%\nLabor share of output\t53.00%\nBased on the growth accounting equation, the potential annual GDP growth of the economy is closest to:", "opts": {"A": "1.88%.", "B": "2.17%.", "C": "2.80%."}, "ans": "A", "en": "Growth in potential GDP = ΔA/A + αΔK/K + (1 − α)ΔL/L, where α = capital share = 1 − labor share = 47%. = 1.25% + 0.47 × 3.25% + 0.53 × (−1.70%) = 1.8765% ≈ 1.88%.", "ko": "α는 '자본' 몫입니다. 노동 몫이 53%로 주어졌으니 α = 47%. 1.25% + 0.47 × 3.25% + 0.53 × (−1.70%) = 1.88%.", "trap": "표에 노동 몫만 주어지면 α = 1 − 노동 몫. α를 노동 몫으로 착각해 자리를 바꾸면 2.17%.", "f": "ΔY/Y = ΔT/T + α(ΔK/K) + (1 − α)(ΔL/L)", "why": {"B": "α와 (1 − α)를 바꿔 넣은 값입니다: 1.25% + 0.53 × 3.25% + 0.47 × (−1.70%).", "C": "자본·노동 몫(가중치) 없이 단순히 더한 값입니다: 1.25% + 3.25% − 1.70%."}, "orig": "ECO Module 2 Q47"}, {"id": "ECO-M2-Q51", "src": "ECO 오답", "module": 2, "tag": "기술 진보 → 인구 증가 가정 = Classical", "vig": null, "stem": "Which of the following growth theories assumes that technological progress translates into higher population growth?", "opts": {"A": "Classical model", "B": "Neoclassical model", "C": "Endogenous growth model"}, "ans": "A", "en": "The key assumption of the classical model is that population growth accelerates when per capita income rises above the subsistence level. Technological progress and land expansion, which increase labor productivity, therefore translate into higher population growth, and per capita income eventually returns to subsistence. In the neoclassical and endogenous models, labor (population) is an input independent of technological progress.", "ko": "고전학파(맬서스)는 기술 진보로 1인당 소득이 생계 수준을 넘으면 인구가 폭발해 다시 생계 수준으로 돌아간다고 봅니다. 신고전학파와 내생적 성장 모형에서는 인구(노동)와 기술이 서로 독립된 투입 요소입니다.", "trap": "'인구 폭발', '생계 수준(subsistence)' → classical.", "f": "Classical: 기술 진보 → 1인당 소득 ↑ → 인구 ↑ → 생계 수준으로 회귀", "why": {"B": "신고전학파에서 인구 증가(L)와 기술(A)은 서로 독립된 요소입니다. Y = A·K^α·L^(1−α).", "C": "내생적 성장 모형에서도 기술 진보와 인구 증가는 별개의 요소입니다."}, "orig": "ECO Module 2 Q51"}, {"id": "ECO-M2-Q54", "src": "ECO 오답", "module": 2, "tag": "Growth accounting에서 외생 변수 = TFP(기술 변화)", "vig": null, "stem": "Which of the following is treated as exogenous in the GDP growth accounting equation?", "opts": {"A": "Growth rate of labor", "B": "Growth rate of capital", "C": "Rate of technological change"}, "ans": "C", "en": "The rate of technological change (TFP) is not directly measured and must be estimated. The standard methodology treats TFP growth as exogenous and estimates it using time-series models (or as a residual), unlike the growth of capital and labor, which are measured inputs.", "ko": "자본과 노동 증가율은 측정할 수 있는 투입 요소입니다. 기술 변화(TFP)는 직접 측정할 수 없어 모형 밖(외생)에서 주어진 것으로 보고, 실제 성장에서 투입 기여를 뺀 잔차 등으로 추정합니다.", "trap": "TFP = 직접 관측 불가 → 잔차로 추정, 외생 변수로 취급.", "f": "TFP 성장 = 실제 GDP 성장 − α(ΔK/K) − (1 − α)(ΔL/L) (잔차)", "why": {"A": "노동 증가율은 측정 가능한 투입 요소입니다. 외생으로 다루는 것은 TFP입니다.", "B": "자본 증가율도 측정 가능한 투입 요소입니다."}, "orig": "ECO Module 2 Q54"}, {"id": "ECO-M2-Q60", "src": "ECO 오답", "module": 2, "tag": "Dutch disease – 통화 절상 → 제조업 경쟁력 상실", "vig": null, "stem": "A country depending on strong demand for export of its natural resources may find its economic growth limited over time due to:", "opts": {"A": "a limited supply of labor.", "B": "rapid currency depreciation.", "C": "an inability to compete globally in manufacturing."}, "ans": "C", "en": "Resource-rich countries may suffer the Dutch disease: global demand for the country's natural resources drives up the value of its currency, making its manufactured goods more expensive and other segments of the economy, particularly manufacturing, globally uncompetitive.", "ko": "자원 수출 수요가 강하면 자원 대금 때문에 통화가 절상됩니다. 그러면 다른 수출품(특히 제조업 제품)이 해외에서 비싸져 경쟁력을 잃습니다. 이것이 Dutch disease입니다.", "trap": "자원 붐 → 통화 '절상'(절하 아님) → 제조업 몰락.", "f": "Resource boom → currency appreciation → manufacturing uncompetitive", "why": {"A": "성장을 제한하는 것은 노동 공급이 아니라 통화 절상으로 인한 제조업 경쟁력 상실입니다.", "B": "자원 수출 수요가 강하면 통화는 절하가 아니라 절상됩니다."}, "orig": "ECO Module 2 Q60"}, {"id": "ECO-M2-Q61", "src": "ECO 오답", "module": 2, "tag": "자원은 소유가 아니라 접근(무역)만 있으면 됨", "vig": null, "stem": "With respect to natural resources, which of the following is most likely necessary for a country to achieve economic growth?", "opts": {"A": "Access to energy resources", "B": "Ownership of energy resources", "C": "The ability to refine energy resources domestically"}, "ans": "A", "en": "Access to natural resources (e.g., via trade) is important, but ownership and production are not necessary for a high level of income. Energy is a vital input, so access to energy resources is critical; countries that are not self-sufficient acquire what they need through trade. Natural resources are important but not necessary for growth.", "ko": "에너지는 꼭 필요한 투입 요소지만 직접 소유하거나 정제할 필요는 없고, 무역으로 구할 수 있으면 됩니다. 일본처럼 자원이 적어도 높은 소득을 이룬 나라가 그 예입니다.", "trap": "'소유(ownership)'와 '접근(access)'을 구분. Schweser: access does not require ownership.", "f": "성장에 필요한 것: 자원 접근(무역 포함) ≠ 자원 소유", "why": {"B": "소유는 필요하지 않습니다. 무역으로 에너지를 얻을 수 있습니다.", "C": "국내 정제 능력도 필요하지 않습니다. 정제된 에너지를 무역으로 들여올 수 있습니다."}, "orig": "ECO Module 2 Q61"}, {"id": "ECO-M2-Q64", "src": "ECO 오답", "module": 2, "tag": "R&D 지원의 근거 – 외부효과 교정, 장기 성장", "vig": null, "stem": "The economic rationale for government incentives encouraging private production of knowledge capital is most likely to:", "opts": {"A": "reduce the need for labor.", "B": "encourage long run economic growth.", "C": "promote convergence of developing and developed economies."}, "ans": "B", "en": "Because R&D spending creates positive externalities, private firms underinvest from an economy-wide viewpoint. Government spending on R&D or tax breaks and subsidies for private production of knowledge capital correct this market failure. Higher spending on knowledge capital could translate into faster economic growth even in the long run.", "ko": "R&D는 투자한 기업 밖으로도 이익(외부효과)이 퍼지기 때문에 기업이 사회 전체로 보면 적게 투자합니다. 정부가 보조금·세제 혜택으로 이를 바로잡으면 내생적 성장이론에 따라 장기 성장률이 높아질 수 있습니다.", "trap": "내생적 성장이론에서는 선진국도 지식자본 투자로 계속 빠르게 성장할 수 있어 '수렴'을 보장하지 않는다.", "f": "R&D 외부효과 → 민간 과소투자 → 정부 인센티브 → 장기 성장률 ↑", "why": {"A": "R&D 인센티브의 목적은 노동을 줄이는 것이 아니라 과소투자를 바로잡아 장기 성장을 높이는 것입니다.", "C": "내생적 성장 모형에서는 지식자본 투자의 수익이 체감하지 않아 선진국이 개발도상국만큼, 또는 더 빠르게 계속 성장할 수 있습니다. 수렴을 촉진한다는 근거가 아닙니다."}, "orig": "ECO Module 2 Q64"}, {"id": "ECO-M2-Q65", "src": "ECO 오답", "module": 2, "tag": "K/L 가장 낮은 나라가 capital deepening 효과 최대", "vig": null, "stem": "An analyst gathers the following economic data about three countries:\n\tSize of Workforce\tTotal Capital\nCountry 1\t18 million\t$1,240 billion\nCountry 2\t37 million\t$1,600 billion\nCountry 3\t15 million\t$560 billion\nAll else being equal, which country would most likely experience the greatest increase in per capita economic growth as a result of capital deepening?", "opts": {"A": "Country 1", "B": "Country 2", "C": "Country 3"}, "ans": "C", "en": "Capital per worker = total capital / workforce: Country 1 = $68,889; Country 2 = $43,243; Country 3 = $37,333. Because the marginal product of capital declines as more capital is added, the country with the lowest capital-to-labor ratio (Country 3) benefits most from capital deepening.", "ko": "근로자 1인당 자본(K/L)을 구하면 1번 68,889달러, 2번 43,243달러, 3번 37,333달러입니다. 자본은 수확 체감이라 K/L이 낮을수록 자본을 늘렸을 때 생산성이 더 크게 오르므로 3번입니다.", "trap": "총자본이 적다고 바로 고르지 말고 반드시 근로자 수로 나눠 비교.", "f": "K/L = 총자본 / 노동력 → 가장 낮은 나라의 MPK가 가장 큼", "why": {"A": "1번은 1인당 자본이 68,889달러로 가장 높아 추가 자본의 효과가 가장 작습니다.", "B": "2번은 43,243달러로 3번(37,333달러)보다 1인당 자본이 많아 효과가 더 작습니다."}, "orig": "ECO Module 2 Q65"}, {"id": "ECO-M2-Q66", "src": "ECO 오답", "module": 2, "tag": "TFP = 노동생산성 성장 − capital deepening", "vig": null, "stem": "An analyst gathers the following historical 10-year growth rates for three countries:\n\tLabor Productivity\tCapital Deepening\nCountry 1\t2.9%\t1.1%\nCountry 2\t3.4%\t2.5%\nCountry 3\t5.6%\t4.8%\nBased only on this information, the country that benefited most from technological investments over the 10-year period is:", "opts": {"A": "Country 1.", "B": "Country 2.", "C": "Country 3."}, "ans": "A", "en": "Capital Deepening = Labor Productivity Growth − TFP Growth, so TFP Growth = Labor Productivity Growth − Capital Deepening. Country 1: 2.9% − 1.1% = 1.8%; Country 2: 3.4% − 2.5% = 0.9%; Country 3: 5.6% − 4.8% = 0.8%. Country 1 had the highest TFP growth.", "ko": "기술 투자의 효과는 TFP로 봅니다. TFP = 노동생산성 − capital deepening: 1번 1.8%, 2번 0.9%, 3번 0.8%. 노동생산성 성장률이 가장 높은 3번은 대부분 자본 투입 덕분입니다.", "trap": "노동생산성 성장률이 가장 높은 나라를 고르는 함정. 기술(TFP) 몫만 떼어 봐야 한다.", "f": "TFP 성장 = 노동생산성 성장 − capital deepening", "why": {"B": "2번의 TFP는 3.4% − 2.5% = 0.9%로 1번(1.8%)보다 작습니다.", "C": "3번은 노동생산성은 가장 높지만 대부분 capital deepening이고 TFP는 0.8%로 가장 작습니다."}, "orig": "ECO Module 2 Q66"}, {"id": "ECO-M2-Q68", "src": "ECO 오답", "module": 2, "tag": "성장 제약 요인 – 창업 억제 세제는 개도국에 더 흔함", "vig": null, "stem": "Which of the following statements regarding factors of economic growth is most accurate?", "opts": {"A": "Developing countries would not benefit from removing restrictions on foreign direct and indirect investment", "B": "Tax policies discouraging entrepreneurship tend to be more prevalent in developing countries compared to developed countries", "C": "Incremental spending on primary and secondary education has a significant impact on innovation and growth in developed countries"}, "ans": "B", "en": "The lack of appropriate institutions and poor legal and political environments restrain growth in developing economies. Tax and regulatory policies discouraging entrepreneurship are not absent in developed countries but tend to be more prevalent in developing countries. Developing countries would benefit from removing restrictions on foreign investment, and developed countries need post-secondary (not primary/secondary) education spending to encourage innovation.", "ko": "창업을 막는 세제·규제는 선진국에도 있지만 개발도상국에서 더 흔하고, 이것이 성장을 막는 요인입니다. 개발도상국은 해외 투자 제한을 없애면 이익이고, 선진국은 초·중등이 아니라 대학 이상 교육 투자가 혁신에 중요합니다.", "trap": "교육 효과: 선진국 → 고등교육(혁신), 개도국 → 초·중등교육(기술 적용).", "f": "성장 우호: 낮은 세금·규제, 자유무역·자본이동, 재산권, 인적자본", "why": {"A": "개발도상국은 해외 직접·간접투자 제한을 없애면 부족한 국내 저축을 해외 자본으로 메울 수 있어 이익입니다.", "C": "선진국은 기술의 최전선에 있어 혁신을 위해 대학 이상 교육에 투자해야 합니다. 초·중등교육 추가 지출의 효과는 작습니다."}, "orig": "ECO Module 2 Q68"}, {"id": "VAR-M2-01", "src": "변형", "module": 2, "tag": "노동생산성 growth accounting – α(ΔK/K − ΔL/L)", "vig": null, "stem": "An economy has the following long-term data:\nTFP growth\t1.0%\nGrowth in capital\t4.0%\nGrowth in labor\t1.0%\nLabor share of output\t70%\nBased on the Cobb–Douglas production function, the growth rate of labor productivity (output per worker) is closest to:", "opts": {"A": "1.9%.", "B": "3.1%.", "C": "2.2%."}, "ans": "A", "en": "Output per worker = T(K/L)^α, so labor productivity growth = ΔT/T + α(ΔK/K − ΔL/L). With α = 1 − 0.70 = 0.30: 1.0% + 0.30 × (4.0% − 1.0%) = 1.9%. Capital deepening contributes 0.9% and TFP 1.0%.", "ko": "Y/L = T(K/L)^α에서 노동생산성 성장 = TFP + α × (자본 증가율 − 노동 증가율)입니다. α = 1 − 70% = 0.3이므로 1.0% + 0.3 × 3.0% = 1.9%. 이 중 0.9%가 capital deepening, 1.0%가 TFP입니다.", "trap": "① α는 자본 몫(1 − 노동 몫) ② 1인당 자본 증가율은 ΔK/K − ΔL/L. 하나만 틀려도 오답.", "f": "Δ(Y/L)/(Y/L) = ΔT/T + α(ΔK/K − ΔL/L)", "why": {"B": "α 자리에 노동 몫(0.7)을 넣은 값입니다: 1.0% + 0.7 × 3.0%.", "C": "노동 증가율을 빼지 않고 자본 증가율 전체를 쓴 값입니다: 1.0% + 0.3 × 4.0%."}, "orig": "변형 (오답노트 R6 Labor productivity growth accounting, Schweser LOS 6.d)"}, {"id": "VAR-M2-02", "src": "변형", "module": 2, "tag": "잠재 GDP 성장 ↑ → 실질금리 ↑", "vig": null, "stem": "All else equal, an increase in an economy's expected potential GDP growth rate will most likely lead to:", "opts": {"A": "lower real interest rates, because higher growth reduces credit risk.", "B": "higher real interest rates, because consumers save less in anticipation of higher future income.", "C": "no change in real interest rates, because potential GDP affects only inflation."}, "ans": "B", "en": "Positive growth in potential GDP indicates that future income will rise. When consumers expect their incomes to rise, they increase current consumption and save less. To encourage saving, investments must offer a higher real rate of return. Therefore, higher potential GDP growth implies higher real interest rates and higher real asset returns.", "ko": "잠재 성장률이 높아지면 사람들이 미래 소득이 늘 것으로 보고 지금 더 쓰고 덜 저축합니다. 저축을 끌어내려면 더 높은 실질 수익률을 줘야 하므로 실질금리가 오릅니다.", "trap": "'성장 ↑ → 신용위험 ↓'는 맞는 말이지만 실질금리를 묻는 질문의 답은 '저축 ↓ → 실질금리 ↑'.", "f": "Potential GDP growth ↑ → 기대 소득 ↑ → 저축 ↓ → real interest rate ↑", "why": {"A": "높은 잠재 성장률이 신용위험을 낮추는 것은 맞지만, 실질금리 자체는 저축 감소 때문에 오릅니다.", "C": "잠재 GDP 성장은 소비·저축 결정을 바꿔 실질금리에 영향을 줍니다."}, "orig": "변형 (오답노트 R6 Potential GDP growth ↑ → Real interest rate ↑, Schweser LOS 6.c)"}, {"id": "VAR-M2-03", "src": "변형", "module": 2, "tag": "GDP 성장 vs 주식수익률 차이 – dilution(순발행)", "vig": null, "stem": "Over the past 30 years, Country P's real GDP grew at 3.0% per year, while real earnings per share of its listed companies grew at only 1.5% per year. Dividend yields and P/E ratios were roughly stable. The gap is most likely explained by:", "opts": {"A": "net issuance of new shares and the growing role of privately held firms.", "B": "large net share buybacks by listed companies.", "C": "a rising share of corporate earnings in GDP."}, "ans": "A", "en": "In the Grinold–Kroner model, EPS growth = real EPS growth + inflation − change in shares outstanding (ΔS). The dilution effect ΔS = net buybacks (net issuance) + relative dynamism (rd), where relative dynamism captures the difference between overall economic growth and the earnings growth of listed companies. Net new issuance and growth coming from privately held firms reduce listed EPS growth relative to GDP growth.", "ko": "경제가 성장해도 상장사가 신주를 계속 발행하거나, 성장의 상당 부분이 비상장 중소기업에서 나오면(relative dynamism) 상장사 주당이익은 GDP보다 느리게 늡니다. 자사주 매입은 반대로 주당이익을 높이고, 이익/GDP 비율 상승도 주당이익 성장을 GDP보다 빠르게 만듭니다.", "trap": "자사주 매입은 주식 수를 줄여 EPS 성장 ↑. EPS가 GDP보다 '느린' 이유는 순발행(희석).", "f": "E(R) = DY + ΔEPS_R + π − ΔS + ΔP/E, ΔS = nbb + rd", "why": {"B": "대규모 자사주 매입은 주식 수를 줄여 주당이익 성장을 GDP보다 '빠르게' 만듭니다.", "C": "이익이 GDP에서 차지하는 비중이 커지면 이익이 GDP보다 빠르게 늘어나므로 반대 방향입니다."}, "orig": "변형 (오답노트 R6 Economic growth → Equity returns 차이 = 주식 수 변화(dilution), Schweser LOS 6.b)"}, {"id": "VAR-M2-04", "src": "변형", "module": 2, "tag": "저축률 ↑ → 성장률 영구 ↑ = 내생적 성장이론", "vig": null, "stem": "Which growth theory implies that an increase in the saving rate will permanently increase the rate of economic growth?", "opts": {"A": "Neoclassical growth theory", "B": "Endogenous growth theory", "C": "Classical growth theory"}, "ans": "B", "en": "Endogenous growth theory holds that returns to capital are constant rather than diminishing, because investment (including R&D) raises total factor productivity with spillovers to the whole economy. Unlike the neoclassical model, an increase in savings permanently increases the growth rate. In the neoclassical model, higher savings only temporarily raise growth.", "ko": "내생적 성장이론은 자본 수익이 체감하지 않는다고 봅니다(투자·R&D가 TFP를 높이고 외부효과를 냄). 그래서 저축이 늘면 성장률이 영구적으로 올라갑니다. 신고전학파에서는 저축 증가가 성장률을 일시적으로만 높입니다.", "trap": "신고전학파: 저축 ↑ → 성장률 일시 ↑, 수준만 ↑ / 내생적: 성장률 영구 ↑.", "f": "Endogenous: 자본 수익 일정 → 저축·투자 ↑ ⇒ 성장률 영구 ↑", "why": {"A": "신고전학파에서는 자본 수확 체감 때문에 저축 증가가 성장률을 일시적으로만 높이고, 장기 성장률은 기술 진보로만 결정됩니다.", "C": "고전학파에서는 1인당 소득 증가가 인구 폭발로 사라져 장기적으로 1인당 성장이 없습니다."}, "orig": "변형 (오답노트 R6 Neoclassical vs Endogenous, Schweser LOS 6.i)"}, {"id": "VAR-M2-05", "src": "변형", "module": 2, "tag": "인구 증가는 1인당 성장 ↑ 못 함, 노동참가율은 가능", "vig": null, "stem": "Which of the following is least likely to raise the growth rate of per capita GDP?", "opts": {"A": "A rise in labor force participation", "B": "Faster population growth, with labor force participation and productivity unchanged", "C": "Faster growth in total factor productivity"}, "ans": "B", "en": "An increase in the quantity of labor will increase output, but not per capita output. Population growth with unchanged participation and productivity raises total GDP but not GDP per capita. A rise in labor force participation (a larger share of the population working) and faster TFP growth can raise per capita GDP growth.", "ko": "인구가 늘어도 일하는 비율과 생산성이 그대로면 전체 GDP와 인구가 같이 늘어 1인당 GDP는 그대로입니다. 노동참가율이 오르면 인구 중 일하는 사람 비율이 커져 1인당 GDP가 오르고, TFP 성장도 1인당 GDP를 높입니다.", "trap": "'노동 증가 = 1인당 성장'이라고 묶어 생각하는 실수. 인구(양) 증가와 참가율(비율) 상승은 다르다.", "f": "1인당 GDP 성장 ← 노동참가율 ↑, 생산성(TFP·capital deepening) ↑ / 인구 ↑ → 전체 GDP만 ↑", "why": {"A": "노동참가율이 오르면 같은 인구 중 일하는 사람이 많아져 1인당 GDP가 오를 수 있습니다.", "C": "TFP 성장은 같은 투입으로 더 많이 생산하게 해 1인당 GDP 성장을 직접 높입니다."}, "orig": "변형 (오답노트 R6 population growth는 per capita GDP growth를 높이지 않음, Schweser LOS 6.g)"}, {"id": "VAR-M2-06", "src": "변형", "module": 2, "tag": "선진국이 기술 진보에 의존하는 이유 – 높은 K/L, 수확 체감", "vig": null, "stem": "Developed countries tend to rely mainly on technological progress rather than capital deepening to raise labor productivity, most likely because:", "opts": {"A": "their high capital-to-labor ratios mean additional capital adds little output per worker.", "B": "their share of output paid to capital (α) is higher than in developing countries.", "C": "capital deepening shifts the productivity curve upward only in developing countries."}, "ans": "A", "en": "Because α is less than one, additional capital has a diminishing effect on productivity. Developed countries have a relatively high capital per worker ratio and a lower α, so they gain little from capital deepening and must rely on technological progress. Capital deepening is a movement along the productivity curve; technological progress shifts the curve upward.", "ko": "자본은 수확 체감이라 1인당 자본이 이미 많은 선진국은 자본을 더 넣어도 생산성이 별로 늘지 않습니다. 그래서 생산성 곡선 자체를 위로 올리는 기술 진보에 의존합니다. 선진국의 α는 오히려 더 낮습니다.", "trap": "capital deepening = 곡선 '위의 이동', 기술 진보 = 곡선 '자체의 이동'.", "f": "Y/L = T(K/L)^α, α < 1 → K/L 높을수록 MPK ↓", "why": {"B": "선진국은 개발도상국보다 α가 '낮아' capital deepening 효과가 더 작습니다.", "C": "capital deepening은 어느 나라든 생산성 곡선 '위를 따라 이동'하는 것이고, 곡선을 위로 올리는 것은 기술 진보입니다."}, "orig": "변형 (오답노트 R6 K/L 낮을수록 capital deepening 효과 큼(MPK 체감), Schweser LOS 6.d)"}, {"id": "VAR-M2-07", "src": "변형", "module": 2, "tag": "Solow 잔차로 TFP 성장 구하기", "vig": null, "stem": "An economist gathers the following data for a country:\nReal GDP growth\t3.0%\nGrowth in capital\t4.0%\nGrowth in labor\t1.0%\nLabor share of total factor cost\t60%\nUsing the growth accounting equation, the implied growth rate of total factor productivity is closest to:", "opts": {"A": "0.8%.", "B": "0.2%.", "C": "–2.0%."}, "ans": "A", "en": "ΔY/Y = ΔT/T + αΔK/K + (1 − α)ΔL/L, with α = 1 − 0.60 = 0.40. So ΔT/T = 3.0% − 0.40 × 4.0% − 0.60 × 1.0% = 3.0% − 1.6% − 0.6% = 0.8%. TFP growth is estimated as the residual.", "ko": "α = 1 − 노동 몫 60% = 0.4. TFP 성장 = GDP 성장 − 0.4 × 자본 증가율 − 0.6 × 노동 증가율 = 3.0 − 1.6 − 0.6 = 0.8%. TFP는 이렇게 잔차로 구합니다.", "trap": "노동 몫이 주어지면 α = 1 − 노동 몫. 자리를 바꾸면 0.2%.", "f": "ΔT/T = ΔY/Y − α(ΔK/K) − (1 − α)(ΔL/L)", "why": {"B": "α와 (1 − α)를 바꿔 넣은 값입니다: 3.0 − 0.6 × 4.0 − 0.4 × 1.0.", "C": "가중치 없이 자본·노동 증가율을 그대로 뺀 값입니다: 3.0 − 4.0 − 1.0."}, "orig": "변형 (오답노트 R6 Solow growth accounting, α 없으면 1에서 빼기, Schweser LOS 6.e)"}], "vignettes": ["Ed Smith is a new trainee in the foreign exchange (FX) services department of a major global bank. Smith's focus is to assist senior FX trader Feliz Mehmet, CFA.\nMehmet asks Smith to assist with a trade involving a US multinational customer operating in Europe and Japan. The customer is a very cost-conscious industrial company with an AA credit rating and strives to execute its currency trades at the most favorable bid–offer spread. Because its Japanese subsidiary is about to close on a major European acquisition in three business days, the client wants to lock in a trade involving the Japanese yen and the euro as early as possible the next morning, preferably by 8:05 a.m. New York time.", "Anna Goldsworthy is the chief financial officer of a manufacturing firm headquartered in the United Kingdom. She is responsible for overseeing exposure to price risk in both the commodity and currency markets. Her intern, Scott Underwood, assists her.\nThe firm hedges input costs using forward contracts that are priced in US dollars (USD) and Mexican pesos (MXN). Goldsworthy is expecting to receive a customer payment of JPY 225,000,000 that she wants to convert to pounds sterling (GBP). Underwood gathers the exchange rates from Dealer A in Exhibit 1.\nExhibit 1 – Dealer A's Spot Exchange Rates\nCurrency Pair (Price/Base)\tBid\tOffer\tMidpoint\nJPY/GBP\t129.65\t129.69\t129.67\nMXN/USD\t20.140\t20.160\t20.150\nGBP/EUR\t0.9467\t0.9471\t0.9469\nUSD/EUR\t1.1648\t1.1652\t1.1650\nUSD/GBP\t1.2301\t1.2305\t1.2303\nThe firm must also buy USD to pay a major supplier. Goldsworthy calls Dealer A with specific details of the transaction and asks to verify the USD/GBP quote. Dealer A calls her back later with a revised USD/GBP bid–offer quote of 1.2299/1.2307.\nGoldsworthy must purchase MXN 27,000,000 to pay an invoice at the end of the quarter. In addition to the quotes from Dealer A, Underwood contacts Dealer B, who provides a bid–offer price of GBP/MXN 0.0403/0.0406. To check whether the dealer quotes are reflective of an efficient market, Underwood examines whether the prices allow for an arbitrage profit.\nIn three months, the firm will receive EUR 5,000,000 from another customer. Six months ago, the firm sold EUR 5,000,000 against the GBP using a nine-month forward contract at an all-in price of GBP/EUR 0.9526. To mark the position to market, Underwood collects the GBP/EUR forward rates in Exhibit 2.\nExhibit 2 – GBP/EUR Forward Rates\nMaturity\tForward Points\nOne month\t4.40/4.55\nThree months\t14.0/15.0\nSix months\t29.0/30.0\nGoldsworthy also asks for the current 90-day MRRs for the major currencies (Exhibit 3). She says, \"We have the spot rate and the 90-day forward rate for GBP/EUR. As long as we have the GBP 90-day MRR, we will be able to calculate the implied EUR 90-day MRR.\"\nExhibit 3 – 90-Day MRR\nCurrency\tAnnualized Rate\nGBP\t0.5800%\nJPY\t0.0893%\nUSD\t0.3300%\nAfter reading a draft report, Underwood notes, \"We do not hedge the incoming Japanese yen cash flow. Your report asks for a forecast of the JPY/GBP exchange rate in 90 days. We know the JPY/GBP spot exchange rate. Does the information we have collected tell us what the JPY/GBP exchange rate will be in 90 days?\"\nGoldsworthy replies, \"The JPY/GBP exchange rate in 90 days would be a valuable piece of information to know. An international parity condition can be used to provide an estimate of the future spot rate.\"", "Connor Wagener, a student in New Zealand, interviews currency trader Hannah McFadden about what drives exchange rates. McFadden notes that international parity conditions illustrate how exchange rates are linked to expected inflation, interest rate differences, and forward exchange rates as well as current and expected future spot rates. She states:\nStatement 1: \"Fortunately, the international parity condition most relevant for FX carry trades does not always hold.\"\nShe continues: FX carry traders go long high-yield currencies and fund their position by borrowing in low-yield currencies. Crashes in currency values can occur as traders unwind their positions. For example, in 2008, the New Zealand dollar was negatively impacted when highly leveraged carry trades were unwound.\nStatement 2: \"A trade surplus will tend to cause the currency of the country in surplus to appreciate, while a deficit will cause currency depreciation. Exchange rate changes will result in immediate adjustments in the prices of traded goods as well as in the demand for imports and exports. These changes will immediately correct the trade imbalance.\"\nStatement 3: \"Monetary models of exchange rate determination focus on the effects of inflation, price level changes, and risk premium adjustments.\"\nMcFadden notes that capital flows can have a significant impact on exchange rates and have contributed to currency crises in both EM and DM countries. Central banks use FX market intervention as a tool to manage exchange rates. She states:\nStatement 4: \"Some studies have found that EM central banks tend to be more effective in using exchange rate intervention than DM central banks, primarily because of one important factor.\"\nStatement 5: \"I mentioned that capital inflows could cause a currency crisis, leaving fund managers with significant losses. In the period leading up to a currency crisis, I would predict that an affected country's:\nPrediction 1: foreign exchange reserves will increase.\nPrediction 2: broad money growth will increase.\nPrediction 3: exchange rate will be substantially higher than its mean level during tranquil periods.\"", "Alexandra Beauregard is an analyst at CapFX Partners, a US-based currency trading firm. She assists foreign currency strategist Robert Thibodeaux.\nThibodeaux notes that current account trends influence the path of exchange rates over time through several mechanisms: \"Of the three mechanisms that economists identify, I have the most confidence in the one that assumes there are long-run limits on current account deficits.\"\nThibodeaux and Beauregard discuss some of CapFX's recent trades. Based on the data in Exhibit 1, a European client recently entered into a one-year JPY/EUR carry trade based on the projected outlook for the two currencies.\nExhibit 1 – Interbank Currency Quotes and One-Year MRR\nCurrency Pair\tBid (Spot)\tOffer (Spot)\tProjected Spot in One Year\nUSD/AUD\t0.7050\t0.7083\t0.7148\nUSD/EUR\t1.0851\t1.0873\t1.0984\nUSD/NZD\t0.6740\t0.6770\t---\nJPY/USD\t117.62\t117.66\t118.32\nOne-year rates: JPY 0.15%, USD 0.80%, EUR 1.40%, NZD 2.00%", "Jocelyn Lopez, a director at a foreign currency advisory firm, meets with analyst Jan Carrasco. One of their Canada-based clients wants to hedge exposure to the Australian dollar and wants to know the cost of the hedge, specifically, the forward premium or discount for a 360-day AUD/CAD forward contract.\nExhibit 1 – Interbank Spot Exchange Rates\nCurrency Pair (Price/Base)\tBid\tOffer\tMidpoint\nAUD/CAD\t1.0713\t1.0751\t1.0732\nGBP/CAD\t0.5854\t0.5857\t0.5855\nExhibit 2 – 360-day MRR\nCountry\t360-day MRR\nAustralia\t0.26%\nCanada\t0.84%", "Sharandeep Kaur is an analyst at Timeless Media Group (TMG), a global entertainment company based in London. TMG is in the final stages of building a new park in Country A, an emerging market country.\nKaur notes that Country A is currently experiencing positive economic growth, low unemployment, a high level of debt relative to GDP, and consistently maintains a current account surplus due to the demand for its commodities. Based on these factors and according to the flow supply/demand channel, Kaur asserts in her analysis that Country A's currency should appreciate over time and that TMG should consider a longer-term hedging strategy.", "Charles Hollingsworth is an investment strategist at Drawbridge Asset Partners (Drawbridge). He begins a meeting with the following statement:\n\"A few months ago, Drawbridge entered into a carry trade in a set of currencies. This morning, we were unfortunately forced to close out the position at a sizable loss as a result of unexpected market volatility.\"\nHe continues: \"Earlier in the year, Drawbridge hedged a long exposure to the Australian dollar (AUD) by selling AUD 5 million forward against the US dollar (USD); the all-in forward price was 0.8940 (USD/AUD). It is now three months prior to the settlement date, and I want to mark the forward position to market.\"\nExhibit 1 – Current Foreign Exchange Data\nSpot rate (USD/AUD)\t0.9062/0.9066\nThree-month points\t–36.8/–36.4\nThree-month MRR (AUD)\t2.88%\nThree-month MRR (USD)\t0.23%", "Daltonia is a medium-sized developing country. Government policies have gradually opened the borders for international trade and the flow of capital. Trade is substantial with members of the EU and is often denominated in euros. During the early 2000s, privatization of some publicly owned industries, creation of a new free-floating currency, the Dornan (DRN), and sound central bank policies put the economy on a track for steady growth and stability. Foreign currency reserves are sizable in comparison to the average daily turnover of the DRN.\nMinister of Finance Naim Birol wants to be on the lookout for situations which might trigger a currency crisis. He and his colleague Ziya Pamuk discuss recent economic developments that might provide potential warning signs.\nBirol: \"Moving our currency to a floating exchange rate has reduced our susceptibility to a currency crisis.\"\nPamuk: \"Banking crises often precede currency crises, but our banking sector has grown and strengthened substantially by offering foreign denominated savings accounts to foreign investors and lending those funds for domestic infrastructure investments.\"\nPamuk: \"I'm concerned that the ratio of exports to imports has been increasing recently and the ratio of M2 to bank reserves has been falling.\"\nBirol is concerned that local currency dealers are being taken advantage of by arbitrageurs from Europe. He analyzes the rate quotes in Exhibit 2 for evidence of triangular arbitrage.\nExhibit 2 – Interbank and Dealer Currency Quotes\nCurrency Pair\tBid (spot)\tOffer (spot)\nInterbank EUR/USD\t0.8045\t0.8065\nInterbank DRN/USD\t1.2050\t1.2100\nDaltonian Dealer DRN/EUR\t1.5140\t1.5190", "Fariq Gupta is an analyst at an investment bank's foreign exchange trading desk.\nThe Mandurah Fund is an investment fund based in Australia. One year ago, Mandurah entered a carry trade involving currency positions in Country D and Country E. Gupta calculates the all-in return from the carry trade using the information in Exhibit 3.\nExhibit 3 – Data for Calculating Return on Carry Trade\nSpot rate for currency E per currency D one year ago\t6.6710\nCurrent spot rate for currency E per currency D\t6.7500\nAnnual yield on currency D one year ago\t0.65%\nAnnual yield on currency E one year ago\t4.00%\nCountry A is an emerging market, has a floating-rate currency regime and highly mobile foreign capital flows. The government is rapidly increasing its fiscal stimulus to boost economic growth. Gupta believes that this will lead to a prolonged buildup in public debt, which foreign creditors eventually will not accept. To ease concerns regarding the buildup in public debt, the central bank is implementing a restrictive monetary policy. He assesses the potential effect on the country's currency based on the Mundell-Fleming and portfolio balance approaches.", "Barkley Carlisle is an associate analyst at Nexran Enterprises, a US manufacturer of heavy industrial equipment that sells its products globally. Finance director Jennifer Brannigan provides Carlisle with Exhibit 1 and asks him to demonstrate some calculations, such as triangular arbitrage and expected future spot rates.\nExhibit 1 – Interbank Currency Quotes and One-Year MRR\nCurrency Pair\tBid (Spot)\tOffer (Spot)\tProjected Spot in One Year\nUSD/CHF\t1.0453\t1.0456\t1.0373\nUSD/EUR\t1.1241\t1.1243\t1.1324\nCAD/NZD\t0.8392\t0.8396\t---\nOne-year MRR: CHF 0.15%, CAD 0.95%, NZD 2.00%\nSix months ago, a European customer placed an order for EUR 20 million of oil field construction equipment with delivery and payment scheduled to take place one year later. Nexran hedged all of its exposure to the euro by entering into a forward position at a forward price of USD1.1716/EUR. The customer is now canceling the order, and Brannigan tells Carlisle to mark the forward position to market to facilitate exiting the currency hedge.\nExhibit 2 – Six-Month Forward and MRR Rates\nPoints (USD/EUR)\t35/36\nMRR (EUR)\t0.71% (annualized)\nMRR (USD)\t0.53% (annualized)", "Victor Klymchuk, the chief economist at ECONO Consulting (EC), is reviewing the long-term GDP growth of three countries and is interested in forecasting the long-term change in stock market value for each country.\nExhibit 1 – Select Country Factors and Historical Economic Data (2009–2019)\nCountry\tCountry Factors\tGrowth in Hours Worked (%)\tGrowth in Labor Productivity (%)\tGrowth in TFP (%)\tGrowth in GDP (%)\nCountry A\tHigh savings and investment; highly educated workforce; low tariffs on foreign imports; limited natural resources\t0.9\t2.4\t0.6\t3.3\nCountry B\tDeveloped financial markets; moderate disposable income; significant foreign direct and indirect investments; significant natural resources\t−0.3\t1.6\t0.8\t1.3\nCountry C\tPolitically unstable; limited property rights; poor public education and health; significant natural resources\t1.8\t0.8\t−0.3\t2.6\nStatement 1: \"Over short time horizons, percentage changes in GDP, the ratio of earnings to GDP, and the price-to-earnings ratio are important factors for describing the relationship between economic growth and stock prices. However, I am interested in a long-term stock market forecast.\"\nStatement 4: \"Although countries with greater access to natural resources are often wealthier, the relationship between resource abundance and economic growth is not clear. My analysis shows that the presence of a dominant natural resource (oil) in Country C is constraining growth. Interestingly, Country A has few natural resources but is experiencing a strong rate of increase in per capita GDP growth.\"\nKlymchuk knows that growth in per capita income cannot be sustained by pure capital deepening. He asks the associate economist to determine how important capital deepening is as a source of economic growth for each country, using the data in Exhibit 1.\nThe associate economist believes that developing countries, irrespective of their particular characteristics, will eventually equal developed countries in per capita output. Klymchuk responds:\nStatement 5: \"Poor countries will only converge to the income levels of the richest countries if they make appropriate institutional changes.\"", "Sagara, a resource-abundant West African country, has a developing economy with low capital per worker available. President Benjamin Banantoumou appointed Fatima N'Diarra, PhD, as Economic Development Secretary to help develop economic policies to promote growth.\nN'Diarra believes that according to the classical growth theory, gains in per capita GDP are temporary because the resulting population explosion will lower per capita GDP to subsistence real wage levels. She considers endogenous growth theory to be more realistic, believing that (1) investments, such as the new tire factory, will increase the rate of per capita output growth until the steady state rate of growth is achieved; and (2) investment in research and development will boost growth even further, thus extending the abnormal growth period before diminishing marginal returns eventually set in."], "modules": {"1": "Currency Exchange Rates: Understanding Equilibrium Value", "2": "Economic Growth"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "Economics", KEY = "Economics_quiz_state_v1", EXPKEY = "Economics_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return "Reading "+(4+Number(m))+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  function isEco(q){ return q.src==="ECO 오답"; }
  var counts={}, eco={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1; if(isEco(q)) eco[q.module]=(eco[q.module]||0)+1;});
  var ecoAll=Q.filter(isEco).length;
  var opts='<option value="all">전체 모듈 (ECO 오답 '+ecoAll+' / 전체 '+Q.length+')</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' (ECO 오답 '+(eco[m]||0)+' / 전체 '+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Economics 전체 Reading 오답 퀴즈 (R5–R6)</h2>'+
   '<p class="muted">ECO에서 틀린 56문제 전부 + 오답노트 기반 변형 22문제 (총 78문제). 정답은 ECO 원본 기준, 해설과 변형 문제는 Schweser 기준으로 작성했습니다. 범위를 고르고 "ECO 오답 풀기"를 누르면 ECO 오답만 나옵니다. 변형 문제는 "변형 문제 풀기" 버튼으로 따로 풉니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스(안 푼 문제 넘기기) · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">ECO 오답 풀기</button> <button class="btn" id="bExtra">변형 문제 풀기</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function start(wantEco){
    var m=$("selMod").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && isEco(q)===wantEco; }).map(function(q){return q.id;});
    if(!order.length){ alert(wantEco?"이 범위에는 ECO 오답 문제가 없습니다.":"이 범위에는 변형 문제가 없습니다."); return; }
    S=fresh(order,"all"); save(); render();
  }
  function labels(){
    var m=$("selMod").value, n=Q.filter(function(q){return m==="all"||String(q.module)===m;}), e=n.filter(isEco).length;
    $("bStart").textContent="ECO 오답 풀기 ("+e+")"; $("bExtra").textContent="변형 문제 풀기 ("+(n.length-e)+")";
  }
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){ start(true); };
  $("bExtra").onclick=function(){ start(false); };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>

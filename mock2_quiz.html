<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules, IMG = DATA.images || {};
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = DATA.meta.subject, KEY = SUBJECT+"_quiz_state_v1", EXPKEY = SUBJECT+"_quiz_exports_v1", CONFKEY = SUBJECT+"_confused_v1", UIKEY = SUBJECT+"_ui_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
// 헷갈림: 원본 txt의 "헷갈림:" 번호가 기본값, 화면에서 켜고 끈 것은 CONF.ids에 덮어씀
var CONF = store.get(CONFKEY) || {ids:{}, at:""};
// 학습 화면(문제+정답+해설) 상태는 풀이 기록(S)과 따로 둔다
var UI = store.get(UIKEY) || {view:null};
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }
function saveUI(){ store.set(UIKEY,UI); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables + [IMAGE: 파일명]
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function isRow(l){ return l!=null && l.indexOf("\t")>=0; }
  function isLabel(l){ var t=String(l==null?"":l).trim(); return !!t && !isRow(l) && t.length<=90 && !/^(Exhibit|Note|Panel|\([A-C]\)|[A-C] is )/i.test(t); }
  function flush(){
    if(!tbl.length) return;
    var n=0; tbl.forEach(function(r){ if(r.c && r.c.length>n) n=r.c.length; });
    html+='<div class="tbl"><table>'+tbl.map(function(r,i){
      if(r.l!=null) return '<tr><td class="lbl" colspan="'+n+'">'+esc(r.l)+'</td></tr>';
      var c=r.c.slice();
      if(i===0 && c.length===n-1) c.unshift(""); // header missing its empty corner cell
      while(c.length<n) c.push("");
      return "<tr>"+c.map(function(x){return "<td>"+esc(x)+"</td>";}).join("")+"</tr>";
    }).join("")+"</table></div>"; tbl=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], im=/^\[IMAGE: (.+)\]$/.exec(l.trim());
    if(im){ flush(); if(IMG[im[1]]) html+='<p><img class="exh" src="'+IMG[im[1]]+'" alt="'+esc(im[1])+'"></p>'; continue; }
    if(isRow(l)){ tbl.push({c:l.split("\t").map(function(x){return x.trim();})}); continue; }
    if(tbl.length){
      if(l.length && !l.trim()) continue; // whitespace-only line inside a table
      var j=i; while(j<lines.length && j-i<3 && isLabel(lines[j])) j++;
      if(j>i && isRow(lines[j])){ for(;i<j;i++) tbl.push({l:lines[i].trim()}); i--; continue; } // section label between rows
    }
    flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>";
  }
  flush(); return html;
}
function mname(m){ return MN[m]||m; }
function srcClass(s){ return s==="오답"?"src-wrong":"src-rel"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }
function isWrong(q){ return q.src==="오답"; }
function isConf(q){ var v=CONF.ids[q.id]; return v===undefined ? !!q.conf : !!v; }
function toggleConf(id){
  var q=BYID[id]; CONF.ids[id]=!isConf(q);
  if(CONF.ids[id]===!!q.conf) delete CONF.ids[id]; // 원래 값으로 돌아오면 덮어쓴 기록 삭제
  CONF.at=new Date().toISOString(); store.set(CONFKEY,CONF);
}
function confBtn(q){ return '<button class="btn conf'+(isConf(q)?' on':'')+'" id="bConf" title="헷갈린 문제로 표시/해제">'+(isConf(q)?'★ 헷갈림':'☆ 헷갈림')+'</button>'; }
function metaHtml(q, no){
  return '<div class="meta"><span class="qno">'+no+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span>'+
    (isConf(q)?'<span class="pill src-var">헷갈림</span>':'')+'<span class="tagline">'+esc(q.tag)+'</span><span style="flex:1"></span>'+confBtn(q)+'</div>';
}
// 범위: wrong = 오답만, wc = 오답+헷갈림, all = 전체
var FILT = {wrong:"오답만", wc:"오답+헷갈림", all:"전체"};
function pick(f, m){
  return Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (f==="all" || isWrong(q) || (f==="wc" && isConf(q))); }).map(function(q){return q.id;});
}

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
var MODE = {all:"전체 풀기", list:"학습한 목록 풀기", wrong:"오답만 풀기", wc:"오답+헷갈림 풀기", review:"틀린 문제 다시 풀기", rwc:"틀린+헷갈림 다시 풀기"};
function header(){
  if(UI.view==="study"){ var T=UI.study; $("nOk").textContent="-"; $("nBad").textContent="-"; $("pbar").style.width=((T.i+1)/T.ids.length*100)+"%"; $("ptxt").textContent=(T.i+1)+" / "+T.ids.length; $("pmode").textContent="해설 보며 학습 · "+T.label; return; }
  if(!S || !S.order){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=MODE[S.mode]||"";
}

/* ---------- setup screen ---------- */
function setup(){
  UI.view=null; saveUI();
  S && (S.view="setup", save());
  var wrongAll=Q.filter(isWrong).length, confAll=Q.filter(isConf).length;
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 토픽 ('+Q.length+')</option>'+Object.keys(MN).filter(function(m){return counts[m];}).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  var f = UI.filt || "wc";
  document.body.classList.remove("wide");
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">'+esc(DATA.meta.title)+' 오답 퀴즈</h2>'+
   '<p class="muted">전체 '+Q.length+'문제 · 내가 틀린 문제 '+wrongAll+' · 헷갈린 문제 '+confAll+'. 정답과 영어 해설은 CFA Institute 원문, 한국어 해설은 원문을 바탕으로 작성했습니다. 헷갈림 표시는 문제 화면의 ☆ 버튼으로 켜고 끌 수 있습니다.</p>'+
   '<label>토픽 <select id="selMod">'+opts+'</select></label>'+
   '<div class="seg" id="segF">'+Object.keys(FILT).map(function(k){return '<button class="btn'+(k===f?' on':'')+'" data-f="'+k+'">'+FILT[k]+' <span id="n_'+k+'"></span></button>';}).join("")+'</div>'+
   '<p class="kbd">풀기: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · → 패스 · ← 이전 문제 / 학습: ← → 이동</p>'+
   '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">풀기</button> <button class="btn" id="bStudy">해설 보며 학습</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  function labels(){
    var m=$("selMod").value;
    Object.keys(FILT).forEach(function(k){ $("n_"+k).textContent="("+pick(k,m).length+")"; });
    var n=pick(f,m).length; $("bStart").textContent=FILT[f]+" 풀기 ("+n+")"; $("bStudy").textContent=FILT[f]+" 해설 보며 학습 ("+n+")";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(b){ b.onclick=function(){
    f=b.getAttribute("data-f"); UI.filt=f; saveUI();
    Array.prototype.forEach.call(document.querySelectorAll("#segF button"),function(x){ x.classList.toggle("on", x===b); }); labels(); }; });
  $("selMod").onchange=labels; labels();
  $("bStart").onclick=function(){
    var order=pick(f,$("selMod").value); if(!order.length){ alert("이 범위에는 문제가 없습니다."); return; }
    S=fresh(order,f); save(); render();
  };
  $("bStudy").onclick=function(){
    var m=$("selMod").value, ids=pick(f,m); if(!ids.length){ alert("이 범위에는 문제가 없습니다."); return; }
    startStudy(ids, FILT[f]+(m==="all"?"":" · "+mname(m)));
  };
  header();
}

/* ---------- 지문 패널: 지문이 있는 문제는 왼쪽에 지문, 오른쪽에 문제·보기·해설 ---------- */
function split(q, html){
  var has = q.vig!==null && q.vig!==undefined;
  document.body.classList.toggle("wide", has);
  if(!has) return html;
  var old=document.querySelector(".vpane"), keep=(old && old.getAttribute("data-v")===String(q.vig)) ? old.scrollTop : 0;
  setTimeout(function(){ var n=document.querySelector(".vpane"); if(n) n.scrollTop=keep; },0);
  return '<div class="split"><aside class="vpane" data-v="'+q.vig+'"><div class="vhead">케이스 지문 (Vignette)</div>'+rich(VIG[q.vig])+'</aside><div class="qpane">'+html+'</div></div>';
}

/* ---------- study screen: 문제 + 정답 + 해설을 같이 본다 ---------- */
function startStudy(ids, label){ UI.view="study"; UI.study={ids:ids, i:0, label:label}; saveUI(); study(); window.scrollTo(0,0); }
function study(){
  var T=UI.study, id=T.ids[T.i], q=BYID[id];
  var vig = '';
  var optsHtml = ["A","B","C"].map(function(L){
    return '<div class="opt'+(L===q.ans?' sel-ok':'')+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+
      (L!==q.ans && q.why && q.why[L] ? '<span class="whyl">'+esc(q.why[L])+'</span>' : '')+'</span></div>';
  }).join("");
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  $("view").innerHTML=split(q, '<section class="card">'+metaHtml(q, esc(q.orig))+vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div>'+
    '<div class="fb ok"><h3>정답 '+q.ans+'</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+trap+
    '<details class="en"><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details></div>'+
    '<div class="nav"><button class="btn" id="sPrev" '+(T.i===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+(T.i+1)+' / '+T.ids.length+'</span>'+
    '<button class="btn primary" id="sNext" '+(T.i===T.ids.length-1?'disabled':'')+'>다음 →</button></div>'+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="btn" id="sQuiz">이 목록 풀기 ('+T.ids.length+')</button><button class="btn" id="sHome">처음 화면</button></div></section>');
  $("sPrev").onclick=function(){ studyGo(T.i-1); };
  $("sNext").onclick=function(){ studyGo(T.i+1); };
  $("sQuiz").onclick=function(){ UI.view=null; saveUI(); S=fresh(T.ids.slice(),"list"); save(); render(); };
  $("sHome").onclick=setup;
  $("bConf").onclick=function(){ toggleConf(id); study(); };
  header();
}
function studyGo(i){ var T=UI.study; if(i<0||i>=T.ids.length) return; T.i=i; saveUI(); study(); window.scrollTo(0,0); }

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card">'+metaHtml(q,'Q'+(S.idx+1))+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    (r?'<button class="btn primary" id="bNext">'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button>':'<button class="btn" id="bNext" title="풀지 않고 넘어갑니다">패스 →</button>')+'</div></section>';
  $("view").innerHTML=split(q, html);
  Array.prototype.forEach.call(document.querySelectorAll("button.opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=r?next:skip;
  $("bConf").onclick=function(){ toggleConf(id); quiz(); };
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }
// 패스: 풀지 않고 다음 문제로. 마지막 문제면 앞에서 건너뛴 문제로, 남은 게 없으면 결과로.
function firstOpen(except){ for(var i=0;i<S.order.length;i++){ var x=S.order[i]; if(!S.round[x] && x!==except) return i; } return -1; }
function skip(){
  var id=S.order[S.idx]; if(S.round[id]) return next();
  if(S.idx<S.order.length-1) S.idx++;
  else { var j=firstOpen(id); if(j<0){ S.finished=true; S.view="result"; save(); result(); return; } S.idx=j; }
  save(); quiz(); window.scrollTo(0,0);
}

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  var wcIds=S.order.filter(function(id){var r=S.round[id];return (r&&!r.correct) || isConf(BYID[id]);});
  document.body.classList.remove("wide");
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"||S.mode==="rwc"?"다시 풀기 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">토픽별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bRetryWC" '+(wcIds.length?'':'disabled')+'>틀린 문제 + 헷갈림 다시 풀기 ('+wcIds.length+')</button>'+
    (st.answered<st.total?'<button class="btn" id="bOpen">안 푼 문제 풀기 ('+(st.total-st.answered)+')</button>':'')+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  function retry(ids, mode){ if(!ids.length) return; S.order=ids; S.idx=0; S.mode=mode; S.round={}; S.finished=false; S.view="quiz"; save(); render(); }
  $("bRetry").onclick=function(){ retry(wrongIds,"review"); };
  $("bRetryWC").onclick=function(){ retry(wcIds,"rwc"); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  if($("bOpen")) $("bOpen").onclick=function(){ var j=firstOpen(); if(j<0) return; S.idx=j; S.finished=false; S.view="quiz"; save(); quiz(); window.scrollTo(0,0); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S || !S.order){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, confused:isConf(q), selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak,
    confusedOverrides:CONF.ids
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  S.updatedAt=attempt.exportedAt; save();
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{이름}/latest.json)의 마지막 attempt로 진행 상태와 헷갈림 표시를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  if(at.confusedOverrides){ CONF={ids:at.confusedOverrides, at:at.exportedAt||""}; store.set(CONFKEY,CONF); }
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:MODE[at.mode]?at.mode:"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz", updatedAt:at.exportedAt||""};
  UI.view=null; saveUI();
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저의 마지막 풀이·내보내기·불러오기·헷갈림 변경보다 늦게 내보낸 기록이면 자동으로 이어 풀고, 아니면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function localTime(){
  var t=(S&&S.updatedAt)||"";
  if(CONF.at>t) t=CONF.at;
  if(S&&S.all) Object.keys(S.all).forEach(function(id){ (S.all[id].history||[]).forEach(function(h){ if(h.at&&h.at>t) t=h.at; }); });
  return t;
}
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if((at.exportedAt||"")>localTime()){ applyResults(d,true); }
    else if(UI.view!=="study" && (!S || S.view==="setup")){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(UI.view==="study" && UI.study && UI.study.ids && UI.study.ids.length) return study();
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} UI.view=null; saveUI(); S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(UI.view==="study"){ if(e.key==="ArrowRight") studyGo(UI.study.i+1); else if(e.key==="ArrowLeft") studyGo(UI.study.i-1); return; }
  if(!S||S.view!=="quiz"||!document.querySelector("button.opt")) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowRight"){ skip(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>
</html>

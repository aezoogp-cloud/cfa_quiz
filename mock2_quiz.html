determined by taking the interbank market bid quotes of THB/USD and USD/AUD, while the offer is determined by taking the offer quotes.\nTHB/AUD bid is 0.7276 × 33.3942 = 24.2976.\nTHB/AUD offer is 0.7279 × 33.3965 = 24.3093.\nThe dealer quote for THB/AUD is 24.3065/24.3090, which means that both the bid and the offer are outside the range required for an arbitrage opportunity to exist.\nB. Yes, by selling AUD to the dealer and buying AUD in the interbank market — Incorrect\nIncorrect because the AUD is offered in the interbank market at 24.3093 THB/AUD while the dealer's bid is 24.3065 THB/AUD, so the trade would incur a loss of 24.3093 – 24.3065 = 0.0028. The cross-rate implied by the interbank market does not provide an arbitrage opportunity.\nC. Yes, by buying AUD from the dealer and selling AUD in the interbank market — Incorrect\nIncorrect because the AUD is offered from the dealer at 24.3090 THB/AUD while the interbank market bid is 24.2976 THB/AUD, so the trade would incur a loss of 24.3090 – 24.2976 = 0.0114. The cross-rate implied by the interbank market does not provide an arbitrage opportunity.", "ko": "THB/AUD = THB/USD × USD/AUD. 은행간 bid = 33.3942 × 0.7276 = 24.2976, offer = 33.3965 × 0.7279 = 24.3093. 딜러 호가 24.3065/24.3090은 은행간 범위(24.2976~24.3093) 안에 있다. 차익거래는 딜러 bid가 은행간 offer보다 높거나, 딜러 offer가 은행간 bid보다 낮을 때만 생긴다 → 기회 없음.", "trap": "딜러 bid(24.3065) < 은행간 offer(24.3093), 딜러 offer(24.3090) > 은행간 bid(24.2976) → 차익 없음.", "f": "Cross bid = bid × bid, Cross offer = offer × offer", "why": {"B": "은행간에서 AUD를 24.3093에 사서 딜러에게 24.3065에 팔면 0.0028 손실입니다.", "C": "딜러에게서 24.3090에 사서 은행간에 24.2976에 팔면 0.0114 손실입니다."}, "orig": "Mock 2 Session 1 Q33", "conf": false}, {"id": "mock2-Q34", "src": "정답", "module": "ECO", "tag": "선도 포인트 (540일)", "vig": 8, "stem": "The forward points for the FXA/FXB forward contract are closest to:", "opts": {"A": "–722.", "B": "–679.", "C": "–464."}, "ans": "B", "en": "A. –722. — Incorrect\nIncorrect because the price currency's interest rate is used in the denominator instead of the base currency's. This gets:\n1.1423 × [(540/360) / (1 + 0.0123(540/360))] × (0.0123 – 0.0552)\n= –0.072175 ≈ –0.0722,\nwhich when turned into forward points = (–0.0722 × 10,000)\n= –722 forward points.\nB. –679. — Correct\nCorrect because the equation to calculate the forward premium or discount is:\nFP/B – SP/B = SP/B[(Actual Days/360) / (1 + iB(Actual/360))](iP – iB), where SP/B is the spot rate, iP is the price currency interest rate, and iB is the base currency interest rate.\nFP/B – SP/B = 1.1423 × [(540/360) / (1 + 0.0552(540/360))] × (0.0123 – 0.0552)\n= 1.1423 × 1.3853 × –0.0429 = –0.067886 ≈ –0.0679,\nwhich when turned into forward points = (–0.0679 ×10,000)\n= –679 forward points.\nC. –464. — Incorrect\nIncorrect because the formula used is for one year instead of 18 months (540 days). This gets:\n1.1423 × [(360/360) / (1 + 0.0552(360/360))] × (0.0123 – 0.0552)\n= –0.046441 ≈ –0.0464,\nwhich when turned into forward points = (–0.0464 × 10,000)\n= –464 forward points.", "ko": "FXA/FXB에서 가격통화 = FXA(1.23%), 기준통화 = FXB(5.52%). F − S = S × [(540/360) / (1 + iB × 540/360)] × (iP − iB) = 1.1423 × [1.5 / (1 + 0.0552 × 1.5)] × (0.0123 − 0.0552) = 1.1423 × 1.3853 × (−0.0429) = −0.0679. 포인트 = −0.0679 × 10,000 = −679.", "trap": "분모에는 기준통화(분모 통화, FXB) 금리를 쓴다. 기간은 540/360.", "f": "F − S = S × [(일수/360) / (1 + iB × 일수/360)] × (iP − iB)", "why": {"A": "분모에 가격통화(FXA) 금리 1.23%를 썼습니다.", "C": "540일이 아니라 1년(360/360)으로 계산했습니다."}, "orig": "Mock 2 Session 1 Q34", "conf": true}, {"id": "mock2-Q35", "src": "정답", "module": "ECO", "tag": "통화 선도 mark-to-market", "vig": 8, "stem": "The mark-to-market value of Podowski's USD/EUR forward contract is closest to:", "opts": {"A": "USD 59,921.", "B": "USD 69,907.", "C": "USD 115,847."}, "ans": "A", "en": "A. USD 59,921. — Correct\nCorrect because, when marking to market a forward position, you have to create an offsetting forward position, determine the appropriate all-in forward rate, calculate the cash flow at the future settlement date, and calculate the present value of this cash flow.\nPodowski bought forward EUR 20 million at 1.1308 USD/EUR. This forward now has 3 months left. To offset it, you need to sell EUR 20 million 3 months forward. Since the EUR is the base currency, we need to sell at the bid for the spot and forward points. The all-in bid rate is 1.1352 – 14/10,000 = 1.1338 USD/EUR.\nOn settlement, Podowski will pay USD 22,616,000 (20,000,000 × 1.1308) on the original forward and receive USD 22,676,000 (20,000,000 × 1.1338) from the offsetting forward, resulting in a positive cash flow of USD 60,000 (22,676,000 – 22,616,000). This now has to be discounted at the 90-day MRR, which results in a PV of:\nUSD 60,000 / [1 + 0.0053(90/360)] = USD 59,921.\nB. USD 69,907. — Incorrect\nIncorrect because the offer, and not the bid, is used for the offsetting contract. The all-in offer rate is 1.1355 – 12/10,000 = 1.1343 USD/EUR.\nEUR 20 million × 1.1343 USD/EUR = USD 22,686,000. This gives a positive cash flow of USD 70,000 (22,686,000 – 22,616,000). Discounted at the 90-day MRR, the PV equals:\nUSD 70,000 / [1 + 0.0053(90/360)] = USD 69,907.\nC. USD 115,847. — Incorrect\nIncorrect because the forward points are subtracted, which gives an all-in bid rate of 1.1352 – (–14/10,000) = 1.1366 USD/EUR.\nOn settlement, Podowski will pay USD 22,616,000 (20,000,000 × 1.1308) on the original forward and receive USD 22,732,000 (20,000,000 × 1.1366) from the offsetting forward, resulting in a positive cash flow of USD 116,000 (22,732,000 – 22,616,000). Discounted at the 90-day MRR, the PV equals:\nUSD 116,000 / [1 + 0.0053(90/360)] = USD 115,847.", "ko": "EUR 2,000만을 1.1308에 사기로 한 선도가 3개월 남았다. 상쇄하려면 3개월 선도로 EUR을 팔아야 하므로 bid 쪽을 쓴다: 1.1352 + (−14/10,000) = 1.1338. 만기 현금흐름 = 20,000,000 × (1.1338 − 1.1308) = USD 60,000. USD 금리로 90일 할인: 60,000 / (1 + 0.0053 × 90/360) = USD 59,921.", "trap": "EUR(기준통화)을 파는 상쇄 거래 → bid 사용. 음수 포인트는 더하면(= 빼면) 된다. 할인은 USD(가격통화) 금리.", "f": "MTM = 명목 × (F_상쇄 − F_원래) / (1 + i_가격통화 × 일수/360)", "why": {"B": "상쇄 거래에 bid가 아니라 offer(1.1343)를 썼습니다.", "C": "음수 포인트를 빼서 1.1366이 되었습니다(부호 실수)."}, "orig": "Mock 2 Session 1 Q35", "conf": false}, {"id": "mock2-Q36", "src": "오답", "module": "ECO", "tag": "carry trade 성공 조건", "vig": 8, "stem": "What condition would best support Francis' trade proposal between AUD and ZAR?", "opts": {"A": "Low market volatility", "B": "Covered interest rate parity not holding in the short term", "C": "The interest rate differential between the two countries being expected to widen after the trade is initiated"}, "ans": "A", "en": "A. Low market volatility — Correct\nCorrect because the payoff in a carry trade is the gradual accrual of the interest rate differential—income that is unrelated to exchange rate volatility. During periods of low turbulence, investors may feel relatively confident that exchange rate movements will not jeopardize the gradual accrual of the interest differential. When volatility in the currency markets spikes, however, the risk of an adverse exchange rate movement rises sharply relative to the gradual flow of income. During periods of low volatility, carry trades tend to generate positive returns, but they are prone to significant crash risk in turbulent times.\nB. Covered interest rate parity not holding in the short term — Incorrect\nIncorrect because for a carry trade to succeed, it is uncovered interest rate parity, not covered interest rate parity, that must not hold. If it held, the investor would receive identical returns from either an unhedged foreign currency return or a domestic currency investment as the appreciation or depreciation of the exchange rate would offset the yield differential. If uncovered interest rate parity held at all times, investors would not be able to profit from a strategy that undertook long positions in high-yield currencies and short positions in low-yield currencies. The change in spot rates over the tenor of the forward contracts would cancel out the interest rate differentials locked in at the inception of the position.\nC. The interest rate differential between the two countries being expected to widen after the trade is initiated — Incorrect\nIncorrect because the difference in yields is locked in at the time of the trade, so the movement of the yield spread once the trade is initiated is irrelevant.", "ko": "carry trade는 저금리 통화를 빌려 고금리 통화에 투자해 금리 차이를 조금씩 쌓는 전략이다. 환율 변동성이 낮으면 환율 손실이 금리 차이 수익을 깎을 위험이 적어 유리하다. 변동성이 커지면 급락(crash) 위험이 크다. 금리 차이는 거래 시작 때 고정되므로 이후 차이가 벌어질 것이라는 예상은 상관없다. 또 깨져야 하는 것은 covered가 아니라 uncovered 금리평가다.", "trap": "carry trade = 낮은 변동성 + uncovered IRP가 성립하지 않을 때.", "f": "", "why": {"B": "carry trade가 성공하려면 covered가 아니라 uncovered 금리평가가 성립하지 않아야 합니다.", "C": "금리 차이는 거래 시작 시점에 고정되므로 이후 벌어지는 것은 관계없습니다."}, "orig": "Mock 2 Session 1 Q36", "conf": false}, {"id": "mock2-Q37", "src": "정답", "module": "FI", "tag": "CVA로 위험 채권 가격", "vig": 9, "stem": "The price of the AHM01 bond is closest to:", "opts": {"A": "97.84.", "B": "98.71.", "C": "99.10."}, "ans": "A", "en": "A. 97.84. — Correct\nCorrect because it computes the risky bond value as VND minus CVA (value assuming no default MINUS the credit value adjustment).\nVND is given in the case as 100.46. The CVA is computed based on the loss given default (LGD) assuming a recovery rate of 40%, where LGD is (1 – Recovery Rate) × Expected Exposure.\nExpected exposure, probability of default (POD), and the discount factors are given in Exhibit 1.\nYear 1: LGD = 60% × 105.49 = 63.294\nYear 2: LGD = 60% × 105.00 = 63.000\nCVA per year is then equal to POD times LGD times the discount factor:\nYear 1: CVA = 0.0225 × 63.294 × 0.9524 = 1.3563\nYear 2: CVA = 0.0220 × 63.000 × 0.9115 = 1.2633\nCVA = sum of the yearly CVA = 2.6196\nPrice = Fair Value of Bond = VND – CVA = 100.46 – 2.6196 = 97.8404 ≈ 97.84\nB. 98.71. — Incorrect\nIncorrect because it computes the LGD as Expected Exposure times the Recovery Rate.\nYear 1: LGD = 40% × 105.49 = 42.196\nYear 2: LGD = 40% × 105.00 = 42.000\nCVA per year is then equal to POD times LGD times the discount factor:\nYear 1: CVA = 0.0225 × 42.196 × 0.9524 = 0.9042\nYear 2: CVA = 0.0220 × 42.000 × 0.9115 = 0.8422\nCVA = sum of the yearly CVA = 1.7464\nValue of Bond = VND – CVA = 100.46 – 1.7464 = 98.7136 ≈ 98.71\nC. 99.10. — Incorrect\nIncorrect because it computes the bond value as VND – Year 1 CVA:\n100.46 – 1.3563 = 99.1037 ≈ 99.10", "ko": "LGD = (1 − 회수율 40%) × 기대 노출. Year 1: 0.6 × 105.49 = 63.294, Year 2: 0.6 × 105.00 = 63.000. CVA = PD × LGD × 할인계수: Year 1 = 0.0225 × 63.294 × 0.9524 = 1.3563, Year 2 = 0.0220 × 63.000 × 0.9115 = 1.2633. 합 = 2.6196. 가격 = VND − CVA = 100.46 − 2.6196 = 97.84.", "trap": "LGD는 회수율이 아니라 (1 − 회수율). CVA는 모든 연도를 더한다.", "f": "Price = VND − CVA, CVA = Σ PD × (1 − RR) × Exposure × DF", "why": {"B": "LGD를 회수율(40%) × 노출로 계산했습니다.", "C": "Year 1 CVA만 빼고 Year 2를 빠뜨렸습니다."}, "orig": "Mock 2 Session 1 Q37", "conf": false}, {"id": "mock2-Q38", "src": "오답", "module": "FI", "tag": "회수율과 implied PD", "vig": 9, "stem": "Based on the recovery rate estimated by the junior analyst, the probability of default of the AHM01 bond would be:", "opts": {"A": "less than 2.25%.", "B": "equal to 2.25%.", "C": "greater than 2.25%."}, "ans": "A", "en": "A. less than 2.25%. — Correct\nCorrect because a lower recovery rate (i.e., 30% stated by the junior analyst vs. 40% assumed by Wang) is associated with a lower probability of default (given price and credit spread), holding all else equal. Given the observed bond price (and credit spread), we would need a lower probability of default to offset the lower rate of recovery.\nB. equal to 2.25%. — Incorrect\nIncorrect because the probability of default would need to be reduced from its current value of 2.25%.\nC. greater than 2.25%. — Incorrect\nIncorrect because the probability of default would be lower than 2.25%.", "ko": "채권 가격(=신용 스프레드)이 그대로라면, 기대 손실(대략 PD × LGD)도 그대로여야 한다. 회수율이 40% → 30%로 낮아지면 LGD가 커지므로, 같은 가격을 맞추려면 PD가 더 낮아야 한다. 따라서 PD는 2.25%보다 작다.", "trap": "가격 고정 상태에서 회수율 ↓ → LGD ↑ → PD ↓ (서로 상쇄).", "f": "Credit spread ≈ PD × LGD = PD × (1 − RR)", "why": {"B": "LGD가 커졌으므로 같은 가격을 맞추려면 PD가 줄어야 합니다.", "C": "PD가 커지면 가격이 더 내려가야 합니다. 가격이 같다면 PD는 작아집니다."}, "orig": "Mock 2 Session 1 Q38", "conf": false}, {"id": "mock2-Q39", "src": "정답", "module": "FI", "tag": "CDS upfront payment", "vig": 9, "stem": "The CDS protection that Wang purchases on the AHM01 bond requires:", "opts": {"A": "no upfront payment.", "B": "Wang to make an upfront payment.", "C": "XRM Bank to make an upfront payment."}, "ans": "B", "en": "A. no upfront payment. — Incorrect\nIncorrect because an upfront payment is required in this case to set the value of the CDS equal to zero on the trade date. As stated in the case, the initial value is set to zero. Since the CDS has a standardized fixed coupon of 100 basis points while the risk premium fair price of CDS protection is 150 basis points, a payment must be made by Wang to set the value equal to zero.\nB. Wang to make an upfront payment. — Correct\nCorrect because the upfront payment is designed to set the initial value of the CDS equal to zero. The CDS has a standardized fixed coupon of 100 basis points, while the current market price (risk premium fair price) of CDS protection is 150 basis points. Since the protection buyer is paying only 100 basis points premium for a credit risk worth 150 basis points, the protection buyer must make an upfront payment to the protection seller. In this way, the value of the CDS trade is set equal to zero.\nC. XRM Bank to make an upfront payment. — Incorrect\nIncorrect because an upfront payment is made by Wang to XRM Bank. As stated in the case, the initial value is set to zero. Since the CDS has a standardized fixed coupon of 100 basis points while the risk premium fair price of CDS protection is 150 basis points, a payment must be made by Wang to set the value equal to zero.", "ko": "표준 쿠폰은 100bp인데 시장 신용 스프레드(공정 가격)는 150bp다. 보호 매수자인 Wang은 150bp 가치의 보호를 100bp만 내고 받으므로, 차이만큼을 처음에 보호 매도자(XRM Bank)에게 upfront로 낸다. 그래야 계약 시작 가치가 0이 된다.", "trap": "스프레드 > 쿠폰 → 보호 매수자가 지급, 스프레드 < 쿠폰 → 보호 매도자가 지급.", "f": "Upfront ≈ (spread − coupon) × duration (스프레드 > 쿠폰 → 매수자가 지급)", "why": {"A": "쿠폰(100bp)이 스프레드(150bp)와 달라 가치를 0으로 맞추려면 upfront가 필요합니다.", "C": "덜 내는 쪽은 보호 매수자(Wang)라 Wang이 지급합니다."}, "orig": "Mock 2 Session 1 Q39", "conf": false}, {"id": "mock2-Q40", "src": "정답", "module": "FI", "tag": "CDS basis trade", "vig": 9, "stem": "For the basis trade, Wang should:", "opts": {"A": "buy Bond X and sell protection.", "B": "buy Bond X and buy protection.", "C": "buy Bond Y and buy protection."}, "ans": "B", "en": "A. buy Bond X and sell protection. — Incorrect\nIncorrect because the correct basis trade is to buy Bond X and to buy protection since compared to the bond market, the CDS market is pricing in credit risk that is low compared to the bond market.\nB. buy Bond X and buy protection. — Correct\nCorrect because Bond X trades at a credit risk premium of 2.50%, while the credit spread in the CDS market is 2.25%. The correct basis trade is then to buy Bond X and to buy protection, thereby earning the 25 basis point difference. From the perspective of the CDS market, the risk premium is too low relative to the bond risk premium and the CDS market is pricing in too little credit risk, and/or the bond market is pricing in too much risk.\nC. buy Bond Y and buy protection. — Incorrect\nIncorrect because the correct basis trade involving Bond Y is to sell Bond Y and to sell protection. Bond Y currently looks overpriced compared to the CDS market (its credit spread is 2.50%; the CDS risk premium is 2.75%) and one can buy the credit risk of Bond Y by selling protection. Investing the proceeds of the sale of Bond Y in a risk-free bond, combined with the sale of protection, essentially replicates a cheaper way to purchase Bond Y.", "ko": "Bond X: 채권 신용 프리미엄 2.50% > CDS 2.25%. 채권이 위험을 너무 비싸게(채권이 싸게) 보고 있으므로 채권을 사고 CDS로 보호를 사면 2.50% − 2.25% = 25bp를 얻는다. Bond Y는 채권 2.50% < CDS 2.75%라 반대로 채권을 팔고 보호를 판다. 보기 중 맞는 것은 'Bond X 매수 + 보호 매수'.", "trap": "채권 스프레드 > CDS → 채권 매수 + 보호 매수. 채권 스프레드 < CDS → 채권 매도 + 보호 매도.", "f": "", "why": {"A": "Bond X를 사면 신용위험을 없애려고 보호를 사야 합니다. 팔면 위험이 두 배가 됩니다.", "C": "Bond Y는 채권이 비싸서(스프레드가 CDS보다 작음) 채권 매도 + 보호 매도가 맞습니다."}, "orig": "Mock 2 Session 1 Q40", "conf": true}, {"id": "mock2-Q41", "src": "정답", "module": "ETH", "tag": "Standard IV(B): 외부 직위 서면 동의", "vig": 10, "stem": "According to the Standards, does Keegan need to obtain written permission from Stanz before accepting the CFA society and the Kino Empire positions?", "opts": {"A": "Yes", "B": "No, only for the CFA society position", "C": "No, only for the Kino Empire position"}, "ans": "A", "en": "A. Yes — Correct\nCorrect because, according to Standard IV(B) Additional Compensation Arrangements, Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved.\nA conflict of interest is likely to arise in the case of both external positions being offered to Keegan and, as such, she needs to obtain written permission before accepting each of them. Regarding the CFA society leadership position, in addition to receiving monetary compensation, Keegan will be monitoring the asset allocation for the society, which could create potential conflicts with her role at Stanz. Regarding the Kino Empire board position, although Keegan will not receive monetary compensation, she will still receive benefits in the form of free movie tickets.\nB. No, only for the CFA society position — Incorrect\nIncorrect because Keegan must obtain written permission to accept both the CFA society position and the Kino Empire position.\nC. No, only for the Kino Empire position — Incorrect\nIncorrect because Keegan must obtain written permission to accept both the CFA society position and the Kino Empire position.", "ko": "IV(B)는 고용주 이익과 경쟁하거나 이해상충이 생길 수 있는 보수·혜택을 받으려면 모든 당사자의 서면 동의를 받으라고 한다. CFA 협회 재무 담당: 보수를 받고 협회 자금의 자산배분을 감시하므로 Stanz 업무와 충돌 가능. Kino Empire 이사: 현금 보수는 없지만 무료 영화표라는 혜택을 받고, 고객 계좌가 이 회사 주식을 갖고 있다. 둘 다 서면 허락이 필요하다.", "trap": "현금이 아니어도 혜택(무료 표)이면 IV(B) 대상.", "f": "", "why": {"B": "Kino Empire도 무료 영화표라는 혜택이 있어 서면 동의가 필요합니다.", "C": "CFA 협회 자리도 보수를 받고 자산배분을 감시해 서면 동의가 필요합니다."}, "orig": "Mock 2 Session 1 Q41", "conf": false}, {"id": "mock2-Q42", "src": "정답", "module": "ETH", "tag": "Standard VII(A): 시험 문제 공개", "vig": 10, "stem": "During the conversation with Keegan at the local CFA society event, does the CFA candidate violate the Standards?", "opts": {"A": "No", "B": "Yes, because of her comment about the recent Level II exam", "C": "Yes, because of her comment about the relevance of the CFA Program"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because, according to Standard VII(A) Conduct as Participants in CFA Institute Programs, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to specific details of questions appearing on the exam. Therefore, the CFA candidate violates the Standards by detailing the specific exam question about how alternative accounting methods affect company balance sheets.\nB. Yes, because of her comment about the recent Level II exam — Correct\nCorrect because, according to Standard VII(A) Conduct as Participants in CFA Institute Programs, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to specific details of questions appearing on the exam. Therefore, the CFA candidate violates the Standards by detailing the specific exam question about how different accounting methods affect company balance sheets.\nC. Yes, because of her comment about the relevance of the CFA Program — Incorrect\nIncorrect because Standard VII(A) does not cover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute programs. As a result, the CFA candidate's comment about the relevance of the CFA Program is not a violation of the Standards.", "ko": "응시자가 '최근 Level II 시험에 회계 방법에 따라 재무상태표가 어떻게 달라지는지 묻는 문제가 나왔다'고 말한 것은 시험 문제의 구체적 내용을 공개한 것이라 VII(A) 위반이다. CFA 프로그램이 업무에 쓸모없다는 의견을 말하는 것은 위반이 아니다.", "trap": "프로그램에 대한 의견 = OK, 구체적 시험 문제 내용 = 위반.", "f": "", "why": {"A": "구체적인 시험 문제 내용을 말해 위반입니다.", "C": "CFA 프로그램에 대한 의견 표현은 VII(A) 대상이 아닙니다."}, "orig": "Mock 2 Session 1 Q42", "conf": false}, {"id": "mock2-Q43", "src": "정답", "module": "ETH", "tag": "Standard III(D): 해지 계좌 제외", "vig": 10, "stem": "Regarding the performance presentation section of the marketing materials, are Keegan's actions consistent with the Standards?", "opts": {"A": "Yes", "B": "No, because of the treatment of closed accounts", "C": "No, because of the use of simulated results from the backtest"}, "ans": "B", "en": "A. Yes — Incorrect\nIncorrect because Keegan excludes any closed accounts when determining the performance of the composite and is therefore not consistent with the Standards.\nB. No, because of the treatment of closed accounts — Correct\nCorrect because, according to the recommended procedures for Standard III(D) Performance Presentation, members and candidates can also meet their obligations under Standard III(D) by presenting the performance of the weighted composite of similar portfolios rather than using a single representative account and including terminated accounts as part of performance history with a clear indication of when the accounts were terminated. In the case, Keegan excludes any closed accounts when determining the performance of the composite and is therefore not consistent with the Standards.\nC. No, because of the use of simulated results from the backtest — Incorrect\nIncorrect because, according to the recommended procedures for Standard III(D) Performance Presentation, members and candidates can also meet their obligations under Standard III(D) by including disclosures that fully explain the performance results being reported (for example, stating, when appropriate, that results are simulated when model results are used). In the case, Keegan provides details of the model and shows a comparison with actual performance history. Therefore, her actions with respect to the simulated backtest are consistent with the Standards.", "ko": "Keegan은 모델 성과가 시뮬레이션 백테스트라고 밝혔다 → 공시가 충분하므로 OK. 하지만 composite 성과를 낼 때 해지된 계좌를 뺐다. III(D) 권장 절차는 해지 계좌도 언제 해지됐는지 표시해 성과 이력에 넣으라고 한다. 해지 계좌 제외는 성과를 좋게 보이게 할 수 있어 위반이다.", "trap": "시뮬레이션은 밝히면 OK. 해지 계좌는 빼면 안 된다.", "f": "", "why": {"A": "해지 계좌를 빼서 Standards와 맞지 않습니다.", "C": "시뮬레이션 결과라고 밝혔으므로 백테스트 사용 자체는 문제없습니다."}, "orig": "Mock 2 Session 1 Q43", "conf": false}, {"id": "mock2-Q44", "src": "정답", "module": "ETH", "tag": "Standard I(D): 개인 부채·합법 도박", "vig": 10, "stem": "With regard to his personal situation, does the assistant wealth manager violate the Standard relating to misconduct?", "opts": {"A": "No", "B": "Yes, because of his spending habits", "C": "Yes, because of his activity with friends"}, "ans": "A", "en": "A. No — Correct\nCorrect because, according to Standard I(D) Misconduct, Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit, or commit any act that reflects adversely on their professional reputation, integrity, or competence. Furthermore, although CFA Institute discourages any sort of unethical behavior by members and candidates, the Code and Standards are primarily aimed at conduct and actions related to a member's or candidate's professional life. For example, personal bankruptcy may not reflect on the integrity or trustworthiness of the person declaring bankruptcy, but if the circumstances of the bankruptcy involve fraudulent or deceitful business conduct, the bankruptcy may be a violation of this standard.\nIn this case, the assistant wealth manager has accumulated significant personal debt, but it is not a result of acts that reflect adversely on his professional reputation, integrity, or competence. Furthermore, the assistant wealth manager's participation in legal poker games with friends does not involve any illegal activity or affect his professional responsibilities.\nB. Yes, because of his spending habits — Incorrect\nIncorrect because, while the assistant wealth manager has accumulated significant personal debt, it is not a result of acts that reflect adversely on his professional reputation, integrity, or competence.\nC. Yes, because of his activity with friends — Incorrect\nIncorrect because the assistant wealth manager's participation in legal poker games with friends does not involve any illegal activity or affect his professional responsibilities.", "ko": "I(D)는 정직하지 않거나 사기적인 업무 관련 행위, 또는 직업적 평판·정직성·능력을 해치는 행위를 금지한다. 보조 매니저의 카드 빚은 나쁜 소비 습관 때문이지 사기나 기만 때문이 아니고, 친구들과의 포커는 합법이며 업무에 영향이 없다. 위반 아님.", "trap": "개인 빚·합법 활동 자체는 I(D) 위반이 아니다(사기·불법이 끼어야 위반).", "f": "", "why": {"B": "소비 습관으로 생긴 빚은 직업적 정직성·능력을 해치는 행위가 아닙니다.", "C": "합법적인 포커는 불법도 아니고 업무에 영향을 주지 않습니다."}, "orig": "Mock 2 Session 1 Q44", "conf": false}, {"id": "mock2-Q45", "src": "정답", "module": "QM", "tag": "Durbin–Watson 검정", "vig": 11, "stem": "Based on the Durbin–Watson test, the errors in the economic variable's trend model are:", "opts": {"A": "negatively serially correlated.", "B": "not serially correlated.", "C": "positively serially correlated."}, "ans": "C", "en": "A. negatively serially correlated. — Incorrect\nIncorrect because the Durbin–Watson statistic has a value of 0.54, which is lower than the lower critical value of dl = 1.246. Therefore, we can reject the null hypothesis that correlation is <= 0 and conclude that correlation > 0.\nB. not serially correlated. — Incorrect\nIncorrect because the Durbin–Watson statistic has a value of 0.54, which is lower than the lower critical value of dl = 1.246. Therefore, we can reject the null hypothesis that correlation is <= 0 and conclude that correlation > 0.\nC. positively serially correlated. — Correct\nCorrect because the Durbin–Watson statistic has a value of 0.54, which is lower than the lower critical value of dl = 1.246. Therefore, we can reject the null hypothesis that correlation is <= 0 and conclude that correlation > 0.", "ko": "DW 통계량 0.54가 하한 임계값 dl = 1.25보다 작다. DW < dl이면 '상관 ≤ 0'이라는 귀무가설을 기각하고 오차가 양(+)의 자기상관을 가진다고 결론 낸다. (DW ≈ 2이면 자기상관 없음, 0에 가까우면 양의 자기상관, 4에 가까우면 음의 자기상관.)", "trap": "DW가 작다 = 양의 자기상관. 음의 자기상관은 DW가 4에 가까울 때.", "f": "DW ≈ 2(1 − r), DW < dl → 양의 자기상관", "why": {"A": "음의 자기상관은 DW가 4 − dl보다 클 때입니다. 0.54는 양의 자기상관입니다.", "B": "DW가 dl보다 작아 '자기상관 없음'을 기각합니다."}, "orig": "Mock 2 Session 2 Q1", "conf": false}, {"id": "mock2-Q46", "src": "정답", "module": "QM", "tag": "AR(1) 평균회귀 수준", "vig": 11, "stem": "The 1-period-ahead forecast of Garnet's EPS is:", "opts": {"A": "below its mean-reverting level.", "B": "equal to its mean-reverting level.", "C": "above its mean-reverting level."}, "ans": "C", "en": "A. below its mean-reverting level. — Incorrect\nIncorrect because the mean-reverting level is incorrectly calculated as:\nxt = b0/b1\nwhere b0 and b1 are the parameter estimates from an AR(1) model specified as\nxt+1 = b0 + b1xt\nTaking the parameter estimates from the exhibit:\nb0 = 0.4485\nb1 = 0.4541\nThe incorrect mean-reverting level xt = 0.4485/0.4541 = 0.9877\nThe current value of 0.96 < the incorrect mean-reverting level of 0.9877.\nB. equal to its mean-reverting level. — Incorrect\nIncorrect because the mean-reverting level is incorrectly assumed to be the most recent value of 0.96, in which case the current value of 0.96 = the incorrect mean-reverting level of 0.96.\nC. above its mean-reverting level. — Correct\nCorrect because the mean-reverting level xt is given by:\nxt = b0/(1 – b1)\nwhere b0 and b1 are the parameter estimates from an AR(1) model specified as\nxt+1 = b0 + b1xt\nTaking the parameter estimates from the exhibit:\nb0 = 0.4485\nb1 = 0.4541\nThe mean-reverting level xt = 0.4485/(1 – 0.4541) = 0.8216\nThe AR(1) model predicts that the time series will stay the same if its current value is b0/(1 − b1), increase if its current value is below b0/(1 − b1), and decrease if its current value is above b0/(1 − b1).\nThe current value of 0.96 > the mean-reverting level of 0.8216, so we can expect the 1-period-ahead forecast to be above its mean-reverting level.\nNote that it is not necessary to calculate the 1-period-ahead forecast of 0.4485 + 0.4541 × 0.96 = 0.8844 to arrive at this conclusion.", "ko": "AR(1): x(t+1) = 0.4485 + 0.4541 x(t). 평균회귀 수준 = b0 / (1 − b1) = 0.4485 / (1 − 0.4541) = 0.8216. 현재 EPS 0.96은 이보다 높으므로 다음 기 예측은 평균 쪽으로 내려오지만 아직 평균보다는 위에 있다. 실제 예측값 = 0.4485 + 0.4541 × 0.96 = 0.8844 > 0.8216.", "trap": "평균회귀 수준은 b0/(1 − b1)이지 b0/b1이 아니다. 예측은 평균으로 다가가지만 넘어가지 않는다.", "f": "Mean-reverting level = b0 / (1 − b1)", "why": {"A": "평균회귀 수준을 b0/b1 = 0.9877로 잘못 계산했습니다.", "B": "최근 값 0.96을 평균회귀 수준으로 착각했습니다."}, "orig": "Mock 2 Session 2 Q2", "conf": true}, {"id": "mock2-Q47", "src": "정답", "module": "QM", "tag": "데이터 정제: non-uniformity error", "vig": 11, "stem": "Which variable in the excerpt of the machine-learning dataset has a non-uniformity error?", "opts": {"A": "Price", "B": "Type", "C": "Convertible"}, "ans": "C", "en": "A. Price — Incorrect\nIncorrect because, although the price data in the exhibit do not have the same values for each observation, they are all presented in the same format.\nNon-uniformity error is where the data are not present in an identical format.\nB. Type — Incorrect\nIncorrect because type has an inaccuracy error, not a non-uniformity error. One of the observations is marked \"trade\" and is not labeled as a \"buy\" or a \"sell.\"\nNon-uniformity error is where the data are not present in an identical format.\nInaccuracy error is where the data are not a measure of true value. This can be rectified with the help of business records and administrators.\nC. Convertible — Correct\nCorrect because non-uniformity error is where the data are not present in an identical format. The convertible data in the exhibit are presented as \"Yes\" and \"y\" as well as \"N,\" \"no,\" and \"No.\" This error would be resolved by converting the data to a standard format.", "ko": "non-uniformity error는 같은 뜻의 데이터가 서로 다른 형식으로 적힌 것이다. Convertible 열에 'Yes', 'y', 'N', 'no', 'No'가 섞여 있어 형식이 통일되지 않았다. Type 열의 'Trade'는 buy/sell이 아닌 잘못된 값이라 inaccuracy error다. Price는 값이 달라도 형식은 같다.", "trap": "형식이 제각각 = non-uniformity, 값 자체가 틀림 = inaccuracy.", "f": "", "why": {"A": "Price는 값만 다르고 형식은 모두 같습니다.", "B": "Type의 'Trade'는 형식 문제가 아니라 틀린 값(inaccuracy error)입니다."}, "orig": "Mock 2 Session 2 Q3", "conf": false}, {"id": "mock2-Q48", "src": "정답", "module": "QM", "tag": "confusion matrix: accuracy", "vig": 11, "stem": "The confusion matrix indicates that model accuracy is closest to:", "opts": {"A": "0.64.", "B": "0.70.", "C": "0.78."}, "ans": "B", "en": "A. 0.64. — Incorrect\nIncorrect because this is model precision, not accuracy. Precision is the ratio of correctly predicted positive classes to all predicted positive classes.\nPrecision (P) = TP/(TP + FP)\nFor classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.\nFrom the case:\nTP = 70\nFP = 40\nPrecision = 70/(70 + 40) = 70/110 = 0.6364 ≈ 0.64\nB. 0.70. — Correct\nCorrect because accuracy is the percentage of correctly predicted classes out of total predictions.\nAccuracy = (TP + TN)/(TP + FP + TN + FN)\nFor classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.\nFrom the case:\nTP = 70\nTN = 70\nFP = 40\nFN = 20\nAccuracy = (70 + 70)/(70 + 40 + 70 + 20) = 140/200 = 0.70\nC. 0.78. — Incorrect\nIncorrect because this is model recall, not accuracy. Recall (also known as sensitivity) is the ratio of correctly predicted positive classes to all actual positive classes.\nRecall (R) = TP/(TP + FN)\nFor classification problems, error analysis involves computing four basic evaluation metrics: true positive (TP), false positive (FP), true negative (TN), and false negative (FN) metrics. FP is also called a Type I error, and FN is also called a Type II error.\nFrom the case:\nTP = 70\nFN = 20\nRecall = 70/(70 + 20) = 70/90 = 0.7778 ≈ 0.78", "ko": "TP = 70(예측 buy·실제 buy), FP = 40(예측 buy·실제 sell), FN = 20(예측 sell·실제 buy), TN = 70. Accuracy = (TP + TN) / 전체 = (70 + 70) / 200 = 0.70.", "trap": "precision(0.64), recall(0.78)과 헷갈리지 않는다.", "f": "Accuracy = (TP + TN)/(TP + FP + TN + FN), Precision = TP/(TP + FP), Recall = TP/(TP + FN)", "why": {"A": "precision = 70/110입니다.", "C": "recall = 70/90입니다."}, "orig": "Mock 2 Session 2 Q4", "conf": false}, {"id": "mock2-Q49", "src": "정답", "module": "FI", "tag": "이항트리로 callable bond 가치", "vig": 12, "stem": "Based on the binomial interest rate tree, the value of Bond 2 is closest to:", "opts": {"A": "$98.66.", "B": "$102.56.", "C": "$103.16."}, "ans": "B", "en": "A. $98.66. — Incorrect\nIncorrect because this is the value of a 4.20% annual-coupon, 2-year bond non-callable bond where the coupon payment at the end of year 1 is omitted, i.e., the value at the end of year 1 is not changed to the call price.\nEnd of Year 0\tEnd of Year 1\tEnd of Year 2\n\tt1,H = 4.96%\tCF = 104.20\nValue = 98.655\tValue = 99.276\t\n\tCF = 0.00\tCF = 104.20\nt0 = 1.25%\tt1,L = 3.68%\t\n\tValue =100.502\tCF = 104.20\nwhere: CF is the bond's cash flow at the end of the year.\nB. $102.56. — Correct\nCorrect because the value of the 2-year callable bond equals the present value of future cash flows where in any year if the price is greater than 100, the bond will be called.\nThe value at the end of year 1 at t1,H = 4.96% equals ((104.20 + 104.20)/2)/(1.0496) = 99.276, where 104.20 is the total cash flow at maturity (Par = 100 and coupon = 4.20).\nThe value at the end of year 1 at t1,L = 3.68% equals ((104.2 + 104.2)/2)/(1.0368) = 100.502. As this bond is callable at the end of year 1 at par, the value is set to 100.\nThe value at the end of year 0 equals:\n[((99.276 + 100)/2) + 4.20]/1.0125 = 102.56, where 1.0125% is 1 plus the spot rate at the end of year 0.\nEnd of Year 0\tEnd of Year 1\tEnd of Year 2\n\tt1,H = 4.96%\tCF = 104.20\nValue = 102.556\tValue = 99.276\t\n\tCF = 4.20\tCF = 104.20\nt0 = 1.25%\tt1,L = 3.68%\t\n\tValue = 100.502 100\tCF = 104.20\nwhere: CF is the bond's cash flow at the end of the year.\nC. $103.16. — Incorrect\nIncorrect because this is the value that would be derived if the bond was assumed to be putable rather than callable bond. In the case of a putable bond the price at the end of Year 1 at t1,H = 4.96% would be set equal to 100.\nEnd of Year 0\tEnd of Year 1\tEnd of Year 2\n\tt1,H = 4.96%\tCF = 104.20\nValue = 103.161\tValue = 99.276 100\t\n\tCF = 4.20\t\nt0 = 1.25%\tt1,L = 3.68%\tCF = 104.20\n\tValue = 100.502\t\n\t\tCF = 104.20\nwhere: CF is the bond's cash flow at the end of the year.", "ko": "Year 1 높은 금리 노드(4.96%): 104.20 / 1.0496 = 99.276 (100보다 작아 콜 안 함). 낮은 금리 노드(3.68%): 104.20 / 1.0368 = 100.502 → 콜 가격 100으로 자른다. Year 0: [(99.276 + 100)/2 + 4.20] / 1.0125 = (99.638 + 4.20) / 1.0125 = 102.56.", "trap": "콜 가능 노드에서 값을 콜 가격(100)으로 자르고, Year 1 쿠폰 4.20도 더한다.", "f": "노드 값 = [(V_up + V_down)/2 + 쿠폰] / (1 + r), callable은 노드 값 = min(값, 콜 가격)", "why": {"A": "Year 1 쿠폰을 빼먹고 콜 가격으로 자르지도 않았습니다.", "C": "putable로 보고 높은 금리 노드 값을 100으로 올렸습니다."}, "orig": "Mock 2 Session 2 Q5", "conf": false}, {"id": "mock2-Q50", "src": "정답", "module": "FI", "tag": "변동성 하락과 옵션부채권", "vig": 12, "stem": "The value of which bond will most likely decrease under Polti's Scenario 1?", "opts": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}, "ans": "C", "en": "A. Bond 1 — Incorrect\nIncorrect because Bond 1 is option-free and the value is unaffected by changes in the assumed level of interest rate volatility.\nB. Bond 2 — Incorrect\nIncorrect because Bond 2 is a callable bond and as such is short the call option therefore the value of Bond 2 will increase when the assumed level of interest rate volatility decreases.\nC. Bond 3 — Correct\nCorrect because a decrease in the assumed level of interest rate volatility will decrease the value of both the embedded put and call options. Because the value of a putable bond is equal to the value of the straight bond plus the value of the embedded put option, Bond 3 will decrease when volatility falls. Because the value of a callable bond is equal to the value of the straight bond minus the value of the embedded call option, the price of Bond 2 will increase when volatility falls. Bond 1 is option free and the price is unaffected by changes in the assumed level of interest rate volatility.", "ko": "변동성이 낮아지면 내재된 콜·풋 옵션 가치가 모두 줄어든다. putable = 일반채권 + 풋 → 풋 가치가 줄어 Bond 3 가치 하락. callable = 일반채권 − 콜 → 콜 가치가 줄어 Bond 2 가치 상승. option-free(Bond 1)는 변동성과 무관하다.", "trap": "변동성 ↓ → callable ↑, putable ↓.", "f": "V_callable = V_straight − V_call, V_putable = V_straight + V_put", "why": {"A": "옵션이 없는 채권은 변동성 가정에 영향을 받지 않습니다.", "B": "callable은 콜을 판 상태라 콜 가치가 줄면 오히려 가치가 오릅니다."}, "orig": "Mock 2 Session 2 Q6", "conf": false}, {"id": "mock2-Q51", "src": "정답", "module": "FI", "tag": "수익률곡선 평탄화와 내재 옵션", "vig": 12, "stem": "Under Polti's Scenario 2, the value of the embedded option would be expected to increase in which of the following bonds?", "opts": {"A": "Bond 2 only", "B": "Bond 3 only", "C": "Both Bond 2 and Bond 3"}, "ans": "A", "en": "A. Bond 2 only — Correct\nCorrect because Bond 2 is a callable bond and all else being equal, the value of the call option increases as the yield curve flattens. The intuition to explain the effect of the shape of the yield curve on the value of the call option is as follows. When the yield curve is upward sloping, the one-period forward rates on the interest rate tree are high and opportunities for the issuer to call the bond are fewer. When the yield curve flattens or inverts, many nodes on the tree have lower forward rates that increase the opportunities to call.\nB. Bond 3 only — Incorrect\nIncorrect because Bond 3 is a putable bond and all else being equal, the value of the put option decreases as the yield curve moves from being upward sloping, to flat, to downward sloping. When the yield curve is upward sloping, the one-period forward rates in the interest rate tree are high, which creates more opportunities for the investor to put the bond. As the yield curve flattens or inverts, the number of opportunities declines.\nC. Both Bond 2 and Bond 3 — Incorrect\nIncorrect because while the value of the embedded option in Bond 2, the callable bond, would be expected to increase, the value of the embedded option in Bond 3, the putable bond, would be expected to decrease.", "ko": "장기금리가 더 많이 떨어져 곡선이 평탄해지면 트리의 미래 선도금리가 낮아진다. 금리가 낮은 노드가 많아지면 발행자가 콜할 기회가 늘어 콜 옵션 가치가 오른다(Bond 2). 반대로 풋은 금리가 높을 때 행사하므로 기회가 줄어 풋 가치가 내려간다(Bond 3).", "trap": "곡선 평탄/역전 → 콜 가치 ↑, 풋 가치 ↓. 우상향 곡선 → 콜 ↓, 풋 ↑.", "f": "", "why": {"B": "평탄해지면 풋 행사 기회가 줄어 풋 가치는 떨어집니다.", "C": "콜 가치만 오르고 풋 가치는 떨어집니다."}, "orig": "Mock 2 Session 2 Q7", "conf": true}, {"id": "mock2-Q52", "src": "정답", "module": "FI", "tag": "전환사채 최저 가치", "vig": 12, "stem": "The minimum value of the ZXEL Corp. convertible bond is closest to:", "opts": {"A": "$990.", "B": "$1,000.", "C": "$1,081."}, "ans": "C", "en": "A. $990. — Incorrect\nIncorrect because this is the value of the underlying option-free bond which is lower than the conversion value of $1,081.\nB. $1,000. — Incorrect\nIncorrect because this is the conversion ratio multiplied by the initial conversion price = 23 × $43.47 = $1,000. (The initial conversion price is 1,000/23.) This is also the par value of the bond.\nC. $1,081. — Correct\nCorrect because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond.\nThe conversion value equals the underlying share price × conversion ratio = $47 × 23 = $1,081\nThe value of the underlying option-free bond is lower at $990. Thus, the minimum value of the convertible bond is $1,081.", "ko": "전환사채의 최저 가치 = max(전환가치, 일반채권 가치). 전환가치 = 주가 × 전환비율 = $47 × 23 = $1,081. 일반채권 가치 $990보다 크므로 최저 가치는 $1,081.", "trap": "액면(1,000)이나 일반채권 가치(990)가 아니라 둘 중 큰 것.", "f": "Minimum value = max(Conversion value, Straight bond value), Conversion value = S × CR", "why": {"A": "일반채권 가치이지만 전환가치 1,081보다 작습니다.", "B": "액면이자 최초 전환가격 × 전환비율이며 현재 가치와 관계없습니다."}, "orig": "Mock 2 Session 2 Q8", "conf": false}, {"id": "mock2-Q53", "src": "정답", "module": "ETH", "tag": "Standard I(A): 법 vs Code", "vig": 13, "stem": "In the event of a conflict of rules or regulations at work, Lee must adhere to the:", "opts": {"A": "Code and Standards.", "B": "securities laws and regulations of Caldecott's country.", "C": "securities laws and regulations of Lee's home country."}, "ans": "A", "en": "A. Code and Standards. — Correct\nCorrect because Standard I(A) Knowledge of the Law requires members to understand the applicable laws and regulations of the jurisdictions where they engage in. Since applicable law states that the law of the locality where the business is conducted governs and local law is less strict than the Code and Standards, the member must adhere to the Code and Standards.\nIf applicable law is stricter than the requirements of the Code and Standards, members and candidates must adhere to applicable law; otherwise, they must adhere to the Code and Standards.\nSince the law of locality where business is conducted governs AND it (Caldecott's country's law) is less strict than the Code and Standards, Lee has to abide by the Code and Standards.\nB. securities laws and regulations of Caldecott's country. — Incorrect\nIncorrect because the applicable law in Caldecott's country is less strict than the Code and Standards. Based on Standard I(A) Knowledge of the Law, Lee must therefore adhere to the Code and Standards.\nC. securities laws and regulations of Lee's home country. — Incorrect\nIncorrect because the applicable law states that the law of the locality where the business is conducted governs. Based on Standard I(A) Knowledge of the Law, since business is conducted in Caldecott's country, Lee must adhere to the Code and Standards, which are stricter than the laws of Caldecott's country.\nThis choice might be correct if Lee were conducting business with another resident of her home country. However, Caldecott's clients are based in Caldecott's country.", "ko": "두 나라 모두 '사업이 이뤄지는 곳의 법'을 따르도록 한다. Caldecott의 고객은 모두 Caldecott 나라에 있으므로 그 나라 법이 적용되는데, 이 법은 Code and Standards보다 느슨하다. 법이 더 느슨하면 더 엄격한 Code and Standards를 따른다. Lee가 사는 나라의 엄격한 법은 여기 적용되지 않는다.", "trap": "적용되는 법(사업 장소 = Caldecott 나라)을 먼저 정한 뒤, 그 법과 Code 중 더 엄격한 쪽.", "f": "", "why": {"B": "Caldecott 나라 법은 Code보다 느슨해 Code를 따라야 합니다.", "C": "사업이 Caldecott 나라에서 이뤄지므로 Lee의 거주국 법은 적용되지 않습니다."}, "orig": "Mock 2 Session 2 Q9", "conf": false}, {"id": "mock2-Q54", "src": "정답", "module": "ETH", "tag": "Standard V(B): 사실과 의견 구분", "vig": 13, "stem": "In the memo regarding the ESG screening process, does Lee violate the Standard relating to communication with clients and prospective clients?", "opts": {"A": "No", "B": "Yes, because Lee fails to appropriately separate fact from opinion", "C": "Yes, because Lee fails to sufficiently communicate the risks associated with the screening process"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because the memo fails to appropriately distinguish opinion from fact. Standard V(B) Communications with Clients and Prospective Clients requires that opinion be separated from fact.\nB. Yes, because Lee fails to appropriately separate fact from opinion — Correct\nCorrect because the memo states as a fact that the new process will guarantee superior returns. Standard V(B) Communications with Clients and Prospective Clients requires that opinion be separated from fact.\nThe statement will guarantee superior returns cannot be a fact for risky stock investments. Moreover, as highlighted in the risks section, alternative existing ESG selection processes contradict (that is, recommend keeping stocks that Caldecott's process recommends to sell). Lee should have expressed the statement as an opinion, such as by including we believe this will boost returns.\nC. Yes, because Lee fails to sufficiently communicate the risks associated with the screening process — Incorrect\nIncorrect because the memo communicates significant risks including the key risk that the recommendations are subjective and may be contradicted by other ESG screens. According to Standard V(B) Communications with Clients and Prospective Clients, members and candidates must outline to clients and prospective clients significant risks and limitations of the analysis contained in their investment products or recommendations. The memo discusses significant risks of the new process and is therefore compliant with Standard V(B).", "ko": "Lee의 메모는 ESG 절차의 주관성과 다른 ESG 방법과 결론이 다를 수 있다는 위험을 밝혔으므로 위험 공시는 충분하다. 하지만 '이 절차가 우수한 수익을 보장한다(guarantee superior returns)'고 사실처럼 썼다. 주식 투자에서 수익 보장은 사실일 수 없으므로 의견으로 표현해야 했다('we believe…'). 사실과 의견을 구분하지 않아 V(B) 위반.", "trap": "위험은 잘 적었다. 문제는 '보장한다'는 표현.", "f": "", "why": {"A": "수익 보장을 사실처럼 적어 사실과 의견을 구분하지 못했습니다.", "C": "메모는 주관성 등 중요한 위험을 충분히 밝혔습니다."}, "orig": "Mock 2 Session 2 Q10", "conf": false}, {"id": "mock2-Q55", "src": "정답", "module": "ETH", "tag": "Standard V(C): 기록 보관", "vig": 13, "stem": "Lee violates the Standard relating to record retention with respect to the:", "opts": {"A": "sell trades.", "B": "buy trades.", "C": "trade record retention period."}, "ans": "A", "en": "A. sell trades. — Correct\nCorrect because Lee did not keep records for the executed sell trades. Standard V(C) Record Retention requires members to retain their own records to support their investment decisions. The automatically generated sell recommendations from Caldecott's software are insufficient to explain why trades were executed.\nLee needs to retain her own documentation that supports her decision for sell trades in the selected accounts.\nMembers and candidates must, however, archive research notes and other documents, either electronically or in hard copy, that support their current investment-related communications. Doing so will assist their firms in complying with requirements for preservation of internal or external records.\nB. buy trades. — Incorrect\nIncorrect because Standard V(C) Record Retention only requires Lee to maintain appropriate records to support her investment actions. Lee prepares notes justifying the buy trades executed in the client accounts. Her notes are likely sufficient to explain the decisions to increase each stock's weight in the client accounts.\nC. trade record retention period. — Incorrect\nIncorrect because this is a CFA Institute recommendation only in the absence of regulatory guidance or firm policies. It is not a must do for Lee to impose this requirement on her employer.\nAs per the guidance to Standard V(C) Record Retention, in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years.", "ko": "Lee는 소프트웨어가 자동으로 낸 매도 추천이라는 이유로 매도 거래 기록을 남기지 않았다. V(C)는 투자 결정을 뒷받침하는 자신의 기록을 보관하라고 요구하고, 자동 추천만으로는 왜 매매했는지 설명되지 않는다 → 매도 거래가 위반. 매수 거래는 근거 노트를 남겼으므로 OK. 7년 보관은 규제·회사 정책이 없을 때의 권장일 뿐이고, 여기는 5년 규제 기준이 있다.", "trap": "자동화된 추천도 기록을 남겨야 한다. 7년은 권장 사항.", "f": "", "why": {"B": "매수 거래는 근거 노트를 작성해 보관했습니다.", "C": "7년은 규제나 회사 정책이 없을 때의 권장이라 의무가 아닙니다."}, "orig": "Mock 2 Session 2 Q11", "conf": false}, {"id": "mock2-Q56", "src": "정답", "module": "ETH", "tag": "Standard VI(A): 이해상충 공시", "vig": 13, "stem": "With respect to the university, does Lee violate the Standard relating to disclosure of conflicts?", "opts": {"A": "No", "B": "Yes, by failing to disclose the retirement plan investment", "C": "Yes, by failing to disclose her position on the board of trustees"}, "ans": "C", "en": "A. No — Incorrect\nIncorrect because Standard VI(A) Disclosure of Conflicts requires Lee to disclose to her employer her involvement with the university's board of trustees. Lee's new role as a trustee can reasonably be expected to be time consuming, to the possible detriment of Lee's responsibilities at Caldecott, at least in the first year.\nB. Yes, by failing to disclose the retirement plan investment — Incorrect\nIncorrect because the application of Standard VI(A) Disclosure of Conflicts would not require Lee to disclose her personal or retirement investments in large diversified mutual funds, unless specifically required by her employer.\nC. Yes, by failing to disclose her position on the board of trustees — Correct\nCorrect because, by failing to inform Caldecott of her involvement with the university board of trustees, Lee has violated Standard VI(A) Disclosure of Conflicts. Members and Candidates must avoid or make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Lee's new role as a trustee can reasonably be expected to be time consuming, and possibly interfere with or affect Lee's responsibilities at Caldecott.", "ko": "Lee는 무보수지만 첫해 시간이 많이 드는 대학 이사회 자리를 Caldecott에 알리지 않았다. 고용주에 대한 의무를 방해할 수 있는 일이라 공시해야 하므로 VI(A) 위반. 은퇴연금을 경쟁사의 대형 분산 뮤추얼펀드에 넣은 것은 회사가 특별히 요구하지 않는 한 공시할 필요가 없다.", "trap": "무보수라도 시간이 많이 드는 외부 직위는 공시. 대형 분산 펀드 투자는 공시 불필요.", "f": "", "why": {"A": "시간이 많이 드는 이사회 자리를 알리지 않아 위반입니다.", "B": "대형 분산 뮤추얼펀드에 대한 개인·은퇴 투자는 공시 대상이 아닙니다."}, "orig": "Mock 2 Session 2 Q12", "conf": true}, {"id": "mock2-Q57", "src": "정답", "module": "CI", "tag": "Grinold-Kroner ERP", "vig": 14, "stem": "Using the Grinold-Kroner model, the estimated ERP is:", "opts": {"A": "2.5%.", "B": "2.9%.", "C": "5.9%."}, "ans": "B", "en": "A. 2.5%. — Incorrect\nIncorrect because the change in shares outstanding was added rather than subtracted, consequently:\nERP = [DY + Δ(P/E) + i + g + ΔS] – E(rf) = [1.8% + 0.0% + 1.3% + 2.6% + (–0.2%)] – 3.0% = 2.5%\nB. 2.9%. — Correct\nCorrect because the ERP is calculated as ERP = [DY + Δ(P/E) + i + g – ΔS] – E(rf),\nwhere:\nDY = expected income component (dividend yield)\nΔ(P/E) = expected growth rate in P/E ratio\ni = expected inflation\ng = expected growth rate in real earnings per share (proxy for GDP growth)\nΔS = expected percentage change in shares outstanding\nE(rf) = risk free rate\n= [1.8% + 0.0% + 1.3% + 2.6% –(–0.2%)] – 3.0% = 2.9%\nC. 5.9%. — Incorrect\nIncorrect because the risk-free rate was incorrectly omitted from the calculation, consequently:\nERP = [DY + Δ(P/E) + i + g – ΔS] - E(rf) = [1.8% + 0.0% + 1.3% + 2.6% – (–0.2%)] = 5.9%", "ko": "기대 주식수익률 = 배당수익률 + P/E 변화율 + 인플레이션 + 실질 이익성장 − 주식수 변화율 = 1.8 + 0.0 + 1.3 + 2.6 − (−0.2) = 5.9%. ERP = 5.9 − 무위험이자율 3.0 = 2.9%.", "trap": "주식수 변화는 빼야 한다(−(−0.2) = +0.2). 마지막에 rf도 뺀다.", "f": "ERP = [DY + Δ(P/E) + i + g − ΔS] − rf", "why": {"A": "주식수 변화(−0.2%)를 빼지 않고 더했습니다.", "C": "무위험이자율을 빼지 않아 기대 주식수익률을 답했습니다."}, "orig": "Mock 2 Session 2 Q13", "conf": false}, {"id": "mock2-Q58", "src": "정답", "module": "CI", "tag": "matrix pricing: 보간", "vig": 14, "stem": "Using matrix pricing, the estimate for GameDay's current cost of debt is closest to:", "opts": {"A": "5.86%.", "B": "5.95%.", "C": "6.14%."}, "ans": "B", "en": "A. 5.86%. — Incorrect\nIncorrect because this is simply the average of the 2-year YTM (5.57%) and 5-year (6.14%) that Gunning has observed, i.e. (5.57% + 6.14%) / 2 = 5.855% ≈ 5.86%.\nB. 5.95%. — Correct\nCorrect because matrix pricing has been correctly applied. Gunning has observed the average YTM on BBB-rated bonds for the 2-year maturity to be 5.57% and the 5-year maturity to be 6.14%. There is a difference in YTM of 0.57% (6.14% – 5.57%). Using interpolation this is applied at a rate of 0.19% per year (0.57% / 3 years). Since Gunning has the 2-year YTM and requires the 4-year YTM, this is 2-year YTM + 2-years of adjustment = 5.57% + 2 × 0.19% = 5.95%.\nC. 6.14%. — Incorrect\nIncorrect because this is simply the 5-year YTM, the closest maturity to GameDay's 4-year bond to which Gunning has available information.", "ko": "2년 5.57%, 5년 6.14%. 3년 차이에 0.57% 차이이므로 1년당 0.19%. 4년물은 2년에서 2년 더 → 5.57% + 2 × 0.19% = 5.95%.", "trap": "단순 평균(5.86%)이 아니라 만기 거리에 비례해 보간한다.", "f": "y(4) = y(2) + (4 − 2)/(5 − 2) × [y(5) − y(2)]", "why": {"A": "2년·5년 수익률을 단순 평균했습니다.", "C": "가장 가까운 5년 수익률을 그대로 썼습니다."}, "orig": "Mock 2 Session 2 Q14", "conf": false}, {"id": "mock2-Q59", "src": "정답", "module": "CI", "tag": "comparable transactions 가중 평가", "vig": 14, "stem": "Based on the comparable transactions method used by Gunning, the StopGap acquisition was:", "opts": {"A": "underpriced.", "B": "fairly priced.", "C": "overpriced."}, "ans": "B", "en": "A. underpriced. — Incorrect\nIncorrect because the acquisition price of $33.80 was within $1 of the price per share calculated using the comparable transactions method.\nB. fairly priced. — Correct\nCorrect because the acquisition price of $33.80 was within $1 of the price per share calculated using the comparable transactions method as shown below.:\n\tAcquired Co.\tMean Multiple Paid for Comparable Transactions\tEstimate Value Based on Comparables\tWeight\tWeighted Estimates\nEarnings per share\t$2.20\t16.2\t$35.64\t25%\t$8.91\nBook value per share\t$8.40\t2.9\t$24.36\t25%\t$6.09\nSales per share\t$17.90\t2.1\t$37.59\t50%\t$18.795\n\t\tWeighted Average Estimate\t\t\t$33.795 (rounded to $33.80)\nC. overpriced. — Incorrect\nIncorrect because the acquisition price of $33.80 was within $1 of the price per share calculated using the comparable transactions method.", "ko": "P/E: 2.20 × 16.2 = 35.64 (가중치 25% → 8.91). P/B: 8.40 × 2.9 = 24.36 (25% → 6.09). P/S: 17.90 × 2.1 = 37.59 (50% → 18.795). 합계 = $33.795 ≈ $33.80. 인수가 $33.80은 추정치에서 $1 이내 → 적정 가격.", "trap": "P/S에 50%, 나머지 둘에 25%씩. 단순 평균하지 않는다.", "f": "가중 추정가 = Σ (배수 × 대상회사 지표 × 가중치)", "why": {"A": "인수가가 추정치와 $1 이내라 저평가가 아닙니다.", "C": "인수가가 추정치와 $1 이내라 고평가가 아닙니다."}, "orig": "Mock 2 Session 2 Q15", "conf": false}, {"id": "mock2-Q60", "src": "정답", "module": "CI", "tag": "spinoff vs divestiture", "vig": 14, "stem": "Compared to accepting the divestment offer, GameDay should choose to spinoff the Southern segment to:", "opts": {"A": "obtain a higher valuation.", "B": "receive more in proceeds.", "C": "ensure the valuation is definitive."}, "ans": "A", "en": "A. obtain a higher valuation. — Correct\nCorrect because Gunning believes that the spinoff will achieve a value of $1.96 billion (14 × $140 million), which is higher than the offer of $1.6 billion received from the rival firm.\nB. receive more in proceeds. — Incorrect\nIncorrect because in a spin off, the investor receives the divested business's equity and must value it and make an investment decision; the parent receives less in proceeds.\nC. ensure the valuation is definitive. — Incorrect\nIncorrect because the acquisition values Southern at $1.6 billion as opposed to the $1.96 billion (14 × $140 million) that Gunning believes the spinoff will achieve. An advantage of a sale is that the valuation is definitive and is not at risk if there is a capital market correction.", "ko": "spinoff 예상 가치 = 14 × $140m = $1.96bn으로 매각 제안 $1.6bn보다 높다 → 더 높은 가치평가. 하지만 spinoff는 주주가 새 회사 주식을 받는 것이라 모회사가 현금을 받지 않고, 시장 상황에 따라 가치가 바뀐다. 현금 수입과 확정된 가치는 매각의 장점이다.", "trap": "spinoff는 현금 수입이 없다. '확정된 가치'는 매각의 장점.", "f": "Spinoff value = EV/EBITDA × EBITDA", "why": {"B": "spinoff는 주주에게 주식을 나눠주는 것이라 모회사가 받는 현금은 오히려 적습니다.", "C": "가치가 확정되는 것은 매각(sale)의 장점입니다."}, "orig": "Mock 2 Session 2 Q16", "conf": false}, {"id": "mock2-Q61", "src": "정답", "module": "FI", "tag": "swap rate vs Treasury rate", "vig": 15, "stem": "Which of Russo's comments are correct regarding differences between Treasury rates and swap rates?", "opts": {"A": "Comment 1 only", "B": "Comment 2 only", "C": "Both Comment 1 and Comment 2"}, "ans": "A", "en": "A. Comment 1 only — Correct\nCorrect because the key difference between the swap rate and the government bond rate is that the swap rate is derived using short-term lending rates rather than default-risk-free rates.\nB. Comment 2 only — Incorrect\nIncorrect because arbitrage between Treasury bonds and swaps cannot be perfectly executed and does not represent the difference in rates. The Treasury rate can differ from the swap rate for the same term for several reasons. Unlike the cash flows from US Treasury bonds, the cash flows from swaps are subject to greater default risk. Market liquidity for specific maturities may differ. For example, some parts of the term structure of interest rates may be more actively traded with swaps than with Treasury bonds.\nC. Both Comment 1 and Comment 2 — Incorrect\nIncorrect because only Comment 1 is a valid statement.", "ko": "스왑금리는 무위험 금리가 아니라 단기 대출 금리(은행 신용위험 포함)를 바탕으로 만들어진다. 그래서 같은 만기여도 국채금리와 차이가 나며, 원인은 신용(default) 위험과 유동성 차이다 → Comment 1 맞음. 국채와 스왑 사이 차익거래는 완벽하게 할 수 없어 차이가 작다고 할 수 없다 → Comment 2 틀림.", "trap": "스왑-국채 차이는 차익거래로 없어지지 않는다.", "f": "", "why": {"B": "차익거래가 완벽하지 않아 차이가 작다는 말은 틀렸습니다.", "C": "Comment 2는 틀렸습니다."}, "orig": "Mock 2 Session 2 Q17", "conf": false}, {"id": "mock2-Q62", "src": "오답", "module": "FI", "tag": "spot rate로 선도금리 f(1,1)", "vig": 15, "stem": "The forward rate for a 1-year zero-coupon government bond issued one year from today is closest to:", "opts": {"A": "3.32%.", "B": "3.43%.", "C": "3.55%."}, "ans": "A", "en": "A. 3.32%. — Correct\nCorrect because using the Treasury spot rates provided in the Exhibit and the forward rate model, the forward rate for a one-year zero issued one year from today would be:\n(1 + z2)^2= (1 + z1)^1(1 + f1,1)^1\n(1 + 0.0310)^2= (1 + 0.0288)^1(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0310)^2/(1 + 0.0288)^1 – 1\n(1 + f1,1)^1= 1.0629/1.0288 – 1\n(1 + f1,1)^1= 0.0332.\nB. 3.43%. — Incorrect\nIncorrect because this response calculates the one-year forward rate in two years (rather than in one year). Using the forward rate model with these incorrect assumptions, the forward rate would be:\n(1 + z3)^3= (1 + z2)^2(1 + f1,1)^1\n(1 + 0.0321)^3= (1 + 0.0310)^2(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0321)^3/(1 + 0.0310)^2 – 1\n(1 + f1,1)^1= 1.099424/1.062961 – 1\n(1 + f1,1)^1= 0.034304.\nC. 3.55%. — Incorrect\nIncorrect because this response uses the swap rates instead of spot rates:\n(1 + z2)^2= (1 + z1)^1(1 + f1,1)^1\n(1 + 0.0326)^2= (1 + 0.0297)^1(1 + f1,1)^1\n(1 + f1,1)^1= (1 + 0.0326)^2 /(1 + 0.0297)^1 – 1\n(1 + f1,1)^1= 1.0663/1.0297 – 1\n(1 + f1,1)^1= 0.0355.", "ko": "국채 spot rate를 쓴다. (1 + z2)² = (1 + z1)(1 + f1,1) → 1 + f = 1.0310² / 1.0288 = 1.06296 / 1.0288 = 1.0332 → f(1,1) = 3.32%.", "trap": "스왑금리가 아니라 국채 spot rate. 1년 뒤 시작하는 1년물은 z1과 z2로 구한다.", "f": "(1 + z2)² = (1 + z1)(1 + f1,1)", "why": {"B": "z2와 z3으로 계산한 2년 뒤 시작하는 1년 선도금리(f2,1)입니다.", "C": "국채 spot rate 대신 스왑금리를 썼습니다."}, "orig": "Mock 2 Session 2 Q18", "conf": false}, {"id": "mock2-Q63", "src": "정답", "module": "FI", "tag": "segmented markets theory", "vig": 15, "stem": "The term structure theory that Russo accepts is best described as the:", "opts": {"A": "local expectations theory.", "B": "liquidity preference theory.", "C": "segmented markets theory."}, "ans": "C", "en": "A. local expectations theory. — Incorrect\nIncorrect because the local expectations theory contends that the expected return for every bond over short periods is the risk-free rate. This results from an assumed no-arbitrage condition in which bond pricing does not allow for traders to earn arbitrage profits.\nB. liquidity preference theory. — Incorrect\nIncorrect because liquidity preference theory asserts that liquidity premiums exist to compensate investors for the added interest rate risk they face when lending long term and that these premiums increase with maturity. It is not a term structure theory.\nC. segmented markets theory. — Correct\nCorrect because the segmented markets theory allows for lender and borrower preferences to influence the shape of the yield curve. The result is that yields are not a reflection of expected spot rates or liquidity premiums. Rather, they are solely a function of the supply and demand for funds of a particular maturity. That is, each maturity sector can be thought of as a segmented market in which yield is determined independently from the yields that prevail in other maturity segments.", "ko": "'수익률은 오직 각 만기의 자금 수요와 공급으로 정해진다'는 것이 segmented markets theory다. 만기별 시장이 따로 나뉘어 다른 만기의 수익률과 독립적으로 정해진다고 본다. local expectations는 짧은 기간 모든 채권의 기대수익률이 무위험이자율이라는 이론, liquidity preference는 장기일수록 유동성 프리미엄이 붙는다는 이론이다.", "trap": "'solely supply and demand at a particular maturity' = segmented markets.", "f": "", "why": {"A": "local expectations는 짧은 기간 기대수익률이 무위험이자율이라는 이론입니다.", "B": "liquidity preference는 만기가 길수록 커지는 유동성 프리미엄을 말합니다."}, "orig": "Mock 2 Session 2 Q19", "conf": false}, {"id": "mock2-Q64", "src": "정답", "module": "FI", "tag": "key rate duration으로 가치 변화", "vig": 15, "stem": "The percentage change in value on the real estate portfolio is closest to:", "opts": {"A": "–0.888%.", "B": "–0.515%.", "C": "0.888%."}, "ans": "A", "en": "A. –0.888%. — Correct\nCorrect because an increase in interest rates would lead to a decline in the expected value. The proportional change in value is calculated using the key rate duration (KeyDur) and change in yield (Δz) for each given maturity:\n= –KeyDur1Δz1 – KeyDur5Δ z5 – KeyDur10Δ z10\n= –0.444(0.0018) – 0.5129(0.0035) – 1.103(0.0057) = –0.888%.\nB. –0.515%. — Incorrect\nIncorrect because this response is incorrectly calculated using a 25 basis point change for all maturities: –0.444(0.0025) – 0.5129(0.0025) – 1.103(0.0025) = 0.515%.\nC. 0.888%. — Incorrect\nIncorrect because an increase in interest rates would lead to a decline, rather than an increase, in the expected value.\nResponse incorrectly calculated as 0.444(0.0018) + 0.5129(0.0035) + 1.103(0.0057) = 0.888%.", "ko": "만기별로 key rate duration × 금리 변화를 더한다. 금리가 올라가므로 가치는 내려간다. −(0.4444 × 0.0018 + 0.5129 × 0.0035 + 1.1030 × 0.0057) = −(0.0800% + 0.1795% + 0.6287%) = −0.888%.", "trap": "25bp는 검토 기준일 뿐, 실제 만기별 변화(18, 35, 57bp)를 쓴다. 부호는 음수.", "f": "%ΔV = −Σ KeyDur_k × Δy_k", "why": {"B": "모든 만기에 25bp를 똑같이 적용했습니다.", "C": "금리 상승인데 가치가 오른다고 부호를 반대로 했습니다."}, "orig": "Mock 2 Session 2 Q20", "conf": true}, {"id": "mock2-Q65", "src": "정답", "module": "FSA", "tag": "매출 성장의 지속성", "vig": 16, "stem": "Based on the components of total net sales growth, which of Pedra's geographic segments has the lowest sustainable growth rate?", "opts": {"A": "Europe", "B": "Americas", "C": "Asia Pacific"}, "ans": "B", "en": "A. Europe — Incorrect\nIncorrect because although Europe’s net sales growth has the highest contribution from volume growth (4.6%), it has a relatively small contribution from the less sustainable changes in the foreign currency exchange rate (1.4%). Europe has a combined contribution from the volume and price components (4.6% + 1.9% = 6.5%) which are the most sustainable components.\nB. Americas — Correct\nCorrect because the Americas segment has 1. the lowest net sales growth resulting from the combined effect of price and volume at 1.8% (= 1.1% + 0.7%) and 2. the lowest sustainable net sales growth based on the highest contribution from the effect of foreign currency exchange rate of 4.3%.\nFor a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price are more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.\nC. Asia Pacific — Incorrect\nIncorrect because Asia Pacific’s net sales growth has the highest contribution from price change (2.1%), it has a relatively small contribution from the less sustainable changes in the foreign currency exchange rate (1.8%). Asia Pacific has a combined contribution from the volume and price components (3.6% + 2.1% = 5.7%) which are the most sustainable components.", "ko": "물량·가격 성장은 경영진이 통제할 수 있어 지속성이 높고, 환율 효과는 지속성이 낮다. Americas는 물량 + 가격 = 0.7 + 1.1 = 1.8%로 가장 작고, 환율 효과가 4.3%로 가장 크다 → 지속 가능한 성장이 가장 낮다. Europe은 6.5%, Asia Pacific은 5.7%.", "trap": "총 성장률이 아니라 물량 + 가격 부분을 비교한다.", "f": "", "why": {"A": "Europe은 물량 + 가격이 6.5%로 가장 지속 가능합니다.", "C": "Asia Pacific은 물량 + 가격이 5.7%로 Americas보다 높습니다."}, "orig": "Mock 2 Session 2 Q21", "conf": false}, {"id": "mock2-Q66", "src": "정답", "module": "FSA", "tag": "외화 거래 손익 (매입채무)", "vig": 16, "stem": "For the most recent year, Pedra's purchase of imported goods resulted in a foreign exchange:", "opts": {"A": "loss of BRL 256,000.", "B": "gain of BRL 256,000.", "C": "gain of BRL 864,000."}, "ans": "B", "en": "A. loss of BRL 256,000. — Incorrect\nIncorrect because the calculation uses the right exchange rates but reverses the direction of the rates.\nForeign transaction result = USD 3.2 million × (5.45 – 5.53) = – BRL 256,000\nB. gain of BRL 256,000. — Correct\nCorrect because the amount payable for imported goods is in USD and the USD depreciated against the BRL from 1 November (5.53 BRL/USD) to 31 December (5.45 BRL/USD). The payable balance that remains outstanding as of 31 December generates a foreign transaction gain of:\nForeign transaction result = – USD 3.2 million × (5.45 – 5.53) = BRL 256,000\nFor foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gains and losses are reported on the income statement.\nC. gain of BRL 864,000. — Incorrect\nIncorrect because the calculation uses the transaction exchange rate and adjusts the amount payable to the average exchange rate for the year.\nForeign transaction result = – USD 3.2 million × (5.26 – 5.53) = BRL 864,000", "ko": "11월 1일 USD 3.2m 매입채무가 생겼을 때 BRL 환산 = 3.2m × 5.53. 12월 31일에는 3.2m × 5.45로 줄었다. 갚아야 할 BRL이 줄었으니 이익 = 3.2m × (5.53 − 5.45) = BRL 256,000. USD 약세 + USD 부채 → 거래 이익(손익계산서).", "trap": "외화 부채는 외화가 약해지면 이익. 거래일 환율과 기말 환율을 쓴다(평균 환율 X).", "f": "Payable 거래 손익 = −외화금액 × (S_기말 − S_거래일)", "why": {"A": "부채인데 자산처럼 부호를 써서 손실로 계산했습니다.", "C": "기말 환율 대신 평균 환율 5.26을 썼습니다."}, "orig": "Mock 2 Session 2 Q22", "conf": false}, {"id": "mock2-Q67", "src": "정답", "module": "FSA", "tag": "current rate method와 비율", "vig": 16, "stem": "After translation, Carro’s debt-to-assets ratio at 31 December of the most recent year was:", "opts": {"A": "lower than it was before translation.", "B": "the same as it was before translation.", "C": "higher than it was before translation."}, "ans": "B", "en": "A. lower than it was before translation. — Incorrect\nIncorrect because the debt-to-assets ratio will be the same before (computed with the USD financial statements) and after translation (computed with the BRL financial statements).\nB. the same as it was before translation. — Correct\nCorrect because Pedra uses the current rate method to translate Carro’s financial statements. Under such a method, all assets and liabilities (in USD) are translated (into BRL) at the current exchange rate at the balance sheet date (5.45 BRL/USD). Therefore, both the numerator (debt) and the denominator (total assets) of the ratio are translated using the same exchange rate of 5.45 BRL/USD. As a result, the debt-to-assets will be the same before (computed with the USD financial statements) and after translation (computed with the BRL financial statements).\nC. higher than it was before translation. — Incorrect\nIncorrect because the debt-to-assets ratio will be the same before (computed with the USD financial statements) and after translation (computed with the BRL financial statements). If Pedra had applied the temporal method, non-monetary assets and liabilities would be translated using the historical exchange rate. As the exchange rate used to translate non-monetary assets was lower at time of purchase (BRL/USD 5.24) than at reporting date (BRL/USD 5.45), total assets would have been lower and debt-to-total assets would have been higher.", "ko": "current rate method에서는 모든 자산·부채를 기말 환율(5.45)로 환산한다. 부채와 총자산에 같은 환율을 곱하므로 debt-to-assets 비율은 환산 전과 같다. temporal method였다면 비화폐성 자산(재고·고정자산)은 역사적 환율 5.24로 환산돼 자산이 작아지고 비율이 높아졌을 것이다.", "trap": "current rate method에서는 대차대조표 비율이 환산 전후 같다.", "f": "", "why": {"A": "분자·분모에 같은 환율을 쓰므로 비율이 변하지 않습니다.", "C": "temporal method였다면 높아졌겠지만 current rate method라 같습니다."}, "orig": "Mock 2 Session 2 Q23", "conf": false}, {"id": "mock2-Q68", "src": "오답", "module": "FSA", "tag": "환산 조정: current rate method", "vig": 16, "stem": "Based on Viniciu’s expectations, the translation of Carro’s financial statements in the current year will most likely result in a:", "opts": {"A": "translation loss in Pedra's income statement.", "B": "translation gain in Pedra's income statement.", "C": "positive translation adjustment in Pedra's shareholders’ equity."}, "ans": "C", "en": "A. translation loss in Pedra's income statement. — Incorrect\nIncorrect because Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity. Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency). Therefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment which will be reflected in stockholders’ equity because Pedra uses the current rate method to translate Carro's financial statements. If Carro used the temporal method for translation and there was a strengthening of the BRL, there would have been a translation loss recognized in the income statement.\nB. translation gain in Pedra's income statement. — Incorrect\nIncorrect because Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity. Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency). Therefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment which will be reflected in stockholders’ equity because Pedra uses the current rate method to translate Carro's financial statements. If Carro used the temporal method for translation then there would have been a translation gain recognized in the income statement.\nC. positive translation adjustment in Pedra's shareholders’ equity. — Correct\nCorrect because Pedra uses the current rate method to translate Carro’s financial statements. When the current rate method is used, the cumulative translation adjustment needed to keep the translated balance sheet in balance is reported as a separate component of stockholders’ equity.\nThe sign (positive or negative) of the current period’s translation adjustment is a function of two factors: (1) The nature of the balance sheet exposure (asset or liability), and (2) The direction of change in the exchange rate (strengthens or weakens). The relationship between exchange rate fluctuations, balance sheet exposure, and the current period’s translation adjustment can be summarized as follows:\nBalance Sheet Exposure\tForeign Currency Strengthens\tForeign Currency Weakens\nNet asset\tPositive translation adjustment\tNegative translation adjustment\nNet liability\tNegative translation adjustment\tPositive translation adjustment\nIn this case, Carro is expected to maintain a stable net asset balance sheet exposure, and the BRL will weaken against the USD (i.e., the foreign currency will strengthen against the presentation currency).\nTherefore, the translation of Carro’s financial statements in the current year will most likely result in a positive translation adjustment in stockholders’ equity.", "ko": "current rate method의 환산 차이는 손익계산서가 아니라 자본(CTA, OCI)에 들어간다. 부호: Carro는 순자산 노출이고, BRL 약세 = 외화(USD) 강세. 순자산 + 외화 강세 → 양(+)의 환산 조정. 그래서 '자본에 양의 환산 조정'.", "trap": "current rate method → 손익이 아니라 자본(CTA). 순자산 노출 + 외화 강세 = +.", "f": "", "why": {"A": "current rate method의 환산 차이는 손익계산서에 가지 않고, 부호도 양수입니다.", "B": "부호는 맞지만 current rate method라 손익계산서가 아니라 자본에 반영됩니다."}, "orig": "Mock 2 Session 2 Q24", "conf": false}, {"id": "mock2-Q69", "src": "정답", "module": "AI", "tag": "equity market neutral 전략", "vig": 17, "stem": "The investment strategy used by Fund 1 most likely:", "opts": {"A": "relies primarily on market timing.", "B": "applies a higher level of leverage.", "C": "delivers returns that are more volatile than other hedge fund strategies."}, "ans": "B", "en": "A. relies primarily on market timing. — Incorrect\nIncorrect because Fund 1 follows an equity market neutral (EMN) strategy, and the main source of skill for an EMN manager is in security selection, with market timing being of secondary importance.\nB. applies a higher level of leverage. — Correct\nCorrect because Fund 1 follows equity market neutral (EMN) strategy and the use of leverage by hedge funds following this strategy is high: As many beta risks (e.g., market, sector) are hedged away, it is generally deemed acceptable for EMN managers to apply higher levels of leverage while striving for meaningful return targets.\nC. delivers returns that are more volatile than other hedge fund strategies. — Incorrect\nIncorrect because Fund 1 follows an equity market neutral (EMN) strategy, and EMN managers generally are more useful for portfolio allocation during periods of non-trending or declining markets because they typically deliver returns that are steadier and less volatile than those of many other hedge strategy areas.", "ko": "EMN은 시장·섹터 베타를 헤지로 없애고 종목 선택으로 수익을 낸다. 베타 위험이 거의 없으니 의미 있는 수익을 내려고 레버리지를 높게 쓰는 것이 일반적이다. 마켓 타이밍은 주된 기술이 아니고, 수익은 다른 헤지펀드 전략보다 안정적(변동성 낮음)이다.", "trap": "EMN = 종목 선택 + 높은 레버리지 + 낮은 변동성.", "f": "", "why": {"A": "EMN의 핵심 기술은 종목 선택이고 마켓 타이밍은 부차적입니다.", "C": "EMN 수익은 다른 전략보다 안정적이고 변동성이 낮습니다."}, "orig": "Mock 2 Session 2 Q25", "conf": true}, {"id": "mock2-Q70", "src": "정답", "module": "AI", "tag": "distressed securities 전략", "vig": 17, "stem": "The investment strategy used by Fund 2 most likely:", "opts": {"A": "has a short initial lock-up period.", "B": "produces either very good or very bad results.", "C": "applies primarily to short selling and is short biased."}, "ans": "B", "en": "A. has a short initial lock-up period. — Incorrect\nIncorrect because Fund 2 follows an event-driven strategy focusing on distressed securities. By nature, distressed debt and other illiquid assets may take several years to resolve, and they are generally difficult to value. Therefore, hedge fund managers running portfolios of distressed securities typically require relatively long initial lock-up periods (e.g., no redemptions allowed for the first two years) from their investors.\nB. produces either very good or very bad results. — Correct\nCorrect because Fund 2 follows an event-driven strategy focusing on distressed securities. Distressed securities investing typically entails relatively high levels of illiquidity, especially if using a concentrated activist approach. Pricing may involve 'mark-to-model' with return smoothing. Ultimate results are generally binary: either very good or very bad.\nC. applies primarily to short selling and is short biased. — Incorrect\nIncorrect because Fund 2 follows an event-driven strategy focusing on distressed securities. Distressed funds normally take long positions in investments and are often forced to sell at distressed prices that reflect increased credit and liquidity risks. Specifically, as noted in the curriculum: Outright shorts or hedged positions are possible, but distressed securities investing is usually long-biased. It is subject to security-specific outcomes.", "ko": "부실채권 투자는 유동성이 낮고 해결까지 몇 년이 걸려 가치평가도 어렵다(mark-to-model). 결과는 대체로 아주 좋거나 아주 나쁜 둘 중 하나(binary)다. 그래서 lock-up 기간이 길고, 주로 매수(long) 위주다.", "trap": "distressed = 긴 lock-up, long-biased, 결과는 binary.", "f": "", "why": {"A": "유동성이 낮아 lock-up 기간이 깁니다(예: 첫 2년 환매 불가).", "C": "distressed 투자는 보통 long 위주입니다."}, "orig": "Mock 2 Session 2 Q26", "conf": false}, {"id": "mock2-Q71", "src": "정답", "module": "AI", "tag": "Sortino ratio로 선택", "vig": 17, "stem": "Based on his definition of risk and his objective to maximize the endowment's risk-adjusted return, Tan should allocate to:", "opts": {"A": "Fund 1.", "B": "Fund 2.", "C": "Fund 3."}, "ans": "A", "en": "A. Fund 1. — Correct\nCorrect because the hypothetical combined portfolio where the endowment invests only in Fund 1 has the highest Sortino ratio. As mentioned in the curriculum, the Sharpe ratio measures risk-adjusted performance, where risk is defined as standard deviation, so it penalizes both upside and downside variability. The Sortino ratio measures risk-adjusted performance, where risk is defined as downside deviation, so it penalizes only downside variability below a minimum target return.\nB. Fund 2. — Incorrect\nIncorrect because the hypothetical combined portfolio where the endowment invests only in Fund 2 has the highest Sharpe ratio but not the highest Sortino ratio. For hedge fund strategies with large negative events, the Sortino ratio is considered a better performance measure.\nC. Fund 3. — Incorrect\nIncorrect because the hypothetical combined portfolio where the endowment invests only in Fund 3 has the lowest standard deviation of returns but not the highest Sortino ratio. For hedge fund strategies with large negative events, the Sortino ratio is considered a better performance measure.", "ko": "Tan은 위험을 하방 편차(downside deviation)로 정의했다. 하방 위험만 반영하는 지표는 Sortino ratio다. Sortino가 가장 높은 것은 Fund 1(1.5)이다. Sharpe는 표준편차(상·하방 모두)를 쓰므로 기준이 아니다.", "trap": "위험 = downside deviation → Sharpe가 아니라 Sortino.", "f": "Sortino = (R − MAR) / downside deviation", "why": {"B": "Fund 2는 Sharpe가 가장 높지만 Sortino는 가장 낮습니다.", "C": "Fund 3은 표준편차가 가장 낮지만 Sortino가 가장 높지는 않습니다."}, "orig": "Mock 2 Session 2 Q27", "conf": false}, {"id": "mock2-Q72", "src": "정답", "module": "AI", "tag": "fund of funds의 단점", "vig": 17, "stem": "The reallocation of hedge fund investments to Fund 4 would most likely:", "opts": {"A": "result in an additional layer of principal-agent relationships.", "B": "improve transparency into individual hedge fund managers' processes and returns.", "C": "increase the endowment fund's ability to net performance fees on individual managers."}, "ans": "A", "en": "A. result in an additional layer of principal-agent relationships. — Correct\nCorrect because disadvantages of the FoF approach include an additional principal–agent relationship.\nB. improve transparency into individual hedge fund managers' processes and returns. — Incorrect\nIncorrect because disadvantages of the FoF approach include a lack of transparency into individual hedge fund manager processes and returns.\nC. increase the endowment fund's ability to net performance fees on individual managers. — Incorrect\nIncorrect because disadvantages of the FoF approach include the inability to net performance fees on individual managers.", "ko": "FoF는 투자자 → FoF 매니저 → 개별 헤지펀드 매니저로 대리인 관계가 한 겹 더 생긴다. 또 개별 매니저의 과정·수익을 보기 어렵고(투명성 낮음), 개별 매니저 간 성과보수를 상계(netting)할 수 없다.", "trap": "FoF 단점: 대리인 한 겹 추가, 투명성 낮음, 성과보수 상계 불가, 수수료 이중.", "f": "", "why": {"B": "FoF는 개별 매니저에 대한 투명성이 오히려 떨어집니다.", "C": "FoF에서는 개별 매니저의 성과보수를 상계할 수 없습니다."}, "orig": "Mock 2 Session 2 Q28", "conf": false}, {"id": "mock2

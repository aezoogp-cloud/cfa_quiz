-Q73", "src": "정답", "module": "DER", "tag": "2기간 이항모형 콜 가치", "vig": 18, "stem": "Using the two-period binomial model, the value of the European-style call option is closest to:", "opts": {"A": "$20.11.", "B": "$25.28.", "C": "$42.66."}, "ans": "A", "en": "A. $20.11. — Correct\nCorrect because using the Risk Neutral approach:\nc = PV[π^2c^(++) + 2π(1 – π)c^(+–)+ (1 – π)^2c^(– –)]\n= 1/1.03^2[0.471429^2 x 96 + 2 x 0.471429 x 0.528571 x 0 + 0.528571^2x 0]\n= 20.11\nwhere:\nπ = [FV(1) – d]/(u – d) = (1.03 – 0.7)/(1.4 – 0.7) = 0.471429.\nc^(++) = Max(0,u^2S – X) = Max(0,1.4^2 × 100 - 100) = 96\nc^(+–) = Max(0,udS – X) = Max(0,1.4 × 0.7 × 100 - 100) = 0\nc^(– –) = Max(0,d^2S – X) = Max(0,0.7^2 × 100 - 100) = 0\nB. $25.28. — Incorrect\nIncorrect because the the values for π and 1 – π are reversed:\nc = PV[(1 –π)^2c^(++) + 2π(1 – π)c^(+–)+ π^2c^(– –)]\n= 1/1.03^2[0.528571^2 × 96 + 2 × 0.471429 × 0.528571 × 0 + 0.471429^(2 ×) 0]\n= 25.28.\nC. $42.66. — Incorrect\nIncorrect because 1 – π and π are not squared:\nc = PV[πc^(++) + 2π(1 – π)c^(+–)+ (1 – π)c^(– –)]\n= 1/1.03^2[0.471429 × 96 + 2 × 0.471429 × 0.528571 × 0 + 0.528571× 0]\n= 42.66.", "ko": "위험중립확률 π = (1.03 − 0.7) / (1.4 − 0.7) = 0.4714. 만기 주가: uu = 196 → 콜 96, ud = 98 → 0, dd = 49 → 0. 콜 = π² × 96 / 1.03² = 0.2222 × 96 / 1.0609 = 21.33 / 1.0609 = $20.11.", "trap": "2기간이면 확률을 제곱하고 (1 + r)²로 할인한다.", "f": "π = (1 + r − d)/(u − d), c = [π²c++ + 2π(1 − π)c+− + (1 − π)²c−−] / (1 + r)²", "why": {"B": "π와 1 − π를 바꿔 썼습니다.", "C": "π를 제곱하지 않았습니다."}, "orig": "Mock 2 Session 2 Q29", "conf": false}, {"id": "mock2-Q74", "src": "정답", "module": "DER", "tag": "delta hedge 주식 수", "vig": 18, "stem": "The optimal number of shares that should be purchased to delta hedge the short call position is closest to:", "opts": {"A": "2,055.", "B": "2,525.", "C": "2,945."}, "ans": "C", "en": "A. 2,055. — Incorrect\nIncorrect because this is the delta of 5,000 puts (without the minus sign) = N(–d1) x 5,000 = 0.411 x 5,000 = 2,055.\nB. 2,525. — Incorrect\nIncorrect because this is the portfolio delta (short 5,000 calls) without the minus sign mistakenly using N(d2) = N(d2) x 5,000 = 0.505 x 5,000 = 2,525.\nC. 2,945. — Correct\nCorrect because the optimal number of hedging units = NH = –Portfolio delta/DeltaH, where DeltaH is the delta of the hedging unit. Since there are no dividends Deltac = N(d1) =0.589 and Deltap = –N(–d1) = –0.411. The portfolio is short calls on 5,000 shares, so portfolio delta = –0.589 x 5,000 = –2,945. The hedging unit is shares of the underlying equity, so DeltaH = 1.0. The optimal number of shares = NH = –(–2,945)/1.0 = 2,945.", "ko": "배당 없는 콜의 델타 = N(d1) = 0.589. 콜 5,000주 매도 → 포트폴리오 델타 = −0.589 × 5,000 = −2,945. 주식 델타는 1이므로 2,945주를 사면 델타가 0이 된다.", "trap": "콜 델타는 N(d2)가 아니라 N(d1). N(−d1)은 풋 델타의 크기.", "f": "N_H = −Portfolio delta / Delta_H, call delta = N(d1)", "why": {"A": "풋 델타 크기 N(−d1) = 0.411을 썼습니다.", "B": "N(d1) 대신 N(d2) = 0.505를 썼습니다."}, "orig": "Mock 2 Session 2 Q30", "conf": false}, {"id": "mock2-Q75", "src": "정답", "module": "DER", "tag": "감마가 가장 큰 옵션", "vig": 18, "stem": "Which option would have the largest gamma?", "opts": {"A": "Call 1", "B": "Call 2", "C": "Call 3"}, "ans": "B", "en": "A. Call 1 — Incorrect\nIncorrect because Call 1 is in the money, and thus Call 1 has a lower gamma than Call 2. Adding a lower gamma to the delta prediction of the change in call price would have less of an impact on the predicted change in price.\nB. Call 2 — Correct\nCorrect because Call 2 is at the money where gamma takes on its largest value. The predicted change in call price is shown below, and the predicted change in call price is larger for larger gamma. As calls go out of the money (in either direction) gamma approaches zero.\nThe delta-plus-gamma prediction equation is:\nC. Call 3 — Incorrect\nIncorrect because Call 3 is out of the money, and thus has a lower gamma than Call 2. Adding a lower gamma to the delta prediction of the change in call price would have less of an impact on the predicted change in price.", "ko": "감마는 등가격(ATM)에서 가장 크고, 내가격·외가격으로 갈수록 0에 가까워진다. 주가 $100에서 행사가 $100인 Call 2가 ATM이라 감마가 가장 크다. 델타 + 감마 근사: Δc ≈ delta × ΔS + ½ × gamma × (ΔS)².", "trap": "감마 최대 = ATM (만기가 같을 때).", "f": "Δc ≈ Δ·ΔS + ½·Γ·(ΔS)²", "why": {"A": "Call 1은 내가격이라 감마가 ATM보다 작습니다.", "C": "Call 3은 외가격이라 감마가 ATM보다 작습니다."}, "orig": "Mock 2 Session 2 Q31", "conf": true}, {"id": "mock2-Q76", "src": "정답", "module": "DER", "tag": "내재 변동성과 옵션 매수", "vig": 18, "stem": "To benefit from its views on option volatility West should take a long position in:", "opts": {"A": "Put A.", "B": "Put B.", "C": "Put C."}, "ans": "B", "en": "A. Put A. — Incorrect\nIncorrect because Put A has a higher implied volatility than West's forecast (19% > 17%). If West is correct, Put A is overvalued.\nB. Put B. — Correct\nCorrect because for Put B West's forecast for volatility is higher than its implied volatility (22% > 16%) suggesting that Put B is currently undervalued and that West should take a long position in Put B. If her forecast proves correct she will profit/benefit from that long position. There is a 1:1 relation between implied volatility and option price for an agreed upon option pricing model. Implied volatility can be interpreted as the market’s view of how to value options. Different investors will have different views of the future volatility. The one with the most accurate forecast will have the most accurate assessment of the option value.\nC. Put C. — Incorrect\nIncorrect because Put C has a higher implied volatility than West's forecast (18% > 16%). If West is correct, Put C is overvalued.", "ko": "내 예측 변동성이 내재 변동성보다 높으면 시장이 옵션을 싸게 평가하는 것이므로 매수한다. Put B: 예측 22% > 내재 16% → 저평가 → 매수. Put A(19% > 17%), Put C(18% > 16%)는 내재가 예측보다 높아 고평가다. 역사적 변동성은 비교 기준이 아니다.", "trap": "비교는 '예측 vs 내재'. 역사적 변동성이 아니다.", "f": "", "why": {"A": "내재 변동성(19%)이 예측(17%)보다 높아 고평가입니다.", "C": "내재 변동성(18%)이 예측(16%)보다 높아 고평가입니다."}, "orig": "Mock 2 Session 2 Q32", "conf": false}, {"id": "mock2-Q77", "src": "정답", "module": "PM", "tag": "거시 요인과 P/E", "vig": 19, "stem": "Which of the following scenarios would most likely result in a decrease in the P/E ratio for equities?", "opts": {"A": "Scenario 1", "B": "Scenario 2", "C": "Scenario 3"}, "ans": "A", "en": "A. Scenario 1 — Correct\nCorrect because an increase in both real GDP growth volatility and inflation expectations (factors b and c below) would result in a decrease in the P/E ratio.\nHigh P/E could be the result of a number of factors, including\na. an increase in expectation of future real earnings growth;\nb. falling real interest rates (It,s), possibly associated with falling volatility in real GDP growth;\nc. a decrease in inflation expectations (Θt,s);\nd. a decline in uncertainty about future inflation (Πt,s); or\ne. a decrease in the equity risk premium (λ^it,s).\nB. Scenario 2 — Incorrect\nIncorrect because declining uncertainty about future inflation would result in a higher P/E ratio.\nC. Scenario 3 — Incorrect\nIncorrect because the two factors in this scenario (i.e., an expectation of higher real earnings growth and a higher equity risk premium) would have opposite effects on the P/E ratio, resulting in an indeterminate conclusion.", "ko": "P/E를 높이는 요인: 실질 이익성장 기대 ↑, 실질금리 ↓(실질 GDP 성장 변동성 ↓), 인플레이션 기대 ↓, 인플레이션 불확실성 ↓, ERP ↓. Scenario 1은 GDP 성장 변동성 ↑, 인플레이션 기대 ↑ → 둘 다 P/E를 낮춤. Scenario 2는 P/E를 높이고, Scenario 3은 이익성장 ↑(P/E ↑)과 ERP ↑(P/E ↓)이 반대라 결론이 안 난다.", "trap": "두 요인 방향이 반대면 '알 수 없음'이라 답이 안 된다.", "f": "", "why": {"B": "인플레이션 불확실성이 줄면 P/E는 올라갑니다.", "C": "이익성장 ↑과 ERP ↑이 반대로 작용해 결과를 알 수 없습니다."}, "orig": "Mock 2 Session 2 Q33", "conf": false}, {"id": "mock2-Q78", "src": "정답", "module": "PM", "tag": "가치 추가: security selection", "vig": 19, "stem": "For the active portfolio, the value added attributable to security selection is closest to:", "opts": {"A": "0.3%.", "B": "0.8%.", "C": "1.1%."}, "ans": "C", "en": "A. 0.3%. — Incorrect\nIncorrect because this is the value added attributable to asset allocation, which can be calculated as shown below:\nAsset\tBenchmark return [1]\tPortfolio allocation [2]\tBenchmark allocation [3]\tDifference in allocation [4] = [2] – [3]\t[1] × [4]\nEquities\t8%\t70%\t60%\t10%\t0.8%\nFixed income\t5%\t30%\t40%\t–10%\t–0.5%\n\t\tAsset allocation = Total\t\t\t0.3%\nB. 0.8%. — Incorrect\nIncorrect because this answer uses benchmark allocation weights instead of portfolio allocation weights, as shown below:\nAsset\tPortfolio return [1]\tBenchmark return [2]\tValue added [3] = [1] – [2]\tBenchmark allocation [4]\t[3] × [4]\nEquities\t10%\t8%\t2%\t60%\t1.2%\nFixed income\t4%\t5%\t–1%\t40%\t–0.4%\n\t\t\t\tTotal\t0.8%\nC. 1.1%. — Correct\nCorrect because the value added attributable to security selection can be calculated as shown below:\nAsset\tPortfolio return [1]\tBenchmark return [2]\tValue added [3] = [1] – [2]\tPortfolio allocation [4]\t[3] × [4]\nEquities\t10%\t8%\t2%\t70%\t1.4%\nFixed income\t4%\t5%\t–1%\t30%\t–0.3%\n\t\t\tSecurity selection = Total\t\t1.1%", "ko": "종목 선택 기여 = Σ 포트폴리오 비중 × (포트폴리오 수익률 − 벤치마크 수익률). 주식: 70% × (10% − 8%) = 1.4%, 채권: 30% × (4% − 5%) = −0.3%. 합계 = 1.1%. (자산배분 기여 = Σ (비중 차이) × 벤치마크 수익률 = 0.8 − 0.5 = 0.3%, 합계 1.4% = active return.)", "trap": "종목 선택은 포트폴리오 비중으로 곱한다(벤치마크 비중 X).", "f": "Selection = Σ w_P × (R_P − R_B), Allocation = Σ (w_P − w_B) × R_B", "why": {"A": "자산배분 기여(0.3%)입니다.", "B": "포트폴리오 비중 대신 벤치마크 비중을 썼습니다."}, "orig": "Mock 2 Session 2 Q34", "conf": false}, {"id": "mock2-Q79", "src": "정답", "module": "PM", "tag": "최적 active risk와 Sharpe 개선", "vig": 19, "stem": "Can Navarro improve the Sharpe ratio of the active portfolio by combining investments in this portfolio and the benchmark?", "opts": {"A": "No", "B": "Yes, by taking a short position in the active portfolio and a long position in the benchmark", "C": "Yes, by taking a long position in the active portfolio and a short position in the benchmark"}, "ans": "B", "en": "A. No — Incorrect\nIncorrect because the active portfolio's expected active risk is not at its optimal level, therefore the expected Sharpe ratio is not at its maximum value.\nB. Yes, by taking a short position in the active portfolio and a long position in the benchmark — Correct\nCorrect because the optimal amount of active risk (8.50%) is less than the expected active risk of the active portfolio (10.00%).\nThe optimal amount of active risk (σA) can be calculated as a function of the active manager's information ratio (IR), the Sharpe ratio of the benchmark (SRB), and the standard deviation of the benchmark (σB):\nσA = (IR / SRB) × σB\nwhere\nIR = Active return / Active risk = 1.4% / 10% = 0.14\nSRB = 0.28\nσB = 17%\nσA = (0.14 / 0.28) × 17% = 8.50%\nSince the optimal active risk is less than the expected active risk of the active portfolio (i.e., 8.50% < 10.00%), Navarro needs to short the active portfolio and go long the benchmark. Doing so will maximize the expected Sharpe ratio (calculated as 0.31 = (0.28^2 + 0.14^2)^0.5, which is not needed to answer the question).\nC. Yes, by taking a long position in the active portfolio and a short position in the benchmark — Incorrect\nIncorrect because the optimal amount of active risk (8.5%) is less than the expected active risk of the active portfolio (10.00%). This answer would only be correct if that relation were reversed.", "ko": "IR = 1.4% / 10% = 0.14. 최적 active risk = (IR / SR_B) × σ_B = (0.14 / 0.28) × 17% = 8.5%. 현재 active risk 10%가 최적보다 크므로 액티브 포트폴리오 비중을 줄이고 벤치마크 비중을 늘려야 한다(액티브 일부 매도·벤치마크 매수). 그러면 Sharpe가 √(0.28² + 0.14²) = 0.31까지 올라간다.", "trap": "현재 active risk > 최적 → 액티브를 줄이고 벤치마크를 늘린다.", "f": "σ_A* = (IR / SR_B) × σ_B, SR_P* = √(SR_B² + IR²)", "why": {"A": "active risk가 최적(8.5%)이 아니라서 Sharpe를 높일 여지가 있습니다.", "C": "현재 active risk가 최적보다 작을 때의 방법입니다(여기는 반대)."}, "orig": "Mock 2 Session 2 Q35", "conf": false}, {"id": "mock2-Q80", "src": "정답", "module": "PM", "tag": "확장 기본법칙: TC", "vig": 19, "stem": "Which of the following events will most likely reduce the information ratio of the active portfolio?", "opts": {"A": "Event 1", "B": "Event 2", "C": "Event 3"}, "ans": "C", "en": "A. Event 1 — Incorrect\nIncorrect because this event increases the information ratio (IR). Increasing the rebalancing frequency (from semiannual to quarterly) increases the number of independent decisions made, which increases breadth (BR) and thus the information ratio.\nIR = (TC) (IC) BR^0.5\nBR measures the number of independent decisions made per year by the investor in constructing the portfolio. A higher (lower) rebalancing frequency implies a higher (lower) BR. It is important to note that doubling the rebalancing frequency probably does not double BR due to the lack of independence among decisions.\nB. Event 2 — Incorrect\nIncorrect because this event increases the information ratio (IR). Adding two analysts with strong forecasting ability increases the information coefficient (IC).\nIR = (TC) (IC) BR^0.5\nIC measures the forecasting ability of the fund manager. The stronger the link between forecasted active returns and realized returns, the higher the IC.\nThis event will also increase breadth (BR) because the additional research provided by the two analysts will most likely increase the number of independent decisions made during the year. As a result, the information ratio increases.\nC. Event 3 — Correct\nCorrect because short-selling constraints will result in a lower transfer coefficient and thus reduce the information ratio (IR).\nThe IR under the expanded fundamental law of active management is expressed as a function of the transfer coefficient (TC), the information coefficient (IC), and breadth (BR) as follows:\nIR = (TC) (IC) BR^0.5\nTC measures the degree to which the investor’s forecasts are translated into active weights. One factor that decreases a fund manager's ability to construct portfolios efficiently is the imposition of short-selling constraints. Short-selling constraints result in a lower TC and thus a lower IR.", "ko": "IR = TC × IC × √BR. Event 1: 리밸런싱을 더 자주 → 독립적 결정 수(BR) 증가 → IR ↑. Event 2: 예측력 좋은 애널리스트 → IC ↑ (BR도 ↑) → IR ↑. Event 3: 공매도 제한 → 예측을 비중에 제대로 옮기지 못해 TC ↓ → IR ↓.", "trap": "공매도 같은 제약은 TC를 낮춘다.", "f": "IR = TC × IC × √BR", "why": {"A": "리밸런싱을 자주 하면 breadth가 늘어 IR이 올라갑니다.", "B": "예측력이 좋은 애널리스트는 IC를 높여 IR이 올라갑니다."}, "orig": "Mock 2 Session 2 Q36", "conf": false}, {"id": "mock2-Q81", "src": "정답", "module": "EQ", "tag": "PRAT 모형", "vig": 20, "stem": "Kaufmann's conclusion about the sustainable growth rate of Company A relative to Company B is best supported by Company A's:", "opts": {"A": "payout ratio.", "B": "profit margin.", "C": "equity multiplier."}, "ans": "A", "en": "A. payout ratio. — Correct\nCorrect because a higher payout ratio will lead to a lower sustainable growth rate. Company A and Company B have identical total asset turnover ratios, but Company A has a higher payout ratio, higher profit margin, and higher equity multiplier. The PRAT model calculates the growth rate as the product of retention rate, profit margin, asset turnover, and equity multiplier (leverage). Since the retention rate is defined as (1 – payout ratio), a higher payout ratio results in a comparably lower retention rate and hence in a lower growth rate.\nB. profit margin. — Incorrect\nIncorrect because a higher profit margin will lead to a higher sustainable growth rate based on the PRAT model, which calculates the growth rate as the product of retention rate, profit margin, asset turnover, and equity multiplier (leverage). Company A has a higher profit margin.\nC. equity multiplier. — Incorrect\nIncorrect because a higher equity multiplier will lead to a higher sustainable growth rate based on the PRAT model, which calculates the growth rate as the product of retention rate, profit margin, asset turnover, and equity multiplier (leverage). Company A has a higher equity multiplier.", "ko": "g = 유보율 × 순이익률 × 총자산회전율 × 자기자본승수. A는 B보다 순이익률·자기자본승수가 높아 성장률을 높이는 쪽이고, 자산회전율은 같다. 그런데도 A의 성장률이 낮다면 원인은 배당성향이 높아 유보율(1 − payout)이 낮기 때문이다.", "trap": "payout ↑ → 유보율 ↓ → g ↓. 나머지 셋은 높을수록 g ↑.", "f": "g = b × PM × ATO × EM (b = 1 − payout)", "why": {"B": "순이익률이 높으면 성장률이 높아집니다.", "C": "자기자본승수가 높으면 성장률이 높아집니다."}, "orig": "Mock 2 Session 2 Q37", "conf": false}, {"id": "mock2-Q82", "src": "정답", "module": "EQ", "tag": "2단계 DDM", "vig": 20, "stem": "Based on the two-stage DDM, the shares of Company B are:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "B", "en": "A. undervalued. — Incorrect\nIncorrect because the current share price of EUR 42.37 is within the tolerance band of +/–5% relative to the model value of EUR 41.34.\nAn undervaluation results if the cash flows are not discounted:\nThe next three dividends are calculated as follows.\nD(1) = 1.40 × 1.12 = 1.568\nD(2) = 1.568 × 1.12 = 1.75616\nD(3) = 1.75616 × 1.06 = 1.86153\nBased on D(3), the value at t = 2 of the dividends from t = 3 until infinity (terminal value) can be calculated using the Gordon growth model: V(2) = 1.86153/(0.10 – 0.06) = 46.53824.\nNext, the two dividends and the terminal value are added up: 1.568 + 1.75616 + 46.53824 = 49.8624 ≈ 49.86.\nCalculating the deviation of the current share price from the intrinsic value:\n42.37/49.86 – 1 = –0.150262 ≈ –15.0%. The shares are undervalued by 15.0%.\nB. fairly valued. — Correct\nCorrect because the current share price of EUR 42.37 is within the tolerance band of +/–5% relative to the model value of EUR 41.34.\nThe next three dividends are calculated as follows.\nInputs:\nD(0) = 1.40\ngS = 12%\ngL = 6%\nr = 10%\nD(1) = 1.40 × 1.12 = 1.568\nD(2) = 1.568 × 1.12 = 1.75616\nD(3) = 1.75616 × 1.06 = 1.86153\nBased on D(3), the value at t = 2 of the dividends from t = 3 until infinity (terminal value) can be calculated using the Gordon growth model: V(2) = 1.86153/(0.10 – 0.06) = 46.53824.\nNext, the two dividends and the terminal value (D(1), D(2), and V(2)) are discounted at the required return on equity of 10%:\n1.568/1.1 = 1.42545\n(1.75616 + 46.53824)/1.1^2 = 39.91273\nFinally, these discounted values are added up to arrive at V(0), the model value:\n1.42545 + 39.91273 = 41.33818 ≈ 41.34.\nCalculating the deviation of the current share price from the intrinsic value:\n42.37/41.34 – 1 = 0.024960 ≈ 2.5%. This is within the tolerance band of +/–5%.\nC. overvalued. — Incorrect\nIncorrect because the current share price of EUR 42.37 is within the tolerance band of +/–5% relative to the model value of EUR 41.34.\nAn overvaluation results if only the terminal value is discounted:\nThe next three dividends are calculated as follows.\nD(1) = 1.40 × 1.12 = 1.568\nD(2) = 1.568 × 1.12 = 1.75616\nD(3) = 1.75616 × 1.06 = 1.86153\nBased on D(3), the value at t = 2 of the dividends from t = 3 until infinity (terminal value) can be calculated using the Gordon growth model: V(2) = 1.86153/(0.10 – 0.06) = 46.53824.\nThis terminal value is discounted at the required return on equity:\n46.53824/1.1^2 = 38.46136 ≈ 38.46.\nCalculating the deviation of the current share price from the intrinsic value:\n42.37/38.46 – 1 = 0.101625 ≈ 10.2%. The shares are overvalued by 10.2%.", "ko": "D1 = 1.40 × 1.12 = 1.568, D2 = 1.568 × 1.12 = 1.7562, D3 = 1.7562 × 1.06 = 1.8615. V2 = D3 / (0.10 − 0.06) = 46.538. V0 = 1.568/1.1 + (1.7562 + 46.538)/1.1² = 1.425 + 39.913 = 41.34. 주가 42.37은 41.34보다 2.5% 높아 ±5% 안 → 적정 가치.", "trap": "TV는 Year 2 시점 값이라 1.1²로 할인하고, D1·D2도 할인해 더한다.", "f": "V0 = Σ Dt/(1+r)^t + [D(n+1)/(r − g)]/(1+r)^n", "why": {"A": "배당과 TV를 할인하지 않아(49.86) 저평가로 나왔습니다.", "C": "TV만 할인하고 D1·D2를 빠뜨려(38.46) 고평가로 나왔습니다."}, "orig": "Mock 2 Session 2 Q38", "conf": false}, {"id": "mock2-Q83", "src": "정답", "module": "EQ", "tag": "Gordon growth model 적합 회사", "vig": 20, "stem": "Which of the following companies is most suitable for valuation using the Gordon growth model?", "opts": {"A": "Company C", "B": "Company D", "C": "Company E"}, "ans": "B", "en": "A. Company C — Incorrect\nIncorrect because the payout ratio fluctuates widely, ranging from 13% to 109%. Thus, there is no strong link between profitability and dividends, a key assumption for the use of the Gordon growth model.\nB. Company D — Correct\nCorrect because both payout ratio and dividend growth align well with the assumptions of the Gordon growth model. The payout ratio is stable, indicating that there is a direct link between profitability and dividends. Also, the dividend growth rate from year to year is stable, ranging between 4.4% and 5.4% with an average of 5.0%. The Gordon growth model implies a set of relationships for the growth rates of dividends, earnings and stock value. With dividends growing at a constant rate g, stock value also grows at g as well. Given a constant payout ratio—a constant, proportional relationship between earnings and dividends—dividends and earnings grow at g.\nC. Company E — Incorrect\nIncorrect because the payout ratio is increasing steadily, indicating that an ever increasing share of profits is required to maintain the stable dividend. Thus, there is no strong link between profitability and dividends, a key assumption for the use of the Gordon growth model.", "ko": "GGM은 배당이 일정한 비율로 성장하고, 배당과 이익이 안정적으로 연결된다(배당성향 일정)고 가정한다. Company D: 배당성향 0.38~0.42로 안정, 배당 성장률도 4.4~5.4%(평균 약 5%)로 안정 → 적합. Company C는 배당성향이 13~109%로 들쑥날쑥, Company E는 배당성향이 계속 올라 이익과 배당의 연결이 약하다.", "trap": "배당 성장이 안정적이어도 배당성향이 계속 오르면(E) 이익이 줄고 있다는 뜻이라 부적합.", "f": "", "why": {"A": "배당성향이 13%~109%로 크게 흔들려 이익과 배당의 연결이 없습니다.", "C": "배당성향이 계속 올라 같은 배당을 위해 이익의 더 많은 부분이 필요합니다."}, "orig": "Mock 2 Session 2 Q39", "conf": false}, {"id": "mock2-Q84", "src": "정답", "module": "EQ", "tag": "residual income", "vig": 20, "stem": "Residual income for Company C in the current year is closest to:", "opts": {"A": "EUR 140,000.", "B": "EUR 230,000.", "C": "EUR 500,000."}, "ans": "B", "en": "A. EUR 140,000. — Incorrect\nIncorrect because the fact that interest is tax deductible has been ignored. The incorrect calculation of residual income is as follows:\nNet operating income after taxes\n– Equity charge (= balance sheet total × percentage of equity × cost of equity)\n– Debt charge (= balance sheet total × percentage of debt × cost of debt)\n= Residual income\nEUR 900,000\n– EUR 400,000 (= EUR 10,000,000 × 0.40 × 0.10)\n– EUR 360,000 (= EUR 10,000,000 × 0.60 × 0.06)\n= EUR 140,000\nB. EUR 230,000. — Correct\nCorrect because all financing costs (cost of equity and cost of debt) need to be subtracted from net operating income after taxes to arrive at residual income as follows:\nNet operating income after taxes\n– Equity charge (= balance sheet total × percentage of equity × cost of equity)\n– Debt charge (= balance sheet total × percentage of debt × cost of debt × (1 – tax rate)\n= Residual income\nEUR 900,000\n– EUR 400,000 (= EUR 10,000,000 × 0.40 × 0.10)\n– EUR 270,000 (= EUR 10,000,000 × 0.60 × 0.06 × 0.75)\n= EUR 230,000\nC. EUR 500,000. — Incorrect\nIncorrect because only the cost of equity is subtracted from net operating income after taxes. The incorrect calculation of residual income is as follows:\nNet operating income after taxes\n– Equity charge (= balance sheet total × percentage of equity × cost of equity)\n= Residual income\nEUR 900,000\n– EUR 400,000 (= EUR 10,000,000 × 0.40 × 0.10)\n= EUR 500,000", "ko": "RI = NOPAT − 자기자본 비용 − 세후 부채 비용. 자기자본 비용 = 10m × 40% × 10% = 400,000. 세후 부채 비용 = 10m × 60% × 6% × (1 − 25%) = 270,000. RI = 900,000 − 400,000 − 270,000 = EUR 230,000.", "trap": "NOPAT에서 빼는 부채 비용은 세후 금리로.", "f": "RI = NOPAT − (E × re) − (D × rd × (1 − t))", "why": {"A": "이자의 세금 절감을 무시하고 세전 부채 비용(360,000)을 뺐습니다.", "C": "자기자본 비용만 빼고 부채 비용을 빼지 않았습니다."}, "orig": "Mock 2 Session 2 Q40", "conf": false}, {"id": "mock2-Q85", "src": "정답", "module": "FSA", "tag": "CET1 비율", "vig": 21, "stem": "Gowran's pro forma Common Equity Tier 1 Capital ratio is closest to:", "opts": {"A": "14.5%.", "B": "15.0%.", "C": "15.5%."}, "ans": "A", "en": "A. 14.5%. — Correct\nCorrect because at year end, Gowran's Risk-Weighted Assets was $100 billion. Risk-Weighted Assets is the combination of various risk-weighted asset types including; credit risk, market risk, and operational risk. As the regulator has stated Gowran must hold an additional $3.5 billion of operational risk-weighted assets, the proforma amount becomes $103.5 billion. Common Equity Tier 1 Capital ratio is the bank's Common Equity Capital Tier 1 Capital divided by Risk-Weighted Assets. Pro forma for the actions which occurred after Gowran's year end, this ratio would be calculated as follows: $15 billion / ($100 billion + $3.5 billion) = 14.49% ~ 14.5%.\nAt year end, Gowran's Common Equity Capital Tier 1 Capital was $15 billion and this is not impacted by the fact that Gowran raised Additional Tier 1 Capital of $1 billion. Raising Additional Tier 1 Capital would increase the bank's Total Tier 1 Capital, but not its Common Equity Tier 1 Capital.\nCommon Equity Tier 1 Capital includes common stock, issuance surplus related to common stock, retained earnings, accumulated other comprehensive income, and certain adjustments including the deduction of intangible assets and deferred tax assets.\nB. 15.0%. — Incorrect\nIncorrect because this indicates that neither of the actions that occurred after year end affected the Common Equity Tier 1 Capital Ratio (i.e., $15 billion / $100 billion = 15.0%)\nWhile the issuance of Additional Tier 1 Capital is correctly excluded from the Common Equity Tier 1 Capital Ratio, the additional operational risk-weighted assets should be included. The latter might be assumed to be true if the only type of risk-weighted assets related to credit risk and while it is typically the largest component of risk-weighted assets for a bank, it is not the only type.\nC. 15.5%. — Incorrect\nIncorrect because this would be the pro forma Common Equity Tier 1 Capital ratio at year end for Gowran if both actions occurring after year end were assumed to have an effect on the ratio as follows: ($15 billion + $1 billion) / ($100 billion + $3.5 billion) = 15.46% ~ 15.5%.", "ko": "CET1 비율 = CET1 자본 / 위험가중자산. Additional Tier 1 발행은 Tier 1 전체는 늘리지만 CET1에는 들어가지 않는다 → CET1은 $15bn 그대로. 운영위험 RWA가 $3.5bn 늘어 RWA = $103.5bn. 15 / 103.5 = 14.5%.", "trap": "AT1은 CET1이 아니다. 운영위험 RWA도 RWA에 포함된다.", "f": "CET1 ratio = CET1 capital / RWA", "why": {"B": "추가된 운영위험 RWA를 반영하지 않았습니다.", "C": "AT1 $1bn을 CET1에 잘못 더했습니다."}, "orig": "Mock 2 Session 2 Q41", "conf": true}, {"id": "mock2-Q86", "src": "오답", "module": "FSA", "tag": "대손충당금 / 부실채권 비율", "vig": 21, "stem": "Over the most recent year, the ratio of Gowran's allowances for loan losses to non-performing loans:", "opts": {"A": "decreased.", "B": "not changed.", "C": "increased."}, "ans": "B", "en": "A. decreased. — Incorrect\nIncorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nThe conclusion that the ratio decreased could be derived if provision for loan losses during the year was subtracted rather than added when calculating the allowance for loan losses at the end of the year.\nAllowance for loan losses at start of year\t1,500\nSubtract: Provision for loan losses during the year\t500\nSubtract: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t800\nThen the calculation of the ratio of allowances for loan losses to non-performing loans becomes;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t800\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.33\nB. not changed. — Correct\nCorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nFirst, we calculate the allowance for loan losses at the end of the year on the basis that provision for loan losses is an income statement expense account that increases the amount of the allowance for loan losses. Actual loan losses (i.e., charge-offs—net of recoveries) reduce the amount of the allowance for loan losses.\nAllowance for loan losses at start of year\t1,500\nAdd: Provision for loan losses during the year\t500\nSubtract: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t1,800\nThen, we calculate the ratio of allowances for loan losses to non-performing loans;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t1,800\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.75\nC. increased. — Incorrect\nIncorrect because over the past year, the ratio of Gowran's allowances for loan losses to non-performing loans did not change.\nThe conclusion that the ratio increased could be derived if the net charge-offs were added rather than subtracted in calculating the allowance for loan losses at the end of the year.\nAllowance for loan losses at start of year\t1,500\nAdd: Provision for loan losses during the year\t500\nAdd: Net charge-offs during the year\t200\nAllowance for loan losses at end of year\t2,200\nThen the calculation of the ratio of allowances for loan losses to non-performing loans becomes;\n\tStart of Year\tEnd of Year\nAllowances for loan losses\t1,500\t2,200\nNon-performing loans\t2,000\t2,400\nRatio\t0.75\t0.92", "ko": "기말 충당금 = 기초 1,500 + 대손상각비(provision) 500 − 순상각(charge-off) 200 = 1,800. 비율: 기초 1,500 / 2,000 = 0.75, 기말 1,800 / 2,400 = 0.75 → 변화 없음.", "trap": "provision은 충당금을 늘리고, charge-off는 줄인다.", "f": "기말 충당금 = 기초 + Provision − Net charge-offs", "why": {"A": "provision을 빼서 기말 충당금을 800으로 계산했습니다.", "C": "charge-off를 더해서 기말 충당금을 2,200으로 계산했습니다."}, "orig": "Mock 2 Session 2 Q42", "conf": true}, {"id": "mock2-Q87", "src": "정답", "module": "FSA", "tag": "IFRS 연금비용 항목", "vig": 21, "stem": "Regarding Plan A, which of the following would be recognized as an expense on Gowran's income statement?", "opts": {"A": "Remeasurements", "B": "Plan contributions", "C": "Past service costs"}, "ans": "C", "en": "A. Remeasurements — Incorrect\nIncorrect because under IFRS, remeasurements are recognized in other comprehensive income on the balance sheet, not as a pension expense in the income statement.\nIn contrast, under US GAAP, all actuarial gains and losses and differences between the expected and actual return on pension assets (remeasurements in IFRS) can be reported either in P&L or, the more commonly chosen approach, in OCI and amortized to the income statement.\nB. Plan contributions — Incorrect\nIncorrect because under IFRS, pension expense does not consider employer’s contributions to the plan (nor the settlement of benefits via payments to retirees); it is a non-cash accrual based on the change in the net pension liability or asset. Plan contributions are recognized on the statement of cash flows, typically in operating activities.\nC. Past service costs — Correct\nCorrect because under IFRS, both current and past service costs are recognized as a pension expense in the income statement. Past service cost is incurred if plan amendments are made that change the pension obligation relating to employees’ service in prior periods. Under IFRS, service costs are recognized as an operating expense on the income statement. The treatment differs under US GAAP, where only current service cost is recognized as an operating expense in the income statement.", "ko": "IFRS에서 손익계산서에 들어가는 연금비용은 근무원가(당기 + 과거 근무원가)와 순이자비용이다. 과거 근무원가(plan 변경으로 과거 근무분 의무가 바뀐 것)는 손익에 바로 인식한다. remeasurement는 OCI로 가고, 회사의 기여금은 현금흐름표 항목이지 비용이 아니다.", "trap": "IFRS: 근무원가(과거 포함)·순이자 → P&L, remeasurement → OCI.", "f": "", "why": {"A": "IFRS에서 remeasurement는 손익이 아니라 OCI에 인식합니다.", "B": "기여금은 현금 지급일 뿐 연금비용 계산에 들어가지 않습니다."}, "orig": "Mock 2 Session 2 Q43", "conf": false}, {"id": "mock2-Q88", "src": "정답", "module": "FSA", "tag": "스톡옵션 행사와 납입자본", "vig": 21, "stem": "Based on Carter's assumptions regarding the exercise of the share options, paid-in capital on Gowran's balance sheet in the current year will increase by:", "opts": {"A": "$24 million.", "B": "$30 million.", "C": "$42 million."}, "ans": "B", "en": "A. $24 million. — Incorrect\nIncorrect because this ignores the $6 million transferred from share-based compensation reserve to paid-in capital and only considers the $24 million amount which is 2 million options at $12 strike price.\nB. $30 million. — Correct\nCorrect because over the vesting period Gowran will recognize the fraction of the aggregate fair value that vests on the income statement (i.e., 1/3 in this case because the vesting period is three years). The offsetting entry is made to share-based compensation reserve in equity on the balance sheet. Therefore, at the end of year 3, the share-based compensation reserve will total $15 million (5 million options × $3 fair value).\nCarter's assumption is that 2 million share options will be exercised in the current year, therefore Gowran will recognize a cash inflow in financing activities for the receipt of strike price multiplied by the number of options exercised. The entry made to the share-based compensation reserve account is transferred to paid-in capital on the balance sheet.\nIn this case, the share-based compensation reserve would reduce by $6 million (2 million options exercised at $3 fair value) and cash flow from financing activities would increase by $24 million (2 million options at $12 strike price).\nGowran's paid-in capital therefore would increase by $30 million, which includes the $24 million plus the $6 million transferred from share-based compensation reserve.\nC. $42 million. — Incorrect\nIncorrect because the adjustment to paid-in capital is incorrectly calculated as a $36 million increase which is based on 2 million options exercised at the current share price of $18 (rather than using the strike price of $12) plus the $6 million transferred from share-based compensation reserve.", "ko": "가득 기간 동안 공정가치를 비용으로 인식하면서 자본의 주식보상 적립금이 쌓였다(5m × $3 = $15m). 2m개가 행사되면 (1) 행사가로 받은 현금 2m × $12 = $24m이 납입자본에 들어오고, (2) 해당 적립금 2m × $3 = $6m이 납입자본으로 옮겨진다. 합계 $30m 증가.", "trap": "현재 주가($18)가 아니라 행사가($12). 적립금 대체($6m)도 더한다.", "f": "ΔPaid-in capital = 행사 수 × 행사가 + 행사 수 × 부여일 공정가치", "why": {"A": "주식보상 적립금에서 옮겨오는 $6m을 빠뜨렸습니다.", "C": "행사가 대신 현재 주가 $18을 썼습니다."}, "orig": "Mock 2 Session 2 Q44", "conf": true}], "vignettes": ["Lucy Wang is a derivatives trader for a South African broker-dealer. All of her firm's trades are in South African rand (ZAR) and use a 30/360 day count convention.\nWang wants to hedge a floating-rate note held by her firm against a decline in interest rates. She uses data from Exhibit 1 to price a 3 × 12 forward rate agreement (FRA).\nExhibit 1\nMaturity\tSpot Market Reference Rate\tPresent Value Factor\n3-month\t3.67%\t0.9909\n6-month\t3.79%\t0.9814\n12-month\t4.15%\t0.9602\nWang analyzes a receive-fixed, pay-floating interest rate swap with a fixed rate of 7.38% with a 1-year remaining maturity. The notional amount of the swap is ZAR 10,000,000 which resets semiannually. She values the swap position using the current 1-year fixed rate of 4.10% and data from Exhibit 1.\nNext, Wang determines the no-arbitrage price of a bond forward contract. She uses information from Exhibit 2 and an annualized risk-free rate of 3.7%.\nExhibit 2\nQuoted bond price without accrued interest (% of par)\t105.0\nFuture value of coupon interest (% of par)\t4.51\nAccrued interest at contract initiation (% of par)\t3.00\nAccrued interest at contract expiration (% of par)\t0.75\nTime to forward contract expiration\t90 days\nConversion factor\t1.0\nWang then evaluates whether an arbitrage opportunity exists in 9-month forward contracts on the shares of Pintel Electronics. She is quoted a 9-month forward price of ZAR 816 by a dealer. Pintel shares currently trade at ZAR 850 and will pay a dividend of ZAR 34 in six months.", "Charlene Norberg is an analyst for a sell-side firm. She is building valuation models for several publicly traded firms.\nNorberg estimates the intrinsic value of Firm A's shares based on an FCFE model, using her forecasts in Exhibit 1. She expects long-term annual sales growth of 4% starting in Year 3, with consistent relationships between sales and net profit, changes in fixed capital, changes in working capital, and changes in debt. She estimates Firm A's cost of equity to be 9% and its WACC to be 8%.\nExhibit 1\n\tYear 1\tYear 2\tYear 3\nSales per share\t$90.00\t$90.00\t$93.60\nFCFE per share\t$6.20\t$9.00\t$7.85\nNorberg notes that, in the previous year, Firm A's FCFF was greater than its FCFE.\nNext, Norberg values another firm, Firm B, which has consistently been paying dividends. The firm has a large cash balance with a growing retained earnings balance. Norberg believes that Firm B is a takeover target because it offers synergies to one of its main competitors. If a takeover does occur, Norberg expects the new owner will likely change Firm B's dividend payout and will issue debt to maintain its capital expenditures. Norberg evaluates the potential takeover from the acquirer's perspective.", "Fred Lang, a risk manager at an investment firm, reviews one of the firm's latest model portfolios and estimates its annual 5% parametric VaR using the information in Exhibit 1. At a 5% significance level, the critical z-value for a one-sided test is 1.65 and the critical z-value for a two-sided test is 1.96.\nExhibit 1\nMonthly expected return\t1.25%\nMonthly standard deviation of returns\t4.47%\nPortfolio's assets under management\t$200 million\nLang presents his VaR estimate to the firm's CIO. After reviewing Lang's calculation of the annual 5% parametric VaR, the CIO requests that Lang provide her with an alternative risk measure that estimates the expected loss if losses exceed the VaR cutoff.\nThe CIO is concerned about the underperformance of some of the firm's managed accounts relative to their benchmark. She asks Lang for his recommendation on risk constraints to help reduce her concern.\nFinally, Lang prepares a presentation for an internal risk management training session. Part of this presentation focuses on the limitations of VaR.", "Ross Wyman is a portfolio manager for a family office. He plans to add commodities to his client's holdings and meets with Tina Becker, a commodity advisor.\nWyman and Becker discuss the current market prices for three commodities, summarized in Exhibit 1.\nExhibit 1\n\tCommodity 1\tCommodity 2\tCommodity 3\nSpot price\t$1,688\t$830\t$87.20\nNear-term futures price\t$1,688\t$835\t$85.90\nFarther-term futures price\t$1,707\t$835\t$84.60\nBecker provides additional information about Commodity 3. She notes that hedging demand by consumers currently exceeds hedging demand by producers and that the convenience yield exceeds direct storage costs.\nWyman takes a fully collateralized long futures position in Commodity 3 at a price of $84.60. Two months later, he rolls the entire position from the near-term futures contract into the farther-term futures contract. At that point, the near-term futures price is $85.50 and the farther-term futures price is $84.10. The collateral earned an annualized return of 1.2% during the two months.\nWyman also considers investing in a commodity index. His objective is to select the index that provides the largest contribution to performance based on the following two expectations:\ntrending commodity markets, where outperforming assets continue to go up in price and underperforming assets continue to drift lower;\nno changes in the shapes of forward curves, with some markets currently in backwardation and others in contango.", "Amanda Mond, a junior analyst, is valuing two consumer cyclical companies: Delong and Gruseb.\nDelong\nDelong is a growing company in a cyclical industry with volatile earnings. Mond summarizes Delong's book value per share (BVPS) and ROE for the most recent year in Exhibit 1. She compares these metrics to their respective averages over the most recent business cycle and over the long term. She then normalizes Delong's EPS using the average ROE method.\nExhibit 1\n\tMost Recent Year\tAverage Over Most Recent Business Cycle\tLong-Term Historical Average\nBVPS\tEUR 11.2\tEUR 10.5\tEUR 9.6\nROE\t15.0%\t16.0%\t17.5%\nMond next uses the following forecasted fundamentals to calculate Delong's justified trailing P/E.\nDividend payout ratio of 46%\nROE of 15%\nRequired rate of return of 10.8%\nMond wants to calculate an industry benchmark multiple for Delong based on the multiples of its competitors. She observes that the range of competitor multiples is bounded by zero on the downside but includes very large outliers. Mond uses a measure of central tendency that mitigates the impact of these very large outliers, but not the small outliers.\nGruseb\nGruseb is a manufacturer of small household appliances. Mond observes that there are significant differences in both the duration of growth and the expected earnings growth between Gruseb and its peers. She considers using the PEG ratio as an alternative valuation method to the P/E ratio to address these differences.", "Dora Kriser, a financial analyst, is currently evaluating the intercompany investments and earnings quality of Delphine Industries, a large diversified consumer products company that reports under IFRS.\nDelphine recently announced that it would be increasing its ownership interest in Company A from 35% to 50%. Delphine and Company A are both profitable. Kriser considers how Delphine's net profit margin might be affected after the increase in ownership under the following scenarios:\nScenario 1: Delphine exercises significant influence, but not control, over Company A.\nScenario 2: Delphine exercises control over Company A.\nKriser is concerned that recent industry changes may negatively affect one of Delphine's cash-generating units. She evaluates the following projections to determine the expected impairment loss under IFRS:\nCarrying value of cash-generating unit: €18,200,000\nRecoverable amount of cash-generating unit: €17,700,000\nGoodwill allocated to cash-generating unit: €300,000\nNext, Kriser analyzes Delphine's earnings quality. She begins by examining the cash component and accrual component of Delphine's recurring earnings. Based on this examination, she expects Delphine to continue to exhibit a high degree of earnings persistence.\nFinally, Kriser examines Delphine's statement of cash flows and observes that interest paid is classified as an operating activity and interest received is classified as an investing activity. She considers whether these cash flow classifications could affect comparisons with competitors that report under US GAAP.", "Marcia Garrett is a research analyst at IGMA Investments. IGMA is a large investment firm that claims compliance with the Standards.\nWhile preparing a report on industry trends, Garrett read an article that appeared in a leading business newspaper. Included in the article was a summary of a study conducted by a prominent trade association. Garrett did not obtain a copy of the study directly from the trade association, but did however include information from the article in her report. Garrett cites only the newspaper in her report.\nDuring the most recent quarter, Garrett prepared an analysis detailing her interest rate expectations over the next year and submitted it to IGMA's investment committee. Her research is to be included as part of a wider report by the firm regarding market expectations for the year ahead. Based on her analysis, Garrett's opinion is that interest rates will remain fairly stable. The committee disagrees with some of Garrett's assumptions and does not include her opinion in the wider report. The committee's final report issues a consensus expectation that interest rates will increase and includes detailed assumptions supporting that view. Despite the difference in opinions, Garrett acknowledges that the committee's conclusion has a reasonable basis. The final report is distributed to clients and includes Garrett's name, as well as other research analysts who contributed to the report as authors.\nGarrett is part of a working group asked to review IGMA's code of ethics and to suggest any necessary changes that are needed to ensure that it is consistent with the Standards. During one of the working group's discussions, Garrett states that the Standards recommend that the code of ethics include general fiduciary concepts as well as detailed compliance procedures.\nGarrett has accepted an offer to join a rival firm. While at IGMA, Garrett and a colleague developed a quantitative model that was used for industry and company analysis. Garrett considers if she can continue to use the model at her new firm.", "Marietjie Granger works for a South African equity fund manager specializing in ETFs. She is evaluating several potential ETF investments and the use of factor models in investment decision-making.\nGranger evaluates ETF Zulu and notices that its share price is currently trading at a higher than the usual premium to the NAV of its underlying equities. She considers how the authorized participants may take advantage of this pricing differential.\nGranger wants to make a 6-month tactical investment in ETF X-Ray. She determines the expected holding period cost using the following information:\nBid-ask spread: 0.15%\nOne-way commission: 0.10%\nAnnual management fee: 0.20%\nGranger also analyzes a portfolio of smart beta ETFs using the Carhart model. She calculates the equilibrium expected return on the portfolio using the factor sensitivities and returns in Exhibit 1. The risk free rate is 4.5%.\nExhibit 1\n\tFactor Sensitivity\tFactor Return\nMarket risk (RMRF)\t1.0\t2.5%\nCapitalization (SMB)\t–1.8\t–1.7%\nBook-to-market (HML)\t0.7\t2.1%\nMomentum (WML)\t0.2\t2.8%\nFinally, Granger evaluates the multifactor models used by two European equity ETFs to construct their portfolios. One of the ETFs uses a statistical factor model, while the other uses a macroeconomic factor model. She makes the following conclusions regarding the two models:\nConclusion 1: An advantage of statistical factor models is that they make minimal assumptions.\nConclusion 2: The interpretation of macroeconomic factors is more difficult than statistical factors.", "Jennifer Francis is a currency specialist helping clients manage their foreign exchange exposures. All currencies are quoted as the amount of the numerator currency per one unit of the denominator currency (e.g., USD/EUR is quoted as the amount of USD per 1 EUR).\nFrancis is working with a client looking to execute a trade in the Thai baht (THB) and Australian dollar (AUD) currency pair. Francis receives a bid–offer quote in THB/AUD (24.3065/24.3090) from a dealer and compares this to the interbank market quotes in THB/USD (33.3942/33.3965) and USD/AUD (0.7276/0.7279) to see if an arbitrage opportunity exists.\nStephan Podowski is a client of Francis' located in Country A, whose currency is the FXA. Podowski's company will receive a payment in Country B's currency (FXB) in 18 months, and he is considering using a forward contract to hedge the currency exposure. Francis uses the following information to determine the forward discount for a 540-day FXA/FXB forward contract:\nFXA/FXB spot exchange rate: 1.1423;\n540-day market reference rate (annualized, Actual/360) for Country A: 1.23%;\n540-day market reference rate (annualized, Actual/360) for Country B: 5.52%.\nNine months ago, Podowski bought EUR 20 million forward against the USD by entering into a 1-year forward contract at 1.1308 USD/EUR. He wants to calculate the mark-to-market value of this position today. The current USD/EUR spot rate is quoted at 1.1352/1.1355 and the 90-day forward points are –14/–12. The annualized 90-day market reference rate (Actual/360) is 0.53% for USD and 0.77% for EUR.\nFrancis is looking for potential carry trades to recommend to her clients. She focuses on a potential trade between the AUD and the South African rand (ZAR). She reviews what market conditions are required for the trade to be profitable.", "Liying Wang manages her firm's investment-grade bond portfolio. She considers purchasing a senior unsecured bond issued by AHM Manufacturing (the AHM01 bond) for the portfolio. This bond is rated BBB, has a 2-year maturity, and has a 5% annual coupon. Wang assumes a recovery rate of 40% and uses a government yield binomial interest rate model to estimate the fair value of the AHM01 bond. Selected information for the bond is presented in Exhibit 1. Given no default, the value of the AHM01 bond is 100.46.\nBased on her assumptions and the information in Exhibit 1, Wang purchases the AHM01 bond at a price equal to its fair value.\nExhibit 1\nYear\tExpected Exposure\tProbability of Default\tDiscount Factor\n1\t105.49\t2.25%\t0.9524\n2\t105.00\t2.20%\t0.9115\nWang’s junior analyst estimates that the recovery rate for the AHM01 bond will be 30%. Holding all else equal, Wang considers how this estimate would affect her valuation of the bond.\nWang purchases protection on the AHM01 bond using a single-name CDS. The counterparty for the transaction is XRM Bank. The CDS has a standard annual coupon of 100 basis points and the current market spread on AHM01 bonds is 150 basis points. The initial value of the CDS contract is set to zero.\nFinally, Wang makes the following observations regarding two other investment-grade bonds, Bond X and Bond Y, each of which has a 5-year maturity and is option-free:\nBond X trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.25%.\nBond Y trades at a credit risk premium of 2.50% over the reference rate; the risk premium implied by the CDS market is 2.75%.\nBelieving that the disparity in risk premiums is temporary, Wang considers a basis trade.", "Maya Keegan, CFA, is a private wealth manager at Stanz Investments, which has adopted the Standards as part of its ethics and compliance policy. Stanz does not claim compliance with the GIPS standards.\nKeegan is invited to join the leadership team of her local CFA society as treasurer. Her responsibilities will include monitoring the asset allocation of the society's reserve funds. Keegan will receive annual compensation for the position as treasurer. Separately, she is asked to join the board of Kino Empire, a small publicly traded movie theater chain founded by a family friend. Many of Keegan's client accounts invest in Kino Empire's shares. Keegan has opted to receive no monetary compensation if she accepts this board position, although she will receive free movie tickets for her personal use at all Kino Empire theaters.\nAt a local CFA society event, Keegan meets a CFA candidate who just took the Level II exam. During the conversation with Keegan, the candidate comments that her employer expects her to complete the CFA Program even though she is convinced that it is not relevant for her current position as a trader. To support her claim, the candidate cites a question on the recent Level II exam that tested how different accounting methods affect company balance sheets.\nIn the performance presentation section of her firm's marketing materials, Keegan provides details of an investment model recently developed by a Stanz analyst. She first notes that the model's performance is based on results from a simulated backtest. She then shows a comparison of this simulated performance with the actual past performance of a weighted composite of similar accounts she currently manages. Keegan ensures that all closed accounts are excluded when determining the performance of this composite.\nKeegan supervises an assistant wealth manager who has a good track record of managing client accounts. However, the assistant wealth manager has accumulated significant personal credit card debt due to his poor personal spending habits. He also regularly participates in legal poker games with friends. He would like to set up a plan to reduce his debt and is seeking personal financial advice from Keegan.", "Bella Stone is an analyst covering Garnet Corp. To forecast the price of Garnet shares, she starts by examining related economic data and estimates a log-linear trend in the economic variable most relevant to her analysis. Stone evaluates whether the log-linear trend model suffers from serially correlated errors. The Durbin–Watson test statistic from the regression is 0.54 and the lower critical value for the Durbin–Watson statistic is dl = 1.25.\nStone predicts Garnet's EPS using quarterly data in a first-order autoregressive model, AR(1). She tests for and rejects the presence of a unit root. The model estimation is presented in Exhibit 1. In the most recent quarter, EPS was $0.96. The critical t-statistic is 2.04.\nExhibit 1\nRegression Statistics\t\nR^2\t0.2059\nStandard error\t0.0856\nObservations\t32\nDurbin–Watson statistic\t1.56\n\tCoefficient\tStandard Error\tt-Statistic\nIntercept\t0.4485\t0.1457\t3.08\nEPSt–1\t0.4541\t0.1572\t2.89\nAutocorrelations of the Residual\t\t\t\nLag\tAutocorrelation\tStandard Error\tt-Statistic\n1\t–0.0572\t0.1768\t–0.32\n2\t0.0705\t0.1768\t0.40\n3\t0.0855\t0.1768\t0.48\n4\t0.1908\t0.1768\t1.08\nStone also incorporates machine learning into her modelling. She gathers transaction-level data for a set of Garnet bonds and provides an excerpt of the dataset in Exhibit 2. Stone prepares to wrangle the extracted raw data.\nExhibit 2\nTransaction Number\tPrice\tType\tConvertible\n1\t100\tBuy\tYes\n2\t105\tSell\tN\n3\t95\tTrade\ty\n4\t101\tSell\tno\n5\t98\tBuy\tNo\nStone evaluates if the model can properly classify the \"Type\" feature into \"buy\" or \"sell,\" and examines the model training performance for validation of the model. She compiles the confusion matrix in Exhibit 3.\nExhibit 3\n\t\tActual Training Labels\t\nBuy (Class \"1\")\tSell (Class \"0\")\nPredicted Results\tBuy (Class \"1\")\t70\t40\nSell (Class \"0\")\t20\t70", "Vilem Polti, a fixed-income analyst, is evaluating three default-free bonds in Country A. The bonds each have a par value of $100, a 2-year maturity, and pay an annual coupon of 4.2%.\nBond 1: Option-free\nBond 2: Callable at par at the end of year 1\nBond 3: Putable at par at the end of year 1\nPolti estimates the binomial interest rate tree in Exhibit 1, assuming interest rate volatility of 15% and that branching from each node to an up state and to a down state occurs with equal probability. She uses the binomial interest rate tree to value Bond 2.\n[IMAGE: CFA-IS-2022.11-FIIN-Lamy+1_5010P1786416.png]\nPolti believes that recent economic events in Country A could lead to changes in the interest rates over the maturity of these bonds. As a result, she assesses the impact of the following interest rate scenarios on the estimated value of Bonds 1, 2, and 3.\nScenario 1: Interest rate volatility is lower\nScenario 2: Long-term rates fall more than short-term rates, resulting in a flat yield curve\nPolti is also evaluating a convertible bond issued by ZXEL Corporation. The convertible bond was initially sold at par ($1,000). The convertible bond pays a 3.00% annual fixed-rate coupon, has a conversion ratio of 23, and the price of ZXEL Corp. common stock is currently $47 per share. The underlying straight-bond value of the convertible bond is $990.", "Minah Lee, CFA, recently joined Caldecott Asset Management as a portfolio manager. Lee resides in a country where the securities laws and regulations are stricter than the Code and Standards. Caldecott is based in a neighboring country with securities laws and regulations that are less strict than the Code and Standards. All of Caldecott's clients are based in the firm's home country. In both countries, applicable law states that the law of the locality where business is conducted governs.\nCaldecott hires a consultant to establish an ESG screening process for stock selection. Lee prepares an investment memo recommending the new screening process to Caldecott's clients. It includes a description that states \"we will include the consultant's proprietary ESG factors when filtering out unsuitable stocks.\" The memo also discusses significant risks of the process, including that \"the ESG screening process is subjective and may contradict conclusions from other ESG selection processes.\" The memo ends by stating that \"this process will reduce the risk of portfolios suffering from unanticipated climate risk and will guarantee superior returns.\"\nLee receives automated sell recommendations from Caldecott's portfolio allocation software to ensure all client portfolios match the recommendations from the ESG screen. After securing approval from selected clients with IPS that are suitable to adopt the new ESG screen, Lee begins executing sell trades in these client accounts. Lee decides not to keep records for the sell trades since Caldecott's software has automated the ESG screen recommendations. Lee then reinvests the cash generated by the sell trades to maintain the same level of equity market exposure. She manually selects stocks to buy for the accounts and prepares notes justifying these buy trades. Lee retains trade records for five years as part of the firm's regulatory compliance.\nLee joins the board of trustees at the local university. The position is unpaid but is likely to be time consuming in the first year. She also starts a position as an adjunct professor at the university. The compensation from the university includes government-mandated defined contributions to a retirement plan. Lee decides to allocate the retirement plan assets to a large diversified mutual fund managed by Caldecott's competitor. Lee obtained written approval from Caldecott for her compensation as an adjunct professor but did not disclose her board position and how the retirement plan assets are invested.", "Jessica Gunning is an analyst reviewing US-based GameDay Inc.'s cost of capital and corporate restructuring actions.\nFor GameDay's cost of capital, Gunning begins by determining GameDay's cost of equity and uses a macroeconomic model to estimate the equity risk premium (ERP). She forecasts the data shown in Exhibit 1 and applies the Grinold-Kroner model.\nExhibit 1\nRisk-free rate\t3.0%\nInflation\t1.3%\nGrowth rate in P/E ratio\t0.0%\nS&P 500 dividend yield\t1.8%\nPercent change in shares outstanding\t–0.2%\nReal GDP growth\t2.6%\nNext, Gunning estimates GameDay's current cost of debt. GameDay has a single outstanding bond issue – a straight unsecured bond with a remaining maturity of four-years. The issue is thinly traded and there is no reliable market-based YTM available. Gunning uses matrix pricing to estimate the bond's yield. She notes that the average YTM on similarly rated bonds at more liquid two- and five-year maturities are 5.57% and 6.14%, respectively.\nTo improve sales in a new product segment, GameDay recently acquired StopGap Inc. for $33.80 per share. Gunning assesses whether the acquisition was fairly priced using the comparable transactions method and the information in Exhibit 2. When calculating a weighted average estimated price, she assigns a weight of 50% to the price-to-sales (P/S) multiple, and a 25% weight to each of the other two multiples. She considers the acquisition to be fairly priced if the price paid is within $1 of her estimate on a per share basis.\nExhibit 2\nComparable Transactions Information\t\nP/E ratio\t16.2\nP/B ratio\t2.9\nP/S ratio\t2.1\nStopGap Inc. Information\t\nEPS\t$2.20\nBook value per share\t$8.40\nSales per share\t$17.90\nSeveral months pass and GameDay announces that a rival firm has offered $1.6 billion to acquire its Southern product segment. Southern has produced EBITDA of $140 million in the most recent year and Gunning estimates that a spinoff of Southern would achieve an EV/EBITDA multiple of 14. She evaluates which is the better choice: accept the divestment offer or begin the spinoff process of the segment.", "Stephen Russo is a treasury analyst at Central Finance Inc., which specializes in financing equipment and real estate. Russo and his manager, Ericka Patry, meet to discuss anticipated changes to interest rates and the potential impact on Central Finance's portfolio.\nPatry and Russo discuss the differences between Treasury rates and swap rates for the same maturity. Russo makes the following two comments.\nComment 1: Differences between the two rates arise because of differences in default risk and liquidity risk\nComment 2: Given the opportunity for arbitrage, differences between the two rates are minimal\nIn Exhibit 1, Patry presents current government bond spot rates and swap rates for annual maturities up to three years.\nExhibit 1\n\t1-year\t2-year\t3-year\nSwap rates\t2.97%\t3.26%\t3.43%\nTreasury spot rates\t2.88%\t3.10%\t3.21%\nUsing the government rates, Russo determines the forward rate for a 1-year zero coupon bond issued one year from today.\nPatry and Russo next discuss the term structure of interest rates. Russo accepts the theory that yields are solely a function of the supply and demand for funds at a particular maturity.\nCentral Finance manages yield curve risk using key rate durations and reviews portfolio exposures when there is a 25 basis point change in the yield curve. For one of the firm's real estate portfolios, Patry shares with Russo the key rate durations and expected change in yield curve at various maturities in Exhibit 2.\nExhibit 2\nMaturity\tKey Rate Duration\tChange in Yield Curve (bps)\n1 year\t0.4444\t18\n5 years\t0.5129\t35\n10 years\t1.1030\t57", "Joao Viniciu is an equity analyst researching Pedra S.A., a Brazilian multinational corporation. Pedra reports under IFRS with a fiscal year end of 31 December. Its reporting currency is the Brazilian Real (BRL).\nViniciu analyzes the sustainability of net sales growth for each of Pedra’s geographic segments. Exhibit 1 shows the components of total net sales growth for each of these segments.\nExhibit 1\nGeographic Segment\tContribution from Volume Growth\tContribution from Price Growth\tContribution from Foreign Currency Exchange\tTotal Net Sales Growth\nEurope\t4.6%\t1.9%\t1.4%\t7.9%\nAmericas\t0.7%\t1.1%\t4.3%\t6.1%\nAsia Pacific\t3.6%\t2.1%\t1.8%\t7.5%\nFor his research, Viniciu uses the BRL/USD (number of BRL per 1 USD) exchange rate information for the most recent year as shown in Exhibit 2.\nExhibit 2\n\tBRL/USD\n1 January\t5.07\n1 November\t5.53\n31 December\t5.45\nAverage for the year\t5.26\nOn 1 November of the most recent year, Pedra purchased imported goods worth USD 3.2 million on credit from an unaffiliated US supplier. The amount payable for these imported goods by Pedra was still outstanding as of 31 December.\nCarro Corp. is one of Pedra’s wholly-owned US-based subsidiaries. Pedra translates Carro’s financial statements using the current rate method based on the rates in Exhibit 2. Carro's only non-monetary assets are inventory and fixed assets, while all of its liabilities are monetary. Carro's inventory and fixed assets were purchased at a BRL/USD rate of 5.24. Viniciu analyzes the effect of the translation method on Carro’s debt-to-assets ratio for the most recent year.\nOver the current year, Viniciu expects that Carro will maintain a stable net asset balance sheet exposure and that the BRL will weaken against the USD.", "Ryan Tan is the chief investment officer of an endowment portfolio. The portfolio has 20% of its assets invested in two hedged funds, with an equal proportion invested in each fund. The investment strategies used by the two hedge funds are as follows.\nFund 1 uses equity market-neutral strategies\nFund 2 applies an event-driven strategy focusing on distressed securities\nThe endowment is considering investing in just one hedge fund. Tan performs a scenario analysis to better understand relative performance if the entire 20% allocation is invested in one fund. For this analysis, Tan considers a third hedge fund for possible investment. Tan's objective is to select the fund that would maximize the endowment portfolio's risk-adjusted return, where risk is defined as downside deviation. Exhibit 1 shows the risk-return characteristics of the overall portfolio with a 20% allocation to either Fund 1, Fund 2, or Fund 3.\nExhibit 1\n\tStandard Deviation\tSharpe Ratio\tSortino Ratio\nAllocation to Fund 1\t8.2%\t0.81\t1.5\nAllocation to Fund 2\t8.3%\t0.82\t1.3\nAllocation to Fund 3\t7.9%\t0.80\t1.4\nFinally, Tan evaluates whether it would be better to reallocate the endowment's 20% hedge funds investment to Fund 4, a fund-of-funds. This allocation would give the endowment portfolio exposure to multiple distinct hedge fund strategies.", "Judy West is a trader who is training a new hire, Alex Carter, on the application of option pricing models.\nWest and Carter first discuss how to estimate the value of a European-style call option using a two-period binomial model on a non-dividend paying stock. The inputs are:\ncurrent stock price (S) is $100\nexercise price (X) is $100\nup factor (u) is 1.4, down factor (d) is 0.7\nrisk-free rate is 3%\nWest then reviews the Black-Scholes-Merton (BSM) model and presents information in Exhibit 1. She explains this information can be used to structure a delta hedge for option positions. West presents an example of delta hedging a short call position on 5,000 shares of an underlying stock. She asks Carter to determine the optimal number of shares of stock to buy to hedge the short call position.\nExhibit 1\nN(d1)\tN(d2)\tN(–d1)\tN(–d2)\n0.589\t0.505\t0.411\t0.495\nWest next sets up a gamma hedging exercise. She shows Carter how to predict the change in call price for a given change in the underlying stock price for the three calls in Exhibit 2. All three calls have the same time to expiration. West explains how including gamma improves the accuracy of the prediction.\nExhibit 2\nCurrent stock price\t$100\nCall 1 strike price\t$90\nCall 2 strike price\t$100\nCall 3 strike price\t$110\nFinally, West presents volatility data and her forecast in Exhibit 3 for three put options on different securities. She discusses how to use this data to benefit if her forecast on volatility is correct.\nExhibit 3\nVolatility\tPut A\tPut B\tPut C\nHistorical\t15%\t17%\t23%\nImplied\t19%\t16%\t18%\nForecast\t17%\t22%\t16%", "Mary Navarro, a portfolio manager, is analyzing the effect of current macroeconomic factors on various asset classes and is researching actively managed funds.\nNavarro first evaluates the effect of macroeconomic factors on the P/E ratio and the performance of equities. She considers the following three scenarios over the next 10 years:\nScenario 1: Real GDP growth volatility and inflation expectations both increase.\nScenario 2: There is declining uncertainty about future inflation.\nScenario 3: Expected real earnings growth and the equity risk premium both increase.\nNavarro next reviews the performance of an active portfolio that does not have any short-selling restrictions. Exhibit 1 summarizes the returns, allocations, and performance statistics for the active portfolio and the benchmark. Using this information, Navarro evaluates the sources of value added.\nExhibit 1\n\tPortfolio\t\tBenchmark\t\nReturn\tAllocation\tReturn\tAllocation\nEquities\t10%\t70%\t8%\t60%\nFixed income\t4%\t30%\t5%\t40%\nActive return\t1.40%\t\t---\t\nActive risk\t10.00%\t\t---\t\nStandard deviation\t21%\t\t17%\t\nSharpe ratio\t0.29\t\t0.28\t\nNavarro believes that the realized performance statistics in Exhibit 1 are reasonable estimates for the future. She determines that the optimal level of active risk is 8.50% and investigates whether the Sharpe ratio of the active portfolio can be improved by combining investments in this portfolio and the benchmark.\nSeveral months later, Navarro reviews three recent developments regarding the active portfolio in Exhibit 1. Using the expanded fundamental law of active management, Navarro evaluates the effect of the following events on the information ratio of the active portfolio.\nEvent 1: The portfolio rebalancing frequency has been changed from semiannual to quarterly.\nEvent 2: The portfolio manager has added two analysts with strong forecasting ability.\nEvent 3: Short-selling restrictions have been added to the portfolio's IPS.", "Malte Kaufmann is an equity analyst initiating coverage on several listed stocks.\nFirst, Kaufmann determines the sustainable growth rates for Company A and Company B using the PRAT model. Company A and Company B have identical total asset turnover ratios, but Company A has a higher payout ratio, higher profit margin, and higher equity multiplier. Based on the PRAT model, Kaufmann concludes that Company A has a lower sustainable growth rate than Company B.\nKaufmann uses the two-stage DDM to value Company B's shares, which are currently trading at EUR 42.37. He forecasts that the current dividend (D0) of EUR 1.40 will grow by 12% per year for the next two years. Thereafter, Kaufmann assumes that the growth rate will decline to 6% and remain at that level indefinitely. He estimates the required return on equity to be 10%. Kaufmann considers a share to be fairly valued if its price is within +/–5% of the estimated model value.\nNext, Kaufmann considers three companies to add to his list of covered firms. Based on the historical data in Exhibit 1, which covers the 5-year period up to the most recent year (Year 0), Kaufmann assesses which of the three companies is most suitable for valuation using the Gordon growth model.\nExhibit 1\n\tCompany C\t\tCompany D\t\tCompany E\t\nYear\tPayout Ratio\tDividend (USD)\tPayout Ratio\tDividend (USD)\tPayout Ratio\tDividend (USD)\n–4\t0.92\t5.25\t0.38\t12.00\t0.62\t3.22\n–3\t0.32\t5.51\t0.42\t12.61\t0.63\t3.18\n–2\t1.09\t5.84\t0.40\t13.29\t0.70\t3.20\n–1\t0.13\t6.16\t0.39\t13.88\t0.80\t3.23\n0\t0.61\t6.44\t0.40\t14.59\t0.83\t3.18\nFinally, Kaufmann calculates residual income for Company C in the current year. He uses the following information for Company C:\nTotal assets of EUR 10 million, financed with 40% equity and 60% debt\nNet operating profit after taxes of EUR 900,000\nTax rate of 25%\nCost of equity of 10%\nBefore-tax cost of debt of 6%\nInterest is tax deductible", "Darren Carter is a credit analyst reviewing Gowran Bank. The bank is subject to the Basel III regulatory framework and prepares its financial statements under IFRS.\nCarter first considers Gowran's capital adequacy. For the most recent year end, Gowran reported Common Equity Tier 1 Capital of $15 billion and risk-weighted assets of $100 billion. Carter determines Gowran's pro forma year-end Common Equity Tier 1 Capital ratio to account for the following two events, which occurred after the most recent year end.\nGowran issued $1 billion of Additional Tier 1 Capital.\nThe regulator required Gowran to recognize an additional $3.5 billion of operational risk-weighted assets.\nCarter next assesses Gowran's asset quality by analyzing the adequacy of its allowance for loan losses. Specifically, he examines how the ratio of the bank's allowance for loan losses to non-performing loans changed during the most recent year based on the data (in millions) in Exhibit 1.\nExhibit 1\nNon-performing loans at start of year\t$2,000\nNon-performing loans at end of year\t$2,400\nAllowance for loan losses at start of year\t$1,500\nProvision for loan losses during the year\t$500\nCharge-offs, net of recoveries, during the year\t$200\nGowran has a defined benefit pension plan (Plan A) that is closed to new members. Carter determines the effect of this pension plan on Gowran's income statement.\nAs part of its executive management compensation, Gowran also has a stock option plan (Plan B). Three years ago, Gowran granted executives 5 million at-the-money stock options with a three-year vesting period. On the grant date, Gowran's share price was $12 and the fair value of each option was $3. All of the options are now vested in the current year. Carter determines the effect on Gowran's paid-in capital on its balance sheet in the current year, assuming that 2 million of the stock options are exercised at the strike price of $12 and Gowran's share price is currently $18."], "modules": {"QM": "Quantitative Methods", "ECO": "Economics", "CI": "Corporate Issuers", "FSA": "Financial Statement Analysis", "EQ": "Equity Valuation", "FI": "Fixed Income", "DER": "Derivatives", "AI": "Alternative Investments", "PM": "Portfolio Management", "ETH": "Ethical and Professional Standards"}, "images": {"CFA-IS-2022.11-FIIN-Lamy+1_5010P1786416.png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfkAAAEkCAYAAAAsFkgVAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAfntJREFUeJzs3WmwrWdZJ/zV3Y4g86iIhEEEGUWQAIEwBEiYAgmz0igqtvqhy+oPfrCqu8ovdpVV3VXd1YOiTTOLEMYkQCCQQBjCHCZlBsM8hnnQ7vd9f7fvf3vl9ln77H3O2efsvfb1r1q11nqG+7mf6f5f8/0j/8//h1Wj0Wg0Go2Nw4+c7A40Go1Go9HYGzTJNxqNRqOxoWiSbzQajUZjQ9Ek32g0Go3GhqJJvtFoNBqNDUWTfKPRaDQaG4om+UbjBOH//t//O77/5b/8l1v/ZbD+i3/xL7a2qeuy/kd+5Oqv6f/5P/9nbLfUTj7Z3zbWpZ30wTbJns3xl9qt67N91s99yrb55Lh1OfzDP/zD+P5X/+pf/bP263nsFjmW73ouc/+Ppu1G46CiSb7ROEGoJLS0rhLvvM/S9rW9KixkeUh+3qdul2PORLuT88jvHGOpD/Wcls5tSQjI8iVh4kjIvs597kujcRjRJN9onGCEDKuWPWuvftN0o+3OiPZufd2/kluW5TgzZm1+7kMlYcdJO9HwKxlXol/X5qxh+/39739//GZl8Knt75bk077vH/uxH7vatc11ORrBodE4yGiSbzROEBBMNaPvBCGqmMN/9Ed/9GrEnnbr9pXk//7v//5qJLzUfm2nEmOIOAQZocAyhFxJvwoH252fvtdr8BM/8RNX2y/CzW4wCw9VyNCma+C6Wc5VMLs/Go1NRj/tjcYeY9bWl3zxlZjrfvP6ud2Q2rz/TrXWeb9q7q7CwRw3sETqRzqHrMs1qG3NroTdwn6Ivgojtb87cUM0GpuIJvlG4wSgarfrSG2dqdxy2ufs3w7JrxMAqlacbUOuS8erfQth2md2CdTtl8izChez+6AeP1p17eORBJsl5DwT0JcAw/TX/yoANBqHCU3yjcYeo2rGsy8elogHYcW/jMBC8sGSlh4zeAiu7rOksa8jPW3zaWsnboKYw/XFPvo3uwGWAvvmwLwf/vCHw3QeP/y8P9P6drEI20G7+ukY1QURF0ejcRjRJN9o7DGiae7E/L6koa/Tmmc3QI5TibP65LfzlVfNd/6/ZOZO/3LMOWVu6dy0iXD1KUJIjTdI349F4w6pQywHSL+23WgcJjTJNxp7jO9973urv/u7v1t9+9vf3iJdqAFuNWLd7xvf+MarG97whquf+qmf2hUxhSAR21VXXTWOq71rX/vaq5vf/OYj0K2ax5dM9vr76U9/ekS+W2/fn/7pnx77feMb3xjrfvCDH6yuda1rrW50oxuND1RTfNrKuaY/n/3sZ1ff/e53V9e97nVXP/dzP7f6yZ/8ya1+2+frX//6+K+fzn0nqMIFgeFb3/rW6pOf/OToz3Wuc51xnDl2odE4LGiSbzT2GF/96ldX559//urKK69cf
